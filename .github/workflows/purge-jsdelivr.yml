name: Purge jsDelivr on push

# Gallery app payloads (apps-src/*.html and *.myllmapp) are served via
# cdn.jsdelivr.net so installs are counted by jsDelivr's public stats API
# (feeds the install-analytics dashboard). jsDelivr edge-caches branch files for
# ~7 days, so after we push an app update the CDN keeps serving the STALE version
# until it's purged. This job fires on every push to main and purges exactly the
# app files that changed — no manual step, works from any machine or a web edit.
#
# apps.json itself is served from raw.githubusercontent.com (always fresh), so it
# is deliberately NOT purged here.
on:
  push:
    branches: [main]
    paths:
      - 'apps-src/**'

permissions:
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so we can diff the pushed commit range

      - name: Purge changed app files from jsDelivr
        env:
          REPO: TeamDzX/myllm-assets
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail

          # A brand-new branch reports an all-zero BEFORE; fall back to AFTER's
          # parent so the diff still makes sense.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            RANGE="${AFTER}^..${AFTER}"
          else
            RANGE="${BEFORE}..${AFTER}"
          fi
          echo "Diffing range: $RANGE"

          # Purge each changed app file. Added/Copied/Modified/Renamed only
          # (deletions have nothing to purge); NUL-delimited via a while-read loop
          # so it survives odd filenames and needs no bash-4 `mapfile`.
          count=0
          fail=0
          while IFS= read -r -d '' f; do
            [ -z "$f" ] && continue
            count=$((count + 1))
            url="https://purge.jsdelivr.net/gh/${REPO}@main/${f}"
            echo "Purging: $f"
            code=$(curl -sS -o /tmp/purge.json -w '%{http_code}' "$url" || echo "000")
            status=$(tr -d '\n' < /tmp/purge.json | grep -oE '"status":[[:space:]]*"[^"]*"' | head -1 || true)
            echo "  HTTP $code  ${status:-<no status>}"
            if [ "$code" != "200" ]; then fail=1; fi
          done < <(git diff --name-only -z --diff-filter=ACMR "$RANGE" -- apps-src)

          if [ "$count" -eq 0 ]; then
            echo "No apps-src files changed — nothing to purge."
            exit 0
          fi

          # A failed purge only means the CDN serves stale a bit longer, so don't
          # break the build — but surface it so it's visible in the Actions log.
          if [ "$fail" -ne 0 ]; then
            echo "::warning::One or more jsDelivr purges did not return HTTP 200."
          fi
          echo "Purge pass complete ($count file(s))."
