.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,8,22,.1),rgba(12,8,22,.55) 55%,rgba(12,8,22,.92))}
.hero-inner{position:relative;padding:20px;color:#fff}
.hero h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0;text-shadow:0 2px 20px rgba(0,0,0,.75)}
.hero p{margin:4px 0 0;font-size:13.5px;opacity:.95;font-weight:500;text-shadow:0 1px 12px rgba(0,0,0,.75)}

/* recorder */
.recorder{display:flex;flex-direction:column;align-items:center;padding:10px 0 6px}
.wave{display:flex;gap:3px;align-items:center;justify-content:center;height:34px;margin-bottom:12px;opacity:0;transition:opacity .3s}
.recorder.live .wave{opacity:1}
.wave i{width:3px;height:34px;border-radius:2px;background:linear-gradient(var(--acc),var(--acc2));
  transform:scaleY(.14);transform-origin:center;transition:transform .07s linear}
.rec{width:82px;height:82px;border-radius:50%;background:var(--surface);border:1px solid var(--border);
  box-shadow:var(--shadowLg);display:grid;place-items:center;cursor:pointer;transition:transform .1s}
.rec:active{transform:scale(.95)}
.rec .glyph{width:34px;height:34px;border-radius:50%;background:var(--rec);transition:all .25s}
.rec.on{animation:pulse 1.5s infinite}
.rec.on .glyph{width:26px;height:26px;border-radius:7px}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,69,58,.4),var(--shadowLg)}70%{box-shadow:0 0 0 18px rgba(255,69,58,0),var(--shadowLg)}100%{box-shadow:0 0 0 0 rgba(255,69,58,0),var(--shadowLg)}}
.timer{font-size:30px;font-variant-numeric:tabular-nums;font-weight:300;margin-top:12px;min-height:34px;letter-spacing:.02em}
#status{font-size:13px;color:var(--muted);min-height:18px;text-align:center;line-height:1.5;margin:2px auto 4px;max-width:320px}
#status b{color:var(--ink)} #status .link{color:var(--acc);font-weight:600}

/* memos */
.section{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:18px 2px 10px}
.memo{background:var(--surface);border:1px solid var(--border);border-radius:15px;padding:10px 12px;margin-bottom:9px;
  box-shadow:var(--shadow);transition:border-color .2s}
.memo.playing{border-color:var(--acc)}
.mrow{display:flex;align-items:center;gap:12px}
.play{border:0;width:44px;height:44px;border-radius:50%;flex:0 0 auto;cursor:pointer;color:#fff;font-size:15px;
  display:grid;place-items:center;background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 6px 16px -8px var(--acc)}
.play:active{transform:scale(.94)}
.mi{flex:1;min-width:0}
.mi .nm{font-size:15px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi .dt{font-size:12.5px;color:var(--muted);margin-top:1px;display:flex;align-items:center;gap:6px}
.mi .dt b{color:var(--acc);font-weight:700}
.iconbtn{border:0;background:var(--surface2);color:var(--muted);width:38px;height:38px;border-radius:11px;flex:0 0 auto;
  cursor:pointer;display:grid;place-items:center}
.iconbtn svg{width:18px;height:18px}
.iconbtn.send:active{background:var(--accSoft);color:var(--acc)}
.iconbtn.del{color:var(--faint)} .iconbtn.del.armed{background:rgba(255,69,58,.14);color:var(--rec);width:auto;padding:0 12px;font-size:13px;font-weight:700}
.iconbtn.del:active{color:var(--rec)}

/* expandable memo body: rename / trim / transcript */
.mbody{display:none;border-top:1px solid var(--border);margin-top:10px;padding:10px 2px 2px}
.memo.open .mbody{display:block}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:0;background:var(--surface2);color:var(--ink);font:inherit;font-size:13px;font-weight:650;
  padding:8px 13px;border-radius:11px;cursor:pointer;display:flex;align-items:center;gap:6px}
.chip:active{background:var(--accSoft);color:var(--acc)}
.chip[disabled]{opacity:.55}
.ren{display:flex;gap:8px}
.ren input{flex:1;min-width:0;font:inherit;font-size:15px;padding:9px 11px;border-radius:11px;
  border:1px solid var(--border);background:var(--surface2);color:var(--ink)}
.ren button{border:0;background:var(--acc);color:#fff;font:inherit;font-size:13.5px;font-weight:700;
  padding:0 15px;border-radius:11px;cursor:pointer}
.tx{background:var(--surface2);border-radius:11px;padding:10px 12px;margin-top:10px;font-size:13.5px;
  line-height:1.55;max-height:190px;overflow:auto;white-space:pre-wrap;-webkit-overflow-scrolling:touch}
.txrow{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.txrow .lbl{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}

/* trim sheet */
.sheetWrap{position:fixed;inset:0;background:rgba(10,8,18,.55);display:none;z-index:50;align-items:flex-end}
.sheetWrap.show{display:flex}
.sheet{background:var(--surface);width:100%;border-radius:22px 22px 0 0;box-shadow:var(--shadowLg);
  padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:768px){.sheetWrap{align-items:center;justify-content:center;padding:20px}
  .sheet{max-width:560px;border-radius:22px}}
.shtop{display:flex;align-items:center;gap:10px}
.shtop .ttl{font-size:16px;font-weight:750;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shx{border:0;background:var(--surface2);color:var(--muted);font:inherit;font-size:13px;font-weight:700;
  padding:8px 14px;border-radius:11px;cursor:pointer;flex:0 0 auto}
.waveBox{position:relative;height:88px;margin:16px 0 8px;background:var(--surface2);border-radius:12px;
  overflow:hidden;touch-action:none}
.waveBox canvas{position:absolute;inset:0}
.dim{position:absolute;top:0;bottom:0;background:rgba(10,8,18,.42);pointer-events:none}
#dimL{left:0}#dimR{right:0}
#ph{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--ink);
  box-shadow:0 0 5px var(--ink);display:none;pointer-events:none}
.handle{position:absolute;top:0;bottom:0;width:30px;margin-left:-15px;cursor:ew-resize;touch-action:none}
.handle::after{content:"";position:absolute;left:50%;top:5px;bottom:5px;width:4px;margin-left:-2px;
  border-radius:2px;background:var(--acc2);box-shadow:0 0 0 1.5px var(--surface)}
.tlabels{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);
  font-variant-numeric:tabular-nums}
.tlabels b{color:var(--acc);font-weight:700}
#trimMsg{font-size:13px;color:var(--muted);min-height:18px;margin-top:10px;text-align:center}
.tprog{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden;display:none;margin-top:6px}
.tprog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.tbtns{display:flex;gap:10px;margin-top:14px}
.tbtns button{flex:1;border:0;font:inherit;font-size:14.5px;font-weight:700;padding:13px 0;border-radius:13px;cursor:pointer}
#trimPrev{background:var(--surface2);color:var(--ink)}
#trimGo{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;box-shadow:0 6px 16px -8px var(--acc)}
.tbtns button[disabled]{opacity:.5}

.use{font-size:11.5px;color:var(--faint);text-align:right;margin-top:8px}
.empty{display:none;text-align:center;padding:26px 20px 6px;color:var(--muted)}
.empty-emoji{font-size:42px}
.empty h3{margin:12px 0 5px;font-size:17px;color:var(--ink);font-weight:700}
.empty p{margin:0 auto;font-size:13.5px;line-height:1.5;max-width:270px}

<div class="hero"><div class="hero-inner"><h1>Voice Memos</h1><p>Record a thought — keep it, or send it to anyone.</p></div></div>

<div id="list"></div>
<div class="use" id="use"></div>
<div class="empty" id="empty">
  <div class="empty-emoji">🎙️</div>
  <h3>No memos yet</h3>

</div>

  </div>
</div>

<audio id="player"></audio>

/* ---- transcription (myllmTranscribeFile — needs latest MyLLM) ---- */

  }

function drawWave(){
  if(!tr||!tr.buf)return;
  var c=el('waveCv'),box=el('waveBox');
  var W=box.clientWidth||300,H=box.clientHeight||88,dpr=window.devicePixelRatio||1;

  g.fillStyle=grad;

/* playhead over the waveform (preview + save) */

  if(!tr||!tr.buf||tr.saving)return;

    setTimeout(function(){
      if(tr&&tr.saving===sv&&mr.state!=='inactive')try{mr.stop()}catch(e){}
    },200);
  };

}
function tickTrimSave(){
  if(!tr||!tr.saving)return;
  var sv=tr.saving;

  el('tbar').style.width=(f*100)+'%';

/* trim handle dragging + backdrop dismiss */
(function(){
  var drag=null;
  function move(ev){
    if(!drag||!tr||!tr.buf||tr.saving)return;
    var r=el('waveBox').getBoundingClientRect();if(!r.width)return;
    var t=Math.max(0,Math.min(1,(ev.clientX-r.left)/r.width))*tr.buf.duration;
    var MIN=.3;

  }

  ['hS','hE'].forEach(function(id){
    el(id).addEventListener('pointerdown',function(ev){
      drag=(id==='hS')?'s':'e';ev.preventDefault();
      try{ev.target.setPointerCapture(ev.pointerId)}catch(e){}
    });
  });

})();
function persist(){return store.setItem('memos',JSON.stringify(memos))}

var SHARE_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M8.5 7.5L12 4l3.5 3.5"/><path d="M5 12v6.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V12"/></svg>';

  if(TXOK){
    var busy=(txBusy===m.id);
    var t=chipBtn(c,busy?'⏳ Transcribing…':(m.txt?'💬 Re-transcribe':'💬 Transcribe'),function(){transcribe(m.id)});
    if(txBusy)t.disabled=true;
  }
  b.appendChild(c);
  if(!TXOK){
    var no=document.createElement('div');no.style.cssText='font-size:12px;color:var(--faint);margin-top:9px';
    no.textContent='Transcribing memos to text needs the latest MyLLM.';
    b.appendChild(no);
  }
  if(m.txt){
    var hd=document.createElement('div');hd.className='txrow';
    var lb=document.createElement('span');lb.className='lbl';lb.textContent='Transcript';hd.appendChild(lb);
    var sh=document.createElement('button');sh.className='chip';
    sh.textContent=window.myllmShare?'Share':'Copy';sh.onclick=function(){shareTxt(m.id)};
    hd.appendChild(sh);b.appendChild(hd);
    var tx=document.createElement('div');tx.className='tx';tx.textContent=m.txt;b.appendChild(tx);
  }
  return b;
}
function render(){
  var L=el('list');L.innerHTML='';el('head').style.display=memos.length?'block':'none';
  el('empty').style.display=memos.length?'none':'block';
  memos.forEach(function(m){
    var playing=(playingId===m.id),open=(openId===m.id);
    var d=document.createElement('div');d.className='memo'+(playing?' playing':'')+(open?' open':'');
    var row=document.createElement('div');row.className='mrow';
    var pl=document.createElement('button');pl.className='play';pl.textContent=playing?'❚❚':'▶';pl.setAttribute('aria-label','Play');pl.onclick=function(){play(m.id)};
    var info=document.createElement('div');info.className='mi';
    info.innerHTML='<div class="nm">'+esc(m.name)+'</div><div class="dt">'+(playing?'<b>Playing</b>':mmss(m.dur))
      +(m.txt?' · 💬':'')+' <span style="color:var(--faint)">'+(open?'▾':'▸')+'</span></div>';
    info.onclick=function(){toggleOpen(m.id)};
    row.appendChild(pl);row.appendChild(info);
    if(CANSHARE){
      var sn=document.createElement('button');sn.className='iconbtn send';sn.innerHTML=SHARE_SVG;sn.setAttribute('aria-label','Send memo');sn.onclick=function(){sendMemo(m.id)};
      row.appendChild(sn);
    }
    var x=document.createElement('button');x.className='iconbtn del'+(armed===m.id?' armed':'');x.setAttribute('aria-label','Delete');
    x.innerHTML=armed===m.id?'Delete?':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
    x.onclick=function(){del(m.id)};
    row.appendChild(x);
    d.appendChild(row);
    if(open)d.appendChild(buildBody(m));
    L.appendChild(d);
  });
  renderUse();
}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function renderUse(){
  var kb=Math.round(JSON.stringify(memos).length/1024);
  el('use').textContent=memos.length?(kb+' KB of ~930 KB used'):'';
}

store.getItem('memos').then(function(v){
  if(v)try{memos=JSON.parse(v)||[]}catch(e){}
  render();
  if(typeof MediaRecorder==='undefined')setStatus('Recording needs the latest MyLLM. Update from the App Store.');
});
</script></body></html>
