<style>:root{--build-id:"73349fd0a0";color-scheme:light dark;

  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ font-family:var(--myllm-font,-apple-system,system-ui,sans-serif); background:var(--bg); color:var(--ink);

  @media (min-width:768px){ body{ max-width:760px; } }
  svg.i{ width:1.25em; height:1.25em; fill:currentColor; flex-shrink:0; }
  button{ font:inherit; color:inherit; cursor:pointer; } button:active{ transform:scale(.96); }
  [hidden]{ display:none !important; }

  .head{ display:flex; align-items:center; gap:12px; margin:2px 2px 14px; }
  .tile{ display:flex; align-items:center; justify-content:center; color:#fff; flex-shrink:0;
    background:linear-gradient(145deg, hsl(var(--h) 62% 50%), hsl(calc(var(--h) + 40) 58% 28%)); }

  .seg button.on{ background:var(--surface); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.14); }

  .card{ background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:14px; margin-bottom:12px; }
  .search{ display:flex; gap:8px; }
  .field{ flex:1; min-width:0; display:flex; align-items:center; gap:8px; border:1px solid var(--line); background:var(--bg); border-radius:12px; padding:0 12px; }
  .field svg{ color:var(--muted); }
  .field input{ flex:1; min-width:0; border:0; background:none; outline:none; font:inherit; font-size:16px; padding:12px 0; color:var(--ink); }

  .go{ flex-shrink:0; min-height:46px; border:0; border-radius:12px; padding:0 16px; background:var(--acc); color:#fff; font-size:15px; font-weight:700; display:flex; align-items:center; gap:7px; }
  .go:disabled{ opacity:.55; }

  /* the hero takes the weather's colour: cold blue, mild teal, warm amber, hot red; night and storms darker */
  .hero{ --wh:205; transition:--wh 1s ease; border-radius:22px; padding:16px 18px 14px; color:#fff; margin-bottom:12px; overflow:hidden;
    background:linear-gradient(160deg, hsl(var(--wh) 66% 50%), hsl(calc(var(--wh) + 28) 60% 28%)); box-shadow:0 12px 30px hsl(var(--wh) 60% 30% / .28); }

  .hr span{ display:block; font-size:14.5px; font-weight:750; font-variant-numeric:tabular-nums; }

  .day .d{ font-size:15px; font-weight:650; }
  .day svg{ width:24px; height:24px; color:hsl(var(--h) 70% 50%); }
  .day .lo{ font-size:15px; color:var(--muted); text-align:right; }
  .day .hi{ font-size:15px; font-weight:750; }
  .bar{ position:relative; height:6px; border-radius:99px; background:var(--fill); }

  .wear{ width:100%; min-height:48px; border:0; border-radius:14px; background:var(--fill); color:var(--acc); font-size:15px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:8px; margin-top:12px; }
  .wear:disabled{ opacity:.6; }
  .tip{ display:flex; gap:12px; align-items:flex-start; margin-top:10px; }
  .tip .tile{ width:36px; height:36px; border-radius:10px; font-size:15px; }
  .tip p{ font-size:15px; line-height:1.5; }
  .tip small{ display:block; font-size:12.5px; color:var(--muted); margin-top:3px; }

  .notice{ display:flex; gap:12px; align-items:flex-start; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px; margin:0 0 12px; }
  .notice .tile{ width:36px; height:36px; border-radius:10px; font-size:15px; }

  .notice.off .tile{ background:linear-gradient(145deg,#8e8e93,#48484a); }
  .notice b{ display:block; font-size:15px; font-weight:750; }
  .notice p{ font-size:13.5px; color:var(--muted); margin-top:2px; line-height:1.45; }
  .notice button{ margin-top:10px; min-height:36px; padding:0 14px; border-radius:10px; border:0; background:var(--acc); color:#fff; font-weight:700; font-size:13.5px; display:inline-flex; align-items:center; gap:6px; }
  .status{ display:flex; align-items:center; justify-content:center; gap:8px; font-size:13.5px; color:var(--muted); margin:-2px 0 12px; min-height:18px; }
  .sk{ height:240px; border-radius:22px; background:var(--fill); margin-bottom:12px; animation:pulse 1.3s ease-in-out infinite; }
  @keyframes pulse{ 50%{ opacity:.5; } }

  @media (max-height:520px) and (min-width:600px){ .hero .big{ font-size:56px; } .hero .wx{ width:60px; height:60px; } }
  @media (max-width:350px){ .hero .big{ font-size:56px; } .go span{ display:none; } }
  @media (prefers-reduced-motion:reduce){ .hero{ transition:none; } .sk{ animation:none; } .spin{ animation-duration:2.4s; } button:active{ transform:none; } }
  @keyframes myllmAiSpin{to{transform:rotate(360deg)}}
  .myllm-ai-busy{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(18px);z-index:99999;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;display:flex;align-items:center;gap:10px;background:rgba(28,28,30,.96);color:#fff;border-radius:999px;padding:10px 16px 10px 14px;box-shadow:0 6px 22px rgba(0,0,0,.4);font-size:14px;font-weight:600;max-width:92%}
  .myllm-ai-busy.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .myllm-ai-cog{width:16px;height:16px;border-radius:50%;border:2.4px solid #a78bfa;border-right-color:transparent;animation:myllmAiSpin .9s linear infinite;flex-shrink:0}
  .myllm-ai-busy small{font-weight:400;opacity:.6}

<script>
(function(){if(window.__myllmAiWrap||typeof window.myllmAsk!=='function')return;window.__myllmAiWrap=true;
var orig=window.myllmAsk,depth=0,node=null;
function ensure(){if(node)return;node=document.createElement('div');node.className='myllm-ai-busy';
node.innerHTML='<span class="myllm-ai-cog"></span><span>AI is thinking… <small>privately, on your device</small></span>';
(document.body||document.documentElement).appendChild(node);}
function show(){ensure();depth++;node.classList.add('on');}
function hide(){depth=Math.max(0,depth-1);if(depth===0&&node)node.classList.remove('on');}
window.myllmAsk=function(){show();var p;try{p=orig.apply(this,arguments);}catch(e){hide();throw e;}
return Promise.resolve(p).then(function(r){hide();return r;},function(e){hide();throw e;});};})();
</script>

<script>
var unit='c',place=null,last=null;
function el(i){return document.getElementById(i)}
/* Bridges are looked up when used, never kept: MyLLM can add them after this
   script has run. */
function store(){return window.myllmStorage||{getItem:function(){return Promise.resolve(null)},setItem:function(){return Promise.resolve()}}}
function net(){return window.myllmFetch||null}
function haptic(k){if(window.myllmHaptic)try{myllmHaptic(k)}catch(e){}}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function icon(n){return '<svg class="i"><use href="#'+n+'"/></svg>'}
function setStatus(t,busy){el('status').innerHTML=t?(busy?'<i class="spin"></i>':'')+'<span>'+esc(t)+'</span>':''}
function notice(kind,title,text,retry){
  var N=el('notice');
  if(!kind){N.innerHTML='';return}
  N.innerHTML='<div class="notice '+kind+'"><div class="tile">'+icon(kind==='off'?'i-off':'i-warn')+'</div><div><b>'+esc(title)+'</b><p>'+esc(text)+'</p>'+
    (retry?'<button type="button">'+icon('i-refresh')+'Try again</button>':'')+'</div></div>';
  if(retry)N.querySelector('button').onclick=retry;
}
function uTemp(){return unit==='f'?'fahrenheit':'celsius'}
function uWind(){return unit==='f'?'mph':'kmh'}
function deg(){return unit==='f'?'°F':'°C'}
function wspd(){return unit==='f'?'mph':'km/h'}

var WMO={0:['sun','Clear sky'],1:['suncloud','Mainly clear'],2:['suncloud','Partly cloudy'],3:['cloud','Overcast'],
45:['fog','Fog'],48:['fog','Rime fog'],51:['drizzle','Light drizzle'],53:['drizzle','Drizzle'],55:['drizzle','Heavy drizzle'],
56:['drizzle','Freezing drizzle'],57:['drizzle','Freezing drizzle'],61:['rain','Light rain'],63:['rain','Rain'],65:['rain','Heavy rain'],
66:['rain','Freezing rain'],67:['rain','Freezing rain'],71:['snow','Light snow'],73:['snow','Snow'],75:['snow','Heavy snow'],
77:['snow','Snow grains'],80:['rain','Light showers'],81:['rain','Showers'],82:['storm','Violent showers'],
85:['snow','Snow showers'],86:['snow','Snow showers'],95:['storm','Thunderstorm'],96:['storm','Thunderstorm + hail'],99:['storm','Thunderstorm + hail']};
function wmo(c,day){var w=WMO[c]||['temp','—'];var g=w[0];if(day===0){if(g==='sun')g='moon';else if(g==='suncloud')g=c<=1?'moon':'mooncloud'}return{g:'w-'+g,t:w[1],kind:w[0]}}
function wx(g,cls){return '<svg class="'+(cls||'i')+'"><use href="#'+g+'"/></svg>'}
function dayName(iso){var d=new Date(iso+'T00:00');return d.toLocaleDateString(undefined,{weekday:'short'})}

/* Hue from how warm it feels (in °C whatever the display unit), nudged by the sky.
   Two families, never the green in between: cool blues up to 19°, warm ambers
   from 20°. The hue animates, so crossing over is a fade, not a jump. */
var HUES=[[-10,228],[0,215],[10,202],[19,188],[19.5,52],[25,36],[32,14],[38,4]];
function hueFor(temp,kind,isDay){
  var t=unit==='f'?(temp-32)*5/9:temp,h=HUES[0][1];
  for(var i=0;i<HUES.length;i++){if(t<=HUES[i][0]){if(i===0)h=HUES[0][1];else{var a=HUES[i-1],b=HUES[i],k=(t-a[0])/(b[0]-a[0]);h=a[1]+(b[1]-a[1])*k}break}h=HUES[i][1]}
  if(kind==='rain'||kind==='drizzle')h=h*0.4+208*0.6;
  if(kind==='storm')h=262;if(kind==='snow')h=200;if(kind==='fog'||kind==='cloud')h=h*0.5+210*0.5;
  if(!isDay)h=h*0.3+235*0.7;
  return Math.round(h);
}

function search(){
  var q=el('city').value.trim();if(!q)return;
  if(!net()){notice('off','Network access is off','Weather needs “Allow apps to use the internet” in MyLLM’s Settings.',search);return}
  notice(null);el('city').blur();
  el('goBtn').disabled=true;setStatus('Finding “'+q+'”…',true);
  net()('https://geocoding-api.open-meteo.com/v1/search?count=1&language=en&name='+encodeURIComponent(q))
  .then(function(r){
    if(!r||!r.ok)throw new Error('lookup failed');
    var g=JSON.parse(r.body);
    if(!g.results||!g.results.length)throw new Error('couldn’t find that place');
    var p=g.results[0];place={lat:p.latitude,lon:p.longitude,name:p.name,region:p.admin1||'',country:p.country||''};
    store().setItem('place',JSON.stringify(place));haptic('light');load();
  }).catch(function(e){setStatus('');notice('err','Could not search',e.message,search)})
  .then(function(){el('goBtn').disabled=false});
}
function load(){
  if(!place)return;
  if(!net()){notice('off','Network access is off','Weather needs “Allow apps to use the internet” in MyLLM’s Settings.',load);return}
  notice(null);el('empty').hidden=true;
  if(!last)el('sk').hidden=false;
  setStatus('Loading forecast…',true);
  var u='https://api.open-meteo.com/v1/forecast?latitude='+place.lat+'&longitude='+place.lon+
    '&current=temperature_2m,weather_code,wind_speed_10m,relative_humidity_2m,is_day'+
    '&hourly=temperature_2m,weather_code,is_day'+
    '&daily=weather_code,temperature_2m_max,temperature_2m_min&forecast_days=5&timezone=auto'+
    '&temperature_unit='+uTemp()+'&wind_speed_unit='+uWind();
  net()(u).then(function(r){
    if(!r||!r.ok)throw new Error('forecast failed');
    last=JSON.parse(r.body);render();setStatus('');
  }).catch(function(e){setStatus('');notice('err','Could not load the forecast',e.message,load)})
  .then(function(){el('sk').hidden=true});
}
function hoursHtml(){
  var H=last.hourly;if(!H||!H.time||!H.time.length)return '';
  var nowKey=String(last.current.time||'').slice(0,13),start=0;
  for(var i=0;i<H.time.length;i++){if(H.time[i].slice(0,13)>=nowKey){start=i;break}}
  var out='';
  for(var j=start;j<Math.min(start+24,H.time.length);j++){
    var w=wmo(H.weather_code[j],H.is_day?H.is_day[j]:1);
    var label=j===start?'Now':H.time[j].slice(11,13);
    out+='<div class="hr'+(j===start?' cur':'')+'"><b>'+label+'</b>'+wx(w.g,'')+'<span>'+Math.round(H.temperature_2m[j])+'°</span></div>';
  }
  return '<div class="hours">'+out+'</div>';
}
function render(){
  if(!last)return;var c=last.current,w=wmo(c.weather_code,c.is_day);
  var loc=place.name+(place.region&&place.region!==place.name?', '+place.region:'')+(place.country?', '+place.country:'');
  var hero=el('cur');hero.hidden=false;
  hero.classList.toggle('night',c.is_day===0);
  hero.style.setProperty('--wh',hueFor(c.temperature_2m,w.kind,c.is_day!==0));
  hero.innerHTML='<div class="loc">'+icon('i-pin')+'<span>'+esc(loc)+'</span></div>'+
    '<div class="now"><div class="big">'+Math.round(c.temperature_2m)+'<small>'+deg()+'</small></div>'+wx(w.g,'wx')+'</div>'+
    '<div class="desc">'+esc(w.t)+'</div>'+
    '<div class="extra"><span>'+icon('i-drop')+c.relative_humidity_2m+'%</span><span>'+icon('i-wind')+Math.round(c.wind_speed_10m)+' '+wspd()+'</span></div>'+
    hoursHtml();
  var D=el('days');D.innerHTML='';
  var lo=Math.min.apply(null,last.daily.temperature_2m_min),hi=Math.max.apply(null,last.daily.temperature_2m_max),span=Math.max(1,hi-lo);
  for(var i=0;i<last.daily.time.length;i++){
    var dw=wmo(last.daily.weather_code[i],1),mn=last.daily.temperature_2m_min[i],mx=last.daily.temperature_2m_max[i];
    var row=document.createElement('div');row.className='day';
    row.innerHTML='<div class="d">'+(i===0?'Today':esc(dayName(last.daily.time[i])))+'</div>'+wx(dw.g,'i')+
      '<div class="lo">'+Math.round(mn)+'°</div>'+
      '<div class="bar"><i style="left:'+((mn-lo)/span*100).toFixed(1)+'%;width:'+Math.max(6,(mx-mn)/span*100).toFixed(1)+'%"></i></div>'+
      '<div class="hi">'+Math.round(mx)+'°</div>';
    row.setAttribute('aria-label',(i===0?'Today':dayName(last.daily.time[i]))+': '+dw.t+', '+Math.round(mn)+' to '+Math.round(mx)+' degrees');
    D.appendChild(row);
  }
  el('dayWrap').hidden=false;
  el('tip').hidden=true;
  el('wearWrap').hidden=!window.myllmAsk;
}
function setUnit(u){
  if(unit===u)return;unit=u;syncUnit();haptic('selection');
  store().setItem('unit',u);if(place)load();
}
function syncUnit(){el('uC').classList.toggle('on',unit==='c');el('uF').classList.toggle('on',unit==='f')}
function wear(){
  if(!last||!window.myllmAsk)return;var c=last.current,w=wmo(c.weather_code,c.is_day);
  var b=el('wearBtn');b.disabled=true;b.innerHTML='<i class="spin"></i><span>Thinking…</span>';
  myllmAsk('Weather right now: '+Math.round(c.temperature_2m)+deg()+', '+w.t+', wind '+Math.round(c.wind_speed_10m)+' '+wspd()+', humidity '+c.relative_humidity_2m+'%. In ONE friendly sentence, say what to wear and whether to take an umbrella.')
  .then(function(reply){el('tipText').textContent=String(reply).trim();el('tip').hidden=false;haptic('success')})
  .catch(function(){el('tipText').textContent='Couldn’t get a suggestion just now — try again in a moment.';el('tip').hidden=false})
  .then(function(){b.disabled=false;b.innerHTML=icon('i-shirt')+'<span>What should I wear?</span>'});
}
el('uC').onclick=function(){setUnit('c')};
el('uF').onclick=function(){setUnit('f')};
el('goBtn').onclick=search;
el('wearBtn').onclick=wear;
el('city').addEventListener('keydown',function(e){if(e.key==='Enter')search()});
Promise.all([store().getItem('place'),store().getItem('unit')]).then(function(r){
  if(r[1]==='c'||r[1]==='f')unit=r[1];syncUnit();
  if(r[0]){try{place=JSON.parse(r[0]);el('city').value=place.name;load()}catch(e){place=null}}
  if(!place){el('empty').hidden=false;if(!net())notice('off','Network access is off','Weather needs “Allow apps to use the internet” in MyLLM’s Settings.',null)}
});
</script></body></html>
