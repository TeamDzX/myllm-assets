<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>:root{color-scheme:light dark}
body{font-family:-apple-system,system-ui,sans-serif;margin:0;padding:20px;background:#f2f2f7;color:#111;text-align:center}
@media(prefers-color-scheme:dark){body{background:#000;color:#eee}.panel{background:#1c1c1e}input{background:#2c2c2e;color:#eee;border-color:#3a3a3c}.tipbtn{background:#2c2c2e;color:#eee}}
h1{font-size:22px}
.panel{background:#fff;border-radius:14px;padding:18px;margin:0 auto 14px;max-width:380px;text-align:left}
label{font-size:13px;opacity:.6;display:block;margin-bottom:4px}
input{width:100%;box-sizing:border-box;padding:12px;font-size:20px;border:1px solid #d1d1d6;border-radius:10px;background:#fff}
.tips{display:flex;gap:8px;margin:12px 0}
.tipbtn{flex:1;padding:10px 0;border:0;border-radius:10px;background:#e5e5ea;font-size:14px;font-weight:600;color:#111}
.tipbtn.on{background:#30d158;color:#fff}
.ppl{display:flex;align-items:center;gap:14px;justify-content:center;margin:8px 0 0}
.ppl button{width:40px;height:40px;border-radius:20px;border:0;background:#30d158;color:#fff;font-size:20px;font-weight:700}
.ppl b{font-size:20px;min-width:64px;text-align:center}
.out{font-size:15px;line-height:1.9;text-align:center}
.out .big{font-size:30px;font-weight:700;color:#30d158}
</style></head><body>
<h1>💷 Tip Split</h1>
<div class="panel">
<label>Bill amount</label><input id="bill" type="number" inputmode="decimal" placeholder="0.00">
<div class="tips" id="tips"></div>
<div class="ppl"><button onclick="ppl(-1)">−</button><b id="n">👥 2</b><button onclick="ppl(1)">+</button></div>
</div>
<div class="panel out" id="out"></div>
<script>
var tip=10,people=2,opts=[0,5,10,12.5,20];
var T=document.getElementById('tips');
opts.forEach(function(p){var b=document.createElement('button');b.className='tipbtn';b.textContent=p+'%';
b.onclick=function(){tip=p;upd()};T.appendChild(b)});
function ppl(d){people=Math.max(1,people+d);upd()}
function upd(){var bill=parseFloat(document.getElementById('bill').value)||0;
Array.prototype.forEach.call(T.children,function(b,i){b.className='tipbtn'+(opts[i]===tip?' on':'')});
document.getElementById('n').textContent='👥 '+people;
var tipAmt=bill*tip/100,total=bill+tipAmt;
document.getElementById('out').innerHTML='Tip: <b>'+tipAmt.toFixed(2)+'</b> · Total: <b>'+total.toFixed(2)+
'</b><br>Each pays<br><span class="big">'+(total/people).toFixed(2)+'</span>'}
document.getElementById('bill').addEventListener('input',upd);upd();
</script></body></html>
