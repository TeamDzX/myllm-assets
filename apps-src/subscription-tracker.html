<style>

<script>
(function(){if(window.__myllmAiWrap||typeof window.myllmAsk!=='function')return;window.__myllmAiWrap=true;
var orig=window.myllmAsk,depth=0,node=null;
function ensure(){if(node)return;node=document.createElement('div');node.className='myllm-ai-busy';
node.innerHTML='<span class="myllm-ai-cog"></span><span>AI is thinking… <small>privately, on your device</small></span>';
(document.body||document.documentElement).appendChild(node);}
function show(){ensure();depth++;node.classList.add('on');}
function hide(){depth=Math.max(0,depth-1);if(depth===0&&node)node.classList.remove('on');}
window.myllmAsk=function(){show();var p;try{p=orig.apply(this,arguments);}catch(e){hide();throw e;}
return Promise.resolve(p).then(function(r){hide();return r;},function(e){hide();throw e;});};})();
</script>

  {id:"music",     name:"Music",     h:320},
  {id:"cloud",     name:"Cloud & apps", h:205},
  {id:"fitness",   name:"Fitness",   h:145},
  {id:"news",      name:"News & reading", h:28},
  {id:"gaming",    name:"Gaming",    h:268},
  {id:"home",      name:"Home & bills", h:176},
  {id:"other",     name:"Other",     h:230}
];
var CYCLES = {w:{name:"weekly", perMonth:52/12, days:7}, m:{name:"monthly", perMonth:1, days:0}, q:{name:"quarterly", perMonth:1/3, days:0}, y:{name:"yearly", perMonth:1/12, days:0}};

var subs = [];
var currency = "£";
var editing = null;       // id being edited, or null
var pickedCat = "other";
var armDelete = false;

function uid(){ return "s" + Date.now().toString(36) + Math.floor(Math.random()*1e6).toString(36); }
function el(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function cico(c){ return '<svg class="i"><use href="#c-' + c.id + '"/></svg>'; }
function money(n){ return currency + (Math.round(n*100)/100).toFixed(2); }

function save(){ store().setItem("subs", JSON.stringify(subs)); store().setItem("cur", currency); }

/* advance a renewal date until it's today or later */
function rollForward(s){
  var d = new Date(s.next + "T12:00:00");
  var today = new Date(); today.setHours(0,0,0,0);
  var guard = 0;
  while (d < today && guard++ < 600){
    if (s.cycle === "w") d.setDate(d.getDate()+7);
    else if (s.cycle === "m") d.setMonth(d.getMonth()+1);
    else if (s.cycle === "q") d.setMonth(d.getMonth()+3);
    else d.setFullYear(d.getFullYear()+1);
  }
  var iso = d.toISOString().slice(0,10);
  if (iso !== s.next){ s.next = iso; return true; }
  return false;
}

function daysUntil(iso){
  var today = new Date(); today.setHours(0,0,0,0);
  var d = new Date(iso + "T00:00:00");
  return Math.round((d - today) / 86400000);
}

function monthly(s){ return s.price * CYCLES[s.cycle].perMonth; }

function render(){
  var active = subs.filter(function(s){ return !s.paused; });
  var mo = active.reduce(function(a,s){ return a + monthly(s); }, 0);
  el("permo").textContent = subs.length ? money(mo) : "–";
  el("peryr").textContent = subs.length ? money(mo*12) : "–";
  el("count").textContent = subs.length ? (" · " + active.length + " active") : "";
  el("listLbl").hidden = !subs.length;
  el("aibtn").style.display = (window.myllmAsk && subs.length >= 2) ? "flex" : "none";

  /* category bars */
  var byCat = {};
  active.forEach(function(s){ byCat[s.cat] = (byCat[s.cat]||0) + monthly(s); });
  var keys = Object.keys(byCat).sort(function(a,b){ return byCat[b]-byCat[a]; });
  if (keys.length >= 2){
    el("bars").style.display = "block";
    var max = byCat[keys[0]];
    el("barlist").innerHTML = keys.map(function(k){
      var c = CATS.filter(function(x){return x.id===k;})[0] || CATS[CATS.length-1];
      return '<div class="bar" style="--h:'+c.h+'"><div class="lbl"><span class="dotc"></span><span>'+esc(c.name)+'</span><i>'+money(byCat[k])+'</i></div>'+
             '<div class="track"><div class="fill" style="width:'+Math.max(6, byCat[k]/max*100)+'%"></div></div></div>';
    }).join("");
  } else el("bars").style.display = "none";

  /* list */
  if (!subs.length){
    el("list").innerHTML = '<div class="empty"><div class="tile"><svg class="i"><use href="#i-repeat"/></svg></div><b>Track every subscription in one place</b><p>Tap + to add your first — you might be surprised what it all adds up to.</p></div>';
    return;
  }
  var sorted = subs.slice().sort(function(a,b){
    if (!!a.paused !== !!b.paused) return a.paused ? 1 : -1;
    return a.next < b.next ? -1 : 1;
  });
  el("list").innerHTML = sorted.map(function(s){
    var c = CATS.filter(function(x){return x.id===s.cat;})[0] || CATS[CATS.length-1];
    var d = daysUntil(s.next);
    var when = s.paused ? "paused" : (d === 0 ? "renews today" : d === 1 ? "renews tomorrow" : "renews in " + d + " days");
    var cls = s.paused ? "" : (d === 0 ? "today" : d <= 7 ? "due" : "");
    return '<div class="sub'+(s.paused?' paused':'')+'" onclick="openSheet(\''+s.id+'\')">'+
      '<div class="tile" style="--h:'+c.h+'">'+cico(c)+'</div>'+
      '<div class="mid"><b>'+esc(s.name)+'</b><small class="'+cls+'">'+when+'</small></div>'+
      '<div class="right"><b>'+money(s.price)+'</b><small>'+CYCLES[s.cycle].name+'</small></div>'+
    '</div>';
  }).join("");
}

/* ---- sheet ---- */
function renderCats(){
  el("f_cats").innerHTML = CATS.map(function(c){
    return '<button class="chip'+(pickedCat===c.id?' on':'')+'" type="button" onclick="pickCat(\''+c.id+'\')">'+cico(c)+esc(c.name)+'</button>';
  }).join("");
}
function pickCat(id){ pickedCat = id; haptic("selection"); renderCats(); }

function openSheet(id){
  editing = id || null;
  armDelete = false;
  var s = editing ? subs.filter(function(x){return x.id===editing;})[0] : null;
  el("sheetTitle").textContent = s ? "Edit subscription" : "New subscription";
  el("f_name").value = s ? s.name : "";
  el("f_price").value = s ? s.price : "";
  el("f_cycle").value = s ? s.cycle : "m";
  el("f_date").value = s ? s.next : new Date(Date.now()+86400000*30).toISOString().slice(0,10);
  pickedCat = s ? s.cat : "other";
  el("dangerRow").style.display = s ? "flex" : "none";
  el("delBtn").textContent = "Delete";
  el("pauseBtn").textContent = (s && s.paused) ? "Resume" : "Pause";
  renderCats();
  el("veil").classList.add("on");
  el("sheet").classList.add("on");
  haptic("light");
}
function closeSheet(){
  el("veil").classList.remove("on");
  el("sheet").classList.remove("on");
}
function saveSub(){
  var name = el("f_name").value.trim();
  var price = parseFloat(String(el("f_price").value).replace(",", "."));
  var date = el("f_date").value;
  if (!name || !(price > 0) || !date){ haptic("light"); el("f_name").focus(); return; }
  if (editing){
    var s = subs.filter(function(x){return x.id===editing;})[0];
    s.name = name; s.price = price; s.cycle = el("f_cycle").value; s.next = date; s.cat = pickedCat;
    rollForward(s);
  } else {
    var ns = {id:uid(), name:name, price:price, cycle:el("f_cycle").value, next:date, cat:pickedCat, paused:false};
    rollForward(ns);
    subs.push(ns);
  }
  save(); render(); closeSheet(); haptic("success");
}
function delSub(){
  if (!armDelete){ armDelete = true; el("delBtn").textContent = "Really delete?"; haptic("light"); return; }
  subs = subs.filter(function(x){return x.id!==editing;});
  save(); render(); closeSheet(); haptic("success");
}
function togglePause(){
  var s = subs.filter(function(x){return x.id===editing;})[0];
  if (s){ s.paused = !s.paused; save(); render(); }
  closeSheet(); haptic("selection");
}
function setCur(){ currency = el("cur").value; el("cur2").value = currency; save(); render(); }
el("cur2").onchange = function(){ el("cur").value = el("cur2").value; setCur(); };

/* ---- optional AI audit ---- */
function audit(){
  if (!window.myllmAsk) return;
  haptic("light");
  var ab = el("aibtn"); ab.disabled = true; ab.innerHTML = '<i class="spin"></i><span>Auditing…</span>';
  var lines = subs.map(function(s){
    return s.name + ": " + currency + s.price + " " + CYCLES[s.cycle].name + (s.paused ? " (paused)" : "");
  }).join("; ");
  var mo = subs.filter(function(s){return !s.paused;}).reduce(function(a,s){return a+monthly(s);},0);
  var prompt = "My subscriptions: " + lines + ". Total ≈ " + money(mo) + "/month. " +
    "In under 120 words, give a friendly audit: the yearly total, my biggest costs, any likely overlap (e.g. two music or two TV services), and 1–2 candidates to consider cancelling or switching to yearly billing. Plain text, no markdown.";
  myllmAsk(prompt, {system:"You are a concise, friendly personal-finance helper. Plain text only."})
    .then(function(r){
      el("aitext").textContent = String(r).trim();
      el("aiout").classList.add("on");
      haptic("success");
    })
    .catch(function(){
      el("aitext").textContent = "The AI couldn't run just now — try again in a moment.";
      el("aiout").classList.add("on");
    })
    .then(function(){ ab.disabled = false; ab.innerHTML = '<svg class="i"><use href="#i-spark"/></svg><span>AI audit</span>'; });
}
function hideAi(){ el("aiout").classList.remove("on"); }

/* ---- boot ---- */
Promise.all([store().getItem("subs"), store().getItem("cur")]).then(function(vals){
  if (vals[0]){ try{ subs = JSON.parse(vals[0]) || []; }catch(e){} }
  if (vals[1]){ currency = vals[1]; el("cur").value = currency; el("cur2").value = currency; }
  var changed = false;
  subs.forEach(function(s){ if (!s.paused && rollForward(s)) changed = true; });
  if (changed) save();
  render();
});

/* myllm-fullscreen-v1 — full screen where MyLLM can also close the app for us (myllmClose,
   5.6.2+): full screen hides MyLLM's Done, and a page with no way out is
   worse than a repeated title, so elsewhere nothing changes. The spacer keeps
   the header clear of the status bar only if the page doesn't already. */
(function(){
  function full(){ return !!(window.myllmClose && window.myllmImmersive); }
  function inset(){
    var p = document.createElement("div");
    p.style.cssText = "position:fixed;top:0;left:0;width:1px;visibility:hidden;height:env(safe-area-inset-top)";
    document.body.appendChild(p); var h = p.offsetHeight; p.parentNode.removeChild(p); return h;
  }
  function fit(){
    var sp = document.querySelector(".imm-safe"), head = document.querySelector(".head");
    if (!sp || !head) return;
    sp.style.height = "0px";
    if (!document.body.classList.contains("imm")) return;
    var need = inset() + 6 - (head.getBoundingClientRect().top + window.scrollY);
    sp.style.height = Math.max(0, Math.round(need)) + "px";
  }
  function sync(){
    var f = full();
    document.body.classList.toggle("imm", f);
    fit();
    if (!f) return;
    try { window.myllmImmersive(true, { keepAwake:false }).catch(function(){}); } catch(e){}
  }
  window.myllmFSClose = function(){
    try { if (window.myllmHaptic) window.myllmHaptic("light"); } catch(e){}
    try { window.myllmClose().catch(function(){}); } catch(e){}
  };
  document.addEventListener("visibilitychange", function(){ if (!document.hidden) sync(); });
  window.addEventListener("resize", fit);
  sync();
})();
</script>
</body>
</html>
