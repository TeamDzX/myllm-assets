<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>:root{color-scheme:light dark;--accent:#0a84ff}
*{box-sizing:border-box}
body{font-family:-apple-system,system-ui,sans-serif;margin:0;padding:18px 16px;background:#f2f2f7;color:#111}
@media(prefers-color-scheme:dark){body{background:#000;color:#eee}textarea,select,.qrwrap{background:#1c1c1e;color:#eee;border-color:#3a3a3c}}
h1{font-size:22px;margin:0 0 4px}
.sub{font-size:13px;opacity:.6;margin-bottom:14px}
textarea{width:100%;height:84px;padding:12px;border:1px solid #d1d1d6;border-radius:11px;font-size:15px;background:#fff;color:#111;resize:vertical;-webkit-user-select:text;user-select:text}
.opts{display:flex;gap:8px;margin:10px 0}
.opts label{flex:1;font-size:12px;opacity:.6}
select{width:100%;padding:9px;border:1px solid #d1d1d6;border-radius:9px;font-size:15px;background:#fff;color:#111;margin-top:3px}
button.go{width:100%;border:0;background:var(--accent);color:#fff;border-radius:11px;padding:13px;font-size:15px;font-weight:600}
button:disabled{opacity:.5}
#status{font-size:13px;opacity:.75;min-height:18px;text-align:center;margin:12px 0}
.qrwrap{background:#fff;border-radius:18px;padding:18px;margin-top:8px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.1);display:none}
.qrwrap img{width:100%;max-width:300px;image-rendering:pixelated;border-radius:8px}
.acts{display:flex;gap:8px;margin-top:14px}
.acts button{flex:1;border:0;border-radius:10px;padding:11px;font-size:14px;font-weight:600;background:#e8eefc;color:var(--accent)}
@media(prefers-color-scheme:dark){.acts button{background:#15223a}}
@media(min-width:768px){body{max-width:760px;margin-left:auto;margin-right:auto}}
</style></head><body>
<h1>🔳 QR Generator</h1>
<div class="sub">Turn any text or link into a scannable QR code — then save it to Photos.</div>
<textarea id="text" placeholder="Text, URL, Wi-Fi, contact… anything" enterkeyhint="go" autocapitalize="off">https://www.opticell-limited.com/myllm</textarea>
<div class="opts">
  <label>Size<select id="size"><option value="240">Small</option><option value="360" selected>Medium</option><option value="600">Large</option></select></label>
  <label>Error correction<select id="ecc"><option value="L">Low</option><option value="M" selected>Medium</option><option value="Q">Quartile</option><option value="H">High</option></select></label>
</div>
<button class="go" id="go" onclick="generate()">Generate QR</button>
<div id="status"></div>
<div class="qrwrap" id="qrwrap">
  <img id="qr" alt="QR code">
  <div class="acts">
    <button onclick="saveImg()">⬇︎ Save to Photos</button>
    <button onclick="shareText()">↗︎ Share text</button>
  </div>
</div>
<script>
var store=window.myllmStorage||{getItem:function(){return Promise.resolve(null)},setItem:function(){return Promise.resolve()}};
var dataUrl=null;
function el(i){return document.getElementById(i)}
function setStatus(t){el('status').textContent=t||''}

function generate(){
  var text=el('text').value.trim();
  if(!text){setStatus('Enter some text or a link first.');return}
  if(!window.myllmFetch){setStatus('QR codes are generated over the network — turn on app network access in Settings → MyLLMos Apps.');return}
  store.setItem('last',text);
  var size=el('size').value,ecc=el('ecc').value;
  el('go').disabled=true;setStatus('Generating…');el('qrwrap').style.display='none';
  var url='https://api.qrserver.com/v1/create-qr-code/?size='+size+'x'+size+'&ecc='+ecc+'&margin=8&data='+encodeURIComponent(text);
  myllmFetch(url,{headers:{Accept:'image/png'}})
  .then(function(r){
    if(!r||!r.ok)throw new Error('the QR service returned '+((r&&r.status)||'no response'));
    var b64=r.bodyBase64||'';
    if(!b64)throw new Error('no image came back');
    dataUrl='data:image/png;base64,'+b64;
    el('qr').src=dataUrl;el('qrwrap').style.display='block';setStatus('');
    if(window.myllmHaptic)myllmHaptic('success');
  }).catch(function(err){setStatus('Couldn’t generate: '+err.message)})
  .then(function(){el('go').disabled=false});
}
function saveImg(){
  if(!dataUrl)return;
  if(!window.myllmSaveImage){setStatus('Saving to Photos needs the latest MyLLM.');return}
  Promise.resolve(myllmSaveImage(dataUrl)).then(function(){setStatus('✓ Saved to Photos')})
  .catch(function(e){setStatus('Couldn’t save: '+(e&&e.message||e))});
}
function shareText(){var t=el('text').value.trim();if(t&&window.myllmShare)myllmShare(t)}

el('text').addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();generate()}});
store.getItem('last').then(function(v){if(v)el('text').value=v});
if(!window.myllmFetch)setStatus('Heads-up: this app needs app network access (Settings → MyLLMos Apps).');
</script></body></html>
