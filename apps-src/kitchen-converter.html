<title>Kitchen Converter</title>
<meta name="myllm:immersive" content="on">
<style>:root{--build-id:"2cd3661e91";color-scheme:light dark;
  --bg:var(--myllm-bg,#f2f2f7); --surface:var(--myllm-surface,#fff); --ink:var(--myllm-text,#111);
  --muted:var(--myllm-muted,#8a8a8e); --line:var(--myllm-border,#e3e3e8); --acc:var(--myllm-accent,#0a84ff);
  --fill:rgba(120,120,128,.12); --h:180; }
@media (prefers-color-scheme:dark){ :root{ --bg:var(--myllm-bg,#000); --surface:var(--myllm-surface,#1c1c1e);
  --ink:var(--myllm-text,#f2f2f7); --muted:var(--myllm-muted,#8e8e93); --line:var(--myllm-border,#2c2c2e); --fill:rgba(120,120,128,.24); } }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ font-family:var(--myllm-font,-apple-system,system-ui,sans-serif); background:var(--bg); color:var(--ink);
    max-width:600px; margin:0 auto; min-height:100dvh; font-size:15.5px; line-height:1.4;
    padding:calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(30px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left)); }
  @media (min-width:768px){ body{ max-width:760px; } .cols{ display:grid; grid-template-columns:1fr 1fr; gap:12px; align-items:start; } }
  svg.i{ width:1.25em; height:1.25em; fill:currentColor; flex-shrink:0; }
  button{ font:inherit; color:inherit; cursor:pointer; } button:active{ transform:scale(.96); }

  .head{ display:flex; align-items:center; gap:12px; margin:2px 2px 14px; }
  .tile{ display:flex; align-items:center; justify-content:center; color:#fff; flex-shrink:0;
    background:linear-gradient(145deg, hsl(var(--h) 62% 42%), hsl(calc(var(--h) + 40) 58% 26%)); }
  .head .tile{ width:44px; height:44px; border-radius:13px; font-size:19px; }
  .head .ht{ flex:1; min-width:0; }
  h1{ font-size:22px; font-weight:800; letter-spacing:-.01em; }
  .head p{ font-size:13px; color:var(--muted); margin-top:1px; }
  h2{ font-size:12px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); margin:4px 2px 10px; }

  .hero{ border-radius:20px; padding:16px 18px; color:#fff; margin-bottom:12px;
    background:linear-gradient(145deg, hsl(var(--h) 58% 36%), hsl(calc(var(--h) + 40) 58% 22%)); box-shadow:0 10px 28px hsl(var(--h) 60% 22% / .25); }
  .hero .big{ font-size:44px; font-weight:800; line-height:1.05; letter-spacing:-.03em; font-variant-numeric:tabular-nums; overflow-wrap:anywhere; }
  .hero .big small{ font-size:22px; font-weight:750; opacity:.85; margin-left:4px; letter-spacing:0; }
  .hero .sub{ font-size:13.5px; opacity:.85; margin-top:4px; font-variant-numeric:tabular-nums; }
  .hero .hint{ font-size:12px; opacity:.72; margin-top:8px; line-height:1.4; }
  .hero .hint:empty{ display:none; }

  .card{ background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:14px; margin-bottom:12px; }
  label{ display:block; font-size:12px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); margin:0 2px 7px; }
  .two{ display:flex; gap:10px; } .two>div{ flex:1; min-width:0; }
  .gap{ margin-top:12px; }
  input,select{ width:100%; font:inherit; font-size:16px; padding:11px 12px; border-radius:12px; border:1px solid var(--line); background:var(--bg); color:var(--ink); outline:none; min-height:46px; }
  select{ -webkit-appearance:none; appearance:none; padding-right:30px;
    background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
    background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%; background-size:5px 5px,5px 5px; background-repeat:no-repeat; }
  input:focus,select:focus{ border-color:var(--acc); }
  .num{ display:flex; align-items:stretch; border:1px solid var(--line); border-radius:12px; background:var(--bg); overflow:hidden; }
  .num:focus-within{ border-color:var(--acc); }
  .num input{ border:0; border-radius:0; background:none; text-align:center; font-weight:700; font-variant-numeric:tabular-nums; padding:11px 2px; min-width:0; }
  .num button{ width:44px; flex-shrink:0; border:0; background:none; color:hsl(var(--h) 60% 34%); display:flex; align-items:center; justify-content:center; font-size:15px; }
  @media (prefers-color-scheme:dark){ .num button{ color:hsl(var(--h) 70% 62%); } }
  .swaprow{ display:flex; align-items:flex-end; gap:8px; margin-top:12px; }
  .swaprow>div{ flex:1; min-width:0; }
  .swap{ width:46px; height:46px; flex-shrink:0; border-radius:12px; border:1px solid var(--line); background:var(--bg); color:hsl(var(--h) 60% 34%);
    display:flex; align-items:center; justify-content:center; font-size:17px; }
  @media (prefers-color-scheme:dark){ .swap{ color:hsl(var(--h) 70% 62%); } }

  .temps{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px; }
  .temps>div{ border-radius:14px; padding:11px 4px; text-align:center; background:hsl(var(--h) 60% 45% / .12); }
  .temps .v{ font-size:24px; font-weight:800; font-variant-numeric:tabular-nums; color:hsl(var(--h) 65% 30%); }
  @media (prefers-color-scheme:dark){ .temps .v{ color:hsl(var(--h) 70% 64%); } }
  .temps .l{ font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-top:1px; }
  @media (max-width:360px){ .two{ flex-direction:column; gap:12px; } }
  @media (max-width:340px){ .hero .big{ font-size:36px; } }
  @media (prefers-reduced-motion:reduce){ button:active{ transform:none; } }
  input[type=number]{ -moz-appearance:textfield; appearance:textfield; }
  input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button{ -webkit-appearance:none; margin:0; }

/* myllm-fullscreen-v2 — MyLLM 5.6.2+ opens this app full screen; the ✕ is the way out. */
.head .imm-acts{display:none;flex-shrink:0;margin-left:auto}
.head .acts + .imm-acts{margin-left:0}
body.imm .head .imm-acts{display:flex}
.head .imm-acts button{width:40px;height:40px;border-radius:12px;border:1px solid var(--myllm-border,rgba(128,128,128,.28));
  background:var(--myllm-surface,rgba(128,128,128,.12));color:var(--myllm-text,currentColor);display:grid;place-items:center;padding:0;cursor:pointer;transition:transform .12s}
.head .imm-acts button:active,.head .imm-x:active{transform:scale(.94)}
.head .imm-x{display:none !important}
body.imm .head .imm-x{display:grid !important;place-items:center}
.imm-x svg,.imm-acts svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}
.imm-safe{display:none}
body.imm .imm-safe{display:block}
</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-scale" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16M6.2 20l1.8-10h8l1.8 10"/><path d="M12 10V5M8.5 5h7"/></g></symbol>
  <symbol id="i-swap" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4v15M4.5 7.5L8 4l3.5 3.5M16 20V5M12.5 16.5L16 20l3.5-3.5"/></g></symbol>
  <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></symbol>
</defs></svg>

<div class="imm-safe"></div><div class="head">
  <div class="tile"><svg class="i"><use href="#i-scale"/></svg></div>
  <div class="ht"><h1>Kitchen Converter</h1><p>Cups, grams, millilitres and oven temperatures — fully offline</p></div>
<div class="imm-acts"><button type="button" aria-label="Close Kitchen Converter" onclick="myllmFSClose()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div></div>

<div class="cols">
<section>
  <h2>Measure</h2>
  <div class="hero" aria-live="polite">
    <div class="big" id="res">—</div>
    <div class="sub" id="resSub"></div>
    <div class="hint" id="densHint"></div>
  </div>
  <div class="card">
    <div class="two">
      <div><label for="amt">Amount</label>
        <div class="num"><button type="button" data-step="amt:-1" aria-label="Less"><svg class="i"><use href="#i-minus"/></svg></button>
          <input id="amt" type="number" inputmode="decimal" value="1">
          <button type="button" data-step="amt:1" aria-label="More"><svg class="i"><use href="#i-plus"/></svg></button></div></div>
      <div><label for="ing">Ingredient</label><select id="ing"></select></div>
    </div>
    <div class="swaprow">
      <div><label for="from">From</label><select id="from"></select></div>
      <button type="button" class="swap" id="swapBtn" aria-label="Swap units"><svg class="i"><use href="#i-swap"/></svg></button>
      <div><label for="to">To</label><select id="to"></select></div>
    </div>
  </div>
</section>

<section>
  <h2>Oven temperature</h2>
  <div class="card">
    <div class="two">
      <div><label for="tval">Value</label>
        <div class="num"><button type="button" data-step="tval:-1" aria-label="Lower"><svg class="i"><use href="#i-minus"/></svg></button>
          <input id="tval" type="number" inputmode="numeric" value="180">
          <button type="button" data-step="tval:1" aria-label="Higher"><svg class="i"><use href="#i-plus"/></svg></button></div></div>
      <div><label for="tunit">Unit</label><select id="tunit"><option value="C">°C</option><option value="F">°F</option><option value="G">Gas mark</option></select></div>
    </div>
    <div class="temps"><div><div class="v" id="oc">—</div><div class="l">°C</div></div><div><div class="v" id="of">—</div><div class="l">°F</div></div><div><div class="v" id="og">—</div><div class="l">Gas</div></div></div>
  </div>
</section>
</div>

<script>
var VOL={'cup':240,'tbsp':15,'tsp':5,'ml':1,'litre':1000,'fl oz':29.5735};
var WT={'g':1,'oz':28.3495,'lb':453.592,'kg':1000};
var UNITS=[['cup','Cups'],['tbsp','Tablespoons'],['tsp','Teaspoons'],['ml','Millilitres'],['litre','Litres'],['fl oz','Fluid ounces'],['g','Grams'],['oz','Ounces'],['lb','Pounds'],['kg','Kilograms']];
var DENS={'Water':1.00,'Plain flour':0.52,'Sugar (granulated)':0.83,'Brown sugar (packed)':0.92,'Butter':0.95,'Rice (uncooked)':0.77,'Milk':1.02,'Honey':1.42,'Rolled oats':0.375};
var GAS={1:140,2:150,3:170,4:180,5:190,6:200,7:220,8:230,9:240};
function el(i){return document.getElementById(i)}
function haptic(k){if(window.myllmHaptic)try{myllmHaptic(k)}catch(e){}}
function isVol(u){return VOL.hasOwnProperty(u)}

function fillUnit(sel,def){UNITS.forEach(function(u){var o=document.createElement('option');o.value=u[0];o.textContent=u[1];sel.appendChild(o)});sel.value=def}
function fillIng(){Object.keys(DENS).forEach(function(k){var o=document.createElement('option');o.value=k;o.textContent=k;el('ing').appendChild(o)})}

function fmt(n){if(!isFinite(n))return'—';if(n>=100)return Math.round(n).toString();if(n>=10)return n.toFixed(1);if(n>=1)return n.toFixed(2);return n.toFixed(3).replace(/0+$/,'').replace(/\.$/,'')}

function convert(){
  var amt=parseFloat(el('amt').value);var from=el('from').value,to=el('to').value,d=DENS[el('ing').value];
  var cross=isVol(from)!==isVol(to);
  el('densHint').textContent=cross?('Using '+el('ing').value.toLowerCase()+' (≈'+Math.round(d*240)+' g per cup) to convert between volume and weight.'):'';
  if(isNaN(amt)){el('res').textContent='—';el('resSub').textContent='';return}
  var ml,g;
  if(isVol(from)){ml=amt*VOL[from];g=ml*d;}else{g=amt*WT[from];ml=g/d;}
  var out=isVol(to)?ml/VOL[to]:g/WT[to];
  var label=UNITS.filter(function(u){return u[0]===to})[0][1].toLowerCase();
  el('res').innerHTML='';el('res').appendChild(document.createTextNode(fmt(out)));
  var u=document.createElement('small');u.textContent=to;el('res').appendChild(u);
  el('resSub').textContent=fmt(amt)+' '+from+' = '+fmt(out)+' '+label;
}
function swap(){var f=el('from').value;el('from').value=el('to').value;el('to').value=f;haptic('selection');convert()}

function nearestGas(c){var best=1,bd=1e9;for(var k in GAS){var diff=Math.abs(GAS[k]-c);if(diff<bd){bd=diff;best=k}}return best}
function temp(){
  var v=parseFloat(el('tval').value),u=el('tunit').value,c;
  if(isNaN(v)){el('oc').textContent=el('of').textContent=el('og').textContent='—';return}
  if(u==='C')c=v;else if(u==='F')c=(v-32)*5/9;else c=GAS[Math.round(v)]||GAS[nearestGas(GAS[Math.round(v)]||180)];
  if(u==='G'&&!GAS[Math.round(v)]){el('oc').textContent='—';el('of').textContent='—';el('og').textContent='1–9';return}
  el('oc').textContent=Math.round(c);
  el('of').textContent=Math.round(c*9/5+32);
  el('og').textContent=nearestGas(c);
}
/* Steppers: quarter steps for small amounts (¼ cup, ½ tsp), whole ones above;
   oven in 10s, gas marks in 1s. */
function step(id,dir){
  var inp=el(id),v=parseFloat(inp.value);if(isNaN(v))v=0;
  var s;
  if(id==='amt')s=(dir<0?v<=2:v<2)?0.25:1;
  else s=el('tunit').value==='G'?1:10;
  v=Math.round((v+dir*s)*100)/100;
  if(id==='amt')v=Math.max(0,v);
  if(id==='tval'&&el('tunit').value==='G')v=Math.min(9,Math.max(1,v));
  inp.value=v;haptic('selection');
  if(id==='amt')convert();else temp();
}
document.querySelectorAll('[data-step]').forEach(function(b){
  var p=b.getAttribute('data-step').split(':');b.onclick=function(){step(p[0],+p[1])};
});
el('swapBtn').onclick=swap;
fillUnit(el('from'),'cup');fillUnit(el('to'),'g');fillIng();
['amt','from','to','ing'].forEach(function(id){el(id).addEventListener('input',convert);el(id).addEventListener('change',convert)});
['tval','tunit'].forEach(function(id){el(id).addEventListener('input',temp);el(id).addEventListener('change',temp)});
convert();temp();

/* myllm-fullscreen-v2 — full screen where MyLLM can also close the app for us
   (myllmClose, 5.6.2+): full screen hides MyLLM's Done, and a page with no way
   out is worse than a repeated title, so elsewhere nothing changes.
   The spacer keeps the header clear of the status bar / Dynamic Island. It is
   live CSS — env(safe-area-inset-top) — not a measured number: the inset is
   still 0 when the page loads and only grows once MyLLM's bar has gone (v1
   measured once, so the title sat under the island). If the page's own styles
   already pad the header down by the inset, the spacer stays at 0. */
(function(){
  function full(){ return !!(window.myllmClose && window.myllmImmersive); }
  /* Does any rule that applies to the header or an ancestor already use the top inset? */
  function pageHandlesInset(head){
    var chain = [], n, found = false;
    for (n = head; n && n.nodeType === 1; n = n.parentElement) chain.push(n);
    function walk(rules){
      for (var i = 0; i < rules.length && !found; i++){
        var r = rules[i];
        if (r.cssRules && !r.selectorText) { walk(r.cssRules); continue; }
        if (!r.selectorText || !/safe-area-inset-top/.test(r.cssText) || !/(padding|margin|top)\s*:/.test(r.cssText)) continue;
        if (/\.imm-safe/.test(r.selectorText)) continue;
        for (var k = 0; k < chain.length; k++){
          try { if (chain[k].matches(r.selectorText)) { found = true; break; } } catch(e){}
        }
      }
    }
    for (var s = 0; s < document.styleSheets.length && !found; s++){
      try { walk(document.styleSheets[s].cssRules); } catch(e){}
    }
    for (n = head; n && n.nodeType === 1 && !found; n = n.parentElement){
      if (/safe-area-inset-top/.test(n.getAttribute("style") || "")) found = true;
    }
    return found;
  }
  function fit(){
    var sp = document.querySelector(".imm-safe"), head = document.querySelector(".head");
    if (!sp || !head) return;
    sp.style.height = (document.body.classList.contains("imm") && !pageHandlesInset(head)) ? "env(safe-area-inset-top)" : "0px";
  }
  function sync(){
    var f = full();
    document.body.classList.toggle("imm", f);
    fit();
    if (!f) return;
    try { window.myllmImmersive(true, { keepAwake:false }).catch(function(){}); } catch(e){}
  }
  window.myllmFSClose = function(){
    try { if (window.myllmHaptic) window.myllmHaptic("light"); } catch(e){}
    try { window.myllmClose().catch(function(){}); } catch(e){}
  };
  document.addEventListener("visibilitychange", function(){ if (!document.hidden) sync(); });
  sync();
})();
</script></body></html>
