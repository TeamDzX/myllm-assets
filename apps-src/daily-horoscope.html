<script>
(function(){if(window.__myllmAiWrap||typeof window.myllmAsk!=='function')return;window.__myllmAiWrap=true;
var orig=window.myllmAsk,depth=0,node=null;
function ensure(){if(node)return;node=document.createElement('div');node.className='myllm-ai-busy';
node.innerHTML='<span class="myllm-ai-cog"></span><span>AI is thinking\u2026 <small>privately, on your device</small></span>';
(document.body||document.documentElement).appendChild(node);}
function show(){ensure();depth++;node.classList.add('on');}
function hide(){depth=Math.max(0,depth-1);if(depth===0&&node)node.classList.remove('on');}
window.myllmAsk=function(){show();var p;try{p=orig.apply(this,arguments);}catch(e){hide();throw e;}

<script>
/* Bridges are looked up when used, never kept: MyLLM can add them after this
   script has run. */
function store(){return window.myllmStorage||{getItem:function(){return Promise.resolve(null)},setItem:function(){return Promise.resolve()}}}
function haptic(k){if(window.myllmHaptic)try{myllmHaptic(k)}catch(e){}}
function zg(name){return '<svg class="z"><use href="#z-'+String(name).toLowerCase()+'"/></svg>'}
function icon(n){return '<svg class="i"><use href="#i-'+n+'"/></svg>'}
var SIGNS=[
 {n:'Aries',s:'♈',d:'Mar 21–Apr 19'},{n:'Taurus',s:'♉',d:'Apr 20–May 20'},
 {n:'Gemini',s:'♊',d:'May 21–Jun 20'},{n:'Cancer',s:'♋',d:'Jun 21–Jul 22'},
 {n:'Leo',s:'♌',d:'Jul 23–Aug 22'},{n:'Virgo',s:'♍',d:'Aug 23–Sep 22'},
 {n:'Libra',s:'♎',d:'Sep 23–Oct 22'},{n:'Scorpio',s:'♏',d:'Oct 23–Nov 21'},
 {n:'Sagittarius',s:'♐',d:'Nov 22–Dec 21'},{n:'Capricorn',s:'♑',d:'Dec 22–Jan 19'},
 {n:'Aquarius',s:'♒',d:'Jan 20–Feb 18'},{n:'Pisces',s:'♓',d:'Feb 19–Mar 20'}];
var chosen=null,cache={};
function el(i){return document.getElementById(i)}
function setStatus(t,err){var s=el('status');s.textContent=t||'';s.classList.toggle('err',!!err)}
function todayKey(){return new Date().toDateString()}
function todayLabel(){return new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}
function goBtn(busy){var b=el('go');b.disabled=!!busy;
  b.innerHTML=busy?'<i class="spin"></i><span>Reading the stars…</span>':icon('spark')+'<span>Today\u2019s horoscope</span>'}

function renderGrid(){
  var G=el('grid');G.innerHTML='';
  SIGNS.forEach(function(sg){
    var d=document.createElement('button');d.type='button';d.className='sign'+(chosen===sg.n?' on':'');
    d.setAttribute('aria-pressed',chosen===sg.n);
    d.innerHTML='<span class="g">'+zg(sg.n)+'</span><span class="nm">'+sg.n+'</span><span class="dt">'+sg.d+'</span>';
    d.onclick=function(){chosen=sg.n;store().setItem('sign',sg.n);haptic('selection');renderGrid();showCached()};
    G.appendChild(d);
  });
}
function signObj(){return SIGNS.filter(function(s){return s.n===chosen})[0]}
function paintHero(){
  var sg=signObj();
  el('hWhen').textContent=todayLabel();
  if(sg){el('hTile').innerHTML=zg(sg.n);el('hName').textContent=sg.n;el('hDates').textContent=sg.d}
}
function showReading(text){
  paintHero();
  var r=el('reading');r.textContent=text;r.hidden=false;
}
function showCached(){
  el('reading').hidden=true;paintHero();setStatus('');
  if(chosen&&cache[chosen]&&cache[chosen].key===todayKey())showReading(cache[chosen].text);
}
function reveal(){
  if(!chosen){setStatus('Tap your star sign first.',true);return}
  if(cache[chosen]&&cache[chosen].key===todayKey()){showReading(cache[chosen].text);return}
  if(!window.myllmAsk){setStatus('Horoscopes need AI — update MyLLM and enable “Allow apps to use the AI” in Settings.',true);return}
  goBtn(true);setStatus('');
  myllmAsk('Write a fun, upbeat daily horoscope for '+chosen+' for '+todayLabel()+'. 3–4 sentences covering mood, love and one piece of practical advice. Light and positive, no preamble.',
           {system:'You are a playful astrologer writing short, entertaining daily horoscopes.'})
  .then(function(reply){
    cache[chosen]={key:todayKey(),text:reply.trim()};store().setItem('cache',JSON.stringify(cache));
    showReading(reply.trim());setStatus('');haptic('success');
  }).catch(function(err){setStatus('Could not read the stars: '+err.message,true)})
  .then(function(){goBtn(false)});
}

goBtn(false);paintHero();
Promise.all([store().getItem('sign'),store().getItem('cache')]).then(function(r){
  if(r[0])chosen=r[0];
  if(r[1])try{cache=JSON.parse(r[1])}catch(e){}
  renderGrid();showCached();
});

/* myllm-fullscreen-v2 — full screen where MyLLM can also close the app for us
   (myllmClose, 5.6.2+): full screen hides MyLLM's Done, and a page with no way
   out is worse than a repeated title, so elsewhere nothing changes.
   The spacer keeps the header clear of the status bar / Dynamic Island. It is
   live CSS — env(safe-area-inset-top) — not a measured number: the inset is
   still 0 when the page loads and only grows once MyLLM's bar has gone (v1
   measured once, so the title sat under the island). If the page's own styles
   already pad the header down by the inset, the spacer stays at 0. */
(function(){
  function full(){ return !!(window.myllmClose && window.myllmImmersive); }
  /* Does any rule that applies to the header or an ancestor already use the top inset? */
  function pageHandlesInset(head){
    var chain = [], n, found = false;
    for (n = head; n && n.nodeType === 1; n = n.parentElement) chain.push(n);
    function walk(rules){
      for (var i = 0; i < rules.length && !found; i++){
        var r = rules[i];
        if (r.cssRules && !r.selectorText) { walk(r.cssRules); continue; }
        if (!r.selectorText || !/safe-area-inset-top/.test(r.cssText) || !/(padding|margin|top)\s*:/.test(r.cssText)) continue;
        if (/\.imm-safe/.test(r.selectorText)) continue;
        for (var k = 0; k < chain.length; k++){
          try { if (chain[k].matches(r.selectorText)) { found = true; break; } } catch(e){}
        }
      }
    }
    for (var s = 0; s < document.styleSheets.length && !found; s++){
      try { walk(document.styleSheets[s].cssRules); } catch(e){}
    }
    for (n = head; n && n.nodeType === 1 && !found; n = n.parentElement){
      if (/safe-area-inset-top/.test(n.getAttribute("style") || "")) found = true;
    }
    return found;
  }
  function fit(){
    var sp = document.querySelector(".imm-safe"), head = document.querySelector(".head");
    if (!sp || !head) return;
    sp.style.height = (document.body.classList.contains("imm") && !pageHandlesInset(head)) ? "env(safe-area-inset-top)" : "0px";
  }
  function sync(){
    var f = full();
    document.body.classList.toggle("imm", f);
    fit();
    if (!f) return;
    try { window.myllmImmersive(true, { keepAwake:false }).catch(function(){}); } catch(e){}
  }
  window.myllmFSClose = function(){
    try { if (window.myllmHaptic) window.myllmHaptic("light"); } catch(e){}
    try { window.myllmClose().catch(function(){}); } catch(e){}
  };
  document.addEventListener("visibilitychange", function(){ if (!document.hidden) sync(); });
  sync();
})();
</script></body></html>
