--><html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Story Studio</title>
<style>
:root{--build-id:"1ee9b8844e";
  color-scheme:light dark;
  --bg:var(--myllm-bg,#f2f2f7);--surface:var(--myllm-surface,#fff);
  --text:var(--myllm-text,#111);--muted:var(--myllm-muted,#6b6b72);
  --accent:var(--myllm-accent,#0b5ed7);--border:var(--myllm-border,rgba(120,120,128,.25));
  --radius:var(--myllm-radius,14px);--font:var(--myllm-font,-apple-system,system-ui,sans-serif);
}
@media(prefers-color-scheme:dark){:root{--bg:var(--myllm-bg,#000);--surface:var(--myllm-surface,#1c1c1e);--text:var(--myllm-text,#eee);--muted:var(--myllm-muted,#98989f)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);display:flex;flex-direction:column}
.head{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.head h1{margin:0;font-size:19px;font-weight:700;flex:1}
.head button{border:0;background:none;color:var(--accent);font:inherit;font-weight:600;font-size:14px;cursor:pointer;padding:6px}
#story{flex:1;width:100%;border:0;outline:0;resize:none;padding:18px 16px;font-family:Georgia,serif;font-size:17px;line-height:1.6;background:var(--bg);color:var(--text)}
.start{padding:24px 16px;max-width:520px;margin:0 auto;width:100%}
.start h2{font-size:18px;margin:0 0 4px}.start p{color:var(--muted);margin:0 0 16px;font-size:14px}
.genres{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.gchip{border:1px solid var(--border);background:var(--surface);color:var(--muted);border-radius:999px;padding:7px 13px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.gchip.on{background:var(--accent);color:#fff;border-color:transparent}
input[type=text]{width:100%;padding:13px;border:1px solid var(--border);border-radius:11px;font:inherit;font-size:16px;background:var(--surface);color:var(--text)}
.bar{border-top:1px solid var(--border);background:var(--surface);padding:10px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}.bar::-webkit-scrollbar{display:none}
.bar button{flex:none;border:0;border-radius:10px;padding:11px 15px;font:inherit;font-weight:600;font-size:14px;cursor:pointer;background:var(--bg);border:1px solid var(--border);color:var(--text)}
.bar button.primary{background:var(--accent);color:#fff;border-color:transparent}
.bar button:disabled{opacity:.4}
.foot{display:flex;justify-content:space-between;padding:6px 16px;font-size:12px;color:var(--muted)}
#err{color:#e04848;font-size:13px;padding:0 16px 8px;display:none}
.dots:after{content:'';animation:d 1.2s steps(4,end) infinite}
@keyframes d{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
</style>
</head>
<body>
<div class="head">
  <h1>✍️ Story Studio</h1>
  <button id="shareBtn">Share</button>
  <button id="newBtn">New</button>
</div>

<div class="start" id="startView">
  <h2>Start a story</h2>
  <p>Pick a vibe and give it a spark — your on-device AI writes the opening, then you steer.</p>
  <div class="genres" id="genres"></div>
  <input type="text" id="seed" placeholder="e.g. a lighthouse keeper finds a door in the sea">
  <button class="gchip primary" id="startBtn" style="margin-top:14px;width:100%;padding:13px;font-size:15px;background:var(--accent);color:#fff;border:0">Begin ✨</button>
  <div id="err"></div>
</div>

<textarea id="story" placeholder="Your story will appear here…" style="display:none"></textarea>
<div class="foot" id="foot" style="display:none"><span id="wc">0 words</span><span id="status"></span></div>
<div class="bar" id="bar" style="display:none">
  <button class="primary" data-a="continue">Continue</button>
  <button data-a="twist">Plot twist</button>
  <button data-a="character">New character</button>
  <button data-a="scene">New scene</button>
  <button data-a="describe">Describe</button>
</div>

<script>
var GENRES=["Any","Fantasy","Sci-fi","Mystery","Romance","Horror","Adventure","Fairy tale"];
var genre="Any",busy=false,confirmNew=false;
var SYS="You are a talented fiction co-writer. Write immersive, vivid prose in the same tense, point of view, voice and style as the existing text. Continue seamlessly from where it leaves off. Output ONLY the new prose — no titles, no notes, no commentary, no surrounding quotation marks.";
function haptic(k){if(window.myllmHaptic)try{myllmHaptic(k)}catch(e){}}
function $(i){return document.getElementById(i)}
function showErr(t){var e=$('err');e.style.display=t?'block':'none';e.textContent=t||''}

function buildGenres(){
  var g=$('genres');g.innerHTML='';
  GENRES.forEach(function(x){var b=document.createElement('button');b.className='gchip'+(x===genre?' on':'');b.textContent=x;
    b.onclick=function(){genre=x;haptic('selection');buildGenres()};g.appendChild(b)});
}
function wc(){var t=$('story').value.trim();var n=t?t.split(/\s+/).length:0;$('wc').textContent=n+(n===1?' word':' words')}

function showEditor(){
  $('startView').style.display='none';
  $('story').style.display='block';$('bar').style.display='flex';$('foot').style.display='flex';
  wc();
}
function ask(prompt){
  if(!window.myllmAsk){showErr('Story Studio needs the on-device AI. Update MyLLM and turn on “Allow apps to use the AI” in Settings → MyLLMos Apps.');return Promise.reject()}
  return myllmAsk(prompt,{system:SYS});
}
function setBusy(b,label){
  busy=b;
  document.querySelectorAll('#bar button,#startBtn').forEach(function(e){e.disabled=b});
  $('status').innerHTML=b?('<span class="dots">'+(label||'Writing')+'</span>'):'';
}

$('startBtn').onclick=function(){
  if(busy)return;var spark=$('seed').value.trim();showErr('');
  var g=genre==='Any'?'':(' '+genre.toLowerCase());
  var p='Write the opening paragraph (4-6 sentences) of an engaging'+g+' story'+(spark?(' about: '+spark):'')+'. Make it vivid and end on a moment of momentum that invites continuation.';
  setBusy(true,'Writing the opening');
  ask(p).then(function(r){
    showEditor();$('story').value=(r||'').trim();wc();save();haptic('success');
  }).catch(function(e){if(e)showErr('The AI didn’t respond. Try again.')}).then(function(){setBusy(false)});
};

var PROMPTS={
  continue:"Continue the story with one short paragraph (3-5 sentences). Just write what happens next.",
  twist:"Continue the story with one short paragraph that introduces a surprising but believable plot twist.",
  character:"Continue the story by bringing in a new, vivid character right now — one short paragraph.",
  scene:"Begin a new scene in a different time or place, picking up the thread — one short paragraph.",
  describe:"Add one short paragraph of rich, sensory description of the current setting or mood, without advancing the plot much."
};
document.querySelectorAll('#bar button').forEach(function(btn){
  btn.onclick=function(){
    if(busy)return;showErr('');
    var a=btn.getAttribute('data-a');
    var story=$('story').value.trim();
    var ctx=story.length>1800?story.slice(-1800):story;
    var p='Here is the story so far:\n\n'+ctx+'\n\n'+PROMPTS[a];
    setBusy(true,'Writing');haptic('light');
    ask(p).then(function(r){
      var add=(r||'').trim();if(!add)return;
      var s=$('story');s.value=(s.value.replace(/\s+$/,''))+'\n\n'+add;wc();save();
      s.scrollTop=s.scrollHeight;haptic('success');
    }).catch(function(e){if(e)showErr('The AI didn’t respond. Try again.')}).then(function(){setBusy(false)});
  };
});

$('story').oninput=function(){wc();save()};
$('shareBtn').onclick=function(){var t=$('story').value.trim();if(t&&window.myllmShare){haptic('light');myllmShare(t)}};
$('newBtn').onclick=function(){
  if(busy)return;
  if(!confirmNew){confirmNew=true;$('newBtn').textContent='Clear?';setTimeout(function(){confirmNew=false;$('newBtn').textContent='New'},2500);return}
  confirmNew=false;$('newBtn').textContent='New';
  $('story').value='';save();
  $('startView').style.display='block';$('story').style.display='none';$('bar').style.display='none';$('foot').style.display='none';
  $('seed').value='';haptic('warning');
};

function save(){if(window.myllmStorage)myllmStorage.setItem('story',$('story').value)}
function load(){
  buildGenres();
  if(!window.myllmStorage)return;
  myllmStorage.getItem('story').then(function(v){
    if(v&&v.trim()){$('story').value=v;showEditor()}
  });
}
load();
</script>
</body>
</html>
