--><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Periodic Table</title>
<meta name="myllm:immersive" content="on">
<style>:root{--build-id:"2e9cdc0b13";color-scheme:light dark;
  --bg1:#f5f6fa; --bg2:#e9ecf5; --ink:#141824; --muted:#6b7285; --faint:#a3a9b8; --line:rgba(20,24,40,.09);
  --chip:rgba(20,24,40,.06); --card:#ffffff; --acc:#5b5bf0; --acc2:#8b5cf6; --sheet:#ffffff;
  --shadow:0 1px 0 rgba(255,255,255,.8) inset,0 2px 6px rgba(30,35,60,.08);
  --L:88%; --Lb:72%; --Lt:22%; --S:78%; --St:55%;
  --font:-apple-system,"SF Pro Text",system-ui,sans-serif; --round:-apple-system,"SF Pro Rounded","SF Pro Display",system-ui,sans-serif; }
@media (prefers-color-scheme:dark){ :root{
  --bg1:#0a0c12; --bg2:#151926; --ink:#eef0f6; --muted:#8d94a8; --faint:#555c70; --line:rgba(255,255,255,.08);
  --chip:rgba(255,255,255,.07); --card:#171b27; --sheet:#141824;
  --shadow:0 1px 0 rgba(255,255,255,.06) inset,0 3px 8px rgba(0,0,0,.35);
  --L:21%; --Lb:36%; --Lt:88%; --S:48%; --St:80%; } }
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:var(--font);color:var(--ink);background:radial-gradient(130% 60% at 50% 0%,var(--bg2),var(--bg1) 70%);background-color:var(--bg1);
  height:100vh;height:100dvh;display:flex;flex-direction:column;touch-action:manipulation;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

/* Header */
.head{display:flex;align-items:center;gap:10px;padding:8px 14px 6px;flex-shrink:0}
.tile{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex-shrink:0;
  background:linear-gradient(145deg,#7c7cff,#a855f7);box-shadow:0 4px 12px rgba(124,92,255,.32)}
.tile svg{width:20px;height:20px;color:#fff}
.ht{min-width:0;flex:1}
.ht h1{font-size:17px;line-height:1.3;font-weight:650;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{display:flex;gap:8px;align-items:center}
.hbtn{height:36px;min-width:36px;padding:0 10px;border-radius:11px;background:var(--chip);display:grid;place-items:center;
  font-size:13px;font-weight:650;color:var(--ink);transition:transform .12s,background .2s}
.hbtn:active{transform:scale(.93)}
.hbtn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hbtn.on{background:linear-gradient(145deg,#7c7cff,#a855f7);color:#fff}

/* Search */
.search{display:none;padding:0 14px 8px;flex-shrink:0;position:relative}
body.searching .search{display:block}
.search input{width:100%;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);
  font:inherit;font-size:16px;padding:0 12px 0 36px;outline:none;-webkit-user-select:text;user-select:text}
.search input:focus{border-color:var(--acc)}
.search svg{position:absolute;left:26px;top:11px;width:18px;height:18px;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round}
.results{position:absolute;left:14px;right:14px;top:44px;background:var(--sheet);border:1px solid var(--line);border-radius:14px;z-index:6;
  box-shadow:0 12px 30px rgba(0,0,0,.18);max-height:240px;overflow-y:auto;display:none}
.results.show{display:block}
.results button{display:flex;align-items:center;gap:12px;width:100%;padding:9px 12px;text-align:left;border-bottom:1px solid var(--line)}
.results button:last-child{border-bottom:0}
.results .rs{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-weight:700;font-size:15px}
.results .rn{font-size:15px;line-height:1.35}
.results .rz{font-size:12.5px;color:var(--muted);line-height:1.35}
.results .none{padding:14px;color:var(--muted);font-size:14px}

/* Mode chips */
.modes{display:flex;gap:6px;overflow-x:auto;padding:0 14px 8px;flex-shrink:0;scrollbar-width:none}
.modes::-webkit-scrollbar{display:none}
.modes button{flex-shrink:0;height:32px;padding:0 12px;border-radius:999px;background:var(--chip);font-size:13.5px;font-weight:600;color:var(--muted);transition:.2s}
.modes button.on{background:var(--ink);color:var(--bg1)}

/* Legend */
.legend{flex-shrink:0;padding:0 14px 8px;min-height:40px}
.cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:1px}
.cats::-webkit-scrollbar{display:none}
.cats button{flex-shrink:0;display:flex;align-items:center;gap:6px;height:30px;padding:0 10px 0 8px;border-radius:9px;background:var(--chip);
  font-size:12.5px;font-weight:600;color:var(--ink);transition:opacity .2s,transform .12s}
.cats button i{width:12px;height:12px;border-radius:4px;display:block}
.cats button.off{opacity:.38}
.cats button:active{transform:scale(.95)}
.grad{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted);line-height:1.35}
.grad .bar{flex:1;height:12px;border-radius:6px}
.grad b{color:var(--ink);font-weight:600;white-space:nowrap}
.temp{display:flex;align-items:center;gap:10px}
.temp input{flex:1;accent-color:var(--acc);height:28px}
.temp .tv{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;min-width:84px;text-align:right;line-height:1.35}
.temp .unit{height:28px;padding:0 9px;border-radius:8px;background:var(--chip);font-size:12.5px;font-weight:700}
.states{display:flex;gap:12px;margin-top:6px;font-size:12.5px;color:var(--muted);line-height:1.35}
.states span{display:flex;align-items:center;gap:5px}
.states i{width:11px;height:11px;border-radius:3px;display:block}

/* Table */
.stage{position:relative;flex:1;min-height:0}
.scroller{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;overscroll-behavior:contain;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.table{--t:52px;--g:4px;display:grid;grid-template-columns:repeat(18,var(--t));grid-template-rows:repeat(7,var(--t)) calc(var(--t)*.34) repeat(2,var(--t));
  gap:var(--g);padding:8px 14px calc(84px + env(safe-area-inset-bottom));width:max-content;margin:0 auto}
.el{position:relative;border-radius:calc(var(--t)*.16);background:hsl(var(--h) var(--S) var(--L));color:hsl(var(--h) var(--St) var(--Lt));
  box-shadow:var(--shadow),0 0 0 1px hsl(var(--h) calc(var(--S) - 10%) var(--Lb)) inset;display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:opacity .25s,transform .12s,filter .25s;overflow:hidden;line-height:1.15}
.el.heat{background:var(--hc);color:var(--ht);box-shadow:var(--shadow)}
.el.nodata{background:repeating-linear-gradient(135deg,var(--chip) 0 5px,transparent 5px 10px);color:var(--muted);box-shadow:0 0 0 1px var(--line) inset}
.el:active{transform:scale(.93)}
.el.dim{opacity:.16;filter:saturate(.3)}
.el.hit{box-shadow:0 0 0 2px var(--acc),0 6px 16px rgba(91,91,240,.35)}
.el .z{position:absolute;left:calc(var(--t)*.09);top:calc(var(--t)*.06);font-size:calc(var(--t)*.18);font-weight:600;opacity:.8;font-variant-numeric:tabular-nums}
.el .s{font-family:var(--round);font-size:calc(var(--t)*.4);font-weight:700;letter-spacing:-.02em;margin-top:calc(var(--t)*.06)}
.el .n{font-size:calc(var(--t)*.14);font-weight:500;opacity:.85;max-width:94%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:calc(var(--t)*.01)}
.el .fav{position:absolute;right:calc(var(--t)*.08);top:calc(var(--t)*.05);font-size:calc(var(--t)*.17);color:#f5a623}
.table.small .el .n,.table.small .el .z{display:none}
.table.small .el .s{margin-top:0;font-size:calc(var(--t)*.46)}
.ph{border-radius:calc(var(--t)*.16);display:grid;place-items:center;font-size:calc(var(--t)*.2);font-weight:650;color:var(--muted);
  background:var(--chip);box-shadow:0 0 0 1px var(--line) inset;line-height:1.2;text-align:center}
.gapcard{grid-column:3 / 13;grid-row:1 / 4;align-self:stretch;margin:calc(var(--t)*.05) calc(var(--t)*.25) calc(var(--t)*.2);display:flex;align-items:center;gap:calc(var(--t)*.3);
  padding:0 calc(var(--t)*.2);border-radius:calc(var(--t)*.24);overflow:hidden}
.gapcard .big{width:calc(var(--t)*2.3);height:calc(var(--t)*2.3);border-radius:calc(var(--t)*.3);flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:hsl(var(--h,250) var(--S) var(--L));color:hsl(var(--h,250) var(--St) var(--Lt));box-shadow:var(--shadow),0 0 0 1px hsl(var(--h,250) calc(var(--S) - 10%) var(--Lb)) inset;line-height:1.15;cursor:pointer}
.gapcard .big .s{font-family:var(--round);font-size:calc(var(--t)*1);font-weight:750;letter-spacing:-.03em}
.gapcard .big .z{font-size:calc(var(--t)*.26);font-weight:650;opacity:.8}
.gapcard .info{min-width:0}
.gapcard .info h2{font-size:calc(var(--t)*.42);line-height:1.25;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gapcard .info p{font-size:calc(var(--t)*.25);line-height:1.4;color:var(--muted)}
.gapcard .info p b{color:var(--ink);font-weight:600}
.table.small .gapcard .info p.more{display:none}
.zoom{position:absolute;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;gap:2px;padding:4px;border-radius:14px;background:var(--sheet);
  box-shadow:0 8px 24px rgba(0,0,0,.18),0 0 0 1px var(--line) inset;z-index:4}
.zoom button{width:40px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--ink)}
.zoom button:active{background:var(--chip)}
.zoom svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.aboutlink{position:absolute;left:14px;bottom:calc(14px + env(safe-area-inset-bottom));height:44px;padding:0 14px;border-radius:14px;background:var(--sheet);
  box-shadow:0 8px 24px rgba(0,0,0,.18),0 0 0 1px var(--line) inset;font-size:13px;font-weight:600;color:var(--muted);z-index:4;display:flex;align-items:center;gap:6px}
.aboutlink svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}

/* Sheets */
.scrim{position:fixed;inset:0;background:rgba(5,8,20,.45);opacity:0;pointer-events:none;transition:opacity .28s;z-index:10}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;background:var(--sheet);border-radius:24px 24px 0 0;max-height:90%;max-height:90dvh;
  display:flex;flex-direction:column;transform:translateY(105%);transition:transform .34s cubic-bezier(.2,.85,.25,1);box-shadow:0 -12px 40px rgba(0,0,0,.28);
  padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
.sheet.open{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:var(--faint);opacity:.6;margin:8px auto 2px;flex-shrink:0}
.sbody{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 18px calc(22px + env(safe-area-inset-bottom));overscroll-behavior:contain}
.sclose{position:absolute;right:14px;top:12px;width:32px;height:32px;border-radius:50%;background:var(--chip);display:grid;place-items:center;z-index:2}
.sclose svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}
@media (min-width:700px){ .sheet{left:50%;right:auto;width:640px;margin-left:-320px} }

.hero{display:flex;gap:16px;align-items:center;margin:4px 0 14px}
.card{width:128px;height:128px;border-radius:24px;flex-shrink:0;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(160deg,hsl(var(--h) var(--S) calc(var(--L) + 3%)),hsl(var(--h) var(--S) var(--L)));color:hsl(var(--h) var(--St) var(--Lt));
  box-shadow:0 10px 26px hsl(var(--h) 60% 40% / .25),0 0 0 1px hsl(var(--h) calc(var(--S) - 10%) var(--Lb)) inset;line-height:1.15}
.card .z{position:absolute;left:12px;top:9px;font-size:15px;font-weight:700;opacity:.8}
.card .m{position:absolute;right:12px;top:10px;font-size:11.5px;font-weight:600;opacity:.75}
.card .s{font-family:var(--round);font-size:56px;font-weight:750;letter-spacing:-.03em;margin-top:6px}
.card .n{font-size:13px;font-weight:600;opacity:.85}
.bohr{flex:1;min-width:0;display:grid;place-items:center}
.bohr svg{width:100%;max-width:150px;height:auto;overflow:visible}
.orb{transform-origin:80px 80px;animation:spin linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.dname{font-size:26px;line-height:1.25;font-weight:750;letter-spacing:-.02em}
.dsub{font-size:14px;line-height:1.4;color:var(--muted);margin-top:2px}
.drow{display:flex;gap:8px;margin:14px 0 4px}
.drow button{flex:1;height:42px;border-radius:12px;background:var(--chip);font-size:14.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
.drow button svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.drow button.star.on{color:#f5a623}
.drow button.star.on svg{fill:#f5a623;stroke:#f5a623}
.drow .ask{background:linear-gradient(145deg,#7c7cff,#a855f7);color:#fff}
.props{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.prop{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}
.prop.wide{grid-column:1 / -1}
.prop .k{font-size:11.5px;font-weight:650;letter-spacing:.3px;text-transform:uppercase;color:var(--muted);line-height:1.4}
.prop .v{font-size:17px;font-weight:600;line-height:1.35;margin-top:2px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.prop .v small{font-size:12.5px;font-weight:500;color:var(--muted)}
.prop .v sup{font-size:.62em;line-height:0}
.aiout{margin-top:14px;border-radius:16px;padding:14px;background:linear-gradient(160deg,rgba(124,124,255,.12),rgba(168,85,247,.08));border:1px solid rgba(124,124,255,.25);display:none}
.aiout.show{display:block}
.aiout h3{font-size:13px;font-weight:700;letter-spacing:.3px;color:var(--acc);text-transform:uppercase;line-height:1.4}
.aiout .txt{font-size:15.5px;line-height:1.55;margin-top:6px;white-space:pre-wrap;-webkit-user-select:text;user-select:text}
.aiout .note{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.4}
.dots span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--acc);margin-right:4px;animation:bob 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes bob{50%{transform:translateY(-4px);opacity:.5}}

/* Quiz + About */
.qh{font-size:22px;font-weight:750;line-height:1.3;margin:6px 40px 4px 0}
.qp{font-size:14px;color:var(--muted);line-height:1.4}
.qbar{height:6px;border-radius:3px;background:var(--chip);margin:12px 0 16px;overflow:hidden}
.qbar i{display:block;height:100%;background:linear-gradient(90deg,#7c7cff,#a855f7);transition:width .3s}
.qq{font-size:19px;font-weight:650;line-height:1.4;margin-bottom:14px;text-align:center}
.qbig{width:112px;height:112px;margin:0 auto 14px;border-radius:22px;display:grid;place-items:center;font-family:var(--round);font-size:52px;font-weight:750;
  background:hsl(var(--h) var(--S) var(--L));color:hsl(var(--h) var(--St) var(--Lt));box-shadow:var(--shadow),0 0 0 1px hsl(var(--h) calc(var(--S) - 10%) var(--Lb)) inset;line-height:1.2}
.qopts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qopts button{min-height:54px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:16px;font-weight:600;line-height:1.3;padding:8px;transition:transform .1s,background .2s}
.qopts button:active{transform:scale(.97)}
.qopts button.right{background:#22c55e;color:#fff;border-color:#22c55e}
.qopts button.wrong{background:#ef4444;color:#fff;border-color:#ef4444}
.qend{text-align:center;padding:10px 0}
.qend .score{font-size:56px;font-weight:800;font-family:var(--round);line-height:1.2;background:linear-gradient(145deg,#7c7cff,#a855f7);-webkit-background-clip:text;background-clip:text;color:transparent}
.qend p{color:var(--muted);font-size:15px;line-height:1.45;margin-top:4px}
.bigbtn{width:100%;height:50px;border-radius:14px;background:linear-gradient(145deg,#7c7cff,#a855f7);color:#fff;font-size:16.5px;font-weight:650;margin-top:16px}
.about h2{font-size:22px;font-weight:750;line-height:1.3;margin:6px 40px 10px 0}
.about p{font-size:15px;line-height:1.55;color:var(--ink);margin-bottom:10px}
.about p.m{color:var(--muted);font-size:13.5px}
.about a{color:var(--acc)}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 58px);transform:translate(-50%,-8px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg1);
  font-size:13px;font-weight:600;padding:7px 12px;border-radius:10px;transition:.25s;z-index:20;line-height:1.35}
.toast.show{opacity:1;transform:translate(-50%,0)}
.bar{display:contents}
@media (orientation:landscape) and (max-height:560px){
  .head{padding-top:4px;padding-bottom:4px}
  .bar{display:flex;align-items:flex-start;gap:10px;padding:0 14px 4px;flex-shrink:0}
  .bar .modes{flex:1.15;min-width:0;padding:0}
  .bar .legend{flex:1;min-width:0;padding:0;min-height:32px}
  .states{margin-top:3px}
  .aboutlink{height:36px;width:36px;padding:0;justify-content:center;font-size:0;gap:0;border-radius:11px}
  .aboutlink svg{width:17px;height:17px}
  .zoom{padding:3px;border-radius:12px}
  .zoom button{width:34px;height:30px}
  .table{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
}
@media (prefers-reduced-motion:reduce){ .orb{animation:none} .sheet,.scrim,.el{transition:none} .dots span{animation:none} }

/* myllm-fullscreen-v2 — MyLLM 5.6.2+ opens this app full screen; the ✕ is the way out. */
.head .imm-acts{display:none;flex-shrink:0;margin-left:auto}
.head .acts + .imm-acts{margin-left:0}
body.imm .head .imm-acts{display:flex}
.head .imm-acts button{width:36px;height:36px;border-radius:11px;border:1px solid var(--line);
  background:var(--chip);color:var(--ink);display:grid;place-items:center;padding:0;cursor:pointer;transition:transform .12s}
.head .imm-acts button:active{transform:scale(.94)}
.imm-acts svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}
.imm-safe{display:none}
body.imm .imm-safe{display:block}
</style></head><body>

<div class="imm-safe"></div><div class="head">
  <div class="tile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="2.2" fill="currentColor"/><ellipse cx="12" cy="12" rx="9.5" ry="3.8"/><ellipse cx="12" cy="12" rx="9.5" ry="3.8" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="9.5" ry="3.8" transform="rotate(120 12 12)"/></svg></div>
  <div class="ht"><h1>Periodic Table</h1></div>
  <div class="acts">
    <button class="hbtn" id="searchBtn" aria-label="Search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></button>
    <button class="hbtn" id="quizBtn" aria-label="Quiz">Quiz</button>
  </div>
<div class="imm-acts"><button type="button" aria-label="Close Periodic Table" onclick="myllmFSClose()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div></div>

<div class="search">
  <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
  <input id="q" type="search" placeholder="Name, symbol or number" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
  <div class="results" id="results"></div>

function num(s){ if(s===''||s==null)return null; var v=parseFloat(s); return isFinite(v)?v:null; }
var ELS=PT_RAW.split('|').map(function(r,i){
  var f=r.split('~');
  return {z:i+1,sym:f[0],nm:f[1],mass:num(f[2]),massTxt:f[2],cpk:f[3],cfg:f[4],en:num(f[5]),rad:num(f[6]),ie:num(f[7]),ea:num(f[8]),
    ox:f[9],st:f[10],mp:num(f[11]),bp:num(f[12]),den:num(f[13]),cat:+f[14],year:f[15]==='A'?0:num(f[15]),yearTxt:f[15]==='A'?'Ancient':f[15],
    shells:f[16].split(',').map(Number),predicted:f[17]==='1'};
});
/* Position in the 18-column layout; La–Lu and Ac–Lr sit in the two f-rows (rows 9 and 10). */
function place(z){
  if(z===1)return [1,1]; if(z===2)return [18,1];
  var starts=[[3,2],[11,3],[19,4],[37,5],[55,6],[87,7]];
  var p=1,s=0; for(var i=0;i<starts.length;i++) if(z>=starts[i][0]){ s=starts[i][0]; p=starts[i][1]; }
  var k=z-s;
  if(p<=3) return [k<2?k+1:k+11,p];
  if(p<=5) return [k+1,p];
  if(k<2) return [k+1,p];
  if(k<17) return [3+(k-2),p===6?9:10];      // f-row
  return [k-13,p];
}
ELS.forEach(function(e){ var pg=place(e.z); e.g=pg[0]; e.row=pg[1]; e.period=pg[1]>7?(pg[1]===9?6:7):pg[1]; e.group=pg[1]>7?null:pg[0]; });

var S={mode:'cat',off:{},favs:{},favOnly:false,tempK:298,unitC:false,t:null,best:0,last:26};

function save(){
  var d=JSON.stringify({mode:S.mode,favs:Object.keys(S.favs).map(Number),tempK:S.tempK,unitC:S.unitC,t:S.t,best:S.best,last:S.last});
  try{ if(window.myllmStorage){ myllmStorage.setItem(STORE,d); return; } }catch(e){}
  try{ localStorage.setItem(STORE,d); }catch(e){}
}
function load(done){
  function apply(v){ if(v){ try{ var d=JSON.parse(v);
    if(MODES.some(function(m){return m[0]===d.mode}))S.mode=d.mode;
    (d.favs||[]).forEach(function(z){ if(z>=1&&z<=118)S.favs[z]=1; });
    if(typeof d.tempK==='number')S.tempK=Math.max(0,Math.min(6000,d.tempK)); S.unitC=!!d.unitC;
    if(typeof d.t==='number')S.t=d.t; if(typeof d.best==='number')S.best=d.best; if(d.last>=1&&d.last<=118)S.last=d.last; }catch(e){} }
    done(); }
  try{ if(window.myllmStorage){ myllmStorage.getItem(STORE).then(apply,function(){apply(null)}); return; } }catch(e){}
  var v=null; try{ v=localStorage.getItem(STORE); }catch(e){} apply(v);
}

/* ---------- Modes + colour ---------- */
var MODES=[
  ['cat','Category'],
  ['en','Electronegativity',function(e){return e.en},'Pauling',false],
  ['rad','Atomic radius',function(e){return e.rad},'pm',false],
  ['mp','Melting point',function(e){return e.mp},'K',false],
  ['den','Density',function(e){return e.den},'g/cm³',true],
  ['year','Discovered',function(e){return e.year},'',false],
  ['state','State']
];
var RAMP=[[49,46,129],[37,99,235],[14,165,164],[132,204,22],[250,204,21],[249,115,22]];
function ramp(t){
  t=Math.max(0,Math.min(1,t)); var x=t*(RAMP.length-1), i=Math.min(RAMP.length-2,Math.floor(x)), f=x-i, a=RAMP[i], b=RAMP[i+1];
  var c=[0,1,2].map(function(k){return Math.round(a[k]+(b[k]-a[k])*f)});
  var lum=(0.299*c[0]+0.587*c[1]+0.114*c[2])/255;
  return {bg:'rgb('+c.join(',')+')',fg:lum>.6?'#15171f':'#ffffff'};
}
function rampCSS(){ return 'linear-gradient(90deg,'+RAMP.map(function(c,i){return 'rgb('+c.join(',')+') '+Math.round(i*100/(RAMP.length-1))+'%'}).join(',')+')'; }
var STATE_COL={solid:{bg:'#64748b',fg:'#fff'},liquid:{bg:'#0ea5e9',fg:'#fff'},gas:{bg:'#f59e0b',fg:'#1b1400'}};
/* Solid, liquid or gas at T kelvin, from the melting and boiling points. */
function stateAt(e,T){
  if(e.mp==null&&e.bp==null)return null;
  if(e.mp!=null&&T<e.mp)return 'solid';
  if(e.bp!=null&&T>=e.bp)return 'gas';
  if(e.mp==null&&e.bp!=null)return 'liquid';
  if(e.bp==null)return 'liquid';
  return 'liquid';
}
function modeDef(){ for(var i=0;i<MODES.length;i++)if(MODES[i][0]===S.mode)return MODES[i]; return MODES[0]; }
function range(def){
  var vs=ELS.map(def[2]).filter(function(v){return v!=null&&(S.mode!=='year'||v>0)});
  var lo=Math.min.apply(null,vs), hi=Math.max.apply(null,vs);
  return {lo:lo,hi:hi,log:def[4]};
}
function heatT(v,r){ if(r.log){ return (Math.log(v)-Math.log(r.lo))/(Math.log(r.hi)-Math.log(r.lo)); } return (v-r.lo)/(r.hi-r.lo); }

/* ---------- Formatting ---------- */
function toC(k){ return k-273.15; }
function tempTxt(k){ if(k==null)return '—'; return S.unitC? fmtN(toC(k),1)+' °C' : fmtN(k,2)+' K'; }
function fmtN(v,d){ var r=Math.round(v*Math.pow(10,d))/Math.pow(10,d); return String(r).replace('-','−'); }
function cfgHTML(c){ return esc(c).replace(/([spdf])(\d+)/g,'$1<sup>$2</sup>'); }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]}); }

/* ---------- Build the table ---------- */
var tableEl=$('table'), scroller=$('scroller');

    t.classList.toggle('hit',!!(q&&q[e.z]));
    var fav=t.querySelector('.fav');
    if(S.favs[e.z]&&!fav){ fav=document.createElement('span'); fav.className='fav'; fav.textContent='★'; t.appendChild(fav); }
    else if(!S.favs[e.z]&&fav)fav.remove();
  });
}
function renderGap(){
  var e=ELS[S.last-1], g=$('gapcard'), line='';
  if(S.mode==='cat')line='<b>'+CATS[e.cat]+'</b> · period '+e.period+(e.group?' · group '+e.group:'');
  else if(S.mode==='state'){ var st=stateAt(e,S.tempK); line='At <b>'+tempTxt(S.tempK)+'</b>: <b>'+(st?st[0].toUpperCase()+st.slice(1):'unknown')+'</b>'; }
  else { var def=modeDef(), v=def[2](e); line=def[1]+': <b>'+(v==null?'no data':(S.mode==='year'&&v===0?'Ancient':fmtVal(v)))+'</b>'; }
  g.style.setProperty('--h',CAT_HUE[e.cat]);
  g.innerHTML='<div class="big" data-z="'+e.z+'"><span class="z">'+e.z+'</span><span class="s">'+e.sym+'</span></div>'
    +'<div class="info"><h2>'+e.nm+'</h2><p>'+line+'</p><p class="more">'+(e.mass!=null?e.massTxt+' u · ':'')+cfgHTML(e.cfg)+'</p></div>';
}
function renderAll(){ renderModes(); renderLegend(); paint(); renderGap(); }

/* ---------- Zoom (buttons + pinch) ---------- */
function fitT(){
  var w=scroller.clientWidth-28, g=4;
  return Math.max(18,Math.floor((w-17*g)/18));
}
function setT(t,anchor){
  t=Math.max(18,Math.min(110,t));
  var old=parseFloat(getComputedStyle(tableEl).getPropertyValue('--t'))||52;
  var ax=anchor?anchor.x:scroller.clientWidth/2, ay=anchor?anchor.y:scroller.clientHeight/2;
  var cx=(scroller.scrollLeft+ax-14)/(old+4), cy=(scroller.scrollTop+ay-8)/(old+4);
  tableEl.style.setProperty('--t',t+'px');
  tableEl.style.setProperty('--g',(t<34?2:t<48?3:4)+'px');
  tableEl.classList.toggle('small',t<40);
  scroller.scrollLeft=cx*(t+4)-ax+14; scroller.scrollTop=cy*(t+4)-ay+8;
  S.t=t;
}
$('zIn').addEventListener('click',function(){ haptic(); setT((S.t||52)*1.25); save(); });
$('zOut').addEventListener('click',function(){ haptic(); setT((S.t||52)/1.25); save(); });
$('zFit').addEventListener('click',function(){ haptic(); setT(fitT()); scroller.scrollLeft=0; scroller.scrollTop=0; save(); });
var pinch=null;
function dist(ts){ var dx=ts[0].clientX-ts[1].clientX, dy=ts[0].clientY-ts[1].clientY; return Math.sqrt(dx*dx+dy*dy); }
scroller.addEventListener('touchstart',function(e){
  if(e.touches.length===2){ var r=scroller.getBoundingClientRect();
    pinch={d:dist(e.touches),t:S.t||52,x:(e.touches[0].clientX+e.touches[1].clientX)/2-r.left,y:(e.touches[0].clientY+e.touches[1].clientY)/2-r.top}; }
},{passive:true});
scroller.addEventListener('touchmove',function(e){
  if(pinch&&e.touches.length===2){ e.preventDefault(); setT(pinch.t*dist(e.touches)/pinch.d,{x:pinch.x,y:pinch.y}); }
},{passive:false});
scroller.addEventListener('touchend',function(e){ if(pinch&&e.touches.length<2){ pinch=null; save(); } });
['gesturestart','gesturechange'].forEach(function(n){ document.addEventListener(n,function(e){ e.preventDefault(); }); });

/* ---------- Tap an element ---------- */
tableEl.addEventListener('click',function(ev){
  var t=ev.target.closest('.el,.big'); if(!t)return;
  openElement(+t.getAttribute('data-z'));
});

/* ---------- Sheets ---------- */
var sheet=$('sheet'), sbody=$('sbody'), sheetKind=null, askToken=0;
function openSheet(kind,html){
  sheetKind=kind; sbody.innerHTML=html; sbody.scrollTop=0;
  $('scrim').classList.add('open'); sheet.classList.add('open');
}
function closeSheet(){ $('scrim').classList.remove('open'); sheet.classList.remove('open'); sheetKind=null; askToken++; }
$('scrim').addEventListener('click',closeSheet);
$('sclose').addEventListener('click',closeSheet);

function bohrSVG(e){
  var sh=e.shells, n=sh.length, R=74, r0=24, step=n>1?(R-r0)/(n-1):0, h='';
  var dark=matchMedia('(prefers-color-scheme:dark)').matches;
  var nuc='hsl('+CAT_HUE[e.cat]+' 70% '+(dark?'58%':'52%')+')';
  for(var i=0;i<n;i++){
    var rr=r0+i*step;
    h+='<circle cx="80" cy="80" r="'+rr.toFixed(1)+'" fill="none" stroke="currentColor" stroke-opacity=".16" stroke-width="1.2"/>';
    var dots='';
    for(var k=0;k<sh[i];k++){ var a=2*Math.PI*k/sh[i]; dots+='<circle cx="'+(80+rr*Math.cos(a)).toFixed(2)+'" cy="'+(80+rr*Math.sin(a)).toFixed(2)+'" r="'+(sh[i]>18?2.1:2.8)+'" fill="'+nuc+'"/>'; }
    h+='<g class="orb" style="animation-duration:'+(8+i*5)+'s;'+(i%2?'animation-direction:reverse':'')+'">'+dots+'</g>';
  }
  h+='<circle cx="80" cy="80" r="14" fill="'+nuc+'"/><text x="80" y="84.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff" font-family="-apple-system,system-ui">'+esc(e.sym)+'</text>';
  return '<svg viewBox="0 0 160 160" role="img" aria-label="Electron shells '+sh.join(', ')+'">'+h+'</svg>';
}
function tempPropInner(e){ var st=stateAt(e,S.tempK);
  return '<div class="k">At '+tempTxt(S.tempK)+'</div><div class="v">'+(st?st[0].toUpperCase()+st.slice(1):'<small>Unknown</small>')+'</div>'; }
/* The open element's "At <temperature>" row follows the slider and the K/°C switch. */
function syncSheetTemp(){ var d=$('dTemp'); if(d&&sheetKind==='el')d.innerHTML=tempPropInner(ELS[+d.getAttribute('data-z')-1]); }
function prop(k,v,wide){ return '<div class="prop'+(wide?' wide':'')+'"><div class="k">'+k+'</div><div class="v">'+v+'</div></div>'; }
function nv(v,unit,d){ return v==null?'<small>Unknown</small>':fmtN(v,d==null?3:d)+(unit?' <small>'+unit+'</small>':''); }
function openElement(z){
  var e=ELS[z-1]; S.last=z; renderGap(); save(); haptic();
  var h='<div class="hero" style="--h:'+CAT_HUE[e.cat]+'"><div class="card"><span class="z">'+e.z+'</span><span class="m">'+(e.mass!=null?e.massTxt:'')+'</span>'
    +'<span class="s">'+e.sym+'</span><span class="n">'+e.nm+'</span></div><div class="bohr">'+bohrSVG(e)+'</div></div>'
    +'<div class="dname">'+e.nm+'</div><div class="dsub">'+CATS[e.cat]+' · period '+e.period+(e.group?' · group '+e.group:' · f-block')+'</div>'
    +'<div class="drow"><button id="dPrev" aria-label="Previous element"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>'
    +'<button class="star'+(S.favs[z]?' on':'')+'" id="dFav"><svg viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg>'+(S.favs[z]?'Saved':'Save')+'</button>'
    +(askAvailable()?'<button class="ask" id="dAsk"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 4.6L18.5 9l-4.7 1.6L12 15l-1.8-4.4L5.5 9l4.7-1.4z"/></svg>Ask</button>':'')
    +'<button id="dNext" aria-label="Next element"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button></div>'
    +'<div class="aiout" id="aiout"></div>'
    +'<div class="props">'
    +prop('Atomic mass',e.mass!=null?esc(e.massTxt)+' <small>u</small>':'<small>Unknown</small>')
    +prop('Standard state',STATE_NAME[e.st]||'—')
    +prop('Electron configuration',cfgHTML(e.cfg)+(e.predicted?' <small>(predicted)</small>':''),true)
    +prop('Electrons per shell',e.shells.join(' · '),true)
    +prop('Electronegativity',nv(e.en,'Pauling',2))
    +prop('Atomic radius',nv(e.rad,'pm',0))
    +prop('Ionisation energy',nv(e.ie,'eV',3))
    +prop('Electron affinity',nv(e.ea,'eV',3))
    +prop('Melting point',tempTxt(e.mp))
    +prop('Boiling point',tempTxt(e.bp))
    +prop('Density',e.den==null?'<small>Unknown</small>':(e.den<0.01?e.den.toExponential(3).replace('-','−'):fmtN(e.den,3))+' <small>g/cm³</small>')
    +prop('Discovered',esc(e.yearTxt||'—'))
    +prop('Oxidation states',esc(e.ox||'—').replace(/-/g,'−'),true)
    +'<div class="prop" id="dTemp" data-z="'+z+'">'+tempPropInner(e)+'</div>'
    +prop('CPK colour',e.cpk?'<span style="display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:6px;background:#'+e.cpk+';box-shadow:0 0 0 1px var(--line)"></span>#'+e.cpk:'<small>None</small>')
    +'</div>';
  openSheet('el',h);
  $('dPrev').onclick=function(){ openElement(z===1?118:z-1); };
  $('dNext').onclick=function(){ openElement(z===118?1:z+1); };
  $('dFav').onclick=function(){ if(S.favs[z])delete S.favs[z]; else S.favs[z]=1; save(); paint(); haptic('medium');
    var b=$('dFav'); b.classList.toggle('on',!!S.favs[z]); b.lastChild.textContent=S.favs[z]?'Saved':'Save'; };
  if($('dAsk'))$('dAsk').onclick=function(){ askAbout(e); };
}
function askAvailable(){ return typeof window.myllmAsk==='function'; }
function askAbout(e){
  var out=$('aiout'), my=++askToken; out.classList.add('show');
  out.innerHTML='<h3>Your AI on '+esc(e.nm)+'</h3><div class="txt"><span class="dots"><span></span><span></span><span></span></span></div>';
  var p='Explain the chemical element '+e.nm+' ('+e.sym+', atomic number '+e.z+') to a curious student in four short paragraphs: what it is like, where it is found, what it is used for, and one surprising fact. Plain text, no headings, no markdown.';
  window.myllmAsk(p).then(function(r){
    if(my!==askToken)return;
    out.querySelector('.txt').textContent=String(r||'').replace(/\*\*/g,'').trim()||'No answer came back.';
    out.insertAdjacentHTML('beforeend','<div class="note">Written by your AI. The figures above come from PubChem.</div>');
  },function(){ if(my!==askToken)return; out.querySelector('.txt').textContent="Couldn't reach your AI just now."; });
}

/* ---------- Search ---------- */
var searchHits=null;
function doSearch(){
  var q=$('q').value.trim().toLowerCase(), R=$('results');
  if(!q){ searchHits=null; R.classList.remove('show'); paint(); return; }
  var list=ELS.filter(function(e){
    return e.nm.toLowerCase().indexOf(q)===0||e.sym.toLowerCase()===q||(q.length>1&&e.sym.toLowerCase().indexOf(q)===0)||String(e.z)===q||(q.length>2&&e.nm.toLowerCase().indexOf(q)>0);
  });
  list.sort(function(a,b){ var as=a.sym.toLowerCase()===q?0:1, bs=b.sym.toLowerCase()===q?0:1; return as-bs||a.z-b.z; });
  searchHits={}; list.forEach(function(e){searchHits[e.z]=1});
  R.innerHTML=list.length?list.slice(0,8).map(function(e){
    return '<button data-z="'+e.z+'"><span class="rs" style="background:hsl('+CAT_HUE[e.cat]+' var(--S) var(--L));color:hsl('+CAT_HUE[e.cat]+' var(--St) var(--Lt))">'+e.sym+'</span><span><div class="rn">'+e.nm+'</div><div class="rz">'+e.z+' · '+CATS[e.cat]+'</div></span></button>';
  }).join(''):'<div class="none">No element matches “'+esc(q)+'”.</div>';
  R.classList.add('show'); paint();
}
$('q').addEventListener('input',doSearch);
$('q').addEventListener('keydown',function(e){ if(e.key==='Enter'){ var b=$('results').querySelector('button'); if(b)b.click(); } });
$('results').addEventListener('click',function(ev){
  var b=ev.target.closest('button[data-z]'); if(!b)return;
  $('results').classList.remove('show'); $('q').blur(); openElement(+b.getAttribute('data-z'));
});
$('searchBtn').addEventListener('click',function(){
  var on=!document.body.classList.contains('searching'); haptic();
  document.body.classList.toggle('searching',on); $('searchBtn').classList.toggle('on',on);
  if(on)setTimeout(function(){$('q').focus()},50); else { $('q').value=''; doSearch(); }
});

/* ---------- Mode + legend input ---------- */
$('modes').addEventListener('click',function(ev){
  var b=ev.target.closest('button[data-m]'); if(!b)return;
  S.mode=b.getAttribute('data-m'); haptic(); save(); renderAll();
  b.scrollIntoView({inline:'nearest',block:'nearest'});
});
$('legend').addEventListener('click',function(ev){
  var b=ev.target.closest('button[data-cat]'); if(!b)return; haptic();
  var c=b.getAttribute('data-cat');
  if(c==='fav'){ S.favOnly=!S.favOnly; if(S.favOnly&&!Object.keys(S.favs).length)toast('Save elements with ☆ to see them here'); }
  else {
    var i=+c, allOn=!Object.keys(S.off).length;
    // First tap focuses one category; tapping it again brings everything back.
    if(allOn){ CATS.forEach(function(_,k){ if(k!==i)S.off[k]=1; }); }
    else if(!S.off[i]&&Object.keys(S.off).length===CATS.length-1){ S.off={}; }
    else { if(S.off[i])delete S.off[i]; else S.off[i]=1; }
  }
  renderLegend(); paint();
});

/* ---------- Quiz ---------- */
var QZ=null;
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)), t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function pool(){ return ELS.filter(function(e){return e.z<=86||[88,90,92,94].indexOf(e.z)>=0}); }
function newQuiz(){
  var p=shuffle(pool().slice()).slice(0,10);
  QZ={i:0,score:0,qs:p.map(function(e,k){
    var type=k%3, others=shuffle(pool().filter(function(o){return o.z!==e.z})).slice(0,3), opts=shuffle([e].concat(others));
    return {e:e,type:type,opts:opts};
  })};
  showQ();
}
function showQ(){
  var q=QZ.qs[QZ.i], e=q.e, h='<div class="qh">Element quiz</div><div class="qp">Question '+(QZ.i+1)+' of 10 · score '+QZ.score+'</div>'
    +'<div class="qbar"><i style="width:'+(QZ.i*10)+'%"></i></div>';
  if(q.type===0){ h+='<div class="qbig" style="--h:'+CAT_HUE[e.cat]+'">'+e.sym+'</div><div class="qq">Which element is this?</div>'; }
  else if(q.type===1){ h+='<div class="qq">What is the symbol for<br><b>'+e.nm+'</b>?</div>'; }
  else { h+='<div class="qq">Which element has atomic number <b>'+e.z+'</b>?</div>'; }
  h+='<div class="qopts">'+q.opts.map(function(o){ return '<button data-z="'+o.z+'">'+(q.type===1?o.sym:o.nm)+'</button>'; }).join('')+'</div>';
  openSheet('quiz',h);
  sbody.querySelectorAll('.qopts button').forEach(function(b){
    b.onclick=function(){
      if(QZ.locked)return; QZ.locked=true;
      var right=+b.getAttribute('data-z')===e.z;
      if(right){ QZ.score++; b.classList.add('right'); haptic('success'); }
      else { b.classList.add('wrong'); haptic('error'); sbody.querySelector('.qopts button[data-z="'+e.z+'"]').classList.add('right'); }
      setTimeout(function(){ QZ.locked=false; QZ.i++; if(QZ.i<10)showQ(); else endQuiz(); },right?650:1300);
    };
  });
}
function endQuiz(){
  if(QZ.score>S.best){ S.best=QZ.score; save(); }
  var msg=QZ.score===10?'Perfect. You know your table.':QZ.score>=7?'Great work.':QZ.score>=4?'Good going. Try again to beat it.':'Every chemist starts somewhere.';
  openSheet('quiz','<div class="qh">Element quiz</div><div class="qend"><div class="score">'+QZ.score+'/10</div><p>'+msg+'</p><p>Best so far: '+S.best+'/10</p></div><button class="bigbtn" id="again">Play again</button>');
  $('again').onclick=newQuiz;
}
$('quizBtn').addEventListener('click',function(){ haptic(); newQuiz(); });

/* ---------- About ---------- */
$('aboutBtn').addEventListener('click',function(){
  openSheet('about','<div class="about"><h2>About the data</h2>'
    +'<p>Every figure in this table comes from the PubChem periodic table, published by the US National Library of Medicine (NIH). It is a US government work and in the public domain.</p>'
    +'<p class="m">Data: PubChem (NIH), public domain. pubchem.ncbi.nlm.nih.gov/periodic-table</p>'
    +'<p>Temperatures are in kelvin (switch to °C in the State view). Density is in g/cm³, atomic radius in picometres, energies in electronvolts, electronegativity on the Pauling scale.</p>'
    +'<p class="m">The state view compares each element\'s melting and boiling points at normal pressure with the temperature you choose. Values for the heaviest elements are predictions, and some have never been measured.</p>'
    +'<p class="m">The “Ask” explanations are written by your AI, not PubChem.</p></div>');
});

var tt; function toast(m){ var t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(function(){t.classList.remove('show')},1600); }

/* ---------- Boot ---------- */
build();
function firstZoom(){
  var land=innerWidth>innerHeight;
  if(S.t)setT(S.t); else setT(land?Math.max(34,fitT()):52);
}
var booted=false;
function boot(){ if(booted)return; booted=true; renderAll(); firstZoom(); }
load(boot);
addEventListener('resize',function(){ if(!S.t||innerWidth>innerHeight&&S.t<fitT())setT(Math.max(fitT(),18)); });

/* myllm-fullscreen-v2 — full screen where MyLLM can also close the app for us
   (myllmClose, 5.6.2+): full screen hides MyLLM's Done, and a page with no way
   out is worse than a repeated title, so elsewhere nothing changes. This page
   pads its own top by env(safe-area-inset-top), so the spacer stays at 0. */
(function(){
  function full(){ return !!(window.myllmClose && window.myllmImmersive); }
  function sync(){
    var f = full();
    document.body.classList.toggle("imm", f);
    var sp = document.querySelector(".imm-safe"); if (sp) sp.style.height = "0px";
    if (!f) return;
    try { window.myllmImmersive(true, { keepAwake:false }).catch(function(){}); } catch(e){}
  }
  window.myllmFSClose = function(){
    try { if (window.myllmHaptic) window.myllmHaptic("light"); } catch(e){}
    try { window.myllmClose().catch(function(){}); } catch(e){}
  };
  document.addEventListener("visibilitychange", function(){ if (!document.hidden) sync(); });
  sync();
})();
