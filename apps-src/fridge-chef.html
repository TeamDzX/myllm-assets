<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>:root{color-scheme:light dark}
*{box-sizing:border-box}
body{font-family:var(--myllm-font,-apple-system,system-ui,sans-serif);margin:0;padding:16px;background:var(--myllm-bg,#f2f2f7);color:var(--myllm-text,#111)}
h1{font-size:22px;margin:0 0 2px}
.sub{font-size:13px;color:var(--myllm-muted,#8a8a8e);margin:0 0 18px}
.tile{width:100%;border:0;border-radius:16px;padding:20px;font-size:18px;font-weight:700;color:#fff;background:linear-gradient(135deg,#ff9500,#ff5e3a);text-align:center}
.tile span{font-size:30px;display:block;margin-bottom:6px}
.answer{background:var(--myllm-surface,#fff);border-radius:16px;padding:16px;margin-top:14px}
.answer h2{font-size:17px;margin:0 0 8px}
.answer p{font-size:16px;line-height:1.55;white-space:pre-wrap;margin:0}
.answer button{margin-top:14px;width:100%;border:0;border-radius:10px;padding:11px;font-size:14px;font-weight:600;background:rgba(255,149,0,.16);color:#c2410c}
.note{color:var(--myllm-muted,#8a8a8e);font-size:14px;text-align:center;margin-top:18px;line-height:1.5;padding:0 6px}
@media(min-width:768px){body{max-width:680px;margin-left:auto;margin-right:auto}}
</style></head><body>
<h1>🍳 Fridge Chef</h1>
<p class="sub">Snap what's in your fridge and get recipe ideas from it.</p>
<div id="home">
  <button class="tile" onclick="cook()"><span>📸</span>Snap my fridge</button>
  <p class="note" id="hint">Uses your camera and your AI, privately on your device. Needs the latest MyLLM with “Allow apps to use the AI” on.</p>
</div>
<div id="out"></div>

<script>
var VISION = window.myllmVision || null;
var haptic = window.myllmHaptic || function(){};

var PROMPT = 'You are a resourceful home cook. Look at this photo of fridge or pantry contents and list the main ingredients you can identify. Then suggest 3 quick recipes I could make mostly from them, each as a title plus a one-line description. Keep it concise and practical; note if a common staple is assumed.';

function el(id){return document.getElementById(id)}

function cook(){
  if(!VISION){ el('hint').textContent='This needs the latest MyLLM with “Allow apps to use the AI” enabled in Settings.'; return; }
  haptic('light');
  VISION(PROMPT).then(function(answer){
    if(answer == null) return; // cancelled
    show(answer);
  }).catch(function(e){
    show((e && e.message) ? e.message : 'Something went wrong.');
  });
}

function show(text){
  el('home').style.display='none';
  var d = document.createElement('div'); d.className='answer';
  d.innerHTML='<h2>🍳 What you can cook</h2><p></p><button>← Snap again</button>';
  d.querySelector('p').textContent = text;
  d.querySelector('button').onclick = function(){ el('out').innerHTML=''; el('home').style.display='block'; };
  el('out').innerHTML=''; el('out').appendChild(d);
  window.scrollTo(0,0);
}
</script></body></html>
