<title>World Clock</title>
<style>
:root{--build-id:"d506381356";
  color-scheme:light dark;
  --bg:var(--myllm-bg,#f2f2f7);--surface:var(--myllm-surface,#fff);
  --text:var(--myllm-text,#111);--muted:var(--myllm-muted,#6b6b72);
  --accent:var(--myllm-accent,#0b5ed7);--border:var(--myllm-border,rgba(120,120,128,.25));
  --radius:var(--myllm-radius,14px);--font:var(--myllm-font,-apple-system,system-ui,sans-serif);
}
@media(prefers-color-scheme:dark){:root{--bg:var(--myllm-bg,#000);--surface:var(--myllm-surface,#1c1c1e);--text:var(--myllm-text,#eee);--muted:var(--myllm-muted,#98989f)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text)}
.wrap{max-width:620px;margin:0 auto;padding:14px}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.bar .sp{flex:1}
.bar button{border:0;background:var(--surface);border:1px solid var(--border);color:var(--accent);border-radius:99px;padding:9px 14px;font:inherit;font-weight:650;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
svg{width:1.2em;height:1.2em;fill:currentColor;flex-shrink:0}
.local{position:relative;background:var(--accent);background:linear-gradient(145deg,var(--accent),color-mix(in srgb,var(--accent) 58%,#05051a));color:#fff;border-radius:22px;padding:18px 18px 20px;margin-bottom:14px;box-shadow:0 10px 30px rgba(10,20,60,.16)}
.local .l{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.8;padding-right:130px}
.local .t{font-size:54px;font-weight:300;letter-spacing:-.01em;line-height:1.1;margin-top:8px;font-variant-numeric:tabular-nums}
.local .t span{font-size:22px;opacity:.65;margin-left:2px}
.local .d{font-size:14px;opacity:.9;margin-top:2px}
.glass{border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.16);color:#fff;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.local .desk{position:absolute;z-index:1;right:12px;top:12px;height:36px;border-radius:99px;padding:0 13px;font:inherit;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.local .desk:active{transform:scale(.96)}
.clock{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:13px 15px;margin-bottom:9px}
.clock .glyph{width:36px;height:36px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;font-size:17px;color:#ff9f0a;background:rgba(255,159,10,.14)}
.clock .glyph.night{color:#8e8ef5;background:rgba(124,124,240,.16)}
.clock .info{flex:1;min-width:0}
.clock .city{font-size:16px;font-weight:600}
.clock .sub{font-size:12px;color:var(--muted);margin-top:1px}
.clock .time{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.clock .x{border:0;background:rgba(255,69,58,.14);color:#ff453a;width:32px;height:32px;border-radius:50%;font-size:14px;cursor:pointer;display:none;align-items:center;justify-content:center;flex:none}
.editing .clock .x{display:flex}
.empty{color:var(--muted);text-align:center;padding:30px 16px;font-size:15px}
/* picker */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;z-index:30}
.sheet.show{display:flex}
.sheetB{background:var(--bg);width:100%;max-height:82%;display:flex;flex-direction:column;border-radius:18px 18px 0 0;overflow:hidden}
.sheetH{padding:14px 16px 10px;border-bottom:1px solid var(--border)}
.sheetH input{width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:10px;font:inherit;font-size:16px;background:var(--surface);color:var(--text)}
.sheetL{overflow:auto;padding:6px 10px 24px}
.pi{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid var(--border);cursor:pointer}
.pi .c{font-size:15px;font-weight:600}.pi .k{font-size:12px;color:var(--muted)}
.pi .o{font-size:13px;color:var(--accent);font-weight:600}
.pi.dim{opacity:.4}

/* Desk clock: true black, the local time large and thin, a few saved cities
   dimmed beneath it, everything drifting a little every minute so nothing
   burns in. Made for a phone on a stand. */
body.lock{overflow:hidden}
.dock{display:none;position:fixed;inset:0;z-index:60;background:#000;color:#fff;overflow:hidden;-webkit-user-select:none;user-select:none}
.dock.on{display:block}
.dock .drift{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(34px + env(safe-area-inset-top)) calc(34px + env(safe-area-inset-right)) calc(34px + env(safe-area-inset-bottom)) calc(34px + env(safe-area-inset-left));
  transition:transform 2.5s ease-in-out}
.dock .dmain{text-align:center;flex:none}
.dock .dclock{font-size:min(29vw,220px);font-weight:200;letter-spacing:.01em;line-height:1;color:#c9c9cf;font-variant-numeric:tabular-nums;white-space:nowrap}
.dock .dclock span{font-size:.24em;color:#5d5d66;margin-left:.12em;font-weight:300}
.dock.nosec .dclock span{display:none}
.dock .ddate{font-size:14px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#5d5d66;margin-top:12px}
.dock .dcities{width:min(100%,400px);margin-top:34px;flex:none}
.dock .dcity{display:flex;align-items:center;gap:11px;padding:9px 0;border-top:1px solid #16161a}
.dock .dcity:first-child{border-top:none}
.dock .dcity svg{color:#55555e;font-size:15px}
.dock .dcity .n{flex:1;min-width:0}
.dock .dcity .c{font-size:15.5px;font-weight:650;color:#a9a9b2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock .dcity .s{font-size:12px;color:#5d5d66;margin-top:1px;font-weight:600}
.dock .dcity .tm{font-size:24px;font-weight:300;color:#b4b4bd;font-variant-numeric:tabular-nums}
.dock .ctl{position:absolute;left:0;right:0;bottom:calc(30px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:12px;opacity:0;pointer-events:none;transition:opacity .3s}
.dock .ctl.on{opacity:1;pointer-events:auto}
.dock .ctl button{border:1px solid #2c2c33;background:#121216;color:#eee;border-radius:99px;padding:12px 22px;font:inherit;font-size:15px;font-weight:700;display:inline-flex;align-items:center;gap:8px}
.dock .ctl button.hot{background:#eee;color:#121216;border-color:#eee}
.dock .hint{position:absolute;bottom:calc(34px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-size:12px;color:#4a4a52;transition:opacity .6s}
@media (orientation:landscape) and (max-height:560px){
  .dock .drift{flex-direction:row;gap:6vw}
  .dock .dclock{font-size:min(19vw,56vh)}
  .dock .dcities{width:min(30vw,300px);margin-top:0}
  .dock .dcities:empty{display:none}
  .dock:not(.has) .dclock{font-size:min(27vw,50vh)}
}
@media (prefers-reduced-motion:reduce){.dock .drift{transition:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 4.5a1.2 1.2 0 0 1 1.2 1.2v5.1h5.1a1.2 1.2 0 0 1 0 2.4h-5.1v5.1a1.2 1.2 0 0 1-2.4 0v-5.1H5.7a1.2 1.2 0 0 1 0-2.4h5.1V5.7A1.2 1.2 0 0 1 12 4.5z"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6.3 6.3a1.2 1.2 0 0 1 1.7 0l4 4 4-4a1.2 1.2 0 1 1 1.7 1.7l-4 4 4 4a1.2 1.2 0 1 1-1.7 1.7l-4-4-4 4a1.2 1.2 0 1 1-1.7-1.7l4-4-4-4a1.2 1.2 0 0 1 0-1.7z"/></symbol>

</defs></svg>
<div class="wrap">
  <div class="bar">
    <div class="sp"></div>
    <button id="edit">Edit</button>
    <button id="add"><svg><use href="#i-plus"/></svg>Add city</button>
  </div>
  <div class="local">
    <button class="glass desk" id="desk"><svg><use href="#i-desk"/></svg>Desk clock</button>
    <div class="l" id="lName"></div>
    <div class="t"><b id="lTime" style="font-weight:inherit">--:--</b><span id="lSec"></span></div>
    <div class="d" id="lDate"></div>
  </div>
  <div id="clocks"></div>
  <div class="empty" id="empty" style="display:none">Tap “Add city” to add clocks from around the world.</div>
</div>

<div class="sheet" id="sheet"><div class="sheetB">
  <div class="sheetH"><input id="search" placeholder="Search a city…" autocapitalize="words" autocorrect="off"></div>
  <div class="sheetL" id="pick"></div>
</div></div>

<div class="dock" id="dock">
  <div class="drift" id="dDrift">
    <div class="dmain"><div class="dclock"><b id="dClock" style="font-weight:inherit">--:--</b><span id="dSec"></span></div><div class="ddate" id="dDate"></div></div>
    <div class="dcities" id="dCities"></div>
  </div>
  <div class="hint" id="dHint">Tap for controls</div>
  <div class="ctl" id="dCtl"><button id="dSecs">Seconds</button><button id="dExit"><svg><use href="#i-x"/></svg>Exit</button></div>
</div>

<script>
var CITIES=[
 ["Honolulu","USA","Pacific/Honolulu"],["Anchorage","USA","America/Anchorage"],["Los Angeles","USA","America/Los_Angeles"],
 ["Denver","USA","America/Denver"],["Chicago","USA","America/Chicago"],["New York","USA","America/New_York"],
 ["Toronto","Canada","America/Toronto"],["Mexico City","Mexico","America/Mexico_City"],["Bogotá","Colombia","America/Bogota"],
 ["São Paulo","Brazil","America/Sao_Paulo"],["Buenos Aires","Argentina","America/Argentina/Buenos_Aires"],
 ["Reykjavik","Iceland","Atlantic/Reykjavik"],["London","UK","Europe/London"],["Dublin","Ireland","Europe/Dublin"],
 ["Lisbon","Portugal","Europe/Lisbon"],["Madrid","Spain","Europe/Madrid"],["Paris","France","Europe/Paris"],
 ["Berlin","Germany","Europe/Berlin"],["Rome","Italy","Europe/Rome"],["Amsterdam","Netherlands","Europe/Amsterdam"],
 ["Zurich","Switzerland","Europe/Zurich"],["Stockholm","Sweden","Europe/Stockholm"],["Athens","Greece","Europe/Athens"],
 ["Istanbul","Turkey","Europe/Istanbul"],["Moscow","Russia","Europe/Moscow"],["Cairo","Egypt","Africa/Cairo"],
 ["Lagos","Nigeria","Africa/Lagos"],["Johannesburg","South Africa","Africa/Johannesburg"],["Nairobi","Kenya","Africa/Nairobi"],
 ["Dubai","UAE","Asia/Dubai"],["Tehran","Iran","Asia/Tehran"],["Karachi","Pakistan","Asia/Karachi"],
 ["Mumbai","India","Asia/Kolkata"],["Delhi","India","Asia/Kolkata"],["Dhaka","Bangladesh","Asia/Dhaka"],
 ["Bangkok","Thailand","Asia/Bangkok"],["Jakarta","Indonesia","Asia/Jakarta"],["Singapore","Singapore","Asia/Singapore"],
 ["Hong Kong","China","Asia/Hong_Kong"],["Shanghai","China","Asia/Shanghai"],["Taipei","Taiwan","Asia/Taipei"],
 ["Seoul","South Korea","Asia/Seoul"],["Tokyo","Japan","Asia/Tokyo"],["Sydney","Australia","Australia/Sydney"],
 ["Melbourne","Australia","Australia/Melbourne"],["Perth","Australia","Australia/Perth"],["Auckland","New Zealand","Pacific/Auckland"]
];
var saved=["Europe/London","America/New_York","Asia/Tokyo","Australia/Sydney"];
function $(i){return document.getElementById(i)}
function haptic(k){if(window.myllmHaptic)try{myllmHaptic(k)}catch(e){}}
function cityFor(z){for(var i=0;i<CITIES.length;i++)if(CITIES[i][2]===z)return CITIES[i];return [z.split('/').pop().replace(/_/g,' '),'',z]}

function zoneOffMin(z){
  try{
    var p=new Intl.DateTimeFormat('en-US',{timeZone:z,timeZoneName:'shortOffset'}).formatToParts(new Date());
    var s=(p.find(function(x){return x.type==='timeZoneName'})||{}).value||'GMT';
    var m=s.match(/GMT([+-])(\d{1,2})(?::?(\d{2}))?/);
    if(!m)return 0;return (m[1]==='-'?-1:1)*(parseInt(m[2])*60+(m[3]?parseInt(m[3]):0));
  }catch(e){return 0}
}
function fmtTime(z){return new Intl.DateTimeFormat([],{timeZone:z,hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date())}
function fmtSec(z){var v=new Intl.DateTimeFormat('en-US',{timeZone:z,second:'numeric'}).format(new Date());return v.length<2?'0'+v:v}   /* '2-digit' alone comes back unpadded */
function fmtDate(z){return new Intl.DateTimeFormat([],{timeZone:z,weekday:'short',day:'numeric',month:'short'}).format(new Date())}
function dayKey(z){return new Intl.DateTimeFormat('en-CA',{timeZone:z,year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
function relLabel(z){
  var loc=dayKey(Intl.DateTimeFormat().resolvedOptions().timeZone),here=dayKey(z);
  if(here===loc)return 'Today';
  return here>loc?'Tomorrow':'Yesterday';
}
function relOff(z){
  var local=-new Date().getTimezoneOffset();
  var diff=(zoneOffMin(z)-local)/60;
  if(diff===0)return 'same time';
  var h=Math.floor(Math.abs(diff)),mm=Math.round((Math.abs(diff)-h)*60);
  return (diff>0?'+':'−')+h+(mm?(':'+(mm<10?'0':'')+mm):'')+'h';
}
function isDay(z){var h=parseInt(new Intl.DateTimeFormat('en-US',{timeZone:z,hour:'2-digit',hour12:false}).format(new Date()));return h>=6&&h<19}

function tick(){
  var lz=Intl.DateTimeFormat().resolvedOptions().timeZone;
  $('lName').textContent=cityFor(lz)[0]+' · your time';$('lTime').textContent=fmtTime(lz);$('lSec').textContent=':'+fmtSec(lz);$('lDate').textContent=fmtDate(lz);
  saved.forEach(function(z){
    var el=document.getElementById('t-'+cssId(z));if(!el)return;
    el.querySelector('.time').textContent=fmtTime(z);
    var g=el.querySelector('.glyph'),day=isDay(z);
    if(g.getAttribute('data-d')!==String(day)){g.setAttribute('data-d',String(day));g.className='glyph'+(day?'':' night');g.innerHTML=day?SUN:MOON}
    el.querySelector('.sub').textContent=relLabel(z)+', '+relOff(z)+' · '+fmtDate(z);
  });
  if(dockOn)dockTick();
}
var SUN='<svg><use href="#i-sun"/></svg>',MOON='<svg><use href="#i-moon"/></svg>';
function cssId(z){return z.replace(/[^\w]/g,'_')}
function render(){
  var box=$('clocks');box.innerHTML='';
  $('empty').style.display=saved.length?'none':'block';
  saved.forEach(function(z){
    var c=cityFor(z),row=document.createElement('div');row.className='clock';row.id='t-'+cssId(z);
    row.innerHTML='<span class="glyph"></span><div class="info"><div class="city">'+esc(c[0])+'</div><div class="sub"></div></div><div class="time">--:--</div><button class="x" aria-label="Remove"><svg><use href="#i-x"/></svg></button>';
    row.querySelector('.x').onclick=function(){saved=saved.filter(function(x){return x!==z});save();render();tick();haptic('warning')};
    box.appendChild(row);
  });
  tick();
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

$('edit').onclick=function(){document.body.classList.toggle('editing');this.textContent=document.body.classList.contains('editing')?'Done':'Edit';haptic('selection')};
$('add').onclick=function(){$('search').value='';renderPick('');$('sheet').classList.add('show');setTimeout(function(){$('search').focus()},100);haptic('selection')};
$('sheet').onclick=function(e){if(e.target===$('sheet'))$('sheet').classList.remove('show')};
$('search').addEventListener('input',function(){renderPick(this.value)});
function renderPick(q){
  q=(q||'').toLowerCase().trim();
  var L=$('pick');L.innerHTML='';
  CITIES.filter(function(c){return !q||c[0].toLowerCase().indexOf(q)>=0||c[1].toLowerCase().indexOf(q)>=0}).forEach(function(c){
    var has=saved.indexOf(c[2])>=0,d=document.createElement('div');d.className='pi'+(has?' dim':'');
    d.innerHTML='<div><div class="c">'+esc(c[0])+'</div><div class="k">'+esc(c[1])+'</div></div><div class="o">'+(has?'Added':relOff(c[2]))+'</div>';
    d.onclick=function(){if(has)return;saved.push(c[2]);save();render();$('sheet').classList.remove('show');haptic('success')};
    L.appendChild(d);
  });
}

/* ---------- desk clock ----------
   The screen is kept awake by MyLLM where it can (myllmImmersive, which also
   hides MyLLM's own title bar), else by the Wake Lock API where the web view
   offers it; failing both, the phone's own auto-lock applies. */
var dockOn=false,dockSecs=true,dockDrift=null,dockCtlTimer=null,wakeLock=null;
function fmtLong(z){return new Intl.DateTimeFormat([],{timeZone:z,weekday:'long',day:'numeric',month:'long'}).format(new Date())}
function syncChrome(){
  if(!window.myllmImmersive)return;
  try{myllmImmersive(dockOn,{keepAwake:dockOn}).catch(function(){})}catch(e){}
}
function requestWake(){
  if(!('wakeLock' in navigator))return;
  try{navigator.wakeLock.request('screen').then(function(l){wakeLock=l}).catch(function(){wakeLock=null})}catch(e){}
}
function releaseWake(){if(wakeLock){try{wakeLock.release()}catch(e){}wakeLock=null}}
function driftOnce(){
  var x=Math.round((Math.random()-0.5)*40),y=Math.round((Math.random()-0.5)*40);
  $('dDrift').style.transform='translate('+x+'px,'+y+'px)';
}
function dockCities(){
  var lz=Intl.DateTimeFormat().resolvedOptions().timeZone;
  return saved.filter(function(z){return z!==lz}).slice(0,4);
}
function dockBuild(){
  var box=$('dCities');box.innerHTML='';
  dockCities().forEach(function(z){
    var r=document.createElement('div');r.className='dcity';r.setAttribute('data-z',z);
    r.innerHTML='<span class="g"></span><div class="n"><div class="c">'+esc(cityFor(z)[0])+'</div><div class="s"></div></div><div class="tm"></div>';
    box.appendChild(r);
  });
  $('dock').classList.toggle('has',box.children.length>0);
}
function dockTick(){
  var lz=Intl.DateTimeFormat().resolvedOptions().timeZone;
  $('dClock').textContent=fmtTime(lz);$('dSec').textContent=fmtSec(lz);$('dDate').textContent=fmtLong(lz);
  var rows=$('dCities').children;
  for(var i=0;i<rows.length;i++){
    var z=rows[i].getAttribute('data-z'),rel=relLabel(z),g=rows[i].querySelector('.g'),day=isDay(z);
    rows[i].querySelector('.tm').textContent=fmtTime(z);
    rows[i].querySelector('.s').textContent=relOff(z)+(rel==='Today'?'':' · '+rel);
    if(g.getAttribute('data-d')!==String(day)){g.setAttribute('data-d',String(day));g.innerHTML=day?SUN:MOON}
  }
}
function syncSecs(){$('dock').classList.toggle('nosec',!dockSecs);$('dSecs').classList.toggle('hot',dockSecs)}
function openDock(){
  haptic('medium');
  dockOn=true;
  document.body.classList.remove('editing');$('edit').textContent='Edit';
  dockBuild();dockTick();driftOnce();syncSecs();
  $('dock').classList.add('on');document.body.classList.add('lock');
  $('dCtl').classList.remove('on');$('dHint').style.opacity='1';
  setTimeout(function(){$('dHint').style.opacity='0'},4000);
  dockDrift=setInterval(driftOnce,60000);
  requestWake();syncChrome();
}
function closeDock(){
  haptic('light');
  dockOn=false;
  $('dock').classList.remove('on');document.body.classList.remove('lock');
  clearInterval(dockDrift);clearTimeout(dockCtlTimer);dockDrift=dockCtlTimer=null;
  releaseWake();syncChrome();
}
function dockTap(){
  if(!dockOn)return;
  $('dHint').style.opacity='0';$('dCtl').classList.add('on');
  clearTimeout(dockCtlTimer);
  dockCtlTimer=setTimeout(function(){$('dCtl').classList.remove('on')},5000);
}
$('desk').onclick=openDock;
$('dock').onclick=dockTap;
$('dExit').onclick=function(e){e.stopPropagation();closeDock()};
$('dSecs').onclick=function(e){
  e.stopPropagation();dockSecs=!dockSecs;syncSecs();dockTap();haptic('selection');
  if(window.myllmStorage)try{myllmStorage.setItem('worldclock.secs',dockSecs?'1':'0')}catch(_){}
};
document.addEventListener('visibilitychange',function(){
  if(document.hidden){releaseWake();return}
  tick();
  if(dockOn){requestWake();syncChrome()}       /* MyLLM puts its bars back when the app is left */
});

function save(){if(window.myllmStorage)myllmStorage.setItem('worldclock',JSON.stringify(saved))}
function load(){
  if(!window.myllmStorage){render();start();return}
  myllmStorage.getItem('worldclock').then(function(v){if(v)try{var a=JSON.parse(v);if(Array.isArray(a))saved=a}catch(e){}render();start()});
  myllmStorage.getItem('worldclock.secs').then(function(v){if(v==='0')dockSecs=false}).catch(function(){});
}
function start(){tick();setInterval(tick,1000)}
load();
</script>
</body>
</html>
