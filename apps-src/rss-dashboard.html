*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
svg.i{width:1.25em;height:1.25em;fill:currentColor;flex-shrink:0;display:block}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);-webkit-text-size-adjust:100%}
.topbar{position:sticky;top:0;z-index:10;background:var(--glassbg);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);padding:10px env(safe-area-inset-right) 0 env(safe-area-inset-left);border-bottom:1px solid var(--border)}
.headrow{max-width:1080px;margin:0 auto}

#gear{flex:none;border:1px solid var(--border);background:var(--surface);color:var(--muted);border-radius:999px;width:40px;height:40px;font-size:15px;margin:-2px 6px 0 16px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
#gear:active,.tab:active,.sh-x:active,#more:active,.prefs .chips button:active,.prefs .done:active{transform:scale(.96)}
.prefs{position:fixed;inset:0;z-index:400;display:none;background:rgba(0,0,0,.45);align-items:flex-end}
.prefs.on{display:flex}
.prefs .sheet{background:var(--surface);width:100%;max-width:780px;max-height:88dvh;overflow-y:auto;margin:0 auto;border-radius:22px 22px 0 0;padding:20px calc(18px + env(safe-area-inset-right)) calc(26px + env(safe-area-inset-bottom)) calc(18px + env(safe-area-inset-left))}
.prefs h3{font-size:18px;font-weight:800;margin:0 0 12px}
.prefs label{display:block;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:12px 0 7px}
.prefs .chips{display:flex;flex-wrap:wrap;gap:7px}
.prefs .chips button{border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:999px;padding:9px 15px;font:inherit;font-size:13.5px;font-weight:650;cursor:pointer}
.prefs .chips button.on{background:var(--accent);border-color:transparent;color:#fff}
.prefs .pnote{font-size:12.5px;color:var(--muted);line-height:1.5;margin:12px 0 0}
.prefs .done{display:block;width:100%;margin-top:16px;border:0;border-radius:14px;padding:14px;background:var(--accent);color:#fff;font:inherit;font-size:15px;font-weight:700;cursor:pointer}
.tab{flex:none;border:0;padding:8px 15px;min-height:36px;border-radius:999px;background:var(--surface);color:var(--text);font:inherit;font-size:13.5px;font-weight:650;cursor:pointer;white-space:nowrap;border:1px solid var(--border)}
.tab.on{background:var(--accent);color:#fff;border-color:transparent}
#status{padding:40px 24px;text-align:center;color:var(--muted);font-size:15px;line-height:1.5;max-width:520px;margin:0 auto}

  background:linear-gradient(145deg,hsl(var(--h) 62% 56%),hsl(calc(var(--h) + 40) 58% 34%))}
/* the wall that is coming, while the feeds load */
.skel{display:none;max-width:1080px;margin:0 auto;padding:14px calc(16px + env(safe-area-inset-right)) 0 calc(16px + env(safe-area-inset-left))}
.skel.on{display:block}
.skel i{display:block;border-radius:var(--radius);border:1px solid var(--border);
  background:linear-gradient(90deg,var(--surface) 25%,var(--border) 37%,var(--surface) 63%);background-size:400% 100%;animation:shim 1.4s ease-in-out infinite}
.skel i.a{aspect-ratio:16/12;margin-bottom:16px}
.skel .g{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.skel .g i{aspect-ratio:16/13}
@keyframes shim{0%{background-position:100% 0}100%{background-position:0 0}}

.wrap{padding:14px calc(16px + env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));max-width:780px;margin:0 auto}
a.card,a.hero{display:block;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;-webkit-tap-highlight-color:transparent;box-shadow:0 1px 2px rgba(0,0,0,.04),0 10px 26px -18px rgba(0,0,0,.35)}

.hero .thumb{aspect-ratio:16/9}
.card .thumb{aspect-ratio:16/10}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .ph{font-size:34px;opacity:.9;color:#fff;display:flex}
.body{position:relative;padding:13px 15px 26px}
.lean{position:absolute;right:14px;bottom:12px;width:36px;height:4px;border-radius:2px;background:linear-gradient(90deg,#3b6fd4,#8e8e93 50%,#c0392b);opacity:.85;cursor:pointer}
.lean::before{content:'';position:absolute;inset:-14px -12px} /* enlarged tap target */
.lean i{position:absolute;top:50%;transform:translate(-50%,-50%);width:9px;height:9px;border-radius:50%;background:var(--surface);border:2px solid var(--text)}
#ovl{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:82dvh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;overflow:hidden;padding-bottom:env(safe-area-inset-bottom)}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px}
.sh-t{font-size:17px;font-weight:700}
.sh-x{position:relative;border:0;background:var(--surface);color:var(--muted);width:36px;height:36px;border-radius:50%;font-size:13px;cursor:pointer;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;padding:0}
.sh-x::before{content:'';position:absolute;inset:-5px}
.sh-story{padding:0 16px 10px;font-size:13px;color:var(--muted);line-height:1.4}
.sh-sum{margin:0 16px 12px;padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:12px;font-size:14px;line-height:1.5}
.sh-sum b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--accent);margin-bottom:5px}
.sh-sum .sh-wait{color:var(--muted);font-size:13px}
.sh-body{overflow-y:auto;padding:0 16px 20px;-webkit-overflow-scrolling:touch}
.sh-load,.sh-empty{padding:26px 0;text-align:center;color:var(--muted);font-size:14px;line-height:1.5}
a.cvg{display:flex;gap:11px;align-items:center;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:10px;margin-bottom:9px}

.cvg .tmb img{width:100%;height:100%;object-fit:cover;display:block}
.cvg .cbody{display:block;min-width:0}

.cvg-src .when{font-weight:600;color:var(--muted);text-transform:none;letter-spacing:0;margin-left:auto}
.cvg h4{margin:0;font-size:14px;line-height:1.4;font-weight:600}
.mini{position:relative;width:26px;height:3px;border-radius:2px;background:linear-gradient(90deg,#3b6fd4,#8e8e93 50%,#c0392b);flex:none}
.mini i{position:absolute;top:50%;transform:translate(-50%,-50%);width:7px;height:7px;border-radius:50%;background:var(--surface);border:1.5px solid var(--text)}
.hero .body h2{font-size:20px;line-height:1.3;margin:0 0 8px;font-weight:700}
.hero .excerpt{font-size:14px;line-height:1.5;color:var(--muted);margin:0}
.card .body h3{font-size:16px;line-height:1.35;margin:0;font-weight:600}
.meta{font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--accent);margin-bottom:7px;text-transform:uppercase}
.card .meta{margin-bottom:6px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
#more{display:block;margin:22px auto 0;min-height:46px;padding:12px 26px;background:var(--accent);color:#fff;border:0;border-radius:14px;font:inherit;font-size:15px;font-weight:700;cursor:pointer}
/* a wider wall on a tablet or a phone on its side: the lead story runs picture-and-words side by side */
@media(min-width:700px){
  a.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:stretch}
  a.hero .thumb{aspect-ratio:auto;min-height:230px;height:100%}
  a.hero .body{display:flex;flex-direction:column;justify-content:center;padding:20px 22px 30px}

}
@media(min-width:1000px){.wrap{max-width:1080px}.hero .body h2{font-size:26px}}
#more[disabled]{opacity:.5}
@media(prefers-reduced-motion:no-preference){a.card,a.hero{transition:transform .12s ease}a.card:active,a.hero:active{transform:scale(.985)}}
/* The header every gallery home screen shares: hue tile, name, one line, actions. */
.head{display:flex;align-items:center;gap:12px;margin:2px 2px 14px}
.head .tile{display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;width:44px;height:44px;border-radius:13px;background:linear-gradient(145deg,hsl(var(--h) 62% 50%),hsl(calc(var(--h) + 40) 58% 28%))}
.head .tile svg{width:24px;height:24px}
.head .ht{flex:1;min-width:0}
.head h1{font-size:22px;font-weight:800;letter-spacing:-.01em;line-height:1.2;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head p{font-size:13px;color:var(--muted);margin:1px 0 0;line-height:1.35}
.head .acts{display:flex;gap:8px;flex-shrink:0;align-items:center;padding:0}
.head .acts>button{min-width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;gap:6px;flex:none}
.head .acts svg{width:19px;height:19px}
.head{max-width:1080px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) 4px max(18px,env(safe-area-inset-left))}
.head .acts #gear{margin:0}
.head .acts #gear svg{width:17px;height:17px}

/* myllm-fullscreen-v2 — MyLLM 5.6.2+ opens this app full screen; the ✕ is the way out. */
.head .imm-acts{display:none;flex-shrink:0;margin-left:auto}
.head .acts + .imm-acts{margin-left:0}
body.imm .head .imm-acts{display:flex}
.head .imm-acts button{width:40px;height:40px;border-radius:12px;border:1px solid var(--myllm-border,rgba(128,128,128,.28));
  background:var(--myllm-surface,rgba(128,128,128,.12));color:var(--myllm-text,currentColor);display:grid;place-items:center;padding:0;cursor:pointer;transition:transform .12s}

.imm-x svg,.imm-acts svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}
.imm-safe{display:none}
body.imm .imm-safe{display:block}

var PAGE=8, active=0, shown=0, articles=[], cache={};

// Loading shows the wall that is coming; anything else that lands here is a
// reason there is no wall, so it gets an icon and room to be read.
function setStatus(t){
  var s=el('status'),loading=/^Loading/.test(t||'');
  el('skel').classList.toggle('on',loading);
  s.style.display=t?'block':'none';
  s.textContent=t||'';
  if(loading){s.style.padding='18px 24px 0'}
  else{s.style.padding='';
    if(t){var i=document.createElement('div');i.className='stile';i.innerHTML='<svg class="i"><use href="#i-'+(/network|offline|connection/i.test(t)?'wifi':'news')+'"/></svg>';s.insertBefore(i,s.firstChild)}}
}
function haptic(k){if(window.myllmHaptic)try{myllmHaptic(k)}catch(e){}}

function buildTabs(){
  var T=el('tabs');T.innerHTML='';
  TOPICS.forEach(function(t,i){
    var b=document.createElement('button');
    b.className='tab'+(i===active?' on':'');
    b.textContent=t.name;
    b.onclick=function(){
      haptic('selection');
      if(i===active){TOPICS[i].srcs.forEach(function(s){delete cache[s.url]})} // tap active tab to refresh
      active=i;
      buildTabs();
      load();
      window.scrollTo(0,0);
    };
    T.appendChild(b);
  });
}

var loadGen=0;
function load(){
  var t=TOPICS[active];
  el('hero').innerHTML='';el('grid').innerHTML='';el('more').style.display='none';
  shown=0;
  if(!window.myllmFetch){setStatus('Headlines needs network access — update MyLLM and turn on “Allow apps to use the network” in Settings → MyLLMos Apps.');return}
  setStatus('Loading '+t.name+'…');
  var gen=++loadGen;
  Promise.all(t.srcs.map(function(s){
    return getFeed(s.url).then(function(items){
      items.forEach(function(it){it.src=s.src});
      return items;
    },function(){return null});
  })).then(function(feeds){
    if(gen!==loadGen)return; // user switched topic while loading
    var ok=feeds.filter(function(f){return f&&f.length});
    if(!ok.length){setStatus('Couldn’t load '+t.name+' from any of its channels.\nTap the topic again to retry.');return}
    articles=interleave(ok);
    setStatus('');paint();
  });
}

// Round-robin merge: story i of each channel in turn, so the wall opens with
// one story per outlet rather than a block from whichever feed is largest.
function interleave(feeds){
  var out=[],i=0,added=true;
  while(added&&out.length<60){
    added=false;
    for(var f=0;f<feeds.length;f++){
      if(i<feeds[f].length&&i<15){out.push(feeds[f][i]);added=true}
    }
    i++;
  }
  return out;
}

function parse(xml){
  var doc=new DOMParser().parseFromString(xml,'text/xml');
  var nodes=doc.getElementsByTagName('item');
  var atom=false;
  if(!nodes.length){nodes=doc.getElementsByTagName('entry');atom=true}
  var out=[];
  for(var i=0;i<nodes.length;i++){
    var n=nodes[i];
    var title=text(n,'title');
    if(!title)continue;
    var link=text(n,'link');
    if(atom||!link){
      var ls=n.getElementsByTagName('link');
      for(var k=0;k<ls.length;k++){var h=ls[k].getAttribute('href');if(h){link=h;if((ls[k].getAttribute('rel')||'alternate')==='alternate')break}}
    }
    var desc=text(n,'description')||text(n,'summary')||text(n,'content');
    // WordPress-family feeds (NY Post, The Hill, Japan Times, Hindustan
    // Times, Global News…) carry their images in content:encoded, not the
    // description — scan it too or whole regions render as placeholders.
    var bodyHtml=text(n,'content:encoded');
    out.push({
      title:title,
      link:link,
      date:text(n,'pubDate')||text(n,'updated')||text(n,'published')||text(n,'date'),
      excerpt:strip(desc||bodyHtml),
      image:imageOf(n,desc,bodyHtml)
    });
  }
  return out;
}

function text(node,tag){var e=node.getElementsByTagName(tag)[0];return e?e.textContent.trim():''}

// Pull the best image: media:content/thumbnail (largest), then enclosure,
// then the first <img> embedded in the description or content:encoded HTML.
function imageOf(node,descHtml,bodyHtml){
  var best=null,bestW=-1;
  function consider(url,w,type){
    if(!url)return;
    if(type&&type.indexOf('image')===-1&&type!=='image'&&!/\.(jpe?g|png|webp|gif)(\?|$)/i.test(url))return;
    w=parseInt(w)||0;
    if(w>bestW){best=url;bestW=w}
  }
  ['media:content','media:thumbnail'].forEach(function(tag){
    var els=node.getElementsByTagName(tag);
    for(var i=0;i<els.length;i++)consider(els[i].getAttribute('url'),els[i].getAttribute('width'),els[i].getAttribute('type')||els[i].getAttribute('medium'));
  });
  if(!best){
    var enc=node.getElementsByTagName('enclosure');
    for(var j=0;j<enc.length;j++)consider(enc[j].getAttribute('url'),enc[j].getAttribute('width'),enc[j].getAttribute('type'));
  }
  if(!best&&descHtml){var m=descHtml.match(/<img[^>]+src=["']([^"']+)["']/i);if(m)best=m[1]}
  if(!best&&bodyHtml){var m2=bodyHtml.match(/<img[^>]+src=["']([^"']+)["']/i);if(m2)best=m2[1]}
  return best;
}

// og:image rescue: some outlets' feeds carry NO image data at all (Al Jazeera,
// NPR, DW, Nikkei, NHK). For rendered cards that lack an image, fetch the
// article page and use its og:image. Bounded: 2 concurrent, ≤10 article
// fetches per topic load, results cached per link so tab-hopping is free.
var ogCache={};                       // link → url | null (null = tried, none)
var ogInflight=0, ogQueue=[], ogBudget=0;
function setThumb(node,url){
  var t=node&&node.querySelector&&node.querySelector('.thumb');
  if(t)t.innerHTML='<img loading="lazy" src="'+esc(url)+'" data-orig="'+esc(url)+'" onerror="imgFallback(this)">';
}
function rescueImage(a,node,gen){
  if(!a||a.image||!a.link||!window.myllmFetch)return;
  if(ogCache[a.link]!==undefined){
    if(ogCache[a.link]){a.image=ogCache[a.link];setThumb(node,a.image)}
    return;
  }
  if(ogBudget<=0)return;
  ogBudget--;
  ogQueue.push({a:a,node:node,gen:gen});
  pumpOg();
}
function pumpOg(){
  if(ogInflight>=2||!ogQueue.length)return;
  var job=ogQueue.shift();
  if(job.gen!==loadGen){pumpOg();return}
  if(ogCache[job.a.link]!==undefined){
    if(ogCache[job.a.link]){job.a.image=ogCache[job.a.link];setThumb(job.node,job.a.image)}
    pumpOg();return;
  }
  ogInflight++;
  var done=function(){ogInflight--;pumpOg()};
  myllmFetch(job.a.link).then(function(r){
    var body=String(r&&r.body||'');
    var m=body.match(/property=["']og:image["'][^>]+content=["']([^"']+)["']/i)
        ||body.match(/content=["']([^"']+)["'][^>]+property=["']og:image["']/i);
    ogCache[job.a.link]=m?m[1]:null;
    if(m&&job.gen===loadGen){job.a.image=m[1];setThumb(job.node,m[1])}
    done();
  },function(){ogCache[job.a.link]=null;done()});
}

function strip(html){
  if(!html)return'';
  var d=document.createElement('div');d.innerHTML=html;
  var t=(d.textContent||'').replace(/\s+/g,' ').trim();
  return t.length>200?t.slice(0,200)+'…':t;
}
function ago(d){
  if(!d)return'';var t=new Date(d);if(isNaN(t))return'';
  var s=Math.round((Date.now()-t)/1000);
  if(s<60)return'just now';
  if(s<3600)return Math.round(s/60)+'m ago';
  if(s<86400)return Math.round(s/3600)+'h ago';
  return Math.round(s/86400)+'d ago';
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function thumb(a){
  if(a.image)return '<div class="thumb"><img loading="lazy" src="'+esc(a.image)+'" data-orig="'+esc(a.image)+'" onerror="imgFallback(this)"></div>';
  return '<div class="thumb"><span class="ph"><svg class="i"><use href="#i-news"/></svg></span></div>';
}

// Hotlink rescue: some outlets' CDNs (Japan Times…) 403 any image request
// whose Referer isn't their own site — a webview <img> can never satisfy
// that. On error, refetch ONCE through the native bridge with the image's
// own origin as Referer and swap in a data URL; if that also fails, show
// the placeholder as before.
function imgFallback(img){
  var src=img.getAttribute('data-orig');
  img.removeAttribute('data-orig');                       // one retry only
  if(!src||!window.myllmFetch){phImg(img);return}
  var origin=(src.match(/^https?:\/\/[^\/]+/)||[])[0];
  if(!origin){phImg(img);return}
  myllmFetch(src,{headers:{'Referer':origin+'/'}}).then(function(r){
    var b64=r&&(r.bodyBase64||r.base64);
    if(r&&r.ok&&b64){
      var ct=(r.headers&&(r.headers['Content-Type']||r.headers['content-type']))||'image/jpeg';
      img.src='data:'+ct+';base64,'+b64;
    }else phImg(img);
  }).catch(function(){phImg(img)});
}
// the row may have been re-rendered by the time a thumbnail fails: no parent, nothing to do
function tmbFallback(img){if(img.parentNode)img.parentNode.innerHTML='<svg class="i"><use href="#i-news"/></svg>'}
function phImg(img){
  img.style.display='none';
  if(img.parentNode)img.parentNode.innerHTML='<span class="ph"><svg class="i"><use href="#i-news"/></svg></span>';
}

// comes from SRC_LEAN). Each entry's own RSS feed supplies the story match AND
// its thumbnail. Feeds land in the shared session `cache` (per-feed cache);
// matched results are cached per story below.
var SPECTRUM=[

  {src:"The Guardian",   url:"https://www.theguardian.com/uk/rss"},
  {src:"The Independent",url:"https://www.independent.co.uk/news/rss"},

function miniBar(pos){return pos==null?'':'<span class="mini"><i style="left:'+pos+'%"></i></span>'}

var STOP={'this':1,'that':1,'with':1,'from':1,'have':1,'will':1,'after':1,'over':1,'into':1,'says':1,'said':1,'what':1,'when':1,'where':1,'while':1,'been':1,'were':1,'they':1,'their':1,'them':1,'there':1,'about':1,'more':1,'than':1,'against':1,'amid':1,'could':1,'would':1,'should':1,'year':1,'years':1,'week':1,'today':1,'first':1,'last':1,'live':1,'news':1,'your':1,'just':1,'like':1,'make':1,'take':1,'takes':1,'before':1,'being':1,'between':1,'during':1,'under':1,'because':1,'reveals':1,'revealed':1,'still':1,'down':1,'back':1};
function kws(t){return String(t||'').toLowerCase().replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(function(w){return w.length>3&&!STOP[w]})}

function getFeed(url){
  if(cache[url])return Promise.resolve(cache[url]);
  return myllmFetch(url,{headers:{Accept:'application/rss+xml,application/atom+xml,application/xml,text/xml'}})
    .then(function(r){
      if(!r||!r.ok)throw new Error('feed');
      var items=parse(r.body);
      cache[url]=items;
      return items;
    });
}

var ovlNode=null,covCache={}; // per-story coverage cache: link → {items,summary}
function closeCoverage(){if(ovlNode){ovlNode.parentNode.removeChild(ovlNode);ovlNode=null;document.body.style.overflow=''}}
function openCoverage(a){
  haptic('selection');
  closeCoverage();
  var ovl=document.createElement('div');ovl.id='ovl';ovlNode=ovl;
  ovl.innerHTML='<div class="sheet" role="dialog" aria-label="Coverage across channels">'+
    '<div class="sh-head"><div class="sh-t">Across the spectrum</div><button class="sh-x" aria-label="Close"><svg class="i"><use href="#i-close"/></svg></button></div>'+
    '<div class="sh-story">'+esc(a.title)+'</div>'+
    '<div class="sh-sum" id="shSum" style="display:none"></div>'+
    '<div class="sh-body" id="shBody"><div class="sh-load">Checking channels across the spectrum…</div></div></div>';
  ovl.addEventListener('click',function(e){if(e.target===ovl)closeCoverage()});
  document.body.appendChild(ovl);
  ovl.querySelector('.sh-x').onclick=closeCoverage;
  document.body.style.overflow='hidden';
  var body=ovl.querySelector('#shBody');
  var key=a.link||a.title;
  if(covCache[key]){renderCoverage(a,covCache[key],ovl);return}
  if(!window.myllmFetch){body.innerHTML='<div class="sh-empty">Network access is off — enable it in Settings → MyLLMos Apps.</div>';return}
  var cur=(a.src||'').toLowerCase();
  var panel=SPECTRUM.filter(function(s){var n=s.src.toLowerCase();return !cur||(n.indexOf(cur)===-1&&cur.indexOf(n)===-1)});
  Promise.all(panel.map(function(s){
    return getFeed(s.url).then(function(items){return{s:s,items:items}},function(){return null});
  })).then(function(feeds){
    if(!ovlNode)return;
    var want=kws(a.title),matched=[];
    feeds.forEach(function(f){
      if(!f)return;
      var best=null,bestScore=1; // need ≥2 shared keywords to count as the same story
      f.items.forEach(function(it){
        var seen={},score=0;
        kws(it.title+' '+(it.excerpt||'')).forEach(function(w){seen[w]=1});
        want.forEach(function(w){if(seen[w]){score++;seen[w]=0}});
        if(score>bestScore){bestScore=score;best=it}
      });
      if(best)matched.push({s:f.s,it:best});
    });
    matched.sort(function(x,y){return SRC_LEAN[x.s.src].pos-SRC_LEAN[y.s.src].pos}); // left → right
    covCache[key]={items:matched,summary:null};
    renderCoverage(a,covCache[key],ovl);
  });
}
function renderCoverage(a,entry,ovl){
  var body=ovl.querySelector('#shBody');
  if(!entry.items.length){

    return;
  }
  body.innerHTML=entry.items.map(function(m){
    var t=ago(m.it.date);
    var tmb=m.it.image
      ?'<span class="tmb"><img loading="lazy" src="'+esc(m.it.image)+'" onerror="tmbFallback(this)"></span>'
      :'<span class="tmb"><svg class="i"><use href="#i-news"/></svg></span>';
    return '<a class="cvg" href="'+esc(m.it.link||'#')+'" target="_blank" rel="noopener">'+tmb+
      '<span class="cbody"><span class="cvg-src">'+miniBar(SRC_LEAN[m.s.src].pos)+'<span>'+esc(m.s.src)+'</span>'+(t?'<span class="when">'+t+'</span>':'')+'</span>'+
      '<h4>'+esc(m.it.title)+'</h4></span></a>';
  }).join('');

}
function showSummary(ovl,text){

function summarize(a,entry,ovl){
  if(!window.myllmAsk)return;
  var sum=ovl.querySelector('#shSum');
  sum.style.display='block';
  sum.innerHTML='<b>AI summary</b><span class="sh-wait">Reading the coverage…</span>';
  var lines=entry.items.map(function(m){return '- "'+m.it.title+'" ('+m.s.src+')'}).join('\n');
  var p='Different news channels are covering the same story.\nOriginal headline: "'+a.title+'" ('+(a.src||'')+')\nOther channels:\n'+lines+
        '\n\nIn 2-3 short sentences, neutrally summarise the story and note briefly whether the channels frame it differently. Plain text only, no lists, no preamble.';
  myllmAsk(p).then(function(r){
    r=String(r||'').trim();
    if(r)entry.summary=r; // cached with the story
    if(!ovlNode)return;

}

function paint(){

      '<h2>'+esc(hero.title)+'</h2>'+
      (hero.excerpt?'<p class="excerpt">'+esc(hero.excerpt)+'</p>':'')+
      leanBadge(hero)+
      '</div></a>'
  ):'';
  if(hero)wireLean(el('hero'),hero);
  ogBudget=10;                        // fresh rescue allowance per topic load
  ogQueue=[];
  if(hero)rescueImage(hero,el('hero'),loadGen);
  shown=1;
  el('grid').innerHTML='';

}
function more(){
  var slice=articles.slice(shown,shown+PAGE),frag=document.createDocumentFragment();
  slice.forEach(function(a){
    var card=document.createElement('a');
    card.className='card';card.href=a.link||'#';card.target='_blank';card.rel='noopener';
    card.innerHTML=thumb(a)+'<div class="body"><div class="meta">'+metaLine(a)+'</div><h3>'+esc(a.title)+'</h3>'+leanBadge(a)+'</div>';
    wireLean(card,a);
    card.addEventListener('click',function(){haptic('light')});

    frag.appendChild(card);

  el('grid').appendChild(frag);
  shown+=slice.length;
  var b=el('more');
  if(shown>=articles.length){b.style.display='none'}
  else{b.style.display='block';b.disabled=false;b.textContent='Load more'}
}

var PERSPS=[
  {id:"all",  name:"Balanced"},
  {id:"left", name:"Lean left"},
  {id:"centre",name:"Centre"},
  {id:"right",name:"Lean right"}
];
var prefs={region:"uk",persp:"all"};
var BASE_TOPICS=TOPICS;   // keep the originals; effective list derives from them

function perspKeeps(srcName){
  if(prefs.persp==="all")return true;
  var l=SRC_LEAN[srcName];var pos=l?l.pos:50;
  if(prefs.persp==="left")return pos<=55;
  if(prefs.persp==="right")return pos>=45;
  return pos>=40&&pos<=60;   // centre
}
function applyPrefs(){
  var region=null;
  for(var i=0;i<REGIONS.length;i++)if(REGIONS[i].id===prefs.region)region=REGIONS[i];
  TOPICS=BASE_TOPICS.map(function(t){
    var name=t.name,srcs=t.srcs;
    if(region&&region.top){
      if(t.name==="Top")srcs=region.top;
      else if(t.name==="UK"){name=region.localName;srcs=region.local||region.top}
      else if(t.name==="Politics"&&region.politics)srcs=region.politics;
      else if(region.topics&&region.topics[t.name])srcs=region.topics[t.name];
    }
    // perspective filter — never below 2 channels (falls back to the full mix,
    // so a lens can thin the blend but can't empty it)
    var kept=srcs.filter(function(s){return perspKeeps(s.src)});
    if(kept.length<2)kept=srcs;
    return {name:name,srcs:kept};
  });
  if(active>=TOPICS.length)active=0;
}

function openPrefs(){
  haptic('selection');
  renderPrefChips();
  el('prefs').classList.add('on');
}
function closePrefs(){
  el('prefs').classList.remove('on');
  cache={};                 // fresh sources → fresh wall
  applyPrefs();
  buildTabs();
  load();
  window.scrollTo(0,0);
}
function renderPrefChips(){
  el('regionChips').innerHTML=REGIONS.map(function(r){
    return '<button class="'+(prefs.region===r.id?'on':'')+'" onclick="setRegion(\''+r.id+'\')">'+r.name+'</button>';
  }).join('');
  el('perspChips').innerHTML=PERSPS.map(function(p){
    return '<button class="'+(prefs.persp===p.id?'on':'')+'" onclick="setPersp(\''+p.id+'\')">'+p.name+'</button>';
  }).join('');
}
function setRegion(id){prefs.region=id;haptic('selection');savePrefs();renderPrefChips()}
function setPersp(id){prefs.persp=id;haptic('selection');savePrefs();renderPrefChips()}
function savePrefs(){store.setItem('hl_prefs',JSON.stringify(prefs))}

// boot: restore prefs, then build the wall
store.getItem('hl_prefs').then(function(v){
  if(v){try{var p=JSON.parse(v);if(p&&p.region)prefs=p}catch(e){}}
  applyPrefs();
  buildTabs();
  load();
});

<script>
(function(){if(window.__myllmAiWrap||typeof window.myllmAsk!=='function')return;window.__myllmAiWrap=true;
var orig=window.myllmAsk,depth=0,node=null;
function ensure(){if(node)return;node=document.createElement('div');node.className='myllm-ai-busy';
node.innerHTML='<span class="myllm-ai-cog"><svg class="i"><use href="#i-gear"/></svg></span><span>AI is thinking… <small>privately, on your device</small></span>';
(document.body||document.documentElement).appendChild(node);}
function show(){ensure();depth++;node.classList.add('on');}
function hide(){depth=Math.max(0,depth-1);if(depth===0&&node)node.classList.remove('on');}
window.myllmAsk=function(){show();var p;try{p=orig.apply(this,arguments);}catch(e){hide();throw e;}
return Promise.resolve(p).then(function(r){hide();return r;},function(e){hide();throw e;});};})();

/* myllm-fullscreen-v2 — full screen where MyLLM can also close the app for us
   (myllmClose, 5.6.2+): full screen hides MyLLM's Done, and a page with no way
   out is worse than a repeated title, so elsewhere nothing changes.
   The spacer keeps the header clear of the status bar / Dynamic Island. It is
   live CSS — env(safe-area-inset-top) — not a measured number: the inset is
   still 0 when the page loads and only grows once MyLLM's bar has gone (v1
   measured once, so the title sat under the island). If the page's own styles
   already pad the header down by the inset, the spacer stays at 0. */
(function(){
  function full(){ return !!(window.myllmClose && window.myllmImmersive); }
  /* Does any rule that applies to the header or an ancestor already use the top inset? */
  function pageHandlesInset(head){
    var chain = [], n, found = false;
    for (n = head; n && n.nodeType === 1; n = n.parentElement) chain.push(n);
    function walk(rules){
      for (var i = 0; i < rules.length && !found; i++){
        var r = rules[i];
        if (r.cssRules && !r.selectorText) { walk(r.cssRules); continue; }
        if (!r.selectorText || !/safe-area-inset-top/.test(r.cssText) || !/(padding|margin|top)\s*:/.test(r.cssText)) continue;
        if (/\.imm-safe/.test(r.selectorText)) continue;
        for (var k = 0; k < chain.length; k++){
          try { if (chain[k].matches(r.selectorText)) { found = true; break; } } catch(e){}
        }
      }
    }
    for (var s = 0; s < document.styleSheets.length && !found; s++){
      try { walk(document.styleSheets[s].cssRules); } catch(e){}
    }
    for (n = head; n && n.nodeType === 1 && !found; n = n.parentElement){
      if (/safe-area-inset-top/.test(n.getAttribute("style") || "")) found = true;
    }
    return found;
  }
  function fit(){
    var sp = document.querySelector(".imm-safe"), head = document.querySelector(".head");
    if (!sp || !head) return;
    sp.style.height = (document.body.classList.contains("imm") && !pageHandlesInset(head)) ? "env(safe-area-inset-top)" : "0px";
  }
  function sync(){
    var f = full();
    document.body.classList.toggle("imm", f);
    fit();
    if (!f) return;
    try { window.myllmImmersive(true, { keepAwake:false }).catch(function(){}); } catch(e){}
  }
  window.myllmFSClose = function(){
    try { if (window.myllmHaptic) window.myllmHaptic("light"); } catch(e){}
    try { window.myllmClose().catch(function(){}); } catch(e){}
  };
  document.addEventListener("visibilitychange", function(){ if (!document.hidden) sync(); });
  sync();
})();
</script>
