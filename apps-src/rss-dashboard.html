<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Headlines</title>
<style>
:root{
  color-scheme:light dark;
  --bg:var(--myllm-bg,#f2f2f7);
  --surface:var(--myllm-surface,#fff);
  --text:var(--myllm-text,#111);
  --muted:var(--myllm-muted,#6b6b72);
  --accent:var(--myllm-accent,#0b5ed7);
  --border:var(--myllm-border,rgba(120,120,128,.22));
  --radius:var(--myllm-radius,14px);
  --font:var(--myllm-font,-apple-system,system-ui,sans-serif);
}
@media(prefers-color-scheme:dark){
  :root{--bg:var(--myllm-bg,#000);--surface:var(--myllm-surface,#1c1c1e);--text:var(--myllm-text,#eee);--muted:var(--myllm-muted,#98989f)}
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);-webkit-text-size-adjust:100%}
.head{position:sticky;top:0;z-index:10;background:var(--bg);padding:10px 0 0;border-bottom:1px solid var(--border)}
#tabs{display:flex;gap:6px;overflow-x:auto;padding:0 16px 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;padding:8px 14px;border-radius:999px;background:var(--surface);color:var(--muted);font:inherit;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;border:1px solid var(--border)}
.tab.on{background:var(--accent);color:#fff;border-color:transparent}
#status{padding:40px 24px;text-align:center;color:var(--muted);font-size:15px;line-height:1.5}
.wrap{padding:14px 16px 28px;max-width:780px;margin:0 auto}
a.card,a.hero{display:block;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;-webkit-tap-highlight-color:transparent}
a.hero{margin-bottom:16px}
.thumb{width:100%;background:linear-gradient(135deg,var(--accent),#7b5cff);position:relative;display:flex;align-items:center;justify-content:center}
.hero .thumb{aspect-ratio:16/9}
.card .thumb{aspect-ratio:16/10}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .ph{font-size:34px;opacity:.85}
.body{position:relative;padding:13px 15px 26px}
.lean{position:absolute;right:14px;bottom:12px;width:36px;height:4px;border-radius:2px;background:linear-gradient(90deg,#3b6fd4,#8e8e93 50%,#c0392b);opacity:.85;cursor:pointer}
.lean::before{content:'';position:absolute;inset:-14px -12px} /* enlarged tap target */
.lean i{position:absolute;top:50%;transform:translate(-50%,-50%);width:9px;height:9px;border-radius:50%;background:var(--surface);border:2px solid var(--text)}
#ovl{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:82vh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;overflow:hidden;padding-bottom:env(safe-area-inset-bottom)}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px}
.sh-t{font-size:17px;font-weight:700}
.sh-x{border:0;background:var(--surface);color:var(--muted);width:30px;height:30px;border-radius:50%;font-size:15px;cursor:pointer;border:1px solid var(--border)}
.sh-story{padding:0 16px 10px;font-size:13px;color:var(--muted);line-height:1.4}
.sh-sum{margin:0 16px 12px;padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:12px;font-size:14px;line-height:1.5}
.sh-sum b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--accent);margin-bottom:5px}
.sh-sum .sh-wait{color:var(--muted);font-size:13px}
.sh-body{overflow-y:auto;padding:0 16px 20px;-webkit-overflow-scrolling:touch}
.sh-load,.sh-empty{padding:26px 0;text-align:center;color:var(--muted);font-size:14px;line-height:1.5}
a.cvg{display:flex;gap:11px;align-items:center;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px;margin-bottom:9px}
.cvg .tmb{flex:none;width:62px;height:62px;border-radius:9px;overflow:hidden;background:linear-gradient(135deg,var(--accent),#7b5cff);display:flex;align-items:center;justify-content:center;font-size:22px}
.cvg .tmb img{width:100%;height:100%;object-fit:cover;display:block}
.cvg .cbody{display:block;min-width:0}
.cvg-src{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;color:var(--accent);margin-bottom:4px}
.cvg-src .when{font-weight:600;color:var(--muted);text-transform:none;letter-spacing:0;margin-left:auto}
.cvg h4{margin:0;font-size:14px;line-height:1.4;font-weight:600}
.mini{position:relative;width:26px;height:3px;border-radius:2px;background:linear-gradient(90deg,#3b6fd4,#8e8e93 50%,#c0392b);flex:none}
.mini i{position:absolute;top:50%;transform:translate(-50%,-50%);width:7px;height:7px;border-radius:50%;background:var(--surface);border:1.5px solid var(--text)}
.hero .body h2{font-size:20px;line-height:1.3;margin:0 0 8px;font-weight:700}
.hero .excerpt{font-size:14px;line-height:1.5;color:var(--muted);margin:0}
.card .body h3{font-size:16px;line-height:1.35;margin:0;font-weight:600}
.meta{font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--accent);margin-bottom:7px;text-transform:uppercase}
.card .meta{margin-bottom:6px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
#more{display:block;margin:22px auto 0;padding:11px 22px;background:var(--accent);color:#fff;border:0;border-radius:10px;font:inherit;font-size:15px;font-weight:600;cursor:pointer}
#more[disabled]{opacity:.5}
@media(prefers-reduced-motion:no-preference){a.card,a.hero{transition:transform .12s ease}a.card:active,a.hero:active{transform:scale(.985)}}
</style>
</head>
<body>

<div class="head">
  <div id="tabs"></div>
</div>

<div id="status"></div>
<div class="wrap">
  <div id="hero"></div>
  <div id="grid"></div>
  <button id="more" style="display:none">Load more</button>
</div>

<script>
// Each topic blends several channels across the spectrum; stories are
// interleaved round-robin so no single outlet dominates the top of the wall.
var TOPICS=[
  {name:"Top",srcs:[
    {src:"BBC",url:"https://feeds.bbci.co.uk/news/rss.xml"},
    {src:"Sky News",url:"https://feeds.skynews.com/feeds/rss/home.xml"},
    {src:"The Independent",url:"https://www.independent.co.uk/news/rss"},
    {src:"Daily Express",url:"https://www.express.co.uk/posts/rss/1"}]},
  {name:"World",srcs:[
    {src:"BBC",url:"https://feeds.bbci.co.uk/news/world/rss.xml"},
    {src:"The Guardian",url:"https://www.theguardian.com/world/rss"},
    {src:"Al Jazeera",url:"https://www.aljazeera.com/xml/rss/all.xml"},
    {src:"Sky News",url:"https://feeds.skynews.com/feeds/rss/world.xml"}]},
  {name:"UK",srcs:[
    {src:"BBC",url:"https://feeds.bbci.co.uk/news/uk/rss.xml"},
    {src:"The Guardian",url:"https://www.theguardian.com/uk-news/rss"},
    {src:"The Sun",url:"https://www.thesun.co.uk/news/feed/"},
    {src:"Daily Express",url:"https://www.express.co.uk/posts/rss/1"}]},
  {name:"Business",srcs:[
    {src:"BBC",url:"https://feeds.bbci.co.uk/news/business/rss.xml"},
    {src:"The Guardian",url:"https://www.theguardian.com/uk/business/rss"},
    {src:"Sky News",url:"https://feeds.skynews.com/feeds/rss/business.xml"}]},
  {name:"Technology",srcs:[
    {src:"Ars Technica",url:"https://feeds.arstechnica.com/arstechnica/index"},
    {src:"BBC",url:"https://feeds.bbci.co.uk/news/technology/rss.xml"},
    {src:"The Guardian",url:"https://www.theguardian.com/uk/technology/rss"},
    {src:"Sky News",url:"https://feeds.skynews.com/feeds/rss/technology.xml"}]},
  {name:"Science",srcs:[
    {src:"BBC",url:"https://feeds.bbci.co.uk/news/science_and_environment/rss.xml"},
    {src:"The Guardian",url:"https://www.theguardian.com/science/rss"}]},
  {name:"Health",srcs:[
    {src:"BBC",url:"https://feeds.bbci.co.uk/news/health/rss.xml"},
    {src:"The Guardian",url:"https://www.theguardian.com/society/rss"}]},
  {name:"Politics",srcs:[
    {src:"BBC",url:"https://feeds.bbci.co.uk/news/politics/rss.xml"},
    {src:"The Guardian",url:"https://www.theguardian.com/politics/rss"},
    {src:"Sky News",url:"https://feeds.skynews.com/feeds/rss/politics.xml"},
    {src:"GB News",url:"https://www.gbnews.com/feeds/politics.rss"},
    {src:"Daily Express",url:"https://www.express.co.uk/posts/rss/139"}]},
  {name:"Entertainment",srcs:[
    {src:"BBC",url:"https://feeds.bbci.co.uk/news/entertainment_and_arts/rss.xml"},
    {src:"The Guardian",url:"https://www.theguardian.com/culture/rss"},
    {src:"The Sun",url:"https://www.thesun.co.uk/tvandshowbiz/feed/"},
    {src:"New York Post",url:"https://nypost.com/entertainment/feed/"}]},
  {name:"Sport",srcs:[
    {src:"BBC",url:"https://feeds.bbci.co.uk/sport/rss.xml"},
    {src:"The Guardian",url:"https://www.theguardian.com/uk/sport/rss"},
    {src:"Daily Mirror",url:"https://www.mirror.co.uk/sport/rss.xml"}]},
  {name:"Environment",srcs:[
    {src:"The Guardian",url:"https://www.theguardian.com/environment/rss"},
    {src:"BBC",url:"https://feeds.bbci.co.uk/news/science_and_environment/rss.xml"}]},
  {name:"Football",srcs:[
    {src:"The Guardian",url:"https://www.theguardian.com/football/rss"},
    {src:"The Sun",url:"https://www.thesun.co.uk/sport/football/feed/"}]},
  {name:"Film",srcs:[{src:"The Guardian",url:"https://www.theguardian.com/film/rss"}]},
  {name:"Music",srcs:[{src:"The Guardian",url:"https://www.theguardian.com/music/rss"}]},
  {name:"Games",srcs:[{src:"The Guardian",url:"https://www.theguardian.com/games/rss"}]},
  {name:"Food",srcs:[{src:"The Guardian",url:"https://www.theguardian.com/food/rss"}]},
  {name:"Travel",srcs:[{src:"The Guardian",url:"https://www.theguardian.com/travel/rss"}]},
  {name:"Books",srcs:[{src:"The Guardian",url:"https://www.theguardian.com/books/rss"}]}
];

var PAGE=8, active=0, shown=0, articles=[], cache={};
function el(i){return document.getElementById(i)}
function setStatus(t){var s=el('status');s.style.display=t?'block':'none';s.textContent=t||''}
function haptic(k){if(window.myllmHaptic)try{myllmHaptic(k)}catch(e){}}

function buildTabs(){
  var T=el('tabs');T.innerHTML='';
  TOPICS.forEach(function(t,i){
    var b=document.createElement('button');
    b.className='tab'+(i===active?' on':'');
    b.textContent=t.name;
    b.onclick=function(){
      haptic('selection');
      if(i===active){TOPICS[i].srcs.forEach(function(s){delete cache[s.url]})} // tap active tab to refresh
      active=i;
      buildTabs();
      load();
      window.scrollTo(0,0);
    };
    T.appendChild(b);
  });
}

var loadGen=0;
function load(){
  var t=TOPICS[active];
  el('hero').innerHTML='';el('grid').innerHTML='';el('more').style.display='none';
  shown=0;
  if(!window.myllmFetch){setStatus('Headlines needs network access — update MyLLM and turn on “Allow apps to use the network” in Settings → MyLLMos Apps.');return}
  setStatus('Loading '+t.name+'…');
  var gen=++loadGen;
  Promise.all(t.srcs.map(function(s){
    return getFeed(s.url).then(function(items){
      items.forEach(function(it){it.src=s.src});
      return items;
    },function(){return null});
  })).then(function(feeds){
    if(gen!==loadGen)return; // user switched topic while loading
    var ok=feeds.filter(function(f){return f&&f.length});
    if(!ok.length){setStatus('Couldn’t load '+t.name+' from any of its channels.\nTap the topic again to retry.');return}
    articles=interleave(ok);
    setStatus('');paint();
  });
}

// Round-robin merge: story i of each channel in turn, so the wall opens with
// one story per outlet rather than a block from whichever feed is largest.
function interleave(feeds){
  var out=[],i=0,added=true;
  while(added&&out.length<60){
    added=false;
    for(var f=0;f<feeds.length;f++){
      if(i<feeds[f].length&&i<15){out.push(feeds[f][i]);added=true}
    }
    i++;
  }
  return out;
}

function parse(xml){
  var doc=new DOMParser().parseFromString(xml,'text/xml');
  var nodes=doc.getElementsByTagName('item');
  var atom=false;
  if(!nodes.length){nodes=doc.getElementsByTagName('entry');atom=true}
  var out=[];
  for(var i=0;i<nodes.length;i++){
    var n=nodes[i];
    var title=text(n,'title');
    if(!title)continue;
    var link=text(n,'link');
    if(atom||!link){
      var ls=n.getElementsByTagName('link');
      for(var k=0;k<ls.length;k++){var h=ls[k].getAttribute('href');if(h){link=h;if((ls[k].getAttribute('rel')||'alternate')==='alternate')break}}
    }
    var desc=text(n,'description')||text(n,'summary')||text(n,'content');
    out.push({
      title:title,
      link:link,
      date:text(n,'pubDate')||text(n,'updated')||text(n,'published')||text(n,'date'),
      excerpt:strip(desc),
      image:imageOf(n,desc)
    });
  }
  return out;
}

function text(node,tag){var e=node.getElementsByTagName(tag)[0];return e?e.textContent.trim():''}

// Pull the best image: media:content/thumbnail (largest), then enclosure,
// then the first <img> embedded in the description HTML.
function imageOf(node,descHtml){
  var best=null,bestW=-1;
  function consider(url,w,type){
    if(!url)return;
    if(type&&type.indexOf('image')===-1&&type!=='image'&&!/\.(jpe?g|png|webp|gif)(\?|$)/i.test(url))return;
    w=parseInt(w)||0;
    if(w>bestW){best=url;bestW=w}
  }
  ['media:content','media:thumbnail'].forEach(function(tag){
    var els=node.getElementsByTagName(tag);
    for(var i=0;i<els.length;i++)consider(els[i].getAttribute('url'),els[i].getAttribute('width'),els[i].getAttribute('type')||els[i].getAttribute('medium'));
  });
  if(!best){
    var enc=node.getElementsByTagName('enclosure');
    for(var j=0;j<enc.length;j++)consider(enc[j].getAttribute('url'),enc[j].getAttribute('width'),enc[j].getAttribute('type'));
  }
  if(!best&&descHtml){var m=descHtml.match(/<img[^>]+src=["']([^"']+)["']/i);if(m)best=m[1]}
  return best;
}

function strip(html){
  if(!html)return'';
  var d=document.createElement('div');d.innerHTML=html;
  var t=(d.textContent||'').replace(/\s+/g,' ').trim();
  return t.length>200?t.slice(0,200)+'…':t;
}
function ago(d){
  if(!d)return'';var t=new Date(d);if(isNaN(t))return'';
  var s=Math.round((Date.now()-t)/1000);
  if(s<60)return'just now';
  if(s<3600)return Math.round(s/60)+'m ago';
  if(s<86400)return Math.round(s/3600)+'h ago';
  return Math.round(s/86400)+'d ago';
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function thumb(a){
  if(a.image)return '<div class="thumb"><img loading="lazy" src="'+esc(a.image)+'" onerror="this.style.display=\'none\';this.parentNode.innerHTML=\'<span class=&quot;ph&quot;>🗞️</span>\'"></div>';
  return '<div class="thumb"><span class="ph">🗞️</span></div>';
}
function metaLine(a){var t=ago(a.date);return esc(a.src||'')+(t?' • '+t:'')}

// Political lean per outlet (per AllSides/MBFC-style source ratings),
// shown as a dot on a left–right spectrum bar. 0 = left, 100 = right.
var SRC_LEAN={
  "Daily Mirror":   {pos:28,label:"Left-leaning"},
  "The Guardian":   {pos:28,label:"Left-leaning"},
  "The Independent":{pos:30,label:"Left-leaning"},
  "Ars Technica":   {pos:40,label:"Centre-left"},
  "Al Jazeera":     {pos:40,label:"Centre-left"},
  "Sky News":       {pos:48,label:"Centre"},
  "BBC":            {pos:50,label:"Centre"},
  "The Sun":        {pos:70,label:"Right-leaning"},
  "New York Post":  {pos:70,label:"Right-leaning"},
  "Daily Express":  {pos:72,label:"Right-leaning"},
  "GB News":        {pos:75,label:"Right-leaning"},
  "Fox News":       {pos:78,label:"Right-leaning"}
};
function leanBadge(a){
  var l=SRC_LEAN[a.src];
  if(!l)return'';
  var t='Political lean: '+l.label+'. Tap to compare coverage on other channels.';
  return '<span class="lean" role="button" tabindex="0" title="'+t+'" aria-label="'+t+'"><i style="left:'+l.pos+'%"></i></span>';
}
function wireLean(root,article){
  var b=root.querySelector('.lean');
  if(b)b.onclick=function(e){e.preventDefault();e.stopPropagation();openCoverage(article)};
}

// Fixed panel of channels across the spectrum for the coverage sheet (lean
// comes from SRC_LEAN). Each entry's own RSS feed supplies the story match AND
// its thumbnail. Feeds land in the shared session `cache` (per-feed cache);
// matched results are cached per story below.
var SPECTRUM=[
  {src:"Daily Mirror",   url:"https://www.mirror.co.uk/news/rss.xml"},
  {src:"The Guardian",   url:"https://www.theguardian.com/uk/rss"},
  {src:"The Independent",url:"https://www.independent.co.uk/news/rss"},
  {src:"Al Jazeera",     url:"https://www.aljazeera.com/xml/rss/all.xml"},
  {src:"Sky News",       url:"https://feeds.skynews.com/feeds/rss/home.xml"},
  {src:"BBC",            url:"https://feeds.bbci.co.uk/news/rss.xml"},
  {src:"The Sun",        url:"https://www.thesun.co.uk/news/feed/"},
  {src:"New York Post",  url:"https://nypost.com/feed/"},
  {src:"Daily Express",  url:"https://www.express.co.uk/posts/rss/1"},
  {src:"GB News",        url:"https://www.gbnews.com/feeds/politics.rss"},
  {src:"Fox News",       url:"https://moxie.foxnews.com/google-publisher/latest.xml"}
];
function miniBar(pos){return pos==null?'':'<span class="mini"><i style="left:'+pos+'%"></i></span>'}

var STOP={'this':1,'that':1,'with':1,'from':1,'have':1,'will':1,'after':1,'over':1,'into':1,'says':1,'said':1,'what':1,'when':1,'where':1,'while':1,'been':1,'were':1,'they':1,'their':1,'them':1,'there':1,'about':1,'more':1,'than':1,'against':1,'amid':1,'could':1,'would':1,'should':1,'year':1,'years':1,'week':1,'today':1,'first':1,'last':1,'live':1,'news':1,'your':1,'just':1,'like':1,'make':1,'take':1,'takes':1,'before':1,'being':1,'between':1,'during':1,'under':1,'because':1,'reveals':1,'revealed':1,'still':1,'down':1,'back':1};
function kws(t){return String(t||'').toLowerCase().replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(function(w){return w.length>3&&!STOP[w]})}

function getFeed(url){
  if(cache[url])return Promise.resolve(cache[url]);
  return myllmFetch(url,{headers:{Accept:'application/rss+xml,application/atom+xml,application/xml,text/xml'}})
    .then(function(r){
      if(!r||!r.ok)throw new Error('feed');
      var items=parse(r.body);
      cache[url]=items;
      return items;
    });
}

var ovlNode=null,covCache={}; // per-story coverage cache: link → {items,summary}
function closeCoverage(){if(ovlNode){ovlNode.parentNode.removeChild(ovlNode);ovlNode=null;document.body.style.overflow=''}}
function openCoverage(a){
  haptic('selection');
  closeCoverage();
  var ovl=document.createElement('div');ovl.id='ovl';ovlNode=ovl;
  ovl.innerHTML='<div class="sheet" role="dialog" aria-label="Coverage across channels">'+
    '<div class="sh-head"><div class="sh-t">Across the spectrum</div><button class="sh-x" aria-label="Close">✕</button></div>'+
    '<div class="sh-story">'+esc(a.title)+'</div>'+
    '<div class="sh-sum" id="shSum" style="display:none"></div>'+
    '<div class="sh-body" id="shBody"><div class="sh-load">Checking channels across the spectrum…</div></div></div>';
  ovl.addEventListener('click',function(e){if(e.target===ovl)closeCoverage()});
  document.body.appendChild(ovl);
  ovl.querySelector('.sh-x').onclick=closeCoverage;
  document.body.style.overflow='hidden';
  var body=ovl.querySelector('#shBody');
  var key=a.link||a.title;
  if(covCache[key]){renderCoverage(a,covCache[key],ovl);return}
  if(!window.myllmFetch){body.innerHTML='<div class="sh-empty">Network access is off — enable it in Settings → MyLLMos Apps.</div>';return}
  var cur=(a.src||'').toLowerCase();
  var panel=SPECTRUM.filter(function(s){var n=s.src.toLowerCase();return !cur||(n.indexOf(cur)===-1&&cur.indexOf(n)===-1)});
  Promise.all(panel.map(function(s){
    return getFeed(s.url).then(function(items){return{s:s,items:items}},function(){return null});
  })).then(function(feeds){
    if(!ovlNode)return;
    var want=kws(a.title),matched=[];
    feeds.forEach(function(f){
      if(!f)return;
      var best=null,bestScore=1; // need ≥2 shared keywords to count as the same story
      f.items.forEach(function(it){
        var seen={},score=0;
        kws(it.title+' '+(it.excerpt||'')).forEach(function(w){seen[w]=1});
        want.forEach(function(w){if(seen[w]){score++;seen[w]=0}});
        if(score>bestScore){bestScore=score;best=it}
      });
      if(best)matched.push({s:f.s,it:best});
    });
    matched.sort(function(x,y){return SRC_LEAN[x.s.src].pos-SRC_LEAN[y.s.src].pos}); // left → right
    covCache[key]={items:matched,summary:null};
    renderCoverage(a,covCache[key],ovl);
  });
}
function renderCoverage(a,entry,ovl){
  var body=ovl.querySelector('#shBody');
  if(!entry.items.length){
    body.innerHTML='<div class="sh-empty">None of the other channels on the panel are carrying this story right now.</div>';
    return;
  }
  body.innerHTML=entry.items.map(function(m){
    var t=ago(m.it.date);
    var tmb=m.it.image
      ?'<span class="tmb"><img loading="lazy" src="'+esc(m.it.image)+'" onerror="this.parentNode.innerHTML=\'📰\'"></span>'
      :'<span class="tmb">📰</span>';
    return '<a class="cvg" href="'+esc(m.it.link||'#')+'" target="_blank" rel="noopener">'+tmb+
      '<span class="cbody"><span class="cvg-src">'+miniBar(SRC_LEAN[m.s.src].pos)+'<span>'+esc(m.s.src)+'</span>'+(t?'<span class="when">'+t+'</span>':'')+'</span>'+
      '<h4>'+esc(m.it.title)+'</h4></span></a>';
  }).join('');
  if(entry.summary){showSummary(ovl,entry.summary)}
  else summarize(a,entry,ovl);
}
function showSummary(ovl,text){
  var sum=ovl.querySelector('#shSum');
  sum.style.display='block';
  sum.innerHTML='<b>AI summary</b>'+esc(text).replace(/\n+/g,'<br>');
}
function summarize(a,entry,ovl){
  if(!window.myllmAsk)return;
  var sum=ovl.querySelector('#shSum');
  sum.style.display='block';
  sum.innerHTML='<b>AI summary</b><span class="sh-wait">Reading the coverage…</span>';
  var lines=entry.items.map(function(m){return '- "'+m.it.title+'" ('+m.s.src+')'}).join('\n');
  var p='Different news channels are covering the same story.\nOriginal headline: "'+a.title+'" ('+(a.src||'')+')\nOther channels:\n'+lines+
        '\n\nIn 2-3 short sentences, neutrally summarise the story and note briefly whether the channels frame it differently. Plain text only, no lists, no preamble.';
  myllmAsk(p).then(function(r){
    r=String(r||'').trim();
    if(r)entry.summary=r; // cached with the story
    if(!ovlNode)return;
    if(r)showSummary(ovl,r);else sum.style.display='none';
  }).catch(function(){if(ovlNode)sum.style.display='none'});
}

function paint(){
  var hero=articles[0];
  el('hero').innerHTML=hero?(
    '<a class="hero" href="'+esc(hero.link||'#')+'" target="_blank" rel="noopener">'+
      thumb(hero)+
      '<div class="body"><div class="meta">'+metaLine(hero)+'</div>'+
      '<h2>'+esc(hero.title)+'</h2>'+
      (hero.excerpt?'<p class="excerpt">'+esc(hero.excerpt)+'</p>':'')+
      leanBadge(hero)+
      '</div></a>'
  ):'';
  if(hero)wireLean(el('hero'),hero);
  shown=1;
  el('grid').innerHTML='';
  more();
}
function more(){
  var slice=articles.slice(shown,shown+PAGE),frag=document.createDocumentFragment();
  slice.forEach(function(a){
    var card=document.createElement('a');
    card.className='card';card.href=a.link||'#';card.target='_blank';card.rel='noopener';
    card.innerHTML=thumb(a)+'<div class="body"><div class="meta">'+metaLine(a)+'</div><h3>'+esc(a.title)+'</h3>'+leanBadge(a)+'</div>';
    wireLean(card,a);
    card.addEventListener('click',function(){haptic('light')});
    frag.appendChild(card);
  });
  el('grid').appendChild(frag);
  shown+=slice.length;
  var b=el('more');
  if(shown>=articles.length){b.style.display='none'}
  else{b.style.display='block';b.disabled=false;b.textContent='Load more'}
}
el('more').onclick=function(){haptic('selection');more()};

buildTabs();
load();
</script>
<style>
@keyframes myllmAiSpin{to{transform:rotate(360deg)}}
.myllm-ai-busy{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(18px);z-index:99999;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;display:flex;align-items:center;gap:10px;background:rgba(28,28,30,.96);color:#fff;border-radius:999px;padding:10px 16px 10px 14px;box-shadow:0 6px 22px rgba(0,0,0,.4);font-size:14px;font-weight:600;max-width:92%}
.myllm-ai-busy.on{opacity:1;transform:translateX(-50%) translateY(0)}
.myllm-ai-cog{font-size:18px;animation:myllmAiSpin 2.4s linear infinite;filter:drop-shadow(0 0 5px rgba(124,92,255,.85))}
.myllm-ai-busy small{font-weight:400;opacity:.6}
</style>
<script>
(function(){if(window.__myllmAiWrap||typeof window.myllmAsk!=='function')return;window.__myllmAiWrap=true;
var orig=window.myllmAsk,depth=0,node=null;
function ensure(){if(node)return;node=document.createElement('div');node.className='myllm-ai-busy';
node.innerHTML='<span class="myllm-ai-cog">⚙️</span><span>AI is thinking… <small>privately, on your device</small></span>';
(document.body||document.documentElement).appendChild(node);}
function show(){ensure();depth++;node.classList.add('on');}
function hide(){depth=Math.max(0,depth-1);if(depth===0&&node)node.classList.remove('on');}
window.myllmAsk=function(){show();var p;try{p=orig.apply(this,arguments);}catch(e){hide();throw e;}
return Promise.resolve(p).then(function(r){hide();return r;},function(e){hide();throw e;});};})();
</script>
