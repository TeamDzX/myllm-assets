<style>:root{--build-id:"b99145b5e9";color-scheme:light dark;
  --bg:var(--myllm-bg,#f2f2f7); --surface:var(--myllm-surface,#fff); --ink:var(--myllm-text,#111);
  --muted:var(--myllm-muted,#8a8a8e); --line:var(--myllm-border,#e3e3e8); --acc:var(--myllm-accent,#0a84ff);
  --fill:rgba(120,120,128,.12); --h:258; }
@media (prefers-color-scheme:dark){ :root{ --bg:var(--myllm-bg,#000); --surface:var(--myllm-surface,#1c1c1e);
  --ink:var(--myllm-text,#f2f2f7); --muted:var(--myllm-muted,#8e8e93); --line:var(--myllm-border,#2c2c2e); --fill:rgba(120,120,128,.24); } }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ font-family:var(--myllm-font,-apple-system,system-ui,sans-serif); background:var(--bg); color:var(--ink);
    max-width:600px; margin:0 auto; min-height:100dvh; font-size:15.5px; line-height:1.4; -webkit-user-select:none; user-select:none;
    padding:calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(30px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left)); }
  @media (min-width:768px){ body{ max-width:720px; } }
  svg.i{ width:1.25em; height:1.25em; fill:currentColor; flex-shrink:0; }
  button{ font:inherit; color:inherit; cursor:pointer; } button:active{ transform:scale(.97); }

  .head{ display:flex; align-items:center; gap:12px; margin:2px 2px 14px; }
  .tile{ display:flex; align-items:center; justify-content:center; color:#fff; flex-shrink:0;
    background:linear-gradient(145deg, hsl(var(--h) 60% 58%), hsl(calc(var(--h) + 25) 50% 38%)); }
  .head .tile{ width:44px; height:44px; border-radius:13px; font-size:19px; }
  .head .ht{ flex:1; min-width:0; }
  h1{ font-size:22px; font-weight:800; letter-spacing:-.01em; }
  .head p{ font-size:13px; color:var(--muted); margin-top:1px; }
  h3{ font-size:12px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); margin:22px 2px 10px; }

  .card{ background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:14px; margin-bottom:12px; }
  label{ display:block; font-size:12px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); margin:14px 2px 7px; }
  label:first-child{ margin-top:0; }
  input,textarea,select{ width:100%; border:1px solid var(--line); background:var(--bg); color:var(--ink); border-radius:12px; padding:12px; font:inherit; font-size:16px; outline:none; -webkit-user-select:text; user-select:text; }
  input:focus,textarea:focus,select:focus{ border-color:var(--acc); }
  select{ -webkit-appearance:none; appearance:none; min-height:48px;
    background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
    background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%; background-size:5px 5px; background-repeat:no-repeat; padding-right:34px; }
  textarea{ min-height:84px; resize:none; line-height:1.45; }
  .rowflex{ display:flex; gap:10px; } .rowflex>div{ flex:1; min-width:0; } .rowflex>div.age{ flex:0 0 38%; }
  .gen{ width:100%; min-height:56px; border:none; background:hsl(var(--h) 60% 52%); color:#fff; border-radius:16px; font-size:17px; font-weight:750; margin-top:16px;
    display:flex; align-items:center; justify-content:center; gap:8px; }
  .gen:disabled{ opacity:.6; }
  .note{ font-size:12.5px; color:var(--muted); margin-top:10px; text-align:center; line-height:1.45; }
  .err{ display:flex; gap:10px; align-items:flex-start; background:rgba(229,72,77,.12); border-radius:14px; padding:12px; font-size:14.5px; line-height:1.45; margin-top:12px; }
  .err svg{ color:#e5484d; margin-top:1px; }
  .spin{ width:16px; height:16px; border-radius:50%; border:2.4px solid currentColor; border-right-color:transparent; animation:spin .8s linear infinite; flex-shrink:0; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* The story itself: large, calm, easy to read aloud together. */
  .story{ background:var(--surface); border:1px solid var(--line); border-radius:22px; padding:22px 20px 18px; margin-top:6px; }
  .story .k{ display:flex; align-items:center; gap:8px; font-size:11.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:hsl(var(--h) 55% 50%); margin-bottom:8px; }
  .story h2{ font-size:24px; font-weight:800; letter-spacing:-.01em; line-height:1.25; margin-bottom:14px; }
  .story p{ font-size:20px; line-height:1.65; margin:0 0 14px; -webkit-user-select:text; user-select:text; }
  .sbtns{ display:flex; gap:10px; margin-top:10px; }
  .sbtns button{ flex:1; min-height:56px; border:none; border-radius:16px; font-size:16px; font-weight:750; display:flex; align-items:center; justify-content:center; gap:8px; }
  .save{ background:hsl(145 50% 40%); color:#fff; } .save:disabled{ opacity:.7; }
  .again{ background:var(--fill); }
  .skel{ height:16px; border-radius:8px; background:var(--fill); margin-top:12px; animation:shimmer 1.6s ease-in-out infinite; }
  .skel.t{ height:24px; width:60%; margin:0 0 6px; } .skel.w8{ width:82%; } .skel.w6{ width:64%; } .skel.w9{ width:94%; }
  @keyframes shimmer{ 50%{ opacity:.45; } }

  .list{ background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:2px 14px; }
  .srow{ display:flex; align-items:center; gap:12px; min-height:60px; border-bottom:1px solid var(--line); cursor:pointer; }
  .srow:last-child{ border-bottom:none; }
  .srow .bk{ width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:15px; color:#fff; flex-shrink:0;
    background:linear-gradient(145deg, hsl(var(--h) 60% 58%), hsl(calc(var(--h) + 25) 50% 38%)); }
  .srow .ttl{ flex:1; min-width:0; font-size:16px; font-weight:650; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .srow .rm{ width:48px; height:48px; margin-right:-8px; border:none; background:none; color:var(--muted); font-size:15px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  [hidden]{ display:none !important; }
  @media (prefers-reduced-motion:reduce){ .spin{ animation-duration:2.4s; } .skel{ animation:none; } button:active{ transform:none; } }

  @keyframes myllmAiSpin{to{transform:rotate(360deg)}}
  .myllm-ai-busy{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(18px);z-index:99999;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;display:flex;align-items:center;gap:10px;background:rgba(28,28,30,.96);color:#fff;border-radius:999px;padding:10px 16px 10px 14px;box-shadow:0 6px 22px rgba(0,0,0,.4);font-size:14px;font-weight:600;max-width:92%}
  .myllm-ai-busy.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .myllm-ai-cog{width:16px;height:16px;border-radius:50%;border:2.4px solid #a78bfa;border-right-color:transparent;animation:myllmAiSpin .9s linear infinite;flex-shrink:0}
  .myllm-ai-busy small{font-weight:400;opacity:.6}

/* myllm-fullscreen-v2 — MyLLM 5.6.2+ opens this app full screen; the ✕ is the way out. */
.head .imm-acts{display:none;flex-shrink:0;margin-left:auto}
.head .acts + .imm-acts{margin-left:0}
body.imm .head .imm-acts{display:flex}
.head .imm-acts button{width:40px;height:40px;border-radius:12px;border:1px solid var(--myllm-border,rgba(128,128,128,.28));
  background:var(--myllm-surface,rgba(128,128,128,.12));color:var(--myllm-text,currentColor);display:grid;place-items:center;padding:0;cursor:pointer;transition:transform .12s}
.head .imm-acts button:active,.head .imm-x:active{transform:scale(.94)}
.head .imm-x{display:none !important}
body.imm .head .imm-x{display:grid !important;place-items:center}
.imm-x svg,.imm-acts svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}
.imm-safe{display:none}
body.imm .imm-safe{display:block}
</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H6.5a.5.5 0 0 0 0 1H19a1 1 0 0 1 0 2H6.5A2.5 2.5 0 0 1 4 18.5z" fill="currentColor"/></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M10 2.5l1.9 5.6 5.6 1.9-5.6 1.9L10 17.5l-1.9-5.6L2.5 10l5.6-1.9zM18.5 14l.95 2.55L22 17.5l-2.55.95L18.5 21l-.95-2.55L15 17.5l2.55-.95z" fill="currentColor"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.6l4.6 4.6L19.2 7.4" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-bin" viewBox="0 0 24 24"><path d="M9 3h6a1 1 0 0 1 1 1v1h4a1 1 0 0 1 0 2h-1l-.9 12.1A2 2 0 0 1 16.1 21H7.9a2 2 0 0 1-2-1.9L5 7H4a1 1 0 0 1 0-2h4V4a1 1 0 0 1 1-1zm-2 4l.9 12h8.2L17 7z" fill="currentColor"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></symbol>

</defs></svg>
<script>
(function(){if(window.__myllmAiWrap||typeof window.myllmAsk!=='function')return;window.__myllmAiWrap=true;
var orig=window.myllmAsk,depth=0,node=null;
function ensure(){if(node)return;node=document.createElement('div');node.className='myllm-ai-busy';
node.innerHTML='<span class="myllm-ai-cog"></span><span>AI is thinking… <small>privately, on your device</small></span>';
(document.body||document.documentElement).appendChild(node);}
function show(){ensure();depth++;node.classList.add('on');}
function hide(){depth=Math.max(0,depth-1);if(depth===0&&node)node.classList.remove('on');}
window.myllmAsk=function(){show();var p;try{p=orig.apply(this,arguments);}catch(e){hide();throw e;}
return Promise.resolve(p).then(function(r){hide();return r;},function(e){hide();throw e;});};})();
</script>

<div class="imm-safe"></div><div class="head">
  <div class="tile"><svg class="i"><use href="#i-book"/></svg></div>
  <div class="ht"><h1>Social Story Maker</h1><p>Make a gentle, personalised story to help a child get ready for something new. Created privately by the AI on your device.</p></div>
<div class="imm-acts"><button type="button" aria-label="Close Social Story Maker" onclick="myllmFSClose()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div></div>

<div class="card" id="form">
  <label for="situation">What is the story about?</label>
  <textarea id="situation" placeholder="e.g. Going to the dentist for a check-up"></textarea>
  <div class="rowflex">
    <div><label for="name">Child’s name (optional)</label><input id="name" placeholder="e.g. Sam" autocomplete="off"></div>
    <div class="age"><label for="age">Age</label>
      <select id="age"><option value="young child">3–5</option><option value="child" selected>6–9</option><option value="older child">10–12</option></select>
    </div>
  </div>
  <label for="extra">Anything to include? (optional)</label>
  <input id="extra" placeholder="e.g. they feel nervous about the noise" autocomplete="off">
  <button class="gen" id="gen" type="button"></button>
  <div class="note">Needs the latest MyLLM with “Allow apps to use the AI” turned on (MyLLMos settings menu).</div>
  <div class="err" id="err" hidden><svg class="i"><use href="#i-warn"/></svg><span id="errText"></span></div>
</div>

<div class="story" id="story" hidden></div>

<div id="saved"></div>

<script>
function el(i){return document.getElementById(i)}
/* Bridges are looked up when used, never kept: MyLLM can add them after this
   script has run. */
function store(){return window.myllmStorage||{getItem:function(){return Promise.resolve(null)},setItem:function(){return Promise.resolve()}}}
function haptic(s){if(window.myllmHaptic)try{myllmHaptic(s)}catch(e){}}
function icon(n){return '<svg class="i"><use href="#i-'+n+'"/></svg>'}
var saved=[],current=null;
var SYSTEM="You write Social Stories in the style of Carol Gray to help a neurodivergent child (autism/ADHD) prepare for a situation. Rules: write in the FIRST PERSON ('I'). Use short, simple, clear sentences. Be calm, positive and reassuring. Describe what will happen, what I might see, hear or feel, and the helpful things I can do. Use gentle words like 'sometimes', 'usually', 'I can try' rather than 'always' or 'must'. Never use anything scary or negative. End on a calm, encouraging note. Output ONLY the story: a short title line, then 8 to 14 short sentences as 2-4 small paragraphs. No headings, bullet points, markdown, or notes.";

function genBtn(busy){var g=el('gen');g.disabled=!!busy;g.innerHTML=busy?'<i class="spin"></i>Writing…':icon('spark')+'Create story'}
function generate(){
  var sit=el('situation').value.trim();
  if(!sit){el('situation').focus();return}
  if(!window.myllmAsk){showErr("This needs the MyLLM app’s on-device AI. Please update MyLLM and try again.");return}
  var name=el('name').value.trim(),age=el('age').value,extra=el('extra').value.trim();
  var prompt="Write a Social Story about: "+sit+".\nThe reader is a "+age+".";
  if(name)prompt+="\nUse the child’s name: "+name+" — but the story is still told as 'I'.";
  if(extra)prompt+="\nPlease gently address: "+extra+".";
  el('err').hidden=true;
  genBtn(true);
  var S=el('story');S.hidden=false;
  S.innerHTML='<div class="k">'+icon('book')+'Writing your story</div><div class="skel t"></div><div class="skel w9"></div><div class="skel w8"></div><div class="skel w9"></div><div class="skel w6"></div>';
  haptic('light');
  window.myllmAsk(prompt,{system:SYSTEM}).then(function(text){
    showStory(sit,text);
  }).catch(function(e){
    S.hidden=true;
    showErr(String(e&&e.message||e));
  }).then(function(){genBtn(false)});
}
function showErr(m){el('errText').textContent=m;el('err').hidden=false;haptic('warning')}
function parseStory(text){
  var lines=String(text).trim().split(/\n+/).map(function(l){return l.trim()}).filter(Boolean);
  var title=lines.shift()||'My Story';
  title=title.replace(/^#+\s*/,'').replace(/^title:\s*/i,'').replace(/["*]/g,'');
  return {title:title,body:lines};
}
function storyHTML(title,body,label){
  return '<div class="k">'+icon('book')+label+'</div><h2>'+esc(title)+'</h2>'+body.map(function(p){return '<p>'+esc(p)+'</p>'}).join('');
}
function showStory(sit,text){
  var s=parseStory(text);current={sit:sit,title:s.title,body:s.body};
  var S=el('story');S.hidden=false;
  S.innerHTML=storyHTML(s.title,s.body,'Your story')+
    '<div class="sbtns"><button class="save" id="saveb" type="button">'+icon('check')+'Save story</button><button class="again" id="againb" type="button">'+icon('plus')+'New story</button></div>';
  el('saveb').onclick=saveCurrent;
  el('againb').onclick=function(){S.hidden=true;el('situation').value='';el('extra').value='';window.scrollTo({top:0,behavior:'smooth'})};
  haptic('success');
  S.scrollIntoView({behavior:'smooth',block:'start'});
}
function saveCurrent(){
  if(!current)return;
  saved.unshift({id:Date.now(),title:current.title,body:current.body});
  saved=saved.slice(0,40);
  persist();haptic('success');
  var b=el('saveb');b.innerHTML=icon('check')+'Saved';b.disabled=true;
  renderSaved();
}
function persist(){store().setItem('ss_stories',JSON.stringify(saved))}
function renderSaved(){
  var W=el('saved');
  if(!saved.length){W.innerHTML='';return}
  W.innerHTML='<h3>Saved stories</h3><div class="list">'+saved.map(function(s){
    return '<div class="srow" data-id="'+s.id+'" role="button" tabindex="0"><span class="bk">'+icon('book')+'</span><span class="ttl">'+esc(s.title)+'</span><button class="rm" type="button" aria-label="Delete story">'+icon('bin')+'</button></div>';
  }).join('')+'</div>';
  Array.prototype.forEach.call(W.querySelectorAll('.srow'),function(row){
    var id=+row.getAttribute('data-id');
    row.onclick=function(){var s=saved.filter(function(x){return x.id===id})[0];if(s)openSaved(s)};
    row.querySelector('.rm').onclick=function(ev){ev.stopPropagation();saved=saved.filter(function(x){return x.id!==id});persist();renderSaved()};
  });
}
function openSaved(s){
  current={sit:s.title,title:s.title,body:s.body};
  var S=el('story');S.hidden=false;
  S.innerHTML=storyHTML(s.title,s.body,'Saved story')+
    '<div class="sbtns"><button class="again" id="againb" type="button">'+icon('x')+'Close</button></div>';
  el('againb').onclick=function(){S.hidden=true};
  S.scrollIntoView({behavior:'smooth',block:'start'});
}
function esc(t){return String(t).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
el('gen').onclick=generate;
genBtn(false);
store().getItem('ss_stories').then(function(v){if(v){try{saved=JSON.parse(v)||[]}catch(e){}}renderSaved()});

/* myllm-fullscreen-v2 — full screen where MyLLM can also close the app for us
   (myllmClose, 5.6.2+): full screen hides MyLLM's Done, and a page with no way
   out is worse than a repeated title, so elsewhere nothing changes.
   The spacer keeps the header clear of the status bar / Dynamic Island. It is
   live CSS — env(safe-area-inset-top) — not a measured number: the inset is
   still 0 when the page loads and only grows once MyLLM's bar has gone (v1
   measured once, so the title sat under the island). If the page's own styles
   already pad the header down by the inset, the spacer stays at 0. */
(function(){
  function full(){ return !!(window.myllmClose && window.myllmImmersive); }
  /* Does any rule that applies to the header or an ancestor already use the top inset? */
  function pageHandlesInset(head){
    var chain = [], n, found = false;
    for (n = head; n && n.nodeType === 1; n = n.parentElement) chain.push(n);
    function walk(rules){
      for (var i = 0; i < rules.length && !found; i++){
        var r = rules[i];
        if (r.cssRules && !r.selectorText) { walk(r.cssRules); continue; }
        if (!r.selectorText || !/safe-area-inset-top/.test(r.cssText) || !/(padding|margin|top)\s*:/.test(r.cssText)) continue;
        if (/\.imm-safe/.test(r.selectorText)) continue;
        for (var k = 0; k < chain.length; k++){
          try { if (chain[k].matches(r.selectorText)) { found = true; break; } } catch(e){}
        }
      }
    }
    for (var s = 0; s < document.styleSheets.length && !found; s++){
      try { walk(document.styleSheets[s].cssRules); } catch(e){}
    }
    for (n = head; n && n.nodeType === 1 && !found; n = n.parentElement){
      if (/safe-area-inset-top/.test(n.getAttribute("style") || "")) found = true;
    }
    return found;
  }
  function fit(){
    var sp = document.querySelector(".imm-safe"), head = document.querySelector(".head");
    if (!sp || !head) return;
    sp.style.height = (document.body.classList.contains("imm") && !pageHandlesInset(head)) ? "env(safe-area-inset-top)" : "0px";
  }
  function sync(){
    var f = full();
    document.body.classList.toggle("imm", f);
    fit();
    if (!f) return;
    try { window.myllmImmersive(true, { keepAwake:false }).catch(function(){}); } catch(e){}
  }
  window.myllmFSClose = function(){
    try { if (window.myllmHaptic) window.myllmHaptic("light"); } catch(e){}
    try { window.myllmClose().catch(function(){}); } catch(e){}
  };
  document.addEventListener("visibilitychange", function(){ if (!document.hidden) sync(); });
  sync();
})();
</script></body></html>
