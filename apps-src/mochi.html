--><html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Mochi</title>
<!-- MyLLM 5.6.2+: open full screen from the first frame. Those builds all have
     myllmClose, which the ✕ uses — full screen hides MyLLM's own Done. -->
<meta name="myllm:immersive" content="on">
<style>
  :root { color-scheme: light; --ink:#3f372e; --muted:#a3947f; --line:#eadfce; --card:#fffdf8; --mint:#7cc9a0; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  /* No double-tap zoom, no text or image selection on a double tap: it's a toy,
     tapped a lot. Only the chat field keeps normal selection. */
  html, body{ touch-action:manipulation; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; overscroll-behavior:none; }
  input{ -webkit-user-select:text; user-select:text; }
  img{ -webkit-user-drag:none; }
  body{
    font-family:var(--myllm-font,ui-rounded,-apple-system,system-ui,sans-serif);
    background:radial-gradient(120% 60% at 50% 0%,#fff6ea 0%,#fbefe0 55%,#f6e7d4 100%);
    color:var(--ink);
    max-width:600px; margin:0 auto; min-height:100dvh;
    padding:calc(12px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));
    display:flex; flex-direction:column; gap:12px;
  }
  .top{ display:flex; align-items:center; justify-content:space-between; padding:2px 4px 0; }
  .who{ display:flex; flex-direction:column; }
  h1{ font-size:24px; font-weight:850; letter-spacing:-.2px; }
  .age{ font-size:12.5px; color:var(--muted); font-weight:700; }
  .moodchip{ font-size:13px; font-weight:750; color:var(--ink); background:var(--card); border:1.5px solid var(--line);
             border-radius:99px; padding:7px 12px; box-shadow:0 2px 6px rgba(120,90,50,.06); }
  .moodchip:empty{ display:none; }
  .topr{ display:flex; align-items:center; gap:8px; }
  /* The way out in full screen (MyLLM's Done is hidden there). */
  .closebtn{ display:none; width:36px; height:36px; border-radius:50%; border:1.5px solid var(--line); background:var(--card);
             color:var(--muted); align-items:center; justify-content:center; box-shadow:0 2px 6px rgba(120,90,50,.06); }
  .closebtn svg{ width:14px; height:14px; fill:none; stroke:currentColor; stroke-width:2.8; stroke-linecap:round; }
  body.imm .closebtn{ display:flex; }

  /* Four round gauges: a ring that empties, the emoji in the middle. */
  .stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .stat{ position:relative; display:flex; flex-direction:column; align-items:center; gap:3px; }
  .ring{ position:relative; width:54px; height:54px; }
  .ring svg{ width:100%; height:100%; transform:rotate(-90deg); }
  .ring .rt{ fill:var(--card); stroke:#f0e5d3; stroke-width:5; }
  .ring .rf{ fill:none; stroke:var(--mint); stroke-width:5; stroke-linecap:round; stroke-dasharray:113.1; stroke-dashoffset:113.1;
             transition:stroke-dashoffset .7s cubic-bezier(.3,.8,.3,1), stroke .6s; }
  .ring .rf.low{ stroke:#f2a65e; } .ring .rf.crit{ stroke:#e8806e; }
  .stat.crit .ring{ animation:needs 1.6s ease-in-out infinite; }
  @keyframes needs{ 50%{ transform:scale(1.07); } }
  .ring .se{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:22px; }
  .stat small{ font-size:11px; font-weight:750; color:var(--muted); }
  .stat small b{ color:var(--ink); font-weight:800; margin-left:2px; }
  .delta{ position:absolute; top:-4px; left:50%; font-size:13px; font-weight:850; color:#4f9e72; pointer-events:none;
          animation:dpop 1.3s ease-out forwards; }
  @keyframes dpop{ 0%{ opacity:0; transform:translate(-10%,6px) scale(.7); } 20%{ opacity:1; transform:translate(-10%,-4px) scale(1.1); } 100%{ opacity:0; transform:translate(-10%,-22px) scale(1); } }

  /* The stage is Mochi's room: a painted backdrop, Mochi sitting on the rug. */
  .stage{ position:relative; flex:1; min-height:330px; border-radius:30px; overflow:hidden;
          box-shadow:0 10px 30px rgba(120,90,50,.14), inset 0 0 0 1.5px rgba(255,255,255,.6); }
  .room{ position:absolute; inset:0; background:#f6e6d6 url("https://raw.githubusercontent.com/TeamDzX/myllm-assets/main/apps/mochi/room.jpg") center 72% / cover no-repeat; }
  .night{ position:absolute; inset:0; opacity:0; transition:opacity 1.4s ease; pointer-events:none;
          background:radial-gradient(60% 40% at 50% 88%, rgba(255,210,140,.22), transparent 70%),
                     linear-gradient(180deg, rgba(28,32,78,.62), rgba(22,22,56,.5)); }
  .stage.sleeping .night{ opacity:1; }
  .star{ position:absolute; width:3px; height:3px; border-radius:50%; background:#fff; opacity:0; animation:twinkle 3s ease-in-out infinite; }
  .stage.sleeping .star{ opacity:.9; }
  @keyframes twinkle{ 50%{ transform:scale(1.8); opacity:.4; } }
  .petbox{ position:absolute; left:50%; bottom:4%; transform:translateX(-50%); width:min(64%,300px); }
  .petbox #pet{ width:100%; height:auto; display:block; cursor:pointer; }
  .fx{ position:absolute; inset:0; pointer-events:none; overflow:hidden; }
  .fxp{ position:absolute; font-size:24px; animation:rise 1.7s cubic-bezier(.2,.7,.3,1) forwards; }
  @keyframes rise{ 0%{ opacity:0; transform:translate(0,0) scale(.6); } 15%{ opacity:1; } 100%{ opacity:0; transform:translate(var(--dx,0px),-150px) scale(1.15) rotate(var(--rot,0deg)); } }
  /* Accessory overlays are taller than the sprite (extra band above the head so
     hats aren't clipped) and bottom-aligned, so their pet-region maps 1:1 onto
     the pet and the surplus sits above it. Placement is baked into each asset.
     A gentle bob keeps them feeling attached to the breathing pet. */
  .petbox .acc{ position:absolute; left:0; bottom:0; width:100%; height:auto; pointer-events:none;
                animation:accbob 2.6s ease-in-out infinite alternate; }
  @keyframes accbob{ from{ transform:translateY(0); } to{ transform:translateY(-3px); } }
  .stage.sleeping #pet{ filter:brightness(.9) saturate(.9); }
  .bubble{
    position:absolute; top:64px; left:50%; transform:translateX(-50%) translateY(-6px); z-index:3;
    width:max-content; max-width:84%;
    box-shadow:0 4px 14px rgba(80,60,40,.12);
    max-width:88%; background:#fffdf8; border:2px solid #eadfce; border-radius:16px;
    padding:10px 14px; font-size:14.5px; line-height:1.45; opacity:0;
    transition:opacity .3s, transform .3s; pointer-events:none;
  }
  .bubble.show{ opacity:1; transform:translateX(-50%) translateY(0); animation:bpop .38s cubic-bezier(.34,1.56,.64,1); }
  @keyframes bpop{ 0%{ transform:translateX(-50%) translateY(6px) scale(.82); } 70%{ transform:translateX(-50%) translateY(-2px) scale(1.04); } 100%{ transform:translateX(-50%) translateY(0) scale(1); } }
  .bubble.dream.show{ animation:bdrift 5.5s ease-in-out both; }
  @keyframes bdrift{ 0%{ opacity:0; transform:translateX(-50%) translateY(10px) scale(.85); } 12%{ opacity:1; transform:translateX(-50%) translateY(0) scale(1); } 88%{ opacity:1; transform:translateX(-50%) translateY(-10px) rotate(1.5deg); } 100%{ opacity:0; transform:translateX(-50%) translateY(-18px); } }
  .bubble::after{
    content:""; position:absolute; bottom:-9px; left:50%; margin-left:-7px;
    border:7px solid transparent; border-top-color:#eadfce; border-bottom:none;
  }
  .bubble.dream{
    background:#f4f1fb; border-color:#ddd6f0; border-style:dashed;
    font-style:italic; color:#7a6f95; border-radius:22px;
  }
  .bubble.dream::after{ display:none; }
  .bubble.dream::before{
    content:""; position:absolute; bottom:-16px; left:50%; margin-left:-14px;
    width:10px; height:10px; border-radius:50%; background:#f4f1fb;
    border:2px dashed #ddd6f0;
    box-shadow:16px 8px 0 -3px #f4f1fb, 16px 8px 0 -1px #ddd6f0;
  }
  /* Centred by margins, sized to its text: a left:50% box only gets half the
     stage's width and wrapped after a few words. */
  .hint{ position:absolute; top:12px; left:0; right:0; margin:0 auto; width:max-content; max-width:88%; z-index:2;
          font-size:12.5px; font-weight:700; color:var(--ink); text-align:center;
          background:rgba(255,253,248,.88); border-radius:99px; padding:7px 14px; box-shadow:0 2px 8px rgba(80,60,40,.1); }
  .hint:empty{ display:none; }

  /* Action dock: one colour per thing you can do. */
  .dock{ display:grid; grid-template-columns:repeat(6,1fr); gap:4px; background:rgba(255,253,248,.92);
         border:1.5px solid var(--line); border-radius:26px; padding:10px 6px 8px; box-shadow:0 6px 20px rgba(120,90,50,.08); }
  .act{ border:none; background:none; color:var(--ink); display:flex; flex-direction:column; align-items:center; gap:5px;
        font-size:11.5px; font-weight:750; font-family:inherit; }
  .act .ico{ width:48px; height:48px; border-radius:17px; display:flex; align-items:center; justify-content:center; font-size:24px;
             background:var(--c); box-shadow:inset 0 -3px 0 rgba(0,0,0,.07), 0 2px 6px rgba(0,0,0,.05); transition:transform .12s; }
  .act:active .ico{ transform:scale(.88); }
  .act:disabled{ opacity:.38; }
  .act.feed{ --c:#ffe3c9; } .act.play{ --c:#d7ebff; } .act.bath{ --c:#d3f2ef; }
  .act.walk{ --c:#e0f3d2; } .act.sleep{ --c:#e4dffb; } .act.style{ --c:#ffdbe7; }

  .chatrow{ display:flex; align-items:center; gap:6px; background:var(--card); border:1.5px solid var(--line);
            border-radius:99px; padding:5px 5px 5px 16px; box-shadow:0 4px 14px rgba(120,90,50,.06); }
  .chatrow input{ flex:1; min-width:0; font-size:16px; border:none; background:none; color:var(--ink); outline:none; font-family:inherit; }
  .chatrow button{ border:none; border-radius:50%; width:40px; height:40px; background:var(--mint); color:#fff; display:flex; align-items:center; justify-content:center; flex:0 0 auto; }

  /* walk mode */
  .walkview{ position:fixed; inset:0; background:linear-gradient(180deg,#fdf6ec 0%,#f3ecdd 100%); display:none; flex-direction:column; z-index:8; }
  .walkview.show{ display:flex; }
  .walkview .sky{ flex:1; }
  .walkscene{ position:relative; height:62%; overflow:hidden; }
  .walktrack{ position:absolute; bottom:0; left:0; height:100%; display:flex; width:max-content; animation:scroll 26s linear infinite; }
  .walktrack img{ height:100%; width:auto; display:block; }
  .walktrack img.flip{ transform:scaleX(-1); }
  @keyframes scroll{ from{ transform:translateX(0); } to{ transform:translateX(-50%); } }
  .walker{ position:absolute; left:50%; bottom:6%; transform:translateX(-50%); width:min(46vw,210px); animation:bob 0.62s ease-in-out infinite alternate; z-index:2; }
  @keyframes bob{ from{ transform:translateX(-50%) translateY(0) rotate(-1.2deg); } to{ transform:translateX(-50%) translateY(-7px) rotate(1.2deg); } }
  .walker img{ width:100%; }
  /* Mochi's walk is a 6x6 sprite sheet stepped by our own clock rather than an
     animated webp, because a webp's playhead can't be read from JS — and the
     accessories below have to know exactly which frame is showing. */
  .walker .pet{ width:100%; aspect-ratio:1/1; background-repeat:no-repeat;
                background-size:600% 600%; background-position:0% 0%; }
  .walker .pet.plain{ background-size:100% 100%; background-position:0% 0%; }
  /* Walk accessories are children of .walker, so they inherit the waddle bob
     for free. On top of that each one rides the head track (set per frame in
     JS), which is what stops a hat drifting off the head mid-stride. */
  .walker .wacc{ position:absolute; left:0; bottom:0; width:100%; height:auto; pointer-events:none;
     /* pivot = the head centre (210.7, 101.9) in sprite space, expressed in the
        400x580 overlay: x 210.7/400, y (101.9+180)/580 */
                 transform-origin:52.7% 48.6%; will-change:transform; }
  /* A neck item pivots lower down — swinging a bowtie about the head reads wrong. */
  .walker .wacc.neck{ transform-origin:52.7% 82.8%; }
  .wbubble-wrap{ position:absolute; top:8px; left:0; right:0; display:flex; justify-content:center; }
  .critters{ position:absolute; inset:0; overflow:hidden; pointer-events:none; }
  .critter{ position:absolute; left:-12%; will-change:transform; }
  .critter span{ display:inline-block; animation:flutter 1.1s ease-in-out infinite alternate; }
  .critter.back{ z-index:0; filter:saturate(.85) brightness(1.04); }
  .critter.front{ z-index:3; }
  @keyframes flutter{ from{ transform:translateY(0) rotate(-6deg); } to{ transform:translateY(-9px) rotate(6deg); } }
  @keyframes drift{ from{ transform:translateX(0); } to{ transform:translateX(125vw); } }
  .walkhud{ display:flex; justify-content:space-between; align-items:center; padding:14px calc(16px + env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left)); }
  .walkhud .steps{ font-size:13px; color:#a89a88; font-weight:700; }
  .walkhud button{ border:2px solid #eadfce; background:#fffdf8; color:#4a4238; border-radius:14px; padding:11px 18px; font-size:14px; font-weight:750; }

  /* wardrobe (dress-up) sheet */
  .wardrobe{ position:fixed; inset:0; background:rgba(74,66,56,.35); display:none; align-items:flex-end; justify-content:center; z-index:9; }
  .wardrobe.show{ display:flex; }
  .wardcard{ background:#fffdf8; border-radius:22px 22px 0 0; padding:16px calc(16px + env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left)); width:100%; max-width:600px; max-height:76dvh; overflow-y:auto; }
  .wardhead{ display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
  .wardhead h2{ font-size:18px; }
  .wardhead button{ border:none; background:#8fd3a8; color:#fff; border-radius:12px; padding:0 18px; min-height:40px; font-size:14px; font-weight:750; }
  .wardslot{ margin-top:12px; }
  .wardslot > small{ font-size:12px; font-weight:750; color:#a89a88; padding-left:2px; }
  .wardrow{ display:flex; gap:9px; overflow-x:auto; padding:8px 2px 4px; -webkit-overflow-scrolling:touch; }
  .chip{ flex:0 0 auto; width:70px; text-align:center; background:none; border:none; padding:0; cursor:pointer; }
  .chip .thumb{ width:66px; height:66px; border-radius:16px; border:2px solid #eadfce; background:#fdf6ec;
                display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .chip.on .thumb{ border-color:#8fd3a8; background:#eaf7ef; box-shadow:0 0 0 2px #8fd3a8 inset; }
  .chip .thumb img{ width:100%; height:100%; object-fit:contain; }
  .chip .thumb .none{ font-size:22px; color:#c9bda9; }
  .chip span{ display:block; font-size:10.5px; font-weight:700; color:#a89a88; margin-top:3px; line-height:1.2; }
  .chip.on span{ color:#5aa87a; }
  .chip .thumb{ position:relative; }
  .chip .lock{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:22px; }
  .chip.locked .thumb img{ opacity:.32; filter:grayscale(1); }
  .chip.locked span{ color:#c9bda9; }

  /* food picker (long-press Feed) */
  .foodmenu{ position:fixed; inset:0; background:rgba(74,66,56,.35); display:none; align-items:flex-end; justify-content:center; z-index:9; }
  .foodmenu.show{ display:flex; }
  .foodcard{ background:#fffdf8; border-radius:22px 22px 0 0; padding:16px calc(16px + env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left)); width:100%; max-width:600px; }
  .foodhead{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .foodhead h2{ font-size:18px; }
  .foodhead button{ border:none; background:#f1e7d6; color:#8a7d6a; width:40px; height:40px; border-radius:50%; font-size:15px; display:flex; align-items:center; justify-content:center; }
  .foodhead button svg, .chatrow button svg{ width:1.2em; height:1.2em; fill:none; stroke:currentColor; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round; }
  .foodgrid{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  .fooditem{ background:#fdf6ec; border:2px solid #eadfce; border-radius:16px; padding:12px 4px 10px; text-align:center; }
  .fooditem .fe{ display:block; font-size:30px; margin-bottom:3px; }
  .fooditem .fn{ font-size:11.5px; font-weight:750; color:#4a4238; }
  .fooditem.fav{ border-color:#e8b06e; background:#fdf3e6; }
  .fooditem .ft{ display:block; font-size:9px; color:#d98b3a; font-weight:800; margin-top:2px; letter-spacing:.3px; }

  .namer{ position:fixed; inset:0; background:rgba(74,66,56,.35); display:none; align-items:center; justify-content:center; z-index:9; }
  .namer.show{ display:flex; }
  .namecard{ background:#fffdf8; border-radius:22px; padding:22px; width:min(84vw,340px); text-align:center; }
  .namecard h2{ font-size:19px; margin-bottom:6px; }
  .namecard p{ font-size:13.5px; color:#a89a88; margin-bottom:14px; line-height:1.5; }
  .namecard input{ width:100%; font-size:17px; text-align:center; padding:11px; border-radius:13px; border:2px solid #eadfce; background:#fdf6ec; color:#4a4238; }
  .namecard button{ width:100%; border:none; border-radius:13px; padding:13px; margin-top:12px; font-size:15px; font-weight:750; background:#8fd3a8; color:#fff; }
</style>
<style>:root{--build-id:"b7e049fb00";}</style>
</head>
<body>

<div class="top">
  <div class="who"><h1 id="title">🥚 A little egg</h1><span class="age" id="age"></span></div>
  <div class="topr">
    <span class="moodchip" id="moodchip"></span>
    <button class="closebtn" id="closeBtn" aria-label="Close Mochi" onclick="closeApp()"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
</div>

<div class="stats" id="bars" style="display:none">
  <div class="stat" id="sHunger"><div class="ring"><svg viewBox="0 0 44 44"><circle class="rt" cx="22" cy="22" r="18"/><circle class="rf" id="bHunger" cx="22" cy="22" r="18"/></svg><span class="se">🍙</span></div><small>Food<b id="vHunger"></b></small></div>
  <div class="stat" id="sHappy"><div class="ring"><svg viewBox="0 0 44 44"><circle class="rt" cx="22" cy="22" r="18"/><circle class="rf" id="bHappy" cx="22" cy="22" r="18"/></svg><span class="se">💖</span></div><small>Happy<b id="vHappy"></b></small></div>
  <div class="stat" id="sEnergy"><div class="ring"><svg viewBox="0 0 44 44"><circle class="rt" cx="22" cy="22" r="18"/><circle class="rf" id="bEnergy" cx="22" cy="22" r="18"/></svg><span class="se">⚡</span></div><small>Energy<b id="vEnergy"></b></small></div>
  <div class="stat" id="sClean"><div class="ring"><svg viewBox="0 0 44 44"><circle class="rt" cx="22" cy="22" r="18"/><circle class="rf" id="bClean" cx="22" cy="22" r="18"/></svg><span class="se">🫧</span></div><small>Clean<b id="vClean"></b></small></div>
</div>

<div class="stage" id="stage">
  <div class="room"></div>
  <div class="night"><i class="star" style="left:14%;top:10%;animation-delay:0.0s"></i><i class="star" style="left:24%;top:16%;animation-delay:0.8s"></i><i class="star" style="left:33%;top:8%;animation-delay:1.6s"></i><i class="star" style="left:19%;top:22%;animation-delay:2.2s"></i><i class="star" style="left:28%;top:12%;animation-delay:0.4s"></i><i class="star" style="left:71%;top:6%;animation-delay:1.2s"></i><i class="star" style="left:83%;top:14%;animation-delay:2.6s"></i></div>
  <p class="hint" id="hint"></p>
  <div class="bubble" id="bubble"></div>
  <div class="petbox" id="petbox">
    <img id="pet" src="" alt="Your pet">
    <img class="acc" id="acc_head" alt="" style="display:none">
    <img class="acc" id="acc_eyes" alt="" style="display:none">
    <img class="acc" id="acc_neck" alt="" style="display:none">
    <img class="acc" id="smudge" alt="" style="display:none">
  </div>
  <div class="fx" id="fx"></div>
</div>

<div class="dock" id="actions" style="display:none">
  <button class="act feed" id="feedBtn"><span class="ico">🍙</span><span>Feed</span></button>
  <button class="act play" onclick="play()" id="playBtn"><span class="ico">⚽</span><span>Play</span></button>
  <button class="act bath" onclick="bath()"><span class="ico">🫧</span><span>Bath</span></button>
  <button class="act walk" onclick="startWalk()" id="walkBtn"><span class="ico">🌼</span><span>Walk</span></button>
  <button class="act sleep" onclick="toggleSleep()" id="sleepBtn"><span class="ico">🌙</span><span>Sleep</span></button>
  <button class="act style" onclick="openWardrobe()"><span class="ico">👒</span><span>Style</span></button>
</div>

<div class="walkview" id="walkview">
  <div class="sky"></div>
  <div class="walkscene">
    <div class="walktrack" id="walktrack"></div>
    <div class="critters" id="critters"></div>
    <div class="wbubble-wrap"><div class="bubble" id="wbubble" style="position:relative; top:0;"></div></div>
    <div class="walker" id="walker">
      <div class="pet" id="walkpet" role="img" aria-label="Mochi walking"></div>
      <img class="wacc" id="wacc_head" alt="" style="display:none">
      <img class="wacc" id="wacc_eyes" alt="" style="display:none">
      <img class="wacc neck" id="wacc_neck" alt="" style="display:none">
      <img class="wacc" id="wsmudge" alt="" style="display:none">
    </div>
  </div>
  <div class="walkhud">
    <span class="steps" id="walksteps"></span>
    <button onclick="endWalk(false)">🏠 Head home</button>
  </div>
</div>

<div class="chatrow" id="chatrow" style="display:none">
  <input id="say" type="text" autocomplete="off" placeholder="Say something…">
  <button onclick="talk()" aria-label="Say it"><svg viewBox="0 0 24 24"><path d="M4 12l15-7-5 15-3-6z"/><path d="M11 14l8-9"/></svg></button>
</div>

<div class="namer" id="namer">
  <div class="namecard">
    <h2>It hatched! 🐣</h2>
    <p>A tiny mochi blinks up at you.<br>What will you call it?</p>
    <input id="nameInput" maxlength="16" placeholder="Mochi">
    <button onclick="setName()">That's the one</button>
  </div>
</div>

<div class="wardrobe" id="wardrobe">
  <div class="wardcard">
    <div class="wardhead">
      <h2>Dress up ✨</h2>
      <button onclick="closeWardrobe()">Done</button>
    </div>
    <div id="wardslots"></div>
  </div>
</div>

<div class="foodmenu" id="foodmenu">
  <div class="foodcard">
    <div class="foodhead">
      <h2>Pick a snack 🍽️</h2>
      <button onclick="closeFoodMenu()" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="foodgrid" id="foodgrid"></div>
  </div>
</div>

<script>
/* Bridges are looked up when used, never kept: MyLLM can add them after this
   script has run. ASK and store stay usable as names everywhere below. */
var storeFallback = {getItem:function(){return Promise.resolve(null)}, setItem:function(){return Promise.resolve()}};
Object.defineProperty(window, "ASK", { configurable:true, get:function(){ return window.myllmAsk || null; } });
Object.defineProperty(window, "store", { configurable:true, get:function(){ return window.myllmStorage || storeFallback; } });
/* Full screen, all the time, where MyLLM can also close the app for us
   (myllmClose, 5.6.2+): the ✕ in the corner is then the way out. On a build
   with immersive but no close (5.6.1), only a walk goes full screen, as
   before — a page with no way out would be worse. Looked up each time. */
function canGoFull(){ return !!(window.myllmClose && window.myllmImmersive); }
function syncChrome(){
  var full = canGoFull();
  document.body.classList.toggle("imm", full);
  if (!window.myllmImmersive) return;
  try { myllmImmersive(full || walking, {keepAwake:false}).catch(function(){}); } catch(_){}
}
function closeApp(){
  haptic("light");
  if (walking) endWalk(false);
  try { myllmClose().catch(function(){}); } catch(_){}
}
function haptic(k){ if(window.myllmHaptic){ try{ myllmHaptic(k||'light'); }catch(_){} } }
function el(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

var ART = "https://raw.githubusercontent.com/TeamDzX/myllm-assets/main/apps/mochi/";
var ANIM = { egg:"anim_egg.webp", hatch:"anim_hatch.webp", idle:"anim_idle2.webp",
             happy:"anim_happy.webp", eat:"anim_eat.webp", sleep:"anim_sleep.webp",
             sad:"anim_sad.webp", bath:"anim_bath.webp", play:"anim_play.webp",
             walk:"anim_walk.webp", pet:"anim_pet.webp" };
/* v15: the home screen is a room, so Mochi needs to be cut out of the cream
   the loops were rendered on. "<name>_k.webp" is the same loop with the
   background keyed to alpha; the originals stay for older installs. */
function keyed(file){ return file.replace(".webp", "_k.webp"); }

/* ---------- wardrobe ---------- */
/* Accessories are pre-positioned 400x400 overlays: "<id>.png" sits over the
   idle sprite, "<id>_w.png" over the walk sprite, "<id>_chip.png" is the picker
   thumbnail. One item per slot; slots stack. */
var ACC_BASE = ART + "acc/";
var CATALOG = [
  { id:"beanie",        slot:"head", label:"Beanie" },
  { id:"bucket_hat",    slot:"head", label:"Bucket" },
  { id:"crown",         slot:"head", label:"Crown" },
  { id:"flower",        slot:"head", label:"Flower" },
  { id:"bow",           slot:"head", label:"Bow" },
  { id:"sunglasses",    slot:"eyes", label:"Shades" },
  { id:"heart_glasses", slot:"eyes", label:"Hearts" },
  { id:"round_glasses", slot:"eyes", label:"Specs" },
  { id:"bowtie",        slot:"neck", label:"Bow tie" },
  { id:"chain",         slot:"neck", label:"Chain" }
];
var SLOT_ORDER = ["head","eyes","neck"];
var SLOT_NAME = { head:"On the head", eyes:"Eyes", neck:"Neck" };
var W = { head:null, eyes:null, neck:null };

/* Milestone unlocks: one accessory per slot is unlocked from the start
   (beanie/sunglasses/bowtie); the rest are earned by caring for Mochi. Each
   entry is test(state)->bool + the hint shown while it's still locked. */
var UNLOCKS = {
  bucket_hat:    { test:function(s){ return (s.walks||0) >= 1; },        hint:"Go on your first walk 🌼" },
  flower:        { test:function(s){ return (s.finds||0) >= 10; },       hint:"Find 10 treasures on walks 🌸" },
  crown:         { test:function(s){ return daysTogether() >= 7; },      hint:"Spend 7 days together 👑" },
  bow:           { test:function(s){ return !!s.maxHappy; },             hint:"Reach 100% happiness 🎀" },
  heart_glasses: { test:function(s){ return (s.chats||0) >= 10; },       hint:"Chat with Mochi 10 times 💗" },
  round_glasses: { test:function(s){ return (s.plays||0) >= 15; },       hint:"Play together 15 times 🤓" },
  chain:         { test:function(s){ return !!s.choc; },                 hint:"Give Mochi its favourite treat 🍫" }
};

/* ---------- state ---------- */
var S = null;    /* {name, hatched, tapCount, born, last, hunger, happy, energy, clean, sleeping} */
var transient = null, transientTimer = null;
var HOUR = 3600000;

function fresh(){
  return { name:null, hatched:false, tapCount:0, born:Date.now(), last:Date.now(),
           hunger:80, happy:80, energy:90, clean:90, sleeping:false, messy:false,
           walks:0, finds:0, plays:0, chats:0, choc:false, maxHappy:false, unlocked:[] };
}

/* Kind decay: stats drift down over real time but floor at 12 — Mochi can get
   hungry and mopey, never worse. While sleeping, energy recovers instead. */
function applyDecay(){
  var now = Date.now();
  var hrs = Math.min(72, (now - S.last) / HOUR);
  if (hrs <= 0){ S.last = now; return; }
  var floor = function(v){ return Math.max(12, v); };
  S.hunger = floor(S.hunger - hrs * 6);
  S.clean  = floor(S.clean  - hrs * 3);
  if (S.sleeping){
    S.energy = Math.min(100, S.energy + hrs * 18);
    S.happy  = floor(S.happy - hrs * 2);
    if (S.energy >= 100) S.sleeping = false;   /* fully rested — woke up on its own */
  } else {
    S.energy = floor(S.energy - hrs * 4);
    S.happy  = floor(S.happy - hrs * 4);
  }
  S.last = now;
}

function mood(){
  if (!S.hatched) return "egg";
  if (transient) return transient;
  if (S.sleeping) return "sleep";
  if (S.hunger < 30 || S.happy < 30 || S.clean < 25 || S.energy < 20) return "sad";
  return "idle";
}

function moodHint(){
  if (!S.hatched) return "Tap the egg…";
  if (S.sleeping) return esc(S.name) + " is snoozing. Tap to wake gently.";
  if (S.messy) return esc(S.name) + " has a chocolatey face — bath time! 🍫";
  if (S.hunger < 30) return esc(S.name) + " is peckish… 🍙";
  if (S.clean < 25) return esc(S.name) + " could use a bath. 🫧";
  if (S.energy < 20) return esc(S.name) + " is sleepy. 🌙";
  if (S.happy < 30) return esc(S.name) + " wants to play! ⚽";
  return "";
}

function save(){ store.setItem("mochi_state", JSON.stringify(S)); }

/* ---------- rendering ---------- */
function render(){
  var m = mood();
  var src = ART + keyed(ANIM[m]);
  if (el("pet").getAttribute("src") !== src) el("pet").src = src;
  el("stage").className = "stage" + (S.sleeping && !transient ? " sleeping" : "");
  el("hint").textContent = moodHint();
  if (S.hatched){
    el("title").textContent = "🐣 " + S.name;
    var days = Math.max(1, Math.ceil((Date.now() - S.born) / 86400000));
    el("age").textContent = "Day " + days + " together";
    el("bars").style.display = "grid";
    el("actions").style.display = "grid";
    el("chatrow").style.display = "flex";
    bar("Hunger", S.hunger); bar("Happy", S.happy); bar("Energy", S.energy); bar("Clean", S.clean);
    el("sleepBtn").innerHTML = S.sleeping ? '<span class="ico">☀️</span><span>Wake</span>' : '<span class="ico">🌙</span><span>Sleep</span>';
    el("playBtn").disabled = S.sleeping;
  }
  el("moodchip").textContent = !S.hatched ? "" : S.sleeping ? "💤 Asleep" : m === "sad" ? "🥺 Needs you" :
    (S.happy >= 80 && S.hunger >= 50) ? "😊 Happy" : "🙂 Content";
  zzz(S.hatched && S.sleeping && !transient);
}

/* ---------- little bits of joy ---------- */
/* A few emoji that float up from Mochi when something nice happens. */
var FX = { pet:["💗","💕","💖","💗"], play:["⭐","✨","⚽","🌟"], bath:["🫧","🫧","✨","🫧"],
           eat:["😋","✨","💛"], wake:["☀️","✨"], happy:["✨","🎶","💚"], hatch:["✨","🌱","💫","✨"] };
function fx(kind){
  var host = el("fx"), box = el("petbox");
  if (!host || !box || !FX[kind]) return;
  var hb = host.getBoundingClientRect(), pb = box.getBoundingClientRect();
  var cx = pb.left - hb.left + pb.width / 2, cy = pb.top - hb.top + pb.height * 0.35;
  FX[kind].forEach(function(e, i){
    var s = document.createElement("span");
    s.className = "fxp"; s.textContent = e;
    s.style.left = (cx - 12 + (Math.random() - 0.5) * pb.width * 0.6) + "px";
    s.style.top = (cy + Math.random() * 30) + "px";
    s.style.setProperty("--dx", ((Math.random() - 0.5) * 70).toFixed(0) + "px");
    s.style.setProperty("--rot", ((Math.random() - 0.5) * 40).toFixed(0) + "deg");
    s.style.animationDelay = (i * 0.12) + "s";
    host.appendChild(s);
    setTimeout(function(){ if (s.parentNode) s.parentNode.removeChild(s); }, 2200 + i * 120);
  });
}
/* "+26" rising over the gauge that just went up. */
function delta(key, amount){
  amount = Math.round(amount);
  if (!amount || amount < 1) return;
  var host = el("s" + key); if (!host) return;
  var d = document.createElement("span");
  d.className = "delta"; d.textContent = "+" + amount;
  host.appendChild(d);
  setTimeout(function(){ if (d.parentNode) d.parentNode.removeChild(d); }, 1400);
}
/* Change a stat and show the rise. */
function bump(key, prop, by, cap){
  var before = S[prop];
  S[prop] = Math.min(cap == null ? 100 : cap, S[prop] + by);
  delta(key, S[prop] - before);
}
var zzzTimer = null;
function zzz(on){
  if (on && !zzzTimer){
    zzzTimer = setInterval(function(){
      var host = el("fx"), box = el("petbox"); if (!host || !box) return;
      var hb = host.getBoundingClientRect(), pb = box.getBoundingClientRect();
      var s = document.createElement("span");
      s.className = "fxp"; s.textContent = "💤"; s.style.fontSize = "20px";
      s.style.left = (pb.left - hb.left + pb.width * 0.62) + "px";
      s.style.top = (pb.top - hb.top + pb.height * 0.18) + "px";
      s.style.setProperty("--dx", "26px");
      host.appendChild(s);
      setTimeout(function(){ if (s.parentNode) s.parentNode.removeChild(s); }, 1900);
    }, 2600);
  } else if (!on && zzzTimer){ clearInterval(zzzTimer); zzzTimer = null; }
}

function bar(key, v){
  v = Math.round(v);
  var f = el("b" + key);
  f.style.strokeDashoffset = (113.1 * (1 - v / 100)).toFixed(1);
  f.setAttribute("class", "rf" + (v < 25 ? " crit" : v < 45 ? " low" : ""));
  el("s" + key).className = "stat" + (v < 25 ? " crit" : "");
  el("v" + key).textContent = v;
}

function pulse(anim, ms){
  transient = anim;
  clearTimeout(transientTimer);
  transientTimer = setTimeout(function(){ transient = null; render(); save(); }, ms || 5200);
  render();
}

function bubble(text, ms, dreamy){
  var b = el(walking ? "wbubble" : "bubble");
  b.textContent = text;
  b.className = "bubble show" + (dreamy ? " dream" : "");
  if (!dreamy && !walking) b.style.left = (42 + Math.random() * 16) + "%";
  clearTimeout(b._t);
  b._t = setTimeout(function(){ b.classList.remove("show"); }, ms || 4200);
}

/* ---------- actions ---------- */
/* Snacks — tap Feed for the default rice ball, press-and-hold to pick one.
   Chocolate is the favourite (big happy boost) but leaves a chocolatey face
   that needs a bath. */
var SMUDGE  = ART + "chocolate_smudge.png";
var SMUDGE_W = ART + "chocolate_smudge_w.png";
var FOODS = [
  { id:"riceball",  emoji:"🍙", name:"Rice ball", hunger:32, happy:4 },
  { id:"banana",    emoji:"🍌", name:"Banana",    hunger:28, happy:8 },
  { id:"apple",     emoji:"🍎", name:"Apple",     hunger:24, happy:6 },
  { id:"chocolate", emoji:"🍫", name:"Chocolate", hunger:18, happy:24, fav:true, messy:true }
];
function food(id){ return FOODS.filter(function(f){ return f.id === id; })[0] || FOODS[0]; }

function feed(){ feedWith("riceball"); }     /* quick tap = the default snack */

function feedWith(id){
  closeFoodMenu();
  if (S.sleeping){ bubble("Shh — " + esc(S.name) + " is sleeping."); return; }
  var f = food(id);
  haptic(f.fav ? "success" : "light");
  bump("Hunger", "hunger", f.hunger);
  bump("Happy", "happy", f.happy);
  fx("eat");
  if (f.messy){
    S.messy = true;
    S.clean = Math.max(12, S.clean - 28);   /* chocolate = messy face */
    applyMessy();
  }
  if (f.id === "chocolate") S.choc = true;   /* milestone: favourite treat */
  pulse("eat", 5600);
  bubble(f.fav ? f.emoji + " my favourite!! *munch munch*" : f.emoji + " yum!", 3400);
  checkUnlocks(); save();
}

/* Toggle the chocolate smudge overlay (idle + walk) when the face is messy. */
function applyMessy(){
  var on = !!(S && S.hatched && S.messy);
  el("smudge").style.display  = on ? "block" : "none";
  el("wsmudge").style.display = on ? "block" : "none";
}

function buildFoodMenu(){
  el("foodgrid").innerHTML = FOODS.map(function(f){
    return '<button class="fooditem' + (f.fav ? ' fav' : '') +
           '" onclick="feedWith(\'' + f.id + '\')">' +
           '<span class="fe">' + f.emoji + '</span>' +
           '<span class="fn">' + esc(f.name) + '</span>' +
           (f.fav ? '<span class="ft">FAVOURITE</span>' : '') +
           '</button>';
  }).join("");
}
function openFoodMenu(){
  if (!S || !S.hatched) return;
  if (S.sleeping){ bubble("Shh — " + esc(S.name) + " is sleeping."); return; }
  haptic("light");
  el("foodmenu").classList.add("show");
}
function closeFoodMenu(){ el("foodmenu").classList.remove("show"); }
function play(){
  if (S.sleeping) return;
  haptic("light");
  bump("Happy", "happy", 26);
  fx("play");
  S.energy = Math.max(5, S.energy - 10);
  S.hunger = Math.max(12, S.hunger - 5);
  S.plays = (S.plays || 0) + 1;
  pulse("play", 5600); checkUnlocks(); save();
}
function bath(){
  if (S.sleeping){ bubble("Bathtime after nap time."); return; }
  haptic("light");
  bump("Clean", "clean", 100 - S.clean);
  fx("bath");
  if (S.messy){ S.messy = false; applyMessy(); bubble("All clean again! ✨", 2800); }
  pulse("bath", 5600); save();
}
function toggleSleep(){
  haptic("selection");
  if (S.sleeping){
    S.sleeping = false;
    bump("Happy", "happy", 6);
    fx("wake");
    pulse("happy", 3800);
  } else {
    S.sleeping = true;
    transient = null;
  }
  render(); save();
}

/* ---------- egg & hatching ---------- */
function stageTap(){
  if (!S.hatched){
    S.tapCount++;
    haptic(S.tapCount >= 3 ? "success" : "light");
    if (S.tapCount >= 3){
      S.hatched = true;
      transient = "hatch";
      el("pet").src = ART + keyed(ANIM.hatch);
      setTimeout(function(){ el("namer").classList.add("show"); }, 2600);
    } else {
      el("hint").textContent = S.tapCount === 1 ? "It wobbled!" : "Something's moving in there…";
      var p = el("pet");
      p.style.transition = "transform .12s";
      p.style.transform = "rotate(" + (S.tapCount % 2 ? 4 : -4) + "deg)";
      setTimeout(function(){ p.style.transform = ""; }, 140);
    }
    save();
    return;
  }
  if (S.sleeping){ toggleSleep(); return; }
  haptic("light");
  bump("Happy", "happy", 2);
  fx("pet");
  pulse("pet", 3400);          /* heart-eyes: being petted */
  save();
}

function setName(){
  var n = el("nameInput").value.trim() || "Mochi";
  S.name = n.slice(0, 16);
  S.born = Date.now();
  el("namer").classList.remove("show");
  haptic("success");
  transient = null;
  render(); save();
  bubble("Hello! I'm " + esc(S.name) + "! 🌱", 5000);
  fx("hatch");
}

/* ---------- talking (the MyLLM twist) ---------- */
var CANNED = ["mochi mochi! 🌱","*happy wiggle*","(◕ᴗ◕)","*bounces softly*","squeak!","*does a tiny spin*"];

function talk(){
  var t = el("say").value.trim();
  if (!t || !S.hatched) return;
  el("say").value = "";
  haptic("light");
  if (S.sleeping){ bubble("…zzz…"); return; }
  S.chats = (S.chats || 0) + 1; checkUnlocks();
  if (!ASK){
    bubble(CANNED[Math.floor(Math.random() * CANNED.length)]);
    S.happy = Math.min(100, S.happy + 3); render(); save();
    return;
  }
  var vibe = S.hunger < 30 ? "hungry" : S.happy < 30 ? "a bit lonely" : S.energy < 20 ? "sleepy" : "happy and playful";
  var p = "You are " + S.name + ", a tiny newly-hatched pet blob creature. You are currently feeling " + vibe + ".\n" +
    "Your owner says: \"" + t + "\"\n" +
    "Reply as " + S.name + " in ONE short, sweet sentence (max 12 words). Babyish, adorable, warm. " +
    "You may use one emoji. Never break character, never mention being an AI.";
  ASK(p).then(function(r){
    var line = String(r||"").split("\n")[0].replace(/^["']|["']$/g, "").trim();
    if (!line || line.length > 120) line = CANNED[0];
    bubble(line, 5200);
    S.happy = Math.min(100, S.happy + 5);
    pulse("happy", 3600); save();
  }).catch(function(){
    bubble(CANNED[Math.floor(Math.random() * CANNED.length)]);
  });
}

/* ---------- walk mode ---------- */
var walking = false, walkTimer = null, walkStart = 0, lastFind = 0, findCount = 0;

/* ---------- walk rig ----------
   Mochi's head travels ~32px across and ~20px up and down inside the 400px
   sprite as she waddles. An accessory pinned to the walker box can't follow
   that, which is why a hat used to drift beside her head instead of sitting on
   it. RIG_TRACK is where the head is on each of the 33 unique frames, measured
   from the loop itself (see build_mochi_rig.py); the accessories ride it.

   Rebuild both the sheet and this table with:  python3 build_mochi_rig.py --apply */
var RIG_PIVOT = [210.7, 101.9];        /* head centre in sprite px */
var RIG_TRACK = [
  [-8.5,5.0,-3.55],[-7.0,5.4,-2.94],[-3.1,6.7,-1.32],[0.7,6.7,0.29],
  [4.2,4.3,1.76],[6.9,-1.5,2.88],[8.4,-7.2,3.54],[8.1,-10.2,3.42],
  [6.5,-9.1,2.71],[3.9,-5.2,1.66],[1.1,-1.4,0.46],[-1.3,1.9,-0.54],
  [-2.2,3.7,-0.92],[-0.8,4.6,-0.33],[2.5,4.1,1.04],[6.8,2.9,2.87],
  [11.2,0.4,4.7],[14.4,-3.3,6.04],[14.9,-8.8,6.25],[11.6,-12.5,4.86],
  [4.6,-12.8,1.95],[-4.0,-8.6,-1.67],[-11.6,-4.2,-4.88],[-16.2,-1.2,-6.81],
  [-17.5,0.2,-7.35],[-16.3,1.7,-6.83],[-13.6,3.6,-5.72],[-9.9,5.6,-4.14],
  [-5.4,7.0,-2.26],[-0.7,7.6,-0.3],[2.7,6.4,1.14],[4.5,4.6,1.91],
  [5.0,3.5,2.08]
];
var SHEET_COLS = 6, SHEET_N = RIG_TRACK.length, WALK_FRAMES = 2 * (SHEET_N - 1), FRAME_MS = 71;

/* How much of the head's motion each slot inherits. A bowtie sits on the neck,
   which sways less than the crown does — giving it the full head track makes it
   look flung about. */
var SLOT_RIDE = { head:1, eyes:1, neck:0.55 };

/* Per-item character. Rather than a canned wobble, each accessory reacts to how
   the head is MOVING this frame — lag trails the horizontal swing, give softens
   the vertical, swing adds a little life of its own. So a floppy bucket hat
   lollops, a crown stays regal and stiff, and glasses stay clamped to the face.
     lag   how far behind the head's sideways motion it drags (degrees per px/frame)
     give  how much it keeps bouncing after a step lands (px per px/frame)
     swing its own idle sway, in degrees, over one stride */
var ACC_MOTION = {
  beanie:        { lag:0.55, give:0.35, swing:0    },  /* snug knit */
  bucket_hat:    { lag:1.05, give:0.60, swing:0.7  },  /* floppy brim */
  crown:         { lag:0.20, give:0.15, swing:0    },  /* rigid, regal */
  flower:        { lag:1.35, give:0.80, swing:1.8  },  /* springy stem */
  bow:           { lag:0.85, give:0.50, swing:1.0  },
  sunglasses:    { lag:0.12, give:0.08, swing:0    },  /* clamped to the face */
  heart_glasses: { lag:0.30, give:0.18, swing:0.55 },
  round_glasses: { lag:0.12, give:0.08, swing:0    },
  bowtie:        { lag:0.75, give:0.45, swing:1.2  },
  chain:         { lag:1.15, give:0.90, swing:0.6  },  /* heavy, swings late */
  _smudge:       { lag:0,    give:0,    swing:0    }   /* painted on her face */
};

/* Played frame -> unique sheet cell. The loop is a palindrome, so the second
   half is the first half walked backwards; only 33 frames are stored. */
function walkCell(played){
  var p = ((played % WALK_FRAMES) + WALK_FRAMES) % WALK_FRAMES;
  return p < SHEET_N ? p : WALK_FRAMES - p;
}
/* One entry per PLAYED frame: where the head is, plus how fast it's moving
   (which is what the per-item character reacts to). Built once. */
var PLAY = null;
function buildPlay(){
  if (PLAY) return PLAY;
  PLAY = [];
  var i, c;
  for (i = 0; i < WALK_FRAMES; i++){
    c = RIG_TRACK[walkCell(i)];
    PLAY.push({ dx:c[0], dy:c[1], lean:c[2], vx:0, vy:0 });
  }
  for (i = 0; i < WALK_FRAMES; i++){
    var prev = PLAY[(i + WALK_FRAMES - 1) % WALK_FRAMES];
    PLAY[i].vx = PLAY[i].dx - prev.dx;
    PLAY[i].vy = PLAY[i].dy - prev.dy;
  }
  return PLAY;
}
/* The transform one accessory wears on one frame. Pure — the harness drives it
   directly. `sc` converts sprite px to on-screen px. */
function accTransform(played, slot, id, sc){
  var p = buildPlay()[((played % WALK_FRAMES) + WALK_FRAMES) % WALK_FRAMES];
  var m = ACC_MOTION[id] || { lag:0.5, give:0.3, swing:0 };
  var ride = SLOT_RIDE[slot] == null ? 1 : SLOT_RIDE[slot];
  var x = p.dx * ride;
  var y = p.dy * ride + p.vy * m.give;
  var r = p.lean * ride - p.vx * m.lag
        + (m.swing ? Math.sin(played / WALK_FRAMES * Math.PI * 2) * m.swing : 0);
  return "translate(" + (x * sc).toFixed(2) + "px," + (y * sc).toFixed(2) + "px) rotate(" + r.toFixed(2) + "deg)";
}
/* Sprite-sheet cell -> CSS background-position. With background-size 600%, the
   step between cells is 100/(cols-1) percent, not 100/cols. */
function cellPos(cell){
  var rows = Math.ceil(SHEET_N / SHEET_COLS);
  return { x: (cell % SHEET_COLS) * (100 / (SHEET_COLS - 1)),
           y: Math.floor(cell / SHEET_COLS) * (100 / (rows - 1)) };
}

/* Meadow friends: birds up high, bugs mid-air, crawlers on the ground —
   drifting past on two depth layers. Config is pure (rng-injectable). */
var CRITTERS = [
  { e:"🦋", band:[18, 42], dur:[13, 20], layer:"front", size:[20, 28] },
  { e:"🐝", band:[26, 50], dur:[9, 14],  layer:"front", size:[17, 22] },
  { e:"🐦", band:[4, 20],  dur:[8, 13],  layer:"back",  size:[18, 26] },
  { e:"🐞", band:[55, 70], dur:[14, 20], layer:"front", size:[15, 19] },
  { e:"🐌", band:[80, 88], dur:[30, 40], layer:"front", size:[16, 20] }
];
var critterTimer = null;

function critterSpec(rng){
  var c = CRITTERS[Math.floor(rng() * CRITTERS.length)];
  var lerp = function(r){ return r[0] + rng() * (r[1] - r[0]); };
  return { e: c.e, top: lerp(c.band), dur: lerp(c.dur), layer: c.layer, size: Math.round(lerp(c.size)) };
}

function spawnCritter(rng){
  var host = el("critters");
  if (!host || host.childElementCount >= 4) return null;
  var s = critterSpec(rng || Math.random);
  var d = document.createElement("div");
  d.className = "critter " + s.layer;
  d.style.top = s.top + "%";
  d.style.fontSize = s.size + "px";
  d.style.animation = "drift " + s.dur.toFixed(1) + "s linear forwards";
  d.innerHTML = "<span>" + s.e + "</span>";
  host.appendChild(d);
  setTimeout(function(){ if (d.parentNode) d.parentNode.removeChild(d); }, s.dur * 1000 + 400);
  return s;
}

function startCritters(){
  stopCritters();
  spawnCritter();                                     /* one friend right away */
  critterTimer = setInterval(function(){
    if (Math.random() < 0.55) spawnCritter();
  }, 6000);
}
function stopCritters(){
  if (critterTimer){ clearInterval(critterTimer); critterTimer = null; }
  var host = el("critters");
  if (host) host.innerHTML = "";
}

function buildTrack(){
  var track = el("walktrack");
  if (track.childElementCount) return;
  /* palindrome tiling: strip + mirrored strip, scrolled 50% = seamless loop */
  track.innerHTML = '<img src="' + ART + 'walk_bg.jpg" alt="">' +
                    '<img class="flip" src="' + ART + 'walk_bg.jpg" alt="">' +
                    '<img src="' + ART + 'walk_bg.jpg" alt="">' +
                    '<img class="flip" src="' + ART + 'walk_bg.jpg" alt="">';
}
var FINDS = [
  {e:"🌼", t:"found a little flower!"}, {e:"🦋", t:"a butterfly friend!"},
  {e:"🍄", t:"ooh, a tiny mushroom!"}, {e:"✨", t:"something sparkly!"},
  {e:"🐌", t:"met a slow friend."}, {e:"🍀", t:"a lucky clover!"},
  {e:"🍙", t:"A WILD BUN!! nom.", rare:true}
];

function startWalk(){
  if (walking || !S.hatched) return;
  if (S.sleeping){ bubble("Wake " + esc(S.name) + " up first. 🌙"); return; }
  if (S.energy < 25){ bubble(esc(S.name) + " is too tired for a walk right now. 🌙"); return; }
  haptic("success");
  walking = true; walkStart = Date.now(); lastFind = Date.now(); findCount = 0;
  S.walks = (S.walks || 0) + 1; checkUnlocks();   /* milestone: first walk */
  buildTrack();
  /* WebKit quirk: percentage-transform keyframes computed against a
     not-yet-loaded (zero-width) strip don't recover — restart the animation
     now that we're visible so the first walk scrolls like every other. */
  var track = el("walktrack");
  track.style.animation = "none";
  void track.offsetWidth;
  track.style.animation = "";
  el("walkview").classList.add("show");
  syncChrome();
  startWalkAnim();
  el("walksteps").textContent = "";
  walkTimer = setInterval(walkTick, 5000);
  startCritters();
  bubble("*waddle waddle*", 3200);
}

/* ---- walk playback ----
   Sheet if we have it (frame-exact, so accessories can ride the head), the old
   animated webp if we don't. The fallback isn't only for a failed download: the
   sheet may simply not have arrived yet on a first run, and making Mochi wait
   to go outside would be a worse trade than a few seconds of static hats. */
var walkRAF = null, walkFrame = -1, sheetReady = false;
/* Fetched at boot so it's warm before the first walk. If it lands while Mochi is
   already outside, upgrade her mid-stroll — the sheet starts at the same pose,
   so the swap isn't visible. */
function preloadSheet(){
  var im = new Image();
  im.onload = function(){
    sheetReady = true;
    if (walking && !walkRAF) startWalkAnim();
  };
  im.src = ART + "walk_sheet.webp";
}
function startWalkAnim(){
  var pet = el("walkpet");
  if (sheetReady){
    pet.classList.remove("plain");
    pet.style.backgroundImage = "url(" + ART + "walk_sheet.webp)";
    paintWalkFrame(0);
    stopWalkAnim();
    walkRAF = requestAnimationFrame(walkStep);
  } else {
    /* alpha-keyed: Mochi IS in the meadow, not pasted over it */
    pet.classList.add("plain");
    pet.style.backgroundImage = "url(" + ART + "anim_walk_t.webp)";
    clearAccTransforms();
  }
}
function stopWalkAnim(){
  if (walkRAF){ cancelAnimationFrame(walkRAF); walkRAF = null; }
  walkFrame = -1;
}
function walkStep(){
  if (!walking){ walkRAF = null; return; }
  paintWalkFrame(Math.floor((Date.now() - walkStart) / FRAME_MS));
  walkRAF = requestAnimationFrame(walkStep);
}
/* rAF runs at 60fps for a 14fps animation, so only touch the DOM when the frame
   actually changes — four out of five wake-ups have nothing to do. */
function paintWalkFrame(played){
  if (played === walkFrame) return;
  walkFrame = played;
  var cell = walkCell(played), pos = cellPos(cell);
  el("walkpet").style.backgroundPosition = pos.x.toFixed(3) + "% " + pos.y.toFixed(3) + "%";
  var sc = (el("walker").clientWidth || 210) / 400;
  SLOT_ORDER.forEach(function(slot){
    var img = el("wacc_" + slot);
    if (img.style.display !== "none" && W[slot]) img.style.transform = accTransform(played, slot, W[slot], sc);
  });
  var sm = el("wsmudge");
  if (sm.style.display !== "none") sm.style.transform = accTransform(played, "eyes", "_smudge", sc);
}
function clearAccTransforms(){
  SLOT_ORDER.forEach(function(slot){ el("wacc_" + slot).style.transform = ""; });
  el("wsmudge").style.transform = "";
}

function walkTick(){
  S.energy = Math.max(12, S.energy - 0.45);
  S.happy = Math.min(100, S.happy + 0.35);
  var mins = Math.floor((Date.now() - walkStart) / 60000);
  el("walksteps").textContent = mins < 1 ? "out for a stroll…" : mins + " min stroll · " + findCount + " finds";
  if (S.energy <= 20){ endWalk(true); return; }
  maybeFind(Date.now(), Math.random);
  save();
}

function maybeFind(now, rng){
  if (now - lastFind < 16000) return null;
  if (rng() > 0.4) return null;
  lastFind = now;
  var pool = FINDS.filter(function(f){ return !f.rare || rng() < 0.18; });
  var f = pool[Math.floor(rng() * pool.length)];
  findCount++;
  S.finds = (S.finds || 0) + 1;                 /* milestone: treasures found */
  S.happy = Math.min(100, S.happy + (f.rare ? 8 : 3));
  if (f.rare) S.hunger = Math.min(100, S.hunger + 10);
  haptic(f.rare ? "success" : "light");
  bubble(f.e + " " + f.t, 4200);
  checkUnlocks();
  return f;
}

function endWalk(tired){
  if (!walking) return;
  walking = false;
  clearInterval(walkTimer); walkTimer = null;
  stopCritters();
  stopWalkAnim();
  /* Drop the sheet's decoded surface — it's 2400x2400, and Mochi is indoors now.
     The HTTP cache still has it, so the next walk starts just as fast. */
  el("walkpet").style.backgroundImage = "";
  clearAccTransforms();
  el("walkview").classList.remove("show");
  syncChrome();
  haptic("selection");
  render(); save();
  bubble(tired ? esc(S.name) + " got sleepy on the walk… 🥱" :
         "That was lovely! " + (findCount ? findCount + " treasures found." : "🌱"), 4600);
}

/* MyLLM puts its bars back when the app is left; ask again on return. */
document.addEventListener("visibilitychange", function(){ if (!document.hidden) syncChrome(); });

/* ---------- ambient life: idle mutterings & dreams ---------- */
var CHATTER = {
  happy:  ["mochi mochi~ 🌱","*hums a tiny song*","today is a good day!","*wiggles contentedly*","(◕ᴗ◕)♪","*watches a dust mote float by*"],
  hungry: ["*tummy rumbles softly*","...thinking about buns...","is it snack time? 🍙","*sniffs the air hopefully*"],
  lonely: ["*looks up at you*","play with me? 🥺","*rolls the ball hopefully*","*little sigh*"],
  sleepy: ["*yawns a tiny yawn*","...eyelids heavy...","*blinks slowly* 🌙","five more minutes of awake..."]
};
var DREAMS = ["💭 🍙🍙🍙✨","💭 bouncing on clouds…","💭 ⚽🌈","💭 a mountain of buns…","💭 🫧🐟🫧","💭 swimming in warm milk…","💭 🌙⭐️ tiny star friends…","💭 the great bun in the sky…"];
var lastAmbient = Date.now();

function chatterMood(){
  if (S.hunger < 35) return "hungry";
  if (S.energy < 30) return "sleepy";
  if (S.happy < 40) return "lonely";
  return "happy";
}

/* Ambient tick — rng + now injectable so it's testable.
   Returns what it did: null | "dream" | "chatter" | "ai" */
function ambientTick(now, rng){
  if (!S || !S.hatched || transient) return null;
  var gap = now - lastAmbient;
  /* Dreams come easier than chatter: a sleeping pet dreams within ~30-60s and
     roughly every minute after; awake mutterings stay rarer (~1.5-2.5 min). */
  var minGap = S.sleeping ? 22000 : 40000;
  var ramp   = S.sleeping ? 45000 : 110000;
  if (gap < minGap) return null;
  if (rng() > Math.min(0.9, (gap - minGap) / ramp)) return null;
  lastAmbient = now;
  if (S.sleeping){
    bubble(DREAMS[Math.floor(rng() * DREAMS.length)], 5600, true);
    return "dream";
  }
  var pool = CHATTER[chatterMood()];
  if (ASK && rng() < 0.3){
    var vibe = chatterMood();
    ASK("You are " + S.name + ", a tiny pet blob creature feeling " + vibe + ". " +
        "Say ONE spontaneous cute little thought, max 9 words, babyish, may use one emoji. " +
        "Just the thought, nothing else.")
      .then(function(r){
        var line = String(r||"").split("\n")[0].replace(/^["']|["']$/g, "").trim();
        bubble(line && line.length <= 90 ? line : pool[0], 5200);
      })
      .catch(function(){ bubble(pool[Math.floor(rng() * pool.length)], 5200); });
    return "ai";
  }
  bubble(pool[Math.floor(rng() * pool.length)], 5200);
  return "chatter";
}

setInterval(function(){ ambientTick(Date.now(), Math.random); }, 9000);
/* Opening the app onto a sleeping pet shouldn't mean a long wait for the
   first dream — start the clock most of the way there. */
lastAmbient = Date.now() - 15000;

el("say").addEventListener("keydown", function(e){ if (e.key === "Enter") talk(); });
el("petbox").addEventListener("click", stageTap);
/* Belt and braces against double-tap zoom and pinch in the web view. */
document.addEventListener("dblclick", function(e){ e.preventDefault(); }, { passive:false });
document.addEventListener("gesturestart", function(e){ e.preventDefault(); }, { passive:false });

/* Feed: a quick tap gives the default snack; press-and-hold opens the picker.
   Pointer events give one unified path (no touch/mouse double-fire in WKWebView). */
(function(){
  var fb = el("feedBtn"), timer = null, held = false;
  fb.addEventListener("pointerdown", function(){
    held = false;
    timer = setTimeout(function(){ held = true; haptic("medium"); openFoodMenu(); }, 450);
  });
  fb.addEventListener("pointerup", function(){
    clearTimeout(timer);
    if (!held) feed();
  });
  fb.addEventListener("pointerleave", function(){ clearTimeout(timer); });
  fb.addEventListener("pointercancel", function(){ clearTimeout(timer); });
})();

/* ---------- wardrobe logic ---------- */
function saveWard(){ store.setItem("mochi_wardrobe", JSON.stringify(W)); }

/* Point the six overlay <img>s (3 stage + 3 walk) at whatever's equipped, or
   hide them. Gated on hatched so a bare egg never wears a hat. */
function applyAccessories(){
  SLOT_ORDER.forEach(function(slot){
    var id = (S && S.hatched) ? W[slot] : null;
    var a = el("acc_" + slot), wa = el("wacc_" + slot);
    if (id){
      a.src = ACC_BASE + id + ".png";      a.style.display = "block";
      wa.src = ACC_BASE + id + "_w.png";   wa.style.display = "block";
    } else {
      a.style.display = "none";
      wa.style.display = "none";
      wa.style.transform = "";
    }
  });
  /* A change of outfit mid-stroll must not wait for the next frame tick to be
     placed on the head — repaint the current one. */
  if (walking && walkRAF){ var f = walkFrame; walkFrame = -1; paintWalkFrame(f < 0 ? 0 : f); }
}

function daysTogether(){ return Math.max(1, Math.ceil((Date.now() - (S ? S.born : Date.now())) / 86400000)); }
function label(id){ var c = CATALOG.filter(function(x){ return x.id === id; })[0]; return c ? c.name : id; }

/* Starters (not in UNLOCKS) are always available; a gated item is available
   only once its milestone has been reached and recorded in S.unlocked. */
function isUnlocked(id){
  if (!(id in UNLOCKS)) return true;
  return !!(S && S.unlocked && S.unlocked.indexOf(id) >= 0);
}

/* Award any newly-earned items. silent=true at boot (retroactive, no fanfare);
   silent=false during play so a fresh unlock is celebrated once. */
function checkUnlocks(silent){
  if (!S || !S.hatched) return;
  if (!S.unlocked) S.unlocked = [];
  if (S.happy >= 100) S.maxHappy = true;     /* latch: "reached 100 once" */
  var newly = [];
  for (var id in UNLOCKS){
    if (S.unlocked.indexOf(id) < 0 && UNLOCKS[id].test(S)){
      S.unlocked.push(id);
      newly.push(id);
    }
  }
  if (newly.length){
    save();
    if (el("wardrobe").classList.contains("show")) renderWardrobe();
    if (!silent){
      haptic("success");
      bubble("🎉 Unlocked " + label(newly[0]) + "! It's in the 👒 wardrobe.", 5200);
    }
  }
}

function equip(slot, id){
  if (id && !isUnlocked(id)){                /* tapped a locked item — show how to earn it */
    haptic("warning");
    var u = UNLOCKS[id];
    bubble("🔒 " + (u ? u.hint : "Locked"), 4200);
    return;
  }
  W[slot] = (W[slot] === id) ? null : id;    /* tapping the worn one takes it off */
  haptic("selection");
  applyAccessories();
  renderWardrobe();
  saveWard();
}

function chipHTML(slot, id, name, on){
  var locked = id && !isUnlocked(id);
  var inner = id ? '<img src="' + ACC_BASE + id + '_chip.png" alt="">'
                 : '<span class="none">🚫</span>';
  if (locked) inner += '<span class="lock">🔒</span>';
  var arg = id ? "'" + id + "'" : "null";
  return '<button class="chip' + (on ? ' on' : '') + (locked ? ' locked' : '') +
         '" onclick="equip(\'' + slot + '\',' + arg + ')">' +
         '<div class="thumb">' + inner + '</div><span>' + esc(name) + '</span></button>';
}

function renderWardrobe(){
  var html = "";
  SLOT_ORDER.forEach(function(slot){
    html += '<div class="wardslot"><small>' + SLOT_NAME[slot] + '</small><div class="wardrow">';
    html += chipHTML(slot, null, "None", !W[slot]);
    CATALOG.filter(function(c){ return c.slot === slot; }).forEach(function(c){
      html += chipHTML(slot, c.id, c.label, W[slot] === c.id);
    });
    html += '</div></div>';
  });
  el("wardslots").innerHTML = html;
}

function openWardrobe(){
  if (!S || !S.hatched) return;
  haptic("light");
  renderWardrobe();
  el("wardrobe").classList.add("show");
}
function closeWardrobe(){ el("wardrobe").classList.remove("show"); }

/* ---------- boot ---------- */
(function boot(){
  syncChrome();
  /* preload the loops the room shows (the keyed ones) so mood switches are
     instant; the walk uses its sprite sheet below */
  Object.keys(ANIM).forEach(function(k){ if (k !== "walk") new Image().src = ART + keyed(ANIM[k]); });
  new Image().src = ART + "anim_walk_t.webp";     /* fallback loop, and old installs */
  preloadSheet();
  new Image().src = ART + "walk_bg.jpg";
  new Image().src = SMUDGE; new Image().src = SMUDGE_W;
  el("smudge").src = SMUDGE; el("wsmudge").src = SMUDGE_W;
  buildFoodMenu();
  buildTrack();
  store.getItem("mochi_state").then(function(v){
    if (v){ try { S = JSON.parse(v); } catch(_){} }
    if (!S || typeof S.hunger !== "number") S = fresh();
    applyDecay();
    return store.getItem("mochi_wardrobe");
  }).then(function(wv){
    if (wv){ try { var w = JSON.parse(wv);
      if (w) W = { head:w.head||null, eyes:w.eyes||null, neck:w.neck||null };
    } catch(_){} }
    /* a returning owner gets a welcome-back, not a guilt trip */
    applyAccessories();
    applyMessy();
    checkUnlocks(true);   /* retroactively grant anything already earned, quietly */
    render(); save();
    setInterval(function(){ applyDecay(); checkUnlocks(false); render(); save(); }, 30000);
    /* one-time nudge so people discover the snack picker */
    store.getItem("mochi_food_tip").then(function(seen){
      if (!seen && S && S.hatched){
        store.setItem("mochi_food_tip", "1");
        setTimeout(function(){ if (!S.sleeping) bubble("Tip: press & hold 🍙 Feed to pick a snack!", 5200); }, 4200);
      }
    });
  });
})();
</script>
