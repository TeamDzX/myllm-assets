<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Crossword</title>
<style>
:root{
  color-scheme:light dark;
  --bg:var(--myllm-bg,#f2f2f7);--surface:var(--myllm-surface,#fff);
  --text:var(--myllm-text,#111);--muted:var(--myllm-muted,#6b6b72);
  --accent:var(--myllm-accent,#0b5ed7);--border:var(--myllm-border,rgba(120,120,128,.3));
  --radius:var(--myllm-radius,12px);--font:var(--myllm-font,-apple-system,system-ui,sans-serif);
  --cell:#fff;--block:#2a2a30;--sel:#ffe08a;--word:#cfe6ff;--wrong:#ffd1d1;
}
@media(prefers-color-scheme:dark){:root{--bg:var(--myllm-bg,#000);--surface:var(--myllm-surface,#1c1c1e);--text:var(--myllm-text,#eee);--muted:var(--myllm-muted,#98989f);--cell:#26262b;--block:#000;--sel:#7a6420;--word:#1d3a57;--wrong:#5a2030}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text)}
.wrap{max-width:460px;margin:0 auto;padding:10px 12px 18px}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.bar .t{font-size:13px;color:var(--muted)}.bar .sp{flex:1}
.bar button{border:0;background:var(--surface);border:1px solid var(--border);color:var(--accent);border-radius:9px;padding:7px 10px;font:inherit;font-weight:600;font-size:13px;cursor:pointer}
.grid{display:grid;gap:2px;background:var(--border);border:2px solid var(--border);border-radius:6px;overflow:hidden;margin:0 auto;width:100%;aspect-ratio:1}
.cell{position:relative;border:0;background:var(--cell);color:var(--text);font:inherit;font-weight:700;font-size:min(7vw,30px);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.cell.block{background:var(--block);cursor:default}
.cell.word{background:var(--word)}
.cell.sel{background:var(--sel)}
.cell.wrong{background:var(--wrong)}
.cell .n{position:absolute;top:1px;left:2px;font-size:10px;font-weight:600;color:var(--muted)}
.clue{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px 13px;margin:10px 0;font-size:15px;line-height:1.4;display:flex;align-items:center;gap:8px;min-height:46px}
.clue .dir{flex:none;font-weight:700;color:var(--accent);font-size:13px}
.clue .arr{flex:none;border:0;background:none;color:var(--accent);font-size:18px;cursor:pointer;padding:4px}
.kb{display:flex;flex-direction:column;gap:6px}
.kbrow{display:flex;gap:5px;justify-content:center}
.key{flex:1;max-width:34px;height:46px;border:0;border-radius:7px;background:var(--surface);border:1px solid var(--border);color:var(--text);font:inherit;font-weight:600;font-size:17px;cursor:pointer}
.key.wide{max-width:58px;font-size:14px}
.key:active{background:var(--accent);color:#fff}
.win{text-align:center;color:var(--accent);font-weight:700;font-size:16px;padding:8px;display:none}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;z-index:30}
.sheet.show{display:flex}
.sheetB{background:var(--bg);width:100%;border-radius:18px 18px 0 0;padding:16px;max-height:70%;overflow:auto}
.sheetB h3{margin:0 0 12px}
.pz{display:flex;justify-content:space-between;align-items:center;padding:13px;border:1px solid var(--border);border-radius:11px;margin-bottom:8px;background:var(--surface);cursor:pointer}
.pz .dn{color:#2bb673;font-size:13px;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <span class="t" id="pzName">Mini 1</span><span class="t" id="timer">0:00</span>
    <span class="sp"></span>
    <button id="checkBtn">Check</button>
    <button id="revealBtn">Reveal</button>
    <button id="puzBtn">Puzzles</button>
  </div>
  <div class="grid" id="grid"></div>
  <div class="win" id="win">Solved! 🎉</div>
  <div class="clue"><button class="arr" id="prevClue">‹</button><span class="dir" id="clueDir">1A</span><span id="clueText">—</span><button class="arr" id="nextClue">›</button></div>
  <div class="kb" id="kb"></div>
</div>
<div class="sheet" id="sheet"><div class="sheetB"><h3>Puzzles</h3><div id="pzList"></div></div></div>

<script>
var PUZZLES=[
 {id:"cw1",name:"Mini 1",rows:["THAN","HIRE","IDEA","SEAT"],
  clues:{A:{1:"Comparison word: \u201cbigger ___\u201d",5:"Take on for a job",6:"A bright thought \ud83d\udca1",7:"Where you sit"},
         D:{1:"Opposite of \u201cthat\u201d",2:"Conceal \u2014 or an animal\u2019s skin",3:"Region or zone",4:"Tidy"}}},
 {id:"cw2",name:"Mini 2",rows:["SHOW","LAME","EVEN","DENT"],
  clues:{A:{1:"Put on display",5:"Feeble, as an excuse",6:"Flat and level; not odd",7:"Hollow left by a knock"},
         D:{1:"Ride for snowy hills",2:"Possess",3:"A sign of things to come",4:"Travelled (past tense of \u201cgo\u201d)"}}},
 {id:"cw3",name:"Mini 3",rows:["CHOP","LIVE","AREA","PERK"],
  clues:{A:{1:"Cut with an axe",5:"Broadcast in real time",6:"Region or space",7:"A job benefit"},
         D:{1:"Applaud",2:"Employ; take on",3:"Above \u2014 or finished",4:"Mountain top"}}},
 {id:"cw4",name:"Mini 4",rows:["SURF","ORAL","OGRE","NEED"],
  clues:{A:{1:"Ride the waves \ud83c\udfc4",5:"Spoken, not written",6:"A fairy-tale monster",7:"Require"},
         D:{1:"In a little while",2:"A strong impulse",3:"Uncommon",4:"Ran away (past tense)"}}}
];

var P=null, N=0, user=[], nums=[], entries=[], cur=null, dir='A', timer=0, tInt=null, solved=false;
function $(i){return document.getElementById(i)}
function haptic(k){if(window.myllmHaptic)try{myllmHaptic(k)}catch(e){}}
function isBlock(r,c){return P.rows[r][c]==='#'}

function build(){
  N=P.rows.length;
  user=P.rows.map(function(row){return row.split('').map(function(ch){return ch==='#'?'#':''})});
  // numbering + entries
  nums=P.rows.map(function(row){return row.split('').map(function(){return 0})});
  entries=[];var n=0;
  for(var r=0;r<N;r++)for(var c=0;c<N;c++){
    if(isBlock(r,c))continue;
    var startA=(c===0||isBlock(r,c-1))&&c+1<N&&!isBlock(r,c+1);
    var startD=(r===0||isBlock(r-1,c))&&r+1<N&&!isBlock(r+1,c);
    if(startA||startD){n++;nums[r][c]=n;
      if(startA){var cells=[];for(var cc=c;cc<N&&!isBlock(r,cc);cc++)cells.push([r,cc]);entries.push({num:n,dir:'A',cells:cells,clue:(P.clues.A[n]||'')})}
      if(startD){var cd=[];for(var rr=r;rr<N&&!isBlock(rr,c);rr++)cd.push([rr,c]);entries.push({num:n,dir:'D',cells:cd,clue:(P.clues.D[n]||'')})}
    }
  }
}
function entryAt(r,c,d){return entries.find(function(e){return e.dir===d&&e.cells.some(function(x){return x[0]===r&&x[1]===c})})}
function curEntry(){return cur?entryAt(cur[0],cur[1],dir):null}

function render(){
  var g=$('grid');g.style.gridTemplateColumns='repeat('+N+',1fr)';g.innerHTML='';
  var ce=curEntry();
  for(var r=0;r<N;r++)for(var c=0;c<N;c++){
    var b=document.createElement('button');
    if(isBlock(r,c)){b.className='cell block';g.appendChild(b);continue}
    b.className='cell';
    if(ce&&ce.cells.some(function(x){return x[0]===r&&x[1]===c}))b.className+=' word';
    if(cur&&cur[0]===r&&cur[1]===c)b.className+=' sel';
    if(nums[r][c]){var s=document.createElement('span');s.className='n';s.textContent=nums[r][c];b.appendChild(s)}
    var t=document.createTextNode(user[r][c]||'');b.appendChild(t);
    (function(rr,cc){b.onclick=function(){onCell(rr,cc)}})(r,c);
    g.appendChild(b);
  }
  var e=curEntry();
  $('clueDir').textContent=e?(e.num+(e.dir==='A'?'A':'D')):'';
  $('clueText').textContent=e?e.clue:'';
}
function onCell(r,c){
  if(isBlock(r,c))return;
  if(cur&&cur[0]===r&&cur[1]===c){dir=dir==='A'?'D':'A';if(!entryAt(r,c,dir))dir=dir==='A'?'D':'A'}
  else{cur=[r,c];if(!entryAt(r,c,dir))dir=dir==='A'?'D':'A'}
  haptic('selection');render();
}
function type(ch){
  if(!cur||solved)return;
  user[cur[0]][cur[1]]=ch;haptic('light');
  var e=curEntry();if(e){var i=e.cells.findIndex(function(x){return x[0]===cur[0]&&x[1]===cur[1]});
    // advance to next empty cell in entry, else next cell
    var j=i+1;while(j<e.cells.length&&user[e.cells[j][0]][e.cells[j][1]])j++;
    if(j>=e.cells.length)j=i+1;
    if(j<e.cells.length)cur=e.cells[j];
  }
  render();save();checkWin();
}
function backspace(){
  if(!cur||solved)return;haptic('light');
  if(user[cur[0]][cur[1]]){user[cur[0]][cur[1]]=''}
  else{var e=curEntry();if(e){var i=e.cells.findIndex(function(x){return x[0]===cur[0]&&x[1]===cur[1]});if(i>0){cur=e.cells[i-1];user[cur[0]][cur[1]]=''}}}
  render();save();
}
function moveClue(delta){
  var e=curEntry(),idx=e?entries.indexOf(e):-1;
  var ni=((idx+delta)%entries.length+entries.length)%entries.length;
  var ne=entries[ni];dir=ne.dir;cur=ne.cells[0];haptic('selection');render();
}

function buildKeyboard(){
  var rows=['QWERTYUIOP','ASDFGHJKL','ZXCVBNM'];var KB=$('kb');KB.innerHTML='';
  rows.forEach(function(row,ri){
    var d=document.createElement('div');d.className='kbrow';
    if(ri===2){var del=document.createElement('button');del.className='key wide';del.textContent='⌫';del.onclick=backspace;d.appendChild(del)}
    row.split('').forEach(function(ch){var k=document.createElement('button');k.className='key';k.textContent=ch;k.onclick=function(){type(ch)};d.appendChild(k)});
    if(ri===2){var clr=document.createElement('button');clr.className='key wide';clr.textContent='Clear';clr.onclick=clearPuzzle;d.appendChild(clr)}
    KB.appendChild(d);
  });
}

function check(){
  haptic('warning');
  var els=$('grid').querySelectorAll('.cell');var k=0;
  for(var r=0;r<N;r++)for(var c=0;c<N;c++){var b=els[k++];if(isBlock(r,c))continue;
    if(user[r][c]&&user[r][c]!==P.rows[r][c])b.classList.add('wrong');
  }
  setTimeout(function(){$('grid').querySelectorAll('.wrong').forEach(function(x){x.classList.remove('wrong')})},1200);
}
function revealWord(){
  var e=curEntry();if(!e)return;haptic('medium');
  e.cells.forEach(function(x){user[x[0]][x[1]]=P.rows[x[0]][x[1]]});
  render();save();checkWin();
}
function clearPuzzle(){
  user=P.rows.map(function(row){return row.split('').map(function(ch){return ch==='#'?'#':''})});
  solved=false;$('win').style.display='none';render();save();haptic('warning');
}
function checkWin(){
  for(var r=0;r<N;r++)for(var c=0;c<N;c++){if(!isBlock(r,c)&&user[r][c]!==P.rows[r][c])return}
  solved=true;$('win').style.display='block';stopTimer();haptic('success');save();
}

function startTimer(){stopTimer();tInt=setInterval(function(){if(!solved){timer++;$('timer').textContent=fmt(timer);save()}},1000)}
function stopTimer(){if(tInt){clearInterval(tInt);tInt=null}}
function fmt(s){return Math.floor(s/60)+':'+(s%60<10?'0':'')+(s%60)}

function loadPuzzle(i,fresh){
  P=PUZZLES[i];$('pzName').textContent=P.name;build();
  if(fresh){timer=0;solved=false}
  // restore saved progress
  if(window.myllmStorage){
    myllmStorage.getItem('cw_'+P.id).then(function(v){
      if(v&&!fresh)try{var s=JSON.parse(v);if(s.user)user=s.user;if(s.timer)timer=s.timer;if(s.solved)solved=s.solved}catch(e){}
      cur=entries[0].cells[0];dir=entries[0].dir;
      $('win').style.display=solved?'block':'none';$('timer').textContent=fmt(timer);
      render();startTimer();
    });
  }else{cur=entries[0].cells[0];dir=entries[0].dir;render();startTimer()}
  curPuz=i;saveCur();
}
var curPuz=0;
function save(){if(window.myllmStorage&&P)myllmStorage.setItem('cw_'+P.id,JSON.stringify({user:user,timer:timer,solved:solved}))}
function saveCur(){if(window.myllmStorage)myllmStorage.setItem('cw_last',String(curPuz))}

$('checkBtn').onclick=check;
$('revealBtn').onclick=revealWord;
$('prevClue').onclick=function(){moveClue(-1)};
$('nextClue').onclick=function(){moveClue(1)};
$('puzBtn').onclick=function(){openPuz()};
$('sheet').onclick=function(e){if(e.target===$('sheet'))$('sheet').classList.remove('show')};
function openPuz(){
  var L=$('pzList');L.innerHTML='';
  PUZZLES.forEach(function(pz,i){
    var d=document.createElement('div');d.className='pz';
    d.innerHTML='<span>'+pz.name+'</span><span class="dn" id="dn'+i+'"></span>';
    d.onclick=function(){$('sheet').classList.remove('show');stopTimer();loadPuzzle(i,false)};
    L.appendChild(d);
    if(window.myllmStorage)myllmStorage.getItem('cw_'+pz.id).then(function(v){try{if(v&&JSON.parse(v).solved){var e=$('dn'+i);if(e)e.textContent='Solved ✓'}}catch(e){}});
  });
  $('sheet').classList.add('show');haptic('selection');
}

buildKeyboard();
if(window.myllmStorage){myllmStorage.getItem('cw_last').then(function(v){loadPuzzle(v?(+v||0):0,false)})}
else loadPuzzle(0,false);
</script>
</body>
</html>
