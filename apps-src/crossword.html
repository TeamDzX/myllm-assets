<script>
function el(i){ return document.getElementById(i); }
/* Bridges are looked up when used, never kept: MyLLM can add them after this
   script has run. */
function haptic(s){ if (window.myllmHaptic) try { myllmHaptic(s); } catch(_){} }
function load(k){ var s = window.myllmStorage; return s ? s.getItem(k).catch(function(){ return null; }) : Promise.resolve(null); }
function keep(k, v){ var s = window.myllmStorage; if (s) try { s.setItem(k, v).catch(function(){}); } catch(_){} }
var calm = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- look ---------- */
function isLight(){ return !(window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches); }
/* A game in progress takes the whole display and goes dark. Where MyLLM can't
   hide its own title bar, a dark stage under a white bar looks cut in half —
   so in light mode, without myllmImmersive, the stage stays light. */
function syncLook(){
  el("stage").classList.toggle("lite", isLight() && !(state !== "home" && window.myllmImmersive));
  if (typeof onLook === "function") onLook();
}
function syncChrome(){
  if (!window.myllmImmersive) return;
  try { myllmImmersive(state !== "home", {keepAwake:false}).catch(function(){}); } catch(_){}
}
function setHue(h){ el("stage").style.setProperty("--h", String(h)); }
function showSheet(html, acts){
  var s = el("sheet"); s.innerHTML = html;
  Object.keys(acts).forEach(function(id){ var b = el(id); if (b) b.onclick = acts[id]; });
  s.classList.add("on"); el("stage").classList.add("veil");
}
function hideSheet(){ el("sheet").classList.remove("on"); el("stage").classList.remove("veil"); }
function bump(id){ var p = el(id); p.classList.remove("bump"); void p.offsetWidth; p.classList.add("bump"); }
document.addEventListener("visibilitychange", function(){
  if (document.hidden){ if (typeof onHide === "function") onHide(); return; }
  if (state !== "home") syncChrome();          /* MyLLM puts its bars back when the app is left */
});
if (window.matchMedia){
  var mq = matchMedia("(prefers-color-scheme: dark)");
  if (mq.addEventListener) mq.addEventListener("change", syncLook); else if (mq.addListener) mq.addListener(syncLook);
}
var PUZZLES=[
 {id:"cw1",name:"Mini 1",rows:["THAN","HIRE","IDEA","SEAT"],

];

var P = null, N = 0, user = [], nums = [], entries = [], cur = null, dir = 'A', timer = 0, tInt = null, solved = false;
var state = "home";
function $(i){ return document.getElementById(i); }
function isBlock(r,c){ return P.rows[r][c] === '#'; }

function build(){
  N = P.rows.length;
  user = P.rows.map(function(row){ return row.split('').map(function(ch){ return ch === '#' ? '#' : ''; }); });
  // numbering + entries
  nums = P.rows.map(function(row){ return row.split('').map(function(){ return 0; }); });
  entries = []; var n = 0;
  for (var r = 0; r < N; r++) for (var c = 0; c < N; c++){
    if (isBlock(r,c)) continue;
    var startA = (c === 0 || isBlock(r,c-1)) && c + 1 < N && !isBlock(r,c+1);
    var startD = (r === 0 || isBlock(r-1,c)) && r + 1 < N && !isBlock(r+1,c);
    if (startA || startD){ n++; nums[r][c] = n;
      if (startA){ var cells = []; for (var cc = c; cc < N && !isBlock(r,cc); cc++) cells.push([r,cc]); entries.push({num:n, dir:'A', cells:cells, clue:(P.clues.A[n] || '')}); }
      if (startD){ var cd = []; for (var rr = r; rr < N && !isBlock(rr,c); rr++) cd.push([rr,c]); entries.push({num:n, dir:'D', cells:cd, clue:(P.clues.D[n] || '')}); }
    }
  }
}
function entryAt(r,c,d){ return entries.find(function(e){ return e.dir === d && e.cells.some(function(x){ return x[0] === r && x[1] === c; }); }); }
function curEntry(){ return cur ? entryAt(cur[0], cur[1], dir) : null; }

  var g = $('grid'); g.style.gridTemplateColumns = 'repeat(' + N + ',1fr)'; g.style.setProperty('--n', N); g.innerHTML = '';
  var ce = curEntry();

    var b = document.createElement('button');
    if (isBlock(r,c)){ b.className = 'cell block'; g.appendChild(b); continue; }
    b.className = 'cell';
    if (ce && !solved && ce.cells.some(function(x){ return x[0] === r && x[1] === c; })) b.className += ' word';
    if (cur && !solved && cur[0] === r && cur[1] === c) b.className += ' sel';
    if (nums[r][c]){ var s = document.createElement('span'); s.className = 'n'; s.textContent = nums[r][c]; b.appendChild(s); }
    b.appendChild(document.createTextNode(user[r][c] || ''));
    (function(rr,cc){ b.onclick = function(){ onCell(rr,cc); }; })(r,c);
    g.appendChild(b);
  }
  var e = curEntry();
  $('clueDir').textContent = solved ? '' : (e ? (e.num + (e.dir === 'A' ? ' ACROSS' : ' DOWN')) : '');
  $('clueText').textContent = solved ? 'Solved in ' + fmt(timer) : (e ? e.clue : '');
}
function onCell(r,c){
  if (isBlock(r,c) || state !== 'play') return;
  if (cur && cur[0] === r && cur[1] === c){ dir = dir === 'A' ? 'D' : 'A'; if (!entryAt(r,c,dir)) dir = dir === 'A' ? 'D' : 'A'; }
  else { cur = [r,c]; if (!entryAt(r,c,dir)) dir = dir === 'A' ? 'D' : 'A'; }
  haptic('selection'); render();
}
function type(ch){
  if (!cur || solved || state !== 'play') return;
  user[cur[0]][cur[1]] = ch; haptic('light');
  var e = curEntry(); if (e){ var i = e.cells.findIndex(function(x){ return x[0] === cur[0] && x[1] === cur[1]; });
    // advance to next empty cell in entry, else next cell
    var j = i + 1; while (j < e.cells.length && user[e.cells[j][0]][e.cells[j][1]]) j++;
    if (j >= e.cells.length) j = i + 1;
    if (j < e.cells.length) cur = e.cells[j];
  }
  render(); save(); checkWin();
}
function backspace(){
  if (!cur || solved || state !== 'play') return; haptic('light');
  if (user[cur[0]][cur[1]]){ user[cur[0]][cur[1]] = ''; }
  else { var e = curEntry(); if (e){ var i = e.cells.findIndex(function(x){ return x[0] === cur[0] && x[1] === cur[1]; }); if (i > 0){ cur = e.cells[i-1]; user[cur[0]][cur[1]] = ''; } } }
  render(); save();
}
function moveClue(delta){
  if (solved) return;
  var e = curEntry(), idx = e ? entries.indexOf(e) : -1;
  var ni = ((idx + delta) % entries.length + entries.length) % entries.length;
  var ne = entries[ni]; dir = ne.dir; cur = ne.cells[0]; haptic('selection'); render();
}

function buildKeyboard(){
  var rows = ['QWERTYUIOP','ASDFGHJKL','ZXCVBNM']; var KB = $('kb'); KB.innerHTML = '';
  rows.forEach(function(row,ri){
    var d = document.createElement('div'); d.className = 'kbrow';
    if (ri === 2){ var del = document.createElement('button'); del.className = 'key wide'; del.innerHTML = '<svg><use href="#i-del"/></svg>'; del.setAttribute('aria-label','Delete'); del.onclick = backspace; d.appendChild(del); }
    row.split('').forEach(function(ch){ var k = document.createElement('button'); k.className = 'key'; k.textContent = ch; k.onclick = function(){ type(ch); }; d.appendChild(k); });
    if (ri === 2){ var clr = document.createElement('button'); clr.className = 'key wide'; clr.textContent = 'Clear'; clr.onclick = clearPuzzle; d.appendChild(clr); }
    KB.appendChild(d);
  });
}

function check(){
  haptic('warning');
  var els = $('grid').querySelectorAll('.cell'); var k = 0;
  for (var r = 0; r < N; r++) for (var c = 0; c < N; c++){ var b = els[k++]; if (isBlock(r,c)) continue;
    if (user[r][c] && user[r][c] !== P.rows[r][c]) b.classList.add('wrong');
  }
  setTimeout(function(){ $('grid').querySelectorAll('.wrong').forEach(function(x){ x.classList.remove('wrong'); }); }, 1200);
}
function revealWord(){
  var e = curEntry(); if (!e || solved) return; haptic('medium');
  e.cells.forEach(function(x){ user[x[0]][x[1]] = P.rows[x[0]][x[1]]; });
  render(); save(); checkWin();
}
function clearPuzzle(){
  user = P.rows.map(function(row){ return row.split('').map(function(ch){ return ch === '#' ? '#' : ''; }); });
  solved = false; cur = entries[0].cells[0]; dir = entries[0].dir; render(); save(); haptic('warning'); startTimer(); syncTools();
}
function checkWin(){
  for (var r = 0; r < N; r++) for (var c = 0; c < N; c++){ if (!isBlock(r,c) && user[r][c] !== P.rows[r][c]) return; }
  solved = true; stopTimer(); haptic('success'); save(); render(); syncTools();
  setTimeout(function(){ if (solved && state === 'play') showSolved(); }, 500);
}
function syncTools(){ $('checkBtn').disabled = solved; $('revealBtn').disabled = solved; }

/* the clock only runs while you're actually solving */
function startTimer(){ stopTimer(); if (state !== 'play' || solved || document.hidden) return; tInt = setInterval(function(){ if (!solved){ timer++; $('timer').textContent = fmt(timer); save(); } }, 1000); }
function stopTimer(){ if (tInt){ clearInterval(tInt); tInt = null; } }
function fmt(s){ return Math.floor(s / 60) + ':' + (s % 60 < 10 ? '0' : '') + (s % 60); }

var curPuz = 0;
function loadPuzzle(i, then){
  stopTimer();
  P = PUZZLES[i]; syncLabel(); build(); timer = 0; solved = false;
  curPuz = i; saveCur();
  load('cw_' + P.id).then(function(v){
    if (v) try { var s = JSON.parse(v); if (s.user) user = s.user; if (s.timer) timer = s.timer; if (s.solved) solved = s.solved; } catch(e){}
    cur = entries[0].cells[0]; dir = entries[0].dir;
    $('timer').textContent = fmt(timer); render(); syncTools();
    if (then) then();
  });
}
function save(){ if (P) keep('cw_' + P.id, JSON.stringify({user:user, timer:timer, solved:solved})); }
function saveCur(){ keep('cw_last', String(curPuz)); }

/* ---------- cards ---------- */
function puzzleList(cb){
  var out = [], left = PUZZLES.length;
  PUZZLES.forEach(function(pz, i){
    load('cw_' + pz.id).then(function(v){
      var st = ''; try { var s = v && JSON.parse(v); if (s){ if (s.solved) st = 'done'; else if (s.user && s.user.some(function(row){ return row.some(function(ch){ return ch && ch !== '#'; }); })) st = 'going'; } } catch(e){}
      out[i] = st; if (--left === 0) cb(out);
    });
  });
}
function listHTML(st){
  return PUZZLES.map(function(pz, i){
    var tag = st[i] === 'done' ? '<small><svg><use href="#i-check"/></svg> Solved</small>' : st[i] === 'going' ? '<small>In progress</small>' : '<small>New</small>';
    return '<button class="pz glass' + (st[i] === 'done' ? ' done' : '') + (i === curPuz ? ' cur' : '') + '" data-i="' + i + '"><span>' + pz.name + '</span>' + tag + '</button>';
  }).join('');
}
function wireList(){
  Array.prototype.forEach.call(document.querySelectorAll('#sheet .pz'), function(b){
    b.onclick = function(){ haptic('selection'); var i = +b.dataset.i; if (i === curPuz && P) enterPlay(); else loadPuzzle(i, enterPlay); };
  });
}
function showHome(){
  puzzleList(function(st){
    showSheet('<h1>Crossword</h1><p>Four minis. Tap a square twice to switch across and down.</p>' + listHTML(st) +
      '<button class="act pri" id="sA"><svg><use href="#i-play"/></svg>' + (st[curPuz] === 'going' ? 'Continue ' : 'Play ') + PUZZLES[curPuz].name + '</button>', {sA: function(){ haptic('medium'); enterPlay(); }});
    wireList();
  });
}
function showPicker(){
  stopTimer();
  puzzleList(function(st){
    showSheet('<div class="kick">Puzzles</div>' + listHTML(st) +
      '<button class="act pri" id="sA"><svg><use href="#i-play"/></svg>Back to ' + P.name + '</button><button class="act glass" id="sB">Leave</button>',
      {sA: function(){ haptic('light'); hideSheet(); startTimer(); }, sB: goHome});
    wireList();
  });
}
function showSolved(){
  var next = (curPuz + 1) % PUZZLES.length;
  showSheet('<div class="kick">' + P.name + ' · Solved</div><div class="big">' + fmt(timer) + '<small>your time</small></div>' +
    '<button class="act pri" id="sA"><svg><use href="#i-next"/></svg>' + PUZZLES[next].name + '</button><button class="act glass" id="sB">See the grid</button>',
    {sA: function(){ haptic('medium'); loadPuzzle(next, enterPlay); }, sB: function(){ haptic('light'); hideSheet(); }});
}

/* ---------- flow ---------- */
function syncLabel(){ $('pzName').textContent = state === 'play' && P ? P.name : 'Crossword'; }
function setState(s){
  state = s; syncLabel(); $('stage').classList.toggle('home', s === 'home');
  $('bMenu').classList.toggle('hide', s !== 'play'); $('timerPill').classList.toggle('hide', s !== 'play');
  syncLook(); syncChrome();
}
function enterPlay(){ hideSheet(); setState('play'); render(); startTimer(); }
function goHome(){ haptic('light'); stopTimer(); setState('home'); showHome(); }
function onHide(){ stopTimer(); }
document.addEventListener('visibilitychange', function(){ if (!document.hidden && state === 'play' && !el('sheet').classList.contains('on')) startTimer(); });

$('checkBtn').onclick = check;
$('revealBtn').onclick = revealWord;
$('prevClue').onclick = function(){ moveClue(-1); };
$('nextClue').onclick = function(){ moveClue(1); };
$('bMenu').onclick = function(){ haptic('selection'); showPicker(); };
document.addEventListener('keydown', function(e){
  if (state !== 'play' || el('sheet').classList.contains('on')) return;
  if (/^[a-z]$/i.test(e.key)){ type(e.key.toUpperCase()); e.preventDefault(); }
  else if (e.key === 'Backspace'){ backspace(); e.preventDefault(); }
});

function fit(){
  var w = $('wrap');
  var b = Math.floor(Math.min(w.clientWidth, w.clientHeight, 520));
  $('stage').style.setProperty('--b', Math.max(160, b) + 'px');
}
window.addEventListener('resize', fit);

/* ---------- boot ---------- */
buildKeyboard(); fit(); syncLook();
load('cw_last').then(function(v){ var i = v ? (+v || 0) : 0; if (!PUZZLES[i]) i = 0; loadPuzzle(i, showHome); });
</script></body></html>
