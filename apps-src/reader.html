<title>Reader</title>
<style>:root{--build-id:"45fb2e6045";color-scheme:light dark;
  --bg:var(--myllm-bg,#f2f2f7); --surface:var(--myllm-surface,#fff); --ink:var(--myllm-text,#111);
  --muted:var(--myllm-muted,#8a8a8e); --line:var(--myllm-border,#e3e3e8); --acc:var(--myllm-accent,#0a84ff);
  --fill:rgba(120,120,128,.12); --h:212; }
@media (prefers-color-scheme:dark){ :root{ --bg:var(--myllm-bg,#000); --surface:var(--myllm-surface,#1c1c1e);
  --ink:var(--myllm-text,#f2f2f7); --muted:var(--myllm-muted,#8e8e93); --line:var(--myllm-border,#2c2c2e); --fill:rgba(120,120,128,.24); } }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ font-family:var(--myllm-font,-apple-system,system-ui,sans-serif); background:var(--bg); color:var(--ink);
    max-width:720px; margin:0 auto; min-height:100dvh; font-size:15.5px; line-height:1.4;
    padding:calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 0 calc(16px + env(safe-area-inset-left)); }
  svg.i{ width:1.25em; height:1.25em; fill:currentColor; flex-shrink:0; }
  button{ font:inherit; color:inherit; cursor:pointer; } button:active{ transform:scale(.96); }
  [hidden]{ display:none !important; }

  .head{ display:flex; align-items:center; gap:12px; margin:2px 2px 6px; }
  .tile{ display:flex; align-items:center; justify-content:center; color:#fff; flex-shrink:0;
    background:linear-gradient(145deg, hsl(var(--h) 62% 50%), hsl(calc(var(--h) + 40) 58% 28%)); }
  .head .tile{ width:44px; height:44px; border-radius:13px; font-size:19px; }
  .head .ht{ flex:1; min-width:0; }
  h1{ font-size:22px; font-weight:800; letter-spacing:-.01em; }
  .head p{ font-size:13px; color:var(--muted); margin-top:1px; }

  /* the address bar stays put while an article scrolls; the header scrolls away */
  .stick{ position:sticky; top:0; z-index:5; margin:0 calc(-16px - env(safe-area-inset-right)) 0 calc(-16px - env(safe-area-inset-left));
    padding:8px calc(16px + env(safe-area-inset-right)) 10px calc(16px + env(safe-area-inset-left));
    background:color-mix(in srgb, var(--bg) 90%, transparent); -webkit-backdrop-filter:saturate(180%) blur(12px); backdrop-filter:saturate(180%) blur(12px); }
  .bar{ display:flex; gap:8px; }
  .field{ flex:1; min-width:0; display:flex; align-items:center; gap:8px; border:1px solid var(--line); background:var(--surface); border-radius:12px; padding:0 12px; }
  .field svg{ color:var(--muted); }
  .field input{ flex:1; min-width:0; border:0; background:none; outline:none; font:inherit; font-size:16px; padding:12px 0; color:var(--ink); }
  .field:focus-within{ border-color:var(--acc); }
  .go{ flex-shrink:0; min-height:46px; border:0; border-radius:12px; padding:0 16px; background:var(--acc); color:#fff; font-size:15px; font-weight:700; display:flex; align-items:center; gap:7px; }
  .go:disabled{ opacity:.55; }
  .spin{ width:16px; height:16px; border-radius:50%; border:2.4px solid currentColor; border-right-color:transparent; animation:spin .8s linear infinite; flex-shrink:0; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .welcome{ text-align:center; background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:26px 22px; margin-top:6px; }
  .welcome .tile{ width:48px; height:48px; border-radius:14px; font-size:21px; margin:0 auto 10px; }
  .welcome b{ display:block; font-size:16px; font-weight:750; }
  .welcome p{ font-size:13.5px; color:var(--muted); line-height:1.5; max-width:320px; margin:6px auto 0; }

  .notice{ display:flex; gap:12px; align-items:flex-start; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px; margin:6px 0 12px; }
  .notice .tile{ width:36px; height:36px; border-radius:10px; font-size:15px; }
  .notice.err .tile{ background:linear-gradient(145deg,#ff6b5f,#c0392b); }
  .notice.off .tile{ background:linear-gradient(145deg,#8e8e93,#48484a); }
  .notice b{ display:block; font-size:15px; font-weight:750; }
  .notice p{ font-size:13.5px; color:var(--muted); margin-top:2px; line-height:1.45; overflow-wrap:anywhere; }
  .notice button{ margin-top:10px; min-height:36px; padding:0 14px; border-radius:10px; border:0; background:var(--acc); color:#fff; font-weight:700; font-size:13.5px; display:inline-flex; align-items:center; gap:6px; }

  .sk{ padding:18px 4px; }
  .sk i{ display:block; height:14px; border-radius:7px; background:var(--fill); margin-bottom:12px; animation:pulse 1.3s ease-in-out infinite; }
  .sk i.t{ height:26px; width:80%; margin-bottom:18px; }
  .sk i:nth-child(4n){ width:70%; margin-bottom:22px; }
  @keyframes pulse{ 50%{ opacity:.45; } }

  /* the article: comfortable measure and rhythm */
  .content{ max-width:68ch; margin:0 auto; padding:14px 4px 28px; }
  .content .title{ font-size:27px; font-weight:800; line-height:1.18; letter-spacing:-.015em; margin-bottom:8px; overflow-wrap:anywhere; }
  .content .src{ display:flex; align-items:center; gap:6px; font-size:13px; color:var(--muted); margin-bottom:22px; }
  .content .src span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .content p, .content li{ font-size:18px; line-height:1.62; margin:0 0 1.05em; overflow-wrap:break-word; }
  .content li{ margin:0 0 .5em 1.2em; }
  .content h2, .content h3{ font-size:21px; font-weight:750; line-height:1.3; margin:1.5em 0 .5em; }

  .answer{ max-width:68ch; margin:0 auto 12px; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px 15px; }
  .answer .q{ display:flex; gap:8px; align-items:flex-start; font-size:13px; font-weight:750; color:hsl(var(--h) 70% 45%); margin-bottom:7px; }
  @media (prefers-color-scheme:dark){ .answer .q{ color:hsl(var(--h) 85% 68%); } }
  .answer .a{ font-size:15.5px; line-height:1.55; white-space:pre-wrap; }
  .answer .a.err{ color:#ff453a; }
  .answer .wait{ display:flex; align-items:center; gap:8px; color:var(--muted); font-size:14px; }

  .ask{ position:sticky; bottom:0; z-index:5; margin:0 calc(-16px - env(safe-area-inset-right)) 0 calc(-16px - env(safe-area-inset-left));
    padding:10px calc(16px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
    background:color-mix(in srgb, var(--bg) 90%, transparent); -webkit-backdrop-filter:saturate(180%) blur(12px); backdrop-filter:saturate(180%) blur(12px); border-top:1px solid var(--line); }
  .ask .bar{ max-width:68ch; margin:0 auto; }
  .ask .go{ background:hsl(252 70% 58%); }
  .pad{ height:calc(30px + env(safe-area-inset-bottom)); }

  @media (max-width:350px){ .go span{ display:none; } }
  @media (prefers-reduced-motion:reduce){ .sk i{ animation:none; } .spin{ animation-duration:2.4s; } button:active{ transform:none; } }
  @keyframes myllmAiSpin{to{transform:rotate(360deg)}}
  .myllm-ai-busy{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(18px);z-index:99999;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;display:flex;align-items:center;gap:10px;background:rgba(28,28,30,.96);color:#fff;border-radius:999px;padding:10px 16px 10px 14px;box-shadow:0 6px 22px rgba(0,0,0,.4);font-size:14px;font-weight:600;max-width:92%}
  .myllm-ai-busy.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .myllm-ai-cog{width:16px;height:16px;border-radius:50%;border:2.4px solid #a78bfa;border-right-color:transparent;animation:myllmAiSpin .9s linear infinite;flex-shrink:0}
  .myllm-ai-busy small{font-weight:400;opacity:.6}
</style></head><body>

<script>
(function(){if(window.__myllmAiWrap||typeof window.myllmAsk!=='function')return;window.__myllmAiWrap=true;
var orig=window.myllmAsk,depth=0,node=null;
function ensure(){if(node)return;node=document.createElement('div');node.className='myllm-ai-busy';
node.innerHTML='<span class="myllm-ai-cog"></span><span>AI is thinking… <small>privately, on your device</small></span>';
(document.body||document.documentElement).appendChild(node);}
function show(){ensure();depth++;node.classList.add('on');}
function hide(){depth=Math.max(0,depth-1);if(depth===0&&node)node.classList.remove('on');}
window.myllmAsk=function(){show();var p;try{p=orig.apply(this,arguments);}catch(e){hide();throw e;}
return Promise.resolve(p).then(function(r){hide();return r;},function(e){hide();throw e;});};})();
</script>

<div class="head">
  <div class="tile"><svg class="i"><use href="#i-book"/></svg></div>
  <div class="ht"><h1>Reader</h1><p>Clean reading, then ask your AI</p></div>
</div>
<div class="stick"><div class="bar">
  <label class="field"><svg class="i"><use href="#i-link"/></svg><input id="url" placeholder="Paste an article address…" enterkeyhint="go" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Web address"></label>
  <button class="go" id="readBtn" type="button"><svg class="i"><use href="#i-arrow"/></svg><span>Read</span></button>
</div></div>
<div id="status"></div>
<div class="welcome" id="welcome">
  <div class="tile"><svg class="i"><use href="#i-book"/></svg></div>
  <b>Any article, without the clutter</b>
  <p>Paste an article’s address above. The page is fetched and stripped down to clean, readable text on your phone — then you can ask your AI about it.</p>
</div>
<div class="content" id="content" hidden></div>
<div class="answer" id="answer" hidden></div>
<div class="pad" id="pad"></div>
<div class="ask" id="ask" hidden><div class="bar">
  <label class="field"><svg class="i"><use href="#i-spark"/></svg><input id="q" placeholder="Ask about this page…" enterkeyhint="send" aria-label="Question"></label>
  <button class="go" id="askBtn" type="button" aria-label="Ask"><svg class="i"><use href="#i-send"/></svg><span>Ask</span></button>
</div></div>

<script>
var lastText='',lastTitle='',lastUrl='';
function el(i){return document.getElementById(i)}
/* Looked up when used, never kept: MyLLM can add bridges after this script runs. */
function net(){return window.myllmFetch||null}
function haptic(k){if(window.myllmHaptic)try{myllmHaptic(k)}catch(e){}}
function icon(n){return '<svg class="i"><use href="#i-'+n+'"/></svg>'}
function notice(kind,title,text,retry){
  var S=el('status');
  if(!kind){S.innerHTML='';return}
  S.innerHTML='<div class="notice '+kind+'"><div class="tile">'+icon(kind==='off'?'off':'warn')+'</div><div><b>'+esc(title)+'</b><p>'+esc(text)+'</p>'+
    (retry?'<button type="button">'+icon('refresh')+'Try again</button>':'')+'</div></div>';
  if(retry)S.querySelector('button').onclick=retry;
}
function skeleton(){var h='<div class="sk"><i class="t"></i>';for(var i=0;i<9;i++)h+='<i></i>';el('status').innerHTML=h+'</div>'}

function normUrl(u){u=u.trim();if(!u)return'';if(!/^https?:\/\//i.test(u))u='https://'+u;return u}
function host(u){try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return u}}

function go(){
  var u=normUrl(el('url').value);if(!u)return;
  el('url').value=u;el('url').blur();lastUrl=u;
  el('welcome').hidden=true;el('content').hidden=true;
  el('answer').hidden=true;el('ask').hidden=true;
  if(!net()){notice('off','Network access is off','Reader needs “Allow apps to use the internet” in MyLLM’s Settings.',go);return}
  skeleton();
  var b=el('readBtn');b.disabled=true;b.innerHTML='<i class="spin"></i><span>Reading</span>';
  net()(u,{headers:{Accept:'text/html'}})
  .then(function(r){
    if(!r||!r.ok)throw new Error('the site returned '+((r&&r.status)||'no response'));
    var parsed=extract(r.body,u);
    if(!parsed.html){throw new Error('couldn’t find readable text on this page')}
    lastText=parsed.text;lastTitle=parsed.title;
    el('content').innerHTML='<div class="title">'+esc(parsed.title)+'</div><div class="src">'+icon('link')+'<span>'+esc(host(u))+'</span></div>'+parsed.html;
    el('content').hidden=false;notice(null);
    if(window.myllmAsk){el('ask').hidden=false}
    el('pad').hidden=!!window.myllmAsk;
    window.scrollTo(0,0);haptic('light');
  }).catch(function(err){notice('err','Couldn’t open this page',err.message,go)})
  .then(function(){b.disabled=false;b.innerHTML=icon('arrow')+'<span>Read</span>'});
}

function extract(html,base){
  var doc=new DOMParser().parseFromString(html,'text/html');
  var title=(doc.querySelector('title')&&doc.querySelector('title').textContent.trim())||
            (doc.querySelector('h1')&&doc.querySelector('h1').textContent.trim())||'Untitled';
  ['script','style','noscript','nav','header','footer','aside','form','iframe','svg','button'].forEach(function(t){
    Array.prototype.forEach.call(doc.querySelectorAll(t),function(n){n.remove()});
  });
  // Pick the densest container: <article>, else the node whose <p> text is longest.
  var root=doc.querySelector('article');
  if(!root){
    var best=null,bestLen=0;
    Array.prototype.forEach.call(doc.querySelectorAll('main,section,div'),function(n){
      var len=0;Array.prototype.forEach.call(n.querySelectorAll(':scope > p'),function(p){len+=p.textContent.length});
      if(len>bestLen){bestLen=len;best=n}
    });
    root=best||doc.body;
  }
  var out='',text='';
  Array.prototype.forEach.call(root.querySelectorAll('h2,h3,p,li'),function(n){
    var t=n.textContent.replace(/\s+/g,' ').trim();
    if(t.length<2)return;
    var tag=n.tagName.toLowerCase();
    if((tag==='p'||tag==='li')&&t.length<25)return;   // drop boilerplate scraps
    out+='<'+tag+'>'+esc(t)+'</'+tag+'>';
    text+=t+'\n';
  });
  return {title:title,html:out,text:text.trim()};
}

function askAI(){
  var q=el('q').value.trim();if(!q)return;
  if(!window.myllmAsk)return;
  var A=el('answer');A.hidden=false;
  A.innerHTML='<div class="q">'+icon('spark')+'<span>'+esc(q)+'</span></div><div class="wait"><i class="spin"></i>Reading the article…</div>';
  var btn=el('askBtn');btn.disabled=true;
  var ctx=lastText.slice(0,7000);
  myllmAsk('Based ONLY on this article, answer the question. If the answer isn’t in the text, say so.\n\nARTICLE ("'+lastTitle+'"):\n'+ctx+'\n\nQUESTION: '+q,
           {system:'You are a concise reading assistant. Answer from the provided article only.'})
  .then(function(reply){A.innerHTML='<div class="q">'+icon('spark')+'<span>'+esc(q)+'</span></div><div class="a">'+esc(String(reply).trim())+'</div>';haptic('success')})
  .catch(function(err){A.innerHTML='<div class="q">'+icon('spark')+'<span>'+esc(q)+'</span></div><div class="a err">Couldn’t answer: '+esc(err&&err.message||'the AI is unavailable')+'</div>'})
  .then(function(){btn.disabled=false;A.scrollIntoView({block:'nearest',behavior:'smooth'})});
  el('q').value='';
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

el('readBtn').onclick=go;
el('askBtn').onclick=askAI;
el('url').addEventListener('keydown',function(e){if(e.key==='Enter')go()});
el('q').addEventListener('keydown',function(e){if(e.key==='Enter')askAI()});
</script></body></html>
