<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>:root{color-scheme:light dark;--accent:#0a84ff}
*{box-sizing:border-box}
body{font-family:-apple-system,system-ui,sans-serif;margin:0;padding:0;background:#f2f2f7;color:#111}
@media(prefers-color-scheme:dark){body{background:#000;color:#eee}.bar{background:rgba(20,20,22,.92)}input{background:#1c1c1e;color:#eee;border-color:#3a3a3c}.ask,.answer{background:#1c1c1e}}
.bar{position:sticky;top:0;background:rgba(242,242,247,.94);backdrop-filter:saturate(180%) blur(12px);padding:12px 14px;display:flex;gap:8px;z-index:5;border-bottom:1px solid rgba(128,128,128,.18)}
input{flex:1;padding:11px 13px;border:1px solid #d1d1d6;border-radius:10px;font-size:16px;background:#fff}
.bar button{border:0;background:var(--accent);color:#fff;border-radius:10px;padding:0 16px;font-weight:600;font-size:15px}
.content{padding:20px 18px 32px;max-width:680px;margin:0 auto}
.title{font-size:26px;font-weight:700;line-height:1.2;margin-bottom:6px}
.src{font-size:13px;opacity:.55;margin-bottom:18px;word-break:break-all}
.content p,.content li{font-size:18px;line-height:1.65;margin:0 0 16px}
.content li{margin-bottom:8px}
.content h2,.content h3{font-size:20px;margin:24px 0 10px;line-height:1.3}
#status{padding:30px 18px;text-align:center;opacity:.7;font-size:15px}
.welcome{padding:40px 24px;text-align:center;opacity:.7}
.welcome h2{font-size:18px}.welcome p{font-size:14px;line-height:1.5}
.ask{position:sticky;bottom:0;background:#fff;border-top:1px solid rgba(128,128,128,.2);padding:10px 14px;display:none;gap:8px}
.ask input{font-size:15px}
.ask button{border:0;background:#5e5ce6;color:#fff;border-radius:10px;padding:0 14px;font-weight:600}
.answer{background:#eef;border-radius:12px;padding:14px 16px;margin:0 18px 18px;font-size:15px;line-height:1.55;display:none;white-space:pre-wrap}
@media(prefers-color-scheme:dark){.answer{background:#15152a}}
.answer b{color:#5e5ce6}
</style></head><body>
<style>
@keyframes myllmAiSpin{to{transform:rotate(360deg)}}
.myllm-ai-busy{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(18px);z-index:99999;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;display:flex;align-items:center;gap:10px;background:rgba(28,28,30,.96);color:#fff;border-radius:999px;padding:10px 16px 10px 14px;box-shadow:0 6px 22px rgba(0,0,0,.4);font-family:-apple-system,system-ui,sans-serif;font-size:14px;font-weight:600;max-width:92%}
.myllm-ai-busy.on{opacity:1;transform:translateX(-50%) translateY(0)}
.myllm-ai-cog{font-size:18px;line-height:1;animation:myllmAiSpin 2.4s linear infinite;filter:drop-shadow(0 0 5px rgba(124,92,255,.85))}
.myllm-ai-busy small{font-weight:400;opacity:.6}
@media(min-width:768px){.content{max-width:720px}}
</style>
<script>
(function(){
  if(window.__myllmAiWrap||typeof window.myllmAsk!=='function')return;
  window.__myllmAiWrap=true;
  var orig=window.myllmAsk,depth=0,node=null;
  function ensure(){if(node)return;node=document.createElement('div');node.className='myllm-ai-busy';
    node.innerHTML='<span class="myllm-ai-cog">\u2699\uFE0F</span><span>AI is thinking\u2026 <small>privately, on your device</small></span>';
    (document.body||document.documentElement).appendChild(node);}
  function show(){ensure();depth++;node.classList.add('on');}
  function hide(){depth=Math.max(0,depth-1);if(depth===0&&node)node.classList.remove('on');}
  window.myllmAsk=function(){show();var p;try{p=orig.apply(this,arguments);}catch(e){hide();throw e;}
    return Promise.resolve(p).then(function(r){hide();return r;},function(e){hide();throw e;});};
})();
</script>

<div class="bar">
  <input id="url" placeholder="Enter a web address…" enterkeyhint="go" autocapitalize="off" autocorrect="off">
  <button onclick="go()">Read</button>
</div>
<div id="status"></div>
<div class="welcome" id="welcome">
  <h2>📖 Reader</h2>
  <p>Type any article URL above. The page is fetched and stripped down to clean, readable text — then you can ask your AI about it.</p>
</div>
<div class="content" id="content" style="display:none"></div>
<div class="answer" id="answer"></div>
<div class="ask" id="ask">
  <input id="q" placeholder="Ask about this page…" enterkeyhint="send">
  <button onclick="askAI()">Ask</button>
</div>
<script>
var lastText='',lastTitle='';
function el(i){return document.getElementById(i)}
function setStatus(t){var s=el('status');s.style.display=t?'block':'none';s.textContent=t||''}

function normUrl(u){u=u.trim();if(!u)return'';if(!/^https?:\/\//i.test(u))u='https://'+u;return u}

function go(){
  var u=normUrl(el('url').value);if(!u)return;
  el('url').value=u;el('url').blur();
  el('welcome').style.display='none';el('content').style.display='none';
  el('answer').style.display='none';el('ask').style.display='none';
  if(!window.myllmFetch){setStatus('This app needs network access — update MyLLM and enable app network access in Settings.');return}
  setStatus('Fetching…');
  myllmFetch(u,{headers:{Accept:'text/html'}})
  .then(function(r){
    if(!r||!r.ok)throw new Error('the site returned '+((r&&r.status)||'no response'));
    var parsed=extract(r.body,u);
    if(!parsed.html){throw new Error('couldn’t find readable text on this page')}
    lastText=parsed.text;lastTitle=parsed.title;
    el('content').innerHTML='<div class="title">'+esc(parsed.title)+'</div><div class="src">'+esc(u)+'</div>'+parsed.html;
    el('content').style.display='block';setStatus('');
    if(window.myllmAsk){el('ask').style.display='flex'}
    window.scrollTo(0,0);
  }).catch(function(err){setStatus('Couldn’t open this page: '+err.message)});
}

function extract(html,base){
  var doc=new DOMParser().parseFromString(html,'text/html');
  var title=(doc.querySelector('title')&&doc.querySelector('title').textContent.trim())||
            (doc.querySelector('h1')&&doc.querySelector('h1').textContent.trim())||'Untitled';
  ['script','style','noscript','nav','header','footer','aside','form','iframe','svg','button'].forEach(function(t){
    Array.prototype.forEach.call(doc.querySelectorAll(t),function(n){n.remove()});
  });
  // Pick the densest container: <article>, else the node whose <p> text is longest.
  var root=doc.querySelector('article');
  if(!root){
    var best=null,bestLen=0;
    Array.prototype.forEach.call(doc.querySelectorAll('main,section,div'),function(n){
      var len=0;Array.prototype.forEach.call(n.querySelectorAll(':scope > p'),function(p){len+=p.textContent.length});
      if(len>bestLen){bestLen=len;best=n}
    });
    root=best||doc.body;
  }
  var out='',text='';
  Array.prototype.forEach.call(root.querySelectorAll('h2,h3,p,li'),function(n){
    var t=n.textContent.replace(/\s+/g,' ').trim();
    if(t.length<2)return;
    var tag=n.tagName.toLowerCase();
    if((tag==='p'||tag==='li')&&t.length<25)return;   // drop boilerplate scraps
    out+='<'+tag+'>'+esc(t)+'</'+tag+'>';
    text+=t+'\n';
  });
  return {title:title,html:out,text:text.trim()};
}

function askAI(){
  var q=el('q').value.trim();if(!q)return;
  if(!window.myllmAsk)return;
  var A=el('answer');A.style.display='block';A.innerHTML='<b>Thinking…</b>';
  var ctx=lastText.slice(0,7000);
  myllmAsk('Based ONLY on this article, answer the question. If the answer isn’t in the text, say so.\n\nARTICLE ("'+lastTitle+'"):\n'+ctx+'\n\nQUESTION: '+q,
           {system:'You are a concise reading assistant. Answer from the provided article only.'})
  .then(function(reply){A.innerHTML='<b>'+esc(q)+'</b>\n\n'+esc(reply.trim())})
  .catch(function(err){A.innerHTML='Couldn’t answer: '+esc(err.message)});
  el('q').value='';
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

el('url').addEventListener('keydown',function(e){if(e.key==='Enter')go()});
el('q').addEventListener('keydown',function(e){if(e.key==='Enter')askAI()});
</script></body></html>
