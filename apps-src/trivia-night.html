<title>Trivia Night</title>
<style>:root{--build-id:"e3bee5843c";color-scheme:light dark;
  --bg:var(--myllm-bg,#f2f2f7); --surface:var(--myllm-surface,#fff); --ink:var(--myllm-text,#111);
  --muted:var(--myllm-muted,#8a8a8e); --line:var(--myllm-border,#e3e3e8); --acc:var(--myllm-accent,#0a84ff); --h:264; }
  @media (prefers-color-scheme:dark){ :root{ --bg:var(--myllm-bg,#000); --surface:var(--myllm-surface,#1c1c1e);
    --ink:var(--myllm-text,#f2f2f7); --muted:var(--myllm-muted,#8e8e93); --line:var(--myllm-border,#2c2c2e); } }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ font-family:var(--myllm-font,-apple-system,system-ui,sans-serif); background:var(--bg); color:var(--ink); min-height:100dvh; }
  body.lock{ overflow:hidden; }
  button{ font:inherit; } button:active{ transform:scale(.97); }
  svg.i{ width:1.25em; height:1.25em; fill:currentColor; flex-shrink:0; }

  /* ---------- setup, in MyLLM's own chrome ---------- */
  .home{ max-width:600px; margin:0 auto;
    padding:calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(30px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left)); }
  .head{ display:flex; align-items:center; gap:12px; margin:2px 2px 14px; }
  .head .tile{ display:flex; align-items:center; justify-content:center; color:#fff; flex-shrink:0; width:44px; height:44px; border-radius:13px; font-size:19px;
    background:linear-gradient(145deg, hsl(var(--h) 62% 50%), hsl(calc(var(--h) + 40) 58% 28%)); }
  .head .ht{ flex:1; min-width:0; }
  .head h1{ font-size:22px; font-weight:800; letter-spacing:-.01em; }
  .head p{ font-size:13px; color:var(--muted); margin-top:1px; }
  .hero{ border-radius:22px; padding:18px; color:#fff; display:flex; align-items:center; justify-content:space-between; gap:12px;
    background:linear-gradient(145deg, hsl(var(--h) 62% 50%), hsl(calc(var(--h) + 40) 58% 26%)); box-shadow:0 12px 30px hsl(var(--h) 60% 30% / .28); }
  .hero h1{ font-size:24px; font-weight:800; letter-spacing:-.01em; }
  .hero p{ font-size:13.5px; opacity:.82; margin-top:4px; line-height:1.4; }
  .hero .stat{ text-align:right; flex-shrink:0; } .hero .stat b{ display:block; font-size:30px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; }
  .hero .stat span{ font-size:10.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; opacity:.75; }
  h2.sec{ font-size:12px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); margin:20px 2px 9px; }
  .card{ background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:14px; }
  input{ width:100%; height:48px; padding:0 14px; border:1px solid var(--line); border-radius:13px; font:inherit; font-size:16px; background:var(--bg); color:var(--ink); outline:none; }
  input:focus{ border-color:hsl(var(--h) 70% 60%); }
  .chips{ display:flex; gap:7px; overflow-x:auto; -webkit-overflow-scrolling:touch; padding-top:10px; scrollbar-width:none; }
  .chips::-webkit-scrollbar{ display:none; }
  .chips button{ border:1px solid var(--line); background:var(--bg); color:var(--ink); border-radius:99px; height:36px; padding:0 14px; font-size:13px; font-weight:650; white-space:nowrap; flex-shrink:0; }
  .seg{ display:flex; background:var(--bg); border:1px solid var(--line); border-radius:13px; padding:3px; }
  .seg button{ flex:1; border:none; background:none; color:var(--muted); border-radius:10px; height:40px; font-size:14px; font-weight:700; }
  .seg button.on{ background:hsl(var(--h) 62% 54%); color:#fff; }
  .go{ width:100%; height:54px; border:none; border-radius:16px; margin-top:16px; font-size:16.5px; font-weight:750; color:#fff;
    background:hsl(var(--h) 62% 54%); display:flex; align-items:center; justify-content:center; gap:8px; box-shadow:0 10px 24px hsl(var(--h) 60% 40% / .3); }
  @media (min-width:768px){ .home{ max-width:720px; } }

  /* ---------- the quiz: a full-screen stage ---------- */
  .stage{ display:none; position:fixed; inset:0; z-index:50; color:#fff; }
  .stage.on{ display:block; }
  .bg{ position:absolute; inset:0; transition:opacity .6s ease; }
  .bg.d{ background:radial-gradient(120% 90% at 20% 10%, hsl(var(--h) 64% 36%), transparent 60%),
      radial-gradient(120% 90% at 85% 95%, hsl(calc(var(--h) + 60) 60% 28%), transparent 62%), #0b0b10; }
  .bg.l{ opacity:0; background:radial-gradient(120% 90% at 20% 0%, hsl(var(--h) 85% 88%), transparent 60%),
      radial-gradient(120% 90% at 85% 100%, hsl(calc(var(--h) + 60) 80% 88%), transparent 62%), #f4f4f8; }
  .lite{ color:#15151a; } .lite .bg.l{ opacity:1; } .lite .bg.d{ opacity:0; }
  .col{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; overflow-y:auto; -webkit-overflow-scrolling:touch;
    padding:calc(10px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left)); }
  .top{ width:100%; max-width:560px; height:44px; display:flex; align-items:center; justify-content:space-between; gap:8px; flex-shrink:0; }
  .glass{ border:1px solid rgba(255,255,255,.16); background:rgba(255,255,255,.12); color:inherit;
    -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px); }
  .lite .glass{ border-color:rgba(0,0,0,.09); background:rgba(255,255,255,.62); }
  .rnd{ width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0; }
  .pill{ min-width:44px; height:44px; border-radius:99px; padding:0 15px; display:flex; align-items:center; justify-content:center; gap:5px;
    font-size:17px; font-weight:800; font-variant-numeric:tabular-nums; }
  .pill.hide{ visibility:hidden; }
  .dots{ display:flex; gap:7px; align-items:center; }
  .dots i{ width:9px; height:9px; border-radius:50%; background:currentColor; opacity:.22; transition:all .3s; }
  .dots i.now{ opacity:1; transform:scale(1.35); } .dots i.ok{ opacity:1; background:#34c759; } .dots i.no{ opacity:1; background:#ff6259; }
  .body{ flex:1; width:100%; max-width:560px; display:flex; flex-direction:column; justify-content:center; gap:12px; padding:12px 0 4px; min-height:0; }
  .kick{ font-size:11px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; opacity:.62; }
  .qcard{ border-radius:24px; padding:20px 18px; }
  .qcard h2{ font-size:20px; font-weight:750; line-height:1.32; margin-top:8px; letter-spacing:-.005em; }
  .opts{ display:flex; flex-direction:column; gap:9px; }
  .opt{ width:100%; min-height:56px; border-radius:18px; padding:10px 14px; display:flex; align-items:center; gap:12px; text-align:left; font-size:16px; font-weight:650; line-height:1.3;
    transition:background .25s, border-color .25s, opacity .25s; }
  .opt .k{ width:30px; height:30px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:800;
    background:rgba(255,255,255,.14); } .lite .opt .k{ background:rgba(20,20,40,.08); }
  .opt .t{ flex:1; min-width:0; overflow-wrap:anywhere; }
  .opt:disabled{ opacity:.5; } .opt:disabled:active{ transform:none; }
  .opt.correct, .lite .opt.correct{ background:#2fb350; border-color:#2fb350; color:#fff; opacity:1; }
  .opt.wrong, .lite .opt.wrong{ background:#e5453b; border-color:#e5453b; color:#fff; opacity:1; }
  .opt.correct .k, .opt.wrong .k{ background:rgba(255,255,255,.25); }
  .fact{ display:none; border-radius:18px; padding:12px 14px; font-size:14px; line-height:1.45; gap:10px; align-items:flex-start; }
  .fact.on{ display:flex; animation:rise .4s ease both; } .fact svg{ font-size:15px; margin-top:2px; opacity:.8; }
  @keyframes rise{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:none; } }
  .pri{ width:100%; height:54px; border:none; border-radius:99px; font-size:16.5px; font-weight:750; background:#fff; color:#0b0b10;
    box-shadow:0 10px 30px rgba(0,0,0,.3); display:flex; align-items:center; justify-content:center; gap:8px; flex-shrink:0; }
  .lite .pri{ background:#15151a; color:#fff; box-shadow:0 10px 26px rgba(20,20,40,.22); }
  .sec2{ width:100%; height:50px; border-radius:99px; font-size:15.5px; font-weight:750; display:flex; align-items:center; justify-content:center; gap:8px; flex-shrink:0; }
  #next{ visibility:hidden; } #next.on{ visibility:visible; }

  /* writing the quiz / couldn't / finished: one centred glass card */
  .center{ border-radius:26px; padding:26px 20px 20px; text-align:center; width:100%; max-width:340px; margin:0 auto; }
  .center h2{ font-size:24px; font-weight:800; letter-spacing:-.015em; margin-top:6px; }
  .center p{ font-size:14px; line-height:1.45; opacity:.74; margin-top:8px; }
  .center .big{ font-size:68px; font-weight:800; line-height:1.05; letter-spacing:-.03em; font-variant-numeric:tabular-nums; margin-top:6px; }
  .center .big small{ font-size:.45em; opacity:.55; font-weight:750; }
  .center .best{ display:inline-block; margin-top:10px; font-size:11.5px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; opacity:.7; }
  .center .best.new{ opacity:1; color:#0b0b10; background:#ffd60a; border-radius:99px; padding:5px 11px; }
  .center .pri{ margin-top:20px; } .center .sec2{ margin-top:10px; }
  .orb{ width:64px; height:64px; border-radius:50%; margin:0 auto 14px; display:flex; align-items:center; justify-content:center; font-size:26px;
    background:radial-gradient(circle at 35% 30%, hsl(var(--h) 95% 82%), hsl(var(--h) 75% 58%) 55%, hsl(calc(var(--h) + 40) 70% 40%)); color:#fff;
    box-shadow:0 0 50px hsl(var(--h) 90% 62% / .5); animation:breathe 2.4s ease-in-out infinite; }
  .orb.still{ animation:none; background:rgba(255,255,255,.14); box-shadow:none; color:inherit; } .lite .orb.still{ background:rgba(20,20,40,.08); }
  @keyframes breathe{ 50%{ transform:scale(1.12); } }
  .skel{ display:flex; flex-direction:column; gap:8px; margin-top:18px; }
  .skel i{ height:12px; border-radius:6px; background:currentColor; opacity:.12; animation:pulse 1.4s ease-in-out infinite; }
  .skel i:nth-child(2){ width:82%; animation-delay:.15s; } .skel i:nth-child(3){ width:64%; animation-delay:.3s; }
  @keyframes pulse{ 50%{ opacity:.26; } }

  @media (max-height:520px){                       /* phone on its side: question left, answers right */
    .body.q{ display:grid; grid-template-columns:1fr 1fr; grid-template-rows:auto auto 1fr; gap:10px 14px; max-width:none; align-content:center; }
    .body.q .qcard{ grid-row:1 / span 2; align-self:start; } .body.q .opts{ grid-column:2; grid-row:1 / span 3; gap:7px; }
    .body.q .fact{ grid-column:1; align-self:start; } .body.q #next{ grid-column:1; height:46px; align-self:end; }
    .opt{ min-height:46px; font-size:15px; } .qcard h2{ font-size:17.5px; } .top{ max-width:none; }
    .center{ padding:16px 18px; } .center .big{ font-size:44px; } .orb{ width:44px; height:44px; font-size:18px; margin-bottom:8px; } .skel{ display:none; }
    .center .pri{ margin-top:12px; height:46px; } .center .sec2{ height:44px; margin-top:8px; }
  }
  @media (max-width:340px){ .qcard h2{ font-size:18px; } .opt{ font-size:15px; min-height:52px; } .hero h1{ font-size:21px; } }
  @media (prefers-reduced-motion:reduce){ .orb, .skel i, .fact.on{ animation:none; } }
</style></head><body>

<div class="home" id="home"></div>

<div class="stage" id="stage">
  <div class="bg d"></div><div class="bg l"></div>
  <div class="col">
    <div class="top">
      <button class="glass rnd" id="bClose" aria-label="End quiz"><svg class="i"><use href="#i-close"/></svg></button>
      <div class="dots" id="dots"></div>
      <div class="glass pill hide" id="pill" aria-label="Score"><svg class="i" style="font-size:13px;opacity:.75"><use href="#i-check"/></svg><span id="sc">0</span></div>

<script>
/* Bridges are looked up when used, never kept: MyLLM can add them after this
   script has run. */
function haptic(s){ if (window.myllmHaptic) try { myllmHaptic(s); } catch(e){} }
function load(k){ var s = window.myllmStorage; return s ? s.getItem(k).catch(function(){ return null; }) : Promise.resolve(null); }
function keep(k, v){ var s = window.myllmStorage; if (s) try { s.setItem(k, v).catch(function(){}); } catch(e){} }
var qs = [], idx = 0, score = 0, marks = [], run = 0;
var topic = '', diff = 'Medium', phase = 'home';       /* home · loading · quiz · done · error */
var IDEAS = ['90s movies','Space','Football','World capitals','Food','Dinosaurs','Music'];

function el(id){return document.getElementById(id)}
function icon(id){ return '<svg class="i"><use href="#i-'+id+'"/></svg>'; }

/* ---------- look ---------- */
function isLight(){ return !(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches); }
/* The quiz takes the whole display and goes dark. Where MyLLM can't hide its
   own title bar, a dark stage under a white bar looks cut in half — so in
   light mode, without myllmImmersive, the stage stays light. */
function syncLook(){
  var on = phase !== 'home';
  el('stage').classList.toggle('on', on);
  el('stage').classList.toggle('lite', isLight() && !window.myllmImmersive);
  document.body.classList.toggle('lock', on);
  el('pill').classList.toggle('hide', phase !== 'quiz');
  el('dots').style.visibility = phase === 'quiz' ? '' : 'hidden';
}
function syncChrome(){
  if (!window.myllmImmersive) return;
  /* a phone model can take a minute to write the quiz: don't let the screen sleep on it */
  try { myllmImmersive(phase !== 'home', {keepAwake: phase === 'loading'}).catch(function(){}); } catch(e){}
}
function go(p){ var was = phase; phase = p; syncLook(); if (!(was === 'home' && p === 'home')) syncChrome(); }

/* ---------- setup ---------- */
function setup(){
  go('home');
  el('home').innerHTML =
    '<div class="head"><div class="tile">'+icon('brain')+'</div><div class="ht"><h1>Trivia Night</h1><p>A fresh AI quiz on any topic</p></div></div>'+
    '<div class="hero"><div><p style="margin-top:0">Pick any topic — your AI writes a fresh quiz every time.</p></div>'+
    '<div class="stat" id="bestBox" style="visibility:hidden"><b id="best"></b><span>Best</span></div></div>'+
    '<h2 class="sec">Topic</h2><div class="card"><input id="topic" placeholder="90s movies, space, football…" autocomplete="off" enterkeyhint="go">'+
    '<div class="chips" id="ideas"></div></div>'+
    '<h2 class="sec">Difficulty</h2><div class="seg" id="diff"></div>'+
    '<button class="go" id="goBtn">'+icon('spark')+'Start quiz</button>';
  el('topic').value = topic;
  el('topic').onkeydown = function(e){ if(e.key==='Enter') start(); };
  IDEAS.forEach(function(t){ var b=document.createElement('button'); b.textContent=t; b.onclick=function(){ el('topic').value=t; haptic('selection'); }; el('ideas').appendChild(b); });
  ['Easy','Medium','Hard'].forEach(function(d){ var b=document.createElement('button'); b.textContent=d; b.className=d===diff?'on':'';
    b.onclick=function(){ diff=d; haptic('selection'); el('diff').querySelectorAll('button').forEach(function(x){ x.className=x.textContent===diff?'on':''; }); }; el('diff').appendChild(b); });
  el('goBtn').onclick = start;
  load('bestScore').then(function(v){ if(v && el('best')){ el('best').textContent=v+'/5'; el('bestBox').style.visibility=''; } });
}

function card(h){ el('app').className='body'; el('app').innerHTML='<div class="glass center">'+h+'</div>'; }
function fail(msg, needsAI){
  go('error');
  card('<div class="orb still">'+icon(needsAI?'spark':'close')+'</div><div class="kick">'+(needsAI?'AI is switched off':'No quiz this time')+'</div><p id="why"></p>'+
    '<button class="pri" id="again">'+icon('again')+'Try again</button>');
  if(needsAI) el('why').innerHTML='This app needs the latest MyLLM with <b>Settings → Allow apps to use the AI</b> turned on.';
  else el('why').textContent=msg;
  el('again').onclick=setup;
}

function start(){
  topic = el('topic').value.trim();
  if(!topic){ el('topic').focus(); return; }
  var ASK = window.myllmAsk || null;
  if(!ASK){ fail('', true); return; }
  haptic('light');
  var mine = ++run;
  go('loading');
  card('<div class="orb">'+icon('spark')+'</div><div class="kick">Building quiz…</div><h2 id="lt"></h2>'+
    '<p>Five '+diff.toLowerCase()+' questions, written just for you. On a phone model this can take a minute.</p><div class="skel"><i></i><i></i><i></i></div>');
  el('lt').textContent = topic;
  var prompt = 'Create a fun '+diff+'-difficulty trivia quiz of 5 questions about "'+topic+'". '+
    'Reply with EXACTLY these labelled lines and nothing else, repeating the block of 4 lines for each of the 5 questions:\n'+
    'Q: the question text\n'+
    'OPTION: one answer choice — repeat this line for each of the 4 choices\n'+
    'ANSWER: the correct choice, written out again\n'+
    'FACT: one short interesting fact about the answer';
  var sys = {system:'You write fun, accurate trivia quizzes. Follow the requested labelled-line format exactly.'};
  ASK(prompt, sys)
    .then(function(reply){ return parse(reply||''); })
    .catch(function(){ return ASK(prompt+'\nIMPORTANT: fill each labelled line with real content — never repeat the instruction text.', sys)
      .then(function(reply){ return parse(reply||''); }); })
    .then(function(data){ if(mine!==run) return; qs = data; idx = 0; score = 0; marks = []; go('quiz'); showQ(); })
    .catch(function(e){ if(mine!==run) return; fail(e&&e.message?e.message:'Something went wrong'); });
}

/* Labelled lines, not JSON — small models (Apple Intelligence) echo JSON
   templates back verbatim. Echoed instructions are rejected and retried. */
var ECHO=/the question text|one answer choice|repeat this line|each of the 4 choices|the correct choice|one short interesting fact|labelled line/i;
function parse(text){
  var blocks=[], cur=null, got=false;
  String(text||'').split(/\r?\n/).forEach(function(raw){
    var ln=raw.replace(/\*\*/g,'').trim();
    var m=ln.match(/^[-*#>\s]*(QUESTIONS?|Q|OPTIONS?|ANSWERS?|FACTS?)\s*\d*\s*[::]\s*(.*)$/i);
    if(!m)return;
    got=true;
    var k=m[1].toUpperCase().replace(/S$/,''), v=m[2].trim();
    if(k==='Q'||k==='QUESTION'){ cur={q:v,options:[],ans:'',fact:''}; blocks.push(cur); }
    else if(!cur)return;
    else if(k==='OPTION'&&v)cur.options.push(v.replace(/^[A-Da-d][).]\s*/,''));
    else if(k==='ANSWER')cur.ans=v;
    else if(k==='FACT')cur.fact=v;
  });
  if(!got){ // model answered in the old JSON shape — accept it
    try{ var s=text.indexOf('['), e=text.lastIndexOf(']'); if(s>=0&&e>s){ var arr=JSON.parse(text.slice(s,e+1)); if(Array.isArray(arr)){ var old=arr.filter(valid).slice(0,5); if(old.length) return old; } } }catch(err){}
    throw new Error('Could not build a quiz — try another topic.');
  }
  var out=[];
  blocks.forEach(function(c){
    if(!c.q||ECHO.test(c.q))return;
    var opts=c.options.filter(function(x){return x&&!ECHO.test(x)});
    if(opts.length<2)return;
    var a=answerIndex(c.ans,opts);
    if(a<0)return;
    out.push({q:c.q,options:opts,answer:a,fact:(c.fact&&!ECHO.test(c.fact))?c.fact:''});
  });
  if(!out.length){ throw new Error('Could not build a quiz — try another topic.'); }
  return out.slice(0,5);
}
function answerIndex(v,opts){
  v=String(v||'').trim();
  if(!v||ECHO.test(v))return -1;
  var m=v.match(/^\(?([1-9])\)?[.)]?$/);
  if(m){ var n=parseInt(m[1],10)-1; return n<opts.length?n:-1; }
  m=v.match(/^\(?([A-Da-d])\)?[.)]?$/);
  if(m){ var n2=m[1].toUpperCase().charCodeAt(0)-65; return n2<opts.length?n2:-1; }
  var t=norm(v.replace(/^[A-Da-d][).]\s*/,''));
  if(!t)return -1;
  for(var i=0;i<opts.length;i++)if(norm(opts[i])===t)return i;
  for(i=0;i<opts.length;i++){ var o=norm(opts[i]); if(o&&(t.indexOf(o)>=0||o.indexOf(t)>=0))return i; }
  return -1;
}
function norm(s){ return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,''); }
function valid(q){ return q && q.q && Array.isArray(q.options) && q.options.length>=2 && typeof q.answer==='number'; }

function dots(){
  var d = el('dots'); d.innerHTML='';
  qs.forEach(function(_, i){ var s=document.createElement('i'); s.className = marks[i]===true?'ok':marks[i]===false?'no':(i===idx?'now':''); d.appendChild(s); });
  el('sc').textContent = score;
}
function showQ(){
  var q = qs[idx];
  el('app').className='body q';
  el('app').innerHTML = '<div class="glass qcard"><div class="kick">Question '+(idx+1)+' of '+qs.length+'</div><h2></h2></div>'+
    '<div class="opts" id="opts"></div><div class="glass fact" id="fact">'+icon('bulb')+'<span id="factT"></span></div>'+
    '<button class="pri" id="next"></button>';
  el('app').querySelector('h2').textContent = q.q;
  var opts = el('opts');
  q.options.forEach(function(opt, i){
    var b = document.createElement('button'); b.className='glass opt';
    b.innerHTML='<span class="k">'+'ABCDEFGH'.charAt(i)+'</span><span class="t"></span>';
    b.querySelector('.t').textContent = opt;
    b.onclick = function(){ answer(i, b); };
    opts.appendChild(b);
  });
  dots();
}

function answer(i, btn){
  var q = qs[idx];
  var buttons = el('opts').querySelectorAll('.opt');
  buttons.forEach(function(b,j){ b.disabled=true; if(j===q.answer){ b.classList.add('correct'); b.querySelector('.k').innerHTML=icon('check'); } });
  if(i===q.answer){ score++; marks[idx]=true; haptic('success'); }
  else { marks[idx]=false; btn.classList.add('wrong'); btn.querySelector('.k').innerHTML=icon('close'); haptic('error'); }
  if(q.fact){ el('factT').textContent = q.fact; el('fact').classList.add('on'); }
  dots();
  var next = el('next');
  next.textContent = (idx === qs.length-1) ? 'See results' : 'Next question';
  next.classList.add('on');
  next.onclick = function(){ idx++; if(idx<qs.length) showQ(); else finish(); };
}

function finish(){
  haptic(score>=4?'success':'light');
  load('bestScore').then(function(v){
    var prev = parseInt(v||'0',10), best = Math.max(prev, score);
    keep('bestScore', String(best));
    var msg = score===5?'Perfect!':score>=3?'Nicely done!':'Good try!';
    go('done');
    card('<div class="kick">'+msg+'</div><div class="big">'+score+'<small>/'+qs.length+'</small></div>'+
      (score>prev&&score>0?'<div class="best new">New best</div>':'<div class="best">Best '+best+'/5</div>')+
      '<button class="pri" id="again">'+icon('again')+'Play again</button>'+
      (window.myllmShare?'<button class="glass sec2" id="sh">'+icon('share')+'Share my score</button>':''));
    el('again').onclick=setup;
    var sh = el('sh'); if(sh) sh.onclick=function(){ window.myllmShare('I scored '+score+'/5 on Trivia Night! 🧠'); };
  });
}

el('bClose').onclick = function(){ haptic('light'); run++; setup(); };
document.addEventListener('visibilitychange', function(){ if(!document.hidden && phase!=='home') syncChrome(); });   /* MyLLM puts its bars back when the app is left */
if (window.matchMedia){
  var mq = matchMedia('(prefers-color-scheme: dark)');
  if (mq.addEventListener) mq.addEventListener('change', syncLook); else if (mq.addListener) mq.addListener(syncLook);
}
setup();
</script></body></html>
