--><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>:root{--build-id:"c14294ef8c";color-scheme:light dark;--accent:#ff453a}
*{box-sizing:border-box}
body{font-family:-apple-system,system-ui,sans-serif;margin:0;padding:0;background:#f2f2f7;color:#111}
@media(prefers-color-scheme:dark){body{background:#000;color:#eee}.head{background:rgba(20,20,22,.92)}.item{background:#1c1c1e}.tab{color:#888}input{background:#1c1c1e;color:#eee;border-color:#3a3a3c}}
.head{position:sticky;top:0;background:rgba(242,242,247,.92);backdrop-filter:saturate(180%) blur(12px);padding:14px 16px 0;z-index:5}
h1{font-size:20px;margin:0 0 8px}
.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:10px;margin:0 -16px;padding-left:16px;padding-right:16px}
.tab{flex:none;padding:7px 14px;border-radius:18px;background:none;color:#777;font-size:14px;font-weight:600;border:0;cursor:pointer;white-space:nowrap}
.tab.on{background:var(--accent);color:#fff}
.wrap{padding:6px 16px 24px}
.item{background:#fff;border-radius:13px;padding:13px 15px;margin-bottom:9px;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.title{font-size:16px;font-weight:600;line-height:1.3}
.meta{font-size:12px;opacity:.55;margin-top:4px}
.desc{font-size:14px;opacity:.85;margin-top:8px;line-height:1.45;display:none}
.item.open .desc{display:block}
.go{display:inline-block;margin-top:9px;font-size:13px;font-weight:600;color:var(--accent);text-decoration:none}
#status{padding:14px 16px;font-size:14px;opacity:.7;text-align:center}
.manage{padding:0 16px 24px}
.manage h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;opacity:.55}
.row{display:flex;gap:8px}
input{flex:1;padding:10px;border:1px solid #d1d1d6;border-radius:9px;font-size:15px;background:#fff}
.row button{border:0;background:var(--accent);color:#fff;border-radius:9px;padding:0 16px;font-weight:600}
.feedrow{display:flex;align-items:center;gap:8px;padding:8px 0;font-size:14px;border-top:1px solid rgba(128,128,128,.2)}
.feedrow .u{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.75}
.feedrow .x{color:#ff453a;cursor:pointer;font-size:16px}
@media(min-width:768px){body{max-width:760px;margin-left:auto;margin-right:auto}}
</style></head><body>
<div class="head">
  <h1>📰 News</h1>
  <div class="tabs" id="tabs"></div>
</div>
<div id="status"></div>
<div class="wrap" id="wrap"></div>
<script>
var TOPICS=[
  {name:"Top",url:"https://feeds.bbci.co.uk/news/rss.xml"},
  {name:"World",url:"https://feeds.bbci.co.uk/news/world/rss.xml"},
  {name:"UK",url:"https://feeds.bbci.co.uk/news/uk/rss.xml"},
  {name:"Tech",url:"https://feeds.bbci.co.uk/news/technology/rss.xml"},
  {name:"Business",url:"https://feeds.bbci.co.uk/news/business/rss.xml"},
  {name:"Science",url:"https://feeds.bbci.co.uk/news/science_and_environment/rss.xml"},
  {name:"Sport",url:"https://feeds.bbci.co.uk/sport/rss.xml"}
];
var store=window.myllmStorage||{getItem:function(){return Promise.resolve(null)},setItem:function(){return Promise.resolve()}};
var custom=[],active=0,cache={};
function el(i){return document.getElementById(i)}
function setStatus(t){var s=el('status');s.style.display=t?'block':'none';s.textContent=t||''}
function tabs(){return TOPICS.concat(custom).concat([{name:"＋ Feeds",manage:true}])}

function renderTabs(){
  var T=el('tabs');T.innerHTML='';
  tabs().forEach(function(t,i){
    var b=document.createElement('button');b.className='tab'+(i===active?' on':'');b.textContent=t.name;
    b.onclick=function(){active=i;route()};T.appendChild(b);
  });
}
function route(){
  renderTabs();
  var t=tabs()[active];
  if(t.manage)return renderManage();
  load(t.url);
}

function load(url){
  el('wrap').innerHTML='';
  if(cache[url]){renderItems(cache[url]);return}
  if(!window.myllmFetch){setStatus('This app needs network access — update MyLLM and enable app network access in Settings.');return}
  setStatus('Loading…');
  myllmFetch(url,{headers:{Accept:'application/rss+xml,application/xml,text/xml'}})
  .then(function(r){
    if(!r||!r.ok)throw new Error('feed returned '+((r&&r.status)||'no response'));
    var items=parseFeed(r.body);
    if(!items.length)throw new Error('no stories found in this feed');
    cache[url]=items;setStatus('');renderItems(items);
  }).catch(function(err){setStatus('Couldn’t load this feed: '+err.message)});
}

function parseFeed(xml){
  var doc=new DOMParser().parseFromString(xml,'text/xml');
  var nodes=doc.querySelectorAll('item');
  var atom=false;
  if(!nodes.length){nodes=doc.querySelectorAll('entry');atom=true}
  var out=[];
  Array.prototype.forEach.call(nodes,function(n){
    var get=function(tag){var e=n.querySelector(tag);return e?e.textContent.trim():''};
    var link=get('link');
    if(atom){var l=n.querySelector('link');if(l&&l.getAttribute('href'))link=l.getAttribute('href')}
    var desc=get('description')||get('summary')||get('content');
    out.push({title:get('title'),link:link,date:get('pubDate')||get('updated')||get('published'),desc:strip(desc)});
  });
  return out.filter(function(i){return i.title});
}
function strip(html){var d=document.createElement('div');d.innerHTML=html;var t=(d.textContent||'').trim();return t.length>320?t.slice(0,320)+'…':t}
function ago(d){
  if(!d)return'';var t=new Date(d);if(isNaN(t))return'';
  var s=Math.round((new Date()-t)/1000);
  if(s<3600)return Math.max(1,Math.round(s/60))+'m ago';
  if(s<86400)return Math.round(s/3600)+'h ago';
  return Math.round(s/86400)+'d ago';
}

function renderItems(items){
  var W=el('wrap');W.innerHTML='';
  items.forEach(function(it){
    var c=document.createElement('div');c.className='item';
    var h=document.createElement('div');h.className='title';h.textContent=it.title;
    var m=document.createElement('div');m.className='meta';m.textContent=ago(it.date);
    var d=document.createElement('div');d.className='desc';d.textContent=it.desc||'';
    c.appendChild(h);c.appendChild(m);if(it.desc)c.appendChild(d);
    if(it.link){var a=document.createElement('a');a.className='go';a.textContent='Read full story ↗';a.href=it.link;a.target='_top';a.rel='noopener';c.appendChild(a)}
    h.onclick=function(){c.classList.toggle('open');if(window.myllmHaptic)myllmHaptic('selection')};
    W.appendChild(c);
  });
}

function renderManage(){
  setStatus('');
  var W=el('wrap');
  W.innerHTML='<div class="manage"><h2>Add a feed</h2>'+
    '<div class="row"><input id="fname" placeholder="Name"><input id="furl" placeholder="https://…/rss"></div>'+
    '<div class="row" style="margin-top:8px"><button onclick="addFeed()" style="flex:1;padding:11px;border-radius:9px">Add RSS feed</button></div>'+
    '<h2 style="margin-top:20px">Your feeds</h2><div id="feeds"></div>'+
    '<p style="font-size:12px;opacity:.5">Paste any site’s RSS/Atom feed URL. Many sites have one at /rss or /feed.</p></div>';
  var F=el('feeds');
  if(!custom.length)F.innerHTML='<p style="opacity:.5;font-size:14px">None yet.</p>';
  custom.forEach(function(c,i){
    var r=document.createElement('div');r.className='feedrow';
    r.innerHTML='<b>'+escapeHtml(c.name)+'</b><span class="u">'+escapeHtml(c.url)+'</span><span class="x">✕</span>';
    r.querySelector('.x').onclick=function(){custom.splice(i,1);saveCustom();renderManage();renderTabs()};
    F.appendChild(r);
  });
}
function addFeed(){
  var n=el('fname').value.trim(),u=el('furl').value.trim();
  if(!n||!/^https?:\/\//.test(u)){setStatus('Enter a name and a full feed URL (https://…).');return}
  setStatus('');custom.push({name:n,url:u});saveCustom();renderManage();renderTabs();
}
function saveCustom(){store.setItem('feeds',JSON.stringify(custom))}
function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

store.getItem('feeds').then(function(v){
  if(v)try{custom=JSON.parse(v)||[]}catch(e){}
  route();
});
</script></body></html>
