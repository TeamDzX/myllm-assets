<style>

<body>

<header>
  <b>Shell</b>
  <span class="hint">the shared workspace, on the command line</span>
</header>

<div id="out"></div>

<div class="chips" id="chips"></div>

<div class="composer">
  <hr>
  <form id="form" autocomplete="off">
    <span class="ps1">&#10095;</span>
    <input id="in" placeholder="a command, or a question" autocapitalize="off" autocorrect="off" spellcheck="false">
  </form>
  <div class="statusbar">
    <span class="left" id="statusLeft">~</span>
    <span class="right" id="statusRight"></span>
  </div>
</div>

<script>
/* Shell over the MyLLMos shared workspace.
   The command grammar deliberately MATCHES the assistant's `workspace_shell`
   tool, so what you learn here is what you can ask MyLLM for in words — and what
   it prints back to you looks like what it prints back to itself.

   Difference: you are a person at a prompt, so this one can also WRITE. The
   store itself has no trash and no undo, so this app supplies both: rm moves
   into a hidden .trash folder, and undo reverses the last change. */
/* Looked up on each use, never kept: MyLLM can add its bridges after this script has run. */
Object.defineProperty(window, "files", { configurable:true, get:function(){ return window.myllmFiles || null; } });
var out = document.getElementById('out');
var input = document.getElementById('in');
/* NOT `history` — that is window.history (the History API), so `var history`
   silently keeps the built-in and cmdHistory.push is undefined. The runtime
   harness caught this; a regex scan never would. */
var cmdHistory = [];
var hIndex = -1;
var pending = null;      /* a confirmation waiting on y/n */
var cwd = '';            /* current directory, '' = workspace root */
var TRASH = '.trash';    /* where rm puts things; hidden from ls unless -a or you cd into it */
var undoStack = [];      /* this session's reversible changes, newest last */
var lastSnap = null;     /* most recent listing, for completion chips */
var stdin = null;        /* text piped into the next stage of a pipeline */
var aliases = {};        /* name -> expansion, kept in myllmStorage */
Object.defineProperty(window, "store", { configurable:true, get:function(){ return window.myllmStorage || null; } });
var HISTORY_KEY = 'shell.history', ALIAS_KEY = 'shell.aliases';
/* v9: the change log, the undo stack and path bookmarks survive closing the
   app. Before, undo forgot everything the moment Shell was closed. */
var LOG_KEY = 'shell.log', UNDO_KEY = 'shell.undo', MARK_KEY = 'shell.marks';
var changeLog = [];      /* [{id, t, text}] newest last, the last 200 */
var marks = {};          /* bookmark name -> path, used as @name */
var prevCwd = null;      /* for  cd -  */
var batchId = null;      /* set while an approved batch runs, so undo reverses all of it */
var RC = '.shellrc';     /* optional startup script, in the workspace root */
var ASK_MAX = 8000;      /* how much material one `ask` may carry; a small on-device model has a small window */
var VERBS = ['ls','tree','cat','head','tail','sed','stat','find','grep','diff','jq','wc','sort','uniq','cut','tr','paste','comm','awk','xargs','man','changes','history','du','ask','dictate','open','share','mkdir','mv','cp','write','replace','edit','rm','rmdir','undo','log','revert','trash','restore','alias','unalias','mark','cd','pwd','clear','help'];
var KNOWN = VERBS.concat(['dir']);   /* everything the switch below answers to */
function inTrash(path){ return path === TRASH || path.indexOf(TRASH + '/') === 0; }

/* The APP may be stateful — you are standing somewhere. The assistant's
   workspace_shell tool deliberately is NOT: state that persists between tool
   calls is a trap for a model that cannot see the prompt. Same grammar, one
   extra verb here. */
function resolve(p){
  var s = String(p||'').trim();
  /* @name and @name/sub/path: a saved place, so a long path is typed once. */
  if (s.charAt(0) === '@'){
    var mSlash = s.indexOf('/'), mName = (mSlash < 0 ? s.slice(1) : s.slice(1, mSlash)).toLowerCase();
    if (Object.prototype.hasOwnProperty.call(marks, mName)) s = '/' + marks[mName] + (mSlash < 0 ? '' : s.slice(mSlash));
  }
  if (!s || s === '.') return cwd;
  if (s.charAt(0) === '/') return normalise(s);
  if (s === '..') return cwd.indexOf('/') < 0 ? '' : cwd.slice(0, cwd.lastIndexOf('/'));
  var joined = cwd ? cwd + '/' + s : s;
  /* collapse any a/b/../c the model or user typed */
  var parts = [];
  normalise(joined).split('/').forEach(function(seg){
    if (seg === '..') parts.pop(); else if (seg && seg !== '.') parts.push(seg);
  });
  return parts.join('/');
}
function prompt$(){ return cwd ? '~/' + cwd : '~'; }

/* Left: where you are. Right: what the workspace costs. Both refresh after any
   command, so the bar is a live readout rather than decoration. */
async function paintPrompt(){
  var l = document.getElementById('statusLeft');
  if (l) l.textContent = prompt$() + (undoStack.length ? '  \u00b7  undo \u00d7' + undoStack.length : '');
  var r = document.getElementById('statusRight');
  if (r && files){
    try{
      var list = (await files.list()).filter(function(f){ return !inTrash(f.path); });
      var total = list.reduce(function(a,b){ return a + b.size; }, 0);
      r.textContent = list.length + (list.length === 1 ? ' file' : ' files') + '  \u00b7  ' + bytes(total);
    }catch(e){ r.textContent = ''; }
  }
}

/* Two lines an entry, not one padded to a column. The old shape assumed a
   terminal ~78 characters wide; this one is ~44 on a phone, so every line wrapped
   and the list read as rubble. A command and its description, each on its own
   line, never wraps raggedly however long the description gets. */
var HELP = [
  ['ls [-R] [path]', 'list a folder (-R for the whole tree)'],
  ['tree [path]', 'same as ls -R'],
  ['cat <path>', 'print a file'],
  ['head [-n N] <path>', 'the first N lines (default 20)'],
  ['tail [-n N] <path>', 'the last N lines'],
  ['stat <path>', 'size, modified, type'],
  ['ls -t / ls -S', 'newest first / biggest first'],
  ['sed -n 40,80p <path>', 'just lines 40 to 80'],
  ['find <glob>', 'match filenames, e.g. find *.json'],
  ['find -mtime -7', 'changed in the last 7 days'],
  ['find -newer <path>', 'changed since that file'],
  ['find -size +10k', 'bigger than 10 KB (-type d: folders)'],
  ['grep <text> [path]', 'search inside files (-l for names)'],
  ['grep -n -C 2 -v -c', 'numbers, context, non-matches, counts'],
  ['grep -o -m 5 -w', 'match only, first 5, whole words'],
  ['--include=*.md', 'grep only those (--exclude-dir=x)'],
  ['grep /re?gex/', 'a pattern (or -E); -s matches case'],
  ['diff <a> <b>', 'what changed between two files'],
  ['diff <path>@2', 'version 2 against now'],
  ['jq .a.b <path>', 'pull a value out of JSON'],
  ['jq ".list[] | .name"', 'each name in a list (also keys)'],
  ['wc [-l] <path>', 'count lines, words, characters'],
  ['sort [-r -n -k N]', 'sort lines (reverse, numbers, field)'],
  ['uniq [-c]', 'fold repeats, with counts'],
  ['cut -d , -f 2', 'pick fields (or -c 1-20)'],
  ['awk \'{print $2}\'', 'columns (-F , for commas)'],
  ['tr a-z A-Z', 'change characters (-d deletes)'],
  ['paste a b / comm a b', 'side by side / what they share'],
  ['… | xargs head -n 3', 'run a command on piped paths'],
  ['du', 'space used per folder'],
  '',
  ['ask "<question>"', 'ask MyLLM; pipe a file in to work on it'],
  ['dictate', 'speak instead of typing'],
  ['open <path>', 'open the file in another app'],
  ['share <path>', 'send the file out through iOS'],
  '',
  ['a | b', 'send a\'s output into b'],
  ['', 'cat, head, tail, grep, ask all read one'],
  ['> <path>', 'put the output in a file'],
  ['>> <path>', 'add it to the end of one instead'],
  '',
  ['mkdir <path>', 'create a folder'],
  ['mv <from> <to>', 'move or rename (-f replaces)'],
  ['write <path> <text>', 'replace a file with that text'],
  ['replace <p> "old" "new"', 'swap text in a file (-1: first only)'],
  ['edit <p> 3-5 "text"', 'change lines 3 to 5 (5+ inserts)'],
  ['cp <from> <to>', 'copy a file or folder (-f replaces)'],
  ['rm <path>', 'move a file to .trash'],
  ['rmdir <path>', 'move a folder to .trash'],
  ['rm -p / rmdir -p', 'delete for good; asks first'],
  ['undo', 'reverse your last change (or batch)'],
  ['log', 'recent changes, kept between visits'],
  ['trash', 'what is in .trash'],
  ['restore <path>', 'put something back from .trash'],
  ['trash empty', 'delete all of it for good; asks first'],
  ['history <path>', 'previous versions of a file'],
  ['revert <path> [N]', 'put version N back (1 = newest)'],
  '',
  ['history', 'the commands you have typed'],
  ['!!', 'run the last one again'],
  ['!5   !gr', 'number 5, or the last one starting gr'],
  ['alias ll "ls -R"', 'make a shortcut'],
  ['alias / unalias ll', 'list them / remove one'],
  ['.shellrc', 'its lines run when Shell opens'],
  ['cd <path>', 'change directory (cd .. goes up)'],
  ['cd -', 'back to the previous folder'],
  ['mark work', 'save this folder as @work'],
  ['cd @work   ls @work', 'use it anywhere in a path'],
  ['mark / mark -d work', 'list them / forget one'],
  ['ls -a', 'show .trash too'],
  ['clear', 'clear the screen'],
  ['help', 'this list'],
  ['man <command>', 'its exact flags'],
  ['changes', 'what is new in Shell'],
  '',
  'Anything else is a question for MyLLM. It',
  'can run the read-only commands above to',
  'answer, and asks before changing anything,',
  'showing the diff of any edit it proposes.',
  '',
  'Try:',
  'cat notes.md | ask "sum this up" > out.md'
];
function helpHTML(){
  return HELP.map(function(row){
    if (typeof row === 'string') return row ? '<span class="dim">' + esc(row) + '</span>' : '';
    return '<span class="cmd">' + esc(row[0]) + '</span>\n<span class="dim">   ' + esc(row[1]) + '</span>';
  }).join('\n');
}


function esc(s){ return String(s==null?'':s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* capture: when set, print() also COLLECTS text — for the agent loop, and for
   each stage of a pipeline. quiet: and does not put it on screen, which is what
   makes `cat big.md | ask "summarise"` show the summary and not the file. */
var capture = null;
var quiet = false;
var captureHadError = false;   /* did this capture print anything in red? */
var lastCaptureError = false;  /* ...read by the caller straight after captureOf */

function print(text, cls){
  if (capture !== null){
    capture.push(String(text));
    if (cls === 'err') captureHadError = true;
  }
  if (quiet) return;
  var d = document.createElement('div');
  if (cls) d.className = cls;
  d.innerHTML = esc(text);
  out.appendChild(d);
  out.scrollTop = out.scrollHeight;
}
function printHTML(html){
  /* Tags off AND entities back: a grep hit with an & in it used to reach the
     pipe (or the file) as &amp;. */
  if (capture !== null) capture.push(html.replace(/<[^>]+>/g, '')
    .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&amp;/g, '&'));
  if (quiet) return;
  var d = document.createElement('div');
  d.innerHTML = html;
  out.appendChild(d);
  out.scrollTop = out.scrollHeight;
}
/* On screen only: never captured, never piped, removable. For "asking\u2026",
   which belongs to the person watching and not to the file being written. */
function status(text){
  var d = document.createElement('div');
  d.className = 'dim'; d.textContent = text;
  out.appendChild(d); out.scrollTop = out.scrollHeight;
  return d;
}
function unstatus(d){ if (d && d.parentNode) d.parentNode.removeChild(d); }
function haptic(k){ try{ window.myllmHaptic && myllmHaptic(k); }catch(e){} }

/* ---------- helpers that mirror the tool ---------- */

function tokenize(s){
  var outv = [], cur = '', q = null;
  /* grep/edit/replace: a /regex/ word may hold spaces (/todo \w+/). Only a
     span with no other / in it, so two paths are never glued together. */
  var rxVerb = /^\s*(grep|edit|replace)\b/i.test(s);
  for (var i=0;i<s.length;i++){
    var c = s[i];
    if (q){
      if (c === '\\' && s[i+1] === q){ cur += q; i++; continue; }   /* \" inside "…" */
      if (c === q) q = null; else cur += c;
      continue;
    }
    if (rxVerb && c === '/' && !cur){
      var close = -1;
      for (var j = i + 1; j < s.length; j++){
        if (s[j] === '\\'){ j++; continue; }
        if (s[j] === '/'){ if (j + 1 === s.length || /[\s+]/.test(s[j+1])) close = j; break; }
      }
      if (close > i + 1 && /\s/.test(s.slice(i, close))){
        cur = s.slice(i, close + 1); i = close;
        if (s[i+1] === '+'){ cur += '+'; i++; }
        continue;
      }
    }
    if (c === '"' || c === "'"){ q = c; }
    else if (c === ' '){ if (cur){ outv.push(cur); cur = ''; } }
    else cur += c;
  }
  if (cur) outv.push(cur);
  return outv;
}

function normalise(p){
  var s = String(p||'').trim();
  while (s.indexOf('./') === 0) s = s.slice(2);
  while (s.charAt(0) === '/') s = s.slice(1);
  while (s.charAt(s.length-1) === '/') s = s.slice(0,-1);
  return s === '.' ? '' : s;
}

function bytes(n){ return n < 1024 ? n + 'B' : (n/1024).toFixed(1) + 'K'; }

/* ---------- the line, before it is a command ----------
   A pipeline is split here rather than in run(), so every command stays a
   command: it reads stdin if there is any, prints as it always did, and knows
   nothing about where its output is going. */

function restOf(line){
  var t = String(line || '').trim();
  var sp = t.search(/\s/);
  return sp < 0 ? '' : t.slice(sp + 1).trim();
}
function unquote(s){
  var t = String(s || '').trim(), a = t.charAt(0);
  if (t.length > 1 && (a === '"' || a === "'") && t.charAt(t.length - 1) === a) return t.slice(1, -1);
  return t;
}
/* Models fence their output even when told not to; a fence in a saved file is
   the kind of thing you only notice a week later. */
function stripFence(t){
  var s2 = String(t || '').trim();
  if (s2.indexOf('```') !== 0) return s2;
  s2 = s2.replace(/^```[a-z]*\s*\n?/i, '');
  var end = s2.lastIndexOf('```');
  return (end >= 0 ? s2.slice(0, end) : s2).trim();
}

/* `a | b > c` -> { stages:['a','b'], redirect:{path:'c', append:false} }
   Quotes are respected, so  grep "a > b"  is a search and not a redirect. */
function splitPipeline(line){
  var stages = [], cur = '', q = null, redirect = null;
  var text = String(line || '');
  for (var i = 0; i < text.length; i++){
    var c = text.charAt(i);
    if (q){ cur += c; if (c === q) q = null; continue; }
    if (c === '"' || c === "'"){ q = c; cur += c; continue; }
    /* v10: a /regex/ word is quoted too, so  grep /a(b|c)/  stays one stage.
       Only when it opens a word and closes before a space or the end: an
       absolute path like /notes.md never has a closing slash there. */
    if (c === '/' && (!cur.length || /\s$/.test(cur))){
      var close = -1;
      for (var j = i + 1; j < text.length; j++){
        if (text.charAt(j) === '\\'){ j++; continue; }
        if (text.charAt(j) === '/' && (j + 1 === text.length || /\s/.test(text.charAt(j + 1)))){ close = j; break; }
      }
      if (close > i + 1 && text.slice(i + 1, close).indexOf('|') >= 0){ cur += text.slice(i, close + 1); i = close; continue; }
    }
    if (c === '|'){ stages.push(cur); cur = ''; continue; }
    if (c === '>'){
      var append = text.charAt(i + 1) === '>';
      redirect = { path: unquote(text.slice(i + (append ? 2 : 1)).trim()), append: append };
      break;
    }
    cur += c;
  }
  stages.push(cur);
  stages = stages.map(function(x){ return x.trim(); }).filter(function(x){ return x.length; });
  return { stages: stages, redirect: redirect };
}

/* One pass only: an alias that expands to another alias is a loop waiting to
   happen, and nobody needs two levels on a phone. */
function expandAlias(stage){
  var first = (tokenize(stage)[0] || '').toLowerCase();
  if (!Object.prototype.hasOwnProperty.call(aliases, first)) return stage;
  var rest = restOf(stage);
  return aliases[first] + (rest ? ' ' + rest : '');
}

/* Only a line that STARTS with a command is parsed as a pipeline. "which files
   are > 1 kB?" is a sentence, and splitting it on the > would quietly eat it. */
function isCommandLine(line){
  var first = (tokenize(line)[0] || '').toLowerCase();
  if (!first) return false;
  if (first.charAt(0) === '!') return true;
  return KNOWN.indexOf(first) >= 0 || Object.prototype.hasOwnProperty.call(aliases, first);
}

/* Every stage read-only, and nothing being written to a file. Both callers run
   without anyone typing y — the agent, and .shellrc at launch — so a redirect
   has to count as a mutation here even though every verb in it is read-only. */
function unsafeReason(line, allowed){
  var pl = splitPipeline(line);
  if (pl.redirect) return 'writing to a file with > or >> is a change — propose it instead';
  if (!pl.stages.length) return 'empty command';
  for (var i = 0; i < pl.stages.length; i++){
    var tk = tokenize(expandAlias(pl.stages[i])), v = (tk[0] || '').toLowerCase();
    if (KNOWN.indexOf(v) < 0) return 'stage ' + (i + 1) + ' "' + pl.stages[i] + '" is not a command (a | outside quotes or /regex/ was treated as a pipe)';
    if (allowed.indexOf(v) < 0) return '"' + v + '" changes things, so it needs the user: propose it (read-only: ' + allowed.join(', ') + ')';
    /* xargs runs another command: that one has to be read-only too. */
    if (v === 'xargs'){ var inner = (tk[1] || '').toLowerCase(); if (allowed.indexOf(inner) < 0) return 'xargs ' + inner + ' changes things — propose it instead'; }
  }
  return null;
}

/* Run something with its output collected instead of (or as well as) shown.
   Saves and restores, so a pipeline inside the agent loop nests correctly. */
async function captureOf(fn, silent){
  var savedCap = capture, savedQuiet = quiet, savedErr = captureHadError;
  capture = []; quiet = !!silent; captureHadError = false;
  try { await fn(); }
  catch(e){ capture.push('error: ' + (e && e.message || e)); captureHadError = true; }
  var text = capture.join('\n');
  lastCaptureError = captureHadError;
  capture = savedCap; quiet = savedQuiet; captureHadError = savedErr;
  return text;
}
function runner(stage){ return function(){ return run(stage); }; }

function mimeFor(name){
  var n = String(name).toLowerCase(), dot = n.lastIndexOf('.');
  var ext = dot > 0 ? n.slice(dot + 1) : '';
  if (ext === 'json') return 'application/json';
  if (ext === 'csv') return 'text/csv';
  if (ext === 'html' || ext === 'htm') return 'text/html';
  if (ext === 'md' || ext === 'markdown') return 'text/markdown';
  return 'text/plain';
}
/* UTF-8 safe: btoa alone mangles anything above ASCII, and notes have accents
   and em dashes in them. Chunked so a 5 MB file does not blow the stack. */
function dataURL(text, mime){
  var bs = new TextEncoder().encode(String(text == null ? '' : text));
  var bin = '', CH = 0x8000;
  for (var i = 0; i < bs.length; i += CH) bin += String.fromCharCode.apply(null, bs.subarray(i, i + CH));
  return 'data:' + mime + ';base64,' + btoa(bin);

/* ---------- what persists between sessions (myllmStorage, not the workspace) ----------

   they live in per-app storage where they cannot clutter a file listing. */
async function loadState(){
  if (!store) return;
  try {
    var h = await store.getItem(HISTORY_KEY);
    if (h){ var arr = JSON.parse(h); if (Array.isArray(arr)) cmdHistory = arr.slice(-200); }
  } catch(e){}
  try {
    var a = await store.getItem(ALIAS_KEY);
    if (a){ var obj = JSON.parse(a); if (obj && typeof obj === 'object') aliases = obj; }
  } catch(e){}
  try { var lg = JSON.parse(await store.getItem(LOG_KEY) || '[]'); if (Array.isArray(lg)) changeLog = lg.slice(-200); } catch(e){}
  try { var us = JSON.parse(await store.getItem(UNDO_KEY) || '[]'); if (Array.isArray(us)) undoStack = us.slice(-30); } catch(e){}
  try { var mk = JSON.parse(await store.getItem(MARK_KEY) || '{}'); if (mk && typeof mk === 'object') marks = mk; } catch(e){}

/* Written on every command rather than debounced: a command is something a
   person typed, not a per-frame event, and a debounce only buys the chance to
   lose the last one when the app is closed straight after running it. */
function saveHistory(){
  if (!store) return;
  try { store.setItem(HISTORY_KEY, JSON.stringify(cmdHistory.slice(-200))); } catch(e){}
}
function saveAliases(){
  if (!store) return;
  try { store.setItem(ALIAS_KEY, JSON.stringify(aliases)); } catch(e){}
}
function saveMarks(){ if (store) try { store.setItem(MARK_KEY, JSON.stringify(marks)); } catch(e){} }
function saveLog(){ if (store) try { store.setItem(LOG_KEY, JSON.stringify(changeLog.slice(-200))); } catch(e){} }
/* App storage is ~1 MB for everything, and an undo entry for a rewritten file
   carries the old text. Oldest entries go first until the stack fits; an entry
   whose old text alone is too big is kept but marked, so undo can say so
   rather than "restore" an empty file. */
function saveUndo(){
  if (!store) return;
  var ops = undoStack.map(function(op){
    if (op.prev != null && op.prev.length > 150000){ var c = Object.assign({}, op); delete c.prev; c.prevLost = true; return c; }
    if (op.items){ var c2 = Object.assign({}, op); c2.items = op.items.map(function(it){
      return it.prev != null && it.prev.length > 150000 ? { path: it.path, prevLost: true } : it; }); return c2; }
    return op;
  });
  var json = JSON.stringify(ops);
  while (json.length > 600000 && ops.length){ ops.shift(); json = JSON.stringify(ops); }
  try { store.setItem(UNDO_KEY, json); } catch(e){}
}

/* !! / !5 / !gr — resolved before the line is echoed, so what you see in the
   scrollback and what goes into history is the command that actually ran. */
function expandBang(line){
  if (line.charAt(0) !== '!') return line;
  var rest = line.slice(1);
  if (!rest || rest === '!') return cmdHistory.length ? cmdHistory[cmdHistory.length - 1] : null;
  if (/^\d+$/.test(rest)) return cmdHistory[parseInt(rest, 10) - 1] || null;
  for (var i = cmdHistory.length - 1; i >= 0; i--)
    if (cmdHistory[i].toLowerCase().indexOf(rest.toLowerCase()) === 0) return cmdHistory[i];
  return null;
}

/* .shellrc: the lines that run when Shell opens. Nobody is at the prompt yet,
   so it is held to the same bar as the agent — look around, set up, change
   nothing. A rm in a startup file would run before you could stop it. */
var RC_SAFE = ['cd','alias','unalias','mark','clear','ls','dir','tree','pwd','du','cat','head','tail','sed','stat','find','grep','diff','jq','wc','sort','uniq','cut','tr','paste','comm','awk','xargs','man','changes','history','log'];
async function runRC(){
  var text = null;
  try { text = await files.read(RC); } catch(e){}
  if (text == null) return;
  var lines = text.split('\n'), ran = 0;
  for (var i = 0; i < lines.length; i++){
    var l = lines[i].trim();
    if (!l || l.charAt(0) === '#') continue;
    var why = unsafeReason(l, RC_SAFE);
    if (why){ print(RC + ':' + (i + 1) + ': skipped — ' + why, 'err'); continue; }
    try { await runLine(l); } catch(e){ print(RC + ':' + (i + 1) + ': ' + (e && e.message || e), 'err'); }
    if (++ran >= 20){ print(RC + ': stopped after 20 lines', 'dim'); break; }

/* ---------- a line, end to end ---------- */
async function runLine(line){
  var text = String(line || '').trim();
  if (!text) return;
  if (!isCommandLine(text)){ stdin = null; return run(text); }

  var pl = splitPipeline(text);
  if (!pl.stages.length) return;
  if (pl.redirect && !pl.redirect.path) return print('> needs a file name, e.g.  ls > list.txt', 'err');

  /* A stage that isn't a command would otherwise be sent to the assistant as a
     question, which is never what a | meant. Say where the split happened. */
  if (pl.stages.length > 1){
    for (var si = 0; si < pl.stages.length; si++){
      var sv = (tokenize(expandAlias(pl.stages[si]))[0] || '').toLowerCase();
      if (KNOWN.indexOf(sv) < 0) return print('stage ' + (si + 1) + ' (' + pl.stages[si] + ') is not a command: a | outside quotes or /regex/ starts a new stage. Put the pattern in quotes or /…/.', 'err');
    }
  }
  var piped = null;
  for (var i = 0; i < pl.stages.length; i++){
    var stage = expandAlias(pl.stages[i]);
    stdin = piped;
    /* The last stage of a plain pipeline prints for itself — in colour, with
       its paths still tappable. Only what is on its way to a file is captured. */
    if (i === pl.stages.length - 1 && !pl.redirect) return run(stage);
    piped = await captureOf(runner(stage), true);
    if (lastCaptureError){ print(piped, 'err'); return; }   /* a failed stage never reaches a file */
  }

  var dest = resolve(pl.redirect.path);
  if (!dest) return print('> needs a file name, e.g.  ls > list.txt', 'err');
  var body = piped == null ? '' : piped;
  var added = body.length;
  var prev = await files.read(dest);
  if (pl.redirect.append && prev != null && prev.length)
    body = prev + (prev.charAt(prev.length - 1) === '\n' ? '' : '\n') + body;
  await files.write(dest, body);
  remember({ type: 'write', path: dest, prev: prev });
  haptic('success');
  print((pl.redirect.append ? 'appended ' : 'wrote ') + added + ' chars to ' + dest +
        (prev != null && !pl.redirect.append ? ' (replaced ' + prev.length + ')' : '') +
        '  —  undo  puts it back', 'ok');
}

function glob(pattern, name){
  if (pattern.indexOf('*') < 0 && pattern.indexOf('?') < 0)
    return name.toLowerCase().indexOf(pattern.toLowerCase()) >= 0;
  var rx = '^' + pattern.replace(/[.+^${}()|[\]\\]/g,'\\$&')
                        .replace(/\*/g,'.*').replace(/\?/g,'.') + '$';
  return new RegExp(rx,'i').test(name);
}

/* Path-aware globs: * stays inside one folder, ** crosses folders, ? is one
   character. A pattern is relative to where you stand unless it starts with /. */
function globRx(pattern){
  var src = '', i = 0;
  while (i < pattern.length){
    var c = pattern.charAt(i);
    if (c === '*' && pattern.charAt(i + 1) === '*'){ src += pattern.charAt(i + 2) === '/' ? '(?:.*/)?' : '.*'; i += pattern.charAt(i + 2) === '/' ? 3 : 2; continue; }
    if (c === '*'){ src += '[^/]*'; i++; continue; }
    if (c === '?'){ src += '[^/]'; i++; continue; }
    src += c.replace(/[.+^${}()|[\]\\]/g, '\\$&'); i++;

  return new RegExp('^' + src + '$', 'i');
}

/* Expand the operands of a multi-path command. Plain paths pass through (even
   missing ones, so the command can say so); a glob becomes every match. */
function expandPaths(opsList, snap, withFolders){
  var outp = [];
  opsList.forEach(function(o){
    if (!isGlob(o)){ outp.push(resolve(o)); return; }
    var abs = o.charAt(0) === '/' ? normalise(o) : (cwd ? cwd + '/' : '') + o;
    var rx = globRx(abs);
    var hits = snap.files.map(function(f){ return f.path; }).filter(function(p){ return rx.test(p); });
    if (withFolders) hits = hits.concat(snap.folders.filter(function(d){ return rx.test(d); }));
    hits.sort();
    if (!hits.length) outp.push({ noMatch: o }); else outp.push.apply(outp, hits);
  });
  return outp;
}

async function snapshot(includeHidden){
  var list = await files.list();
  var folders = files.folders ? await files.folders() : [];
  var all = { files: list, folders: folders };

function trashPath(target){
  var snap = lastSnap || { files: [], folders: [] };   /* the UNFILTERED listing — run()'s hides .trash */
  var dest = TRASH + '/' + target;

async function pruneTrash(){

    var dirs = all.folders.filter(function(d){ return inTrash(d) && d !== TRASH; }).sort(function(a,b){ return b.length - a.length; });
    for (var i = 0; i < dirs.length; i++){
      var d = dirs[i];
      var busy = all.files.some(function(f){ return f.path.indexOf(d + '/') === 0; }) ||
                 all.folders.some(function(x){ return x !== d && x.indexOf(d + '/') === 0 && !dirs.slice(0, i).some(function(gone){ return gone === x; }); });
      if (!busy) await files.removeFolder(d, false);
    }
    var again = await snapshot(true);
    if (again.folders.indexOf(TRASH) >= 0 && !again.files.some(function(f){ return inTrash(f.path); }) &&

   `withValue` names those letters; everything else is a boolean flag. */
function parseOpts(raw, withValue){

/* Line diff: LCS over what is left after the common head and tail, then
   unified hunks with 3 lines of context. Big files fall back to a summary
   rather than freezing the page. */
function lineDiff(a, b){
  var pre = 0; while (pre < a.length && pre < b.length && a[pre] === b[pre]) pre++;
  var suf = 0; while (suf < a.length - pre && suf < b.length - pre && a[a.length-1-suf] === b[b.length-1-suf]) suf++;
  var A = a.slice(pre, a.length - suf), B = b.slice(pre, b.length - suf);
  if (A.length * B.length > 4000000) return null;
  var n = A.length, m = B.length, i, j;
  var L = []; for (i = 0; i <= n; i++){ L.push(new Uint32Array(m + 1)); }
  for (i = n - 1; i >= 0; i--) for (j = m - 1; j >= 0; j--)
    L[i][j] = A[i] === B[j] ? L[i+1][j+1] + 1 : Math.max(L[i+1][j], L[i][j+1]);
  var ops = [];
  for (i = 0; i < pre; i++) ops.push([' ', a[i]]);
  i = 0; j = 0;
  while (i < n && j < m){
    if (A[i] === B[j]){ ops.push([' ', A[i]]); i++; j++; }
    else if (L[i+1][j] >= L[i][j+1]) ops.push(['-', A[i++]]);
    else ops.push(['+', B[j++]]);
  }
  while (i < n) ops.push(['-', A[i++]]);
  while (j < m) ops.push(['+', B[j++]]);
  for (i = a.length - suf; i < a.length; i++) ops.push([' ', a[i]]);
  return ops;
}
function diffHTML(ops, labelA, labelB){
  var CTX = 3, out = ['<span class="dim">--- ' + esc(labelA) + '\n+++ ' + esc(labelB) + '</span>'];
  var adds = 0, dels = 0, k, aN = 0, bN = 0, pos = [];
  for (k = 0; k < ops.length; k++){ pos.push([aN, bN]); if (ops[k][0] !== '+') aN++; if (ops[k][0] !== '-') bN++; }
  var changed = []; for (k = 0; k < ops.length; k++) if (ops[k][0] !== ' ') changed.push(k);
  if (!changed.length) return null;
  var hunks = [], s0 = Math.max(0, changed[0] - CTX), e0 = Math.min(ops.length - 1, changed[0] + CTX);
  for (k = 1; k < changed.length; k++){
    if (changed[k] - CTX <= e0 + 1) e0 = Math.min(ops.length - 1, changed[k] + CTX);
    else { hunks.push([s0, e0]); s0 = Math.max(0, changed[k] - CTX); e0 = Math.min(ops.length - 1, changed[k] + CTX); }
  }
  hunks.push([s0, e0]);
  hunks.forEach(function(h){
    var aCount = 0, bCount = 0;
    for (var x = h[0]; x <= h[1]; x++){ if (ops[x][0] !== '+') aCount++; if (ops[x][0] !== '-') bCount++; }
    out.push('<span class="dim">@@ -' + (pos[h[0]][0] + 1) + ',' + aCount + ' +' + (pos[h[0]][1] + 1) + ',' + bCount + ' @@</span>');

      else if (t === '+'){ adds++; out.push('<span class="ok">+' + line + '</span>'); }
      else out.push('<span class="dim"> ' + line + '</span>');
    }

async function loadSpec(spec, sin){
  if (spec === '-'){ if (sin == null) return { err: '- means piped input, and nothing was piped' }; return { label: '(piped)', text: sin }; }
  var m = /^(.*)@(\d+)$/.exec(spec), path = resolve(m ? m[1] : spec);
  if (!m){
    var t = await files.read(path);
    return t == null ? { err: 'No such file: ' + path } : { label: path, text: t };
  }
  if (!files.versions || !files.readVersion) return { err: 'Version history needs the latest MyLLM build.' };
  var vs = await files.versions(path), v = +m[2];
  if (!vs.length) return { err: 'No previous versions of ' + path };
  if (v < 1 || v > vs.length) return { err: path + ' has versions 1\u2013' + vs.length + '  (see  history ' + path + ')' };
  var old = await files.readVersion(path, vs[v - 1].stamp);
  if (old == null) return { err: 'Could not read version ' + v + ' of ' + path };
  return { label: path + '@' + v + '  (' + when(vs[v - 1].stamp) + ')', text: old };
}

/* A small jq. Paths (.a.b, .a[0], .a[], ."odd key", .["odd key"], a trailing ?),
   pipes, ..  (every value in the document), select(cond), map(f), to_entries,
   from_entries, keys, length, type, values, not, test("re"), has("k"),
   contains("s"), ascii_downcase, and == != < <= > >= against literals or paths. */
function jqSplit(f, sep){
  sep = sep || '|';
  var parts = [], cur = '', depth = 0, q = false;
  for (var i = 0; i < f.length; i++){
    var c = f.charAt(i);
    if (q){ cur += c; if (c === '\\'){ cur += f.charAt(++i); continue; } if (c === '"') q = false; continue; }
    if (c === '"'){ q = true; cur += c; continue; }
    if (c === '[' || c === '(') depth++;
    if (c === ']' || c === ')') depth--;
    if (c === sep && !depth){ parts.push(cur.trim()); cur = ''; continue; }
    cur += c;
  }
  parts.push(cur.trim());
  return parts;
}
function jqEval(filter, inputs){
  return jqSplit(filter).reduce(function(acc, stage){
    var outv = [];
    acc.forEach(function(v){ outv = outv.concat(jqOne(stage, v)); });
    return outv;
  }, inputs);
}
function jqLiteral(t){
  t = t.trim();
  if (/^-?\d+(\.\d+)?$/.test(t)) return { ok: true, v: +t };
  if (/^"(?:[^"\\]|\\.)*"$/.test(t)) return { ok: true, v: JSON.parse(t) };
  if (t === 'true' || t === 'false' || t === 'null') return { ok: true, v: JSON.parse(t) };
  return { ok: false };
}
function jqTruthy(x){ return !(x === false || x === null || x === undefined); }
function jqOne(stage, v){
  var m;
  if (stage === '.' || stage === '') return [v];
  if (stage === '..'){
    var all = [];
    (function walk(x){ all.push(x); if (x && typeof x === 'object') (Array.isArray(x) ? x : Object.keys(x).map(function(k){ return x[k]; })).forEach(walk); })(v);
    return all;
  }
  var lit = jqLiteral(stage); if (lit.ok) return [lit.v];
  /* comparisons, at the top level of this stage */
  var ops2 = ['==','!=','<=','>=','<','>'];
  for (var oi = 0; oi < ops2.length; oi++){
    var at = jqTopIndex(stage, ops2[oi]);
    if (at > 0){
      var L = jqEval(stage.slice(0, at), [v])[0], Rt = stage.slice(at + ops2[oi].length);
      var R = jqLiteral(Rt).ok ? jqLiteral(Rt).v : jqEval(Rt.trim(), [v])[0];
      switch (ops2[oi]){
        case '==': return [JSON.stringify(L) === JSON.stringify(R)];
        case '!=': return [JSON.stringify(L) !== JSON.stringify(R)];
        case '<=': return [L <= R]; case '>=': return [L >= R];
        case '<': return [L < R]; case '>': return [L > R];
      }
    }
  }
  if ((m = /^select\((.*)\)$/.exec(stage))) return jqEval(m[1], [v]).some(jqTruthy) ? [v] : [];
  if ((m = /^map\((.*)\)$/.exec(stage))){
    if (!Array.isArray(v)) throw new Error('map needs an array');
    var mapped = []; v.forEach(function(x){ mapped = mapped.concat(jqEval(m[1], [x])); }); return [mapped];
  }
  if ((m = /^test\(\s*("(?:[^"\\]|\\.)*")\s*\)$/.exec(stage))) return [typeof v === 'string' && new RegExp(JSON.parse(m[1]), 'i').test(v)];
  if ((m = /^has\(\s*("(?:[^"\\]|\\.)*"|\d+)\s*\)$/.exec(stage))){ var key = JSON.parse(m[1]); return [v != null && typeof v === 'object' && Object.prototype.hasOwnProperty.call(v, key)]; }
  if ((m = /^contains\(\s*("(?:[^"\\]|\\.)*")\s*\)$/.exec(stage))) return [typeof v === 'string' ? v.indexOf(JSON.parse(m[1])) >= 0 : JSON.stringify(v).indexOf(JSON.parse(m[1])) >= 0];
  switch (stage){
    case 'not': return [!jqTruthy(v)];
    case 'type': return [v === null ? 'null' : Array.isArray(v) ? 'array' : typeof v];
    case 'length': return [v == null ? 0 : typeof v === 'object' ? (Array.isArray(v) ? v.length : Object.keys(v).length) : String(v).length];
    case 'ascii_downcase': return [typeof v === 'string' ? v.toLowerCase() : v];
    case 'keys': if (!v || typeof v !== 'object') throw new Error('keys needs an object or array'); return [Array.isArray(v) ? v.map(function(_, i){ return i; }) : Object.keys(v).sort()];
    case 'values': if (!v || typeof v !== 'object') throw new Error('values needs an object or array'); return Array.isArray(v) ? v : Object.keys(v).map(function(k){ return v[k]; });
    case 'to_entries': if (!v || typeof v !== 'object' || Array.isArray(v)) throw new Error('to_entries needs an object'); return [Object.keys(v).map(function(k){ return { key: k, value: v[k] }; })];
    case 'from_entries': if (!Array.isArray(v)) throw new Error('from_entries needs an array'); var o2 = {}; v.forEach(function(e){ if (e && typeof e === 'object') o2[e.key != null ? e.key : e.name] = e.value; }); return [o2];
  }
  if (stage.charAt(0) !== '.') throw new Error('unknown filter "' + stage + '" — see  man jq');
  return jqPath(stage, v);
}
/* Where `op` first appears outside quotes and brackets, or -1. */
function jqTopIndex(s2, op){
  var depth = 0, q = false;
  for (var i = 0; i < s2.length; i++){
    var c = s2.charAt(i);
    if (q){ if (c === '\\') i++; else if (c === '"') q = false; continue; }
    if (c === '"'){ q = true; continue; }
    if (c === '[' || c === '(') depth++;
    if (c === ']' || c === ')') depth--;
    if (!depth && s2.substr(i, op.length) === op){
      /* don't read the < of <= as < */
      if ((op === '<' || op === '>') && s2.charAt(i + 1) === '=') continue;
      if ((op === '==' || op === '!=') || op.length === 2 || (s2.charAt(i - 1) !== '!' && s2.charAt(i - 1) !== '=' )) return i;
    }
  }
  return -1;
}
function jqPath(stage, v){
  var steps = [], i = 0, rx;
  while (i < stage.length){
    var rest = stage.slice(i);
    if (rest.charAt(0) === '?'){ i++; continue; }
    if ((rx = /^\.\[/.exec(rest))){ i += 1; continue; }
    if ((rx = /^\.([A-Za-z_][A-Za-z0-9_$-]*)/.exec(rest))){ steps.push(['key', rx[1]]); i += rx[0].length; continue; }
    if ((rx = /^\."((?:[^"\\]|\\.)*)"/.exec(rest))){ steps.push(['key', rx[1]]); i += rx[0].length; continue; }
    if ((rx = /^\[\s*(-?\d+)\s*\]/.exec(rest))){ steps.push(['idx', +rx[1]]); i += rx[0].length; continue; }
    if ((rx = /^\[\s*"((?:[^"\\]|\\.)*)"\s*\]/.exec(rest))){ steps.push(['key', rx[1]]); i += rx[0].length; continue; }
    if ((rx = /^\[\s*\]/.exec(rest))){ steps.push(['each']); i += rx[0].length; continue; }
    if (rest === '.') break;
    throw new Error('cannot read "' + rest + '" in the filter — see  man jq');
  }
  var cur = [v];
  steps.forEach(function(st){
    var next = [];
    cur.forEach(function(x){
      if (st[0] === 'key') next.push(x != null && typeof x === 'object' && !Array.isArray(x) ? (Object.prototype.hasOwnProperty.call(x, st[1]) ? x[st[1]] : null) : null);
      else if (st[0] === 'idx') next.push(Array.isArray(x) ? x[st[1] < 0 ? x.length + st[1] : st[1]] : null);
      else { if (!x || typeof x !== 'object') return; next = next.concat(Array.isArray(x) ? x : Object.keys(x).map(function(k){ return x[k]; })); }
    });
    cur = next.map(function(x){ return x === undefined ? null : x; });
  });
  return cur;
}

/* write / replace / edit, worked out WITHOUT writing: the commands use it to
   do the change, and a proposal uses it to show the diff before anyone types
   y. Patch-sized edits are reviewable; a whole-file rewrite is not. */
async function planEdit(line){
  var argv = tokenize(line), verb = (argv.shift() || '').toLowerCase();
  var o = parseOpts(argv, '');
  if (o.ops[0] === '-1'){ o.ops.shift(); o.flags['1'] = true; }   /* replace -1: first occurrence only */
  if (o.ops[0] === '-1E' || o.ops[0] === '-E1'){ o.ops.shift(); o.flags['1'] = true; o.flags.E = true; }
  var path = o.ops[0] ? resolve(o.ops[0]) : '';
  if (!path) return { err: verb + ' needs a path' };
  var prev = await files.read(path);
  if (verb === 'write'){
    var body = line.slice(line.indexOf(o.ops[0]) + o.ops[0].length).trim();
    if (!body) return { err: 'write <path> <text>  — the text replaces the file' };
    return { path: path, prev: prev, next: body, how: prev == null ? 'created ' : 'rewrote ', said: 'wrote ' + body.length + ' chars to ' + path + (prev != null ? ' (replaced ' + prev.length + ')' : '') };
  }
  if (prev == null) return { err: 'No such file: ' + path };
  if (verb === 'replace'){
    if (o.ops.length < 3) return { err: 'replace <path> "old text" "new text"  (-1 changes only the first, -E for a regex with $1 groups)' };
    var from = o.ops[1].replace(/\\n/g, '\n'), to = o.ops[2].replace(/\\n/g, '\n');
    if (!from) return { err: 'replace needs the text to find' };
    /* -E (or /…/): a regular expression, with $1… in the new text. */
    var reSrc = o.flags.E ? from : (from.length > 2 && from.charAt(0) === '/' && from.charAt(from.length - 1) === '/' ? from.slice(1, -1) : null);
    if (reSrc != null){
      var rre;
      try { rre = new RegExp(reSrc, o.flags['1'] ? 'm' : 'gm'); } catch(e){ return { err: 'replace: not a valid regular expression (' + e.message + ')' }; }
      var rCount = (prev.match(new RegExp(reSrc, 'gm')) || []).length;
      if (!rCount) return { err: 'nothing in ' + path + ' matches /' + reSrc + '/' };
      var rNext = prev.replace(rre, to), rN = o.flags['1'] ? 1 : rCount;
      return { path: path, prev: prev, next: rNext, how: 'edited ', said: 'replaced ' + rN + ' match' + (rN === 1 ? '' : 'es') + ' of /' + reSrc + '/ in ' + path };
    }
    var count = prev.split(from).length - 1;
    if (!count) return { err: '"' + o.ops[1] + '" is not in ' + path + ' — nothing to replace' };
    var next = o.flags['1'] ? prev.replace(from, function(){ return to; }) : prev.split(from).join(to);
    var n = o.flags['1'] ? 1 : count;
    return { path: path, prev: prev, next: next, how: 'edited ', said: 'replaced ' + n + ' occurrence' + (n === 1 ? '' : 's') + ' in ' + path };
  }
  /* edit <path> <A[-B]> <text>  replaces lines A..B;  <A>+ <text>  inserts after A
     (0+ is the top); an empty text deletes the lines. */
  var spec = o.ops[1] || '', text = o.ops.slice(2).join(' ').replace(/\\n/g, '\n');
  var ls = prev.split('\n'), mm;
  /* edit <path> /pattern/ "text": the FIRST matching line (-a: every one) —
     no line numbers to get wrong.  /pattern/+ inserts after it. */
  if ((mm = /^\/(.+)\/(\+?)$/.exec(spec))){
    var ere; try { ere = new RegExp(mm[1], 'i'); } catch(e){ return { err: 'edit: not a valid regular expression (' + e.message + ')' }; }
    var at2 = []; ls.forEach(function(l, ix){ if (ere.test(l)) at2.push(ix); });
    if (!at2.length) return { err: 'no line in ' + path + ' matches /' + mm[1] + '/' };
    if (!o.flags.a) at2 = at2.slice(0, 1);
    if (mm[2] && !text) return { err: 'edit ' + o.ops[0] + ' ' + spec + ' "text to insert"' };
    for (var q5 = at2.length - 1; q5 >= 0; q5--){
      if (mm[2]) ls.splice.apply(ls, [at2[q5] + 1, 0].concat(text.split('\n')));
      else ls.splice.apply(ls, [at2[q5], 1].concat(text === '' ? [] : text.split('\n')));
    }
    return { path: path, prev: prev, next: ls.join('\n'), how: 'edited ', said: (mm[2] ? 'inserted after ' : text === '' ? 'deleted ' : 'replaced ') + at2.length + ' line' + (at2.length === 1 ? '' : 's') + ' matching /' + mm[1] + '/ in ' + path + ' (line ' + at2.map(function(x){ return x + 1; }).join(', ') + ')' };
  }
  if ((mm = /^(\d+)\+$/.exec(spec))){
    var after = +mm[1]; if (after > ls.length) return { err: path + ' has ' + ls.length + ' lines' };
    if (!text) return { err: 'edit ' + o.ops[0] + ' ' + spec + ' "text to insert"' };
    ls.splice.apply(ls, [after, 0].concat(text.split('\n')));
    return { path: path, prev: prev, next: ls.join('\n'), how: 'edited ', said: 'inserted ' + text.split('\n').length + ' line(s) after line ' + after + ' of ' + path };
  }
  if (!(mm = /^(\d+)(?:-(\d+|\$))?$/.exec(spec))) return { err: 'edit <path> <line or A-B> "new text"   or   edit <path> <A>+ "inserted text"' };
  var a = +mm[1], b = mm[2] === '$' ? ls.length : mm[2] ? +mm[2] : a;
  if (a < 1 || b < a || b > ls.length) return { err: path + ' has lines 1\u2013' + ls.length };
  ls.splice.apply(ls, [a - 1, b - a + 1].concat(text === '' ? [] : text.split('\n')));
  return { path: path, prev: prev, next: ls.join('\n'), how: 'edited ', said: (text === '' ? 'deleted' : 'replaced') + ' line' + (a === b ? ' ' + a : 's ' + a + '\u2013' + b) + ' of ' + path };
}
async function previewEdit(line){
  var v = (tokenize(line)[0] || '').toLowerCase();
  if (['write','replace','edit'].indexOf(v) < 0) return;
  var plan = await planEdit(line);
  if (plan.err){ print('   (' + plan.err + ')', 'err'); return; }
  var d = diffHTML(lineDiff(lines$(plan.prev || ''), lines$(plan.next)) || [], plan.prev == null ? '(new file)' : plan.path, plan.path + ' after');
  if (d) printHTML(d.html);
}

async function copyOne(snap, ops, flags){
      /* cp a b  ·  cp a folder/  ·  cp -r folder copy  — -f replaces what is there.
         The store holds text, so this is read-and-write; undo removes the copies
         (or puts back what -f replaced). */
      if (ops.length < 2) return print('cp <from> <to>   (-f replaces an existing file)', 'err');
      var cFrom = resolve(ops[0]), cTo = resolve(ops[1]);
      if (!cTo) return print('cp needs a destination name', 'err');
      var cIsDir = snap.folders.indexOf(cFrom) >= 0;
      var cFile = snap.files.some(function(x){ return x.path === cFrom; });
      if (!cIsDir && !cFile) return print('No such file or folder: ' + cFrom, 'err');
      var into = snap.folders.indexOf(cTo) >= 0 || /\/$/.test(ops[1]);
      var pairs = cIsDir
        ? snap.files.filter(function(x){ return x.path.indexOf(cFrom + '/') === 0; }).map(function(x){
            return [x.path, (into ? cTo + '/' + cFrom.split('/').pop() : cTo) + x.path.slice(cFrom.length)]; })
        : [[cFrom, into ? cTo + '/' + cFrom.split('/').pop() : cTo]];
      if (!pairs.length) return print(cFrom + '/ is empty', 'dim');
      var clashes = pairs.filter(function(pr){ return snap.files.some(function(x){ return x.path === pr[1]; }); });
      if (clashes.length && !flags.f) return print(clashes[0][1] + (clashes.length > 1 ? ' and ' + (clashes.length - 1) + ' more' : '') + ' already exist' + (clashes.length > 1 ? '' : 's') + ' — use  cp -f  to replace', 'err');
      var items = [];
      for (var ci = 0; ci < pairs.length; ci++){
        var cBody = await files.read(pairs[ci][0]);
        if (cBody == null){ print('skipped ' + pairs[ci][0] + ' (not readable as text)', 'dim'); continue; }
        var cPrev = await files.read(pairs[ci][1]);
        await files.write(pairs[ci][1], cBody);
        items.push({ path: pairs[ci][1], prev: cPrev });
      }
      if (!items.length) return print('nothing copied', 'dim');
      remember({ type: 'cp', to: cIsDir ? (into ? cTo + '/' + cFrom.split('/').pop() : cTo) + '/' : items[0].path, items: items });
      haptic('success');
      return print('copied ' + (items.length === 1 ? cFrom + ' -> ' + items[0].path : items.length + ' files to ' + (into ? cTo + '/' + cFrom.split('/').pop() : cTo) + '/') + '  —  undo  removes the copy', 'ok');
    }

/* ---------- commands ---------- */

async function run(line){
  if (!files){ print('Shared files are off. Turn on "Shared files" in MyLLMos settings.', 'err'); return; }
  /* Taken and cleared in one go: whatever this command does next — including
     running another command — must not inherit the text piped into this one. */
  var sin = stdin; stdin = null;
  var argv = tokenize(line);
  var verb = (argv.shift()||'').toLowerCase();
  var raw = argv.slice();   /* for commands whose options take values (find, sort, cut) */

  var flags = {}, n = 20, ops = [], ctx = 0, longs = {}, maxHits = 0, depthL = 0, nChars = 0;
  for (var i=0;i<argv.length;i++){
    var a = argv[i];
    /* --include=*.md, --exclude-dir=archives: long options keep their value. */
    if (a.indexOf('--') === 0 && a.length > 2){ var eq = a.indexOf('='); longs[eq > 0 ? a.slice(2, eq) : a.slice(2)] = eq > 0 ? a.slice(eq + 1) : true; continue; }
    if (a === '-m' && argv[i+1] && !isNaN(+argv[i+1])){ maxHits = Math.max(1, +argv[i+1]); i++; continue; }
    if (a === '-L' && argv[i+1] && !isNaN(+argv[i+1])){ depthL = Math.max(1, +argv[i+1]); i++; continue; }
    if (a === '-c' && argv[i+1] && !isNaN(+argv[i+1]) && (verb === 'head' || verb === 'tail')){ nChars = Math.max(1, +argv[i+1]); i++; continue; }
    if (a === '-n' && argv[i+1] && !isNaN(+argv[i+1])){ n = Math.max(1, Math.min(+argv[i+1], 500)); i++; continue; }
    if (a === '-C' && argv[i+1] && !isNaN(+argv[i+1])){ ctx = Math.max(0, Math.min(+argv[i+1], 10)); i++; continue; }
    if (/^-C\d+$/.test(a)){ ctx = Math.min(+a.slice(2), 10); continue; }
    if (a.charAt(0) === '-'){ a.slice(1).split('').forEach(function(f){ flags[f] = true; }); continue; }
    ops.push(a);
  }
  var target = ops.length ? resolve(ops[0]) : cwd;
  var snap = await snapshot(!!flags.a);

  switch (verb){
    case 'help': printHTML(helpHTML()); return;
    case 'clear': out.innerHTML = ''; return;
    case 'pwd': print('/' + cwd, 'dim'); return;

    case 'cd': {
      var dest;
      if (raw[0] === '-'){ if (prevCwd == null) return print('no previous folder yet', 'dim'); dest = prevCwd; }
      else dest = ops.length ? resolve(ops[0]) : '';
      if (ops[0] && ops[0].charAt(0) === '@' && !Object.prototype.hasOwnProperty.call(marks, ops[0].slice(1).split('/')[0].toLowerCase()))
        return print('no bookmark ' + ops[0].split('/')[0] + ' — see  mark', 'err');
      if (dest && snap.folders.indexOf(dest) < 0) return print('No such folder: ' + dest, 'err');
      prevCwd = cwd; cwd = dest; paintPrompt();
      return print('/' + cwd, 'dim');
    }

    case 'mark': {
      /* mark            list bookmarks
         mark name [p]   save p (default: here) as @name
         mark -d name    forget one */
      if (flags.d){
        var dName = (ops[0] || '').toLowerCase().replace(/^@/, '');
        if (!Object.prototype.hasOwnProperty.call(marks, dName)) return print('no bookmark @' + dName, 'dim');
        delete marks[dName]; saveMarks(); return print('forgot @' + dName, 'ok');
      }
      if (!ops.length){
        var mNames = Object.keys(marks).sort();
        if (!mNames.length) return print('no bookmarks yet — stand somewhere and type  mark work  then use  cd @work  or  ls @work', 'dim');
        return printHTML(mNames.map(function(k){ return '<span class="cmd">@' + esc(k) + '</span>\t' + pathHTML(marks[k], '/' + marks[k]); }).join('\n'));
      }
      var mName = ops[0].toLowerCase().replace(/^@/, '');
      if (!/^[a-z0-9_-]+$/.test(mName)) return print('a bookmark name is letters, digits, - or _', 'err');
      var mPath = ops[1] ? resolve(ops[1]) : cwd;
      if (mPath && snap.folders.indexOf(mPath) < 0 && !snap.files.some(function(x){ return x.path === mPath; })) return print('No such file or folder: ' + mPath, 'err');
      marks[mName] = mPath; saveMarks();
      return print('@' + mName + ' -> /' + mPath, 'ok');
    }

    case 'ls': case 'dir': case 'tree':
      return listing(snap, target, verb === 'tree' || flags.R || flags.r, flags.t ? 't' : flags.S ? 'S' : null,
                     { long: !!flags.l, depth: depthL });

    case 'cat': case 'head': case 'tail': {
      /* One file, what was piped in, or several (cat a b, head -n 3 *.md) with a
         ==> name <== header each, as head does. -c N counts characters. */
      var cut1 = function(text){
        if (nChars) return verb === 'tail' ? text.slice(-nChars) : text.slice(0, nChars);
        if (verb === 'cat') return text;
        var ls1 = text.split('\n');
        return (verb === 'head' ? ls1.slice(0, n) : ls1.slice(-n)).join('\n');
      };
      if (sin != null && !ops.length){ print(cut1(sin)); return; }
      if (!ops.length) return print(verb + ' needs a path (or several, or a glob like *.md)', 'err');
      /* Several files get a ==> name <== header each — except cat into a pipe or
         a file, where it joins them the way cat always has (cat a b | sort). */
      var cps = expandPaths(ops, snap, false), multi = cps.length > 1 && (verb !== 'cat' || !quiet), failed = 0;   /* quiet = mid-pipe or bound for a file */
      for (var ci1 = 0; ci1 < cps.length; ci1++){
        var cp1 = cps[ci1];
        if (cp1.noMatch){ print('no file matches ' + cp1.noMatch, 'err'); failed++; continue; }
        var t1 = await files.read(cp1);
        if (t1 == null){ print('No such file: ' + cp1, 'err'); failed++; continue; }
        if (multi) printHTML((ci1 ? '\n' : '') + '<span class="dim">==&gt; </span>' + pathHTML(cp1) + '<span class="dim"> &lt;==</span>');
        print(cut1(t1));
        if (!multi && !nChars && verb !== 'cat' && t1.split('\n').length > n) note('[' + t1.split('\n').length + ' lines total]');
      }
      return;
