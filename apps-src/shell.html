      var am = /^(?:\/((?:[^\/\\]|\\.)*)\/\s*)?\{\s*print\s*(.*?)\s*;?\s*\}$/.exec(prog);
      if (!am) return print("awk '{print $1, $3}'  ·  awk -F , '{print $2}'  ·  awk '/todo/ {print NR, $0}'  (print is all this awk does)", 'err');
      var ast = await textFrom(sin, ao.ops[1], 'awk'); if (ast.err) return print(ast.err, 'err');
      var arx;
      try { arx = am[1] != null ? new RegExp(am[1], 'i') : null; } catch(e){ return print('awk: bad pattern (' + e.message + ')', 'err'); }
      var fs = ao.vals.F == null ? null : ao.vals.F === '\\t' ? '\t' : ao.vals.F;
      var items2 = am[2] ? am[2].split(/\s*,\s*/) : ['$0'];
      var outA = [];
      lines$(ast.text).forEach(function(l, ix){
        if (arx && !arx.test(l)) return;
        var fl = fs == null ? l.trim().split(/\s+/) : l.split(fs);
        outA.push(items2.map(function(it){
          if (it === '$0') return l;
          if (/^\$\d+$/.test(it)) return fl[+it.slice(1) - 1] == null ? '' : fl[+it.slice(1) - 1];
          if (it === '$NF') return fl[fl.length - 1] || '';
          if (it === 'NF') return String(fl.length);
          if (it === 'NR') return String(ix + 1);
          if (/^".*"$/.test(it)) return it.slice(1, -1);
          return it;
        }).join(fs == null ? ' ' : fs));
      });
      return print(outA.join('\n'));
    }

    case 'xargs': {
      /* grep -l TODO notes | xargs head -n 5 — the paths that came down the pipe
         are handed to the command (made absolute, so where you stand doesn't
         matter). The assistant may only xargs a read-only command. */
      if (sin == null) return print('xargs runs a command on paths piped in:  grep -l TODO notes | xargs head -n 3', 'err');
      var xCmd = restOf(line);
      if (!xCmd) return print('xargs <command> — e.g.  find *.md | xargs wc -l', 'err');
      var xv = (tokenize(xCmd)[0] || '').toLowerCase();
      if (['xargs', 'ask', 'dictate'].indexOf(xv) >= 0 || KNOWN.indexOf(xv) < 0) return print('xargs: ' + xv + ' is not something xargs can run', 'err');
      var xPaths = sin.split('\n').map(function(l){ return l.replace(/\t.*$/, '').replace(/:\d+:.*$/, '').trim(); })
        .filter(Boolean).filter(function(x, ix3, arr){ return arr.indexOf(x) === ix3; }).slice(0, 50);
      if (!xPaths.length) return print('found nothing: no paths came down the pipe', 'dim');
      var quoted = function(x){ return '"/' + x.replace(/^\//, '') + '"'; };
      var multiOk = ['cat','head','tail','stat','wc','paste','rm','cp','mv'].indexOf(xv) >= 0;
      if (multiOk) return run(xCmd + ' ' + xPaths.map(quoted).join(' '));
      for (var xi = 0; xi < xPaths.length; xi++){
        printHTML('<span class="dim">==&gt; </span>' + pathHTML(xPaths[xi].replace(/^\//, '')) + '<span class="dim"> &lt;==</span>');
        await run(xCmd + ' ' + quoted(xPaths[xi]));
      }
      return;
    }

    case 'man': {
      var mv2 = (ops[0] || '').toLowerCase();
      if (!mv2) return print('man <command> — the exact flags it takes.  help  lists every command;  changes  says what is new.', 'dim');
      if (!MAN[mv2]) return print('no manual for ' + mv2 + ' — commands: ' + VERBS.join(' '), 'err');
      return printHTML('<span class="cmd">' + esc(mv2) + '</span>\n' + MAN[mv2].map(function(l){ return '<span class="dim">' + esc(l) + '</span>'; }).join('\n'));
    }

    case 'changes': {
      /* Shell's own changelog, so you (or the assistant) can check what already
         exists before asking for it. */
      return print(CHANGES.join('\n'));
    }

    case 'diff': {
      /* diff a b  ·  diff notes.md@2  (that version vs now)  ·  diff notes.md
         (the newest saved version vs now)  ·  diff notes.md@3 notes.md@1 */
      if (!ops.length) return print('diff <a> <b>   or   diff <file>@N  (version N vs now — see  history <file>)', 'err');
      var A, B;
      if (ops.length === 1){
        if (/@\d+$/.test(ops[0])){ A = await loadSpec(ops[0], sin); B = await loadSpec(ops[0].replace(/@\d+$/, ''), sin); }
        else { A = await loadSpec(ops[0] + '@1', sin); B = await loadSpec(ops[0], sin); }
      } else { A = await loadSpec(ops[0], sin); B = await loadSpec(ops[1], sin); }
      if (A.err) return print(A.err, 'err');
      if (B.err) return print(B.err, 'err');
      var dops = lineDiff(lines$(A.text), lines$(B.text));
      if (!dops) return print('too big to compare line by line (' + lines$(A.text).length + ' vs ' + lines$(B.text).length + ' lines)', 'err');
      var dh = diffHTML(dops, A.label, B.label);
      if (!dh) return print('no differences', 'dim');
      printHTML(dh.html);
      return note('[' + dh.adds + ' line(s) added, ' + dh.dels + ' removed]');
    }

    case 'jq': {
      /* jq '.field.sub' file   ·   jq '.items[] | .name' file   ·   cat x.json | jq keys
         -r prints strings without quotes. */
      var jo = parseOpts(raw, '');
      var filter = '.', jpath = null;
      if (jo.ops.length >= 2){ filter = jo.ops[0]; jpath = jo.ops[1]; }
      else if (jo.ops.length === 1){ if (sin != null || /^[.\[]|^(keys|length|type|values|to_entries|map|select)\b/.test(jo.ops[0])) filter = jo.ops[0]; else jpath = jo.ops[0]; }
      var jt = await textFrom(sin, jpath, 'jq'); if (jt.err) return print(jt.err, 'err');
      var data;
      try { data = JSON.parse(jt.text); }
      catch(e){ return print((jpath ? resolve(jpath) : 'that') + ' is not valid JSON (' + e.message + ')', 'err'); }
      var results;
      try { results = jqEval(filter, [data]); }
      catch(e){ return print('jq: ' + e.message, 'err'); }
      return print(results.map(function(v){ return jo.flags.r && typeof v === 'string' ? v : JSON.stringify(v, null, 2); }).join('\n'));
    }

    case 'du': {
      var byDir = {};
      snap.files.forEach(function(f){
        var d = f.path.indexOf('/') < 0 ? '.' : f.path.slice(0, f.path.lastIndexOf('/'));
        byDir[d] = (byDir[d]||0) + f.size;
      });
      var rows = Object.keys(byDir).sort(function(a,b){ return byDir[b]-byDir[a]; })
        .map(function(d){ return bytes(byDir[d]) + '\t' + d; });
      var total = snap.files.reduce(function(a,b){ return a + b.size; }, 0);
      return print(rows.concat([bytes(total) + '\ttotal of 25 MB']).join('\n'));
    }

    /* ---- the model as a filter, and the phone as an input device ---- */

    case 'ask': {
      /* The agent (anything that is not a command) EXPLORES: it runs commands
         and decides what to do next. This verb TRANSFORMS: one call, no tools,
         whatever came down the pipe as its material, and the answer is just
         text — so it can be piped onward or redirected into a file. */
      if (!window.myllmAsk) return print('AI is off for apps — turn on "Allow apps to use the AI" in MyLLMos settings.', 'err');
      var q = unquote(restOf(line));
      if (!q && sin == null) return print('ask "a question"  —  or pipe something in:  cat notes.md | ask "summarise"', 'err');
      var material = sin;
      var clipped = false;
      if (material != null && material.length > ASK_MAX){ material = material.slice(0, ASK_MAX); clipped = true; }
      var prompt = material != null
        ? (q || 'Summarise this.') + '\n\n--- material ---\n' + material + (clipped ? '\n[truncated]' : '')
        : q;
      var spin = status('asking\u2026');
      var answer;
      try { answer = await myllmAsk(prompt, { system: FILTER_SYSTEM }); }
      catch(e){ unstatus(spin); return print('ask failed: ' + (e && e.message || e), 'err'); }
      unstatus(spin);
      var clean = stripFence(String(answer == null ? '' : answer));
      if (!clean) return print('(no answer)', 'dim');
      if (clipped) print('[used the first ' + ASK_MAX + ' characters]', 'dim');
      return print(clean, 'say');
    }

    case 'dictate': {
      /* Typing at a prompt is the worst thing about a terminal on a phone.
         No path argument: it prints, and  >  is how anything gets saved. */
      if (!window.myllmTranscribe) return print('Dictation needs a newer MyLLM build.', 'err');
      var heard;
      try { heard = await myllmTranscribe(); }
      catch(e){ return print('dictation failed: ' + (e && e.message || e), 'err'); }
      if (heard == null || !String(heard).trim()) return print('nothing heard', 'dim');
      haptic('success');
      return print(String(heard).trim());
    }

    case 'open': {
      /* The intent bus, with the same action name the Files app uses, so Shell
         reaches exactly the apps that already declare they can take text. */
      if (!ops.length) return print('open <path>  — hands the file to an app that can open text', 'err');
      if (!snap.files.some(function(x){ return x.path === target; })) return print('No such file: ' + target, 'err');
      var body = await files.read(target);
      if (body == null) return print('Cannot read ' + target + ' — Shell handles text files.', 'err');
      if (!window.myllmIntent) return print('Handing files to other apps needs a newer MyLLM build.', 'err');
      var oName = target.split('/').pop(), oDot = oName.lastIndexOf('.');
      try {
        var routed = await myllmIntent.send('open-text', {
          name: oName, path: target, ext: oDot > 0 ? oName.slice(oDot + 1).toLowerCase() : '', text: body
        });
        haptic('success');
        return print('opened ' + oName + (routed && routed.handlers > 1 ? ' — pick an app' : ''), 'ok');
      } catch(e){
        /* Nothing installed takes text yet. An error here would read as broken
           rather than un-adopted, so do the useful thing instead. */
        print('No installed app can open text yet — here it is instead.', 'dim');
        return print(body);
      }
    }

    case 'share': {
      if (!ops.length) return print('share <path>  — sends the file out through iOS', 'err');
      var sBody = await files.read(target);
      if (sBody == null) return print('No such file: ' + target, 'err');
      if (!window.myllmShareFile) return print('Sharing needs a newer MyLLM build.', 'err');
      var sName = target.split('/').pop(), sMime = mimeFor(sName);
      try { await myllmShareFile(dataURL(sBody, sMime), { filename: sName, mime: sMime }); }
      catch(e){ return print('share failed: ' + (e && e.message || e), 'err'); }
      haptic('success');
      return print('shared ' + sName, 'ok');
    }

    case 'alias': {
      var aRest = restOf(line);
      if (!aRest){
        var names = Object.keys(aliases).sort();
        if (!names.length) return print('no aliases yet — e.g.  alias ll "ls -R"', 'dim');
        return print(names.map(function(k){ return k + '\t' + aliases[k]; }).join('\n'));
      }
      var aName = (tokenize(aRest)[0] || '').toLowerCase();
      var aBody = unquote(restOf(aRest));
      if (!aBody) return print(aliases[aName] ? aName + '\t' + aliases[aName] : 'no alias ' + aName, aliases[aName] ? '' : 'dim');
      if (KNOWN.indexOf(aName) >= 0) return print(aName + ' is already a command — pick another name', 'err');
      aliases[aName] = aBody; saveAliases();
      return print('alias ' + aName + ' -> ' + aBody, 'ok');
    }

    case 'unalias': {
      var uName = (ops[0] || '').toLowerCase();
      if (!uName) return print('unalias <name>', 'err');
      if (!Object.prototype.hasOwnProperty.call(aliases, uName)) return print('no alias ' + uName, 'dim');
      delete aliases[uName]; saveAliases();
      return print('removed alias ' + uName, 'ok');
    }

    /* ---- mutations: this is a person at a prompt, so they are allowed ---- */

    case 'mkdir':
      if (!target) return print('mkdir needs a path', 'err');
      if (snap.folders.indexOf(target) >= 0) return print(target + '/ already exists', 'dim');
      await files.makeFolder(target);
      remember({ type: 'mkdir', path: target });
      haptic('success');
      return print('created ' + target + '/', 'ok');

    case 'mv': case 'cp': {
      /* v10: several sources or a glob (mv *.md archive/) — the destination must
         be a folder, and the moves run as one batch that one undo reverses. */
      var mSrc = ops.length > 2 || (ops.length === 2 && isGlob(ops[0]));
      if (mSrc){
        var mDest = resolve(ops[ops.length - 1]);
        if (snap.folders.indexOf(mDest) < 0) return print(verb + ' with several sources needs an existing folder last (mkdir it first)', 'err');
        var mList = expandPaths(ops.slice(0, -1), snap, true);
        var missing = mList.filter(function(x){ return x.noMatch; });
        if (missing.length) return print('nothing matches ' + missing[0].noMatch, 'err');
        if (!mList.length) return print('found nothing to ' + verb, 'dim');
        var ownBatch = batchId == null;
        if (ownBatch) batchId = Date.now();
        try {
          for (var mi = 0; mi < mList.length; mi++){
            await run(verb + (flags.f ? ' -f ' : ' ') + '"/' + mList[mi] + '" "/' + mDest + '/' + mList[mi].split('/').pop() + '"');
          }
        } finally { if (ownBatch) batchId = null; }
        return note(mList.length + ' item(s) — one  undo  reverses them all');
      }
      if (verb === 'cp') return copyOne(snap, ops, flags);
      if (ops.length < 2) return print('mv needs a source and a destination', 'err');
      var to = resolve(ops[1]);
      if (!to) return print('mv needs a destination name', 'err');
      /* Checked here, not left to the store: a missing source used to "move"
         nothing and report success, which a batch would sail past. */
      if (!snap.files.some(function(x){ return x.path === target; }) && snap.folders.indexOf(target) < 0)
        return print('No such file or folder: ' + target, 'err');
      var exists = snap.files.some(function(x){ return x.path === to; }) || snap.folders.indexOf(to) >= 0;
      /* The store replaces a destination silently, and a replaced file cannot be
         undone — so say so, and make replacing a deliberate flag. */
      if (exists && !flags.f) return print(to + ' already exists — use  mv -f  to replace it', 'err');
      await files.move(target, to);
      remember({ type: 'mv', from: target, to: to });
      haptic('success');
      return print(target + ' -> ' + to, 'ok');
    }

    case 'write': case 'replace': case 'edit': {
      /* write replaces the whole file; replace swaps text; edit changes lines.
         All three are worked out by planEdit first, which is also what shows a
         proposal's diff before anyone types y. */
      var plan = await planEdit(line);
      if (plan.err) return print(plan.err, 'err');
      if (plan.prev === plan.next) return print('no change to ' + plan.path, 'dim');
      await files.write(plan.path, plan.next);
      remember({ type: 'write', path: plan.path, prev: plan.prev, how: plan.how });
      haptic('success');
      return print(plan.said + '  —  undo  puts it back', 'ok');
    }

    case 'rm': case 'rmdir': {
      if (!target) return print(verb + ' needs a path', 'err');
      var isDir = snap.folders.indexOf(target) >= 0;
      var isFile = snap.files.some(function(x){ return x.path === target; });
      if (!isDir && !isFile) return print('No such file or folder: ' + target, 'err');
      if (verb === 'rm' && isDir) return print(target + ' is a folder — use rmdir', 'err');
      if (verb === 'rmdir' && !isDir) return print(target + ' is not a folder — use rm', 'err');
      var count = isDir ? snap.files.filter(function(x){ return x.path.indexOf(target+'/') === 0; }).length : 1;
      if (inTrash(target) || flags.p){
        /* Already in the trash, or explicitly permanent: this one really is gone,
           so it still has to be said twice. */
        pending = { verb: verb, target: target, count: count };
        return print('delete ' + target + (isDir ? '/ and its ' + count + ' file(s)' : '') + ' for good? no undo — type  y  to confirm', 'err');
      }
      var dest = trashPath(target);
      await files.move(target, dest);
      remember({ type: 'rm', from: target, to: dest, isDir: isDir });
      haptic('warning');
      return print('moved ' + target + (isDir ? '/ (' + count + ' file(s))' : '') + ' to ' + TRASH + '  \u2014  undo  puts it back', 'ok');
    }

    case 'undo': {
      /* Reverses the newest change — all of it, if it was an approved batch.
         The stack is kept in app storage, so it survives closing Shell. */
      if (!undoStack.length) return print('nothing to undo', 'dim');
      var top = undoStack[undoStack.length - 1], group = [];
      if (top.batch != null){ while (undoStack.length && undoStack[undoStack.length - 1].batch === top.batch) group.push(undoStack.pop()); }
      else group.push(undoStack.pop());
      if (group.length > 1) print('undoing a batch of ' + group.length + ' changes', 'dim');
      for (var gi = 0; gi < group.length; gi++){
        var okU = await undoOne(group[gi]);
        if (okU === false){ undoStack.push.apply(undoStack, group.slice(gi).reverse()); break; }
        changeLog.push({ id: Date.now() + Math.random(), t: Date.now(), text: 'undid: ' + describeOp(group[gi]) });
      }
      if (changeLog.length > 200) changeLog.splice(0, changeLog.length - 200);
      saveUndo(); saveLog();
      haptic('success');
      return;
    }

    case 'log': {
      /* Every change made here — by you, or proposals you approved — newest
         first, kept between sessions. "undo" marks what  undo  can still reverse. */
      if (!changeLog.length) return print('no changes yet', 'dim');
      /* log [-n N] [path]: the last N (20), or only the changes that touched a path. */
      var howMany = Math.max(1, Math.min(ops[0] && !isNaN(+ops[0]) ? +ops[0] : n, 200));
      var logPath = ops[0] && isNaN(+ops[0]) ? resolve(ops[0]) : null;
      var live = {}; undoStack.forEach(function(u){ live[u.id] = true; });
      var nextUndo = undoStack.length ? undoStack[undoStack.length - 1].id : null;
      var pool2 = logPath ? changeLog.filter(function(e){ return e.text.indexOf(logPath) >= 0; }) : changeLog;
      if (!pool2.length) return print('found nothing: no logged change touched ' + logPath, 'dim');
      print(pool2.slice(-howMany).reverse().map(function(e, i4){
        return '#' + (i4 + 1) + '\t' + when(e.t) + '\t' + e.text + (e.id === nextUndo ? '   ← undo reverses this' : live[e.id] ? '   (undoable)' : '');
      }).join('\n'));
      return note('trash  lists deleted files;  restore <path>  puts one back');
    }

    case 'history': {
      /* No path? Then you meant the other kind of history — the commands you
         typed. With a path it is the file's own versions, as the native
         workspace_shell tool spells it, and that meaning does not move. */
      if (!ops.length){
        if (!cmdHistory.length) return print('no commands yet', 'dim');
        var hStart = Math.max(0, cmdHistory.length - 30);
        print(cmdHistory.slice(hStart).map(function(c, i){ return (hStart + i + 1) + '\t' + c; }).join('\n'));
        return print('!5 runs number 5, !! runs the last one again', 'dim');
      }
      if (!files.versions) return print('Version history needs the latest MyLLM build.', 'err');
      var vs = await files.versions(target);
      if (!vs.length) return print('No previous versions of ' + target + ' \u2014 versions are kept from the first overwrite or delete.', 'dim');
      print(vs.map(function(v, i){ return '#' + (i + 1) + '\t' + when(v.stamp) + '\t' + bytes(v.size); }).join('\n'));
      return print('revert ' + target + ' N  puts one back', 'dim');
    }

    case 'revert': {
      if (!target) return print('revert needs a path', 'err');
      if (!files.restoreVersion) return print('Version history needs the latest MyLLM build.', 'err');
      var vn = ops[1] ? parseInt(ops[1], 10) : 1;
      var vlist = await files.versions(target);
      if (!vlist.length) return print('No previous versions of ' + target, 'dim');
      if (!(vn >= 1 && vn <= vlist.length)) return print('revert: choose 1\u2013' + vlist.length + ' (see  history ' + target + ')', 'err');
      /* The store snapshots the current bytes before restoring, so undo is
         simply "restore the newest version". */
      await files.restoreVersion(target, vlist[vn - 1].stamp);
      remember({ type: 'revert', path: target });
      haptic('success');
      return print('reverted ' + target + ' to #' + vn + ' (' + when(vlist[vn - 1].stamp) + ')  \u2014  undo  puts it back', 'ok');
    }

    case 'trash': {
      if ((ops[0] || '').toLowerCase() === 'empty'){
        var all = await snapshot(true);
        var inside = all.files.filter(function(x){ return inTrash(x.path); });
        if (!inside.length && all.folders.indexOf(TRASH) < 0) return print(TRASH + ' is empty', 'dim');
        pending = { verb: 'trash-empty', count: inside.length };
        return print('delete ' + inside.length + ' file(s) in ' + TRASH + ' for good? no undo — type  y  to confirm', 'err');
      }
      var allT = await snapshot(true);
      if (allT.folders.indexOf(TRASH) < 0) return print(TRASH + ' is empty', 'dim');
      print(TRASH + '/  \u2014  restore <path> puts something back, trash empty clears it', 'dim');
      return listing(allT, TRASH, true);
    }

    case 'restore': {
      if (!ops[0]) return print('restore needs a path as shown by  trash', 'err');
      var all2 = await snapshot(true);
      var src = normalise(ops[0]);
      if (!inTrash(src)) src = TRASH + '/' + src;
      var back = src.slice(TRASH.length + 1).replace(/~\d{14}(?=\.[^.\/]+$|$)/, '');
      var known = all2.files.some(function(x){ return x.path === src; }) || all2.folders.indexOf(src) >= 0;
      if (!known) return print('Not in ' + TRASH + ': ' + src.slice(TRASH.length + 1), 'err');
      var clash = all2.files.some(function(x){ return x.path === back; }) || all2.folders.indexOf(back) >= 0;
      if (clash && !flags.f) return print(back + ' already exists — use  restore -f  to replace it', 'err');
      await files.move(src, back);
      await pruneTrash();
      remember({ type: 'mv', from: src, to: back });
      haptic('success');
      return print('restored ' + back, 'ok');
    }

    default:
      /* Not a command? Then it was a question. This is the line that turns a
         terminal into an assistant that happens to live in a directory. */
      print('thinking…', 'dim');
      return agent(line);
  }
}

function remember(op){
  op.id = Date.now() + Math.random();
  if (batchId != null) op.batch = batchId;
  undoStack.push(op);
  if (undoStack.length > 30) undoStack.shift();
  changeLog.push({ id: op.id, t: Date.now(), text: describeOp(op) + (op.batch != null ? '  (batch)' : '') });
  if (changeLog.length > 200) changeLog.shift();
  saveUndo(); saveLog();
}
function describeOp(op){
  switch (op.type){
    case 'rm': return 'moved ' + op.from + (op.isDir ? '/' : '') + ' to ' + TRASH;
    case 'mv': return op.from + ' -> ' + op.to;
    case 'mkdir': return 'created ' + op.path + '/';
    case 'write': return (op.how || (op.prev == null ? 'created ' : 'changed ')) + op.path;
    case 'revert': return 'reverted ' + op.path;
    case 'cp': return 'copied ' + op.items.length + ' file(s) to ' + op.to;
  }
  return op.type;
}
/* Reverse one change. Returns false when it cannot be done safely. */
async function undoOne(op){
  switch (op.type){
    case 'rm': await files.move(op.to, op.from); await pruneTrash(); print('restored ' + op.from, 'ok'); break;
    case 'revert': {
      var rv = files.versions ? await files.versions(op.path) : [];
      if (rv.length) { await files.restoreVersion(op.path, rv[0].stamp); print('restored ' + op.path + ' to before the revert', 'ok'); }
      else print('nothing to restore for ' + op.path, 'dim');
      break;
    }
    case 'mv': await files.move(op.to, op.from); print(op.to + ' -> ' + op.from, 'ok'); break;
    case 'mkdir': await files.removeFolder(op.path, false); print('removed ' + op.path + '/', 'ok'); break;
    case 'write':
      if (op.prevLost){ print('cannot undo ' + op.path + ': the earlier text was too big to keep after Shell closed — try  history ' + op.path, 'err'); return false; }
      if (op.prev == null){ await files.remove(op.path); print('removed ' + op.path, 'ok'); }
      else { await files.write(op.path, op.prev); print('restored ' + op.path + ' (' + op.prev.length + ' chars)', 'ok'); }
      break;
    case 'cp':
      for (var i = op.items.length - 1; i >= 0; i--){
        var it = op.items[i];
        if (it.prevLost){ print('cannot restore ' + it.path + ': the earlier text was too big to keep', 'err'); continue; }
        if (it.prev == null) await files.remove(it.path); else await files.write(it.path, it.prev);
      }
      print('undid the copy of ' + op.items.length + ' file(s)', 'ok'); break;
  }
  return true;
}

function listing(snap, root, recursive, sortBy, opt){
  opt = opt || {};
  var prefix = root ? root + '/' : '';
  /* tree -L N: only N levels below where you started. */
  var baseDepth = prefix ? prefix.split('/').length - 1 : 0;
  var within = function(p){ return !opt.depth || p.split('/').length - baseDepth <= opt.depth; };
  if (root && snap.folders.indexOf(root) < 0){
    var one = snap.files.filter(function(f){ return f.path === root; })[0];
    if (one) return printHTML(pathHTML(one.path) + '\t<span class="dim">' + one.size + 'B\t' + when(one.modified*1000) + '</span>');
    return print('No such file or folder: ' + root, 'err');
  }
  var depth = prefix ? prefix.split('/').length : 1;
  var subs = snap.folders.filter(function(f){
    return f.indexOf(prefix) === 0 && f !== root && (recursive || f.split('/').length === depth) && within(f);
  }).sort();
  var here = snap.files.filter(function(f){
    return f.path.indexOf(prefix) === 0 && (recursive || f.path.split('/').length === depth) && within(f.path);
  }).sort(function(a,b){
    /* -t newest first, -S biggest first; otherwise by name */
    if (sortBy === 't' && a.modified !== b.modified) return b.modified - a.modified;
    if (sortBy === 'S' && a.size !== b.size) return b.size - a.size;
    return a.path < b.path ? -1 : 1;
  });
  if (!subs.length && !here.length) return print(root ? root + '/ is empty' : 'The workspace is empty', 'dim');
  if (opt.long){
    /* ls -l: one aligned line each — readable size, modified, name. There is
       no owner column: everything in the workspace is yours. */
    var pad = function(t, w){ t = String(t); return t.length >= w ? t : '        '.slice(0, w - t.length) + t; };
    var rowsL = subs.map(function(d){
      var inD = snap.files.filter(function(x){ return x.path.indexOf(d + '/') === 0; });
      var newest = inD.reduce(function(m, x){ return Math.max(m, x.modified); }, 0);
      return '<span class="dim">d ' + pad(bytes(inD.reduce(function(a, b){ return a + b.size; }, 0)), 7) + '  ' + (newest ? when(newest*1000) : '                ') + '  </span>' + '<span class="dir">' + pathHTML(d, d.slice(prefix.length) + '/') + '</span><span class="dim">  (' + inD.length + ')</span>';
    }).concat(here.map(function(f){
      return '<span class="dim">- ' + pad(bytes(f.size), 7) + '  ' + when(f.modified*1000) + '  </span>' + pathHTML(f.path, f.path.slice(prefix.length));
    }));
    printHTML(rowsL.join('\n'));
    return note(here.length + ' file(s), ' + subs.length + ' folder(s), ' + bytes(here.reduce(function(a, b){ return a + b.size; }, 0)));
  }
  var html = subs.map(function(d){ return '<span class="dir">' + pathHTML(d, d + '/') + '</span>'; })
    .concat(here.map(function(f){
      return pathHTML(f.path) + '\t<span class="dim">' + f.size + 'B\t' + when(f.modified*1000) + '</span>';
    })).join('\n');
  printHTML(html);
}

/* ================= the assistant, inside the directory =================
   Type anything that is not a command and it becomes a question. The model is
   given the working directory and the command list, and answers with ONE JSON
   object per turn: run a command, or say something. The app executes the
   command locally and feeds the output back — which is the whole trick, because
   myllmAsk has no tools of its own. The shell commands ARE the tools.

   READ-ONLY autonomously. Anything that writes or deletes comes back as a
   proposal the user has to accept: a model running rm across someone's
   documents unattended is the one outcome worth designing against. */

var READ_ONLY = ['ls','dir','tree','cat','head','tail','sed','stat','find','grep','diff','jq','wc','sort','uniq','cut','tr','paste','comm','awk','xargs','man','changes','history','du','pwd','log'];
var MAX_STEPS = 5;          /* myllmAsk is rate-limited; five is plenty and stays inside it */

/* The system prompt for the `ask` VERB — a filter, not an assistant. Anything
   it says that is not the answer ends up in the user's file, so say none of it. */
var FILTER_SYSTEM = [
  'You are a filter in a command-line pipeline, inside the user\'s file workspace.',
  'Do exactly what the instruction asks of the material you are given, and output ONLY the result.',
  'No preamble, no sign-off, no explanation of what you did, no markdown code fences.',
  'Plain text unless the instruction asks for another format. Never invent material you were not given.'
].join('\n');

function systemPrompt(listing){
  return [
    'You are working inside a directory of the user\'s MyLLMos shared workspace, like a terminal assistant.',
    'Current directory: /' + (cwd || ''),
    '',
    'Contents right now:',
    listing || '(empty)',
    '',
    'You may run these READ-ONLY commands: ls [-R] [-t newest first | -S biggest first] [path], tree [path], cat <path>, head -n N <path>, tail -n N <path>, sed -n \'40,80p\' <path> (a line range), stat <path>, find <glob> [-mtime -7] [-newer <path>] [-size +10k] [-type d], grep [-n] [-C N] [-v] [-c] [-l] [-s] <text or /regex/> [path], diff <a> <b> or diff <path>@N (version N vs now), jq \'.field\' <path> (pull values out of JSON: .a.b, .list[0], .list[], keys, length), wc [-l], sort [-r] [-n] [-k N], uniq [-c], cut -d X -f N, history <path> (previous versions), log (recent changes), du.',
    'You may pipe them: `a | b` sends a\'s output into b, and cat, head, tail, sed, grep, wc, sort, uniq, cut and jq read what is piped in — e.g. `grep -l invoice notes | wc -l` or `find *.md | cut -d / -f 1 | sort | uniq -c | sort -rn`. One pipeline is one step, so prefer it over three separate looks.',
    'Paths are relative to the current directory. There is no cd.',
    'Writing output to a file with > or >> is a CHANGE: propose it, never run it.',
    '',
    'Reply with ONE JSON object and nothing else:',
    '  {"run":"<command>"}                     to look at something first',
    '  {"say":"<answer>"}                      when you can answer',
    '  {"propose":"<command>","why":"<reason>"} to CHANGE something (mkdir, mv, cp, write, replace, edit, rm, rmdir, revert <path> N) — the user approves it, you never run it. rm moves to a trash folder and can be undone; revert puts a previous version back.',
    '  {"propose":["<command>","<command>",…],"why":"<reason>"} for several changes approved together, e.g. a folder reorganisation: they run in order, stop at the first failure, and one undo reverses all of them.',
    'To change part of a file, propose a SMALL edit rather than rewriting it: replace <path> "old text" "new text" (every occurrence; -1 for the first only), or edit <path> <A-B> "new lines" (\\n for a line break; empty text deletes the lines; <A>+ inserts after line A). The user sees the diff before approving. Use write only for a new file or a full rewrite.',
    '',
    'More read-only tools: tr, paste, comm, awk \'{print $N}\', xargs <read-only command> (e.g. grep -l x | xargs head -n 3), and man <command> for its exact flags. Run `man <cmd>` instead of guessing a flag; `changes` lists what Shell can do now.',
    'Each output ends with [status: ok], [status: found nothing] or [status: failed]; a blocked command says why.',
    'Prefer running a command over guessing. Answer in plain prose, briefly. Do not invent file contents.'
  ].join('\n');
}

async function runCaptured(line){
  /* The agent's steps stay visible on screen (silent: false) — watching it look
     around is most of why the loop is trustworthy. Each output ends with a
     status the model can't misread: ok, found nothing, or failed (and why). */
  var text = await captureOf(function(){ return runLine(line); }, false);
  var failed = lastCaptureError;
  var empty = !text.trim() || /^(found nothing|no match|no file matches|nothing matches|.* is empty$)/i.test(text.trim());
  var status = failed ? '[status: failed — the error is above]' : empty ? '[status: found nothing]' : '[status: ok]';
  if (text.length > 4000) text = text.slice(0, 4000) + '\n[truncated]';
  return text + '\n' + status;
}

function parseReply(raw){
  var t = String(raw || '').trim();
  /* Models fence JSON even when told not to. */
  t = t.replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
  var a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a < 0 || b < a) return null;
  try { return JSON.parse(t.slice(a, b + 1)); } catch(e){ return null; }
}

async function agent(question){
  if (!window.myllmAsk){
    print('AI is off for apps — turn on "Allow apps to use the AI" in MyLLMos settings.', 'err');
    return;
  }
  var snap = await snapshot();
  capture = []; listing(snap, cwd, false); var here = capture.join('\n'); capture = null;

  var transcript = 'User: ' + question;
  for (var step = 0; step < MAX_STEPS; step++){
    var raw;
    try { raw = await myllmAsk(transcript + '\n\nReply with one JSON object.', { system: systemPrompt(here) }); }
    catch(e){ print('ask failed: ' + (e.message || e), 'err'); return; }

    var reply = parseReply(raw);
    if (!reply){
      /* Not JSON — treat it as the answer rather than failing in the user's face. */
      print(String(raw).trim(), 'say');
      return;
    }
    if (reply.say){ print(String(reply.say).trim(), 'say'); return; }

    if (reply.propose){
      var why = reply.why ? ' — ' + reply.why : '';
      /* A list (or a multi-line string) is a batch: one approval, run in order. */
      var steps = Array.isArray(reply.propose) ? reply.propose.map(String)
        : String(reply.propose).split('\n');
      steps = steps.map(function(x){ return x.trim(); }).filter(Boolean).slice(0, 20);
      if (!steps.length){ print(String(raw).trim(), 'say'); return; }
      if (steps.length === 1){
        print('proposes: ' + steps[0] + why, 'propose');
        await previewEdit(steps[0]);
        print('run it? type  y  to confirm', 'propose');
        pending = { verb: 'raw', line: steps[0] };
        return;
      }
      print('proposes ' + steps.length + ' changes' + why + ':', 'propose');
      for (var si2 = 0; si2 < steps.length; si2++){
        print('  ' + (si2 + 1) + '. ' + steps[si2], 'propose');
        await previewEdit(steps[si2]);
      }
      print('run all ' + steps.length + '? type  y  to confirm — one  undo  reverses the lot', 'propose');
      pending = { verb: 'batch', lines: steps };
      return;
    }
    if (reply.run){
      var cmd = String(reply.run).trim();
      /* Every stage, not just the first verb — and a redirect turns a pipeline
         of read-only commands into a write, which is exactly the hole worth
         closing before the model finds it. */
      var why = unsafeReason(cmd, READ_ONLY);
      if (why){
        print('blocked: ' + cmd + ' — ' + why, 'dim');
        transcript += '\n\nAssistant tried: ' + cmd + '\n[status: blocked — ' + why + ']. Use "propose" for anything that changes files.';
        continue;
      }
      print('$ ' + cmd, 'step');
      var output = await runCaptured(cmd);
      transcript += '\n\nAssistant ran: ' + cmd + '\nOutput:\n' + (output || '(no output)');
      continue;
    }
    print(String(raw).trim(), 'say');
    return;
  }
  print('Stopped after ' + MAX_STEPS + ' steps. Ask something narrower, or run the commands yourself.', 'dim');
}

/* ---------- prompt ---------- */

document.getElementById('form').addEventListener('submit', async function(ev){
  ev.preventDefault();
  var line = input.value.trim();
  input.value = '';
  if (!line) return;

  if (pending){
    var p = pending; pending = null;
    if (line.toLowerCase() === 'y' || line.toLowerCase() === 'yes'){
      try{
        if (p.verb === 'raw'){ print('$ ' + p.line, 'cmd'); await runLine(p.line); }
        else if (p.verb === 'batch'){
          batchId = Date.now();
          try {
            for (var bi = 0; bi < p.lines.length; bi++){
              print('$ ' + p.lines[bi], 'cmd');
              await captureOf(function(){ return runLine(p.lines[bi]); }, false);
              if (lastCaptureError){ print('stopped at step ' + (bi + 1) + ' of ' + p.lines.length + ' — undo reverses the steps that ran', 'err'); break; }
            }
          } finally { batchId = null; }
        }
        else if (p.verb === 'trash-empty') await files.removeFolder(TRASH, true);
        else if (p.verb === 'rm') await files.remove(p.target);
        else await files.removeFolder(p.target, true);
        haptic('warning');
        if (p.verb === 'trash-empty') print('emptied ' + TRASH, 'ok');
        else if (p.verb !== 'raw' && p.verb !== 'batch') print('deleted ' + p.target, 'ok');
      }catch(e){ print(e.message, 'err'); }
    } else print('cancelled', 'dim');
    paintPrompt(); renderChips();
    return;
  }

  /* !! and friends resolve here, so the scrollback and the history both record
     the command that actually ran rather than the shorthand for it. */
  if (line.charAt(0) === '!'){
    var recalled = expandBang(line);
    if (!recalled){ print(prompt$() + ' \u276f ' + line, 'cmd'); print('no matching command in history', 'err'); renderChips(); return; }
    line = recalled;
  }

  cmdHistory.push(line); hIndex = cmdHistory.length;
  if (cmdHistory.length > 200) cmdHistory.shift();
  saveHistory();
  print(prompt$() + ' \u276f ' + line, 'cmd');
  try { await runLine(line); }
  catch(e){ print(String(e && e.message || e), 'err'); }
  stdin = null;
  paintPrompt();
  renderChips();
});

/* Up/down through history, as a shell does. */
input.addEventListener('keydown', function(e){
  if (e.key === 'ArrowUp'){ if (hIndex > 0){ hIndex--; input.value = cmdHistory[hIndex]; } e.preventDefault(); }
  if (e.key === 'ArrowDown'){ if (hIndex < cmdHistory.length-1){ hIndex++; input.value = cmdHistory[hIndex]; } else { hIndex = cmdHistory.length; input.value = ''; } e.preventDefault(); }
});

/* ---------- completion, for a keyboard with no Tab key ----------
   The chip row follows what you type: verbs while you type the first word,
   then names from the folder you are pointing at. A folder completes with a
   trailing slash and keeps going. Empty input shows the usual shortcuts. */
var chipsEl = document.getElementById('chips');
var DEFAULT_CHIPS = ['ls','ls -R','ask ','grep ','open ','help'];
var SINKS = ['grep','sort','uniq','wc','cut','jq','head','ask'];   /* the commands that read a pipe */
/* The last | that is not inside quotes. */
function lastPipe(v){
  var q = null, at = -1;
  for (var i = 0; i < v.length; i++){
    var c = v.charAt(i);
    if (q){ if (c === q) q = null; continue; }
    if (c === '"' || c === "'") q = c;
    else if (c === '|') at = i;
    else if (c === '>') return at;   /* past a redirect you are naming a file again */
  }
  return at;
}

function chip(label, cls, onTap){
  var b = document.createElement('button');
  b.className = 'chip' + (cls ? ' ' + cls : ''); b.type = 'button'; b.textContent = label;
  b.addEventListener('pointerdown', function(e){ e.preventDefault(); });  /* keep the keyboard up */
  b.addEventListener('click', onTap);
  return b;
}
function setInput(v){ input.value = v; input.focus(); renderChips(); }

function renderChips(){
  chipsEl.innerHTML = '';
  var v = input.value, atStart = v.length === 0;
  if (pending){ [['y','ok'],['n','dim']].forEach(function(x){ chipsEl.appendChild(chip(x[0], '', function(){ setInput(x[0]); })); }); return; }
  if (atStart){
    DEFAULT_CHIPS.forEach(function(c){ chipsEl.appendChild(chip(c, '', function(){ setInput(c); })); });
    if (undoStack.length) chipsEl.appendChild(chip('undo', 'undo', function(){ setInput('undo'); }));
    if (cwd) chipsEl.appendChild(chip('cd ..', 'dirc', function(){ setInput('cd ..'); }));
    return;
  }
  var endsWithSpace = /\s$/.test(v);
  var tokens = tokenize(v);
  var partial = endsWithSpace ? '' : (tokens[tokens.length - 1] || '');
  var head = endsWithSpace ? v : v.slice(0, v.length - partial.length);
  /* Completion follows the STAGE, not the line: after a pipe you are naming a
     command again, so offering file names there would be offering the one thing
     that cannot go next. */
  var pipeAt = lastPipe(v);
  var stageTokens = tokenize(pipeAt >= 0 ? v.slice(pipeAt + 1) : v);
  var firstWord = stageTokens.length === 0 || (stageTokens.length === 1 && !endsWithSpace);
  var items = [];
  if (firstWord){
    /* Straight after a pipe, lead with the commands that can actually read one. */
    if (pipeAt >= 0 && !partial)
      SINKS.forEach(function(x){ items.push({ label: x, value: x + ' ', cls: 'comp' }); });
    Object.keys(aliases).sort().filter(function(x){ return x.indexOf(partial.toLowerCase()) === 0 && x !== partial; })
      .forEach(function(x){ items.push({ label: x, value: x + ' ', cls: 'undo' }); });
    VERBS.filter(function(x){ return x.indexOf(partial.toLowerCase()) === 0 && x !== partial
                                     && !(pipeAt >= 0 && !partial && SINKS.indexOf(x) >= 0); })
      .forEach(function(x){ items.push({ label: x, value: x + ' ', cls: '' }); });
  } else if (lastSnap){
    var slash = partial.lastIndexOf('/');
    var dirPart = slash >= 0 ? partial.slice(0, slash + 1) : '';
    var namePart = slash >= 0 ? partial.slice(slash + 1) : partial;
    var base = resolve(dirPart || '.');
    var prefix = base ? base + '/' : '';
    var depth = prefix ? prefix.split('/').length : 1;
    var seen = {};
    var showHidden = inTrash(base) || namePart.charAt(0) === '.';
    lastSnap.folders.forEach(function(d){
      if (d.indexOf(prefix) !== 0 || d === base || d.split('/').length !== depth) return;
      if (!showHidden && inTrash(d)) return;
      var name = d.slice(prefix.length);
      if (name.toLowerCase().indexOf(namePart.toLowerCase()) === 0 && !seen[name]){ seen[name] = 1; items.push({ label: name + '/', value: dirPart + name + '/', cls: 'dirc' }); }
    });
    lastSnap.files.forEach(function(f){
      if (f.path.indexOf(prefix) !== 0 || f.path.split('/').length !== depth) return;
      if (!showHidden && inTrash(f.path)) return;
      var name = f.path.slice(prefix.length);
      if (name.toLowerCase().indexOf(namePart.toLowerCase()) === 0 && !seen[name] && name !== namePart){ seen[name] = 1; items.push({ label: name, value: dirPart + name, cls: 'comp' }); }
    });
    if (base && !namePart) items.push({ label: '..', value: dirPart + '../', cls: 'dirc' });
  }
  /* On a phone | and > live two taps down in the symbol plane, which is enough
     friction to stop anyone discovering pipelines at all. */
  if (!firstWord && isCommandLine(v) && !/[|>]/.test(v)){
    var base = v.replace(/\s+$/, '');
    items.unshift({ label: '>', value: null, cls: 'undo', raw: base + ' > ' });
    items.unshift({ label: '|', value: null, cls: 'undo', raw: base + ' | ' });
  }

  items.slice(0, 12).forEach(function(it){
    chipsEl.appendChild(chip(it.label, it.cls, function(){
      if (it.raw != null) return setInput(it.raw);
      var val = /[\s"']/.test(it.value) ? '"' + it.value + '"' : it.value;
      setInput(head + val);
    }));
  });
  if (!items.length && !firstWord) DEFAULT_CHIPS.slice(0, 3).forEach(function(c){ chipsEl.appendChild(chip(c, 'dim', function(){ setInput(c); })); });
}
input.addEventListener('input', renderChips);
input.addEventListener('focus', renderChips);

/* Tap a path the shell printed and it lands in the prompt — appended after a
   space if you were mid-command, or on its own if the prompt was empty. */
out.addEventListener('click', function(e){
  var el = e.target.closest('.path');
  if (!el) return;
  var p = el.getAttribute('data-path');
  if (cwd && p.indexOf(cwd + '/') === 0) p = p.slice(cwd.length + 1);   /* relative to where you stand */
  else if (cwd) p = '/' + p;
  var val = /[\s"']/.test(p) ? '"' + p + '"' : p;
  var v = input.value;
  setInput(v && !/\s$/.test(v) ? v + ' ' + val : v + val);
  haptic('selection');
});
renderChips();

paintPrompt();
print('MyLLMos workspace shell. Type  help  for commands.', 'dim');
print('Anything that is not a command is a question — MyLLM answers it from here,', 'dim');
print('running the read-only commands itself and asking before it changes anything.', 'dim');
print('Pipe things about:  cat notes.md | ask "summarise this" > summary.md', 'dim');
print('rm moves things to .trash and  undo  reverses your last change. Tap any path to use it.', 'dim');

/* History and aliases come back from storage before anything runs, so .shellrc
   can use an alias it defined last time and !! works on the first line typed. */
(async function boot(){
  await loadState();
  renderChips();
  if (!window.myllmFiles){ print('\nShared files are off — turn them on in MyLLMos settings.', 'err'); return; }
  try { await runRC(); } catch(e){ print('.shellrc: ' + (e && e.message || e), 'err'); }
  await runLine('ls');
  paintPrompt();
  renderChips();
})();
</script>
</body></html>
