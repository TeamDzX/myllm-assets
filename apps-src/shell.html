<title>Shell</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#0d1117;color:#d6deeb;
       font:13.5px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
       display:flex;flex-direction:column;height:100dvh;overflow:hidden}
  header{padding:10px 14px;border-bottom:1px solid #1e2733;display:flex;align-items:center;gap:10px}
  header b{font-size:14px;color:#e7eef8;font-weight:650}
  header .hint{font-size:11.5px;color:#6b7a90}
  #out{flex:1;overflow:auto;padding:12px 14px 4px;white-space:pre-wrap;word-break:break-word}
  .cmd{color:#7ee787}
  .err{color:#ff7b72}
  .ok{color:#79c0ff}
  .dim{color:#6b7a90}
  .dir{color:#79c0ff;font-weight:650}
  /* The composer, shaped like Claude Code's: one quiet bordered box with a
     chevron, the text filling it, and a status line underneath. No Run button —
     Return submits, and a button competing with the prompt is the thing that
     made this look like a form rather than a terminal. */
  .composer{padding:0 12px calc(12px + env(safe-area-inset-bottom));background:#0d1117}
  .composer hr{border:0;border-top:1px solid #1e2733;margin:0 -12px 10px}
  form{display:flex;gap:9px;align-items:center;background:#0d1117;
       border:1px solid #2a3646;border-radius:10px;padding:11px 12px}
  form:focus-within{border-color:#3c5680}
  .ps1{color:#6b7a90;align-self:center;user-select:none}
  input{flex:1;min-width:0;background:transparent;border:0;color:#d6deeb;padding:0;
        font:13.5px ui-monospace,SFMono-Regular,Menlo,monospace}
  input:focus{outline:none}
  input::placeholder{color:#3f4c5f}
  /* One line, always. A status bar that wraps stops reading as a status bar —
     the left half truncates, the right half is short enough never to. */
  .statusbar{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
             padding:8px 3px 0;font-size:11.5px;color:#6b7a90;white-space:nowrap}
  .statusbar .left{color:#7ee787;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .statusbar .right{color:#6b7a90;flex:none}
  .chips{display:flex;gap:6px;overflow-x:auto;padding:0 12px 10px}
  .chip{background:#111823;border:1px solid #1e2733;color:#9db2cd;border-radius:999px;
        padding:6px 11px;font-size:12px;white-space:nowrap}
  .ask{color:#c9a3ff}
  .step{color:#6b7a90;border-left:2px solid #2d3a4d;padding-left:9px;margin:3px 0}
  .say{color:#e7eef8;border-left:2px solid #7ee787;padding-left:9px;margin:6px 0 8px;white-space:pre-wrap}
  .propose{color:#ffb86b;border-left:2px solid #ffb86b;padding-left:9px;margin:6px 0}
  .ps1{color:#7ee787;align-self:center;white-space:nowrap;max-width:46%;overflow:hidden;text-overflow:ellipsis}
  /* Tappable paths: a phone has no Tab key, so anything the shell prints that
     you might type next can be tapped into the prompt instead. */
  .path{cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-decoration-color:#3c5680;text-underline-offset:3px}
  .chip.comp{color:#7ee787;border-color:#2d3a4d}
  .chip.dirc{color:#79c0ff}

<body>

<header>
  <b>Shell</b>
  <span class="hint">the shared workspace, on the command line</span>
</header>

<div id="out"></div>

<div class="chips" id="chips"></div>

<div class="composer">
  <hr>
  <form id="form" autocomplete="off">
    <span class="ps1">&#10095;</span>
    <input id="in" placeholder="a command, or a question" autocapitalize="off" autocorrect="off" spellcheck="false">
  </form>
  <div class="statusbar">
    <span class="left" id="statusLeft">~</span>
    <span class="right" id="statusRight"></span>
  </div>
</div>

<script>
/* Shell over the MyLLMos shared workspace.
   The command grammar deliberately MATCHES the assistant's `workspace_shell`
   tool, so what you learn here is what you can ask MyLLM for in words — and what
   it prints back to you looks like what it prints back to itself.

   Difference: you are a person at a prompt, so this one can also WRITE. The
   store itself has no trash and no undo, so this app supplies both: rm moves
   into a hidden .trash folder, and undo reverses the last change. */
var files = window.myllmFiles || null;
var out = document.getElementById('out');
var input = document.getElementById('in');
/* NOT `history` — that is window.history (the History API), so `var history`
   silently keeps the built-in and cmdHistory.push is undefined. The runtime
   harness caught this; a regex scan never would. */
var cmdHistory = [];
var hIndex = -1;
var pending = null;      /* a confirmation waiting on y/n */
var cwd = '';            /* current directory, '' = workspace root */
var TRASH = '.trash';    /* where rm puts things; hidden from ls unless -a or you cd into it */
var undoStack = [];      /* this session's reversible changes, newest last */
var lastSnap = null;     /* most recent listing, for completion chips */
var stdin = null;        /* text piped into the next stage of a pipeline */
var aliases = {};        /* name -> expansion, kept in myllmStorage */
var store = window.myllmStorage || null;
var HISTORY_KEY = 'shell.history', ALIAS_KEY = 'shell.aliases';
var RC = '.shellrc';     /* optional startup script, in the workspace root */
var ASK_MAX = 8000;      /* how much material one `ask` may carry; a small on-device model has a small window */
var VERBS = ['ls','tree','cat','head','tail','stat','find','grep','history','du','ask','dictate','open','share','mkdir','mv','write','rm','rmdir','undo','revert','trash','restore','alias','unalias','cd','pwd','clear','help'];
var KNOWN = VERBS.concat(['dir']);   /* everything the switch below answers to */
function inTrash(path){ return path === TRASH || path.indexOf(TRASH + '/') === 0; }

/* The APP may be stateful — you are standing somewhere. The assistant's
   workspace_shell tool deliberately is NOT: state that persists between tool
   calls is a trap for a model that cannot see the prompt. Same grammar, one
   extra verb here. */
function resolve(p){
  var s = String(p||'').trim();
  if (!s || s === '.') return cwd;
  if (s.charAt(0) === '/') return normalise(s);
  if (s === '..') return cwd.indexOf('/') < 0 ? '' : cwd.slice(0, cwd.lastIndexOf('/'));
  var joined = cwd ? cwd + '/' + s : s;
  /* collapse any a/b/../c the model or user typed */
  var parts = [];
  normalise(joined).split('/').forEach(function(seg){
    if (seg === '..') parts.pop(); else if (seg && seg !== '.') parts.push(seg);
  });
  return parts.join('/');
}
function prompt$(){ return cwd ? '~/' + cwd : '~'; }

/* Left: where you are. Right: what the workspace costs. Both refresh after any
   command, so the bar is a live readout rather than decoration. */
async function paintPrompt(){
  var l = document.getElementById('statusLeft');
  if (l) l.textContent = prompt$() + (undoStack.length ? '  \u00b7  undo \u00d7' + undoStack.length : '');
  var r = document.getElementById('statusRight');
  if (r && files){
    try{
      var list = (await files.list()).filter(function(f){ return !inTrash(f.path); });
      var total = list.reduce(function(a,b){ return a + b.size; }, 0);
      r.textContent = list.length + (list.length === 1 ? ' file' : ' files') + '  \u00b7  ' + bytes(total);
    }catch(e){ r.textContent = ''; }
  }
}

/* Two lines an entry, not one padded to a column. The old shape assumed a
   terminal ~78 characters wide; this one is ~44 on a phone, so every line wrapped
   and the list read as rubble. A command and its description, each on its own
   line, never wraps raggedly however long the description gets. */
var HELP = [
  ['ls [-R] [path]', 'list a folder (-R for the whole tree)'],
  ['tree [path]', 'same as ls -R'],
  ['cat <path>', 'print a file'],
  ['head [-n N] <path>', 'the first N lines (default 20)'],
  ['tail [-n N] <path>', 'the last N lines'],
  ['stat <path>', 'size, modified, type'],
  ['find <glob>', 'match filenames, e.g. find *.json'],
  ['grep <text> [path]', 'search inside files (-l for names)'],
  ['du', 'space used per folder'],
  '',
  ['ask "<question>"', 'ask MyLLM; pipe a file in to work on it'],
  ['dictate', 'speak instead of typing'],
  ['open <path>', 'open the file in another app'],
  ['share <path>', 'send the file out through iOS'],
  '',
  ['a | b', 'send a\'s output into b'],
  ['', 'cat, head, tail, grep, ask all read one'],
  ['> <path>', 'put the output in a file'],
  ['>> <path>', 'add it to the end of one instead'],
  '',
  ['mkdir <path>', 'create a folder'],
  ['mv <from> <to>', 'move or rename (-f replaces)'],
  ['write <path> <text>', 'replace a file with that text'],
  ['rm <path>', 'move a file to .trash'],
  ['rmdir <path>', 'move a folder to .trash'],
  ['rm -p / rmdir -p', 'delete for good; asks first'],
  ['undo', 'reverse your last change'],
  ['trash', 'what is in .trash'],
  ['restore <path>', 'put something back from .trash'],
  ['trash empty', 'delete all of it for good; asks first'],
  ['history <path>', 'previous versions of a file'],
  ['revert <path> [N]', 'put version N back (1 = newest)'],
  '',
  ['history', 'the commands you have typed'],
  ['!!', 'run the last one again'],
  ['!5   !gr', 'number 5, or the last one starting gr'],
  ['alias ll "ls -R"', 'make a shortcut'],
  ['alias / unalias ll', 'list them / remove one'],
  ['.shellrc', 'its lines run when Shell opens'],
  ['cd <path>', 'change directory (cd .. goes up)'],
  ['ls -a', 'show .trash too'],
  ['clear', 'clear the screen'],
  ['help', 'this list'],
  '',
  'Anything else is a question for MyLLM. It',
  'can run the read-only commands above to',
  'answer, and asks before changing anything.',
  '',
  'Try:',
  'cat notes.md | ask "sum this up" > out.md'
];
function helpHTML(){
  return HELP.map(function(row){
    if (typeof row === 'string') return row ? '<span class="dim">' + esc(row) + '</span>' : '';
    return '<span class="cmd">' + esc(row[0]) + '</span>\n<span class="dim">   ' + esc(row[1]) + '</span>';
  }).join('\n');
}


function esc(s){ return String(s==null?'':s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* capture: when set, print() also COLLECTS text — for the agent loop, and for
   each stage of a pipeline. quiet: and does not put it on screen, which is what
   makes `cat big.md | ask "summarise"` show the summary and not the file. */
var capture = null;
var quiet = false;
var captureHadError = false;   /* did this capture print anything in red? */
var lastCaptureError = false;  /* ...read by the caller straight after captureOf */

function print(text, cls){
  if (capture !== null){
    capture.push(String(text));
    if (cls === 'err') captureHadError = true;
  }
  if (quiet) return;
  var d = document.createElement('div');
  if (cls) d.className = cls;
  d.innerHTML = esc(text);
  out.appendChild(d);
  out.scrollTop = out.scrollHeight;
}
function printHTML(html){
  if (capture !== null) capture.push(html.replace(/<[^>]+>/g, ''));
  if (quiet) return;
  var d = document.createElement('div');
  d.innerHTML = html;
  out.appendChild(d);
  out.scrollTop = out.scrollHeight;
}
/* On screen only: never captured, never piped, removable. For "asking\u2026",
   which belongs to the person watching and not to the file being written. */
function status(text){
  var d = document.createElement('div');
  d.className = 'dim'; d.textContent = text;
  out.appendChild(d); out.scrollTop = out.scrollHeight;
  return d;
}
function unstatus(d){ if (d && d.parentNode) d.parentNode.removeChild(d); }
function haptic(k){ try{ window.myllmHaptic && myllmHaptic(k); }catch(e){} }

/* ---------- helpers that mirror the tool ---------- */

function tokenize(s){
  var outv = [], cur = '', q = null;
  for (var i=0;i<s.length;i++){
    var c = s[i];
    if (q){ if (c === q) q = null; else cur += c; }
    else if (c === '"' || c === "'"){ q = c; }
    else if (c === ' '){ if (cur){ outv.push(cur); cur = ''; } }
    else cur += c;
  }
  if (cur) outv.push(cur);
  return outv;
}

function normalise(p){
  var s = String(p||'').trim();
  while (s.indexOf('./') === 0) s = s.slice(2);
  while (s.charAt(0) === '/') s = s.slice(1);
  while (s.charAt(s.length-1) === '/') s = s.slice(0,-1);
  return s === '.' ? '' : s;
}

function bytes(n){ return n < 1024 ? n + 'B' : (n/1024).toFixed(1) + 'K'; }

/* ---------- the line, before it is a command ----------
   A pipeline is split here rather than in run(), so every command stays a
   command: it reads stdin if there is any, prints as it always did, and knows
   nothing about where its output is going. */

function restOf(line){
  var t = String(line || '').trim();
  var sp = t.search(/\s/);
  return sp < 0 ? '' : t.slice(sp + 1).trim();
}
function unquote(s){
  var t = String(s || '').trim(), a = t.charAt(0);
  if (t.length > 1 && (a === '"' || a === "'") && t.charAt(t.length - 1) === a) return t.slice(1, -1);
  return t;
}
/* Models fence their output even when told not to; a fence in a saved file is
   the kind of thing you only notice a week later. */
function stripFence(t){
  var s2 = String(t || '').trim();
  if (s2.indexOf('```') !== 0) return s2;
  s2 = s2.replace(/^```[a-z]*\s*\n?/i, '');
  var end = s2.lastIndexOf('```');
  return (end >= 0 ? s2.slice(0, end) : s2).trim();
}

/* `a | b > c` -> { stages:['a','b'], redirect:{path:'c', append:false} }
   Quotes are respected, so  grep "a > b"  is a search and not a redirect. */
function splitPipeline(line){
  var stages = [], cur = '', q = null, redirect = null;
  var text = String(line || '');
  for (var i = 0; i < text.length; i++){
    var c = text.charAt(i);
    if (q){ cur += c; if (c === q) q = null; continue; }
    if (c === '"' || c === "'"){ q = c; cur += c; continue; }
    if (c === '|'){ stages.push(cur); cur = ''; continue; }
    if (c === '>'){
      var append = text.charAt(i + 1) === '>';
      redirect = { path: unquote(text.slice(i + (append ? 2 : 1)).trim()), append: append };
      break;
    }
    cur += c;
  }
  stages.push(cur);
  stages = stages.map(function(x){ return x.trim(); }).filter(function(x){ return x.length; });
  return { stages: stages, redirect: redirect };
}

/* One pass only: an alias that expands to another alias is a loop waiting to
   happen, and nobody needs two levels on a phone. */
function expandAlias(stage){
  var first = (tokenize(stage)[0] || '').toLowerCase();
  if (!Object.prototype.hasOwnProperty.call(aliases, first)) return stage;
  var rest = restOf(stage);
  return aliases[first] + (rest ? ' ' + rest : '');
}

/* Only a line that STARTS with a command is parsed as a pipeline. "which files
   are > 1 kB?" is a sentence, and splitting it on the > would quietly eat it. */
function isCommandLine(line){
  var first = (tokenize(line)[0] || '').toLowerCase();
  if (!first) return false;
  if (first.charAt(0) === '!') return true;
  return KNOWN.indexOf(first) >= 0 || Object.prototype.hasOwnProperty.call(aliases, first);
}

/* Every stage read-only, and nothing being written to a file. Both callers run
   without anyone typing y — the agent, and .shellrc at launch — so a redirect
   has to count as a mutation here even though every verb in it is read-only. */
function unsafeReason(line, allowed){
  var pl = splitPipeline(line);
  if (pl.redirect) return 'writing to a file with > or >> is a change — propose it instead';
  if (!pl.stages.length) return 'empty command';
  for (var i = 0; i < pl.stages.length; i++){
    var v = (tokenize(expandAlias(pl.stages[i]))[0] || '').toLowerCase();
    if (allowed.indexOf(v) < 0) return 'only ' + allowed.join(', ') + ' may run without asking';
  }
  return null;
}

/* Run something with its output collected instead of (or as well as) shown.
   Saves and restores, so a pipeline inside the agent loop nests correctly. */
async function captureOf(fn, silent){
  var savedCap = capture, savedQuiet = quiet, savedErr = captureHadError;
  capture = []; quiet = !!silent; captureHadError = false;
  try { await fn(); }
  catch(e){ capture.push('error: ' + (e && e.message || e)); captureHadError = true; }
  var text = capture.join('\n');
  lastCaptureError = captureHadError;
  capture = savedCap; quiet = savedQuiet; captureHadError = savedErr;
  return text;
}
function runner(stage){ return function(){ return run(stage); }; }

function mimeFor(name){
  var n = String(name).toLowerCase(), dot = n.lastIndexOf('.');
  var ext = dot > 0 ? n.slice(dot + 1) : '';
  if (ext === 'json') return 'application/json';
  if (ext === 'csv') return 'text/csv';
  if (ext === 'html' || ext === 'htm') return 'text/html';
  if (ext === 'md' || ext === 'markdown') return 'text/markdown';
  return 'text/plain';
}
/* UTF-8 safe: btoa alone mangles anything above ASCII, and notes have accents
   and em dashes in them. Chunked so a 5 MB file does not blow the stack. */
function dataURL(text, mime){
  var bs = new TextEncoder().encode(String(text == null ? '' : text));
  var bin = '', CH = 0x8000;
  for (var i = 0; i < bs.length; i += CH) bin += String.fromCharCode.apply(null, bs.subarray(i, i + CH));
  return 'data:' + mime + ';base64,' + btoa(bin);
}

/* ---------- what persists between sessions (myllmStorage, not the workspace) ----------
   History and aliases are the shell's own memory, not the user's documents, so
   they live in per-app storage where they cannot clutter a file listing. */
async function loadState(){
  if (!store) return;
  try {
    var h = await store.getItem(HISTORY_KEY);
    if (h){ var arr = JSON.parse(h); if (Array.isArray(arr)) cmdHistory = arr.slice(-200); }
  } catch(e){}
  try {
    var a = await store.getItem(ALIAS_KEY);
    if (a){ var obj = JSON.parse(a); if (obj && typeof obj === 'object') aliases = obj; }
  } catch(e){}
  hIndex = cmdHistory.length;
}
/* Written on every command rather than debounced: a command is something a
   person typed, not a per-frame event, and a debounce only buys the chance to
   lose the last one when the app is closed straight after running it. */
function saveHistory(){
  if (!store) return;
  try { store.setItem(HISTORY_KEY, JSON.stringify(cmdHistory.slice(-200))); } catch(e){}
}
function saveAliases(){
  if (!store) return;
  try { store.setItem(ALIAS_KEY, JSON.stringify(aliases)); } catch(e){}
}

/* !! / !5 / !gr — resolved before the line is echoed, so what you see in the
   scrollback and what goes into history is the command that actually ran. */
function expandBang(line){
  if (line.charAt(0) !== '!') return line;
  var rest = line.slice(1);
  if (!rest || rest === '!') return cmdHistory.length ? cmdHistory[cmdHistory.length - 1] : null;
  if (/^\d+$/.test(rest)) return cmdHistory[parseInt(rest, 10) - 1] || null;
  for (var i = cmdHistory.length - 1; i >= 0; i--)
    if (cmdHistory[i].toLowerCase().indexOf(rest.toLowerCase()) === 0) return cmdHistory[i];
  return null;
}

/* .shellrc: the lines that run when Shell opens. Nobody is at the prompt yet,
   so it is held to the same bar as the agent — look around, set up, change
   nothing. A rm in a startup file would run before you could stop it. */
var RC_SAFE = ['cd','alias','unalias','clear','ls','dir','tree','pwd','du','cat','head','tail','stat','find','grep','history'];
async function runRC(){
  var text = null;
  try { text = await files.read(RC); } catch(e){}
  if (text == null) return;
  var lines = text.split('\n'), ran = 0;
  for (var i = 0; i < lines.length; i++){
    var l = lines[i].trim();
    if (!l || l.charAt(0) === '#') continue;
    var why = unsafeReason(l, RC_SAFE);
    if (why){ print(RC + ':' + (i + 1) + ': skipped — ' + why, 'err'); continue; }
    try { await runLine(l); } catch(e){ print(RC + ':' + (i + 1) + ': ' + (e && e.message || e), 'err'); }
    if (++ran >= 20){ print(RC + ': stopped after 20 lines', 'dim'); break; }
  }
}

/* ---------- a line, end to end ---------- */
async function runLine(line){
  var text = String(line || '').trim();
  if (!text) return;
  if (!isCommandLine(text)){ stdin = null; return run(text); }

  var pl = splitPipeline(text);
  if (!pl.stages.length) return;
  if (pl.redirect && !pl.redirect.path) return print('> needs a file name, e.g.  ls > list.txt', 'err');

  var piped = null;
  for (var i = 0; i < pl.stages.length; i++){
    var stage = expandAlias(pl.stages[i]);
    stdin = piped;
    /* The last stage of a plain pipeline prints for itself — in colour, with
       its paths still tappable. Only what is on its way to a file is captured. */
    if (i === pl.stages.length - 1 && !pl.redirect) return run(stage);
    piped = await captureOf(runner(stage), true);
    if (lastCaptureError){ print(piped, 'err'); return; }   /* a failed stage never reaches a file */
  }

  var dest = resolve(pl.redirect.path);
  if (!dest) return print('> needs a file name, e.g.  ls > list.txt', 'err');
  var body = piped == null ? '' : piped;
  var added = body.length;
  var prev = await files.read(dest);
  if (pl.redirect.append && prev != null && prev.length)
    body = prev + (prev.charAt(prev.length - 1) === '\n' ? '' : '\n') + body;
  await files.write(dest, body);
  remember({ type: 'write', path: dest, prev: prev });
  haptic('success');
  print((pl.redirect.append ? 'appended ' : 'wrote ') + added + ' chars to ' + dest +
        (prev != null && !pl.redirect.append ? ' (replaced ' + prev.length + ')' : '') +
        '  —  undo  puts it back', 'ok');
}

function when(ms){
  var d = new Date(ms);
  function p(x){ return (x<10?'0':'') + x; }
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

function glob(pattern, name){
  if (pattern.indexOf('*') < 0 && pattern.indexOf('?') < 0)
    return name.toLowerCase().indexOf(pattern.toLowerCase()) >= 0;
  var rx = '^' + pattern.replace(/[.+^${}()|[\]\\]/g,'\\$&')
                        .replace(/\*/g,'.*').replace(/\?/g,'.') + '$';
  return new RegExp(rx,'i').test(name);
}

async function snapshot(includeHidden){
  var list = await files.list();
  var folders = files.folders ? await files.folders() : [];
  var all = { files: list, folders: folders };
  lastSnap = all;
  if (includeHidden || inTrash(cwd)) return all;
  return { files: list.filter(function(f){ return !inTrash(f.path); }),
           folders: folders.filter(function(d){ return !inTrash(d); }) };
}
/* Where a deleted thing goes. Keeps the original path under .trash so restore
   is a straight move back; a second delete of the same name gets a suffix. */
function trashPath(target){
  var snap = lastSnap || { files: [], folders: [] };   /* the UNFILTERED listing — run()'s hides .trash */
  var dest = TRASH + '/' + target;
  var taken = snap.files.some(function(f){ return f.path === dest || f.path.indexOf(dest + '/') === 0; }) || snap.folders.indexOf(dest) >= 0;
  if (!taken) return dest;
  var dot = target.lastIndexOf('.'), slash = target.lastIndexOf('/');
  var stamp = '~' + new Date().toISOString().slice(0,19).replace(/[-:T]/g,'');
  return TRASH + '/' + (dot > slash ? target.slice(0,dot) + stamp + target.slice(dot) : target + stamp);
}
/* After a restore, the folder that held the item may be left empty inside
   .trash. Sweep those (deepest first) so `trash` never shows hollow folders. */
async function pruneTrash(){
  try{
    var all = await snapshot(true);
    var dirs = all.folders.filter(function(d){ return inTrash(d) && d !== TRASH; }).sort(function(a,b){ return b.length - a.length; });
    for (var i = 0; i < dirs.length; i++){
      var d = dirs[i];
      var busy = all.files.some(function(f){ return f.path.indexOf(d + '/') === 0; }) ||
                 all.folders.some(function(x){ return x !== d && x.indexOf(d + '/') === 0 && !dirs.slice(0, i).some(function(gone){ return gone === x; }); });
      if (!busy) await files.removeFolder(d, false);
    }
    var again = await snapshot(true);
    if (again.folders.indexOf(TRASH) >= 0 && !again.files.some(function(f){ return inTrash(f.path); }) &&
        !again.folders.some(function(d){ return d !== TRASH && inTrash(d); })) await files.removeFolder(TRASH, false);
  }catch(e){}
}
function pathHTML(p, label){ return '<span class="path" data-path="' + esc(p) + '">' + esc(label == null ? p : label) + '</span>'; }

/* ---------- commands ---------- */

async function run(line){
  if (!files){ print('Shared files are off. Turn on "Shared files" in MyLLMos settings.', 'err'); return; }
  /* Taken and cleared in one go: whatever this command does next — including
     running another command — must not inherit the text piped into this one. */
  var sin = stdin; stdin = null;
  var argv = tokenize(line);
  var verb = (argv.shift()||'').toLowerCase();

  var flags = {}, n = 20, ops = [];
  for (var i=0;i<argv.length;i++){
    var a = argv[i];
    if (a === '-n' && argv[i+1] && !isNaN(+argv[i+1])){ n = Math.max(1, Math.min(+argv[i+1], 500)); i++; continue; }
    if (a.charAt(0) === '-'){ a.slice(1).split('').forEach(function(f){ flags[f] = true; }); continue; }
    ops.push(a);
  }
  var target = ops.length ? resolve(ops[0]) : cwd;
  var snap = await snapshot(!!flags.a);

  switch (verb){
    case 'help': printHTML(helpHTML()); return;
    case 'clear': out.innerHTML = ''; return;
    case 'pwd': print('/' + cwd, 'dim'); return;

    case 'cd': {
      var dest = ops.length ? resolve(ops[0]) : '';
      if (dest && snap.folders.indexOf(dest) < 0) return print('No such folder: ' + dest, 'err');
      cwd = dest; paintPrompt();
      return print('/' + cwd, 'dim');
    }

    case 'ls': case 'dir': case 'tree':
      return listing(snap, target, verb === 'tree' || flags.R || flags.r);

    case 'cat': case 'head': case 'tail': {
      var text;
      if (sin != null && !ops.length) text = sin;          /* ... | head -n 5 */
      else {
        if (!target) return print(verb + ' needs a path', 'err');
        text = await files.read(target);
        if (text == null) return print('No such file: ' + target, 'err');
      }
      if (verb === 'cat') return print(text);
      var lines = text.split('\n');
      print((verb === 'head' ? lines.slice(0, n) : lines.slice(-n)).join('\n'));
      if (lines.length > n) print('[' + lines.length + ' lines total]', 'dim');
      return;
    }

    case 'stat': {
      var f = snap.files.filter(function(x){ return x.path === target; })[0];
      if (f) return print(f.path + '\ntype: file\nsize: ' + f.size + ' bytes\nmodified: ' + when(f.modified*1000));
      if (snap.folders.indexOf(target) >= 0){
        var inside = snap.files.filter(function(x){ return x.path.indexOf(target + '/') === 0; });
        var total = inside.reduce(function(a,b){ return a + b.size; }, 0);
        return print(target + '/\ntype: folder\ncontains: ' + inside.length + ' file(s), ' + total + ' bytes');
      }
      return print('No such file or folder: ' + target, 'err');
    }

    case 'find': {
      if (!ops[0]) return print('find needs a name or glob, e.g. find *.json', 'err');
      var hits = snap.files.map(function(f){ return f.path; }).filter(function(p){
        return glob(ops[0], p.split('/').pop()) || glob(ops[0], p);
      });
      if (!hits.length) return print('No match for ' + ops[0], 'dim');
      return printHTML(hits.sort().map(function(p){ return pathHTML(p); }).join('\n'));
    }

    case 'grep': {
      /* Search INSIDE files — find only knows names. Case-insensitive, because
         a phone keyboard capitalises the first letter whether you like it or
         not; -l lists matching files only. Scope with a folder or file path. */
      if (!ops[0]) return print('grep needs some text, e.g. grep dentist  or  grep -l invoice notes', 'err');
      var needle = ops[0].toLowerCase();
      /* Piped in: there are no files here, just lines. */
      if (sin != null && ops.length < 2){
        var sl = sin.split('\n'), keep = [];
        for (var si = 0; si < sl.length; si++){
          var sLower = sl[si].toLowerCase(), sAt = sLower.indexOf(needle);
          if (sAt < 0) continue;
          keep.push(esc(sl[si].slice(0, sAt)) + '<b>' + esc(sl[si].slice(sAt, sAt + needle.length)) + '</b>' + esc(sl[si].slice(sAt + needle.length)));
        }
        if (!keep.length) return print('No match for "' + ops[0] + '"', 'dim');
        return printHTML(keep.join('\n'));
      }
      var scope = ops[1] ? resolve(ops[1]) : cwd;
      var pool = snap.files.filter(function(f){ return !scope || f.path === scope || f.path.indexOf(scope + '/') === 0; });
      if (!pool.length) return print('Nothing to search in ' + (scope || 'the workspace'), 'dim');
      var rows = [], hitFiles = 0, shown = 0, LIMIT = 200;
      for (var fi = 0; fi < pool.length && shown < LIMIT; fi++){
        var f = pool[fi], txt = await files.read(f.path);
        if (txt == null || txt.toLowerCase().indexOf(needle) < 0) continue;
        hitFiles++;
        if (flags.l){ rows.push(pathHTML(f.path)); continue; }
        var ls = txt.split('\n');
        for (var li = 0; li < ls.length && shown < LIMIT; li++){
          var lower = ls[li].toLowerCase(), at = lower.indexOf(needle);
          if (at < 0) continue;
          shown++;
          var start = Math.max(0, at - 40), snippet = ls[li].slice(start, start + 120);
          var rel = at - start;
          var marked = esc(snippet.slice(0, rel)) + '<b>' + esc(snippet.slice(rel, rel + needle.length)) + '</b>' + esc(snippet.slice(rel + needle.length));
          rows.push(pathHTML(f.path) + '<span class="hit">:' + (li + 1) + ': ' + (start ? '\u2026' : '') + marked + '</span>');
        }
      }
      if (!rows.length) return print('No match for "' + ops[0] + '" in ' + (scope || 'the workspace'), 'dim');
      printHTML(rows.join('\n'));
      if (!flags.l) print('[' + shown + (shown >= LIMIT ? '+' : '') + ' line(s) in ' + hitFiles + ' file(s)]', 'dim');
      return;
    }

    case 'du': {
      var byDir = {};
      snap.files.forEach(function(f){
        var d = f.path.indexOf('/') < 0 ? '.' : f.path.slice(0, f.path.lastIndexOf('/'));
        byDir[d] = (byDir[d]||0) + f.size;
      });
      var rows = Object.keys(byDir).sort(function(a,b){ return byDir[b]-byDir[a]; })
        .map(function(d){ return bytes(byDir[d]) + '\t' + d; });
      var total = snap.files.reduce(function(a,b){ return a + b.size; }, 0);
      return print(rows.concat([bytes(total) + '\ttotal of 25 MB']).join('\n'));
    }

    /* ---- the model as a filter, and the phone as an input device ---- */

    case 'ask': {
      /* The agent (anything that is not a command) EXPLORES: it runs commands
         and decides what to do next. This verb TRANSFORMS: one call, no tools,
         whatever came down the pipe as its material, and the answer is just
         text — so it can be piped onward or redirected into a file. */
      if (!window.myllmAsk) return print('AI is off for apps — turn on "Allow apps to use the AI" in MyLLMos settings.', 'err');
      var q = unquote(restOf(line));
      if (!q && sin == null) return print('ask "a question"  —  or pipe something in:  cat notes.md | ask "summarise"', 'err');
      var material = sin;
      var clipped = false;
      if (material != null && material.length > ASK_MAX){ material = material.slice(0, ASK_MAX); clipped = true; }
      var prompt = material != null
        ? (q || 'Summarise this.') + '\n\n--- material ---\n' + material + (clipped ? '\n[truncated]' : '')
        : q;
      var spin = status('asking\u2026');
      var answer;
      try { answer = await myllmAsk(prompt, { system: FILTER_SYSTEM }); }
      catch(e){ unstatus(spin); return print('ask failed: ' + (e && e.message || e), 'err'); }
      unstatus(spin);
      var clean = stripFence(String(answer == null ? '' : answer));
      if (!clean) return print('(no answer)', 'dim');
      if (clipped) print('[used the first ' + ASK_MAX + ' characters]', 'dim');
      return print(clean, 'say');
    }

    case 'dictate': {
      /* Typing at a prompt is the worst thing about a terminal on a phone.
         No path argument: it prints, and  >  is how anything gets saved. */
      if (!window.myllmTranscribe) return print('Dictation needs a newer MyLLM build.', 'err');
      var heard;
      try { heard = await myllmTranscribe(); }
      catch(e){ return print('dictation failed: ' + (e && e.message || e), 'err'); }
      if (heard == null || !String(heard).trim()) return print('nothing heard', 'dim');
      haptic('success');
      return print(String(heard).trim());
    }

    case 'open': {
      /* The intent bus, with the same action name the Files app uses, so Shell
         reaches exactly the apps that already declare they can take text. */
      if (!ops.length) return print('open <path>  — hands the file to an app that can open text', 'err');
      if (!snap.files.some(function(x){ return x.path === target; })) return print('No such file: ' + target, 'err');
      var body = await files.read(target);
      if (body == null) return print('Cannot read ' + target + ' — Shell handles text files.', 'err');
      if (!window.myllmIntent) return print('Handing files to other apps needs a newer MyLLM build.', 'err');
      var oName = target.split('/').pop(), oDot = oName.lastIndexOf('.');
      try {
        var routed = await myllmIntent.send('open-text', {
          name: oName, path: target, ext: oDot > 0 ? oName.slice(oDot + 1).toLowerCase() : '', text: body
        });
        haptic('success');
        return print('opened ' + oName + (routed && routed.handlers > 1 ? ' — pick an app' : ''), 'ok');
      } catch(e){
        /* Nothing installed takes text yet. An error here would read as broken
           rather than un-adopted, so do the useful thing instead. */
        print('No installed app can open text yet — here it is instead.', 'dim');
        return print(body);
      }
    }

    case 'share': {
      if (!ops.length) return print('share <path>  — sends the file out through iOS', 'err');
      var sBody = await files.read(target);
      if (sBody == null) return print('No such file: ' + target, 'err');
      if (!window.myllmShareFile) return print('Sharing needs a newer MyLLM build.', 'err');
      var sName = target.split('/').pop(), sMime = mimeFor(sName);
      try { await myllmShareFile(dataURL(sBody, sMime), { filename: sName, mime: sMime }); }
      catch(e){ return print('share failed: ' + (e && e.message || e), 'err'); }
      haptic('success');
      return print('shared ' + sName, 'ok');
    }

    case 'alias': {
      var aRest = restOf(line);
      if (!aRest){
        var names = Object.keys(aliases).sort();
        if (!names.length) return print('no aliases yet — e.g.  alias ll "ls -R"', 'dim');
        return print(names.map(function(k){ return k + '\t' + aliases[k]; }).join('\n'));
      }
      var aName = (tokenize(aRest)[0] || '').toLowerCase();
      var aBody = unquote(restOf(aRest));
      if (!aBody) return print(aliases[aName] ? aName + '\t' + aliases[aName] : 'no alias ' + aName, aliases[aName] ? '' : 'dim');
      if (KNOWN.indexOf(aName) >= 0) return print(aName + ' is already a command — pick another name', 'err');
      aliases[aName] = aBody; saveAliases();
      return print('alias ' + aName + ' -> ' + aBody, 'ok');
    }

    case 'unalias': {
      var uName = (ops[0] || '').toLowerCase();
      if (!uName) return print('unalias <name>', 'err');
      if (!Object.prototype.hasOwnProperty.call(aliases, uName)) return print('no alias ' + uName, 'dim');
      delete aliases[uName]; saveAliases();
      return print('removed alias ' + uName, 'ok');
    }

    /* ---- mutations: this is a person at a prompt, so they are allowed ---- */

    case 'mkdir':
      if (!target) return print('mkdir needs a path', 'err');
      if (snap.folders.indexOf(target) >= 0) return print(target + '/ already exists', 'dim');
      await files.makeFolder(target);
      remember({ type: 'mkdir', path: target });
      haptic('success');
      return print('created ' + target + '/', 'ok');

    case 'mv': {
      if (ops.length < 2) return print('mv needs a source and a destination', 'err');
      var to = resolve(ops[1]);
      if (!to) return print('mv needs a destination name', 'err');
      var exists = snap.files.some(function(x){ return x.path === to; }) || snap.folders.indexOf(to) >= 0;
      /* The store replaces a destination silently, and a replaced file cannot be
         undone — so say so, and make replacing a deliberate flag. */
      if (exists && !flags.f) return print(to + ' already exists — use  mv -f  to replace it', 'err');
      await files.move(target, to);
      remember({ type: 'mv', from: target, to: to });
      haptic('success');
      return print(target + ' -> ' + to, 'ok');
    }

    case 'write': {
      if (!target) return print('write needs a path', 'err');
      var body = line.slice(line.indexOf(ops[0]) + ops[0].length).trim();
      if (!body) return print('write <path> <text>  — the text replaces the file', 'err');
      var prev = await files.read(target);
      await files.write(target, body);
      remember({ type: 'write', path: target, prev: prev });
      haptic('success');
      return print('wrote ' + body.length + ' chars to ' + target + (prev != null ? ' (replaced ' + prev.length + ')' : ''), 'ok');
    }

    case 'rm': case 'rmdir': {
      if (!target) return print(verb + ' needs a path', 'err');
      var isDir = snap.folders.indexOf(target) >= 0;
      var isFile = snap.files.some(function(x){ return x.path === target; });
      if (!isDir && !isFile) return print('No such file or folder: ' + target, 'err');
      if (verb === 'rm' && isDir) return print(target + ' is a folder — use rmdir', 'err');
      if (verb === 'rmdir' && !isDir) return print(target + ' is not a folder — use rm', 'err');
      var count = isDir ? snap.files.filter(function(x){ return x.path.indexOf(target+'/') === 0; }).length : 1;
      if (inTrash(target) || flags.p){
        /* Already in the trash, or explicitly permanent: this one really is gone,
           so it still has to be said twice. */
        pending = { verb: verb, target: target, count: count };
        return print('delete ' + target + (isDir ? '/ and its ' + count + ' file(s)' : '') + ' for good? no undo — type  y  to confirm', 'err');
      }
      var dest = trashPath(target);
      await files.move(target, dest);
      remember({ type: 'rm', from: target, to: dest, isDir: isDir });
      haptic('warning');
      return print('moved ' + target + (isDir ? '/ (' + count + ' file(s))' : '') + ' to ' + TRASH + '  \u2014  undo  puts it back', 'ok');
    }

    case 'undo': {
      var op = undoStack.pop();
      if (!op) return print('nothing to undo', 'dim');
      switch (op.type){
        case 'rm': await files.move(op.to, op.from); await pruneTrash(); print('restored ' + op.from, 'ok'); break;
        case 'revert': {
          var rv = files.versions ? await files.versions(op.path) : [];
          if (rv.length) { await files.restoreVersion(op.path, rv[0].stamp); print('restored ' + op.path + ' to before the revert', 'ok'); }
          else print('nothing to restore for ' + op.path, 'dim');
          break;
        }
        case 'mv': await files.move(op.to, op.from); print(op.to + ' -> ' + op.from, 'ok'); break;
        case 'mkdir': await files.removeFolder(op.path, false); print('removed ' + op.path + '/', 'ok'); break;
        case 'write':
          if (op.prev == null){ await files.remove(op.path); print('removed ' + op.path, 'ok'); }
          else { await files.write(op.path, op.prev); print('restored ' + op.path + ' (' + op.prev.length + ' chars)', 'ok'); }
          break;
      }
      haptic('success');
      return;
    }

    case 'history': {
      /* No path? Then you meant the other kind of history — the commands you
         typed. With a path it is the file's own versions, as the native
         workspace_shell tool spells it, and that meaning does not move. */
      if (!ops.length){
        if (!cmdHistory.length) return print('no commands yet', 'dim');
        var hStart = Math.max(0, cmdHistory.length - 30);
        print(cmdHistory.slice(hStart).map(function(c, i){ return (hStart + i + 1) + '\t' + c; }).join('\n'));
        return print('!5 runs number 5, !! runs the last one again', 'dim');
      }
      if (!files.versions) return print('Version history needs the latest MyLLM build.', 'err');
      var vs = await files.versions(target);
      if (!vs.length) return print('No previous versions of ' + target + ' \u2014 versions are kept from the first overwrite or delete.', 'dim');
      print(vs.map(function(v, i){ return '#' + (i + 1) + '\t' + when(v.stamp) + '\t' + bytes(v.size); }).join('\n'));
      return print('revert ' + target + ' N  puts one back', 'dim');
    }

    case 'revert': {
      if (!target) return print('revert needs a path', 'err');
      if (!files.restoreVersion) return print('Version history needs the latest MyLLM build.', 'err');
      var vn = ops[1] ? parseInt(ops[1], 10) : 1;
      var vlist = await files.versions(target);
      if (!vlist.length) return print('No previous versions of ' + target, 'dim');
      if (!(vn >= 1 && vn <= vlist.length)) return print('revert: choose 1\u2013' + vlist.length + ' (see  history ' + target + ')', 'err');
      /* The store snapshots the current bytes before restoring, so undo is
         simply "restore the newest version". */
      await files.restoreVersion(target, vlist[vn - 1].stamp);
      remember({ type: 'revert', path: target });
      haptic('success');
      return print('reverted ' + target + ' to #' + vn + ' (' + when(vlist[vn - 1].stamp) + ')  \u2014  undo  puts it back', 'ok');
    }

    case 'trash': {
      if ((ops[0] || '').toLowerCase() === 'empty'){
        var all = await snapshot(true);
        var inside = all.files.filter(function(x){ return inTrash(x.path); });
        if (!inside.length && all.folders.indexOf(TRASH) < 0) return print(TRASH + ' is empty', 'dim');
        pending = { verb: 'trash-empty', count: inside.length };
        return print('delete ' + inside.length + ' file(s) in ' + TRASH + ' for good? no undo — type  y  to confirm', 'err');
      }
      var allT = await snapshot(true);
      if (allT.folders.indexOf(TRASH) < 0) return print(TRASH + ' is empty', 'dim');
      print(TRASH + '/  \u2014  restore <path> puts something back, trash empty clears it', 'dim');
      return listing(allT, TRASH, true);
    }

    case 'restore': {
      if (!ops[0]) return print('restore needs a path as shown by  trash', 'err');
      var all2 = await snapshot(true);
      var src = normalise(ops[0]);
      if (!inTrash(src)) src = TRASH + '/' + src;
      var back = src.slice(TRASH.length + 1).replace(/~\d{14}(?=\.[^.\/]+$|$)/, '');
      var known = all2.files.some(function(x){ return x.path === src; }) || all2.folders.indexOf(src) >= 0;
      if (!known) return print('Not in ' + TRASH + ': ' + src.slice(TRASH.length + 1), 'err');
      var clash = all2.files.some(function(x){ return x.path === back; }) || all2.folders.indexOf(back) >= 0;
      if (clash && !flags.f) return print(back + ' already exists — use  restore -f  to replace it', 'err');
      await files.move(src, back);
      await pruneTrash();
      remember({ type: 'mv', from: src, to: back });
      haptic('success');
      return print('restored ' + back, 'ok');
    }

    default:
      /* Not a command? Then it was a question. This is the line that turns a
         terminal into an assistant that happens to live in a directory. */
      print('thinking…', 'dim');
      return agent(line);
  }
}

function remember(op){
  undoStack.push(op);
  if (undoStack.length > 30) undoStack.shift();
}

function listing(snap, root, recursive){
  var prefix = root ? root + '/' : '';
  if (root && snap.folders.indexOf(root) < 0){
    var one = snap.files.filter(function(f){ return f.path === root; })[0];
    if (one) return printHTML(pathHTML(one.path) + '\t<span class="dim">' + one.size + 'B\t' + when(one.modified*1000) + '</span>');
    return print('No such file or folder: ' + root, 'err');
  }
  var depth = prefix ? prefix.split('/').length : 1;
  var subs = snap.folders.filter(function(f){
    return f.indexOf(prefix) === 0 && f !== root && (recursive || f.split('/').length === depth);
  }).sort();
  var here = snap.files.filter(function(f){
    return f.path.indexOf(prefix) === 0 && (recursive || f.path.split('/').length === depth);
  }).sort(function(a,b){ return a.path < b.path ? -1 : 1; });
  if (!subs.length && !here.length) return print(root ? root + '/ is empty' : 'The workspace is empty', 'dim');
  var html = subs.map(function(d){ return '<span class="dir">' + pathHTML(d, d + '/') + '</span>'; })
    .concat(here.map(function(f){
      return pathHTML(f.path) + '\t<span class="dim">' + f.size + 'B\t' + when(f.modified*1000) + '</span>';
    })).join('\n');
  printHTML(html);
}

/* ================= the assistant, inside the directory =================
   Type anything that is not a command and it becomes a question. The model is
   given the working directory and the command list, and answers with ONE JSON
   object per turn: run a command, or say something. The app executes the
   command locally and feeds the output back — which is the whole trick, because
   myllmAsk has no tools of its own. The shell commands ARE the tools.

   READ-ONLY autonomously. Anything that writes or deletes comes back as a
   proposal the user has to accept: a model running rm across someone's
   documents unattended is the one outcome worth designing against. */

var READ_ONLY = ['ls','dir','tree','cat','head','tail','stat','find','grep','history','du','pwd'];
var MAX_STEPS = 5;          /* myllmAsk is rate-limited; five is plenty and stays inside it */

/* The system prompt for the `ask` VERB — a filter, not an assistant. Anything
   it says that is not the answer ends up in the user's file, so say none of it. */
var FILTER_SYSTEM = [
  'You are a filter in a command-line pipeline, inside the user\'s file workspace.',
  'Do exactly what the instruction asks of the material you are given, and output ONLY the result.',
  'No preamble, no sign-off, no explanation of what you did, no markdown code fences.',
  'Plain text unless the instruction asks for another format. Never invent material you were not given.'
].join('\n');

function systemPrompt(listing){
  return [
    'You are working inside a directory of the user\'s MyLLMos shared workspace, like a terminal assistant.',
    'Current directory: /' + (cwd || ''),
    '',
    'Contents right now:',
    listing || '(empty)',
    '',
    'You may run these READ-ONLY commands: ls [-R] [path], tree [path], cat <path>, head -n N <path>, tail -n N <path>, stat <path>, find <glob>, grep <text> [path] (searches inside files), history <path> (previous versions), du.',
    'You may pipe them: `a | b` sends a\'s output into b, and cat, head, tail and grep all read what is piped in — e.g. `grep invoice notes | head -n 5`. One pipeline is one step, so prefer it over three separate looks.',
    'Paths are relative to the current directory. There is no cd.',
    'Writing output to a file with > or >> is a CHANGE: propose it, never run it.',
    '',
    'Reply with ONE JSON object and nothing else:',
    '  {"run":"<command>"}                     to look at something first',
    '  {"say":"<answer>"}                      when you can answer',
    '  {"propose":"<command>","why":"<reason>"} to CHANGE something (mkdir, mv, write, rm, rmdir, revert <path> N) — the user approves it, you never run it. rm moves to a trash folder and can be undone; revert puts a previous version back.',
    '',
    'Prefer running a command over guessing. Answer in plain prose, briefly. Do not invent file contents.'
  ].join('\n');
}

async function runCaptured(line){
  /* The agent's steps stay visible on screen (silent: false) — watching it look
     around is most of why the loop is trustworthy. */
  var text = await captureOf(function(){ return runLine(line); }, false);
  return text.length > 4000 ? text.slice(0, 4000) + '\n[truncated]' : text;
}

function parseReply(raw){
  var t = String(raw || '').trim();
  /* Models fence JSON even when told not to. */
  t = t.replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
  var a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a < 0 || b < a) return null;
  try { return JSON.parse(t.slice(a, b + 1)); } catch(e){ return null; }
}

async function agent(question){
  if (!window.myllmAsk){
    print('AI is off for apps — turn on "Allow apps to use the AI" in MyLLMos settings.', 'err');
    return;
  }
  var snap = await snapshot();
  capture = []; listing(snap, cwd, false); var here = capture.join('\n'); capture = null;

  var transcript = 'User: ' + question;
  for (var step = 0; step < MAX_STEPS; step++){
    var raw;
    try { raw = await myllmAsk(transcript + '\n\nReply with one JSON object.', { system: systemPrompt(here) }); }
    catch(e){ print('ask failed: ' + (e.message || e), 'err'); return; }

    var reply = parseReply(raw);
    if (!reply){
      /* Not JSON — treat it as the answer rather than failing in the user's face. */
      print(String(raw).trim(), 'say');
      return;
    }
    if (reply.say){ print(String(reply.say).trim(), 'say'); return; }

    if (reply.propose){
      var why = reply.why ? ' — ' + reply.why : '';
      print('proposes: ' + reply.propose + why, 'propose');
      print('run it? type  y  to confirm', 'propose');
      pending = { verb: 'raw', line: String(reply.propose) };
      return;
    }
    if (reply.run){
      var cmd = String(reply.run).trim();
      /* Every stage, not just the first verb — and a redirect turns a pipeline
         of read-only commands into a write, which is exactly the hole worth
         closing before the model finds it. */
      var why = unsafeReason(cmd, READ_ONLY);
      if (why){
        transcript += '\n\nAssistant tried: ' + cmd + '\nBlocked: ' + why + '. Use "propose" for anything that changes files.';
        continue;
      }
      print('$ ' + cmd, 'step');
      var output = await runCaptured(cmd);
      transcript += '\n\nAssistant ran: ' + cmd + '\nOutput:\n' + (output || '(no output)');
      continue;
    }
    print(String(raw).trim(), 'say');
    return;
  }
  print('Stopped after ' + MAX_STEPS + ' steps. Ask something narrower, or run the commands yourself.', 'dim');
}

/* ---------- prompt ---------- */

document.getElementById('form').addEventListener('submit', async function(ev){
  ev.preventDefault();
  var line = input.value.trim();
  input.value = '';
  if (!line) return;

  if (pending){
    var p = pending; pending = null;
    if (line.toLowerCase() === 'y' || line.toLowerCase() === 'yes'){
      try{
        if (p.verb === 'raw'){ print('$ ' + p.line, 'cmd'); await runLine(p.line); }
        else if (p.verb === 'trash-empty') await files.removeFolder(TRASH, true);
        else if (p.verb === 'rm') await files.remove(p.target);
        else await files.removeFolder(p.target, true);
        haptic('warning');
        if (p.verb === 'trash-empty') print('emptied ' + TRASH, 'ok');
        else if (p.verb !== 'raw') print('deleted ' + p.target, 'ok');
      }catch(e){ print(e.message, 'err'); }
    } else print('cancelled', 'dim');
    paintPrompt(); renderChips();
    return;
  }

  /* !! and friends resolve here, so the scrollback and the history both record
     the command that actually ran rather than the shorthand for it. */
  if (line.charAt(0) === '!'){
    var recalled = expandBang(line);
    if (!recalled){ print(prompt$() + ' \u276f ' + line, 'cmd'); print('no matching command in history', 'err'); renderChips(); return; }
    line = recalled;
  }

  cmdHistory.push(line); hIndex = cmdHistory.length;
  if (cmdHistory.length > 200) cmdHistory.shift();
  saveHistory();
  print(prompt$() + ' \u276f ' + line, 'cmd');
  try { await runLine(line); }
  catch(e){ print(String(e && e.message || e), 'err'); }
  stdin = null;
  paintPrompt();
  renderChips();
});

/* Up/down through history, as a shell does. */
input.addEventListener('keydown', function(e){
  if (e.key === 'ArrowUp'){ if (hIndex > 0){ hIndex--; input.value = cmdHistory[hIndex]; } e.preventDefault(); }
  if (e.key === 'ArrowDown'){ if (hIndex < cmdHistory.length-1){ hIndex++; input.value = cmdHistory[hIndex]; } else { hIndex = cmdHistory.length; input.value = ''; } e.preventDefault(); }
});

/* ---------- completion, for a keyboard with no Tab key ----------
   The chip row follows what you type: verbs while you type the first word,
   then names from the folder you are pointing at. A folder completes with a
   trailing slash and keeps going. Empty input shows the usual shortcuts. */
var chipsEl = document.getElementById('chips');
var DEFAULT_CHIPS = ['ls','ls -R','ask ','grep ','open ','help'];
var SINKS = ['ask','grep','head','tail','cat'];   /* the commands that read a pipe */
/* The last | that is not inside quotes. */
function lastPipe(v){
  var q = null, at = -1;
  for (var i = 0; i < v.length; i++){
    var c = v.charAt(i);
    if (q){ if (c === q) q = null; continue; }
    if (c === '"' || c === "'") q = c;
    else if (c === '|') at = i;
    else if (c === '>') return at;   /* past a redirect you are naming a file again */
  }
  return at;
}

function chip(label, cls, onTap){
  var b = document.createElement('button');
  b.className = 'chip' + (cls ? ' ' + cls : ''); b.type = 'button'; b.textContent = label;
  b.addEventListener('pointerdown', function(e){ e.preventDefault(); });  /* keep the keyboard up */
  b.addEventListener('click', onTap);
  return b;
}
function setInput(v){ input.value = v; input.focus(); renderChips(); }

function renderChips(){
  chipsEl.innerHTML = '';
  var v = input.value, atStart = v.length === 0;
  if (pending){ [['y','ok'],['n','dim']].forEach(function(x){ chipsEl.appendChild(chip(x[0], '', function(){ setInput(x[0]); })); }); return; }
  if (atStart){
    DEFAULT_CHIPS.forEach(function(c){ chipsEl.appendChild(chip(c, '', function(){ setInput(c); })); });
    if (undoStack.length) chipsEl.appendChild(chip('undo', 'undo', function(){ setInput('undo'); }));
    if (cwd) chipsEl.appendChild(chip('cd ..', 'dirc', function(){ setInput('cd ..'); }));
    return;
  }
  var endsWithSpace = /\s$/.test(v);
  var tokens = tokenize(v);
  var partial = endsWithSpace ? '' : (tokens[tokens.length - 1] || '');
  var head = endsWithSpace ? v : v.slice(0, v.length - partial.length);
  /* Completion follows the STAGE, not the line: after a pipe you are naming a
     command again, so offering file names there would be offering the one thing
     that cannot go next. */
  var pipeAt = lastPipe(v);
  var stageTokens = tokenize(pipeAt >= 0 ? v.slice(pipeAt + 1) : v);
  var firstWord = stageTokens.length === 0 || (stageTokens.length === 1 && !endsWithSpace);
  var items = [];
  if (firstWord){
    /* Straight after a pipe, lead with the commands that can actually read one. */
    if (pipeAt >= 0 && !partial)
      SINKS.forEach(function(x){ items.push({ label: x, value: x + ' ', cls: 'comp' }); });
    Object.keys(aliases).sort().filter(function(x){ return x.indexOf(partial.toLowerCase()) === 0 && x !== partial; })
      .forEach(function(x){ items.push({ label: x, value: x + ' ', cls: 'undo' }); });
    VERBS.filter(function(x){ return x.indexOf(partial.toLowerCase()) === 0 && x !== partial
                                     && !(pipeAt >= 0 && !partial && SINKS.indexOf(x) >= 0); })
      .forEach(function(x){ items.push({ label: x, value: x + ' ', cls: '' }); });
  } else if (lastSnap){
    var slash = partial.lastIndexOf('/');
    var dirPart = slash >= 0 ? partial.slice(0, slash + 1) : '';
    var namePart = slash >= 0 ? partial.slice(slash + 1) : partial;
    var base = resolve(dirPart || '.');
    var prefix = base ? base + '/' : '';
    var depth = prefix ? prefix.split('/').length : 1;
    var seen = {};
    var showHidden = inTrash(base) || namePart.charAt(0) === '.';
    lastSnap.folders.forEach(function(d){
      if (d.indexOf(prefix) !== 0 || d === base || d.split('/').length !== depth) return;
      if (!showHidden && inTrash(d)) return;
      var name = d.slice(prefix.length);
      if (name.toLowerCase().indexOf(namePart.toLowerCase()) === 0 && !seen[name]){ seen[name] = 1; items.push({ label: name + '/', value: dirPart + name + '/', cls: 'dirc' }); }
    });
    lastSnap.files.forEach(function(f){
      if (f.path.indexOf(prefix) !== 0 || f.path.split('/').length !== depth) return;
      if (!showHidden && inTrash(f.path)) return;
      var name = f.path.slice(prefix.length);
      if (name.toLowerCase().indexOf(namePart.toLowerCase()) === 0 && !seen[name] && name !== namePart){ seen[name] = 1; items.push({ label: name, value: dirPart + name, cls: 'comp' }); }
    });
    if (base && !namePart) items.push({ label: '..', value: dirPart + '../', cls: 'dirc' });
  }
  /* On a phone | and > live two taps down in the symbol plane, which is enough
     friction to stop anyone discovering pipelines at all. */
  if (!firstWord && isCommandLine(v) && !/[|>]/.test(v)){
    var base = v.replace(/\s+$/, '');
    items.unshift({ label: '>', value: null, cls: 'undo', raw: base + ' > ' });
    items.unshift({ label: '|', value: null, cls: 'undo', raw: base + ' | ' });
  }

  items.slice(0, 12).forEach(function(it){
    chipsEl.appendChild(chip(it.label, it.cls, function(){
      if (it.raw != null) return setInput(it.raw);
      var val = /[\s"']/.test(it.value) ? '"' + it.value + '"' : it.value;
      setInput(head + val);
    }));
  });
  if (!items.length && !firstWord) DEFAULT_CHIPS.slice(0, 3).forEach(function(c){ chipsEl.appendChild(chip(c, 'dim', function(){ setInput(c); })); });
}
input.addEventListener('input', renderChips);
input.addEventListener('focus', renderChips);

/* Tap a path the shell printed and it lands in the prompt — appended after a
   space if you were mid-command, or on its own if the prompt was empty. */
out.addEventListener('click', function(e){
  var el = e.target.closest('.path');
  if (!el) return;
  var p = el.getAttribute('data-path');
  if (cwd && p.indexOf(cwd + '/') === 0) p = p.slice(cwd.length + 1);   /* relative to where you stand */
  else if (cwd) p = '/' + p;
  var val = /[\s"']/.test(p) ? '"' + p + '"' : p;
  var v = input.value;
  setInput(v && !/\s$/.test(v) ? v + ' ' + val : v + val);
  haptic('selection');
});
renderChips();

paintPrompt();
print('MyLLMos workspace shell. Type  help  for commands.', 'dim');
print('Anything that is not a command is a question — MyLLM answers it from here,', 'dim');
print('running the read-only commands itself and asking before it changes anything.', 'dim');
print('Pipe things about:  cat notes.md | ask "summarise this" > summary.md', 'dim');
print('rm moves things to .trash and  undo  reverses your last change. Tap any path to use it.', 'dim');

/* History and aliases come back from storage before anything runs, so .shellrc
   can use an alias it defined last time and !! works on the first line typed. */
(async function boot(){
  await loadState();
  renderChips();
  if (!window.myllmFiles){ print('\nShared files are off — turn them on in MyLLMos settings.', 'err'); return; }
  try { await runRC(); } catch(e){ print('.shellrc: ' + (e && e.message || e), 'err'); }
  await runLine('ls');
  paintPrompt();
  renderChips();
})();
</script>
