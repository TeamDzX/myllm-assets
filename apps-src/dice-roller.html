--><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dice</title>
<style>
:root{--build-id:"9bf2dba491";color-scheme:light dark;--gold:#ffd23f}
@property --h{ syntax:'<number>'; inherits:true; initial-value:150; }
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--myllm-font,-apple-system,system-ui,sans-serif);color:#fff;background:#0b0b10;
  position:fixed;inset:0;width:100%;height:100dvh;overflow:hidden;user-select:none;-webkit-user-select:none}

/* The stage: a felt-green backdrop in two layers, dark and light, so the change
   between them can fade. */
.stage{position:absolute;inset:0;--h:150;color:#fff;display:flex;flex-direction:column;transition:color .5s}
.bg{position:absolute;inset:0;transition:opacity .6s ease}
.bg.d{background:radial-gradient(120% 90% at 20% 10%,hsl(var(--h) 62% 27%),transparent 60%),
  radial-gradient(120% 90% at 85% 95%,hsl(calc(var(--h) + 55) 60% 24%),transparent 62%),#0b0b10}
.bg.l{opacity:0;background:radial-gradient(120% 90% at 20% 0%,hsl(var(--h) 62% 84%),transparent 60%),
  radial-gradient(120% 90% at 85% 100%,hsl(calc(var(--h) + 55) 70% 87%),transparent 62%),#f4f4f8}
.lite{color:#15151a}.lite .bg.l{opacity:1}.lite .bg.d{opacity:0}
.stage>*:not(.bg){position:relative}
.glass{border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.12);color:inherit;
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.lite .glass{border-color:rgba(0,0,0,.09);background:rgba(255,255,255,.62)}
svg.i{width:1.25em;height:1.25em;fill:currentColor;flex-shrink:0}
button{font:inherit}button:active{transform:scale(.96)}

.top{display:flex;align-items:center;gap:10px;flex-shrink:0;
  padding:calc(12px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 4px calc(16px + env(safe-area-inset-left))}
.rnd{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
h1{font-size:22px;font-weight:800;display:flex;align-items:center;gap:8px;flex:1;min-width:0}
h1 svg{font-size:20px;opacity:.85}
.tlbl{display:none;flex:1;text-align:center;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.62}
.total{height:44px;min-width:44px;border-radius:99px;padding:0 16px;display:flex;align-items:center;gap:8px;
  font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.total b{font-size:21px;letter-spacing:0;font-variant-numeric:tabular-nums}
.lite .total b{color:inherit}.total b{color:var(--gold)}
#bClose{display:none}

/* table */
#stage{flex:1;display:flex;align-items:center;align-content:center;justify-content:center;flex-wrap:wrap;gap:26px;
  padding:16px calc(16px + env(safe-area-inset-right)) 16px calc(16px + env(safe-area-inset-left));min-height:0;perspective:900px;cursor:pointer}
.die{width:var(--sz);height:var(--sz);position:relative;transform-style:preserve-3d;
  transition:transform .95s cubic-bezier(.22,1.2,.36,1)}
.face{position:absolute;inset:0;border-radius:16%;background:var(--body);
  display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:14%;
  box-shadow:inset 0 0 calc(var(--sz)*.09) rgba(0,0,0,.28);border:1px solid var(--edge)}
.pip{border-radius:50%;background:var(--pip);align-self:center;justify-self:center;
  width:70%;aspect-ratio:1;box-shadow:var(--pipglow, inset 0 1px 2px rgba(0,0,0,.4))}
.f1{transform:translateZ(calc(var(--sz)/2))}
.f6{transform:rotateY(180deg) translateZ(calc(var(--sz)/2))}
.f3{transform:rotateY(90deg) translateZ(calc(var(--sz)/2))}
.f4{transform:rotateY(-90deg) translateZ(calc(var(--sz)/2))}
.f2{transform:rotateX(90deg) translateZ(calc(var(--sz)/2))}
.f5{transform:rotateX(-90deg) translateZ(calc(var(--sz)/2))}
/* themes */
body.t-ivory{--body:linear-gradient(145deg,#fdfcf7,#e8e4d8);--pip:#22242b;--edge:rgba(0,0,0,.18)}
body.t-neon{--body:linear-gradient(145deg,#101625,#0a0e1a);--pip:#39e6ff;--edge:rgba(57,230,255,.5);
  --pipglow:0 0 8px #39e6ff,0 0 16px rgba(57,230,255,.6)}
body.t-ember{--body:linear-gradient(145deg,#4a1512,#2b0b09);--pip:#ffd23f;--edge:rgba(255,150,60,.35);
  --pipglow:0 0 6px rgba(255,210,63,.7)}
.hint{text-align:center;font-size:12px;opacity:.6;font-weight:600;padding:0 16px 8px;min-height:24px;flex-shrink:0}

/* controls */
.deck{flex:0 0 auto;border-radius:24px 24px 0 0;border-bottom:0;max-height:62dvh;overflow-y:auto;
  padding:12px calc(16px + env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
.deckin{max-width:560px;margin:0 auto}
.lbl{font-size:10.5px;font-weight:800;letter-spacing:.14em;opacity:.6;margin:8px 0 7px}
.row{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.08);color:inherit;border-radius:999px;
  min-width:40px;height:40px;padding:0 13px;font-size:13.5px;font-weight:700}
.lite .chip{border-color:rgba(0,0,0,.1);background:rgba(255,255,255,.5)}
.chip.on{background:#fff;border-color:#fff;color:#0b0b10}
.lite .chip.on{background:#15151a;border-color:#15151a;color:#fff}
.rollbtn{width:100%;height:54px;border:0;border-radius:99px;background:#fff;color:#0b0b10;font-weight:800;font-size:16.5px;
  letter-spacing:.02em;margin-top:14px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.lite .rollbtn{background:#15151a;color:#fff;box-shadow:0 10px 26px rgba(20,20,40,.22)}
.hist{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:12px;min-height:28px}
.hist::-webkit-scrollbar{display:none}
.hist span{flex:0 0 auto;font-size:12px;font-weight:700;opacity:.8;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.07);
  border-radius:9px;padding:5px 9px;font-variant-numeric:tabular-nums}
.lite .hist span{border-color:rgba(0,0,0,.09);background:rgba(255,255,255,.5)}
.hist span.dbl{color:var(--gold);border-color:rgba(255,210,63,.45);opacity:1}
.lite .hist span.dbl{color:#8a6a00;border-color:rgba(160,120,0,.4)}
/* full-app card */
.upsell{margin-top:12px;border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:11px 13px;
  display:flex;align-items:center;gap:11px;background:rgba(255,255,255,.06)}
.lite .upsell{border-color:rgba(0,0,0,.09);background:rgba(255,255,255,.5)}
.upsell .e{font-size:26px}
.upsell .t{flex:1;font-size:11.5px;line-height:1.45;opacity:.75}
.upsell .t b{font-size:12.5px}
.upsell a{flex:0 0 auto;text-decoration:none;background:#fff;color:#10131c;font-weight:800;
  font-size:12px;border-radius:999px;padding:9px 15px}
.lite .upsell a{background:#15151a;color:#fff}

/* On the table: nothing but the dice. Tap anywhere to roll. */
.table .deck{display:none}
.table h1,.table #bTable{display:none}.table .tlbl{display:block}.table #bClose{display:flex}
.table .hint{padding-bottom:calc(18px + env(safe-area-inset-bottom));font-size:13px}
.table #stage{gap:34px}

@media (max-height:520px) and (orientation:landscape){      /* phone on its side: table left, controls right */
  .stage:not(.table){display:grid;grid-template-columns:minmax(0,1fr) min(50%,420px);grid-template-rows:auto minmax(0,1fr) auto}
  .stage:not(.table) .top{grid-column:1 / 3}
  .stage:not(.table) #stage{grid-column:1;grid-row:2}
  .stage:not(.table) .hint{grid-column:1;grid-row:3}
  .stage:not(.table) .deck{grid-column:2;grid-row:2 / 4;max-height:none;border-radius:24px 0 0 0;align-self:stretch}
}
@media (prefers-reduced-motion:reduce){.die{transition-duration:.01s}.bg{transition:none}}
</style></head><body class="t-ivory">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-die" viewBox="0 0 24 24"><path d="M6.5 3A3.5 3.5 0 0 0 3 6.5v11A3.5 3.5 0 0 0 6.5 21h11a3.5 3.5 0 0 0 3.5-3.5v-11A3.5 3.5 0 0 0 17.500 3zM8 6.4A1.6 1.6 0 1 1 8 9.600 1.600 1.600 0 0 1 8 6.400zm8 0a1.600 1.600 0 1 1 0 3.200 1.600 1.600 0 0 1 0-3.200zm-4 4a1.600 1.600 0 1 1 0 3.200 1.600 1.600 0 0 1 0-3.200zm-4 4a1.600 1.600 0 1 1 0 3.200 1.600 1.600 0 0 1 0-3.200zm8 0a1.600 1.600 0 1 1 0 3.200 1.600 1.600 0 0 1 0-3.200z" fill-rule="evenodd"/></symbol>
  <symbol id="i-expand" viewBox="0 0 24 24"><path d="M5 4a1 1 0 0 0-1 1v5a1 1 0 0 0 2 0V7.400l3.300 3.300a1 1 0 0 0 1.400-1.400L7.400 6H10a1 1 0 0 0 0-2zm14 16a1 1 0 0 0 1-1v-5a1 1 0 0 0-2 0v2.600l-3.300-3.300a1 1 0 0 0-1.400 1.400l3.300 3.300H14a1 1 0 0 0 0 2z"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6.4 5a1 1 0 0 0-1.4 1.400L10.600 12 5 17.600A1 1 0 0 0 6.400 19l5.600-5.600 5.600 5.600a1 1 0 0 0 1.400-1.400L13.400 12 19 6.400A1 1 0 0 0 17.600 5L12 10.600z"/></symbol>
</defs></svg>

<div class="stage" id="app">
  <div class="bg d"></div><div class="bg l"></div>
  <div class="top">
    <button class="glass rnd" id="bClose" aria-label="Leave the table"><svg class="i"><use href="#i-close"/></svg></button>
    <h1><svg class="i"><use href="#i-die"/></svg>Dice</h1>
    <div class="tlbl">Dice</div>
    <div class="glass total">total <b id="total">–</b></div>
    <button class="glass rnd" id="bTable" aria-label="Full-screen table"><svg class="i"><use href="#i-expand"/></svg></button>
  </div>
  <div id="stage"></div>
  <div class="hint" id="hint">Tap the table to roll</div>

  <div class="deck glass">
    <div class="deckin">
      <div class="lbl">DICE</div>
      <div class="row" id="countRow"></div>
      <div class="lbl">STYLE</div>
      <div class="row" id="themeRow"></div>
      <button class="rollbtn" id="rollBtn"><svg class="i"><use href="#i-die"/></svg>ROLL</button>
      <div class="hist" id="hist"></div>
      <div class="upsell">
        <span class="e">🎲</span>
        <div class="t"><b>Dice — the full app</b><br>Real 3D physics, dice &amp; table packs, game rulebooks, pass-the-phone play.</div>
        <a href="https://apps.apple.com/app/id6761314774" target="_blank" rel="noopener">Get it</a>
      </div>
    </div>
  </div>
</div>

<script>
"use strict";
function el(i){return document.getElementById(i)}
/* Bridges are looked up when used, never kept: MyLLM can add them after this
   script has run. */
function haptic(k){if(window.myllmHaptic)try{myllmHaptic(k||'light')}catch(e){}}
function load(k){var s=window.myllmStorage;return s?s.getItem(k).catch(function(){return null}):Promise.resolve(null)}
function keep(k,v){var s=window.myllmStorage;if(s)try{s.setItem(k,v).catch(function(){})}catch(e){}}

/* ---------- look ---------- */
var onTable=false;
function isLight(){return !(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)}
/* The table takes the whole display and dims the room. Where MyLLM can't hide
   its own title bar, a dark stage under a white bar looks cut in half — so in
   light mode, without myllmImmersive, the table stays light. */
function syncLook(){
  var a=el('app');
  a.classList.toggle('lite',isLight()&&!(onTable&&window.myllmImmersive));
  a.classList.toggle('table',onTable);
}
function syncChrome(){
  if(!window.myllmImmersive)return;
  try{myllmImmersive(onTable,{keepAwake:false}).catch(function(){})}catch(e){}
}
function setTable(on){
  onTable=on;haptic('light');syncLook();syncChrome();
  if(!rolling)resizeDice();
}
/* the same three sizes as ever, a step up on the table, never wider than the room */
function dieSize(){
  var base=count<=2?110:(count<=4?92:74);
  if(onTable)base=Math.round(base*1.4);
  var box=el('stage'),w=box.clientWidth-32,h=box.clientHeight-32,gap=onTable?34:26;
  var cols=count<=3?count:Math.ceil(count/2),rows=count<=3?1:2;
  if(w>0&&h>0)base=Math.min(base,Math.floor((w-gap*(cols-1))/cols),Math.floor((h-gap*(rows-1))/rows/1.25));
  base=Math.max(40,base);
  /* pad the table in so the dice wrap into even rows (2+2, 3+3), not 3+1 */
  var side=Math.max(16,Math.floor((box.clientWidth-(base*cols+gap*(cols-1)))/2)-2);
  box.style.paddingLeft='calc('+side+'px + env(safe-area-inset-left))';
  box.style.paddingRight='calc('+side+'px + env(safe-area-inset-right))';
  return base;
}
function resizeDice(){
  var sz=dieSize();
  dice.forEach(function(d){d.elDie.style.setProperty('--sz',sz+'px')});
}

/* pip layouts on a 3x3 grid (row,col), 1-indexed */
var PIPS={1:[[2,2]],2:[[1,1],[3,3]],3:[[1,1],[2,2],[3,3]],4:[[1,1],[1,3],[3,1],[3,3]],
          5:[[1,1],[1,3],[2,2],[3,1],[3,3]],6:[[1,1],[1,3],[2,1],[2,3],[3,1],[3,3]]};
/* cube rotation that brings each value to face the viewer (opposites sum to 7) */
var ORIENT={1:[0,0],2:[-90,0],3:[0,-90],4:[0,90],5:[90,0],6:[0,180]};

var THEMES=[['t-ivory','Ivory'],['t-neon','Neon'],['t-ember','Ember']];
var count=2,theme='t-ivory',dice=[],rolling=false,spins=0;

function buildDice(){
  var stage=el('stage');stage.innerHTML='';dice=[];
  var sz=dieSize();
  for(var i=0;i<count;i++){
    var d=document.createElement('div');d.className='die';
    d.style.setProperty('--sz',sz+'px');
    for(var f=1;f<=6;f++){
      var face=document.createElement('div');face.className='face f'+f;
      PIPS[f].forEach(function(p){
        var pip=document.createElement('i');pip.className='pip';
        pip.style.gridRow=p[0];pip.style.gridColumn=p[1];
        face.appendChild(pip);
      });
      d.appendChild(face);
    }
    d.style.transform='rotateX(-18deg) rotateY(22deg)';
    stage.appendChild(d);dice.push({elDie:d,val:null});
  }
  el('total').textContent='–';
}
function roll(){
  if(rolling)return;
  rolling=true;spins++;haptic('medium');
  el('hint').textContent='';
  var vals=[];
  dice.forEach(function(d,i){
    var v=1+Math.floor(Math.random()*6);vals.push(v);d.val=v;
    var o=ORIENT[v];
    var tx=o[0]+360*(2+((spins+i)%2)), ty=o[1]+360*(2+(i%3)), tz=(Math.random()*14-7);
    d.elDie.style.transform='rotateX('+tx+'deg) rotateY('+ty+'deg) rotateZ('+tz.toFixed(1)+'deg)';
  });
  setTimeout(function(){
    var total=vals.reduce(function(a,b){return a+b},0);
    el('total').textContent=total;
    var allSame=vals.length>1&&vals.every(function(v){return v===vals[0]});
    addHist(vals,total,allSame);
    el('hint').textContent=allSame?(vals.length===2?'Doubles!':'All '+vals[0]+'s!'):'Tap the table to roll';
    haptic(allSame?'success':'light');
    rolling=false;
  },980);
}
function addHist(vals,total,dbl){
  var h=el('hist'),s=document.createElement('span');
  if(dbl)s.className='dbl';
  s.textContent=vals.join('+')+' = '+total;
  h.insertBefore(s,h.firstChild);
  while(h.children.length>14)h.removeChild(h.lastChild);
}
function buildCount(){
  var r=el('countRow');r.innerHTML='';
  for(var n=1;n<=6;n++)(function(n){
    var b=document.createElement('button');b.className='chip'+(n===count?' on':'');b.textContent=n;
    b.onclick=function(){count=n;keep('dice.count',String(n));buildCount();buildDice();haptic('selection');};
    r.appendChild(b);
  })(n);
}
function buildTheme(){
  var r=el('themeRow');r.innerHTML='';
  THEMES.forEach(function(t){
    var b=document.createElement('button');b.className='chip'+(t[0]===theme?' on':'');b.textContent=t[1];
    b.onclick=function(){theme=t[0];document.body.className=theme;keep('dice.theme',theme);buildTheme();haptic('selection');};
    r.appendChild(b);
  });
}
el('stage').addEventListener('click',roll);
el('rollBtn').onclick=roll;
el('bTable').onclick=function(){setTable(true)};
el('bClose').onclick=function(){setTable(false)};
document.addEventListener('visibilitychange',function(){
  if(!document.hidden&&onTable)syncChrome();      /* MyLLM puts its bars back when the app is left */
});
if(window.matchMedia){
  var mq=matchMedia('(prefers-color-scheme: dark)');
  if(mq.addEventListener)mq.addEventListener('change',syncLook);else if(mq.addListener)mq.addListener(syncLook);
}
window.addEventListener('resize',function(){if(!rolling)resizeDice()});

syncLook();
load('dice.count').then(function(v){
  if(v&&+v>=1&&+v<=6)count=+v;
  return load('dice.theme');
}).then(function(v){
  if(v&&THEMES.some(function(t){return t[0]===v})){theme=v;document.body.className=theme;}
  buildCount();buildTheme();buildDice();
});
</script>
</body></html>
