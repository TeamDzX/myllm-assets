<style>:root{--build-id:"ff0ade068b";color-scheme:light dark;
  --bg:var(--myllm-bg,#f2f2f7); --surface:var(--myllm-surface,#fff); --ink:var(--myllm-text,#111);
  --muted:var(--myllm-muted,#8a8a8e); --line:var(--myllm-border,#e3e3e8); --acc:var(--myllm-accent,#0a84ff);
  --fill:rgba(120,120,128,.12); --h:158; }
@media (prefers-color-scheme:dark){ :root{ --bg:var(--myllm-bg,#000); --surface:var(--myllm-surface,#1c1c1e);
  --ink:var(--myllm-text,#f2f2f7); --muted:var(--myllm-muted,#8e8e93); --line:var(--myllm-border,#2c2c2e); --fill:rgba(120,120,128,.24); } }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ font-family:var(--myllm-font,-apple-system,system-ui,sans-serif); background:var(--bg); color:var(--ink);
    max-width:600px; margin:0 auto; min-height:100dvh; font-size:15.5px; line-height:1.4;
    padding:calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(30px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left)); }
  @media (min-width:768px){ body{ max-width:760px; } }
  svg.i{ width:1.25em; height:1.25em; fill:currentColor; flex-shrink:0; }
  button{ font:inherit; color:inherit; cursor:pointer; } button:active{ transform:scale(.96); }

  .head{ display:flex; align-items:center; gap:12px; margin:2px 2px 14px; }
  .tile{ display:flex; align-items:center; justify-content:center; color:#fff; flex-shrink:0;
    background:linear-gradient(145deg, hsl(var(--h) 55% 42%), hsl(calc(var(--h) - 25) 55% 26%)); }
  .head .tile{ width:44px; height:44px; border-radius:13px; font-size:19px; }
  .head .ht{ flex:1; min-width:0; }
  h1{ font-size:22px; font-weight:800; letter-spacing:-.01em; }
  .head p{ font-size:13px; color:var(--muted); margin-top:1px; }

  .season{ display:inline-flex; align-items:center; gap:7px; font-size:12.5px; font-weight:700; color:hsl(var(--h) 55% 30%);
    background:hsl(var(--h) 55% 45% / .14); border-radius:99px; padding:6px 12px; margin:0 2px 12px; }
  @media (prefers-color-scheme:dark){ .season{ color:hsl(var(--h) 55% 64%); } }

  .card{ background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:14px; margin-bottom:12px; }
  label{ display:block; font-size:12px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); margin:14px 2px 7px; }
  label:first-child{ margin-top:0; }
  input{ width:100%; font:inherit; font-size:16px; padding:12px; border-radius:12px; border:1px solid var(--line); background:var(--bg); color:var(--ink); outline:none; }
  input:focus{ border-color:var(--acc); }
  .chips{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  @media (min-width:560px){ .chips{ grid-template-columns:repeat(4,1fr); } }
  .chip{ min-height:48px; border:1px solid var(--line); background:var(--bg); border-radius:14px; padding:8px 12px; font-size:14px; font-weight:650;
    display:flex; align-items:center; gap:8px; text-align:left; line-height:1.25; }
  .chip .e{ font-size:18px; flex-shrink:0; }
  .chip:disabled{ opacity:.5; }
  .ask{ display:flex; gap:8px; }
  .ask input{ flex:1; min-width:0; }
  .ask button{ flex-shrink:0; min-width:64px; border:none; border-radius:12px; background:var(--acc); color:#fff; font-size:15.5px; font-weight:700; padding:0 16px;
    display:flex; align-items:center; justify-content:center; gap:6px; }
  .ask button:disabled{ opacity:.55; }
  .status{ font-size:13px; color:var(--muted); min-height:18px; margin:4px 2px 0; }
  .status.err{ color:#ff453a; }

  .answer .top{ display:flex; align-items:center; gap:11px; margin-bottom:10px; }
  .answer .top .tile{ width:36px; height:36px; border-radius:10px; font-size:15px; }
  .answer .top b{ font-size:16px; font-weight:750; line-height:1.3; overflow-wrap:anywhere; }
  .answer .body{ font-size:15.5px; line-height:1.6; white-space:pre-wrap; overflow-wrap:anywhere; }
  .spin{ width:16px; height:16px; border-radius:50%; border:2.4px solid currentColor; border-right-color:transparent; animation:spin .8s linear infinite; flex-shrink:0; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .skel{ height:14px; border-radius:7px; background:var(--fill); margin-top:10px; animation:shimmer 1.4s ease-in-out infinite; }
  .skel.w8{ width:80%; } .skel.w6{ width:60%; } .skel.w9{ width:92%; }
  @keyframes shimmer{ 50%{ opacity:.45; } }
  [hidden]{ display:none !important; }
  @media (prefers-reduced-motion:reduce){ .spin{ animation-duration:2.4s; } .skel{ animation:none; } button:active{ transform:none; } }

  @keyframes myllmAiSpin{to{transform:rotate(360deg)}}
  .myllm-ai-busy{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(18px);z-index:99999;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;display:flex;align-items:center;gap:10px;background:rgba(28,28,30,.96);color:#fff;border-radius:999px;padding:10px 16px 10px 14px;box-shadow:0 6px 22px rgba(0,0,0,.4);font-size:14px;font-weight:600;max-width:92%}
  .myllm-ai-busy.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .myllm-ai-cog{width:16px;height:16px;border-radius:50%;border:2.4px solid #a78bfa;border-right-color:transparent;animation:myllmAiSpin .9s linear infinite;flex-shrink:0}
  .myllm-ai-busy small{font-weight:400;opacity:.6}

/* myllm-fullscreen-v2 — MyLLM 5.6.2+ opens this app full screen; the ✕ is the way out. */
.head .imm-acts{display:none;flex-shrink:0;margin-left:auto}
.head .acts + .imm-acts{margin-left:0}
body.imm .head .imm-acts{display:flex}
.head .imm-acts button{width:40px;height:40px;border-radius:12px;border:1px solid var(--myllm-border,rgba(128,128,128,.28));
  background:var(--myllm-surface,rgba(128,128,128,.12));color:var(--myllm-text,currentColor);display:grid;place-items:center;padding:0;cursor:pointer;transition:transform .12s}
.head .imm-acts button:active,.head .imm-x:active{transform:scale(.94)}
.head .imm-x{display:none !important}
body.imm .head .imm-x{display:grid !important;place-items:center}
.imm-x svg,.imm-acts svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}
.imm-safe{display:none}
body.imm .imm-safe{display:block}

  <symbol id="i-send" viewBox="0 0 24 24"><path d="M3.4 11.1L19.6 4a.9.9 0 0 1 1.2 1.2L13.9 21.4a.9.9 0 0 1-1.7-.1L10.5 14l-7.2-1.6a.9.9 0 0 1-.1-1.7z" fill="currentColor"/></symbol>
</defs></svg>
<script>
(function(){if(window.__myllmAiWrap||typeof window.myllmAsk!=='function')return;window.__myllmAiWrap=true;
var orig=window.myllmAsk,depth=0,node=null;
function ensure(){if(node)return;node=document.createElement('div');node.className='myllm-ai-busy';
node.innerHTML='<span class="myllm-ai-cog"></span><span>AI is thinking… <small>privately, on your device</small></span>';
(document.body||document.documentElement).appendChild(node);}
function show(){ensure();depth++;node.classList.add('on');}
function hide(){depth=Math.max(0,depth-1);if(depth===0&&node)node.classList.remove('on');}
window.myllmAsk=function(){show();var p;try{p=orig.apply(this,arguments);}catch(e){hide();throw e;}
return Promise.resolve(p).then(function(r){hide();return r;},function(e){hide();throw e;});};})();
</script>

<div class="imm-safe"></div><div class="head">
  <div class="tile"><svg class="i"><use href="#i-flower"/></svg></div>
  <div class="ht"><h1>Garden Coach</h1><p>Your AI gardening helper — what to plant right now, and answers to anything.</p></div>
<div class="imm-acts"><button type="button" aria-label="Close Garden Coach" onclick="myllmFSClose()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div></div>
<div class="season"><svg class="i"><use href="#i-cal"/></svg><span id="season"></span></div>

<div class="card">
  <label for="region">Your area</label>
  <input id="region" placeholder="Your area / climate (optional, e.g. UK, mild)" autocomplete="off">
  <label>Right now</label>
  <div class="chips">
    <button class="chip" type="button" data-q="vegetables to sow or plant now"><span class="e">🥕</span>Veg to sow now</button>
    <button class="chip" type="button" data-q="flowers to plant now"><span class="e">🌸</span>Flowers</button>
    <button class="chip" type="button" data-q="herbs to grow now"><span class="e">🌿</span>Herbs</button>
    <button class="chip" type="button" data-q="key gardening jobs to do this month"><span class="e">🧤</span>Jobs this month</button>
  </div>
  <label for="q">Ask anything</label>
  <div class="ask"><input id="q" placeholder="Ask the coach anything…" enterkeyhint="send" autocomplete="off"><button id="askBtn" type="button" aria-label="Ask"><svg class="i"><use href="#i-send"/></svg></button></div>
</div>
<div id="status" class="status"></div>
<div class="card answer" id="answer" hidden></div>

<script>
function el(i){return document.getElementById(i)}
/* Bridges are looked up when used, never kept: MyLLM can add them after this
   script has run. */
function store(){return window.myllmStorage||{getItem:function(){return Promise.resolve(null)},setItem:function(){return Promise.resolve()}}}
function haptic(k){if(window.myllmHaptic)try{myllmHaptic(k)}catch(e){}}
var month=new Date().toLocaleDateString(undefined,{month:'long'});
function setStatus(t,err){var s=el('status');s.textContent=t||'';s.classList.toggle('err',!!err)}
el('season').textContent='Tips tuned for '+month;

function regionClause(){var r=el('region').value.trim();return r?(' I garden in: '+r+'.'):''}
function busy(b){
  el('askBtn').disabled=b;el('askBtn').innerHTML=b?'<i class="spin"></i>':'<svg class="i"><use href="#i-send"/></svg>';
  var c=document.querySelectorAll('.chip');for(var i=0;i<c.length;i++)c[i].disabled=b;
}
function answerCard(heading){
  var a=el('answer');a.hidden=false;
  a.innerHTML='<div class="top"><div class="tile"><svg class="i"><use href="#i-flower"/></svg></div><b></b></div>';
  a.querySelector('b').textContent=heading;return a;
}

function run(prompt,heading){
  if(!window.myllmAsk){setStatus('This app needs AI — update MyLLM and enable “Allow apps to use the AI” in Settings.',true);return}
  busy(true);setStatus('');
  var a=answerCard(heading);
  a.insertAdjacentHTML('beforeend','<div class="skel w9"></div><div class="skel w8"></div><div class="skel w6"></div><div class="skel w8"></div>');
  store().setItem('region',el('region').value.trim());
  myllmAsk(prompt,{system:'You are a friendly, practical gardening expert. Be concise and specific. Prefer short bulleted lists. Assume a home gardener.'})
  .then(function(reply){
    var a=answerCard(heading);
    var b=document.createElement('div');b.className='body';b.textContent=String(reply).trim();a.appendChild(b);
    haptic('success');
    a.scrollIntoView({behavior:'smooth',block:'nearest'});
  }).catch(function(err){el('answer').hidden=true;setStatus('Coach unavailable: '+err.message,true)})
  .then(function(){busy(false)});
}
function quick(what){
  run('It is '+month+'.'+regionClause()+' List '+what+', as short bullet lines, each with a one-line tip. No preamble.',
      month+' · '+what.charAt(0).toUpperCase()+what.slice(1));
}
function ask(){
  var q=el('q').value.trim();if(!q)return;
  run('It is '+month+'.'+regionClause()+' Gardening question: '+q+' Answer concisely for a home gardener.', q);
  el('q').value='';
}

[].forEach.call(document.querySelectorAll('.chip'),function(c){c.onclick=function(){quick(c.getAttribute('data-q'))}});
el('askBtn').onclick=ask;
el('q').addEventListener('keydown',function(e){if(e.key==='Enter')ask()});
store().getItem('region').then(function(v){if(v)el('region').value=v});
if(!window.myllmAsk)setStatus('Heads-up: this app needs the latest MyLLM with apps-AI enabled.');

/* myllm-fullscreen-v2 — full screen where MyLLM can also close the app for us
   (myllmClose, 5.6.2+): full screen hides MyLLM's Done, and a page with no way
   out is worse than a repeated title, so elsewhere nothing changes.
   The spacer keeps the header clear of the status bar / Dynamic Island. It is
   live CSS — env(safe-area-inset-top) — not a measured number: the inset is
   still 0 when the page loads and only grows once MyLLM's bar has gone (v1
   measured once, so the title sat under the island). If the page's own styles
   already pad the header down by the inset, the spacer stays at 0. */
(function(){
  function full(){ return !!(window.myllmClose && window.myllmImmersive); }
  /* Does any rule that applies to the header or an ancestor already use the top inset? */
  function pageHandlesInset(head){
    var chain = [], n, found = false;
    for (n = head; n && n.nodeType === 1; n = n.parentElement) chain.push(n);
    function walk(rules){
      for (var i = 0; i < rules.length && !found; i++){
        var r = rules[i];
        if (r.cssRules && !r.selectorText) { walk(r.cssRules); continue; }
        if (!r.selectorText || !/safe-area-inset-top/.test(r.cssText) || !/(padding|margin|top)\s*:/.test(r.cssText)) continue;
        if (/\.imm-safe/.test(r.selectorText)) continue;
        for (var k = 0; k < chain.length; k++){
          try { if (chain[k].matches(r.selectorText)) { found = true; break; } } catch(e){}
        }
      }
    }
    for (var s = 0; s < document.styleSheets.length && !found; s++){
      try { walk(document.styleSheets[s].cssRules); } catch(e){}
    }
    for (n = head; n && n.nodeType === 1 && !found; n = n.parentElement){
      if (/safe-area-inset-top/.test(n.getAttribute("style") || "")) found = true;
    }
    return found;
  }
  function fit(){
    var sp = document.querySelector(".imm-safe"), head = document.querySelector(".head");
    if (!sp || !head) return;
    sp.style.height = (document.body.classList.contains("imm") && !pageHandlesInset(head)) ? "env(safe-area-inset-top)" : "0px";
  }
  function sync(){
    var f = full();
    document.body.classList.toggle("imm", f);
    fit();
    if (!f) return;
    try { window.myllmImmersive(true, { keepAwake:false }).catch(function(){}); } catch(e){}
  }
  window.myllmFSClose = function(){
    try { if (window.myllmHaptic) window.myllmHaptic("light"); } catch(e){}
    try { window.myllmClose().catch(function(){}); } catch(e){}
  };
  document.addEventListener("visibilitychange", function(){ if (!document.hidden) sync(); });
  sync();
})();
</script></body></html>
