<title>White Noise</title>
<style>:root{--build-id:"2202dcf9b0";color-scheme:light dark;--accent:var(--myllm-accent,#5e5ce6)}
  /* MyLLM's own theme where it supplies one, else the phone's appearance. */
  :root{ --bg:var(--myllm-bg,#f2f2f7); --surface:var(--myllm-surface,#fff); --ink:var(--myllm-text,#111); --mut:var(--myllm-muted,#8a8a8e); --line:var(--myllm-border,#e3e3e8); --ring:#c7c7cc; }
  @media (prefers-color-scheme:dark){ :root{ --bg:var(--myllm-bg,#000); --surface:var(--myllm-surface,#1c1c1e); --ink:var(--myllm-text,#f2f2f7); --mut:var(--myllm-muted,#98989f); --line:var(--myllm-border,#2c2c2e); --ring:#48484a; } }
  @property --h{ syntax:'<number>'; inherits:true; initial-value:245; }
  @property --h2{ syntax:'<number>'; inherits:true; initial-value:305; }
  @property --s{ syntax:'<percentage>'; inherits:true; initial-value:60%; }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{
    font-family:var(--myllm-font,-apple-system,system-ui,sans-serif);
    background:var(--bg); color:var(--ink);
    max-width:600px; margin:0 auto; min-height:100dvh;
    padding:16px 16px calc(206px + env(safe-area-inset-bottom));
  }
  body.lock{ overflow:hidden; }
  h1{ font-size:22px; font-weight:800; margin:4px 2px 4px; }
  .sub{ font-size:13px; color:var(--mut); margin:0 2px 14px; line-height:1.4; }
  button{ font:inherit; color:inherit; }
  svg{ width:1.25em; height:1.25em; fill:currentColor; flex-shrink:0; }

  /* Sound art: a hue-tinted tile carrying the sound's glyph. */
  .tile{ display:flex; align-items:center; justify-content:center; color:rgba(255,255,255,.95);
    background:linear-gradient(145deg, hsl(var(--th,215) var(--ts,62%) 50%), hsl(calc(var(--th,215) + 40) var(--ts,62%) 27%)); }

  /* Sound cards */
  .sound{ background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:11px 13px; margin-bottom:9px;
    transition:border-color .2s, box-shadow .2s; }
  .sound.on{ border-color:var(--accent); box-shadow:0 0 0 1px var(--accent), 0 6px 20px rgba(0,0,0,.07); }
  .head{ display:flex; align-items:center; gap:12px; cursor:pointer; }
  .head .tile{ width:42px; height:42px; border-radius:12px; font-size:18px; flex-shrink:0; }
  .head .nm{ flex:1; min-width:0; font-size:15.5px; font-weight:700; }
  .head .nm small{ display:block; font-size:12px; font-weight:400; color:var(--mut); margin-top:1px; }
  .dot{ width:24px; height:24px; border-radius:50%; border:2px solid var(--ring); flex:none; display:flex; align-items:center; justify-content:center; color:transparent; font-size:12px; }
  .sound.on .dot{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .vol{ width:100%; margin-top:12px; accent-color:var(--accent); display:none; }
  .sound.on .vol{ display:block; }

  /* Bottom bar */
  .bar{ position:fixed; left:0; right:0; bottom:0; z-index:5; background:var(--surface); border-top:1px solid var(--line);
    box-shadow:0 -6px 24px rgba(0,0,0,.08); padding:12px 16px calc(12px + env(safe-area-inset-bottom)); }
  .bar > div{ max-width:568px; margin-left:auto; margin-right:auto; }
  .barrow{ display:flex; align-items:center; gap:12px; }
  .play{ border:0; background:var(--accent); color:#fff; border-radius:50%; width:48px; height:48px; font-size:18px; flex:none; display:flex; align-items:center; justify-content:center; }
  .play:active, .open:active{ transform:scale(.95); }
  .mixinfo{ flex:1; min-width:0; cursor:pointer; }
  .mixname{ font-size:15px; font-weight:750; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .mixsub{ font-size:12px; color:var(--mut); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-variant-numeric:tabular-nums; }
  .open{ width:40px; height:40px; border-radius:50%; flex:none; border:1px solid var(--line); background:var(--bg); display:flex; align-items:center; justify-content:center; font-size:15px; }
  .volrow{ display:flex; align-items:center; gap:10px; margin-top:12px; color:var(--mut); font-size:15px; }
  .mvol{ flex:1; min-width:0; accent-color:var(--accent); }
  .timer{ display:flex; gap:6px; margin-top:10px; justify-content:center; }
  .timer button{ border:1px solid var(--line); background:var(--bg); border-radius:99px; padding:6px 14px; font-size:13px; font-weight:650; }
  .timer button.on{ background:var(--accent); border-color:var(--accent); color:#fff; }

  /* EQ animation */
  .eq{ display:inline-flex; align-items:flex-end; gap:2px; height:11px; margin-right:6px; vertical-align:-1px; }
  .eq i{ width:3px; border-radius:2px; background:#30d158; animation:eq 1s ease-in-out infinite; }
  .eq i:nth-child(2){ animation-delay:.25s; } .eq i:nth-child(3){ animation-delay:.5s; }
  @keyframes eq{ 0%,100%{ height:4px; } 50%{ height:11px; } }

  /* Night view: the whole display, tinted by the mix. Two backdrop layers,
     dark and light, so the look can follow the phone's appearance. */
  .full{ display:none; position:fixed; inset:0; z-index:50; color:#fff; overflow:hidden; --h:245; --h2:305; --s:60%;
    transition:--h 2.2s ease, --h2 2.2s ease, --s 2.2s ease; }
  .full.on{ display:block; }
  .bg{ position:absolute; inset:0; }
  .bg.d{ background:radial-gradient(120% 90% at 20% 10%, hsl(var(--h) var(--s) 30%), transparent 60%),
      radial-gradient(120% 90% at 85% 95%, hsl(var(--h2) var(--s) 24%), transparent 62%), #08080d; }
  .bg.l{ display:none; background:radial-gradient(120% 90% at 20% 0%, hsl(var(--h) var(--s) 85%), transparent 60%),
      radial-gradient(120% 90% at 85% 100%, hsl(var(--h2) var(--s) 87%), transparent 62%), #f4f4f8; }
  .blob{ position:absolute; width:74vmax; height:74vmax; border-radius:50%; filter:blur(70px); opacity:.34; pointer-events:none;
    background:hsl(var(--h) var(--s) 42%); left:-30vmax; top:-24vmax; animation:drift 46s ease-in-out infinite alternate; }
  .blob.b{ background:hsl(var(--h2) var(--s) 38%); left:auto; top:auto; right:-32vmax; bottom:-26vmax; animation-name:driftB; animation-duration:58s; }
  @keyframes drift{ from{ transform:translate(0,0) scale(1); } to{ transform:translate(22vmax,16vmax) scale(1.18); } }
  @keyframes driftB{ from{ transform:translate(0,0) scale(1.1); } to{ transform:translate(-20vmax,-18vmax) scale(.95); } }
  .scrim{ position:absolute; inset:0; background:linear-gradient(180deg, rgba(8,8,12,.18) 0%, rgba(8,8,12,.34) 50%, rgba(8,8,12,.62) 100%); }
  .inner{ position:absolute; inset:0; overflow-y:auto; -webkit-overflow-scrolling:touch; display:flex; flex-direction:column; align-items:center; text-align:center;
    padding:calc(12px + env(safe-area-inset-top)) calc(22px + env(safe-area-inset-right)) calc(22px + env(safe-area-inset-bottom)) calc(22px + env(safe-area-inset-left)); }
  .ftop{ width:100%; max-width:520px; display:flex; justify-content:space-between; align-items:center; flex-shrink:0; }
  .lbl{ font-size:11px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; opacity:.62; }
  .glass{ border:1px solid rgba(255,255,255,.16); background:rgba(255,255,255,.12); color:inherit;
    -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px); }
  .ftop button{ height:40px; min-width:40px; border-radius:99px; padding:0 14px; font-size:13.5px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; gap:7px; }
  .ftop button.rnd{ padding:0; }
  .fbody{ width:100%; max-width:520px; margin:auto 0; display:flex; flex-direction:column; align-items:center; padding:16px 0 4px; }
  .pads{ width:100%; max-width:400px; display:grid; grid-template-columns:repeat(4,1fr); gap:10px; flex-shrink:0; }
  .pad{ aspect-ratio:1; border-radius:20px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; font-size:22px;
    transition:transform .15s, background .3s, border-color .3s; }
  .pad span{ font-size:10.5px; font-weight:700; letter-spacing:.01em; opacity:.75; white-space:nowrap; }
  .pad:active{ transform:scale(.94); }
  .full .pad.glass.on{ color:#fff; border-color:rgba(255,255,255,.4); box-shadow:0 10px 26px hsl(var(--th) var(--ts) 30% / .45);
    background:linear-gradient(145deg, hsl(var(--th) var(--ts) 54%), hsl(calc(var(--th) + 40) var(--ts) 30%)); }
  .pad.on span{ opacity:.95; }
  .fside{ width:100%; display:flex; flex-direction:column; align-items:center; }
  .fstate{ display:inline-flex; align-items:center; font-size:11.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; opacity:.7; min-height:16px; margin-top:24px; }
  .fstate .eq{ display:none; } .fstate.live{ color:#4be07d; opacity:1; } .fstate.live .eq{ display:inline-flex; } .fstate .eq i{ background:#4be07d; }
  .ftitle{ font-size:24px; font-weight:800; line-height:1.2; letter-spacing:-.01em; margin-top:8px; max-width:100%;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .fbtn{ width:84px; height:84px; border-radius:50%; border:none; background:#fff; color:#0b0b10; font-size:28px; margin-top:20px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; box-shadow:0 10px 30px rgba(0,0,0,.35); }
  .fbtn:active{ transform:scale(.94); }
  .fbtn:disabled{ opacity:.35; }
  .fvol{ width:100%; max-width:340px; display:flex; align-items:center; gap:12px; margin-top:22px; font-size:16px; opacity:.9; }
  .fvol input{ flex:1; min-width:0; -webkit-appearance:none; appearance:none; height:6px; border-radius:99px; background:rgba(255,255,255,.24); outline:none; }
  .fvol input::-webkit-slider-thumb{ -webkit-appearance:none; appearance:none; width:24px; height:24px; border-radius:50%; background:#fff; border:none; box-shadow:0 3px 10px rgba(0,0,0,.35); }
  .fvol input::-moz-range-thumb{ width:24px; height:24px; border-radius:50%; background:#fff; border:none; }
  .ftimer{ display:flex; gap:7px; margin-top:20px; justify-content:center; }
  .ftimer button{ border-radius:99px; padding:8px 15px; font-size:13px; font-weight:700; }
  .ftimer button.on{ background:#fff; border-color:#fff; color:#0b0b10; }
  .fnote{ font-size:12.5px; opacity:.6; margin-top:10px; min-height:16px; font-variant-numeric:tabular-nums; }

  /* Light variant: on a MyLLM build that can't hide its title bar, a dark
     night view under a white bar looks cut in half — so in light mode,
     without myllmImmersive, it stays light and runs on from the bar. */
  .full.lite{ color:#15151a; }
  .full.lite .bg.d{ display:none; } .full.lite .bg.l{ display:block; }
  .full.lite .blob{ opacity:.55; background:hsl(var(--h) var(--s) 80%); } .full.lite .blob.b{ background:hsl(var(--h2) var(--s) 82%); }
  .full.lite .scrim{ background:linear-gradient(180deg, rgba(255,255,255,.35) 0%, rgba(255,255,255,.15) 45%, rgba(255,255,255,.5) 100%); }
  .full.lite .glass{ border-color:rgba(0,0,0,.09); background:rgba(255,255,255,.62); }
  .full.lite .pad.glass.on{ border-color:rgba(255,255,255,.6); box-shadow:0 10px 24px hsl(var(--th) var(--ts) 40% / .3); }
  .full.lite .fstate.live{ color:#1c9a4a; } .full.lite .fstate .eq i{ background:#1c9a4a; }
  .full.lite .fbtn{ background:#15151a; color:#fff; box-shadow:0 10px 26px rgba(20,20,40,.25); }
  .full.lite .fvol input{ background:rgba(0,0,0,.14); }
  .full.lite .fvol input::-webkit-slider-thumb{ background:#15151a; box-shadow:0 3px 10px rgba(20,20,40,.25); }
  .full.lite .ftimer button.on{ background:#15151a; border-color:#15151a; color:#fff; }

  /* Bedside dock: true black, a dim clock, everything drifting a little so
     nothing burns in. */
  .dock{ display:none; position:fixed; inset:0; z-index:60; background:#000; color:#fff; overflow:hidden; }
  .dock.on{ display:block; }
  .dock .drift{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:0 24px; text-align:center;
    transition:transform 20s ease-in-out; }
  .dock .dclock{ font-size:min(27vw,150px); font-weight:200; letter-spacing:.01em; line-height:1; color:#c9c9cf; font-variant-numeric:tabular-nums; }
  .dock .ddate{ font-size:14px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:#5d5d66; margin-bottom:14px; }
  .dock .dmix{ font-size:16px; font-weight:650; color:#a9a9b2; max-width:min(86vw,520px); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .dock .dmix .eq{ height:9px; opacity:.8; } .dock .dmix .eq i{ width:2.5px; background:#3fae63; }
  .dock .dnote{ font-size:13.5px; font-weight:600; color:#6a6a74; min-height:17px; font-variant-numeric:tabular-nums; }
  .dock .ctl{ position:absolute; left:0; right:0; bottom:calc(30px + env(safe-area-inset-bottom)); display:flex; justify-content:center; gap:12px;
    opacity:0; transition:opacity .3s; pointer-events:none; }
  .dock .ctl.on{ opacity:1; pointer-events:auto; }
  .dock .ctl button{ border:1px solid #2c2c33; background:#121216; color:#eee; border-radius:99px; padding:12px 22px; font-size:15px; font-weight:700; display:inline-flex; align-items:center; gap:8px; }
  .dock .hint{ position:absolute; bottom:calc(34px + env(safe-area-inset-bottom)); left:0; right:0; text-align:center; font-size:12px; color:#4a4a52; transition:opacity .6s; }

  @media (orientation:landscape) and (max-height:560px){
    .dock .dclock{ font-size:min(30vh,170px); }
    .fbody{ flex-direction:row; align-items:center; gap:34px; max-width:760px; padding:6px 0 0; }
    .pads{ flex:1 1 0; max-width:340px; gap:8px; } .pad{ border-radius:16px; font-size:19px; gap:4px; }
    .fside{ flex:1 1 0; min-width:0; }
    .fstate{ margin-top:0; } .ftitle{ font-size:20px; margin-top:4px; -webkit-line-clamp:1; }
    .fbtn{ width:64px; height:64px; font-size:22px; margin-top:12px; } .fvol{ margin-top:14px; } .ftimer{ margin-top:12px; } .fnote{ margin-top:6px; }
  }
  @media (max-height:700px) and (orientation:portrait){
    .fstate{ margin-top:16px; } .fbtn{ width:72px; height:72px; margin-top:14px; } .fvol{ margin-top:16px; } .ftimer{ margin-top:14px; }
  }
  @media (prefers-reduced-motion:reduce){ .blob, .eq i{ animation:none; } .full{ transition:none; } .dock .drift{ transition:none; } }
</style></head><body>

<!-- Night view -->
<div class="full" id="full">
  <div class="bg d"></div><div class="bg l"></div>
  <div class="blob"></div><div class="blob b"></div>
  <div class="scrim"></div>
  <div class="inner">
    <div class="ftop">
      <button class="glass rnd" onclick="closeFull()" aria-label="Close"><svg><use href="#i-down"/></svg></button>
      <div class="lbl">White Noise</div>
      <button class="glass" onclick="openDock()" aria-label="Bedside dock"><svg><use href="#i-moon"/></svg>Dock</button>
    </div>
    <div class="fbody">
      <div class="pads" id="pads"></div>
      <div class="fside">
        <div class="fstate" id="fState"><span class="eq"><i></i><i></i><i></i></span><span id="fStateT"></span></div>
        <div class="ftitle" id="fTitle"></div>
        <button class="fbtn" id="fBtn" onclick="toggleAll()" aria-label="Play or pause"></button>
        <div class="fvol"><svg><use href="#i-vlo"/></svg><input id="fvol" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Volume"><svg><use href="#i-vhi"/></svg></div>
        <div class="ftimer" id="fTimer"></div>
        <div class="fnote" id="fNote"></div>
      </div>
    </div>
  </div>
</div>

<!-- Bedside dock -->
<div class="dock" id="dock" onclick="dockTap()">
  <div class="drift" id="dDrift">
    <div class="dclock" id="dClock">--:--</div>
    <div class="ddate" id="dDate"></div>
    <div class="dmix"><span class="eq" id="dEq"><i></i><i></i><i></i></span><span id="dMix"></span></div>
    <div class="dnote" id="dNote"></div>
  </div>
  <div class="hint" id="dHint">Tap for controls</div>
  <div class="ctl" id="dCtl">
    <button onclick="toggleAll();event.stopPropagation()" id="dBtn"></button>
    <button onclick="closeDock();event.stopPropagation()">Exit dock</button>
  </div>
</div>

<h1>White Noise</h1>
<div class="sub">Tap sounds to mix your own — rain, fire, ocean and more. All made on-device, works offline.</div>
<div id="list"></div>
<div class="bar">
  <div class="barrow">
    <button class="play" id="play" onclick="toggleAll()" aria-label="Play or pause"></button>
    <div class="mixinfo" onclick="openFull()">
      <div class="mixname" id="mixName"></div>
      <div class="mixsub" id="mixSub"></div>
    </div>
    <button class="open" onclick="openFull()" aria-label="Open night view"><svg><use href="#i-up"/></svg></button>
  </div>
  <div class="volrow">
    <svg><use href="#i-vlo"/></svg>
    <input class="mvol" id="mvol" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">
    <svg><use href="#i-vhi"/></svg>
  </div>
  <div class="timer" id="timer"></div>
</div>
<script>
/* Bridges are looked up when used, never kept: MyLLM can add them after this
   script has run. */
function haptic(s){ if (window.myllmHaptic) try { myllmHaptic(s); } catch(_){} }
function load(k){ var s = window.myllmStorage; return s ? s.getItem(k).catch(function(){ return null; }) : Promise.resolve(null); }
function keep(k, v){ var s = window.myllmStorage; if (s) try { s.setItem(k, v).catch(function(){}); } catch(_){} }

var DEFS=[
 {id:'rain',n:'Rain',d:'steady rainfall',h:212,s:66},
 {id:'ocean',n:'Ocean',d:'rolling waves',h:195,s:70},
 {id:'fire',n:'Fireplace',d:'crackling fire',h:18,s:78},
 {id:'stream',n:'Stream',d:'bubbling water',h:172,s:62},
 {id:'wind',n:'Wind',d:'gentle gusts',h:140,s:48},
 {id:'white',n:'White noise',d:'pure static',h:230,s:12},
 {id:'pink',n:'Pink noise',d:'softer hiss',h:330,s:62},
 {id:'brown',n:'Brown noise',d:'deep rumble',h:28,s:48}];
var TIMERS=[['Off',0],['15m',15],['30m',30],['60m',60]];
var ctx=null,master=null,built={},active={},vol={},masterVol=0.8,playing=false,sleepMin=0,sleepHandle=null,sleepEnd=0,sleepTick=null,sleepDone=false;
function el(i){return document.getElementById(i)}
function ico(id){return '<svg><use href="#'+id+'"/></svg>'}
DEFS.forEach(function(s){vol[s.id]=0.6});

// ---- audio synthesis (no files) ----
function ensureCtx(){if(!ctx){var AC=window.AudioContext||window.webkitAudioContext;ctx=new AC();master=ctx.createGain();master.gain.value=masterVol;master.connect(ctx.destination)}if(ctx.state==='suspended')ctx.resume()}
function noiseBuffer(type,secs){
  var len=Math.floor(ctx.sampleRate*(secs||2)),buf=ctx.createBuffer(1,len,ctx.sampleRate),d=buf.getChannelData(0),i;
  if(type==='brown'){var last=0;for(i=0;i<len;i++){var w=Math.random()*2-1;last=(last+0.02*w)/1.02;d[i]=last*3.5}}
  else if(type==='pink'){var b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;for(i=0;i<len;i++){var w=Math.random()*2-1;b0=0.99886*b0+w*0.0555179;b1=0.99332*b1+w*0.0750759;b2=0.96900*b2+w*0.1538520;b3=0.86650*b3+w*0.3104856;b4=0.55000*b4+w*0.5329522;b5=-0.7616*b5-w*0.0168980;d[i]=(b0+b1+b2+b3+b4+b5+b6+w*0.5362)*0.11;b6=w*0.115926}}
  else{for(i=0;i<len;i++)d[i]=Math.random()*2-1}
  return buf;
}
function src(type){var s=ctx.createBufferSource();s.buffer=noiseBuffer(type);s.loop=true;return s}
function filt(type,freq,q){var f=ctx.createBiquadFilter();f.type=type;f.frequency.value=freq;if(q!=null)f.Q.value=q;return f}
function lfoTo(param,rate,depth,base){var o=ctx.createOscillator();o.type='sine';o.frequency.value=rate;var g=ctx.createGain();g.gain.value=depth;o.connect(g);g.connect(param);if(base!=null)param.value=base;o.start();return o}

function buildSound(id){
  var g=ctx.createGain();g.gain.value=vol[id];g.connect(master);
  var s,extra=[],crackle=null;
  if(id==='white'){s=src('white');s.connect(g)}
  else if(id==='pink'){s=src('pink');s.connect(g)}
  else if(id==='brown'){s=src('brown');s.connect(g)}
  else if(id==='rain'){s=src('pink');var hp=filt('highpass',600),lp=filt('lowpass',9000);s.connect(hp);hp.connect(lp);lp.connect(g)}
  else if(id==='stream'){s=src('white');var hp=filt('highpass',1600),lp=filt('lowpass',7000);s.connect(hp);hp.connect(lp);lp.connect(g);extra.push(lfoTo(lp.frequency,0.9,1400,5000))}
  else if(id==='wind'){s=src('pink');var bp=filt('bandpass',500,0.7);s.connect(bp);bp.connect(g);extra.push(lfoTo(bp.frequency,0.08,380,520))}
  else if(id==='ocean'){s=src('brown');var lp=filt('lowpass',700);var wave=ctx.createGain();wave.gain.value=0.6;s.connect(lp);lp.connect(wave);wave.connect(g);extra.push(lfoTo(wave.gain,0.11,0.45,0.55))}
  else if(id==='fire'){s=src('brown');var lp=filt('lowpass',1100);s.connect(lp);lp.connect(g);crackle=startCrackle(g)}
  s.start();
  return {g:g,s:s,extra:extra,crackle:crackle};
}
var crackleBuf=null;
function startCrackle(dest){
  var stopped=false;
  function pop(){
    if(stopped||!ctx)return;
    if(!crackleBuf)crackleBuf=noiseBuffer('white',0.2);
    var b=ctx.createBufferSource();b.buffer=crackleBuf;
    var f=filt('bandpass',1000+Math.random()*2500,1.2);
    var cg=ctx.createGain();var t=ctx.currentTime;
    cg.gain.setValueAtTime(0.0001,t);
    cg.gain.exponentialRampToValueAtTime(0.25+Math.random()*0.5,t+0.004);
    cg.gain.exponentialRampToValueAtTime(0.0001,t+0.04+Math.random()*0.09);
    b.connect(f);f.connect(cg);cg.connect(dest);b.start(t);b.stop(t+0.2);
    setTimeout(pop,90+Math.random()*420);
  }
  pop();
  return {cancel:function(){stopped=true}};
}
function killSound(o){try{o.s.stop()}catch(e){}o.extra.forEach(function(x){try{x.stop()}catch(e){}});if(o.crackle)o.crackle.cancel();try{o.g.disconnect()}catch(e){}}

// ---- control ----
function anyActive(){return Object.keys(active).some(function(k){return active[k]})}
function startId(id){if(!built[id]){ensureCtx();built[id]=buildSound(id)}}
function stopId(id){if(built[id]){killSound(built[id]);delete built[id]}}
function toggle(id){
  if(active[id]){active[id]=false;stopId(id)}
  else{active[id]=true;playing=true;
    Object.keys(active).forEach(function(k){if(active[k])startId(k)})}   // a paused mix comes back whole, not just the new sound
  if(!anyActive())playing=false;
  haptic('selection');
  save();render();
}
function setVol(id,v){vol[id]=v;if(built[id])built[id].g.gain.value=v;save();paintHue()}
function setMaster(v){masterVol=v;if(master)master.gain.value=v;el('mvol').value=v;el('fvol').value=v;save()}
function toggleAll(){
  if(!anyActive())return;
  haptic('light');
  if(playing){playing=false;Object.keys(built).forEach(stopId)}
  else{playing=true;ensureCtx();Object.keys(active).forEach(function(k){if(active[k])startId(k)})}
  render();
}

// ---- sleep timer ----
/* The end time is kept, not just a timeout: a phone that dozes stretches
   timers, so every tick checks the clock. */
function setTimer(min){
  haptic('selection');
  sleepMin=min;sleepDone=false;
  if(sleepHandle){clearTimeout(sleepHandle);sleepHandle=null}
  if(sleepTick){clearInterval(sleepTick);sleepTick=null}
  sleepEnd=min>0?Date.now()+min*60000:0;
  if(min>0){sleepHandle=setTimeout(checkSleep,min*60000);sleepTick=setInterval(checkSleep,1000)}
  renderTimer();
}
function checkSleep(){
  if(!sleepEnd)return;
  if(Date.now()<sleepEnd){paintNotes();return}
  if(sleepHandle){clearTimeout(sleepHandle);sleepHandle=null}
  if(sleepTick){clearInterval(sleepTick);sleepTick=null}
  sleepEnd=0;sleepMin=0;sleepDone=true;
  playing=false;Object.keys(built).forEach(stopId);
  /* Leave the dock and the night view: that hands the screen back to the
     phone's own auto-lock, so it can sleep too. */
  if(dockOn){if(fullOn)closeFull(true);closeDock()}
  render();renderTimer();
}
function fmtLeft(){
  var s=Math.max(0,Math.ceil((sleepEnd-Date.now())/1000)),m=Math.floor(s/60);s=s%60;
  return m+':'+(s<10?'0':'')+s;
}

// ---- look ----
function mixName(){
  var on=DEFS.filter(function(s){return active[s.id]}).map(function(s){return s.n});
  return on.length?on.join(' · '):'';
}
var hueNow=245,hue2Now=305;
function near(from,to){return from+((((to-from)%360)+540)%360)-180}
function paintHue(){
  var on=DEFS.filter(function(s){return active[s.id]}).map(function(s){return {d:s,w:Math.max(0.05,vol[s.id])}})
    .sort(function(a,b){return b.w-a.w});
  var h=245,h2=305,sat=60;
  if(on.length){
    var x=0,y=0,sw=0,ss=0;
    on.forEach(function(o){var r=o.d.h*Math.PI/180;x+=Math.cos(r)*o.w;y+=Math.sin(r)*o.w;ss+=o.d.s*o.w;sw+=o.w});
    h=(Math.abs(x)+Math.abs(y)<0.001)?on[0].d.h:Math.atan2(y,x)*180/Math.PI;
    h2=on[1]?on[1].d.h:h+60;
    sat=ss/sw;
  }
  hueNow=near(hueNow,h);hue2Now=near(hue2Now,h2);
  var f=el('full').style;
  f.setProperty('--h',String(Math.round(hueNow)));f.setProperty('--h2',String(Math.round(hue2Now)));f.setProperty('--s',Math.round(sat)+'%');
}
function paintNotes(){
  var left=sleepEnd?('Stops in '+fmtLeft()):'';
  var name=mixName(),any=!!name;
  el('mixName').textContent=any?name:'Pick a sound';
  el('mixSub').textContent=left||(sleepDone?'Sleep timer finished':(any?(playing?'Playing · tap for night view':'Paused · tap for night view'):'Tap sounds to build your mix'));
  el('fTitle').textContent=any?name:'Pick a sound';
  el('fStateT').textContent=any?(playing?'Playing':'Paused'):'Nothing playing';
  el('fState').classList.toggle('live',playing);
  el('fNote').textContent=left||(sleepDone?'Sleep timer finished':'');
  el('dMix').textContent=any?name:'Nothing playing';
  el('dEq').style.display=playing?'':'none';
  el('dNote').textContent=left||(playing?'':'Paused');
}

// ---- render ----
function render(){
  var L=el('list');L.innerHTML='';
  DEFS.forEach(function(s){
    var on=!!active[s.id];
    var d=document.createElement('div');d.className='sound'+(on?' on':'');
    d.innerHTML='<div class="head"><div class="tile" style="--th:'+s.h+';--ts:'+s.s+'%">'+ico('s-'+s.id)+'</div><div class="nm">'+s.n+'<small>'+s.d+'</small></div><div class="dot">'+ico('i-check')+'</div></div>'+
      '<input class="vol" type="range" min="0" max="1" step="0.01" value="'+vol[s.id]+'" aria-label="'+s.n+' volume">';
    d.querySelector('.head').onclick=function(){toggle(s.id)};
    var sl=d.querySelector('.vol');sl.oninput=function(){setVol(s.id,parseFloat(sl.value))};
    L.appendChild(d);
    var p=el('pad-'+s.id);if(p)p.classList.toggle('on',on);
  });
  var any=anyActive(),pi=playing?ico('i-pause'):ico('i-play');
  el('play').innerHTML=pi;el('fBtn').innerHTML=pi;
  el('play').style.opacity=any?'':'.4';el('fBtn').disabled=!any;
  el('dBtn').innerHTML=playing?ico('i-pause')+'Pause':ico('i-play')+'Play';
  paintHue();paintNotes();
}
function buildPads(){
  var P=el('pads');
  DEFS.forEach(function(s){
    var b=document.createElement('button');b.className='pad glass';b.id='pad-'+s.id;
    b.style.setProperty('--th',s.h);b.style.setProperty('--ts',s.s+'%');
    b.innerHTML=ico('s-'+s.id)+'<span>'+s.n.replace(' noise','')+'</span>';
    b.onclick=function(){toggle(s.id)};
    P.appendChild(b);
  });
}
function renderTimer(){
  ['timer','fTimer'].forEach(function(id){
    var T=el(id);T.innerHTML='';
    TIMERS.forEach(function(t){var b=document.createElement('button');b.textContent=t[0];b.className=(id==='fTimer'?'glass':'')+(sleepMin===t[1]?' on':'');b.onclick=function(){setTimer(t[1])};T.appendChild(b)});
  });
  paintNotes();
}
function save(){keep('wn',JSON.stringify({active:active,vol:vol,master:masterVol}))}

// ---- night view and dock ----
/* Both want the whole display. myllmImmersive hides MyLLM's own title bar and
   the status bar; only the dock asks for the screen to stay awake. On a build
   without it both views still work — they just sit under the title bar. */
var fullOn=false,dockOn=false,dockClock=null,dockDrift=null,dockCtlTimer=null,wakeLock=null;
function syncChrome(){
  if(!window.myllmImmersive)return;
  try{myllmImmersive(fullOn||dockOn,{keepAwake:dockOn}).catch(function(){})}catch(_){}
}
function syncLook(){
  el('full').classList.toggle('lite',!window.myllmImmersive&&!(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches));
}
function openFull(){
  haptic('light');
  fullOn=true;syncLook();paintHue();paintNotes();
  el('full').classList.add('on');document.body.classList.add('lock');
  syncChrome();
}
function closeFull(quiet){
  if(quiet!==true)haptic('light');
  fullOn=false;
  el('full').classList.remove('on');document.body.classList.remove('lock');
  syncChrome();
}
var DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
function dockTime(){
  var d=new Date(),h=d.getHours(),m=d.getMinutes();
  el('dClock').textContent=(h<10?'0':'')+h+':'+(m<10?'0':'')+m;
  el('dDate').textContent=DAYS[d.getDay()]+' '+d.getDate()+' '+MONTHS[d.getMonth()];
}
function driftOnce(){
  var x=Math.round((Math.random()-0.5)*44),y=Math.round((Math.random()-0.5)*44);
  el('dDrift').style.transform='translate('+x+'px,'+y+'px)';
}
function requestWake(){
  if(!('wakeLock' in navigator))return;
  navigator.wakeLock.request('screen').then(function(l){wakeLock=l}).catch(function(){wakeLock=null});
}
function releaseWake(){if(wakeLock){try{wakeLock.release()}catch(_){}wakeLock=null}}
function openDock(){
  haptic('medium');
  dockOn=true;
  dockTime();driftOnce();paintNotes();
  el('dock').classList.add('on');document.body.classList.add('lock');
  el('dCtl').classList.remove('on');
  el('dHint').style.opacity='1';
  setTimeout(function(){el('dHint').style.opacity='0'},4000);
  dockClock=setInterval(dockTime,15000);
  dockDrift=setInterval(driftOnce,60000);
  requestWake();syncChrome();
}
function closeDock(){
  dockOn=false;
  el('dock').classList.remove('on');
  if(!fullOn)document.body.classList.remove('lock');
  clearInterval(dockClock);clearInterval(dockDrift);clearTimeout(dockCtlTimer);
  dockClock=dockDrift=dockCtlTimer=null;
  releaseWake();syncChrome();
}
function dockTap(){
  if(!dockOn)return;
  el('dHint').style.opacity='0';
  el('dCtl').classList.add('on');
  clearTimeout(dockCtlTimer);
  dockCtlTimer=setTimeout(function(){el('dCtl').classList.remove('on')},5000);
}
document.addEventListener('visibilitychange',function(){
  if(document.hidden){releaseWake();return}
  checkSleep();
  if(dockOn){dockTime();requestWake()}
  if(fullOn||dockOn)syncChrome();          // MyLLM puts its bars back when the app is left
});
if(window.matchMedia){
  var mq=matchMedia('(prefers-color-scheme: dark)');
  if(mq.addEventListener)mq.addEventListener('change',syncLook);else if(mq.addListener)mq.addListener(syncLook);
}

// ---- boot ----
el('mvol').addEventListener('input',function(){setMaster(parseFloat(el('mvol').value))});
el('fvol').addEventListener('input',function(){setMaster(parseFloat(el('fvol').value))});
buildPads();render();renderTimer();
load('wn').then(function(v){
  if(v)try{var o=JSON.parse(v);active=o.active||{};if(o.vol)DEFS.forEach(function(s){if(typeof o.vol[s.id]==='number')vol[s.id]=o.vol[s.id]});
    if(typeof o.master==='number'){masterVol=o.master;el('mvol').value=masterVol;el('fvol').value=masterVol}}catch(e){}
  // restore selection visually; audio waits for a tap (browsers require a gesture)
  playing=false;
  render();renderTimer();
});
</script></body></html>
