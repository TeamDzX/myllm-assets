--><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>:root{--build-id:"2202dcf9b0";color-scheme:light dark;--accent:#5e5ce6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,system-ui,sans-serif;margin:0;padding:18px 16px 120px;background:#f2f2f7;color:#111}
@media(prefers-color-scheme:dark){body{background:#000;color:#eee}.sound{background:#1c1c1e}.bar{background:rgba(20,20,22,.95)}}
h1{font-size:22px;margin:0 0 4px}
.sub{font-size:13px;opacity:.6;margin-bottom:16px}
.sound{background:#fff;border-radius:14px;padding:13px 15px;margin-bottom:9px;box-shadow:0 1px 3px rgba(0,0,0,.07);border:2px solid transparent}
.sound.on{border-color:var(--accent)}
.head{display:flex;align-items:center;gap:13px}
.head .e{font-size:26px;width:32px;text-align:center}
.head .nm{flex:1;font-size:16px;font-weight:600}
.head .nm small{display:block;font-size:11px;font-weight:400;opacity:.5}
.dot{width:24px;height:24px;border-radius:50%;border:2px solid #c7c7cc;flex:none}
.sound.on .dot{background:var(--accent);border-color:var(--accent)}
.vol{width:100%;margin-top:12px;accent-color:var(--accent);display:none}
.sound.on .vol{display:block}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(242,242,247,.95);backdrop-filter:blur(12px);padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid rgba(128,128,128,.2)}
.barrow{display:flex;align-items:center;gap:12px}
.play{border:0;background:var(--accent);color:#fff;border-radius:50%;width:48px;height:48px;font-size:20px;flex:none}
.mvol{flex:1;accent-color:var(--accent)}
.timer{display:flex;gap:6px;margin-top:10px;justify-content:center}
.timer button{border:0;background:#e5e5ea;color:#444;border-radius:14px;padding:6px 12px;font-size:13px;font-weight:600}
.timer button.on{background:var(--accent);color:#fff}
@media(prefers-color-scheme:dark){.timer button{background:#2c2c2e;color:#eee}}
.tnote{text-align:center;font-size:11px;opacity:.5;margin-top:7px;min-height:13px}
@media(min-width:768px){body{max-width:760px;margin-left:auto;margin-right:auto}.barrow,.timer{max-width:760px;margin-left:auto;margin-right:auto}}
</style></head><body>
<h1>🌧️ White Noise</h1>
<div class="sub">Tap sounds to mix your own — rain, fire, ocean and more. All made on-device, works offline.</div>
<div id="list"></div>
<div class="bar">
  <div class="barrow">
    <button class="play" id="play" onclick="toggleAll()">▶</button>
    <span style="font-size:18px">🔈</span>
    <input class="mvol" id="mvol" type="range" min="0" max="1" step="0.01" value="0.8">
    <span style="font-size:18px">🔊</span>
  </div>
  <div class="timer" id="timer"></div>
  <div class="tnote" id="tnote"></div>
</div>
<script>
var store=window.myllmStorage||{getItem:function(){return Promise.resolve(null)},setItem:function(){return Promise.resolve()}};
var DEFS=[
 {id:'rain',e:'🌧️',n:'Rain',d:'steady rainfall'},
 {id:'ocean',e:'🌊',n:'Ocean',d:'rolling waves'},
 {id:'fire',e:'🔥',n:'Fireplace',d:'crackling fire'},
 {id:'stream',e:'💧',n:'Stream',d:'bubbling water'},
 {id:'wind',e:'🍃',n:'Wind',d:'gentle gusts'},
 {id:'white',e:'⚪',n:'White noise',d:'pure static'},
 {id:'pink',e:'🌸',n:'Pink noise',d:'softer hiss'},
 {id:'brown',e:'🟤',n:'Brown noise',d:'deep rumble'}];
var TIMERS=[['Off',0],['15m',15],['30m',30],['60m',60]];
var ctx=null,master=null,built={},active={},vol={},masterVol=0.8,playing=false,sleepMin=0,sleepHandle=null;
function el(i){return document.getElementById(i)}
DEFS.forEach(function(s){vol[s.id]=0.6});

// ---- audio synthesis (no files) ----
function ensureCtx(){if(!ctx){var AC=window.AudioContext||window.webkitAudioContext;ctx=new AC();master=ctx.createGain();master.gain.value=masterVol;master.connect(ctx.destination)}if(ctx.state==='suspended')ctx.resume()}
function noiseBuffer(type,secs){
  var len=Math.floor(ctx.sampleRate*(secs||2)),buf=ctx.createBuffer(1,len,ctx.sampleRate),d=buf.getChannelData(0),i;
  if(type==='brown'){var last=0;for(i=0;i<len;i++){var w=Math.random()*2-1;last=(last+0.02*w)/1.02;d[i]=last*3.5}}
  else if(type==='pink'){var b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;for(i=0;i<len;i++){var w=Math.random()*2-1;b0=0.99886*b0+w*0.0555179;b1=0.99332*b1+w*0.0750759;b2=0.96900*b2+w*0.1538520;b3=0.86650*b3+w*0.3104856;b4=0.55000*b4+w*0.5329522;b5=-0.7616*b5-w*0.0168980;d[i]=(b0+b1+b2+b3+b4+b5+b6+w*0.5362)*0.11;b6=w*0.115926}}
  else{for(i=0;i<len;i++)d[i]=Math.random()*2-1}
  return buf;
}
function src(type){var s=ctx.createBufferSource();s.buffer=noiseBuffer(type);s.loop=true;return s}
function filt(type,freq,q){var f=ctx.createBiquadFilter();f.type=type;f.frequency.value=freq;if(q!=null)f.Q.value=q;return f}
function lfoTo(param,rate,depth,base){var o=ctx.createOscillator();o.type='sine';o.frequency.value=rate;var g=ctx.createGain();g.gain.value=depth;o.connect(g);g.connect(param);if(base!=null)param.value=base;o.start();return o}

function buildSound(id){
  var g=ctx.createGain();g.gain.value=vol[id];g.connect(master);
  var s,extra=[],crackle=null;
  if(id==='white'){s=src('white');s.connect(g)}
  else if(id==='pink'){s=src('pink');s.connect(g)}
  else if(id==='brown'){s=src('brown');s.connect(g)}
  else if(id==='rain'){s=src('pink');var hp=filt('highpass',600),lp=filt('lowpass',9000);s.connect(hp);hp.connect(lp);lp.connect(g)}
  else if(id==='stream'){s=src('white');var hp=filt('highpass',1600),lp=filt('lowpass',7000);s.connect(hp);hp.connect(lp);lp.connect(g);extra.push(lfoTo(lp.frequency,0.9,1400,5000))}
  else if(id==='wind'){s=src('pink');var bp=filt('bandpass',500,0.7);s.connect(bp);bp.connect(g);extra.push(lfoTo(bp.frequency,0.08,380,520))}
  else if(id==='ocean'){s=src('brown');var lp=filt('lowpass',700);var wave=ctx.createGain();wave.gain.value=0.6;s.connect(lp);lp.connect(wave);wave.connect(g);extra.push(lfoTo(wave.gain,0.11,0.45,0.55))}
  else if(id==='fire'){s=src('brown');var lp=filt('lowpass',1100);s.connect(lp);lp.connect(g);crackle=startCrackle(g)}
  s.start();
  return {g:g,s:s,extra:extra,crackle:crackle};
}
var crackleBuf=null;
function startCrackle(dest){
  var stopped=false;
  function pop(){
    if(stopped||!ctx)return;
    if(!crackleBuf)crackleBuf=noiseBuffer('white',0.2);
    var b=ctx.createBufferSource();b.buffer=crackleBuf;
    var f=filt('bandpass',1000+Math.random()*2500,1.2);
    var cg=ctx.createGain();var t=ctx.currentTime;
    cg.gain.setValueAtTime(0.0001,t);
    cg.gain.exponentialRampToValueAtTime(0.25+Math.random()*0.5,t+0.004);
    cg.gain.exponentialRampToValueAtTime(0.0001,t+0.04+Math.random()*0.09);
    b.connect(f);f.connect(cg);cg.connect(dest);b.start(t);b.stop(t+0.2);
    setTimeout(pop,90+Math.random()*420);
  }
  pop();
  return {cancel:function(){stopped=true}};
}
function killSound(o){try{o.s.stop()}catch(e){}o.extra.forEach(function(x){try{x.stop()}catch(e){}});if(o.crackle)o.crackle.cancel();try{o.g.disconnect()}catch(e){}}

// ---- control ----
function startId(id){if(!built[id]){ensureCtx();built[id]=buildSound(id)}}
function stopId(id){if(built[id]){killSound(built[id]);delete built[id]}}
function toggle(id){
  if(active[id]){active[id]=false;stopId(id)}
  else{active[id]=true;playing=true;startId(id)}
  if(!Object.keys(active).some(function(k){return active[k]}))playing=false;
  if(window.myllmHaptic)myllmHaptic('selection');
  save();render();
}
function setVol(id,v){vol[id]=v;if(built[id])built[id].g.gain.value=v;save()}
function toggleAll(){
  var any=Object.keys(active).some(function(k){return active[k]});
  if(!any)return;
  if(playing){playing=false;Object.keys(built).forEach(stopId)}
  else{playing=true;ensureCtx();Object.keys(active).forEach(function(k){if(active[k])startId(k)})}
  render();
}
function setTimer(min){
  sleepMin=min;if(sleepHandle){clearTimeout(sleepHandle);sleepHandle=null}
  if(min>0)sleepHandle=setTimeout(function(){playing=false;Object.keys(built).forEach(stopId);render()},min*60000);
  save();renderTimer();
}

// ---- render ----
function render(){
  var L=el('list');L.innerHTML='';
  DEFS.forEach(function(s){
    var on=!!active[s.id];
    var d=document.createElement('div');d.className='sound'+(on?' on':'');
    d.innerHTML='<div class="head"><div class="e">'+s.e+'</div><div class="nm">'+s.n+'<small>'+s.d+'</small></div><div class="dot"></div></div>'+
      '<input class="vol" type="range" min="0" max="1" step="0.01" value="'+vol[s.id]+'">';
    d.querySelector('.head').onclick=function(){toggle(s.id)};
    var sl=d.querySelector('.vol');sl.oninput=function(){setVol(s.id,parseFloat(sl.value))};
    L.appendChild(d);
  });
  el('play').textContent=playing?'⏸':'▶';
}
function renderTimer(){
  var T=el('timer');T.innerHTML='';
  TIMERS.forEach(function(t){var b=document.createElement('button');b.textContent=t[0];if(sleepMin===t[1])b.className='on';b.onclick=function(){setTimer(t[1])};T.appendChild(b)});
  el('tnote').textContent=sleepMin>0?('Auto-stops in '+sleepMin+' min'):'';
}
function save(){store.setItem('wn',JSON.stringify({active:active,vol:vol,master:masterVol}))}

el('mvol').addEventListener('input',function(){masterVol=parseFloat(el('mvol').value);if(master)master.gain.value=masterVol;save()});
store.getItem('wn').then(function(v){
  if(v)try{var o=JSON.parse(v);active=o.active||{};if(o.vol)vol=o.vol;if(typeof o.master==='number'){masterVol=o.master;el('mvol').value=masterVol}}catch(e){}
  // restore selection visually; audio waits for a tap (browsers require a gesture)
  Object.keys(active).forEach(function(k){if(active[k])playing=false});
  render();renderTimer();
});
</script></body></html>
