<title>Habit Streaks</title>
<meta name="myllm:immersive" content="on">
<style>:root{--build-id:"f4f010511c";color-scheme:light dark;
  --bg:var(--myllm-bg,#f2f2f7); --surface:var(--myllm-surface,#fff); --ink:var(--myllm-text,#111);
  --muted:var(--myllm-muted,#8a8a8e); --line:var(--myllm-border,#e3e3e8); --acc:var(--myllm-accent,#0a84ff);
  --fill:rgba(120,120,128,.12); --h:26; }
@media (prefers-color-scheme:dark){ :root{ --bg:var(--myllm-bg,#000); --surface:var(--myllm-surface,#1c1c1e);
  --ink:var(--myllm-text,#f2f2f7); --muted:var(--myllm-muted,#8e8e93); --line:var(--myllm-border,#2c2c2e); --fill:rgba(120,120,128,.24); } }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ font-family:var(--myllm-font,-apple-system,system-ui,sans-serif); background:var(--bg); color:var(--ink);
    max-width:600px; margin:0 auto; min-height:100dvh; font-size:15.5px; line-height:1.4;
    padding:calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(30px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left)); }
  @media (min-width:768px){ body{ max-width:760px; } }
  svg.i{ width:1.25em; height:1.25em; fill:currentColor; flex-shrink:0; }
  button{ font:inherit; color:inherit; cursor:pointer; border:none; background:none; } button:active{ transform:scale(.96); }

  .head{ display:flex; align-items:center; gap:12px; margin:2px 2px 14px; }
  .tile{ display:flex; align-items:center; justify-content:center; color:#fff; flex-shrink:0;
    background:linear-gradient(145deg, hsl(var(--h) 62% 50%), hsl(calc(var(--h) + 40) 58% 28%)); }
  .head .tile{ width:44px; height:44px; border-radius:13px; font-size:19px; }
  .head .ht{ flex:1; min-width:0; }
  h1{ font-size:22px; font-weight:800; letter-spacing:-.01em; }
  .head p{ font-size:13px; color:var(--muted); margin-top:1px; }
  h2{ font-size:12px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); margin:20px 2px 10px; }

  .hero{ border-radius:20px; padding:16px 18px; color:#fff; margin-bottom:12px; display:flex; align-items:center; gap:16px;
    background:linear-gradient(145deg, hsl(var(--h) 72% 50%), hsl(calc(var(--h) - 22) 66% 32%)); box-shadow:0 10px 28px hsl(var(--h) 60% 30% / .25); }
  .hero .k{ font-size:11px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; opacity:.8; }
  .hero .n{ font-size:44px; font-weight:800; line-height:1.05; letter-spacing:-.03em; font-variant-numeric:tabular-nums; }
  .hero .n small{ font-size:22px; opacity:.7; font-weight:750; }
  .hero .main{ flex:1; min-width:0; }
  .hero .bar{ height:6px; border-radius:99px; background:rgba(255,255,255,.25); margin-top:8px; overflow:hidden; }
  .hero .bar i{ display:block; height:100%; border-radius:99px; background:#fff; transition:width .35s cubic-bezier(.2,.8,.2,1); }
  .hero .best{ flex-shrink:0; text-align:center; background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.22); border-radius:16px; padding:10px 12px; min-width:84px; }
  .hero .best b{ display:flex; align-items:center; justify-content:center; gap:4px; font-size:24px; font-weight:800; font-variant-numeric:tabular-nums; }
  .hero .best em{ font-style:normal; }
  .hero .best span{ display:block; font-size:10.5px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; opacity:.8; margin-top:1px; }

  .card{ background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:14px; margin-bottom:12px; }
  .add{ display:flex; gap:8px; }
  input{ flex:1; min-width:0; font:inherit; font-size:16px; padding:12px; border-radius:12px; border:1px solid var(--line); background:var(--bg); color:var(--ink); outline:none; }
  input:focus{ border-color:var(--acc); }
  .go{ flex-shrink:0; min-height:46px; border-radius:12px; background:var(--acc); color:#fff; font-weight:700; padding:0 16px; display:flex; align-items:center; gap:6px; }

  .list{ display:grid; gap:8px; }
  .list{ grid-template-columns:minmax(0,1fr); }
  @media (min-width:768px){ .list{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
  .habit{ display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:10px 8px 10px 12px; }
  .habit.on{ border-color:hsl(var(--h) 70% 55% / .7); }
  .check{ width:44px; height:44px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    border:2.4px solid var(--line); color:transparent; font-size:18px; transition:background .2s, border-color .2s, color .2s; }
  .habit.on .check{ background:hsl(var(--h) 72% 50%); border-color:hsl(var(--h) 72% 50%); color:#fff; }
  .habit .nm{ flex:1; min-width:0; }
  .habit .nm b{ display:block; font-size:16px; font-weight:650; overflow-wrap:anywhere; }
  .habit .nm small{ display:flex; align-items:center; gap:4px; font-size:12.5px; color:var(--muted); margin-top:2px; font-variant-numeric:tabular-nums; }
  .habit.on .nm small{ color:hsl(var(--h) 70% 42%); }
  @media (prefers-color-scheme:dark){ .habit.on .nm small{ color:hsl(var(--h) 85% 64%); } }
  .habit .nm small svg{ width:13px; height:13px; }
  .del{ width:44px; height:44px; flex-shrink:0; color:var(--muted); display:flex; align-items:center; justify-content:center; font-size:14px; }

  .empty{ text-align:center; padding:26px 20px 14px; }
  .empty .tile{ width:48px; height:48px; border-radius:14px; font-size:21px; margin:0 auto 10px; opacity:.9; }
  .empty b{ display:block; font-size:16px; font-weight:750; }
  .empty p{ font-size:13.5px; color:var(--muted); line-height:1.5; max-width:280px; margin:5px auto 0; }
  /* v6: the heatmap — every day of the last 18 weeks, Monday at the top. */
  .heat{ overflow:hidden; }
  .heat .months{ display:grid; font-size:10.5px; color:var(--muted); font-weight:700; margin:0 0 4px 22px; height:14px; }
  .heat .wrap{ display:flex; gap:4px; }
  .heat .wd{ display:grid; grid-template-rows:repeat(7,1fr); font-size:9.5px; color:var(--muted); font-weight:700; width:18px; }
  .heat .wd span{ display:flex; align-items:center; }
  .heat .cells{ flex:1; display:grid; grid-auto-flow:column; grid-template-rows:repeat(7,1fr); gap:3px; }
  .heat .cells button{ aspect-ratio:1/1; border-radius:3px; background:var(--fill); padding:0; min-width:0; }
  .heat .cells button.l1{ background:hsl(var(--h) 80% 55% / .35); }
  .heat .cells button.l2{ background:hsl(var(--h) 80% 52% / .58); }
  .heat .cells button.l3{ background:hsl(var(--h) 80% 50% / .8); }
  .heat .cells button.l4{ background:hsl(var(--h) 85% 46%); }
  .heat .cells button.sel{ outline:2px solid var(--ink); outline-offset:1px; }
  .heat .cells button.future{ visibility:hidden; }
  .heat .foot{ display:flex; align-items:center; gap:8px; margin-top:10px; font-size:12.5px; color:var(--muted); min-height:20px; }
  .heat .foot .txt{ flex:1; min-width:0; }
  .heat .foot .txt b{ color:var(--ink); font-weight:700; }
  .heat .legend{ display:flex; align-items:center; gap:3px; font-size:10.5px; }
  .heat .legend i{ width:10px; height:10px; border-radius:2px; display:inline-block; background:var(--fill); }
  .heat .legend i.l2{ background:hsl(var(--h) 80% 52% / .58); } .heat .legend i.l4{ background:hsl(var(--h) 85% 46%); }
  .week7{ display:flex; gap:3px; margin-top:6px; }
  .week7 i{ width:9px; height:9px; border-radius:50%; background:var(--fill); }
  .week7 i.on{ background:hsl(var(--h) 80% 50%); }
  .auto{ display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:10px 12px; margin-bottom:8px; }
  .auto .tile{ width:40px; height:40px; border-radius:12px; font-size:17px; }
  .auto .nm{ flex:1; min-width:0; }
  .auto .nm b{ display:block; font-size:15.5px; font-weight:650; }
  .auto .nm small{ display:block; font-size:12.5px; color:var(--muted); margin-top:1px; }
  .auto .n{ text-align:right; font-variant-numeric:tabular-nums; }
  .auto .n b{ display:block; font-size:18px; font-weight:800; }
  .auto .n small{ font-size:10.5px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.06em; }
  .hint2{ font-size:12.5px; color:var(--muted); margin:-2px 2px 10px; }
  [hidden]{ display:none !important; }
  @media (prefers-reduced-motion:reduce){ .hero .bar i, .check{ transition:none; } button:active{ transform:none; } }

/* myllm-fullscreen-v2 — MyLLM 5.6.2+ opens this app full screen; the ✕ is the way out. */
.head .imm-acts{display:none;flex-shrink:0;margin-left:auto}
.head .acts + .imm-acts{margin-left:0}
body.imm .head .imm-acts{display:flex}
.head .imm-acts button{width:40px;height:40px;border-radius:12px;border:1px solid var(--myllm-border,rgba(128,128,128,.28));
  background:var(--myllm-surface,rgba(128,128,128,.12));color:var(--myllm-text,currentColor);display:grid;place-items:center;padding:0;cursor:pointer;transition:transform .12s}
.head .imm-acts button:active,.head .imm-x:active{transform:scale(.94)}
.head .imm-x{display:none !important}
body.imm .head .imm-x{display:grid !important;place-items:center}
.imm-x svg,.imm-acts svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}
.imm-safe{display:none}
body.imm .imm-safe{display:block}
</style></head><body>

<div class="imm-safe"></div><div class="head">
  <div class="tile"><svg class="i"><use href="#i-flame"/></svg></div>
  <div class="ht"><h1>Habit Streaks</h1><p>Keep the flame alive</p></div>
<div class="imm-acts"><button type="button" aria-label="Close Habit Streaks" onclick="myllmFSClose()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div></div>

<div class="hero" id="hero" hidden>
  <div class="main"><div class="k">Today</div><div class="n" id="hDone">0<small>/0</small></div><div class="bar"><i id="hBar" style="width:0"></i></div></div>
  <div class="best"><b><svg class="i" style="width:.8em;height:.8em"><use href="#i-flame"/></svg><em id="hBest">0</em></b><span>Top streak</span></div>
</div>

<div class="card"><div class="add"><input id="h" placeholder="New habit (e.g. Read 10 pages)" autocomplete="off" enterkeyhint="done"><button class="go" id="addBtn" type="button"><svg class="i"><use href="#i-plus"/></svg>Add</button></div></div>

<h2 id="heatLbl" hidden>Last 18 weeks</h2>
<div class="card heat" id="heat" hidden><div class="months" id="hmMonths"></div><div class="wrap"><div class="wd" id="hmWd"></div><div class="cells" id="hmCells"></div></div>
  <div class="foot"><span class="txt" id="hmTxt">Tap a day to see what you did.</span><span class="legend">Less <i></i><i class="l2"></i><i class="l4"></i> More</span></div></div>

<h2 id="listLbl" hidden>Your habits</h2>
<div class="list" id="list"></div>

<h2 id="autoLbl" hidden>From your apps</h2>
<p class="hint2" id="autoHint" hidden>Counted automatically when you finish a session.</p>
<div id="autoList"></div>

<script>
function el(i){return document.getElementById(i)}
/* Bridges are looked up when used, never kept: MyLLM can add them after this
   script has run. */
function store(){return window.myllmStorage||{getItem:function(){return Promise.resolve(null)},setItem:function(){return Promise.resolve()}}}
function haptic(k){if(window.myllmHaptic)try{myllmHaptic(k)}catch(e){}}
var habits=[], activity=[], selDay=null;
/* Local days. v5 used the UTC date, so a habit ticked after midnight in summer
   time (00:00–01:00 BST) was put on the day before. */
function p2(n){return (n<10?'0':'')+n}
function dayOf(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function today(){return dayOf(new Date())}
function back(day,n){var d=new Date(+day.slice(0,4),+day.slice(5,7)-1,+day.slice(8,10));d.setDate(d.getDate()-n);return dayOf(d)}
function save(){store().setItem('habits',JSON.stringify(habits));publish()}
function streak(h){var n=0,d=today();if(h.days.indexOf(d)<0)d=back(d,1);while(h.days.indexOf(d)>=0){n++;d=back(d,1)}return n}
function icon(n){return '<svg class="i"><use href="#i-'+n+'"/></svg>'}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

/* ---- Shared data (docs/SHARED_DATA.md) ----
   Writes data/habits.json for other apps; reads data/activity.json, where
   Box Breathing and Stretch log finished sessions, for the heatmap. */
function publish(){var F=window.myllmFiles;if(!F||!F.write)return;
  var out={schema:'myllm.habits',version:1,source:'habit-streaks',updated:new Date().toISOString(),
    habits:habits.map(function(h){return {id:h.id,name:h.name,days:h.days.slice()}})};
  try{Promise.resolve(F.write('data/habits.json',JSON.stringify(out))).catch(function(){})}catch(e){}}
function readActivity(){var F=window.myllmFiles;if(!F||!F.read)return Promise.resolve([]);
  return Promise.resolve().then(function(){return F.read('data/activity.json')}).then(function(t){
    var j=null;try{j=t?JSON.parse(t):null}catch(e){}
    if(!j||j.schema!=='myllm.activity'||j.version!==1||!Array.isArray(j.events))return [];
    return j.events.filter(function(e){return e&&typeof e.app==='string'&&/^\d{4}-\d\d-\d\d$/.test(e.date||'')});
  }).catch(function(){return []})}
var APPS={'box-breathing':{name:'Box Breathing',icon:'wind',h:192},'stretch':{name:'Stretch',icon:'stretch',h:150}};
function appName(id){return (APPS[id]&&APPS[id].name)||id.replace(/-/g,' ').replace(/^./,function(c){return c.toUpperCase()})}

/* What happened on a day: habits ticked, sessions finished. */
function dayInfo(day){
  var hs=habits.filter(function(h){return h.days.indexOf(day)>=0}).map(function(h){return h.name});
  var by={};activity.forEach(function(e){if(e.date===day)by[e.app]=(by[e.app]||0)+1});
  return {habits:hs,apps:by,count:hs.length+Object.keys(by).reduce(function(a,k){return a+by[k]},0)};
}

function renderHeat(){
  var show=habits.length||activity.length;el('heat').hidden=!show;el('heatLbl').hidden=!show;if(!show)return;
  var WEEKS=18,t=today(),now=new Date(),dow=(now.getDay()+6)%7,start=back(t,dow+7*(WEEKS-1));
  var counts=[],max=1;for(var i=0;i<WEEKS*7;i++){var d=back(start,-i);var c=d>t?-1:dayInfo(d).count;counts.push([d,c]);if(c>max)max=c}
  el('hmCells').innerHTML=counts.map(function(x){
    var lvl=x[1]<=0?0:Math.min(4,Math.ceil(x[1]/max*4));
    var lab=new Date(+x[0].slice(0,4),+x[0].slice(5,7)-1,+x[0].slice(8,10)).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});
    return '<button type="button" data-day="'+x[0]+'" class="'+(x[1]<0?'future':'l'+lvl)+(x[0]===selDay?' sel':'')+'" aria-label="'+esc(lab+': '+Math.max(0,x[1]))+'"></button>'}).join('');
  var wd=[];for(var k=0;k<7;k++)wd.push('<span>'+(k%2===0?esc(new Date(2024,0,1+k).toLocaleDateString(undefined,{weekday:'narrow'})):'')+'</span>');
  el('hmWd').innerHTML=wd.join('');
  var cols=[],last='';for(var w=0;w<WEEKS;w++){var first=back(start,-w*7),m=first.slice(5,7);cols.push(m!==last&&w>0?'<span>'+esc(new Date(+first.slice(0,4),+m-1,1).toLocaleDateString(undefined,{month:'short'}))+'</span>':'<span></span>');last=m}
  el('hmMonths').style.gridTemplateColumns='repeat('+WEEKS+',1fr)';el('hmMonths').innerHTML=cols.join('');
  paintSel();
}
function paintSel(){
  if(!selDay){el('hmTxt').textContent='Tap a day to see what you did.';return}
  var i=dayInfo(selDay),lab=new Date(+selDay.slice(0,4),+selDay.slice(5,7)-1,+selDay.slice(8,10)).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});
  var parts=i.habits.map(esc).concat(Object.keys(i.apps).map(function(a){return esc(appName(a))+(i.apps[a]>1?' ×'+i.apps[a]:'')}));
  el('hmTxt').innerHTML='<b>'+esc(lab)+'</b> · '+(parts.length?parts.join(', '):'nothing logged');
}
el('hmCells').addEventListener('click',function(e){var b=e.target.closest('button');if(!b||b.classList.contains('future'))return;selDay=b.getAttribute('data-day');haptic('selection');renderHeat()});

function renderAuto(){
  var ids=Object.keys(activity.reduce(function(a,e){a[e.app]=1;return a},{}));
  el('autoLbl').hidden=!ids.length;el('autoHint').hidden=!ids.length;
  var t=today(),wk=back(t,6);
  el('autoList').innerHTML=ids.map(function(id){
    var ev=activity.filter(function(e){return e.app===id}),days={};ev.forEach(function(e){days[e.date]=1});
    var week=ev.filter(function(e){return e.date>=wk}).length,s=0,d=days[t]?t:back(t,1);while(days[d]){s++;d=back(d,1)}
    var lastAt=ev.reduce(function(m,e){return e.date>m?e.date:m},''),info=APPS[id]||{icon:'flame',h:26};
    var lastLbl=lastAt?(lastAt===t?'today':lastAt===back(t,1)?'yesterday':new Date(+lastAt.slice(0,4),+lastAt.slice(5,7)-1,+lastAt.slice(8,10)).toLocaleDateString(undefined,{day:'numeric',month:'short'})):'—';
    return '<div class="auto"><div class="tile" style="--h:'+info.h+'">'+icon(info.icon)+'</div><div class="nm"><b>'+esc(appName(id))+'</b><small>'+(s?s+(s===1?' day':' days')+' in a row':'last '+esc(lastLbl))+'</small></div><div class="n"><b>'+week+'</b><small>this week</small></div></div>'}).join('');
}

function render(){var L=el('list');L.innerHTML='';
el('hero').hidden=!habits.length;el('listLbl').hidden=!habits.length;
renderHeat();renderAuto();
if(!habits.length){L.innerHTML='<div class="card empty"><div class="tile">'+icon('flame')+'</div><b>Start your first streak</b><p>Add a habit, then tick it off each day to grow the streak. Sessions you finish in Box Breathing and Stretch are counted here too.</p></div>';return}
var done=0,best=0,t=today();
habits.forEach(function(h,i){var doneToday=h.days.indexOf(t)>=0,s=streak(h);if(doneToday)done++;if(s>best)best=s;
var d=document.createElement('div');d.className='habit'+(doneToday?' on':'');
var b=document.createElement('button');b.className='check';b.type='button';b.innerHTML=icon('check');
b.setAttribute('aria-label',doneToday?'Done today — tap to undo':'Mark done today');b.setAttribute('aria-pressed',doneToday);
b.onclick=function(){if(doneToday)h.days=h.days.filter(function(x){return x!==t});else h.days.push(t);haptic(doneToday?'light':'success');save();render()};
var nm=document.createElement('div');nm.className='nm';
var tt=document.createElement('b');tt.textContent=h.name;nm.appendChild(tt);
var st=document.createElement('small');st.innerHTML=icon('flame')+'<span></span>';st.querySelector('span').textContent=s+(s===1?' day':' days')+(doneToday?' · done today':'');nm.appendChild(st);
var w7=document.createElement('div');w7.className='week7';w7.setAttribute('aria-hidden','true');

/* myllm-fullscreen-v2 — full screen where MyLLM can also close the app for us
   (myllmClose, 5.6.2+): full screen hides MyLLM's Done, and a page with no way
   out is worse than a repeated title, so elsewhere nothing changes.
   The spacer keeps the header clear of the status bar / Dynamic Island. It is
   live CSS — env(safe-area-inset-top) — not a measured number: the inset is
   still 0 when the page loads and only grows once MyLLM's bar has gone (v1
   measured once, so the title sat under the island). If the page's own styles
   already pad the header down by the inset, the spacer stays at 0. */
(function(){
  function full(){ return !!(window.myllmClose && window.myllmImmersive); }
  /* Does any rule that applies to the header or an ancestor already use the top inset? */
  function pageHandlesInset(head){
    var chain = [], n, found = false;
    for (n = head; n && n.nodeType === 1; n = n.parentElement) chain.push(n);
    function walk(rules){
      for (var i = 0; i < rules.length && !found; i++){
        var r = rules[i];
        if (r.cssRules && !r.selectorText) { walk(r.cssRules); continue; }
        if (!r.selectorText || !/safe-area-inset-top/.test(r.cssText) || !/(padding|margin|top)\s*:/.test(r.cssText)) continue;
        if (/\.imm-safe/.test(r.selectorText)) continue;
        for (var k = 0; k < chain.length; k++){
          try { if (chain[k].matches(r.selectorText)) { found = true; break; } } catch(e){}
        }
      }
    }
    for (var s = 0; s < document.styleSheets.length && !found; s++){
      try { walk(document.styleSheets[s].cssRules); } catch(e){}
    }
    for (n = head; n && n.nodeType === 1 && !found; n = n.parentElement){
      if (/safe-area-inset-top/.test(n.getAttribute("style") || "")) found = true;
    }
    return found;
  }
  function fit(){
    var sp = document.querySelector(".imm-safe"), head = document.querySelector(".head");
    if (!sp || !head) return;
    sp.style.height = (document.body.classList.contains("imm") && !pageHandlesInset(head)) ? "env(safe-area-inset-top)" : "0px";
  }
  function sync(){
    var f = full();
    document.body.classList.toggle("imm", f);
    fit();
    if (!f) return;
    try { window.myllmImmersive(true, { keepAwake:false }).catch(function(){}); } catch(e){}
  }
  window.myllmFSClose = function(){
    try { if (window.myllmHaptic) window.myllmHaptic("light"); } catch(e){}
    try { window.myllmClose().catch(function(){}); } catch(e){}
  };
  document.addEventListener("visibilitychange", function(){ if (!document.hidden) sync(); });
  sync();
})();
