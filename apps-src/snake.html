<title>Snake</title>
<style>:root{--build-id:"262c0ffc03";color-scheme:light dark}
  @property --h{ syntax:'<number>'; inherits:true; initial-value:140; }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{ font-family:var(--myllm-font,-apple-system,system-ui,sans-serif); background:#0b0b10; color:#fff; overflow:hidden;
    touch-action:none; overscroll-behavior:none; -webkit-user-select:none; user-select:none; }

  /* The stage: a hue-tinted backdrop that warms as the snake grows. Two
     layers, dark and light, so the change between them can fade. */
  .stage{ position:fixed; inset:0; --h:140; transition:--h 1.4s ease; color:#fff; }
  .bg{ position:absolute; inset:0; transition:opacity .6s ease; }
  .bg.d{ background:radial-gradient(120% 90% at 20% 10%, hsl(var(--h) 70% 34%), transparent 60%),
      radial-gradient(120% 90% at 85% 95%, hsl(calc(var(--h) + 60) 65% 26%), transparent 62%), #0b0b10; }
  .bg.l{ opacity:0; background:radial-gradient(120% 90% at 20% 0%, hsl(var(--h) 80% 84%), transparent 60%),
      radial-gradient(120% 90% at 85% 100%, hsl(calc(var(--h) + 60) 78% 86%), transparent 62%), #f4f4f8; }
  .lite{ color:#15151a; } .lite .bg.l{ opacity:1; } .lite .bg.d{ opacity:0; }

  .col{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
    padding:calc(12px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left)); }
  .top{ width:100%; max-width:560px; height:44px; display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
  .lbl{ font-size:11px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; opacity:.62; }
  .glass{ border:1px solid rgba(255,255,255,.16); background:rgba(255,255,255,.12); color:inherit;
    -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px); }
  .lite .glass{ border-color:rgba(0,0,0,.09); background:rgba(255,255,255,.62); }
  svg{ width:1.25em; height:1.25em; fill:currentColor; flex-shrink:0; }
  .rnd{ width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:15px; }
  .pill{ min-width:44px; height:44px; border-radius:99px; padding:0 16px; display:flex; align-items:center; justify-content:center;
    font-size:19px; font-weight:800; font-variant-numeric:tabular-nums; }
  .pill.bump{ animation:bump .28s ease; }
  @keyframes bump{ 40%{ transform:scale(1.18); } }
  .top .hide{ visibility:hidden; }

  .wrap{ flex:1; width:100%; min-height:0; position:relative; display:flex; align-items:center; justify-content:center; margin:10px 0 34px; }
  canvas{ display:block; border-radius:26px; background:rgba(10,10,16,.42); border:1px solid rgba(255,255,255,.12);
    box-shadow:0 24px 60px rgba(0,0,0,.45); touch-action:none; transition:background .6s, box-shadow .6s; }
  .lite canvas{ background:rgba(255,255,255,.6); border-color:rgba(0,0,0,.06); box-shadow:0 22px 50px rgba(20,20,40,.16); }
  canvas.shake{ animation:shake .4s ease; }
  @keyframes shake{ 20%{ transform:translate(-7px,2px); } 40%{ transform:translate(6px,-2px); } 60%{ transform:translate(-4px,1px); } 80%{ transform:translate(2px,0); } }

  .foot{ position:absolute; left:0; right:0; top:calc(50% + var(--b,320px) / 2 + 12px); text-align:center; font-size:12px; font-weight:600; letter-spacing:.02em; opacity:.55; flex-shrink:0; font-variant-numeric:tabular-nums; }

  /* One glass card over the board: title, paused, game over. */
  .sheet{ position:absolute; left:50%; top:50%; width:max(232px, min(300px, calc(var(--b,320px) - 44px))); transform:translate(-50%,-50%) scale(.96); opacity:0; pointer-events:none;
    border-radius:26px; padding:22px 20px 18px; text-align:center; box-shadow:0 24px 60px rgba(0,0,0,.35);
    transition:opacity .28s ease, transform .28s cubic-bezier(.2,.8,.2,1); }
  .sheet.on{ opacity:1; transform:translate(-50%,-50%); pointer-events:auto; }
  .lite .sheet{ box-shadow:0 22px 50px rgba(20,20,40,.18); }
  .sheet h1{ font-size:30px; font-weight:800; letter-spacing:-.02em; }
  .sheet p{ font-size:13.5px; line-height:1.4; opacity:.72; margin-top:6px; }
  .kick{ font-size:11px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; opacity:.62; }
  .big{ font-size:64px; font-weight:800; line-height:1.05; letter-spacing:-.03em; font-variant-numeric:tabular-nums; margin-top:4px; }
  .best{ display:inline-block; margin-top:10px; font-size:11.5px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; opacity:.7; }
  .best.new{ opacity:1; color:#0b0b10; background:#ffd60a; border-radius:99px; padding:5px 11px; }
  .sheet button{ width:100%; height:50px; border-radius:99px; margin-top:10px; font:inherit; font-size:16px; font-weight:750;
    display:flex; align-items:center; justify-content:center; gap:8px; }
  .sheet button:first-of-type{ margin-top:18px; }
  .sheet button:active, .rnd:active{ transform:scale(.96); }
  .pri{ border:none; background:#fff; color:#0b0b10; box-shadow:0 10px 30px rgba(0,0,0,.3); }
  .lite .pri{ background:#15151a; color:#fff; box-shadow:0 10px 26px rgba(20,20,40,.22); }

  @media (max-height:430px){
    .sheet{ padding:14px 18px 14px; } .sheet h1{ font-size:24px; } .big{ font-size:42px; }
    .sheet button{ height:44px; margin-top:8px; } .sheet button:first-of-type{ margin-top:12px; } .sheet p{ display:none; }
  }
  @media (prefers-reduced-motion:reduce){ canvas.shake, .pill.bump{ animation:none; } .stage{ transition:none; } }
</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.52.85l10.4-6.5a1 1 0 0 0 0-1.7L9.52 4.65A1 1 0 0 0 8 5.5z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="5" width="4.2" height="14" rx="1.4"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.4"/></symbol>
  <symbol id="i-again" viewBox="0 0 24 24"><path d="M12 5V2.6a.6.6 0 0 0-1-.45L7.2 5.55a.6.6 0 0 0 0 .9L11 9.85a.6.6 0 0 0 1-.45V7a5.5 5.5 0 1 1-5.5 5.5 1 1 0 0 0-2 0A7.5 7.5 0 1 0 12 5z"/></symbol>
</defs></svg>

<div class="stage" id="stage">
  <div class="bg d"></div><div class="bg l"></div>
  <div class="col">
    <div class="top">
      <button class="glass rnd hide" id="bPause" aria-label="Pause"><svg><use href="#i-pause"/></svg></button>
      <div class="lbl">Snake</div>
      <div class="glass pill hide" id="pill" aria-label="Score">0</div>
    </div>
    <div class="wrap" id="wrap">
      <canvas id="c" width="320" height="320"></canvas>
      <div class="sheet glass" id="sheet"></div>
      <div class="foot" id="foot"></div>
    </div>
  </div>
</div>

<script>
function el(i){ return document.getElementById(i); }
/* Bridges are looked up when used, never kept: MyLLM can add them after this
   script has run. */
function haptic(s){ if (window.myllmHaptic) try { myllmHaptic(s); } catch(_){} }
function load(k){ var s = window.myllmStorage; return s ? s.getItem(k).catch(function(){ return null; }) : Promise.resolve(null); }
function keep(k, v){ var s = window.myllmStorage; if (s) try { s.setItem(k, v).catch(function(){}); } catch(_){} }

var N = 16, cv = el("c"), cx = cv.getContext("2d"), B = 320, DPR = 1;
var state = "home";                 /* home · play · dead · over */
var paused = false, tHold = 1;
var snake = [], dir = {x:1,y:0}, turns = [], food = null, lastTail = null, grew = false;
var score = 0, best = null, newBest = false, speed = 160, lastTick = 0, deadAt = 0;
var hue = 140, hueNow = 140, rings = [];
var calm = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
var DEMO_MS = 170;

/* ---------- look ---------- */
function isLight(){ return !(window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches); }
/* A game in progress takes the whole display and goes dark. Where MyLLM can't
   hide its own title bar, a dark stage under a white bar looks cut in half —
   so in light mode, without myllmImmersive, the stage stays light. */
function lite(){ return isLight() && !(state !== "home" && window.myllmImmersive); }
function syncLook(){ el("stage").classList.toggle("lite", lite()); }
function syncChrome(){
  if (!window.myllmImmersive) return;
  try { myllmImmersive(state !== "home", {keepAwake:false}).catch(function(){}); } catch(_){}
}
function setHue(h){ hue = h; el("stage").style.setProperty("--h", String(h)); }

/* ---------- the glass card ---------- */
function bestLine(){
  if (newBest) return '<div class="best new">New best</div>';
  return best != null ? '<div class="best">Best ' + best + '</div>' : "";
}
function showSheet(kind){
  var s = el("sheet"), h;
  if (kind === "home") h = '<h1>Snake</h1><p>Swipe anywhere to steer. Eat, grow, and mind your own tail.</p>' + bestLine() +
    '<button class="pri" id="sA"><svg><use href="#i-play"/></svg>Play</button>';
  else if (kind === "pause") h = '<div class="kick">Paused</div><div class="big">' + score + '</div>' +
    '<button class="pri" id="sA"><svg><use href="#i-play"/></svg>Resume</button><button class="glass" id="sB">End game</button>';
  else h = '<div class="kick">Game over</div><div class="big">' + score + '</div>' + bestLine() +
    '<button class="pri" id="sA"><svg><use href="#i-again"/></svg>Play again</button><button class="glass" id="sB">Done</button>';
  s.innerHTML = h;
  el("sA").onclick = kind === "pause" ? resume : start;
  if (el("sB")) el("sB").onclick = home;
  s.classList.add("on");
}
function hideSheet(){ el("sheet").classList.remove("on"); }
function hud(){
  var playing = state === "play" || state === "dead";
  el("bPause").classList.toggle("hide", state !== "play" || paused);
  el("pill").classList.toggle("hide", !playing || paused);
  el("pill").textContent = score;
  el("foot").textContent = state === "home" ? "" : (best != null ? "Best " + best : "Swipe anywhere to steer");
}

/* ---------- game ---------- */
function place(){
  do { food = {x:Math.floor(Math.random()*N), y:Math.floor(Math.random()*N)}; }
  while (snake.some(function(s){ return s.x === food.x && s.y === food.y; }));
}
function start(){
  haptic("medium");
  snake = [{x:8,y:8},{x:7,y:8},{x:6,y:8}]; lastTail = {x:5,y:8}; grew = false;
  dir = {x:1,y:0}; turns = []; score = 0; speed = 160; newBest = false; paused = false; rings = [];
  place(); setHue(140);
  state = "play"; lastTick = performance.now();
  hideSheet(); hud(); syncLook(); syncChrome();
}
function home(){
  haptic("light");
  state = "home"; paused = false; newBest = false; food = null; rings = [];
  demoReset(); setHue(140);
  showSheet("home"); hud(); syncLook(); syncChrome();
}
function pause(){
  if (state !== "play" || paused) return;
  tHold = Math.min(1, (performance.now() - lastTick) / speed);
  paused = true; showSheet("pause"); hud();
}
function resume(){
  if (!paused) return;
  haptic("light");
  paused = false; lastTick = performance.now() - tHold * speed;
  hideSheet(); hud(); syncChrome();
}
function steer(d){
  if (state !== "play" || paused) return;
  var ref = turns.length ? turns[turns.length - 1] : dir;
  if ((d.x === -ref.x && d.y === -ref.y) || (d.x === ref.x && d.y === ref.y)) return;
  if (turns.length < 2) turns.push(d);      /* two deep, so a quick L-turn keeps both swipes */
}
function tick(){
  if (turns.length) dir = turns.shift();
  var h = {x:snake[0].x + dir.x, y:snake[0].y + dir.y};
  if (h.x < 0 || h.y < 0 || h.x >= N || h.y >= N || snake.some(function(s){ return s.x === h.x && s.y === h.y; })){ over(); return; }
  snake.unshift(h);
  if (h.x === food.x && h.y === food.y){
    score++; grew = true;
    rings.push({x:food.x, y:food.y, t0:performance.now()});
    haptic("light"); place(); setHue(140 + score * 14);
    var p = el("pill"); p.textContent = score; p.classList.remove("bump"); void p.offsetWidth; p.classList.add("bump");
    if (score % 5 === 0 && speed > 70) speed -= 12;
  } else { lastTail = snake.pop(); grew = false; }
}
function over(){
  state = "dead"; deadAt = performance.now();
  haptic("error");
  if (!calm){ cv.classList.remove("shake"); void cv.offsetWidth; cv.classList.add("shake"); }
  if (score > 0 && (best == null || score > best)){ best = score; newBest = true; keep("best", String(best)); }
  hud();
}

/* Title screen: a snake doing laps behind the glass. */
var LOOP = [], demoI = 0;
(function(){ var x0 = 1, x1 = 14, y0 = 2, y1 = 13, i;      /* wide of the card, so it laps around it */
  for (i = x0; i < x1; i++) LOOP.push({x:i, y:y0});
  for (i = y0; i < y1; i++) LOOP.push({x:x1, y:i});
  for (i = x1; i > x0; i--) LOOP.push({x:i, y:y1});
  for (i = y1; i > y0; i--) LOOP.push({x:x0, y:i});
})();
function loopAt(i){ var n = LOOP.length; return LOOP[((i % n) + n) % n]; }
function demoReset(){ demoI = 8; demoStep(); }
function demoStep(){
  demoI++; snake = [];
  for (var i = 0; i < 9; i++) snake.push(loopAt(demoI - i));
  lastTail = loopAt(demoI - 9); grew = false;
  dir = {x:snake[0].x - snake[1].x, y:snake[0].y - snake[1].y};
}

/* ---------- drawing ---------- */
function fit(){
  var w = el("wrap");
  B = Math.max(140, Math.floor(Math.min(w.clientWidth, w.clientHeight, 560)));
  DPR = Math.min(window.devicePixelRatio || 1, 3);
  cv.style.width = cv.style.height = B + "px";
  cv.width = cv.height = Math.round(B * DPR);
  el("stage").style.setProperty("--b", B + "px");
}
function mix(a, b, t){ return {x:a.x + (b.x - a.x) * t, y:a.y + (b.y - a.y) * t}; }
function draw(now, t){
  var c = B / N, L = el("stage").classList.contains("lite"), dead = state === "dead" || state === "over", i;
  function ctr(p){ return {x:(p.x + .5) * c, y:(p.y + .5) * c}; }
  cx.setTransform(DPR, 0, 0, DPR, 0, 0);
  cx.clearRect(0, 0, B, B);

  cx.fillStyle = L ? "rgba(20,20,40,.09)" : "rgba(255,255,255,.07)";
  for (var gy = 0; gy < N; gy++) for (var gx = 0; gx < N; gx++){ cx.beginPath(); cx.arc((gx + .5) * c, (gy + .5) * c, 1.1, 0, 7); cx.fill(); }

  if (food){
    var f = ctr(food), fh = hueNow + 180, r = c * (.3 + (calm ? 0 : .04 * Math.sin(now / 260)));
    var g = cx.createRadialGradient(f.x, f.y, 0, f.x, f.y, c * 1.15);
    g.addColorStop(0, "hsla(" + fh + ",95%,62%," + (L ? .35 : .5) + ")"); g.addColorStop(1, "hsla(" + fh + ",95%,62%,0)");
    cx.fillStyle = g; cx.beginPath(); cx.arc(f.x, f.y, c * 1.15, 0, 7); cx.fill();
    cx.fillStyle = "hsl(" + fh + ",92%," + (L ? 56 : 64) + "%)"; cx.beginPath(); cx.arc(f.x, f.y, r, 0, 7); cx.fill();
    cx.fillStyle = "rgba(255,255,255,.55)"; cx.beginPath(); cx.arc(f.x - r * .3, f.y - r * .32, r * .26, 0, 7); cx.fill();
  }
  for (i = rings.length - 1; i >= 0; i--){
    var k = (now - rings[i].t0) / 380;
    if (k >= 1){ rings.splice(i, 1); continue; }
    var rc = ctr(rings[i]);
    cx.strokeStyle = "hsla(" + hueNow + ",90%," + (L ? 40 : 72) + "%," + (1 - k) * .8 + ")"; cx.lineWidth = 2.5;
    cx.beginPath(); cx.arc(rc.x, rc.y, c * (.4 + 1.3 * k), 0, 7); cx.stroke();
  }

  if (snake.length < 2) return;
  var pts = [mix(ctr(snake[1]), ctr(snake[0]), t)];
  for (i = 1; i < snake.length; i++) pts.push(ctr(snake[i]));
  if (lastTail && !grew) pts.push(mix(ctr(lastTail), ctr(snake[snake.length - 1]), t));
  var sat = dead ? 8 : 78, n = pts.length - 1;
  cx.lineCap = "round"; cx.lineJoin = "round"; cx.lineWidth = c * .76;
  if (!dead){                                  /* one soft glow under the whole body */
    cx.save(); cx.shadowColor = "hsla(" + hueNow + ",90%,55%," + (L ? .35 : .6) + ")"; cx.shadowBlur = c * .7;
    cx.strokeStyle = "hsl(" + hueNow + "," + sat + "%," + (L ? 40 : 46) + "%)";
    cx.beginPath(); cx.moveTo(pts[0].x, pts[0].y); for (i = 1; i <= n; i++) cx.lineTo(pts[i].x, pts[i].y); cx.stroke(); cx.restore();
  }
  for (i = n; i >= 1; i--){                    /* tail first, brightening toward the head */
    var lum = (L ? 30 : 36) + (1 - i / n) * (L ? 16 : 22);
    cx.strokeStyle = "hsl(" + (hueNow - 18 * (i / n)) + "," + sat + "%," + lum + "%)";
    cx.beginPath(); cx.moveTo(pts[i].x, pts[i].y); cx.lineTo(pts[i - 1].x, pts[i - 1].y); cx.stroke();
  }
  var hd = pts[0];
  cx.fillStyle = "hsl(" + hueNow + "," + sat + "%," + (L ? 48 : 60) + "%)";
  cx.beginPath(); cx.arc(hd.x, hd.y, c * .44, 0, 7); cx.fill();
  for (var e = -1; e <= 1; e += 2){
    var ex = hd.x + dir.x * c * .12 - dir.y * c * .17 * e, ey = hd.y + dir.y * c * .12 + dir.x * c * .17 * e;
    cx.fillStyle = "#fff"; cx.beginPath(); cx.arc(ex, ey, c * .105, 0, 7); cx.fill();
    cx.fillStyle = "#0b0b10"; cx.beginPath(); cx.arc(ex + dir.x * c * .035, ey + dir.y * c * .035, c * .055, 0, 7); cx.fill();
  }
}
function frame(now){
  requestAnimationFrame(frame);
  var t = 1;
  if (state === "home"){
    if (now - lastTick >= DEMO_MS){ lastTick = now; demoStep(); }
    t = (now - lastTick) / DEMO_MS;
  } else if (state === "play" && paused){ t = tHold; }
  else if (state === "play"){
    if (now - lastTick > speed * 3) lastTick = now - speed;       /* came back from a stall: don't fast-forward */
    while (state === "play" && now - lastTick >= speed){ lastTick += speed; tick(); }
    if (state === "play") t = (now - lastTick) / speed;
  } else if (state === "dead" && now - deadAt > 750){ state = "over"; showSheet("over"); hud(); }
  hueNow += (hue - hueNow) * .06;
  draw(now, calm ? 1 : Math.max(0, Math.min(1, t)));
}

/* ---------- input ---------- */
var px = 0, py = 0, tracking = false;
document.addEventListener("pointerdown", function(e){
  if (e.target.closest && e.target.closest("button")) return;
  tracking = true; px = e.clientX; py = e.clientY;
});
document.addEventListener("pointermove", function(e){
  if (!tracking) return;
  var dx = e.clientX - px, dy = e.clientY - py;
  if (Math.abs(dx) < 22 && Math.abs(dy) < 22) return;
  steer(Math.abs(dx) > Math.abs(dy) ? {x:dx > 0 ? 1 : -1, y:0} : {x:0, y:dy > 0 ? 1 : -1});
  px = e.clientX; py = e.clientY;              /* carry on from here: one drag can turn twice */
});
document.addEventListener("pointerup", function(){ tracking = false; });
document.addEventListener("pointercancel", function(){ tracking = false; });
document.addEventListener("keydown", function(e){
  var m = {ArrowUp:{x:0,y:-1}, ArrowDown:{x:0,y:1}, ArrowLeft:{x:-1,y:0}, ArrowRight:{x:1,y:0},
           w:{x:0,y:-1}, s:{x:0,y:1}, a:{x:-1,y:0}, d:{x:1,y:0}}[e.key];
  if (m){ steer(m); e.preventDefault(); return; }
  if (e.key === " " || e.key === "Escape" || e.key === "p"){ if (paused) resume(); else pause(); e.preventDefault(); }
  else if (e.key === "Enter" && (state === "home" || state === "over")) start();
});
el("bPause").onclick = function(){ haptic("light"); pause(); };

document.addEventListener("visibilitychange", function(){
  if (document.hidden){ pause(); return; }
  if (state !== "home") syncChrome();          /* MyLLM puts its bars back when the app is left */
});
if (window.matchMedia){
  var mq = matchMedia("(prefers-color-scheme: dark)");
  if (mq.addEventListener) mq.addEventListener("change", syncLook); else if (mq.addListener) mq.addListener(syncLook);
}
window.addEventListener("resize", fit);

/* ---------- boot ---------- */
fit(); demoReset(); syncLook(); showSheet("home"); hud();
lastTick = performance.now();
requestAnimationFrame(frame);
load("best").then(function(v){
  if (v){ best = parseInt(v, 10) || null; if (state === "home") showSheet("home"); hud(); }
});
</script></body></html>
