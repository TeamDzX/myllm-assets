--><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Snake</title>
<style>:root{--build-id:"262c0ffc03";color-scheme:dark}
body{font-family:-apple-system,system-ui,sans-serif;margin:0;background:#0c1f12;color:#d7ffe0;text-align:center;touch-action:none;overscroll-behavior:none}
h1{font-size:20px;margin:14px 0 2px}
#stats{font-size:13px;opacity:.6;margin-bottom:10px}
canvas{background:#10301c;border-radius:12px;width:min(320px,86vw);height:auto;touch-action:none}
#msg{font-size:15px;min-height:22px;margin-top:10px}
button{border:0;background:#30d158;color:#04240f;border-radius:10px;padding:11px 26px;font-size:15px;font-weight:700;margin-top:8px}
@media(min-width:768px){canvas{width:min(440px,86vw)}}
</style></head><body>
<h1>🐍 Snake</h1>
<div id="stats"></div>
<canvas id="c" width="320" height="320"></canvas>
<div id="msg">Swipe to steer</div>
<button onclick="start()">Play</button>
<script>
var store=window.myllmStorage||{getItem:function(){return Promise.resolve(null)},setItem:function(){return Promise.resolve()}};
var cv=document.getElementById('c'),cx=cv.getContext('2d'),N=16,S=20;
var snake=null,dir,nextDir,food,score=0,best=null,timer=null,speed;
function start(){snake=[{x:8,y:8},{x:7,y:8},{x:6,y:8}];dir={x:1,y:0};nextDir=dir;score=0;speed=160;place();
if(timer)clearInterval(timer);timer=setInterval(tick,speed);msg('');stats();draw()}
function msg(t){document.getElementById('msg').textContent=t}
function stats(){document.getElementById('stats').textContent='Score: '+score+(best!=null?' · Best: '+best:'')}
function place(){do{food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}while(snake.some(function(s){return s.x===food.x&&s.y===food.y}))}
function rrect(x,y,w,h,r){cx.beginPath();if(cx.roundRect)cx.roundRect(x,y,w,h,r);else cx.rect(x,y,w,h);cx.fill()}
function tick(){dir=nextDir;var h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(function(s){return s.x===h.x&&s.y===h.y})){over();return}
snake.unshift(h);
if(h.x===food.x&&h.y===food.y){score++;stats();place();if(window.myllmHaptic)myllmHaptic('light');
if(score%5===0&&speed>70){speed-=12;clearInterval(timer);timer=setInterval(tick,speed)}}
else snake.pop();
draw()}
function over(){clearInterval(timer);timer=null;
if(window.myllmHaptic)myllmHaptic('error');
if(best==null||score>best){best=score;store.setItem('best',String(best));msg('💥 Game over — new best: '+best+'!')}
else msg('💥 Game over — score '+score);
stats()}
function draw(){cx.clearRect(0,0,320,320);
cx.fillStyle='#ff453a';cx.beginPath();cx.arc(food.x*S+S/2,food.y*S+S/2,S/2-3,0,7);cx.fill();
snake.forEach(function(s,i){cx.fillStyle=i?'#30d158':'#7dffa0';rrect(s.x*S+1.5,s.y*S+1.5,S-3,S-3,5)})}
var tx=0,ty=0;
document.addEventListener('touchstart',function(e){tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',function(e){var dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
if(Math.abs(dx)<18&&Math.abs(dy)<18)return;
var d=Math.abs(dx)>Math.abs(dy)?{x:dx>0?1:-1,y:0}:{x:0,y:dy>0?1:-1};
if(snake&&(d.x!==-dir.x||d.y!==-dir.y))nextDir=d},{passive:true});
document.addEventListener('keydown',function(e){var m={ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0}}[e.key];
if(m&&snake&&(m.x!==-dir.x||m.y!==-dir.y))nextDir=m});
store.getItem('best').then(function(v){if(v)best=parseInt(v,10)||null;stats()});
</script></body></html>
