<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Code Lab</title>
<meta name="myllm:immersive" content="on">
<style>
:root{--build-id:"c71a1a0bef";
  color-scheme:light dark;
  --bg:var(--myllm-bg,#f2f2f7);--surface:var(--myllm-surface,#fff);
  --text:var(--myllm-text,#111);--muted:var(--myllm-muted,#6b6b72);
  --accent:var(--myllm-accent,#0a84ff);--border:var(--myllm-border,#e3e3e8);
  --radius:var(--myllm-radius,18px);--font:var(--myllm-font,-apple-system,system-ui,sans-serif);
  --h:215;                                 /* Code Lab's own hue: the lesson card and the tiles */
  --code:#1e1e2e;--ok:#1f8c42;--okbg:rgba(52,199,89,.15);--no:#9a6400;--nobg:rgba(255,159,10,.15);
}
@media(prefers-color-scheme:dark){:root{--bg:var(--myllm-bg,#000);--surface:var(--myllm-surface,#1c1c1e);--text:var(--myllm-text,#f2f2f7);--muted:var(--myllm-muted,#98989f);--border:var(--myllm-border,#2c2c2e);
  --ok:#5fdc86;--okbg:rgba(52,199,89,.18);--no:#ffc35c;--nobg:rgba(255,159,10,.16)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);min-height:100dvh;-webkit-text-size-adjust:100%}
svg.i{width:1.25em;height:1.25em;fill:currentColor;flex-shrink:0;display:block}
button{font-family:inherit}
button:active{transform:scale(.96)}
.wrap{max-width:600px;margin:0 auto;
  padding:calc(14px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(30px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}

.head{display:flex;align-items:center;gap:12px;margin:2px 2px 14px}
.tile{display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;
  background:linear-gradient(145deg,hsl(var(--h) 62% 50%),hsl(calc(var(--h) + 40) 58% 28%))}
.head .tile{width:44px;height:44px;border-radius:13px;font-size:19px}
.head .ht{flex:1;min-width:0}
.head h1{font-size:22px;font-weight:800;letter-spacing:-.01em;margin:0}
.head p{font-size:13px;color:var(--muted);margin:1px 0 0}

/* The lesson you are on, and how far through you are. */
.hero{position:relative;overflow:hidden;border-radius:20px;padding:16px 16px 14px;margin-bottom:14px;color:#fff;
  background:linear-gradient(145deg,hsl(var(--h) 62% 46%),hsl(calc(var(--h) + 40) 58% 24%));
  box-shadow:0 16px 40px -18px hsl(var(--h) 60% 30% / .7)}
.hero::after{content:"";position:absolute;right:-50px;top:-60px;width:180px;height:180px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.22),transparent 70%);pointer-events:none}
.hero-row{display:flex;align-items:flex-start;gap:12px;position:relative;z-index:1}
.hero-txt{flex:1;min-width:0}
.lesson-no{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;opacity:.78}
.hero h1{font-size:22px;font-weight:800;letter-spacing:-.01em;line-height:1.2;margin:4px 0 0}
.menuBtn{flex:none;min-height:40px;border-radius:99px;padding:0 14px;font-size:13.5px;font-weight:700;cursor:pointer;color:#fff;
  display:inline-flex;align-items:center;gap:7px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.15);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.prog{height:6px;background:rgba(255,255,255,.2);border-radius:99px;overflow:hidden;margin-top:14px;position:relative;z-index:1}
.prog i{display:block;height:100%;background:#fff;border-radius:99px;width:0;transition:width .4s cubic-bezier(.2,.8,.2,1)}

.teach{color:var(--muted);font-size:15.5px;line-height:1.5;margin:0 2px 12px}
.goal{display:flex;gap:11px;align-items:flex-start;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:12px;font-size:14.5px;line-height:1.45;margin-bottom:14px}
.goal .gt{width:34px;height:34px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;
  background:linear-gradient(145deg,hsl(var(--h) 62% 52%),hsl(calc(var(--h) + 40) 58% 30%))}
.goal b{color:var(--accent)}
.goal div{min-width:0;padding-top:1px;overflow-wrap:anywhere}

.lab label{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;display:block;margin:0 2px 7px}
/* 16px: anything smaller and iOS zooms the whole page when the editor takes focus */
textarea{display:block;width:100%;min-height:170px;background:var(--code);color:#e6e6f0;caret-color:#5ea0ff;border:1px solid var(--border);border-radius:16px;padding:13px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:16px;line-height:1.5;resize:vertical;tab-size:2;outline:none}
textarea:focus{border-color:var(--accent)}
textarea::selection{background:rgba(94,160,255,.35)}
.previewWrap{margin-top:14px}
iframe{display:block;width:100%;height:220px;border:1px solid var(--border);border-radius:16px;background:#fff}

.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btns button{border:0;border-radius:13px;min-height:46px;padding:0 15px;font-weight:700;font-size:14.5px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.check{background:var(--accent);color:#fff;flex:1 1 auto}
.ghost{background:var(--surface);border:1px solid var(--border)!important;color:var(--text)}
.ai{background:var(--surface);border:1px solid var(--border)!important;color:var(--accent);flex:1 1 auto}
.btns button:disabled{opacity:.45}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
.nav button{border:0;background:none;color:var(--accent);font-weight:700;font-size:15.5px;cursor:pointer;min-height:46px;padding:0 10px;display:inline-flex;align-items:center;gap:4px;border-radius:13px}
.nav button:disabled{opacity:.35}
.nav button.go{background:var(--accent);color:#fff;padding:0 14px 0 18px;animation:pulse 1.3s ease-in-out 2}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@media(prefers-reduced-motion:reduce){.nav button.go{animation:none}.prog i{transition:none}}
#fb{margin-top:12px;padding:12px 14px;border-radius:14px;font-size:14.5px;line-height:1.45;font-weight:550;display:none}
#fb.ok{display:block;background:var(--okbg);color:var(--ok)}
#fb.no{display:block;background:var(--nobg);color:var(--no)}
#aiBox{margin-top:12px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:13px 14px;font-size:14.5px;line-height:1.5;display:none;white-space:pre-wrap}
.dots:after{content:'';animation:d 1.1s steps(4) infinite}@keyframes d{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}

.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:30}
.sheet.show{display:flex}
.sheetBody{background:var(--bg);width:100%;max-width:600px;max-height:80dvh;overflow:auto;-webkit-overflow-scrolling:touch;border-radius:22px 22px 0 0;
  padding:8px calc(16px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
.sheetBody::before{content:"";display:block;width:38px;height:5px;border-radius:99px;background:var(--border);margin:0 auto 10px}
.sheetBody h3{margin:4px 2px 12px;font-size:20px;font-weight:800}
.lgroup{background:var(--surface);border:1px solid var(--border);border-radius:18px;overflow:hidden}
.litem{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 14px;border-bottom:1px solid var(--border);cursor:pointer;font-size:15px;font-weight:600}
.litem:last-child{border-bottom:none}
.litem:active{background:var(--bg)}
.litem .n{width:28px;height:28px;border-radius:50%;background:var(--bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;flex:none;color:var(--muted);font-variant-numeric:tabular-nums}
.litem.done .n{background:var(--accent);color:#fff;border-color:transparent;font-size:12px}
.litem.cur{color:var(--accent)}
.litem.cur .n{border-color:var(--accent);color:var(--accent)}
.litem.cur.done .n{color:#fff}
.done-screen{text-align:center;padding:34px 10px}
.done-screen .big{width:76px;height:76px;border-radius:24px;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:32px;
  background:linear-gradient(145deg,hsl(var(--h) 62% 52%),hsl(calc(var(--h) + 40) 58% 30%))}
h2.title{font-size:22px;font-weight:800;margin:2px 0 8px}

/* A tablet, or a phone on its side: code on the left, the page it makes on the right. */
@media(min-width:700px){
  .wrap{max-width:1100px}
  .lab{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:stretch}
  .lab>div{display:flex;flex-direction:column;min-width:0}
  .previewWrap{margin-top:0}
  textarea{flex:1;min-height:300px;resize:none}
  iframe{flex:1;height:auto;min-height:300px}
  .check,.ai{flex:0 0 auto}
}
@media(min-width:700px) and (max-height:520px){
  .hero{padding:12px 16px}.hero h1{font-size:19px}.prog{margin-top:10px}
  .head{margin-bottom:8px}.head p{display:none}.head .tile{width:34px;height:34px;border-radius:10px;font-size:15px}
  textarea,iframe{min-height:210px}
}

/* myllm-fullscreen-v1 — MyLLM 5.6.2+ opens this app full screen; the ✕ is the way out. */
.head .imm-acts{display:none;flex-shrink:0;margin-left:auto}
.head .acts + .imm-acts{margin-left:0}
body.imm .head .imm-acts{display:flex}
.head .imm-acts button{width:40px;height:40px;border-radius:12px;border:1px solid var(--myllm-border,rgba(128,128,128,.28));
  background:var(--myllm-surface,rgba(128,128,128,.12));color:var(--myllm-text,currentColor);display:grid;place-items:center;padding:0;cursor:pointer;transition:transform .12s}
.head .imm-acts button:active,.head .imm-x:active{transform:scale(.94)}
.head .imm-x{display:none !important}
body.imm .head .imm-x{display:grid !important;place-items:center}
.imm-x svg,.imm-acts svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}
.imm-safe{display:none}
body.imm .imm-safe{display:block}
</style>
</head>

<div class="wrap">
  <div class="imm-safe"></div><div class="head">
    <div class="tile"><svg class="i"><use href="#i-code"/></svg></div>
    <div class="ht"><h1>Code Lab</h1><p>Learn to code, live</p></div>
  <div class="imm-acts"><button type="button" aria-label="Close Code Lab" onclick="myllmFSClose()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div></div>
  <div class="hero">
    <div class="hero-row">
      <div class="hero-txt"><div class="lesson-no" id="hNo">Code Lab</div><h1 id="hTitle">Code Lab</h1></div>
      <button class="menuBtn" id="menuBtn"><svg class="i"><use href="#i-list"/></svg>Lessons</button>
    </div>
    <div class="prog"><i id="bar"></i></div>
  </div>
  <div id="view"></div>
</div>

<div class="sheet" id="sheet"><div class="sheetBody"><h3>Lessons</h3><div class="lgroup" id="list"></div></div></div>

<script>
var LESSONS=[
 {t:"Headings",teach:"Web pages are built from tags. A heading uses <h1>…</h1> — h1 is biggest, down to h6.",
  goal:"Make an <h1> heading with your name.",
  starter:"<h1>Hello!</h1>",
  hint:"Put your text between <h1> and </h1>.",
  check:function(c,d){var h=d.querySelector("h1");return h&&h.textContent.trim().length>0}},
 {t:"Paragraphs",teach:"Normal text goes in a paragraph: <p>…</p>. You can have many.",
  goal:"Add a <p> with a sentence about yourself.",
  starter:"<h1>About me</h1>\n<p>I am learning to code.</p>",
  hint:"Add <p>your sentence</p> under the heading.",
  check:function(c,d){var p=d.querySelector("p");return p&&p.textContent.trim().length>3}},
 {t:"Links",teach:"A link uses an anchor tag: <a href=\"https://…\">text</a>. href is where it goes.",
  goal:"Add a link to any website.",
  starter:'<a href="https://example.com">Visit a site</a>',
  hint:'Use <a href="https://…">text</a>.',
  check:function(c,d){return !!d.querySelector("a[href]")}},
 {t:"Images",teach:"Show a picture with <img src=\"URL\">. It has no closing tag; alt describes it.",
  goal:"Add an <img> with a src.",
  starter:'<img src="https://picsum.photos/240" alt="a random photo">',
  hint:'Add <img src="https://…" alt="...">.',
  check:function(c,d){return !!d.querySelector("img[src]")}},
 {t:"Lists",teach:"A bulleted list is a <ul> with <li> items inside. (Use <ol> for numbers.)",
  goal:"Make a list with at least 2 items.",
  starter:"<ul>\n  <li>Tea</li>\n  <li>Coffee</li>\n</ul>",
  hint:"Put two <li>…</li> inside <ul>…</ul>.",
  check:function(c,d){return d.querySelectorAll("ul li, ol li").length>=2}},
 {t:"Bold & italic",teach:"Emphasise text with <strong>bold</strong> and <em>italic</em>.",
  goal:"Use both <strong> and <em>.",
  starter:"<p>This is <strong>important</strong> and <em>lovely</em>.</p>",
  hint:"Wrap words in <strong>…</strong> and <em>…</em>.",
  check:function(c,d){return d.querySelector("strong")&&d.querySelector("em")}},
 {t:"Colour with CSS",teach:"Style a tag with the style attribute. Colours can be names (tomato, royalblue) or hex (#0a84ff).",
  goal:"Give an element a colour.",
  starter:'<h1 style="color: tomato">Colourful heading</h1>',
  hint:'Add style="color: red" to a tag.',
  check:function(c,d){return /style\s*=\s*["'][^"']*color\s*:/i.test(c)||/<style[\s\S]*color\s*:/i.test(c)}},
 {t:"Size & alignment",teach:"font-size sets text size (e.g. 24px); text-align: center centres it.",
  goal:"Make text bigger AND centred.",
  starter:'<p style="font-size: 24px; text-align: center">Big and centred</p>',
  hint:"Use font-size: 24px and text-align: center together in a style.",
  check:function(c){return /font-size\s*:/i.test(c)&&/text-align\s*:/i.test(c)}},
 {t:"Boxes",teach:"padding adds space inside; background colours it; border-radius rounds the corners. Great for cards.",
  goal:"Make a rounded, coloured box with padding.",
  starter:'<div style="background:#0a84ff; color:#fff; padding:16px; border-radius:12px">A tidy card</div>',
  hint:"Add background, padding and border-radius to a <div>.",
  check:function(c){return /background\s*:/i.test(c)&&/padding\s*:/i.test(c)}},
 {t:"Classes & <style>",teach:"Rather than repeat styles, define a class once in a <style> block and reuse it with class=\"…\".",
  goal:"Define a .box class in <style> and use it.",
  starter:'<style>\n  .box { background:#34c759; color:#fff; padding:12px; border-radius:10px }\n</style>\n<div class="box">Reusable box</div>',
  hint:'Write .box { … } inside <style>, then add class="box" to an element.',
  check:function(c,d){return /<style[\s\S]*\.[\w-]+\s*\{/i.test(c)&&!!d.querySelector("[class]")}},
 {t:"A button + JavaScript",teach:"JavaScript makes pages interactive. onclick runs code when a button is tapped.",
  goal:"Make a button that changes the text when clicked.",
  starter:'<p id="out">Tap the button</p>\n<button onclick="document.getElementById(\'out\').textContent=\'Clicked!\'">Click me</button>',
  hint:'Add a <button onclick="...">. Try it in the preview!',
  check:function(c,d){return !!d.querySelector("button")&&/onclick|addeventlistener/i.test(c)}},
 {t:"Variables & the page",teach:"In a <script>, store data in a variable, then change the page with document.querySelector(...).textContent.",
  goal:"Use a <script> with a variable that sets some text.",
  starter:'<h2 id="t"></h2>\n<script>\n  var name = "Coder";\n  document.querySelector("#t").textContent = "Hi, " + name;\n<\/script>',
  hint:"Inside <script>, make a variable and use document.querySelector(...).textContent = ...",
  check:function(c,d){return /<script[\s\S]*(var|let|const)\s/i.test(c)&&!!d.querySelector("#t")}},
 {t:"Flexbox layout",teach:"display: flex lays a box's children in a row. gap spaces them; justify-content positions them along the row; align-items across it.",
  goal:"Make a flex row with at least 2 boxes inside.",
  starter:'<div style="display:flex; gap:10px; justify-content:center">\n  <div style="background:#0a84ff;color:#fff;padding:16px;border-radius:10px">A</div>\n  <div style="background:#34c759;color:#fff;padding:16px;border-radius:10px">B</div>\n  <div style="background:#ff9500;color:#fff;padding:16px;border-radius:10px">C</div>\n</div>',
  hint:"Put display:flex on a container, then give it 2+ child <div>s. gap adds space between them.",
  check:function(c,d){var w=frame.contentWindow,els=d.body.querySelectorAll("*");for(var i=0;i<els.length;i++){try{if(w.getComputedStyle(els[i]).display==="flex"&&els[i].children.length>=2)return true}catch(e){}}return false}},
 {t:"Forms & inputs",teach:"Forms collect what people type. <input> is a single line — set its type and a placeholder. Add a <button> to submit.",
  goal:"Make a text input and a button.",
  starter:'<input type="text" placeholder="Your name">\n<button>Submit</button>',
  hint:"Add an <input ...> and a <button>…</button>.",
  check:function(c,d){return !!d.querySelector("input,textarea,select")&&!!d.querySelector("button,input[type=submit]")}},
 {t:"Capstone: profile card",teach:"Time to combine everything — a <style> block with classes, an image, a heading, text, and a button with JavaScript. Make it your own!",
  goal:"Build a profile card: a styled box with a heading, an image, a short bio, and a button that does something when tapped.",
  starter:'<style>\n  .card{max-width:280px;margin:auto;background:#fff;border:1px solid #eee;border-radius:16px;padding:20px;text-align:center;font-family:-apple-system,system-ui,sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.08)}\n  .card img{width:84px;height:84px;border-radius:50%;object-fit:cover}\n  .card h2{margin:12px 0 2px}\n  .card p{color:#666;font-size:14px;margin:0 0 14px}\n  .card button{background:#0a84ff;color:#fff;border:0;padding:10px 18px;border-radius:10px;font-size:15px}\n</style>\n<div class="card">\n  <img src="https://picsum.photos/170" alt="avatar">\n  <h2>Alex</h2>\n  <p id="bio">Learning to build for the web.</p>\n  <button onclick="document.getElementById(\'bio\').textContent=\'👋 Thanks for visiting!\'">Say hi</button>\n</div>',
  hint:"Aim for at least four of: a heading, an image, a paragraph, a button, and box styling (padding / border-radius).",
  check:function(c,d){var n=0;if(d.querySelector("h1,h2,h3"))n++;if(d.querySelector("img[src]"))n++;if(d.querySelector("p"))n++;if(d.querySelector("button"))n++;if(/border-radius\s*:/i.test(c)||/padding\s*:/i.test(c))n++;return n>=4}},
 {t:"Grid layout",teach:"display: grid arranges items into rows AND columns. grid-template-columns sets the columns — try repeat(3, 1fr) for three equal ones — and gap spaces them out.",
  goal:"Make a grid with 3 columns and several boxes.",
  starter:'<style>\n  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}\n  .grid div{background:#5e5ce6;color:#fff;padding:18px;border-radius:10px;text-align:center}\n</style>\n<div class="grid">\n  <div>1</div><div>2</div><div>3</div>\n  <div>4</div><div>5</div><div>6</div>\n</div>',
  hint:"Put display:grid and grid-template-columns:repeat(3,1fr) on a container with several children.",
  check:function(c,d){var w=frame.contentWindow,els=d.body.querySelectorAll("*");for(var i=0;i<els.length;i++){try{if(w.getComputedStyle(els[i]).display==="grid"&&els[i].children.length>=2)return true}catch(e){}}return false}},
 {t:"Transitions & hover",teach:"transition makes a style change animate smoothly instead of snapping. Pair it with :hover (in a <style> block) so an element reacts when pointed at or tapped.",
  goal:"Make an element that smoothly changes on hover, using transition.",
  starter:'<style>\n  .btn{display:inline-block;background:#0a84ff;color:#fff;padding:12px 20px;border-radius:10px;\n       transition:transform .25s ease, background .25s}\n  .btn:hover{transform:scale(1.08);background:#5e5ce6}\n</style>\n<div class="btn">Hover or tap me</div>',
  hint:"Add transition: transform .25s to an element, then a .name:hover { transform: scale(1.1) } rule.",
  check:function(c){return /transition\s*:/i.test(c)&&/:hover/i.test(c)}},
 {t:"Capstone: photo gallery",teach:"A second project! Combine grid for the layout with transition + :hover so the pictures zoom smoothly. Swap in your own image URLs and sizes.",
  goal:"Build a photo gallery: a grid of at least 3 images that zoom smoothly on hover.",
  starter:'<style>\n  .gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-width:360px;margin:auto}\n  .gallery img{width:100%;height:120px;object-fit:cover;border-radius:12px;\n               transition:transform .25s ease, box-shadow .25s}\n  .gallery img:hover{transform:scale(1.06);box-shadow:0 8px 20px rgba(0,0,0,.2)}\n</style>\n<div class="gallery">\n  <img src="https://picsum.photos/seed/a/300/200" alt="">\n  <img src="https://picsum.photos/seed/b/300/200" alt="">\n  <img src="https://picsum.photos/seed/c/300/200" alt="">\n  <img src="https://picsum.photos/seed/d/300/200" alt="">\n</div>',
  hint:"Aim for a grid container, 3+ images, and a transition (plus a :hover for the zoom).",
  check:function(c,d){var n=0;if(/grid-template|display\s*:\s*grid/i.test(c))n++;if(d.querySelectorAll("img[src]").length>=3)n++;if(/transition\s*:/i.test(c))n++;if(/:hover/i.test(c))n++;return n>=3}}
];

var state={idx:0,done:{},code:{}},frame,editor,renderT,saveT,busy=false;
function haptic(k){if(window.myllmHaptic)try{myllmHaptic(k)}catch(e){}}
function $(i){return document.getElementById(i)}
function wrap(code){return '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:-apple-system,system-ui,sans-serif;margin:0;padding:14px;color:#111;background:#fff;line-height:1.5}</style></head><body>'+code+'</body></html>'}
// Render the current code into the preview iframe and return the exact
// document we wrote to — check() reads THIS so validation can never race a
// stale document reference.
function renderTo(){
  if(!frame)return null;
  try{var d=frame.contentDocument||frame.contentWindow.document;d.open();d.write(wrap(editor.value));d.close();return d}catch(e){return null}
}
function render(){renderTo();}

function bar(){var n=Object.keys(state.done).length;$('bar').style.width=(n/LESSONS.length*100)+'%'}

function lessonView(i){
  var L=LESSONS[i],aiOn=!!window.myllmAsk;
  return '<p class="teach">'+L.teach.replace(/</g,'&lt;')+'</p>'+
    '<div class="goal"><span class="gt"><svg class="i"><use href="#i-target"/></svg></span><div><b>Goal:</b> '+L.goal.replace(/</g,'&lt;')+'</div></div>'+
    '<div class="lab"><div><label for="editor">Your code — edit it</label>'+
    '<textarea id="editor" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off"></textarea></div>'+
    '<div class="previewWrap"><label>Live preview</label><iframe id="frame" title="preview"></iframe></div></div>'+
    '<div id="fb"></div><div id="aiBox"></div>'+
    '<div class="btns">'+
      '<button class="check" id="checkBtn"><svg class="i"><use href="#i-check"/></svg>Check</button>'+
      '<button class="ghost" id="resetBtn"><svg class="i"><use href="#i-reset"/></svg>Reset</button>'+
      (aiOn?'<button class="ai" id="explainBtn"><svg class="i"><use href="#i-bulb"/></svg>Explain</button><button class="ai" id="helpBtn"><svg class="i"><use href="#i-help"/></svg>Help me fix it</button>':'')+
    '</div>'+
    '<div class="nav"><button id="prevBtn"><svg class="i"><use href="#i-left"/></svg>Back</button><button id="nextBtn"></button></div>';
}

function nextLabel(last){return last?'Finish<svg class="i"><use href="#i-flag"/></svg>':'Next<svg class="i"><use href="#i-right"/></svg>'}
function load(i){
  state.idx=i;$('view').innerHTML=lessonView(i);
  $('hNo').textContent='Lesson '+(i+1)+' / '+LESSONS.length;$('hTitle').textContent=LESSONS[i].t;
  editor=$('editor');frame=$('frame');
  editor.value=(i in state.code)?state.code[i]:LESSONS[i].starter;
  render();bar();save();
  editor.addEventListener('input',function(){state.code[state.idx]=editor.value;clearTimeout(renderT);renderT=setTimeout(render,180);clearTimeout(saveT);saveT=setTimeout(save,500)});
  $('checkBtn').onclick=check;
  $('resetBtn').onclick=function(){editor.value=LESSONS[state.idx].starter;state.code[state.idx]=editor.value;render();fb('','');$('nextBtn').classList.remove('go');haptic('light')};
  $('prevBtn').onclick=function(){if(state.idx>0){haptic('selection');load(state.idx-1)}};
  $('prevBtn').disabled=(i===0);
  var last=(i>=LESSONS.length-1);
  $('nextBtn').innerHTML=nextLabel(last);
  $('nextBtn').onclick=function(){haptic('selection');if(state.idx<LESSONS.length-1)load(state.idx+1);else finish()};
  if(state.done[i])$('nextBtn').classList.add('go');
  if(window.myllmAsk){$('explainBtn').onclick=explain;$('helpBtn').onclick=help}
  fb(state.done[i]?'ok':'', state.done[i]?('Completed — tap '+(last?'Finish':'Next')+' to carry on.'):'');
}
function fb(kind,msg){var e=$('fb');if(!e)return;e.className=kind||'';e.textContent=msg||'';if(!kind)e.style.display='none'}
function check(){
  var d=renderTo();var ok=false;try{ok=!!(d&&LESSONS[state.idx].check(editor.value,d))}catch(e){ok=false}
  var last=state.idx>=LESSONS.length-1;
  if(ok){
    state.done[state.idx]=true;bar();save();haptic('success');
    fb('ok','Great — that works! Edit it to experiment, or tap '+(last?'Finish':'Next')+' to continue.');
    $('nextBtn').classList.add('go');
  } else {
    $('nextBtn').classList.remove('go');
    fb('no','Not quite yet — '+LESSONS[state.idx].hint);haptic('warning');
  }
}

var SYS="You are a friendly, encouraging coding tutor for absolute beginners learning HTML, CSS and JavaScript. Keep every answer to 2-3 short, plain sentences. Be concrete and kind. Never lecture.";
function aiBusy(b){busy=b;var ex=$('explainBtn'),h=$('helpBtn');if(ex)ex.disabled=b;if(h)h.disabled=b}
function showAI(t){var b=$('aiBox');b.style.display='block';b.textContent=t}
function explain(){
  if(busy)return;var L=LESSONS[state.idx];aiBusy(true);showAI('Thinking');$('aiBox').innerHTML='<span class="dots">Thinking</span>';haptic('light');
  myllmAsk('Explain this beginner web-coding topic in 2-3 simple sentences: "'+L.t+'". Context: '+L.teach,{system:SYS})
   .then(function(r){showAI((r||'').trim()||'Try again.')}).catch(function(){showAI('The AI is unavailable right now.')}).then(function(){aiBusy(false)});
}
function help(){
  if(busy)return;var L=LESSONS[state.idx];aiBusy(true);$('aiBox').style.display='block';$('aiBox').innerHTML='<span class="dots">Looking at your code</span>';haptic('light');
  myllmAsk('A beginner is on the lesson "'+L.t+'". Goal: '+L.goal+'\nTheir code:\n'+editor.value+'\n\nIn 2-3 sentences, gently nudge them toward what to change. Give a hint, not the full solution.',{system:SYS})
   .then(function(r){showAI((r||'').trim()||'Try again.')}).catch(function(){showAI('The AI is unavailable right now.')}).then(function(){aiBusy(false)});
}

function finish(){
  var n=Object.keys(state.done).length;
  $('hNo').textContent='Code Lab';$('hTitle').textContent='Course complete';
  $('view').innerHTML='<div class="done-screen"><div class="big"><svg class="i"><use href="#i-flag"/></svg></div><h2 class="title">You reached the end!</h2>'+
    '<p class="teach">You completed '+n+' of '+LESSONS.length+' challenges. You can now write real HTML, style it with CSS, and add JavaScript.</p>'+
    '<div class="btns" style="justify-content:center"><button class="check" id="again">Review lessons</button></div></div>';
  $('again').onclick=function(){load(0)};haptic('success');bar();
}

function buildList(){
  var l=$('list');l.innerHTML='';
  LESSONS.forEach(function(L,i){
    var d=document.createElement('div');d.className='litem'+(state.done[i]?' done':'')+(i===state.idx?' cur':'');
    d.innerHTML='<span class="n">'+(state.done[i]?'<svg class="i"><use href="#i-check"/></svg>':(i+1))+'</span><span>'+L.t+'</span>';
    d.onclick=function(){$('sheet').classList.remove('show');haptic('selection');load(i)};l.appendChild(d);
  });
}
$('menuBtn').onclick=function(){buildList();$('sheet').classList.add('show');haptic('selection')};
$('sheet').onclick=function(e){if(e.target===$('sheet'))$('sheet').classList.remove('show')};

function save(){if(window.myllmStorage)myllmStorage.setItem('codelab',JSON.stringify({idx:state.idx,done:state.done,code:state.code}))}
function start(){
  if(!window.myllmStorage){load(0);return}
  myllmStorage.getItem('codelab').then(function(v){
    if(v)try{var s=JSON.parse(v);state.done=s.done||{};state.code=s.code||{};state.idx=s.idx||0}catch(e){}
    load(state.idx<LESSONS.length?state.idx:0);
  });
}
start();

/* myllm-fullscreen-v1 — full screen where MyLLM can also close the app for us (myllmClose,
   5.6.2+): full screen hides MyLLM's Done, and a page with no way out is
   worse than a repeated title, so elsewhere nothing changes. The spacer keeps
   the header clear of the status bar only if the page doesn't already. */
(function(){
  function full(){ return !!(window.myllmClose && window.myllmImmersive); }
  function inset(){
    var p = document.createElement("div");
    p.style.cssText = "position:fixed;top:0;left:0;width:1px;visibility:hidden;height:env(safe-area-inset-top)";
    document.body.appendChild(p); var h = p.offsetHeight; p.parentNode.removeChild(p); return h;
  }
  function fit(){
    var sp = document.querySelector(".imm-safe"), head = document.querySelector(".head");
    if (!sp || !head) return;
    sp.style.height = "0px";
    if (!document.body.classList.contains("imm")) return;
    var need = inset() + 6 - (head.getBoundingClientRect().top + window.scrollY);
    sp.style.height = Math.max(0, Math.round(need)) + "px";
  }
  function sync(){
    var f = full();
    document.body.classList.toggle("imm", f);
    fit();
    if (!f) return;
    try { window.myllmImmersive(true, { keepAwake:false }).catch(function(){}); } catch(e){}
  }
  window.myllmFSClose = function(){
    try { if (window.myllmHaptic) window.myllmHaptic("light"); } catch(e){}
    try { window.myllmClose().catch(function(){}); } catch(e){}
  };
  document.addEventListener("visibilitychange", function(){ if (!document.hidden) sync(); });
  window.addEventListener("resize", fit);
  sync();
})();
</script>
