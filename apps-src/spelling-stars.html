<title>Spelling Stars</title>
<style>:root{--build-id:"557463d871";color-scheme:light dark;
  --bg:var(--myllm-bg,#f2f2f7); --surface:var(--myllm-surface,#fff); --ink:var(--myllm-text,#111);
  --muted:var(--myllm-muted,#8a8a8e); --line:var(--myllm-border,#e3e3e8); --acc:var(--myllm-accent,#0a84ff);
  --fill:rgba(120,120,128,.12); --h:264; }

  --ink:var(--myllm-text,#f2f2f7); --muted:var(--myllm-muted,#8e8e93); --line:var(--myllm-border,#2c2c2e); --fill:rgba(120,120,128,.24); } }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ font-family:var(--myllm-font,-apple-system,system-ui,sans-serif); background:var(--bg); color:var(--ink); min-height:100dvh; font-size:15.5px; line-height:1.4; }
  body.lock{ overflow:hidden; }
  .home{ max-width:600px; margin:0 auto;
    padding:calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(30px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left)); }
  @media (min-width:768px){ .home{ max-width:760px; } }
  svg.i{ width:1.25em; height:1.25em; fill:currentColor; flex-shrink:0; }
  button{ font:inherit; color:inherit; cursor:pointer; } button:active{ transform:scale(.96); }
  [hidden]{ display:none !important; }

  .head{ display:flex; align-items:center; gap:12px; margin:2px 2px 14px; }
  .tile{ display:flex; align-items:center; justify-content:center; color:#fff; flex-shrink:0;
    background:linear-gradient(145deg, hsl(var(--h) 62% 50%), hsl(calc(var(--h) + 40) 58% 28%)); }
  .head .tile{ width:44px; height:44px; border-radius:13px; font-size:19px; }
  .head .ht{ flex:1; min-width:0; }
  h1{ font-size:22px; font-weight:800; letter-spacing:-.01em; }
  .head p{ font-size:13px; color:var(--muted); margin-top:1px; }
  .head .acts{ display:flex; gap:8px; flex-shrink:0; }
  h2.sec{ font-size:12px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); margin:20px 2px 9px; }

  .hero{ border-radius:20px; padding:16px 18px; color:#fff; margin-bottom:12px; display:flex; align-items:center; gap:16px;
    background:linear-gradient(145deg, hsl(var(--h) 62% 46%), hsl(calc(var(--h) + 40) 58% 24%)); box-shadow:0 10px 28px hsl(var(--h) 60% 30% / .25); }
  .hero .n{ font-size:44px; font-weight:800; line-height:1; letter-spacing:-.03em; font-variant-numeric:tabular-nums; flex-shrink:0; }
  .hero .k{ display:block; font-size:11px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; opacity:.78; }
  .hero b{ display:block; font-size:17px; font-weight:750; line-height:1.25; overflow-wrap:anywhere; }
  .hero span.s{ display:block; font-size:12.5px; line-height:1.4; opacity:.82; margin-top:3px; overflow-wrap:anywhere; }
  .hero .grow{ flex:1; min-width:0; }

  .card{ background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:14px; margin-bottom:12px; }
  label{ display:block; font-size:12px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); margin:14px 2px 7px; }
  label:first-child{ margin-top:0; }
  input, textarea, select{ width:100%; font:inherit; font-size:16px; padding:12px; border-radius:12px; border:1px solid var(--line); background:var(--bg); color:var(--ink); outline:none; }
  input:focus, textarea:focus{ border-color:hsl(var(--h) 60% 55%); }
  .go{ width:100%; min-height:50px; margin-top:14px; border:none; border-radius:14px; background:hsl(var(--h) 62% 52%); color:#fff; font-size:16px; font-weight:700;
    display:flex; align-items:center; justify-content:center; gap:8px; box-shadow:0 8px 20px hsl(var(--h) 60% 40% / .25); }
  .go.soft{ background:var(--fill); color:var(--ink); box-shadow:none; }
  .go:disabled{ opacity:.55; }
  .status{ font-size:13px; color:var(--muted); min-height:18px; margin-top:10px; text-align:center; line-height:1.45; }
  .status.err{ color:#ff453a; }
  .spin{ width:16px; height:16px; border-radius:50%; border:2.4px solid currentColor; border-right-color:transparent; animation:spin .8s linear infinite; flex-shrink:0; display:inline-block; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .empty{ text-align:center; padding:24px 18px 14px; }
  .empty .tile{ width:48px; height:48px; border-radius:14px; font-size:21px; margin:0 auto 10px; opacity:.9; }
  .empty b{ display:block; font-size:16px; font-weight:750; }
  .empty p{ font-size:13.5px; color:var(--muted); line-height:1.5; max-width:280px; margin:5px auto 0; }
  @media (prefers-reduced-motion:reduce){ .spin{ animation-duration:2.4s; } button:active{ transform:none; } }
  /* ---------- the full-screen stage ---------- */
  .stage{ display:none; position:fixed; inset:0; z-index:50; color:#fff; }
  .stage.on{ display:block; }
  .bg{ position:absolute; inset:0; transition:opacity .6s ease; }
  .bg.d{ background:radial-gradient(120% 90% at 20% 10%, hsl(var(--h) 64% 34%), transparent 60%),

  .bg.l{ opacity:0; background:radial-gradient(120% 90% at 20% 0%, hsl(var(--h) 85% 88%), transparent 60%),
      radial-gradient(120% 90% at 85% 100%, hsl(calc(var(--h) + 60) 80% 88%), transparent 62%), #f4f4f8; }
  .lite{ color:#15151a; } .lite .bg.l{ opacity:1; } .lite .bg.d{ opacity:0; }
  .col{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; overflow-y:auto; -webkit-overflow-scrolling:touch;
    padding:calc(10px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left)); }
  .top{ width:100%; max-width:560px; height:44px; display:flex; align-items:center; justify-content:space-between; gap:8px; flex-shrink:0; }
  .glass{ border:1px solid rgba(255,255,255,.16); background:rgba(255,255,255,.12); color:inherit;
    -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px); }
  .lite .glass{ border-color:rgba(0,0,0,.09); background:rgba(255,255,255,.62); }
  .rnd{ width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0; }
  .pill{ min-width:44px; height:44px; border-radius:99px; padding:0 15px; display:flex; align-items:center; justify-content:center; gap:5px;
    font-size:17px; font-weight:800; font-variant-numeric:tabular-nums; }
  .pill small{ font-size:10.5px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; opacity:.7; }
  .pill.hide{ visibility:hidden; }
  .dots{ display:flex; gap:6px; align-items:center; flex-wrap:wrap; justify-content:center; }
  .dots i{ width:8px; height:8px; border-radius:50%; background:currentColor; opacity:.22; transition:all .3s; }
  .dots i.now{ opacity:1; transform:scale(1.35); } .dots i.ok{ opacity:1; background:#34c759; } .dots i.no{ opacity:1; background:#ff6259; }
  .body{ flex:1 0 auto; width:100%; max-width:560px; display:flex; flex-direction:column; gap:12px; padding:12px 0 4px;
    transition:opacity .3s, filter .3s; }
  /* centred when there's room, top-aligned when there isn't: two growing spacers
     instead of justify-content:center, which pushes tall content up under the bar */
  .body::before, .body::after{ content:""; flex:1 1 0; }
  .veil .body{ opacity:.3; filter:blur(7px); pointer-events:none; }
  .kick{ font-size:11px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; opacity:.62; }
  .pri{ width:100%; height:54px; border:none; border-radius:99px; font-size:16.5px; font-weight:750; background:#fff; color:#0b0b10;

  .center{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); border-radius:26px; padding:24px 20px 18px; text-align:center;

  .center h2{ font-size:24px; font-weight:800; letter-spacing:-.015em; margin-top:6px; }

  .center .pri{ margin-top:18px; } .center .sec2{ margin-top:10px; }
  .stars3{ display:flex; justify-content:center; gap:6px; margin-top:10px; font-size:30px; }
  .stars3 svg{ width:1em; height:1em; fill:currentColor; opacity:.22; } .stars3 svg.on{ opacity:1; color:#ffd60a; }
  @media (prefers-reduced-motion:reduce){ .center{ animation:none; } .dots i{ transition:none; } }

  .lvl{ width:100%; display:flex; align-items:center; gap:13px; padding:10px 0; border:none; background:none; border-bottom:1px solid var(--line); text-align:left; }
  .lvl:first-child{ padding-top:2px; } .lvl:last-child{ border-bottom:none; padding-bottom:2px; }
  .lvl:active{ transform:none; opacity:.7; }

  .lvl .t{ flex:1; min-width:0; } .lvl .t b{ display:block; font-size:16px; font-weight:700; } .lvl .t small{ display:block; font-size:13px; color:var(--muted); margin-top:1px; }
  .lvl .bst{ flex-shrink:0; display:flex; align-items:center; gap:4px; font-size:12.5px; font-weight:750; color:#b07d00; background:rgba(255,204,0,.16); border-radius:99px; padding:4px 9px; font-variant-numeric:tabular-nums; }
  @media (prefers-color-scheme:dark){ .lvl .bst{ color:#ffd60a; } }
  .lvl .bst svg{ font-size:12px; }

  .back{ display:inline-flex; align-items:center; gap:4px; min-height:40px; border:none; background:none; color:hsl(var(--h) 62% 50%); font-size:15px; font-weight:700; padding:0 6px 0 0; margin:0 0 6px -4px; }
  @media (prefers-color-scheme:dark){ .back{ color:hsl(var(--h) 80% 74%); } }
  .erow{ display:flex; gap:8px; }
  .erow input{ flex:1; -webkit-user-select:text; user-select:text; }
  .erow button{ flex-shrink:0; border:none; border-radius:12px; padding:0 16px; background:hsl(var(--h) 62% 52%); color:#fff; font-weight:700; display:flex; align-items:center; gap:6px; }
  .chips{ display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }

  .chip button{ width:36px; height:36px; border:none; background:none; color:var(--muted); font-size:12px; display:flex; align-items:center; justify-content:center; }
  .note0{ font-size:13.5px; color:var(--muted); }

  .card2{ border-radius:26px; padding:22px 18px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:14px; }
  .bigword{ font-size:clamp(38px, 12vw, 56px); font-weight:800; letter-spacing:.06em; line-height:1.15; overflow-wrap:anywhere; }
  .hear{ min-height:44px; border-radius:99px; padding:0 18px; font-size:15px; font-weight:700; display:inline-flex; align-items:center; gap:8px; }
  .hear.on svg{ animation:pulse 1s ease-in-out infinite; } @keyframes pulse{ 50%{ opacity:.4; } }
  .inp{ width:100%; font-size:30px; font-weight:750; text-align:center; letter-spacing:.08em; padding:14px; border-radius:18px;
    border:2px solid rgba(255,255,255,.28); background:rgba(255,255,255,.1); color:inherit; -webkit-user-select:text; user-select:text; }
  .lite .inp{ border-color:rgba(20,20,40,.14); background:rgba(255,255,255,.75); }
  .inp::placeholder{ color:currentColor; opacity:.4; font-weight:600; letter-spacing:.02em; font-size:20px; }
  .inp:focus{ outline:none; border-color:hsl(var(--h) 80% 70%); }
  .feedback{ font-size:clamp(34px, 11vw, 50px); font-weight:800; letter-spacing:.08em; overflow-wrap:anywhere; }
  .feedback .g{ color:#4be07d; } .feedback .r{ color:#ff8a82; text-decoration:underline; text-underline-offset:6px; }
  .lite .feedback .g{ color:#1c9a4a; } .lite .feedback .r{ color:#d92d20; }
  .note{ font-size:15px; line-height:1.45; opacity:.85; min-height:20px; }
  .note b{ font-weight:800; }
  .row{ display:flex; gap:10px; width:100%; } .row > *{ flex:1; }
  .ctl{ width:100%; max-width:560px; flex-shrink:0; display:flex; flex-direction:column; gap:10px; padding-top:8px; }
  .vnote{ display:flex; gap:10px; align-items:flex-start; text-align:left; font-size:13.5px; line-height:1.45; border-radius:16px; padding:11px 13px; }
  .vnote svg{ color:#ffb340; margin-top:1px; }
  .shake{ animation:shake .45s ease; }
  @keyframes shake{ 20%{ transform:translateX(-6px); } 40%{ transform:translateX(5px); } 60%{ transform:translateX(-3px); } 80%{ transform:translateX(2px); } }
  @media (max-height:520px){ .card2{ padding:14px 16px; gap:10px; } .inp{ font-size:24px; padding:10px; } }
  @media (prefers-reduced-motion:reduce){ .shake, .hear.on svg{ animation:none; } }
</style></head><body>

<div class="home" id="home">
  <div class="head">
    <div class="tile"><svg class="i"><use href="#i-abc"/></svg></div>
    <div class="ht"><h1>Spelling Stars</h1><p>Look, cover, write, check</p></div>
  </div>
  <p style="font-size:13.5px;color:var(--muted);margin:-4px 2px 12px">Look at the word, cover it, write it, then check. Build your spelling, one star at a time.</p>
  <div class="card" id="levels"></div>
</div>

<div class="home" id="editor" hidden>
  <button class="back" type="button" id="back"><svg class="i"><use href="#i-chevl"/></svg>Levels</button>
  <div class="head">
    <div class="tile"><svg class="i"><use href="#i-pen"/></svg></div>
    <div class="ht"><h1>My Words</h1><p>Add this week’s spelling words</p></div>
  </div>
  <div class="card">
    <div class="erow"><input id="newword" placeholder="type a word" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done"><button type="button" id="addw"><svg class="i"><use href="#i-plus"/></svg>Add</button></div>
    <div class="chips" id="chips"></div>
    <button class="go" type="button" id="practise"><svg class="i"><use href="#i-play"/></svg>Practise these</button>
  </div>
</div>

  <div class="col" id="col">
    <div class="top">
      <button class="glass rnd" id="bClose" type="button" aria-label="Pause"><svg class="i"><use href="#i-close"/></svg></button>
      <div class="dots" id="dots"></div>
      <div class="glass pill hide" id="streak"></div>
    </div>
    <div class="body" id="mid"></div>
    <div class="ctl" id="controls"></div>
    <div class="center glass" id="card" hidden></div>
  </div>
</div>

<script>
function el(i){return document.getElementById(i)}
/* Bridges are looked up when used, never kept: MyLLM can add them after this
   script has run. */
function store(){return window.myllmStorage||{getItem:function(){return Promise.resolve(null)},setItem:function(){return Promise.resolve()}}}
function haptic(k){if(window.myllmHaptic)try{myllmHaptic(k)}catch(e){}}
function icon(n){return '<svg class="i"><use href="#i-'+n+'"/></svg>'}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
/* The quiz takes the whole display. Where MyLLM can't hide its own title
   bar, a dark stage under a white bar looks cut in half — so in light mode,
   without myllmImmersive, the stage stays light. */
var stageOn=false;
function isLight(){return !(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)}
function syncLook(){el('stage').classList.toggle('lite',isLight()&&!window.myllmImmersive)}
function syncChrome(){
  if(!window.myllmImmersive)return;
  try{myllmImmersive(stageOn,{keepAwake:false}).catch(function(){})}catch(_){}
}
function openStage(){if(stageOn)return;stageOn=true;syncLook();el('stage').classList.add('on');document.body.classList.add('lock');syncChrome()}
function closeStage(){if(!stageOn)return;stageOn=false;el('stage').classList.remove('on','veil');document.body.classList.remove('lock');syncChrome()}
if(window.matchMedia){var mq=matchMedia('(prefers-color-scheme: dark)');if(mq.addEventListener)mq.addEventListener('change',syncLook);else if(mq.addListener)mq.addListener(syncLook)}
var LEVELS=[
 {ic:'sprout',t:'Beginner',d:'First words & sight words',
  w:['cat','dog','sun','run','big','red','box','you','and','the','was','for','play','jump','like','went','said','they','here','help','look','some','come','make','that','this']},
 {ic:'book',t:'Year 3–4',d:'Everyday words',
  w:['because','friend','before','animal','school','family','people','water','money','morning','should','enough','answer','length','popular','remember','perhaps','special','thought','through','various','straight']},
 {ic:'bookopen',t:'Year 5–6',d:'Trickier spellings',
  w:['separate','believe','special','different','important','question','sentence','favourite','beautiful','knowledge','necessary','probably','occasion','sincerely','definite','immediately','experience','available','community','accidentally']},
 {ic:'cap',t:'Middle School',d:'Challenge words',
  w:['necessary','definitely','embarrass','rhythm','conscience','accommodate','occurrence','parliament','vocabulary','achievement','environment','recommend','privilege','perseverance','exaggerate','questionnaire','maintenance','noticeable','restaurant','government']},
 {ic:'pen',t:'My Words',d:'Add your own spelling list',custom:true,w:[]}
];
var best={},myWords=[];
var lvl=0,words=[],idx=0,correct=0,streak=0,phase='look',target='',results=[],paused=false;

/* ---------- speech ----------
   The web view's own speechSynthesis (MyLLM has no speak bridge). Same
   approach as Language Lab: pick an English voice explicitly, only cancel
   when something is actually speaking (cancel-then-speak in the same tick can
   swallow the new word), and say plainly when no voice played. */
function canSpeak(){return !!(window.speechSynthesis&&window.SpeechSynthesisUtterance)}
var voiceCache={},speakToken=0,speakBtn=null;
if(canSpeak())try{speechSynthesis.onvoiceschanged=function(){voiceCache={}}}catch(e){}
/* The word lists use British spellings; an English-speaking phone keeps its own accent. */
function langCode(){var l=String(navigator.language||'');return /^en/i.test(l)?l:'en-GB'}
function pickVoice(code){
  if(voiceCache[code]!==undefined)return voiceCache[code];
  var all=[];try{all=speechSynthesis.getVoices()||[]}catch(e){}
  function norm(v){return String(v.lang||'').replace('_','-').toLowerCase()}
  var want=code.toLowerCase(),base=want.slice(0,2);
  var inLang=all.filter(function(v){return norm(v).slice(0,2)===base});
  var better=function(list){return list.filter(function(v){return /enhanced|premium/i.test(v.name)})[0]||list[0]};
  var exact=inLang.filter(function(v){return norm(v)===want});
  voiceCache[code]=better(exact)||better(inLang)||null;
  return voiceCache[code];
}
function markSpeaking(btn,on){
  if(speakBtn&&speakBtn!==btn)speakBtn.classList.remove('on');
  if(btn)btn.classList.toggle('on',on);
  speakBtn=on?btn:null;
}
function noVoice(){
  var n=el('vnote');if(!n)return;
  n.hidden=false;
}
function speak(text,btn){
  if(!canSpeak()||!text)return;
  var ss=window.speechSynthesis,token=++speakToken,started=false;
  var u=new SpeechSynthesisUtterance(text),code=langCode();
  u.lang=code;var v=pickVoice(code);if(v)u.voice=v;
  u.rate=.85;u.volume=1;
  u.onstart=function(){started=true;if(token===speakToken){markSpeaking(btn,true);var n=el('vnote');if(n)n.hidden=true}};
  u.onend=function(){if(token===speakToken)markSpeaking(btn,false)};
  u.onerror=function(e){
    if(token!==speakToken)return;
    markSpeaking(btn,false);
    var why=e&&e.error;
    if(!started&&why!=='interrupted'&&why!=='canceled')noVoice();
  };
  function go(){try{if(ss.paused)ss.resume();ss.speak(u)}catch(e){noVoice()}}
  try{
    if(ss.speaking||ss.pending){ss.cancel();setTimeout(go,80)}
    else go();                                   /* first word stays inside the tap, which iOS requires */
  }catch(e){noVoice();return}
  setTimeout(function(){
    if(token===speakToken&&!started&&!ss.speaking){markSpeaking(btn,false);noVoice()}
  },2500);
}
function stopSpeaking(){speakToken++;markSpeaking(null,false);if(canSpeak())try{speechSynthesis.cancel()}catch(e){}}

/* ---------- home ---------- */
function renderHome(){
  var L=el('levels');L.innerHTML='';
  LEVELS.forEach(function(lv,i){
    var b=document.createElement('button');b.type='button';b.className='lvl';
    var bs=best['s'+i]?('<span class="bst">'+icon('star')+best['s'+i]+'</span>'):'';
    var count=lv.custom?(myWords.length+' words'):(lv.w.length+' words');
    b.innerHTML='<div class="tile">'+icon(lv.ic)+'</div><div class="t"><b>'+esc(lv.t)+'</b><small>'+esc(lv.d)+' · '+count+'</small></div>'+bs;
    b.onclick=function(){lv.custom?openEditor():startSet(i)};
    L.appendChild(b);
  });
}
function showHome(){el('editor').hidden=true;el('home').hidden=false;renderHome()}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}

/* ---------- a round ---------- */
function showCard(html){var c=el('card');c.innerHTML=html;c.hidden=false;el('stage').classList.add('veil')}
function hideCard(){el('card').hidden=true;el('stage').classList.remove('veil')}
function startSet(i){
  lvl=i;var pool=LEVELS[i].custom?myWords:LEVELS[i].w;
  if(!pool.length)return;
  words=shuffle(pool).slice(0,Math.min(10,pool.length));
  idx=0;correct=0;streak=0;results=[];paused=false;
  hideCard();openStage();haptic('light');loadWord();
}
function renderTop(){
  el('dots').innerHTML=words.map(function(_,i){return '<i class="'+(i<results.length?(results[i]?'ok':'no'):i===idx?'now':'')+'"></i>'}).join('');
  var s=el('streak');s.classList.toggle('hide',streak<2);s.innerHTML=icon('flame')+streak;
}
var VNOTE='<div class="vnote glass" id="vnote" hidden><svg class="i"><use href="#i-warn"/></svg><span>Couldn’t play the word out loud. Check the volume, or add a voice in iPhone Settings → Accessibility → Spoken Content → Voices.</span></div>';
function hearBtn(label){return canSpeak()?'<button class="hear glass" type="button" id="hear">'+icon('speaker')+'<span>'+label+'</span></button>':''}
function wireHear(){if(canSpeak())el('hear').onclick=function(){speak(target,el('hear'))}}
function loadWord(){
  target=words[idx];phase='look';
  renderTop();
  el('mid').innerHTML='<div class="card2 glass"><div class="kick">Look</div><div class="bigword">'+esc(target)+'</div>'+hearBtn('Hear it')+'</div>'+VNOTE;
  wireHear();
  el('controls').innerHTML='<button class="pri" type="button" id="cover">'+icon('pen')+'Cover &amp; spell</button>';
  el('cover').onclick=writePhase;
  speak(target,canSpeak()?el('hear'):null);
}
function writePhase(){
  phase='write';
  el('mid').innerHTML='<div class="card2 glass"><div class="kick">Write</div>'+hearBtn('Hear it again')+
    '<input class="inp" id="answer" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="type the word" enterkeyhint="done"></div>'+VNOTE;
  wireHear();
  el('controls').innerHTML='<button class="pri" type="button" id="check">'+icon('check')+'Check</button>';
  el('check').onclick=check;
  var inp=el('answer');inp.addEventListener('keydown',function(e){if(e.key==='Enter')check()});
  setTimeout(function(){inp.focus()},80);
}
function check(){
  var typed=(el('answer').value||'').trim();
  if(!typed){el('answer').focus();return}
  var ok=typed.toLowerCase()===target.toLowerCase();
  // letter-by-letter feedback against the correct word
  var fb='';for(var i=0;i<target.length;i++){var c=esc(target[i]);var good=typed[i]&&typed[i].toLowerCase()===target[i].toLowerCase();fb+='<span class="'+(good?'g':'r')+'">'+c+'</span>'}
  phase='check';
  if(ok){correct++;streak++;haptic('success')}else{streak=0;haptic('error')}
  results[idx]=ok;renderTop();
  el('mid').innerHTML='<div class="card2 glass'+(ok?'':' shake')+'"><div class="kick">'+(ok?'Perfect':'Check')+'</div><div class="feedback">'+fb+'</div>'+
    '<div class="note">'+(ok?'Well spelt!':'You wrote “<b>'+esc(typed)+'</b>”. The correct spelling is above.')+'</div></div>';
  if(ok){el('controls').innerHTML='<button class="pri" type="button" id="next">Next word</button>';el('next').onclick=advance;}
  else{el('controls').innerHTML='<div class="row"><button class="sec2 glass" type="button" id="retry">'+icon('again')+'Try again</button><button class="pri" type="button" id="next">Next word</button></div>';
    el('retry').onclick=function(){results.length=idx;renderTop();writePhase()};el('next').onclick=advance;}
}
function advance(){idx++;if(idx>=words.length)finish();else loadWord()}
function finish(){
  stopSpeaking();
  var pct=words.length?correct/words.length:0;
  var n=pct>=1?3:pct>=0.7?2:pct>=0.4?1:0;
  var key='s'+lvl,isBest=!best[key]||correct>best[key];
  if(isBest&&words.length){best[key]=correct;store().setItem('ss_best',JSON.stringify(best))}
  haptic(pct>=0.7?'success':'warning');
  var stars='';for(var i=0;i<3;i++)stars+='<svg class="'+(i<n?'on':'')+'"><use href="#i-star"/></svg>';
  el('mid').innerHTML='';el('controls').innerHTML='';
  showCard('<div class="kick">'+esc(LEVELS[lvl].t)+' spelt</div><div class="stars3">'+stars+'</div><div class="big">'+correct+'<small>/'+words.length+'</small></div>'+
    (isBest&&words.length?'<div class="best">New best</div>':'')+
    '<button class="pri" type="button" id="cA">'+icon('again')+'Practise again</button><button class="sec2 glass" type="button" id="cB">Back to levels</button>');
  el('cA').onclick=function(){startSet(lvl)};
  el('cB').onclick=goHome;
}
function pause(){
  if(!stageOn||!el('card').hidden)return;
  paused=true;stopSpeaking();
  showCard('<div class="kick">Paused</div><h2>'+esc(LEVELS[lvl].t)+'</h2><p>Word '+(idx+1)+' of '+words.length+' · '+correct+' right so far</p>'+
    '<button class="pri" type="button" id="cA">'+icon('play')+'Keep going</button><button class="sec2 glass" type="button" id="cB">Stop practising</button>');
  el('cA').onclick=function(){paused=false;hideCard();haptic('light')};
  el('cB').onclick=goHome;
}
function goHome(){paused=false;stopSpeaking();hideCard();closeStage();showHome();haptic('light')}

// ---- custom word editor ----
function openEditor(){el('home').hidden=true;el('editor').hidden=false;renderChips();window.scrollTo(0,0)}
function addWord(){var v=(el('newword').value||'').trim();if(!v)return;if(myWords.indexOf(v)<0){myWords.push(v);persistWords()}el('newword').value='';el('newword').focus();renderChips();haptic('light')}
function removeWord(w){myWords=myWords.filter(function(x){return x!==w});persistWords();renderChips()}
function renderChips(){
  var C=el('chips');
  C.innerHTML=myWords.length?myWords.map(function(w){return '<span class="chip">'+esc(w)+'<button type="button" aria-label="Remove '+esc(w)+'" data-w="'+esc(w)+'">'+icon('x')+'</button></span>'}).join(''):'<div class="note0">No words yet — add some above.</div>';
  Array.prototype.forEach.call(C.querySelectorAll('button'),function(b){b.onclick=function(){removeWord(b.getAttribute('data-w'))}});
  el('practise').disabled=!myWords.length;
}
function persistWords(){store().setItem('ss_mywords',JSON.stringify(myWords))}

el('addw').onclick=addWord;
el('newword').addEventListener('keydown',function(e){if(e.key==='Enter')addWord()});
el('practise').onclick=function(){if(myWords.length){lvl=4;startSet(4)}};
el('back').onclick=showHome;
el('bClose').onclick=function(){haptic('light');pause()};
document.addEventListener('visibilitychange',function(){
  if(document.hidden){pause();return}
  if(stageOn)syncChrome();          /* MyLLM puts its bars back when the app is left */
});

renderHome();
Promise.all([store().getItem('ss_best'),store().getItem('ss_mywords')]).then(function(r){
  if(r[0]){try{best=JSON.parse(r[0])||{}}catch(e){}}
  if(r[1]){try{myWords=JSON.parse(r[1])||[]}catch(e){}}
  renderHome();
});
</script></body></html>
