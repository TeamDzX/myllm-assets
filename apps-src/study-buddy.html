  .hero{ border-radius:20px; padding:16px 18px; color:#fff; margin-bottom:12px; display:flex; align-items:center; gap:16px;
    background:linear-gradient(145deg, hsl(var(--h) 62% 46%), hsl(calc(var(--h) + 40) 58% 24%)); box-shadow:0 10px 28px hsl(var(--h) 60% 30% / .25); }

  .hero b{ display:block; font-size:17px; font-weight:750; line-height:1.25; overflow-wrap:anywhere; }

  .empty b{ display:block; font-size:16px; font-weight:750; }
  .empty p{ font-size:13.5px; color:var(--muted); line-height:1.5; max-width:280px; margin:5px auto 0; }
  @media (prefers-reduced-motion:reduce){ .spin{ animation-duration:2.4s; } button:active{ transform:none; } }
  @keyframes myllmAiSpin{to{transform:rotate(360deg)}}
  .myllm-ai-busy{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(18px);z-index:99999;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;display:flex;align-items:center;gap:10px;background:rgba(28,28,30,.96);color:#fff;border-radius:999px;padding:10px 16px 10px 14px;box-shadow:0 6px 22px rgba(0,0,0,.4);font-size:14px;font-weight:600;max-width:92%}

  /* ---------- the full-screen stage ---------- */

  .bg.l{ opacity:0; background:radial-gradient(120% 90% at 20% 0%, hsl(var(--h) 85% 88%), transparent 60%),

  .lite{ color:#15151a; } .lite .bg.l{ opacity:1; } .lite .bg.d{ opacity:0; }
  .col{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; overflow-y:auto; -webkit-overflow-scrolling:touch;
    padding:calc(10px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left)); }
  .top{ width:100%; max-width:560px; height:44px; display:flex; align-items:center; justify-content:space-between; gap:8px; flex-shrink:0; }

    transition:opacity .3s, filter .3s; }
  /* centred when there's room, top-aligned when there isn't: two growing spacers

  .body::before, .body::after{ content:""; flex:1 1 0; }
  .veil .body{ opacity:.3; filter:blur(7px); pointer-events:none; }
  .kick{ font-size:11px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; opacity:.62; }
  .pri{ width:100%; height:54px; border:none; border-radius:99px; font-size:16.5px; font-weight:750; background:#fff; color:#0b0b10;

  .sec2{ width:100%; height:50px; border-radius:99px; font-size:15.5px; font-weight:750; display:flex; align-items:center; justify-content:center; gap:8px; flex-shrink:0; }
  .center{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); border-radius:26px; padding:24px 20px 18px; text-align:center;
    width:min(340px, calc(100% - 32px)); max-height:calc(100% - 40px); overflow-y:auto; z-index:5;

  .center h2{ font-size:24px; font-weight:800; letter-spacing:-.015em; margin-top:6px; }

  .center .pri{ margin-top:18px; } .center .sec2{ margin-top:10px; }

  @media (prefers-reduced-motion:reduce){ .center{ animation:none; } .dots i{ transition:none; } }

  textarea{ min-height:170px; line-height:1.5; resize:vertical; -webkit-user-select:text; user-select:text; }
  .hero .n small{ font-size:.45em; opacity:.7; font-weight:750; margin-left:1px; }
  .qcard{ border-radius:24px; padding:20px 18px; }
  .qcard h2{ font-size:20px; font-weight:750; line-height:1.32; margin-top:8px; letter-spacing:-.005em; overflow-wrap:anywhere; }
  .opts{ display:flex; flex-direction:column; gap:9px; }
  .opt{ width:100%; min-height:58px; border-radius:18px; padding:10px 14px; display:flex; align-items:center; gap:12px; text-align:left; font-size:16px; font-weight:650; line-height:1.3;
    transition:background .25s, border-color .25s, opacity .25s; }

  .opt .t{ flex:1; min-width:0; overflow-wrap:anywhere; }

  .opt:disabled{ opacity:.5; } .opt:disabled:active{ transform:none; }
  .opt.correct, .lite .opt.correct{ background:#2fb350; border-color:#2fb350; color:#fff; opacity:1; }
  .opt.wrong, .lite .opt.wrong{ background:#e5453b; border-color:#e5453b; color:#fff; opacity:1; }
  .opt.correct .mk, .opt.wrong .mk{ display:flex; }
  .opt.correct .k, .opt.wrong .k{ background:rgba(255,255,255,.25); }
  .why{ display:none; border-radius:18px; padding:12px 14px; font-size:14px; line-height:1.45; gap:10px; align-items:flex-start; }
  .why.on{ display:flex; animation:rise .4s ease both; } .why svg{ font-size:15px; margin-top:2px; opacity:.8; }
  @keyframes rise{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:none; } }
  #nextBtn{ visibility:hidden; } #nextBtn.on{ visibility:visible; }
  .review{ text-align:left; margin-top:14px; border-radius:16px; padding:4px 12px; background:rgba(255,255,255,.08); }
  .lite .review{ background:rgba(20,20,40,.05); }
  .review .h{ font-size:10.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; opacity:.6; margin:10px 0 2px; }
  .review .rv{ padding:9px 0; border-top:1px solid rgba(255,255,255,.12); font-size:13.5px; line-height:1.4; }
  .lite .review .rv{ border-top-color:rgba(0,0,0,.08); }
  .review .rv:first-of-type{ border-top:none; }
  .review .rv b{ display:block; font-weight:700; }
  .review .rv small{ display:flex; gap:5px; align-items:flex-start; margin-top:3px; opacity:.78; font-size:13px; }
  .review .rv small svg{ color:#34c759; margin-top:1px; font-size:12px; }
  .center .ring{ width:44px; height:44px; margin:4px auto 0; border-radius:50%; border:3px solid currentColor; border-right-color:transparent; animation:spin .9s linear infinite; opacity:.8; }
  .center .tile2{ width:52px; height:52px; border-radius:16px; margin:0 auto; display:flex; align-items:center; justify-content:center; font-size:24px; color:#fff;
    background:linear-gradient(145deg, hsl(var(--h) 62% 55%), hsl(calc(var(--h) + 40) 58% 32%)); }
  @media (max-height:520px){ .qcard{ padding:14px 16px; } .qcard h2{ font-size:17px; } .opt{ min-height:46px; } .body{ gap:8px; } }
  @media (prefers-reduced-motion:reduce){ .why.on{ animation:none; } .center .ring{ animation-duration:2.4s; } }

/* myllm-fullscreen-v2 — MyLLM 5.6.2+ opens this app full screen; the ✕ is the way out. */
.head .imm-acts{display:none;flex-shrink:0;margin-left:auto}

</style>

<div class="home">
  <div class="imm-safe"></div><div class="head">
    <div class="tile"><svg class="i"><use href="#i-cap"/></svg></div>
    <div class="ht"><h1>Study Buddy</h1><p>Paste your notes, get quizzed</p></div>
  <div class="imm-acts"><button type="button" aria-label="Close Study Buddy" onclick="myllmFSClose()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div></div>

  <div class="hero" id="hero" hidden>

  </div>

  <div class="card">

    <textarea id="notes" placeholder="Paste your revision notes, a textbook passage, vocabulary…&#10;&#10;Or simply type a topic: 'GCSE photosynthesis', 'French passé composé', 'the French Revolution'"></textarea>

</div>

</div>

<script>
function el(i){return document.getElementById(i)}
/* Bridges are looked up when used, never kept: MyLLM can add them after this
   script has run. */
function store(){return window.myllmStorage||{getItem:function(){return Promise.resolve(null)},setItem:function(){return Promise.resolve()}}}
function haptic(k){if(window.myllmHaptic)try{myllmHaptic(k)}catch(e){}}
function icon(n){return '<svg class="i"><use href="#i-'+n+'"/></svg>'}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
/* The quiz takes the whole display. Where MyLLM can't hide its own title
   bar, a dark stage under a white bar looks cut in half — so in light mode,
   without myllmImmersive, the stage stays light. */
var stageOn=false;
function isLight(){return !(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)}
function syncLook(){el('stage').classList.toggle('lite',isLight()&&!window.myllmImmersive)}
function syncChrome(){
  if(!window.myllmImmersive)return;
  try{myllmImmersive((window.myllmClose ? true : (stageOn)), {keepAwake:false}).catch(function(){})}catch(_){}
}
function openStage(){if(stageOn)return;stageOn=true;syncLook();el('stage').classList.add('on');document.body.classList.add('lock');syncChrome()}
function closeStage(){if(!stageOn)return;stageOn=false;el('stage').classList.remove('on','veil');document.body.classList.remove('lock');syncChrome()}
if(window.matchMedia){var mq=matchMedia('(prefers-color-scheme: dark)');if(mq.addEventListener)mq.addEventListener('change',syncLook);else if(mq.addListener)mq.addListener(syncLook)}
function ASK(){return window.myllmAsk||null}

var quiz = [];        /* [{q, options[4], correct, why}] */
var qi = 0, score = 0, answered = false, busy = false;
var wrong = [];       /* review list */
var results = [];     /* true/false per question, for the dots */
var lifetime = {asked:0, right:0};
var askedBefore = []; /* question texts from this session, to avoid repeats on "again" */

function renderStats(){
  var has = lifetime.asked > 0;
  el("hero").hidden = !has;
  if (has){
    el("hPct").innerHTML = Math.round(lifetime.right / lifetime.asked * 100) + "<small>%</small>";
    el("hT").textContent = lifetime.right + " of " + lifetime.asked + " answered right";
  }
}
function quizBtn(on){
  var b = el("quizBtn"); b.disabled = !!on;
  b.innerHTML = on ? '<i class="spin"></i><span>Writing your questions…</span>' : icon("spark") + "<span>Quiz me</span>";
}
function hint(t, err){ var h = el("setuphint"); h.textContent = t; h.classList.toggle("err", !!err); }

/* ---------- generate ---------- */
/* Labelled lines, not JSON — small models (Apple Intelligence) echo JSON
   templates back verbatim. Echoed instructions are rejected and retried. */
var ECHO = /the question text|one answer choice|repeat this line|labelled line|number \(1-4\)|of the correct choice|one-sentence explanation|each of the four/i;

function parseQuizJSON(s){ /* legacy fallback: big cloud models may still answer in the old JSON shape */
  var a = s.indexOf("["), b = s.lastIndexOf("]");
  if (a < 0 || b <= a) return null;
  var arr;
  try{ arr = JSON.parse(s.slice(a, b + 1)); }catch(e){ return null; }
  if (!Array.isArray(arr)) return null;
  var clean = arr.filter(function(x){
    return x && typeof x.q === "string" && Array.isArray(x.options) && x.options.length === 4 &&
           typeof x.correct === "number" && x.correct >= 0 && x.correct <= 3;
  }).map(function(x){
    return {q:x.q, options:x.options.map(String), correct:x.correct, why:String(x.why || "")};
  });
  return clean.length >= 3 ? clean.slice(0, 5) : null;
}

function resolveAnswer(ans, options){
  var s = String(ans || "").trim();
  var m = s.match(/[1-4]/);
  if (m) return parseInt(m[0], 10) - 1;
  m = s.match(/^[A-D]\b/i);
  if (m) return "ABCD".indexOf(m[0].toUpperCase());
  for (var i = 0; i < options.length; i++)
    if (options[i].toLowerCase() === s.toLowerCase()) return i;
  return -1;
}

function parseQuizReply(reply){
  var s = String(reply || "");
  var qs = [], cur = null, lastKey = "";
  s.split(/\r?\n/).forEach(function(raw){
    var ln = raw.replace(/\*\*/g, "").trim();
    var m = ln.match(/^[-*#>\s]*(QUESTION|Q|OPTIONS?|ANSWERS?|WHY)\s*\d*\s*[::]\s*(.*)$/i);
    if (!m){
      if (cur && lastKey === "WHY" && ln) cur.why += " " + ln; /* prose may wrap onto the next line */
      return;
    }
    var k = m[1].toUpperCase().replace(/S$/, ""), v = m[2].trim();
    if (k === "QUESTION") k = "Q";
    lastKey = k;
    if (k === "Q"){ cur = {q:v, options:[], correct:-1, why:"", _ans:""}; qs.push(cur); return; }
    if (!cur) return;
    if (k === "OPTION"){ v.split("|").forEach(function(o){ o = o.trim(); if (o) cur.options.push(o); }); }
    else if (k === "ANSWER"){ cur._ans = v; }
    else if (k === "WHY"){ cur.why = v; }
  });
  if (!qs.length){
    var legacy = parseQuizJSON(s); /* no labelled lines at all — try the old JSON shape */
    if (legacy) return legacy;
    throw new Error("no questions found");
  }
  var clean = qs.map(function(x){
    x.options = x.options.filter(function(o){ return o && !ECHO.test(o); }).slice(0, 4);
    x.correct = resolveAnswer(x._ans, x.options);
    delete x._ans;
    x.why = ECHO.test(x.why) ? "" : x.why.trim();
    return x;
  }).filter(function(x){
    return x.q && !ECHO.test(x.q) && x.options.length === 4 && x.correct >= 0 && x.correct <= 3;
  });
  if (clean.length < 3) throw new Error("quiz didn't parse");
  return clean.slice(0, 5);
}

function showCard(html){ var c = el("card"); c.innerHTML = html; c.hidden = false; el("stage").classList.add("veil"); }
function hideCard(){ el("card").hidden = true; el("stage").classList.remove("veil"); }

function startQuiz(){
  if (busy) return;
  var notes = el("notes").value.trim();
  if (!notes){
    if (stageOn){ leave(); }
    hint("Paste some notes or a topic first.", true); haptic("light"); return;
  }
  var ask = ASK();
  if (!ask){ hint("Study Buddy needs AI — enable it in Settings, then come back.", true); haptic("light"); return; }
  haptic("light");
  store().setItem("sb_notes", notes);
  busy = true;
  quizBtn(true);
  hint("Writing your questions…");
  if (stageOn) showCard('<div class="ring"></div><h2>Writing new questions</h2><p>From the same notes — usually a few seconds.</p>');
  var avoid = askedBefore.length ? "\nDo NOT reuse these questions: " + askedBefore.slice(-10).map(function(q){ return '"' + q + '"'; }).join(", ") : "";
  var prompt = "Create exactly 5 multiple-choice questions to test understanding of this material. Mix recall and understanding; make wrong options plausible.\n\nMATERIAL:\n" + notes.slice(0, 6000) + avoid +
      "\n\nReply with EXACTLY these labelled lines and nothing else, repeating the block for each of the 5 questions:\n" +
      "Q: the question text\n" +
      "OPTION: one answer choice — repeat this line for each of the four choices\n" +
      "ANSWER: the number (1-4) of the correct choice\n" +
      "WHY: a one-sentence explanation of the right answer\n" +
      "Vary which position is correct.";
  var sys = {system:"You are an excellent quiz writer. Output only the labelled lines — no commentary, no code fences."};
  ask(prompt, sys)
  .then(function(r){ return parseQuizReply(r); })
  .catch(function(){
    return ASK()(prompt + "\nIMPORTANT: fill each labelled line with real content — never repeat the instruction text.", sys)
      .then(function(r){ return parseQuizReply(r); });
  })
  .then(function(parsed){
    busy = false; quizBtn(false);
    quiz = parsed;
    quiz.forEach(function(x){ askedBefore.push(x.q); });
    qi = 0; score = 0; wrong = []; results = [];
    hint("");
    haptic("success");
    hideCard(); openStage();
    showQ();
  })
  .catch(function(){
    busy = false; quizBtn(false);
    var msg = "The questions didn't come through cleanly — that happens with smaller models. Tap Quiz me to try again.";
    hint(msg, true);
    if (stageOn){
      showCard('<div class="tile2">' + icon("again") + '</div><h2>No quiz this time</h2><p>' + esc(msg.replace("Tap Quiz me", "Try again")) + '</p>' +
        '<button class="pri" id="cA" type="button">' + icon("again") + 'Try again</button><button class="sec2 glass" id="cB" type="button">' + icon("pen") + 'Edit notes</button>');
      el("cA").onclick = startQuiz; el("cB").onclick = backToNotes;
    }
    haptic("light");
  });
}

/* ---------- play ---------- */
function renderDots(){
  el("dots").innerHTML = quiz.map(function(_, i){
    return '<i class="' + (i < results.length ? (results[i] ? "ok" : "no") : i === qi ? "now" : "") + '"></i>';
  }).join("");
}
function showQ(){
  var x = quiz[qi];
  answered = false;
  el("qnum").textContent = "Question " + (qi + 1) + " of " + quiz.length;
  el("pScore").innerHTML = score + "<small>right</small>";
  el("qtext").textContent = x.q;
  el("why").className = "why glass";
  el("nextBtn").className = "pri";
  el("nextBtn").innerHTML = qi === quiz.length - 1 ? "See my score" : "Next";
  el("opts").innerHTML = x.options.map(function(o, i){
    return '<button class="opt glass" type="button" id="opt' + i + '"><span class="k">' + "ABCD"[i] + '</span><span class="t">' + esc(o) + '</span><span class="mk"></span></button>';
  }).join("");
  x.options.forEach(function(_, i){ el("opt" + i).onclick = function(){ answer(i); }; });
  renderDots();
  el("col").scrollTop = 0;
}
function answer(i){
  if (answered) return;
  answered = true;
  var x = quiz[qi];
  lifetime.asked++;
  for (var k = 0; k < 4; k++){
    var btn = el("opt" + k);
    btn.disabled = true;
    if (k === x.correct){ btn.className = "opt glass correct"; btn.querySelector(".mk").innerHTML = icon("check"); }
    else if (k === i){ btn.className = "opt glass wrong"; btn.querySelector(".mk").innerHTML = icon("x"); }
  }
  if (i === x.correct){ score++; haptic("success"); }
  else { wrong.push(x); haptic("light"); }
  results.push(i === x.correct);
  lifetime.right += (i === x.correct) ? 1 : 0;
  store().setItem("sb_life", JSON.stringify(lifetime));
  if (x.why){
    el("whyText").textContent = x.why;
    el("why").className = "why glass on";
  }
  el("pScore").innerHTML = score + "<small>right</small>";
  el("nextBtn").className = "pri on";
  renderDots();
}
function nextQ(){
  haptic("selection");
  if (qi < quiz.length - 1){ qi++; showQ(); }
  else finish();
}

/* ---------- results ---------- */
function finish(){
  var pct = Math.round(score / quiz.length * 100);
  var head = pct === 100 ? "Perfect score" : pct >= 60 ? "Nicely done" : "Keep going";
  var sub = pct === 100 ? "Perfect — you own this material."
    : pct >= 60 ? "Solid. One more round and it sticks."
    : "That's what practice is for — review below, then go again.";
  var review = wrong.length
    ? '<div class="review"><div class="h">Worth another look</div>' + wrong.map(function(x){
        return '<div class="rv"><b>' + esc(x.q) + '</b><small>' + icon("check") + '<span>' + esc(x.options[x.correct]) +
          (x.why ? ' — ' + esc(x.why) : '') + '</span></small></div>';
      }).join("") + '</div>'
    : "";
  showCard('<div class="kick">' + head + '</div><div class="big">' + score + '<small>/' + quiz.length + '</small></div><p>' + sub + '</p>' + review +
    '<button class="pri" id="cA" type="button">' + icon("again") + 'Quiz me again</button><button class="sec2 glass" id="cB" type="button">' + icon("pen") + 'Edit notes</button>');
  el("cA").onclick = startQuiz; el("cB").onclick = backToNotes;
  renderStats();
  haptic(pct >= 60 ? "success" : "light");
}
function leave(){ hideCard(); closeStage(); }
function backToNotes(){
  haptic("selection");
  leave();
}

el("quizBtn").onclick = startQuiz;
el("nextBtn").onclick = nextQ;
el("bClose").onclick = function(){ if (busy) return; haptic("light"); leave(); };
document.addEventListener("visibilitychange", function(){ if (!document.hidden && stageOn) syncChrome(); });

/* ---------- boot ---------- */
quizBtn(false);
Promise.all([store().getItem("sb_notes"), store().getItem("sb_life")]).then(function(v){
  if (v[0]) el("notes").value = v[0];
  if (v[1]){ try{ lifetime = JSON.parse(v[1]) || lifetime; }catch(e){} }
  if (!ASK()) hint("Study Buddy needs AI — enable it in Settings to get quizzed.", true);
  renderStats();
});

/* myllm-fullscreen-v2 — full screen where MyLLM can also close the app for us
   (myllmClose, 5.6.2+): full screen hides MyLLM's Done, and a page with no way
   out is worse than a repeated title, so elsewhere nothing changes.
   The spacer keeps the header clear of the status bar / Dynamic Island. It is
   live CSS — env(safe-area-inset-top) — not a measured number: the inset is
   still 0 when the page loads and only grows once MyLLM's bar has gone (v1
   measured once, so the title sat under the island). If the page's own styles
   already pad the header down by the inset, the spacer stays at 0. */
(function(){
  function full(){ return !!(window.myllmClose && window.myllmImmersive); }
  /* Does any rule that applies to the header or an ancestor already use the top inset? */
  function pageHandlesInset(head){
    var chain = [], n, found = false;
    for (n = head; n && n.nodeType === 1; n = n.parentElement) chain.push(n);
    function walk(rules){
      for (var i = 0; i < rules.length && !found; i++){
        var r = rules[i];
        if (r.cssRules && !r.selectorText) { walk(r.cssRules); continue; }
        if (!r.selectorText || !/safe-area-inset-top/.test(r.cssText) || !/(padding|margin|top)\s*:/.test(r.cssText)) continue;
        if (/\.imm-safe/.test(r.selectorText)) continue;
        for (var k = 0; k < chain.length; k++){
          try { if (chain[k].matches(r.selectorText)) { found = true; break; } } catch(e){}
        }
      }
    }
    for (var s = 0; s < document.styleSheets.length && !found; s++){
      try { walk(document.styleSheets[s].cssRules); } catch(e){}
    }
    for (n = head; n && n.nodeType === 1 && !found; n = n.parentElement){
      if (/safe-area-inset-top/.test(n.getAttribute("style") || "")) found = true;
    }
    return found;
  }
  function fit(){
    var sp = document.querySelector(".imm-safe"), head = document.querySelector(".head");
    if (!sp || !head) return;
    sp.style.height = (document.body.classList.contains("imm") && !pageHandlesInset(head)) ? "env(safe-area-inset-top)" : "0px";
  }
  function sync(){
    var f = full();
    document.body.classList.toggle("imm", f);
    fit();
    if (!f) return;
    try { window.myllmImmersive(true, { keepAwake:false }).catch(function(){}); } catch(e){}
  }
  window.myllmFSClose = function(){
    try { if (window.myllmHaptic) window.myllmHaptic("light"); } catch(e){}
    try { window.myllmClose().catch(function(){}); } catch(e){}
  };
  document.addEventListener("visibilitychange", function(){ if (!document.hidden) sync(); });
  sync();
})();
</script>
</body>
</html>
