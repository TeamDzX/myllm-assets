<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>:root{color-scheme:light dark}
body{font-family:-apple-system,system-ui,sans-serif;margin:0;padding:20px;background:#f2f2f7;color:#111}
@media(prefers-color-scheme:dark){body{background:#000;color:#eee}.panel,.deck{background:#1c1c1e}input{background:#2c2c2e;color:#eee;border-color:#3a3a3c}.nav button{background:#2c2c2e;color:#eee}}
h1{font-size:22px;margin:0 0 14px}
.row{display:flex;gap:8px;margin-bottom:10px}
input{flex:1;padding:12px;border:1px solid #d1d1d6;border-radius:10px;font-size:16px;background:#fff}
button{border:0;background:#5e5ce6;color:#fff;border-radius:10px;padding:0 16px;font-size:15px;font-weight:600}
button:disabled{opacity:.5}
#status{font-size:13px;opacity:.65;min-height:18px;margin-bottom:10px}
.panel{background:#fff;border-radius:16px;padding:22px 18px;min-height:150px;display:none;flex-direction:column;justify-content:center;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.panel .side{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.5;margin-bottom:8px}
.panel .text{font-size:18px;line-height:1.45}
.panel .hint{font-size:12px;opacity:.4;margin-top:12px}
.nav{display:none;align-items:center;justify-content:space-between;margin-top:10px}
.nav button{background:#e5e5ea;color:#111;padding:9px 18px}
.nav b{font-size:14px;opacity:.7}
h2{font-size:15px;margin:20px 0 8px;opacity:.7}
.deck{background:#fff;border-radius:12px;padding:11px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.deck span{flex:1;font-size:15px}
.deck .n{opacity:.5;font-size:13px}
.deck .del{background:none;color:#ff453a;font-size:16px;padding:4px}
</style></head><body>
<h1>🧠 Flashcard Forge</h1>
<div class="row"><input id="topic" placeholder="Topic (e.g. The Tudors, photosynthesis)…"><button id="gen" onclick="gen()">Forge</button></div>
<div id="status"></div>
<div class="panel" id="card" onclick="flip()">
<div class="side" id="side"></div><div class="text" id="text"></div><div class="hint">tap to flip</div>
</div>
<div class="nav" id="nav"><button onclick="nav(-1)">‹ Prev</button><b id="count"></b><button onclick="nav(1)">Next ›</button></div>
<h2 id="decksHead" style="display:none">Saved decks</h2>
<div id="decks"></div>
<script>
var store=window.myllmStorage||{getItem:function(){return Promise.resolve(null)},setItem:function(){return Promise.resolve()}};
var decks=[],cur=-1,idx=0,showA=false;
function el(i){return document.getElementById(i)}
function setStatus(t){el('status').textContent=t}
function save(){store.setItem('decks',JSON.stringify(decks))}
function gen(){
var topic=el('topic').value.trim();if(!topic)return;
if(!window.myllmAsk){setStatus('This app needs AI access — update MyLLM and enable “Allow apps to use the AI” in Settings.');return}
el('gen').disabled=true;setStatus('Forging a deck about “'+topic+'”…');
myllmAsk('Create exactly 8 study flashcards about: '+topic+'. Reply with ONLY a JSON array like [{"q":"short question","a":"concise answer"}] and nothing else.')
.then(function(reply){
var s=reply.indexOf('['),e=reply.lastIndexOf(']');
if(s<0||e<=s)throw new Error('the model did not return a deck');
var cards=JSON.parse(reply.slice(s,e+1)).filter(function(c){return c&&c.q&&c.a});
if(!cards.length)throw new Error('the deck came back empty');
decks.unshift({topic:topic,cards:cards});save();
el('topic').value='';setStatus('');openDeck(0);renderDecks();
}).catch(function(err){setStatus('Could not generate: '+err.message)})
.then(function(){el('gen').disabled=false});
}
function openDeck(i){cur=i;idx=0;showA=false;renderCard()}
function flip(){showA=!showA;if(window.myllmHaptic)myllmHaptic('light');renderCard()}
function nav(d){var n=decks[cur].cards.length;idx=(idx+d+n)%n;showA=false;renderCard();if(window.myllmHaptic)myllmHaptic('selection')}
function renderCard(){
if(cur<0||!decks[cur]){el('card').style.display='none';el('nav').style.display='none';return}
var c=decks[cur].cards[idx];
el('card').style.display='flex';el('nav').style.display='flex';
el('side').textContent=showA?'Answer':'Question';
el('text').textContent=showA?c.a:c.q;
el('count').textContent=(idx+1)+' / '+decks[cur].cards.length;
}
function renderDecks(){
var D=el('decks');D.innerHTML='';
el('decksHead').style.display=decks.length?'block':'none';
decks.forEach(function(d,i){
var r=document.createElement('div');r.className='deck';
var s=document.createElement('span');s.textContent=d.topic;s.onclick=function(){openDeck(i)};
var n=document.createElement('span');n.className='n';n.textContent=d.cards.length+' cards';
var x=document.createElement('button');x.className='del';x.textContent='✕';
x.onclick=function(){decks.splice(i,1);if(cur===i)cur=-1;else if(cur>i)cur--;save();renderDecks();renderCard()};
r.appendChild(s);r.appendChild(n);r.appendChild(x);D.appendChild(r)})}
el('topic').addEventListener('keydown',function(e){if(e.key==='Enter')gen()});
store.getItem('decks').then(function(v){
if(v)try{decks=JSON.parse(v)}catch(e){}
renderDecks();if(decks.length)openDeck(0);
if(!window.myllmAsk)setStatus('Heads-up: this app needs the latest MyLLM with apps-AI enabled.');
});
</script></body></html>
