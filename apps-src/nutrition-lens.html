<title>Nutrition Lens</title>
<style>
:root{--build-id:"18ea565e3b";
  color-scheme:light dark;
  --font:var(--myllm-font,-apple-system,system-ui,"Segoe UI",Roboto,sans-serif);
  --page1:#f2f7f3; --page2:#eef5fa;
  --surface:#ffffff; --surface2:#f2f6f4;
  --ink:#152019; --muted:#5f6f68; --faint:#9aa8a2;
  --border:#e2ebe6;
  --acc:#2f9e5e; --acc2:#37b6a4; --accSoft:rgba(47,158,94,.12);
  --carb:#e8a33d; --prot:#3f7fd1; --fat:#d2705a;
  --radius:16px; --radiusLg:22px;
  --shadow:0 1px 2px rgba(20,40,30,.05),0 8px 22px -14px rgba(20,60,40,.28);
  --shadowLg:0 16px 44px -16px rgba(20,70,45,.42);
}
@media(prefers-color-scheme:dark){:root{
  --page1:#0b110e; --page2:#0c1416;
  --surface:#161d19; --surface2:#1e2621;
  --ink:#eef3f0; --muted:#94a49c; --faint:#63736c;
  --border:#27322c; --accSoft:rgba(47,158,94,.22);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);
  --shadowLg:0 18px 48px -16px rgba(0,0,0,.85);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:var(--font);padding:18px 16px calc(34px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,var(--page1),var(--page2));background-attachment:fixed;
  min-height:100dvh;color:var(--ink);line-height:1.4}
@media(min-width:768px){body{max-width:680px;margin:0 auto}}

.hero{position:relative;overflow:hidden;border-radius:var(--radiusLg);padding:20px;margin-bottom:16px;
  background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;box-shadow:var(--shadowLg);
  display:flex;align-items:center;gap:14px}
.hero::after{content:"";position:absolute;right:-46px;top:-46px;width:170px;height:170px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.28),transparent 70%);pointer-events:none}
.hero-badge{width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.22);
  display:grid;place-items:center;font-size:28px;flex:0 0 auto}
.hero h1{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:0}
.hero p{margin:3px 0 0;font-size:13px;opacity:.92;font-weight:500}

.surface{background:var(--surface);border:1px solid var(--border);border-radius:var(--radiusLg);
  padding:16px;margin-bottom:16px;box-shadow:var(--shadow)}
.btn-primary{width:100%;border:0;border-radius:14px;padding:15px;font-size:15.5px;font-weight:700;color:#fff;
  font-family:var(--font);background:linear-gradient(135deg,var(--acc),var(--acc2));
  box-shadow:0 8px 20px -8px var(--acc);cursor:pointer;transition:transform .1s,opacity .2s}
.btn-primary:active{transform:scale(.98)}
.btn-primary:disabled{opacity:.5;box-shadow:none}
.btn-ghost{width:100%;border:1px solid var(--border);border-radius:13px;padding:11px;font-size:13.5px;
  font-weight:650;color:var(--ink);font-family:var(--font);background:var(--surface);cursor:pointer;transition:transform .1s}
.btn-ghost:active{transform:scale(.98)}

.field{display:flex;align-items:center;gap:9px;background:var(--surface2);border:1px solid var(--border);
  border-radius:14px;padding:11px 13px;margin:11px 0 0}
.field input{flex:1;min-width:0;border:0;background:none;color:var(--ink);font-family:var(--font);
  font-size:15px;outline:none}
.field-ic{font-size:16px;opacity:.6}
.status{font-size:12.5px;color:var(--muted);font-weight:600;margin:9px 2px 0;min-height:1px}
.status.err{color:#c8553d}

.sugg{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.sugg button{border:1px solid var(--border);background:var(--surface2);color:var(--muted);border-radius:999px;
  padding:6px 11px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:var(--font)}
.sugg button:active{transform:scale(.97)}

/* ---- working state ----
   A line of small text was not enough: 30 seconds of silence reads as a crash.
   This puts a pulsing placeholder exactly where the answer will appear, with a
   running clock so it is visibly alive, and says out loud how long it can take. */
.work{background:var(--surface);border:1px solid var(--border);border-radius:var(--radiusLg);
  padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.work-top{display:flex;align-items:center;gap:11px;margin-bottom:15px}
.work-dot{width:32px;height:32px;border-radius:50%;flex:0 0 auto;
  background:conic-gradient(var(--acc),var(--acc2),var(--acc));
  -webkit-mask:radial-gradient(circle,transparent 9px,#000 10px);
  mask:radial-gradient(circle,transparent 9px,#000 10px);
  animation:spin 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.work-t{font-size:15.5px;font-weight:750;flex:1;min-width:0}
.work-s{font-size:12.5px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums;flex:0 0 auto}
.work p{margin:0 0 15px;font-size:12.5px;color:var(--muted);line-height:1.5}
.skel{height:13px;border-radius:7px;margin-bottom:9px;
  background:linear-gradient(90deg,var(--surface2) 25%,var(--border) 37%,var(--surface2) 63%);
  background-size:400% 100%;animation:shimmer 1.4s ease-in-out infinite}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}
.skel.w40{width:40%}.skel.w70{width:70%}.skel.w55{width:55%}
.skel.tall{height:34px;border-radius:10px;margin-bottom:14px;width:52%}

/* ---- result ---- */
.res{background:var(--surface);border:1px solid var(--border);border-radius:var(--radiusLg);
  padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}
.res-head{display:flex;align-items:flex-start;gap:11px;margin-bottom:14px}
.res-name{font-size:20px;font-weight:800;letter-spacing:-.02em;margin:0;flex:1;min-width:0}
.src{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;border-radius:999px;
  padding:4px 9px;flex:0 0 auto;white-space:nowrap}
.src.ref{background:var(--accSoft);color:var(--acc)}
.src.est{background:rgba(232,163,61,.16);color:#b3781f}

.kcal{display:flex;align-items:baseline;gap:9px;margin-bottom:4px}
.kcal b{font-size:40px;font-weight:850;letter-spacing:-.03em;line-height:1}
.kcal span{font-size:13px;color:var(--muted);font-weight:650}
.per{font-size:12.5px;color:var(--faint);font-weight:600;margin-bottom:15px}

.portion{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.portion button{border:1px solid var(--border);background:var(--surface2);color:var(--muted);border-radius:10px;
  padding:7px 11px;font-size:12.5px;font-weight:650;cursor:pointer;font-family:var(--font)}
.portion button.on{color:var(--acc);border-color:var(--acc);background:var(--accSoft)}

.lbl{font-size:11px;font-weight:800;color:var(--faint);text-transform:uppercase;letter-spacing:.07em;margin:0 0 9px}
.macro{margin-bottom:11px}
.macro-top{display:flex;justify-content:space-between;font-size:13.5px;font-weight:650;margin-bottom:5px}
.macro-top span:last-child{font-variant-numeric:tabular-nums;color:var(--muted)}
.bar{height:8px;background:var(--surface2);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;transition:width .45s cubic-bezier(.2,.75,.2,1)}
.i-prot{background:var(--prot)}.i-carb{background:var(--carb)}.i-fat{background:var(--fat)}

.sub{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 4px}
.subcell{background:var(--surface2);border-radius:12px;padding:10px 8px;text-align:center}
.subcell b{display:block;font-size:15px;font-weight:750;font-variant-numeric:tabular-nums}
.subcell span{display:block;font-size:10.5px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.04em;margin-top:2px}

.mic{display:flex;flex-direction:column;gap:9px}
.micro{display:grid;grid-template-columns:1fr auto;gap:3px 10px;align-items:center}
.micro .mn{font-size:13px;font-weight:600}
.micro .mv{font-size:12.5px;font-weight:650;color:var(--muted);font-variant-numeric:tabular-nums}
.micro .mb{grid-column:1/-1;height:6px;background:var(--surface2);border-radius:4px;overflow:hidden}
.micro .mb i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:4px}

.note{font-size:11.5px;color:var(--faint);line-height:1.55;margin:16px 0 0;padding-top:13px;border-top:1px solid var(--border)}

.section{font-size:11.5px;font-weight:800;color:var(--faint);text-transform:uppercase;letter-spacing:.07em;margin:0 2px 10px}
.hist{display:flex;flex-direction:column;gap:7px}
.hrow{display:flex;align-items:center;gap:11px;background:var(--surface);border:1px solid var(--border);
  border-radius:14px;padding:11px 13px;cursor:pointer;box-shadow:var(--shadow)}
.hrow:active{transform:scale(.995)}
.hrow .he{font-size:19px;flex:0 0 auto}
.hrow .hn{flex:1;min-width:0;font-size:14px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow .hk{font-size:13px;font-weight:750;color:var(--acc);font-variant-numeric:tabular-nums;flex:0 0 auto}
.hrow .hx{border:0;background:none;color:var(--faint);font-size:13px;cursor:pointer;padding:2px 4px;flex:0 0 auto}

.empty{text-align:center;padding:26px 18px;color:var(--muted)}
.empty .big{font-size:34px;display:block;margin-bottom:8px}
.empty p{margin:0;font-size:13.5px}

</style>

  <div class="status" id="status"></div>
</div>

<div id="result"></div>

<div id="histWrap" style="display:none">

  <div class="hist" id="hist"></div>
</div>

var EMOJI={Apple:'🍎',Banana:'🍌',Orange:'🍊',Strawberries:'🍓',Blueberries:'🫐',Avocado:'🥑',Grapes:'🍇',
  Mango:'🥭',Pear:'🍐',Pineapple:'🍍',Lemon:'🍋',Watermelon:'🍉',Peach:'🍑',Kiwi:'🥝',Broccoli:'🥦',
  Spinach:'🥬',Carrot:'🥕',Tomato:'🍅',Potato:'🥔','Sweet potato':'🍠',Onion:'🧅',Garlic:'🧄',
  'Bell pepper':'🫑',Cucumber:'🥒',Mushroom:'🍄',Courgette:'🥒',Cauliflower:'🥦',Kale:'🥬',Peas:'🫛',
  'Green beans':'🫛',Lettuce:'🥬',Cabbage:'🥬',Aubergine:'🍆',Beetroot:'🫜',Corn:'🌽',
  'Chicken breast':'🍗',Salmon:'🐟',Egg:'🥚','Beef mince':'🥩',Tuna:'🐟','Pork chop':'🥩',Prawns:'🦐',
  Tofu:'🧊',Lentils:'🫘',Chickpeas:'🫘','Black beans':'🫘',Milk:'🥛','Greek yoghurt':'🥛',
  'Cheddar cheese':'🧀',Butter:'🧈','White rice':'🍚','Brown rice':'🍚',Pasta:'🍝',Bread:'🍞',
  Oats:'🥣',Quinoa:'🍚',Almonds:'🌰',Walnuts:'🌰','Peanut butter':'🥜','Olive oil':'🫒',
  'Chia seeds':'🌱','Dark chocolate':'🍫',Honey:'🍯'};
function emojiFor(n){ return EMOJI[n]||'🍽️'; }

/* ---- matching ----
   Vision returns free text, so "a ripe Hass avocado" has to reach `Avocado`.
   Exact name, then synonym, then a contained-word match, longest first so
   "sweet potato" wins over "potato". */
function norm(s){ return String(s||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim(); }
function lookup(raw){
  var q=norm(raw);
  if(!q)return null;
  var i,f;
  for(i=0;i<FOODS.length;i++){ if(norm(FOODS[i].n)===q)return FOODS[i]; }
  for(i=0;i<FOODS.length;i++){
    f=FOODS[i];
    for(var j=0;j<f.alt.length;j++) if(norm(f.alt[j])===q)return f;
  }
  var best=null,bestLen=0;
  for(i=0;i<FOODS.length;i++){
    f=FOODS[i];
    var keys=[f.n].concat(f.alt);
    for(var k=0;k<keys.length;k++){
      var key=norm(keys[k]);
      if(!key)continue;
      if(q.indexOf(key)>=0||key.indexOf(q)>=0){
        if(key.length>bestLen){best=f;bestLen=key.length;}
      }
    }
  }
  return best;
}
function search(q){
  var n=norm(q);
  if(!n)return [];
  return FOODS.filter(function(f){
    if(norm(f.n).indexOf(n)>=0)return true;
    return f.alt.some(function(a){return norm(a).indexOf(n)>=0});
  }).slice(0,8);
}

/* ---------------- state ---------------- */
var current=null, grams=100, HIST=[];
var PORTIONS=[[100,'100 g'],[30,'30 g'],[50,'50 g'],[150,'150 g'],[250,'250 g']];

/* ---------------- working state ----------------

   Reading a photo on-device takes tens of seconds, and during that time the
   app used to say nothing — which reads as a crash, not as progress. So the
   wait gets the same space the answer will: a card in the result slot with a
   live clock, a skeleton of the layout that is coming, and an honest word
   about how long it takes.

   The clock starts when the promise is handed back, but the camera is a native
   sheet on top of us and we are not told when it closes, so the copy covers
   both phases rather than claiming a precision we do not have. */
var workT0=0, workTimer=null;
function setEmptyVisible(v){ var e=el('empty'); if(e)e.style.display=v?'':'none'; }
function startWork(){
  workT0=Date.now();
  setEmptyVisible(false);          // the invitation has been accepted
  el('result').innerHTML=
    '<div class="work">'+
      '<div class="work-top"><span class="work-dot"></span>'+
        '<span class="work-t">Reading your photo</span>'+
        '<span class="work-s" id="workS">0s</span></div>'+
      '<p>Take the shot, then your device works out what it is looking at. '+
        'All on-device, so it can take up to a minute — it has not frozen.</p>'+
      '<div class="skel tall"></div>'+
      '<div class="skel w70"></div><div class="skel w55"></div><div class="skel w40"></div>'+
    '</div>';
  clearInterval(workTimer);
  workTimer=setInterval(function(){
    var s=el('workS'); if(!s){clearInterval(workTimer);return}
    var sec=Math.round((Date.now()-workT0)/1000);
    s.textContent=(sec<60?sec+'s':Math.floor(sec/60)+'m '+(sec%60)+'s');
  },500);
}
function stopWork(){
  clearInterval(workTimer);workTimer=null;
  var w=el('result').querySelector('.work');
  if(w)el('result').innerHTML='';
  if(!current)setEmptyVisible(true);
}

/* ---------------- camera ---------------- */
function scan(){
  if(!window.myllmVision){
    setStatus('Scanning needs the camera bridge — update MyLLM, or type an ingredient below.',true);
    return;
  }
  setStatus('');
  el('scanBtn').textContent='Scanning…';
  el('scanBtn').disabled=true;
  startWork();
  // A labelled line, not JSON — small on-device models echo JSON templates back
  // verbatim, which is why the rest of the gallery uses this shape too.
  myllmVision('Look at this photo and name the single main food ingredient shown. '+
    'Reply with EXACTLY one line and nothing else:\nFOOD: <name of the ingredient>\n'+
    'If the photo is not food, reply exactly: FOOD: none')
  .then(function(reply){
    if(reply==null){ stopWork();setStatus(''); return; }   // user cancelled the camera
    var m=/FOOD\s*[:：]\s*(.+)/i.exec(String(reply));
    var name=m?m[1].trim():String(reply).split('\n')[0].trim();
    name=name.replace(/^(a|an|the)\s+/i,'').replace(/[.*_"']/g,'').trim();
    if(!name||/^none$/i.test(name)){
      stopWork();
      setStatus("That doesn't look like a single ingredient — try filling the frame with one item.",true);
      return;
    }
    show(name);
  })
  .catch(function(e){ stopWork();setStatus('Could not read the photo: '+e.message,true); })
  .then(function(){ el('scanBtn').disabled=false;el('scanBtn').textContent='📷 Scan an ingredient'; });
}

/* ---------------- resolve a name to numbers ---------------- */
function show(name){
  setEmptyVisible(false);
  var hit=lookup(name);
  if(hit){ present(hit,'ref',name); return; }
  // Not in the reference table. Rather than let the model invent numbers and
  // pass them off as data, the result is badged as an estimate.
  if(!window.myllmAsk){
    setStatus('“'+name+'” isn’t in the reference data, and the AI isn’t available to estimate it.',true);
    if(!current)setEmptyVisible(true);
    return;
  }
  setStatus('');
  startWork();
  var wt=el('result').querySelector('.work-t');
  if(wt)wt.textContent='Estimating '+name;
  var p='Give typical nutrition values per 100 g of raw '+name+'. '+
    'Reply with EXACTLY these labelled lines and nothing else, numbers only:\n'+
    'KCAL: <number>\nPROTEIN: <grams>\nCARBS: <grams>\nSUGAR: <grams>\nFIBRE: <grams>\nFAT: <grams>\nSAT: <grams>';
  myllmAsk(p).then(function(r){
    var g=function(k){ var m=new RegExp(k+'\\s*[:：]\\s*([\\d.]+)','i').exec(String(r||'')); return m?parseFloat(m[1]):null; };
    var kcal=g('KCAL');
    if(kcal===null||isNaN(kcal))throw new Error('no usable numbers came back');
    present({n:name.charAt(0).toUpperCase()+name.slice(1), kcal:kcal,
      protein:g('PROTEIN')||0, carbs:g('CARBS')||0, sugar:g('SUGAR')||0,
      fibre:g('FIBRE')||0, fat:g('FAT')||0, sat:g('SAT')||0, mic:[]}, 'est', name);
  }).catch(function(e){ stopWork();setStatus('Could not estimate “'+name+'”: '+e.message,true); });
}

/* ---------------- render ---------------- */
function present(food,src,queried){
  clearInterval(workTimer);workTimer=null;
  setEmptyVisible(false);
  current={food:food,src:src};
  grams=100;
  setStatus('');
  render();
  addHistory(food,src);
  haptic('success');
  el('result').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function fmt(v,d){
  if(v===null||v===undefined||isNaN(v))return '—';
  var n=Number(v);
  return (n<10&&n!==Math.round(n))?n.toFixed(d===undefined?1:d):Math.round(n).toString();
}
function render(){
  if(!current){el('result').innerHTML='';return}
  var f=current.food, k=grams/100;
  var kcal=f.kcal*k, p=f.protein*k, c=f.carbs*k, fa=f.fat*k;
  // energy split by macro, which is what actually explains a calorie figure
  var eP=p*4, eC=c*4, eF=fa*9, eT=Math.max(1,eP+eC+eF);
  var isRef=current.src==='ref';

  // Rounding each share independently lets them total 99% or 101%, which looks
  // like sloppy arithmetic in an app whose whole promise is trustworthy
  // numbers. Round the first two and give the remainder to the third.
  var shares=[eP/eT,eC/eT,eF/eT];
  var pc0=Math.round(shares[0]*100), pc1=Math.round(shares[1]*100);
  var pcs=[pc0,pc1,Math.max(0,100-pc0-pc1)];
  var macros=[['Protein',p,'i-prot'],['Carbs',c,'i-carb'],['Fat',fa,'i-fat']]
    .map(function(m,i){
      return '<div class="macro"><div class="macro-top"><span>'+m[0]+'</span>'+
        '<span>'+fmt(m[1])+' g · '+pcs[i]+'%</span></div>'+
        '<div class="bar"><i class="'+m[2]+'" style="width:'+(shares[i]*100).toFixed(1)+'%"></i></div></div>';
    }).join('');

  var mics=(f.mic||[]).length
    ? '<p class="lbl" style="margin-top:18px">Micronutrients</p><div class="mic">'+
      f.mic.map(function(m){
        var dv=Math.min(100,m[3]*k);
        return '<div class="micro"><span class="mn">'+m[0]+'</span>'+
          '<span class="mv">'+fmt(m[1]*k,1)+' '+m[2]+' · '+Math.round(m[3]*k)+'% DV</span>'+
          '<span class="mb"><i style="width:'+dv.toFixed(1)+'%"></i></span></div>';
      }).join('')+'</div>'
    : (isRef?'':'<p class="lbl" style="margin-top:18px">Micronutrients</p>'+
       '<p style="font-size:12.5px;color:var(--faint);margin:0">Not estimated — micronutrient figures are too varied to guess at.</p>');

  el('result').innerHTML=
    '<div class="res">'+
      '<div class="res-head">'+
        '<h2 class="res-name">'+emojiFor(f.n)+' '+esc(f.n)+'</h2>'+
        '<span class="src '+(isRef?'ref':'est')+'">'+(isRef?'Reference data':'AI estimate')+'</span>'+
      '</div>'+
      '<div class="kcal"><b>'+Math.round(kcal)+'</b><span>kcal</span></div>'+
      '<div class="per">per '+grams+' g'+(grams!==100?' · '+Math.round(f.kcal)+' kcal per 100 g':'')+'</div>'+
      '<div class="portion">'+PORTIONS.map(function(pr){
        return '<button class="'+(grams===pr[0]?'on':'')+'" onclick="setGrams('+pr[0]+')">'+pr[1]+'</button>';
      }).join('')+'</div>'+
      '<p class="lbl">Macronutrients</p>'+macros+
      '<div class="sub">'+
        '<div class="subcell"><b>'+fmt(f.fibre*k)+' g</b><span>Fibre</span></div>'+
        '<div class="subcell"><b>'+fmt(f.sugar*k)+' g</b><span>Sugars</span></div>'+
        '<div class="subcell"><b>'+fmt(f.sat*k)+' g</b><span>Saturates</span></div>'+
      '</div>'+
      mics+
      '<p class="note">'+(isRef
        ? 'Reference values per 100 g of the raw ingredient, from public USDA data. %DV is against standard adult daily values.'
        : 'These figures were estimated by the on-device AI because this ingredient isn’t in the reference data. Treat them as a rough guide.')+
        ' Cooking, ripeness, cut and variety all shift the numbers. For general interest — not dietary or medical advice.</p>'+
    '</div>';
}
function setGrams(g){ grams=g; render(); haptic('selection'); }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

/* ---------------- history ---------------- */
function addHistory(food,src){
  HIST=HIST.filter(function(h){return h.n!==food.n});
  HIST.unshift({n:food.n,kcal:food.kcal,src:src});
  if(HIST.length>12)HIST.length=12;
  store.setItem('history',JSON.stringify(HIST));
  renderHistory();
}
function renderHistory(){
  var w=el('histWrap'),h=el('hist');
  if(!HIST.length){w.style.display='none';return}
  w.style.display='block';
  h.innerHTML='';
  HIST.forEach(function(item,i){
    var r=document.createElement('div');r.className='hrow';
    r.innerHTML='<span class="he">'+emojiFor(item.n)+'</span>'+
      '<span class="hn">'+esc(item.n)+'</span>'+
      '<span class="hk">'+Math.round(item.kcal)+' kcal</span>';
    var x=document.createElement('button');x.className='hx';x.type='button';x.textContent='✕';
    x.setAttribute('aria-label','Remove');
    x.onclick=function(ev){ ev.stopPropagation();HIST.splice(i,1);
      store.setItem('history',JSON.stringify(HIST));renderHistory();haptic('warning'); };
    r.appendChild(x);
    r.onclick=function(){ show(item.n); };
    h.appendChild(r);
  });
}

/* ---------------- typed search ---------------- */
var SUGGEST=['Avocado','Spinach','Salmon','Oats','Almonds','Sweet potato'];
function buildSuggestions(){
  var s=el('sugg');s.innerHTML='';
  SUGGEST.forEach(function(n){
    var b=document.createElement('button');b.type='button';b.textContent=emojiFor(n)+' '+n;
    b.onclick=function(){ el('q').value='';show(n); };
    s.appendChild(b);
  });
}
function renderMatches(list){
  var s=el('sugg');s.innerHTML='';
  list.forEach(function(f){
    var b=document.createElement('button');b.type='button';b.textContent=emojiFor(f.n)+' '+f.n;
    b.onclick=function(){ el('q').value='';buildSuggestions();show(f.n); };
    s.appendChild(b);
  });
}
el('q').addEventListener('input',function(){
  var v=this.value.trim();
  if(!v){ buildSuggestions();setStatus('');return }
  var m=search(v);
  if(m.length)renderMatches(m);
  else { el('sugg').innerHTML=''; }
});
el('q').addEventListener('keydown',function(e){
  if(e.key!=='Enter')return;
  var v=this.value.trim();if(!v)return;
  this.value='';buildSuggestions();show(v);
});

/* ---------------- boot ---------------- */
buildSuggestions();
if(!window.myllmVision){
  setStatus('Camera scanning needs the latest MyLLM. You can still look anything up by typing it.');
}
store.getItem('history').then(function(v){
  if(v)try{HIST=JSON.parse(v)||[]}catch(e){}
  renderHistory();
});
