.lcard.done{border-color:rgba(232,182,76,.55)}

.practice{position:fixed;inset:0;background:var(--paper);display:none;flex-direction:column;z-index:10}
.practice.on{display:flex}

.phint{flex:1;font-size:12.5px;color:var(--mut);font-weight:600;line-height:1.4}

/* ---- path sampling: identical smoothing to the iOS app (quad through midpoints) ---- */
function sampleStroke(pts,per){
  per=per||14;
  if(pts.length<2)return pts.slice();
  if(pts.length===2){
    var out=[];for(var t=0;t<=per;t++)out.push([pts[0][0]+(pts[1][0]-pts[0][0])*t/per,pts[0][1]+(pts[1][1]-pts[0][1])*t/per]);
    return out;
  }
  var s=[pts[0].slice()],cur=pts[0];
  for(var i=1;i<pts.length;i++){
    if(i<pts.length-1){
      var mid=[(pts[i][0]+pts[i+1][0])/2,(pts[i][1]+pts[i+1][1])/2];
      for(var t2=1;t2<=per;t2++){
        var u=t2/per,a=1-u;
        s.push([a*a*cur[0]+2*a*u*pts[i][0]+u*u*mid[0], a*a*cur[1]+2*a*u*pts[i][1]+u*u*mid[1]]);
      }
      cur=mid;
    } else { s.push(pts[i].slice()); cur=pts[i]; }
  }
  return s;
}

/* ---- evaluation (ported spirit of StrokeEvaluator: coverage + accuracy) ---- */
function evalStroke(guide,ink){
  if(ink.length<4)return {cov:0,acc:0,pass:false};
  var TH_COV=0.10,TH_ACC=0.13;
  function near(p,arr,th){
    for(var i=0;i<arr.length;i++){
      var dx=p[0]-arr[i][0],dy=p[1]-arr[i][1];
      if(dx*dx+dy*dy<th*th)return true;
    }
    return false;
  }
  var covHit=0;guide.forEach(function(g){if(near(g,ink,TH_COV))covHit++});
  var accHit=0,dSum=0;
  ink.forEach(function(p){
    if(near(p,guide,TH_ACC))accHit++;
    var best=1e9;
    for(var i=0;i<guide.length;i++){
      var dx=p[0]-guide[i][0],dy=p[1]-guide[i][1],d2=dx*dx+dy*dy;
      if(d2<best)best=d2;
    }
    dSum+=Math.sqrt(best);
  });
  var cov=covHit/guide.length,acc=accHit/ink.length,dAvg=dSum/ink.length;
  /* quality is DISTANCE-based, not hit-based — neat tracing earns the stars */
  var q=Math.max(0,1-dAvg/0.08);
  return {cov:cov,acc:acc,q:q,pass:cov>=0.72&&acc>=0.6};
}

function guides(){

  }
}

  if(ink.length<2)return;
  ctx.strokeStyle='#2c2b33';ctx.lineWidth=8*DPR;ctx.lineCap='round';ctx.lineJoin='round';

  for(var i=1;i<ink.length;i++)ctx.lineTo(P(ink[i][0]),P(ink[i][1]));
  ctx.stroke();
}

  ctx.clearRect(0,0,cv.width,cv.height);
  guides();drawGuidePath();drawInk();
  if(demoPt){ctx.fillStyle='#3eb8ac';ctx.beginPath();ctx.arc(P(demoPt[0]),P(demoPt[1]),8*DPR,0,7);ctx.fill();}
}

/* ---- demo animation: a pen-dot travels the active stroke ---- */
function demo(){
  if(!cur||strokeIdx>=cur.strokes.length)return;
  clearInterval(demoT);
  var s=sampleStroke(cur.strokes[strokeIdx]),i=0;
  el('pHint').textContent='Watch… then trace from the pink dot';
  demoT=setInterval(function(){
    if(i>=s.length){clearInterval(demoT);demoT=null;paint();el('pHint').textContent='Your turn — trace the grey stroke';return;}
    paint(s[i]);i++;
  },28);
}

/* ---- tracing ---- */
function pos(e){var r=cv.getBoundingClientRect();return [(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]}
cv.addEventListener('pointerdown',function(e){
  if(!cur||strokeIdx>=cur.strokes.length||demoT)return;
  drawing=true;ink=[pos(e)];cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove',function(e){
  if(!drawing)return;ink.push(pos(e));paint();
});
['pointerup','pointercancel'].forEach(function(ev){cv.addEventListener(ev,function(){
  if(!drawing)return;drawing=false;finishStroke();
})});
function finishStroke(){
  var guide=sampleStroke(cur.strokes[strokeIdx]);
  var r=evalStroke(guide,ink);
  if(r.pass){
    quals.push(r.q);
    strokeIdx++;ink=[];
    haptic('success');
    if(strokeIdx>=cur.strokes.length)finishLetter();
    else{el('pHint').textContent='Lovely — next stroke from the pink dot';paint();}
  } else {
    haptic('warning');ink=[];
    el('pHint').textContent=r.cov<0.3?'Start at the pink dot and follow the grey stroke':'Close! Try that stroke once more';
    paint();
  }
}
function finishLetter(){
  var q=quals.reduce(function(a,b){return a+b},0)/quals.length;
  earned=q>=0.72?3:(q>=0.45?2:1);
  var prev=stars[cur.ch]||0;
  if(earned>prev){stars[cur.ch]=earned;store.setItem('cursive.stars',JSON.stringify(stars));}
  el('pStars').textContent='★★★'.slice(0,earned)+'☆☆☆'.slice(0,3-earned);
  el('pHint').textContent=earned===3?'Beautiful penmanship!':(earned===2?'Lovely — smooth those curves for 3 stars':'Done! Practice makes perfect');
  el('btnNext').disabled=false;
  toast(earned===3?'Beautiful!':'Well done!');
  haptic('success');paint();renderGrid();
}

/* ---- flow ---- */
function openPractice(l){
  cur=l;strokeIdx=0;quals=[];ink=[];earned=null;
  el('practice').classList.add('on');
  el('pLetter').textContent=l.ch;
  el('pStars').textContent='';
  el('btnNext').disabled=true;
  fitCanvas();paint();demo();
}
function nextLetter(){
  var list=letterList(),i=list.indexOf(cur);
  openPractice(list[(i+1)%list.length]);haptic('selection');
}
el('pClose').onclick=function(){clearInterval(demoT);demoT=null;el('practice').classList.remove('on');haptic('light')};
el('btnDemo').onclick=function(){if(!demoT)demo()};
el('btnClear').onclick=function(){strokeIdx=0;quals=[];ink=[];el('btnNext').disabled=true;el('pStars').textContent='';paint();demo();haptic('light')};
el('btnNext').onclick=nextLetter;
var toastT=null;
function toast(t){var x=el('toast');x.textContent=t;x.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){x.classList.remove('on')},1300)}
window.addEventListener('resize',function(){if(cur){fitCanvas();paint();}});

store.getItem('cursive.stars').then(function(v){
  if(v)try{stars=JSON.parse(v)||{}}catch(e){}
  renderGrid();
});
</script>
</body></html>
