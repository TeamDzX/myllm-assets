<title>Cursive</title>

<style>
:root{--build-id:"6dff3e5a5c";color-scheme:light;--paper:#faf8f3;--card:#ffffff;--ink:#2c2b33;--mut:#98928a;--line:#e8e3da;
  --teal:#3eb8ac;--pink:#f26d9a;--gold:#e8b64c}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:-apple-system,system-ui,sans-serif;background:var(--paper);color:var(--ink);
  position:fixed;inset:0;width:100%;height:100dvh;overflow:hidden;display:flex;flex-direction:column;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.rowsel{display:flex;gap:7px;padding:6px 16px 4px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.rowsel::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1.5px solid var(--line);background:var(--card);color:var(--mut);border-radius:12px;
  padding:8px 14px;font-size:15px;font-weight:700;white-space:nowrap}
.tab.on{color:var(--teal);border-color:var(--teal);box-shadow:0 2px 10px rgba(62,184,172,.15)}
.styles{display:flex;gap:7px;padding:2px 20px 8px}
.sty{flex:1;border:1.5px solid var(--line);background:none;color:var(--mut);border-radius:999px;
  padding:7px 4px;font-size:12px;font-weight:700}
.sty.on{color:var(--pink);border-color:var(--pink)}
#grid{flex:1;overflow-y:auto;padding:2px 16px calc(20px + env(safe-area-inset-bottom));
  display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:9px;align-content:start}
.lcard{position:relative;width:100%;height:0;padding-bottom:100%;   /* a guaranteed square */
  border:1.5px solid var(--line);background:var(--card);border-radius:14px;cursor:pointer;
  box-shadow:0 2px 8px rgba(60,50,30,.05);overflow:hidden}
.lcard .in{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.lcard .g{line-height:1;color:var(--ink)}
.lcard .py{position:absolute;left:0;right:2px;bottom:13px;text-align:center;font-size:8px;color:var(--mut);
  font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px}
.lcard .s{position:absolute;left:0;right:0;bottom:3px;text-align:center;font-size:9px;letter-spacing:1px;color:var(--gold);min-height:10px}
.lcard .pen{position:absolute;top:4px;right:6px;font-size:9px;opacity:.85}
.lcard.done{border-color:rgba(232,182,76,.55)}
/* practice */
.practice{position:fixed;inset:0;background:var(--paper);display:none;flex-direction:column;z-index:10}
.practice.on{display:flex}
.phead{padding:calc(12px + env(safe-area-inset-top)) 16px 4px;display:flex;align-items:center;gap:12px}
.pletter{font-size:30px;min-width:40px;text-align:center;line-height:1}
.phint{flex:1;font-size:12.5px;color:var(--mut);font-weight:600;line-height:1.4}
.ftag{font-size:8.5px;letter-spacing:.12em;color:var(--mut);font-weight:800;text-align:center;line-height:1.5}
.ftag b{font-size:11px;color:var(--teal);letter-spacing:.06em}
.pclose{border:0;background:var(--card);border:1.5px solid var(--line);border-radius:50%;width:36px;height:36px;
  font-size:16px;color:var(--mut);font-weight:700}
#wrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:8px 14px}
#pad{background:var(--card);border:1.5px solid var(--line);border-radius:22px;touch-action:none;
  box-shadow:0 6px 24px rgba(60,50,30,.08)}
.stars{font-size:26px;letter-spacing:4px;text-align:center;color:var(--gold);min-height:32px}
.pbar{display:flex;gap:9px;padding:8px 16px calc(16px + env(safe-area-inset-bottom))}
.pbtn{flex:1;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:13px;
  padding:13px;font-size:14px;font-weight:700}
.pbtn.go{background:linear-gradient(135deg,var(--teal),#2f9a90);border:0;color:#fff}
.pbtn:disabled{opacity:.4}
.toast{position:fixed;left:50%;top:26%;transform:translateX(-50%);background:var(--ink);color:#fff;
  border-radius:12px;padding:9px 18px;font-size:14px;font-weight:700;opacity:0;transition:opacity .25s;
  pointer-events:none;z-index:40}
.toast.on{opacity:1}

/* standard header */
:root{--h:172}
body{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
svg.i{width:1.25em;height:1.25em;fill:currentColor;flex-shrink:0}
.head{display:flex;align-items:center;gap:12px;padding:calc(16px + env(safe-area-inset-top)) 18px 8px}
.tile{display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;
  background:linear-gradient(145deg,hsl(var(--h) 62% 50%),hsl(calc(var(--h) + 40) 58% 28%))}
.head .tile{width:44px;height:44px;border-radius:13px;font-size:19px}
.head .ht{flex:1;min-width:0}
.head h1{font-size:22px;font-weight:800;letter-spacing:-.01em}
.head p{font-size:13px;color:var(--mut);margin-top:1px}
.head .acts{display:flex;gap:8px;flex-shrink:0}
.prog{display:flex;align-items:center;gap:5px;height:36px;padding:0 12px;border-radius:99px;background:var(--card);border:1.5px solid var(--line);font-size:14px;color:var(--ink);font-weight:800;font-variant-numeric:tabular-nums}
.prog svg{color:var(--gold);font-size:14px}
.lcard .pen{color:var(--teal);font-size:11px;line-height:1}
.pclose{width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:15px}
.pbtn{display:flex;align-items:center;justify-content:center;gap:6px}
.phead{padding-left:16px;padding-right:16px}
/* phone on its side: the pad on the left, everything else on the right */
@media (max-height:520px){
  .practice.on{display:grid;grid-template-columns:1fr minmax(230px,38%);grid-template-rows:auto 1fr auto auto}
  .phead{grid-column:2;grid-row:1}
  #wrap{grid-column:1;grid-row:1/5;padding:calc(8px + env(safe-area-inset-top)) 8px calc(8px + env(safe-area-inset-bottom)) 14px}
  .stars{grid-column:2;grid-row:3}
  .pbar{grid-column:2;grid-row:4;flex-wrap:wrap}
  .pbar .pbtn{flex:1 1 40%}
  .head{padding-top:calc(10px + env(safe-area-inset-top))}
}

/* myllm-fullscreen-v2 — MyLLM 5.6.2+ opens this app full screen; the ✕ is the way out. */
.head .imm-acts{display:none;flex-shrink:0;margin-left:auto}
.head .acts + .imm-acts{margin-left:0}
body.imm .head .imm-acts{display:flex}
.head .imm-acts button{width:40px;height:40px;border-radius:12px;border:1px solid var(--myllm-border,rgba(128,128,128,.28));
  background:var(--myllm-surface,rgba(128,128,128,.12));color:var(--myllm-text,currentColor);display:grid;place-items:center;padding:0;cursor:pointer;transition:transform .12s}
.head .imm-acts button:active,.head .imm-x:active{transform:scale(.94)}
.head .imm-x{display:none !important}
body.imm .head .imm-x{display:grid !important;place-items:center}
.imm-x svg,.imm-acts svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}
.imm-safe{display:none}
body.imm .imm-safe{display:block}
</style></head><body>

function scoreGrids(mask,tol,inkG,n){
  var maskN=0,maskHit=0,inkN=0,inkHit=0;
  for(var i=0;i<n*n;i++){
    if(mask[i]){maskN++;if(inkG[i])maskHit++;}
    if(inkG[i]){inkN++;if(tol[i])inkHit++;}
  }
  if(!maskN||!inkN)return {cov:0,acc:0,q:0,pass:false};
  var cov=maskHit/maskN, acc=inkHit/inkN;
  var q=Math.max(0,Math.min(1,(cov-.35)/.5))*.55 + Math.max(0,Math.min(1,(acc-.45)/.45))*.45;
  return {cov:cov,acc:acc,q:q,pass:cov>=.55&&acc>=.60};
}
function starsFor(q){return q>=.80?3:(q>=.52?2:1)}

/* ================= canvas ================= */
var cv=el('pad'),ctx=cv.getContext('2d'),SZ=300,DPR=1;
var GRID=64, maskG=null, tolG=null;      // rasterised letter + tolerance band
function fitCanvas(){
  var w=el('wrap');
  var s=Math.min(w.clientWidth-28,w.clientHeight-16,440);
  DPR=Math.min(window.devicePixelRatio||1,2);
  SZ=Math.max(200,s);
  cv.width=Math.round(SZ*DPR);cv.height=Math.round(SZ*DPR);
  cv.style.width=SZ+'px';cv.style.height=SZ+'px';
}
/* fit the glyph to the writing bands using the font's own metrics */
function layout(){
  var W=cv.width,H=cv.height,f=styleDef();
  var S=curSet(),FF=faceFont();
  if(S.square){
    /* characters that sit in a square cell rather than on a baseline */
    var box=Math.min(W,H)*.62, size=Math.round(box*faceSize());
    ctx.font=size+'px '+FF;
    var m2=ctx.measureText(cur||S.chars[0]);
    var a3=m2.actualBoundingBoxAscent||size*.85, d3=m2.actualBoundingBoxDescent||0;
    return {font:size+'px '+FF,size:size,base:H/2+(a3-d3)/2,box:box,
            asc:a3,desc:d3,xh:a3,w:m2.width,cx:W/2,square:true};
  }
  var MP=S.metrics||{asc:'h',desc:'p',xh:'x'};
  var probe=Math.round(H*.4);
  ctx.font=probe+'px '+FF;
  var asc=ctx.measureText(MP.asc).actualBoundingBoxAscent||probe*.7;
  var desc=ctx.measureText(MP.desc).actualBoundingBoxDescent||probe*.2;
  var want=H*(S.fit||.6);
  var size=Math.round(probe*want/Math.max(1,asc+desc)*faceSize());
  ctx.font=size+'px '+FF;
  var m=ctx.measureText(cur||S.chars[0]);
  var a2=ctx.measureText(MP.asc).actualBoundingBoxAscent;
  var d2=ctx.measureText(MP.desc).actualBoundingBoxDescent;
  var x2=ctx.measureText(MP.xh).actualBoundingBoxAscent||a2*.55;
  var base=H/2+(a2-d2)/2;
  return {font:size+'px '+FF,size:size,base:base,asc:a2,desc:d2,xh:x2,
          w:m.width,cx:W/2};
}
function guides(L){
  var W=cv.width,H=cv.height;
  ctx.lineWidth=1*DPR;
  if(L.square){
    var b=L.box*1.12,x0=(W-b)/2,y0=(H-b)/2;
    ctx.strokeStyle='rgba(80,70,60,.30)';ctx.setLineDash([]);
    ctx.strokeRect(x0,y0,b,b);
    ctx.strokeStyle='rgba(80,70,60,.15)';ctx.setLineDash([5*DPR,5*DPR]);
    ctx.beginPath();
    ctx.moveTo(x0+b/2,y0);ctx.lineTo(x0+b/2,y0+b);
    ctx.moveTo(x0,y0+b/2);ctx.lineTo(x0+b,y0+b/2);
    ctx.moveTo(x0,y0);ctx.lineTo(x0+b,y0+b);
    ctx.moveTo(x0+b,y0);ctx.lineTo(x0,y0+b);
    ctx.stroke();ctx.setLineDash([]);
    return;
  }
  var ys=[[L.base,'rgba(80,70,60,.34)'],[L.base-L.xh,'rgba(80,70,60,.13)'],
          [L.base-L.asc,'rgba(80,70,60,.13)'],[L.base+L.desc,'rgba(80,70,60,.10)']];
  ys.forEach(function(g,i){
    ctx.strokeStyle=g[1];ctx.setLineDash(i>=2?[4*DPR,5*DPR]:[]);
    ctx.beginPath();ctx.moveTo(W*.05,g[0]);ctx.lineTo(W*.95,g[0]);ctx.stroke();
  });
  ctx.setLineDash([]);
}
function drawGlyph(L,alpha){
  ctx.save();ctx.font=L.font;ctx.textAlign='center';ctx.textBaseline='alphabetic';
  ctx.fillStyle='rgba(120,112,104,'+alpha.toFixed(3)+')';
  ctx.fillText(cur,L.cx,L.base);
  ctx.restore();
}
function drawInk(){
  ctx.strokeStyle='#2c2b33';ctx.lineWidth=Math.max(6,cv.width*.026);
  ctx.lineCap='round';ctx.lineJoin='round';
  strokesInk.concat([ink]).forEach(function(s){
    if(s.length<2)return;
    ctx.beginPath();ctx.moveTo(s[0][0]*cv.width,s[0][1]*cv.height);
    for(var i=1;i<s.length;i++)ctx.lineTo(s[i][0]*cv.width,s[i][1]*cv.height);
    ctx.stroke();
  });
}
function paint(){
  if(!cur)return;
  var L=layout();
  ctx.clearRect(0,0,cv.width,cv.height);
  guides(L);drawGlyph(L,FADE[fade]*.85);drawInk();
}
/* rasterise the letter (and a tolerance band around it) onto a small grid */
function buildMask(){
  var L=layout(),n=GRID;
  var oc=document.createElement('canvas');oc.width=oc.height=n;
  var o=oc.getContext('2d');
  var k=n/cv.width;
  o.fillStyle='#000';o.fillRect(0,0,n,n);
  o.save();o.scale(k,k);
  o.font=L.font;o.textAlign='center';o.textBaseline='alphabetic';
  o.fillStyle='#fff';o.fillText(cur,L.cx,L.base);
  o.restore();
  var a=o.getImageData(0,0,n,n).data;
  maskG=new Uint8Array(n*n);
  for(var i=0;i<n*n;i++)maskG[i]=a[i*4]>110?1:0;
  /* tolerance band: the same glyph, fattened */
  o.fillStyle='#000';o.fillRect(0,0,n,n);
  o.save();o.scale(k,k);
  o.font=L.font;o.textAlign='center';o.textBaseline='alphabetic';
  o.fillStyle='#fff';o.strokeStyle='#fff';o.lineWidth=cv.width*.055;
  o.lineJoin='round';o.miterLimit=2;
  o.fillText(cur,L.cx,L.base);o.strokeText(cur,L.cx,L.base);
  o.restore();
  var b=o.getImageData(0,0,n,n).data;
  tolG=new Uint8Array(n*n);
  for(var j=0;j<n*n;j++)tolG[j]=b[j*4]>110?1:0;
}
function inkGrid(){
  var n=GRID,oc=document.createElement('canvas');oc.width=oc.height=n;
  var o=oc.getContext('2d');
  o.fillStyle='#000';o.fillRect(0,0,n,n);
  o.strokeStyle='#fff';o.lineWidth=Math.max(2,n*.028);o.lineCap='round';o.lineJoin='round';
  strokesInk.forEach(function(s){
    if(s.length<2)return;
    o.beginPath();o.moveTo(s[0][0]*n,s[0][1]*n);
    for(var i=1;i<s.length;i++)o.lineTo(s[i][0]*n,s[i][1]*n);
    o.stroke();
  });
  var a=o.getImageData(0,0,n,n).data,g=new Uint8Array(n*n);
  for(var i2=0;i2<n*n;i2++)g[i2]=a[i2*4]>110?1:0;
  return g;
}

/* ================= grid of cards ================= */
function starStr(n){return n?'★★★'.slice(0,n):''}

var glyphs=[];
function renderGrid(){
  var g=el('grid');g.innerHTML='';glyphs=[];
  var f=styleDef();
  letters().forEach(function(ch){
    var d=document.createElement('div');d.className='lcard'+(stars[ch]?' done':'');
    d.setAttribute('role','button');d.setAttribute('tabindex','0');
    var box=document.createElement('span');box.className='in';
    var sp=document.createElement('span');sp.className='g';
    sp.style.fontFamily=faceFont();sp.textContent=ch;
    box.appendChild(sp);d.appendChild(box);glyphs.push(sp);
    var nf=infoFor(ch);
    if(nf){var py=document.createElement('span');py.className='py';py.textContent=nf.p;d.appendChild(py)}
    var s=document.createElement('span');s.className='s';s.textContent=starStr(stars[ch]||0);d.appendChild(s);
    if((levels[ch]||0)>=MAXFADE){var p=document.createElement('span');p.className='pen';p.innerHTML='<svg class="i"><use href="#i-pen"/></svg>';d.appendChild(p)}
    d.onclick=function(){openPractice(ch);haptic('selection')};
    g.appendChild(d);
  });
  var tot=0;for(var k in stars)tot+=stars[k];
  el('starCount').textContent=tot;
  sizeGlyphs();
}
/* the glyph is scaled to the card's real width once the grid has laid out —
   a percentage font-size would resolve against the parent's font-size instead */
function sizeGlyphs(){
  if(!glyphs.length)return;
  var g=el('grid'),first=g.children&&g.children[0];
  var w=(first&&(first.clientWidth||first.offsetWidth))||0;
  if(!w){var cols=Math.max(1,Math.round((g.clientWidth||360)/86));w=((g.clientWidth||360)-32-(cols-1)*9)/cols}
  var px=Math.max(18,Math.round(w*(isSquare()?.60:.54)*faceSize()));
  for(var i=0;i<glyphs.length;i++)glyphs[i].style.fontSize=px+'px';
}
function buildStyles(){
  var w=el('styles');w.innerHTML='';
  STYLES.forEach(function(s){
    var b=document.createElement('button');b.className='sty'+(s.id===styleId?' on':'');
    b.textContent=styleLabel(s);b.style.fontFamily=faceFont();
    b.onclick=function(){styleId=s.id;store.setItem('cursive.style',styleId);
      buildStyles();renderGrid();if(cur){fitCanvas();buildMask();paint()}haptic('selection')};
    w.appendChild(b);
  });
}
function buildTabs(){
  var w=el('rowsel');w.innerHTML='';
  SETS.forEach(function(s){
    var b=document.createElement('button');b.className='tab'+(s.id===tab?' on':'');
    b.textContent=s.label;b.style.fontFamily=s.fonts[styleId]||s.fonts.roman;
    b.onclick=function(){setTab(s.id)};
    w.appendChild(b);
  });
}
function setTab(t){
  tab=t;store.setItem('cursive.set',t);
  buildTabs();buildStyles();renderGrid();haptic('selection');
}

/* ================= tracing ================= */
function pos(e){var r=cv.getBoundingClientRect();return [(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]}
cv.addEventListener('pointerdown',function(e){
  if(!cur)return;
  drawing=true;ink=[pos(e)];cv.setPointerCapture(e.pointerId);paint();
});
cv.addEventListener('pointermove',function(e){ if(!drawing)return; ink.push(pos(e)); paint(); });
['pointerup','pointercancel'].forEach(function(ev){cv.addEventListener(ev,function(){
  if(!drawing)return;drawing=false;
  if(ink.length>1)strokesInk.push(ink);
  ink=[];paint();
  el('btnCheck').disabled=false;
})});

function check(){
  if(!strokesInk.length){toast('Trace the letter first');return}
  if(!maskG)buildMask();
  var r=scoreGrids(maskG,tolG,inkGrid(),GRID);
  if(!r.pass){
    el('pHint').textContent=r.cov<.45?'Cover the whole character — follow its shape':'Stay closer to the strokes';
    toast('Not quite — try again');haptic('warning');return;
  }
  earned=starsFor(r.q);
  if((levels[cur]||0)<fade){levels[cur]=fade;store.setItem('cursive.levels',JSON.stringify(levels))}
  if(earned>(stars[cur]||0)){stars[cur]=earned;store.setItem('cursive.stars',JSON.stringify(stars))}
  el('pStars').textContent='★★★'.slice(0,earned)+'☆☆☆'.slice(0,3-earned);
  el('pHint').textContent=fade>=MAXFADE
    ?(earned===3?'Written from memory — beautiful!':'Written from memory. Well done!')
    :(earned===3?'Beautiful! Try it again with a fainter guide':'Nicely done — fade the guide and try again');
  el('btnNext').disabled=false;
  el('btnNext').innerHTML=fade>=MAXFADE?'Next letter':FAINTER;
  toast(fade>=MAXFADE?'From memory!':(earned===3?'Beautiful!':'Well done!'));
  haptic('success');renderGrid();
}
function updFadeTag(){el('fadeTag').innerHTML='GUIDE<br><b>'+FADE_NAME[fade]+'</b>'}
function fainter(){
  fade=Math.min(MAXFADE,fade+1);
  strokesInk=[];ink=[];earned=null;
  el('pStars').textContent='';el('btnNext').disabled=true;el('btnNext').innerHTML=FAINTER;
  el('btnCheck').disabled=true;
  el('pHint').textContent=fade>=MAXFADE?'No guide now — write it from memory':'Fainter guide — trace it again';
  updFadeTag();paint();haptic('success');
}
function openPractice(ch){
  cur=ch;fade=0;strokesInk=[];ink=[];earned=null;
  el('practice').classList.add('on');syncChrome(true);
  el('pLetter').style.fontFamily=faceFont();el('pLetter').style.fontSize='30px';
  el('pLetter').textContent=ch;
  el('pStars').textContent='';
  el('btnNext').disabled=true;el('btnNext').innerHTML=FAINTER;
  el('btnCheck').disabled=true;
  var nfo=infoFor(ch);
  el('pHint').textContent=nfo
    ? (nfo.p+' \u00b7 '+nfo.m+(isSquare()?' \u2014 trace inside the square':' \u2014 trace over it'))
    : 'Trace over the letter';
  updFadeTag();fitCanvas();buildMask();paint();
}
function nextLetter(){
  var list=letters(),i=list.indexOf(cur);
  openPractice(list[(i+1)%list.length]);haptic('selection');
}
el('pClose').onclick=function(){el('practice').classList.remove('on');cur=null;syncChrome(false);haptic('light')};
/* Practice takes the whole display: MyLLM's bars go while a letter is open
   (myllmImmersive, looked up per call) and come back with the grid. */
function syncChrome(on){
  if(!window.myllmImmersive)return;
  try{myllmImmersive((window.myllmClose ? true : (on)), {keepAwake:false}).catch(function(){})}catch(e){}
}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&cur)syncChrome(true)});
el('btnNext').innerHTML=FAINTER;
el('btnClear').onclick=function(){strokesInk=[];ink=[];earned=null;el('pStars').textContent='';
  el('btnNext').disabled=true;el('btnCheck').disabled=true;paint();haptic('light')};
el('btnCheck').onclick=check;
el('btnNext').onclick=function(){(earned!==null&&fade<MAXFADE)?fainter():nextLetter()};
var toastT=null;
function toast(t){var x=el('toast');x.textContent=t;x.classList.add('on');
  clearTimeout(toastT);toastT=setTimeout(function(){x.classList.remove('on')},1400)}
var rgT=null;
window.addEventListener('resize',function(){
  if(cur){fitCanvas();buildMask();paint()}
  clearTimeout(rgT);rgT=setTimeout(function(){renderGrid();sizeGlyphs()},150);
});

store.getItem('cursive.style').then(function(v){
  if(v&&STYLES.some(function(s){return s.id===v}))styleId=v;
  return store.getItem('cursive.stars');
}).then(function(v){
  if(v)try{stars=JSON.parse(v)||{}}catch(e){}
  return store.getItem('cursive.levels');
}).then(function(v){
  if(v)try{levels=JSON.parse(v)||{}}catch(e){}
  return store.getItem('cursive.set');
}).then(function(v){
  if(v&&SETS.some(function(s){return s.id===v}))tab=v;
  buildTabs();buildStyles();renderGrid();
});

/* myllm-fullscreen-v2 — full screen where MyLLM can also close the app for us
   (myllmClose, 5.6.2+): full screen hides MyLLM's Done, and a page with no way
   out is worse than a repeated title, so elsewhere nothing changes.
   The spacer keeps the header clear of the status bar / Dynamic Island. It is
   live CSS — env(safe-area-inset-top) — not a measured number: the inset is
   still 0 when the page loads and only grows once MyLLM's bar has gone (v1
   measured once, so the title sat under the island). If the page's own styles
   already pad the header down by the inset, the spacer stays at 0. */
(function(){
  function full(){ return !!(window.myllmClose && window.myllmImmersive); }
  /* Does any rule that applies to the header or an ancestor already use the top inset? */
  function pageHandlesInset(head){
    var chain = [], n, found = false;
    for (n = head; n && n.nodeType === 1; n = n.parentElement) chain.push(n);
    function walk(rules){
      for (var i = 0; i < rules.length && !found; i++){
        var r = rules[i];
        if (r.cssRules && !r.selectorText) { walk(r.cssRules); continue; }
        if (!r.selectorText || !/safe-area-inset-top/.test(r.cssText) || !/(padding|margin|top)\s*:/.test(r.cssText)) continue;
        if (/\.imm-safe/.test(r.selectorText)) continue;
        for (var k = 0; k < chain.length; k++){
          try { if (chain[k].matches(r.selectorText)) { found = true; break; } } catch(e){}
        }
      }
    }
    for (var s = 0; s < document.styleSheets.length && !found; s++){
      try { walk(document.styleSheets[s].cssRules); } catch(e){}
    }
    for (n = head; n && n.nodeType === 1 && !found; n = n.parentElement){
      if (/safe-area-inset-top/.test(n.getAttribute("style") || "")) found = true;
    }
    return found;
  }
  function fit(){
    var sp = document.querySelector(".imm-safe"), head = document.querySelector(".head");
    if (!sp || !head) return;
    sp.style.height = (document.body.classList.contains("imm") && !pageHandlesInset(head)) ? "env(safe-area-inset-top)" : "0px";
  }
  function sync(){
    var f = full();
    document.body.classList.toggle("imm", f);
    fit();
    if (!f) return;
    try { window.myllmImmersive(true, { keepAwake:false }).catch(function(){}); } catch(e){}
  }
  window.myllmFSClose = function(){
    try { if (window.myllmHaptic) window.myllmHaptic("light"); } catch(e){}
    try { window.myllmClose().catch(function(){}); } catch(e){}
  };
  document.addEventListener("visibilitychange", function(){ if (!document.hidden) sync(); });
  sync();
})();
</script>
</body></html>
