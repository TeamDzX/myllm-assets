<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cursive</title>
<style>
:root{color-scheme:light;--paper:#faf8f3;--card:#ffffff;--ink:#2c2b33;--mut:#98928a;--line:#e8e3da;
  --teal:#3eb8ac;--pink:#f26d9a;--gold:#e8b64c}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:-apple-system,system-ui,sans-serif;background:var(--paper);color:var(--ink);
  position:fixed;inset:0;width:100%;height:100dvh;overflow:hidden;display:flex;flex-direction:column;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.top{padding:calc(14px + env(safe-area-inset-top)) 20px 8px;display:flex;align-items:baseline;gap:10px}
h1{font-size:26px;font-weight:800;letter-spacing:-.02em}
h1 i{font-style:italic;background:linear-gradient(90deg,var(--teal),var(--pink));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.prog{margin-left:auto;font-size:13px;color:var(--mut);font-weight:700}
.prog b{color:var(--gold)}
.tabs{display:flex;gap:8px;padding:6px 20px 10px}
.tab{flex:1;border:1.5px solid var(--line);background:var(--card);color:var(--mut);border-radius:12px;
  padding:9px;font-size:16px;font-weight:800;font-style:italic}
.tab.on{color:var(--teal);border-color:var(--teal);box-shadow:0 2px 10px rgba(62,184,172,.15)}
#grid{flex:1;overflow-y:auto;padding:4px 16px calc(20px + env(safe-area-inset-bottom));
  display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-content:start}
.lcard{aspect-ratio:1;border:1.5px solid var(--line);background:var(--card);border-radius:16px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  box-shadow:0 2px 8px rgba(60,50,30,.05)}
.lcard .g{width:60%;height:52%;color:var(--ink);overflow:visible}
.lcard .s{font-size:10px;letter-spacing:1px;color:var(--gold);min-height:12px}
.lcard.done{border-color:rgba(232,182,76,.55)}
/* practice */
.practice{position:fixed;inset:0;background:var(--paper);display:none;flex-direction:column;z-index:10}
.practice.on{display:flex}
.phead{padding:calc(12px + env(safe-area-inset-top)) 16px 6px;display:flex;align-items:center;gap:12px}
.pletter{font-size:34px;font-family:"Snell Roundhand","Savoye LET",cursive;font-weight:600;min-width:44px;text-align:center}
.phint{flex:1;font-size:12.5px;color:var(--mut);font-weight:600;line-height:1.4}
.pclose{border:0;background:var(--card);border:1.5px solid var(--line);border-radius:50%;width:36px;height:36px;
  font-size:16px;color:var(--mut);font-weight:700}
.ftag{font-size:8.5px;letter-spacing:.12em;color:var(--mut);font-weight:800;text-align:center;line-height:1.5}
.ftag b{font-size:11px;color:var(--teal);letter-spacing:.06em}
.lcard .pen{position:absolute;top:5px;right:7px;font-size:10px;opacity:.85}
.lcard{position:relative}
#wrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:8px 14px}
#pad{background:var(--card);border:1.5px solid var(--line);border-radius:22px;touch-action:none;
  box-shadow:0 6px 24px rgba(60,50,30,.08);max-width:100%;max-height:100%}
.pbar{display:flex;gap:9px;padding:10px 16px calc(16px + env(safe-area-inset-bottom))}
.pbtn{flex:1;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:13px;
  padding:13px;font-size:14px;font-weight:700}
.pbtn.go{background:linear-gradient(135deg,var(--teal),#2f9a90);border:0;color:#fff}
.pbtn:disabled{opacity:.4}
.stars{font-size:26px;letter-spacing:4px;text-align:center;color:var(--gold);min-height:32px;padding-top:2px}
.toast{position:fixed;left:50%;top:26%;transform:translateX(-50%);background:var(--ink);color:#fff;
  border-radius:12px;padding:9px 18px;font-size:14px;font-weight:700;opacity:0;transition:opacity .25s;
  pointer-events:none;z-index:40;font-style:italic}
.toast.on{opacity:1}
</style></head><body>

/* ---- path sampling: identical smoothing to the iOS app (quad through midpoints) ---- */
function sampleStroke(pts,per){
  per=per||14;
  if(pts.length<2)return pts.slice();
  if(pts.length===2){
    var out=[];for(var t=0;t<=per;t++)out.push([pts[0][0]+(pts[1][0]-pts[0][0])*t/per,pts[0][1]+(pts[1][1]-pts[0][1])*t/per]);
    return out;
  }
  var s=[pts[0].slice()],cur=pts[0];
  for(var i=1;i<pts.length;i++){
    if(i<pts.length-1){
      var mid=[(pts[i][0]+pts[i+1][0])/2,(pts[i][1]+pts[i+1][1])/2];
      for(var t2=1;t2<=per;t2++){
        var u=t2/per,a=1-u;
        s.push([a*a*cur[0]+2*a*u*pts[i][0]+u*u*mid[0], a*a*cur[1]+2*a*u*pts[i][1]+u*u*mid[1]]);
      }
      cur=mid;
    } else { s.push(pts[i].slice()); cur=pts[i]; }
  }
  return s;
}

/* ---- evaluation (ported spirit of StrokeEvaluator: coverage + accuracy) ---- */
function pathLen(pts){
  var t=0;
  for(var i=1;i<pts.length;i++){var dx=pts[i][0]-pts[i-1][0],dy=pts[i][1]-pts[i-1][1];t+=Math.sqrt(dx*dx+dy*dy);}
  return t;
}
/* even spacing along a path — lets two traces be compared point-for-point */
function resampleN(pts,n){
  if(pts.length<2)return new Array(n).fill(pts[0]||[0,0]);
  var acc=[0],total=0;
  for(var i=1;i<pts.length;i++){
    var dx=pts[i][0]-pts[i-1][0],dy=pts[i][1]-pts[i-1][1];
    total+=Math.sqrt(dx*dx+dy*dy);acc.push(total);
  }
  if(total<=0)return new Array(n).fill(pts[0]);
  var out=[],j=1;
  for(var k=0;k<n;k++){
    var target=total*k/(n-1);
    while(j<acc.length-1&&acc[j]<target)j++;
    var seg=acc[j]-acc[j-1]||1,t=(target-acc[j-1])/seg;
    out.push([pts[j-1][0]+(pts[j][0]-pts[j-1][0])*t, pts[j-1][1]+(pts[j][1]-pts[j-1][1])*t]);
  }
  return out;
}
function evalStroke(guide,ink){
  if(ink.length<4)return {cov:0,acc:0,pass:false};
  var TH_COV=0.07,TH_ACC=0.09;   // tolerances re-tuned for the cursive letterforms
  function near(p,arr,th){
    for(var i=0;i<arr.length;i++){
      var dx=p[0]-arr[i][0],dy=p[1]-arr[i][1];
      if(dx*dx+dy*dy<th*th)return true;
    }
    return false;
  }
  var covHit=0;guide.forEach(function(g){if(near(g,ink,TH_COV))covHit++});
  var accHit=0;ink.forEach(function(p){if(near(p,guide,TH_ACC))accHit++});
  var cov=covHit/guide.length,acc=accHit/ink.length;
  /* Quality compares the two paths IN ORDER (resampled by length), not by
     nearest-point: cursive letters double back on themselves, and a
     nearest-point score let wobbly tracing sit on another part of the same
     curve and still look perfect. */
  var gg=resampleN(guide,40),ii=resampleN(ink,40),dSum=0;
  for(var k=0;k<40;k++){
    var dx=gg[k][0]-ii[k][0],dy=gg[k][1]-ii[k][1];
    dSum+=Math.sqrt(dx*dx+dy*dy);
  }
  var q=Math.max(0,1-(dSum/40)/0.075);
  /* length gate: a narrow oval can be half-traced and still "cover" itself
     within tolerance, so the stroke must actually be long enough to be it */
  var lg=pathLen(guide),li=pathLen(ink),ratio=lg>0?li/lg:0;
  /* tiny marks — the dot on i/j, the t crossbar — can't be held to full-letter
     precision; ask only that the mark lands in the right place */
  if(lg<0.09) return {cov:cov,acc:acc,q:Math.max(q,0.62),
    pass:acc>=0.5&&ratio>=0.25};   // no upper bound: a dot is shorter than the hand that makes it
  /* upper bound as absolute slack too: a shaky hand adds a similar amount of
     wander whatever the stroke, which would blow a pure ratio on short bars */
  var maxLen=Math.max(lg*2.4,lg+0.25);
  return {cov:cov,acc:acc,q:q,pass:cov>=0.72&&acc>=0.6&&ratio>=0.62&&li<=maxLen};
}

/* the card glyph IS the practice path — same data, same smoothing, so what you
   see on the card is exactly what you'll trace */
var _svgCache={};
function glyphSVG(l){
  if(_svgCache[l.ch])return _svgCache[l.ch];
  var d='',xs=[],ys=[];
  l.strokes.forEach(function(stk){
    var s=sampleStroke(stk);
    d+='M'+s.map(function(p){xs.push(p[0]);ys.push(p[1]);return p[0].toFixed(3)+' '+p[1].toFixed(3)}).join('L');
  });
  var x0=Math.min.apply(null,xs),x1=Math.max.apply(null,xs);
  var y0=Math.min.apply(null,ys),y1=Math.max.apply(null,ys);
  var pad=Math.max(x1-x0,y1-y0)*0.17;
  var vb=[(x0-pad).toFixed(3),(y0-pad).toFixed(3),(x1-x0+pad*2).toFixed(3),(y1-y0+pad*2).toFixed(3)].join(' ');
  var sw=(Math.max(x1-x0,y1-y0)*0.075).toFixed(4);
  var svg='<svg class="g" viewBox="'+vb+'" preserveAspectRatio="xMidYMid meet">'+
    '<path d="'+d+'" fill="none" stroke="currentColor" stroke-width="'+sw+'" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  _svgCache[l.ch]=svg;return svg;
}
function starStr(n){return n?'★★★'.slice(0,n):''}
function renderGrid(){
  var g=el('grid');g.innerHTML='';
  letterList().forEach(function(l){
    var d=document.createElement('button');d.className='lcard'+(stars[l.ch]?' done':'');
    d.innerHTML=glyphSVG(l)+'<span class="s">'+starStr(stars[l.ch]||0)+'</span>'+
      ((levels[l.ch]||0)>=MAXFADE?'<span class="pen" title="written from memory">✒️</span>':'');
    d.onclick=function(){openPractice(l);haptic('selection')};
    g.appendChild(d);
  });
  var tot=0;for(var k in stars)tot+=stars[k];
  el('starCount').textContent=tot;
}
el('tabLower').onclick=function(){tab='lowercase';el('tabLower').classList.add('on');el('tabUpper').classList.remove('on');renderGrid();haptic('selection')};
el('tabUpper').onclick=function(){tab='uppercase';el('tabUpper').classList.add('on');el('tabLower').classList.remove('on');renderGrid();haptic('selection')};

/* ---- practice canvas ---- */
var cv=el('pad'),ctx=cv.getContext('2d'),SZ=300,DPR=1;
function fitCanvas(){
  var w=el('wrap');
  var s=Math.min(w.clientWidth-28,w.clientHeight-16,430);
  DPR=Math.min(window.devicePixelRatio||1,2);
  SZ=Math.max(200,s);
  cv.width=Math.round(SZ*DPR);cv.height=Math.round(SZ*DPR);
  cv.style.width=SZ+'px';cv.style.height=SZ+'px';
}
function P(n){return n*SZ*DPR}
function guides(){
  var ys=tab==='lowercase'?[0.18,0.30,0.58,0.75]:[0.20,0.65];
  ctx.lineWidth=1*DPR;
  ys.forEach(function(y,i){
    ctx.strokeStyle=(y===0.58||y===0.65)?'rgba(80,70,60,.35)':'rgba(80,70,60,.14)';
    ctx.setLineDash(i===0||i===3?[4*DPR,5*DPR]:[]);
    ctx.beginPath();ctx.moveTo(P(0.04),P(y));ctx.lineTo(P(0.96),P(y));ctx.stroke();
  });
  ctx.setLineDash([]);
}
function drawGuidePath(){
  var f=FADE[fade];
  cur.strokes.forEach(function(stk,i){
    var s=sampleStroke(stk);
    var a=i<strokeIdx?0.55:(i===strokeIdx?0.5:0.22);
    ctx.strokeStyle=(i<strokeIdx?'rgba(62,184,172,':'rgba(150,140,130,')+(a*f).toFixed(3)+')';
    ctx.lineWidth=(i===strokeIdx?7:6)*DPR;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.beginPath();ctx.moveTo(P(s[0][0]),P(s[0][1]));
    for(var j=1;j<s.length;j++)ctx.lineTo(P(s[j][0]),P(s[j][1]));
    ctx.stroke();
  });
  /* entry dot: stays readable even at MEMORY so you know where to begin */
  if(strokeIdx<cur.strokes.length){
    var p0=cur.strokes[strokeIdx][0],da=Math.max(0.4,f);
    ctx.fillStyle='rgba(242,109,154,'+da.toFixed(2)+')';
    ctx.beginPath();ctx.arc(P(p0[0]),P(p0[1]),7*DPR,0,7);ctx.fill();
    ctx.fillStyle='rgba(242,109,154,'+(da*0.25).toFixed(2)+')';
    ctx.beginPath();ctx.arc(P(p0[0]),P(p0[1]),13*DPR,0,7);ctx.fill();
  }
}
/* your handwriting: finished strokes stay in ink, the live one draws on top */
function strokePath(pts,alpha){
  if(pts.length<2)return;
  ctx.strokeStyle='rgba(44,43,51,'+alpha+')';ctx.lineWidth=8*DPR;ctx.lineCap='round';ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(P(pts[0][0]),P(pts[0][1]));
  for(var i=1;i<pts.length;i++)ctx.lineTo(P(pts[i][0]),P(pts[i][1]));
  ctx.stroke();
}
function drawInk(){
  inkDone.forEach(function(s){strokePath(s,'1')});
  strokePath(ink,'1');
}
function paint(demoPt){
  ctx.clearRect(0,0,cv.width,cv.height);
  guides();drawGuidePath();drawInk();
  if(demoPt){ctx.fillStyle='#3eb8ac';ctx.beginPath();ctx.arc(P(demoPt[0]),P(demoPt[1]),8*DPR,0,7);ctx.fill();}
}

/* ---- demo animation: a pen-dot travels the active stroke ---- */
function demo(){
  if(!cur||strokeIdx>=cur.strokes.length)return;
  clearInterval(demoT);
  var s=sampleStroke(cur.strokes[strokeIdx]),i=0;
  el('pHint').textContent='Watch… then trace from the pink dot';
  demoT=setInterval(function(){
    if(i>=s.length){clearInterval(demoT);demoT=null;paint();el('pHint').textContent='Your turn — trace the grey stroke';return;}
    paint(s[i]);i++;
  },28);
}

/* ---- tracing ---- */
function pos(e){var r=cv.getBoundingClientRect();return [(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]}
cv.addEventListener('pointerdown',function(e){
  if(!cur||strokeIdx>=cur.strokes.length||demoT)return;
  drawing=true;ink=[pos(e)];cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove',function(e){
  if(!drawing)return;ink.push(pos(e));paint();
});
['pointerup','pointercancel'].forEach(function(ev){cv.addEventListener(ev,function(){
  if(!drawing)return;drawing=false;finishStroke();
})});
function finishStroke(){
  var guide=sampleStroke(cur.strokes[strokeIdx]);
  var r=evalStroke(guide,ink);
  if(r.pass){
    quals.push(r.q);
    inkDone.push(ink);          // your stroke stays on the page
    strokeIdx++;ink=[];
    haptic('success');
    if(strokeIdx>=cur.strokes.length)finishLetter();
    else{el('pHint').textContent='Lovely — next stroke from the pink dot';paint();}
  } else {
    haptic('warning');ink=[];
    el('pHint').textContent=r.cov<0.3?'Start at the pink dot and follow the grey stroke':'Close! Try that stroke once more';
    paint();
  }
}
function finishLetter(){
  var q=quals.reduce(function(a,b){return a+b},0)/quals.length;
  earned=q>=0.60?3:(q>=0.30?2:1);   // bands re-tuned for the order-aware metric
  var prev=stars[cur.ch]||0;
  if(earned>prev){stars[cur.ch]=earned;store.setItem('cursive.stars',JSON.stringify(stars));}
  if((levels[cur.ch]||0)<fade){levels[cur.ch]=fade;store.setItem('cursive.levels',JSON.stringify(levels));}
  el('pStars').textContent='★★★'.slice(0,earned)+'☆☆☆'.slice(0,3-earned);
  el('pHint').textContent=fade>=MAXFADE
    ?(earned===3?'Written from memory — beautiful!':'Written from memory. Well done!')
    :(earned===3?'Beautiful! Try it again with a fainter guide':'Nicely done — fade the guide and try again');
  el('btnNext').disabled=false;
  el('btnNext').textContent=fade>=MAXFADE?'Next letter':'Fainter ✎';
  toast(fade>=MAXFADE?'From memory!':(earned===3?'Beautiful!':'Well done!'));
  haptic('success');paint();renderGrid();
}

/* ---- flow ---- */
function openPractice(l){
  cur=l;strokeIdx=0;quals=[];ink=[];inkDone=[];earned=null;fade=0;
  el('practice').classList.add('on');
  el('pLetter').textContent=l.ch;
  el('pStars').textContent='';
  el('btnNext').disabled=true;el('btnNext').textContent='Fainter ✎';
  updFadeTag();
  fitCanvas();paint();demo();
}
/* same letter, fainter guide, clean page — the practice ladder */
function fainter(){
  fade=Math.min(MAXFADE,fade+1);
  strokeIdx=0;quals=[];ink=[];inkDone=[];earned=null;
  el('pStars').textContent='';el('btnNext').disabled=true;el('btnNext').textContent='Fainter ✎';
  el('pHint').textContent=fade>=MAXFADE?'No guide now — write it from memory':'Fainter guide — trace from the pink dot';
  updFadeTag();paint();haptic('success');
}
function updFadeTag(){
  el('fadeTag').innerHTML='GUIDE<br><b>'+FADE_NAME[fade]+'</b>';
}
function nextLetter(){
  var list=letterList(),i=list.indexOf(cur);
  openPractice(list[(i+1)%list.length]);haptic('selection');
}
el('pClose').onclick=function(){clearInterval(demoT);demoT=null;el('practice').classList.remove('on');haptic('light')};
el('btnDemo').onclick=function(){if(!demoT)demo()};
el('btnClear').onclick=function(){strokeIdx=0;quals=[];ink=[];inkDone=[];earned=null;
  el('btnNext').disabled=true;el('pStars').textContent='';paint();if(fade===0)demo();haptic('light')};
el('btnNext').onclick=function(){ (earned!==null&&fade<MAXFADE)?fainter():nextLetter(); };
var toastT=null;
function toast(t){var x=el('toast');x.textContent=t;x.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){x.classList.remove('on')},1300)}
window.addEventListener('resize',function(){if(cur){fitCanvas();paint();}});

store.getItem('cursive.stars').then(function(v){
  if(v)try{stars=JSON.parse(v)||{}}catch(e){}
  return store.getItem('cursive.levels');
}).then(function(v){
  if(v)try{levels=JSON.parse(v)||{}}catch(e){}
  renderGrid();
});
</script>
</body></html>
