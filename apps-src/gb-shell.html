<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pocket Player</title>
<style>
  :root{
    --accent: var(--myllm-accent, #4caf6e);
    --bg:#0c0d12; --panel:#15171f; --panel2:#1d2030; --text:#eef0f6; --muted:#9aa0b4; --line:rgba(255,255,255,.10);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
  html,body{ margin:0; height:100%; overflow:hidden; }
  body{ background:var(--bg); color:var(--text);
    font-family:var(--myllm-font,-apple-system,system-ui,'Segoe UI',Roboto,sans-serif);
    display:flex; flex-direction:column; padding-top:env(safe-area-inset-top); }
  .top{ display:flex; align-items:center; gap:10px; padding:10px 14px; }
  .top h1{ font-size:16px; margin:0; font-weight:800; letter-spacing:.2px; }
  .top .sp{ flex:1; }
  .load{ font:inherit; font-weight:700; font-size:14px; color:#fff; background:var(--accent);
    border:0; border-radius:10px; padding:9px 14px; cursor:pointer; }
  .load input{ display:none; }
  .screen-wrap{ flex:1; display:flex; align-items:center; justify-content:center; min-height:0; background:#000;
    margin:0 0 6px; position:relative; }
  canvas{ image-rendering:pixelated; image-rendering:crisp-edges; width:100%; height:auto;
    max-width:100%; max-height:100%; display:block; background:#000; }
  .hint{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:10px; text-align:center; color:var(--muted); font-size:14px; padding:24px; }
  .hint b{ color:var(--text); font-size:16px; }
  body.playing .hint{ display:none; }
  .status{ min-height:18px; text-align:center; color:var(--muted); font-size:12px; padding:0 14px 4px; }
  /* Controls */
  .pad{ display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:10px;
    padding:8px 16px calc(14px + env(safe-area-inset-bottom)); }
  .dpad{ position:relative; width:140px; height:140px; }
  .dpad .d{ position:absolute; width:48px; height:48px; background:var(--panel2); color:var(--muted);
    border:1px solid var(--line); font-size:16px; display:flex; align-items:center; justify-content:center; }
  .dpad .up{ top:0; left:46px; border-radius:10px 10px 0 0; }
  .dpad .down{ bottom:0; left:46px; border-radius:0 0 10px 10px; }
  .dpad .left{ left:0; top:46px; border-radius:10px 0 0 10px; }
  .dpad .right{ right:0; top:46px; border-radius:0 10px 10px 0; }
  .mid{ display:flex; flex-direction:column; gap:8px; }
  .sm{ font:inherit; font-weight:700; font-size:11px; letter-spacing:.5px; color:var(--muted);
    background:var(--panel2); border:1px solid var(--line); border-radius:20px; padding:8px 14px; }
  .ab{ display:flex; align-items:center; gap:14px; justify-self:end; }
  .ab-btn{ width:64px; height:64px; border-radius:50%; font:inherit; font-weight:800; font-size:22px; color:#fff;
    background:var(--accent); border:0; box-shadow:0 4px 0 rgba(0,0,0,.35); }
  .ab-btn:last-child{ transform:translateY(-14px); }
  button{ cursor:pointer; }
  button.on{ filter:brightness(1.4); }
  @media (min-width:768px){
    body{ max-width:760px; margin:0 auto; }
    .ab-btn{ width:76px; height:76px; font-size:26px; }
    .dpad{ width:168px; height:168px; }
    .dpad .d{ width:58px; height:58px; }
    .dpad .up,.dpad .down{ left:55px; } .dpad .left,.dpad .right{ top:55px; }
  }
</style>
</head>
<body>
<div class="top">
  <h1>Pocket Player</h1>
  <span class="sp"></span>
  <label class="load">Load ROM<input id="file" type="file" accept=".gb,.gbc,.zip,application/zip,application/octet-stream"></label>
</div>

<div class="screen-wrap">
  <canvas id="screen" width="160" height="144"></canvas>
  <div class="hint">
    <b>Bring your own ROM</b>
    <div>Tap <b>Load ROM</b> and pick a <b>.gb</b> or <b>.gbc</b> (or a <b>.zip</b> containing one) you own.<br>Classic handheld <i>and</i> Color games, in colour. No games are included — this is just the player.</div>
  </div>
</div>
<div class="status" id="status"></div>

<div class="pad">
  <div class="dpad">
    <button class="d up"    data-btn="UP" aria-label="Up">▲</button>
    <button class="d down"  data-btn="DOWN" aria-label="Down">▼</button>
    <button class="d left"  data-btn="LEFT" aria-label="Left">◀</button>
    <button class="d right" data-btn="RIGHT" aria-label="Right">▶</button>
  </div>
  <div class="mid">
    <button class="sm" data-btn="SELECT">SELECT</button>
    <button class="sm" data-btn="START">START</button>
  </div>
  <div class="ab">
    <button class="ab-btn" data-btn="B">B</button>
    <button class="ab-btn" data-btn="A">A</button>
  </div>
</div>

<!-- binjgb (MIT, Ben Smith) Emscripten loader: sets global async factory `Binjgb`. -->
<script>/*__BINJGB__*/</script>
<!-- fflate (.zip extraction) -->
<script>/*__FFLATE__*/</script>
<!-- binjgb core wasm, base64-inlined so the player is fully offline -->
<script>window.BINJGB_WASM_B64="/*__WASM_B64__*/";</script>
<script>
(function(){
  var GB_W=160, GB_H=144;
  var FRAME_BYTES=GB_W*GB_H*4;          // 92160, RGBA8888
  var PPU_FRAME_TICKS=70224;            // ticks per video frame
  var EVENT_NEW_FRAME=0x1, EVENT_AUDIO_BUFFER_FULL=0x2, EVENT_UNTIL_TICKS=0x4;
  var CGB_COLOR_CURVE_GAMBATTE=2;       // 0=NONE,1=SAMEBOY,2=GAMBATTE
  var AUDIO_FRAMES=2048;                // stereo pairs per AUDIO_BUFFER_FULL

  var canvas=document.getElementById('screen'), ctx=canvas.getContext('2d');
  var img=ctx.createImageData(GB_W,GB_H);
  function status(m){ document.getElementById('status').textContent=m||''; }

  // Inlined core missing/incomplete? Say so instead of dying silently.
  if(typeof Binjgb==='undefined'){
    status('Emulator core didn’t load — the app likely updated incompletely. Delete this app and re-install it from the gallery.');
    var fb0=document.getElementById('file');
    if(fb0) fb0.addEventListener('change', function(){ status('Please delete and re-install the app first — the emulator core is missing.'); });
    return;
  }

  // --- Audio: same ring buffer the NES shell uses; MyLLMos's .playback session
  //     makes WebAudio audible. binjgb resamples PCM to our AudioContext rate. ---
  var AC=window.AudioContext||window.webkitAudioContext;
  var actx=AC?new AC():null, RATE=actx?actx.sampleRate:44100;
  var RB=16384, aL=new Float32Array(RB), aR=new Float32Array(RB), aw=0, ar=0;
  function audioPush(l,r){ aL[aw]=l; aR[aw]=r; aw=(aw+1)%RB; }
  if(actx){
    var sp=actx.createScriptProcessor(1024,0,2);
    sp.onaudioprocess=function(e){
      var l=e.outputBuffer.getChannelData(0), r=e.outputBuffer.getChannelData(1);
      for(var i=0;i<l.length;i++){
        if(ar!==aw){ l[i]=aL[ar]; r[i]=aR[ar]; ar=(ar+1)%RB; } else { l[i]=0; r[i]=0; }
      }
    };
    sp.connect(actx.destination);
  }
  function resumeAudio(){ try{ if(actx && actx.state==='suspended') actx.resume(); }catch(e){} }

  // ============================================================================
  // GBCore — binjgb adapter (jsnes-style contract: WE own canvas/audio/input).
  // All export names verified against the live binjgb.js export table.
  // ============================================================================
  function decodeWasmBase64(b64){
    var bin=atob(b64), u8=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
    return u8;
  }
  function GBCore(Module, sampleRate){
    this.m=Module; this.sampleRate=sampleRate|0; this.audioFrames=AUDIO_FRAMES;
    this.e=0; this.romPtr=0; this.romSize=0; this._romCopy=null;
    this._fbPtr=0; this._fbSize=0; this._auPtr=0; this._auCapBytes=0; this._audioOut=[];
  }
  GBCore.create=function(wasmBytes, sampleRate){
    // wasmBinary => plain WebAssembly.instantiate (no fetch/stream, no SAB). Offline.
    return Binjgb({ wasmBinary:wasmBytes, locateFile:function(p){return p;},
                    print:function(){}, printErr:function(){} })
      .then(function(Module){ return new GBCore(Module, sampleRate); });
  };
  GBCore.prototype._destroyEmu=function(){
    if(this.e){ this.m._emulator_delete(this.e); this.e=0; }
    if(this.romPtr){ this.m._free(this.romPtr); this.romPtr=0; }
    this._audioOut.length=0;
  };
  GBCore.prototype.load=function(romBytes){
    this._destroyEmu();
    var rom=(romBytes instanceof Uint8Array)?romBytes:new Uint8Array(romBytes);
    var size=(rom.byteLength+0x7fff)&~0x7fff;           // align up to 32K (binjgb req)
    var ptr=this.m._malloc(size);
    new Uint8Array(this.m.HEAPU8.buffer, ptr, size).fill(0).set(rom);
    var e=this.m._emulator_new_simple(ptr, size, this.sampleRate, this.audioFrames, CGB_COLOR_CURVE_GAMBATTE);
    if(e===0){ this.m._free(ptr); throw new Error('Invalid or unsupported ROM'); }
    this.e=e; this.romPtr=ptr; this.romSize=size; this._romCopy=rom.slice();
    this._fbPtr=this.m._get_frame_buffer_ptr(e);
    this._fbSize=this.m._get_frame_buffer_size(e);        // == 92160
    this._auPtr=this.m._get_audio_buffer_ptr(e);
    this._auCapBytes=this.m._get_audio_buffer_capacity(e);// == 2*audioFrames bytes
  };
  GBCore.prototype.runFrame=function(outRGBA){
    if(!this.e) return false;
    var m=this.m, e=this.e, target=m._emulator_get_ticks_f64(e)+PPU_FRAME_TICKS;
    var gotFrame=false, guard=0;
    while(guard++<16){
      var event=m._emulator_run_until_f64(e, target);
      if(event & EVENT_AUDIO_BUFFER_FULL) this._drainAudio();
      if(event & EVENT_NEW_FRAME) gotFrame=true;
      if(event & EVENT_UNTIL_TICKS){ if(m._emulator_get_ticks_f64(e)>=target) break; }
    }
    outRGBA.set(new Uint8Array(m.HEAPU8.buffer, this._fbPtr, this._fbSize)); // RGBA already
    return gotFrame;
  };
  GBCore.prototype._drainAudio=function(){
    var m=this.m, capBytes=this._auCapBytes; if(capBytes<=0) return;
    var src=new Uint8Array(m.HEAPU8.buffer, this._auPtr, capBytes), frames=capBytes>>1;
    var left=new Float32Array(frames), right=new Float32Array(frames);
    for(var i=0,j=0;i<frames;i++,j+=2){ left[i]=(src[j]-128)/128; right[i]=(src[j+1]-128)/128; }
    this._audioOut.push({left:left,right:right});
  };
  GBCore.prototype.pullAudio=function(){
    if(this._audioOut.length===0) return null;
    if(this._audioOut.length===1){ var c=this._audioOut.shift(); return {left:c.left,right:c.right}; }
    var total=0,k; for(k=0;k<this._audioOut.length;k++) total+=this._audioOut[k].left.length;
    var left=new Float32Array(total), right=new Float32Array(total), off=0;
    for(k=0;k<this._audioOut.length;k++){ var ch=this._audioOut[k]; left.set(ch.left,off); right.set(ch.right,off); off+=ch.left.length; }
    this._audioOut.length=0; return {left:left,right:right};
  };
  GBCore.prototype.setButton=function(name, pressed){
    if(!this.e) return; var m=this.m, e=this.e, on=pressed?1:0;
    switch(String(name).toLowerCase()){
      case 'up': m._set_joyp_up(e,on); break;
      case 'down': m._set_joyp_down(e,on); break;
      case 'left': m._set_joyp_left(e,on); break;
      case 'right': m._set_joyp_right(e,on); break;
      case 'a': m._set_joyp_A(e,on); break;   // A/B exports are UPPERCASE
      case 'b': m._set_joyp_B(e,on); break;
      case 'start': m._set_joyp_start(e,on); break;
      case 'select': m._set_joyp_select(e,on); break;
    }
  };
  GBCore.prototype.reset=function(){ if(this._romCopy) this.load(this._romCopy); };

  // --- Boot the core (async), then the file picker is live --------------------
  var core=null, running=false;
  GBCore.create(decodeWasmBase64(window.BINJGB_WASM_B64), RATE).then(function(c){
    core=c;
  }).catch(function(err){
    status('Couldn’t start the emulator core: '+((err&&err.message)||err));
  });

  function loop(){ if(!running) return;
    try{
      if(core.runFrame(img.data)) ctx.putImageData(img,0,0);
      var a=core.pullAudio(); if(a){ for(var i=0;i<a.left.length;i++) audioPush(a.left[i], a.right[i]); }
    }catch(e){ running=false; status('Emulation stopped: '+((e&&e.message)||e)); return; }
    requestAnimationFrame(loop);
  }

  function startROM(bytes){
    if(!core){ status('Still starting up — tap Load ROM again in a moment.'); return; }
    try{ core.load(bytes); }catch(e){ status('That doesn’t look like a valid Game Boy ROM.'); return; }
    running=true; resumeAudio(); document.body.classList.add('playing'); status('');
    requestAnimationFrame(loop);
  }

  document.getElementById('file').addEventListener('change', function(e){
    var f=e.target.files && e.target.files[0]; if(!f) return;
    resumeAudio(); status('Loading '+f.name+'…');
    var rd=new FileReader();
    rd.onload=function(ev){
      try{
        var bytes=new Uint8Array(ev.target.result);
        // ZIP? (local-file-header magic "PK\x03\x04") — extract the first .gb/.gbc.
        if(bytes.length>4 && bytes[0]===0x50 && bytes[1]===0x4B && (bytes[2]===0x03||bytes[2]===0x05||bytes[2]===0x07)){
          if(!window.fflate || !fflate.unzipSync){ status('Couldn’t unzip — load the ROM directly.'); return; }
          var entries=fflate.unzipSync(bytes), romName=null;
          for(var nm in entries){ if(/\.gbc$/i.test(nm)){ romName=nm; break; } }      // prefer Color
          if(!romName){ for(var nm2 in entries){ if(/\.gb$/i.test(nm2)){ romName=nm2; break; } } }
          if(!romName){ status('No .gb/.gbc ROM found inside that .zip.'); return; }
          bytes=entries[romName];
          status('Loaded '+romName.split('/').pop()+'…');
        }
        startROM(bytes);
      }catch(err){ status('Couldn’t read that file: '+((err&&err.message)||err)); }
    };
    rd.onerror=function(){ status('Couldn’t read that file.'); };
    rd.readAsArrayBuffer(f);
  });

  // --- Controls (touch + mouse + keyboard) ---
  function bind(el){
    var name=el.getAttribute('data-btn');
    var downAt=0, relT=null;
    function dn(e){ if(e.cancelable) e.preventDefault(); resumeAudio();
      if(relT){ clearTimeout(relT); relT=null; }
      if(core) core.setButton(name, true); el.classList.add('on'); downAt=Date.now(); }
    // Minimum hold: a fast tap can fire down+up inside one emulated frame, so the
    // press is never seen. Keep it held ~90ms (≈5 frames) before release.
    function up(e){ if(e&&e.cancelable) e.preventDefault(); el.classList.remove('on');
      var rel=function(){ relT=null; if(core) core.setButton(name, false); };
      var held=Date.now()-downAt, MIN=90;
      if(held>=MIN){ rel(); } else { if(relT) clearTimeout(relT); relT=setTimeout(rel, MIN-held); } }
    el.addEventListener('touchstart',dn,{passive:false});
    el.addEventListener('touchend',up,{passive:false});
    el.addEventListener('touchcancel',up,{passive:false});
    el.addEventListener('mousedown',dn);
    el.addEventListener('mouseup',up);
    el.addEventListener('mouseleave',function(e){ if(el.classList.contains('on')) up(e); });
    el.addEventListener('contextmenu',function(e){ e.preventDefault(); });
  }
  [].forEach.call(document.querySelectorAll('[data-btn]'), bind);

  var KMAP={ArrowUp:'UP',ArrowDown:'DOWN',ArrowLeft:'LEFT',ArrowRight:'RIGHT',KeyZ:'B',KeyX:'A',KeyA:'B',KeyS:'A',Enter:'START',ShiftRight:'SELECT',ShiftLeft:'SELECT',Backspace:'SELECT'};
  document.addEventListener('keydown',function(e){ var k=KMAP[e.code]; if(k){ e.preventDefault(); resumeAudio(); if(core) core.setButton(k, true); }});
  document.addEventListener('keyup',function(e){ var k=KMAP[e.code]; if(k){ e.preventDefault(); if(core) core.setButton(k, false); }});

  // Pause the loop when backgrounded; resume on return.
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState==='hidden'){ running=false; }
    else if(core && document.body.classList.contains('playing') && !running){ running=true; requestAnimationFrame(loop); }
  });
})();
</script>
</body>
</html>
