<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>:root{color-scheme:light dark;--accent:#5e5ce6}
*{box-sizing:border-box}
body{font-family:-apple-system,system-ui,sans-serif;margin:0;padding:0;background:#f2f2f7;color:#111}
@media(prefers-color-scheme:dark){body{background:#000;color:#eee}.head{background:rgba(20,20,22,.92)}.item{background:#1c1c1e}.tab{color:#888}}
.head{position:sticky;top:0;background:rgba(242,242,247,.92);backdrop-filter:saturate(180%) blur(12px);padding:14px 16px 0;z-index:5}
h1{font-size:20px;margin:0}
.date{font-size:13px;opacity:.6;margin:2px 0 8px}
.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:10px}
.tab{flex:none;padding:7px 14px;border-radius:18px;background:none;color:#777;font-size:14px;font-weight:600;border:0;white-space:nowrap}
.tab.on{background:var(--accent);color:#fff}
.wrap{padding:6px 16px 24px}
.item{background:#fff;border-radius:13px;padding:12px 14px;margin-bottom:9px;box-shadow:0 1px 3px rgba(0,0,0,.07);display:flex;gap:12px}
.year{font-size:15px;font-weight:800;color:var(--accent);min-width:46px}
.txt{flex:1;min-width:0;font-size:14.5px;line-height:1.45}
.txt a{color:inherit;text-decoration:none}
.thumb{width:52px;height:52px;border-radius:8px;object-fit:cover;flex:none}
#status{padding:16px;text-align:center;font-size:14px;opacity:.7}
</style></head><body>
<div class="head"><h1>📜 On This Day</h1><div class="date" id="date"></div><div class="tabs" id="tabs"></div></div>
<div id="status"></div>
<div class="wrap" id="wrap"></div>
<script>
var TABS=[['Events','events'],['Births','births'],['Deaths','deaths'],['Holidays','holidays']];
var active=0,data=null;
function el(i){return document.getElementById(i)}
function setStatus(t){var s=el('status');s.style.display=t?'block':'none';s.textContent=t||''}
var now=new Date();
var MM=String(now.getMonth()+1).padStart(2,'0'),DD=String(now.getDate()).padStart(2,'0');
el('date').textContent=now.toLocaleDateString(undefined,{month:'long',day:'numeric'});

function renderTabs(){var T=el('tabs');T.innerHTML='';TABS.forEach(function(t,i){var b=document.createElement('button');b.className='tab'+(i===active?' on':'');b.textContent=t[0];b.onclick=function(){active=i;render()};T.appendChild(b)})}

function loadAll(){
  if(!window.myllmFetch){setStatus('This app needs network access — enable it in Settings.');return}
  setStatus('Looking up '+el('date').textContent+'…');
  myllmFetch('https://api.wikimedia.org/feed/v1/wikipedia/en/onthisday/all/'+MM+'/'+DD,
    {headers:{'Api-User-Agent':'MyLLMos/1.0 (https://opticell-limited.com/myllm)'}})
  .then(function(r){
    if(!r||!r.ok)throw new Error('HTTP '+((r&&r.status)||'?'));
    data=JSON.parse(r.body);setStatus('');render();
  }).catch(function(e){setStatus('Couldn’t load history: '+e.message)});
}

function render(){
  renderTabs();var W=el('wrap');W.innerHTML='';if(!data)return;
  var list=(data[TABS[active][1]]||[]).slice();
  list.sort(function(a,b){return (b.year||0)-(a.year||0)});
  if(!list.length){W.innerHTML='<div style="opacity:.5;text-align:center;padding:30px">Nothing listed for today.</div>';return}
  list.forEach(function(ev){
    var page=ev.pages&&ev.pages[0];
    var url=page&&page.content_urls&&page.content_urls.desktop&&page.content_urls.desktop.page;
    var thumb=page&&page.thumbnail&&page.thumbnail.source;
    var c=document.createElement('div');c.className='item';
    var inner='<div class="year">'+(ev.year?ev.year:'•')+'</div><div class="txt">'+
      (url?'<a href="'+url+'" target="_top" rel="noopener">'+esc(ev.text)+'</a>':esc(ev.text))+'</div>';
    if(thumb)inner+='<img class="thumb" src="'+esc(thumb)+'" alt="" loading="lazy" onerror="this.remove()">';
    c.innerHTML=inner;W.appendChild(c);
  });
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
renderTabs();loadAll();
</script></body></html>
