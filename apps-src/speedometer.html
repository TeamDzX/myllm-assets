<title>Speedometer</title>
<style>
:root{--build-id:"74b2300b0a";color-scheme:light dark;--ok:#5fd08a;--warn:#ffd23f;--bad:#ff6b60;--acc:#ffb04c}
@property --h{ syntax:'<number>'; inherits:true; initial-value:36; }
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--myllm-font,-apple-system,system-ui,sans-serif);color:#fff;background:#0b0b10;
  position:fixed;inset:0;width:100%;height:100dvh;overflow:hidden;user-select:none;-webkit-user-select:none}

/* The stage: an amber instrument that shifts hue with speed — warm at rest,
   through gold at road speed, to a cool blue at the top of the range. Two
   layers, dark and light, so the change between them can fade. */
.stage{position:absolute;inset:0;--h:36;transition:--h 1.2s ease;color:#fff;display:flex;flex-direction:column}
.bg{position:absolute;inset:0;transition:opacity .6s ease}
.bg.d{background:radial-gradient(120% 90% at 20% 10%,hsl(var(--h) 70% 30%),transparent 60%),
  radial-gradient(120% 90% at 85% 95%,hsl(calc(var(--h) + 40) 62% 24%),transparent 62%),#0b0b10}
.bg.l{opacity:0;background:radial-gradient(120% 90% at 20% 0%,hsl(var(--h) 85% 84%),transparent 60%),
  radial-gradient(120% 90% at 85% 100%,hsl(calc(var(--h) + 40) 78% 87%),transparent 62%),#f4f4f8}
.lite{color:#15151a}.lite .bg.l{opacity:1}.lite .bg.d{opacity:0}
.stage>*:not(.bg){position:relative}
.glass{border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.12);color:inherit;
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.lite .glass{border-color:rgba(0,0,0,.09);background:rgba(255,255,255,.62)}
svg.i{width:1.25em;height:1.25em;fill:currentColor;flex-shrink:0}
button{font:inherit}button:active{transform:scale(.96)}

.top{display:flex;align-items:center;gap:10px;flex-shrink:0;
  padding:calc(12px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 0 calc(16px + env(safe-area-inset-left))}
.top .lbl{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.62;flex:1}
.gps{height:36px;border-radius:99px;padding:0 13px 0 11px;display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:800;letter-spacing:.06em}
.gpsdot{width:9px;height:9px;border-radius:50%;background:rgba(128,128,140,.6);flex-shrink:0}
.gpsdot.ok{background:var(--ok);box-shadow:0 0 8px rgba(95,208,138,.7)}
.gpsdot.mid{background:var(--warn)}
.gpsdot.bad{background:var(--bad)}
/* the app is never silently doing nothing: while it's hunting for a fix the dot
   breathes, so "connecting" never looks like "broken" */
.gpsdot.search{background:var(--warn);animation:breathe 1.2s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.22;transform:scale(.75)}50%{opacity:1;transform:scale(1.3)}}
.rnd{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}

#gaugeWrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;padding:0 12px;position:relative}
#gaugeWrap canvas{max-height:calc(100% - 8px)}
canvas{max-width:100%;display:block}
.readout{position:absolute;left:0;right:0;top:50%;transform:translateY(-44%);text-align:center;pointer-events:none}
.speed{font-size:var(--sp,86px);min-height:1em;font-weight:900;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.03em;
  text-shadow:0 0 30px hsl(var(--h) 90% 60% / .35);transition:opacity .35s}
.lite .speed{text-shadow:none}
/* a reading older than a few seconds is dimmed rather than shown as if live */
.readout.stale .speed{opacity:.35;text-shadow:none}
.unitlbl{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.6;margin-top:4px}
.vehicle{font-size:14px;opacity:.75;font-weight:700;min-height:20px;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:7px}
.vehicle svg{font-size:18px;opacity:.9}

.lower{flex-shrink:0;padding:6px calc(14px + env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left))}
.lowerin{max-width:560px;margin:0 auto}
.units{display:flex;gap:7px;justify-content:center;margin:0 0 10px}
.uchip{height:36px;border-radius:99px;padding:0 15px;font-size:13px;font-weight:700}
.uchip.on{background:#fff;border-color:#fff;color:#0b0b10}
.lite .uchip.on{background:#15151a;border-color:#15151a;color:#fff}
.best{text-align:center;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.7;min-height:14px;margin-bottom:8px;font-variant-numeric:tabular-nums}
.trip{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tcell{border-radius:16px;padding:10px 6px;text-align:center}
.tcell .v{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
.tcell .l{font-size:9.5px;letter-spacing:.12em;opacity:.6;font-weight:800;margin-top:2px}
.hint{text-align:center;font-size:12px;opacity:.65;padding:8px 10px 2px;line-height:1.45;min-height:22px}
.bar{display:flex;gap:9px;margin-top:8px}
.btn{flex:1;height:52px;border-radius:99px;font-size:15.5px;font-weight:750;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.go{background:#fff;color:#0b0b10;border:0;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.lite .btn.go{background:#15151a;color:#fff;box-shadow:0 10px 26px rgba(20,20,40,.22)}
.btn.stop{background:rgba(255,107,96,.85);border-color:transparent;color:#fff}
.lite .btn.stop{background:#d8452f;color:#fff}

/* Dock: true black, the number and nothing else, drifting a little every
   minute so nothing burns in. For a phone on a dash mount. */
.dock{display:none;position:fixed;inset:0;z-index:60;background:#000;color:#fff;overflow:hidden}
.dock.on{display:block}
.dock .drift{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:0 24px;text-align:center;transition:transform 2s ease}
.dock .dspeed{font-size:min(44vw,44vh,300px);font-weight:200;letter-spacing:-.02em;line-height:1;color:#c9c9cf;font-variant-numeric:tabular-nums}
.dock .dspeed.stale{color:#55555c}
.dock .dunit{font-size:14px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#5d5d66}
.dock .dgps{font-size:12px;font-weight:700;letter-spacing:.08em;color:#4a4a52;margin-top:10px;display:flex;align-items:center;gap:8px}
.dock .dgps .gpsdot{opacity:.8}
.dock .ctl{position:absolute;left:0;right:0;bottom:calc(30px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:12px;opacity:0;pointer-events:none;transition:opacity .3s}
.dock .ctl.on{opacity:1;pointer-events:auto}
.dock .ctl button{border:1px solid #2c2c33;background:#121216;color:#eee;border-radius:99px;padding:12px 22px;font-size:15px;font-weight:700;display:inline-flex;align-items:center;gap:8px}
.dock .dhint{position:absolute;bottom:calc(34px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-size:12px;color:#4a4a52;transition:opacity .6s}

@media (max-height:520px){                      /* on its side on a dash: gauge left, trip right */
  .stage{display:grid;grid-template-columns:minmax(0,1fr) min(46%,360px);grid-template-rows:auto minmax(0,1fr)}
  .top{grid-column:1 / 3}
  #gaugeWrap{grid-column:1;grid-row:2;padding-bottom:8px}
  .lower{grid-column:2;grid-row:2;display:flex;flex-direction:column;justify-content:center;padding-top:0}
  .trip{grid-template-columns:repeat(2,1fr)} .readout{transform:translateY(-44%)}
  .btn{font-size:14px;padding:0 6px;white-space:nowrap}
}
@media (prefers-reduced-motion:reduce){.gpsdot.search{animation:none;opacity:1}.stage,.bg{transition:none}.dock .drift{transition:none}}
</style></head><body>

<div class="stage" id="app">
  <div class="bg d"></div><div class="bg l"></div>
  <div class="top">
    <div class="lbl">Speedometer</div>
    <div class="glass gps"><span class="gpsdot" id="gpsDot"></span><span id="gpsTxt">GPS off</span></div>
    <button class="glass rnd" id="dockBtn" aria-label="Dash mode"><svg class="i"><use href="#i-moon"/></svg></button>
  </div>
  <div id="gaugeWrap">
    <canvas id="gauge"></canvas>
    <div class="readout">
      <div class="speed" id="speedV">0</div>
      <div class="unitlbl" id="unitLbl">km/h</div>
      <div class="vehicle" id="vehicle"></div>
    </div>
  </div>
  <div class="lower"><div class="lowerin">
    <div class="units" id="units"></div>
    <div class="best" id="best"></div>
    <div class="trip">
      <div class="tcell glass"><div class="v" id="tDist">0.0</div><div class="l" id="tDistU">KM</div></div>
      <div class="tcell glass"><div class="v" id="tAvg">0</div><div class="l">AVG</div></div>
      <div class="tcell glass"><div class="v" id="tMax">0</div><div class="l">MAX</div></div>
      <div class="tcell glass"><div class="v" id="tTime">0:00</div><div class="l">MOVING</div></div>
    </div>

    <div class="bar">
      <button class="btn glass" id="resetBtn"><svg class="i"><use href="#i-reset"/></svg>Reset trip</button>
      <button class="btn go" id="goBtn"><svg class="i"><use href="#i-play"/></svg>Start</button>
    </div>
  </div></div>
</div>

<div class="dock" id="dock">
  <div class="drift" id="dDrift">
    <div class="dspeed" id="dSpeed">0</div>
    <div class="dunit" id="dUnit">km/h</div>
    <div class="dgps"><span class="gpsdot" id="dDot"></span><span id="dTxt"></span></div>
  </div>
  <div class="dhint" id="dHint">Tap for controls</div>
  <div class="ctl" id="dCtl">
    <button id="dGo"><svg class="i"><use href="#i-pause"/></svg><span>Pause</span></button>
    <button id="dExit"><svg class="i"><use href="#i-close"/></svg>Exit dash mode</button>
  </div>
</div>

<script>
"use strict";
function el(i){return document.getElementById(i)}
/* Bridges are looked up when used, never kept: MyLLM can add them after this
   script has run. */
var store={getItem:function(k){var s=window.myllmStorage;return s?s.getItem(k).catch(function(){return null}):Promise.resolve(null)},
           setItem:function(k,v){var s=window.myllmStorage;if(s)try{s.setItem(k,v).catch(function(){})}catch(e){}}};
function haptic(k){if(window.myllmHaptic)try{myllmHaptic(k||'light')}catch(e){}}

/* ================= speed engine (pure — harness-tested) ================= */
var R=6371000;
function haversine(a,b){
  var dLat=(b.lat-a.lat)*Math.PI/180,dLon=(b.lon-a.lon)*Math.PI/180;
  var la=a.lat*Math.PI/180,lb=b.lat*Math.PI/180;
  var h=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(la)*Math.cos(lb)*Math.sin(dLon/2)*Math.sin(dLon/2);
  return 2*R*Math.asin(Math.min(1,Math.sqrt(h)));
}
var MAX_MS=340;           // ~1220 km/h sanity ceiling (fast jet); beyond = GPS glitch
var ACC_LIMIT=35;         // metres — ignore sloppy fixes
function makeEngine(){
  return {fixes:[],ema:null,dist:0,movingMs:0,maxMs:0,peakMs:0};
}
/* Coverage hole (tunnel, underground, backgrounded app): drop the window so the
   first fix on the far side can't be paired with one from before the gap — that
   would derive a fictional speed and teleport the trip distance. Trip totals and
   peak survive; only the derivation state is forgotten. */
function resetWindow(en){en.fixes=[];en.ema=null;}
/* the gauge follows a DECAYING peak, not the trip max: it grows instantly when
   you speed up, then eases back ~12%/s so a plane's 0-1000 scale returns to
   something readable within half a minute of landing */
function decayPeak(en,dtMs){
  var v=en.ema||0;
  if(v>en.peakMs)en.peakMs=v;
  else if(dtMs>0)en.peakMs=Math.max(v,en.peakMs*Math.pow(0.88,dtMs/1000));
}
/* feed one fix {lat,lon,acc,t(ms),vNative(m/s or -1)}; returns speed m/s or null */
function feed(en,fix){
  var prev=en.fixes.length?en.fixes[en.fixes.length-1]:null;
  en.fixes.push(fix);
  if(en.fixes.length>10)en.fixes.shift();
  var v=null;
  if(fix.vNative!=null&&fix.vNative>=0){
    v=Math.min(MAX_MS,fix.vNative);
  } else if(fix.acc<=ACC_LIMIT){
    /* windowed derivation: oldest good fix 4–9s back smooths poll-latency jitter */
    var base=null;
    for(var i=0;i<en.fixes.length-1;i++){
      var f=en.fixes[i];
      if(f.acc<=ACC_LIMIT&&fix.t-f.t>=4000&&fix.t-f.t<=9500){base=f;break;}
    }
    if(base){
      var d=haversine({lat:base.lat,lon:base.lon},{lat:fix.lat,lon:fix.lon});
      var raw=d/((fix.t-base.t)/1000);
      if(raw<=MAX_MS)v=raw;
    }
  }
  if(v!=null){
    if(v<0.6)v=0;                      // GPS drift while standing reads as zero
    en.ema=en.ema==null?v:en.ema+(v-en.ema)*0.45;
    if(en.ema<0.3)en.ema=0;
    if(en.ema>en.maxMs)en.maxMs=en.ema;
  }
  decayPeak(en,prev?(fix.t-prev.t):0);
  /* trip accumulation between consecutive good fixes */
  if(prev&&prev.acc<=ACC_LIMIT&&fix.acc<=ACC_LIMIT){
    var dt=(fix.t-prev.t)/1000;
    if(dt>0&&dt<15){
      var seg=haversine({lat:prev.lat,lon:prev.lon},{lat:fix.lat,lon:fix.lon});
      var segV=seg/dt;
      if(segV>=0.5&&segV<=MAX_MS){en.dist+=seg;en.movingMs+=dt*1000;}
    }
  }
  return en.ema;
}
/* units: factor from m/s + label */
var UNITS=[['kmh','km/h',3.6],['mph','mph',2.23694],['kn','kn',1.94384]];
function conv(ms,u){return ms*UNITS.find(function(x){return x[0]===u})[2]}
/* what's likely carrying you, from km/h */
function vehicleFor(kmh){
  if(kmh<1)return null;
  if(kmh<7)return ['walk','Walking pace'];
  if(kmh<50)return ['horse','Gallop territory'];
  if(kmh<160)return ['car','Road speed'];
  if(kmh<360)return ['train','Rail speed'];
  return ['plane','Air speed'];
}
/* gauge range auto-grows in display units */
var RANGES=[30,60,120,200,300,500,750,1000,1400];
function rangeFor(maxDisp){
  for(var i=0;i<RANGES.length;i++)if(RANGES[i]>=Math.max(30,maxDisp*1.12))return RANGES[i];
  return RANGES[RANGES.length-1];
}

/* ================= state + UI ================= */
var en=makeEngine(),unit='kmh',running=false,best=0;
/* connection state — deliberately split into "when was the fix taken" (lastFixAt,
   from CoreLocation's own timestamp) and "when did the bridge last answer"
   (lastReplyAt). iOS can keep answering instantly with a cached position, and
   only the first of those tells you whether the GPS is actually alive. */
var uiT=null,inFlight=0,seq=0,lastPollAt=0,lastFixAt=0,lastFixT=0,lastReplyAt=0,
    lastAcc=null,failStreak=0,denied=false,startedAt=0,srcMode='none',watchStartedAt=0;
var POLL_MS=2000,SLOW_MS=5000,TIMEOUT_MS=12000,STALE_MS=6000,LOST_MS=18000,GAP_MS=12000,
    WATCH_GRACE=15000,WATCH_GIVEUP=30000;
function fixAge(){return lastFixAt?Date.now()-lastFixAt:-1}
function fmtTime(ms){var s=Math.floor(ms/1000),m=Math.floor(s/60);return m+':'+('0'+(s%60)).slice(-2)}
function render(){
  var age=fixAge(),lost=running&&(age<0||age>=LOST_MS),stale=running&&age>=STALE_MS;
  document.querySelector('.readout').classList.toggle('stale',!!stale);
  var ms=lost?0:(en.ema||0),disp=conv(ms,unit);
  /* an em dash, not a stale number: a speedometer that confidently reads 60 with
     no signal is worse than one that admits it doesn't know */
  el('speedV').textContent=lost?'—':(disp<10?disp.toFixed(1):Math.round(disp));
  var veh=lost?null:vehicleFor(ms*3.6);
  el('vehicle').innerHTML=veh?('<svg class="i"><use href="#i-'+veh[0]+'"/></svg>'+veh[1]):(running&&!lost?'Waiting for movement…':'');
  el('unitLbl').textContent=UNITS.find(function(x){return x[0]===unit})[1];
  /* the room warms with speed: amber at rest, gold on the road, blue in the air */
  setHue(36+Math.min(1,(ms*3.6)/400)*180);
  if(dockOn){
    el('dSpeed').textContent=el('speedV').textContent;el('dSpeed').className='dspeed'+(stale||lost?' stale':'');
    el('dUnit').textContent=el('unitLbl').textContent;
  }
  el('tDist').textContent=unit==='mph'?(en.dist/1609.34).toFixed(1):unit==='kn'?(en.dist/1852).toFixed(1):(en.dist/1000).toFixed(1);
  el('tDistU').textContent=unit==='mph'?'MI':unit==='kn'?'NM':'KM';
  var avg=en.movingMs>2000?conv(en.dist/(en.movingMs/1000),unit):0;
  el('tAvg').textContent=Math.round(avg);
  el('tMax').textContent=Math.round(conv(en.maxMs,unit));
  el('tTime').textContent=fmtTime(en.movingMs);
  el('best').textContent=best>0?('Best ever  '+Math.round(conv(best,unit))+' '+UNITS.find(function(x){return x[0]===unit})[1]):'';
  drawGauge(lost?0:disp);
}
/* ---- gauge ---- */
var cv=el('gauge'),ctx=cv.getContext('2d');
function drawGauge(disp){
  var wrap=el('gaugeWrap'),W=Math.max(160,Math.min(wrap.clientWidth-24,(wrap.clientHeight-16)/0.86,460)),H=W*0.86,D=Math.min(window.devicePixelRatio||1,3);
  var L=el('app').classList.contains('lite');
  el('app').style.setProperty('--sp',Math.round(W*0.22)+'px');
  /* the status clock redraws twice a second — only reallocate the backing store
     when the size actually changed, not on every frame */
  if(cv.width!==W*D||cv.height!==H*D){
    cv.width=W*D;cv.height=H*D;cv.style.width=W+'px';cv.style.height=H+'px';
  }
  var cx=W/2*D,cy=H*0.56*D,r=W*0.45*D;
  var range=rangeFor(Math.max(disp,conv(en.peakMs,unit)));
  var a0=Math.PI*0.75,a1=Math.PI*2.25;      /* 240°, opening at the bottom */
  function ang(v){return a0+(a1-a0)*Math.min(1,v/range)}
  ctx.clearRect(0,0,cv.width,cv.height);
  /* track */
  ctx.lineWidth=12*D;ctx.lineCap='round';
  ctx.strokeStyle=L?'rgba(20,20,40,.12)':'rgba(255,255,255,.12)';
  ctx.beginPath();ctx.arc(cx,cy,r,a0,a1);ctx.stroke();
  /* fill */
  if(disp>0.4){
    var grad=ctx.createLinearGradient(0,0,cv.width,0);
    grad.addColorStop(0,'hsl('+hueNow+',92%,'+(L?48:62)+'%)');grad.addColorStop(1,'hsl('+(hueNow+40)+',88%,'+(L?42:58)+'%)');
    ctx.strokeStyle=grad;
    ctx.save();ctx.shadowColor='hsl('+hueNow+',90%,60%)';ctx.shadowBlur=(L?0:14)*D;
    ctx.beginPath();ctx.arc(cx,cy,r,a0,ang(disp));ctx.stroke();ctx.restore();
  }
  /* ticks + labels */
  ctx.fillStyle=L?'rgba(21,21,26,.6)':'rgba(255,255,255,.62)';
  ctx.font='700 '+(11*D)+'px -apple-system, system-ui, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  for(var i=0;i<=6;i++){
    var v=range*i/6,a=ang(v);
    var x1=cx+Math.cos(a)*(r-20*D),y1=cy+Math.sin(a)*(r-20*D);
    var x2=cx+Math.cos(a)*(r-11*D),y2=cy+Math.sin(a)*(r-11*D);
    ctx.strokeStyle=L?'rgba(21,21,26,.3)':'rgba(255,255,255,.35)';ctx.lineWidth=2*D;
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
    ctx.fillText(String(Math.round(v)),cx+Math.cos(a)*(r-34*D),cy+Math.sin(a)*(r-34*D));
  }
}
/* ---- units ---- */
function buildUnits(){
  var w=el('units');w.innerHTML='';
  UNITS.forEach(function(u){
    var b=document.createElement('button');b.className='uchip'+(u[0]===unit?' on':'');b.textContent=u[1];
    b.onclick=function(){unit=u[0];store.setItem('speedo.unit',unit);buildUnits();render();haptic('selection')};
    w.appendChild(b);
  });
}
/* ---- GPS source ----
   Two ways in. myllmLocation.watch() holds ONE live GPS session open, so fixes
   carry the chip's real Doppler speed and a dropped signal reacquires itself —
   that's the good path. Builds without it fall back to polling current(), and so
   does a watch that never delivers.

   Either way, one 500ms clock drives BOTH the status paint and the poll cadence.
   That is the whole reconnect story: no separate poll timer to lose, and no
   request that can wedge the app shut, because every tick re-checks and re-arms. */
function setGps(state,txt){
  el('gpsDot').className='gpsdot'+(state?' '+state:'');
  el('gpsTxt').textContent=txt;
  el('dDot').className=el('gpsDot').className;el('dTxt').textContent=txt;
}
function hint(t){if(el('hint').textContent!==t)el('hint').textContent=t}
function idleHint(){
  return !window.myllmLocation?'Open inside MyLLM to use GPS.'
    :lastFixT?'Paused — tap Start to pick the signal back up.'
    :'Tap Start, then get moving — train, plane, car or horse.';
}
/* Every word the user reads about the connection is derived HERE, from fix age.
   Nothing else writes the dot or the hint, so a stale fix can't leave a healthy
   green dot painted over a dead signal. */
function paintStatus(){
  if(!running){setGps(null,lastFixT?'paused':'GPS off');hint(idleHint());return}
  if(denied){
    setGps('bad','blocked');
    hint('Location for apps is off. Turn it on in MyLLM Settings, then tap Start.');
    return;
  }
  var age=fixAge();
  if(age<0){                                     // no fix yet this session
    var s=Math.max(0,Math.round((Date.now()-startedAt)/1000));
    setGps('search','searching '+s+'s');
    hint(s<10?'Acquiring GPS — the first fix takes a few seconds.'
             :'Still searching — GPS needs a view of the sky. Indoors this can take a while.');
    return;
  }
  if(age<STALE_MS){                              // live
    setGps(lastAcc<=15?'ok':(lastAcc<=ACC_LIMIT?'mid':'bad'),'±'+Math.round(lastAcc)+'m');
    hint(lastAcc>ACC_LIMIT?'Weak GPS — clearer sky gives a better reading.'
        :(en.fixes.length<3?'Getting a bearing — a few seconds…':''));
    return;
  }
  /* still answering but with old positions = iOS is serving a cache; not
     answering at all = the fix or the bridge is gone. Different words, because
     they need different things from the user. */
  var answering=Date.now()-lastReplyAt<8000;
  if(age<LOST_MS){
    setGps('search','reacquiring');
    hint('GPS went quiet '+Math.round(age/1000)+'s ago — reconnecting…');
    return;
  }
  setGps('bad','no signal');
  hint(answering?'Only an old position is coming back — open sky helps. Still retrying.'
                :'Lost GPS. Still retrying — it picks up on its own when the signal returns.');
}
/* One fix in, from either source. Returns false if it wasn't usable — the
   caller must NOT treat that as liveness. */
function acceptFix(p){
  if(!p||typeof p.latitude!=='number')return false;
  var now=Date.now();
  var t=(typeof p.timestamp==='number'&&p.timestamp>0)?p.timestamp:now;
  /* A repeated or older timestamp is iOS replaying a cached fix. Feeding it
     would stuff the window with duplicates AND refresh the "live" clock over a
     signal that is actually gone, so it's dropped and the age keeps running. */
  if(t<=lastFixT)return false;
  if(lastFixT&&t-lastFixT>GAP_MS)resetWindow(en);
  var fix={lat:p.latitude,lon:p.longitude,acc:p.accuracy==null?999:p.accuracy,t:t,
           vNative:(typeof p.speed==='number')?p.speed:null};
  lastFixT=t;lastFixAt=Math.min(now,t);lastAcc=fix.acc;
  feed(en,fix);
  if(en.maxMs>best){best=en.maxMs;store.setItem('speedo.best',String(best));}
  return true;
}
function isBlocked(msg){return /turned off|denied|restricted|permission/i.test(msg||'')}
/* ---- source A: live watch (MyLLM 4.5.6+) ---- */
function onWatchFix(p){
  lastReplyAt=Date.now();
  if(p&&p.error){                       // the stream failed after it started
    failStreak++;
    if(isBlocked(p.error))denied=true;
    paintStatus();return;
  }
  failStreak=0;
  acceptFix(p);
  paintStatus();render();
}
function beginSource(){
  if(window.myllmLocation.watch){
    srcMode='watch';watchStartedAt=Date.now();
    /* 'best' = BestForNavigation. Worth the power for a speedometer, and it's
       released the moment the user pauses. */
    myllmLocation.watch(onWatchFix,{accuracy:'best'}).catch(function(e){
      if(isBlocked((e&&e.message)||''))denied=true;
      usePolling();
    });
  }else{
    srcMode='poll';                     // older build — no watch() to feature-detect
  }
}
function usePolling(){
  if(srcMode==='poll')return;
  srcMode='poll';
  try{if(window.myllmLocation.stop)myllmLocation.stop()}catch(e){}
}
function releaseWatch(){
  if(srcMode!=='watch')return;
  try{myllmLocation.stop()}catch(e){}
}
/* ---- source B: polling current() ---- */
function poll(){
  if(!running||inFlight||denied||!window.myllmLocation)return;
  var id=++seq;inFlight=id;lastPollAt=Date.now();
  var done=false;
  /* Watchdog. myllmLocation.current() is a promise over a WKWebView bridge, and
     a promise that never settles (permission sheet left open, app suspended
     mid-request, native callback dropped) used to strand the in-flight guard
     forever — the app stayed on screen looking fine and never polled again.
     Sits past CoreLocation's own ~10s one-shot timeout so real failures land
     first and this only ever catches the genuinely lost ones. */
  var wd=setTimeout(function(){
    if(done)return;done=true;
    if(inFlight===id)inFlight=0;
    failStreak++;paintStatus();
  },TIMEOUT_MS);
  function settle(){if(done)return false;done=true;clearTimeout(wd);if(inFlight===id)inFlight=0;return true}
  myllmLocation.current({address:false,accuracy:'best'}).then(function(p){
    if(!settle())return;
    lastReplyAt=Date.now();
    if(!p||typeof p.latitude!=='number'){failStreak++;paintStatus();return}
    failStreak=0;
    acceptFix(p);
    paintStatus();render();
  }).catch(function(e){
    if(!settle())return;
    lastReplyAt=Date.now();failStreak++;
    /* a refused permission won't fix itself by asking 30 more times a minute */
    if(isBlocked((e&&e.message)||''))denied=true;
    paintStatus();
  });
}
/* the single clock: paint, then feed the source that needs feeding */
function tick(){
  paintStatus();render();
  if(!running||denied)return;
  if(srcMode==='watch'){
    /* A watch that never delivers is worse than no watch — it just sits there
       looking like a signal problem. Give it a grace period from the start, and
       a longer one mid-session (the native side reacquires on its own), then
       drop to the polling path that older builds have always used. */
    var quiet=lastFixAt?Date.now()-lastFixAt:Date.now()-watchStartedAt;
    if(quiet>(lastFixAt?WATCH_GIVEUP:WATCH_GRACE))usePolling();
    return;
  }
  var gap=failStreak>=4?SLOW_MS:POLL_MS;   // ease off once it's clearly not answering
  if(!inFlight&&Date.now()-lastPollAt>=gap)poll();
}
function start(){
  if(!window.myllmLocation){
    hint('This needs the MyLLM app with location for apps enabled.');
    haptic('warning');return;
  }
  running=true;denied=false;failStreak=0;inFlight=0;
  startedAt=Date.now();lastPollAt=0;lastFixAt=0;   // fresh session: "searching", not stale
  el('goBtn').innerHTML='<svg class="i"><use href="#i-pause"/></svg>Pause';el('goBtn').className='btn glass stop';
  syncLook();syncChrome();
  clearInterval(uiT);uiT=setInterval(tick,500);
  beginSource();tick();haptic('success');
}
function stop(){
  running=false;clearInterval(uiT);uiT=null;inFlight=0;
  releaseWatch();srcMode='none';   // let go of the GPS the moment the user pauses
  el('goBtn').innerHTML='<svg class="i"><use href="#i-play"/></svg>Start';el('goBtn').className='btn go';
  syncLook();syncChrome();
  paintStatus();render();haptic('light');
}
/* The native side also stops the stream on teardown; this just makes sure a
   swipe-away releases it without waiting for that. */
window.addEventListener('pagehide',releaseWatch);
/* Coming back from the background: timers were frozen and any request in flight
   when we left will never land, so clear the guard and poll straight away
   instead of waiting out the watchdog. */
document.addEventListener('visibilitychange',function(){
  if(document.hidden||!running)return;
  inFlight=0;lastPollAt=0;tick();
});
el('goBtn').onclick=function(){running?stop():start()};
el('resetBtn').onclick=function(){
  var keep=en.fixes,e2=makeEngine();e2.fixes=keep.slice(-2);e2.ema=en.ema;e2.peakMs=en.ema||0;en=e2;
  render();haptic('warning');
};
window.addEventListener('resize',render);

/* ================= look, chrome, dash mode =================
   Tracking takes the whole display and keeps it awake — a speedometer on a
   dash mount must not sleep. Where MyLLM can't hide its own title bar, a dark
   stage under a white bar looks cut in half, so in light mode without
   myllmImmersive the stage stays light. The bridge is looked up on each call. */
var hue=36,hueNow=36,dockOn=false,dockDrift=null,dockCtlTimer=null,wakeLock=null;
function setHue(h){if(Math.abs(h-hue)<0.5)return;hue=h;el('app').style.setProperty('--h',String(Math.round(h)))}
function isLight(){return !(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)}
function syncLook(){el('app').classList.toggle('lite',isLight()&&!(running&&window.myllmImmersive))}
function syncChrome(){
  if(!window.myllmImmersive)return;
  try{myllmImmersive(running||dockOn,{keepAwake:running||dockOn}).catch(function(){})}catch(e){}
}
function requestWake(){if(!('wakeLock' in navigator))return;navigator.wakeLock.request('screen').then(function(l){wakeLock=l}).catch(function(){wakeLock=null})}
function releaseWake(){if(wakeLock){try{wakeLock.release()}catch(e){}wakeLock=null}}
function driftOnce(){var x=Math.round((Math.random()-0.5)*44),y=Math.round((Math.random()-0.5)*44);el('dDrift').style.transform='translate('+x+'px,'+y+'px)'}
function openDock(){
  dockOn=true;haptic('medium');
  el('dock').classList.add('on');el('dCtl').classList.remove('on');
  el('dHint').style.opacity='1';setTimeout(function(){el('dHint').style.opacity='0'},4000);
  driftOnce();dockDrift=setInterval(driftOnce,60000);
  render();paintStatus();requestWake();syncChrome();
}
function closeDock(){
  dockOn=false;el('dock').classList.remove('on');
  clearInterval(dockDrift);clearTimeout(dockCtlTimer);dockDrift=dockCtlTimer=null;
  releaseWake();syncChrome();
}
function dockTap(){
  if(!dockOn)return;
  el('dHint').style.opacity='0';el('dCtl').classList.add('on');
  clearTimeout(dockCtlTimer);dockCtlTimer=setTimeout(function(){el('dCtl').classList.remove('on')},5000);
}
el('dockBtn').onclick=openDock;
el('dock').addEventListener('click',function(e){if(!e.target.closest('button'))dockTap()});
el('dExit').onclick=function(){haptic('light');closeDock()};
el('dGo').onclick=function(){running?stop():start();el('dGo').innerHTML=running?'<svg class="i"><use href="#i-pause"/></svg><span>Pause</span>':'<svg class="i"><use href="#i-play"/></svg><span>Start</span>';dockTap()};
document.addEventListener('visibilitychange',function(){
  if(document.hidden){releaseWake();return}
  if(dockOn)requestWake();
  if(running||dockOn)syncChrome();          /* MyLLM puts its bars back when the app is left */
});
if(window.matchMedia){
  var mq=matchMedia('(prefers-color-scheme: dark)');
  if(mq.addEventListener)mq.addEventListener('change',function(){syncLook();render()});else if(mq.addListener)mq.addListener(function(){syncLook();render()});
}
(function ease(){hueNow+=(hue-hueNow)*0.08;requestAnimationFrame(ease)})();
syncLook();

store.getItem('speedo.unit').then(function(v){
  if(v&&UNITS.some(function(u){return u[0]===v}))unit=v;
  return store.getItem('speedo.best');
}).then(function(v){
  best=parseFloat(v)||0;
  buildUnits();render();paintStatus();
});
</script>
</body></html>
