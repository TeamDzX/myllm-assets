<script>
function el(i){return document.getElementById(i)}
/* Bridges are looked up when used, never kept: MyLLM can add them after this
   script has run. */
function store(){return window.myllmStorage||{getItem:function(){return Promise.resolve(null)},setItem:function(){return Promise.resolve()}}}
function haptic(k){if(window.myllmHaptic)try{myllmHaptic(k)}catch(e){}}
function icon(n){return '<svg class="i"><use href="#i-'+n+'"/></svg>'}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
/* The quiz takes the whole display. Where MyLLM can't hide its own title
   bar, a dark stage under a white bar looks cut in half — so in light mode,
   without myllmImmersive, the stage stays light. */
var stageOn=false;
function isLight(){return !(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)}
function syncLook(){el('stage').classList.toggle('lite',isLight()&&!window.myllmImmersive)}
function syncChrome(){
  if(!window.myllmImmersive)return;
  try{myllmImmersive((window.myllmClose ? true : (stageOn)), {keepAwake:false}).catch(function(){})}catch(_){}
}
function openStage(){if(stageOn)return;stageOn=true;syncLook();el('stage').classList.add('on');document.body.classList.add('lock');syncChrome()}
function closeStage(){if(!stageOn)return;stageOn=false;el('stage').classList.remove('on','veil');document.body.classList.remove('lock');syncChrome()}
if(window.matchMedia){var mq=matchMedia('(prefers-color-scheme: dark)');if(mq.addEventListener)mq.addEventListener('change',syncLook);else if(mq.addListener)mq.addListener(syncLook)}
function ri(a,b){return Math.floor(Math.random()*(b-a+1))+a}
var ROUND=10,best={};
var LEVELS=[
 {n:'1',t:'Starter',d:'Add & take away to 10',gen:function(){return addsub(0,10)}},
 {n:'2',t:'Level 2',d:'Add & take away to 20',gen:function(){return addsub(0,20)}},
 {n:'3',t:'Times Tables',d:'Multiply 2 to 12',gen:function(){var a=ri(2,12),b=ri(2,12);return{txt:a+' × '+b,ans:a*b}}},
 {n:'4',t:'× and ÷',d:'Multiply & divide to 12',gen:function(){if(Math.random()<0.5){var a=ri(2,12),b=ri(2,12);return{txt:a+' × '+b,ans:a*b}}var d=ri(2,12),q=ri(2,12);return{txt:(d*q)+' ÷ '+d,ans:q}}},
 {n:'5',t:'Mixed',d:'+  −  ×  to 100',gen:function(){var r=Math.random();if(r<0.4)return addsub(0,100);if(r<0.7){var a=ri(2,12),b=ri(2,12);return{txt:a+' × '+b,ans:a*b}}var d=ri(2,12),q=ri(2,12);return{txt:(d*q)+' ÷ '+d,ans:q}}},
 {n:'6',t:'Challenge',d:'Bigger numbers & division',gen:function(){var r=Math.random();if(r<0.4)return addsub(0,1000);if(r<0.7){var a=ri(2,20),b=ri(2,15);return{txt:a+' × '+b,ans:a*b}}var d=ri(3,15),q=ri(3,15);return{txt:(d*q)+' ÷ '+d,ans:q}}}
];
function addsub(lo,hi){var a=ri(lo,hi),b=ri(lo,hi);if(Math.random()<0.5)return{txt:a+' + '+b,ans:a+b};if(a<b){var t=a;a=b;b=t}return{txt:a+' − '+b,ans:a-b}}

var lvl=0,qi=0,score=0,correct=0,streak=0,cur=null,locked=false,paused=false,pending=null,advT=null;

function renderHome(){
  var L=el('levels');L.innerHTML='';
  LEVELS.forEach(function(lv,i){
    var b=document.createElement('button');b.type='button';b.className='lvl';
    var bs=best['m'+i]?('<span class="bst">Best '+best['m'+i]+'</span>'):'';
    b.innerHTML='<div class="tile">'+lv.n+'</div><div class="t"><b>'+esc(lv.t)+'</b><small>'+esc(lv.d)+'</small></div>'+bs;
    b.onclick=function(){startQuiz(i)};
    L.appendChild(b);
  });
}
function showCard(html){var c=el('card');c.innerHTML=html;c.hidden=false;el('stage').classList.add('veil')}
function hideCard(){el('card').hidden=true;el('stage').classList.remove('veil')}
function startQuiz(i){
  lvl=i;qi=0;score=0;correct=0;streak=0;paused=false;pending=null;clearTimeout(advT);
  hideCard();openStage();el('lvName').textContent=LEVELS[i].t;haptic('light');nextQ();
}
function makeOpts(ans){
  var s={};s[ans]=1;var cand=[ans+1,ans-1,ans+2,ans-2,ans+10,ans-10,ans+ri(1,6),ans-ri(1,6),ans+ri(7,20)];
  var out=[ans];
  for(var k=0;k<cand.length&&out.length<4;k++){var v=cand[k];if(v>=0&&!s[v]){s[v]=1;out.push(v)}}
  while(out.length<4){var v=ans+ri(1,30);if(!s[v]){s[v]=1;out.push(v)}}
  for(var j=out.length-1;j>0;j--){var r=ri(0,j),t=out[j];out[j]=out[r];out[r]=t}
  return out;
}
function nextQ(){
  locked=false;
  cur=LEVELS[lvl].gen();
  el('qprog').textContent=(qi+1)+' / '+ROUND;
  el('qscore').innerHTML=score+'<small>pts</small>';
  el('qfill').style.width=(qi/ROUND*100)+'%';
  el('streak').innerHTML=streak>=2?(icon('flame')+'<span>'+streak+' in a row!</span>'):'';
  el('q').textContent=cur.txt+' = ?';
  var opts=makeOpts(cur.ans),O=el('opts');O.innerHTML='';
  opts.forEach(function(v){var b=document.createElement('button');b.type='button';b.className='opt glass';b.textContent=v;b.dataset.v=v;b.onclick=function(){answer(v,b)};O.appendChild(b)});
}
function answer(v,btn){
  if(locked||paused)return;locked=true;
  var buttons=el('opts').querySelectorAll('.opt');
  buttons.forEach(function(b){b.disabled=true});
  var ok=v===cur.ans;
  if(ok){
    btn.className='opt glass right';btn.insertAdjacentHTML('beforeend','<span class="mk">'+icon('check')+'</span>');
    score+=10+Math.min(streak,5);streak++;correct++;
    haptic('success');beep(true);
  }else{
    btn.className='opt glass wrong';btn.insertAdjacentHTML('beforeend','<span class="mk">'+icon('x')+'</span>');
    streak=0;haptic('error');beep(false);
    buttons.forEach(function(b){if(+b.dataset.v===cur.ans){b.className='opt glass right';b.insertAdjacentHTML('beforeend','<span class="mk">'+icon('check')+'</span>')}});
  }
  el('qscore').innerHTML=score+'<small>pts</small>';
  pending=function(){pending=null;qi++;if(qi>=ROUND)finish();else nextQ()};
  advT=setTimeout(function(){if(!paused&&pending)pending()},ok?550:1100);
}
function pause(){
  if(paused||!stageOn||!el('card').hidden)return;
  paused=true;clearTimeout(advT);
  showCard('<div class="kick">Paused · '+esc(LEVELS[lvl].t)+'</div><div class="big">'+(qi+(locked?1:0))+'<small>/'+ROUND+'</small></div><p>'+score+' points so far</p>'+
    '<button class="pri" id="cA" type="button">'+icon('play')+'Resume</button><button class="sec2 glass" id="cB" type="button">End round</button>');
  el('cA').onclick=resume;el('cB').onclick=goHome;
}
function resume(){
  if(!paused)return;paused=false;hideCard();haptic('light');
  if(pending)advT=setTimeout(function(){if(!paused&&pending)pending()},350);
}
function goHome(){paused=false;pending=null;clearTimeout(advT);hideCard();closeStage();renderHome();haptic('light')}
function finish(){
  el('qfill').style.width='100%';
  var pct=correct/ROUND;
  var n=pct>=1?3:pct>=0.7?2:pct>=0.4?1:0;
  var key='m'+lvl,isBest=!best[key]||score>best[key];
  if(isBest){best[key]=score;store().setItem('mc_best',JSON.stringify(best))}
  haptic(pct>=0.7?'success':'warning');
  var stars='';for(var i=0;i<3;i++)stars+='<svg class="'+(i<n?'on':'')+'"><use href="#i-star"/></svg>';
  showCard('<div class="kick">'+esc(LEVELS[lvl].t)+'</div><div class="stars3">'+stars+'</div>'+
    '<div class="big">'+correct+'<small>/'+ROUND+'</small></div>'+
    '<p>Score '+score+(best[key]&&!isBest?' · best '+best[key]:'')+'</p>'+(isBest?'<div class="best">New best</div>':'')+
    '<button class="pri" id="cA" type="button">'+icon('again')+'Play again</button>'+
    '<button class="sec2 glass" id="cB" type="button">Change level</button>');
  el('cA').onclick=function(){startQuiz(lvl)};
  el('cB').onclick=goHome;
}
var actx=null;
function beep(ok){try{if(!actx){var AC=window.AudioContext||window.webkitAudioContext;actx=new AC()}if(actx.state==='suspended')actx.resume();
  var o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime;o.type=ok?'sine':'square';
  if(ok){o.frequency.setValueAtTime(660,t);o.frequency.setValueAtTime(880,t+0.09)}else{o.frequency.setValueAtTime(200,t);o.frequency.exponentialRampToValueAtTime(120,t+0.18)}
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.25,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+(ok?0.2:0.22));
  o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+0.25)}catch(e){}}

el('bClose').onclick=function(){haptic('light');pause()};
document.addEventListener('visibilitychange',function(){
  if(document.hidden){pause();return}
  if(stageOn)syncChrome();          /* MyLLM puts its bars back when the app is left */
});
renderHome();
store().getItem('mc_best').then(function(v){if(v){try{best=JSON.parse(v)||{}}catch(e){}}renderHome()});

/* myllm-fullscreen-v2 — full screen where MyLLM can also close the app for us
   (myllmClose, 5.6.2+): full screen hides MyLLM's Done, and a page with no way
   out is worse than a repeated title, so elsewhere nothing changes.
   The spacer keeps the header clear of the status bar / Dynamic Island. It is
   live CSS — env(safe-area-inset-top) — not a measured number: the inset is
   still 0 when the page loads and only grows once MyLLM's bar has gone (v1
   measured once, so the title sat under the island). If the page's own styles
   already pad the header down by the inset, the spacer stays at 0. */
(function(){
  function full(){ return !!(window.myllmClose && window.myllmImmersive); }
  /* Does any rule that applies to the header or an ancestor already use the top inset? */
  function pageHandlesInset(head){
    var chain = [], n, found = false;
    for (n = head; n && n.nodeType === 1; n = n.parentElement) chain.push(n);
    function walk(rules){
      for (var i = 0; i < rules.length && !found; i++){
        var r = rules[i];
        if (r.cssRules && !r.selectorText) { walk(r.cssRules); continue; }
        if (!r.selectorText || !/safe-area-inset-top/.test(r.cssText) || !/(padding|margin|top)\s*:/.test(r.cssText)) continue;
        if (/\.imm-safe/.test(r.selectorText)) continue;
        for (var k = 0; k < chain.length; k++){
          try { if (chain[k].matches(r.selectorText)) { found = true; break; } } catch(e){}
        }
      }
    }
    for (var s = 0; s < document.styleSheets.length && !found; s++){
      try { walk(document.styleSheets[s].cssRules); } catch(e){}
    }
    for (n = head; n && n.nodeType === 1 && !found; n = n.parentElement){
      if (/safe-area-inset-top/.test(n.getAttribute("style") || "")) found = true;
    }
    return found;
  }
  function fit(){
    var sp = document.querySelector(".imm-safe"), head = document.querySelector(".head");
    if (!sp || !head) return;
    sp.style.height = (document.body.classList.contains("imm") && !pageHandlesInset(head)) ? "env(safe-area-inset-top)" : "0px";
  }
  function sync(){
    var f = full();
    document.body.classList.toggle("imm", f);
    fit();
    if (!f) return;
    try { window.myllmImmersive(true, { keepAwake:false }).catch(function(){}); } catch(e){}
  }
  window.myllmFSClose = function(){
    try { if (window.myllmHaptic) window.myllmHaptic("light"); } catch(e){}
    try { window.myllmClose().catch(function(){}); } catch(e){}
  };
  document.addEventListener("visibilitychange", function(){ if (!document.hidden) sync(); });
  sync();
})();
</script></body></html>
