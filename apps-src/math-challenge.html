<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>:root{color-scheme:light dark;--bg:#f2f2f7;--fg:#111;--card:#fff;--accent:#4a7bf0}
@media(prefers-color-scheme:dark){:root{--bg:#000;--fg:#eee;--card:#1c1c1e}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;min-height:100%}
body{font-family:-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--fg);margin:0 auto;max-width:560px;min-height:100dvh;display:flex;flex-direction:column;padding:calc(16px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom))}
h1{font-size:22px;margin:0 0 2px;font-weight:700}
.sub{font-size:13px;opacity:.6;margin-bottom:16px}
.levels{display:flex;flex-direction:column;gap:10px}
.lvl{display:flex;align-items:center;gap:14px;background:var(--card);border:0;border-radius:16px;padding:15px;box-shadow:0 1px 3px rgba(0,0,0,.08);text-align:left;color:var(--fg)}
.lvl:active{background:rgba(74,123,240,.12)}
.lvl .n{font-size:30px;width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--accent),#7aa0ff);color:#fff;font-weight:800;flex:none}
.lvl .t{flex:1}.lvl .t b{font-size:17px}.lvl .t small{display:block;opacity:.6;font-size:13px}
.lvl .bst{font-size:11px;opacity:.55;text-align:right}
/* quiz */
.quiz{flex:1;display:none;flex-direction:column}
.quiz.show{display:flex}
.qtop{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:600;margin-bottom:6px}
.bar{height:8px;border-radius:6px;background:rgba(127,127,127,.18);overflow:hidden;margin-bottom:6px}
.bar>div{height:100%;background:var(--accent);width:0;transition:width .3s}
.streak{font-size:13px;opacity:.7;min-height:18px;margin-bottom:10px}
.qbox{flex:1;display:flex;align-items:center;justify-content:center}
.q{font-size:52px;font-weight:800;letter-spacing:1px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.opt{border:0;background:var(--card);color:var(--fg);border-radius:16px;padding:22px;font-size:26px;font-weight:800;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.opt.right{background:#34a853;color:#fff}.opt.wrong{background:#ea4335;color:#fff}
.opt:disabled{opacity:1}
/* results */
.res{flex:1;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px}
.res.show{display:flex}
.res .big{font-size:60px}
.res .sc{font-size:40px;font-weight:800}
.res .stars{font-size:34px;letter-spacing:4px}
.res .best{font-size:14px;opacity:.6}
.btn{border:0;background:var(--accent);color:#fff;border-radius:16px;padding:14px 34px;font-size:17px;font-weight:700;margin-top:8px}
.ghost{background:rgba(127,127,127,.18);color:var(--fg)}
@media(min-width:768px){body{max-width:720px}.q{font-size:64px}.opt{font-size:30px;padding:26px}}
</style></head><body>
<div id="home">
  <h1>➗ Math Challenge</h1>
  <div class="sub">Pick a level. Ten questions, four answers — how many can you get?</div>
  <div class="levels" id="levels"></div>
</div>

<div class="quiz" id="quiz">
  <div class="qtop"><span id="qprog">1 / 10</span><span id="qscore">0</span></div>
  <div class="bar"><div id="qfill"></div></div>
  <div class="streak" id="streak"></div>
  <div class="qbox"><div class="q" id="q"></div></div>
  <div class="opts" id="opts"></div>
</div>

<div class="res" id="res"></div>

<script>
var store=window.myllmStorage||{getItem:function(){return Promise.resolve(null)},setItem:function(){return Promise.resolve()}};
function haptic(s){if(window.myllmHaptic)try{myllmHaptic(s)}catch(e){}}
function ri(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function el(i){return document.getElementById(i)}
var ROUND=10,best={};
var LEVELS=[
 {n:'1',t:'Starter',d:'Add & take away to 10',gen:function(){return addsub(0,10)}},
 {n:'2',t:'Level 2',d:'Add & take away to 20',gen:function(){return addsub(0,20)}},
 {n:'3',t:'Times Tables',d:'Multiply 2 to 12',gen:function(){var a=ri(2,12),b=ri(2,12);return{txt:a+' × '+b,ans:a*b}}},
 {n:'4',t:'× and ÷',d:'Multiply & divide to 12',gen:function(){if(Math.random()<0.5){var a=ri(2,12),b=ri(2,12);return{txt:a+' × '+b,ans:a*b}}var d=ri(2,12),q=ri(2,12);return{txt:(d*q)+' ÷ '+d,ans:q}}},
 {n:'5',t:'Mixed',d:'+  −  ×  to 100',gen:function(){var r=Math.random();if(r<0.4)return addsub(0,100);if(r<0.7){var a=ri(2,12),b=ri(2,12);return{txt:a+' × '+b,ans:a*b}}var d=ri(2,12),q=ri(2,12);return{txt:(d*q)+' ÷ '+d,ans:q}}},
 {n:'6',t:'Challenge',d:'Bigger numbers & division',gen:function(){var r=Math.random();if(r<0.4)return addsub(0,1000);if(r<0.7){var a=ri(2,20),b=ri(2,15);return{txt:a+' × '+b,ans:a*b}}var d=ri(3,15),q=ri(3,15);return{txt:(d*q)+' ÷ '+d,ans:q}}}
];
function addsub(lo,hi){var a=ri(lo,hi),b=ri(lo,hi);if(Math.random()<0.5)return{txt:a+' + '+b,ans:a+b};if(a<b){var t=a;a=b;b=t}return{txt:a+' − '+b,ans:a-b}}

var lvl=0,qi=0,score=0,correct=0,streak=0,cur=null,locked=false;

function renderHome(){
  var L=el('levels');L.innerHTML='';
  LEVELS.forEach(function(lv,i){
    var b=document.createElement('button');b.className='lvl';
    var bs=best['m'+i]?('Best '+best['m'+i]):'';
    b.innerHTML='<div class="n">'+lv.n+'</div><div class="t"><b>'+lv.t+'</b><small>'+lv.d+'</small></div><div class="bst">'+bs+'</div>';
    b.onclick=function(){startQuiz(i)};
    L.appendChild(b);
  });
}
function show(id){el('home').style.display=id==='home'?'block':'none';el('quiz').className='quiz'+(id==='quiz'?' show':'');el('res').className='res'+(id==='res'?' show':'')}
function startQuiz(i){lvl=i;qi=0;score=0;correct=0;streak=0;show('quiz');nextQ()}
function makeOpts(ans){
  var s={};s[ans]=1;var cand=[ans+1,ans-1,ans+2,ans-2,ans+10,ans-10,ans+ri(1,6),ans-ri(1,6),ans+ri(7,20)];
  var out=[ans];
  for(var k=0;k<cand.length&&out.length<4;k++){var v=cand[k];if(v>=0&&!s[v]){s[v]=1;out.push(v)}}
  while(out.length<4){var v=ans+ri(1,30);if(!s[v]){s[v]=1;out.push(v)}}
  for(var j=out.length-1;j>0;j--){var r=ri(0,j),t=out[j];out[j]=out[r];out[r]=t}
  return out;
}
function nextQ(){
  locked=false;
  cur=LEVELS[lvl].gen();
  el('qprog').textContent=(qi+1)+' / '+ROUND;
  el('qscore').textContent=score;
  el('qfill').style.width=(qi/ROUND*100)+'%';
  el('streak').textContent=streak>=2?('🔥 '+streak+' in a row!'):'';
  el('q').textContent=cur.txt+' = ?';
  var opts=makeOpts(cur.ans),O=el('opts');O.innerHTML='';
  opts.forEach(function(v){var b=document.createElement('button');b.className='opt';b.textContent=v;b.onclick=function(){answer(v,b)};O.appendChild(b)});
}
function answer(v,btn){
  if(locked)return;locked=true;
  var buttons=el('opts').querySelectorAll('.opt');
  buttons.forEach(function(b){b.disabled=true});
  if(v===cur.ans){
    btn.className='opt right';score+=10+Math.min(streak,5);streak++;correct++;
    haptic('success');beep(true);
  }else{
    btn.className='opt wrong';streak=0;haptic('error');beep(false);
    buttons.forEach(function(b){if(+b.textContent===cur.ans)b.className='opt right'});
  }
  el('qscore').textContent=score;
  setTimeout(function(){qi++;if(qi>=ROUND)finish();else nextQ()},v===cur.ans?550:1100);
}
function finish(){
  show('res');
  var pct=correct/ROUND;
  var stars=pct>=1?'⭐⭐⭐':pct>=0.7?'⭐⭐':pct>=0.4?'⭐':'';
  var key='m'+lvl,isBest=!best[key]||score>best[key];
  if(isBest){best[key]=score;store.setItem('mc_best',JSON.stringify(best))}
  haptic(pct>=0.7?'success':'warning');
  el('res').innerHTML='<div class="big">'+(pct>=0.7?'🎉':'💪')+'</div>'+
    '<div class="stars">'+stars+'</div>'+
    '<div class="sc">'+correct+' / '+ROUND+'</div>'+
    '<div>Score '+score+(isBest?' · New best!':'')+'</div>'+
    '<div class="best">'+LEVELS[lvl].t+(best[key]?' · best '+best[key]:'')+'</div>'+
    '<button class="btn" id="again">Play again</button>'+
    '<button class="btn ghost" id="menu">Change level</button>';
  el('again').onclick=function(){startQuiz(lvl)};
  el('menu').onclick=function(){renderHome();show('home')};
}
var actx=null;
function beep(ok){try{if(!actx){var AC=window.AudioContext||window.webkitAudioContext;actx=new AC()}if(actx.state==='suspended')actx.resume();
  var o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime;o.type=ok?'sine':'square';
  if(ok){o.frequency.setValueAtTime(660,t);o.frequency.setValueAtTime(880,t+0.09)}else{o.frequency.setValueAtTime(200,t);o.frequency.exponentialRampToValueAtTime(120,t+0.18)}
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.25,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+(ok?0.2:0.22));
  o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+0.25)}catch(e){}}
store.getItem('mc_best').then(function(v){if(v){try{best=JSON.parse(v)||{}}catch(e){}}renderHome();show('home')});
</script></body></html>
