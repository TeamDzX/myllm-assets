<!-- AI thinking pill (house convention) -->
<script>
(function(){if(window.__myllmAiWrap||typeof window.myllmAsk!=='function')return;window.__myllmAiWrap=true;
var orig=window.myllmAsk,depth=0,node=null;
function ensure(){if(node)return;node=document.createElement('div');node.className='myllm-ai-busy';
node.innerHTML='<span class="myllm-ai-cog"></span><span>AI is thinking… <small>privately, on your device</small></span>';
(document.body||document.documentElement).appendChild(node);}
function show(){ensure();depth++;node.classList.add('on');}
function hide(){depth=Math.max(0,depth-1);if(depth===0&&node)node.classList.remove('on');}
window.myllmAsk=function(){show();var p;try{p=orig.apply(this,arguments);}catch(e){hide();throw e;}
return Promise.resolve(p).then(function(r){hide();return r;},function(e){hide();throw e;});};})();
</script>

<script>
/* Bridges are looked up when used, never kept: MyLLM can add them after this
   script has run. */
var store = {
  getItem:function(k){ return window.myllmStorage ? window.myllmStorage.getItem(k) : Promise.resolve(null); },
  setItem:function(k,v){ return window.myllmStorage ? window.myllmStorage.setItem(k,v) : Promise.resolve(); }
};
function haptic(k){ if(window.myllmHaptic){ try{ myllmHaptic(k||'light'); }catch(_){} } }
function NET(){ return window.myllmFetch ? window.myllmFetch.apply(window, arguments) : Promise.reject(new Error("no bridge")); }
function hasNet(){ return !!window.myllmFetch; }
function ASK(){ return window.myllmAsk.apply(window, arguments); }
function hasAsk(){ return typeof window.myllmAsk === "function"; }
function el(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function icon(n){ return '<svg class="i"><use href="#i-' + n + '"/></svg>'; }

/* book = {id, title, author, cover(url|null), shelf, rating, note, finishedAt} */
var books = [];
var tab = "reading";
var finishing = null, finRating = 0, recBusy = false;
var SPINE_HUES = [24, 110, 208, 326, 40, 200];

function uid(){ return "b" + Date.now().toString(36) + Math.floor(Math.random()*1e5).toString(36); }
function save(){ store.setItem("books", JSON.stringify(books)); }

function initials(t){
  return t.split(/\s+/).slice(0,2).map(function(w){ return (w[0]||"").toUpperCase(); }).join("");
}
function spineHue(t){
  var h = 0; for (var i = 0; i < t.length; i++) h = (h * 31 + t.charCodeAt(i)) >>> 0;
  return SPINE_HUES[h % SPINE_HUES.length];
}
function tileHTML(title){ return '<div class="cov" style="--ch:' + spineHue(title) + '">' + esc(initials(title)) + '</div>'; }
/* A cover that fails to load becomes its hue tile. Guarded: the row may have
   been re-rendered (and the image detached) before the error fires. */
function coverFail(img){
  var p = img.parentNode; if (!p) return;
  var d = document.createElement("div"); d.className = "cov"; d.style.setProperty("--ch", img.getAttribute("data-h"));
  d.textContent = img.getAttribute("data-i") || ""; p.replaceChild(d, img);
}
function coverHTML(b){
  if (b.cover) return '<img class="cov" src="' + esc(b.cover) + '" alt="" loading="lazy" data-h="' + spineHue(b.title) + '" data-i="' + esc(initials(b.title)) + '" onerror="coverFail(this)">';
  return tileHTML(b.title);
}

function showTab(t){
  tab = t;
  haptic("selection");
  el("tabR").className = t === "reading" ? "on" : "";
  el("tabW").className = t === "want" ? "on" : "";
  el("tabF").className = t === "finished" ? "on" : "";
  render();
}

/* ---------- stats ---------- */
function renderStats(){
  var yr = new Date().getFullYear();
  var fin = books.filter(function(b){ return b.shelf === "finished"; });
  var finYr = fin.filter(function(b){ return b.finishedAt && new Date(b.finishedAt).getFullYear() === yr; });
  var rated = fin.filter(function(b){ return b.rating; });
  var avg = rated.length ? (rated.reduce(function(a,b){ return a + b.rating; }, 0) / rated.length).toFixed(1) : null;
  var waiting = books.filter(function(b){ return b.shelf === "want"; }).length;
  el("stats").textContent = finYr.length + " finished in " + yr +
    (avg ? " · " + avg + "★ average" : "") +
    " · " + waiting + " waiting";
  el("hFin").textContent = finYr.length;
  el("hLbl").textContent = "Finished in " + yr;
  el("hAvg").hidden = !avg;
  if (avg) el("hAvg").innerHTML = icon("star") + avg + " average";
  el("hWait").innerHTML = icon("clock") + waiting + " waiting";
  el("cR").textContent = books.filter(function(b){ return b.shelf === "reading"; }).length || "";
  el("cW").textContent = waiting || "";
  el("cF").textContent = fin.length || "";
}

/* ---------- add via Open Library (manual fallback built in) ---------- */
function findBtn(busy){ el("addgo").disabled = busy; el("addgo").innerHTML = busy ? '<i class="spin"></i>' : "Find"; }
function searchBooks(){
  var q = el("addq").value.trim();
  if (!q) return;
  haptic("light");
  if (!hasNet()){ offerManual(q, "No internet access for apps — add it by hand:"); return; }
  findBtn(true);
  el("addhint").textContent = "Searching Open Library…";
  el("results").innerHTML = "";
  NET("https://openlibrary.org/search.json?limit=5&fields=title,author_name,cover_i&q=" + encodeURIComponent(q))
  .then(function(r){
    var j = JSON.parse(r.body);
    findBtn(false);
    el("addhint").textContent = "";
    if (!j.docs || !j.docs.length){ offerManual(q, "Nothing found — add it by hand:"); return; }
    window.__found = j.docs.slice(0,5);
    el("results").innerHTML = window.__found.map(function(d, i){
      var cov = d.cover_i ? "https://covers.openlibrary.org/b/id/" + d.cover_i + "-M.jpg" : "";
      return '<div class="result">' +
        (cov ? '<img class="cov" src="' + cov + '" alt="" loading="lazy" data-h="' + spineHue(d.title) + '" data-i="' + esc(initials(d.title)) + '" onerror="coverFail(this)">' : tileHTML(d.title)) +
        '<div class="t"><b>' + esc(d.title) + '</b><small>' + esc((d.author_name || []).slice(0,2).join(", ")) + '</small></div>' +
        '<div class="btns"><button type="button" onclick="addFound(' + i + ',\'want\')">Want</button>' +
        '<button type="button" class="pri" onclick="addFound(' + i + ',\'reading\')">Reading</button></div>' +
      '</div>';
    }).join("");
  })
  .catch(function(){
    findBtn(false);
    offerManual(q, "Search didn't work — add it by hand:");
  });
}
function offerManual(q, msg){
  el("addhint").textContent = "";
  window.__manual = q;
  el("results").innerHTML = '<div class="result"><div class="cov blank">' + icon("books") + '</div>' +
    '<div class="t"><b>' + esc(q) + '</b><small>' + esc(msg) + '</small></div>' +
    '<div class="btns"><button type="button" onclick="addManual(\'want\')">Want</button>' +
    '<button type="button" class="pri" onclick="addManual(\'reading\')">Reading</button></div></div>';
}
function addFound(i, shelf){
  var d = window.__found[i];
  addBook({title:d.title, author:(d.author_name || [])[0] || "",
           cover:d.cover_i ? "https://covers.openlibrary.org/b/id/" + d.cover_i + "-M.jpg" : null}, shelf);
}
function addManual(shelf){
  var parts = String(window.__manual).split(/\s+by\s+/i);
  addBook({title:parts[0], author:parts[1] || "", cover:null}, shelf);
}
function addBook(meta, shelf){
  books.unshift({id:uid(), title:meta.title, author:meta.author, cover:meta.cover,
                 shelf:shelf, rating:0, note:"", finishedAt:null});
  el("results").innerHTML = ""; el("addq").value = "";
  haptic("success");
  save(); showTab(shelf);
}

/* ---------- shelf ---------- */
function starsHTML(n){
  var s = ""; for (var i = 1; i <= 5; i++) s += '<svg class="' + (i <= n ? "" : "off") + '"><use href="#i-star"/></svg>';
  return '<div class="stars" aria-label="' + n + ' of 5 stars">' + s + '</div>';
}
function recLabel(){ el("recbtn").disabled = recBusy; el("recbtn").innerHTML = recBusy ? '<i class="spin"></i>Finding your next read…' : icon("spark") + "What should I read next?"; }
function render(){
  renderStats();
  el("recwrap").style.display =
    (hasAsk() && books.filter(function(b){ return b.shelf === "finished" && b.rating >= 4; }).length >= 2) ? "block" : "none";
  recLabel();
  var rows = books.filter(function(b){ return b.shelf === tab; });
  if (!rows.length){
    var msg = tab === "reading" ? "Nothing on the go. Find a book above — or move one over from Want to read."
            : tab === "want" ? "Your someday-pile is empty. Lucky you — go browsing."
            : "Nothing finished yet. The first one's the sweetest.";
    el("shelf").innerHTML = '<div class="card empty"><div class="tile">' + icon("books") + '</div><p>' + msg + '</p></div>';
    return;
  }
  el("shelf").innerHTML = '<div class="shelf">' + rows.map(function(b){
    var acts = "";
    if (tab === "reading") acts = '<button type="button" class="pri" onclick="openFinish(\'' + b.id + '\')">' + icon("check") + 'Finished</button>' +
                                  '<button type="button" onclick="moveBook(\'' + b.id + '\',\'want\')">' + icon("pause") + 'Pause</button>';
    else if (tab === "want") acts = '<button type="button" class="pri" onclick="moveBook(\'' + b.id + '\',\'reading\')">' + icon("play") + 'Start</button>' +
                                    '<button type="button" class="x" aria-label="Remove" onclick="removeBook(\'' + b.id + '\')">' + icon("x") + '</button>';
    else acts = '<button type="button" class="x" aria-label="Remove" onclick="removeBook(\'' + b.id + '\')">' + icon("x") + '</button>';
    return '<div class="book">' + coverHTML(b) +
      '<div class="t"><b>' + esc(b.title) + '</b>' +
      (b.author ? '<small>' + esc(b.author) + '</small>' : '') +
      (b.rating ? starsHTML(b.rating) : '') +
      (b.note ? '<div class="note">“' + esc(b.note) + '”</div>' : '') +
      '</div><div class="acts">' + acts + '</div></div>';
  }).join("") + '</div>';
}
function moveBook(id, shelf){
  var b = books.filter(function(x){ return x.id === id; })[0];
  if (b){ b.shelf = shelf; haptic("selection"); save(); render(); }
}
function removeBook(id){
  books = books.filter(function(x){ return x.id !== id; });
  haptic("light"); save(); render();
}

/* ---------- finishing ---------- */
function openFinish(id){
  finishing = books.filter(function(x){ return x.id === id; })[0];
  if (!finishing) return;
  finRating = 0;
  el("fintitle").textContent = "Finished “" + finishing.title + "”!";
  el("finnote").value = "";
  renderStars();
  el("veil").classList.add("on"); el("sheet").classList.add("on");
  haptic("light");
}
function renderStars(){
  el("bstars").innerHTML = [1,2,3,4,5].map(function(n){
    return '<button type="button" class="' + (n <= finRating ? "on" : "") + '" aria-label="' + n + ' star' + (n > 1 ? "s" : "") + '" onclick="setStar(' + n + ')">' + icon("star") + '</button>';
  }).join("");
}
function setStar(n){ finRating = n; haptic("selection"); renderStars(); }
function confirmFinish(){
  if (!finishing) return;
  finishing.shelf = "finished";
  finishing.rating = finRating;
  finishing.note = el("finnote").value.trim();
  finishing.finishedAt = Date.now();
  closeSheet();
  haptic("success");
  save(); showTab("finished");
}
function closeSheet(){
  el("veil").classList.remove("on"); el("sheet").classList.remove("on");
  finishing = null;
}

/* ---------- AI recommendations ---------- */
/* Labelled lines, not JSON — small models (Apple Intelligence) echo JSON
   templates back verbatim. Echoed instructions are rejected and retried. */
var ECHO = /the book title|author['’]?s name|one short sentence|why i['’]d love it|repeat this line|labelled line/i;
function parseRecs(reply){
  var s = String(reply || ""), recs = [], got = false;
  s.split(/\r?\n/).forEach(function(raw){
    var ln = raw.replace(/\*\*/g, "").trim();
    var m = ln.match(/^[-*#>\s]*(BOOKS?)\s*\d*\s*[:：]\s*(.*)$/i);
    if (!m) return;
    got = true;
    var parts = m[2].split("|").map(function(x){ return x.trim(); });
    if (!parts[0]) return;
    recs.push({title:parts[0], author:parts[1] || "", why:parts.slice(2).join(" | ")});
  });
  if (!got){ // model answered in the old JSON shape — accept it
    var a = s.indexOf("["), b = s.lastIndexOf("]");
    if (a >= 0 && b > a) try{
      var j = JSON.parse(s.slice(a, b + 1));
      if (Array.isArray(j)) recs = j.filter(function(x){ return x && x.title; })
        .map(function(x){ return {title:String(x.title), author:x.author ? String(x.author) : "", why:x.why ? String(x.why) : ""}; });
    }catch(e){}
  }
  recs = recs.filter(function(x){
    return x.title && !ECHO.test(x.title) && !ECHO.test(x.author) && !ECHO.test(x.why);
  });
  if (!recs.length) throw new Error("bad");
  return recs;
}
function recommend(){
  if (!hasAsk() || recBusy) return;
  haptic("light");
  var loved = books.filter(function(b){ return b.shelf === "finished" && b.rating >= 4; })
                   .slice(0, 8)
                   .map(function(b){ return '"' + b.title + '"' + (b.author ? " by " + b.author : "") + " (" + b.rating + "/5" + (b.note ? ", said: " + b.note : "") + ")"; });
  var have = books.map(function(b){ return b.title.toLowerCase(); });
  var p = "Books I loved: " + loved.join("; ") +
      ".\nSuggest 4 books I haven't mentioned that I'd probably love next. Reply with EXACTLY these labelled lines and nothing else:\n" +
      "BOOK: the book title | the author's name | one short sentence on why I'd love it — repeat this line for each of the 4 suggestions";
  var sys = {system:"You are a well-read, honest book recommender."};
  recBusy = true; recLabel();
  el("reccard").style.display = "block";
  el("recs").innerHTML = '<div class="skel"></div><div class="skel"></div><div class="skel"></div>';
  ASK(p, sys)
  .then(function(r){ return parseRecs(r); })
  .catch(function(){
    return ASK(p + "\nIMPORTANT: fill each labelled line with real content — never repeat the instruction text.", sys)
      .then(function(r){ return parseRecs(r); });
  })
  .then(function(recs){
    recs = recs.filter(function(x){ return have.indexOf(String(x.title).toLowerCase()) < 0; }).slice(0, 4);
    if (!recs.length) throw new Error("bad");
    window.__recs = recs;
    el("reccard").style.display = "block";
    el("recs").innerHTML = recs.map(function(x, i){
      return '<div class="rec"><b>' + esc(x.title) + '</b>' + (x.author ? ' <span class="by">— ' + esc(x.author) + '</span>' : '') +
        '<small>' + esc(x.why || "") + '</small>' +
        '<button type="button" class="add" onclick="addRec(' + i + ')">' + icon("plus") + 'Want to read</button></div>';
    }).join("");
    haptic("success");
  })
  .catch(function(){
    el("reccard").style.display = "block";
    el("recs").innerHTML = '<div class="warn">' + icon("warn") + '<span>The recommendations didn\'t come through cleanly — tap the button to try again.</span></div>';
  })
  .then(function(){ recBusy = false; recLabel(); });
}
function addRec(i){
  var x = window.__recs[i];
  addBook({title:x.title, author:x.author || "", cover:null}, "want");
}

/* ---------- boot ---------- */
recLabel();
store.getItem("books").then(function(v){
  if (v){ try{ books = JSON.parse(v) || []; }catch(e){} }
  if (!hasNet()) el("addhint").textContent = "No internet access for apps — you can still add books by hand (type the title, then Find).";
  render();
});

/* myllm-fullscreen-v2 — full screen where MyLLM can also close the app for us
   (myllmClose, 5.6.2+): full screen hides MyLLM's Done, and a page with no way
   out is worse than a repeated title, so elsewhere nothing changes.
   The spacer keeps the header clear of the status bar / Dynamic Island. It is
   live CSS — env(safe-area-inset-top) — not a measured number: the inset is
   still 0 when the page loads and only grows once MyLLM's bar has gone (v1
   measured once, so the title sat under the island). If the page's own styles
   already pad the header down by the inset, the spacer stays at 0. */
(function(){
  function full(){ return !!(window.myllmClose && window.myllmImmersive); }
  /* Does any rule that applies to the header or an ancestor already use the top inset? */
  function pageHandlesInset(head){
    var chain = [], n, found = false;
    for (n = head; n && n.nodeType === 1; n = n.parentElement) chain.push(n);
    function walk(rules){
      for (var i = 0; i < rules.length && !found; i++){
        var r = rules[i];
        if (r.cssRules && !r.selectorText) { walk(r.cssRules); continue; }
        if (!r.selectorText || !/safe-area-inset-top/.test(r.cssText) || !/(padding|margin|top)\s*:/.test(r.cssText)) continue;
        if (/\.imm-safe/.test(r.selectorText)) continue;
        for (var k = 0; k < chain.length; k++){
          try { if (chain[k].matches(r.selectorText)) { found = true; break; } } catch(e){}
        }
      }
    }
    for (var s = 0; s < document.styleSheets.length && !found; s++){
      try { walk(document.styleSheets[s].cssRules); } catch(e){}
    }
    for (n = head; n && n.nodeType === 1 && !found; n = n.parentElement){
      if (/safe-area-inset-top/.test(n.getAttribute("style") || "")) found = true;
    }
    return found;
  }
  function fit(){
    var sp = document.querySelector(".imm-safe"), head = document.querySelector(".head");
    if (!sp || !head) return;
    sp.style.height = (document.body.classList.contains("imm") && !pageHandlesInset(head)) ? "env(safe-area-inset-top)" : "0px";
  }
  function sync(){
    var f = full();
    document.body.classList.toggle("imm", f);
    fit();
    if (!f) return;
    try { window.myllmImmersive(true, { keepAwake:false }).catch(function(){}); } catch(e){}
  }
  window.myllmFSClose = function(){
    try { if (window.myllmHaptic) window.myllmHaptic("light"); } catch(e){}
    try { window.myllmClose().catch(function(){}); } catch(e){}
  };
  document.addEventListener("visibilitychange", function(){ if (!document.hidden) sync(); });
  sync();
})();
</script>
