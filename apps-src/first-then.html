--><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>First–Then</title>
<meta name="myllm:immersive" content="on">
<style>:root{--build-id:"02b3c35123";color-scheme:light dark;
  --bg:var(--myllm-bg,#f2f2f7); --surface:var(--myllm-surface,#fff); --ink:var(--myllm-text,#111);
  --muted:var(--myllm-muted,#8a8a8e); --line:var(--myllm-border,#e3e3e8); --acc:var(--myllm-accent,#0a84ff);
  --fill:rgba(120,120,128,.12); --h:145; }
@media (prefers-color-scheme:dark){ :root{ --bg:var(--myllm-bg,#000); --surface:var(--myllm-surface,#1c1c1e);
  --ink:var(--myllm-text,#f2f2f7); --muted:var(--myllm-muted,#8e8e93); --line:var(--myllm-border,#2c2c2e); --fill:rgba(120,120,128,.24); } }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
  body{ font-family:var(--myllm-font,-apple-system,system-ui,sans-serif); background:var(--bg); color:var(--ink);
    max-width:600px; margin:0 auto; min-height:100dvh; font-size:15.5px; line-height:1.4;
    padding:calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(30px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left)); }
  @media (min-width:768px){ body{ max-width:720px; } }
  svg.i{ width:1.25em; height:1.25em; fill:currentColor; flex-shrink:0; }
  button{ font:inherit; color:inherit; cursor:pointer; } button:active{ transform:scale(.97); }

  .head{ display:flex; align-items:center; gap:12px; margin:2px 2px 14px; }
  .tile{ display:flex; align-items:center; justify-content:center; color:#fff; flex-shrink:0;
    background:linear-gradient(145deg, hsl(var(--h) 50% 42%), hsl(calc(var(--h) + 25) 50% 28%)); }
  .head .tile{ width:44px; height:44px; border-radius:13px; font-size:19px; }
  .head .ht{ flex:1; min-width:0; }
  h1{ font-size:22px; font-weight:800; letter-spacing:-.01em; }
  .head p{ font-size:13px; color:var(--muted); margin-top:1px; }
  .head .acts{ display:flex; gap:8px; flex-shrink:0; }
  .editbtn{ min-width:64px; height:44px; border-radius:12px; border:1px solid var(--line); background:var(--surface); padding:0 14px; font-size:15px; font-weight:700; }
  .editbtn.on{ background:hsl(var(--h) 50% 40%); border-color:transparent; color:#fff; }

  /* The board: what comes first, and what comes then. Calm colours, big type. */
  .board{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px; }
  @media (max-width:360px){ .board{ grid-template-columns:1fr; } }
  .slot{ border-radius:20px; padding:14px; min-height:150px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:6px; border:2px solid transparent; }
  .slot .k{ font-size:12px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; opacity:.8; }
  .slot .em{ font-size:52px; line-height:1.1; }
  .slot .lb{ font-size:19px; font-weight:750; line-height:1.2; overflow-wrap:anywhere; }
  .slot.first{ color:#fff; background:linear-gradient(145deg, hsl(var(--h) 45% 42%), hsl(calc(var(--h) + 25) 45% 28%)); box-shadow:0 10px 26px hsl(var(--h) 45% 25% / .25); }
  .slot.then{ background:var(--surface); border-color:var(--line); }
  .slot.then .k{ color:var(--muted); opacity:1; }
  .slot.empty{ opacity:.55; }
  .slot .hint{ font-size:12.5px; opacity:.85; }

  .prog{ height:10px; border-radius:6px; background:var(--fill); overflow:hidden; margin:0 2px 14px; }
  .prog>div{ height:100%; background:hsl(var(--h) 50% 44%); width:0; transition:width .35s; }

  .card{ background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:14px; margin-bottom:12px; }
  .step{ display:flex; align-items:center; gap:14px; background:var(--surface); border:2px solid var(--line); border-radius:18px; padding:10px 12px; margin-bottom:10px; min-height:72px; transition:opacity .25s; }
  .step.now{ border-color:hsl(var(--h) 45% 48%); }
  .step .em{ font-size:36px; width:52px; text-align:center; flex-shrink:0; }
  .step .lb{ flex:1; min-width:0; font-size:19px; font-weight:650; overflow-wrap:anywhere; }
  .step .ck{ width:44px; height:44px; border-radius:50%; border:3px solid var(--line); flex-shrink:0; display:flex; align-items:center; justify-content:center; color:#fff; font-size:20px; }
  .step.done{ opacity:.5; }
  .step.done .ck{ background:hsl(var(--h) 50% 42%); border-color:hsl(var(--h) 50% 42%); }
  .step.done .lb{ text-decoration:line-through; }
  .step .del{ width:56px; height:56px; margin-right:-6px; border:none; background:none; color:#e5484d; font-size:18px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }

  .celebrate{ text-align:center; padding:18px 10px; font-size:19px; font-weight:750; color:hsl(var(--h) 50% 34%); display:none; }
  @media (prefers-color-scheme:dark){ .celebrate{ color:hsl(var(--h) 50% 62%); } }
  .celebrate.show{ display:block; }

  .editor{ display:none; }
  .editor.show{ display:block; }
  .emojis{ display:grid; grid-template-columns:repeat(auto-fill,minmax(52px,1fr)); gap:6px; margin-bottom:10px; }
  .emojis button{ border:2px solid transparent; background:var(--fill); border-radius:14px; font-size:26px; height:56px; }
  .emojis button.on{ border-color:hsl(var(--h) 50% 42%); background:hsl(var(--h) 50% 45% / .16); }
  .erow{ display:flex; gap:8px; }
  .erow input{ flex:1; min-width:0; border:1px solid var(--line); background:var(--bg); color:var(--ink); border-radius:12px; padding:12px; font:inherit; font-size:16px; outline:none; -webkit-user-select:text; user-select:text; }
  .erow input:focus{ border-color:var(--acc); }
  .erow .add{ flex-shrink:0; min-width:72px; min-height:56px; border:none; background:hsl(var(--h) 50% 40%); color:#fff; border-radius:14px; padding:0 18px; font-size:16px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:6px; }
  .foot{ display:flex; gap:10px; margin-top:6px; }
  .foot button{ flex:1; min-height:56px; border:1px solid var(--line); background:var(--surface); border-radius:16px; font-size:16px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:8px; }
  @media (prefers-reduced-motion:reduce){ .prog>div, .step{ transition:none; } button:active{ transform:none; } }

/* myllm-fullscreen-v1 — MyLLM 5.6.2+ opens this app full screen; the ✕ is the way out. */
.head .imm-acts{display:none;flex-shrink:0;margin-left:auto}
.head .acts + .imm-acts{margin-left:0}
body.imm .head .imm-acts{display:flex}
.head .imm-acts button{width:40px;height:40px;border-radius:12px;border:1px solid var(--myllm-border,rgba(128,128,128,.28));
  background:var(--myllm-surface,rgba(128,128,128,.12));color:var(--myllm-text,currentColor);display:grid;place-items:center;padding:0;cursor:pointer;transition:transform .12s}
.head .imm-acts button:active,.head .imm-x:active{transform:scale(.94)}
.head .imm-x{display:none !important}
body.imm .head .imm-x{display:grid !important;place-items:center}
.imm-x svg,.imm-acts svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}
.imm-safe{display:none}
body.imm .imm-safe{display:block}
</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M4.5 7.2l1.7 1.7 3-3.4M4.5 15.2l1.7 1.7 3-3.4M13 7.5h7M13 15.5h7" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.6l4.6 4.6L19.2 7.4" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></symbol>
  <symbol id="i-again" viewBox="0 0 24 24"><path d="M12 5V2.6a.6.6 0 0 0-1-.45L7.2 5.55a.6.6 0 0 0 0 .9L11 9.85a.6.6 0 0 0 1-.45V7a5.5 5.5 0 1 1-5.5 5.5 1 1 0 0 0-2 0A7.5 7.5 0 1 0 12 5z" fill="currentColor"/></symbol>
</defs></svg>

<div class="imm-safe"></div><div class="head">
  <div class="tile"><svg class="i"><use href="#i-list"/></svg></div>
  <div class="ht"><h1>First–Then</h1><p>Tap each step when it's done. One thing at a time.</p></div>
  <div class="acts"><button class="editbtn" id="editbtn" type="button">Edit</button></div>
<div class="imm-acts"><button type="button" aria-label="Close First–Then" onclick="myllmFSClose()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div></div>

<div class="board" id="board">
  <button class="slot first" id="firstSlot" type="button" aria-label="Mark the first step done"><span class="k">First</span><span class="em" id="fEm"></span><span class="lb" id="fLb"></span><span class="hint" id="fHint">Tap when done</span></button>
  <div class="slot then" id="thenSlot"><span class="k">Then</span><span class="em" id="tEm"></span><span class="lb" id="tLb"></span></div>
</div>
<div class="prog"><div id="progfill"></div></div>

<div class="card editor" id="editor">
  <div class="emojis" id="emojis"></div>
  <div class="erow"><input id="newlabel" placeholder="New step (e.g. Brush teeth)" autocomplete="off"><button class="add" id="addBtn" type="button"><svg class="i"><use href="#i-plus"/></svg>Add</button></div>
</div>
<div id="list"></div>
<div class="celebrate" id="celebrate">🎉 All done — brilliant! 🎉</div>
<div class="foot"><button type="button" id="resetBtn"><svg class="i"><use href="#i-again"/></svg>Start again</button></div>

<script>
function el(i){return document.getElementById(i)}
/* Bridges are looked up when used, never kept: MyLLM can add them after this
   script has run. */
function store(){return window.myllmStorage||{getItem:function(){return Promise.resolve(null)},setItem:function(){return Promise.resolve()}}}
function haptic(s){if(window.myllmHaptic)try{myllmHaptic(s)}catch(e){}}
function icon(n){return '<svg class="i"><use href="#i-'+n+'"/></svg>'}
var DEFAULT=[['🛏️','Wake up'],['🚽','Toilet'],['🪥','Brush teeth'],['👕','Get dressed'],['🥣','Breakfast'],['🎒','Pack my bag']];
var PALETTE=['🛏️','🚽','🪥','👕','🥣','🍎','🎒','🚌','📚','✏️','🧼','🛁','🦷','🧦','👟','🧸','🎨','⚽','🎵','😴','💧','🍽️','🧹','📺'];
var steps=[],editing=false,pickEmoji='⭐';

function board(){
  var todo=steps.filter(function(s){return !s.done});
  var f=todo[0],t=todo[1];
  var fs=el('firstSlot'),ts=el('thenSlot');
  el('board').hidden=editing||!steps.length;
  fs.classList.toggle('empty',!f);fs.disabled=!f;
  el('fEm').textContent=f?f.emoji:'🎉';el('fLb').textContent=f?f.label:'All done';el('fHint').hidden=!f;
  ts.classList.toggle('empty',!t);
  el('tEm').textContent=t?t.emoji:'';el('tLb').textContent=t?t.label:(f?'Finished':'');
}
function render(){
  var L=el('list');L.innerHTML='';
  var now=steps.filter(function(s){return !s.done})[0];
  steps.forEach(function(s,i){
    var d=document.createElement('div');d.className='step'+(s.done?' done':'')+(!editing&&s===now?' now':'');
    d.innerHTML='<div class="em">'+s.emoji+'</div><div class="lb">'+esc(s.label)+'</div>'+
      (editing?'<button class="del" type="button" aria-label="Remove step">'+icon('x')+'</button>':'<div class="ck">'+(s.done?icon('check'):'')+'</div>');
    if(editing){d.querySelector('.del').onclick=function(){steps.splice(i,1);save();render()}}
    else{d.onclick=function(){s.done=!s.done;haptic(s.done?'success':'selection');save();render()}}
    L.appendChild(d);
  });
  var done=steps.filter(function(s){return s.done}).length;
  el('progfill').style.width=(steps.length?done/steps.length*100:0)+'%';
  el('celebrate').classList.toggle('show',!editing&&steps.length>0&&done===steps.length);
  board();
}
function esc(t){return String(t).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function toggleEdit(){editing=!editing;el('editbtn').classList.toggle('on',editing);el('editor').classList.toggle('show',editing);el('editbtn').textContent=editing?'Done':'Edit';render()}
function renderEmojis(){var E=el('emojis');E.innerHTML='';PALETTE.forEach(function(em){var b=document.createElement('button');b.type='button';b.textContent=em;if(em===pickEmoji)b.className='on';b.onclick=function(){pickEmoji=em;renderEmojis()};E.appendChild(b)})}
function addStep(){var v=el('newlabel').value.trim();if(!v)return;steps.push({emoji:pickEmoji,label:v,done:false});el('newlabel').value='';haptic('light');save();render()}
function resetChecks(){steps.forEach(function(s){s.done=false});haptic('medium');save();render()}
function save(){store().setItem('ft_steps',JSON.stringify(steps))}

el('firstSlot').onclick=function(){var f=steps.filter(function(s){return !s.done})[0];if(!f)return;f.done=true;haptic('success');save();render()};
el('editbtn').onclick=toggleEdit;
el('addBtn').onclick=addStep;
el('resetBtn').onclick=resetChecks;
el('newlabel').addEventListener('keydown',function(e){if(e.key==='Enter')addStep()});
renderEmojis();
store().getItem('ft_steps').then(function(v){
  if(v){try{steps=JSON.parse(v)}catch(e){}}
  if(!steps||!steps.length){steps=DEFAULT.map(function(p){return{emoji:p[0],label:p[1],done:false}})}
  render();
});

/* myllm-fullscreen-v1 — full screen where MyLLM can also close the app for us (myllmClose,
   5.6.2+): full screen hides MyLLM's Done, and a page with no way out is
   worse than a repeated title, so elsewhere nothing changes. The spacer keeps
   the header clear of the status bar only if the page doesn't already. */
(function(){
  function full(){ return !!(window.myllmClose && window.myllmImmersive); }
  function inset(){
    var p = document.createElement("div");
    p.style.cssText = "position:fixed;top:0;left:0;width:1px;visibility:hidden;height:env(safe-area-inset-top)";
    document.body.appendChild(p); var h = p.offsetHeight; p.parentNode.removeChild(p); return h;
  }
  function fit(){
    var sp = document.querySelector(".imm-safe"), head = document.querySelector(".head");
    if (!sp || !head) return;
    sp.style.height = "0px";
    if (!document.body.classList.contains("imm")) return;
    var need = inset() + 6 - (head.getBoundingClientRect().top + window.scrollY);
    sp.style.height = Math.max(0, Math.round(need)) + "px";
  }
  function sync(){
    var f = full();
    document.body.classList.toggle("imm", f);
    fit();
    if (!f) return;
    try { window.myllmImmersive(true, { keepAwake:false }).catch(function(){}); } catch(e){}
  }
  window.myllmFSClose = function(){
    try { if (window.myllmHaptic) window.myllmHaptic("light"); } catch(e){}
    try { window.myllmClose().catch(function(){}); } catch(e){}
  };
  document.addEventListener("visibilitychange", function(){ if (!document.hidden) sync(); });
  window.addEventListener("resize", fit);
  sync();
})();
</script></body></html>
