--><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>:root{--build-id:"02b3c35123";color-scheme:light dark;--bg:#f2f2f7;--fg:#111;--card:#fff;--accent:#34a853}
@media(prefers-color-scheme:dark){:root{--bg:#000;--fg:#eee;--card:#1c1c1e}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;min-height:100%}
body{font-family:-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--fg);margin:0;padding:calc(14px + env(safe-area-inset-top)) 14px calc(20px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
h1{font-size:20px;margin:0;font-weight:700}
.sub{font-size:12px;opacity:.55;margin-bottom:12px}
.editbtn{border:0;background:rgba(127,127,127,.16);color:var(--fg);border-radius:12px;padding:7px 13px;font-size:13px;font-weight:600}
.editbtn.on{background:var(--accent);color:#fff}
.prog{height:8px;border-radius:6px;background:rgba(127,127,127,.18);overflow:hidden;margin-bottom:14px}
.prog>div{height:100%;background:var(--accent);width:0;transition:width .35s}
.step{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.08);border:2px solid transparent;transition:opacity .25s}
.step .em{font-size:38px;width:52px;text-align:center}
.step .lb{flex:1;font-size:19px;font-weight:600}
.step .ck{width:34px;height:34px;border-radius:50%;border:3px solid #c7c7cc;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px}
.step.done{opacity:.5}
.step.done .ck{background:var(--accent);border-color:var(--accent)}
.step.done .lb{text-decoration:line-through}
.step .del{border:0;background:transparent;color:#f0584f;font-size:20px;width:34px}
.celebrate{text-align:center;padding:22px 10px;font-size:18px;font-weight:700;color:var(--accent);display:none}
.celebrate.show{display:block}
.editor{background:var(--card);border-radius:16px;padding:12px;margin-bottom:12px;display:none}
.editor.show{display:block}
.emojis{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.emojis button{border:0;background:rgba(127,127,127,.14);border-radius:10px;font-size:24px;width:42px;height:42px}
.emojis button.on{background:var(--accent)}
.erow{display:flex;gap:8px}
.erow input{flex:1;border:1px solid rgba(127,127,127,.3);background:var(--bg);color:var(--fg);border-radius:12px;padding:11px;font-size:16px;-webkit-user-select:text;user-select:text}
.erow .add{border:0;background:var(--accent);color:#fff;border-radius:12px;padding:0 18px;font-size:15px;font-weight:700}
.foot{display:flex;gap:10px;margin-top:6px}
.foot button{flex:1;border:0;background:rgba(127,127,127,.16);color:var(--fg);border-radius:14px;padding:12px;font-size:15px;font-weight:600}
@media(min-width:768px){body{max-width:720px}}
</style></head><body>
<div class="head"><h1>✅ First–Then</h1><button class="editbtn" id="editbtn" onclick="toggleEdit()">Edit</button></div>
<div class="sub">Tap each step when it's done. One thing at a time.</div>
<div class="prog"><div id="progfill"></div></div>
<div class="editor" id="editor">
  <div class="emojis" id="emojis"></div>
  <div class="erow"><input id="newlabel" placeholder="New step (e.g. Brush teeth)"><button class="add" onclick="addStep()">Add</button></div>
</div>
<div id="list"></div>
<div class="celebrate" id="celebrate">🎉 All done — brilliant! 🎉</div>
<div class="foot"><button onclick="resetChecks()">Start again</button></div>
<script>
var store=window.myllmStorage||{getItem:function(){return Promise.resolve(null)},setItem:function(){return Promise.resolve()}};
function haptic(s){if(window.myllmHaptic)try{myllmHaptic(s)}catch(e){}}
var DEFAULT=[['🛏️','Wake up'],['🚽','Toilet'],['🪥','Brush teeth'],['👕','Get dressed'],['🥣','Breakfast'],['🎒','Pack my bag']];
var PALETTE=['🛏️','🚽','🪥','👕','🥣','🍎','🎒','🚌','📚','✏️','🧼','🛁','🦷','🧦','👟','🧸','🎨','⚽','🎵','😴','💧','🍽️','🧹','📺'];
var steps=[],editing=false,pickEmoji='⭐';
function el(i){return document.getElementById(i)}
function render(){
  var L=el('list');L.innerHTML='';
  steps.forEach(function(s,i){
    var d=document.createElement('div');d.className='step'+(s.done?' done':'');
    d.innerHTML='<div class="em">'+s.emoji+'</div><div class="lb">'+esc(s.label)+'</div>'+
      (editing?'<button class="del">✕</button>':'<div class="ck">'+(s.done?'✓':'')+'</div>');
    if(editing){d.querySelector('.del').onclick=function(){steps.splice(i,1);save();render()}}
    else{d.onclick=function(){s.done=!s.done;haptic(s.done?'success':'selection');save();render()}}
    L.appendChild(d);
  });
  var done=steps.filter(function(s){return s.done}).length;
  el('progfill').style.width=(steps.length?done/steps.length*100:0)+'%';
  el('celebrate').classList.toggle('show',steps.length>0&&done===steps.length);
}
function esc(t){return String(t).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function toggleEdit(){editing=!editing;el('editbtn').classList.toggle('on',editing);el('editor').classList.toggle('show',editing);el('editbtn').textContent=editing?'Done':'Edit';render()}
function renderEmojis(){var E=el('emojis');E.innerHTML='';PALETTE.forEach(function(em){var b=document.createElement('button');b.textContent=em;if(em===pickEmoji)b.className='on';b.onclick=function(){pickEmoji=em;renderEmojis()};E.appendChild(b)})}
function addStep(){var v=el('newlabel').value.trim();if(!v)return;steps.push({emoji:pickEmoji,label:v,done:false});el('newlabel').value='';haptic('light');save();render()}
function resetChecks(){steps.forEach(function(s){s.done=false});haptic('medium');save();render()}
function save(){store.setItem('ft_steps',JSON.stringify(steps))}
el('newlabel').addEventListener('keydown',function(e){if(e.key==='Enter')addStep()});
renderEmojis();
store.getItem('ft_steps').then(function(v){
  if(v){try{steps=JSON.parse(v)}catch(e){}}
  if(!steps||!steps.length){steps=DEFAULT.map(function(p){return{emoji:p[0],label:p[1],done:false}})}
  render();
});
</script></body></html>
