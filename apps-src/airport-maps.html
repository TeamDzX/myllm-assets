<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Airport Maps</title>
<meta name="myllm:immersive" content="on">
<style>:root{--build-id:"d076e4507b";color-scheme:light dark;
  --bg:#f4f5f8; --map:#e8ecf0; --surface:#ffffff; --surface2:#f0f1f5; --ink:#15171c; --muted:#6c7280; --faint:#a3a8b3;
  --line:rgba(20,24,32,.09); --chip:rgba(20,24,32,.06); --acc:#0b84d8; --acc2:#4f46e5; --good:#1f9d55; --bad:#d6342c;
  --apron:#dde2e8; --runway:#c3cad4; --road:#d3d8df; --bldg:#ffffff; --bldgline:#8e9aab; --walk:#d3ddeb; --room:#eef2f8; --other:#f4f6f9;
  --shadow:0 10px 30px rgba(20,24,40,.16); --font:-apple-system,system-ui,"Segoe UI",sans-serif; }
@media (prefers-color-scheme:dark){ :root{
  --bg:#0c0e13; --map:#0f1218; --surface:#181b23; --surface2:#20242e; --ink:#eef0f4; --muted:#8f96a3; --faint:#5b6170;
  --line:rgba(255,255,255,.08); --chip:rgba(255,255,255,.07); --acc:#38a8ff; --acc2:#8b86ff; --good:#3ecf7c; --bad:#ff6259;
  --apron:#151920; --runway:#262c38; --road:#1c212a; --bldg:#212835; --bldgline:#4a5568; --walk:#323c4f; --room:#29303e; --other:#191d25;
  --shadow:0 12px 34px rgba(0,0,0,.5); } }
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:var(--font);color:var(--ink);background:var(--bg);height:100vh;height:100dvh;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea{font:inherit;color:inherit}

/* Header */
.head{display:flex;align-items:center;gap:10px;padding:8px 14px 6px;flex-shrink:0}
.tile{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex-shrink:0;
  background:linear-gradient(145deg,#38bdf8,#4f46e5);box-shadow:0 4px 12px rgba(56,120,240,.3)}
.tile svg{width:20px;height:20px;color:#fff}
.ht{min-width:0;flex:1}
.ht h1{font-size:17px;line-height:1.3;font-weight:650;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ht p{font-size:12px;line-height:1.35;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{display:flex;gap:8px;align-items:center}
.hbtn{height:36px;min-width:36px;padding:0 9px;border-radius:11px;background:var(--chip);display:grid;place-items:center;transition:transform .12s}
.hbtn:active{transform:scale(.93)}
.hbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Terminal switcher */
.terms{display:flex;gap:3px;margin:2px 14px 6px;padding:3px;border-radius:12px;background:var(--chip);flex-shrink:0}
.terms button{flex:1;min-width:0;height:32px;border-radius:9px;font-size:14px;line-height:1.3;font-weight:600;color:var(--muted);transition:background .2s,color .2s;white-space:nowrap}
.terms button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}

/* Category chips */
.cats{display:flex;gap:6px;overflow-x:auto;padding:2px 14px 8px;flex-shrink:0;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{flex-shrink:0;display:flex;align-items:center;gap:6px;height:32px;padding:0 11px 0 8px;border-radius:999px;background:var(--surface);
  border:1px solid var(--line);font-size:13px;line-height:1.3;font-weight:600;color:var(--ink);white-space:nowrap}
.cats button i{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}
.cats button i svg{width:12px;height:12px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.cats button i b{font-size:9.5px;line-height:1;color:#fff;font-weight:800}
.cats button span{color:var(--muted);font-weight:600}
.cats button.on{background:var(--ink);color:var(--surface);border-color:transparent}
.cats button.on span{color:var(--surface);opacity:.7}
.cats button.all{padding-left:12px}

/* Map stage */
.stage{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;background:var(--map);border-top:1px solid var(--line)}
canvas#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.fab{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:8px;z-index:2}
.fab button{width:42px;height:42px;border-radius:13px;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center}
.fab button:active{transform:scale(.93)}
.fab svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.levels{position:absolute;left:12px;top:12px;z-index:2;display:flex;flex-direction:column;gap:2px;padding:3px;border-radius:13px;
  background:var(--surface);box-shadow:0 4px 14px rgba(20,24,40,.16);max-height:calc(100% - 24px);overflow-y:auto;scrollbar-width:none}
.levels::-webkit-scrollbar{display:none}
.levels button{min-width:40px;height:32px;padding:0 8px;border-radius:10px;font-size:13px;line-height:1.3;font-weight:650;color:var(--muted);flex-shrink:0}
.levels button.on{background:var(--ink);color:var(--surface)}
.levels .lh{font-size:9.5px;line-height:1.3;font-weight:800;letter-spacing:.6px;color:var(--faint);text-align:center;padding:3px 0 1px}
.legend{position:absolute;left:12px;bottom:12px;font-size:11px;line-height:1.35;color:var(--muted);background:color-mix(in srgb,var(--surface) 88%,transparent);
  padding:5px 8px;border-radius:8px;z-index:1;pointer-events:none;max-width:62%;transition:opacity .4s}
.gcard{position:absolute;left:12px;right:12px;top:10px;z-index:3;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);
  padding:10px 12px;display:none;align-items:center;gap:10px}
.gcard.show{display:flex}
body.haslv .gcard{left:66px}
body.haslv .legend{left:66px;max-width:calc(100% - 136px)}
.gcard .rt{flex:1;min-width:0}
.gcard .rt b{display:block;font-size:14px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcard .rt span{display:block;font-size:12.5px;line-height:1.35;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcard button{font-size:13px;line-height:1.3;font-weight:600;color:var(--acc);padding:6px 6px;flex-shrink:0}

/* Tab bar */
.tabs{display:flex;flex-shrink:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;color:var(--muted);font-size:11px;line-height:1.3;font-weight:600;border-radius:10px}
.tabs button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--acc)}

/* Sheets */
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-radius:20px 20px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.18);
  display:flex;flex-direction:column;max-height:76%;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);visibility:hidden}
.sheet.open{transform:none;visibility:visible}
.grab{height:22px;flex-shrink:0;display:grid;place-items:center;cursor:grab}
.grab::before{content:"";width:38px;height:5px;border-radius:3px;background:var(--faint);opacity:.6}
.sh{display:flex;align-items:center;gap:10px;padding:0 16px 8px;flex-shrink:0}
.sh h2{flex:1;font-size:19px;line-height:1.3;font-weight:700;letter-spacing:-.3px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh .x{width:30px;height:30px;border-radius:50%;background:var(--chip);display:grid;place-items:center;flex-shrink:0}
.sh .x svg{width:13px;height:13px;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}
.sh .back{font-size:15px;line-height:1.3;color:var(--acc);font-weight:600;padding:4px 2px;flex-shrink:0}
.sb{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 18px;flex:1 1 auto;min-height:0;-webkit-user-select:text;user-select:text}
.note{font-size:13px;line-height:1.45;color:var(--muted)}
.sec{font-size:12px;line-height:1.4;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}

/* Rows */
.row{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer;min-height:50px}
.row:last-child{border-bottom:0}
.row:active{background:var(--chip)}
.row .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}
.row .ic svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.row .ic b{font-size:12px;line-height:1;color:#fff;font-weight:800}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:15.5px;line-height:1.35;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t span{display:block;font-size:13px;line-height:1.4;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{font-size:13px;line-height:1.35;color:var(--muted);text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums}
.row .r b{display:block;color:var(--ink);font-size:14px;line-height:1.35}
.row .cnt{min-width:24px;height:22px;padding:0 7px;border-radius:11px;background:var(--chip);color:var(--ink);font-size:12.5px;line-height:22px;font-weight:700;text-align:center;flex-shrink:0}
.row .chev2{color:var(--faint);font-size:15px;flex-shrink:0;transition:transform .2s}
.grp.open .chev2{transform:rotate(90deg)}
.outs{display:none;padding-left:18px;border-bottom:1px solid var(--line)}
.grp.open+.outs{display:block}
.outs .row{min-height:44px;padding:8px 2px}
.outs .row:last-child{border-bottom:0}
.lvl{display:inline-block;font-size:11.5px;line-height:1.3;font-weight:700;padding:1px 6px;border-radius:6px;background:var(--chip);color:var(--muted);margin-left:4px}

/* POI card */
.pc{display:flex;align-items:center;gap:14px;margin:2px 0 8px}
.pc .big{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;flex-shrink:0}
.pc .big svg{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.pc .big b{font-size:19px;line-height:1;color:#fff;font-weight:800}
.pc .pt{min-width:0}
.pc .pt b{display:block;font-size:14px;line-height:1.35;font-weight:650}
.pc .pt span{display:block;font-size:13px;line-height:1.4;color:var(--muted)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.fact{background:var(--surface2);border-radius:12px;padding:9px 11px;min-width:0}
.fact.w{grid-column:1/-1}
.fact small{display:block;font-size:11px;line-height:1.35;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
.fact div{font-size:14.5px;line-height:1.45;margin-top:2px;overflow-wrap:anywhere}
.acts2{display:flex;gap:8px;margin-top:14px}
.btn{flex:1;height:44px;border-radius:12px;background:var(--chip);font-size:14.5px;line-height:1.3;font-weight:600}
.btn.pri{background:linear-gradient(145deg,var(--acc),var(--acc2));color:#fff}

/* Gate grid */
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;margin-top:4px}
.ggrid button{height:38px;border-radius:10px;background:var(--surface2);font-size:14px;line-height:1.3;font-weight:700;font-variant-numeric:tabular-nums}
.ggrid button.on{background:var(--ink);color:var(--surface)}
.nearsec{display:flex;align-items:center;gap:8px;margin:16px 0 4px}
.nearsec i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center}
.nearsec i svg{width:13px;height:13px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.nearsec i b{font-size:10px;line-height:1;color:#fff;font-weight:800}
.nearsec h3{font-size:15px;line-height:1.35;font-weight:700}

/* Ask */
.ask textarea{width:100%;min-height:64px;border-radius:13px;border:1px solid var(--line);background:var(--surface2);padding:11px 12px;font-size:16px;line-height:1.4;resize:none;outline:none;-webkit-user-select:text;user-select:text}
.ask textarea:focus{border-color:var(--acc)}
.sugg{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.sugg button{font-size:13px;line-height:1.3;padding:7px 11px;border-radius:999px;background:var(--chip);color:var(--ink)}
.answer{margin-top:12px;background:var(--surface2);border-radius:14px;padding:12px 13px;font-size:15px;line-height:1.5;white-space:pre-wrap}
.answer small{display:block;font-size:11.5px;line-height:1.35;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--acc);margin-bottom:6px}
.skel{height:14px;border-radius:7px;background:var(--chip);margin:12px 0;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}

/* Search overlay */
.search{position:absolute;inset:0;z-index:8;background:var(--surface);display:none;flex-direction:column}
.search.open{display:flex}
.sbar{display:flex;align-items:center;gap:10px;padding:10px 14px;flex-shrink:0;border-bottom:1px solid var(--line)}
.sbar input{flex:1;min-width:0;height:42px;border-radius:12px;border:0;background:var(--surface2);padding:0 14px;font-size:16px;line-height:1.3;outline:none;-webkit-user-select:text;user-select:text}
.sbar button{font-size:15px;line-height:1.3;color:var(--acc);font-weight:600}
.sres{flex:1;min-height:0;overflow-y:auto;padding:0 16px 20px}

.toast{position:absolute;left:50%;top:14px;transform:translate(-50%,-10px);opacity:0;pointer-events:none;z-index:9;background:var(--ink);color:var(--surface);
  font-size:13px;line-height:1.35;font-weight:600;padding:8px 13px;border-radius:10px;transition:.25s;max-width:86%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (orientation:landscape) and (max-height:560px){
  .head{padding-top:4px;padding-bottom:4px} .ht p{display:none}
  .terms{margin-bottom:4px} .terms button{height:28px}
  .cats{padding-bottom:6px} .cats button{height:28px}
  .sheet{left:auto;right:10px;bottom:10px;top:10px;width:min(400px,52%);max-height:none;border-radius:18px}
  .tabs{padding-top:4px} .tabs button{flex-direction:row;justify-content:center;gap:6px;font-size:12px}
  .tabs button svg{width:19px;height:19px}
  .levels button{height:28px}
}
@media (prefers-reduced-motion:reduce){ .sheet{transition:none} .skel{animation:none} }

/* myllm-fullscreen-v2 — MyLLM 5.6.2+ opens this app full screen; the ✕ is the way out. */
.head .imm-acts{display:none;flex-shrink:0;margin-left:auto}
.head .acts + .imm-acts{margin-left:0}
body.imm .head .imm-acts{display:flex}
.head .imm-acts button{width:36px;height:36px;border-radius:11px;border:1px solid var(--line);
  background:var(--chip);color:var(--ink);display:grid;place-items:center;padding:0;cursor:pointer;transition:transform .12s}
.head .imm-acts button:active{transform:scale(.94)}
.imm-acts svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}
.imm-safe{display:none}
body.imm .imm-safe{display:block}
</style></head><body>

</div>

<div class="tabs" id="tabs">
  <button data-tab="map" class="on"><svg viewBox="0 0 24 24"><path d="M9 4L3 6.5v13.5l6-2.5 6 2.5 6-2.5V4l-6 2.5z"/><path d="M9 4v13.5M15 6.5V20"/></svg>Map</button>
  <button data-tab="places"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1.2" fill="currentColor"/><circle cx="4" cy="12" r="1.2" fill="currentColor"/><circle cx="4" cy="18" r="1.2" fill="currentColor"/></svg>Places</button>
  <button data-tab="gates"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="3"/><path d="M9 5v14M4 12h5"/></svg>Near gate</button>
  <button data-tab="travel"><svg viewBox="0 0 24 24"><rect x="6" y="3.5" width="12" height="13" rx="3"/><path d="M6 10.5h12M9 20l1.5-3.5M15 20l-1.5-3.5M9 13.5h.01M15 13.5h.01"/></svg>Getting there</button>

<script>
'use strict';
/* Data: © OpenStreetMap contributors, ODbL 1.0 — built by verify/_tmp/airport_build.py.

  CAT_ORDER.forEach(function(k){
    var g=groups[k]; if(!g)return;
    g.sort(function(a,b){ return k==='gate'?natCmp(a.x2.ref||'',b.x2.ref||''):a.name.localeCompare(b.name); });
    h+='<div class="sec">'+esc(CATS[k].name)+' · '+g.length+'</div>'+groupRows(g);
  });
  openSheet(t?t.name:'Around the airport',h);
  bindRows($('shBody'),{label:'Places',fn:showPlaces});
  var ab=$('askBtn'); if(ab)ab.onclick=function(){ haptic('light'); showAsk(); };
}
function natCmp(a,b){ var re=/(\d+)|(\D+)/g, x=a.match(re)||[], y=b.match(re)||[];
  for(var i=0;i<Math.min(x.length,y.length);i++){ var p=x[i],q=y[i]; if(p===q)continue; var np=/^\d/.test(p), nq=/^\d/.test(q);
    if(np&&nq)return +p-+q; return p.localeCompare(q); } return x.length-y.length; }

/* ---------- One place ---------- */
function hoursNice(s){
  s=String(s).trim(); if(/^24\/7$/.test(s)||/^Mo-Su 00:00-(24:00|23:59)$/.test(s))return 'Open 24 hours';
  var D={Mo:'Mon',Tu:'Tue',We:'Wed',Th:'Thu',Fr:'Fri',Sa:'Sat',Su:'Sun',PH:'Bank holidays'};
  return s.split(/\s*;\s*/).map(function(part){ return part.replace(/\b(Mo|Tu|We|Th|Fr|Sa|Su|PH)\b/g,function(m){return D[m]}).replace(/-/g,'–').replace(/,/g,', ').replace(/\boff\b/,'closed'); }).join('\n');
}
function openPoi(p,from){
  selected=p.i;
  if(p.t!==S.term&&!(S.term!=='AIR'&&p.terms.indexOf(S.term)>=0)){
    if(p.t==='AIR'){ if(S.term!=='AIR')setTerm('AIR',true); } else setTerm(p.t,true);
  }
  var t=term();
  if(t&&p.lv.length&&curLevel()!==null&&p.lv.indexOf(curLevel())<0){ S.level[t.id]=null; renderLevels(); }
  var x=p.x2, facts=[];
  facts.push(['Where',termName(p.t)+(x.terms&&x.terms.indexOf(',')>0?' (also '+x.terms.split(',').slice(1).map(termName).join(', ')+')':''),false]);
  facts.push(['Level',p.lv.length?lvLabel(p).replace(/^Levels? /,''):'Not recorded',false]);
  if(p.side)facts.push(['Side',p.side==='Airside'?'Airside (after security)':'Landside (before security)',true]);
  if(x.opening_hours)facts.push(['Opening hours',hoursNice(x.opening_hours),true]);
  if(x.cuisine)facts.push(['Food',x.cuisine.replace(/_/g,' ').replace(/;/g,', '),false]);
  if(x.brand&&x.brand!==p.name)facts.push(['Brand',x.brand,false]);
  if(x.operator)facts.push(['Run by',x.operator,false]);
  if(x.wheelchair)facts.push(['Wheelchair',{yes:'Accessible',limited:'Limited access',no:'Not accessible',designated:'Accessible'}[x.wheelchair]||x.wheelchair,false]);
  if(p.cat==='toilets'){ var g=[]; if(x.female==='yes')g.push('Women'); if(x.male==='yes')g.push('Men'); if(x.unisex==='yes')g.push('All genders'); if(g.length)facts.push(['For',g.join(', '),false]); }
  if(x.changing_table==='yes')facts.push(['Baby changing','Yes',false]);
  if(x.capacity)facts.push(['Spaces',x.capacity,false]);
  if(x.fee)facts.push(['Fee',x.fee==='yes'?'Charged':x.fee==='no'?'Free':x.fee,false]);
  var h='<div class="pc"><div class="big" style="background:'+catColor(p.cat)+'">'+iconHTML(p.cat,p.kind)+'</div><div class="pt"><b>'+esc(p.kind)+'</b><span>'+esc(CATS[p.cat].name)+'</span></div></div>'+
    '<div class="facts">'+facts.map(function(f){ return '<div class="fact'+(f[2]||String(f[1]).length>18?' w':'')+'"><small>'+esc(f[0])+'</small><div>'+esc(f[1]).replace(/\n/g,'<br>')+'</div></div>'; }).join('')+'</div>'+
    '<div class="acts2"><button class="btn pri" id="pShow">Show on map</button>'+(p.cat==='gate'?'<button class="btn" id="pNear">What’s near</button>':'')+'</div>';
  openSheet(p.name,h,from?{back:from.label,onBack:from.fn}:null);
  $('pShow').onclick=function(){ haptic('light'); showOnMap(p); };
  var pn=$('pNear'); if(pn)pn.onclick=function(){ haptic('light'); pickGate(p.i); };
  draw();
}
function showOnMap(p){
  closeSheet(); selected=p.i;
  var s=Math.max(view.s,baseS*4), t={s:s,tx:W/2-p.x*s,ty:H/2-p.y*s};
  animateTo(t); draw();
}

/* ---------- Near a gate ---------- */
function gatesOf(tid){ return AP.pois.filter(function(p){return p.cat==='gate'&&p.t===tid}).sort(function(a,b){return natCmp(a.x2.ref||'',b.x2.ref||'')}); }
function showGates(){
  var t=term();
  if(!t){
    openSheet('Near a gate','<p class="note">Pick your terminal first.</p><div class="acts2">'+AP.terms.map(function(t){return '<button class="btn" data-t="'+t.id+'">'+t.id+'</button>'}).join('')+'</div>');
    $('shBody').querySelectorAll('[data-t]').forEach(function(b){ b.onclick=function(){ setTerm(b.dataset.t,true); showGates(); }; });
    return;
  }
  var gs=gatesOf(t.id);
  var h='<p class="note">Pick your gate to see the nearest toilets, food, shops and more. Distances are in a straight line on the map, so the walk may be longer; each place shows its level.</p>';
  if(!gs.length)h+='<p class="note" style="margin-top:10px">No gates are mapped for '+esc(t.name)+' yet.</p>';
  h+='<div class="ggrid">'+gs.map(function(g){ return '<button data-g="'+g.i+'" class="'+(nearGate===g.i?'on':'')+'">'+esc(g.x2.ref)+'</button>'; }).join('')+'</div>';
  if(nearGate!==null)h+=nearHTML();
  openSheet('Near a gate · '+t.id,h);
  $('shBody').querySelectorAll('[data-g]').forEach(function(b){ b.onclick=function(){ haptic('light'); pickGate(+b.dataset.g); }; });
  bindRows($('shBody'),{label:'Near gate',fn:showGates});
  var cl=$('nearClear'); if(cl)cl.onclick=clearNear;
}
var NEAR_CATS=['toilets','food','shop','lounge','service'];
function computeNear(gi){
  var g=AP.pois[gi], out=[];
  NEAR_CATS.forEach(function(k){
    // Not filtered by level: a gate's recorded level is often the boarding
    // level, while the shops it's near are a floor or two up. Each row shows its level.
    var cand=AP.pois.filter(function(p){ return p.cat===k&&p.terms.indexOf(g.t)>=0; });
    cand.forEach(function(p){ p._d=Math.hypot(p.x-g.x,p.y-g.y); });
    cand.sort(function(a,b){return a._d-b._d});
    cand.slice(0,k==='toilets'?3:k==='service'?3:4).forEach(function(p){ out.push({p:p,d:p._d,cat:k}); });
  });
  return out;
}
function pickGate(gi){
  var g=AP.pois[gi];
  if(S.term!==g.t)setTerm(g.t,true);
  nearGate=gi; nearList=computeNear(gi); selected=null;
  var t=term(); if(t&&curLevel()!==null){ S.level[t.id]=null; renderLevels(); }
  $('gcT').textContent='Near gate '+g.x2.ref; $('gcS').textContent=nearList.length+' places · straight-line distances';
  $('gcard').classList.add('show');
  curTab='gates'; document.querySelectorAll('.tabs button').forEach(function(b){ b.classList.toggle('on',b.dataset.tab==='gates'); });
  showGates(); requestAnimationFrame(function(){ homeView(true); });
}
function walk(d){ var m=Math.max(1,Math.round(d/75)); return '<b>'+m+' min</b>'+(d<1000?Math.round(d/10)*10+' m':(d/1000).toFixed(1)+' km'); }
function nearHTML(){
  var g=AP.pois[nearGate], h='<div class="sec">Nearest to gate '+esc(g.x2.ref)+'</div>';
  NEAR_CATS.forEach(function(k){
    var rows=nearList.filter(function(n){return n.cat===k}); if(!rows.length)return;
    h+='<div class="nearsec"><i style="background:'+catColor(k)+'">'+iconHTML(k)+'</i><h3>'+esc(CATS[k].name)+'</h3></div>'+groupRows(rows.map(function(n){return n.p}),function(p){ return '<div class="r">'+walk(p._d)+'</div>'; });
  });
  if(!nearList.length)h+='<p class="note">Nothing mapped near this gate yet.</p>';
  h+='<div class="acts2"><button class="btn" id="nearClear">Clear gate</button></div><p class="note" style="margin-top:10px">Walking times assume about 4.5 km/h in a straight line; follow the airport’s signs.</p>';
  return h;
}
function clearNear(){ nearGate=null; nearList=[]; $('gcard').classList.remove('show'); draw(); if(curTab==='gates')showGates(); }
$('gcClear').onclick=function(){ haptic('light'); clearNear(); };
$('gcOpen').onclick=function(){ haptic('light'); curTab='gates'; showGates(); };

/* ---------- Getting there ---------- */
function showTravel(){
  var t=term();
  var list=AP.pois.filter(function(p){ return (p.cat==='transport'||p.cat==='parking')&&(t?p.terms.indexOf(t.id)>=0:true); });
  var extra=t?AP.pois.filter(function(p){ return p.cat==='transport'&&p.t==='AIR'&&(p.kind==='Station'||p.kind==='Bus & coach'); }):[];
  var groups=[['Trains','Station'],['Transit trains between gates','Transit train'],['Buses & coaches','Bus & coach'],['Taxis','Taxi'],['Car hire','Car hire'],['Parking','Car park']];
  var h='<p class="note">'+(t?'How to reach '+esc(t.name)+', from the map data.':'Stations, buses, taxis, car hire and parking around the airport, from the map data.')+' Check times with the operator before you travel.</p>';
  groups.forEach(function(g){
    var rows=list.filter(function(p){return p.kind===g[1]}).sort(function(a,b){return a.name.localeCompare(b.name)});
    if(!rows.length)return;
    h+='<div class="sec">'+g[0]+'</div>'+groupRows(rows);
  });
  if(t&&extra.length){ h+='<div class="sec">Elsewhere at the airport</div>'+extra.filter(function(p){return list.indexOf(p)<0}).map(function(p){return poiRow(p)}).join(''); }
  openSheet('Getting there'+(t?' · '+t.id:''),h);
  bindRows($('shBody'),{label:'Getting there',fn:showTravel});
}

/* ---------- Ask your AI ---------- */
function askAvailable(){ return typeof window.myllmAsk==='function'; }
var lastAsk={q:'',a:''};
function showAsk(){
  var t=term(); if(!t)return;
  var sug=['Where can I get breakfast?','Is there a pharmacy airside?','Where are the quietest toilets?','Which lounges are here?'];
  var h='<div class="ask"><p class="note">Your AI answers from the places mapped in '+esc(t.name)+'. It only knows what the map shows.</p>'+
    '<div class="sugg">'+sug.map(function(s){return '<button data-s="'+esc(s)+'">'+esc(s)+'</button>'}).join('')+'</div>'+
    '<textarea id="askQ" placeholder="Ask about '+esc(t.name)+'">'+esc(lastAsk.q)+'</textarea>'+
    '<div class="acts2"><button class="btn pri" id="askGo">Ask</button></div><div id="askOut">'+(lastAsk.a?answerHTML(lastAsk.a):'')+'</div></div>';
  openSheet('Ask about '+t.id,h,{back:'Places',onBack:showPlaces});
  $('shBody').querySelectorAll('[data-s]').forEach(function(b){ b.onclick=function(){ $('askQ').value=b.dataset.s; }; });
  $('askGo').onclick=function(){ doAsk(t); };
}
function answerHTML(a){ return '<div class="answer"><small>Your AI, from the map data</small>'+esc(a)+'</div>'; }
function doAsk(t){
  var q=$('askQ').value.trim(); if(!q)return;
  haptic('light'); $('askGo').disabled=true; $('askOut').innerHTML='<div class="skel"></div><div class="skel" style="width:70%"></div>';
  var lines=AP.pois.filter(function(p){ return p.terms.indexOf(t.id)>=0&&p.cat!=='lift'; }).map(function(p){
    var b=[p.name+' — '+p.kind]; if(p.lv.length)b.push('level '+p.lv.join('/')); if(p.side)b.push(p.side.toLowerCase()); if(p.x2.opening_hours)b.push('hours '+p.x2.opening_hours); return b.join(', ');
  });
  var ctxTxt=lines.join('\n'); if(ctxTxt.length>7000)ctxTxt=ctxTxt.slice(0,7000);
  var prompt='You are helping a traveller at '+AP.name+' airport, '+t.name+'. These are the places the map (OpenStreetMap) lists in this terminal; it may be incomplete:\n'+ctxTxt+
    '\n\nAnswer the question in two to four short sentences, using only this list. Mention levels and airside/landside when known. If the list does not show it, say the map doesn’t show it and suggest the airport’s signs or information desks.\nQuestion: '+q;
  lastAsk.q=q;
  Promise.resolve().then(function(){ return window.myllmAsk(prompt); }).then(function(r){
    lastAsk.a=String(r||'').trim()||'No answer came back.'; if($('askOut'))$('askOut').innerHTML=answerHTML(lastAsk.a);
  }).catch(function(){ if($('askOut'))$('askOut').innerHTML='<p class="note" style="margin-top:10px">Couldn’t reach your AI just now.</p>'; })
  .then(function(){ if($('askGo'))$('askGo').disabled=false; });
}

/* ---------- Search ---------- */
function openSearch(){ $('search').classList.add('open'); $('q').value=''; renderResults(''); setTimeout(function(){ $('q').focus(); },60); }
function closeSearch(){ $('search').classList.remove('open'); $('q').blur(); }
$('findBtn').onclick=function(){ haptic('light'); openSearch(); };
$('qCancel').onclick=closeSearch;
$('q').addEventListener('input',function(){ renderResults(this.value); });
function renderResults(q){
  var f=fold(q), h='';
  if(!f){
    var gs=S.term!=='AIR'?gatesOf(S.term).length:0;
    h='<p class="note" style="margin-top:12px">Search every terminal by name, brand, type or gate number — try “coffee”, “pharmacy”, “Boots” or “A10”.'+(gs?'':'')+'</p>';
    $('qRes').innerHTML=h; return;
  }
  var toks=f.split(' ');
  var res=AP.pois.filter(function(p){ return p.cat!=='lift'&&toks.every(function(t){ return (' '+p.key).indexOf(' '+t)>=0||(p.cat==='gate'&&fold(p.x2.ref)===t); }); });
  function exact(p){ return fold(p.name)===f||fold(p.x2.ref||'')===f?0:1; }
  res.sort(function(a,b){ return exact(a)-exact(b)||(a.t===S.term?0:1)-(b.t===S.term?0:1)||a.name.localeCompare(b.name); });
  res=res.slice(0,80);
  h=res.length?groupRows(res):'<p class="note" style="margin-top:12px">Nothing mapped by that name. Try a type, like “coffee” or “toilets”.</p>';
  $('qRes').innerHTML=h;
  $('qRes').querySelectorAll('.row[data-p]').forEach(function(r){ r.onclick=function(){ haptic('light'); closeSearch(); openPoi(AP.pois[+r.dataset.p]); }; });
  $('qRes').querySelectorAll('.row.grp').forEach(function(r){ r.onclick=function(){ haptic('light'); r.classList.toggle('open'); }; });
}

/* ---------- About ---------- */
function showAbout(){
  var h='<p class="note">Airport Maps draws its own maps from OpenStreetMap: terminal outlines, walkways, shops, restaurants, toilets, gates, lounges, transport and parking, as volunteers have mapped them. It is not an official airport map and is not affiliated with or endorsed by Heathrow Airport Limited or any airline.</p>'+
    '<div class="sec">Data</div><p class="note">© OpenStreetMap contributors. Available under the Open Database License (ODbL 1.0); the airport data in this app is a derivative database under the ODbL. Map data as of '+esc(AP.stamp||'2026')+'.</p>'+
    '<div class="sec">Good to know</div><p class="note">Places open, close and move, and some aren’t mapped at all. Levels are shown where the map records them. There is no indoor positioning: distances near a gate are straight lines, not walking routes. Follow the airport’s signs and check your gate on the departure boards.</p>'+
    '<div class="sec">More airports</div><p class="note">Heathrow is the first. Each airport is built from open data, so more will follow where the mapping is good.</p>';
  openSheet('About Airport Maps',h);
}
$('aboutBtn').onclick=function(){ haptic('light'); showAbout(); };

/* ---------- Toast ---------- */
var tt; function toast(m){ var t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(function(){t.classList.remove('show')},1500); }

/* ---------- Boot ---------- */
readColors();
DARK.addEventListener&&DARK.addEventListener('change',function(){ readColors(); renderCats(); draw(); });
if(window.ResizeObserver)new ResizeObserver(function(){ resize(); placeFab(); }).observe(stage);
addEventListener('resize',function(){ resize(); placeFab(); });
AP=prep(S.ap);
resize();
load(function(){
  AP=prep(S.ap)||prep(Object.keys(DATA)[0]);
  $('apTitle').textContent='Airport Maps';
  // the whole-airport scale is the reference for zoom-dependent detail
  S.term=S.term||'AIR';
  refScale(); renderTerms(); setTerm(S.term,true);
});

/* myllm-fullscreen-v2 — full screen where MyLLM can also close the app for us
   (myllmClose, 5.6.2+): full screen hides MyLLM's Done, and a page with no way
   out is worse than a repeated title, so elsewhere nothing changes. This page
   pads its own top by env(safe-area-inset-top), so the spacer stays at 0. */
(function(){
  function full(){ return !!(window.myllmClose && window.myllmImmersive); }
  function sync(){
    var f = full();
    document.body.classList.toggle("imm", f);
    var sp = document.querySelector(".imm-safe"); if (sp) sp.style.height = "0px";
    if (!f) return;
    try { window.myllmImmersive(true, { keepAwake:false }).catch(function(){}); } catch(e){}
  }
  window.myllmFSClose = function(){
    try { if (window.myllmHaptic) window.myllmHaptic("light"); } catch(e){}
    try { window.myllmClose().catch(function(){}); } catch(e){}
  };
  document.addEventListener("visibilitychange", function(){ if (!document.hidden) sync(); });
  sync();
})();
</script></body></html>
