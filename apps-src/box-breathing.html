<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>:root{color-scheme:dark}
body{font-family:-apple-system,system-ui,sans-serif;margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0b2a33;color:#dff7ff;text-align:center}
h1{font-size:20px;font-weight:600;opacity:.85;margin:0 0 30px}
#box{width:160px;height:160px;border-radius:24px;background:rgba(100,210,255,.18);border:2px solid #64d2ff;transition:transform 3.8s ease-in-out;transform:scale(.72)}
#phase{font-size:26px;font-weight:700;margin:30px 0 6px;min-height:32px}
#count{font-size:15px;opacity:.6;min-height:20px}
button{margin-top:26px;border:0;border-radius:12px;padding:13px 34px;font-size:16px;font-weight:600;background:#64d2ff;color:#06222b}
</style></head><body>
<h1>Box Breathing · 4 · 4 · 4 · 4</h1>
<div id="box"></div>
<div id="phase">Ready?</div>
<div id="count"></div>
<button id="go" onclick="toggle()">Start</button>
<script>
var phases=[['Breathe in','scale(1)'],['Hold','scale(1)'],['Breathe out','scale(.72)'],['Hold','scale(.72)']];
var timer=null,step=0,tick=0;
function toggle(){if(timer){clearInterval(timer);timer=null;document.getElementById('go').textContent='Start';
document.getElementById('phase').textContent='Nice work 🌊';document.getElementById('count').textContent='';return}
step=-1;next();timer=setInterval(function(){tick--;if(tick<=0)next();else document.getElementById('count').textContent=tick},1000);
document.getElementById('go').textContent='Stop'}
function next(){step=(step+1)%4;tick=4;
document.getElementById('phase').textContent=phases[step][0];
document.getElementById('count').textContent=4;
document.getElementById('box').style.transform=phases[step][1]}
</script></body></html>
