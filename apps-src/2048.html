<title>2048</title>
<style>:root{--build-id:"9f8a708f9e";color-scheme:light dark}
  @property --h{ syntax:'<number>'; inherits:true; initial-value:42; }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{ font-family:var(--myllm-font,-apple-system,system-ui,sans-serif); background:#0b0b10; color:#fff; overflow:hidden;
    touch-action:none; overscroll-behavior:none; -webkit-user-select:none; user-select:none; }
  button{ font:inherit; color:inherit; }

  /* The stage: a hue-tinted backdrop in two layers, dark and light, so the
     change between them can fade. */
  .stage{ position:fixed; inset:0; --h:42; transition:--h 1.4s ease; color:#fff; }
  .bg{ position:absolute; inset:0; transition:opacity .6s ease; }
  .bg.d{ background:radial-gradient(120% 90% at 20% 10%, hsl(var(--h) 70% 34%), transparent 60%),
      radial-gradient(120% 90% at 85% 95%, hsl(calc(var(--h) + 60) 65% 26%), transparent 62%), #0b0b10; }
  .bg.l{ opacity:0; background:radial-gradient(120% 90% at 20% 0%, hsl(var(--h) 80% 84%), transparent 60%),
      radial-gradient(120% 90% at 85% 100%, hsl(calc(var(--h) + 60) 78% 86%), transparent 62%), #f4f4f8; }
  .lite{ color:#15151a; } .lite .bg.l{ opacity:1; } .lite .bg.d{ opacity:0; }

  .col{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
    padding:calc(12px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left)); }
  .top{ width:100%; max-width:560px; height:44px; display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
  .lbl{ font-size:11px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; opacity:.62; white-space:nowrap; }
  .glass{ border:1px solid rgba(255,255,255,.16); background:rgba(255,255,255,.12); color:inherit;
    -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px); }
  .lite .glass{ border-color:rgba(0,0,0,.09); background:rgba(255,255,255,.62); }
  svg{ width:1.25em; height:1.25em; fill:currentColor; flex-shrink:0; }
  .rnd{ width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0; }
  .pill{ min-width:44px; height:44px; border-radius:99px; padding:0 16px; display:flex; align-items:center; justify-content:center; gap:6px;
    font-size:19px; font-weight:800; font-variant-numeric:tabular-nums; flex-shrink:0; }
  .pill small{ font-size:10px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; opacity:.6; }
  .pill.bump{ animation:bump .28s ease; }
  @keyframes bump{ 40%{ transform:scale(1.18); } }
  .top .hide{ visibility:hidden; }

  .wrap{ flex:1; width:100%; min-height:0; position:relative; display:flex; align-items:center; justify-content:center; margin:10px 0 34px; }
  .foot{ position:absolute; left:0; right:0; top:calc(50% + var(--bh,320px) / 2 + 12px); text-align:center; font-size:12px; font-weight:600;
    letter-spacing:.02em; opacity:.55; font-variant-numeric:tabular-nums; white-space:nowrap; }

  /* One glass card over the board: title, paused, finished. */
  .sheet{ position:absolute; left:50%; top:50%; width:max(232px, min(300px, calc(var(--b,320px) - 44px))); transform:translate(-50%,-50%) scale(.96);
    opacity:0; pointer-events:none; border-radius:26px; padding:22px 20px 18px; text-align:center; box-shadow:0 24px 60px rgba(0,0,0,.35); z-index:5;
    transition:opacity .28s ease, transform .28s cubic-bezier(.2,.8,.2,1); }
  .sheet.on{ opacity:1; transform:translate(-50%,-50%); pointer-events:auto; }
  /* whatever sits under an open card steps back, so the card reads */
  .under{ transition:opacity .3s, filter .3s; } .veil .under{ opacity:.28; filter:blur(2px); }
  .lite .sheet{ box-shadow:0 22px 50px rgba(20,20,40,.18); }
  .sheet h1{ font-size:30px; font-weight:800; letter-spacing:-.02em; }
  .sheet p{ font-size:13.5px; line-height:1.4; opacity:.72; margin-top:6px; }
  .kick{ font-size:11px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; opacity:.62; }
  .big{ font-size:64px; font-weight:800; line-height:1.05; letter-spacing:-.03em; font-variant-numeric:tabular-nums; margin-top:4px; }
  .big small{ display:block; font-size:12px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; opacity:.6; margin-top:2px; }
  .best{ display:inline-block; margin-top:10px; font-size:11.5px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; opacity:.7; }
  .best.new{ opacity:1; color:#0b0b10; background:#ffd60a; border-radius:99px; padding:5px 11px; }
  .sheet .act{ width:100%; height:50px; border-radius:99px; margin-top:10px; font-size:16px; font-weight:750;
    display:flex; align-items:center; justify-content:center; gap:8px; }
  .sheet .act:first-of-type{ margin-top:18px; }
  .sheet .act:active, .rnd:active{ transform:scale(.96); }
  .pri{ border:none; background:#fff; color:#0b0b10; box-shadow:0 10px 30px rgba(0,0,0,.3); }
  .lite .pri{ background:#15151a; color:#fff; box-shadow:0 10px 26px rgba(20,20,40,.22); }

  @media (max-height:430px){
    .sheet{ padding:14px 18px 14px; } .sheet h1{ font-size:24px; } .big{ font-size:42px; }
    .sheet .act{ height:44px; margin-top:8px; } .sheet .act:first-of-type{ margin-top:12px; } .sheet p{ display:none; }
    .wrap{ margin:6px 0 26px; }
  }
  @media (prefers-reduced-motion:reduce){ .pill.bump{ animation:none; } .stage{ transition:none; } }

  .board{ position:relative; z-index:1; width:var(--b,320px); height:var(--b,320px); border-radius:26px; background:rgba(10,10,16,.42);
    border:1px solid rgba(255,255,255,.12); box-shadow:0 24px 60px rgba(0,0,0,.45); transition:background .6s, box-shadow .6s; flex-shrink:0; }
  .lite .board{ background:rgba(255,255,255,.6); border-color:rgba(0,0,0,.06); box-shadow:0 22px 50px rgba(20,20,40,.16); }
  .slot, .tile{ position:absolute; left:0; top:0; width:var(--t,70px); height:var(--t,70px); border-radius:calc(var(--t,70px) * .17); }
  .slot{ background:rgba(255,255,255,.06); } .lite .slot{ background:rgba(20,20,40,.06); }
  /* The outer box slides; the inner face pops — so the two never fight over transform. */
  .tile{ transition:transform .13s cubic-bezier(.2,.8,.2,1); z-index:2; }
  .tile.gone{ z-index:1; }
  .still .tile{ transition:none; }
  .tile b{ display:flex; width:100%; height:100%; align-items:center; justify-content:center; border-radius:inherit;
    font-weight:800; letter-spacing:-.02em; font-variant-numeric:tabular-nums; box-shadow:inset 0 1px 0 rgba(255,255,255,.28), 0 4px 12px rgba(0,0,0,.18); }
  .tile.new b{ animation:tin .2s cubic-bezier(.2,.8,.2,1) .09s both; }
  .tile.hit b{ animation:thit .22s ease .1s; }
  @keyframes tin{ from{ transform:scale(.2); opacity:0; } to{ transform:none; opacity:1; } }
  @keyframes thit{ 45%{ transform:scale(1.16); } }
  .toast{ position:absolute; left:50%; top:calc(50% - var(--bh,320px) / 2 - 8px); transform:translate(-50%,-100%) translateY(6px); opacity:0; pointer-events:none;
    border-radius:99px; padding:7px 14px; font-size:12.5px; font-weight:800; letter-spacing:.04em; white-space:nowrap; transition:opacity .3s, transform .3s; z-index:4;
    background:#ffd60a; color:#0b0b10; }
  .toast.on{ opacity:1; transform:translate(-50%,-100%); }
  @media (prefers-reduced-motion:reduce){ .tile{ transition:none; } .tile.new b, .tile.hit b{ animation:none; } }
</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.52.85l10.4-6.5a1 1 0 0 0 0-1.7L9.52 4.65A1 1 0 0 0 8 5.5z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="5" width="4.2" height="14" rx="1.4"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.4"/></symbol>
  <symbol id="i-again" viewBox="0 0 24 24"><path d="M12 5V2.6a.6.6 0 0 0-1-.45L7.2 5.55a.6.6 0 0 0 0 .9L11 9.85a.6.6 0 0 0 1-.45V7a5.5 5.5 0 1 1-5.5 5.5 1 1 0 0 0-2 0A7.5 7.5 0 1 0 12 5z"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6.4 5a1 1 0 0 0-1.4 1.4L10.6 12 5 17.6A1 1 0 0 0 6.4 19l5.6-5.6 5.6 5.6a1 1 0 0 0 1.4-1.4L13.4 12 19 6.4A1 1 0 0 0 17.6 5L12 10.6z"/></symbol>
</defs></svg>
<div class="stage" id="stage">
  <div class="bg d"></div><div class="bg l"></div>
  <div class="col">
    <div class="top">
      <button class="glass rnd hide" id="bHome" aria-label="Close"><svg><use href="#i-close"/></svg></button>
      <div class="lbl">2048</div>
      <div class="glass pill hide" id="pill" aria-label="Score">0</div>
    </div>
    <div class="wrap" id="wrap">
      <div class="board under" id="board"></div>
      <div class="toast" id="toast"></div>
      <div class="sheet glass" id="sheet"></div>
      <div class="foot" id="foot"></div>
    </div>
  </div>
</div>
<script>
function el(i){ return document.getElementById(i); }
/* Bridges are looked up when used, never kept: MyLLM can add them after this
   script has run. */
function haptic(s){ if (window.myllmHaptic) try { myllmHaptic(s); } catch(_){} }
function load(k){ var s = window.myllmStorage; return s ? s.getItem(k).catch(function(){ return null; }) : Promise.resolve(null); }
function keep(k, v){ var s = window.myllmStorage; if (s) try { s.setItem(k, v).catch(function(){}); } catch(_){} }
var calm = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- look ---------- */
function isLight(){ return !(window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches); }
/* A game in progress takes the whole display and goes dark. Where MyLLM can't
   hide its own title bar, a dark stage under a white bar looks cut in half —
   so in light mode, without myllmImmersive, the stage stays light. */
function syncLook(){
  el("stage").classList.toggle("lite", isLight() && !(state !== "home" && window.myllmImmersive));
  if (typeof onLook === "function") onLook();
}
function syncChrome(){
  if (!window.myllmImmersive) return;
  try { myllmImmersive(state !== "home", {keepAwake:false}).catch(function(){}); } catch(_){}
}
function setHue(h){ el("stage").style.setProperty("--h", String(h)); }
function showSheet(html, acts){
  var s = el("sheet"); s.innerHTML = html;
  Object.keys(acts).forEach(function(id){ var b = el(id); if (b) b.onclick = acts[id]; });
  s.classList.add("on"); el("stage").classList.add("veil");
}
function hideSheet(){ el("sheet").classList.remove("on"); el("stage").classList.remove("veil"); }
function bump(id){ var p = el(id); p.classList.remove("bump"); void p.offsetWidth; p.classList.add("bump"); }
document.addEventListener("visibilitychange", function(){
  if (document.hidden){ if (typeof onHide === "function") onHide(); return; }
  if (state !== "home") syncChrome();          /* MyLLM puts its bars back when the app is left */
});
if (window.matchMedia){
  var mq = matchMedia("(prefers-color-scheme: dark)");
  if (mq.addEventListener) mq.addEventListener("change", syncLook); else if (mq.addListener) mq.addListener(syncLook);
}

var state = "home";                 /* home · play · over */
var grid = [], tiles = [], nextId = 1, live = false;      /* grid[r*4+c] = tile or null */
var score = 0, best = null, best0 = null, won = false, newBest = false, B = 320, T = 70, G = 9, toastT = 0;

/* A tile's colour is its rank: cream and sand, then amber through coral and
   rose into violet and blue — and gold for 2048. The backdrop follows the
   biggest tile on the board. */
var RAMP = [null, [42,35,90,1], [42,55,80,1], [38,90,64,0], [26,92,60,0], [12,90,60,0], [352,85,57,0], [325,75,54,0],
            [285,65,55,0], [255,70,59,0], [215,85,56,0]];
function rank(v){ return Math.round(Math.log(v) / Math.LN2); }
function face(b, v){
  var e = rank(v), r = RAMP[e];
  if (e === 11){ b.style.background = "linear-gradient(145deg,#ffe27a,#ffb703)"; b.style.color = "#3b2a00"; b.style.boxShadow = "0 0 26px rgba(255,200,40,.65), inset 0 1px 0 rgba(255,255,255,.5)"; }
  else if (e > 11){ b.style.background = "#15151a"; b.style.color = "#ffd60a"; b.style.boxShadow = "0 0 0 1.5px #ffd60a inset"; }
  else { b.style.background = "hsl(" + r[0] + " " + r[1] + "% " + r[2] + "%)"; b.style.color = r[3] ? "#4a4030" : "#fff"; b.style.boxShadow = ""; }
  b.style.fontSize = (T * (v < 100 ? .42 : v < 1000 ? .34 : v < 10000 ? .27 : .22)).toFixed(1) + "px";
  b.textContent = v;
}
function hueFor(v){ var e = rank(v); return e < 3 ? 42 : e >= 11 ? 46 : RAMP[e][0]; }

/* ---------- the glass card ---------- */
function bestLine(){
  if (newBest) return '<div class="best new">New best</div>';
  return best != null ? '<div class="best">Best ' + best + '</div>' : "";
}
function card(kind){
  var h;
  if (kind === "home") h = '<h1>2048</h1><p>Swipe to slide the tiles. Two the same merge into one — can you reach 2048?</p>' + bestLine() +
    (live ? '<button class="act pri" id="sA"><svg><use href="#i-play"/></svg>Resume</button><button class="act glass" id="sB">New game</button>'
          : '<button class="act pri" id="sB"><svg><use href="#i-play"/></svg>Play</button>');
  else h = '<div class="kick">No moves left</div><div class="big">' + score + '</div>' + bestLine() +
    '<button class="act pri" id="sB"><svg><use href="#i-again"/></svg>Play again</button><button class="act glass" id="sC">Done</button>';
  showSheet(h, {sA:resume, sB:begin, sC:goHome});
}
function hud(){
  var playing = state === "play" || state === "over";
  el("bHome").classList.toggle("hide", state !== "play");
  el("pill").classList.toggle("hide", !playing);
  el("pill").textContent = score;
  el("foot").textContent = state === "home" ? "" : (best != null ? "Best " + best : "Swipe to merge tiles");
}
function toast(t){
  var e = el("toast"); e.textContent = t; e.classList.add("on");
  clearTimeout(toastT); toastT = setTimeout(function(){ e.classList.remove("on"); }, 2600);
}

/* ---------- board ---------- */
function xy(i){ return {x:G + (i % 4) * (T + G), y:G + Math.floor(i / 4) * (T + G)}; }
function put(t, i){ var p = xy(i); t.el.style.transform = "translate(" + p.x.toFixed(1) + "px," + p.y.toFixed(1) + "px)"; t.at = i; }
function make(v, i, fresh){
  var d = document.createElement("div"), b = document.createElement("b");
  d.className = "tile" + (fresh ? " new" : ""); d.appendChild(b); face(b, v);
  var t = {id:nextId++, v:v, el:d, at:i}; put(t, i); el("board").appendChild(d); tiles.push(t); return t;
}
function wipe(){ tiles.forEach(function(t){ t.el.remove(); }); tiles = []; grid = []; for (var i = 0; i < 16; i++) grid.push(null); }
function fit(){
  var w = el("wrap"), bd = el("board");
  B = Math.max(180, Math.floor(Math.min(w.clientWidth, w.clientHeight, 520)));
  G = B * .028; T = (B - G * 5) / 4;
  var st = el("stage").style; st.setProperty("--b", B + "px"); st.setProperty("--bh", B + "px"); st.setProperty("--t", T.toFixed(2) + "px");
  bd.classList.add("still");
  bd.querySelectorAll(".slot").forEach(function(s, i){ var p = xy(i); s.style.transform = "translate(" + p.x.toFixed(1) + "px," + p.y.toFixed(1) + "px)"; });
  tiles.forEach(function(t){ put(t, t.at); face(t.el.firstChild, t.v); });
  void bd.offsetWidth; bd.classList.remove("still");
}
function showcase(){                  /* title screen: the whole ramp, dimmed, behind the glass */
  wipe(); for (var e = 1; e <= 11; e++) grid[e - 1] = make(Math.pow(2, e), e - 1, false);
}

/* ---------- game (rules unchanged) ---------- */
function spawn(){
  var empty = []; grid.forEach(function(t, i){ if (!t) empty.push(i); });
  if (!empty.length) return;
  var i = empty[Math.floor(Math.random() * empty.length)];
  grid[i] = make(Math.random() < 0.9 ? 2 : 4, i, true);
}
function line(d, r){
  var idx = [];
  for (var c = 0; c < 4; c++){
    if (d === 0) idx.push(r * 4 + c); else if (d === 1) idx.push(r * 4 + 3 - c);
    else if (d === 2) idx.push(c * 4 + r); else idx.push((3 - c) * 4 + r);
  }
  return idx;
}
function move(d){
  if (state !== "play") return;
  var changed = false, mergedAny = false, dying = [];
  for (var r = 0; r < 4; r++){
    var idx = line(d, r), row = idx.map(function(i){ return grid[i]; }).filter(Boolean), out = [];
    for (var i = 0; i < row.length; i++){
      if (i < row.length - 1 && row[i].v === row[i + 1].v){
        row[i].v *= 2; row[i].hit = true; score += row[i].v; mergedAny = true;
        row[i + 1].into = out.length; dying.push({t:row[i + 1], line:idx}); out.push(row[i]); i++;
      } else out.push(row[i]);
    }
    for (var j = 0; j < 4; j++){
      var t = out[j] || null;
      if (grid[idx[j]] !== t) changed = true;
      grid[idx[j]] = t; if (t && t.at !== idx[j]) put(t, idx[j]);
    }
  }
  if (!changed && !mergedAny) return;
  dying.forEach(function(o){                       /* slides under its partner, then goes */
    var t = o.t; t.el.classList.add("gone"); put(t, o.line[t.into]);
    tiles.splice(tiles.indexOf(t), 1); setTimeout(function(){ t.el.remove(); }, calm ? 0 : 140);
  });
  tiles.forEach(function(t){
    t.el.classList.remove("new");
    if (t.hit){ t.hit = false; face(t.el.firstChild, t.v); t.el.classList.remove("hit"); void t.el.offsetWidth; t.el.classList.add("hit"); }
  });
  spawn();
  if (best == null || score > best){ best = score; keep("best", String(best)); if (best0 == null || score > best0) newBest = score > 0; }
  el("pill").textContent = score; if (mergedAny){ bump("pill"); haptic("light"); }
  var mx = 0; tiles.forEach(function(t){ if (t.v > mx) mx = t.v; }); setHue(hueFor(mx));
  hud();
  if (!won && tiles.some(function(t){ return t.v === 2048; })){ won = true; toast("2048! Keep going?"); haptic("success"); }
  else if (!canMove()){ live = false; state = "over"; haptic("error"); setTimeout(function(){ if (state === "over"){ card("over"); hud(); } }, 600); }
}
function canMove(){
  for (var i = 0; i < 16; i++) if (!grid[i]) return true;
  for (var r = 0; r < 4; r++) for (var c = 0; c < 4; c++){
    var v = grid[r * 4 + c].v;
    if (c < 3 && grid[r * 4 + c + 1].v === v) return true;
    if (r < 3 && grid[(r + 1) * 4 + c].v === v) return true;
  }
  return false;
}
function begin(){
  haptic("medium");
  wipe(); score = 0; won = false; newBest = false; best0 = best; live = true; state = "play";
  spawn(); spawn(); setHue(42);
  hideSheet(); hud(); syncLook(); syncChrome();
}
function resume(){ haptic("light"); state = "play"; hideSheet(); hud(); syncLook(); syncChrome(); }
function goHome(){
  haptic("light");
  state = "home"; if (!live){ newBest = false; showcase(); setHue(42); }
  card("home"); hud(); syncLook(); syncChrome();
}

/* ---------- input ---------- */
var px = 0, py = 0, tracking = false;
document.addEventListener("pointerdown", function(e){
  if (e.target.closest && e.target.closest("button")) return;
  tracking = true; px = e.clientX; py = e.clientY;
});
document.addEventListener("pointermove", function(e){
  if (!tracking) return;
  var dx = e.clientX - px, dy = e.clientY - py;
  if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
  tracking = false;                               /* one slide per swipe */
  move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 0) : (dy > 0 ? 3 : 2));
});
document.addEventListener("pointerup", function(){ tracking = false; });
document.addEventListener("pointercancel", function(){ tracking = false; });
document.addEventListener("keydown", function(e){
  var m = {ArrowLeft:0, ArrowRight:1, ArrowUp:2, ArrowDown:3, a:0, d:1, w:2, s:3}[e.key];
  if (m !== undefined){ move(m); e.preventDefault(); }
  else if (e.key === "Escape" && state === "play") goHome();
  else if (e.key === "Enter" && state !== "play") begin();
});
el("bHome").onclick = goHome;
window.addEventListener("resize", fit);

/* ---------- boot ---------- */
(function(){ var bd = el("board"); for (var i = 0; i < 16; i++){ var s = document.createElement("div"); s.className = "slot"; bd.appendChild(s); } })();
fit(); showcase(); syncLook(); card("home"); hud();
load("best").then(function(v){
  if (v){ best = parseInt(v, 10) || null; if (state === "home") card("home"); hud(); }
});
</script></body></html>
