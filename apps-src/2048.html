<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>2048</title>
<style>:root{color-scheme:light dark}
body{font-family:-apple-system,system-ui,sans-serif;margin:0;padding:18px;background:#faf8ef;color:#776e65;text-align:center;touch-action:none;overscroll-behavior:none}
@media(prefers-color-scheme:dark){body{background:#161512;color:#e8e2d8}#board{background:#3a362f}.cell{background:#2a2722}}
h1{font-size:24px;margin:4px 0 2px}
#stats{font-size:13px;opacity:.65;margin-bottom:12px}
#board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:#bbada0;border-radius:12px;padding:8px;max-width:340px;margin:0 auto;aspect-ratio:1}
.cell{display:flex;align-items:center;justify-content:center;border-radius:8px;background:#cdc1b4;font-weight:800;font-size:26px}
#msg{min-height:20px;font-size:14px;margin-top:10px}
button{border:0;background:#f2b179;color:#5b4632;border-radius:10px;padding:11px 26px;font-size:15px;font-weight:700;margin-top:14px}
</style></head><body>
<h1>🔢 2048</h1>
<div id="stats"></div>
<div id="board"></div>
<div id="msg">Swipe to merge tiles</div>
<button onclick="start()">New game</button>
<script>
var store=window.myllmStorage||{getItem:function(){return Promise.resolve(null)},setItem:function(){return Promise.resolve()}};
var b=[],score=0,best=null,over=false,won=false;
var COLORS={2:'#eee4da',4:'#ede0c8',8:'#f2b179',16:'#f59563',32:'#f67c5f',64:'#f65e3b',128:'#edcf72',256:'#edcc61',512:'#edc850',1024:'#edc53f',2048:'#edc22e'};
function el(i){return document.getElementById(i)}
function start(){b=Array(16).fill(0);score=0;over=false;won=false;spawn();spawn();el('msg').textContent='Swipe to merge tiles';render()}
function spawn(){var empty=[];b.forEach(function(v,i){if(!v)empty.push(i)});
if(!empty.length)return;b[empty[Math.floor(Math.random()*empty.length)]]=Math.random()<0.9?2:4}
function render(){var B=el('board');B.innerHTML='';
b.forEach(function(v){var d=document.createElement('div');d.className='cell';
if(v){d.textContent=v;d.style.background=COLORS[v]||'#3c3a32';d.style.color=v>4?'#fff':'#776e65';
d.style.fontSize=v>=1024?'19px':v>=128?'22px':'26px'}
B.appendChild(d)});
el('stats').textContent='Score: '+score+(best!=null?' · Best: '+best:'')}
function line(d,r){var idx=[];for(var c=0;c<4;c++){
if(d===0)idx.push(r*4+c);else if(d===1)idx.push(r*4+3-c);
else if(d===2)idx.push(c*4+r);else idx.push((3-c)*4+r)}return idx}
function move(d){if(over)return;var changed=false,mergedAny=false;
for(var r=0;r<4;r++){var idx=line(d,r);
var vals=idx.map(function(i){return b[i]}).filter(Boolean);
for(var i=0;i<vals.length-1;i++){if(vals[i]===vals[i+1]){vals[i]*=2;score+=vals[i];mergedAny=true;vals.splice(i+1,1)}}
while(vals.length<4)vals.push(0);
idx.forEach(function(bi,j){if(b[bi]!==vals[j])changed=true;b[bi]=vals[j]})}
if(!changed)return;
spawn();
if(best==null||score>best){best=score;store.setItem('best',String(best))}
render();
if(mergedAny&&window.myllmHaptic)myllmHaptic('light');
if(!won&&b.indexOf(2048)>=0){won=true;el('msg').textContent='🎉 2048! Keep going?';
if(window.myllmHaptic)myllmHaptic('success')}
else if(!canMove()){over=true;el('msg').textContent='💥 No moves left — '+score+' points';
if(window.myllmHaptic)myllmHaptic('error')}}
function canMove(){if(b.indexOf(0)>=0)return true;
for(var r=0;r<4;r++)for(var c=0;c<4;c++){var v=b[r*4+c];
if(c<3&&b[r*4+c+1]===v)return true;if(r<3&&b[(r+1)*4+c]===v)return true}return false}
var tx=0,ty=0;
document.addEventListener('touchstart',function(e){tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',function(e){var dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
if(Math.abs(dx)<24&&Math.abs(dy)<24)return;
move(Math.abs(dx)>Math.abs(dy)?(dx>0?1:0):(dy>0?3:2))},{passive:true});
document.addEventListener('keydown',function(e){var m={ArrowLeft:0,ArrowRight:1,ArrowUp:2,ArrowDown:3}[e.key];if(m!==undefined)move(m)});
store.getItem('best').then(function(v){if(v)best=parseInt(v,10)||null;start()});
</script></body></html>
