<script>
/* ============================================================
   Ephemeris: low-precision Keplerian elements (Paul Schlyter,
   "How to compute planetary positions") — good to a fraction of
   a degree for the planets, ~1-2° for the Moon. Plenty for
   "what's up tonight and which way do I look".
   All angles in degrees internally; helpers wrap trig.
   ============================================================ */
var D2R = Math.PI/180, R2D = 180/Math.PI;
function sind(x){ return Math.sin(x*D2R); }
function cosd(x){ return Math.cos(x*D2R); }
function tand(x){ return Math.tan(x*D2R); }
function asind(x){ return R2D*Math.asin(Math.max(-1,Math.min(1,x))); }
function atan2d(y,x){ return R2D*Math.atan2(y,x); }
function rev(x){ x = x % 360; return x < 0 ? x + 360 : x; }

/* day number: d = 0.0 at 1999-12-31 00:00 UT (Schlyter's epoch, "2000 Jan 0.0") */
function dayNum(date){
  return date.getTime()/86400000 - 10956.0;
}

function kepler(M, e){
  var E = M + e*R2D*sind(M)*(1 + e*cosd(M));
  for (var i=0;i<8;i++){
    var dE = (E - e*R2D*sind(E) - M) / (1 - e*cosd(E));
    E -= dE;
    if (Math.abs(dE) < 1e-6) break;
  }
  return E;
}

/* orbital elements at day d — [N,i,w,a,e,M] */
var ELEMENTS = {
  sun:     function(d){ return [0, 0, 282.9404+4.70935e-5*d, 1.000000, 0.016709-1.151e-9*d, 356.0470+0.9856002585*d]; },
  moon:    function(d){ return [125.1228-0.0529538083*d, 5.1454, 318.0634+0.1643573223*d, 60.2666, 0.054900, 115.3654+13.0649929509*d]; },
  mercury: function(d){ return [48.3313+3.24587e-5*d, 7.0047+5.00e-8*d, 29.1241+1.01444e-5*d, 0.387098, 0.205635+5.59e-10*d, 168.6562+4.0923344368*d]; },
  venus:   function(d){ return [76.6799+2.46590e-5*d, 3.3946+2.75e-8*d, 54.8910+1.38374e-5*d, 0.723330, 0.006773-1.302e-9*d, 48.0052+1.6021302244*d]; },
  mars:    function(d){ return [49.5574+2.11081e-5*d, 1.8497-1.78e-8*d, 286.5016+2.92961e-5*d, 1.523688, 0.093405+2.516e-9*d, 18.6021+0.5240207766*d]; },
  jupiter: function(d){ return [100.4542+2.76854e-5*d, 1.3030-1.557e-7*d, 273.8777+1.64505e-5*d, 5.20256, 0.048498+4.469e-9*d, 19.8950+0.0830853001*d]; },
  saturn:  function(d){ return [113.6634+2.38980e-5*d, 2.4886-1.081e-7*d, 339.3939+2.97661e-5*d, 9.55475, 0.055546-9.499e-9*d, 316.9670+0.0334442282*d]; }
};

/* heliocentric ecliptic rectangular coords (AU) of a planet (or the
   Moon's GEOcentric coords in Earth radii — same math, different centre) */
function bodyEcl(which, d){
  var el = ELEMENTS[which](d);
  var N=rev(el[0]), inc=el[1], w=rev(el[2]), a=el[3], e=el[4], M=rev(el[5]);
  var E = kepler(M, e);
  var xv = a*(cosd(E)-e), yv = a*Math.sqrt(1-e*e)*sind(E);
  var v = rev(atan2d(yv,xv)), r = Math.sqrt(xv*xv+yv*yv);
  return {
    x: r*(cosd(N)*cosd(v+w) - sind(N)*sind(v+w)*cosd(inc)),
    y: r*(sind(N)*cosd(v+w) + cosd(N)*sind(v+w)*cosd(inc)),
    z: r*sind(v+w)*sind(inc),
    r: r, v: v, w: w, N: N, M: M
  };
}

/* Sun geocentric ecliptic longitude + rectangular coords */
function sunPos(d){
  var el = ELEMENTS.sun(d);
  var w=rev(el[2]), e=el[4], M=rev(el[5]);
  var E = kepler(M, e);
  var xv = cosd(E)-e, yv = Math.sqrt(1-e*e)*sind(E);
  var v = rev(atan2d(yv,xv)), r = Math.sqrt(xv*xv+yv*yv);
  var lon = rev(v + w);
  return {lon:lon, r:r, x:r*cosd(lon), y:r*sind(lon), M:M, w:w};
}

/* Moon geocentric ecliptic lon/lat with the main perturbation terms */
function moonPos(d){
  var m = bodyEcl("moon", d);
  var s = sunPos(d);
  var lon = rev(atan2d(m.y, m.x));
  var lat = atan2d(m.z, Math.sqrt(m.x*m.x + m.y*m.y));
  var Ms = s.M, Mm = rev(ELEMENTS.moon(d)[5]);
  var Nm = rev(ELEMENTS.moon(d)[0]);
  var ws = s.w, wm = rev(ELEMENTS.moon(d)[2]);
  var Ls = rev(Ms + ws), Lm = rev(Mm + wm + Nm);
  var D = rev(Lm - Ls), F = rev(Lm - Nm);
  lon += -1.274*sind(Mm - 2*D)   /* evection */
       + 0.658*sind(2*D)         /* variation */
       - 0.186*sind(Ms)          /* yearly equation */
       - 0.059*sind(2*Mm - 2*D)
       - 0.057*sind(Mm - 2*D + Ms)
       + 0.053*sind(Mm + 2*D);
  lat += -0.173*sind(F - 2*D)
       - 0.055*sind(Mm - F - 2*D);
  return {lon:rev(lon), lat:lat, dist:m.r};
}

/* geocentric RA/Dec of a planet */
function planetRaDec(which, d){
  var p = bodyEcl(which, d);
  var s = sunPos(d);
  var xg = p.x + s.x, yg = p.y + s.y, zg = p.z;
  var ecl = 23.4393 - 3.563e-7*d;
  var xe = xg, ye = yg*cosd(ecl) - zg*sind(ecl), ze = yg*sind(ecl) + zg*cosd(ecl);
  return {ra: rev(atan2d(ye,xe)), dec: atan2d(ze, Math.sqrt(xe*xe+ye*ye)),
          dist: Math.sqrt(xg*xg+yg*yg+zg*zg)};
}
function eclToRaDec(lon, lat, d){
  var ecl = 23.4393 - 3.563e-7*d;
  var x = cosd(lon)*cosd(lat), y = sind(lon)*cosd(lat), z = sind(lat);
  var xe = x, ye = y*cosd(ecl) - z*sind(ecl), ze = y*sind(ecl) + z*cosd(ecl);
  return {ra: rev(atan2d(ye,xe)), dec: atan2d(ze, Math.sqrt(xe*xe+ye*ye))};
}

/* local sidereal time (deg) at date + observer longitude */
function lst(date, lonDeg){
  var d = dayNum(date);
  var s = sunPos(d);
  var gmst0 = rev(s.M + s.w + 180);
  var utH = (d - Math.floor(d)) * 24;   /* hours since 0h UT (d's epoch is a 0h UT boundary) */
  return rev(gmst0 + utH*15 + lonDeg);
}

/* alt/az (deg; az 0=N, 90=E) of an RA/Dec for observer at date */
function altAz(ra, dec, date, latDeg, lonDeg){
  var ha = rev(lst(date, lonDeg) - ra);
  var alt = asind(sind(latDeg)*sind(dec) + cosd(latDeg)*cosd(dec)*cosd(ha));
  var az = rev(atan2d(sind(ha), cosd(ha)*sind(latDeg) - tand(dec)*cosd(latDeg)) + 180);
  return {alt:alt, az:az};
}
function compass(az){
  var pts = ["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
  return pts[Math.round(az/22.5) % 16];
}

/* sun event (rise/set/dusk) — h = altitude threshold (-0.833 set, -6 civil, -18 astro).
   Returns a Date or null (never rises/sets). dir=+1 evening, -1 morning. */
function sunEvent(dateLocalMidday, latDeg, lonDeg, h, dir){
  var d = dayNum(dateLocalMidday);
  var s = sunPos(d);
  var rd = eclToRaDec(s.lon, 0, d);
  var gmst0 = rev(s.M + s.w + 180);
  var transitUT = rev(rd.ra - gmst0 - lonDeg) / 15;   /* hours UT */
  var cosLHA = (sind(h) - sind(latDeg)*sind(rd.dec)) / (cosd(latDeg)*cosd(rd.dec));
  if (cosLHA > 1 || cosLHA < -1) return null;
  var lha = R2D*Math.acos(cosLHA) / 15;               /* hours */
  var ut = transitUT + dir*lha;
  var base = new Date(dateLocalMidday);
  base.setUTCHours(0,0,0,0);
  return new Date(base.getTime() + ut*3600000);
}

/* moon phase from sun-moon elongation */
function moonPhase(d){
  var s = sunPos(d), m = moonPos(d);
  var elong = rev(m.lon - s.lon);
  var illum = (1 - cosd(elong)) / 2;
  var names = [["New Moon","🌑"],["Waxing Crescent","🌒"],["First Quarter","🌓"],["Waxing Gibbous","🌔"],
               ["Full Moon","🌕"],["Waning Gibbous","🌖"],["Last Quarter","🌗"],["Waning Crescent","🌘"]];
  var idx;
  if (elong < 22.5 || elong >= 337.5) idx = 0;
  else idx = Math.floor((elong + 22.5) / 45);
  return {elong:elong, illum:illum, name:names[idx][0], emoji:names[idx][1], lon:m.lon, lat:m.lat};
}
/* next date (from today) when elongation crosses target (0=new,180=full) */
function nextPhase(dateFrom, target){
  var d0 = dayNum(dateFrom);
  function delta(d){ return rev(rev(moonPos(d).lon - sunPos(d).lon) - target + 180) - 180; }
  var prev = delta(d0);
  for (var i = 1; i <= 31; i++){
    var cur = delta(d0 + i);
    if (prev < 0 && cur >= 0){
      var lo = d0 + i - 1, hi = d0 + i;
      for (var k = 0; k < 20; k++){
        var mid = (lo + hi) / 2;
        if (delta(mid) < 0) lo = mid; else hi = mid;
      }
      return new Date((lo + 10957.5) * 86400000);
    }
    prev = cur;
  }
  return null;
}

/* ============================================================ UI */
/* Bridges are looked up when used, never kept: MyLLM can add them after this
   script has run. */
function store(){ return window.myllmStorage || {getItem:function(){return Promise.resolve(null)}, setItem:function(){return Promise.resolve()}}; }
function haptic(k){ if(window.myllmHaptic){ try{ myllmHaptic(k||'light'); }catch(_){} } }
function net(){ return window.myllmFetch || null; }
function loc(){ return window.myllmLocation || null; }
function ask(){ return window.myllmAsk || null; }
function icon(n){ return '<svg class="i"><use href="#i-' + n + '"/></svg>'; }

var obs = null;   /* {lat, lon, label} */
var issTimer = null;
var facts = "";   /* plain-text summary for the AI */

function el(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function fmtTime(dt){
  return dt ? dt.toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"}) : "—";
}
function fmtDate(dt){
  return dt ? dt.toLocaleDateString([], {weekday:"short", day:"numeric", month:"short"}) : "—";
}

var PLANETS = [
  {id:"mercury", name:"Mercury", glyph:"🪐", note:"small and shy — needs a clear horizon"},
  {id:"venus",   name:"Venus",   glyph:"✨", note:"unmissably brilliant"},
  {id:"mars",    name:"Mars",    glyph:"🔴", note:"a steady reddish point"},
  {id:"jupiter", name:"Jupiter", glyph:"🟠", note:"very bright — outshines every star"},
  {id:"saturn",  name:"Saturn",  glyph:"🪐", note:"calm golden glow; rings need a telescope"}
];
/* drawn planets instead of emoji: a shaded disc in each one's colour, Saturn with its ring */
var PCOL = {mercury:["#d8d2c8","#8f887c"], venus:["#fff4cf","#d9b86a"], mars:["#ff9a73","#b8432a"], jupiter:["#f6d3a4","#b87d44"], saturn:["#f5e2a8","#b89a52"]};
function planetSvg(id){
  var c = PCOL[id], g = "pg-" + id;
  var ring = id === "saturn" ? '<ellipse cx="15" cy="15" rx="13.5" ry="4.2" fill="none" stroke="' + c[0] + '" stroke-width="1.6" opacity=".85" transform="rotate(-18 15 15)"/>' : "";
  var r = id === "jupiter" ? 9.5 : id === "saturn" ? 7.5 : id === "venus" ? 8 : 6.5;
  return '<svg viewBox="0 0 30 30"><defs><radialGradient id="' + g + '" cx="35%" cy="32%" r="75%"><stop offset="0" stop-color="' + c[0] + '"/><stop offset="1" stop-color="' + c[1] + '"/></radialGradient></defs>' +
    '<circle cx="15" cy="15" r="' + r + '" fill="url(#' + g + ')"/>' + ring + '</svg>';
}
/* the Moon as it looks: lit limb plus an elliptical terminator (lit on the
   right while waxing, the northern-hemisphere view) */
function moonSvg(illum, elong){
  var R = 36, cx = 40, cy = 40, rx = Math.abs(1 - 2*illum) * R;
  var waxing = elong < 180, gib = illum > 0.5;
  var outer = waxing ? 1 : 0, inner = waxing ? (gib ? 1 : 0) : (gib ? 0 : 1);
  var lit = 'M' + cx + ' ' + (cy - R) + ' A' + R + ' ' + R + ' 0 0 ' + outer + ' ' + cx + ' ' + (cy + R) +
            ' A' + rx.toFixed(2) + ' ' + R + ' 0 0 ' + inner + ' ' + cx + ' ' + (cy - R) + 'Z';
  return '<svg class="moon" viewBox="0 0 80 80"><defs><radialGradient id="mg" cx="40%" cy="38%" r="70%"><stop offset="0" stop-color="#fffaf0"/><stop offset="1" stop-color="#e6dcc2"/></radialGradient></defs>' +
    '<circle cx="40" cy="40" r="36" fill="#262a40"/>' + (illum > 0.005 ? '<path d="' + lit + '" fill="url(#mg)"/>' : '') +
    '<circle cx="40" cy="40" r="36" fill="none" stroke="rgba(255,255,255,.18)"/></svg>';
}

function renderSky(){
  var now = new Date();
  var midday = new Date(now); midday.setHours(12,0,0,0);
  var sunset  = sunEvent(midday, obs.lat, obs.lon, -0.833, +1);
  var sunrise = sunEvent(midday, obs.lat, obs.lon, -0.833, -1);
  var dusk    = sunEvent(midday, obs.lat, obs.lon, -6, +1);
  var dark    = sunEvent(midday, obs.lat, obs.lon, -18, +1);

  /* observation moment: 75 min after sunset (or now, if later) */
  var evening = sunset ? new Date(sunset.getTime() + 75*60000) : new Date(midday.getTime() + 10*3600000);
  if (now > evening && now.getHours() >= 18) evening = now;
  var dEve = dayNum(evening);

  var ph = moonPhase(dEve);
  var moonRd = eclToRaDec(ph.lon, ph.lat, dEve);
  var moonAA = altAz(moonRd.ra, moonRd.dec, evening, obs.lat, obs.lon);
  var nextFull = nextPhase(now, 180), nextNew = nextPhase(now, 0);

  var evenersHtml = "", morningHtml = "", evenNames = [], mornNames = [];
  PLANETS.forEach(function(p){
    var rd = planetRaDec(p.id, dEve);
    var aa = altAz(rd.ra, rd.dec, evening, obs.lat, obs.lon);
    if (aa.alt > 3){
      var howHigh = aa.alt < 10 ? "very low — needs a flat horizon" : Math.round(aa.alt) + "° up";
      evenNames.push(p.name + (aa.alt < 10 ? " low in the " : " in the ") + compass(aa.az));
      evenersHtml += '<div class="planet"><div class="p">' + planetSvg(p.id) + '</div><div><b>' + p.name + '</b>' +
        '<small>' + p.note + ' · ' + howHigh + '</small></div>' +
        '<span class="dirchip">' + compass(aa.az) + '</span></div>';
    }
  });
  if (sunrise){
    var predawn = new Date(sunrise.getTime() - 75*60000);
    /* tomorrow's pre-dawn */
    predawn = new Date(predawn.getTime() + 86400000);
    var dMorn = dayNum(predawn);
    PLANETS.forEach(function(p){
      var rd = planetRaDec(p.id, dMorn);
      var aa = altAz(rd.ra, rd.dec, predawn, obs.lat, obs.lon);
      if (aa.alt > 5){
        mornNames.push(p.name + " in the " + compass(aa.az));
        morningHtml += '<div class="planet"><div class="p">' + planetSvg(p.id) + '</div><div><b>' + p.name + '</b>' +
          '<small>' + p.note + ' · ' + Math.round(aa.alt) + '° up before dawn</small></div>' +
          '<span class="dirchip">' + compass(aa.az) + '</span></div>';
      }
    });
  }

  var moonLine = moonAA.alt > 0
    ? "Up now-ish after sunset — look " + compass(moonAA.az) + "."
    : "Below the horizon in the early evening.";

  facts = "Location: " + obs.label + ". Sunset " + fmtTime(sunset) + ", civil dusk " + fmtTime(dusk) +
    (dark ? ", fully dark by " + fmtTime(dark) : ", never fully dark tonight") + ". " +
    "Moon: " + ph.name + ", " + Math.round(ph.illum*100) + "% lit. " +
    (evenNames.length ? "Evening planets: " + evenNames.join(", ") + ". " : "No bright planets in the evening sky. ") +
    (mornNames.length ? "Pre-dawn planets: " + mornNames.join(", ") + "." : "");

  var h = "";
  h += '<div class="sky"><h2>The Moon</h2><div class="moonrow">' + moonSvg(ph.illum, ph.elong) +
    '<div><b>' + ph.name + ' · ' + Math.round(ph.illum*100) + '% lit</b>' +
    '<small>' + moonLine + '</small>' +
    '<small>Full: ' + fmtDate(nextFull) + ' · New: ' + fmtDate(nextNew) + '</small></div></div></div>';

  h += '<div class="cols"><div>';
  h += '<div class="card"><h2>The Sun · tonight</h2>' +
    '<div class="kv"><span>Sunset</span><b>' + fmtTime(sunset) + '</b></div>' +
    '<div class="kv"><span>Civil dusk</span><b>' + fmtTime(dusk) + '</b></div>' +
    '<div class="kv"><span>Properly dark</span><b>' + (dark ? fmtTime(dark) : "not tonight — bright summer nights") + '</b></div>' +
    '<div class="kv"><span>Sunrise</span><b>' + fmtTime(sunrise) + '</b></div></div>';

  h += '<div class="card"><h2>ISS · live</h2><div class="iss" id="issbox"><div class="tile sat">' + icon("sat") + '</div>' +
    '<div><b id="issline">' + (net() ? "Finding the Space Station…" : "Needs network access") + '</b>' +
    '<small id="isssub">' + (net() ? "" : "Turn on app network access in Settings to track it.") + '</small></div></div></div>';
  h += '</div><div>';

  h += '<div class="card"><h2>Planets this evening</h2>' +
    (evenersHtml || '<p class="nope">No bright planets above the horizon in the early evening — check the pre-dawn sky below.</p>') + '</div>';

  if (morningHtml) h += '<div class="card"><h2>Before sunrise</h2>' + morningHtml + '</div>';
  h += '</div></div>';

  if (ask()) h += '<button class="aibtn" id="aibtn" onclick="skyStory()">' + icon("spark") + '<span>Tonight at a glance</span></button>' +
    '<div class="card" id="aicard" style="display:none"><h2>Your guide</h2><div class="aiout" id="aiout"></div></div>';

  el("app").innerHTML = h;
  el("where").innerHTML = icon("pin") + '<span>' + esc(obs.label) + '</span>' +
    ' <button onclick="changeLoc()">Change</button>';

  if (net()){ pollIss(); if (!issTimer) issTimer = setInterval(pollIss, 12000); }
}

/* ---------- ISS ---------- */
function gcDist(lat1, lon1, lat2, lon2){
  var a = sind((lat2-lat1)/2), b = sind((lon2-lon1)/2);
  var s = a*a + cosd(lat1)*cosd(lat2)*b*b;
  return 2 * 6371 * Math.asin(Math.sqrt(s));
}
function pollIss(){
  if (!net() || !obs) return;
  net()("https://api.wheretheiss.at/v1/satellites/25544").then(function(r){
    var j = JSON.parse(r.body);
    var line = el("issline"), sub = el("isssub");
    if (!line) return;
    var km = Math.round(gcDist(obs.lat, obs.lon, j.latitude, j.longitude));
    var ns = j.latitude >= 0 ? "N" : "S", ew = j.longitude >= 0 ? "E" : "W";
    line.innerHTML = '<span class="pulse"></span>' + km.toLocaleString() + " km from you";
    var vis = j.visibility === "daylight" ? "in daylight (not visible)" :
              j.visibility === "eclipsed" ? "in Earth's shadow" : "potentially visible";
    sub.textContent = "Now over " + Math.abs(j.latitude).toFixed(0) + "°" + ns + " " +
      Math.abs(j.longitude).toFixed(0) + "°" + ew + " at 27,500 km/h — currently " + vis +
      ". It laps the Earth every 92 minutes.";
  }).catch(function(){
    var line = el("issline");
    if (line) line.textContent = "Couldn't reach the ISS tracker";
  });
}

/* ---------- AI ---------- */
function aiBtn(busy){
  var btn = el("aibtn"); if (!btn) return;
  btn.disabled = !!busy;
  btn.innerHTML = busy ? '<i class="spin"></i><span>Reading tonight\u2019s sky…</span>' : icon("spark") + '<span>Tonight at a glance</span>';
}
function skyStory(){
  if (!ask()) return;
  haptic("light");
  aiBtn(true);
  ask()("Facts about tonight's sky at my location: " + facts +
    " Write a warm, friendly 3-4 sentence stargazing guide for a beginner stepping outside tonight: what to look for first, where to look, and one delightful detail. Plain text, no markdown, no invented facts.",
    {system:"You are a friendly astronomy guide. Use ONLY the provided facts; do not invent sky events. Plain text."})
  .then(function(r){
    el("aiout").textContent = String(r).trim();
    el("aicard").style.display = "block";
    aiBtn(false);
    haptic("success");
  }).catch(function(){
    aiBtn(false);
  });
}

/* ---------- location ---------- */
function setupUI(msg){
  if (issTimer){ clearInterval(issTimer); issTimer = null; }
  el("where").innerHTML = "";
  el("app").innerHTML =
    '<div class="card setup"><h2>Where are you watching from?</h2>' +
    '<label for="q">City or place</label>' +
    '<div class="row"><input id="q" placeholder="e.g. Bristol" enterkeyhint="go" onkeydown="if(event.key===\'Enter\')findPlace()">' +
    '<button class="go" onclick="findPlace()">Go</button></div>' +
    (loc() ? '<button class="gps" onclick="useGps()">' + icon("pin") + 'Use my location</button>' : "") +
    '<p class="note" id="setupnote">' + (msg || "Your location is only used on this device, to point you at the right bit of sky.") + '</p></div>';
}
function useGps(){
  haptic("light");
  el("setupnote").textContent = "Locating…";
  loc().current().then(function(p){
    obs = {lat:p.latitude, lon:p.longitude, label:(p.address || "Your location")};
    store().setItem("obs", JSON.stringify(obs));
    renderSky(); haptic("success");
  }).catch(function(e){
    el("setupnote").textContent = (e && e.message ? e.message + " — " : "") + "Try typing a place instead.";
  });
}
function findPlace(){
  var q = (el("q").value || "").trim();
  if (!q) return;
  haptic("light");
  /* accept a raw "lat, lon" pair */
  var m = q.match(/^\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)\s*$/);
  if (m){
    obs = {lat:parseFloat(m[1]), lon:parseFloat(m[2]), label:"Lat " + m[1] + ", Lon " + m[2]};
    store().setItem("obs", JSON.stringify(obs));
    renderSky(); return;
  }
  el("setupnote").textContent = "Searching…";
  var done = function(lat, lon, label){
    obs = {lat:lat, lon:lon, label:label};
    store().setItem("obs", JSON.stringify(obs));
    renderSky(); haptic("success");
  };
  if (loc() && loc().search){
    loc().search(q, {limit:1}).then(function(res){
      if (res && res.length) done(res[0].latitude, res[0].longitude, res[0].name || q);
      else throw new Error("none");
    }).catch(function(){ geoFallback(q, done); });
  } else geoFallback(q, done);
}
function geoFallback(q, done){
  if (!net()){ el("setupnote").textContent = "Couldn't find that — try \"lat, lon\" (e.g. 51.45, -2.59)."; return; }
  net()("https://geocoding-api.open-meteo.com/v1/search?count=1&name=" + encodeURIComponent(q)).then(function(r){
    var j = JSON.parse(r.body);
    if (j.results && j.results.length){
      var p = j.results[0];
      done(p.latitude, p.longitude, p.name + (p.country_code ? ", " + p.country_code : ""));
    } else el("setupnote").textContent = "Couldn't find that place — try another spelling.";
  }).catch(function(){
    el("setupnote").textContent = "Couldn't search just now — try \"lat, lon\" instead.";
  });
}
function changeLoc(){ haptic("light"); setupUI(); }

/* ---------- boot ---------- */
store().getItem("obs").then(function(v){
  if (v){ try{ obs = JSON.parse(v); }catch(e){} }
  if (obs && typeof obs.lat === "number") renderSky();
  else if (loc()){
    loc().current().then(function(p){
      obs = {lat:p.latitude, lon:p.longitude, label:(p.address || "Your location")};
      store().setItem("obs", JSON.stringify(obs));
      renderSky();
    }).catch(function(){ setupUI(); });
  } else setupUI();
});

/* myllm-fullscreen-v1 — full screen where MyLLM can also close the app for us (myllmClose,
   5.6.2+): full screen hides MyLLM's Done, and a page with no way out is
   worse than a repeated title, so elsewhere nothing changes. The spacer keeps
   the header clear of the status bar only if the page doesn't already. */
(function(){
  function full(){ return !!(window.myllmClose && window.myllmImmersive); }
  function inset(){
    var p = document.createElement("div");
    p.style.cssText = "position:fixed;top:0;left:0;width:1px;visibility:hidden;height:env(safe-area-inset-top)";
    document.body.appendChild(p); var h = p.offsetHeight; p.parentNode.removeChild(p); return h;
  }
  function fit(){
    var sp = document.querySelector(".imm-safe"), head = document.querySelector(".head");
    if (!sp || !head) return;
    sp.style.height = "0px";
    if (!document.body.classList.contains("imm")) return;
    var need = inset() + 6 - (head.getBoundingClientRect().top + window.scrollY);
    sp.style.height = Math.max(0, Math.round(need)) + "px";
  }
  function sync(){
    var f = full();
    document.body.classList.toggle("imm", f);
    fit();
    if (!f) return;
    try { window.myllmImmersive(true, { keepAwake:false }).catch(function(){}); } catch(e){}
  }
  window.myllmFSClose = function(){
    try { if (window.myllmHaptic) window.myllmHaptic("light"); } catch(e){}
    try { window.myllmClose().catch(function(){}); } catch(e){}
  };
  document.addEventListener("visibilitychange", function(){ if (!document.hidden) sync(); });
  window.addEventListener("resize", fit);
  sync();
})();
</script>
