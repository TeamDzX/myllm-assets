<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
/* all theme colours live in variables so light/dark can never be undone by
   rule order (a later `background:#fff` once beat the dark override — the
   "grey text on white card" bug) */
:root{color-scheme:light dark;--accent:#ff453a;
  --bg:#f2f2f7;--card:#fff;--ink:#111;--line:#d1d1d6;--alt:#e5e5ea;--alt-ink:#333;--save-bg:#ffe5e3;
  --diet-bg:#e3f4e7;--diet-ink:#1e7d3c}
@media(prefers-color-scheme:dark){:root{
  --bg:#000;--card:#1c1c1e;--ink:#eee;--line:#3a3a3c;--alt:#1c1c1e;--alt-ink:#eee;--save-bg:#3a1f1e;
  --diet-bg:#173322;--diet-ink:#7ed99a}}
*{box-sizing:border-box}
body{font-family:-apple-system,system-ui,sans-serif;margin:0;padding:18px;background:var(--bg);color:var(--ink)}
h1{font-size:22px;margin:0 0 4px}
.sub{font-size:13px;opacity:.6;margin-bottom:14px}
.row{display:flex;gap:8px;margin-bottom:8px}
input{flex:1;min-width:0;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:var(--card);color:var(--ink)}
button.go{border:0;background:var(--accent);color:#fff;border-radius:10px;padding:0 16px;font-size:15px;font-weight:600}
.alt{display:flex;gap:8px;margin-bottom:6px}
.alt button{flex:1;border:0;background:var(--alt);color:var(--alt-ink);border-radius:9px;padding:9px;font-size:13px;font-weight:600}
.diet{border:1.5px solid var(--line);background:none;color:var(--alt-ink);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;margin-bottom:6px}
.diet.on{border-color:#34a853;background:var(--diet-bg);color:var(--diet-ink)}
#status{font-size:13px;opacity:.7;min-height:16px;margin:8px 0}
.recipe{background:var(--card);color:var(--ink);border-radius:16px;padding:18px;margin-top:6px;box-shadow:0 1px 4px rgba(0,0,0,.1);display:none}
.recipe h2{margin:0 0 2px;font-size:20px}
.recipe .serv{font-size:12px;opacity:.6;margin-bottom:12px}
.recipe h3{font-size:13px;text-transform:uppercase;letter-spacing:.05em;opacity:.55;margin:14px 0 6px}
.recipe ul,.recipe ol{margin:0;padding-left:20px}.recipe li{margin:4px 0;line-height:1.45;font-size:15px}
.save{margin-top:14px;border:0;background:var(--save-bg);color:var(--accent);border-radius:10px;padding:11px 16px;font-size:14px;font-weight:600;width:100%}
h4{font-size:13px;text-transform:uppercase;letter-spacing:.05em;opacity:.55;margin:22px 0 8px}
.saved{background:var(--card);color:var(--ink);border-radius:11px;padding:11px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px;box-shadow:0 1px 2px rgba(0,0,0,.07)}
.saved span{flex:1;font-size:15px;font-weight:600}
.saved .del{background:none;color:#ff453a;font-size:17px;padding:2px}
@media(min-width:768px){body{max-width:760px;margin-left:auto;margin-right:auto}}
</style></head><body>
<style>
@keyframes myllmAiSpin{to{transform:rotate(360deg)}}
.myllm-ai-busy{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(18px);z-index:99999;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;display:flex;align-items:center;gap:10px;background:rgba(28,28,30,.96);color:#fff;border-radius:999px;padding:10px 16px 10px 14px;box-shadow:0 6px 22px rgba(0,0,0,.4);font-family:-apple-system,system-ui,sans-serif;font-size:14px;font-weight:600;max-width:92%}
.myllm-ai-busy.on{opacity:1;transform:translateX(-50%) translateY(0)}
.myllm-ai-cog{font-size:18px;line-height:1;animation:myllmAiSpin 2.4s linear infinite;filter:drop-shadow(0 0 5px rgba(124,92,255,.85))}
.myllm-ai-busy small{font-weight:400;opacity:.6}
</style>
<script>
(function(){
  if(window.__myllmAiWrap||typeof window.myllmAsk!=='function')return;
  window.__myllmAiWrap=true;
  var orig=window.myllmAsk,depth=0,node=null;
  function ensure(){if(node)return;node=document.createElement('div');node.className='myllm-ai-busy';
    node.innerHTML='<span class="myllm-ai-cog">\u2699\uFE0F</span><span>AI is thinking\u2026 <small>privately, on your device</small></span>';
    (document.body||document.documentElement).appendChild(node);}
  function show(){ensure();depth++;node.classList.add('on');}
  function hide(){depth=Math.max(0,depth-1);if(depth===0&&node)node.classList.remove('on');}
  window.myllmAsk=function(){show();var p;try{p=orig.apply(this,arguments);}catch(e){hide();throw e;}
    return Promise.resolve(p).then(function(r){hide();return r;},function(e){hide();throw e;});};
})();
</script>

<h1>🍳 Recipe Finder</h1>
<div class="sub">Tell it what's in your fridge, or a dish you fancy — get a recipe.</div>
<div class="row"><input id="q" placeholder="e.g. chicken, rice, peppers — or “lasagne”" enterkeyhint="search"><button class="go" id="go" onclick="find()">Cook</button></div>
<div class="alt"><button onclick="surprise()">🎲 Surprise me</button><button onclick="find(' make it quick (under 20 minutes)')">⚡ Something quick</button></div>
<button class="diet" id="dietBtn" onclick="toggleDiet()">🌱 Plant-based</button>
<div id="status"></div>
<div class="recipe" id="recipe"></div>
<h4 id="savedHead" style="display:none">Saved recipes</h4>
<div id="saved"></div>
<script>
var store=window.myllmStorage||{getItem:function(){return Promise.resolve(null)},setItem:function(){return Promise.resolve()}};
var saved=[],current=null,plant=false;
function toggleDiet(){
  plant=!plant;renderDiet();store.setItem('recipes.plant',plant?'1':'');
  if(window.myllmHaptic)myllmHaptic('selection');
}
function renderDiet(){
  var b=el('dietBtn');b.classList.toggle('on',plant);
  b.textContent=plant?'🌱 Plant-based — on (eggs ok)':'🌱 Plant-based';
}
function el(i){return document.getElementById(i)}
function setStatus(t){el('status').textContent=t||''}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function find(extra){
  var q=el('q').value.trim();
  if(!q){setStatus('Type some ingredients or a dish first.');return}
  ask('Create a recipe based on: "'+q+'".'+(typeof extra==='string'?extra:''));
}
function surprise(){ask('Invent one appealing dinner recipe (your choice, something a home cook would enjoy).')}

/* Labelled lines, not JSON — small models (Apple Intelligence) echo JSON
   templates back verbatim. Echoed instructions are rejected and retried. */
var ECHO=/recipe name|one ingredient|one short cooking step|repeat this line|labelled line|how many people/i;
function parseRecipe(reply){
  var r={title:'',servings:'',time:'',ingredients:[],steps:[]},got=false;
  String(reply||'').split(/\r?\n/).forEach(function(raw){
    var ln=raw.replace(/\*\*/g,'').trim();
    var m=ln.match(/^[-*#>\s]*(TITLE|SERVES|TIME|INGREDIENTS?|STEPS?)\s*\d*\s*[::]\s*(.*)$/i);
    if(!m)return;
    got=true;var k=m[1].toUpperCase().replace(/S$/,''),v=m[2].trim();
    if(k==='TITLE')r.title=v;
    else if(k==='SERVE')r.servings=v;
    else if(k==='TIME')r.time=v;
    else if(k==='INGREDIENT'&&v)r.ingredients.push(v);
    else if(k==='STEP'&&v)r.steps.push(v);
  });
  if(!got){ // model answered in the old JSON shape — accept it
    var s=reply.indexOf('{'),e=reply.lastIndexOf('}');
    if(s>=0&&e>s)try{
      var j=JSON.parse(reply.slice(s,e+1));
      r.title=j.title||'';r.servings=j.servings||'';r.time=j.time||'';
      r.ingredients=Array.isArray(j.ingredients)?j.ingredients:[];r.steps=Array.isArray(j.steps)?j.steps:[];
    }catch(e2){}
  }
  r.ingredients=r.ingredients.filter(function(x){return x&&!ECHO.test(x)});
  r.steps=r.steps.filter(function(x){return x&&!ECHO.test(x)});
  if(!r.title||ECHO.test(r.title)||r.ingredients.length<2||r.steps.length<2)
    throw new Error('the chef didn’t return a proper recipe');
  return r;
}
function ask(prompt){
  if(!window.myllmAsk){setStatus('Recipes need AI — update MyLLM and enable “Allow apps to use the AI” in Settings.');return}
  el('go').disabled=true;setStatus('Cooking something up…');
  var diet=plant?' The recipe MUST be fully plant-based: no meat, poultry, fish, seafood, dairy, gelatine or honey. Eggs ARE allowed.':'';
  var p=prompt+diet+' Reply with EXACTLY these labelled lines and nothing else:\n'+
    'TITLE: the recipe name\nSERVES: how many people it serves\nTIME: total cooking time\n'+
    'INGREDIENT: one ingredient with its quantity (repeat this line for every ingredient)\n'+
    'STEP: one short cooking step (repeat this line for every step)';
  var sys={system:'You are a helpful home-cooking chef. Give clear, realistic recipes.'};
  myllmAsk(p,sys).then(function(r){return parseRecipe(r||'')})
  .catch(function(){return myllmAsk(p+'\nIMPORTANT: fill each line with the real recipe — never repeat the instruction text.',sys)
    .then(function(r){return parseRecipe(r||'')})})
  .then(function(r){
    current=r;renderRecipe(r);setStatus('');if(window.myllmHaptic)myllmHaptic('success');
  }).catch(function(err){setStatus('Could not find a recipe: '+err.message)})
  .then(function(){el('go').disabled=false});
}

function renderRecipe(r){
  var box=el('recipe');box.style.display='block';
  var meta=[r.servings,r.time].filter(Boolean).join(' · ');
  box.innerHTML='<h2>'+esc(r.title)+'</h2>'+(meta?'<div class="serv">'+esc(meta)+'</div>':'')+
    '<h3>Ingredients</h3><ul>'+(r.ingredients||[]).map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>'+
    '<h3>Method</h3><ol>'+(r.steps||[]).map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ol>'+
    '<button class="save" id="saveBtn">♥ Save recipe</button>';
  el('saveBtn').onclick=function(){saveCurrent()};
  box.scrollIntoView({behavior:'smooth',block:'start'});
}
function saveCurrent(){
  if(!current)return;
  if(!saved.some(function(r){return r.title===current.title})){saved.unshift(current);persist();renderSaved()}
  el('saveBtn').textContent='♥ Saved';el('saveBtn').disabled=true;
  if(window.myllmHaptic)myllmHaptic('success');
}
function persist(){store.setItem('recipes',JSON.stringify(saved))}
function renderSaved(){
  var S=el('saved');S.innerHTML='';el('savedHead').style.display=saved.length?'block':'none';
  saved.forEach(function(r,i){
    var d=document.createElement('div');d.className='saved';
    var sp=document.createElement('span');sp.textContent=r.title;sp.onclick=function(){current=r;renderRecipe(r)};
    var x=document.createElement('button');x.className='del';x.textContent='✕';x.onclick=function(){saved.splice(i,1);persist();renderSaved()};
    d.appendChild(sp);d.appendChild(x);S.appendChild(d);
  });
}
el('q').addEventListener('keydown',function(e){if(e.key==='Enter')find()});
store.getItem('recipes').then(function(v){
  if(v)try{saved=JSON.parse(v)}catch(e){}
  renderSaved();
  if(!window.myllmAsk)setStatus('Heads-up: this app needs the latest MyLLM with apps-AI enabled.');
  return store.getItem('recipes.plant');
}).then(function(v){ plant=!!v; renderDiet(); });
</script></body></html>
