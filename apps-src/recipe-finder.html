<style>:root{--build-id:"37d9ffc5dc";color-scheme:light dark;

  .ing li{ display:flex; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); font-size:15px; line-height:1.4; }
  .ing li:last-child{ border-bottom:none; padding-bottom:2px; } .ing li:first-child{ padding-top:2px; }
  .ing li::before{ content:""; width:7px; height:7px; border-radius:50%; background:hsl(var(--h) 75% 52%); margin-top:.5em; flex-shrink:0; }
  .steps{ list-style:none; counter-reset:s; }
  .steps li{ counter-increment:s; display:flex; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); font-size:15.5px; line-height:1.5; }
  .steps li:last-child{ border-bottom:none; padding-bottom:2px; } .steps li:first-child{ padding-top:2px; }
  .steps li::before{ content:counter(s); flex-shrink:0; width:28px; height:28px; border-radius:9px; display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:800; background:hsl(var(--h) 75% 50% / .14); color:hsl(var(--h) 70% 40%); }
  @media (prefers-color-scheme:dark){ .steps li::before{ color:hsl(var(--h) 85% 66%); } }
  .save{ width:100%; min-height:48px; border:none; border-radius:14px; font-size:15.5px; font-weight:700; margin-bottom:12px;
    display:flex; align-items:center; justify-content:center; gap:8px; background:hsl(var(--h) 80% 55% / .14); color:hsl(var(--h) 72% 42%); }
  @media (prefers-color-scheme:dark){ .save{ color:hsl(var(--h) 90% 66%); } }

  .srow{ display:flex; align-items:center; gap:11px; min-height:48px; padding:4px 0; border-bottom:1px solid var(--line); }

  .srow .del{ width:44px; height:44px; margin-right:-8px; border:none; background:none; color:var(--muted); font-size:14px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }

  .skel{ border-radius:18px; margin-bottom:12px; background:var(--fill); animation:shimmer 1.4s ease-in-out infinite; }
  @keyframes shimmer{ 50%{ opacity:.45; } }
  [hidden]{ display:none !important; }
  @media (prefers-reduced-motion:reduce){ .spin{ animation-duration:2.4s; } .skel{ animation:none; } button:active{ transform:none; } }

  @keyframes myllmAiSpin{to{transform:rotate(360deg)}}
  .myllm-ai-busy{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(18px);z-index:99999;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;display:flex;align-items:center;gap:10px;background:rgba(28,28,30,.96);color:#fff;border-radius:999px;padding:10px 16px 10px 14px;box-shadow:0 6px 22px rgba(0,0,0,.4);font-size:14px;font-weight:600;max-width:92%}
  .myllm-ai-busy.on{opacity:1;transform:translateX(-50%) translateY(0)}

  .myllm-ai-busy small{font-weight:400;opacity:.6}

<script>
(function(){if(window.__myllmAiWrap||typeof window.myllmAsk!=='function')return;window.__myllmAiWrap=true;
var orig=window.myllmAsk,depth=0,node=null;
function ensure(){if(node)return;node=document.createElement('div');node.className='myllm-ai-busy';
node.innerHTML='<span class="myllm-ai-cog"></span><span>AI is thinking… <small>privately, on your device</small></span>';
(document.body||document.documentElement).appendChild(node);}
function show(){ensure();depth++;node.classList.add('on');}
function hide(){depth=Math.max(0,depth-1);if(depth===0&&node)node.classList.remove('on');}
window.myllmAsk=function(){show();var p;try{p=orig.apply(this,arguments);}catch(e){hide();throw e;}
return Promise.resolve(p).then(function(r){hide();return r;},function(e){hide();throw e;});};})();
</script>

<div class="imm-safe"></div><div class="head">
  <div class="tile"><svg class="i"><use href="#i-pan"/></svg></div>
  <div class="ht"><h1>Recipe Finder</h1><p>Tell it what's in your fridge, or a dish you fancy — get a recipe</p></div>
<div class="imm-acts"><button type="button" aria-label="Close Recipe Finder" onclick="myllmFSClose()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div></div>

<div class="card">
  <label for="q">What have you got?</label>
  <div class="row"><input id="q" placeholder="e.g. chicken, rice, peppers — or “lasagne”" enterkeyhint="search" autocomplete="off"><button class="go" id="go" type="button">Cook</button></div>
  <div class="chips">
    <button class="chip" type="button" id="surpriseBtn"><svg class="i"><use href="#i-dice"/></svg>Surprise me</button>
    <button class="chip" type="button" id="quickBtn"><svg class="i"><use href="#i-bolt"/></svg>Something quick</button>
    <button class="chip" type="button" id="dietBtn"></button>
  </div>
  <div class="status" id="status"></div>
</div>

<div id="skeleton" hidden><div class="skel" style="height:110px"></div><div class="skel" style="height:200px"></div></div>
<div id="recipe" hidden></div>
<h2 id="savedHead" hidden>Saved recipes</h2>
<div class="card" id="saved" hidden></div>

<script>
function el(i){return document.getElementById(i)}
/* Bridges are looked up when used, never kept: MyLLM can add them after this
   script has run. */
function store(){return window.myllmStorage||{getItem:function(){return Promise.resolve(null)},setItem:function(){return Promise.resolve()}}}
function haptic(k){if(window.myllmHaptic)try{myllmHaptic(k)}catch(e){}}
function icon(n){return '<svg class="i"><use href="#i-'+n+'"/></svg>'}
var saved=[],current=null,plant=false;
function toggleDiet(){
  plant=!plant;renderDiet();store().setItem('recipes.plant',plant?'1':'');
  haptic('selection');
}
function renderDiet(){
  var b=el('dietBtn');b.classList.toggle('hot',plant);b.setAttribute('aria-pressed',plant);
  b.innerHTML=icon('leaf')+(plant?'Plant-based · eggs ok':'Plant-based');
}
function setStatus(t,err){var s=el('status');s.textContent=t||'';s.classList.toggle('err',!!err)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function find(extra){
  var q=el('q').value.trim();
  if(!q){setStatus('Type some ingredients or a dish first.',true);return}
  ask('Create a recipe based on: "'+q+'".'+(typeof extra==='string'?extra:''));
}
function surprise(){ask('Invent one appealing dinner recipe (your choice, something a home cook would enjoy).')}

/* Labelled lines, not JSON — small models (Apple Intelligence) echo JSON
   templates back verbatim. Echoed instructions are rejected and retried. */
var ECHO=/recipe name|one ingredient|one short cooking step|repeat this line|labelled line|how many people/i;
function parseRecipe(reply){
  var r={title:'',servings:'',time:'',ingredients:[],steps:[]},got=false;
  String(reply||'').split(/\r?\n/).forEach(function(raw){
    var ln=raw.replace(/\*\*/g,'').trim();
    var m=ln.match(/^[-*#>\s]*(TITLE|SERVES|TIME|INGREDIENTS?|STEPS?)\s*\d*\s*[::]\s*(.*)$/i);
    if(!m)return;
    got=true;var k=m[1].toUpperCase().replace(/S$/,''),v=m[2].trim();
    if(k==='TITLE')r.title=v;
    else if(k==='SERVE')r.servings=v;
    else if(k==='TIME')r.time=v;
    else if(k==='INGREDIENT'&&v)r.ingredients.push(v);
    else if(k==='STEP'&&v)r.steps.push(v);
  });
  if(!got){ // model answered in the old JSON shape — accept it
    var s=reply.indexOf('{'),e=reply.lastIndexOf('}');
    if(s>=0&&e>s)try{
      var j=JSON.parse(reply.slice(s,e+1));
      r.title=j.title||'';r.servings=j.servings||'';r.time=j.time||'';
      r.ingredients=Array.isArray(j.ingredients)?j.ingredients:[];r.steps=Array.isArray(j.steps)?j.steps:[];
    }catch(e2){}
  }
  r.ingredients=r.ingredients.filter(function(x){return x&&!ECHO.test(x)});
  r.steps=r.steps.filter(function(x){return x&&!ECHO.test(x)});
  if(!r.title||ECHO.test(r.title)||r.ingredients.length<2||r.steps.length<2)
    throw new Error('the chef didn’t return a proper recipe');
  return r;
}
/* MyLLM 5.6+: ask for the recipe as JSON fenced to a schema — on the phone's own
   model the reply is grammar-constrained, so it always parses however small the
   model. The parsed object still goes through parseRecipe's JSON branch so the
   echo filter and the too-thin-recipe guard apply. Any failure falls through to
   the labelled-line path, which is also all that older builds have. */
function askRecipeJSON(p,sys){
  if(typeof window.myllmAskJSON!=='function')return Promise.reject(new Error('no JSON bridge'));
  var q=p.replace(/Reply with EXACTLY these labelled lines[\s\S]*$/,
    'Reply as JSON with "title" (the recipe name), "servings" (how many people it serves), "time" (total cooking time), '+
    '"ingredients" (one ingredient with its quantity per item) and "steps" (one short cooking step per item).');
  var str=function(n){return{type:'string',maxLength:n}};
  var schema={type:'object',required:['title','servings','time','ingredients','steps'],properties:{
    title:str(80),servings:str(30),time:str(30),
    ingredients:{type:'array',minItems:2,maxItems:20,items:str(120)},
    steps:{type:'array',minItems:2,maxItems:12,items:str(300)}}};
  return myllmAskJSON(q,schema,sys).then(function(j){return parseRecipe(JSON.stringify(j&&typeof j==='object'?j:{}))});
}
function goBtn(busy){var b=el('go');b.disabled=!!busy;b.innerHTML=busy?'<i class="spin"></i>':'Cook';b.setAttribute('aria-label',busy?'Cooking':'Cook')}
function ask(prompt){
  if(!window.myllmAsk){setStatus('Recipes need AI — update MyLLM and enable “Allow apps to use the AI” in Settings.',true);return}
  goBtn(true);setStatus('Cooking something up…');
  el('skeleton').hidden=false;el('recipe').hidden=true;
  var diet=plant?' The recipe MUST be fully plant-based: no meat, poultry, fish, seafood, dairy, gelatine or honey. Eggs ARE allowed.':'';
  var p=prompt+diet+' Reply with EXACTLY these labelled lines and nothing else:\n'+
    'TITLE: the recipe name\nSERVES: how many people it serves\nTIME: total cooking time\n'+
    'INGREDIENT: one ingredient with its quantity (repeat this line for every ingredient)\n'+
    'STEP: one short cooking step (repeat this line for every step)';
  var sys={system:'You are a helpful home-cooking chef. Give clear, realistic recipes.'};
  askRecipeJSON(p,sys)
  .catch(function(){return myllmAsk(p,sys).then(function(r){return parseRecipe(r||'')})})
  .catch(function(){return myllmAsk(p+'\nIMPORTANT: fill each line with the real recipe — never repeat the instruction text.',sys)
    .then(function(r){return parseRecipe(r||'')})})
  .then(function(r){
    current=r;el('skeleton').hidden=true;renderRecipe(r);setStatus('');haptic('success');
  }).catch(function(err){
    el('skeleton').hidden=true;if(current)el('recipe').hidden=false;
    setStatus('Could not find a recipe: '+err.message,true);
  })
  .then(function(){goBtn(false)});
}

function renderRecipe(r){
  var box=el('recipe');box.hidden=false;
  var pills=(r.servings?'<span class="pill">'+icon('people')+esc(r.servings)+'</span>':'')+(r.time?'<span class="pill">'+icon('clock')+esc(r.time)+'</span>':'');
  var isSaved=saved.some(function(s){return s.title===r.title});
  box.innerHTML='<div class="hero"><div class="k">Recipe</div><h3>'+esc(r.title)+'</h3>'+(pills?'<div class="meta">'+pills+'</div>':'')+'</div>'+
    '<div class="rgrid"><div class="card"><label>Ingredients</label><ul class="ing">'+(r.ingredients||[]).map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul></div>'+
    '<div class="card"><label>Method</label><ol class="steps">'+(r.steps||[]).map(function(x){return '<li><span>'+esc(x)+'</span></li>'}).join('')+'</ol></div></div>'+
    '<button class="save" id="saveBtn" type="button">'+icon('heart')+(isSaved?'Saved':'Save recipe')+'</button>';
  if(isSaved)el('saveBtn').disabled=true;
  el('saveBtn').onclick=function(){saveCurrent()};
  box.scrollIntoView({behavior:'smooth',block:'start'});
}
function saveCurrent(){
  if(!current)return;
  if(!saved.some(function(r){return r.title===current.title})){saved.unshift(current);persist();renderSaved()}
  el('saveBtn').innerHTML=icon('heart')+'Saved';el('saveBtn').disabled=true;
  haptic('success');
}
function persist(){store().setItem('recipes',JSON.stringify(saved))}
function renderSaved(){
  var S=el('saved');S.innerHTML='';el('savedHead').hidden=S.hidden=!saved.length;
  saved.forEach(function(r,i){
    var d=document.createElement('div');d.className='srow';
    var t=document.createElement('div');t.className='tile';t.innerHTML=icon('pan');
    var sp=document.createElement('span');sp.textContent=r.title;sp.onclick=function(){current=r;renderRecipe(r)};
    var x=document.createElement('button');x.className='del';x.type='button';x.innerHTML=icon('x');x.setAttribute('aria-label','Delete '+r.title);
    x.onclick=function(){saved.splice(i,1);persist();renderSaved();haptic('warning')};
    d.appendChild(t);d.appendChild(sp);d.appendChild(x);S.appendChild(d);
  });
}
el('go').onclick=function(){find()};
el('surpriseBtn').onclick=surprise;
el('quickBtn').onclick=function(){find(' make it quick (under 20 minutes)')};
el('dietBtn').onclick=toggleDiet;
el('q').addEventListener('keydown',function(e){if(e.key==='Enter')find()});
renderDiet();
store().getItem('recipes').then(function(v){
  if(v)try{saved=JSON.parse(v)}catch(e){}
  renderSaved();
  if(!window.myllmAsk)setStatus('Heads-up: this app needs the latest MyLLM with apps-AI enabled.');
  return store().getItem('recipes.plant');
}).then(function(v){ plant=!!v; renderDiet(); });

/* myllm-fullscreen-v1 — full screen where MyLLM can also close the app for us (myllmClose,
   5.6.2+): full screen hides MyLLM's Done, and a page with no way out is
   worse than a repeated title, so elsewhere nothing changes. The spacer keeps
   the header clear of the status bar only if the page doesn't already. */
(function(){
  function full(){ return !!(window.myllmClose && window.myllmImmersive); }
  function inset(){
    var p = document.createElement("div");
    p.style.cssText = "position:fixed;top:0;left:0;width:1px;visibility:hidden;height:env(safe-area-inset-top)";
    document.body.appendChild(p); var h = p.offsetHeight; p.parentNode.removeChild(p); return h;
  }
  function fit(){
    var sp = document.querySelector(".imm-safe"), head = document.querySelector(".head");
    if (!sp || !head) return;
    sp.style.height = "0px";
    if (!document.body.classList.contains("imm")) return;
    var need = inset() + 6 - (head.getBoundingClientRect().top + window.scrollY);
    sp.style.height = Math.max(0, Math.round(need)) + "px";
  }
  function sync(){
    var f = full();
    document.body.classList.toggle("imm", f);
    fit();
    if (!f) return;
    try { window.myllmImmersive(true, { keepAwake:false }).catch(function(){}); } catch(e){}
  }
  window.myllmFSClose = function(){
    try { if (window.myllmHaptic) window.myllmHaptic("light"); } catch(e){}
    try { window.myllmClose().catch(function(){}); } catch(e){}
  };
  document.addEventListener("visibilitychange", function(){ if (!document.hidden) sync(); });
  window.addEventListener("resize", fit);
  sync();
})();
</script></body></html>
