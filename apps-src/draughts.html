<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Draughts</title>
<style>
:root{
  color-scheme:light dark;
  --bg:var(--myllm-bg,#f2f2f7);--surface:var(--myllm-surface,#fff);
  --text:var(--myllm-text,#111);--muted:var(--myllm-muted,#6b6b72);
  --accent:var(--myllm-accent,#0b5ed7);--border:var(--myllm-border,rgba(120,120,128,.25));
  --radius:var(--myllm-radius,14px);--font:var(--myllm-font,-apple-system,system-ui,sans-serif);
  --light:#e8d3a8;--dark:#7a5236;--dot:rgba(20,120,40,.55);
}
@media(prefers-color-scheme:dark){:root{--bg:var(--myllm-bg,#000);--surface:var(--myllm-surface,#1c1c1e);--text:var(--myllm-text,#eee);--muted:var(--myllm-muted,#98989f)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text)}
.wrap{max-width:460px;margin:0 auto;padding:12px 12px 28px}
.status{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600;padding:8px 4px 12px;min-height:38px}
.status .think{color:var(--muted);font-weight:500;font-size:14px}
.board{width:100%;aspect-ratio:1;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);border-radius:10px;overflow:hidden;box-shadow:0 4px 18px rgba(0,0,0,.2);touch-action:manipulation}
.sq{position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;-webkit-user-select:none}
.sq.l{background:var(--light)}.sq.d{background:var(--dark)}
.sq:before,.sq:after{pointer-events:none}
.pc{width:74%;height:74%;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:min(5vw,24px);pointer-events:none;box-shadow:inset 0 -3px 5px rgba(0,0,0,.35),0 2px 3px rgba(0,0,0,.3)}
.pc.red{background:radial-gradient(circle at 35% 30%,#ff7a6b,#d93a2b);color:#ffe}
.pc.black{background:radial-gradient(circle at 35% 30%,#5a6472,#262b33);color:#fff}
.pc .crown{opacity:.9}
.sq.sel:after{content:"";position:absolute;inset:0;background:rgba(11,94,215,.4)}
.sq.tgt:before{content:"";position:absolute;width:32%;height:32%;border-radius:50%;background:var(--dot);z-index:2}
.sq.must .pc{outline:3px solid #ffd23f;outline-offset:-3px;border-radius:50%}
.controls{display:flex;gap:8px;margin-top:14px}
.controls button{flex:1;border:0;background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:11px;padding:11px;font:inherit;font-weight:600;font-size:14px;cursor:pointer}
.controls button.primary{background:var(--accent);color:#fff;border-color:transparent}
.lbl{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin:14px 0 5px}
.seg{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:3px}
.seg button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-weight:600;font-size:13px;padding:9px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff}
.count{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:10px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:30;padding:24px}
.sheet.show{display:flex}
.sheetB{background:var(--bg);border-radius:18px;max-width:320px;padding:22px;text-align:center}
.sheetB h3{margin:0 0 6px;font-size:20px}.sheetB p{color:var(--muted);font-size:14px;margin:0 0 16px}
.sheetB button{width:100%;border:0;background:var(--accent);color:#fff;border-radius:11px;padding:12px;font:inherit;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <div class="status"><span id="statusText">Your move</span><span class="think" id="think"></span></div>
  <div class="board" id="board"></div>
  <div class="count"><span id="cRed">You: 12</span><span id="cBlack">Computer: 12</span></div>
  <div class="controls">
    <button class="primary" id="newBtn">New game</button>
    <button id="undoBtn">Undo</button>
  </div>
  <div class="lbl">Difficulty</div>
  <div class="seg" id="diffSeg"><button data-d="3">Easy</button><button data-d="5" class="on">Medium</button><button data-d="7">Hard</button></div>
</div>
<div class="sheet" id="sheet"><div class="sheetB"><h3 id="overT">Game over</h3><p id="overP"></p><button id="overBtn">New game</button></div></div>

<script>
var N=8, INF=1e9;
var board=[], sel=null, midJump=false, depth=5, thinking=false, history=[];
function $(i){return document.getElementById(i)}
function haptic(k){if(window.myllmHaptic)try{myllmHaptic(k)}catch(e){}}
function inB(r,c){return r>=0&&r<8&&c>=0&&c<8}
function clone(b){return b.map(function(row){return row.slice()})}
function isRed(p){return p==='r'||p==='R'}
function isBlack(p){return p==='b'||p==='B'}
function isKing(p){return p==='R'||p==='B'}
function opp(q,p){return q&&((isRed(p)&&isBlack(q))||(isBlack(p)&&isRed(q)))}
function dirs(p){
  if(p==='r')return [[-1,-1],[-1,1]];
  if(p==='b')return [[1,-1],[1,1]];
  return [[-1,-1],[-1,1],[1,-1],[1,1]];
}

function init(){
  board=[];for(var r=0;r<8;r++){var row=[];for(var c=0;c<8;c++){
    var dark=(r+c)%2===1, v='';
    if(dark&&r<3)v='b'; else if(dark&&r>4)v='r';
    row.push(v);
  }board.push(row)}
}

function jumpsFrom(b,r,c){ // single immediate jumps for the piece at r,c
  var p=b[r][c],out=[];if(!p)return out;
  dirs(p).forEach(function(d){
    var mr=r+d[0],mc=c+d[1],jr=r+2*d[0],jc=c+2*d[1];
    if(inB(jr,jc)&&b[jr][jc]===''&&inB(mr,mc)&&opp(b[mr][mc],p))out.push({to:[jr,jc],cap:[mr,mc]});
  });
  return out;
}
function simpleFrom(b,r,c){
  var p=b[r][c],out=[];if(!p)return out;
  dirs(p).forEach(function(d){var nr=r+d[0],nc=c+d[1];if(inB(nr,nc)&&b[nr][nc]==='')out.push({to:[nr,nc]})});
  return out;
}
function applyMoveTo(b,fr,fc,tr,tc,cap){ // returns {board,promoted}
  var nb=clone(b),p=nb[fr][fc];nb[fr][fc]='';
  if(cap)nb[cap[0]][cap[1]]='';
  var promoted=false;
  if(p==='r'&&tr===0){p='R';promoted=true}
  else if(p==='b'&&tr===7){p='B';promoted=true}
  nb[tr][tc]=p;return {board:nb,promoted:promoted};
}
function sideHasCapture(b,red){
  for(var r=0;r<8;r++)for(var c=0;c<8;c++){var p=b[r][c];if(p&&(red?isRed(p):isBlack(p))&&jumpsFrom(b,r,c).length)return true}
  return false;
}
// full legal turns for AI (each returns resulting board)
function legalTurns(b,red){
  var caps=[];
  for(var r=0;r<8;r++)for(var c=0;c<8;c++){var p=b[r][c];if(p&&(red?isRed(p):isBlack(p)))expandJumps(b,r,c,caps)}
  if(caps.length)return caps;
  var simp=[];
  for(var r2=0;r2<8;r2++)for(var c2=0;c2<8;c2++){var p2=b[r2][c2];if(p2&&(red?isRed(p2):isBlack(p2))){
    simpleFrom(b,r2,c2).forEach(function(m){simp.push({board:applyMoveTo(b,r2,c2,m.to[0],m.to[1],null).board})});
  }}
  return simp;
}
function expandJumps(b,r,c,acc){
  var js=jumpsFrom(b,r,c);if(!js.length)return;
  js.forEach(function(j){
    var res=applyMoveTo(b,r,c,j.to[0],j.to[1],j.cap);
    if(res.promoted){acc.push({board:res.board})}
    else{
      var before=acc.length;
      expandJumps(res.board,j.to[0],j.to[1],acc);
      if(acc.length===before)acc.push({board:res.board}); // no further jump -> sequence ends
    }
  });
}

function render(){
  var B=$('board');B.innerHTML='';
  var tgts=highlightTargets();
  for(var r=0;r<8;r++)for(var c=0;c<8;c++){
    var dark=(r+c)%2===1,d=document.createElement('div');
    d.className='sq '+(dark?'d':'l');
    if(sel&&sel[0]===r&&sel[1]===c)d.className+=' sel';
    if(tgts.some(function(t){return t[0]===r&&t[1]===c}))d.className+=' tgt';
    var p=board[r][c];
    if(p){
      var pc=document.createElement('div');pc.className='pc '+(isRed(p)?'red':'black');
      if(isKing(p))pc.innerHTML='<span class="crown">♔</span>';
      // mark forced-capture pieces (player's turn only)
      if(playerTurn()&&!thinking&&isRed(p)&&forced()&&jumpsFrom(board,r,c).length&&!midJump)d.classList.add('must');
      d.appendChild(pc);
    }
    (function(rr,cc){d.onclick=function(){onTap(rr,cc)}})(r,c);
    B.appendChild(d);
  }
  updateCounts();
}
function highlightTargets(){
  if(!sel)return [];
  if(forced()||midJump)return jumpsFrom(board,sel[0],sel[1]).map(function(j){return j.to});
  return simpleFrom(board,sel[0],sel[1]).map(function(m){return m.to});
}
function forced(){return sideHasCapture(board,true)}
function playerTurn(){return turn==='r'}
var turn='r';

function onTap(r,c){
  if(thinking||turn!=='r')return;
  var p=board[r][c];
  // tapping a target?
  if(sel){
    var t=highlightTargets().find(function(x){return x[0]===r&&x[1]===c});
    if(t){doPlayer(sel[0],sel[1],r,c);return}
  }
  if(midJump)return; // must continue the jump with the selected piece
  // (re)select own piece
  if(p&&isRed(p)){
    if(forced()&&jumpsFrom(board,r,c).length===0){haptic('warning');return} // must pick a capturing piece
    sel=[r,c];haptic('selection');render();
  }else{sel=null;render()}
}

function doPlayer(fr,fc,tr,tc){
  var capturing=Math.abs(tr-fr)===2;
  var cap=capturing?[(fr+tr)/2,(fc+tc)/2]:null;
  history.push({board:clone(board),turn:turn}); // snapshot before move (only push once per full turn)
  if(midJump)history.pop(); // keep only the pre-turn snapshot
  var res=applyMoveTo(board,fr,fc,tr,tc,cap);
  board=res.board;haptic(capturing?'medium':'light');
  if(capturing&&!res.promoted&&jumpsFrom(board,tr,tc).length){
    sel=[tr,tc];midJump=true;render();return; // continue multi-jump
  }
  sel=null;midJump=false;turn='b';render();save();updateStatus();
  if(checkOver())return;
  aiTurn();
}

function aiTurn(){
  thinking=true;$('think').textContent='Computer is thinking…';updateStatus();
  setTimeout(function(){
    var best=aiBest(board,depth);
    if(best)board=best;
    thinking=false;$('think').textContent='';turn='r';
    haptic('light');render();save();updateStatus();checkOver();
  },40);
}

// ---- AI: minimax (black maximises) ----
function evalBlack(b){
  var s=0;
  for(var r=0;r<8;r++)for(var c=0;c<8;c++){var p=b[r][c];if(!p)continue;
    if(p==='b')s+=100+r*4;           // advance toward row7
    else if(p==='B')s+=165;
    else if(p==='r')s-=100+(7-r)*4;
    else if(p==='R')s-=165;
  }
  return s;
}
function minimax(b,red,d,alpha,beta){
  var moves=legalTurns(b,red);
  if(moves.length===0)return red? INF : -INF; // side to move (red) stuck -> bad for red(good for black); black stuck -> bad for black
  if(d===0)return evalBlack(b);
  if(!red){ // black maximises
    var best=-INF;
    for(var i=0;i<moves.length;i++){var v=minimax(moves[i].board,true,d-1,alpha,beta);if(v>best)best=v;if(best>alpha)alpha=best;if(alpha>=beta)break;}
    return best;
  } else { // red minimises
    var best2=INF;
    for(var j=0;j<moves.length;j++){var v2=minimax(moves[j].board,false,d-1,alpha,beta);if(v2<best2)best2=v2;if(best2<beta)beta=best2;if(alpha>=beta)break;}
    return best2;
  }
}
function aiBest(b,d){
  var moves=legalTurns(b,false);if(!moves.length)return null;
  var best=-INF,pick=null;
  for(var i=0;i<moves.length;i++){
    var v=minimax(moves[i].board,true,d-1,-INF,INF);
    if(v>best||(v===best&&Math.random()<0.3)){best=v;pick=moves[i].board}
  }
  return pick;
}

function counts(){var red=0,black=0;for(var r=0;r<8;r++)for(var c=0;c<8;c++){var p=board[r][c];if(isRed(p))red++;else if(isBlack(p))black++}return {red:red,black:black}}
function updateCounts(){var c=counts();$('cRed').textContent='You: '+c.red;$('cBlack').textContent='Computer: '+c.black}
function updateStatus(){
  if(thinking){$('statusText').textContent='Computer is thinking';return}
  if(turn==='r'){$('statusText').textContent=forced()?'Your move — you must take':'Your move'}
  else $('statusText').textContent='Computer to move';
}
function checkOver(){ // checks the side whose turn it now is
  var c=counts();
  if(turn==='b'){ if(c.black===0||legalTurns(board,false).length===0){over('You win! 🎉','The computer has no moves left.');return true} }
  else { if(c.red===0||legalTurns(board,true).length===0){over('Computer wins','You have no moves left.');return true} }
  return false;
}
function over(t,p){$('overT').textContent=t;$('overP').textContent=p;$('sheet').classList.add('show');haptic(t.indexOf('win!')>=0?'success':'warning')}

$('newBtn').onclick=function(){init();turn='r';sel=null;midJump=false;thinking=false;history=[];$('sheet').classList.remove('show');render();save();updateStatus();haptic('light')};
$('overBtn').onclick=function(){$('newBtn').onclick()};
$('undoBtn').onclick=function(){if(thinking||!history.length)return;var h=history.pop();board=h.board;turn='r';sel=null;midJump=false;render();save();updateStatus();haptic('light')};
Array.prototype.forEach.call($('diffSeg').children,function(b){b.onclick=function(){depth=+b.dataset.d;Array.prototype.forEach.call($('diffSeg').children,function(x){x.classList.remove('on')});b.classList.add('on');save();haptic('selection')}});

function save(){if(window.myllmStorage)myllmStorage.setItem('draughts',JSON.stringify({board:board,turn:turn,depth:depth}))}
function load(){
  if(!window.myllmStorage){init();render();updateStatus();return}
  myllmStorage.getItem('draughts').then(function(v){
    if(v)try{var s=JSON.parse(v);
      if(s.depth){depth=s.depth;Array.prototype.forEach.call($('diffSeg').children,function(x){x.classList.toggle('on',+x.dataset.d===depth)})}
      if(s.board){board=s.board;turn=s.turn||'r'}else init();
    }catch(e){init()} else init();
    render();updateStatus();
    if(turn==='b'&&!thinking)aiTurn();
  });
}
load();
</script>
</body>
</html>
