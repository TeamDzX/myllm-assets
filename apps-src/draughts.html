<script>
function el(i){ return document.getElementById(i); }
/* Bridges are looked up when used, never kept: MyLLM can add them after this
   script has run. */
function haptic(s){ if (window.myllmHaptic) try { myllmHaptic(s); } catch(_){} }
function load(k){ var s = window.myllmStorage; return s ? s.getItem(k).catch(function(){ return null; }) : Promise.resolve(null); }
function keep(k, v){ var s = window.myllmStorage; if (s) try { s.setItem(k, v).catch(function(){}); } catch(_){} }
var calm = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- look ---------- */
function isLight(){ return !(window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches); }
/* A game in progress takes the whole display and goes dark. Where MyLLM can't
   hide its own title bar, a dark stage under a white bar looks cut in half —
   so in light mode, without myllmImmersive, the stage stays light. */
function syncLook(){
  el("stage").classList.toggle("lite", isLight() && !(state !== "home" && window.myllmImmersive));
  if (typeof onLook === "function") onLook();
}
function syncChrome(){
  if (!window.myllmImmersive) return;
  try { myllmImmersive(state !== "home", {keepAwake:false}).catch(function(){}); } catch(_){}
}
function setHue(h){ el("stage").style.setProperty("--h", String(h)); }
function showSheet(html, acts){
  var s = el("sheet"); s.innerHTML = html;
  Object.keys(acts).forEach(function(id){ var b = el(id); if (b) b.onclick = acts[id]; });
  s.classList.add("on"); el("stage").classList.add("veil");
}
function hideSheet(){ el("sheet").classList.remove("on"); el("stage").classList.remove("veil"); }
function bump(id){ var p = el(id); p.classList.remove("bump"); void p.offsetWidth; p.classList.add("bump"); }
document.addEventListener("visibilitychange", function(){
  if (document.hidden){ if (typeof onHide === "function") onHide(); return; }
  if (state !== "home") syncChrome();          /* MyLLM puts its bars back when the app is left */
});
if (window.matchMedia){
  var mq = matchMedia("(prefers-color-scheme: dark)");
  if (mq.addEventListener) mq.addEventListener("change", syncLook); else if (mq.addListener) mq.addListener(syncLook);
}

var N = 8, INF = 1e9;
var board = [], sel = null, midJump = false, depth = 5, thinking = false, undoStack = [];
var state = "home", over = null;
var DIFF = {3:'Easy',5:'Medium',7:'Hard'};
function $(i){ return document.getElementById(i); }
function inB(r,c){ return r >= 0 && r < 8 && c >= 0 && c < 8; }
function clone(b){ return b.map(function(row){ return row.slice(); }); }
function isRed(p){ return p === 'r' || p === 'R'; }
function isBlack(p){ return p === 'b' || p === 'B'; }
function isKing(p){ return p === 'R' || p === 'B'; }
function opp(q,p){ return q && ((isRed(p) && isBlack(q)) || (isBlack(p) && isRed(q))); }
function dirs(p){
  if (p === 'r') return [[-1,-1],[-1,1]];
  if (p === 'b') return [[1,-1],[1,1]];
  return [[-1,-1],[-1,1],[1,-1],[1,1]];
}

function init(){
  board = []; for (var r = 0; r < 8; r++){ var row = []; for (var c = 0; c < 8; c++){
    var dark = (r + c) % 2 === 1, v = '';
    if (dark && r < 3) v = 'b'; else if (dark && r > 4) v = 'r';
    row.push(v);
  } board.push(row); }
}

function jumpsFrom(b,r,c){ // single immediate jumps for the piece at r,c
  var p = b[r][c], out = []; if (!p) return out;
  dirs(p).forEach(function(d){
    var mr = r + d[0], mc = c + d[1], jr = r + 2 * d[0], jc = c + 2 * d[1];
    if (inB(jr,jc) && b[jr][jc] === '' && inB(mr,mc) && opp(b[mr][mc], p)) out.push({to:[jr,jc], cap:[mr,mc]});
  });
  return out;
}
function simpleFrom(b,r,c){
  var p = b[r][c], out = []; if (!p) return out;
  dirs(p).forEach(function(d){ var nr = r + d[0], nc = c + d[1]; if (inB(nr,nc) && b[nr][nc] === '') out.push({to:[nr,nc]}); });
  return out;
}
function applyMoveTo(b,fr,fc,tr,tc,cap){ // returns {board,promoted}
  var nb = clone(b), p = nb[fr][fc]; nb[fr][fc] = '';
  if (cap) nb[cap[0]][cap[1]] = '';
  var promoted = false;
  if (p === 'r' && tr === 0){ p = 'R'; promoted = true; }
  else if (p === 'b' && tr === 7){ p = 'B'; promoted = true; }
  nb[tr][tc] = p; return {board:nb, promoted:promoted};
}
function sideHasCapture(b,red){
  for (var r = 0; r < 8; r++) for (var c = 0; c < 8; c++){ var p = b[r][c]; if (p && (red ? isRed(p) : isBlack(p)) && jumpsFrom(b,r,c).length) return true; }
  return false;
}
// full legal turns for AI (each returns resulting board)
function legalTurns(b,red){
  var caps = [];
  for (var r = 0; r < 8; r++) for (var c = 0; c < 8; c++){ var p = b[r][c]; if (p && (red ? isRed(p) : isBlack(p))) expandJumps(b,r,c,caps); }
  if (caps.length) return caps;
  var simp = [];
  for (var r2 = 0; r2 < 8; r2++) for (var c2 = 0; c2 < 8; c2++){ var p2 = b[r2][c2]; if (p2 && (red ? isRed(p2) : isBlack(p2))){
    simpleFrom(b,r2,c2).forEach(function(m){ simp.push({board:applyMoveTo(b,r2,c2,m.to[0],m.to[1],null).board}); });
  } }
  return simp;
}
function expandJumps(b,r,c,acc){
  var js = jumpsFrom(b,r,c); if (!js.length) return;
  js.forEach(function(j){
    var res = applyMoveTo(b,r,c,j.to[0],j.to[1],j.cap);
    if (res.promoted){ acc.push({board:res.board}); }
    else {
      var before = acc.length;
      expandJumps(res.board, j.to[0], j.to[1], acc);
      if (acc.length === before) acc.push({board:res.board}); // no further jump -> sequence ends
    }
  });
}

var CROWN = '<svg><use href="#i-crown"/></svg>';
function render(){
  var B = $('board'); B.innerHTML = '';
  var tgts = highlightTargets();
  for (var r = 0; r < 8; r++) for (var c = 0; c < 8; c++){
    var dark = (r + c) % 2 === 1, d = document.createElement('div');
    d.className = 'sq ' + (dark ? 'd' : 'l');
    if (sel && sel[0] === r && sel[1] === c) d.className += ' sel';
    if (tgts.some(function(t){ return t[0] === r && t[1] === c; })) d.className += ' tgt';
    var p = board[r][c];
    if (p){
      var pc = document.createElement('div'); pc.className = 'pc ' + (isRed(p) ? 'red' : 'black');
      if (isKing(p)) pc.innerHTML = CROWN;
      // mark forced-capture pieces (player's turn only)
      if (state === 'play' && playerTurn() && !thinking && isRed(p) && forced() && jumpsFrom(board,r,c).length && !midJump) d.classList.add('must');
      d.appendChild(pc);
    }
    (function(rr,cc){ var h = function(e){ if (e && e.preventDefault) e.preventDefault(); handleTap(rr,cc); }; d.addEventListener('pointerup', h); d.addEventListener('click', h); })(r,c);
    B.appendChild(d);
  }
  updateCounts();
}
function highlightTargets(){
  if (!sel) return [];
  if (forced() || midJump) return jumpsFrom(board, sel[0], sel[1]).map(function(j){ return j.to; });
  return simpleFrom(board, sel[0], sel[1]).map(function(m){ return m.to; });
}
function forced(){ return sideHasCapture(board, true); }
function playerTurn(){ return turn === 'r'; }
var turn = 'r';

var _ltKey = '', _ltT = 0;
function handleTap(r,c){ // dedupe the pointerup+click pair on the same square
  var k = r + '_' + c, now = Date.now();
  if (k === _ltKey && now - _ltT < 500) return;
  _ltKey = k; _ltT = now; onTap(r,c);
}
function onTap(r,c){
  if (state !== 'play' || over || thinking || turn !== 'r') return;
  var p = board[r][c];
  if (sel){
    var t = highlightTargets().find(function(x){ return x[0] === r && x[1] === c; });
    if (t){ doPlayer(sel[0], sel[1], r, c); return; }
  }
  if (midJump) return; // must continue the current jump
  if (p && isRed(p)){
    if (forced() && jumpsFrom(board,r,c).length === 0){ haptic('warning'); return; } // must pick a capturing piece
    sel = [r,c]; haptic('selection'); render();
  } else { sel = null; render(); }
}

function doPlayer(fr,fc,tr,tc){
  var capturing = Math.abs(tr - fr) === 2;
  var cap = capturing ? [(fr + tr) / 2, (fc + tc) / 2] : null;
  undoStack.push({board:clone(board), turn:turn}); // snapshot before this turn
  if (midJump) undoStack.pop();                   // one snapshot per full turn
  var res = applyMoveTo(board, fr, fc, tr, tc, cap);
  board = res.board; haptic(capturing ? 'medium' : 'light');
  if (capturing && !res.promoted && jumpsFrom(board,tr,tc).length){
    sel = [tr,tc]; midJump = true; render(); updateStatus(); return; // continue multi-jump
  }
  sel = null; midJump = false; turn = 'b'; render(); save(); updateStatus();
  if (checkOver()) return;
  aiTurn();
}

function aiTurn(){
  thinking = true; updateStatus();
  setTimeout(function(){
    var best = aiBest(board, depth);
    if (best) board = best;
    thinking = false; turn = 'r';
    haptic('light'); render(); save(); updateStatus(); checkOver();
  }, 40);
}

// ---- AI: minimax (black maximises) ----
function evalBlack(b){
  var s = 0;
  for (var r = 0; r < 8; r++) for (var c = 0; c < 8; c++){ var p = b[r][c]; if (!p) continue;
    if (p === 'b') s += 100 + r * 4;           // advance toward row7
    else if (p === 'B') s += 165;
    else if (p === 'r') s -= 100 + (7 - r) * 4;
    else if (p === 'R') s -= 165;
  }
  return s;
}
function minimax(b,red,d,alpha,beta){
  var moves = legalTurns(b, red);
  if (moves.length === 0) return red ? INF : -INF; // side to move (red) stuck -> bad for red(good for black); black stuck -> bad for black
  if (d === 0) return evalBlack(b);
  if (!red){ // black maximises
    var best = -INF;
    for (var i = 0; i < moves.length; i++){ var v = minimax(moves[i].board, true, d - 1, alpha, beta); if (v > best) best = v; if (best > alpha) alpha = best; if (alpha >= beta) break; }
    return best;
  } else { // red minimises
    var best2 = INF;
    for (var j = 0; j < moves.length; j++){ var v2 = minimax(moves[j].board, false, d - 1, alpha, beta); if (v2 < best2) best2 = v2; if (best2 < beta) beta = best2; if (alpha >= beta) break; }
    return best2;
  }
}
function aiBest(b,d){
  var moves = legalTurns(b, false); if (!moves.length) return null;
  var best = -INF, pick = null;
  for (var i = 0; i < moves.length; i++){
    var v = minimax(moves[i].board, true, d - 1, -INF, INF);
    if (v > best || (v === best && Math.random() < 0.3)){ best = v; pick = moves[i].board; }
  }
  return pick;
}

function counts(){ var red = 0, black = 0; for (var r = 0; r < 8; r++) for (var c = 0; c < 8; c++){ var p = board[r][c]; if (isRed(p)) red++; else if (isBlack(p)) black++; } return {red:red, black:black}; }
function updateCounts(){ var c = counts(); $('cRed').textContent = c.red; $('cBlack').textContent = c.black; }
function updateStatus(){
  var st = $('statusText');
  st.classList.remove('bad');
  if (over) st.textContent = over.t;
  else if (thinking) st.innerHTML = '<i class="spin"></i><span>Thinking…</span>';
  else if (turn === 'r'){
    if (midJump) st.textContent = 'Keep jumping';
    else if (forced()){ st.textContent = 'Your move — you must take'; st.classList.add('bad'); }
    else st.textContent = 'Your move';
  }
  else st.textContent = 'Computer to move';
  $('sub').textContent = over ? over.p : (state === 'play' && turn === 'r' && !thinking ? 'You play red, moving up the board' : '');
  $('undoBtn').disabled = thinking || !undoStack.length;
  $('lbl').textContent = state === 'play' && window.innerWidth > 360 ? 'Draughts · ' + DIFF[depth] : 'Draughts';
}
function checkOver(){ // checks the side whose turn it now is
  var c = counts();
  if (turn === 'b'){ if (c.black === 0 || legalTurns(board,false).length === 0){ finish('You win', 'The computer has no moves left.', true); return true; } }
  else { if (c.red === 0 || legalTurns(board,true).length === 0){ finish('Computer wins', 'You have no moves left.', false); return true; } }
  return false;
}
function finish(t,p,won){
  over = {t:t, p:p}; haptic(won ? 'success' : 'warning'); updateStatus();
  setTimeout(function(){ if (over && state === 'play') showOver(); }, 650);
}

/* ---------- cards ---------- */
function segHTML(id, items, on){
  return '<div class="seg glass" id="' + id + '">' + items.map(function(it){ return '<button data-v="' + it[0] + '"' + (String(it[0]) === String(on) ? ' class="on"' : '') + '>' + it[1] + '</button>'; }).join('') + '</div>';
}
function wireSeg(id, fn){
  var s = $(id); if (!s) return;
  Array.prototype.forEach.call(s.children, function(b){ b.onclick = function(){
    Array.prototype.forEach.call(s.children, function(x){ x.classList.remove('on'); }); b.classList.add('on'); haptic('selection'); fn(b.dataset.v);
  }; });
}
function fresh(){ var s = JSON.stringify(board), keepB = board; init(); var start = JSON.stringify(board); board = keepB; return s === start && turn === 'r'; }
function showHome(){
  var going = !fresh() && !over;
  showSheet('<h1>Draughts</h1><p>You play red. Captures are compulsory, and jumps chain.</p>' +
    '<div class="seglbl">Difficulty</div>' + segHTML('diffSeg', [[3,'Easy'],[5,'Medium'],[7,'Hard']], depth) +
    (going ? '<button class="act pri" id="sA"><svg><use href="#i-play"/></svg>Continue</button><button class="act glass" id="sB">New game</button>'
           : '<button class="act pri" id="sB"><svg><use href="#i-play"/></svg>Play</button>'),
    {sA: resume, sB: newGame});
  wireSeg('diffSeg', function(v){ depth = +v; save(); });
}
function showMenu(){
  showSheet('<div class="kick">Paused</div><h1>Draughts</h1>' +
    '<div class="seglbl">Difficulty</div>' + segHTML('diffSeg', [[3,'Easy'],[5,'Medium'],[7,'Hard']], depth) +
    '<button class="act pri" id="sA"><svg><use href="#i-play"/></svg>Resume</button><button class="act glass" id="sB">New game</button><button class="act glass" id="sC">Leave game</button>',
    {sA: function(){ haptic('light'); hideSheet(); }, sB: newGame, sC: goHome});
  wireSeg('diffSeg', function(v){ depth = +v; save(); updateStatus(); });
}
function showOver(){
  showSheet('<div class="kick">Game over</div><h1>' + over.t + '</h1><p>' + over.p + '</p>' +
    '<button class="act pri" id="sA"><svg><use href="#i-again"/></svg>New game</button><button class="act glass" id="sB">See the board</button>',
    {sA: newGame, sB: function(){ haptic('light'); hideSheet(); }});
}

/* ---------- flow ---------- */
function setState(s){
  state = s; $('stage').classList.toggle('home', s === 'home');
  $('bMenu').classList.toggle('hide', s !== 'play'); $('score').classList.toggle('hide', s !== 'play');
  syncLook(); syncChrome(); render(); updateStatus();
}
function enterPlay(){
  hideSheet(); setState('play');
  if (!over && turn === 'b' && !thinking) aiTurn();
  else if (!over) checkOver();
}
function resume(){ haptic('medium'); enterPlay(); }
function newGame(){
  haptic('medium'); init(); turn = 'r'; sel = null; midJump = false; thinking = false; undoStack = []; over = null;
  render(); save(); enterPlay();
}
function goHome(){ haptic('light'); sel = null; midJump = false; setState('home'); showHome(); }

$('undoBtn').onclick = function(){ if (thinking || !undoStack.length) return; var h = undoStack.pop(); board = h.board; turn = 'r'; sel = null; midJump = false; over = null; hideSheet(); render(); save(); updateStatus(); haptic('light'); };
$('bMenu').onclick = function(){ haptic('light'); showMenu(); };

function save(){ keep('draughts', JSON.stringify({board:board, turn:turn, depth:depth})); }

function fit(){
  var w = $('wrap');
  var b = Math.floor(Math.min(w.clientWidth, w.clientHeight, 560));
  $('stage').style.setProperty('--b', Math.max(200, b) + 'px');
}
window.addEventListener('resize', fit);

/* ---------- boot ---------- */
init(); fit(); render(); updateStatus(); syncLook(); showHome();
load('draughts').then(function(v){
  if (v) try { var s = JSON.parse(v);
    if (s.depth) depth = s.depth;
    if (s.board){ board = s.board; turn = s.turn || 'r'; } else init();
  } catch(e){ init(); } else init();
  render(); updateStatus(); if (state === 'home') showHome();
});
</script></body></html>
