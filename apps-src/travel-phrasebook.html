<style>:root{--build-id:"13358ecba2";color-scheme:light dark; --h:176;

  --muted:var(--myllm-muted,#8a8a8e); --line:var(--myllm-border,#e3e3e8); --acc:var(--myllm-accent,#0a84ff);
  --fill:rgba(120,120,128,.12); }

  --ink:var(--myllm-text,#f2f2f7); --muted:var(--myllm-muted,#8e8e93); --line:var(--myllm-border,#2c2c2e); --fill:rgba(120,120,128,.24); } }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ font-family:var(--myllm-font,-apple-system,system-ui,sans-serif); background:var(--bg); color:var(--ink);

    padding:calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(30px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left)); }
  @media (min-width:768px){ body{ max-width:760px; } }
  svg.i{ width:1.25em; height:1.25em; fill:currentColor; flex-shrink:0; }
  button{ font:inherit; color:inherit; cursor:pointer; } button:active{ transform:scale(.96); }
  a{ color:inherit; }

  .head{ display:flex; align-items:center; gap:12px; margin:2px 2px 14px; }
  .tile{ display:flex; align-items:center; justify-content:center; color:#fff; flex-shrink:0;
    background:linear-gradient(145deg, hsl(var(--h) 62% 50%), hsl(calc(var(--h) + 40) 58% 28%)); }
  .head .tile{ width:44px; height:44px; border-radius:13px; font-size:19px; }
  .head .ht{ flex:1; min-width:0; }

  .head .acts{ display:flex; gap:8px; flex-shrink:0; }
  .head .acts button{ min-width:40px; height:40px; border-radius:12px; border:1px solid var(--line); background:var(--surface);
    display:flex; align-items:center; justify-content:center; gap:6px; padding:0 10px; font-size:13.5px; font-weight:650; }
  h2{ font-size:12px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); margin:20px 2px 10px; display:flex; align-items:center; gap:6px; }

  .card{ background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:14px; margin-bottom:12px; }
  label{ display:block; font-size:12px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); margin:14px 2px 7px; }
  label:first-child{ margin-top:0; }
  input{ width:100%; font:inherit; font-size:16px; padding:12px; border-radius:12px; border:1px solid var(--line); background:var(--bg); color:var(--ink); outline:none; }
  input:focus{ border-color:var(--acc); }
  .field{ position:relative; } .field svg.i{ position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--muted); font-size:15px; pointer-events:none; }
  .field input{ padding-left:38px; }
  .inrow{ display:flex; gap:8px; } .inrow input{ flex:1; min-width:0; }
  .chips{ display:flex; gap:7px; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; margin:10px -14px 0; padding:0 14px 2px; }
  .chips::-webkit-scrollbar{ display:none; }
  .chip{ flex:0 0 auto; min-height:36px; border:1px solid var(--line); background:var(--bg); border-radius:99px; padding:0 14px; font-size:13.5px; font-weight:650; white-space:nowrap; }
  .chip.hot{ background:var(--acc); border-color:var(--acc); color:#fff; }
  .go{ min-height:48px; border:none; border-radius:14px; background:var(--acc); color:#fff; font-size:16px; font-weight:700;
    display:flex; align-items:center; justify-content:center; gap:8px; padding:0 18px; }
  .go.wide{ width:100%; margin-top:14px; }
  .go.soft{ background:var(--fill); color:var(--acc); }
  .go:disabled{ opacity:.55; }
  .pillbtn{ display:inline-flex; align-items:center; gap:6px; min-height:36px; border:none; border-radius:10px; padding:0 12px;
    background:hsl(var(--h) 70% 50% / .13); color:hsl(var(--h) 70% 38%); font-size:13.5px; font-weight:700; text-decoration:none; }

  .spin{ width:16px; height:16px; border-radius:50%; border:2.4px solid currentColor; border-right-color:transparent; animation:spin .8s linear infinite; flex-shrink:0; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .skel{ border-radius:16px; margin-bottom:10px; background:var(--fill); animation:shimmer 1.4s ease-in-out infinite; }
  @keyframes shimmer{ 50%{ opacity:.45; } }

  .notice{ display:flex; gap:12px; align-items:flex-start; background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:14px; margin-bottom:12px; }
  .notice .tile{ width:36px; height:36px; border-radius:10px; font-size:16px; }
  .notice.warn .tile{ background:linear-gradient(145deg,#ff9f0a,#c25e00); }
  .notice b{ display:block; font-size:15px; font-weight:750; }
  .notice p{ font-size:13.5px; color:var(--muted); line-height:1.45; margin-top:2px; }
  .notice p b{ display:inline; font-size:inherit; font-weight:700; color:var(--ink); }
  .notice .go{ margin-top:10px; min-height:40px; font-size:14.5px; border-radius:12px; }
  .hint{ text-align:center; font-size:13px; color:var(--muted); line-height:1.5; padding:18px 12px 6px; }

  [hidden]{ display:none !important; }
  @media (prefers-reduced-motion:reduce){ .spin{ animation-duration:2.4s; } .skel{ animation:none; } button:active{ transform:none; } }

  .langbar{ display:flex; gap:7px; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none;
    margin:0 calc(-16px - env(safe-area-inset-right)) 12px calc(-16px - env(safe-area-inset-left)); padding:0 calc(16px + env(safe-area-inset-right)) 2px calc(16px + env(safe-area-inset-left)); }
  .langbar::-webkit-scrollbar{ display:none; }
  .langbar .chip{ background:var(--surface); }

  .aigo{ width:48px; height:48px; flex-shrink:0; border:none; border-radius:13px; background:var(--acc); color:#fff; display:flex; align-items:center; justify-content:center; font-size:19px; }

  .aiout .rom{ font-size:14px; font-weight:550; color:hsl(var(--h) 70% 32%); margin-top:3px; }
  @media (prefers-color-scheme:dark){ .aiout .rom{ color:hsl(var(--h) 75% 66%); } }

  .ainote{ font-size:12.5px; color:var(--muted); margin-top:9px; line-height:1.45; }

  .ph{ display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line); border-radius:15px; padding:9px 8px 9px 13px; margin-bottom:8px; }
  .ph .tx{ flex:1; min-width:0; cursor:pointer; }
  .ph .en{ font-size:12.5px; color:var(--muted); }
  .ph .tr{ font-size:17px; font-weight:750; line-height:1.3; margin-top:1px; overflow-wrap:anywhere; }
  .ph .rom{ font-size:13px; font-weight:550; color:hsl(var(--h) 70% 32%); margin-top:1px; }
  @media (prefers-color-scheme:dark){ .ph .rom{ color:hsl(var(--h) 75% 66%); } }
  .ib{ flex-shrink:0; width:44px; height:44px; border:none; border-radius:12px; background:var(--fill); display:flex; align-items:center; justify-content:center; font-size:17px; color:hsl(var(--h) 70% 36%); }

  .empty{ text-align:center; color:var(--muted); font-size:13.5px; padding:22px; }
  #voiceNote{ margin-top:4px; }

  /* ---------- show a local: a full-screen stage ---------- */
  .stage{ position:fixed; inset:0; z-index:300; color:#fff; overflow:hidden; }
  .stage .bg{ position:absolute; inset:0; transition:opacity .6s ease; }
  .stage .bg.d{ background:radial-gradient(120% 90% at 20% 10%, hsl(var(--h) 70% 30%), transparent 60%),

  .stage .bg.l{ opacity:0; background:radial-gradient(120% 90% at 20% 0%, hsl(var(--h) 80% 84%), transparent 60%),
      radial-gradient(120% 90% at 85% 100%, hsl(calc(var(--h) + 50) 76% 87%), transparent 62%), #f4f4f8; }
  .stage.lite{ color:#15151a; } .stage.lite .bg.l{ opacity:1; } .stage.lite .bg.d{ opacity:0; }
  .stage .col{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; text-align:center;
    padding:calc(12px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) calc(22px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left)); }
  .stage .top{ width:100%; max-width:640px; height:48px; display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
  .stage .lbl{ font-size:11px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; opacity:.62; }
  .glass{ border:1px solid rgba(255,255,255,.16); background:rgba(255,255,255,.12); color:inherit;
    -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px); }
  .stage.lite .glass{ border-color:rgba(0,0,0,.09); background:rgba(255,255,255,.62); }
  .stage .close{ height:48px; border-radius:99px; padding:0 18px; display:flex; align-items:center; gap:8px; font-size:15px; font-weight:750; }
  .stage .mid{ flex:1; min-height:0; width:100%; max-width:760px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; overflow-y:auto; }
  #bigtr{ font-size:clamp(34px, 11vw, 76px); font-weight:800; line-height:1.18; letter-spacing:-.01em; overflow-wrap:anywhere; }
  #bigrom{ font-size:clamp(18px, 5vw, 26px); font-weight:600; color:hsl(var(--h) 80% 72%); }
  .stage.lite #bigrom{ color:hsl(var(--h) 70% 30%); }
  #bigen{ font-size:16px; opacity:.62; }
  .stage .foot{ display:flex; flex-direction:column; align-items:center; gap:10px; flex-shrink:0; }
  .stage .say{ width:84px; height:84px; border-radius:50%; border:none; background:#fff; color:#0b0b10; font-size:30px; display:flex; align-items:center; justify-content:center; box-shadow:0 10px 30px rgba(0,0,0,.35); }
  .stage.lite .say{ background:#15151a; color:#fff; box-shadow:0 10px 26px rgba(20,20,40,.22); }
  .stage .say.on svg{ animation:pulse 1s ease-in-out infinite; }
  .stage .saylbl{ font-size:13px; font-weight:700; opacity:.7; }
  #bigNote{ max-width:420px; font-size:13px; line-height:1.45; opacity:.85; }
  @media (max-height:520px){                       /* phone on its side: phrase left, speaker right */
    .stage .col{ display:grid; grid-template-columns:minmax(0,1fr) auto; grid-template-rows:48px minmax(0,1fr); column-gap:24px; }
    .stage .top{ grid-column:1 / -1; max-width:none; }
    .stage .mid{ grid-column:1; grid-row:2; max-width:none; }
    .stage .foot{ grid-column:2; grid-row:2; align-self:center; width:min(220px,30vw); }
  }
  @media (prefers-reduced-motion:reduce){ .ib.on svg, .stage .say.on svg{ animation:none; } .stage .bg{ transition:none; } }

  @keyframes myllmAiSpin{to{transform:rotate(360deg)}}
  .myllm-ai-busy{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(18px);z-index:99999;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;display:flex;align-items:center;gap:10px;background:rgba(28,28,30,.96);color:#fff;border-radius:999px;padding:10px 16px 10px 14px;box-shadow:0 6px 22px rgba(0,0,0,.4);font-size:14px;font-weight:600;max-width:92%}
  .myllm-ai-busy.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .myllm-ai-cog{width:16px;height:16px;border-radius:50%;border:2.4px solid #a78bfa;border-right-color:transparent;animation:myllmAiSpin .9s linear infinite;flex-shrink:0}
  .myllm-ai-busy small{font-weight:400;opacity:.6}
</style>

<!-- AI thinking pill (house convention) -->
<script>
(function(){if(window.__myllmAiWrap||typeof window.myllmAsk!=='function')return;window.__myllmAiWrap=true;
var orig=window.myllmAsk,depth=0,node=null;
function ensure(){if(node)return;node=document.createElement('div');node.className='myllm-ai-busy';
node.innerHTML='<span class="myllm-ai-cog"></span><span>AI is thinking… <small>privately, on your device</small></span>';
(document.body||document.documentElement).appendChild(node);}
function show(){ensure();depth++;node.classList.add('on');}
function hide(){depth=Math.max(0,depth-1);if(depth===0&&node)node.classList.remove('on');}
window.myllmAsk=function(){show();var p;try{p=orig.apply(this,arguments);}catch(e){hide();throw e;}
return Promise.resolve(p).then(function(r){hide();return r;},function(e){hide();throw e;});};})();
</script>

  var tr = T[lang.id][p.k] || "", rom = R[lang.id] ? (R[lang.id][p.k] || "") : "";
  if (act.dataset.act === "say") speak(tr, [act]);
  else if (act.dataset.act === "fav") toggleFav(lang.id + "|" + p.k);
  else openBig({tr:tr, rom:rom, en:p.en});
});

/* ---------- show a local: the stage ---------- */
var bigText = "", bigOn = false;
function isLight(){ return !(window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches); }
/* A dark stage under MyLLM's white title bar looks cut in half, so without
   myllmImmersive the stage stays light in light mode. */
function syncLook(){ el("bigveil").classList.toggle("lite", isLight() && !window.myllmImmersive); }
function syncChrome(){
  if (!window.myllmImmersive) return;
  try{ myllmImmersive(bigOn, {keepAwake:bigOn}).catch(function(){}); }catch(_){}   /* the screen stays on while a local reads it */
}
function openBig(o){
  bigText = o.tr;
  el("bigtr").textContent = o.tr;
  el("bigtr").lang = lang.tts;
  el("bigtr").style.fontSize = "";
  el("bigrom").textContent = o.rom || "";
  el("bigen").textContent = o.en || "";
  el("biglbl").textContent = lang.name;
  var talk = canSpeak();
  el("bigspeak").hidden = !talk; el("biglabel").hidden = !talk; el("bigNote").hidden = true;
  bigOn = true; syncLook();
  el("bigveil").hidden = false;
  fitBig();
  document.body.style.overflow = "hidden";
  syncChrome();
  haptic("light");
}
/* A short phrase reads best on one line: shrink it (not below 26px) until it
   fits. A long one keeps the full size and wraps. */
function fitBig(){
  var t = el("bigtr"); t.style.fontSize = "";
  var max = parseFloat(getComputedStyle(t).fontSize) || 48, lh = 1.18;
  for (var s = max; s >= 26; s -= 2){
    t.style.fontSize = s + "px";
    if (t.scrollHeight <= s * lh * 1.25) return;
  }
  t.style.fontSize = "";
}
window.addEventListener("resize", function(){ if (bigOn) fitBig(); });
function closeBig(){
  if (!bigOn) return;
  bigOn = false; stopSpeaking();
  el("bigveil").hidden = true;
  document.body.style.overflow = "";
  syncChrome();
  haptic("light");
}
el("bigspeak").onclick = function(e){ e.stopPropagation(); speak(bigText, [el("bigspeak")]); };
el("bigclose").onclick = function(e){ e.stopPropagation(); closeBig(); };
/* as before: a tap anywhere else on the screen closes it */
el("bigveil").addEventListener("click", function(e){ if (!e.target.closest("button")) closeBig(); });
document.addEventListener("keydown", function(e){ if (e.key === "Escape") closeBig(); });
document.addEventListener("visibilitychange", function(){
  if (document.hidden){ stopSpeaking(); return; }
  if (bigOn) syncChrome();                        /* MyLLM puts its bars back when the app is left */
});
if (window.matchMedia){
  var mq = matchMedia("(prefers-color-scheme: dark)");
  if (mq.addEventListener) mq.addEventListener("change", syncLook); else if (mq.addListener) mq.addListener(syncLook);
}

/* ---------- AI translation ---------- */
/* Labelled lines with instruction-phrased fields, never example placeholders —
   small models (Apple Intelligence) echo format templates back verbatim, and
   the old "<the translation>" placeholder rendered as real content. Echoed
   instructions are rejected and retried once. */
var ECHO = /translated phrase|latin letters|polite traveller|traveller would pronounce|repeat this line|labelled line|nothing else|instruction text/i;
function parseTranslation(reply, wantRom){
  var r = String(reply || "").trim();
  var tr = "", rom = "", got = false;
  r.split(/\r?\n/).forEach(function(raw){
    var ln = raw.replace(/\*\*/g, "").trim();
    var m = ln.match(/^[-*#>\s]*(TRANSLATIONS?|ROMAN(?:IZATION|ISATION)?S?)\s*\d*\s*[:：]\s*(.*)$/i);
    if (!m) return;
    got = true;
    var k = m[1].toUpperCase(), v = m[2].trim();
    if (k.indexOf("TRANSLATION") === 0){ if (!tr) tr = v; }
    else if (k.indexOf("ROMAN") === 0){ if (!rom) rom = v; }
  });
  if (!got){
    /* legacy shapes: JSON from big cloud models, or a bare translation line */
    var s = r.indexOf("{"), e = r.lastIndexOf("}");
    if (s >= 0 && e > s){
      try{
        var j = JSON.parse(r.slice(s, e + 1));
        tr = String(j.translation || j.tr || "").trim();
        rom = String(j.roman || j.romanization || j.romanisation || j.rom || "").trim();
      }catch(e2){}
    }
    if (!tr) tr = r.split("\n")[0].trim();
  }
  tr = tr.replace(/^["'«]|["'»]$/g, "").trim();
  rom = rom.replace(/^["'«]|["'»]$/g, "").trim();
  if (!wantRom) rom = "";
  if (!tr || ECHO.test(tr) || ECHO.test(rom))
    throw new Error("the translator didn't return a real translation");
  return {tr: tr, rom: rom};
}
function aiBtn(on){ var b = el("aigo"); b.disabled = !!on; b.innerHTML = on ? '<i class="spin"></i>' : icon("arrow"); }
function aiTranslate(){
  var q = el("aiq").value.trim();
  if (!q){ haptic("light"); return; }
  var ask = ASK();
  if (!ask){
    el("ainote").textContent = "Freeform translation needs AI — enable it in Settings. The phrases below always work.";
    haptic("light"); return;
  }
  haptic("light");
  aiBtn(true);
  el("ainote").textContent = "Translating into " + lang.name + "…";
  var wantRom = !!R[lang.id];
  var p = "Translate this into " + lang.name + " for a polite traveller: \"" + q + "\"\n" +
      (wantRom ? "Reply with EXACTLY these labelled lines and nothing else:\nTRANSLATION: the translated phrase in " + lang.name + "\nROMAN: how a traveller would pronounce it, written in latin letters"
               : "Reply with EXACTLY this labelled line and nothing else:\nTRANSLATION: the translated phrase in " + lang.name);
  var sys = {system:"You are a precise translator. No commentary, no alternatives, no quotes."};
  ask(p, sys)
  .then(function(r){ return parseTranslation(r || "", wantRom); })
  .catch(function(){
    return ask(p + "\nIMPORTANT: fill each labelled line with real content — never repeat the instruction text.", sys)
      .then(function(r){ return parseTranslation(r || "", wantRom); });
  })
  .then(function(o){
    el("aitr").textContent = o.tr;
    el("airom").textContent = o.rom;
    el("airom").hidden = !o.rom;
    el("aiout").hidden = false;
    el("ainote").textContent = "";
    aiBtn(false);
    haptic("success");
  })
  .catch(function(){
    el("ainote").textContent = "Translation didn't run — try again.";
    aiBtn(false);
  });
}
el("aigo").onclick = aiTranslate;
el("aiq").addEventListener("keydown", function(e){ if (e.key === "Enter") aiTranslate(); });
el("aiout").onclick = function(){ openBig({tr:el("aitr").textContent, rom:el("airom").textContent, en:el("aiq").value}); };
el("q").addEventListener("input", render);

/* ---------- boot ---------- */
aiBtn(false);
Promise.all([store().getItem("pb_lang"), store().getItem("pb_favs")]).then(function(v){
  if (v[0]){ var l = LANGS.filter(function(x){ return x.id === v[0]; })[0]; if (l) lang = l; }
  if (v[1]){ try{ favs = JSON.parse(v[1]) || {}; }catch(e){} }
  if (!ASK()) el("ainote").textContent = "Tip: enable AI in Settings and this box translates anything — even with no signal.";
  renderLangs(); render();
});
</script>
