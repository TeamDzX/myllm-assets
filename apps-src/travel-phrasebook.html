var lang = LANGS[0];
var favs = {};       /* "es|hello" -> true */

/* Voice: prefer a native myllmSpeak bridge if one ever ships; today WKWebView's
   built-in speechSynthesis does the job (same iOS voices underneath). Triggered
   from a tap, which satisfies the user-gesture requirement. */
var CAN_SPEAK = !!(window.myllmSpeak || (window.speechSynthesis && window.SpeechSynthesisUtterance));
function speak(text){
  haptic("selection");
  if (window.myllmSpeak){
    try{ myllmSpeak(text, {lang:lang.tts}); return; }catch(_){}
  }
  if (window.speechSynthesis){
    try{
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = lang.tts;
      u.rate = 0.9;
      speechSynthesis.speak(u);
    }catch(_){}
  }
}

function renderLangs(){
  el("langs").innerHTML = LANGS.map(function(l){
    return '<button class="lang' + (l.id === lang.id ? ' on' : '') + '" onclick="setLang(\'' + l.id + '\')">' + l.flag + ' ' + l.name + '</button>';
  }).join("");
}
function setLang(id){
  lang = LANGS.filter(function(l){ return l.id === id; })[0];
  haptic("selection");
  store.setItem("pb_lang", id);
  el("aiout").style.display = "none";
  renderLangs(); render();
}

function phraseRow(p){
  var tr = T[lang.id][p.k] || "";
  var rom = R[lang.id] ? (R[lang.id][p.k] || "") : "";
  var fk = lang.id + "|" + p.k;
  return '<div class="ph">' +
    '<div class="tx" onclick=\'openBig({tr:"' + esc(tr).replace(/'/g,"\\'") + '",rom:"' + esc(rom) + '",en:"' + esc(p.en) + '"})\'>' +
      '<div class="en">' + esc(p.en) + '</div>' +
      '<div class="tr">' + esc(tr) + '</div>' +
      (rom ? '<div class="rom">' + esc(rom) + '</div>' : '') +
    '</div>' +
    (CAN_SPEAK ? '<button onclick="speak(' + JSON.stringify(tr).replace(/"/g,"&quot;") + ')">🔊</button>' : '') +
    '<button class="fav' + (favs[fk] ? ' on' : '') + '" onclick="toggleFav(\'' + fk + '\')">' + (favs[fk] ? '⭐' : '☆') + '</button>' +
  '</div>';
}

function render(){
  var q = (el("q").value || "").toLowerCase().trim();
  var html = "";
  var favList = P.filter(function(p){ return favs[lang.id + "|" + p.k]; });
  if (favList.length && !q){
    html += '<div class="cat">⭐ Your phrases</div>' + favList.map(phraseRow).join("");
  }
  CATS.forEach(function(c){
    var rows = P.filter(function(p){
      if (p.c !== c.id) return false;
      if (!q) return true;
      var tr = (T[lang.id][p.k] || "").toLowerCase();
      return p.en.toLowerCase().indexOf(q) >= 0 || tr.indexOf(q) >= 0;
    });
    if (rows.length) html += '<div class="cat">' + c.name + '</div>' + rows.map(phraseRow).join("");
  });
  el("list").innerHTML = html || '<p class="empty">No phrases match — try the translator above.</p>';
}

function toggleFav(fk){
  favs[fk] = !favs[fk];
  if (!favs[fk]) delete favs[fk];
  store.setItem("pb_favs", JSON.stringify(favs));
  haptic(favs[fk] ? "success" : "light");
  render();
}

/* ---------- big screen ---------- */
var bigText = "";
function openBig(o){
  bigText = o.tr;
  el("bigtr").textContent = o.tr;
  el("bigrom").textContent = o.rom || "";
  el("bigen").textContent = o.en || "";
  el("bigspeak").style.display = CAN_SPEAK ? "inline-block" : "none";
  el("bigspeak").onclick = function(e){ e.stopPropagation(); speak(bigText); };
  el("bigveil").classList.add("on");
  haptic("light");
}
function closeBig(e){
  if (e && e.target && e.target.id === "bigspeak") return;
  el("bigveil").classList.remove("on");
}

/* ---------- AI translation ---------- */
/* Labelled lines with instruction-phrased fields, never example placeholders —
   small models (Apple Intelligence) echo format templates back verbatim, and
   the old "<the translation>" placeholder rendered as real content. Echoed
   instructions are rejected and retried once. */
var ECHO = /translated phrase|latin letters|polite traveller|traveller would pronounce|repeat this line|labelled line|nothing else|instruction text/i;
function parseTranslation(reply, wantRom){
  var r = String(reply || "").trim();
  var tr = "", rom = "", got = false;
  r.split(/\r?\n/).forEach(function(raw){
    var ln = raw.replace(/\*\*/g, "").trim();
    var m = ln.match(/^[-*#>\s]*(TRANSLATIONS?|ROMAN(?:IZATION|ISATION)?S?)\s*\d*\s*[:：]\s*(.*)$/i);
    if (!m) return;
    got = true;
    var k = m[1].toUpperCase(), v = m[2].trim();
    if (k.indexOf("TRANSLATION") === 0){ if (!tr) tr = v; }
    else if (k.indexOf("ROMAN") === 0){ if (!rom) rom = v; }
  });
  if (!got){
    /* legacy shapes: JSON from big cloud models, or a bare translation line */
    var s = r.indexOf("{"), e = r.lastIndexOf("}");
    if (s >= 0 && e > s){
      try{
        var j = JSON.parse(r.slice(s, e + 1));
        tr = String(j.translation || j.tr || "").trim();
        rom = String(j.roman || j.romanization || j.romanisation || j.rom || "").trim();
      }catch(e2){}
    }
    if (!tr) tr = r.split("\n")[0].trim();
  }
  tr = tr.replace(/^["'«]|["'»]$/g, "").trim();
  rom = rom.replace(/^["'«]|["'»]$/g, "").trim();
  if (!wantRom) rom = "";
  if (!tr || ECHO.test(tr) || ECHO.test(rom))
    throw new Error("the translator didn't return a real translation");
  return {tr: tr, rom: rom};
}
function aiTranslate(){
  var q = el("aiq").value.trim();
  if (!q){ haptic("light"); return; }
  if (!ASK){
    el("ainote").textContent = "Freeform translation needs AI — enable it in Settings. The phrases below always work.";
    haptic("light"); return;
  }
  haptic("light");
  el("aigo").disabled = true;
  var wantRom = !!R[lang.id];
  var p = "Translate this into " + lang.name + " for a polite traveller: \"" + q + "\"\n" +
      (wantRom ? "Reply with EXACTLY these labelled lines and nothing else:\nTRANSLATION: the translated phrase in " + lang.name + "\nROMAN: how a traveller would pronounce it, written in latin letters"
               : "Reply with EXACTLY this labelled line and nothing else:\nTRANSLATION: the translated phrase in " + lang.name);
  var sys = {system:"You are a precise translator. No commentary, no alternatives, no quotes."};
  ASK(p, sys)
  .then(function(r){ return parseTranslation(r || "", wantRom); })
  .catch(function(){
    return ASK(p + "\nIMPORTANT: fill each labelled line with real content — never repeat the instruction text.", sys)
      .then(function(r){ return parseTranslation(r || "", wantRom); });
  })
  .then(function(o){
    el("aitr").textContent = o.tr;
    el("airom").textContent = o.rom;
    el("aiout").style.display = "block";
    el("ainote").textContent = "Tap the translation to show it full-screen.";
    el("aigo").disabled = false;
    haptic("success");
  })
  .catch(function(){
    el("ainote").textContent = "Translation didn't run — try again.";
    el("aigo").disabled = false;
  });
}

Promise.all([store.getItem("pb_lang"), store.getItem("pb_favs")]).then(function(v){
  if (v[0]){ var l = LANGS.filter(function(x){ return x.id === v[0]; })[0]; if (l) lang = l; }
  if (v[1]){ try{ favs = JSON.parse(v[1]) || {}; }catch(e){} }
  if (!ASK) el("ainote").textContent = "Tip: enable AI in Settings and this box translates anything — even with no signal.";
  renderLangs(); render();
});
