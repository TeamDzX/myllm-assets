<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>8-Bit Player</title>
<style>
  :root{
    --accent: var(--myllm-accent, #e0457b);
    --bg:#0c0d12; --panel:#15171f; --panel2:#1d2030; --text:#eef0f6; --muted:#9aa0b4; --line:rgba(255,255,255,.10);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
  html,body{ margin:0; height:100%; overflow:hidden; }
  body{ background:var(--bg); color:var(--text);
    font-family:var(--myllm-font,-apple-system,system-ui,'Segoe UI',Roboto,sans-serif);
    display:flex; flex-direction:column; padding-top:env(safe-area-inset-top); }
  .top{ display:flex; align-items:center; gap:10px; padding:10px 14px; }
  .top h1{ font-size:16px; margin:0; font-weight:800; letter-spacing:.2px; }
  .top .sp{ flex:1; }
  .load{ font:inherit; font-weight:700; font-size:14px; color:#fff; background:var(--accent);
    border:0; border-radius:10px; padding:9px 14px; cursor:pointer; }
  .load input{ display:none; }
  .screen-wrap{ flex:1; display:flex; align-items:center; justify-content:center; min-height:0; background:#000;
    margin:0 0 6px; position:relative; }
  canvas{ image-rendering:pixelated; image-rendering:crisp-edges; width:100%; height:auto;
    max-width:100%; max-height:100%; display:block; background:#000; }
  .hint{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:10px; text-align:center; color:var(--muted); font-size:14px; padding:24px; }
  .hint b{ color:var(--text); font-size:16px; }
  body.playing .hint{ display:none; }
  .status{ min-height:18px; text-align:center; color:var(--muted); font-size:12px; padding:0 14px 4px; }
  /* Controls */
  .pad{ display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:10px;
    padding:8px 16px calc(14px + env(safe-area-inset-bottom)); }
  .dpad{ position:relative; width:140px; height:140px; }
  .dpad .d{ position:absolute; width:48px; height:48px; background:var(--panel2); color:var(--muted);
    border:1px solid var(--line); font-size:16px; display:flex; align-items:center; justify-content:center; }
  .dpad .up{ top:0; left:46px; border-radius:10px 10px 0 0; }
  .dpad .down{ bottom:0; left:46px; border-radius:0 0 10px 10px; }
  .dpad .left{ left:0; top:46px; border-radius:10px 0 0 10px; }
  .dpad .right{ right:0; top:46px; border-radius:0 10px 10px 0; }
  .mid{ display:flex; flex-direction:column; gap:8px; }
  .sm{ font:inherit; font-weight:700; font-size:11px; letter-spacing:.5px; color:var(--muted);
    background:var(--panel2); border:1px solid var(--line); border-radius:20px; padding:8px 14px; }
  .ab{ display:flex; align-items:center; gap:14px; justify-self:end; }
  .ab-btn{ width:64px; height:64px; border-radius:50%; font:inherit; font-weight:800; font-size:22px; color:#fff;
    background:var(--accent); border:0; box-shadow:0 4px 0 rgba(0,0,0,.35); }
  .ab-btn:last-child{ transform:translateY(-14px); }
  button{ cursor:pointer; }
  button.on{ filter:brightness(1.4); }
  @media (min-width:768px){
    body{ max-width:760px; margin:0 auto; }
    .ab-btn{ width:76px; height:76px; font-size:26px; }
    .dpad{ width:168px; height:168px; }
    .dpad .d{ width:58px; height:58px; }
    .dpad .up,.dpad .down{ left:55px; } .dpad .left,.dpad .right{ top:55px; }
  }
</style>
</head>
<body>
<div class="top">
  <h1>8-Bit Player</h1>
  <span class="sp"></span>
  <label class="load">Load ROM<input id="file" type="file" accept=".nes,application/octet-stream"></label>
</div>

<div class="screen-wrap">
  <canvas id="screen" width="256" height="240"></canvas>
  <div class="hint">
    <b>Bring your own ROM</b>
    <div>Tap <b>Load ROM</b> and pick a <b>.nes</b> file you own.<br>No games are included — this is just the player.</div>
  </div>
</div>
<div class="status" id="status"></div>

<div class="pad">
  <div class="dpad">
    <button class="d up"    data-btn="UP" aria-label="Up">▲</button>
    <button class="d down"  data-btn="DOWN" aria-label="Down">▼</button>
    <button class="d left"  data-btn="LEFT" aria-label="Left">◀</button>
    <button class="d right" data-btn="RIGHT" aria-label="Right">▶</button>
  </div>
  <div class="mid">
    <button class="sm" data-btn="SELECT">SELECT</button>
    <button class="sm" data-btn="START">START</button>
  </div>
  <div class="ab">
    <button class="ab-btn" data-btn="B">B</button>
    <button class="ab-btn" data-btn="A">A</button>
  </div>
</div>

<script>/*__JSNES__*/</script>
<script>
(function(){
  var SW=256, SH=240;
  var canvas=document.getElementById('screen'), ctx=canvas.getContext('2d');
  var img=ctx.getImageData(0,0,SW,SH);
  var buf=new ArrayBuffer(img.data.length), buf8=new Uint8ClampedArray(buf), buf32=new Uint32Array(buf);
  for(var i=0;i<buf32.length;i++) buf32[i]=0xFF000000;
  function status(m){ document.getElementById('status').textContent=m||''; }

  // --- Audio: ring buffer fed by jsnes, drained by a ScriptProcessor. The
  //     native .playback session (set by MyLLMos) makes WebAudio audible. ---
  var AC=window.AudioContext||window.webkitAudioContext;
  var actx=AC?new AC():null, RATE=actx?actx.sampleRate:44100;
  var RB=8192, aL=new Float32Array(RB), aR=new Float32Array(RB), aw=0, ar=0;
  function audioPush(l,r){ aL[aw]=l; aR[aw]=r; aw=(aw+1)%RB; }
  if(actx){
    var sp=actx.createScriptProcessor(1024,0,2);
    sp.onaudioprocess=function(e){
      var l=e.outputBuffer.getChannelData(0), r=e.outputBuffer.getChannelData(1);
      for(var i=0;i<l.length;i++){
        if(ar!==aw){ l[i]=aL[ar]; r[i]=aR[ar]; ar=(ar+1)%RB; } else { l[i]=0; r[i]=0; }
      }
    };
    sp.connect(actx.destination);
  }
  function resumeAudio(){ try{ if(actx && actx.state==='suspended') actx.resume(); }catch(e){} }

  function renderFrame(fb){
    for(var i=0;i<fb.length;i++) buf32[i]=0xFF000000 | fb[i];
    img.data.set(buf8); ctx.putImageData(img,0,0);
  }

  var nes=new jsnes.NES({ onFrame:renderFrame, onAudioSample:audioPush, sampleRate:RATE });

  var BTN={ UP:jsnes.Controller.BUTTON_UP, DOWN:jsnes.Controller.BUTTON_DOWN,
    LEFT:jsnes.Controller.BUTTON_LEFT, RIGHT:jsnes.Controller.BUTTON_RIGHT,
    A:jsnes.Controller.BUTTON_A, B:jsnes.Controller.BUTTON_B,
    SELECT:jsnes.Controller.BUTTON_SELECT, START:jsnes.Controller.BUTTON_START };

  var running=false;
  function loop(){ if(!running) return; try{ nes.frame(); }catch(e){ running=false; status('Emulation stopped: '+(e.message||e)); return; } requestAnimationFrame(loop); }

  function toBinary(u8){ var CH=0x8000, out=[]; for(var i=0;i<u8.length;i+=CH){ out.push(String.fromCharCode.apply(null, u8.subarray(i,i+CH))); } return out.join(''); }
  function startROM(binary){
    try{ nes.loadROM(binary); }catch(e){ status('That doesn’t look like a valid .nes ROM.'); return; }
    running=true; resumeAudio(); document.body.classList.add('playing'); status('');
    requestAnimationFrame(loop);
  }

  document.getElementById('file').addEventListener('change', function(e){
    var f=e.target.files && e.target.files[0]; if(!f) return;
    resumeAudio(); status('Loading '+f.name+'…');
    var rd=new FileReader();
    rd.onload=function(ev){ startROM(toBinary(new Uint8Array(ev.target.result))); };
    rd.onerror=function(){ status('Couldn’t read that file.'); };
    rd.readAsArrayBuffer(f);
  });

  // --- Controls (touch + mouse + keyboard) ---
  function bind(el){
    var b=BTN[el.getAttribute('data-btn')];
    function dn(e){ if(e.cancelable) e.preventDefault(); resumeAudio(); if(b!=null) nes.buttonDown(1,b); el.classList.add('on'); }
    function up(e){ if(e&&e.cancelable) e.preventDefault(); if(b!=null) nes.buttonUp(1,b); el.classList.remove('on'); }
    el.addEventListener('touchstart',dn,{passive:false});
    el.addEventListener('touchend',up,{passive:false});
    el.addEventListener('touchcancel',up,{passive:false});
    el.addEventListener('mousedown',dn);
    el.addEventListener('mouseup',up);
    el.addEventListener('mouseleave',function(e){ if(el.classList.contains('on')) up(e); });
    el.addEventListener('contextmenu',function(e){ e.preventDefault(); });
  }
  [].forEach.call(document.querySelectorAll('[data-btn]'), bind);

  var KMAP={ArrowUp:'UP',ArrowDown:'DOWN',ArrowLeft:'LEFT',ArrowRight:'RIGHT',KeyZ:'B',KeyX:'A',KeyA:'B',KeyS:'A',Enter:'START',ShiftRight:'SELECT',ShiftLeft:'SELECT',Backspace:'SELECT'};
  document.addEventListener('keydown',function(e){ var k=KMAP[e.code]; if(k){ e.preventDefault(); resumeAudio(); nes.buttonDown(1,BTN[k]); }});
  document.addEventListener('keyup',function(e){ var k=KMAP[e.code]; if(k){ e.preventDefault(); nes.buttonUp(1,BTN[k]); }});

  // Pause the loop when the app is backgrounded; resume on return.
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState==='hidden'){ running=false; }
    else if(nes && document.body.classList.contains('playing') && !running){ running=true; requestAnimationFrame(loop); }
  });
})();
</script>
</body>
</html>
