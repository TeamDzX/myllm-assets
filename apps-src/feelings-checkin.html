<title>Feelings Check-In</title>
<meta name="myllm:immersive" content="on">
<style>:root{--build-id:"719a6558f9";color-scheme:light dark;
  --bg:var(--myllm-bg,#f2f2f7); --surface:var(--myllm-surface,#fff); --ink:var(--myllm-text,#111);
  --muted:var(--myllm-muted,#8a8a8e); --line:var(--myllm-border,#e3e3e8); --acc:var(--myllm-accent,#0a84ff);
  --fill:rgba(120,120,128,.12); --h:285; }
@media (prefers-color-scheme:dark){ :root{ --bg:var(--myllm-bg,#000); --surface:var(--myllm-surface,#1c1c1e);
  --ink:var(--myllm-text,#f2f2f7); --muted:var(--myllm-muted,#8e8e93); --line:var(--myllm-border,#2c2c2e); --fill:rgba(120,120,128,.24); } }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
  body{ font-family:var(--myllm-font,-apple-system,system-ui,sans-serif); background:var(--bg); color:var(--ink);
    max-width:600px; margin:0 auto; min-height:100dvh; font-size:15.5px; line-height:1.4;
    padding:calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(30px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left)); }
  @media (min-width:768px){ body{ max-width:720px; } }
  svg.i{ width:1.25em; height:1.25em; fill:currentColor; flex-shrink:0; }
  button{ font:inherit; color:inherit; cursor:pointer; } button:active{ transform:scale(.97); }

  .head{ display:flex; align-items:center; gap:12px; margin:2px 2px 14px; }
  .tile{ display:flex; align-items:center; justify-content:center; color:#fff; flex-shrink:0;
    background:linear-gradient(145deg, hsl(var(--h) 45% 52%), hsl(calc(var(--h) + 30) 45% 34%)); }
  .head .tile{ width:44px; height:44px; border-radius:13px; font-size:19px; }
  .head .ht{ flex:1; min-width:0; }
  h1{ font-size:22px; font-weight:800; letter-spacing:-.01em; }
  .head p{ font-size:13px; color:var(--muted); margin-top:1px; }
  .q{ font-size:20px; font-weight:800; letter-spacing:-.01em; margin:4px 2px 12px; }
  h3{ font-size:12px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); margin:22px 2px 10px; }

  /* Four calm colour tiles; the faces are content. */
  .zones{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (min-width:700px){ .zones{ grid-template-columns:repeat(4,1fr); } }
  .zone{ min-height:140px; border-radius:22px; padding:16px 12px; color:#fff; text-align:center; border:3px solid transparent;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; box-shadow:0 6px 16px rgba(0,0,0,.12); }
  .zone.on{ border-color:var(--ink); }
  .zone .em{ font-size:48px; line-height:1.1; }
  .zone .nm{ font-size:18px; font-weight:800; margin-top:4px; }
  .zone .ds{ font-size:12.5px; opacity:.92; }

  .panel{ margin-top:14px; background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:16px; border-top-width:8px; }
  .panel h2{ display:flex; align-items:center; gap:10px; font-size:21px; font-weight:800; }
  .panel h2 .em{ font-size:30px; }
  .panel .msg{ font-size:15.5px; color:var(--muted); line-height:1.5; margin:6px 0 12px; }
  .tool{ display:flex; align-items:center; gap:14px; min-height:60px; padding:10px 14px; border-radius:16px; background:var(--fill); margin-bottom:8px; font-size:17px; font-weight:650; line-height:1.3; }
  .tool .em{ font-size:28px; flex-shrink:0; }
  .pbtns{ display:flex; gap:10px; margin-top:12px; }
  .pbtns button{ flex:1; min-height:56px; border:none; border-radius:16px; font-size:16px; font-weight:750; display:flex; align-items:center; justify-content:center; gap:8px; }
  .logbtn{ color:#fff; }
  .closebtn{ background:var(--fill); }

  .card{ background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:4px 14px; }
  .hrow{ display:flex; align-items:center; gap:12px; font-size:16px; font-weight:600; min-height:56px; border-bottom:1px solid var(--line); }
  .hrow:last-child{ border-bottom:none; }
  .hrow .dot{ width:12px; height:12px; border-radius:50%; flex-shrink:0; }
  .hrow .em{ font-size:24px; }
  .hrow .t{ margin-left:auto; color:var(--muted); font-size:13.5px; font-weight:500; font-variant-numeric:tabular-nums; }
  .clear{ display:flex; align-items:center; gap:6px; min-height:44px; border:none; background:none; color:#e5484d; font-size:14px; font-weight:700; margin:6px 2px 0; }
  [hidden]{ display:none !important; }
  @media (prefers-reduced-motion:reduce){ button:active{ transform:none; } }

/* myllm-fullscreen-v2 — MyLLM 5.6.2+ opens this app full screen; the ✕ is the way out. */
.head .imm-acts{display:none;flex-shrink:0;margin-left:auto}
.head .acts + .imm-acts{margin-left:0}
body.imm .head .imm-acts{display:flex}
.head .imm-acts button{width:40px;height:40px;border-radius:12px;border:1px solid var(--myllm-border,rgba(128,128,128,.28));
  background:var(--myllm-surface,rgba(128,128,128,.12));color:var(--myllm-text,currentColor);display:grid;place-items:center;padding:0;cursor:pointer;transition:transform .12s}
.head .imm-acts button:active,.head .imm-x:active{transform:scale(.94)}
.head .imm-x{display:none !important}
body.imm .head .imm-x{display:grid !important;place-items:center}
.imm-x svg,.imm-acts svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}
.imm-safe{display:none}
body.imm .imm-safe{display:block}
</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20.3l-1.3-1.2C5.8 14.7 3 12.1 3 8.9A4.8 4.8 0 0 1 7.9 4c1.6 0 3.1.7 4.1 1.9A5.5 5.5 0 0 1 16.1 4 4.8 4.8 0 0 1 21 8.9c0 3.2-2.8 5.8-7.7 10.2z" fill="currentColor"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.6l4.6 4.6L19.2 7.4" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></symbol>
</defs></svg>

<div class="imm-safe"></div><div class="head">
  <div class="tile"><svg class="i"><use href="#i-heart"/></svg></div>
  <div class="ht"><h1>Feelings Check-In</h1><p>Tap the colour that matches how you feel right now.</p></div>
<div class="imm-acts"><button type="button" aria-label="Close Feelings Check-In" onclick="myllmFSClose()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div></div>
<div class="q">How Are You Feeling?</div>
<div class="zones" id="zones"></div>
<div class="panel" id="panel" hidden></div>
<div id="hist"></div>

<script>
function el(i){return document.getElementById(i)}
/* Bridges are looked up when used, never kept: MyLLM can add them after this
   script has run. */
function store(){return window.myllmStorage||{getItem:function(){return Promise.resolve(null)},setItem:function(){return Promise.resolve()}}}
function haptic(s){if(window.myllmHaptic)try{myllmHaptic(s)}catch(e){}}
function icon(n){return '<svg class="i"><use href="#i-'+n+'"/></svg>'}
var ZONES=[
 {id:'blue',c:'#4a7bf0',em:'😢',nm:'Blue',ds:'sad · tired · poorly',
  msg:"It's okay to feel low. These can help you feel a bit better.",
  tools:[['🤗','Ask for a hug or a chat'],['💧','Have a drink of water'],['🛋️','Rest in a cosy quiet spot'],['🌬️','Take three slow breaths']]},
 {id:'green',c:'#34a853',em:'😊',nm:'Green',ds:'happy · calm · ready',
  msg:"You're in a great place to learn and play. Keep it up!",
  tools:[['🎯','Carry on with what you’re doing'],['🤝','Help a friend or say hello'],['🌟','Notice one good thing right now']]},
 {id:'yellow',c:'#e0a400',em:'😟',nm:'Yellow',ds:'worried · wiggly · silly',
  msg:"Feeling a bit wobbly is normal. Let's get steady again.",
  tools:[['🌬️','Breathe in for 4, out for 4'],['🔢','Slowly count to ten'],['✋','Squeeze and let go your hands'],['⏸️','Ask for a short break']]},
 {id:'red',c:'#e04a3c',em:'😠',nm:'Red',ds:'angry · upset · too much',
  msg:"Big feelings are okay. You are safe. Let's calm your body.",
  tools:[['🛑','Stop and stand still'],['🌬️','Take long, slow breaths'],['🧱','Push your hands on a wall'],['🧑','Find a grown-up you trust']]}
];
var COL={}; ZONES.forEach(function(z){COL[z.id]=z.c});
var hist=[],openId=null;
function save(){store().setItem('fc_hist',JSON.stringify(hist))}
function renderZones(){
  var Z=el('zones');Z.innerHTML='';
  ZONES.forEach(function(z){
    var b=document.createElement('button');b.type='button';b.className='zone'+(openId===z.id?' on':'');
    b.style.background='linear-gradient(160deg,'+z.c+','+z.c+'dd)';
    b.innerHTML='<div class="em">'+z.em+'</div><div class="nm">'+z.nm+'</div><div class="ds">'+z.ds+'</div>';
    b.onclick=function(){openZone(z)};
    Z.appendChild(b);
  });
}
function closePanel(){el('panel').hidden=true;openId=null;renderZones()}
function openZone(z){
  haptic('selection');openId=z.id;renderZones();
  // pick up to 3 tools, rotating so it feels fresh
  var t=z.tools.slice();for(var i=t.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=t[i];t[i]=t[j];t[j]=x}
  t=t.slice(0,3);
  var P=el('panel');P.hidden=false;P.style.borderTopColor=z.c;
  P.innerHTML='<h2><span class="em">'+z.em+'</span>'+z.nm+'</h2><div class="msg">'+z.msg+'</div>'+
    t.map(function(x){return '<div class="tool"><span class="em">'+x[0]+'</span><span>'+x[1]+'</span></div>'}).join('')+
    '<div class="pbtns"><button class="logbtn" id="logb" type="button">'+icon('check')+'Save how I feel</button><button class="closebtn" id="closeb" type="button">Close</button></div>';
  el('logb').style.background=z.c;
  el('logb').onclick=function(){logFeeling(z)};
  el('closeb').onclick=closePanel;
  P.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function logFeeling(z){
  hist.unshift({z:z.id,em:z.em,nm:z.nm,t:Date.now()});
  hist=hist.slice(0,30);
  save();
  haptic('success');
  closePanel();
  renderHist();
}
function fmtTime(ts){var d=new Date(ts);var h=d.getHours(),m=d.getMinutes();var ap=h<12?'am':'pm';h=h%12||12;return h+':'+(m<10?'0':'')+m+ap}
function sameDay(a,b){var x=new Date(a),y=new Date(b);return x.toDateString()===y.toDateString()}
function renderHist(){
  var H=el('hist');
  var today=hist.filter(function(r){return sameDay(r.t,Date.now())});
  if(!today.length){H.innerHTML='';return}
  H.innerHTML='<h3>Today’s check-ins</h3><div class="card">'+today.map(function(r){
    return '<div class="hrow"><span class="dot" style="background:'+(COL[r.z]||'#999')+'"></span><span class="em">'+r.em+'</span>'+r.nm+'<span class="t">'+fmtTime(r.t)+'</span></div>';
  }).join('')+'</div><button class="clear" id="clr" type="button">'+icon('x')+'Clear today</button>';
  el('clr').onclick=function(){hist=hist.filter(function(r){return !sameDay(r.t,Date.now())});save();renderHist()};
}
renderZones();
store().getItem('fc_hist').then(function(v){if(v){try{hist=JSON.parse(v)||[]}catch(e){}}renderHist()});

/* myllm-fullscreen-v2 — full screen where MyLLM can also close the app for us
   (myllmClose, 5.6.2+): full screen hides MyLLM's Done, and a page with no way
   out is worse than a repeated title, so elsewhere nothing changes.
   The spacer keeps the header clear of the status bar / Dynamic Island. It is
   live CSS — env(safe-area-inset-top) — not a measured number: the inset is
   still 0 when the page loads and only grows once MyLLM's bar has gone (v1
   measured once, so the title sat under the island). If the page's own styles
   already pad the header down by the inset, the spacer stays at 0. */
(function(){
  function full(){ return !!(window.myllmClose && window.myllmImmersive); }
  /* Does any rule that applies to the header or an ancestor already use the top inset? */
  function pageHandlesInset(head){
    var chain = [], n, found = false;
    for (n = head; n && n.nodeType === 1; n = n.parentElement) chain.push(n);
    function walk(rules){
      for (var i = 0; i < rules.length && !found; i++){
        var r = rules[i];
        if (r.cssRules && !r.selectorText) { walk(r.cssRules); continue; }
        if (!r.selectorText || !/safe-area-inset-top/.test(r.cssText) || !/(padding|margin|top)\s*:/.test(r.cssText)) continue;
        if (/\.imm-safe/.test(r.selectorText)) continue;
        for (var k = 0; k < chain.length; k++){
          try { if (chain[k].matches(r.selectorText)) { found = true; break; } } catch(e){}
        }
      }
    }
    for (var s = 0; s < document.styleSheets.length && !found; s++){
      try { walk(document.styleSheets[s].cssRules); } catch(e){}
    }
    for (n = head; n && n.nodeType === 1 && !found; n = n.parentElement){
      if (/safe-area-inset-top/.test(n.getAttribute("style") || "")) found = true;
    }
    return found;
  }
  function fit(){
    var sp = document.querySelector(".imm-safe"), head = document.querySelector(".head");
    if (!sp || !head) return;
    sp.style.height = (document.body.classList.contains("imm") && !pageHandlesInset(head)) ? "env(safe-area-inset-top)" : "0px";
  }
  function sync(){
    var f = full();
    document.body.classList.toggle("imm", f);
    fit();
    if (!f) return;
    try { window.myllmImmersive(true, { keepAwake:false }).catch(function(){}); } catch(e){}
  }
  window.myllmFSClose = function(){
    try { if (window.myllmHaptic) window.myllmHaptic("light"); } catch(e){}
    try { window.myllmClose().catch(function(){}); } catch(e){}
  };
  document.addEventListener("visibilitychange", function(){ if (!document.hidden) sync(); });
  sync();
})();
</script></body></html>
