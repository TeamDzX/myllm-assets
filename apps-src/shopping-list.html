<title>Shopping List</title>
<meta name="myllm:immersive" content="on">

<!-- #1 intent bus: this app can RECEIVE an "add-item" hand-off from another app. -->
<meta name="myllm:intents" content="add-item">

<!-- #2 app actions: the assistant can run this from chat ("add milk to my list"). -->
<script type="application/myllm-actions">
[
  { "name": "add-item",
    "description": "Add an item to the shopping list",
    "parameters": { "text": "the item(s) to add (one per line for several)" } }
]
</script>

<style>
  :root{--build-id:"ce49e3f95d";color-scheme:light dark;
    --bg:var(--myllm-bg,#f2f2f7); --surface:var(--myllm-surface,#fff); --ink:var(--myllm-text,#111);
    --muted:var(--myllm-muted,#8a8a8e); --line:var(--myllm-border,#e3e3e8); --acc:var(--myllm-accent,#0a84ff);
    --fill:rgba(120,120,128,.12); --h:140; }
  @media (prefers-color-scheme:dark){ :root{ --bg:var(--myllm-bg,#000); --surface:var(--myllm-surface,#1c1c1e);
    --ink:var(--myllm-text,#f2f2f7); --muted:var(--myllm-muted,#8e8e93); --line:var(--myllm-border,#2c2c2e); --fill:rgba(120,120,128,.24); } }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ font-family:var(--myllm-font,-apple-system,system-ui,sans-serif); background:var(--bg); color:var(--ink);
    max-width:600px; margin:0 auto; min-height:100dvh; font-size:15.5px; line-height:1.4; user-select:none; -webkit-user-select:none;
    padding:calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(30px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left)); }
  @media (min-width:768px){ body{ max-width:760px; } }
  svg.i{ width:1.25em; height:1.25em; fill:currentColor; flex-shrink:0; }
  button{ font:inherit; color:inherit; cursor:pointer; border:none; background:none; } button:active{ transform:scale(.96); }

  .head{ display:flex; align-items:center; gap:12px; margin:2px 2px 14px; }
  .tile{ display:flex; align-items:center; justify-content:center; color:#fff; flex-shrink:0;
    background:linear-gradient(145deg, hsl(var(--h) 62% 50%), hsl(calc(var(--h) + 40) 58% 28%)); }
  .head .tile{ width:44px; height:44px; border-radius:13px; font-size:19px; }
  .head .ht{ flex:1; min-width:0; }
  h1{ font-size:22px; font-weight:800; letter-spacing:-.01em; }
  .head p{ font-size:13px; color:var(--muted); margin-top:1px; }
  h2{ display:flex; align-items:center; font-size:12px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); margin:20px 2px 10px; }
  h2 .sp{ flex:1; }
  .clear{ min-height:32px; padding:0 4px; font-size:13px; font-weight:700; letter-spacing:0; text-transform:none; color:var(--acc); }
  .clear:disabled{ opacity:.4; }

  .hero{ border-radius:20px; padding:16px 18px; color:#fff; margin-bottom:12px;
    background:linear-gradient(145deg, hsl(var(--h) 55% 40%), hsl(calc(var(--h) + 40) 55% 24%)); box-shadow:0 10px 28px hsl(var(--h) 60% 24% / .25); }
  .hero .k{ font-size:11px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; opacity:.8; }
  .hero .n{ font-size:44px; font-weight:800; line-height:1.05; letter-spacing:-.03em; font-variant-numeric:tabular-nums; }
  .hero .l{ font-size:13px; opacity:.82; margin-top:1px; }
  .hero .bar{ height:6px; border-radius:99px; background:rgba(255,255,255,.25); margin-top:10px; overflow:hidden; }
  .hero .bar i{ display:block; height:100%; border-radius:99px; background:#fff; transition:width .35s cubic-bezier(.2,.8,.2,1); }

  .card{ background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:14px; margin-bottom:12px; }
  .add{ display:flex; gap:8px; }
  input[type=text]{ flex:1; min-width:0; font:inherit; font-size:16px; padding:12px; border-radius:12px; border:1px solid var(--line); background:var(--bg); color:var(--ink); outline:none; user-select:text; -webkit-user-select:text; }
  input[type=text]:focus{ border-color:var(--acc); }
  .btn{ flex-shrink:0; min-height:46px; border-radius:12px; background:var(--acc); color:#fff; font-weight:700; padding:0 16px; display:flex; align-items:center; gap:6px; }

  ul{ list-style:none; display:grid; gap:8px; }
  ul{ grid-template-columns:minmax(0,1fr); }
  @media (min-width:768px){ ul{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
  li{ display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:8px 6px 8px 8px; }
  li .check{ width:44px; height:44px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
  li .check i{ width:26px; height:26px; border-radius:50%; border:2.4px solid var(--line); display:flex; align-items:center; justify-content:center; color:transparent; font-size:14px; transition:background .2s, border-color .2s; }
  li.done .check i{ background:hsl(var(--h) 60% 42%); border-color:hsl(var(--h) 60% 42%); color:#fff; }
  li.done .label{ text-decoration:line-through; color:var(--muted); }
  .label{ flex:1; min-width:0; font-size:17px; overflow-wrap:anywhere; }
  .del{ width:44px; height:44px; flex-shrink:0; color:var(--muted); display:flex; align-items:center; justify-content:center; font-size:14px; }

  .empty{ grid-column:1/-1; text-align:center; padding:26px 20px 14px; background:var(--surface); border:1px solid var(--line); border-radius:18px; }
  .empty .tile{ width:48px; height:48px; border-radius:14px; font-size:21px; margin:0 auto 10px; opacity:.9; }
  .empty b{ display:block; font-size:16px; font-weight:750; }
  .empty p{ font-size:13.5px; color:var(--muted); line-height:1.5; max-width:290px; margin:5px auto 0; }

  .toast{ position:fixed; left:50%; bottom:calc(22px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:999px; font-size:14px; font-weight:600;
    opacity:0; transition:opacity .2s, transform .2s; pointer-events:none; max-width:80%; }
  .toast.show{ opacity:1; transform:translateX(-50%); }
  @media (prefers-reduced-motion:reduce){ .hero .bar i, li .check i{ transition:none; } button:active{ transform:none; } }

/* myllm-fullscreen-v2 — MyLLM 5.6.2+ opens this app full screen; the ✕ is the way out. */
.head .imm-acts{display:none;flex-shrink:0;margin-left:auto}
.head .acts + .imm-acts{margin-left:0}
body.imm .head .imm-acts{display:flex}
.head .imm-acts button{width:40px;height:40px;border-radius:12px;border:1px solid var(--myllm-border,rgba(128,128,128,.28));
  background:var(--myllm-surface,rgba(128,128,128,.12));color:var(--myllm-text,currentColor);display:grid;place-items:center;padding:0;cursor:pointer;transition:transform .12s}
.head .imm-acts button:active,.head .imm-x:active{transform:scale(.94)}
.head .imm-x{display:none !important}
body.imm .head .imm-x{display:grid !important;place-items:center}
.imm-x svg,.imm-acts svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}
.imm-safe{display:none}
body.imm .imm-safe{display:block}
</style>

</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-cart" viewBox="0 0 24 24"><path d="M2.5 3.5a1 1 0 0 1 1-1h1.6a1.5 1.5 0 0 1 1.46 1.16L6.8 5H20a1 1 0 0 1 .97 1.24l-1.6 6.5A1.5 1.5 0 0 1 17.92 14H8.4l.3 1.5H18a1 1 0 0 1 0 2H8.3a1.5 1.5 0 0 1-1.47-1.2L4.86 4.5H3.5a1 1 0 0 1-1-1zM9 21.5a1.6 1.6 0 1 1 0-3.2 1.6 1.6 0 0 1 0 3.2zm8 0a1.6 1.6 0 1 1 0-3.2 1.6 1.6 0 0 1 0 3.2z" fill="currentColor"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.6l4.6 4.6L19.2 7.4" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></symbol>
</defs></svg>

<div class="imm-safe"></div><div class="head">
  <div class="tile"><svg class="i"><use href="#i-cart"/></svg></div>
  <div class="ht"><h1>Shopping List</h1><p>Saved to your shared files — other apps and the assistant can add to it</p></div>
<div class="imm-acts"><button type="button" aria-label="Close Shopping List" onclick="myllmFSClose()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div></div>

<div class="hero">
  <div class="k">Left to get</div>
  <div class="n" id="left">0</div>
  <div class="l" id="count">0 items</div>
  <div class="bar"><i id="prog" style="width:0"></i></div>
</div>

<form class="card add" id="addForm">
  <input type="text" id="text" placeholder="Add an item…" autocomplete="off" enterkeyhint="done">
  <button class="btn" type="submit"><svg class="i"><use href="#i-plus"/></svg>Add</button>
</form>

<h2><span>On the list</span><span class="sp"></span><button class="clear" id="clearDone" type="button">Clear ticked</button></h2>
<ul id="list"></ul>

<div class="toast" id="toast"></div>

<script>
(function(){
  var FILE = 'lists/shopping.json';
  var items = [];

  function toast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(t._t); t._t = setTimeout(function(){ t.classList.remove('show'); }, 1800);
  }
  function haptic(s){ try{ if(window.myllmHaptic) myllmHaptic(s); }catch(e){} }

  // Persist to the SHARED file store (#3) so the Files app + other apps see it;
  // fall back to per-app storage, then localStorage (for the web preview).
  async function load(){
    try{ if(window.myllmFiles){ var t = await myllmFiles.read(FILE); return t ? JSON.parse(t) : []; } }catch(e){}
    try{ if(window.myllmStorage){ var v = await myllmStorage.getItem('shopping'); return v ? JSON.parse(v) : []; } }catch(e){}
    try{ var l = localStorage.getItem('shopping'); return l ? JSON.parse(l) : []; }catch(e){}
    return [];
  }
  async function save(){
    var s = JSON.stringify(items);
    try{ if(window.myllmFiles){ await myllmFiles.write(FILE, s); return; } }catch(e){}
    try{ if(window.myllmStorage){ await myllmStorage.setItem('shopping', s); return; } }catch(e){}
    try{ localStorage.setItem('shopping', s); }catch(e){}
  }

  function render(){
    var ul = document.getElementById('list');
    ul.innerHTML = '';
    if(!items.length){
      ul.innerHTML = '<li class="empty"><div class="tile"><svg class="i"><use href="#i-cart"/></svg></div><b>Nothing on the list yet</b><p>Add an item, ask the assistant, or send one from Quick Capture.</p></li>';
    }
    items.forEach(function(it, i){
      var li = document.createElement('li');
      if(it.done) li.className = 'done';
      li.innerHTML = '<button class="check" type="button" aria-label="'+(it.done?'Untick':'Tick')+'"><i><svg class="i"><use href="#i-check"/></svg></i></button><div class="label"></div><button class="del" type="button" aria-label="Delete"><svg class="i"><use href="#i-x"/></svg></button>';
      li.querySelector('.label').textContent = it.text;
      li.querySelector('.check').onclick = function(){ items[i].done = !items[i].done; haptic('selection'); save(); render(); };
      li.querySelector('.del').onclick = function(){ items.splice(i,1); haptic('light'); save(); render(); };
      ul.appendChild(li);
    });
    var n = items.length, ticked = items.filter(function(it){ return it.done; }).length;
    document.getElementById('count').textContent = n + (n===1?' item':' items') + (ticked ? ' · ' + ticked + ' ticked' : '');
    document.getElementById('left').textContent = n - ticked;
    document.getElementById('prog').style.width = (n ? ticked / n * 100 : 0) + '%';
    document.getElementById('clearDone').disabled = !ticked;
  }

  function addItem(text, opts){
    opts = opts || {};
    String(text).split('\n').forEach(function(line){
      var t = line.trim();
      if(t) items.unshift({ text: t, done: false });
    });
    haptic('success'); save(); render();
    if(opts.toast) toast(opts.toast);
  }

  document.getElementById('addForm').addEventListener('submit', function(e){
    e.preventDefault();
    var inp = document.getElementById('text');
    if(inp.value.trim()){ addItem(inp.value); inp.value = ''; }
    inp.focus();
  });
  document.getElementById('clearDone').addEventListener('click', function(){
    items = items.filter(function(it){ return !it.done; });
    haptic('light'); save(); render();
  });

  // #1/#2 — handle a hand-off (from Quick Capture) or an assistant action.
  if(window.myllmIntent && myllmIntent.receive){
    myllmIntent.receive(function(intent){
      if(intent && intent.action === 'add-item' && intent.data){
        var text = intent.data.text || intent.data.item || intent.data.value || '';
        if(text) addItem(text, { toast: 'Added ✓' });
      }
    });
  }

  load().then(function(saved){ items = saved || []; render(); });
})();

/* myllm-fullscreen-v2 — full screen where MyLLM can also close the app for us
   (myllmClose, 5.6.2+): full screen hides MyLLM's Done, and a page with no way
   out is worse than a repeated title, so elsewhere nothing changes.
   The spacer keeps the header clear of the status bar / Dynamic Island. It is
   live CSS — env(safe-area-inset-top) — not a measured number: the inset is
   still 0 when the page loads and only grows once MyLLM's bar has gone (v1
   measured once, so the title sat under the island). If the page's own styles
   already pad the header down by the inset, the spacer stays at 0. */
(function(){
  function full(){ return !!(window.myllmClose && window.myllmImmersive); }
  /* Does any rule that applies to the header or an ancestor already use the top inset? */
  function pageHandlesInset(head){
    var chain = [], n, found = false;
    for (n = head; n && n.nodeType === 1; n = n.parentElement) chain.push(n);
    function walk(rules){
      for (var i = 0; i < rules.length && !found; i++){
        var r = rules[i];
        if (r.cssRules && !r.selectorText) { walk(r.cssRules); continue; }
        if (!r.selectorText || !/safe-area-inset-top/.test(r.cssText) || !/(padding|margin|top)\s*:/.test(r.cssText)) continue;
        if (/\.imm-safe/.test(r.selectorText)) continue;
        for (var k = 0; k < chain.length; k++){
          try { if (chain[k].matches(r.selectorText)) { found = true; break; } } catch(e){}
        }
      }
    }
    for (var s = 0; s < document.styleSheets.length && !found; s++){
      try { walk(document.styleSheets[s].cssRules); } catch(e){}
    }
    for (n = head; n && n.nodeType === 1 && !found; n = n.parentElement){
      if (/safe-area-inset-top/.test(n.getAttribute("style") || "")) found = true;
    }
    return found;
  }
  function fit(){
    var sp = document.querySelector(".imm-safe"), head = document.querySelector(".head");
    if (!sp || !head) return;
    sp.style.height = (document.body.classList.contains("imm") && !pageHandlesInset(head)) ? "env(safe-area-inset-top)" : "0px";
  }
  function sync(){
    var f = full();
    document.body.classList.toggle("imm", f);
    fit();
    if (!f) return;
    try { window.myllmImmersive(true, { keepAwake:false }).catch(function(){}); } catch(e){}
  }
  window.myllmFSClose = function(){
    try { if (window.myllmHaptic) window.myllmHaptic("light"); } catch(e){}
    try { window.myllmClose().catch(function(){}); } catch(e){}
  };
  document.addEventListener("visibilitychange", function(){ if (!document.hidden) sync(); });
  sync();
})();
</script>
</body>
