<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Post Studio</title>
<style>
  :root { color-scheme: light dark; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{
    font-family:var(--myllm-font,-apple-system,system-ui,sans-serif);
    background:var(--myllm-bg,#f2f2f7);
    color:var(--myllm-text,#111);
    max-width:640px; margin:0 auto; min-height:100dvh;
    padding-bottom:calc(30px + env(safe-area-inset-bottom));
  }
  .hero{
    height:120px; background:#432 center/cover; position:relative;
    display:flex; align-items:flex-end; padding:14px 16px;
  }
  .hero::after{ content:""; position:absolute; inset:0; background:linear-gradient(180deg, transparent 30%, rgba(0,0,0,.45)); }
  .hero h1{ position:relative; z-index:1; color:#fff; font-size:24px; font-weight:800; letter-spacing:-0.02em; text-shadow:0 2px 10px rgba(0,0,0,.5); }
  .wrap{ padding:14px 16px; }

  .card{
    background:var(--myllm-surface,#fff); border:1px solid var(--myllm-border,#e3e3e8);
    border-radius:16px; padding:14px; margin-bottom:12px;
  }
  label{ display:block; font-size:11.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--myllm-muted,#8a8a8e); margin-bottom:7px; }
  textarea{
    width:100%; min-height:130px; font-size:16px; line-height:1.45; padding:12px; resize:vertical;
    border-radius:12px; border:1px solid var(--myllm-border,#e3e3e8);
    background:var(--myllm-bg,#f2f2f7); color:var(--myllm-text,#111);
    font-family:inherit;
  }
  .meta{ display:flex; justify-content:space-between; align-items:center; margin-top:7px; font-size:12.5px; color:var(--myllm-muted,#8a8a8e); }
  .meta b.over{ color:#ff3b30; }

  .chips{ display:flex; flex-wrap:wrap; gap:7px; }
  .chip{
    border:1px solid var(--myllm-border,#e3e3e8); background:var(--myllm-bg,#f2f2f7); color:var(--myllm-text,#111);
    border-radius:99px; padding:7px 13px; font-size:13.5px; font-weight:600;
  }
  .chip.on{ background:var(--myllm-accent,#0a84ff); border-color:var(--myllm-accent,#0a84ff); color:#fff; }

  .actions{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .actions button{
    border:1px solid var(--myllm-border,#e3e3e8); border-radius:12px; padding:12px 8px;
    font-size:14px; font-weight:700; background:var(--myllm-surface,#fff); color:var(--myllm-text,#111);
  }
  .actions button:disabled{ opacity:.45; }
  .actions button.primary{ grid-column:1 / -1; background:var(--myllm-accent,#0a84ff); border-color:var(--myllm-accent,#0a84ff); color:#fff; padding:14px; font-size:15.5px; }

  .out{ margin-top:10px; }
  .piece{
    background:var(--myllm-bg,#f2f2f7); border:1px solid var(--myllm-border,#e3e3e8);
    border-radius:12px; padding:11px 12px; margin-bottom:8px; font-size:15px; line-height:1.45; white-space:pre-wrap;
  }
  .piece small{ display:block; margin-top:6px; font-size:11.5px; color:var(--myllm-muted,#8a8a8e); }
  .piece .rowbtns{ display:flex; gap:8px; margin-top:8px; }
  .piece .rowbtns button{
    border:none; border-radius:9px; padding:7px 13px; font-size:12.5px; font-weight:700;
    background:var(--myllm-accent,#0a84ff); color:#fff;
  }
  .piece .rowbtns button.ghost{ background:var(--myllm-surface,#fff); color:var(--myllm-text,#111); border:1px solid var(--myllm-border,#e3e3e8); }

  .drafts .row{
    display:flex; align-items:center; gap:10px; padding:10px 2px;
    border-bottom:1px solid var(--myllm-border,#e3e3e8); font-size:14px;
  }
  .drafts .row:last-child{ border-bottom:none; }
  .drafts .row span{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .drafts .row button{ border:none; background:none; color:var(--myllm-accent,#0a84ff); font-weight:700; font-size:13px; }
  .drafts .row button.del{ color:#ff3b30; }
  .empty{ font-size:13.5px; color:var(--myllm-muted,#8a8a8e); }
  .aihint{ font-size:12.5px; color:var(--myllm-muted,#8a8a8e); margin-top:8px; line-height:1.45; }
</style>
<style>:root{--build-id:"c4e856fbcc";}</style>
</head>
<body>

<div class="hero" id="hero"><h1>✍️ Post Studio</h1></div>
<div class="wrap">

  <div class="card">
    <label>Your post</label>
    <textarea id="draft" placeholder="Type the rough version — or paste something you want to improve…" oninput="onEdit()"></textarea>
    <div class="meta">
      <b id="count">0</b>
      <span id="limitlbl"></span>
    </div>
  </div>

  <div class="card">
    <label>Platform format</label>
    <div class="chips" id="platforms"></div>
    <div style="height:10px"></div>
    <label>Voice</label>
    <div class="chips" id="voices"></div>
  </div>

  <div class="card">
    <div class="actions">
      <button id="polishBtn" onclick="aiPolish()">✨ Polish</button>
      <button id="hashBtn" onclick="aiHashtags()">＃ Hashtags</button>
      <button id="threadBtn" onclick="splitThread()">🧵 Split into thread</button>
      <button onclick="saveDraft()">💾 Save draft</button>
      <button class="primary" onclick="shareNow()">Share…</button>
    </div>
    <p class="aihint" id="aihint"></p>
    <div class="out" id="out"></div>
  </div>

  <div class="card drafts">
    <label>Drafts</label>
    <div id="draftlist"><p class="empty">Saved drafts appear here.</p></div>
  </div>
</div>

<!-- AI thinking pill (house convention) -->
<style>
@keyframes myllmAiSpin{to{transform:rotate(360deg)}}
.myllm-ai-busy{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(18px);z-index:99999;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;display:flex;align-items:center;gap:10px;background:rgba(28,28,30,.96);color:#fff;border-radius:999px;padding:10px 16px 10px 14px;box-shadow:0 6px 22px rgba(0,0,0,.4);font-size:14px;font-weight:600;max-width:92%}
.myllm-ai-busy.on{opacity:1;transform:translateX(-50%) translateY(0)}
.myllm-ai-cog{font-size:18px;animation:myllmAiSpin 2.4s linear infinite;filter:drop-shadow(0 0 5px rgba(124,92,255,.85))}
.myllm-ai-busy small{font-weight:400;opacity:.6}
</style>

return Promise.resolve(p).then(function(r){hide();return r;},function(e){hide();throw e;});};})();
</script>

if (HERO.indexOf("data:") === 0) el("hero").style.backgroundImage = "url(" + HERO + ")";

var PLATFORMS = [
  {id:"x",    name:"X / Threads",  limit:280},
  {id:"bsky", name:"Bluesky",      limit:300},
  {id:"masto",name:"Mastodon",     limit:500},
  {id:"ig",   name:"Instagram",    limit:2200},
  {id:"li",   name:"LinkedIn",     limit:3000}
];
var VOICES = [
  {id:"plain",  name:"Plain",        hint:"clear, unpretentious, no hype"},
  {id:"friendly", name:"Friendly",   hint:"warm and conversational"},
  {id:"pro",    name:"Professional", hint:"polished and credible, no jargon"},
  {id:"witty",  name:"Witty",        hint:"light humour, never cringe"},
  {id:"bold",   name:"Bold",         hint:"punchy, confident, short sentences"}
];
var platform = PLATFORMS[0];
var voice = VOICES[0];
var drafts = [];

function renderChips(){
  el("platforms").innerHTML = PLATFORMS.map(function(p){
    return '<button class="chip' + (platform.id === p.id ? ' on' : '') + '" onclick="setPlatform(\'' + p.id + '\')">' + p.name + '</button>';
  }).join("");
  el("voices").innerHTML = VOICES.map(function(v){
    return '<button class="chip' + (voice.id === v.id ? ' on' : '') + '" onclick="setVoice(\'' + v.id + '\')">' + v.name + '</button>';
  }).join("");
  el("limitlbl").textContent = platform.name + " · " + platform.limit + " chars";
  onEdit();
}
function setPlatform(id){ platform = PLATFORMS.filter(function(p){return p.id===id;})[0]; haptic("selection"); renderChips(); }
function setVoice(id){ voice = VOICES.filter(function(v){return v.id===id;})[0]; haptic("selection"); renderChips(); }

function onEdit(){
  var n = el("draft").value.length;
  var c = el("count");
  c.textContent = n + (n > platform.limit ? " — over by " + (n - platform.limit) : "");
  c.className = n > platform.limit ? "over" : "";
}

/* ---------- AI actions (all graceful without AI) ---------- */
function needText(){
  var t = el("draft").value.trim();
  if (!t){ el("aihint").textContent = "Write something first — even a rough note is enough."; haptic("light"); }
  return t;
}
function aiUnavailable(){
  el("aihint").textContent = "AI is off — polish and hashtags need it (enable AI in Settings). The thread splitter and sharing work without it.";
  haptic("light");
}
function aiPolish(){
  var t = needText(); if (!t) return;
  if (!ASK) return aiUnavailable();
  haptic("light");
  ASK("Rewrite this social media post. Voice: " + voice.hint + ". Hard limit: " + platform.limit + " characters — stay well under it. Keep the author's meaning and any @mentions/links exactly. No hashtags unless the original had them. Reply with ONLY the rewritten post, no quotes, no commentary.\n\nPost:\n" + t,
    {system:"You are a sharp social media editor. Output only the rewritten post text."})
  .then(function(r){
    var clean = String(r).trim().replace(/^["']|["']$/g, "");
    showResult([{text:clean, label:"Polished · " + voice.name}], true);
    haptic("success");
  }).catch(function(){ el("aihint").textContent = "The AI couldn't run just now — try again."; });
}
function aiHashtags(){
  var t = needText(); if (!t) return;
  if (!ASK) return aiUnavailable();
  haptic("light");
  ASK("Suggest 6 hashtags for this post. Mix broad and niche. Reply with ONLY the hashtags on one line, space-separated, each starting with #.\n\nPost:\n" + t,
    {system:"You output only hashtags, one line, space-separated."})
  .then(function(r){
    var tags = String(r).match(/#[A-Za-z0-9_]+/g) || [];
    if (!tags.length){ el("aihint").textContent = "No usable hashtags came back — try again."; return; }
    showResult([{text:tags.join(" "), label:"Hashtags — tap Append to add them"}], false, true);
    haptic("success");
  }).catch(function(){ el("aihint").textContent = "The AI couldn't run just now — try again."; });
}

/* deterministic thread splitter — no AI needed */
function splitThread(){
  var t = needText(); if (!t) return;
  var limit = platform.limit - 8;   /* room for " (12/99)" */
  var sentences = t.match(/[^.!?\n]+[.!?]*\s*/g) || [t];
  var parts = [], curp = "";
  sentences.forEach(function(s){
    if ((curp + s).length > limit && curp){ parts.push(curp.trim()); curp = s; }
    else curp += s;
    while (curp.length > limit){        /* one giant sentence: hard wrap at a space */
      var cut = curp.lastIndexOf(" ", limit);
      if (cut < limit * 0.5) cut = limit;
      parts.push(curp.slice(0, cut).trim());
      curp = curp.slice(cut).trim();
    }
  });
  if (curp.trim()) parts.push(curp.trim());
  if (parts.length === 1){
    el("aihint").textContent = "That already fits in one " + platform.name + " post.";
    haptic("light");
    return;
  }
  showResult(parts.map(function(p, i){
    return {text:p + " (" + (i+1) + "/" + parts.length + ")", label:"Part " + (i+1) + " of " + parts.length};
  }), false);
  haptic("success");
}

/* ---------- results ---------- */
function showResult(pieces, offerUse, offerAppend){
  el("aihint").textContent = "";
  el("out").innerHTML = pieces.map(function(p, i){
    var btns = '<button onclick="sharePiece(' + i + ')">Share</button>';
    if (offerUse) btns = '<button onclick="usePiece(' + i + ')">Use it</button>' + btns.replace("<button", '<button class="ghost"');
    if (offerAppend) btns = '<button onclick="appendPiece(' + i + ')">Append</button>';
    return '<div class="piece" data-i="' + i + '">' + esc(p.text) +
      '<small>' + esc(p.label || "") + ' · ' + p.text.length + ' chars</small>' +
      '<div class="rowbtns">' + btns + '</div></div>';
  }).join("");
  window.__pieces = pieces;
}
function usePiece(i){ el("draft").value = window.__pieces[i].text; onEdit(); el("out").innerHTML = ""; haptic("selection"); }
function appendPiece(i){
  el("draft").value = (el("draft").value.trim() + "\n\n" + window.__pieces[i].text).trim();
  onEdit(); el("out").innerHTML = ""; haptic("selection");
}
function sharePiece(i){
  if (window.myllmShare){ try{ myllmShare({text:window.__pieces[i].text}); }catch(_){} }
  haptic("light");
}
function shareNow(){
  var t = needText(); if (!t) return;
  if (window.myllmShare){ try{ myllmShare({text:t}); }catch(_){} }
  haptic("light");
}

/* ---------- drafts ---------- */
function saveDraft(){
  var t = needText(); if (!t) return;
  drafts.unshift({t:t, at:Date.now()});
  if (drafts.length > 30) drafts.pop();
  store.setItem("posts", JSON.stringify(drafts));
  renderDrafts();
  haptic("success");
}
function renderDrafts(){
  if (!drafts.length){ el("draftlist").innerHTML = '<p class="empty">Saved drafts appear here.</p>'; return; }
  el("draftlist").innerHTML = drafts.map(function(d, i){
    return '<div class="row"><span>' + esc(d.t.slice(0, 80)) + '</span>' +
      '<button onclick="loadDraft(' + i + ')">Open</button>' +
      '<button class="del" onclick="delDraft(' + i + ')">✕</button></div>';
  }).join("");
}
function loadDraft(i){ el("draft").value = drafts[i].t; onEdit(); haptic("selection"); window.scrollTo(0,0); }
function delDraft(i){ drafts.splice(i,1); store.setItem("posts", JSON.stringify(drafts)); renderDrafts(); haptic("light"); }

/* ---------- boot ---------- */
store.getItem("posts").then(function(v){
  if (v){ try{ drafts = JSON.parse(v) || []; }catch(e){} }
  renderChips();
  renderDrafts();
  if (!ASK) el("aihint").textContent = "Tip: enable AI in Settings to unlock Polish and Hashtags. Everything else works now.";
});
</script>
