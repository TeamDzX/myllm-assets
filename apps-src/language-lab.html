<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>:root{color-scheme:light dark}
body{font-family:-apple-system,system-ui,sans-serif;margin:0;padding:20px;background:#f2f2f7;color:#111}
@media(prefers-color-scheme:dark){body{background:#000;color:#eee}.card,.deck{background:#1c1c1e}input{background:#2c2c2e;color:#eee;border-color:#3a3a3c}}
h1{font-size:22px;margin:0 0 14px}
h2{font-size:15px;margin:22px 0 8px;opacity:.7}
.row{display:flex;gap:8px;margin-bottom:8px}
input{flex:1;padding:12px;border:1px solid #d1d1d6;border-radius:10px;font-size:16px;background:#fff;min-width:0}
button{border:0;background:#32ade6;color:#fff;border-radius:10px;padding:0 16px;font-size:15px;font-weight:600}
button:disabled{opacity:.5}
#status{font-size:13px;opacity:.65;min-height:18px;margin:2px 0 6px}
.card{background:#fff;border-radius:12px;padding:13px 14px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.card .t{font-size:17px;font-weight:600}
.card .hidden-part{display:none;margin-top:6px;font-size:14px;line-height:1.5}
.card.open .hidden-part{display:block}
.card .p{opacity:.6;font-style:italic}
.card .hint{font-size:11px;opacity:.35;margin-top:4px}
.card.open .hint{display:none}
#feedback{display:none;font-size:14px;line-height:1.55;white-space:pre-wrap}
.deck{background:#fff;border-radius:12px;padding:11px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.deck span{flex:1;font-size:15px}
.deck .n{opacity:.5;font-size:13px}
.deck .del{background:none;color:#ff453a;font-size:16px;padding:4px}
</style></head><body>
<style>
@keyframes myllmAiSpin{to{transform:rotate(360deg)}}
.myllm-ai-busy{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(18px);z-index:99999;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;display:flex;align-items:center;gap:10px;background:rgba(28,28,30,.96);color:#fff;border-radius:999px;padding:10px 16px 10px 14px;box-shadow:0 6px 22px rgba(0,0,0,.4);font-family:-apple-system,system-ui,sans-serif;font-size:14px;font-weight:600;max-width:92%}
.myllm-ai-busy.on{opacity:1;transform:translateX(-50%) translateY(0)}
.myllm-ai-cog{font-size:18px;line-height:1;animation:myllmAiSpin 2.4s linear infinite;filter:drop-shadow(0 0 5px rgba(124,92,255,.85))}
.myllm-ai-busy small{font-weight:400;opacity:.6}
</style>
<script>
(function(){
  if(window.__myllmAiWrap||typeof window.myllmAsk!=='function')return;
  window.__myllmAiWrap=true;
  var orig=window.myllmAsk,depth=0,node=null;
  function ensure(){if(node)return;node=document.createElement('div');node.className='myllm-ai-busy';
    node.innerHTML='<span class="myllm-ai-cog">\u2699\uFE0F</span><span>AI is thinking\u2026 <small>privately, on your device</small></span>';
    (document.body||document.documentElement).appendChild(node);}
  function show(){ensure();depth++;node.classList.add('on');}
  function hide(){depth=Math.max(0,depth-1);if(depth===0&&node)node.classList.remove('on');}
  window.myllmAsk=function(){show();var p;try{p=orig.apply(this,arguments);}catch(e){hide();throw e;}
    return Promise.resolve(p).then(function(r){hide();return r;},function(e){hide();throw e;});};
})();
</script>

<h1>🌍 Language Lab</h1>
<div class="row"><input id="lang" placeholder="Language (e.g. Spanish, Japanese)…"></div>
<div class="row"><input id="topic" placeholder="Topic (e.g. ordering food)…"><button id="gen" onclick="gen()">Teach me</button></div>
<div id="status"></div>
<div id="phrases"></div>
<div id="coachWrap" style="display:none">
<h2>Coach — try writing a sentence</h2>
<div class="row"><input id="attempt" placeholder="Your sentence…"><button id="chk" onclick="coach()">Check</button></div>
<div class="card" id="feedback"></div>
</div>
<h2 id="lessonsHead" style="display:none">Saved lessons</h2>
<div id="lessons"></div>
<script>
var store=window.myllmStorage||{getItem:function(){return Promise.resolve(null)},setItem:function(){return Promise.resolve()}};
var lessons=[],cur=-1;
function el(i){return document.getElementById(i)}
function setStatus(t){el('status').textContent=t}
function save(){store.setItem('lessons',JSON.stringify(lessons))}
function needAI(){
if(window.myllmAsk)return false;
setStatus('This app needs AI access — update MyLLM and enable “Allow apps to use the AI” in Settings.');
return true;
}
function gen(){
var lang=el('lang').value.trim(),topic=el('topic').value.trim();
if(!lang||!topic){setStatus('Enter a language and a topic.');return}
if(needAI())return;
el('gen').disabled=true;setStatus('Writing a '+lang+' lesson on “'+topic+'”…');
myllmAsk('Create 8 useful '+lang+' phrases about: '+topic+', for an English-speaking beginner. Reply with ONLY a JSON array like [{"t":"phrase in '+lang+'","p":"simple English pronunciation","n":"English meaning"}] and nothing else.')
.then(function(reply){
var s=reply.indexOf('['),e=reply.lastIndexOf(']');
if(s<0||e<=s)throw new Error('the model did not return a lesson');
var phrases=JSON.parse(reply.slice(s,e+1)).filter(function(x){return x&&x.t&&x.n});
if(!phrases.length)throw new Error('the lesson came back empty');
lessons.unshift({lang:lang,topic:topic,phrases:phrases});save();
el('topic').value='';setStatus('');openLesson(0);renderLessons();
}).catch(function(err){setStatus('Could not generate: '+err.message)})
.then(function(){el('gen').disabled=false});
}
function openLesson(i){
cur=i;var L=el('phrases');L.innerHTML='';
var les=lessons[i];if(!les){el('coachWrap').style.display='none';return}
el('lang').value=les.lang;
les.phrases.forEach(function(ph){
var d=document.createElement('div');d.className='card';
var t=document.createElement('div');t.className='t';t.textContent=ph.t;
var h=document.createElement('div');h.className='hidden-part';
h.textContent=(ph.p?'['+ph.p+']  ':'')+ph.n;
var hint=document.createElement('div');hint.className='hint';hint.textContent='tap to reveal';
d.appendChild(t);d.appendChild(h);d.appendChild(hint);
d.onclick=function(){d.classList.toggle('open');if(window.myllmHaptic)myllmHaptic('light')};
L.appendChild(d)});
el('coachWrap').style.display='block';
el('feedback').style.display='none';
}
function coach(){
var lang=el('lang').value.trim(),attempt=el('attempt').value.trim();
if(!lang||!attempt){setStatus('Write a sentence first.');return}
if(needAI())return;
el('chk').disabled=true;setStatus('Coach is reading…');
myllmAsk('I am an English speaker learning '+lang+'. Check my '+lang+' sentence. In under 60 words: if it has mistakes, give the corrected sentence and briefly say why; if it is right, say so and give one short tip. My sentence: '+attempt)
.then(function(reply){
var f=el('feedback');f.textContent=reply;f.style.display='block';setStatus('');
if(window.myllmHaptic)myllmHaptic('success');
}).catch(function(err){setStatus('Coach unavailable: '+err.message)})
.then(function(){el('chk').disabled=false});
}
function renderLessons(){
var D=el('lessons');D.innerHTML='';
el('lessonsHead').style.display=lessons.length?'block':'none';
lessons.forEach(function(les,i){
var r=document.createElement('div');r.className='deck';
var s=document.createElement('span');s.textContent=les.lang+' · '+les.topic;s.onclick=function(){openLesson(i)};
var n=document.createElement('span');n.className='n';n.textContent=les.phrases.length+' phrases';
var x=document.createElement('button');x.className='del';x.textContent='✕';
x.onclick=function(){lessons.splice(i,1);if(cur===i)cur=-1;else if(cur>i)cur--;save();renderLessons();openLesson(cur)};
r.appendChild(s);r.appendChild(n);r.appendChild(x);D.appendChild(r)})}
el('topic').addEventListener('keydown',function(e){if(e.key==='Enter')gen()});
el('attempt').addEventListener('keydown',function(e){if(e.key==='Enter')coach()});
store.getItem('lessons').then(function(v){
if(v)try{lessons=JSON.parse(v)}catch(e){}
renderLessons();if(lessons.length)openLesson(0);
if(!window.myllmAsk)setStatus('Heads-up: this app needs the latest MyLLM with apps-AI enabled.');
});
</script></body></html>
