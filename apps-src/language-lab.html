<title>Language Lab</title>
<style>
:root{--build-id:"c4dd53474e";
  color-scheme:light dark;
  --font:var(--myllm-font,-apple-system,system-ui,"Segoe UI",Roboto,sans-serif);
  --page1:#eef1f8; --page2:#f6f4ff;
  --surface:#ffffff; --surface2:#f3f4fa;
  --ink:#191c28; --muted:#697083; --faint:#a2a8b8;
  --border:#e7e9f1;
  --acc:#6d5efc; --acc2:#a855f7; --accSoft:rgba(109,94,252,.12);
  --radius:16px; --radiusLg:22px;
  --shadow:0 1px 2px rgba(20,20,50,.05),0 8px 22px -14px rgba(40,25,90,.28);
  --shadowLg:0 14px 42px -14px rgba(80,50,160,.45);
}
@media(prefers-color-scheme:dark){:root{
  --page1:#0b0d13; --page2:#12111c;
  --surface:#181b24; --surface2:#20232f;
  --ink:#f1f2f7; --muted:#9aa0af; --faint:#666d7d;
  --border:#282c39; --accSoft:rgba(139,92,246,.20);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);
  --shadowLg:0 16px 46px -14px rgba(0,0,0,.85);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:var(--font);margin:0;padding:18px 16px calc(34px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,var(--page1),var(--page2));background-attachment:fixed;
  min-height:100dvh;color:var(--ink);line-height:1.4}
@media(min-width:768px){body{max-width:720px;margin:0 auto}}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:var(--radiusLg);padding:20px;margin-bottom:16px;
  background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;box-shadow:var(--shadowLg);
  display:flex;align-items:center;gap:14px}
.hero::after{content:"";position:absolute;right:-46px;top:-46px;width:170px;height:170px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.28),transparent 70%);pointer-events:none}
.hero-badge{width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.22);
  display:grid;place-items:center;font-size:28px;flex:0 0 auto}
.hero h1{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:0}
.hero p{margin:3px 0 0;font-size:13px;opacity:.92;font-weight:500}

/* cards / surfaces */
.surface{background:var(--surface);border:1px solid var(--border);border-radius:var(--radiusLg);
  padding:16px;box-shadow:var(--shadow);margin-bottom:16px}

/* fields + buttons */
.field{display:flex;align-items:center;gap:10px;background:var(--surface2);border:1px solid var(--border);
  border-radius:13px;padding:0 13px;margin-bottom:10px}
.field-ic{font-size:16px;opacity:.7;flex:0 0 auto}
.field input{flex:1;border:0;background:none;padding:13px 0;font-size:16px;color:var(--ink);
  outline:none;min-width:0;font-family:var(--font)}
.field input::placeholder{color:var(--faint)}
.btn-primary{width:100%;border:0;border-radius:14px;padding:14px;font-size:15px;font-weight:700;color:#fff;
  font-family:var(--font);background:linear-gradient(135deg,var(--acc),var(--acc2));
  box-shadow:0 8px 20px -8px var(--acc);cursor:pointer;transition:transform .1s,opacity .2s}
.btn-primary:active{transform:scale(.98)}
.btn-primary:disabled{opacity:.5;box-shadow:none}
.btn-soft{width:100%;border:0;border-radius:13px;padding:12px;font-size:14.5px;font-weight:700;
  color:var(--acc);background:var(--accSoft);font-family:var(--font);cursor:pointer;transition:transform .1s,opacity .2s}
.btn-soft:active{transform:scale(.98)}
.btn-soft:disabled{opacity:.5}

/* language chips */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:2px 0 12px}
.chip{border:1px solid var(--border);background:var(--surface);color:var(--muted);border-radius:999px;
  padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font);transition:.15s}
.chip.on{color:var(--acc);border-color:var(--acc);background:var(--accSoft)}

.status{font-size:13px;color:var(--muted);min-height:18px;margin-top:9px;text-align:center}

/* lesson header */
.lesson-head{display:flex;align-items:center;gap:12px;margin:4px 2px 13px}
.lesson-flag{width:44px;height:44px;border-radius:13px;background:var(--surface);border:1px solid var(--border);
  display:grid;place-items:center;font-size:24px;box-shadow:var(--shadow);flex:0 0 auto}
.lesson-title{font-size:18px;font-weight:750;letter-spacing:-.01em}
.lesson-sub{font-size:13px;color:var(--muted);margin-top:1px}

/* phrase cards */
.pcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px 15px;margin-bottom:9px;box-shadow:var(--shadow);cursor:pointer;
  transition:border-color .2s,transform .1s}
.pcard:active{transform:scale(.995)}
.pcard.open{border-color:var(--acc)}
.pcard-top{display:flex;align-items:center;gap:11px}
.pnum{flex:0 0 auto;width:24px;height:24px;border-radius:8px;background:var(--accSoft);color:var(--acc);
  font-size:12px;font-weight:800;display:grid;place-items:center}
.pphrase{flex:1;font-size:17px;font-weight:650;line-height:1.3;min-width:0}
.pspeak{flex:0 0 auto;border:0;background:var(--surface2);border-radius:9px;padding:6px 9px;
  font-size:15px;cursor:pointer;line-height:1}
.pspeak:active{background:var(--accSoft)}
.pchev{flex:0 0 auto;color:var(--faint);font-size:16px;transition:transform .25s,color .2s}
.pcard.open .pchev{transform:rotate(180deg);color:var(--acc)}
.preveal{max-height:0;overflow:hidden;opacity:0;transition:max-height .3s ease,opacity .25s ease,margin .3s}
.pcard.open .preveal{max-height:240px;opacity:1;margin-top:11px}
.ppron{font-size:14px;font-style:italic;color:var(--muted)}
.pmean{font-size:15px;margin-top:3px;line-height:1.5}
.tap-hint{font-size:11.5px;color:var(--faint);text-align:center;margin:2px 0 12px}

/* coach */
.coach-head{display:flex;align-items:center;gap:11px;margin-bottom:13px}
.coach-head>span{font-size:22px;flex:0 0 auto}
.coach-title{font-size:16px;font-weight:700}
.coach-sub{font-size:12.5px;color:var(--muted);margin-top:1px}
.feedback{display:none;margin-top:12px;background:var(--accSoft);border-radius:12px;padding:12px 13px}
.fb-label{font-size:11.5px;font-weight:800;color:var(--acc);margin-bottom:5px;letter-spacing:.04em;text-transform:uppercase}
.fb-body{font-size:14.5px;line-height:1.55;white-space:pre-wrap}

/* saved lessons */
.section{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:8px 2px 10px}
.deck{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);
  border-radius:14px;padding:11px 13px;margin-bottom:8px;box-shadow:var(--shadow);cursor:pointer;transition:border-color .2s}
.deck.on{border-color:var(--acc)}
.deck-flag{font-size:22px;flex:0 0 auto}
.deck-mid{flex:1;min-width:0}
.deck-t{font-size:15px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.deck-s{font-size:12.5px;color:var(--muted);margin-top:1px}
.del{border:0;background:none;color:var(--faint);font-size:15px;padding:6px;cursor:pointer;flex:0 0 auto}
.del:active{color:#ff453a}

/* empty state */
.empty{display:none;text-align:center;padding:30px 20px 10px;color:var(--muted)}
.empty-emoji{font-size:44px;line-height:1}
.empty h3{margin:12px 0 5px;font-size:17px;color:var(--ink);font-weight:700}
.empty p{margin:0 auto;font-size:13.5px;line-height:1.5;max-width:270px}

@media(prefers-reduced-motion:no-preference){
  .pcard{animation:rise .4s ease backwards;animation-delay:var(--d,0ms)}
  @keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
  .hero{animation:rise .45s ease backwards}
}
</style></head><body>
<style>
@keyframes myllmAiSpin{to{transform:rotate(360deg)}}
.myllm-ai-busy{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(18px);z-index:99999;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;display:flex;align-items:center;gap:10px;background:rgba(28,28,30,.96);color:#fff;border-radius:999px;padding:10px 16px 10px 14px;box-shadow:0 6px 22px rgba(0,0,0,.4);font-family:-apple-system,system-ui,sans-serif;font-size:14px;font-weight:600;max-width:92%}
.myllm-ai-busy.on{opacity:1;transform:translateX(-50%) translateY(0)}
.myllm-ai-cog{font-size:18px;line-height:1;animation:myllmAiSpin 2.4s linear infinite;filter:drop-shadow(0 0 5px rgba(124,92,255,.85))}
.myllm-ai-busy small{font-weight:400;opacity:.6}
</style>
<script>
(function(){
  if(window.__myllmAiWrap||typeof window.myllmAsk!=='function')return;
  window.__myllmAiWrap=true;
  var orig=window.myllmAsk,depth=0,node=null;
  function ensure(){if(node)return;node=document.createElement('div');node.className='myllm-ai-busy';
    node.innerHTML='<span class="myllm-ai-cog">⚙️</span><span>AI is thinking… <small>privately, on your device</small></span>';
    (document.body||document.documentElement).appendChild(node);}
  function show(){ensure();depth++;node.classList.add('on');}
  function hide(){depth=Math.max(0,depth-1);if(depth===0&&node)node.classList.remove('on');}
  window.myllmAsk=function(){show();var p;try{p=orig.apply(this,arguments);}catch(e){hide();throw e;}
    return Promise.resolve(p).then(function(r){hide();return r;},function(e){hide();throw e;});};
})();
</script>

<div class="hero">
  <div class="hero-badge">🌍</div>
  <div><h1>Language Lab</h1><p>Learn any language — one bite-size lesson at a time.</p></div>
</div>

<div class="surface">
  <label class="field"><span class="field-ic">🗣️</span><input id="lang" placeholder="Language — e.g. Spanish, Japanese"></label>
  <div class="chips" id="langChips"></div>
  <label class="field"><span class="field-ic">💡</span><input id="topic" placeholder="Topic — e.g. ordering food"></label>
  <button class="btn-primary" id="gen" onclick="gen()">Teach me ✨</button>
  <div id="status" class="status"></div>
</div>

<div class="empty" id="empty">
  <div class="empty-emoji">📚</div>
  <h3>Your lessons live here</h3>
  <p>Pick a language and a topic above, and your AI tutor writes a lesson in seconds.</p>
</div>

<div id="lessonView" style="display:none">
  <div class="lesson-head">
    <div class="lesson-flag" id="lessonFlag">🌐</div>
    <div><div class="lesson-title" id="lessonTitle"></div><div class="lesson-sub" id="lessonSub"></div></div>
  </div>
  <div id="phrases"></div>
  <div class="tap-hint" id="tapHint">Tap a card to reveal the meaning</div>
  <div class="surface" id="coachWrap">
    <div class="coach-head"><span>✍️</span><div><div class="coach-title">Practice</div><div class="coach-sub">Write a sentence — get instant, friendly feedback</div></div></div>
    <label class="field"><span class="field-ic">📝</span><input id="attempt" placeholder="Your sentence…"></label>
    <button class="btn-soft" id="chk" onclick="coach()">Check my sentence</button>
    <div class="feedback" id="feedback"></div>
  </div>
</div>

<div id="savedWrap" style="display:none">
  <div class="section">Saved lessons</div>
  <div id="lessons"></div>
</div>

<script>
"use strict";
var store=window.myllmStorage||{getItem:function(){return Promise.resolve(null)},setItem:function(){return Promise.resolve()}};
var lessons=[],cur=-1;
var TTS=!!(window.speechSynthesis&&window.SpeechSynthesisUtterance);
function el(i){return document.getElementById(i)}
function setStatus(t){el('status').textContent=t}
function save(){store.setItem('lessons',JSON.stringify(lessons))}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function haptic(k){if(window.myllmHaptic)try{myllmHaptic(k)}catch(e){}}

var FLAGS={spanish:'🇪🇸',french:'🇫🇷',japanese:'🇯🇵',german:'🇩🇪',italian:'🇮🇹',portuguese:'🇵🇹',mandarin:'🇨🇳',chinese:'🇨🇳',korean:'🇰🇷',russian:'🇷🇺',arabic:'🇸🇦',hindi:'🇮🇳',dutch:'🇳🇱',greek:'🇬🇷',turkish:'🇹🇷',polish:'🇵🇱',swedish:'🇸🇪',english:'🇬🇧',thai:'🇹🇭',vietnamese:'🇻🇳',hebrew:'🇮🇱',indonesian:'🇮🇩'};
var CODES={spanish:'es-ES',french:'fr-FR',japanese:'ja-JP',german:'de-DE',italian:'it-IT',portuguese:'pt-PT',mandarin:'zh-CN',chinese:'zh-CN',korean:'ko-KR',russian:'ru-RU',arabic:'ar-SA',hindi:'hi-IN',dutch:'nl-NL',greek:'el-GR',turkish:'tr-TR',polish:'pl-PL',swedish:'sv-SE',english:'en-GB',thai:'th-TH',vietnamese:'vi-VN',hebrew:'he-IL',indonesian:'id-ID'};
function flagFor(l){return FLAGS[String(l||'').trim().toLowerCase()]||'🌐'}
function codeFor(l){return CODES[String(l||'').trim().toLowerCase()]||''}
function speak(text,lang){
  if(!TTS)return;
  try{window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text);var c=codeFor(lang);if(c)u.lang=c;u.rate=.9;
    window.speechSynthesis.speak(u);haptic('light');
  }catch(e){}
}

var POPULAR=['Spanish','French','Japanese','German','Italian','Korean'];
function buildChips(){
  var c=el('langChips');c.innerHTML='';
  POPULAR.forEach(function(name){
    var b=document.createElement('button');b.type='button';b.className='chip';b.textContent=flagFor(name)+' '+name;
    b.onclick=function(){
      el('lang').value=name;
      document.querySelectorAll('.chip').forEach(function(x){x.classList.remove('on')});
      b.classList.add('on');el('topic').focus();haptic('selection');
    };
    c.appendChild(b);
  });
}

function needAI(){
  if(window.myllmAsk)return false;
  setStatus('This app needs AI access — update MyLLM and enable “Allow apps to use the AI” in Settings.');
  return true;
}

/* Labelled lines, not JSON — small models (Apple Intelligence) echo JSON
   templates back verbatim. Echoed instructions are rejected and retried. */
var ECHO=/the phrase in\b|english pronunciation|english meaning|repeat this line|labelled line/i;
function parseLesson(reply){
  reply=String(reply||'');
  var phrases=[],got=false;
  reply.split(/\r?\n/).forEach(function(raw){
    var ln=raw.replace(/\*\*/g,'').trim();
    var m=ln.match(/^[-*#>\s]*(PHRASES?)\s*\d*\s*[::]\s*(.*)$/i);
    if(!m)return;
    got=true;var v=m[2].trim();
    if(!v||ECHO.test(v))return;
    var parts=v.split('|').map(function(x){return x.trim()});
    if(parts.length>=3)phrases.push({t:parts[0],p:parts[1],n:parts.slice(2).join(' | ')});
    else if(parts.length===2)phrases.push({t:parts[0],p:'',n:parts[1]});
  });
  if(!got){ // some models still answer in the old JSON shape — accept it
    var s=reply.indexOf('['),e=reply.lastIndexOf(']');
    if(s>=0&&e>s)try{
      var j=JSON.parse(reply.slice(s,e+1));
      if(Array.isArray(j))phrases=j.filter(function(x){return x&&x.t&&x.n})
        .map(function(x){return{t:String(x.t),p:x.p?String(x.p):'',n:String(x.n)}});
    }catch(e2){}
  }
  phrases=phrases.filter(function(x){return x.t&&x.n&&!ECHO.test(x.t)&&!ECHO.test(x.n)});
  if(phrases.length<2)throw new Error('the model did not return a lesson');
  return phrases;
}
function gen(){
  var lang=el('lang').value.trim(),topic=el('topic').value.trim();
  if(!lang||!topic){setStatus('Enter a language and a topic.');return}
  if(needAI())return;
  el('gen').disabled=true;setStatus('Writing a '+lang+' lesson on “'+topic+'”…');
  var p='Create 8 useful '+lang+' phrases about: '+topic+', for an English-speaking beginner. Reply with EXACTLY these labelled lines and nothing else:\n'+
    'PHRASE: the phrase in '+lang+' | its simple English pronunciation | its English meaning — repeat this line for each of the 8 phrases';
  myllmAsk(p).then(function(r){return parseLesson(r)})
  .catch(function(){return myllmAsk(p+'\nIMPORTANT: fill each labelled line with real content — never repeat the instruction text.')
    .then(function(r){return parseLesson(r)})})
  .then(function(phrases){
    lessons.unshift({lang:lang,topic:topic,phrases:phrases});save();
    el('topic').value='';setStatus('');cur=-1;openLesson(0);renderLessons();haptic('success');
  }).catch(function(err){setStatus('Could not generate: '+err.message)})
  .then(function(){el('gen').disabled=false});
}

function openLesson(i){
  var les=lessons[i];if(!les){el('lessonView').style.display='none';return}
  cur=i;
  el('lang').value=les.lang;
  el('lessonFlag').textContent=flagFor(les.lang);
  el('lessonTitle').textContent=les.topic;
  el('lessonSub').textContent=les.lang+' · '+les.phrases.length+' phrases';
  var L=el('phrases');L.innerHTML='';
  les.phrases.forEach(function(ph,idx){
    var d=document.createElement('div');d.className='pcard';d.style.setProperty('--d',(Math.min(idx,12)*45)+'ms');
    var top=document.createElement('div');top.className='pcard-top';
    var num=document.createElement('span');num.className='pnum';num.textContent=idx+1;
    var p=document.createElement('div');p.className='pphrase';p.textContent=ph.t;
    top.appendChild(num);top.appendChild(p);
    if(TTS){
      var sp=document.createElement('button');sp.className='pspeak';sp.type='button';sp.textContent='🔊';sp.setAttribute('aria-label','Hear it');
      sp.onclick=function(ev){ev.stopPropagation();speak(ph.t,les.lang)};
      top.appendChild(sp);
    }
    var chev=document.createElement('span');chev.className='pchev';chev.textContent='⌄';top.appendChild(chev);
    var rev=document.createElement('div');rev.className='preveal';
    rev.innerHTML=(ph.p?'<div class="ppron">['+esc(ph.p)+']</div>':'')+'<div class="pmean">'+esc(ph.n)+'</div>';
    d.appendChild(top);d.appendChild(rev);
    d.onclick=function(){d.classList.toggle('open');haptic('light')};
    L.appendChild(d);
  });
  el('lessonView').style.display='block';
  el('feedback').style.display='none';el('feedback').innerHTML='';el('attempt').value='';
  updateViews();
}

function coach(){
  var lang=el('lang').value.trim(),attempt=el('attempt').value.trim();
  if(!lang||!attempt){setStatus('Write a sentence first.');return}
  if(needAI())return;
  el('chk').disabled=true;setStatus('Coach is reading…');
  myllmAsk('I am an English speaker learning '+lang+'. Check my '+lang+' sentence. In under 60 words: if it has mistakes, give the corrected sentence and briefly say why; if it is right, say so and give one short tip. My sentence: '+attempt)
  .then(function(reply){
    var f=el('feedback');f.innerHTML='<div class="fb-label">✓ Coach</div><div class="fb-body">'+esc(reply)+'</div>';
    f.style.display='block';setStatus('');haptic('success');
  }).catch(function(err){setStatus('Coach unavailable: '+err.message)})
  .then(function(){el('chk').disabled=false});
}

function renderLessons(){
  var D=el('lessons');D.innerHTML='';
  lessons.forEach(function(les,i){
    var r=document.createElement('div');r.className='deck'+(i===cur?' on':'');
    var fl=document.createElement('span');fl.className='deck-flag';fl.textContent=flagFor(les.lang);
    var mid=document.createElement('div');mid.className='deck-mid';
    var t=document.createElement('div');t.className='deck-t';t.textContent=les.topic;
    var s=document.createElement('div');s.className='deck-s';s.textContent=les.lang+' · '+les.phrases.length+' phrases';
    mid.appendChild(t);mid.appendChild(s);
    var x=document.createElement('button');x.className='del';x.type='button';x.textContent='✕';x.setAttribute('aria-label','Delete lesson');
    x.onclick=function(ev){
      ev.stopPropagation();
      lessons.splice(i,1);
      if(cur===i)cur=-1;else if(cur>i)cur--;
      save();
      if(lessons.length){openLesson(cur<0?0:cur)}else{cur=-1;el('lessonView').style.display='none'}
      renderLessons();updateViews();haptic('warning');
    };
    r.appendChild(fl);r.appendChild(mid);r.appendChild(x);
    r.onclick=function(){openLesson(i);renderLessons();window.scrollTo({top:0,behavior:'smooth'})};
    D.appendChild(r);
  });
  updateViews();
}

function updateViews(){
  el('empty').style.display=lessons.length?'none':'block';
  el('savedWrap').style.display=lessons.length?'block':'none';
  if(!lessons.length)el('lessonView').style.display='none';
}

el('topic').addEventListener('keydown',function(e){if(e.key==='Enter')gen()});
el('attempt').addEventListener('keydown',function(e){if(e.key==='Enter')coach()});

buildChips();
store.getItem('lessons').then(function(v){
  if(v)try{lessons=JSON.parse(v)||[]}catch(e){}
  renderLessons();
  if(lessons.length)openLesson(0);else updateViews();
  if(!window.myllmAsk)setStatus('Heads-up: this app needs the latest MyLLM with apps-AI enabled.');
});
</script></body></html>
