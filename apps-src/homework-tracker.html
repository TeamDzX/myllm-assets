  @media (prefers-color-scheme:dark){ .tool{ color:hsl(var(--h) 80% 74%); } }
  .tool:disabled{ opacity:.7; }
  .steps{ margin-top:9px; border-radius:12px; background:var(--bg); padding:4px 6px; }

  .s .box{ width:20px; height:20px; border-radius:6px; border:2px solid var(--line); flex-shrink:0; display:flex; align-items:center; justify-content:center; color:#fff; font-size:11px; margin-top:1px; }

  .s:active{ transform:none; }

<script>
(function(){if(window.__myllmAiWrap||typeof window.myllmAsk!=='function')return;window.__myllmAiWrap=true;
var orig=window.myllmAsk,depth=0,node=null;
function ensure(){if(node)return;node=document.createElement('div');node.className='myllm-ai-busy';
node.innerHTML='<span class="myllm-ai-cog"></span><span>AI is thinking… <small>privately, on your device</small></span>';
(document.body||document.documentElement).appendChild(node);}
function show(){ensure();depth++;node.classList.add('on');}
function hide(){depth=Math.max(0,depth-1);if(depth===0&&node)node.classList.remove('on');}
window.myllmAsk=function(){show();var p;try{p=orig.apply(this,arguments);}catch(e){hide();throw e;}
return Promise.resolve(p).then(function(r){hide();return r;},function(e){hide();throw e;});};})();
</script>
<div class="home">
  <div class="imm-safe"></div><div class="head">
    <div class="tile"><svg class="i"><use href="#i-books"/></svg></div>
    <div class="ht"><h1>Homework Tracker</h1><p>Every assignment and deadline, sorted</p></div>
  <div class="imm-acts"><button type="button" aria-label="Close Homework Tracker" onclick="myllmFSClose()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div></div>

  <div class="hero" id="hero">
    <div class="n" id="hN">0</div>
    <div class="grow"><b id="hT">Nothing to do</b><span class="s" id="hS">Add your first assignment below.</span></div>
  </div>

  <div class="card">
    <label for="t">Assignment</label>
    <input id="t" placeholder="e.g. History essay: the Tudors" autocomplete="off" enterkeyhint="done">
    <div class="grid2">
      <div><label for="subj">Subject</label><input id="subj" placeholder="e.g. History" autocomplete="off" enterkeyhint="done"></div>
      <div><label for="due">Due</label><input id="due" type="date"></div>
    </div>
    <button class="go" id="addBtn" type="button"><svg class="i"><use href="#i-plus"/></svg>Add assignment</button>
    <div id="status" class="status"></div>
  </div>

  <div id="list"></div>
</div>

<script>
function el(i){return document.getElementById(i)}
/* Bridges are looked up when used, never kept: MyLLM can add them after this
   script has run. */
function store(){return window.myllmStorage||{getItem:function(){return Promise.resolve(null)},setItem:function(){return Promise.resolve()}}}
function haptic(k){if(window.myllmHaptic)try{myllmHaptic(k)}catch(e){}}
function icon(n){return '<svg class="i"><use href="#i-'+n+'"/></svg>'}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var items=[],planning=null;
function save(){store().setItem('items',JSON.stringify(items))}
function setStatus(t,err){var s=el('status');s.textContent=t||'';s.classList.toggle('err',!!err)}
function uid(){return'a'+items.reduce(function(m,i){return Math.max(m,+i.id.slice(1)||0)},0)+1}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}

function add(){
  var t=el('t').value.trim();if(!t){el('t').focus();return}
  items.push({id:uid(),title:t,subj:el('subj').value.trim(),due:el('due').value,done:false,steps:null});
  el('t').value='';el('subj').value='';el('due').value='';
  save();render();haptic('light');
}
function toggle(id){var i=byId(id);i.done=!i.done;save();render();haptic(i.done?'success':'selection')}
function del(id){items=items.filter(function(i){return i.id!==id});save();render()}
function byId(id){return items.filter(function(i){return i.id===id})[0]}

function dueInfo(due){
  if(!due)return{txt:'',cls:''};
  var today=todayStr();
  var d=new Date(due+'T00:00'),n=new Date(today+'T00:00');
  var days=Math.round((d-n)/86400000);
  var label=d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
  if(days<0)return{txt:'Overdue · '+label,cls:'late',over:true,days:days};
  if(days===0)return{txt:'Due today',cls:'late',days:0};
  if(days===1)return{txt:'Due tomorrow',cls:'soon',days:1};
  if(days<=3)return{txt:'Due in '+days+' days · '+label,cls:'soon',days:days};
  return{txt:'Due '+label,cls:'',days:days};
}

/* Labelled lines, not JSON — small models (Apple Intelligence) echo JSON
   templates back verbatim. Echoed instructions are rejected and retried. */
var ECHO=/one short, concrete step|repeat this line|labelled line|the student can do/i;
function parseSteps(reply){
  var steps=[],got=false;
  String(reply||'').split(/\r?\n/).forEach(function(raw){
    var ln=raw.replace(/\*\*/g,'').trim();
    var m=ln.match(/^[-*#>\s]*(STEPS?)\s*\d*\s*[::]\s*(.*)$/i);
    if(!m)return;
    got=true;var v=m[2].trim();
    if(v)steps.push(v);
  });
  if(!got){ // model answered in the old JSON-array shape — accept it
    var s=reply.indexOf('['),e=reply.lastIndexOf(']');
    if(s>=0&&e>s)try{
      var arr=JSON.parse(reply.slice(s,e+1));
      if(Array.isArray(arr))steps=arr.filter(function(x){return typeof x==='string'&&x.trim()}).map(function(x){return x.trim()});
    }catch(e2){}
  }
  steps=steps.filter(function(x){return x&&!ECHO.test(x)});
  if(steps.length<2)throw new Error('no steps returned');
  return steps;
}
function plan(id){
  var i=byId(id);
  if(!window.myllmAsk){setStatus('Step-by-step planning needs AI — enable “Allow apps to use the AI” in Settings.',true);return}
  planning=id;render();
  setStatus('Breaking “'+i.title+'” into steps…');
  var p='Break this school assignment into 3-6 concrete, ordered steps a student can tick off. Assignment: "'+i.title+'"'+(i.subj?(' (subject: '+i.subj+')'):'')+'. Reply with EXACTLY these labelled lines and nothing else:\n'+
    'STEP: one short, concrete step the student can do (repeat this line for every step, in order)';
  myllmAsk(p).then(function(r){return parseSteps(r||'')})
  .catch(function(){return myllmAsk(p+'\nIMPORTANT: fill each labelled line with real content — never repeat the instruction text.')
    .then(function(r){return parseSteps(r||'')})})
  .then(function(arr){
    i.steps=arr.map(function(x){return{t:x,done:false}});save();setStatus('');
  }).catch(function(err){setStatus('Could not plan: '+err.message,true)})
  .then(function(){planning=null;render()});
}
function toggleStep(id,si){var i=byId(id);i.steps[si].done=!i.steps[si].done;save();render();haptic('selection')}

function renderHero(){
  var open=items.filter(function(i){return!i.done});
  var over=open.filter(function(i){return dueInfo(i.due).over});
  var dated=open.filter(function(i){return i.due&&!dueInfo(i.due).over}).sort(function(a,b){return a.due<b.due?-1:1});
  el('hN').textContent=open.length;
  el('hT').textContent=!items.length?'Nothing to do yet':open.length===1?'assignment to do':open.length?'assignments to do':'All done';
  var s;
  if(!items.length)s='Add your first assignment below.';
  else if(!open.length)s='Every assignment is ticked off. Nice work.';
  else if(over.length)s=over.length+' overdue'+(dated[0]?' · next: '+dated[0].title+', '+dueInfo(dated[0].due).txt.toLowerCase():'');
  else if(dated[0])s='Next: '+dated[0].title+' — '+dueInfo(dated[0].due).txt.toLowerCase();
  else s='No due dates set.';
  el('hS').textContent=s;
}
function render(){
  renderHero();
  var L=el('list');L.innerHTML='';
  if(!items.length){
    L.innerHTML='<div class="card empty"><div class="tile">'+icon('books')+'</div><b>No assignments yet</b><p>Add one above — you can break any of them into small steps with AI.</p></div>';
    return;
  }
  var open=items.filter(function(i){return!i.done}),done=items.filter(function(i){return i.done});
  var byDue=function(a,b){return(a.due||'9999')<(b.due||'9999')?-1:1};
  open.sort(byDue);
  function block(list,heading){
    if(!list.length)return;
    var h=document.createElement('h2');h.className='sec';h.textContent=heading;L.appendChild(h);
    var card=document.createElement('div');card.className='card';
    list.forEach(function(i){
      var di=dueInfo(i.due);
      var row=document.createElement('div');row.className='item'+(i.done?' done':'')+(di.over&&!i.done?' late':'');
      var chk=document.createElement('button');chk.type='button';chk.className='chk'+(i.done?' on':'');chk.setAttribute('aria-label',i.done?'Mark not done':'Mark done');
      chk.innerHTML='<span>'+(i.done?icon('check'):'')+'</span>';chk.onclick=function(){toggle(i.id)};
      var body=document.createElement('div');body.className='body';
      var tt=document.createElement('div');tt.className='title';tt.textContent=i.title;body.appendChild(tt);
      var m=document.createElement('div');m.className='meta';
      m.innerHTML=(i.subj?'<span class="subj">'+esc(i.subj)+'</span>':'')+'<span class="due '+di.cls+'">'+esc(di.txt||'No date')+'</span>';
      body.appendChild(m);
      if(!i.done){
        var b=document.createElement('button');b.type='button';b.className='tool';
        if(planning===i.id){b.disabled=true;b.innerHTML='<i class="spin"></i>Breaking into steps…'}
        else{b.innerHTML=i.steps?icon('again')+'Re-plan steps':icon('spark')+'Break into steps';b.disabled=!!planning}
        b.onclick=function(){plan(i.id)};
        body.appendChild(b);
      }
      if(i.steps&&i.steps.length){
        var st=document.createElement('div');st.className='steps';
        i.steps.forEach(function(s,si){
          var r=document.createElement('button');r.type='button';r.className='s'+(s.done?' on':'');
          r.innerHTML='<span class="box">'+(s.done?icon('check'):'')+'</span><span>'+esc(s.t)+'</span>';
          r.onclick=function(){toggleStep(i.id,si)};st.appendChild(r);
        });
        body.appendChild(st);
      }
      var x=document.createElement('button');x.type='button';x.className='del';x.innerHTML=icon('x');x.setAttribute('aria-label','Delete assignment');x.onclick=function(){del(i.id)};
      row.appendChild(chk);row.appendChild(body);row.appendChild(x);
      card.appendChild(row);
    });
    L.appendChild(card);
  }
  block(open,'To do');block(done,'Done');
}

/* myllm-fullscreen-v1 — full screen where MyLLM can also close the app for us (myllmClose,
   5.6.2+): full screen hides MyLLM's Done, and a page with no way out is
   worse than a repeated title, so elsewhere nothing changes. The spacer keeps
   the header clear of the status bar only if the page doesn't already. */
(function(){
  function full(){ return !!(window.myllmClose && window.myllmImmersive); }
  function inset(){
    var p = document.createElement("div");
    p.style.cssText = "position:fixed;top:0;left:0;width:1px;visibility:hidden;height:env(safe-area-inset-top)";
    document.body.appendChild(p); var h = p.offsetHeight; p.parentNode.removeChild(p); return h;
  }
  function fit(){
    var sp = document.querySelector(".imm-safe"), head = document.querySelector(".head");
    if (!sp || !head) return;
    sp.style.height = "0px";
    if (!document.body.classList.contains("imm")) return;
    var need = inset() + 6 - (head.getBoundingClientRect().top + window.scrollY);
    sp.style.height = Math.max(0, Math.round(need)) + "px";
  }
  function sync(){
    var f = full();
    document.body.classList.toggle("imm", f);
    fit();
    if (!f) return;
    try { window.myllmImmersive(true, { keepAwake:false }).catch(function(){}); } catch(e){}
  }
  window.myllmFSClose = function(){
    try { if (window.myllmHaptic) window.myllmHaptic("light"); } catch(e){}
    try { window.myllmClose().catch(function(){}); } catch(e){}
  };
  document.addEventListener("visibilitychange", function(){ if (!document.hidden) sync(); });
  window.addEventListener("resize", fit);
  sync();
})();
</script></body></html>
