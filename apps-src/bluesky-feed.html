<style>
  :root{ color-scheme:light dark;
    --bg:var(--myllm-bg,#f2f2f7); --surface:var(--myllm-surface,#fff); --ink:var(--myllm-text,#111);
    --muted:var(--myllm-muted,#8a8a8e); --line:var(--myllm-border,#e3e3e8); --acc:var(--myllm-accent,#0a84ff);
    --fill:rgba(120,120,128,.12); --h:205; }
  @media (prefers-color-scheme:dark){ :root{ --bg:var(--myllm-bg,#000); --surface:var(--myllm-surface,#1c1c1e);
    --ink:var(--myllm-text,#f2f2f7); --muted:var(--myllm-muted,#8e8e93); --line:var(--myllm-border,#2c2c2e); --fill:rgba(120,120,128,.24); } }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ font-family:var(--myllm-font,-apple-system,system-ui,sans-serif); background:var(--bg); color:var(--ink);
    max-width:640px; margin:0 auto; min-height:100dvh; font-size:15.5px; line-height:1.4;
    padding:calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(30px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left)); }
  svg.i{ width:1.25em; height:1.25em; fill:currentColor; flex-shrink:0; }
  button{ font:inherit; color:inherit; cursor:pointer; } button:active{ transform:scale(.96); }
  [hidden]{ display:none !important; }

  .head{ display:flex; align-items:center; gap:12px; margin:2px 2px 12px; }
  .tile{ display:flex; align-items:center; justify-content:center; color:#fff; flex-shrink:0;
    background:linear-gradient(145deg, hsl(var(--h) 62% 50%), hsl(calc(var(--h) + 40) 58% 28%)); }
  .head .tile{ width:44px; height:44px; border-radius:13px; font-size:19px; }
  .head .ht{ flex:1; min-width:0; }
  h1{ font-size:22px; font-weight:800; letter-spacing:-.01em; }
  .head p{ font-size:13px; color:var(--muted); margin-top:1px; }
  .head .acts{ display:flex; gap:8px; flex-shrink:0; }
  .ib{ width:40px; height:40px; border-radius:12px; border:1px solid var(--line); background:var(--surface); display:flex; align-items:center; justify-content:center; font-size:17px; }
  .ib.busy svg{ animation:spin .8s linear infinite; }
  .ib.gone{ visibility:hidden; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* the art from the old banner, now a quiet strip under the header */
  .art{ height:84px; border-radius:18px; margin-bottom:4px; background:hsl(var(--h) 40% 30%) center/cover; box-shadow:inset 0 0 0 1px rgba(255,255,255,.06); }

  .stick{ position:sticky; top:0; z-index:5; margin:0 calc(-16px - env(safe-area-inset-right)) 8px calc(-16px - env(safe-area-inset-left));
    padding:8px calc(16px + env(safe-area-inset-right)) 10px calc(16px + env(safe-area-inset-left));
    background:color-mix(in srgb, var(--bg) 90%, transparent); -webkit-backdrop-filter:saturate(180%) blur(12px); backdrop-filter:saturate(180%) blur(12px); }
  .seg{ display:flex; background:var(--fill); border-radius:12px; padding:3px; }
  .seg button{ flex:1; min-height:36px; border:0; background:none; border-radius:9px; font-size:14px; font-weight:700; color:var(--muted); }
  .seg button.on{ background:var(--surface); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.14); }

  .card{ background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:14px; margin-bottom:10px; }
  .post{ display:flex; gap:11px; }
  .av{ width:42px; height:42px; border-radius:50%; flex-shrink:0; object-fit:cover; background:var(--fill); }
  .av.ini{ display:flex; align-items:center; justify-content:center; color:#fff; font-size:15px; font-weight:800; letter-spacing:.02em;
    background:linear-gradient(145deg, hsl(var(--ah,210) 55% 52%), hsl(calc(var(--ah,210) + 35) 50% 32%)); }
  .post .b{ flex:1; min-width:0; }
  .post .who{ font-size:14.5px; line-height:1.3; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .post .who b{ font-weight:750; }
  .post .who span{ color:var(--muted); font-size:13px; }
  .post .txt{ font-size:15.5px; line-height:1.45; margin-top:4px; white-space:pre-wrap; overflow-wrap:anywhere; }
  .post .media{ display:grid; grid-template-columns:repeat(auto-fit,minmax(0,1fr)); gap:6px; margin-top:9px; }
  .post .media img{ width:100%; height:100%; max-height:240px; aspect-ratio:4/3; object-fit:cover; border-radius:12px; background:var(--fill); }
  .post .foot{ display:flex; align-items:center; gap:16px; margin-top:9px; font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .post .foot span{ display:inline-flex; align-items:center; gap:5px; }
  .post .foot svg.i{ width:1.1em; height:1.1em; }
  .post .foot a{ margin-left:auto; min-height:32px; padding:0 11px; border-radius:99px; background:var(--fill); color:var(--ink); font-weight:650; text-decoration:none; display:inline-flex; align-items:center; gap:5px; }

  label.k{ display:block; font-size:12px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); margin:14px 2px 7px; }
  label.k:first-child{ margin-top:0; }
  .search{ display:flex; gap:8px; }
  .field{ flex:1; min-width:0; display:flex; align-items:center; gap:8px; border:1px solid var(--line); background:var(--bg); border-radius:12px; padding:0 12px; }
  .field svg{ color:var(--muted); }
  .field input{ flex:1; min-width:0; border:0; background:none; outline:none; font:inherit; font-size:16px; padding:12px 0; color:var(--ink); }
  .field:focus-within{ border-color:var(--acc); }
  input.plain, textarea{ width:100%; font:inherit; font-size:16px; padding:12px; border-radius:12px; border:1px solid var(--line); background:var(--bg); color:var(--ink); outline:none; }
  input.plain:focus, textarea:focus{ border-color:var(--acc); }
  textarea{ min-height:120px; resize:vertical; line-height:1.45; }
  .go{ flex-shrink:0; min-height:46px; border:0; border-radius:12px; padding:0 16px; background:var(--acc); color:#fff; font-size:15px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:7px; }
  .go.wide{ width:100%; min-height:50px; margin-top:12px; border-radius:14px; }
  .go:disabled{ opacity:.55; }
  .spin{ width:16px; height:16px; border-radius:50%; border:2.4px solid currentColor; border-right-color:transparent; animation:spin .8s linear infinite; flex-shrink:0; }
  .meta{ display:flex; justify-content:space-between; margin-top:7px; font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .meta .over{ color:#ff453a; font-weight:800; }
  .note{ font-size:12.5px; color:var(--muted); line-height:1.5; margin-top:10px; }
  .note a{ color:var(--acc); }
  .okline, .errline{ display:flex; align-items:flex-start; gap:7px; font-size:13.5px; line-height:1.45; margin-top:10px; border-radius:12px; padding:10px 12px; }
  .okline{ color:#1c9a4a; background:rgba(52,199,89,.12); font-weight:650; }
  .errline{ color:#e0352b; background:rgba(255,69,58,.1); }
  @media (prefers-color-scheme:dark){ .okline{ color:#4be07d; } .errline{ color:#ff6b62; } }
  .okline svg.i, .errline svg.i{ margin-top:1px; }

  .sk{ display:flex; gap:11px; background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:14px; margin-bottom:10px; }
  .sk b{ width:42px; height:42px; border-radius:50%; background:var(--fill); flex-shrink:0; animation:pulse 1.3s ease-in-out infinite; }
  .sk div{ flex:1; }
  .sk i{ display:block; height:12px; border-radius:6px; background:var(--fill); margin-bottom:9px; animation:pulse 1.3s ease-in-out infinite; }
  .sk i:first-child{ width:45%; } .sk i:last-child{ width:65%; margin-bottom:0; }
  @keyframes pulse{ 50%{ opacity:.45; } }

  .notice{ display:flex; gap:12px; align-items:flex-start; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px; margin:0 0 10px; }
  .notice .tile{ width:36px; height:36px; border-radius:10px; font-size:15px; }
  .notice.err .tile{ background:linear-gradient(145deg,#ff6b5f,#c0392b); }
  .notice.off .tile{ background:linear-gradient(145deg,#8e8e93,#48484a); }
  .notice b{ display:block; font-size:15px; font-weight:750; }
  .notice p{ font-size:13.5px; color:var(--muted); margin-top:2px; line-height:1.45; }
  .notice button{ margin-top:10px; min-height:36px; padding:0 14px; border-radius:10px; border:0; background:var(--acc); color:#fff; font-weight:700; font-size:13.5px; display:inline-flex; align-items:center; gap:6px; }

  @media (max-width:350px){ .seg button{ font-size:13px; } .art{ height:64px; } }
  @media (max-height:520px) and (min-width:600px){ .art{ display:none; } }
  @media (prefers-reduced-motion:reduce){ .sk b, .sk i, .ib.busy svg{ animation:none; } .spin{ animation-duration:2.4s; } button:active{ transform:none; } }


/* myllm-fullscreen-v1 — MyLLM 5.6.2+ opens this app full screen; the ✕ is the way out. */

.head .imm-acts button:active,.head .imm-x:active{transform:scale(.94)}
.head .imm-x{display:none !important}

.imm-x svg,.imm-acts svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}
.imm-safe{display:none}
body.imm .imm-safe{display:block}
</style>

<script>
/* Bridges are looked up when used, never kept: MyLLM can add them after this
   script has run. */
function store(){ return window.myllmStorage || {getItem:function(){return Promise.resolve(null)}, setItem:function(){return Promise.resolve()}}; }
function NET(url, opts){ var f = window.myllmFetch; if (!f) return Promise.reject(new Error("no network bridge")); return f(url, opts); }
function hasNet(){ return !!window.myllmFetch; }
function haptic(k){ if(window.myllmHaptic){ try{ myllmHaptic(k||'light'); }catch(_){} } }
function el(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function icon(n){ return '<svg class="i"><use href="#i-' + n + '"/></svg>'; }
function okLine(t){ return '<div class="okline">' + icon("check") + '<span>' + t + '</span></div>'; }
function errLine(t){ return '<div class="errline">' + icon("warn") + '<span>' + t + '</span></div>'; }
function skeleton(target, n){ var h = ""; for (var i = 0; i < (n || 4); i++) h += '<div class="sk"><b></b><div><i></i><i></i><i></i></div></div>'; el(target).innerHTML = h; }
function notice(target, kind, title, text, retry){
  var box = el(target);
  box.innerHTML = '<div class="notice ' + kind + '"><div class="tile">' + icon(kind === "off" ? "off" : "warn") + '</div><div><b>' + esc(title) + '</b><p>' + esc(text) + '</p>' +
    (retry ? '<button type="button">' + icon("refresh") + 'Try again</button>' : '') + '</div></div>';
  if (retry) box.querySelector(".notice button").onclick = retry;
}
/* Round avatar; if there's no picture, or it fails to load, the person's initials on a hue of their own. */
function hueOf(s){ var h = 0; s = String(s || ""); for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360; return h; }
function initials(name){ var w = String(name || "?").replace(/[^\p{L}\p{N} ]/gu, " ").trim().split(/\s+/); return ((w[0] || "?")[0] + (w.length > 1 ? w[w.length - 1][0] : "")).toUpperCase(); }
function avatarHtml(src, name, key){
  var ini = '<div class="av ini" style="--ah:' + hueOf(key || name) + '" data-ini="1">' + esc(initials(name)) + '</div>';
  return src ? '<img class="av" src="' + esc(src) + '" alt="" loading="lazy" data-name="' + esc(name) + '" data-key="' + esc(key || name) + '">' : ini;
}
function wireAvatars(root){
  Array.prototype.forEach.call(root.querySelectorAll("img.av"), function(img){
    img.onerror = function(){
      if (!img.parentNode) return;
      var d = document.createElement("div");
      d.className = "av ini"; d.style.setProperty("--ah", hueOf(img.getAttribute("data-key")));
      d.textContent = initials(img.getAttribute("data-name"));
      img.parentNode.replaceChild(d, img);
    };
  });
}
function timeAgo(iso){
  var s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (s < 60) return "now";
  if (s < 3600) return Math.floor(s/60) + "m";
  if (s < 86400) return Math.floor(s/3600) + "h";
  return Math.floor(s/86400) + "d";
}

if (HERO.indexOf("data:") === 0) el("hero").style.backgroundImage = "url(" + HERO + ")";

var PUB = "https://public.api.bsky.app/xrpc/";
var PDS = "https://bsky.social/xrpc/";
var DISCOVER = "at://did:plc:z72i7hdynmk6r22z27h6tvur/app.bsky.feed.generator/whats-hot";
var creds = null, tab = "d";

function showTab(t){
  haptic("selection");
  tab = t;
  el("paneD").hidden = t !== "d";
  el("paneP").hidden = t !== "p";
  el("paneW").hidden = t !== "w";
  el("tabD").className = t === "d" ? "on" : "";
  el("tabP").className = t === "p" ? "on" : "";
  el("tabW").className = t === "w" ? "on" : "";
  el("refresh").classList.toggle("gone", t === "w");
}

function postCard(item){
  var p = item.post || item;
  var a = p.author || {};
  var rec = p.record || {};
  var imgs = "";
  var emb = p.embed;
  if (emb && emb.images && emb.images.length){
    imgs = '<div class="media">' + emb.images.slice(0,2).map(function(im){
      return '<img src="' + esc(im.thumb || "") + '" alt="' + esc(im.alt || "") + '" loading="lazy">';
    }).join("") + '</div>';
  }
  var rkey = (p.uri || "").split("/").pop();
  var link = "https://bsky.app/profile/" + esc(a.handle || "") + "/post/" + esc(rkey);
  var name = a.displayName || a.handle || "?";
  return '<div class="card"><div class="post">' + avatarHtml(a.avatar, name, a.handle) +
    '<div class="b"><div class="who"><b>' + esc(name) + '</b> ' +
    '<span>@' + esc(a.handle || "") + ' · ' + timeAgo(rec.createdAt || p.indexedAt) + '</span></div>' +
    '<div class="txt">' + esc(rec.text || "") + '</div>' + imgs +
    '<div class="foot"><span aria-label="Replies">' + icon("chat") + (p.replyCount || 0) + '</span><span aria-label="Reposts">' + icon("repost") + (p.repostCount || 0) + '</span><span aria-label="Likes">' + icon("heart") + (p.likeCount || 0) + '</span>' +
    '<a href="' + link + '">Open' + icon("ext") + '</a></div>' +
    '</div></div></div>';
}

function renderFeed(target, items, emptyMsg){
  if (!items || !items.length){
    notice(target, "err", "Nothing to show", emptyMsg, target === "feedD" ? loadDiscover : null);
    return;
  }
  el(target).innerHTML = items.map(postCard).join("");
  wireAvatars(el(target));
}

function netGuard(target, retry){
  if (!hasNet()){
    notice(target, "off", "Network access is off", "Bluesky Feed needs “Allow apps to use the internet” in MyLLM’s Settings.", retry);
    return false;
  }
  return true;
}
function busy(on){ el("refresh").classList.toggle("busy", on); }

function loadDiscover(){
  if (!netGuard("feedD", loadDiscover)) return;
  skeleton("feedD", 4); busy(true);
  NET(PUB + "app.bsky.feed.getFeed?feed=" + encodeURIComponent(DISCOVER) + "&limit=40")
  .then(function(r){
    var j = JSON.parse(r.body);
    renderFeed("feedD", j.feed, "Nothing came back — try refresh.");
    haptic("selection");
  })
  .catch(function(){
    notice("feedD", "err", "Couldn’t reach Bluesky", "It may be busy or your connection dropped.", loadDiscover);
  })
  .then(function(){ busy(false); });
}

function loadProfile(){
  var h = el("handle").value.trim().replace(/^@/, "");
  if (!h) return;
  if (!netGuard("feedP", loadProfile)) return;
  haptic("light"); el("handle").blur();
  skeleton("feedP", 3); busy(true);
  NET(PUB + "app.bsky.feed.getAuthorFeed?actor=" + encodeURIComponent(h) + "&limit=30")
  .then(function(r){
    var j = JSON.parse(r.body);
    if (j.error) throw new Error(j.message || j.error);
    renderFeed("feedP", j.feed, "No posts from @" + h + " yet.");
  })
  .catch(function(){
    notice("feedP", "err", "Couldn’t find that account", "Check the handle — it looks like name.bsky.social.", null);
  })
  .then(function(){ busy(false); });
}

/* ---------- posting ---------- */
function onCompose(){
  var n = el("compose").value.length;
  el("ccount").textContent = n;
  el("ccount").className = n > 300 ? "over" : "";
}
function saveCreds(){
  var i = el("ident").value.trim().replace(/^@/, "");
  var p = el("apppass").value.trim();
  if (!i || !p){ el("credmsg").innerHTML = errLine("Fill in both fields."); return; }
  creds = {i:i, p:p};
  store().setItem("bsky_creds", JSON.stringify(creds));
  el("credmsg").innerHTML = okLine("Saved — you can post now.");
  haptic("success");
}
function postBtn(on){
  var b = el("postBtn"); b.disabled = on;
  b.innerHTML = on ? '<i class="spin"></i><span>Posting…</span>' : icon("send") + '<span>Post to Bluesky</span>';
}
function doPost(){
  var text = el("compose").value.trim();
  if (!text){ el("postmsg").innerHTML = errLine("Write something first."); return; }
  if (text.length > 300){ el("postmsg").innerHTML = errLine("Too long for Bluesky — 300 characters max."); return; }
  if (!creds){ el("postmsg").innerHTML = errLine("Add your account below first."); return; }
  if (!hasNet()){ el("postmsg").innerHTML = errLine("Needs internet access for apps (MyLLMos settings)."); return; }
  haptic("light");
  postBtn(true);
  el("postmsg").innerHTML = "";
  NET(PDS + "com.atproto.server.createSession", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({identifier:creds.i, password:creds.p})
  })
  .then(function(r){
    var s = JSON.parse(r.body);
    if (!s.accessJwt) throw new Error(s.message || "Sign-in failed — check handle and app password.");
    return NET(PDS + "com.atproto.repo.createRecord", {
      method:"POST",
      headers:{"Content-Type":"application/json", "Authorization":"Bearer " + s.accessJwt},
      body:JSON.stringify({
        repo:s.did,
        collection:"app.bsky.feed.post",
        record:{"$type":"app.bsky.feed.post", text:text, createdAt:new Date().toISOString()}
      })
    });
  })
  .then(function(r){
    var j = JSON.parse(r.body);
    if (!j.uri) throw new Error(j.message || "Posting failed.");
    el("compose").value = ""; onCompose();
    el("postmsg").innerHTML = okLine("Posted — it's live on Bluesky.");
    postBtn(false);
    haptic("success");
  })
  .catch(function(e){
    el("postmsg").innerHTML = errLine(esc(e && e.message ? e.message : "Something went wrong — try again."));
    postBtn(false);
  });
}

el("refresh").onclick = function(){
  if (el("refresh").classList.contains("busy")) return;
  haptic("light");
  if (tab === "p"){ if (el("handle").value.trim()) loadProfile(); else el("handle").focus(); }
  else loadDiscover();
};

/* ---------- boot ---------- */
store().getItem("bsky_creds").then(function(v){
  if (v){ try{ creds = JSON.parse(v); if (creds) el("ident").value = creds.i || ""; }catch(e){} }
  loadDiscover();
});

/* myllm-fullscreen-v1 — full screen where MyLLM can also close the app for us (myllmClose,
   5.6.2+): full screen hides MyLLM's Done, and a page with no way out is
   worse than a repeated title, so elsewhere nothing changes. The spacer keeps
   the header clear of the status bar only if the page doesn't already. */
(function(){
  function full(){ return !!(window.myllmClose && window.myllmImmersive); }
  function inset(){
    var p = document.createElement("div");
    p.style.cssText = "position:fixed;top:0;left:0;width:1px;visibility:hidden;height:env(safe-area-inset-top)";
    document.body.appendChild(p); var h = p.offsetHeight; p.parentNode.removeChild(p); return h;
  }
  function fit(){
    var sp = document.querySelector(".imm-safe"), head = document.querySelector(".head");
    if (!sp || !head) return;
    sp.style.height = "0px";
    if (!document.body.classList.contains("imm")) return;
    var need = inset() + 6 - (head.getBoundingClientRect().top + window.scrollY);
    sp.style.height = Math.max(0, Math.round(need)) + "px";
  }
  function sync(){
    var f = full();
    document.body.classList.toggle("imm", f);
    fit();
    if (!f) return;
    try { window.myllmImmersive(true, { keepAwake:false }).catch(function(){}); } catch(e){}
  }
  window.myllmFSClose = function(){
    try { if (window.myllmHaptic) window.myllmHaptic("light"); } catch(e){}
    try { window.myllmClose().catch(function(){}); } catch(e){}
  };
  document.addEventListener("visibilitychange", function(){ if (!document.hidden) sync(); });
  window.addEventListener("resize", fit);
  sync();
})();
</script>
