<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bluesky Feed</title>
<style>
  :root { color-scheme: light dark; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{
    font-family:var(--myllm-font,-apple-system,system-ui,sans-serif);
    background:var(--myllm-bg,#f2f2f7);
    color:var(--myllm-text,#111);
    max-width:640px; margin:0 auto; min-height:100dvh;
    padding-bottom:calc(30px + env(safe-area-inset-bottom));
  }
  .hero{
    height:100px; background:#27425f center/cover; position:relative;
    display:flex; align-items:flex-end; padding:12px 16px;
  }
  .hero::after{ content:""; position:absolute; inset:0; background:linear-gradient(180deg, transparent 30%, rgba(0,0,0,.4)); }
  .hero h1{ position:relative; z-index:1; color:#fff; font-size:22px; font-weight:800; text-shadow:0 2px 8px rgba(0,0,0,.5); }
  .wrap{ padding:12px 14px; }

  .tabs{ display:flex; background:var(--myllm-surface,#fff); border:1px solid var(--myllm-border,#e3e3e8); border-radius:13px; padding:3px; margin-bottom:12px; }
  .tabs button{
    flex:1; border:none; background:none; color:var(--myllm-muted,#8a8a8e);
    border-radius:10px; padding:9px; font-size:14px; font-weight:700;
  }
  .tabs button.on{ background:var(--myllm-accent,#0a84ff); color:#fff; }

  .card{
    background:var(--myllm-surface,#fff); border:1px solid var(--myllm-border,#e3e3e8);
    border-radius:16px; padding:13px 14px; margin-bottom:10px;
  }
  .post{ display:flex; gap:10px; }
  .post img.av{ width:42px; height:42px; border-radius:50%; flex-shrink:0; background:#ccc; }
  .post .b{ flex:1; min-width:0; }
  .post .who{ font-size:14px; }
  .post .who b{ font-weight:750; }
  .post .who span{ color:var(--myllm-muted,#8a8a8e); font-size:12.5px; }
  .post .txt{ font-size:15px; line-height:1.42; margin-top:3px; white-space:pre-wrap; word-wrap:break-word; }
  .post .media{ display:flex; gap:6px; margin-top:8px; overflow:hidden; border-radius:10px; }
  .post .media img{ flex:1; min-width:0; max-height:220px; object-fit:cover; border-radius:10px; }
  .post .foot{ display:flex; gap:16px; margin-top:8px; font-size:12.5px; color:var(--myllm-muted,#8a8a8e); }
  .post .foot a{ margin-left:auto; color:var(--myllm-accent,#0a84ff); text-decoration:none; font-weight:650; }

  .row{ display:flex; gap:8px; }
  input, textarea{
    width:100%; font-size:16px; padding:11px 12px; border-radius:12px;
    border:1px solid var(--myllm-border,#e3e3e8); background:var(--myllm-bg,#f2f2f7); color:var(--myllm-text,#111);
    font-family:inherit;
  }
  textarea{ min-height:110px; resize:vertical; line-height:1.45; }
  .go{
    border:none; border-radius:12px; padding:0 18px; font-size:15px; font-weight:700;
    background:var(--myllm-accent,#0a84ff); color:#fff;
  }
  .wide{ width:100%; padding:13px; margin-top:10px; }
  .go:disabled{ opacity:.5; }
  label{ display:block; font-size:11.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--myllm-muted,#8a8a8e); margin:10px 0 6px; }
  label:first-child{ margin-top:0; }
  .note{ font-size:12.5px; color:var(--myllm-muted,#8a8a8e); line-height:1.5; margin-top:8px; }
  .note a{ color:var(--myllm-accent,#0a84ff); }
  .status{ text-align:center; font-size:13.5px; color:var(--myllm-muted,#8a8a8e); padding:18px 10px; line-height:1.5; }
  .meta{ display:flex; justify-content:space-between; margin-top:6px; font-size:12.5px; color:var(--myllm-muted,#8a8a8e); }
  .meta .over{ color:#ff3b30; font-weight:700; }
  .okline{ color:#30a14e; font-size:13px; font-weight:650; margin-top:8px; }
  .errline{ color:#ff3b30; font-size:13px; margin-top:8px; }
  .refresh{ width:100%; border:1px solid var(--myllm-border,#e3e3e8); background:var(--myllm-surface,#fff); color:var(--myllm-text,#111); border-radius:12px; padding:11px; font-size:14px; font-weight:650; margin-bottom:10px; }
</style>
</head>
<body>

<div class="hero" id="hero"><h1>🦋 Bluesky Feed</h1></div>
<div class="wrap">
  <div class="tabs">
    <button id="tabD" class="on" onclick="showTab('d')">Discover</button>
    <button id="tabP" onclick="showTab('p')">People</button>
    <button id="tabW" onclick="showTab('w')">Write</button>
  </div>

  <div id="paneD">
    <button class="refresh" onclick="loadDiscover()">↻ Refresh</button>
    <div id="feedD"><p class="status">Loading the Discover feed…</p></div>
  </div>

  <div id="paneP" style="display:none">
    <div class="card">
      <div class="row">
        <input id="handle" placeholder="someone.bsky.social" autocapitalize="none" autocorrect="off" onkeydown="if(event.key==='Enter')loadProfile()">
        <button class="go" onclick="loadProfile()">View</button>
      </div>
    </div>
    <div id="feedP"></div>
  </div>

  <div id="paneW" style="display:none">
    <div class="card">
      <label>New post</label>
      <textarea id="compose" placeholder="What's happening?" oninput="onCompose()"></textarea>
      <div class="meta"><b id="ccount">0</b><span>300 max</span></div>
      <button class="go wide" id="postBtn" onclick="doPost()">Post to Bluesky</button>
      <div id="postmsg"></div>
    </div>
    <div class="card">
      <label>Your account</label>
      <input id="ident" placeholder="you.bsky.social" autocapitalize="none" autocorrect="off">
      <div style="height:8px"></div>
      <input id="apppass" type="password" placeholder="app password (xxxx-xxxx-xxxx-xxxx)">
      <button class="go wide" onclick="saveCreds()">Save on this device</button>
      <p class="note">Use an <b>app password</b>, never your real one: in the Bluesky app → Settings → Privacy &amp; Security → App Passwords → Add. Your details are stored only on this device and sent only to Bluesky itself.</p>
      <div id="credmsg"></div>
    </div>
  </div>
</div>

  el("paneD").style.display = t === "d" ? "block" : "none";
  el("paneP").style.display = t === "p" ? "block" : "none";
  el("paneW").style.display = t === "w" ? "block" : "none";
  el("tabD").className = t === "d" ? "on" : "";
  el("tabP").className = t === "p" ? "on" : "";
  el("tabW").className = t === "w" ? "on" : "";
}

function timeAgo(iso){
  var s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (s < 60) return "now";
  if (s < 3600) return Math.floor(s/60) + "m";
  if (s < 86400) return Math.floor(s/3600) + "h";
  return Math.floor(s/86400) + "d";
}

function postCard(item){
  var p = item.post || item;
  var a = p.author || {};
  var rec = p.record || {};
  var imgs = "";
  var emb = p.embed;
  if (emb && emb.images && emb.images.length){
    imgs = '<div class="media">' + emb.images.slice(0,2).map(function(im){
      return '<img src="' + esc(im.thumb || "") + '" alt="" loading="lazy">';
    }).join("") + '</div>';
  }
  var rkey = (p.uri || "").split("/").pop();
  var link = "https://bsky.app/profile/" + esc(a.handle || "") + "/post/" + esc(rkey);
  return '<div class="card"><div class="post">' +
    (a.avatar ? '<img class="av" src="' + esc(a.avatar) + '" alt="" loading="lazy">' : '<div class="av"></div>') +
    '<div class="b"><div class="who"><b>' + esc(a.displayName || a.handle || "?") + '</b> ' +
    '<span>@' + esc(a.handle || "") + ' · ' + timeAgo(rec.createdAt || p.indexedAt) + '</span></div>' +
    '<div class="txt">' + esc(rec.text || "") + '</div>' + imgs +
    '<div class="foot"><span>💬 ' + (p.replyCount || 0) + '</span><span>🔁 ' + (p.repostCount || 0) + '</span><span>❤️ ' + (p.likeCount || 0) + '</span>' +
    '<a href="' + link + '">open ↗</a></div>' +
    '</div></div></div>';
}

function renderFeed(target, items, emptyMsg){
  if (!items || !items.length){
    el(target).innerHTML = '<p class="status">' + emptyMsg + '</p>';
    return;
  }
  el(target).innerHTML = items.map(postCard).join("");
}

function netGuard(target){
  if (!NET){
    el(target).innerHTML = '<p class="status">This app needs internet access for apps — turn it on in MyLLMos settings, then reopen.</p>';
    return false;
  }
  return true;
}

function loadDiscover(){
  if (!netGuard("feedD")) return;
  el("feedD").innerHTML = '<p class="status">Loading the Discover feed…</p>';
  NET(PUB + "app.bsky.feed.getFeed?feed=" + encodeURIComponent(DISCOVER) + "&limit=40")
  .then(function(r){
    var j = JSON.parse(r.body);
    renderFeed("feedD", j.feed, "Nothing came back — try refresh.");
    haptic("selection");
  })
  .catch(function(){
    el("feedD").innerHTML = '<p class="status">Couldn\'t reach Bluesky just now — pull yourself together and tap refresh.</p>';
  });
}

function loadProfile(){
  var h = el("handle").value.trim().replace(/^@/, "");
  if (!h) return;
  if (!netGuard("feedP")) return;
  haptic("light");
  el("feedP").innerHTML = '<p class="status">Loading @' + esc(h) + '…</p>';
  NET(PUB + "app.bsky.feed.getAuthorFeed?actor=" + encodeURIComponent(h) + "&limit=30")
  .then(function(r){
    var j = JSON.parse(r.body);
    if (j.error) throw new Error(j.message || j.error);
    renderFeed("feedP", j.feed, "No posts from @" + esc(h) + " yet.");
  })
  .catch(function(){
    el("feedP").innerHTML = '<p class="status">Couldn\'t find that account — check the handle (e.g. name.bsky.social).</p>';
  });
}

/* ---------- posting ---------- */
function onCompose(){
  var n = el("compose").value.length;
  el("ccount").textContent = n;
  el("ccount").className = n > 300 ? "over" : "";
}
function saveCreds(){
  var i = el("ident").value.trim().replace(/^@/, "");
  var p = el("apppass").value.trim();
  if (!i || !p){ el("credmsg").innerHTML = '<div class="errline">Fill in both fields.</div>'; return; }
  creds = {i:i, p:p};
  store.setItem("bsky_creds", JSON.stringify(creds));
  el("credmsg").innerHTML = '<div class="okline">Saved — you can post now.</div>';
  haptic("success");
}
function doPost(){
  var text = el("compose").value.trim();
  if (!text){ el("postmsg").innerHTML = '<div class="errline">Write something first.</div>'; return; }
  if (text.length > 300){ el("postmsg").innerHTML = '<div class="errline">Too long for Bluesky — 300 characters max.</div>'; return; }
  if (!creds){ el("postmsg").innerHTML = '<div class="errline">Add your account below first.</div>'; return; }
  if (!NET){ el("postmsg").innerHTML = '<div class="errline">Needs internet access for apps (MyLLMos settings).</div>'; return; }
  haptic("light");
  el("postBtn").disabled = true;
  el("postmsg").innerHTML = "";
  NET(PDS + "com.atproto.server.createSession", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({identifier:creds.i, password:creds.p})
  })
  .then(function(r){
    var s = JSON.parse(r.body);
    if (!s.accessJwt) throw new Error(s.message || "Sign-in failed — check handle and app password.");
    return NET(PDS + "com.atproto.repo.createRecord", {
      method:"POST",
      headers:{"Content-Type":"application/json", "Authorization":"Bearer " + s.accessJwt},
      body:JSON.stringify({
        repo:s.did,
        collection:"app.bsky.feed.post",
        record:{"$type":"app.bsky.feed.post", text:text, createdAt:new Date().toISOString()}
      })
    });
  })
  .then(function(r){
    var j = JSON.parse(r.body);
    if (!j.uri) throw new Error(j.message || "Posting failed.");
    el("compose").value = ""; onCompose();
    el("postmsg").innerHTML = '<div class="okline">Posted ✓ — it\'s live on Bluesky.</div>';
    el("postBtn").disabled = false;
    haptic("success");
  })
  .catch(function(e){
    el("postmsg").innerHTML = '<div class="errline">' + esc(e && e.message ? e.message : "Something went wrong — try again.") + '</div>';
    el("postBtn").disabled = false;
  });
}

/* ---------- boot ---------- */
store.getItem("bsky_creds").then(function(v){
  if (v){ try{ creds = JSON.parse(v); if (creds) el("ident").value = creds.i || ""; }catch(e){} }
  loadDiscover();
});
</script>
