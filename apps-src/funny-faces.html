<style>:root{--build-id:"9e4ef06f9e";color-scheme:dark;--grain:0.502867647805}
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{ font-family:var(--myllm-font,-apple-system,system-ui,sans-serif); background:var(--skin,#f4c7a1); color:#fff; overflow:hidden;
    touch-action:none; overscroll-behavior:none; -webkit-user-select:none; user-select:none; transition:background-color .5s ease; }

  /* The face: one SVG that fills the screen. The skin colour is the page itself. */
  .shade{ position:fixed; inset:0; pointer-events:none; z-index:1;
    background:radial-gradient(90% 80% at 50% 45%, rgba(255,255,255,.16), transparent 65%), radial-gradient(140% 120% at 50% 50%, transparent 55%, rgba(0,0,0,.16)); }
  #face{ position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  .mode-eyes #mouth, .mode-mouth #eyes{ display:none; }

  /* Speech bubble: shown only while there's a message. */
  .bubble{ position:fixed; left:50%; top:calc(10px + env(safe-area-inset-top)); max-width:min(78vw, 760px); transform:translate(-50%, -14px) scale(.8); opacity:0;
    background:#fff; color:#17131a; border-radius:30px; padding:.42em .9em .46em; font-weight:800; letter-spacing:-.01em; line-height:1.12; text-align:center;
    font-size:var(--bfs,44px); box-shadow:0 18px 40px rgba(0,0,0,.28); pointer-events:none; transition:opacity .22s ease, transform .32s cubic-bezier(.2,1.4,.4,1); z-index:3; }
  .bubble::after{ content:""; position:absolute; left:50%; bottom:-14px; width:30px; height:30px; background:#fff; border-radius:0 0 8px 0; transform:translateX(-50%) rotate(45deg); }
  .bubble.on{ opacity:1; transform:translate(-50%, 0) scale(1); }
  .mode-mouth .bubble{ top:calc(8px + env(safe-area-inset-top)); }

  /* The one control that's always there, faint so it doesn't spoil the face. */
  .more{ position:fixed; top:calc(10px + env(safe-area-inset-top)); right:calc(12px + env(safe-area-inset-right)); width:44px; height:44px; border-radius:50%;
    border:none; display:flex; align-items:center; justify-content:center; color:#fff; background:rgba(0,0,0,.22); opacity:.55; z-index:4; transition:opacity .3s; }
  .more:active{ transform:scale(.94); }
  .more.hide{ opacity:0; pointer-events:none; }
  svg.ic{ width:22px; height:22px; fill:currentColor; }

  .hint{ position:fixed; left:50%; bottom:calc(16px + env(safe-area-inset-bottom)); transform:translateX(-50%); z-index:4; pointer-events:none;
    background:rgba(0,0,0,.5); color:#fff; font-size:14px; font-weight:650; padding:9px 16px; border-radius:99px; white-space:nowrap; opacity:0; transition:opacity .4s; }
  .hint.on{ opacity:1; }

  /* The panel: everything else lives here. */
  .panel{ position:fixed; left:50%; bottom:0; width:min(100%, 760px); max-height:min(88vh, 520px); overflow-y:auto; -webkit-overflow-scrolling:touch; z-index:5;
    transform:translate(-50%, 104%); touch-action:pan-y;
    background:rgba(22,20,30,.84); -webkit-backdrop-filter:blur(22px); backdrop-filter:blur(22px); border-radius:24px 24px 0 0;
    padding:10px calc(14px + env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));
    visibility:hidden; transition:transform .32s cubic-bezier(.2,.8,.2,1), visibility 0s .32s; }
  .panel.on{ transform:translate(-50%, 0); visibility:visible; transition:transform .32s cubic-bezier(.2,.8,.2,1); box-shadow:0 -14px 40px rgba(0,0,0,.3); }
  .bar{ display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .seg{ display:flex; background:rgba(255,255,255,.1); border-radius:99px; padding:3px; }
  .seg button{ border:none; background:none; color:#fff; font:inherit; font-size:15px; font-weight:750; height:36px; padding:0 16px; border-radius:99px; opacity:.7; }
  .seg button.on{ background:#fff; color:#17131a; opacity:1; }
  .sp{ flex:1; }
  .tog{ border:none; font:inherit; font-size:14px; font-weight:750; height:36px; padding:0 14px; border-radius:99px; background:rgba(255,255,255,.1); color:#fff; }
  .tog.on{ background:#ffd60a; color:#17131a; }
  .x{ width:36px; height:36px; border-radius:50%; border:none; background:rgba(255,255,255,.12); color:#fff; display:flex; align-items:center; justify-content:center; }
  .row{ display:flex; align-items:center; gap:10px; padding:7px 0; }
  .row > b{ flex:0 0 74px; font-size:11px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; opacity:.6; }
  .scroll{ display:flex; gap:8px; overflow-x:auto; flex:1; padding:2px 2px 4px; scrollbar-width:none; touch-action:pan-x; }
  .scroll::-webkit-scrollbar{ display:none; }
  .chip{ flex:0 0 auto; border:none; font:inherit; font-size:14.5px; font-weight:650; height:40px; padding:0 13px; border-radius:99px; background:rgba(255,255,255,.1); color:#fff; display:flex; align-items:center; gap:6px; white-space:nowrap; }
  .chip.on{ background:#fff; color:#17131a; }
  .chip .del{ margin-left:2px; opacity:.55; font-size:16px; padding:0 2px; }
  .sw{ flex:0 0 auto; width:40px; height:40px; border-radius:50%; border:3px solid transparent; outline:2px solid rgba(255,255,255,.18); outline-offset:-2px; }
  .sw.on{ border-color:#fff; outline-color:transparent; }
  .sw.img{ background-size:118%; background-position:center; }
  .add{ display:flex; gap:8px; flex:1; }
  .add input{ flex:1; min-width:0; height:40px; border-radius:12px; border:1px solid rgba(255,255,255,.18); background:rgba(255,255,255,.08); color:#fff; font:inherit; font-size:16px; padding:0 12px; -webkit-user-select:text; user-select:text; }
  .add button{ border:none; height:40px; padding:0 16px; border-radius:12px; background:#fff; color:#17131a; font:inherit; font-size:15px; font-weight:750; }
  .tip{ font-size:12.5px; opacity:.55; padding:4px 2px 0; line-height:1.4; }
  .exit{ border:none; font:inherit; font-size:14px; font-weight:700; height:36px; padding:0 14px; border-radius:99px; background:rgba(255,69,58,.22); color:#ffb4ae; }
  @media (prefers-reduced-motion:reduce){ .bubble{ transition:opacity .2s; } }

    if (id === "love") { spawn("heart", rnd(140, 860), 470, 1); fxNext = T + rnd(.5, .9); }
    else if (id === "sleepy") { spawn("z", 880, 120); fxNext = T + 1.5; }
    else if (id === "sad") { var e = EYES[Math.random() < .5 ? 0 : 1]; spawn("tear", e.x - e.d * 120, 300 + 120); fxNext = T + rnd(1.6, 2.6); }
    else fxNext = T + .4;
  } else fxNext = T + .4;
}

/* ---------- the loop ---------- */
var running = false;
function frame(now){
  if (!running) return;
  var dt = last ? Math.min(.05, (now - last) / 1000) : .016; last = now; T += dt;
  if (S.mode === "eyes") {
    var m = eyeMood();
    if (T >= gaze.next && !follow) {
      if (m.id === "side") { sideX = -sideX; gaze.tx = sideX; gaze.ty = 4; gaze.next = T + rnd(1.6, 2.6); }
      else if (T < lookUpUntil) { gaze.tx = 0; gaze.ty = -48; gaze.next = lookUpUntil; }
      else { var r = Math.random() < .3 ? 0 : rnd(10, 58), an = rnd(0, Math.PI * 2); gaze.tx = Math.cos(an) * r; gaze.ty = Math.sin(an) * r * .7; gaze.next = T + rnd(.6, 2.8); }
    }
    gaze.x = gaze.tx; gaze.y = gaze.ty;
    if (m.id === "wink" && T >= winkNext) { winkUntil = T + .45; winkNext = T + rnd(2.4, 3.6); }
    if (m.id === "sleepy" && T >= nodNext) nodNext = T + rnd(4.5, 7);
    EYES.forEach(function(E, k){ drawEye(E, dt, k); });
  } else drawMouth(dt);
  moodFx(); tickFx(dt);
  if (S.auto && T >= autoNext) { autoNext = T + rnd(4.2, 7); stepMood(1, true); }
  requestAnimationFrame(frame);
}
function start(){ if (running) return; running = true; last = 0; requestAnimationFrame(frame); }
function stop(){ running = false; }

/* ---------- moods, looks, messages ---------- */
function stepMood(dir, random){
  var list = S.mode === "eyes" ? EYE_MOODS : MOUTH_MOODS, cur = S.mode === "eyes" ? S.eyeMood : S.mouthMood, i = idx(list, cur);
  if (random) { var j; do { j = Math.floor(Math.random() * list.length); } while (j === i && list.length > 1); i = j; }
  else i = (i + dir + list.length) % list.length;
  setMood(list[i].id, true);
}
function setMood(id, quiet){
  if (S.mode === "eyes") { S.eyeMood = id; EYES.forEach(function(E){ E.nextBlink = T + .05; }); if (id === "wink") winkNext = T + .5; if (id === "sleepy") nodNext = T + 2.5; }
  else { S.mouthMood = id; M.kissT = T + .2; }
  fxNext = T + .25; save(); renderPanel();
  if (!quiet) haptic("light");
}
function stepLook(dir){
  if (S.mode === "eyes") S.eye = EYE_STYLES[(idx(EYE_STYLES, S.eye) + dir + EYE_STYLES.length) % EYE_STYLES.length].id;
  else S.lip = LIPS[(idx(LIPS, S.lip) + dir + LIPS.length) % LIPS.length].id;
  applyLook(); save(); renderPanel(); haptic("medium");
  hint(S.mode === "eyes" ? find(EYE_STYLES, S.eye).name + " eyes" : find(LIPS, S.lip).name + " lips", 1100);
}
function applyLook(){
  var sk = find(SKINS, S.skin).c, dark = lum(sk) < .3, st = find(EYE_STYLES, S.eye), lp = find(LIPS, S.lip);
  document.body.style.setProperty("--skin", sk);
  [].forEach.call(document.querySelectorAll(".lid0"), function(n){ n.setAttribute("stop-color", shade(sk, dark ? .035 : -.02)); });
  [].forEach.call(document.querySelectorAll(".lid1"), function(n){ n.setAttribute("stop-color", shade(sk, dark ? 0 : -.07)); });
  var line = dark ? "#08070d" : shade(sk, -.78), brow = dark ? "#0b0a12" : shade(sk, -.72);
  EYES.forEach(function(E){
    E.img.setAttribute("href", st.img);
    E.lineU.setAttribute("stroke", line); E.lineL.setAttribute("stroke", line); E.lashes.setAttribute("stroke", line);
    E.brow.setAttribute("stroke", st.robot ? "#59636f" : brow); E.brow.setAttribute("stroke-width", st.robot ? "24" : "30");
    E.veins.setAttribute("opacity", st.veins ? ".55" : "0");
  });
  el("sclEdge").setAttribute("stop-color", st.sclera);
  [].forEach.call(document.querySelectorAll(".lipA"), function(n){ n.setAttribute("stop-color", lp.a); });
  [].forEach.call(document.querySelectorAll(".lipB"), function(n){ n.setAttribute("stop-color", lp.b); });
  MP.mLipU.setAttribute("stroke", shade(lp.a, -.35)); MP.mLipL.setAttribute("stroke", shade(lp.a, -.35));
  MP.mDimL.setAttribute("stroke", shade(sk, dark ? .25 : -.3)); MP.mDimR.setAttribute("stroke", shade(sk, dark ? .25 : -.3));
  el("more").style.background = dark ? "rgba(255,255,255,.16)" : "rgba(0,0,0,.22)";
}
function setMode(m){
  S.mode = m; document.body.className = "mode-" + m;
  fx.forEach(function(f){ f.n.remove(); }); fx = [];
  save(); renderPanel();
}

var bubbleT = 0;
function say(text, mood){
  var b = el("bubble"), len = text.length;
  if (mood) {
    var list = S.mode === "eyes" ? EYE_MOODS : MOUTH_MOODS;
    if (list.some(function(x){ return x.id === mood; })) setMood(mood, true);
  }
  b.style.setProperty("--bfs", (len > 40 ? 26 : len > 22 ? 34 : len > 12 ? 42 : 52) + "px");
  b.textContent = text; b.classList.add("on"); haptic("medium");
  var dur = 1800 + Math.min(4200, len * 90);
  talkUntil = T + Math.min(3.2, .5 + len * .07); lookUpUntil = T + .9; gaze.next = 0;
  clearTimeout(bubbleT); bubbleT = setTimeout(function(){ b.classList.remove("on"); }, dur);
}

/* ---------- panel ---------- */
function chip(label, on, fn, extra){
  var b = document.createElement("button"); b.className = "chip" + (on ? " on" : ""); b.innerHTML = label; b.onclick = fn;
  if (extra) b.appendChild(extra);
  return b;
}
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]; }); }
function renderPanel(){
  [].forEach.call(el("seg").children, function(b){ b.classList.toggle("on", b.dataset.m === S.mode); });
  el("auto").classList.toggle("on", S.auto); el("auto").setAttribute("aria-pressed", S.auto ? "true" : "false");
  var moods = el("moods"); moods.innerHTML = "";
  (S.mode === "eyes" ? EYE_MOODS : MOUTH_MOODS).forEach(function(m){
    moods.appendChild(chip(m.e + " " + esc(m.name), m.id === (S.mode === "eyes" ? S.eyeMood : S.mouthMood), function(){ setMood(m.id); }));
  });
  var looks = el("looks"); looks.innerHTML = ""; el("lookLbl").textContent = S.mode === "eyes" ? "Eyes" : "Lips";
  if (S.mode === "eyes") EYE_STYLES.forEach(function(s){
    var b = document.createElement("button"); b.className = "sw img" + (s.id === S.eye ? " on" : ""); b.style.backgroundImage = "url(" + s.img + ")";
    b.setAttribute("aria-label", s.name + " eyes"); b.onclick = function(){ S.eye = s.id; applyLook(); save(); renderPanel(); haptic(); }; looks.appendChild(b);
  });
  else LIPS.forEach(function(s){
    var b = document.createElement("button"); b.className = "sw" + (s.id === S.lip ? " on" : ""); b.style.background = "linear-gradient(160deg," + s.b + "," + s.a + ")";
    b.setAttribute("aria-label", s.name + " lips"); b.onclick = function(){ S.lip = s.id; applyLook(); save(); renderPanel(); haptic(); }; looks.appendChild(b);
  });
  el("sizeRow").style.display = S.mode === "mouth" ? "" : "none";
  var sizes = el("sizes"); sizes.innerHTML = "";
  SIZES.forEach(function(z){ sizes.appendChild(chip(z.name, z.id === S.size, function(){ S.size = z.id; save(); renderPanel(); haptic(); })); });
  var skins = el("skins"); skins.innerHTML = "";
  SKINS.forEach(function(s){
    var b = document.createElement("button"); b.className = "sw" + (s.id === S.skin ? " on" : ""); b.style.background = s.c;
    b.setAttribute("aria-label", "Face colour " + s.id); b.onclick = function(){ S.skin = s.id; applyLook(); save(); renderPanel(); haptic(); }; skins.appendChild(b);
  });
  var msgs = el("msgs"); msgs.innerHTML = "";
  S.mine.forEach(function(t, i){
    var del = document.createElement("span"); del.className = "del"; del.textContent = "×"; del.setAttribute("aria-label", "Remove");
    del.onclick = function(ev){ ev.stopPropagation(); S.mine.splice(i, 1); save(); renderPanel(); };
    msgs.appendChild(chip(esc(t), false, function(){ hidePanel(); say(t); }, del));
  });
  MSGS[S.mode].forEach(function(m){ msgs.appendChild(chip(esc(m[0]), false, function(){ hidePanel(); say(m[0], m[1]); })); });
}
function showPanel(){ el("hint").classList.remove("on"); el("panel").classList.add("on"); el("more").classList.add("hide"); }
function hidePanel(){ el("panel").classList.remove("on"); el("more").classList.remove("hide"); el("msgIn").blur(); }
function addMine(){
  var v = el("msgIn").value.trim(); if (!v) return;
  S.mine.unshift(v.slice(0, 80)); S.mine = S.mine.slice(0, 30); el("msgIn").value = ""; save(); renderPanel(); hidePanel(); say(v);
}

var hintT = 0;
function hint(text, ms){ var h = el("hint"); h.textContent = text; h.classList.add("on"); clearTimeout(hintT); hintT = setTimeout(function(){ h.classList.remove("on"); }, ms || 3000); }

/* ---------- touch: tap = next mood, swipe = next look, hold = eyes follow ---------- */
var face = el("face"), down = null;
function toSvg(e){ var pt = face.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; var m = face.getScreenCTM(); return m ? pt.matrixTransform(m.inverse()) : { x:500, y:280 }; }
face.addEventListener("pointerdown", function(e){
  if (el("panel").classList.contains("on")) { hidePanel(); down = null; return; }
  down = { x:e.clientX, y:e.clientY, t:performance.now(), id:e.pointerId };
  try { face.setPointerCapture(e.pointerId); } catch(_){}
});
face.addEventListener("pointermove", function(e){
  if (!down || e.pointerId !== down.id) return;
  var dx = e.clientX - down.x, dy = e.clientY - down.y;
  if (S.mode === "eyes" && (performance.now() - down.t > 220 || Math.abs(dy) > 14 && Math.abs(dy) > Math.abs(dx))) { var p = toSvg(e); follow = { x:p.x, y:p.y }; }
});
function up(e){
  if (!down || e.pointerId !== down.id) return;
  var dx = e.clientX - down.x, dy = e.clientY - down.y, dt = performance.now() - down.t, wasFollow = !!follow;
  down = null; follow = null; gaze.next = 0;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.4 && dt < 900) { stepLook(dx < 0 ? 1 : -1); return; }
  if (!wasFollow && dt < 380 && Math.abs(dx) < 16 && Math.abs(dy) < 16) {
    if (S.auto) autoNext = T + 6;
    stepMood(1); var mm = S.mode === "eyes" ? eyeMood() : mouthMood(); hint(mm.e + " " + mm.name, 900);
  }
}
face.addEventListener("pointerup", up);
face.addEventListener("pointercancel", function(){ down = null; follow = null; });

el("more").onclick = function(){ showPanel(); haptic(); };
el("closeP").onclick = hidePanel;
el("seg").onclick = function(e){ var b = e.target.closest("button"); if (b && b.dataset.m !== S.mode) { setMode(b.dataset.m); haptic(); } };
el("auto").onclick = function(){ S.auto = !S.auto; autoNext = T + 1.5; save(); renderPanel(); haptic(); };
el("msgAdd").onclick = addMine;
el("msgIn").addEventListener("keydown", function(e){ if (e.key === "Enter") { e.preventDefault(); addMine(); } });
el("panel").addEventListener("pointerdown", function(e){ e.stopPropagation(); });

/* Keyboard (Mac): space = next mood, arrows = look, M = eyes/mouth, Esc = controls */
document.addEventListener("keydown", function(e){
  if (e.target && e.target.tagName === "INPUT") { if (e.key === "Escape") hidePanel(); return; }
  if (e.key === " ") { e.preventDefault(); stepMood(1); }
  else if (e.key === "ArrowRight") stepLook(1); else if (e.key === "ArrowLeft") stepLook(-1);
  else if (e.key === "m" || e.key === "M") setMode(S.mode === "eyes" ? "mouth" : "eyes");
  else if (e.key === "Escape") { if (el("panel").classList.contains("on")) hidePanel(); else showPanel(); }
});

/* ---------- full screen in MyLLM ---------- */
/* Only where the app can also close itself: full screen hides MyLLM's Done button. */
var canFull = !!(window.myllmImmersive && window.myllmClose);
function syncChrome(){
  if (!canFull) return;
  try { myllmImmersive(true, { keepAwake:true }).catch(function(){}); } catch(_){}
}
if (canFull) { el("exit").hidden = false; el("exit").onclick = function(){ try { myllmClose(); } catch(_){} }; }
document.addEventListener("visibilitychange", function(){
  if (document.hidden) stop(); else { syncChrome(); start(); }
});

function orient(){
  if (innerHeight > innerWidth * 1.05) hint("Turn your phone sideways for the full effect ↻", 3200);
}
addEventListener("resize", function(){ clearTimeout(orient.t); orient.t = setTimeout(orient, 400); });

load("ff1").then(function(v){
  try { var o = JSON.parse(v || "null"); if (o && typeof o === "object") for (var k in S) if (k in o && typeof o[k] === typeof S[k]) S[k] = o[k]; } catch(_){}
  if (!Array.isArray(S.mine)) S.mine = [];
  document.body.className = "mode-" + S.mode;
  applyLook(); renderPanel(); syncChrome(); start();
  if (innerHeight > innerWidth * 1.05) orient();
  else if (!v) hint("Tap for a new mood · swipe for a new look", 3400);
});
</script>
</body></html>
