--><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Plant Doctor</title>
<meta name="myllm:immersive" content="on">
<style>:root{--build-id:"5ebac3aa46";color-scheme:light dark;
  --bg:var(--myllm-bg,#f2f2f7); --surface:var(--myllm-surface,#fff); --ink:var(--myllm-text,#111);
  --muted:var(--myllm-muted,#8a8a8e); --line:var(--myllm-border,#e3e3e8); --acc:var(--myllm-accent,#0a84ff);
  --fill:rgba(120,120,128,.12); --h:135; }
@media (prefers-color-scheme:dark){ :root{ --bg:var(--myllm-bg,#000); --surface:var(--myllm-surface,#1c1c1e);
  --ink:var(--myllm-text,#f2f2f7); --muted:var(--myllm-muted,#8e8e93); --line:var(--myllm-border,#2c2c2e); --fill:rgba(120,120,128,.24); } }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ font-family:var(--myllm-font,-apple-system,system-ui,sans-serif); background:var(--bg); color:var(--ink);
    max-width:600px; margin:0 auto; min-height:100dvh; font-size:15.5px; line-height:1.4;
    padding:calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(30px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left)); }
  @media (min-width:768px){ body{ max-width:680px; } }
  svg.i{ width:1.25em; height:1.25em; fill:currentColor; flex-shrink:0; }
  button{ font:inherit; color:inherit; cursor:pointer; } button:active{ transform:scale(.96); }

  .head{ display:flex; align-items:center; gap:12px; margin:2px 2px 14px; }
  .tile{ display:flex; align-items:center; justify-content:center; color:#fff; flex-shrink:0;
    background:linear-gradient(145deg, hsl(var(--h) 55% 44%), hsl(calc(var(--h) + 30) 55% 28%)); }
  .head .tile{ width:44px; height:44px; border-radius:13px; font-size:19px; }
  .head .ht{ flex:1; min-width:0; }
  h1{ font-size:22px; font-weight:800; letter-spacing:-.01em; }
  .head p{ font-size:13px; color:var(--muted); margin-top:1px; }

  .acts{ display:grid; gap:12px; }
  @media (min-width:560px){ .acts{ grid-template-columns:1fr 1fr; } }
  .snap{ width:100%; border:0; border-radius:20px; padding:20px 18px; color:#fff; text-align:left; display:flex; align-items:center; gap:14px; min-height:96px; }
  .snap.id{ background:linear-gradient(145deg, hsl(135 55% 44%), hsl(160 55% 28%)); box-shadow:0 12px 30px hsl(145 60% 30% / .28); }
  .snap.dx{ background:linear-gradient(145deg, hsl(205 80% 50%), hsl(230 65% 36%)); box-shadow:0 12px 30px hsl(215 70% 35% / .28); }
  .snap .cam{ width:56px; height:56px; border-radius:18px; background:rgba(255,255,255,.2); border:1px solid rgba(255,255,255,.3);
    display:flex; align-items:center; justify-content:center; font-size:24px; flex-shrink:0; }
  .snap b{ display:block; font-size:18px; font-weight:800; letter-spacing:-.01em; }
  .snap span{ display:block; font-size:13px; opacity:.88; margin-top:2px; }
  .note{ font-size:12.5px; color:var(--muted); text-align:center; line-height:1.5; margin:14px 8px 0; }

  .card{ background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:16px; margin-top:12px; }
  .card .top{ display:flex; align-items:center; gap:11px; margin-bottom:10px; }
  .card .top .tile{ width:36px; height:36px; border-radius:10px; font-size:15px; }
  .card .top .tile.dx{ background:linear-gradient(145deg, hsl(205 80% 50%), hsl(230 65% 36%)); }
  .card .top b{ font-size:17px; font-weight:750; }
  .answer{ font-size:16px; line-height:1.6; white-space:pre-wrap; overflow-wrap:anywhere; }
  .go{ width:100%; min-height:48px; margin-top:14px; border:none; border-radius:14px; font-size:15.5px; font-weight:700;
    display:flex; align-items:center; justify-content:center; gap:8px; background:hsl(var(--h) 55% 45% / .14); color:hsl(var(--h) 60% 28%); }
  @media (prefers-color-scheme:dark){ .go{ color:hsl(var(--h) 60% 62%); } }

  .busy .top b{ display:flex; align-items:center; gap:9px; }
  .spin{ width:16px; height:16px; border-radius:50%; border:2.4px solid currentColor; border-right-color:transparent; animation:spin .8s linear infinite; flex-shrink:0; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .skel{ height:14px; border-radius:7px; background:var(--fill); margin-top:10px; animation:shimmer 1.4s ease-in-out infinite; }
  .skel.w8{ width:80%; } .skel.w6{ width:60%; } .skel.w9{ width:92%; }
  @keyframes shimmer{ 50%{ opacity:.45; } }
  .warn{ display:flex; gap:10px; align-items:flex-start; }
  .warn svg{ color:#ff9f0a; margin-top:2px; font-size:18px; }
  .warn p{ font-size:14.5px; line-height:1.5; }
  .warn p b{ display:block; font-size:15.5px; margin-bottom:2px; }

  [hidden]{ display:none !important; }
  @media (prefers-reduced-motion:reduce){ .spin{ animation-duration:2.4s; } .skel{ animation:none; } button:active{ transform:none; } }

/* myllm-fullscreen-v1 — MyLLM 5.6.2+ opens this app full screen; the ✕ is the way out. */
.head .imm-acts{display:none;flex-shrink:0;margin-left:auto}
.head .acts + .imm-acts{margin-left:0}
body.imm .head .imm-acts{display:flex}
.head .imm-acts button{width:40px;height:40px;border-radius:12px;border:1px solid var(--myllm-border,rgba(128,128,128,.28));
  background:var(--myllm-surface,rgba(128,128,128,.12));color:var(--myllm-text,currentColor);display:grid;place-items:center;padding:0;cursor:pointer;transition:transform .12s}
.head .imm-acts button:active,.head .imm-x:active{transform:scale(.94)}
.head .imm-x{display:none !important}
body.imm .head .imm-x{display:grid !important;place-items:center}
.imm-x svg,.imm-acts svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}
.imm-safe{display:none}
body.imm .imm-safe{display:block}
</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-leaf" viewBox="0 0 24 24"><path d="M20.5 3.5c-8.6-.4-15 3.3-15.7 10.3-.2 1.8.3 3.4 1.2 4.6L4.3 20a1 1 0 1 0 1.4 1.4l1.6-1.6c1.2.9 2.8 1.4 4.6 1.2 7-.7 10.7-7.1 10.3-15.7a1.9 1.9 0 0 0-1.7-1.8zM8.7 17.1l6.2-6.2a1 1 0 0 0-1.4-1.4l-6.2 6.2c-.2-.5-.3-1.2-.2-1.9.5-5 4.9-8 11.4-8.2-.2 6.5-3.2 10.9-8.2 11.4-.7.1-1.2 0-1.6-.1z" fill="currentColor"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><path d="M10.5 3a7.5 7.5 0 0 1 5.96 12.05l4.25 4.24a1 1 0 0 1-1.42 1.42l-4.24-4.25A7.5 7.5 0 1 1 10.5 3zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11z" fill="currentColor"/></symbol>
  <symbol id="i-steth" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3H5a1 1 0 0 0-1 1v5a5 5 0 0 0 10 0V4a1 1 0 0 0-1-1h-1"/><path d="M9 14v1a5 5 0 0 0 10 0v-2"/><circle cx="19" cy="11" r="2"/></g></symbol>
  <symbol id="i-cam" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 8.5A1.5 1.5 0 0 1 5.5 7H8l1.5-2h5L16 7h2.5A1.5 1.5 0 0 1 20 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.5z"/><circle cx="12" cy="13" r="3.5"/></g></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M14.5 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-warn" viewBox="0 0 24 24"><path d="M10.3 3.9a2 2 0 0 1 3.4 0l8 13.6a2 2 0 0 1-1.7 3H4a2 2 0 0 1-1.7-3zM12 9a1 1 0 0 0-1 1v4a1 1 0 0 0 2 0v-4a1 1 0 0 0-1-1zm0 7.2a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4z" fill="currentColor"/></symbol>
</defs></svg>

<div class="imm-safe"></div><div class="head">
  <div class="tile"><svg class="i"><use href="#i-leaf"/></svg></div>
  <div class="ht"><h1>Plant Doctor</h1><p>Point your camera at a plant — get an ID or a diagnosis.</p></div>
<div class="imm-acts"><button type="button" aria-label="Close Plant Doctor" onclick="myllmFSClose()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div></div>

<div id="home">
  <div class="acts">
    <button class="snap id" id="idBtn" type="button">
      <span class="cam"><svg class="i"><use href="#i-search"/></svg></span>
      <span><b>Identify a plant</b><span>Name, species and care tips</span></span>
    </button>
    <button class="snap dx" id="dxBtn" type="button">
      <span class="cam"><svg class="i"><use href="#i-steth"/></svg></span>
      <span><b>What's wrong with my plant?</b><span>Likely causes and a fix for each</span></span>
    </button>
  </div>
  <p class="note" id="hint">Uses your camera and your AI, privately on your device. Needs the latest MyLLM with “Allow apps to use the AI” on.</p>
</div>
<div id="out"></div>

<script>
function el(id){return document.getElementById(id)}
/* Bridges are looked up when used, never kept: MyLLM can add them after this
   script has run. */
function haptic(k){if(window.myllmHaptic)try{myllmHaptic(k)}catch(e){}}

var PROMPTS = {
  identify: 'You are an expert botanist. Identify the plant in this photo. Reply concisely with: common name, scientific name, and 3 short care tips (light, water, one thing to watch for). If the image is not a plant, say so politely.',
  diagnose: 'You are a plant-care expert. Examine this plant photo and diagnose likely problems (pests, over/under-watering, light, nutrients, disease). Give the 2-3 most likely causes, each with a short fix. Be concise and practical.'
};

function icon(n){return '<svg class="i"><use href="#i-'+n+'"/></svg>'}
function tileFor(mode){return '<div class="tile'+(mode==='diagnose'?' dx':'')+'">'+icon(mode==='diagnose'?'steth':'leaf')+'</div>'}
function card(html){el('out').innerHTML='';var d=document.createElement('div');d.className='card';d.innerHTML=html;el('out').appendChild(d);return d}
function home(){el('out').innerHTML='';el('home').hidden=false}

function ask(mode){
  var VISION=window.myllmVision;
  if(!VISION){
    el('home').hidden=false;
    card('<div class="warn">'+icon('warn')+'<p><b>Your AI can’t see photos here yet</b>This needs the latest MyLLM with “Allow apps to use the AI” enabled in Settings.</p></div>');
    return;
  }
  haptic('light');
  /* The camera opens over the page; this card waits underneath for the answer. */
  el('home').hidden=true;
  card('<div class="busy"><div class="top">'+tileFor(mode)+'<b><i class="spin"></i>'+(mode==='diagnose'?'Examining your plant…':'Looking at your plant…')+'</b></div>'+
    '<div class="skel w9"></div><div class="skel w8"></div><div class="skel w6"></div><div class="skel w8"></div></div>');
  var p;
  try{ p=VISION(PROMPTS[mode]); }catch(e){ fail(mode,(e&&e.message)?e.message:'Something went wrong.'); return; }
  Promise.resolve(p).then(function(answer){
    if(answer == null){ home(); return; } // cancelled
    show(mode, answer);
  }).catch(function(e){
    fail(mode,(e && e.message) ? e.message : 'Something went wrong.');
  });
}

function show(mode, text){
  el('home').hidden=true;
  var d=card('<div class="top">'+tileFor(mode)+'<b>'+(mode==='identify'?'Plant ID':'Diagnosis')+'</b></div><div class="answer"></div>'+
    '<button class="go" type="button">'+icon('back')+'Check another plant</button>');
  d.querySelector('.answer').textContent = text;
  d.querySelector('button').onclick = home;
  haptic('success');
  window.scrollTo(0,0);
}
function fail(mode,msg){
  el('home').hidden=true;
  var d=card('<div class="warn">'+icon('warn')+'<p><b>Couldn’t read that photo</b><span></span></p></div>'+
    '<button class="go" type="button">'+icon('cam')+'Try again</button>'+
    '<button class="go" type="button" style="background:var(--fill);color:var(--ink)">'+icon('back')+'Back</button>');
  d.querySelector('.warn span').textContent=msg;
  var b=d.querySelectorAll('button');
  b[0].onclick=function(){ home(); ask(mode); };
  b[1].onclick=home;
}
el('idBtn').onclick=function(){ask('identify')};
el('dxBtn').onclick=function(){ask('diagnose')};

/* myllm-fullscreen-v1 — full screen where MyLLM can also close the app for us (myllmClose,
   5.6.2+): full screen hides MyLLM's Done, and a page with no way out is
   worse than a repeated title, so elsewhere nothing changes. The spacer keeps
   the header clear of the status bar only if the page doesn't already. */
(function(){
  function full(){ return !!(window.myllmClose && window.myllmImmersive); }
  function inset(){
    var p = document.createElement("div");
    p.style.cssText = "position:fixed;top:0;left:0;width:1px;visibility:hidden;height:env(safe-area-inset-top)";
    document.body.appendChild(p); var h = p.offsetHeight; p.parentNode.removeChild(p); return h;
  }
  function fit(){
    var sp = document.querySelector(".imm-safe"), head = document.querySelector(".head");
    if (!sp || !head) return;
    sp.style.height = "0px";
    if (!document.body.classList.contains("imm")) return;
    var need = inset() + 6 - (head.getBoundingClientRect().top + window.scrollY);
    sp.style.height = Math.max(0, Math.round(need)) + "px";
  }
  function sync(){
    var f = full();
    document.body.classList.toggle("imm", f);
    fit();
    if (!f) return;
    try { window.myllmImmersive(true, { keepAwake:false }).catch(function(){}); } catch(e){}
  }
  window.myllmFSClose = function(){
    try { if (window.myllmHaptic) window.myllmHaptic("light"); } catch(e){}
    try { window.myllmClose().catch(function(){}); } catch(e){}
  };
  document.addEventListener("visibilitychange", function(){ if (!document.hidden) sync(); });
  window.addEventListener("resize", fit);
  sync();
})();
</script></body></html>
