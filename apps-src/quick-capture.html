<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Quick Capture</title>
<style>
  :root{
    --bg: var(--myllm-bg, #f6f7f9);
    --surface: var(--myllm-surface, #ffffff);
    --text: var(--myllm-text, #11131a);
    --muted: var(--myllm-muted, #6b7280);
    --accent: var(--myllm-accent, #4f7cff);
    --border: var(--myllm-border, rgba(0,0,0,.10));
    --radius: var(--myllm-radius, 14px);
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg: var(--myllm-bg,#0e0f13); --surface: var(--myllm-surface,#1a1c22); --text: var(--myllm-text,#f3f4f7); --muted: var(--myllm-muted,#a4abba); --border: var(--myllm-border,rgba(255,255,255,.14)); }
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; }
  body{
    background:var(--bg); color:var(--text);
    font-family:var(--myllm-font, -apple-system,system-ui,'Segoe UI',Roboto,sans-serif);
    display:flex; flex-direction:column; padding:max(16px,env(safe-area-inset-top)) 16px 16px;
    user-select:none; -webkit-user-select:none;
  }
  h1{ font-size:24px; margin:0 0 2px; }
  .sub{ color:var(--muted); font-size:13px; margin-bottom:14px; }
  textarea{
    flex:1; width:100%; font:inherit; font-size:17px; line-height:1.5; color:var(--text);
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:14px; outline:none; resize:none; user-select:text; -webkit-user-select:text;
  }
  textarea:focus{ border-color:var(--accent); }
  .row{ display:flex; gap:10px; margin-top:12px; }
  button{ font:inherit; cursor:pointer; border:0; border-radius:var(--radius); padding:14px 16px; font-weight:700; font-size:16px; }
  .primary{ flex:1; background:var(--accent); color:#fff; }
  .ghost{ background:transparent; color:var(--accent); box-shadow:inset 0 0 0 1.5px var(--border); }
  .toast{
    position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(20px);
    background:var(--text); color:var(--bg); padding:10px 16px; border-radius:999px; font-size:14px;
    opacity:0; transition:opacity .2s, transform .2s; pointer-events:none; max-width:84%; text-align:center;
  }
  .toast.show{ opacity:1; transform:translateX(-50%); }

  /* iPad / large screens: a centred, comfortable column (the textarea grows to
     fill the height) rather than an over-wide stretch. */
  @media (min-width: 768px){
    body{ max-width: 760px; margin-inline: auto; padding-left:24px; padding-right:24px; }
    h1{ font-size:30px; }
    textarea{ font-size:19px; }
    button{ font-size:18px; }
  }
</style>
</head>
<body>
<h1>⚡ Quick Capture</h1>
<div class="sub">Jot anything. Send a line straight to your Shopping List.</div>

<textarea id="note" placeholder="milk&#10;eggs&#10;coffee&#10;&#10;Type items (one per line), then send to your list…"></textarea>

<div class="row">
  <button class="primary" id="send" type="button">Send to Shopping List</button>
  <button class="ghost" id="clear" type="button">Clear</button>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  function toast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(t._t); t._t = setTimeout(function(){ t.classList.remove('show'); }, 2200);
  }
  function haptic(s){ try{ if(window.myllmHaptic) myllmHaptic(s); }catch(e){} }

  document.getElementById('clear').addEventListener('click', function(){
    document.getElementById('note').value = '';
    document.getElementById('note').focus();
  });

  // #1 intent bus — hand the text off to whichever app handles "add-item"
  // (the Shopping List). The OS opens it and delivers the payload.
  document.getElementById('send').addEventListener('click', async function(){
    var text = document.getElementById('note').value.trim();
    if(!text){ toast('Type something first.'); return; }
    if(!window.myllmIntent){ toast('Open this inside MyLLM to send to other apps.'); return; }
    try{
      await myllmIntent.send('add-item', { text: text });
      haptic('success');
      // (We usually won't see this — the list app takes over the screen.)
      toast('Sent to Shopping List ✓');
    }catch(e){
      haptic('error');
      toast(e && e.message ? e.message : 'No app can receive that yet — install Shopping List.');
    }
  });
})();
</script>
</body>
</html>
