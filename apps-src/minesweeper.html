<title>Minesweeper</title>
<style>
  :root { color-scheme: light dark; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  html,body{ height:100%; }
  body{ font-family:var(--myllm-font,-apple-system,system-ui,sans-serif); background:#0b0b10; color:#fff; overflow:hidden; overscroll-behavior:none; }

  /* The stage: a hue-tinted backdrop in two layers, dark and light, so the
     change between them can fade. */
  .stage{ position:fixed; inset:0; --h:355; color:#fff; }
  .bg{ position:absolute; inset:0; transition:opacity .6s ease; }
  .bg.d{ background:radial-gradient(120% 90% at 20% 10%, hsl(var(--h) 62% 30%), transparent 60%),
      radial-gradient(120% 90% at 85% 95%, hsl(calc(var(--h) - 70) 55% 26%), transparent 62%), #0b0b10; }
  .bg.l{ opacity:0; background:radial-gradient(120% 90% at 20% 0%, hsl(var(--h) 85% 88%), transparent 60%),
      radial-gradient(120% 90% at 85% 100%, hsl(calc(var(--h) - 70) 78% 88%), transparent 62%), #f4f4f8; }
  .lite{ color:#15151a; } .lite .bg.l{ opacity:1; } .lite .bg.d{ opacity:0; }

  .col{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
    padding:calc(10px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left)); }
  .top{ width:100%; max-width:600px; height:44px; display:flex; align-items:center; justify-content:space-between; gap:8px; flex-shrink:0; }
  .lbl{ font-size:11px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; opacity:.62; }
  .glass{ border:1px solid rgba(255,255,255,.16); background:rgba(255,255,255,.12); color:inherit;
    -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px); }
  .lite .glass{ border-color:rgba(0,0,0,.09); background:rgba(255,255,255,.62); }
  svg{ width:1.25em; height:1.25em; fill:currentColor; flex-shrink:0; }
  button{ font:inherit; }
  .rnd{ width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0; }
  .hud{ height:44px; border-radius:99px; padding:0 14px; display:flex; align-items:center; gap:12px; font-size:15px; font-weight:800; font-variant-numeric:tabular-nums; }
  .hud span{ display:inline-flex; align-items:center; gap:5px; } .hud svg{ font-size:13px; opacity:.75; }
  .top .hide{ visibility:hidden; }

  .mid{ position:relative; flex:1; min-height:0; width:100%; max-width:600px; display:flex; flex-direction:column; align-items:center; gap:12px; margin-top:8px; }
  /* The field never shrinks a square below a fingertip: when a size can't fit,
     it scrolls both ways inside this box and the page stays still. */
  .scroller{ flex:1; min-height:0; width:100%; position:relative; overflow:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; display:flex; }
  #grid{ display:grid; gap:2px; margin:auto; padding:7px; border-radius:16px; background:rgba(10,10,16,.42); border:1px solid rgba(255,255,255,.12);
    box-shadow:0 18px 44px rgba(0,0,0,.35); touch-action:pan-x pan-y; transition:filter .3s, background .6s; flex-shrink:0; }
  .lite #grid{ background:rgba(255,255,255,.55); border-color:rgba(0,0,0,.06); box-shadow:0 18px 40px rgba(20,20,40,.14); }
  .veil #grid{ filter:blur(9px) saturate(.7); pointer-events:none; }       /* a paused field can't be studied */
  .sq{ width:var(--c,32px); height:var(--c,32px); border:none; border-radius:7px; padding:0; display:flex; align-items:center; justify-content:center;
    font-size:calc(var(--c,32px) * .52); font-weight:800; color:transparent;
    background:linear-gradient(180deg, rgba(255,255,255,.30), rgba(255,255,255,.17)); box-shadow:inset 0 1px 0 rgba(255,255,255,.28), inset 0 -2px 0 rgba(0,0,0,.22); }
  .lite .sq{ background:linear-gradient(180deg, #fff, #e6e6ee); box-shadow:inset 0 -2px 0 rgba(20,20,40,.13), 0 1px 2px rgba(20,20,40,.12); }
  .sq svg{ font-size:calc(var(--c,32px) * .5); }
  .sq.open{ background:rgba(0,0,0,.26); box-shadow:none; }
  .lite .sq.open{ background:rgba(20,20,40,.07); box-shadow:none; }
  .sq.open.n1{ color:#64b5ff; } .sq.open.n2{ color:#5bdc7a; } .sq.open.n3{ color:#ff7a70; } .sq.open.n4{ color:#b3b1ff; }
  .sq.open.n5{ color:#ddb388; } .sq.open.n6{ color:#62dcee; } .sq.open.n7{ color:#ffb84d; } .sq.open.n8{ color:#d1d1d6; }
  .lite .sq.open.n1{ color:#0a6fe0; } .lite .sq.open.n2{ color:#1f8a3c; } .lite .sq.open.n3{ color:#e0281e; } .lite .sq.open.n4{ color:#4b49d1; }
  .lite .sq.open.n5{ color:#8a6a42; } .lite .sq.open.n6{ color:#11879c; } .lite .sq.open.n7{ color:#c76f00; } .lite .sq.open.n8{ color:#6c6c72; }
  .sq.flag{ color:#ff9f0a; } .sq.mine{ color:inherit; background:rgba(0,0,0,.26); box-shadow:none; }
  .lite .sq.mine{ background:rgba(20,20,40,.07); }
  .sq.boom{ background:#ff3b30 !important; color:#fff; box-shadow:none; }

  .tools{ width:100%; flex-shrink:0; }
  .toolrow{ display:flex; gap:8px; }
  .toolrow button{ flex:1; height:50px; border-radius:99px; font-size:14.5px; font-weight:750; display:flex; align-items:center; justify-content:center; gap:7px; }
  .toolrow button.flagmode{ background:#ff9f0a; border-color:#ff9f0a; color:#fff; }
  .toolrow button:active, .rnd:active, .sheet button:active, .result button:active{ transform:scale(.96); }
  .note{ text-align:center; font-size:12px; opacity:.55; margin-top:9px; line-height:1.45; }

  /* Win or lose, the result sits under the field so the whole field stays in view. */
  .result{ display:none; border-radius:22px; padding:14px 16px; text-align:center; }
  .over .result{ display:block; } .over .toolrow, .over .note{ display:none; }
  .result .kick{ margin-bottom:2px; } .result h2{ font-size:22px; font-weight:800; letter-spacing:-.01em; }
  .result p{ font-size:13.5px; opacity:.72; margin-top:3px; }
  .result .row{ display:flex; gap:8px; margin-top:12px; }
  .result button{ flex:1; height:48px; border-radius:99px; font-size:15.5px; font-weight:750; display:flex; align-items:center; justify-content:center; gap:7px; }

  /* One glass card over the field: title and paused. */
  .sheet{ position:absolute; left:50%; top:50%; width:min(310px, calc(100% - 16px)); transform:translate(-50%,-50%) scale(.96); opacity:0; pointer-events:none; z-index:5;
    border-radius:26px; padding:22px 18px 18px; text-align:center; box-shadow:0 24px 60px rgba(0,0,0,.35);
    transition:opacity .28s ease, transform .28s cubic-bezier(.2,.8,.2,1); }
  .sheet.on{ opacity:1; transform:translate(-50%,-50%); pointer-events:auto; }
  .lite .sheet{ box-shadow:0 22px 50px rgba(20,20,40,.18); }
  .sheet h1{ font-size:28px; font-weight:800; letter-spacing:-.02em; }
  .sheet p{ font-size:13.5px; line-height:1.4; opacity:.72; margin-top:6px; }
  .kick{ font-size:11px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; opacity:.62; }
  .big{ font-size:50px; font-weight:800; line-height:1.05; letter-spacing:-.03em; font-variant-numeric:tabular-nums; margin-top:4px; }
  .best{ display:block; margin-top:10px; font-size:11.5px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; opacity:.7; min-height:15px; }
  .new{ display:inline-block; color:#0b0b10; background:#ffd60a; border-radius:99px; padding:4px 10px; font-size:11px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; }
  .sizes{ display:flex; border-radius:99px; padding:3px; margin-top:14px; }
  .sizes button{ flex:1; border:none; background:none; color:inherit; opacity:.7; border-radius:99px; height:38px; font-size:12.5px; font-weight:750;
    display:flex; align-items:center; justify-content:center; gap:4px; }
  .sizes button{ flex-direction:column; gap:0; line-height:1.1; } .sizes button small{ font-size:10px; font-weight:750; opacity:.65; }
  .sizes button.on{ background:#fff; color:#0b0b10; opacity:1; } .lite .sizes button.on{ background:#15151a; color:#fff; }
  .sheet .act{ width:100%; height:50px; border-radius:99px; margin-top:10px; font-size:16px; font-weight:750; display:flex; align-items:center; justify-content:center; gap:8px; }
  .sheet .act.first{ margin-top:16px; }
  .pri{ border:none; background:#fff; color:#0b0b10; box-shadow:0 10px 30px rgba(0,0,0,.3); }
  .lite .pri{ background:#15151a; color:#fff; box-shadow:0 10px 26px rgba(20,20,40,.22); }

  @media (max-height:520px){                       /* phone on its side: field left, tools right */
    .mid{ flex-direction:row; align-items:stretch; max-width:none; } .tools{ width:min(280px,36vw); align-self:center; }
    .toolrow{ flex-direction:column; } .toolrow button{ flex:none; height:46px; }
    .sheet{ padding:14px 16px; } .sheet h1{ font-size:22px; } .sheet p{ display:none; } .big{ font-size:34px; }
    .sizes{ margin-top:10px; } .sheet .act{ height:42px; margin-top:8px; } .sheet .act.first{ margin-top:10px; }
    .result .row{ flex-direction:column; }
  }
</style>

  <symbol id="i-flag" viewBox="0 0 24 24"><path d="M6 2.5a1.1 1.1 0 0 0-1.1 1.1v16.8a1.1 1.1 0 0 0 2.2 0v-5.6h10.6a.9.9 0 0 0 .72-1.44L15.4 9.3l3.02-4.06A.9.9 0 0 0 17.7 3.8H7.1v-.2A1.1 1.1 0 0 0 6 2.5z"/></symbol>

<div class="stage" id="stage">
  <div class="bg d"></div><div class="bg l"></div>
  <div class="col">
    <div class="top">
      <button class="glass rnd hide" id="bPause" aria-label="Pause"><svg><use href="#i-pause"/></svg></button>
      <div class="lbl">Minesweeper</div>
      <div class="glass hud hide" id="hud"><span id="mines"></span><span id="clock"></span></div>
    </div>
    <div class="mid">
      <div class="scroller" id="scroller">
        <div id="grid"></div>
      </div>
      <div class="sheet glass" id="sheet"></div>
      <div class="tools" id="tools">
        <div class="toolrow">
          <button class="glass" id="flagBtn" onclick="toggleFlagMode()"></button>
          <button class="glass" onclick="newGame()"><svg><use href="#i-again"/></svg>New game</button>
        </div>
        <p class="note">Tap to dig · long-press (or flag mode) to plant a flag<br>Your first tap is always safe.</p>
        <div class="glass result" id="result">
          <div class="kick" id="ovkick"></div>
          <h2 id="ovtitle"></h2>
          <p id="ovtext"></p>
          <div class="row">
            <button class="pri" onclick="newGame()"><svg><use href="#i-again"/></svg>Play again</button>
            <button class="glass" onclick="home()">Done</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
/* Bridges are looked up when used, never kept: MyLLM can add them after this
   script has run. */
function haptic(k){ if(window.myllmHaptic){ try{ myllmHaptic(k||'light'); }catch(_){} } }
function load(k){ var s = window.myllmStorage; return s ? s.getItem(k).catch(function(){ return null; }) : Promise.resolve(null); }
function keep(k, v){ var s = window.myllmStorage; if (s) try { s.setItem(k, v).catch(function(){}); } catch(_){} }
function el(id){ return document.getElementById(id); }
function icon(id){ return '<svg><use href="#i-' + id + '"/></svg>'; }

var SIZES = [
  {id:"s", name:"Small",  cols:9,  rows:9,  mines:10},
  {id:"m", name:"Medium", cols:11, rows:13, mines:24},
  {id:"l", name:"Large",  cols:13, rows:16, mines:40}
];
var size = SIZES[0];
var best = {};            /* sizeId -> seconds */

/* board[i] = {mine, open, flag, n} — index = r*cols + c */
var board = [], started = false, over = false, flagMode = false;
var flags = 0, opened = 0, startAt = 0, clockId = null;
var pressTimer = null, pressFired = false;
var state = "home";       /* home · play */
var paused = false, pausedAt = 0;

function idx(r, c){ return r * size.cols + c; }
function inb(r, c){ return r >= 0 && r < size.rows && c >= 0 && c < size.cols; }
function neighbours(i){
  var r = Math.floor(i / size.cols), c = i % size.cols, out = [];
  for (var dr = -1; dr <= 1; dr++)
    for (var dc = -1; dc <= 1; dc++)
      if ((dr || dc) && inb(r + dr, c + dc)) out.push(idx(r + dr, c + dc));
  return out;
}

/* ---------- look ---------- */
function isLight(){ return !(window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches); }
/* A game in progress takes the whole display and goes dark. Where MyLLM can't
   hide its own title bar, a dark stage under a white bar looks cut in half —
   so in light mode, without myllmImmersive, the stage stays light. */
function syncLook(){
  var s = el("stage");
  s.classList.toggle("lite", isLight() && !(state !== "home" && window.myllmImmersive));
  s.classList.toggle("veil", state === "home" || paused);
  s.classList.toggle("over", over && state === "play");
  el("bPause").classList.toggle("hide", state !== "play" || paused || over);
  el("hud").classList.toggle("hide", state !== "play");
  el("tools").style.visibility = state === "play" && !paused ? "" : "hidden";
}
function syncChrome(){
  if (!window.myllmImmersive) return;
  try { myllmImmersive(state !== "home", {keepAwake:false}).catch(function(){}); } catch(_){}
}
/* Squares fill the room they're given but never drop under 28px. */
function fit(){
  var sc = el("scroller"), gap = 2, pad = 16;
  var w = (sc.clientWidth - pad - gap * (size.cols - 1)) / size.cols, h = (sc.clientHeight - pad - gap * (size.rows - 1)) / size.rows;
  var c = Math.max(28, Math.min(46, Math.floor(Math.min(w, h))));
  el("grid").style.setProperty("--c", c + "px");
}

function showClock(){
  var secs = started ? Math.floor(((paused ? pausedAt : (over ? endAt : Date.now())) - startAt) / 1000) : 0;
  el("clock").innerHTML = icon("clock") + secs;
}
var endAt = 0;

function newGame(){
  board = [];
  for (var i = 0; i < size.rows * size.cols; i++) board.push({mine:false, open:false, flag:false, n:0});
  started = false; over = false; flags = 0; opened = 0; paused = false;
  if (clockId){ clearInterval(clockId); clockId = null; }
  haptic("light");
  if (state === "play"){ el("sheet").classList.remove("on"); }
  fit(); render(); showClock(); syncLook();
  el("scroller").scrollTop = 0; el("scroller").scrollLeft = 0;
}

/* mines are laid AFTER the first tap, keeping it (and its ring) safe */
function layMines(safe){
  var forbidden = {}; forbidden[safe] = true;
  neighbours(safe).forEach(function(n){ forbidden[n] = true; });
  var laid = 0;
  while (laid < size.mines){
    var i = Math.floor(Math.random() * board.length);
    if (board[i].mine || forbidden[i]) continue;
    board[i].mine = true; laid++;
  }
  for (var j = 0; j < board.length; j++){
    board[j].n = neighbours(j).filter(function(n){ return board[n].mine; }).length;
  }
  started = true;
  startAt = Date.now();
  clockId = setInterval(function(){ if (!over && !paused) showClock(); }, 1000);
}

function dig(i){
  if (over || board[i].open || board[i].flag) return;
  if (!started) layMines(i);
  if (board[i].mine){ return lose(i); }
  /* flood reveal */
  var queue = [i];
  while (queue.length){
    var q = queue.pop();
    var sq = board[q];
    if (sq.open || sq.flag) continue;
    sq.open = true; opened++;
    if (sq.n === 0){
      neighbours(q).forEach(function(n){ if (!board[n].open && !board[n].flag) queue.push(n); });
    }
  }
  haptic("selection");
  render();
  if (opened === board.length - size.mines) winGame();
}

function plantFlag(i){
  if (over || board[i].open) return;
  board[i].flag = !board[i].flag;
  flags += board[i].flag ? 1 : -1;
  haptic(board[i].flag ? "success" : "light");
  render();
}

function tap(i){
  if (pressFired){ pressFired = false; return; }
  if (state !== "play" || paused) return;
  if (flagMode) plantFlag(i); else dig(i);
}
function pressStart(i){
  pressFired = false;
  if (state !== "play" || paused) return;
  pressTimer = setTimeout(function(){
    pressFired = true;
    if (!flagMode) plantFlag(i);
  }, 420);
}
function pressEnd(){
  if (pressTimer){ clearTimeout(pressTimer); pressTimer = null; }
}

function paintFlagBtn(){
  var b = el("flagBtn");
  b.innerHTML = icon("flag") + "Flag mode: " + (flagMode ? "on" : "off");
  b.className = "glass" + (flagMode ? " flagmode" : "");
  b.setAttribute("aria-pressed", flagMode);
}
function toggleFlagMode(){
  flagMode = !flagMode;
  paintFlagBtn();
  haptic("selection");
}

function lose(hit){
  over = true; endAt = Date.now();
  board.forEach(function(sq){ if (sq.mine) sq.open = true; });
  board[hit]._boom = true;
  render();
  haptic("light");
  el("ovkick").textContent = "Game over";
  el("ovtitle").textContent = "Boom!";
  el("ovtext").textContent = "The field keeps its secrets. Another go?";
  setTimeout(function(){ if (over) syncLook(); }, 650);
}

function winGame(){
  over = true; endAt = Date.now();
  var secs = Math.floor((endAt - startAt) / 1000);
  var prev = best[size.id];
  var isRecord = !prev || secs < prev;
  if (isRecord){ best[size.id] = secs; keep("mines_best", JSON.stringify(best)); }
  haptic("success");
  el("ovkick").innerHTML = isRecord ? '<span class="new">New best time</span>' : "Field cleared";
  el("ovtitle").textContent = "Field cleared!";
  el("ovtext").textContent = secs + " seconds" + (isRecord ? " — new best time!" : (prev ? " · best " + prev + "s" : ""));
  showClock();
  setTimeout(function(){ if (over) syncLook(); }, 350);
}

/* ---------- render ---------- */
function render(){
  el("mines").innerHTML = icon("mine") + Math.max(0, size.mines - flags);
  var g = el("grid");
  g.style.gridTemplateColumns = "repeat(" + size.cols + ", var(--c,32px))";
  var h = "";
  for (var i = 0; i < board.length; i++){
    var sq = board[i];
    var cls = "sq", inner = "";
    if (sq.open){
      if (sq.mine){ cls += sq._boom ? " boom" : " mine"; inner = icon("mine"); }
      else { cls += " open n" + sq.n; inner = sq.n ? sq.n : ""; }
    } else if (sq.flag){ cls += " flag"; inner = icon("flag"); }
    h += '<button class="' + cls + '"' +
      ' onclick="tap(' + i + ')"' +
      ' onpointerdown="pressStart(' + i + ')" onpointerup="pressEnd()" onpointercancel="pressEnd()" onpointerleave="pressEnd()">' +
      inner + '</button>';
  }
  g.innerHTML = h;
}
function bestText(){
  return best[size.id] ? ("Best time (" + size.name.toLowerCase() + "): " + best[size.id] + "s") : "";
}
function setSize(id){
  size = SIZES.filter(function(s){ return s.id === id; })[0];
  haptic("selection");
  keep("mines_size", id);
  newGame();
  showSheet("home");
}

/* ---------- the glass card ---------- */
function showSheet(kind){
  var s = el("sheet"), h;
  if (kind === "home"){
    h = '<h1>Minesweeper</h1><p>Tap to dig. Long-press, or switch on flag mode, to plant a flag. Your first tap is always safe.</p>' +
      '<div class="glass sizes">' + SIZES.map(function(z){
        return '<button class="' + (z.id === size.id ? "on" : "") + '" onclick="setSize(\'' + z.id + '\')">' + z.name + '<small>' + z.mines + '</small></button>';
      }).join("") + '</div><span class="best">' + bestText() + '</span>' +
      '<button class="act first pri" onclick="play()">' + icon("play") + 'Play</button>';
  } else {
    h = '<div class="kick">Paused</div><div class="big">' + el("clock").textContent + 's</div>' +
      '<button class="act first pri" onclick="resume()">' + icon("play") + 'Resume</button>' +
      '<button class="act glass" onclick="home()">End game</button>';
  }
  s.innerHTML = h; s.classList.add("on");
}
function play(){
  haptic("medium");
  state = "play";
  el("sheet").classList.remove("on");
  newGame(); syncChrome();
}
function home(){
  state = "home";
  newGame(); showSheet("home"); syncLook(); syncChrome();
}
function pause(){
  if (state !== "play" || paused || over) return;
  paused = true; pausedAt = Date.now(); pressEnd();
  showClock(); showSheet("pause"); syncLook();
}
function resume(){
  if (!paused) return;
  haptic("light");
  if (started) startAt += Date.now() - pausedAt;      /* the clock doesn't run while the field is hidden */
  paused = false;
  el("sheet").classList.remove("on");
  showClock(); syncLook(); syncChrome();
}
el("bPause").onclick = function(){ haptic("light"); pause(); };

document.addEventListener("visibilitychange", function(){
  if (document.hidden){ pause(); return; }
  if (state !== "home") syncChrome();                 /* MyLLM puts its bars back when the app is left */
});
if (window.matchMedia){
  var mq = matchMedia("(prefers-color-scheme: dark)");
  if (mq.addEventListener) mq.addEventListener("change", syncLook); else if (mq.addListener) mq.addListener(syncLook);
}
window.addEventListener("resize", fit);

/* ---------- boot ---------- */
paintFlagBtn();
Promise.all([load("mines_best"), load("mines_size")]).then(function(vals){
  if (vals[0]){ try{ best = JSON.parse(vals[0]) || {}; }catch(e){} }
  if (vals[1]){ var s = SIZES.filter(function(x){ return x.id === vals[1]; })[0]; if (s) size = s; }
  newGame();
  showSheet("home");
});
</script>
</body>
</html>
