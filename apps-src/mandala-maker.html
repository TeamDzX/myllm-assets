<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mandala Maker</title>
<meta name="myllm:immersive" content="on">
<style>
:root{--build-id:"49dda7a2d9";
  color-scheme:light dark;
  --bg:var(--myllm-bg,#f2f2f7);--surface:var(--myllm-surface,#fff);
  --text:var(--myllm-text,#111);--muted:var(--myllm-muted,#6b6b72);
  --accent:var(--myllm-accent,#0b5ed7);--border:var(--myllm-border,rgba(120,120,128,.25));
  --fill:rgba(120,120,128,.12);--font:var(--myllm-font,-apple-system,system-ui,sans-serif);--h:172;
}
@media(prefers-color-scheme:dark){:root{--bg:var(--myllm-bg,#000);--surface:var(--myllm-surface,#1c1c1e);--text:var(--myllm-text,#eee);--muted:var(--myllm-muted,#98989f);--fill:rgba(120,120,128,.24)}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--font);background:var(--bg);color:var(--text);overscroll-behavior:none;font-size:15.5px;
  max-width:600px;margin:0 auto;min-height:100dvh;
  padding:calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
svg.i{width:1.25em;height:1.25em;fill:currentColor;flex-shrink:0}
button{font:inherit;color:inherit;cursor:pointer}button:active{transform:scale(.96)}

.head{display:flex;align-items:center;gap:12px;margin:2px 2px 14px}
.tile{display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;
  background:linear-gradient(145deg,hsl(var(--h) 62% 50%),hsl(calc(var(--h) + 40) 58% 28%))}
.head .tile{width:44px;height:44px;border-radius:13px;font-size:19px}
.head .ht{flex:1;min-width:0}
h1{font-size:22px;font-weight:800;letter-spacing:-.01em}
.head p{font-size:13px;color:var(--muted);margin-top:1px}
.head .acts{display:flex;gap:8px;flex-shrink:0}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:16px}

.stage{display:flex;justify-content:center}
canvas{display:block;width:100%;max-width:440px;aspect-ratio:1;border-radius:18px;touch-action:none;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.panel{max-width:440px;margin:12px auto 0;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:14px}
label{display:block;font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.lbl{display:flex;justify-content:space-between;align-items:baseline;margin:12px 2px 4px}
.lbl:first-child{margin-top:0}
.lbl span{font-size:13px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;accent-color:hsl(var(--h) 60% 46%)}input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:99px;background:rgba(120,120,128,.28)}input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;margin-top:-9.5px;border-radius:50%;background:#fff;border:2px solid hsl(var(--h) 60% 46%);box-shadow:0 2px 6px rgba(0,0,0,.25)}
.colors{display:flex;gap:9px;flex-wrap:wrap;margin-top:6px}
.sw{width:32px;height:32px;border-radius:50%;border:2px solid var(--border);padding:0}
.sw.on{border-color:var(--text);transform:scale(1.12)}
.toggles{display:flex;gap:8px;margin-top:14px}
.toggles button{flex:1;min-height:44px;border:1px solid var(--border);background:var(--bg);border-radius:12px;font-weight:650;font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:6px}
.toggles button.on{background:hsl(var(--h) 60% 40%);color:#fff;border-color:transparent}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.actions button{min-height:46px;border:0;border-radius:12px;font-weight:700;font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:6px}
.ghost{background:var(--fill)}
.primary{background:var(--accent);color:#fff}
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:rgba(0,0,0,.85);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:50}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Focus: MyLLM's bars go (myllmImmersive), the header and panel step aside,
   and the canvas takes the screen over a dark stage with a small glass bar. */
.fbar{display:none}
body.focus{max-width:none;min-height:100dvh;overflow:hidden;
  background:radial-gradient(120% 90% at 20% 10%,hsl(var(--h) 60% 22%),transparent 60%),radial-gradient(120% 90% at 85% 95%,hsl(calc(var(--h) + 60) 55% 18%),transparent 62%),#0b0b10}
body.focus .head,body.focus .panel{display:none}
body.focus .stage{position:fixed;inset:0;align-items:center;
  padding:calc(12px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) calc(84px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left))}
body.focus canvas{max-width:none;width:min(100%,calc(100dvh - 100px - env(safe-area-inset-top) - env(safe-area-inset-bottom)))}
body.focus .fbar{display:flex;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));gap:8px;padding:6px;border-radius:99px;
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);color:#fff;z-index:20}
.fbar button{height:44px;min-width:44px;border:0;border-radius:99px;background:transparent;padding:0 14px;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px}
.fbar .cur{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.7)}
@media (max-height:520px){body.focus .stage{padding-bottom:calc(12px + env(safe-area-inset-bottom));padding-right:calc(84px + env(safe-area-inset-right))}
  body.focus canvas{width:min(100%,calc(100dvh - 24px - env(safe-area-inset-top) - env(safe-area-inset-bottom)))}
  body.focus .fbar{flex-direction:column;left:auto;right:calc(14px + env(safe-area-inset-right));bottom:50%;transform:translateY(50%)}}
@media (prefers-reduced-motion:reduce){button:active{transform:none}}

/* myllm-fullscreen-v2 — MyLLM 5.6.2+ opens this app full screen; the ✕ is the way out. */
.head .imm-acts{display:none;flex-shrink:0;margin-left:auto}
.head .acts + .imm-acts{margin-left:0}
body.imm .head .imm-acts{display:flex}
.head .imm-acts button{width:40px;height:40px;border-radius:12px;border:1px solid var(--myllm-border,rgba(128,128,128,.28));
  background:var(--myllm-surface,rgba(128,128,128,.12));color:var(--myllm-text,currentColor);display:grid;place-items:center;padding:0;cursor:pointer;transition:transform .12s}
.head .imm-acts button:active,.head .imm-x:active{transform:scale(.94)}
.head .imm-x{display:none !important}
body.imm .head .imm-x{display:grid !important;place-items:center}
.imm-x svg,.imm-acts svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}
.imm-safe{display:none}
body.imm .imm-safe{display:block}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-mandala" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="4.2"/><circle cx="16.20" cy="12.00" r="4.2"/><circle cx="14.10" cy="15.64" r="4.2"/><circle cx="9.90" cy="15.64" r="4.2"/><circle cx="7.80" cy="12.00" r="4.2"/><circle cx="9.90" cy="8.36" r="4.2"/><circle cx="14.10" cy="8.36" r="4.2"/></g></symbol>
  <symbol id="i-expand" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-shrink" viewBox="0 0 24 24"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 5L4 10l5 5M4.5 10H14a6 6 0 0 1 0 12h-2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.6l4.6 4.6L19.2 7.4" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 3v11M8 7l4-4 4 4M5 12v7a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-save" viewBox="0 0 24 24"><path d="M12 3a1 1 0 0 1 1 1v9.6l3.3-3.3a1 1 0 1 1 1.4 1.4l-5 5a1 1 0 0 1-1.4 0l-5-5a1 1 0 1 1 1.4-1.4l3.3 3.3V4a1 1 0 0 1 1-1zM4 18a1 1 0 0 1 1 1v.5h14V19a1 1 0 1 1 2 0v1.5a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V19a1 1 0 0 1 1-1z" fill="currentColor"/></symbol>
</defs></svg>

<div class="imm-safe"></div><div class="head">
  <div class="tile"><svg class="i"><use href="#i-mandala"/></svg></div>
  <div class="ht"><h1>Mandala Maker</h1><p>Symmetry drawing, meditative</p></div>
  <div class="acts" id="acts"></div>
<div class="imm-acts"><button type="button" aria-label="Close Mandala Maker" onclick="myllmFSClose()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div></div>
<div class="stage"><canvas id="c" width="1000" height="1000"></canvas></div>
<div class="panel">
  <div class="lbl"><label>Symmetry</label><span id="symv">12</span></div>
  <input type="range" id="sym" min="3" max="24" value="12">
  <div class="lbl"><label>Brush</label></div>
  <input type="range" id="brush" min="1" max="40" value="6">
  <div class="lbl"><label>Colour</label></div>
  <div class="colors" id="colors"></div>
  <div class="toggles">
    <button id="mirror" class="on" type="button"></button>
    <button id="bg" type="button">Dark canvas</button>
  </div>
  <div class="actions">
    <button class="ghost" id="undo" type="button"></button>
    <button class="ghost" id="clear" type="button">Clear</button>
    <button class="ghost" id="share" type="button"></button>
    <button class="primary" id="save" type="button"></button>
  </div>
</div>
<div class="fbar" id="fbar">
  <button type="button" id="fUndo" aria-label="Undo"></button>
  <button type="button" id="fColor" aria-label="Next colour"><span class="cur" id="fCur"></span></button>
  <button type="button" id="fSave" aria-label="Save"></button>
  <button type="button" id="fExit" aria-label="Leave full screen"></button>
</div>
<div id="toast"></div>
<script>
var cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=1000,H=1000;
var COLORS=["#ff3b30","#ff9500","#ffcc00","#34c759","#00c7be","#0a84ff","#5e5ce6","#bf5af2","#ff2d92","#ffffff","#000000"];
var color="#0a84ff",sym=12,brush=6,mirror=true,darkBg=true;
var drawing=false,last=null,undoStack=[];
function el(i){return document.getElementById(i)}
function icon(n){return '<svg class="i"><use href="#i-'+n+'"/></svg>'}
function haptic(k){if(window.myllmHaptic)try{myllmHaptic(k)}catch(e){}}
function toast(t){var e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(function(){e.classList.remove('show')},1600)}

function fillBg(){ctx.fillStyle=darkBg?'#0b0b10':'#ffffff';ctx.fillRect(0,0,W,H)}
function rot(dx,dy,a){var c=Math.cos(a),s=Math.sin(a);return[dx*c-dy*s,dx*s+dy*c]}
function seg(p,q){
  var cx=W/2,cy=H/2;
  ctx.strokeStyle=color;ctx.lineWidth=brush;ctx.lineCap='round';ctx.lineJoin='round';
  var pdx=p.x-cx,pdy=p.y-cy,qdx=q.x-cx,qdy=q.y-cy;
  for(var k=0;k<sym;k++){
    var a=k*2*Math.PI/sym,p1=rot(pdx,pdy,a),q1=rot(qdx,qdy,a);
    ctx.beginPath();ctx.moveTo(cx+p1[0],cy+p1[1]);ctx.lineTo(cx+q1[0],cy+q1[1]);ctx.stroke();
    if(mirror){var p2=rot(pdx,-pdy,a),q2=rot(qdx,-qdy,a);
      ctx.beginPath();ctx.moveTo(cx+p2[0],cy+p2[1]);ctx.lineTo(cx+q2[0],cy+q2[1]);ctx.stroke();}
  }
}
/* The bitmap is a fixed 1000×1000 and only its CSS size changes (focus mode,
   rotation), so the drawing and every undo step survive a resize untouched. */
function pos(e){var r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
function pushUndo(){try{undoStack.push(cv.toDataURL('image/png'));if(undoStack.length>8)undoStack.shift()}catch(e){}}

cv.addEventListener('pointerdown',function(e){e.preventDefault();pushUndo();drawing=true;last=pos(e);seg(last,last);cv.setPointerCapture(e.pointerId);haptic('selection')});
cv.addEventListener('pointermove',function(e){if(!drawing)return;e.preventDefault();var p=pos(e);seg(last,p);last=p});
function endStroke(){if(!drawing)return;drawing=false;persist()}
cv.addEventListener('pointerup',endStroke);
cv.addEventListener('pointercancel',endStroke);
cv.addEventListener('pointerleave',endStroke);

function buildColors(){
  var c=document.getElementById('colors');c.innerHTML='';
  COLORS.forEach(function(col){var b=document.createElement('button');b.type='button';b.className='sw'+(col===color?' on':'');b.style.background=col;b.setAttribute('aria-label','Colour '+col);
    b.onclick=function(){color=col;haptic('selection');buildColors()};c.appendChild(b)});
  el('fCur').style.background=color;
}
function syncMirror(){var b=el('mirror');b.classList.toggle('on',mirror);b.innerHTML=(mirror?icon('check'):'')+'Mirror'}
function undo(){if(!undoStack.length){toast('Nothing to undo');return}var d=undoStack.pop();var im=new Image();im.onload=function(){ctx.clearRect(0,0,W,H);ctx.drawImage(im,0,0);persist()};im.src=d;haptic('light')}
function saveImage(){haptic('success');if(!window.myllmSaveImage){toast('Update MyLLM to save to Photos');return}myllmSaveImage(cv.toDataURL('image/png')).then(function(){toast('Saved to Photos')}).catch(function(){toast('Couldn’t save (check Photos permission)')})}
document.getElementById('sym').oninput=function(){sym=+this.value;document.getElementById('symv').textContent=sym};
document.getElementById('brush').oninput=function(){brush=+this.value};
document.getElementById('mirror').onclick=function(){mirror=!mirror;syncMirror();haptic('selection')};
document.getElementById('bg').onclick=function(){darkBg=!darkBg;this.textContent=darkBg?'Dark canvas':'Light canvas';fillBg();undoStack=[];persist();haptic('warning');toast('Fresh '+(darkBg?'dark':'light')+' canvas')};
document.getElementById('undo').onclick=undo;
document.getElementById('clear').onclick=function(){pushUndo();fillBg();persist();haptic('warning');toast('Cleared')};
document.getElementById('save').onclick=saveImage;
document.getElementById('share').onclick=function(){haptic('light');if(window.myllmShare)myllmShare('Made a mandala in MyLLM 🌸')};

/* ---------- focus ---------- */
var focusOn=false;
function syncChrome(){
  if(!window.myllmImmersive)return;
  try{myllmImmersive((window.myllmClose ? true : (focusOn)), {keepAwake:false}).catch(function(){})}catch(e){}
}
function setFocus(on){
  if(on&&!window.myllmImmersive)return;
  focusOn=on;document.body.classList.toggle('focus',on);haptic('light');syncChrome();
}
function buildActs(){
  var a=el('acts');
  if(!window.myllmImmersive||a.firstChild)return;
  var b=document.createElement('button');b.type='button';b.className='ib';b.innerHTML=icon('expand');b.setAttribute('aria-label','Full screen');
  b.onclick=function(){setFocus(true)};a.appendChild(b);
}
el('fUndo').innerHTML=icon('undo');el('fSave').innerHTML=icon('save');el('fExit').innerHTML=icon('shrink');
el('fUndo').onclick=undo;el('fSave').onclick=saveImage;el('fExit').onclick=function(){setFocus(false)};
el('fColor').onclick=function(){color=COLORS[(COLORS.indexOf(color)+1)%COLORS.length];buildColors();haptic('selection')};
document.addEventListener('visibilitychange',function(){if(!document.hidden&&focusOn)syncChrome()});   /* MyLLM restores its bars when the app is left */
buildActs();setTimeout(buildActs,600);setTimeout(buildActs,2500);   /* the bridge can arrive after this script */

el('undo').innerHTML=icon('undo')+'Undo';el('share').innerHTML=icon('share')+'Share';el('save').innerHTML=icon('save')+'Save';
syncMirror();

function persist(){
  if(!window.myllmStorage)return;
  try{var d=cv.toDataURL('image/jpeg',0.5);if(d.length<900000)myllmStorage.setItem('mandala',d);}catch(e){}
}
function load(){
  buildColors();fillBg();
  if(!window.myllmStorage)return;
  myllmStorage.getItem('mandala').then(function(v){
    if(v){var im=new Image();im.onload=function(){ctx.drawImage(im,0,0)};im.src=v}
  });
}
load();

/* myllm-fullscreen-v2 — full screen where MyLLM can also close the app for us
   (myllmClose, 5.6.2+): full screen hides MyLLM's Done, and a page with no way
   out is worse than a repeated title, so elsewhere nothing changes.
   The spacer keeps the header clear of the status bar / Dynamic Island. It is
   live CSS — env(safe-area-inset-top) — not a measured number: the inset is
   still 0 when the page loads and only grows once MyLLM's bar has gone (v1
   measured once, so the title sat under the island). If the page's own styles
   already pad the header down by the inset, the spacer stays at 0. */
(function(){
  function full(){ return !!(window.myllmClose && window.myllmImmersive); }
  /* Does any rule that applies to the header or an ancestor already use the top inset? */
  function pageHandlesInset(head){
    var chain = [], n, found = false;
    for (n = head; n && n.nodeType === 1; n = n.parentElement) chain.push(n);
    function walk(rules){
      for (var i = 0; i < rules.length && !found; i++){
        var r = rules[i];
        if (r.cssRules && !r.selectorText) { walk(r.cssRules); continue; }
        if (!r.selectorText || !/safe-area-inset-top/.test(r.cssText) || !/(padding|margin|top)\s*:/.test(r.cssText)) continue;
        if (/\.imm-safe/.test(r.selectorText)) continue;
        for (var k = 0; k < chain.length; k++){
          try { if (chain[k].matches(r.selectorText)) { found = true; break; } } catch(e){}
        }
      }
    }
    for (var s = 0; s < document.styleSheets.length && !found; s++){
      try { walk(document.styleSheets[s].cssRules); } catch(e){}
    }
    for (n = head; n && n.nodeType === 1 && !found; n = n.parentElement){
      if (/safe-area-inset-top/.test(n.getAttribute("style") || "")) found = true;
    }
    return found;
  }
  function fit(){
    var sp = document.querySelector(".imm-safe"), head = document.querySelector(".head");
    if (!sp || !head) return;
    sp.style.height = (document.body.classList.contains("imm") && !pageHandlesInset(head)) ? "env(safe-area-inset-top)" : "0px";
  }
  function sync(){
    var f = full();
    document.body.classList.toggle("imm", f);
    fit();
    if (!f) return;
    try { window.myllmImmersive(true, { keepAwake:false }).catch(function(){}); } catch(e){}
  }
  window.myllmFSClose = function(){
    try { if (window.myllmHaptic) window.myllmHaptic("light"); } catch(e){}
    try { window.myllmClose().catch(function(){}); } catch(e){}
  };
  document.addEventListener("visibilitychange", function(){ if (!document.hidden) sync(); });
  sync();
})();
</script>
</body>
</html>
