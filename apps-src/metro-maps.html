<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Metro Maps</title>
<meta name="myllm:immersive" content="on">
<style>:root{--build-id:"8ec18962f8";color-scheme:light dark;
  --bg:#f4f5f8; --map:#f7f7f4; --surface:#ffffff; --surface2:#f0f1f5; --ink:#15171c; --muted:#6c7280; --faint:#a3a8b3;
  --line:rgba(20,24,32,.09); --chip:rgba(20,24,32,.06); --acc:#2f6bff; --acc2:#7a4dff; --good:#1f9d55; --warn:#d98200; --bad:#d6342c;
  --water:#d3e6f5; --shadow:0 10px 30px rgba(20,24,40,.16); --font:-apple-system,system-ui,"Segoe UI",sans-serif; }
@media (prefers-color-scheme:dark){ :root{
  --bg:#0c0e13; --map:#10131a; --surface:#181b23; --surface2:#20242e; --ink:#eef0f4; --muted:#8f96a3; --faint:#5b6170;
  --line:rgba(255,255,255,.08); --chip:rgba(255,255,255,.07); --acc:#5b8cff; --acc2:#9a7bff; --good:#3ecf7c; --warn:#ffb020; --bad:#ff6259;
  --water:#15263a; --shadow:0 12px 34px rgba(0,0,0,.5); } }
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:var(--font);color:var(--ink);background:var(--bg);height:100vh;height:100dvh;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;color:inherit}

/* Header */
.head{display:flex;align-items:center;gap:10px;padding:8px 14px 6px;flex-shrink:0}
.tile{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex-shrink:0;
  background:linear-gradient(145deg,var(--acc),var(--acc2));box-shadow:0 4px 12px rgba(60,90,255,.3)}
.tile svg{width:20px;height:20px;color:#fff}
.ht{min-width:0;flex:1}
.ht h1{font-size:17px;line-height:1.3;font-weight:650;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{display:flex;gap:8px;align-items:center}
.hbtn{height:36px;min-width:36px;padding:0 9px;border-radius:11px;background:var(--chip);display:grid;place-items:center;transition:transform .12s}
.hbtn:active{transform:scale(.93)}
.hbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* City switcher */
.cities{display:flex;gap:4px;margin:2px 14px 8px;padding:3px;border-radius:12px;background:var(--chip);flex-shrink:0}
.cities button{flex:1;height:32px;border-radius:9px;font-size:14px;line-height:1.3;font-weight:600;color:var(--muted);transition:background .2s,color .2s}
.cities button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}

/* Map stage */
.stage{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;background:var(--map);border-top:1px solid var(--line)}
canvas#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.fab{position:absolute;right:12px;display:flex;flex-direction:column;gap:8px;z-index:2;transition:bottom .3s cubic-bezier(.2,.8,.2,1)}
.fab button{width:42px;height:42px;border-radius:13px;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center}
.fab button:active{transform:scale(.93)}
.fab svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.legend{transition:opacity .4s;position:absolute;left:12px;bottom:12px;font-size:11px;line-height:1.35;color:var(--muted);background:color-mix(in srgb,var(--surface) 85%,transparent);
  padding:5px 8px;border-radius:8px;z-index:1;pointer-events:none;max-width:60%}
.rcard{position:absolute;left:12px;right:12px;top:10px;z-index:3;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);
  padding:10px 12px;display:none;align-items:center;gap:10px}
.rcard.show{display:flex}
.rcard .rt{flex:1;min-width:0}
.rcard .rt b{display:block;font-size:14px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rcard .rt span{font-size:12.5px;line-height:1.35;color:var(--muted)}
.rcard button{font-size:13px;font-weight:600;color:var(--acc);padding:6px 8px}

/* Tab bar */
.tabs{display:flex;flex-shrink:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;color:var(--muted);font-size:11px;line-height:1.3;font-weight:600;border-radius:10px}
.tabs button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--acc)}

/* Sheets */
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-radius:20px 20px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.18);
  display:flex;flex-direction:column;max-height:74%;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);visibility:hidden}
.sheet.open{transform:none;visibility:visible}
.grab{height:22px;flex-shrink:0;display:grid;place-items:center;cursor:grab}
.grab::before{content:"";width:38px;height:5px;border-radius:3px;background:var(--faint);opacity:.6}
.sh{display:flex;align-items:center;gap:10px;padding:0 16px 8px;flex-shrink:0}
.sh h2{flex:1;font-size:19px;line-height:1.3;font-weight:700;letter-spacing:-.3px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh .x{width:30px;height:30px;border-radius:50%;background:var(--chip);display:grid;place-items:center;flex-shrink:0}
.sh .x svg{width:13px;height:13px;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}
.sh .back{font-size:15px;color:var(--acc);font-weight:600;padding:4px 2px;flex-shrink:0}
.sb{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 18px;flex:1 1 auto;min-height:0;-webkit-user-select:text;user-select:text}
.note{font-size:13px;line-height:1.45;color:var(--muted)}
.sec{font-size:12px;line-height:1.4;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}

/* Chips */
.chip{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:22px;padding:0 7px;border-radius:6px;font-size:12px;line-height:1;
  font-weight:700;white-space:nowrap;flex-shrink:0}
.chip.lg{height:30px;min-width:34px;font-size:14px;border-radius:8px;padding:0 10px}
.chips{display:flex;flex-wrap:wrap;gap:5px}

/* Rows */
.row{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line);cursor:pointer;min-height:48px}
.row:last-child{border-bottom:0}
.row:active{background:var(--chip)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:15.5px;line-height:1.35;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t span{display:block;font-size:13px;line-height:1.4;color:var(--muted)}
.row .chev{color:var(--faint);font-size:18px}

/* Line strip */
.pats{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.pats::-webkit-scrollbar{display:none}
.pats button{flex-shrink:0;font-size:13px;line-height:1.3;padding:7px 11px;border-radius:999px;background:var(--chip);color:var(--muted);font-weight:600}
.pats button.on{background:var(--ink);color:var(--surface)}
.strip{position:relative;padding:4px 0 8px}
.stop{position:relative;display:flex;align-items:center;gap:12px;min-height:44px;padding:4px 0 4px 44px;cursor:pointer}
.stop::before{content:"";position:absolute;left:17px;top:0;bottom:0;width:8px;background:var(--lc)}
.stop:first-child::before{top:50%}
.stop:last-child::before{bottom:50%}
.stop .dot{position:absolute;left:13px;top:50%;width:16px;height:16px;margin-top:-8px;border-radius:50%;background:var(--surface);border:3px solid var(--lc)}
.stop.ix .dot{border-color:var(--ink);width:18px;height:18px;margin-top:-9px;left:12px}
.stop .sn{flex:1;min-width:0;font-size:15px;line-height:1.35}
.stop.term .sn{font-weight:700}
.stop .chips{justify-content:flex-end;max-width:52%}

/* Route */
.pick{display:flex;flex-direction:column;gap:8px;position:relative}
.field{display:flex;align-items:center;gap:10px;height:48px;border-radius:13px;background:var(--surface2);padding:0 12px;text-align:left;width:100%}
.field i{width:12px;height:12px;border-radius:50%;flex-shrink:0;border:3px solid var(--acc)}
.field.to i{border-radius:3px;border-color:var(--bad)}
.field span{flex:1;min-width:0;font-size:15.5px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.field span.ph{color:var(--faint)}
.swap{position:absolute;right:10px;top:50%;margin-top:-17px;width:34px;height:34px;border-radius:50%;background:var(--surface);box-shadow:0 2px 8px rgba(0,0,0,.15);display:grid;place-items:center;z-index:1}
.swap svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.seg{display:flex;gap:4px;margin:10px 0 4px;padding:3px;border-radius:11px;background:var(--chip)}
.seg button{flex:1;height:32px;border-radius:8px;font-size:13.5px;line-height:1.3;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.sum{display:flex;align-items:baseline;gap:10px;margin:12px 0 4px}
.sum b{font-size:28px;line-height:1.2;font-weight:700;letter-spacing:-.5px}
.sum span{font-size:14px;line-height:1.4;color:var(--muted)}
.legs{position:relative;margin-top:6px}
.leg{position:relative;padding:8px 0 8px 40px}
.leg::before{content:"";position:absolute;left:14px;top:22px;bottom:-8px;width:6px;border-radius:3px;background:var(--lc)}
.leg.end::before{display:none}
.leg .pin{position:absolute;left:8px;top:10px;width:18px;height:18px;border-radius:50%;background:var(--surface);border:4px solid var(--lc)}
.leg .lt{font-size:15.5px;line-height:1.35;font-weight:650}
.leg .ld{font-size:13.5px;line-height:1.45;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.leg details{margin-top:4px}
.leg summary{font-size:13px;line-height:1.4;color:var(--acc);cursor:pointer;list-style:none}
.leg summary::-webkit-details-marker{display:none}
.leg ol{list-style:none;margin:4px 0 0;font-size:13.5px;line-height:1.6;color:var(--muted)}
.chg{font-size:13px;line-height:1.4;color:var(--muted);padding:2px 0 2px 40px}
.acts2{display:flex;gap:8px;margin-top:14px}
.btn{flex:1;height:44px;border-radius:12px;background:var(--chip);font-size:14.5px;line-height:1.3;font-weight:600}
.btn.pri{background:linear-gradient(145deg,var(--acc),var(--acc2));color:#fff}
.star.on{color:#f5b301}

/* Status */
.st-row{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.st-row:last-child{border-bottom:0}
.st-row .t{flex:1;min-width:0}
.st-row .t b{display:block;font-size:14.5px;line-height:1.35;font-weight:650}
.st-row .t b.good{color:var(--good)} .st-row .t b.warn{color:var(--warn)} .st-row .t b.bad{color:var(--bad)}
.st-row .t p{font-size:13px;line-height:1.45;color:var(--muted);margin-top:2px}
.st-row .t p.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.skel{height:14px;border-radius:7px;background:var(--chip);margin:14px 0;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}

/* Search overlay */
.search{position:absolute;inset:0;z-index:8;background:var(--surface);display:none;flex-direction:column}
.search.open{display:flex}
.sbar{display:flex;align-items:center;gap:10px;padding:10px 14px;flex-shrink:0;border-bottom:1px solid var(--line)}
.sbar input{flex:1;min-width:0;height:42px;border-radius:12px;border:0;background:var(--surface2);padding:0 14px;font-size:16px;line-height:1.3;outline:none;-webkit-user-select:text;user-select:text}
.sbar button{font-size:15px;color:var(--acc);font-weight:600}
.sres{flex:1;min-height:0;overflow-y:auto;padding:0 16px 20px}
.stitle{font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin:12px 0 2px}

.toast{position:absolute;left:50%;top:14px;transform:translate(-50%,-10px);opacity:0;pointer-events:none;z-index:9;background:var(--ink);color:var(--surface);
  font-size:13px;line-height:1.35;font-weight:600;padding:8px 13px;border-radius:10px;transition:.25s;max-width:86%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (orientation:landscape) and (max-height:560px){
  .cities{margin-bottom:6px} .cities button{height:28px}
  .sheet{left:auto;right:10px;bottom:10px;top:10px;width:min(400px,52%);max-height:none;border-radius:18px}
  .tabs{padding-top:4px} .tabs button{flex-direction:row;justify-content:center;gap:6px;font-size:12px}
  .tabs button svg{width:19px;height:19px}
}
@media (prefers-reduced-motion:reduce){ .sheet,.fab{transition:none} .skel{animation:none} }

/* myllm-fullscreen-v2 — MyLLM 5.6.2+ opens this app full screen; the ✕ is the way out. */
.head .imm-acts{display:none;flex-shrink:0;margin-left:auto}
.head .acts + .imm-acts{margin-left:0}
body.imm .head .imm-acts{display:flex}
.head .imm-acts button{width:36px;height:36px;border-radius:11px;border:1px solid var(--line);
  background:var(--chip);color:var(--ink);display:grid;place-items:center;padding:0;cursor:pointer;transition:transform .12s}
.head .imm-acts button:active{transform:scale(.94)}
.imm-acts svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}
.imm-safe{display:none}
body.imm .imm-safe{display:block}

var S={city:'london',recents:[],favs:[],views:{},mode:'fast'};
function save(){
  var d=JSON.stringify({city:S.city,recents:S.recents.slice(0,12),favs:S.favs.slice(0,30),views:S.views,mode:S.mode});
  try{ if(window.myllmStorage){ myllmStorage.setItem(STORE,d); return; } }catch(e){}
  try{ localStorage.setItem(STORE,d); }catch(e){}
}
function load(done){
  function apply(v){ if(v){ try{ var d=JSON.parse(v);
    if(d.city&&CITY_LIST.some(function(c){return c.id===d.city}))S.city=d.city;
    if(Array.isArray(d.recents))S.recents=d.recents; if(Array.isArray(d.favs))S.favs=d.favs;
    if(d.views&&typeof d.views==='object')S.views=d.views; if(d.mode==='few'||d.mode==='fast')S.mode=d.mode; }catch(e){} }
    done(); }
  try{ if(window.myllmStorage){ myllmStorage.getItem(STORE).then(apply,function(){apply(null)}); return; } }catch(e){}
  var v=null; try{ v=localStorage.getItem(STORE); }catch(e){} apply(v);
}

/* ---------- Map view ---------- */
var cv=$('map'), ctx=cv.getContext('2d'), stage=$('stage');
var W=0,H=0,DPR=1, view={s:.1,tx:0,ty:0}, baseS=.1;
var route=null, focusSt=null, drawQueued=false;
function toScreen(x,y){ return [x*view.s+view.tx, y*view.s+view.ty]; }
function resize(){
  var r=stage.getBoundingClientRect(); DPR=Math.min(3,window.devicePixelRatio||1);
  var nw=Math.max(1,Math.round(r.width)), nh=Math.max(1,Math.round(r.height));
  if(nw===W&&nh===H&&cv.width===Math.round(nw*DPR))return;
  var cx=W?(W/2-view.tx)/view.s:null, cy=H?(H/2-view.ty)/view.s:null;
  W=nw;H=nh; cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  if(cx!==null){ view.tx=W/2-cx*view.s; view.ty=H/2-cy*view.s; }
  draw();
}
function fitBox(b,pad,anim){
  var bw=Math.max(60,b[2]-b[0]), bh=Math.max(60,b[3]-b[1]);
  var top=pad+(route?60:0), bottom=pad+sheetCover();
  var s=Math.min((W-2*pad)/bw,(H-top-bottom)/bh);
  var t={s:s,tx:(W-bw*s)/2-b[0]*s,ty:top+((H-top-bottom)-bh*s)/2-b[1]*s};
  if(anim)animateTo(t); else { view=t; draw(); }
}
function sheetCover(){ var sh=$('sheet'); if(!sh.classList.contains('open')||isLand())return 0; return Math.min(sh.offsetHeight,H*.74); }
function isLand(){ return matchMedia('(orientation:landscape) and (max-height:560px)').matches; }
var anim=null;
function animateTo(t,ms){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){ view=t; draw(); return; }
  var from={s:view.s,tx:view.tx,ty:view.ty}, t0=performance.now(), d=ms||380;
  cancelAnimationFrame(anim);
  (function step(now){ var k=Math.min(1,(now-t0)/d), e=1-Math.pow(1-k,3);
    // interpolate in log-scale so zooms feel even
    var s=Math.exp(Math.log(from.s)+(Math.log(t.s)-Math.log(from.s))*e);
    var cxF=(W/2-from.tx)/from.s, cyF=(H/2-from.ty)/from.s, cxT=(W/2-t.tx)/t.s, cyT=(H/2-t.ty)/t.s;
    var cx=cxF+(cxT-cxF)*e, cy=cyF+(cyT-cyF)*e;
    view={s:s,tx:W/2-cx*s,ty:H/2-cy*s}; draw(true);
    if(k<1)anim=requestAnimationFrame(step); else { view=t; draw(); saveView(); }
  })(t0);
}
function zoomAt(f,px,py,animate){
  var s=Math.max(baseS*.35,Math.min(baseS*40,view.s*f)); f=s/view.s;
  var t={s:s,tx:px-(px-view.tx)*f,ty:py-(py-view.ty)*f};
  if(animate)animateTo(t,260); else { view=t; draw(true); }
}
var svT;
function saveView(){ clearTimeout(svT); svT=setTimeout(function(){ S.views[city.id]={cx:(W/2-view.tx)/view.s,cy:(H/2-view.ty)/view.s,z:view.s/baseS}; save(); },500); }

/* ---------- Drawing ---------- */
var COL={};
function readColors(){ var cs=getComputedStyle(document.documentElement);
  ['--map','--ink','--muted','--surface','--water','--acc','--bad','--faint'].forEach(function(k){ COL[k]=cs.getPropertyValue(k).trim(); }); }
function lineColor(L){ return DARK.matches?L.dark:L.color; }
function lineW(){ return Math.max(2.2,Math.min(7,2.6*Math.pow(view.s/baseS,.45))); }
var labelBox=[];
function draw(fast){
  if(!W)return;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle=COL['--map']; ctx.fillRect(0,0,W,H);
  var lw=lineW(), gap=lw*1.05, z=view.s/baseS;
  // rivers
  ctx.lineJoin='round'; ctx.lineCap='round';
  ctx.strokeStyle=COL['--water']; ctx.lineWidth=Math.max(5,Math.min(60,22*view.s));
  city.rivers.forEach(function(r){ ctx.beginPath(); for(var i=0;i<r.length;i++){ var p=toScreen(r[i][0],r[i][1]); if(i)ctx.lineTo(p[0],p[1]); else ctx.moveTo(p[0],p[1]); } ctx.stroke(); });
  // lines
  var onRoute=route?route.lineSet:null;
  city.lines.forEach(function(L){
    ctx.globalAlpha=onRoute?.18:1;
    ctx.strokeStyle=lineColor(L); ctx.lineWidth=lw;
    L.pats.forEach(function(p){ strokePattern(L,p,gap); });
  });
  ctx.globalAlpha=1;
  // route on top, thicker
  if(route){
    route.legs.forEach(function(g){
      var L=city.lines[g.line];
      ctx.strokeStyle=DARK.matches?'rgba(0,0,0,.55)':'rgba(255,255,255,.9)'; ctx.lineWidth=lw*2.6+3; strokePattern(L,g.stops,0,true);
      ctx.strokeStyle=lineColor(L); ctx.lineWidth=lw*2.2; strokePattern(L,g.stops,0,true);
    });
  }
  // stations
  var r0=Math.max(2,lw*.62);
  var vis=[];
  city.st.forEach(function(s){
    var p=toScreen(s.x,s.y); if(p[0]<-40||p[1]<-40||p[0]>W+40||p[1]>H+40)return;
    var ix=s.ix>1, onR=route&&route.stSet[s.i];
    if(route&&!onR&&!ix&&z<2.5)return;
    vis.push([s,p,ix,onR]);
  });
  vis.forEach(function(v){
    var s=v[0],p=v[1],ix=v[2],onR=v[3];
    ctx.globalAlpha=route&&!onR?.35:1;
    if(ix){ var r=r0*1.55+(s.ix>3?1:0);
      ctx.beginPath(); ctx.arc(p[0],p[1],r,0,7); ctx.fillStyle=COL['--surface']; ctx.fill(); ctx.lineWidth=Math.max(1.6,lw*.5); ctx.strokeStyle=COL['--ink']; ctx.stroke();
    } else if(z>.95||onR){
      ctx.beginPath(); ctx.arc(p[0],p[1],r0*(z>1.6?.95:.7),0,7); ctx.fillStyle=COL['--surface']; ctx.fill();
      ctx.lineWidth=Math.max(1.2,lw*.42); ctx.strokeStyle=lineColor(city.lines[s.lines[0]]); ctx.stroke();
    }
  });
  ctx.globalAlpha=1;
  // route ends
  if(route){ pin(route.from,COL['--acc'],false); pin(route.to,COL['--bad'],true); }
  if(focusSt!==null){ var fs=city.st[focusSt], fp=toScreen(fs.x,fs.y); ctx.beginPath(); ctx.arc(fp[0],fp[1],r0*3.2,0,7); ctx.lineWidth=3; ctx.strokeStyle=COL['--acc']; ctx.stroke(); }
  drawLabels(vis,r0,z);
}
function pin(si,col,square){
  var s=city.st[si], p=toScreen(s.x,s.y), r=9;
  ctx.beginPath(); if(square){ roundRect(p[0]-r,p[1]-r,2*r,2*r,4); } else ctx.arc(p[0],p[1],r,0,7);
  ctx.fillStyle=COL['--surface']; ctx.fill(); ctx.lineWidth=4; ctx.strokeStyle=col; ctx.stroke();
}
function roundRect(x,y,w,h,r){ ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
/* One stop pattern of a line: offset sideways where lines share track, then
   rounded at the corners. */
function strokePattern(L,p,gap,solo){
  if(p.length<2)return;
  var pts=[],i;
  for(i=0;i<p.length;i++){
    var s=city.st[p[i]], q=toScreen(s.x,s.y), ox=0, oy=0, n=0;
    if(!solo){
      for(var e=-1;e<=0;e++){ var a=p[i+e], b=p[i+e+1]; if(a===undefined||b===undefined)continue;
        var k=a<b?a+'-'+b:b+'-'+a, list=city.edges[k]; if(!list||list.length<2)continue;
        var sa=city.st[a], sb=city.st[b], dx=sb.x-sa.x, dy=sb.y-sa.y, len=Math.hypot(dx,dy)||1;
        if(a>b){ dx=-dx; dy=-dy; } // normal of the edge in its canonical direction, so every line agrees
        var off=(list.indexOf(L.i)-(list.length-1)/2)*gap;
        ox+=-dy/len*off; oy+=dx/len*off; n++; }
      if(n){ ox/=n; oy/=n; }
    }
    pts.push([q[0]+ox,q[1]+oy]);
  }
  ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]);
  var R=Math.max(6,lineW()*4);
  for(i=1;i<pts.length-1;i++){
    var a1=pts[i-1],b1=pts[i],c1=pts[i+1];
    var r=Math.min(R,Math.hypot(b1[0]-a1[0],b1[1]-a1[1])/2,Math.hypot(c1[0]-b1[0],c1[1]-b1[1])/2);
    ctx.arcTo(b1[0],b1[1],c1[0],c1[1],r);
  }
  ctx.lineTo(pts[pts.length-1][0],pts[pts.length-1][1]); ctx.stroke();
}
/* Greedy labels: busiest stations first, each tries four spots and keeps the
   first that overlaps nothing already placed. */
function drawLabels(vis,r0,z){
  var fs=z<1.4?11:(z<3?12:13);
  ctx.font='600 '+fs+'px '+getComputedStyle(document.body).fontFamily;
  ctx.textBaseline='middle';
  var placed=[], minLines=z<.9?Math.max(3,Math.ceil(city.maxLines*.6)):(z<1.5?3:(z<2.4?2:1));
  var cand=vis.filter(function(v){ return v[3]||v[0].ix>=minLines||v[0].i===focusSt; });
  cand.sort(function(a,b){ return (b[3]?9:0)+b[0].ix-((a[3]?9:0)+a[0].ix)||b[0].lines.length-a[0].lines.length; });
  if(route){ [route.from,route.to].forEach(function(si){ var s=city.st[si]; cand.unshift([s,toScreen(s.x,s.y),true,true,true]); }); }
  var count=0, seen={};
  for(var i=0;i<cand.length&&count<260;i++){
    var s=cand[i][0], p=cand[i][1]; if(seen[s.i])continue;
    var w=ctx.measureText(s.name).width, h=fs*1.35, d=r0*2+4;
    var spots=[[p[0]+d,p[1]-h/2],[p[0]-d-w,p[1]-h/2],[p[0]-w/2,p[1]-d-h],[p[0]-w/2,p[1]+d]];
    for(var k=0;k<4;k++){
      var x=spots[k][0], y=spots[k][1];
      if(x<2||y<2||x+w>W-2||y+h>H-2)continue;
      var hit=false;
      for(var j=0;j<placed.length;j++){ var b=placed[j]; if(x<b[2]&&x+w>b[0]&&y<b[3]&&y+h>b[1]){hit=true;break;} }
      if(hit)continue;
      placed.push([x-3,y-1,x+w+3,y+h+1]); seen[s.i]=1; count++;
      ctx.lineWidth=3.5; ctx.strokeStyle=COL['--map']; ctx.lineJoin='round'; ctx.strokeText(s.name,x,y+h/2);
      ctx.fillStyle=cand[i][4]||s.i===focusSt?COL['--ink']:(cand[i][2]?COL['--ink']:COL['--muted']); ctx.fillText(s.name,x,y+h/2);
      break;
    }
  }
}
function queueDraw(){ if(drawQueued)return; drawQueued=true; requestAnimationFrame(function(){ drawQueued=false; draw(true); }); }

/* ---------- Gestures ---------- */
var ptrs={}, gest=null, lastTap=0, vel=null;
cv.addEventListener('pointerdown',function(e){
  $('legend').style.opacity='0';
  cv.setPointerCapture(e.pointerId); cancelAnimationFrame(anim); vel=null;
  ptrs[e.pointerId]={x:e.offsetX,y:e.offsetY,t:performance.now(),x0:e.offsetX,y0:e.offsetY};
  var ids=Object.keys(ptrs);
  if(ids.length===1)gest={type:'pan',moved:false,t0:performance.now()};
  else if(ids.length===2){ var a=ptrs[ids[0]],b=ptrs[ids[1]]; gest={type:'pinch',d:Math.hypot(a.x-b.x,a.y-b.y),moved:true}; }
});
cv.addEventListener('pointermove',function(e){
  var p=ptrs[e.pointerId]; if(!p||!gest)return;
  var dx=e.offsetX-p.x, dy=e.offsetY-p.y, now=performance.now();
  if(gest.type==='pan'){
    if(Math.hypot(e.offsetX-p.x0,e.offsetY-p.y0)>6)gest.moved=true;
    if(gest.moved){ view.tx+=dx; view.ty+=dy; var dt=Math.max(1,now-p.t); vel={x:dx/dt,y:dy/dt,t:now}; queueDraw(); }
  } else if(gest.type==='pinch'){
    var ids=Object.keys(ptrs); p.x=e.offsetX; p.y=e.offsetY;
    var a=ptrs[ids[0]],b=ptrs[ids[1]], d=Math.hypot(a.x-b.x,a.y-b.y);
    var mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
    if(gest.mx!==undefined){ view.tx+=mx-gest.mx; view.ty+=my-gest.my; }
    if(gest.d>0)zoomAt(d/gest.d,mx,my,false);
    gest.d=d; gest.mx=mx; gest.my=my; return;
  }
  p.x=e.offsetX; p.y=e.offsetY; p.t=now;
});
function endPtr(e){
  var p=ptrs[e.pointerId]; delete ptrs[e.pointerId];
  if(!gest)return;
  if(gest.type==='pan'&&!gest.moved&&p&&performance.now()-gest.t0<450){
    var now=performance.now();
    if(now-lastTap<300){ lastTap=0; zoomAt(2,e.offsetX,e.offsetY,true); haptic('light'); }
    else { lastTap=now; tapAt(e.offsetX,e.offsetY); }
  } else if(gest.type==='pan'&&vel&&performance.now()-vel.t<60&&!matchMedia('(prefers-reduced-motion: reduce)').matches){
    var vx=vel.x*16, vy=vel.y*16;
    (function glide(){ vx*=.92; vy*=.92; view.tx+=vx; view.ty+=vy; draw(true); if(Math.abs(vx)+Math.abs(vy)>.4)anim=requestAnimationFrame(glide); else { draw(); saveView(); } })();
  }
  if(Object.keys(ptrs).length===0){ if(gest.type!=='pan'||gest.moved){ draw(); saveView(); } gest=null; }
  else if(gest.type==='pinch'){ var k=Object.keys(ptrs)[0]; ptrs[k].x0=ptrs[k].x; ptrs[k].y0=ptrs[k].y; gest={type:'pan',moved:true,t0:0}; }
}
cv.addEventListener('pointerup',endPtr); cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('wheel',function(e){ e.preventDefault(); zoomAt(Math.exp(-e.deltaY*.0022),e.offsetX,e.offsetY,false); saveView(); },{passive:false});
document.addEventListener('gesturestart',function(e){ e.preventDefault(); });
function nearest(px,py,maxD){
  var best=null,bd=maxD*maxD;
  city.st.forEach(function(s){ var p=toScreen(s.x,s.y), d=(p[0]-px)*(p[0]-px)+(p[1]-py)*(p[1]-py); if(d<bd){bd=d;best=s.i;} });
  return best;
}
function tapAt(px,py){
  var si=nearest(px,py,24);
  if(si!==null){ haptic('light'); openStation(si); }
  else if(focusSt!==null){ focusSt=null; draw(); }
}
$('zin').onclick=function(){ zoomAt(1.8,W/2,H/2,true); haptic('light'); };
$('zout').onclick=function(){ zoomAt(1/1.8,W/2,H/2,true); haptic('light'); };
$('zfit').onclick=function(){ haptic('light'); fitBox(route?route.box:city.all,24,true); };

/* ---------- City switch ---------- */
function renderCities(){
  $('cities').innerHTML=CITY_LIST.map(function(c){ return '<button role="tab" data-c="'+c.id+'" class="'+(c.id===city.id?'on':'')+'" aria-selected="'+(c.id===city.id)+'">'+esc(c.name)+'</button>'; }).join('');
}
$('cities').addEventListener('click',function(e){ var b=e.target.closest('button'); if(!b||b.dataset.c===city.id)return; haptic('light'); setCity(b.dataset.c); });
function setCity(id,keepSheet){
  city=CITY_LIST.find(function(c){return c.id===id})||CITY_LIST[0]; S.city=city.id; save();
  route=null; focusSt=null; showRouteCard(); renderCities(); setLegend();
  // base scale: the busy middle fills the screen
  var b=city.home, bw=b[2]-b[0];
  baseS=(W-24)/bw;
  var v=S.views[city.id];
  if(v&&v.z){ view.s=baseS*v.z; view.tx=W/2-v.cx*view.s; view.ty=H/2-v.cy*view.s; draw(); }
  else { view.s=baseS; view.tx=W/2-(b[0]+b[2])/2*baseS; view.ty=H/2-(b[1]+b[3])/2*baseS; draw(); }
  if(!keepSheet&&curTab!=='map')openTab(curTab);
}
function setLegend(){
  var t={london:'Tube, Elizabeth line and DLR',paris:'Métro lines 1–14',nyc:'Subway and Staten Island Railway'}[city.id];
  $('legend').textContent=t+' · our own map from open data';
}

/* ---------- Sheets ---------- */
var curTab='map', sheetStack=[];
function openSheet(title,html,opts){
  opts=opts||{};
  $('shTitle').textContent=title; $('shBody').innerHTML=html; $('shBody').scrollTop=0;
  $('shBack').hidden=!opts.back; if(opts.back)$('shBack').textContent='‹ '+opts.back;
  $('sheet').classList.add('open'); placeFab();
  sheetStack.onBack=opts.onBack||null;
}
function closeSheet(){
  $('sheet').classList.remove('open'); placeFab();
  document.querySelectorAll('.tabs button').forEach(function(b){ b.classList.toggle('on',b.dataset.tab==='map'); }); curTab='map';
}
function placeFab(){ requestAnimationFrame(function(){ var c=sheetCover(); $('fab').style.bottom=(c+12)+'px'; $('fab').style.visibility=c?'hidden':''; $('legend').style.display=c?'none':''; }); }
$('shX').onclick=function(){ haptic('light'); closeSheet(); };
$('shBack').onclick=function(){ if(sheetStack.onBack)sheetStack.onBack(); };
// drag the handle down to close
(function(){ var y0=null, sh=$('sheet');
  $('grab').addEventListener('pointerdown',function(e){ y0=e.clientY; sh.style.transition='none'; $('grab').setPointerCapture(e.pointerId); });
  $('grab').addEventListener('pointermove',function(e){ if(y0===null)return; var d=Math.max(0,e.clientY-y0); sh.style.transform='translateY('+d+'px)'; });
  function up(e){ if(y0===null)return; var d=e.clientY-y0; y0=null; sh.style.transition=''; sh.style.transform=''; if(d>90)closeSheet(); }
  $('grab').addEventListener('pointerup',up); $('grab').addEventListener('pointercancel',up);
})();
$('tabs').addEventListener('click',function(e){ var b=e.target.closest('button'); if(!b)return; haptic('light'); openTab(b.dataset.tab); });
function openTab(t){
  curTab=t;
  document.querySelectorAll('.tabs button').forEach(function(b){ b.classList.toggle('on',b.dataset.tab===t); });
  if(t==='map')return closeSheet();
  if(t==='lines')return showLines();
  if(t==='route')return showRoute();
  if(t==='status')return showStatus();
}
function chip(L,lg){ return '<span class="chip'+(lg?' lg':'')+'" style="background:'+L.color+';color:'+L.text+'">'+esc(L.chip)+'</span>'; }
function chipsFor(si,except){ return city.st[si].lines.filter(function(li){return li!==except}).map(function(li){return chip(city.lines[li])}).join(''); }

/* ---------- Lines ---------- */
function showLines(){
  var h=city.lines.map(function(L){
    var n={}; L.pats.forEach(function(p){p.forEach(function(s){n[s]=1})});
    return '<div class="row" data-l="'+L.i+'">'+chip(L,true)+'<div class="t"><b>'+esc(L.name)+'</b><span>'+Object.keys(n).length+' stations'+(L.pats.length>1?' · '+L.pats.length+' routes':'')+'</span></div><span class="chev">›</span></div>';
  }).join('');
  openSheet(city.name+' lines',h);
  $('shBody').onclick=function(e){ var r=e.target.closest('[data-l]'); if(r){ haptic('light'); showLine(+r.dataset.l,0); } };
}
function patName(L,pi){
  var p=L.pats[pi], a=city.st[p[0]].name, b=city.st[p[p.length-1]].name;
  var same=L.pats.filter(function(q){ var x=city.st[q[0]].name,y=city.st[q[q.length-1]].name; return (x===a&&y===b)||(x===b&&y===a); });
  var via='';
  if(same.length>1){ var others={}; same.forEach(function(q){ if(q!==p)q.forEach(function(s){others[s]=1}); });
    var u=p.filter(function(s){return !others[s]}); if(u.length)via=' via '+city.st[u[Math.floor(u.length/2)]].name; }
  return a+' – '+b+via;
}
function showLine(li,pi){
  var L=city.lines[li], p=L.pats[pi];
  var pats=L.pats.length>1?'<div class="pats">'+L.pats.map(function(q,k){return '<button data-p="'+k+'" class="'+(k===pi?'on':'')+'">'+esc(patName(L,k))+'</button>'}).join('')+'</div>':'';
  var col=lineColor(L);
  var h=pats+'<div class="strip" style="--lc:'+col+'">'+p.map(function(si,k){
    var s=city.st[si], ix=s.lines.length>1;
    return '<div class="stop'+(ix?' ix':'')+(k===0||k===p.length-1?' term':'')+'" data-s="'+si+'"><span class="dot"></span><span class="sn">'+esc(s.name)+'</span>'+(ix?'<span class="chips">'+chipsFor(si,li)+'</span>':'')+'</div>';
  }).join('')+'</div>';
  openSheet(L.name,h,{back:'Lines',onBack:showLines});
  $('shBody').onclick=function(e){
    var b=e.target.closest('[data-p]'); if(b){ haptic('light'); showLine(li,+b.dataset.p); return; }
    var r=e.target.closest('[data-s]'); if(r){ haptic('light'); openStation(+r.dataset.s,{back:L.name,onBack:function(){showLine(li,pi)}}); }
  };
  // show the line on the map
  var xs=p.map(function(s){return city.st[s].x}), ys=p.map(function(s){return city.st[s].y});
  fitBox([Math.min.apply(null,xs),Math.min.apply(null,ys),Math.max.apply(null,xs),Math.max.apply(null,ys)],28,true);
}

/* ---------- Station ---------- */
function openStation(si,opts){
  var s=city.st[si]; focusSt=si;
  var h='<div class="chips" style="margin:2px 0 10px">'+s.lines.map(function(li){return chip(city.lines[li],true)}).join('')+'</div>'+

    '<div class="acts2"><button class="btn pri" id="rFrom">Route from here</button><button class="btn" id="rTo">Route to here</button></div>'+
    '<div class="sec">Lines</div>'+s.lines.map(function(li){ var L=city.lines[li];
      return '<div class="row" data-l="'+li+'">'+chip(L)+'<div class="t"><b>'+esc(L.name)+'</b><span>'+esc(towards(L,si))+'</span></div><span class="chev">›</span></div>'; }).join('');

  $('rFrom').onclick=function(){ haptic('light'); R.from=si; if(R.to===si)R.to=null; openTab('route'); };
  $('rTo').onclick=function(){ haptic('light'); R.to=si; if(R.from===si)R.from=null; openTab('route'); };
  $('shBody').onclick=function(e){ var r=e.target.closest('[data-l]'); if(r){ haptic('light'); var li=+r.dataset.l, L=city.lines[li];
    var pi=Math.max(0,L.pats.findIndex(function(p){return p.indexOf(si)>=0})); showLine(li,pi); } };
  var sheetH=Math.min(H*.74,$('sheet').offsetHeight||H*.5);
  var t={s:Math.max(view.s,baseS*2.2)}; t.tx=W/2-s.x*t.s; t.ty=(H-sheetH)/2-s.y*t.s;

}
function towards(L,si){
  var ends={};
  L.pats.forEach(function(p){ var k=p.indexOf(si); if(k<0)return; if(k>0)ends[city.st[p[0]].name]=1; if(k<p.length-1)ends[city.st[p[p.length-1]].name]=1; });
  var e=Object.keys(ends); return e.length?'Towards '+e.slice(0,3).join(', ')+(e.length>3?'…':''):'';
}

/* ---------- Route planner ---------- */
var R={from:null,to:null,cityId:null};
var SPEED_M_PER_MIN=550, DWELL=.5, CHANGE={fast:5,few:25};
function edgeMin(a,b){ var A=city.st[a],B=city.st[b]; return Math.hypot(A.x-B.x,A.y-B.y)*10/SPEED_M_PER_MIN+DWELL; }
/* Dijkstra over (station, line): riding costs minutes, changing line costs a
   penalty — small for "fastest", large for "fewest changes". */
function plan(from,to,mode){
  var pen=CHANGE[mode], dist={}, prev={}, heap=[];
  function push(k,d){ heap.push([d,k]); var i=heap.length-1; while(i>0){ var j=(i-1)>>1; if(heap[j][0]<=heap[i][0])break; var t=heap[i];heap[i]=heap[j];heap[j]=t;i=j; } }
  function pop(){ var top=heap[0], last=heap.pop(); if(heap.length){ heap[0]=last; var i=0; for(;;){ var l=2*i+1,r=l+1,m=i;
    if(l<heap.length&&heap[l][0]<heap[m][0])m=l; if(r<heap.length&&heap[r][0]<heap[m][0])m=r; if(m===i)break; var t=heap[i];heap[i]=heap[m];heap[m]=t;i=m; } } return top; }
  city.st[from].lines.forEach(function(li){ var k=from+':'+li; dist[k]=0; push(k,0); });
  var endKey=null;
  while(heap.length){
    var cur=pop(), d=cur[0], k=cur[1]; if(d>dist[k])continue;
    var parts=k.split(':'), s=+parts[0], li=+parts[1];
    if(s===to){ endKey=k; break; }
    var nb=city.lines[li].adj[s]||{};
    for(var n in nb){ n=+n; var nk=n+':'+li, nd=d+edgeMin(s,n); if(dist[nk]===undefined||nd<dist[nk]-1e-9){ dist[nk]=nd; prev[nk]=k; push(nk,nd); } }
    city.st[s].lines.forEach(function(l2){ if(l2===li)return; var nk=s+':'+l2, nd=d+pen; if(dist[nk]===undefined||nd<dist[nk]-1e-9){ dist[nk]=nd; prev[nk]=k; push(nk,nd); } });
  }
  if(!endKey)return null;
  var path=[], k2=endKey; while(k2){ var q=k2.split(':'); path.unshift([+q[0],+q[1]]); k2=prev[k2]; }
  // legs: runs on one line (a change is a repeated station)
  var legs=[], cur2=null;
  path.forEach(function(p){ if(!cur2||cur2.line!==p[1]){ if(cur2&&cur2.stops.length<2)legs.pop(); cur2={line:p[1],stops:[p[0]]}; legs.push(cur2); } else cur2.stops.push(p[0]); });
  legs=legs.filter(function(g){return g.stops.length>1});
  var mins=0, stops=0; legs.forEach(function(g){ for(var i=1;i<g.stops.length;i++){ mins+=edgeMin(g.stops[i-1],g.stops[i]); stops++; } });
  mins+=Math.max(0,legs.length-1)*4;
  var stSet={}, lineSet={}, xs=[], ys=[];
  legs.forEach(function(g){ lineSet[g.line]=1; g.stops.forEach(function(s){ stSet[s]=1; xs.push(city.st[s].x); ys.push(city.st[s].y); }); });
  return {from:from,to:to,legs:legs,mins:Math.round(mins),stops:stops,changes:legs.length-1,stSet:stSet,lineSet:lineSet,
    box:[Math.min.apply(null,xs),Math.min.apply(null,ys),Math.max.apply(null,xs),Math.max.apply(null,ys)],mode:mode};
}
function legTowards(g){
  var L=city.lines[g.line], a=g.stops[0], b=g.stops[1];
  for(var i=0;i<L.pats.length;i++){ var p=L.pats[i], ia=p.indexOf(a), ib=p.indexOf(b);
    if(ia>=0&&ib>=0&&Math.abs(ia-ib)===1)return city.st[ib>ia?p[p.length-1]:p[0]].name; }
  return city.st[g.stops[g.stops.length-1]].name;
}
function fieldHTML(cls,si,ph){ return '<button class="field '+cls+'" data-f="'+cls+'"><i></i><span class="'+(si===null?'ph':'')+'">'+esc(si===null?ph:city.st[si].name)+'</span></button>'; }
function showRoute(){
  if(R.cityId!==city.id){ if(R.cityId!==null){R.from=R.to=null;} R.cityId=city.id; }
  var h='<div class="pick">'+fieldHTML('from',R.from,'From')+fieldHTML('to',R.to,'To')+'<button class="swap" id="swap" aria-label="Swap"><svg viewBox="0 0 24 24"><path d="M7 4v16M7 20l-3-3M7 20l3-3M17 20V4M17 4l-3 3M17 4l3 3"/></svg></button></div>'+
    '<div class="seg" id="mode"><button data-m="fast" class="'+(S.mode==='fast'?'on':'')+'">Fastest</button><button data-m="few" class="'+(S.mode==='few'?'on':'')+'">Fewest changes</button></div><div id="rOut"></div>';
  openSheet('Plan a route',h);
  $('shBody').onclick=function(e){
    var f=e.target.closest('[data-f]'); if(f){ openSearch(f.dataset.f); return; }
    var m=e.target.closest('[data-m]'); if(m){ S.mode=m.dataset.m; save(); haptic('light'); showRoute(); return; }
    var rr=e.target.closest('[data-rr]'); if(rr){ var it=(rr.dataset.rr==='f'?S.favs:S.recents)[+rr.dataset.i]; if(it){ R.from=idxOf(it.a); R.to=idxOf(it.b); haptic('light'); showRoute(); } return; }
    if(e.target.closest('#swap')){ var t=R.from; R.from=R.to; R.to=t; haptic('light'); showRoute(); return; }
    if(e.target.closest('#rFav')){ toggleFav(); return; }
    if(e.target.closest('#rShow')){ closeSheet(); fitBox(route.box,30,true); return; }
  };
  renderRouteOut();
}
function idxOf(name){ var s=city.st.find(function(x){return x.name===name}); return s?s.i:null; }
function renderRouteOut(){
  var out=$('rOut'); if(!out)return;
  if(R.from===null||R.to===null||R.from===R.to){
    route=null; showRouteCard(); draw();
    var mine=function(list,tag){ return list.map(function(it,i){ return it.c===city.id?'<div class="row" data-rr="'+tag+'" data-i="'+i+'"><div class="t"><b>'+esc(it.a)+' → '+esc(it.b)+'</b></div><span class="chev">›</span></div>':''; }).join(''); };
    var f=mine(S.favs,'f'), r=mine(S.recents,'r');
    out.innerHTML=(R.from!==null&&R.from===R.to?'<p class="note" style="margin-top:12px">Pick two different stations.</p>':'<p class="note" style="margin-top:12px">Choose where you are and where you’re going. Tap any station on the map to start from there.</p>')+
      (f?'<div class="sec">Saved</div>'+f:'')+(r?'<div class="sec">Recent</div>'+r:'');
    return;
  }
  var r1=plan(R.from,R.to,S.mode);
  if(!r1){ out.innerHTML='<p class="note" style="margin-top:12px">No route found between these stations.</p>'; route=null; draw(); return; }
  route=r1; showRouteCard(); remember();
  var fav=S.favs.some(function(it){return it.c===city.id&&it.a===city.st[R.from].name&&it.b===city.st[R.to].name});
  var h='<div class="sum"><b>≈ '+r1.mins+' min</b><span>'+r1.stops+' stop'+(r1.stops===1?'':'s')+' · '+(r1.changes?r1.changes+' change'+(r1.changes>1?'s':''):'no changes')+'</span></div>'+
    '<p class="note">Time is an estimate from distance, not a timetable.</p><div class="legs">';
  r1.legs.forEach(function(g,gi){
    var L=city.lines[g.line], col=lineColor(L), a=city.st[g.stops[0]], n=g.stops.length-1;
    h+='<div class="leg" style="--lc:'+col+'"><span class="pin"></span><div class="lt">'+esc(a.name)+'</div>'+
      '<div class="ld">'+chip(L)+'<span>'+esc(L.name)+(city.id==='london'&&L.id!=='dlr'&&L.id!=='elizabeth'?' line':(L.id==='elizabeth'?' line':''))+' towards '+esc(legTowards(g))+'</span></div>'+
      '<details><summary>'+n+' stop'+(n>1?'s':'')+'</summary><ol>'+g.stops.slice(1).map(function(s){return '<li>'+esc(city.st[s].name)+'</li>'}).join('')+'</ol></details></div>';
    if(gi<r1.legs.length-1)h+='<div class="chg">Change at '+esc(city.st[g.stops[n]].name)+'</div>';
  });
  var last=city.st[R.to];
  h+='<div class="leg end" style="--lc:'+COL['--bad']+'"><span class="pin" style="border-radius:4px"></span><div class="lt">'+esc(last.name)+'</div></div></div>'+
    '<div class="acts2"><button class="btn pri" id="rShow">Show on map</button><button class="btn star'+(fav?' on':'')+'" id="rFav">'+(fav?'★ Saved':'☆ Save')+'</button></div>';
  out.innerHTML=h;
  fitBox(r1.box,28,true);
}
function remember(){
  var it={c:city.id,a:city.st[R.from].name,b:city.st[R.to].name};
  S.recents=S.recents.filter(function(x){return !(x.c===it.c&&x.a===it.a&&x.b===it.b)}); S.recents.unshift(it); save();
}
function toggleFav(){
  var it={c:city.id,a:city.st[R.from].name,b:city.st[R.to].name};
  var i=S.favs.findIndex(function(x){return x.c===it.c&&x.a===it.a&&x.b===it.b});

}
function showRouteCard(){
  var c=$('rcard');
  if(!route){ c.classList.remove('show'); return; }
  $('rcT').textContent=city.st[route.from].name+' → '+city.st[route.to].name;

$('rcOpen').onclick=function(){ haptic('light'); openTab('route'); };
$('rcClear').onclick=function(){ haptic('light'); route=null; R.from=R.to=null; showRouteCard(); draw(); if(curTab==='route')showRoute(); };

/* ---------- Search ---------- */
var searchFor=null;
function openSearch(forWhat){
  searchFor=forWhat; $('q').value=''; $('search').classList.add('open');

function renderResults(q){
  var k=fold(q), list;

  else {

      .sort(function(a,b){ var sa=a.key.indexOf(k)===0?0:(a.key.indexOf(' '+k)>=0?1:2), sb=b.key.indexOf(k)===0?0:(b.key.indexOf(' '+k)>=0?1:2); return sa-sb||b.lines.length-a.lines.length||a.name.localeCompare(b.name); }).slice(0,40);
  }
  $('qRes').innerHTML=(k?'':'<div class="stitle">Busiest stations</div>')+(list.length?list.map(function(s){
    return '<div class="row" data-s="'+s.i+'"><div class="t"><b>'+esc(s.name)+'</b></div><span class="chips">'+s.lines.slice(0,6).map(function(li){return chip(city.lines[li])}).join('')+(s.lines.length>6?'<span class="chip" style="background:var(--chip)">+'+(s.lines.length-6)+'</span>':'')+'</span></div>';

}

/* ---------- Live status ---------- */
var statusCache={};
function getJSON(url){
  if(window.myllmFetch)return window.myllmFetch(url,{headers:{accept:'application/json'}}).then(function(r){ if(!r||!r.ok)throw new Error('HTTP '+(r&&r.status)); return JSON.parse(r.body); });
  return Promise.reject(new Error('Live status needs MyLLM'));
}
function showStatus(){
  var cid=city.id;
  if(cid==='paris'){ openSheet('Paris status','<p class="note" style="margin-top:4px">Live line status isn’t available here for Paris. The map and route planner work fully offline.</p>'+aboutLink()); bindAbout(); return; }
  openSheet(city.name+' status','<div class="skel"></div><div class="skel" style="width:70%"></div><div class="skel" style="width:85%"></div>');
  var c=statusCache[cid];
  if(c&&Date.now()-c.t<120000){ renderStatus(cid,c.d); return; }
  var url=cid==='london'?'https://api.tfl.gov.uk/Line/Mode/tube,elizabeth-line,dlr/Status':'https://api-endpoint.mta.info/Dataservice/mtagtfsfeeds/camsys%2Fsubway-alerts.json';
  getJSON(url).then(function(d){ statusCache[cid]={t:Date.now(),d:d}; if(city.id===cid&&curTab==='status')renderStatus(cid,d); })
  .catch(function(){ if(city.id!==cid||curTab!=='status')return;
    $('shBody').innerHTML='<p class="note" style="margin-top:4px">Couldn’t get live status just now — you may be offline. The map and route planner work without a connection.</p><div class="acts2"><button class="btn" id="stRetry">Try again</button></div>'+aboutLink();
    $('stRetry').onclick=function(){ haptic('light'); showStatus(); }; bindAbout(); });
}
function sev(t){ t=(t||'').toLowerCase(); if(/good service|no issues/.test(t))return 'good'; if(/suspend|closed|closure|not running|no service/.test(t))return 'bad'; return 'warn'; }
function renderStatus(cid,d){
  var h='';
  if(cid==='london'){
    var byId={}; (d||[]).forEach(function(x){ byId[x.id]=x; });
    var bad=0;
    h=city.lines.map(function(L){
      var x=byId[L.id==='elizabeth'?'elizabeth':L.id]; if(!x)return '';
      var sts=(x.lineStatuses||[]), main=sts[0]||{}, t=main.statusSeverityDescription||'Unknown', c=sev(t);
      if(c!=='good')bad++;
      var why=sts.map(function(s){return s.reason}).filter(Boolean)[0]||'';
      return '<div class="st-row">'+chip(L)+'<div class="t"><b class="'+c+'">'+esc(t)+'</b>'+(why?'<p class="clamp">'+esc(why)+'</p>':'')+'</div></div>';
    }).join('');
    h='<p class="note">'+(bad?bad+' line'+(bad>1?'s':'')+' with problems.':'Good service on every line.')+' Updated '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})+'.</p>'+h;
  } else {
    var now=Date.now()/1000, per={};
    (d&&d.entity||[]).forEach(function(en){ var a=en.alert; if(!a)return;
      var act=(a.active_period||[]).some(function(p){ return (!p.start||p.start<=now)&&(!p.end||p.end>=now); }); if(!act&&(a.active_period||[]).length)return;
      var hd=((a.header_text||{}).translation||[]).find(function(t){return t.language==='en'})||((a.header_text||{}).translation||[])[0];
      var type=(a['transit_realtime.mercury_alert']||{}).alert_type||'';
      (a.informed_entity||[]).forEach(function(ie){ if(!ie.route_id)return; (per[ie.route_id]=per[ie.route_id]||[]).push({t:type,h:hd?hd.text:''}); }); });
    var bad=0;
    h=city.lines.map(function(L){
      var rid=L.id.indexOf('·')>0?L.id.split('·')[1]:(L.id==='S'?'GS':(L.id==='SIR'?'SI':L.id));
      var list=per[rid]||[]; var uniq=[]; list.forEach(function(x){ if(uniq.every(function(u){return u.h!==x.h}))uniq.push(x); });
      if(uniq.length)bad++;
      var head=uniq.length?(uniq[0].t||'Service change'):'Good service', c=uniq.length?sev(head):'good';
      return '<div class="st-row">'+chip(L)+'<div class="t"><b class="'+c+'">'+esc(head)+(uniq.length>1?' · '+uniq.length+' alerts':'')+'</b>'+(uniq.length?'<p class="clamp">'+esc(uniq[0].h.replace(/\[[^\]]+\]/g,function(m){return m.slice(1,-1)}))+'</p>':'')+'</div></div>';
    }).join('');
    h='<p class="note">'+(bad?bad+' line'+(bad>1?'s':'')+' with alerts right now.':'No alerts right now.')+' Updated '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})+'.</p>'+h;
  }
  $('shBody').innerHTML=h+aboutLink(); bindAbout();
}

/* myllm-fullscreen-v2 — full screen where MyLLM can also close the app for us
   (myllmClose, 5.6.2+): full screen hides MyLLM's Done, and a page with no way
   out is worse than a repeated title, so elsewhere nothing changes. This page
   pads its own top by env(safe-area-inset-top), so the spacer stays at 0. */
(function(){
  function full(){ return !!(window.myllmClose && window.myllmImmersive); }
  function sync(){
    var f = full();
    document.body.classList.toggle("imm", f);
    var sp = document.querySelector(".imm-safe"); if (sp) sp.style.height = "0px";
    if (!f) return;
    try { window.myllmImmersive(true, { keepAwake:false }).catch(function(){}); } catch(e){}
  }
  window.myllmFSClose = function(){
    try { if (window.myllmHaptic) window.myllmHaptic("light"); } catch(e){}
    try { window.myllmClose().catch(function(){}); } catch(e){}
  };
  document.addEventListener("visibilitychange", function(){ if (!document.hidden) sync(); });
  sync();
})();
