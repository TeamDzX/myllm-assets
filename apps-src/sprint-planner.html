--><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sprint Planner</title>
<style>:root{--build-id:"29f7db33f0";color-scheme:light dark;--ac:#5e5ce6}
*{box-sizing:border-box}
body{font-family:-apple-system,system-ui,sans-serif;margin:0;padding:18px 16px calc(28px + env(safe-area-inset-bottom));background:#f2f2f7;color:#111;-webkit-tap-highlight-color:transparent;max-width:820px;margin-left:auto;margin-right:auto}
@media(prefers-color-scheme:dark){body{background:#000;color:#eee}.item,input,.stat,.pill{background:#1c1c1e}input{color:#eee;border-color:#3a3a3c}.pill{border-color:#3a3a3c}}
h1{font-size:22px;margin:0 0 12px}
.stats{display:flex;gap:8px;margin-bottom:14px}
.stat{flex:1;background:#fff;border-radius:14px;padding:11px 12px;text-align:center;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.stat .n{font-size:22px;font-weight:700;color:var(--ac)}
.stat .l{font-size:11px;opacity:.6;text-transform:uppercase;letter-spacing:.03em;margin-top:2px}
.add input{width:100%;padding:12px;border:1px solid #d1d1d6;border-radius:12px;font-size:15px;background:#fff}
.pills{display:flex;gap:6px;margin:8px 0}
.pill{flex:1;border:1px solid #d1d1d6;background:#fff;border-radius:10px;padding:9px 0;font-size:15px;font-weight:700;color:inherit;text-align:center}
.pill.on{background:var(--ac);color:#fff;border-color:transparent}
button{border:0;border-radius:12px;font-weight:600;font-size:15px}
.act{background:var(--ac);color:#fff;padding:12px 16px;width:100%}
h2{font-size:14px;text-transform:uppercase;letter-spacing:.02em;opacity:.55;margin:20px 2px 8px;display:flex;justify-content:space-between;align-items:center}
h2 .pts{color:var(--ac);font-weight:700}
.item{background:#fff;border-radius:13px;padding:11px 13px;margin-bottom:7px;display:flex;align-items:center;gap:10px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.item.done .t{opacity:.45;text-decoration:line-through}
.item .sp{flex:0 0 auto;min-width:30px;height:30px;padding:0 7px;border-radius:8px;background:rgba(94,92,230,.14);color:var(--ac);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
.item .t{flex:1;font-size:15px;line-height:1.3}
.item .mv{background:#e5e5ea;color:inherit;padding:7px 11px;font-size:13px;border-radius:9px;flex:0 0 auto}
@media(prefers-color-scheme:dark){.item .mv{background:#2c2c2e}}
.item .ck{flex:0 0 auto;width:22px;height:22px;border-radius:50%;border:2px solid #c7c7cc;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px}
.item.done .ck{background:#34c759;border-color:#34c759}
.del{background:none;color:#ff453a;font-size:16px;padding:2px 4px;flex:0 0 auto}
.empty{opacity:.5;text-align:center;margin:16px 0;font-size:14px}
.vel{font-size:13px;opacity:.7;margin-top:6px;line-height:1.6}
.footer{margin-top:16px;display:flex;gap:8px}
.footer button{flex:1;padding:12px}
.ghost{background:#e5e5ea;color:inherit}
@media(prefers-color-scheme:dark){.ghost{background:#2c2c2e}}
</style></head><body>
<h1>🏃 Sprint Planner</h1>
<div class="stats">
  <div class="stat"><div class="n" id="sCommit">0</div><div class="l">Sprint pts</div></div>
  <div class="stat"><div class="n" id="sDone">0</div><div class="l">Done</div></div>
  <div class="stat"><div class="n" id="sVel">–</div><div class="l">Avg velocity</div></div>
</div>

<div class="add">
  <input id="title" placeholder="New story / task…">
  <div class="pills" id="pills"></div>
  <button class="act" onclick="addItem()">Add to backlog</button>
</div>

<h2>Sprint <span class="pts" id="sprintPts">0 pts</span></h2>
<div id="sprintList"></div>

<h2>Backlog <span class="pts" id="backlogPts">0 pts</span></h2>
<div id="backlogList"></div>

<div class="footer">
  <button class="act" onclick="completeSprint()">Complete sprint</button>
</div>
<div class="vel" id="velHist"></div>

<script>
var store=window.myllmStorage||{getItem:function(){return Promise.resolve(null)},setItem:function(){return Promise.resolve()}};
var items=[], velocities=[], pts=3, POINTS=[1,2,3,5,8,13];
var seed=8123;
function el(i){return document.getElementById(i)}
function haptic(k){if(window.myllmHaptic)myllmHaptic(k||'light')}
function uid(){seed=(seed*9301+49297)%233280;return 's'+seed}
function save(){store.setItem('sprint',JSON.stringify({items:items,velocities:velocities}))}
function esc(s){return (s+'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

function buildPills(){
  var p=el('pills');p.innerHTML='';
  POINTS.forEach(function(v){
    var b=document.createElement('button');b.className='pill'+(v===pts?' on':'');b.textContent=v;
    b.onclick=function(){pts=v;buildPills();haptic('selection')};p.appendChild(b);
  });
}
function addItem(){
  var t=el('title').value.trim();if(!t)return;
  items.push({id:uid(),title:t,pts:pts,where:'backlog',done:false});
  el('title').value='';save();render();haptic('light');
}
function move(id){var it=find(id);if(!it)return;it.where=it.where==='backlog'?'sprint':'backlog';if(it.where==='backlog')it.done=false;save();render();haptic('selection')}
function toggle(id){var it=find(id);if(it&&it.where==='sprint'){it.done=!it.done;save();render();haptic('selection')}}
function del(id){items=items.filter(function(x){return x.id!==id});save();render();haptic('light')}
function find(id){return items.filter(function(x){return x.id===id})[0]}
function sum(list){return list.reduce(function(a,b){return a+(b.pts||0)},0)}

function completeSprint(){
  var sprint=items.filter(function(x){return x.where==='sprint'});
  if(!sprint.length){return}
  var done=sprint.filter(function(x){return x.done});
  velocities.push(sum(done));
  // remove completed, send unfinished back to backlog
  items=items.filter(function(x){return !(x.where==='sprint'&&x.done)});
  items.forEach(function(x){if(x.where==='sprint'){x.where='backlog';x.done=false}});
  save();render();haptic('success');
}
function render(){
  var sprint=items.filter(function(x){return x.where==='sprint'});
  var backlog=items.filter(function(x){return x.where==='backlog'});
  var doneP=sum(sprint.filter(function(x){return x.done}));
  el('sCommit').textContent=sum(sprint);el('sDone').textContent=doneP;
  el('sprintPts').textContent=sum(sprint)+' pts';el('backlogPts').textContent=sum(backlog)+' pts';
  el('sVel').textContent=velocities.length?Math.round(velocities.reduce(function(a,b){return a+b},0)/velocities.length):'–';
  drawList('sprintList',sprint,true);drawList('backlogList',backlog,false);
  el('velHist').textContent=velocities.length?('Past sprint velocity: '+velocities.join(', ')+' pts'):'';
}
function drawList(id,list,inSprint){
  var L=el(id);L.innerHTML='';
  if(!list.length){L.innerHTML='<div class="empty">'+(inSprint?'Move backlog items in to plan a sprint.':'Nothing in the backlog.')+'</div>';return}
  list.forEach(function(it){
    var d=document.createElement('div');d.className='item'+(it.done?' done':'');
    var ck=inSprint?'<div class="ck">'+(it.done?'✓':'')+'</div>':'';
    d.innerHTML=ck+'<div class="sp">'+it.pts+'</div><div class="t">'+esc(it.title)+'</div>'+
      '<button class="mv">'+(inSprint?'↩︎':'→ Sprint')+'</button><button class="del">✕</button>';
    if(inSprint)d.querySelector('.ck').onclick=function(){toggle(it.id)};
    d.querySelector('.mv').onclick=function(){move(it.id)};
    d.querySelector('.del').onclick=function(){del(it.id)};
    L.appendChild(d);
  });
}
el('title').addEventListener('keydown',function(e){if(e.key==='Enter')addItem()});
buildPills();
store.getItem('sprint').then(function(v){if(v){try{var o=JSON.parse(v);items=o.items||[];velocities=o.velocities||[]}catch(e){}}render()});
</script></body></html>
