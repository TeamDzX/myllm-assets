<style>
  :root{ color-scheme:light dark;
    --bg:var(--myllm-bg,#f2f2f7); --surface:var(--myllm-surface,#fff); --ink:var(--myllm-text,#111);
    --muted:var(--myllm-muted,#8a8a8e); --line:var(--myllm-border,#e3e3e8); --acc:var(--myllm-accent,#0a84ff); }
  @media (prefers-color-scheme:dark){ :root{ --bg:var(--myllm-bg,#000); --surface:var(--myllm-surface,#1c1c1e);
    --ink:var(--myllm-text,#f2f2f7); --muted:var(--myllm-muted,#8e8e93); --line:var(--myllm-border,#2c2c2e); } }
  @property --h{ syntax:'<number>'; inherits:true; initial-value:185; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{
    font-family:var(--myllm-font,-apple-system,system-ui,sans-serif);
    background:var(--bg); color:var(--ink);
    max-width:600px; margin:0 auto; min-height:100dvh;
    padding:calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
  }
  body.lock{ overflow:hidden; }
  svg.i{ width:1.25em; height:1.25em; fill:currentColor; flex-shrink:0; }
  button{ font:inherit; color:inherit; } button:active{ transform:scale(.96); }
  h1{ font-size:22px; font-weight:800; letter-spacing:-0.02em; margin:6px 2px 14px; display:flex; align-items:center; gap:10px; }
  .tile{ width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; color:#fff; font-size:15px; flex-shrink:0;
    background:linear-gradient(145deg, hsl(178 62% 40%), hsl(218 58% 24%)); }

  .seg{ display:flex; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:3px; margin-bottom:14px; }
  .seg button{
    flex:1; border:none; background:none; color:var(--muted);
    border-radius:11px; padding:10px; min-height:42px; font-size:15px; font-weight:700;
  }
  .seg button.on{ background:var(--acc); color:#fff; }

  .card{ background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:14px; margin-bottom:12px; }

  /* ---- the fan: ±50 cents across ±45°, a green notch where in tune lives ---- */
  .fan{ position:relative; width:var(--s,280px); height:calc(var(--s,280px) * .62); margin:0 auto; flex-shrink:0; }
  .fan svg{ position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
  .fan .rim{ fill:none; stroke:currentColor; stroke-opacity:.16; stroke-width:2; }
  .fan .zone{ fill:none; stroke:#30d158; stroke-width:5; stroke-linecap:round; }
  .fan .tk line{ stroke:currentColor; stroke-opacity:.34; stroke-width:1.6; stroke-linecap:round; }
  .fan .tk line.mid{ stroke:#30d158; stroke-opacity:1; stroke-width:2.6; }
  .needle{
    position:absolute; left:50%; bottom:0; width:4px; height:88%; margin-left:-2px;
    transform-origin:50% 100%; border-radius:4px;
    background:var(--acc);
    transition:transform .12s ease-out, background .12s;
  }
  .needle.good{ background:#30d158; }
  .hub{ position:absolute; left:50%; bottom:-9px; width:18px; height:18px; margin-left:-9px; border-radius:50%; background:var(--acc); transition:background .12s; }
  .hub.good{ background:#30d158; }
  .rest{ --s:min(64vw,250px); color:var(--muted); margin-bottom:16px; }
  .rest .needle, .rest .hub{ background:var(--muted); opacity:.55; }

  /* Input level, shown once the mic is live. Without it a mic delivering
     too-quiet audio looked identical to a working one: no needle, no warning.
     The notch marks the level the pitch detector needs to see. */
  .levelwrap{ display:none; position:relative; height:6px; border-radius:3px; background:rgba(255,255,255,.16); overflow:hidden; width:100%; max-width:340px; flex-shrink:0; }
  .lite .levelwrap{ background:rgba(0,0,0,.1); }
  .levelwrap.on{ display:block; }
  .levelbar{ height:100%; width:0%; border-radius:3px; background:currentColor; opacity:.85; transition:width .08s linear; }
  .levelbar.faint{ background:#ff9f0a; }
  .levelgate{ position:absolute; top:0; bottom:0; left:22%; width:2px; background:currentColor; opacity:.5; }

  .listenmsg{ text-align:center; font-size:13.5px; color:var(--muted); line-height:1.5; padding:6px 8px 2px; }
  .micbtn{
    display:flex; align-items:center; gap:8px; margin:10px auto 2px; border:none; border-radius:99px; padding:0 24px; min-height:48px;
    font-size:15px; font-weight:700; background:var(--acc); color:#fff;
  }

  /* ---- strings ---- */
  .strings{ display:flex; gap:8px; justify-content:center; margin-top:4px; }
  .str{
    flex:1; max-width:64px; aspect-ratio:0.86; border-radius:14px;
    border:1px solid var(--line); background:var(--bg);
    color:var(--ink);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
  }
  .str b{ font-size:19px; font-weight:800; }
  .str small{ font-size:10px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .str.near{ border-color:var(--acc); background:rgba(10,132,255,.1); }
  .str.good{ border-color:#30d158; background:rgba(48,209,88,.12); }
  .str.playing{ border-color:#ff9500; background:rgba(255,149,0,.12); }
  .strhint{ text-align:center; font-size:12px; color:var(--muted); margin-top:8px; }

  /* wraps on narrow phones: a long tuning name used to hold the select at its
     content width and shove the + button off the card edge, because flex items
     don't shrink below min-content unless told to (min-width:0) */
  .optrow{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .optrow label{ flex:0 0 auto; font-size:11.5px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); }
  .optrow select{
    flex:1 1 130px; min-width:0; max-width:100%;
    font-size:16px; padding:9px 10px; border-radius:12px; min-height:42px;
    border:1px solid var(--line); background:var(--bg); color:var(--ink);
  }
  .stepper{ display:flex; align-items:center; gap:2px; flex:0 0 auto; margin-left:auto; }
  .stepper button{
    width:42px; height:42px; border-radius:12px; border:1px solid var(--line);
    background:var(--bg); color:var(--ink); font-size:15px; display:flex; align-items:center; justify-content:center;
  }
  .stepper b{ min-width:64px; text-align:center; font-size:14px; font-variant-numeric:tabular-nums; }

  /* ---- metronome ---- */
  .bpmwrap{ text-align:center; }
  .bpm{ font-size:64px; font-weight:800; letter-spacing:-0.03em; line-height:1; font-variant-numeric:tabular-nums; }
  .bpm small{ font-size:16px; font-weight:650; color:var(--muted); }
  input[type=range]{ width:100%; margin:16px 0 6px; accent-color:var(--acc); }
  .beats{ display:flex; gap:8px; justify-content:center; margin:12px 0 4px; }
  .beat{ width:16px; height:16px; border-radius:50%; background:var(--line); transition:transform .08s, background .08s; }
  .beat.hit{ background:var(--acc); transform:scale(1.45); }
  .beat.hit.acc{ background:#ff9500; }
  .mrow{ display:flex; gap:10px; margin-top:14px; }
  .mrow button{
    flex:1; border:none; border-radius:14px; padding:15px; font-size:16px; font-weight:750;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .playbtn{ background:var(--acc); color:#fff; }
  .playbtn.on{ background:#ff3b30; }
  .tapbtn{ background:var(--bg); color:var(--ink); border:1px solid var(--line) !important; }
  .sig{ display:flex; gap:7px; justify-content:center; margin-top:12px; }
  .sig button{
    flex:1 1 0; min-width:0; max-width:44px; height:42px; border-radius:12px; border:1px solid var(--line);
    background:var(--bg); color:var(--ink); font-size:14px; font-weight:700;
  }
  .sig button.on{ background:var(--acc); border-color:var(--acc); color:#fff; }

  /* ---- the stage: listening takes the whole display. The room's colour says
     which way to turn the peg — blue when flat, amber when sharp, green when
     you're there. ---- */
  .stage{ display:none; position:fixed; inset:0; z-index:50; --h:185; transition:--h .5s ease; color:#fff; overflow:hidden; text-align:center; }
  .stage.on{ display:block; }
  .bg{ position:absolute; inset:0; transition:opacity .6s ease; }
  .bg.d{ background:radial-gradient(120% 90% at 20% 10%, hsl(var(--h) 70% 32%), transparent 60%),
      radial-gradient(120% 90% at 85% 95%, hsl(calc(var(--h) + 40) 60% 24%), transparent 62%), #0b0b10; }
  .bg.l{ opacity:0; background:radial-gradient(120% 90% at 20% 0%, hsl(var(--h) 80% 84%), transparent 60%),
      radial-gradient(120% 90% at 85% 100%, hsl(calc(var(--h) + 40) 76% 87%), transparent 62%), #f4f4f8; }
  .lite{ color:#15151a; } .lite .bg.l{ opacity:1; } .lite .bg.d{ opacity:0; }
  .col{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
    padding:calc(12px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left)); }
  .top{ width:100%; max-width:520px; height:44px; display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
  .lbl{ font-size:11px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; opacity:.62; }
  .glass{ border:1px solid rgba(255,255,255,.16); background:rgba(255,255,255,.12); color:inherit;
    -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px); }
  .lite .glass{ border-color:rgba(0,0,0,.09); background:rgba(255,255,255,.62); }
  .rnd{ width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:15px; }
  .ghost{ visibility:hidden; }
  .body{ flex:1; min-height:0; width:100%; max-width:520px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; }
  .lcol, .rcol{ display:flex; flex-direction:column; align-items:center; gap:12px; width:100%; }
  .stage .needle{ background:currentColor; } .stage .hub{ background:currentColor; }
  .stage .needle.good, .stage .hub.good{ background:#4be07d; }
  .lite.stage .needle.good, .lite.stage .hub.good{ background:#1c9a4a; }
  .lite .fan .zone, .lite .fan .tk line.mid{ stroke:#1c9a4a; }
  .readout{ text-align:center; margin-top:8px; }
  .note{ font-size:calc(var(--s,300px) * .3); font-weight:800; letter-spacing:-0.03em; line-height:1.02; }
  .note sup{ font-size:.42em; font-weight:750; }
  .cents{ font-size:16px; font-weight:700; opacity:.7; min-height:22px; font-variant-numeric:tabular-nums; }
  .cents.good{ color:#4be07d; opacity:1; } .lite .cents.good{ color:#1c9a4a; }
  .freq{ font-size:12.5px; opacity:.5; min-height:18px; font-variant-numeric:tabular-nums; }
  .smsg{ font-size:13.5px; line-height:1.5; opacity:.72; max-width:360px; min-height:20px; flex-shrink:0; }
  .stage .strings{ width:100%; max-width:420px; margin-top:0; }
  .stage .str{ border-color:rgba(255,255,255,.16); background:rgba(255,255,255,.1); color:inherit; max-width:62px;
    -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px); }
  .stage .str small{ color:inherit; opacity:.55; }
  .lite.stage .str{ border-color:rgba(0,0,0,.09); background:rgba(255,255,255,.62); }
  .stage .str.near{ border-color:currentColor; background:rgba(255,255,255,.22); }
  .stage .str.good{ border-color:#4be07d; background:rgba(75,224,125,.22); }
  .stage .str.playing{ border-color:#ff9f0a; background:rgba(255,159,10,.22); }

  @media (max-height:520px){                       /* phone on its side: the fan left, the note and strings right */
    .body{ flex-direction:row; max-width:none; gap:5vw; } .lcol{ width:auto; } .rcol{ width:min(400px,44vw); }
  }
  @media (min-width:768px){ body{ max-width:760px; } }
  @media (prefers-reduced-motion:reduce){ .stage{ transition:none; } }
</style>

<h1><span class="tile"><svg class="i"><use href="#i-fork"/></svg></span>Guitar Tuner</h1>

<div class="seg">
  <button id="tabTune" class="on" onclick="showTab('tune')">Tuner</button>
  <button id="tabMetro" onclick="showTab('metro')">Metronome</button>
</div>

<div id="paneTune">
  <div class="card">
    <div class="fan rest"><svg viewBox="0 0 200 124" aria-hidden="true"><path class="rim" d="M12.3 36.3A124 124 0 0 1 187.7 36.3"/><path class="zone" d="M90.27 .38A124 124 0 0 1 109.73 .38"/><g class="tk"></g></svg><div class="needle" style="transform:rotate(0deg)"></div><div class="hub"></div></div>
    <div class="listenmsg" id="micmsg">The tuner listens through your microphone.</div>

  </div>

  <div class="card">

  <div class="card">

      <select id="preset" onchange="setPreset()"></select>
      <div class="stepper">
        <button onclick="calib(-1)" aria-label="Lower A4"><svg class="i"><use href="#i-minus"/></svg></button>
        <b id="a4">A4 440 Hz</b>
        <button onclick="calib(1)" aria-label="Raise A4"><svg class="i"><use href="#i-plus"/></svg></button>
      </div>
    </div>
  </div>
</div>

<div id="paneMetro" style="display:none">
  <div class="card bpmwrap">
    <div class="bpm"><span id="bpmval">100</span> <small>BPM</small></div>
    <input type="range" id="bpmslider" min="30" max="240" value="100" oninput="setBpm(parseInt(this.value,10))">
    <div class="beats" id="beats"></div>
    <div class="sig" id="sig"></div>
    <div class="mrow">
      <button class="tapbtn" onclick="tapTempo()">Tap tempo</button>
      <button class="playbtn" id="playbtn" onclick="toggleMetro()"><svg class="i"><use href="#i-play"/></svg>Start</button>
    </div>
  </div>
</div>

  <div class="col">

      <button class="glass rnd" id="sClose" aria-label="Stop tuning"><svg class="i"><use href="#i-close"/></svg></button>
      <div class="lbl" id="sLbl">Guitar Tuner</div>

    <div class="body">

        <div class="fan" id="dial"><svg viewBox="0 0 200 124" aria-hidden="true"><path class="rim" d="M12.3 36.3A124 124 0 0 1 187.7 36.3"/><path class="zone" d="M90.27 .38A124 124 0 0 1 109.73 .38"/><g class="tk"></g></svg><div class="needle" id="needle" style="transform:rotate(0deg)"></div><div class="hub" id="hub"></div></div>
        <div class="readout">

<script>
/* The bridge is looked up when used, never kept: MyLLM can add it after this script has run. */
var store = {
  getItem:function(k){ var s = window.myllmStorage; return s ? s.getItem(k) : Promise.resolve(null); },
  setItem:function(k, v){ var s = window.myllmStorage; return s ? s.setItem(k, v) : Promise.resolve(); }
};
function haptic(k){ if(window.myllmHaptic){ try{ myllmHaptic(k||'light'); }catch(_){} } }
function el(id){ return document.getElementById(id); }

var NOTE_NAMES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
var a4 = 440;

var PRESETS = [
  {id:"standard", name:"Standard (E A D G B E)", midi:[40,45,50,55,59,64]},
  {id:"dropd",    name:"Drop D (D A D G B E)",   midi:[38,45,50,55,59,64]},
  {id:"halfdown", name:"Half step down",          midi:[39,44,49,54,58,63]},
  {id:"dadgad",   name:"DADGAD",                  midi:[38,45,50,55,57,62]},
  {id:"openg",    name:"Open G (D G D G B D)",    midi:[38,43,50,55,59,62]}
];
var preset = PRESETS[0];

function midiFreq(m){ return a4 * Math.pow(2, (m - 69) / 12); }
function noteName(m){ return NOTE_NAMES[((m % 12) + 12) % 12]; }
function octaveOf(m){ return Math.floor(m / 12) - 1; }

/* ================= TUNER ================= */
var actx = null, analyser = null, micStream = null, rafId = null;
var buf = null;
var micGain = null;
var recent = [];          /* recent detected freqs for median smoothing */
var lockGood = false;

function ensureCtx(){
  if (!actx){
    var AC = window.AudioContext || window.webkitAudioContext;
    actx = new AC();
  }
  if (actx.state === "suspended") actx.resume();
  return actx;
}

function startMic(){
  haptic("light");
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    el("micmsg").textContent = "Mic isn't available on this version of MyLLM — tune by ear with the reference tones below.";
    el("micbtn").style.display = "none";
    return;
  }
  el("micmsg").textContent = "Starting…";
  /* plain constraints (the shape that's proven in this sandbox); the tuning-
     hostile processing flags are relaxed afterwards, best-effort */
  navigator.mediaDevices.getUserMedia({audio:true})
  .then(function(s){
    micStream = s;
    var tr = s.getAudioTracks()[0];
    if (tr && tr.applyConstraints){
      tr.applyConstraints({echoCancellation:false, noiseSuppression:false, autoGainControl:false}).catch(function(){});
    }
    var ctx = ensureCtx();
    var src = ctx.createMediaStreamSource(s);
    analyser = ctx.createAnalyser();
    analyser.fftSize = 4096;   /* ~93ms window: low-E needs the longer view for cent accuracy */
    /* Makeup gain between source and analyser. iOS hands us a very quiet stream
       when autoGainControl is off (which we want off — AGC pumps the level and
       ruins cent accuracy), quiet enough that the detector's gate never opened
       and nothing moved. This restores level for ANALYSIS only; it is never
       routed to the speakers, so it cannot feed back. */
    micGain = ctx.createGain();
    micGain.gain.value = 1;
    src.connect(micGain);
    micGain.connect(analyser);
    buf = new Float32Array(analyser.fftSize);
    say("Play a string…");
    el("levelwrap").className = "levelwrap on";
    deadFrames = 0; faintFrames = 0; liveSeen = false; autoGain = 1;
    openStage();            /* only once the mic is really open: a refusal never leaves the home screen */
    loop();
  })
  .catch(function(err){
    var name = err && err.name ? " (" + err.name + ")" : "";
    el("micmsg").textContent = "Couldn't open the microphone" + name + ". Check “Allow apps to use the microphone” in Settings → MyLLMos Apps, then reopen — or tune by ear with the reference tones below.";
    closeStage();
  });
}

/* Three states, not two. The old code only distinguished "pure silence" from
   "fine", so a stream that was audible-but-too-quiet fell between them: the
   detector's gate (rms 0.008) never opened and the silence warning (1e-4) never
   fired, leaving "Play a string…" on screen forever with a dead needle. That
   band is now its own state, with makeup gain applied to try to rescue it. */
var deadFrames = 0, faintFrames = 0, liveSeen = false, autoGain = 1;
var GATE = 0.0015;            /* detector floor, post-gain (was 0.008) */
var MAX_GAIN = 24;

function watchSignal(maxAbs, rms){
  /* adapt gain toward putting a normal playing level near 0.15 rms */
  if (rms > 1e-5 && rms < 0.05 && autoGain < MAX_GAIN){
    autoGain = Math.min(MAX_GAIN, autoGain * 1.06);
    if (micGain) micGain.gain.value = autoGain;
  } else if (rms > 0.35 && autoGain > 1){
    autoGain = Math.max(1, autoGain * 0.9);
    if (micGain) micGain.gain.value = autoGain;
  }

  /* level meter: log scale, gate notch sits at 22% (see .levelgate) */
  var bar = el("levelbar");
  if (bar){
    var pct = maxAbs <= 0 ? 0 : Math.max(0, Math.min(100, (20*Math.log(maxAbs)/Math.LN10 + 60) / 60 * 100));
    bar.style.width = pct.toFixed(1) + "%";
    bar.className = "levelbar" + (rms < GATE ? " faint" : "");
  }

  if (liveSeen) return;
  if (maxAbs < 1e-4){
    faintFrames = 0;
    deadFrames++;
    if (deadFrames === 180){   /* ~6s of true zero signal */
      say("The mic connected but no sound is reaching it at all. Check Microphone under the springboard's gear menu → “Allow apps to use”, then reopen — or tune by ear with the reference tones below.");
    }
  } else if (rms < GATE){
    deadFrames = 0;
    faintFrames++;
    if (faintFrames === 240){  /* ~8s of audible-but-unusable input */
      say("I can hear something, but it's far too quiet to read a pitch from. Move the phone closer to the strings and play a single note firmly.");
    }
  } else {
    liveSeen = true;
    if (deadFrames >= 180 || faintFrames >= 240) say("Play a string…");
    deadFrames = 0; faintFrames = 0;
  }
}

/* autocorrelation pitch detector (ACF2+, after Chris Wilson's pitch-detect) */
function autoCorrelate(b, sampleRate){
  var SIZE = b.length, rms = 0, i, j;
  for (i = 0; i < SIZE; i++) rms += b[i]*b[i];
  rms = Math.sqrt(rms / SIZE);
  if (rms < GATE) return -1;

  var r1 = 0, r2 = SIZE - 1, thres = 0.2;
  for (i = 0; i < SIZE/2; i++) if (Math.abs(b[i]) < thres){ r1 = i; break; }
  for (i = 1; i < SIZE/2; i++) if (Math.abs(b[SIZE-i]) < thres){ r2 = SIZE - i; break; }
  b = b.slice(r1, r2);
  SIZE = b.length;
  if (SIZE < 400) return -1;

  /* only correlate lags in the guitar's range (55–1600 Hz) — keeps 4096-sample
     windows cheap enough for realtime */
  var maxLag = Math.min(SIZE - 1, Math.ceil(sampleRate / 55));
  var c = new Float32Array(maxLag + 1);
  for (i = 0; i <= maxLag; i++)
    for (j = 0; j < SIZE - i; j++)
      c[i] += b[j] * b[j+i];

  var d = 0; while (d < maxLag && c[d] > c[d+1]) d++;
  var maxval = -1, maxpos = -1;
  for (i = d; i <= maxLag; i++){
    if (c[i] > maxval){ maxval = c[i]; maxpos = i; }
  }
  if (maxpos <= 0) return -1;
  var T0 = maxpos;
  var x1 = c[T0-1], x2 = c[T0], x3 = c[T0+1] || x2;
  var a = (x1 + x3 - 2*x2) / 2, bb = (x3 - x1) / 2;
  if (a) T0 = T0 - bb / (2*a);
  return sampleRate / T0;
}

function median(arr){
  var s = arr.slice().sort(function(a,b){ return a-b; });
  return s[Math.floor(s.length/2)];
}

var frameFlip = false;
function loop(){
  rafId = requestAnimationFrame(loop);
  if (!analyser) return;
  frameFlip = !frameFlip;
  if (!frameFlip) return;   /* detect at ~30fps — plenty for a needle, half the CPU */
  analyser.getFloatTimeDomainData(buf);
  var maxAbs = 0, sq = 0, n = 0;
  for (var k = 0; k < buf.length; k += 8){ var av = Math.abs(buf[k]); if (av > maxAbs) maxAbs = av; sq += buf[k]*buf[k]; n++; }
  var rms = Math.sqrt(sq / (n || 1));
  watchSignal(maxAbs, rms);
  var f = autoCorrelate(buf, actx.sampleRate);
  if (f > 55 && f < 1600){
    recent.push(f);
    if (recent.length > 7) recent.shift();
    if (recent.length >= 3) showPitch(median(recent));
  } else {
    if (recent.length) recent.shift();
    if (!recent.length) showSilence();
  }
}

function showPitch(f){
  var midiF = 69 + 12 * Math.log(f / a4) / Math.LN2;
  var nearest = Math.round(midiF);
  var cents = (midiF - nearest) * 100;
  el("note").innerHTML = noteName(nearest).replace("#","<sup>♯</sup>") + "<sup>" + octaveOf(nearest) + "</sup>";
  var good = Math.abs(cents) < 5;
  el("cents").textContent = good ? "in tune" : (cents > 0 ? "+" : "") + Math.round(cents) + " cents — tune " + (cents > 0 ? "down" : "up");
  el("cents").className = "cents" + (good ? " good" : "");
  el("freq").textContent = f.toFixed(1) + " Hz";
  var deg = Math.max(-45, Math.min(45, cents * 0.9));
  el("needle").style.transform = "rotate(" + deg + "deg)";
  el("needle").className = "needle" + (good ? " good" : "");
  el("hub").className = "hub" + (good ? " good" : "");
  if (good && !lockGood){ lockGood = true; haptic("success"); }
  if (!good) lockGood = false;

  /* highlight nearest target string */
  var bestI = -1, bestD = 1e9;
  preset.midi.forEach(function(m, i){
    var d = Math.abs(Math.log(f / midiFreq(m)));
    if (d < bestD){ bestD = d; bestI = i; }
  });
  renderStrings(bestI, good);
  stageHue(cents, good);
}
function showSilence(){
  el("note").textContent = "—";
  el("cents").textContent = "";
  el("cents").className = "cents";
  el("freq").textContent = "";
  el("needle").style.transform = "rotate(0deg)";
  el("needle").className = "needle";
  el("hub").className = "hub";
  lockGood = false;
  renderStrings(-1, false);
  stageHue(null, false);
}

/* ---- strings + reference tones ---- */
var playingI = -1, toneNodes = null;

/* Rewritten only when it changes: this runs thirty times a second while a note
   sounds, and a button replaced mid-tap never sees its click. */
var lastStrings = "";
function renderStrings(nearI, good){
  var html = preset.midi.map(function(m, i){
    var cls = i === playingI ? " playing" : (i === nearI ? (good ? " good" : " near") : "");
    return '<button class="str' + cls + '" onclick="playRef(' + i + ')"><b>' + noteName(m) + '</b><small>' +
      midiFreq(m).toFixed(1) + '</small></button>';
  }).join("");
  if (html === lastStrings) return;
  lastStrings = html;
  el("strings").innerHTML = el("sStrings").innerHTML = html;
}

function playRef(i){
  haptic("selection");
  stopTone();
  var ctx = ensureCtx();
  var f = midiFreq(preset.midi[i]);
  var o1 = ctx.createOscillator(), o2 = ctx.createOscillator(), g = ctx.createGain();
  o1.type = "triangle"; o1.frequency.value = f;
  o2.type = "sine"; o2.frequency.value = f * 2;   /* faint octave for a pluckier voice */
  var g2 = ctx.createGain(); g2.gain.value = 0.18;
  o1.connect(g); o2.connect(g2); g2.connect(g);
  g.connect(ctx.destination);
  var t = ctx.currentTime;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.5, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 2.4);
  o1.start(t); o2.start(t);
  o1.stop(t + 2.5); o2.stop(t + 2.5);
  toneNodes = {o1:o1, o2:o2, g:g};
  playingI = i;
  renderStrings(-1, false);
  o1.onended = function(){ if (playingI === i){ playingI = -1; renderStrings(-1, false); } };
}
function stopTone(){
  if (toneNodes){ try{ toneNodes.o1.stop(); toneNodes.o2.stop(); }catch(_){} toneNodes = null; }
  playingI = -1;
}

/* ---- options ---- */
function renderPreset(){
  el("preset").innerHTML = PRESETS.map(function(p){
    return '<option value="' + p.id + '"' + (p.id === preset.id ? " selected" : "") + '>' + p.name + '</option>';
  }).join("");
  el("a4").textContent = "A4 " + a4 + " Hz";
  renderStrings(-1, false);
}
function setPreset(){
  var id = el("preset").value;
  preset = PRESETS.filter(function(p){ return p.id === id; })[0] || PRESETS[0];
  haptic("selection");
  store.setItem("tuner", JSON.stringify({preset:preset.id, a4:a4}));
  renderStrings(-1, false);
}
function calib(dir){
  a4 = Math.max(430, Math.min(450, a4 + dir));
  el("a4").textContent = "A4 " + a4 + " Hz";
  haptic("selection");
  store.setItem("tuner", JSON.stringify({preset:preset.id, a4:a4}));
  renderStrings(-1, false);
}

/* ================= METRONOME =================
   Web Audio lookahead scheduler (25ms timer, 0.12s horizon) */
var mOn = false, bpm = 100, beatsPerBar = 4, beatIdx = 0, nextT = 0, mTimer = null;
var taps = [];

function setBpm(v){
  bpm = Math.max(30, Math.min(240, v));
  el("bpmval").textContent = bpm;
  el("bpmslider").value = bpm;
  store.setItem("metro", JSON.stringify({bpm:bpm, beats:beatsPerBar}));
}
function renderSig(){
  var opts = [1,2,3,4,5,6,7];
  el("sig").innerHTML = opts.map(function(n){
    return '<button class="' + (n === beatsPerBar ? "on" : "") + '" onclick="setSig(' + n + ')">' + n + '</button>';
  }).join("");
  el("beats").innerHTML = Array.apply(null, Array(beatsPerBar)).map(function(){
    return '<div class="beat"></div>';
  }).join("");
}
function setSig(n){
  beatsPerBar = n; beatIdx = 0;
  haptic("selection"); renderSig();
  store.setItem("metro", JSON.stringify({bpm:bpm, beats:beatsPerBar}));
}
function click(t, accent){
  var ctx = ensureCtx();
  var o = ctx.createOscillator(), g = ctx.createGain();
  o.type = "square";
  o.frequency.value = accent ? 1400 : 900;
  o.connect(g); g.connect(ctx.destination);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(accent ? 0.6 : 0.4, t + 0.002);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
  o.start(t); o.stop(t + 0.06);
}
function scheduler(){
  var ctx = ensureCtx();
  while (nextT < ctx.currentTime + 0.12){
    var accent = (beatIdx % beatsPerBar) === 0;
    click(nextT, accent);
    flashBeat(beatIdx % beatsPerBar, accent, (nextT - ctx.currentTime) * 1000);
    nextT += 60 / bpm;
    beatIdx++;
  }
}
function flashBeat(i, accent, delayMs){
  setTimeout(function(){
    var dots = el("beats").children;
    for (var k = 0; k < dots.length; k++) dots[k].className = "beat";
    if (dots[i]) dots[i].className = "beat hit" + (accent ? " acc" : "");
  }, Math.max(0, delayMs));
}
function toggleMetro(){
  haptic("light");
  if (mOn){
    mOn = false;
    clearInterval(mTimer); mTimer = null;
    el("playbtn").innerHTML = '<svg class="i"><use href="#i-play"/></svg>Start'; el("playbtn").className = "playbtn";
  } else {
    var ctx = ensureCtx();
    mOn = true; beatIdx = 0; nextT = ctx.currentTime + 0.08;
    mTimer = setInterval(scheduler, 25);
    el("playbtn").innerHTML = '<svg class="i"><use href="#i-stop"/></svg>Stop'; el("playbtn").className = "playbtn on";
  }
}
function tapTempo(){
  haptic("selection");
  var now = Date.now();
  if (taps.length && now - taps[taps.length-1] > 2200) taps = [];
  taps.push(now);
  if (taps.length > 5) taps.shift();
  if (taps.length >= 2){
    var iv = 0;
    for (var i = 1; i < taps.length; i++) iv += taps[i] - taps[i-1];
    iv /= (taps.length - 1);
    setBpm(Math.round(60000 / iv));
  }
}

/* ================= tabs + boot ================= */
function showTab(which){
  haptic("selection");
  el("paneTune").style.display = which === "tune" ? "block" : "none";
  el("paneMetro").style.display = which === "metro" ? "block" : "none";
  el("tabTune").className = which === "tune" ? "on" : "";
  el("tabMetro").className = which === "metro" ? "on" : "";
  if (which === "metro" && rafId){ /* keep tuner running; it's cheap and users flip back */ }
}

Promise.all([store.getItem("tuner"), store.getItem("metro")]).then(function(vals){
  if (vals[0]){ try{
    var t = JSON.parse(vals[0]);
    if (t.a4) a4 = t.a4;
    var p = PRESETS.filter(function(x){ return x.id === t.preset; })[0];
    if (p) preset = p;
  }catch(e){} }
  if (vals[1]){ try{
    var m = JSON.parse(vals[1]);
    if (m.bpm) bpm = m.bpm;
    if (m.beats) beatsPerBar = m.beats;
  }catch(e){} }
  setBpm(bpm);
  renderPreset();
  renderSig();
});

/* draw dial ticks: ±50 cents in tens, the same 0.9° per cent the needle uses */
(function(){
  var groups = document.querySelectorAll(".fan .tk"), NS = "http://www.w3.org/2000/svg";
  for (var g = 0; g < groups.length; g++) for (var c = -50; c <= 50; c += 10){
    var a = c * 0.9 * Math.PI / 180, r0 = 124, r1 = c === 0 ? 106 : 114, ln = document.createElementNS(NS, "line");
    ln.setAttribute("x1", (100 + r0 * Math.sin(a)).toFixed(2)); ln.setAttribute("y1", (124 - r0 * Math.cos(a)).toFixed(2));
    ln.setAttribute("x2", (100 + r1 * Math.sin(a)).toFixed(2)); ln.setAttribute("y2", (124 - r1 * Math.cos(a)).toFixed(2));
    if (c === 0) ln.setAttribute("class", "mid");
    groups[g].appendChild(ln);
  }
})();

/* ================= the stage =================
   Display only. Nothing here touches the stream, the analyser or the detector
   beyond stopping them when the stage is closed. */
var stageOn = false;
function say(t){ el("micmsg").textContent = t; el("sMsg").textContent = t; }
function isLight(){ return !(window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches); }
/* Where MyLLM can't hide its own title bar, a dark stage under a white bar
   looks cut in half — so in light mode, without myllmImmersive, it stays light. */
function syncLook(){ el("stage").className = "stage" + (stageOn ? " on" : "") + (isLight() && !window.myllmImmersive ? " lite" : ""); }
function syncChrome(){
  if (!window.myllmImmersive) return;
  try { myllmImmersive(stageOn, {keepAwake:stageOn}).catch(function(){}); } catch(_){}    /* both hands are on the guitar */
}
/* flat cools toward blue, sharp warms toward amber, in tune is green */
function stageHue(cents, good){
  var h = cents == null ? 185 : good ? 140 : cents < 0 ? 168 + Math.min(1, -cents / 30) * 50 : 92 - Math.min(1, cents / 30) * 62;
  el("stage").style.setProperty("--h", String(Math.round(h)));
}
function fit(){
  var b = document.querySelector(".stage .body"); if (!b || !b.clientWidth) return;
  var wide = window.innerHeight <= 520;
  var s = wide ? Math.min(b.clientWidth * .44, (b.clientHeight - 64) / .95, 360) : Math.min(b.clientWidth * .94, (b.clientHeight - 210) / 1.0, 360);
  el("stage").style.setProperty("--s", Math.max(170, Math.floor(s)) + "px");
}
function openStage(){
  stageOn = true; recent = [];
  el("sLbl").textContent = preset.name.replace(/\s*\(.*\)$/, "") + " · A4 " + a4;
  syncLook(); document.body.classList.add("lock");
  fit(); syncChrome();
}
function closeStage(){
  var was = stageOn;
  stageOn = false;
  if (rafId){ cancelAnimationFrame(rafId); rafId = null; }
  if (micStream){ try { micStream.getTracks().forEach(function(t){ t.stop(); }); } catch(_){} micStream = null; }
  analyser = null;
  if (was){ showSilence(); el("micmsg").textContent = "The tuner listens through your microphone."; el("levelwrap").className = "levelwrap"; }
  syncLook(); document.body.classList.remove("lock");
  if (was) syncChrome();
}
el("sClose").onclick = function(){ haptic("light"); closeStage(); };
document.addEventListener("visibilitychange", function(){
  if (!document.hidden && stageOn) syncChrome();          /* MyLLM puts its bars back when the app is left */
});
if (window.matchMedia){
  var mq = matchMedia("(prefers-color-scheme: dark)");
  if (mq.addEventListener) mq.addEventListener("change", syncLook); else if (mq.addListener) mq.addListener(syncLook);
}
window.addEventListener("resize", fit);
</script>
