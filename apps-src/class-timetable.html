<title>Class Timetable</title>
<meta name="myllm:immersive" content="on">
<style>:root{--build-id:"e444e82878";color-scheme:light dark;
  --bg:var(--myllm-bg,#f2f2f7); --surface:var(--myllm-surface,#fff); --ink:var(--myllm-text,#111);
  --muted:var(--myllm-muted,#8a8a8e); --line:var(--myllm-border,#e3e3e8); --acc:var(--myllm-accent,#0a84ff);
  --fill:rgba(120,120,128,.12); --h:186; }
@media (prefers-color-scheme:dark){ :root{ --bg:var(--myllm-bg,#000); --surface:var(--myllm-surface,#1c1c1e);
  --ink:var(--myllm-text,#f2f2f7); --muted:var(--myllm-muted,#8e8e93); --line:var(--myllm-border,#2c2c2e); --fill:rgba(120,120,128,.24); } }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ font-family:var(--myllm-font,-apple-system,system-ui,sans-serif); background:var(--bg); color:var(--ink); min-height:100dvh; font-size:15.5px; line-height:1.4; }
  body.lock{ overflow:hidden; }
  .home{ max-width:600px; margin:0 auto;
    padding:calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(30px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left)); }
  @media (min-width:768px){ .home{ max-width:760px; } }
  svg.i{ width:1.25em; height:1.25em; fill:currentColor; flex-shrink:0; }
  button{ font:inherit; color:inherit; cursor:pointer; } button:active{ transform:scale(.96); }
  [hidden]{ display:none !important; }

  .head{ display:flex; align-items:center; gap:12px; margin:2px 2px 14px; }
  .tile{ display:flex; align-items:center; justify-content:center; color:#fff; flex-shrink:0;
    background:linear-gradient(145deg, hsl(var(--h) 62% 50%), hsl(calc(var(--h) + 40) 58% 28%)); }
  .head .tile{ width:44px; height:44px; border-radius:13px; font-size:19px; }
  .head .ht{ flex:1; min-width:0; }
  h1{ font-size:22px; font-weight:800; letter-spacing:-.01em; }
  .head p{ font-size:13px; color:var(--muted); margin-top:1px; }
  .head .acts{ display:flex; gap:8px; flex-shrink:0; }
  h2.sec{ font-size:12px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); margin:20px 2px 9px; }

  .hero{ border-radius:20px; padding:16px 18px; color:#fff; margin-bottom:12px; display:flex; align-items:center; gap:16px;
    background:linear-gradient(145deg, hsl(var(--h) 62% 46%), hsl(calc(var(--h) + 40) 58% 24%)); box-shadow:0 10px 28px hsl(var(--h) 60% 30% / .25); }
  .hero .n{ font-size:44px; font-weight:800; line-height:1; letter-spacing:-.03em; font-variant-numeric:tabular-nums; flex-shrink:0; }
  .hero .k{ display:block; font-size:11px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; opacity:.78; }
  .hero b{ display:block; font-size:17px; font-weight:750; line-height:1.25; overflow-wrap:anywhere; }
  .hero span.s{ display:block; font-size:12.5px; line-height:1.4; opacity:.82; margin-top:3px; overflow-wrap:anywhere; }
  .hero .grow{ flex:1; min-width:0; }

  .card{ background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:14px; margin-bottom:12px; }
  label{ display:block; font-size:12px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); margin:14px 2px 7px; }
  label:first-child{ margin-top:0; }
  input, textarea, select{ width:100%; font:inherit; font-size:16px; padding:12px; border-radius:12px; border:1px solid var(--line); background:var(--bg); color:var(--ink); outline:none; }
  input:focus, textarea:focus{ border-color:hsl(var(--h) 60% 55%); }
  .go{ width:100%; min-height:50px; margin-top:14px; border:none; border-radius:14px; background:hsl(var(--h) 62% 52%); color:#fff; font-size:16px; font-weight:700;
    display:flex; align-items:center; justify-content:center; gap:8px; box-shadow:0 8px 20px hsl(var(--h) 60% 40% / .25); }
  .go.soft{ background:var(--fill); color:var(--ink); box-shadow:none; }
  .go:disabled{ opacity:.55; }
  .status{ font-size:13px; color:var(--muted); min-height:18px; margin-top:10px; text-align:center; line-height:1.45; }
  .status.err{ color:#ff453a; }
  .spin{ width:16px; height:16px; border-radius:50%; border:2.4px solid currentColor; border-right-color:transparent; animation:spin .8s linear infinite; flex-shrink:0; display:inline-block; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .empty{ text-align:center; padding:24px 18px 14px; }
  .empty .tile{ width:48px; height:48px; border-radius:14px; font-size:21px; margin:0 auto 10px; opacity:.9; }
  .empty b{ display:block; font-size:16px; font-weight:750; }
  .empty p{ font-size:13.5px; color:var(--muted); line-height:1.5; max-width:280px; margin:5px auto 0; }
  @media (prefers-reduced-motion:reduce){ .spin{ animation-duration:2.4s; } button:active{ transform:none; } }

  .days{ display:grid; grid-template-columns:repeat(7,1fr); gap:5px; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:4px; margin-bottom:12px; }
  .days button{ position:relative; min-height:42px; border:none; background:none; border-radius:10px; font-size:13.5px; font-weight:700; color:var(--muted); }
  .days button.on{ background:hsl(var(--h) 62% 44%); color:#fff; }
  .days button.today::after{ content:""; position:absolute; left:50%; bottom:5px; width:5px; height:5px; margin-left:-2.5px; border-radius:50%; background:hsl(var(--h) 70% 50%); }
  .days button.on.today::after{ background:#fff; }
  .slot{ display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); cursor:pointer; }
  .slot:first-child{ padding-top:2px; } .slot:last-child{ border-bottom:none; padding-bottom:2px; }
  .slot .time{ width:48px; flex-shrink:0; font-size:13px; font-weight:700; color:var(--muted); font-variant-numeric:tabular-nums; }
  .slot .bar{ width:4px; align-self:stretch; min-height:36px; border-radius:99px; background:var(--fill); flex-shrink:0; }
  .slot .info{ flex:1; min-width:0; }
  .slot .subj{ font-size:16px; font-weight:650; overflow-wrap:anywhere; }
  .slot .subj.empty{ font-weight:500; color:var(--muted); }
  .slot .room{ display:flex; align-items:center; gap:4px; font-size:12.5px; color:var(--muted); margin-top:2px; }
  .slot .room svg{ font-size:11px; }
  .now{ font-size:10px; font-weight:800; letter-spacing:.08em; color:#fff; background:hsl(var(--h) 62% 44%); border-radius:6px; padding:3px 7px; flex-shrink:0; }
  .row2{ display:flex; gap:10px; }
  .row2 .go{ margin-top:0; }
  .hint{ font-size:12px; color:var(--muted); text-align:center; margin-top:12px; }

  /* the whole week, where there's room for it */
  .week{ display:none; }
  @media (min-width:700px){
    .daylist{ display:none; }
    .week{ display:grid; grid-template-columns:56px repeat(7,minmax(0,1fr)); gap:4px; }
    .week .dh{ text-align:center; font-size:12px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); padding:6px 0; border-radius:10px; }
    .week .dh.today{ color:#fff; background:hsl(var(--h) 62% 44%); }
    .week .tm{ font-size:12.5px; font-weight:700; color:var(--muted); font-variant-numeric:tabular-nums; padding-top:10px; }
    .week .c{ min-height:58px; border-radius:12px; background:var(--surface); border:1px solid var(--line); padding:7px 8px; cursor:pointer; overflow:hidden; position:relative; }
    .week .c.today{ background:hsl(var(--h) 70% 50% / .08); border-color:hsl(var(--h) 60% 50% / .35); }
    .week .c.live{ box-shadow:0 0 0 2px hsl(var(--h) 62% 50%); }
    .week .c b{ display:block; font-size:13px; font-weight:700; line-height:1.25; overflow-wrap:anywhere; padding-left:6px; }
    .week .c span{ display:block; font-size:11px; color:var(--muted); margin-top:2px; padding-left:6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .week .c i{ position:absolute; left:0; top:0; bottom:0; width:4px; }
    .week .c.free b{ color:var(--muted); font-weight:500; }
  }

  /* in-page editor (the web view has no prompt/confirm) */
  .overlay{ position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.42); display:none; align-items:center; justify-content:center;
    padding:calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom)); }
  .overlay.show{ display:flex; }
  .modal{ width:100%; max-width:360px; background:var(--surface); border:1px solid var(--line); border-radius:22px; padding:18px; box-shadow:0 20px 50px rgba(0,0,0,.35); }
  .modal h3{ font-size:17px; font-weight:800; margin-bottom:12px; }
  .modal input{ margin-bottom:10px; -webkit-user-select:text; user-select:text; }
  .mbtns{ display:flex; gap:8px; margin-top:4px; }
  .mbtns button{ flex:1; min-height:46px; border:none; border-radius:12px; font-size:15px; font-weight:700; background:hsl(var(--h) 62% 44%); color:#fff; }
  .mbtns .msec{ background:var(--fill); color:var(--ink); }
  .mbtns .mclr{ background:rgba(255,69,58,.14); color:#e0342a; }
  @media (prefers-color-scheme:dark){ .mbtns .mclr{ color:#ff6b62; } }

/* myllm-fullscreen-v1 — MyLLM 5.6.2+ opens this app full screen; the ✕ is the way out. */
.head .imm-acts{display:none;flex-shrink:0;margin-left:auto}
.head .acts + .imm-acts{margin-left:0}
body.imm .head .imm-acts{display:flex}
.head .imm-acts button{width:40px;height:40px;border-radius:12px;border:1px solid var(--myllm-border,rgba(128,128,128,.28));
  background:var(--myllm-surface,rgba(128,128,128,.12));color:var(--myllm-text,currentColor);display:grid;place-items:center;padding:0;cursor:pointer;transition:transform .12s}
.head .imm-acts button:active,.head .imm-x:active{transform:scale(.94)}
.head .imm-x{display:none !important}
body.imm .head .imm-x{display:grid !important;place-items:center}
.imm-x svg,.imm-acts svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}
.imm-safe{display:none}
body.imm .imm-safe{display:block}
</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-cal" viewBox="0 0 24 24"><path d="M7 2.8a1 1 0 0 1 1 1V5h8V3.8a1 1 0 0 1 2 0V5h.5A2.5 2.5 0 0 1 21 7.5v11a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 18.5v-11A2.5 2.5 0 0 1 5.5 5H6V3.8a1 1 0 0 1 1-1zM5 10.2v8.3c0 .3.2.5.5.5h13c.3 0 .5-.2.5-.5v-8.3z" fill="currentColor"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 2.5a7 7 0 0 1 7 7c0 4.8-5.4 10.4-6.3 11.3a1 1 0 0 1-1.4 0C10.4 19.9 5 14.3 5 9.5a7 7 0 0 1 7-7zm0 4.3a2.7 2.7 0 1 0 0 5.4 2.7 2.7 0 0 0 0-5.4z" fill="currentColor"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><path d="M12 2.5a9.5 9.5 0 1 1 0 19 9.5 9.5 0 0 1 0-19zm0 2a7.5 7.5 0 1 0 0 15 7.5 7.5 0 0 0 0-15zm0 2.5a1 1 0 0 1 1 1v3.6l2.6 1.5a1 1 0 1 1-1 1.7l-3.1-1.8A1 1 0 0 1 11 12V8a1 1 0 0 1 1-1z" fill="currentColor"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M9.5 3h5a1 1 0 0 1 1 1v1H20a1 1 0 0 1 0 2h-1l-.9 12.2A2 2 0 0 1 16.1 21H7.9a2 2 0 0 1-2-1.8L5 7H4a1 1 0 0 1 0-2h4.5V4a1 1 0 0 1 1-1z" fill="currentColor"/></symbol>
</defs></svg>
<div class="home">
  <div class="imm-safe"></div><div class="head">
    <div class="tile"><svg class="i"><use href="#i-cal"/></svg></div>
    <div class="ht"><h1>Class Timetable</h1><p>Your week of lessons at a glance</p></div>
  <div class="imm-acts"><button type="button" aria-label="Close Class Timetable" onclick="myllmFSClose()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div></div>

  <div class="hero">
    <div class="grow"><span class="k" id="hK">Today</span><b id="hT">Nothing on today</b><span class="s" id="hS"></span></div>
  </div>

  <div class="days" id="tabs"></div>
  <div class="card daylist" id="slots"></div>
  <div class="week" id="week"></div>

  <div class="row2" style="margin-top:12px">
    <button class="go soft" type="button" id="timesBtn"><svg class="i"><use href="#i-clock"/></svg>Period times</button>
    <button class="go soft" type="button" id="clearBtn"><svg class="i"><use href="#i-trash"/></svg><span id="clearLbl">Clear this day</span></button>
  </div>
  <div class="hint">Tap a slot to add a lesson. Saved on-device, private to this app.</div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h3 id="m-title"></h3>
    <input id="m-f1" autocapitalize="words" autocomplete="off">
    <input id="m-f2" autocomplete="off">
    <div class="mbtns">
      <button class="msec" type="button" id="m-cancel">Cancel</button>
      <button id="m-clear" class="mclr" type="button">Clear</button>
      <button type="button" id="m-save">Save</button>
    </div>
  </div>
</div>

<script>
function el(i){return document.getElementById(i)}
/* Bridges are looked up when used, never kept: MyLLM can add them after this
   script has run. */
function store(){return window.myllmStorage||{getItem:function(){return Promise.resolve(null)},setItem:function(){return Promise.resolve()}}}
function haptic(k){if(window.myllmHaptic)try{myllmHaptic(k)}catch(e){}}
function icon(n){return '<svg class="i"><use href="#i-'+n+'"/></svg>'}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var DAYS=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
var COLORS=["#ff453a","#ff9f0a","#ffd60a","#30d158","#40c8e0","#5e5ce6","#bf5af2","#ff375f"];
var DEFTIMES=["09:00","10:00","11:00","12:00","14:00","15:00"];
var data={times:DEFTIMES.slice(),grid:{}};   // grid[day] = [{subj,room}]
function todayIdx(){var g=new Date().getDay();return g===0?6:g-1}
var day=todayIdx();
function save(){store().setItem('tt',JSON.stringify(data))}
function colorFor(s){if(!s)return'';var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return COLORS[h%COLORS.length]}
function cell(d,p){var row=data.grid[d]||[];return row[p]||{subj:'',room:''}}
function startMins(t){var x=String(t).split(':');return(+x[0])*60+(+x[1])}
function nowMins(){var n=new Date();return n.getHours()*60+n.getMinutes()}

/* the period running right now on the selected day (periods are an hour, as before) */
function nowSlot(d){
  if((d==null?day:d)!==todayIdx())return -1;
  var mins=nowMins();
  for(var i=0;i<data.times.length;i++){var s=startMins(data.times[i]);if(mins>=s&&mins<s+60)return i}
  return -1;
}
function endTime(t){var m=startMins(t)+60;return String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}

function renderHero(){
  var t=todayIdx(),mins=nowMins(),live=nowSlot(t),k='Today · '+DAYS[t],title,sub='';
  var lessons=data.times.map(function(tm,p){return{p:p,tm:tm,c:cell(DAYS[t],p)}}).filter(function(x){return x.c.subj});
  if(live>=0&&cell(DAYS[t],live).subj){var c=cell(DAYS[t],live);k='Now · until '+endTime(data.times[live]);title=c.subj;sub=c.room?'Room '+c.room:''}
  else{
    var next=lessons.filter(function(x){return startMins(x.tm)>mins})[0];
    if(next){k='Next · '+next.tm;title=next.c.subj;sub=next.c.room?'Room '+next.c.room:''}
    else if(lessons.length){title='Done for today';sub=lessons.length+(lessons.length===1?' lesson':' lessons')+' today'}
    else{title='Nothing on today';sub='Tap a slot below to add a lesson.'}
  }
  el('hK').textContent=k;el('hT').textContent=title;el('hS').textContent=sub;el('hS').hidden=!sub;
}
function renderTabs(){
  var T=el('tabs');T.innerHTML='';
  DAYS.forEach(function(d,i){
    var b=document.createElement('button');b.type='button';b.className=(i===day?'on':'')+(i===todayIdx()?' today':'');b.textContent=d;
    b.onclick=function(){day=i;render();haptic('selection')};T.appendChild(b);
  });
}
function renderDay(){
  var S=el('slots');S.innerHTML='';var live=nowSlot();
  data.times.forEach(function(time,p){
    var c=cell(DAYS[day],p);
    var div=document.createElement('div');div.className='slot';
    var tm=document.createElement('div');tm.className='time';tm.textContent=time;
    var bar=document.createElement('div');bar.className='bar';if(c.subj)bar.style.background=colorFor(c.subj);
    var info=document.createElement('div');info.className='info';
    var sj=document.createElement('div');sj.className='subj'+(c.subj?'':' empty');sj.textContent=c.subj||'Free — tap to set';
    info.appendChild(sj);
    if(c.room){var rm=document.createElement('div');rm.className='room';rm.innerHTML=icon('pin')+'<span>'+esc(c.room)+'</span>';info.appendChild(rm)}
    div.appendChild(tm);div.appendChild(bar);div.appendChild(info);
    if(p===live){var n=document.createElement('span');n.className='now';n.textContent='NOW';div.appendChild(n)}
    div.onclick=function(){editCell(p)};
    S.appendChild(div);
  });
}
function renderWeek(){
  var W=el('week');W.innerHTML='';var t=todayIdx();
  W.appendChild(document.createElement('div'));
  DAYS.forEach(function(d,i){var h=document.createElement('div');h.className='dh'+(i===t?' today':'');h.textContent=d;W.appendChild(h)});
  data.times.forEach(function(time,p){
    var tm=document.createElement('div');tm.className='tm';tm.textContent=time;W.appendChild(tm);
    DAYS.forEach(function(d,i){
      var c=cell(d,p),x=document.createElement('div');
      x.className='c'+(i===t?' today':'')+(c.subj?'':' free')+(i===t&&nowSlot(i)===p?' live':'');
      x.innerHTML=(c.subj?'<i style="background:'+colorFor(c.subj)+'"></i>':'')+'<b>'+esc(c.subj||'—')+'</b>'+(c.room?'<span>'+esc(c.room)+'</span>':'');
      x.onclick=function(){day=i;renderTabs();editCell(p)};
      W.appendChild(x);
    });
  });
}
function render(){renderHero();renderTabs();renderDay();renderWeek();el('clearLbl').textContent=clearArmed?'Tap again to clear':'Clear '+DAYS[day]}

// In-app editor — the sandboxed web view has no prompt()/confirm() dialogs, so
// we use a real in-page modal instead (this was why tapping a slot did nothing).
var modalMode=null,modalP=-1,clearArmed=false,clearT=null;
function openModal(){el('overlay').classList.add('show');setTimeout(function(){el('m-f1').focus()},60)}
function closeModal(){el('overlay').classList.remove('show');modalMode=null}
function editCell(p){
  modalMode='cell';modalP=p;var c=cell(DAYS[day],p);
  el('m-title').textContent=DAYS[day]+' · '+data.times[p];
  el('m-f1').placeholder='Subject (e.g. Maths)';el('m-f1').value=c.subj||'';
  el('m-f2').style.display='';el('m-f2').placeholder='Room / location (optional)';el('m-f2').value=c.room||'';
  el('m-clear').style.display='';
  openModal();
}
function editTimes(){
  modalMode='times';
  el('m-title').textContent='Period start times';
  el('m-f1').placeholder='e.g. 09:00, 10:00, 11:00';el('m-f1').value=data.times.join(', ');
  el('m-f2').style.display='none';el('m-clear').style.display='none';
  openModal();
}
function modalSave(){
  if(modalMode==='cell'){
    if(!data.grid[DAYS[day]])data.grid[DAYS[day]]=[];
    data.grid[DAYS[day]][modalP]={subj:el('m-f1').value.trim(),room:el('m-f2').value.trim()};
    save();render();
  }else if(modalMode==='times'){
    var arr=el('m-f1').value.split(',').map(function(x){return x.trim()}).filter(function(x){return/^\d{1,2}:\d{2}$/.test(x)});
    if(arr.length){data.times=arr;save();render()}
  }
  closeModal();haptic('light');
}
function modalClear(){
  if(modalMode==='cell'&&data.grid[DAYS[day]]){data.grid[DAYS[day]][modalP]={subj:'',room:''};save();render()}
  closeModal();
}
function clearDay(){
  if(!clearArmed){clearArmed=true;render();
    clearT=setTimeout(function(){clearArmed=false;render()},2500);return}
  clearArmed=false;clearTimeout(clearT);
  data.grid[DAYS[day]]=[];save();render();haptic('warning');
}
el('timesBtn').onclick=editTimes;el('clearBtn').onclick=clearDay;
el('m-cancel').onclick=closeModal;el('m-clear').onclick=modalClear;el('m-save').onclick=modalSave;
['m-f1','m-f2'].forEach(function(id){el(id).addEventListener('keydown',function(e){if(e.key==='Enter')modalSave()})});
el('overlay').addEventListener('click',function(e){if(e.target===el('overlay'))closeModal()});
setInterval(function(){if(!document.hidden)renderHero()},60000);

/* myllm-fullscreen-v1 — full screen where MyLLM can also close the app for us (myllmClose,
   5.6.2+): full screen hides MyLLM's Done, and a page with no way out is
   worse than a repeated title, so elsewhere nothing changes. The spacer keeps
   the header clear of the status bar only if the page doesn't already. */
(function(){
  function full(){ return !!(window.myllmClose && window.myllmImmersive); }
  function inset(){
    var p = document.createElement("div");
    p.style.cssText = "position:fixed;top:0;left:0;width:1px;visibility:hidden;height:env(safe-area-inset-top)";
    document.body.appendChild(p); var h = p.offsetHeight; p.parentNode.removeChild(p); return h;
  }
  function fit(){
    var sp = document.querySelector(".imm-safe"), head = document.querySelector(".head");
    if (!sp || !head) return;
    sp.style.height = "0px";
    if (!document.body.classList.contains("imm")) return;
    var need = inset() + 6 - (head.getBoundingClientRect().top + window.scrollY);
    sp.style.height = Math.max(0, Math.round(need)) + "px";
  }
  function sync(){
    var f = full();
    document.body.classList.toggle("imm", f);
    fit();
    if (!f) return;
    try { window.myllmImmersive(true, { keepAwake:false }).catch(function(){}); } catch(e){}
  }
  window.myllmFSClose = function(){
    try { if (window.myllmHaptic) window.myllmHaptic("light"); } catch(e){}
    try { window.myllmClose().catch(function(){}); } catch(e){}
  };
  document.addEventListener("visibilitychange", function(){ if (!document.hidden) sync(); });
  window.addEventListener("resize", fit);
  sync();
})();
</script></body></html>
