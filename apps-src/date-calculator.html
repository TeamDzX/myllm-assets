<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Date Calculator</title>
<style>
:root{
  color-scheme:light dark;
  --bg:var(--myllm-bg,#f2f2f7);--surface:var(--myllm-surface,#fff);
  --text:var(--myllm-text,#111);--muted:var(--myllm-muted,#6b6b72);
  --accent:var(--myllm-accent,#0b5ed7);--border:var(--myllm-border,rgba(120,120,128,.25));
  --radius:var(--myllm-radius,14px);--font:var(--myllm-font,-apple-system,system-ui,sans-serif);
}
@media(prefers-color-scheme:dark){:root{--bg:var(--myllm-bg,#000);--surface:var(--myllm-surface,#1c1c1e);--text:var(--myllm-text,#eee);--muted:var(--myllm-muted,#98989f)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text)}
.wrap{max-width:560px;margin:0 auto;padding:16px}
.seg{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:3px;margin-bottom:18px}
.seg button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-weight:600;font-size:14px;padding:10px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff}
label{display:block;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin:0 0 6px}
.field{margin-bottom:16px}
input[type=date]{width:100%;padding:12px;border:1px solid var(--border);border-radius:11px;font:inherit;font-size:16px;background:var(--surface);color:var(--text)}
.opseg{display:flex;gap:8px;margin-bottom:16px}
.opseg button{flex:1;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:11px;padding:12px;font:inherit;font-weight:700;font-size:16px;cursor:pointer}
.opseg button.on{background:var(--accent);color:#fff;border-color:transparent}
.amts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.amt label{margin-bottom:4px}
.amt input{width:100%;padding:11px;border:1px solid var(--border);border-radius:10px;font:inherit;font-size:17px;background:var(--surface);color:var(--text);text-align:center}
.today{background:none;border:0;color:var(--accent);font:inherit;font-weight:600;font-size:13px;cursor:pointer;padding:2px 0}
.result{background:var(--accent);color:#fff;border-radius:var(--radius);padding:18px;text-align:center;margin-top:4px}
.result .big{font-size:26px;font-weight:700;line-height:1.2}
.result .sub{font-size:14px;opacity:.9;margin-top:6px}
.result.alt{background:var(--surface);color:var(--text);border:1px solid var(--border)}
.result.alt .big{color:var(--accent)}
.rowdates{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{color:var(--muted);font-size:12px;line-height:1.5;margin-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="seg"><button id="tabAdd" class="on">Add / Subtract</button><button id="tabDiff">Difference</button></div>

  <div id="addView">
    <div class="field"><label>Start date</label><input type="date" id="start"><button class="today" data-for="start">Today</button></div>
    <div class="opseg"><button id="opAdd" class="on">＋ Add</button><button id="opSub">－ Subtract</button></div>
    <div class="amts">
      <div class="amt"><label>Years</label><input type="number" id="y" inputmode="numeric" min="0" value="0"></div>
      <div class="amt"><label>Months</label><input type="number" id="mo" inputmode="numeric" min="0" value="0"></div>
      <div class="amt"><label>Weeks</label><input type="number" id="w" inputmode="numeric" min="0" value="0"></div>
      <div class="amt"><label>Days</label><input type="number" id="da" inputmode="numeric" min="0" value="0"></div>
    </div>
    <div class="result" id="addResult"><div class="big">—</div><div class="sub"></div></div>
  </div>

  <div id="diffView" style="display:none">
    <div class="rowdates">
      <div class="field"><label>From</label><input type="date" id="from"><button class="today" data-for="from">Today</button></div>
      <div class="field"><label>To</label><input type="date" id="to"><button class="today" data-for="to">Today</button></div>
    </div>
    <div class="result alt" id="diffResult"><div class="big">—</div><div class="sub"></div></div>
    <div class="result alt" id="diffTotals" style="margin-top:10px;padding:13px"><div class="sub" style="opacity:1"></div></div>
  </div>

  <p class="hint">Months and years are calendar-aware: adding a month lands on the same day next month (clamped to the last day for short months). Difference shows the gap in calendar years, months and days.</p>
</div>

<script>
var op=1; // +1 add, -1 subtract
function $(i){return document.getElementById(i)}
function haptic(k){if(window.myllmHaptic)try{myllmHaptic(k)}catch(e){}}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function pad(n){return (n<10?'0':'')+n}
function parse(v){if(!v)return null;var p=v.split('-');return new Date(+p[0],+p[1]-1,+p[2],12,0,0)}
function fmt(d){return new Intl.DateTimeFormat([],{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(d)}
function num(id){var n=parseInt($(id).value);return isNaN(n)||n<0?0:n}

function calcAdd(){
  var s=parse($('start').value);if(!s){$('addResult').querySelector('.big').textContent='Pick a start date';$('addResult').querySelector('.sub').textContent='';return}
  var y=num('y'),mo=num('mo'),w=num('w'),da=num('da');
  var Y=s.getFullYear()+op*y, M=s.getMonth()+op*mo;
  var d=new Date(Y,M,1,12);
  var last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
  d.setDate(Math.min(s.getDate(),last));
  d.setDate(d.getDate()+op*(w*7+da));
  var totalDays=Math.round((d-s)/86400000);
  $('addResult').querySelector('.big').textContent=fmt(d);
  var rel=totalDays===0?'same day':(Math.abs(totalDays)+' day'+(Math.abs(totalDays)===1?'':'s')+(totalDays>0?' later':' earlier'));
  $('addResult').querySelector('.sub').textContent=rel;
}

function calcDiff(){
  var a=parse($('from').value),b=parse($('to').value);
  var R=$('diffResult'),T=$('diffTotals');
  if(!a||!b){R.querySelector('.big').textContent='Pick both dates';R.querySelector('.sub').textContent='';T.querySelector('.sub').textContent='';return}
  var sign=a<=b?1:-1, A=sign>0?a:b, B=sign>0?b:a;
  var y=B.getFullYear()-A.getFullYear(), m=B.getMonth()-A.getMonth(), d=B.getDate()-A.getDate();
  if(d<0){m--;d+=new Date(B.getFullYear(),B.getMonth(),0).getDate()}
  if(m<0){y--;m+=12}
  var parts=[];if(y)parts.push(y+' year'+(y===1?'':'s'));if(m)parts.push(m+' month'+(m===1?'':'s'));if(d)parts.push(d+' day'+(d===1?'':'s'));
  var total=Math.round((B-A)/86400000);
  R.querySelector('.big').textContent= total===0?'Same day':parts.join(', ');
  R.querySelector('.sub').textContent= total===0?'':(sign<0?'(From is after To)':'');
  var wk=Math.floor(total/7),rem=total%7;
  T.querySelector('.sub').innerHTML='<b style="color:var(--accent)">'+total.toLocaleString()+'</b> total days &nbsp;·&nbsp; '+wk+' week'+(wk===1?'':'s')+(rem?(' '+rem+'d'):'');
}

$('tabAdd').onclick=function(){sw(true)};
$('tabDiff').onclick=function(){sw(false)};
function sw(add){
  $('tabAdd').classList.toggle('on',add);$('tabDiff').classList.toggle('on',!add);
  $('addView').style.display=add?'block':'none';$('diffView').style.display=add?'none':'block';haptic('selection');
}
$('opAdd').onclick=function(){op=1;$('opAdd').classList.add('on');$('opSub').classList.remove('on');calcAdd();haptic('selection')};
$('opSub').onclick=function(){op=-1;$('opSub').classList.add('on');$('opAdd').classList.remove('on');calcAdd();haptic('selection')};

['start','y','mo','w','da'].forEach(function(id){$(id).addEventListener('input',calcAdd)});
['from','to'].forEach(function(id){$(id).addEventListener('input',calcDiff)});
Array.prototype.forEach.call(document.querySelectorAll('.today'),function(b){b.onclick=function(){$(b.getAttribute('data-for')).value=todayStr();haptic('selection');calcAdd();calcDiff()}});

// init
$('start').value=todayStr();$('from').value=todayStr();$('to').value=todayStr();
calcAdd();calcDiff();
</script>
</body>
</html>
