<title>Receipt Logger</title>
<meta name="myllm:immersive" content="on">
<style>:root{--build-id:"0fdde3cc0a";color-scheme:light dark;
  --bg:var(--myllm-bg,#f2f2f7); --surface:var(--myllm-surface,#fff); --ink:var(--myllm-text,#111);
  --muted:var(--myllm-muted,#8a8a8e); --line:var(--myllm-border,#e3e3e8); --acc:var(--myllm-accent,#0a84ff);
  --fill:rgba(120,120,128,.12); --h:176; }
@media (prefers-color-scheme:dark){ :root{ --bg:var(--myllm-bg,#000); --surface:var(--myllm-surface,#1c1c1e);
  --ink:var(--myllm-text,#f2f2f7); --muted:var(--myllm-muted,#8e8e93); --line:var(--myllm-border,#2c2c2e); --fill:rgba(120,120,128,.24); } }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ font-family:var(--myllm-font,-apple-system,system-ui,sans-serif); background:var(--bg); color:var(--ink);
    max-width:600px; margin:0 auto; min-height:100dvh; font-size:15.5px; line-height:1.4;
    padding:calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(30px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left)); }
  @media (min-width:768px){ body{ max-width:760px; } }
  svg.i{ width:1.25em; height:1.25em; fill:currentColor; flex-shrink:0; }
  button{ font:inherit; color:inherit; cursor:pointer; border:none; background:none; } button:active{ transform:scale(.96); }

  .head{ display:flex; align-items:center; gap:12px; margin:2px 2px 14px; }
  .tile{ display:flex; align-items:center; justify-content:center; color:#fff; flex-shrink:0;
    background:linear-gradient(145deg, hsl(var(--h) 62% 50%), hsl(calc(var(--h) + 40) 58% 28%)); }
  .head .tile{ width:44px; height:44px; border-radius:13px; font-size:19px; }
  .head .ht{ flex:1; min-width:0; }
  h1{ font-size:22px; font-weight:800; letter-spacing:-.01em; }
  .head p{ font-size:13px; color:var(--muted); margin-top:1px; }
  h2{ font-size:12px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); margin:20px 2px 10px; }

  .hero{ border-radius:20px; padding:16px 18px 18px; color:#fff; margin-bottom:12px;
    background:linear-gradient(145deg, hsl(var(--h) 62% 40%), hsl(calc(var(--h) + 40) 58% 22%)); box-shadow:0 10px 28px hsl(var(--h) 60% 24% / .25); }
  .hero .k{ font-size:11px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; opacity:.8; }
  .hero .n{ font-size:44px; font-weight:800; line-height:1.05; letter-spacing:-.03em; font-variant-numeric:tabular-nums; margin-top:2px; overflow-wrap:anywhere; }
  .hero .l{ font-size:13px; opacity:.82; margin-top:2px; }
  .scan{ width:100%; min-height:52px; margin-top:14px; border-radius:14px; background:#fff; color:hsl(var(--h) 60% 22%); font-size:16px; font-weight:750;
    display:flex; align-items:center; justify-content:center; gap:8px; box-shadow:0 8px 20px rgba(0,0,0,.18); }
  .scan:disabled{ opacity:.8; }
  .spin{ width:16px; height:16px; border-radius:50%; border:2.4px solid currentColor; border-right-color:transparent; animation:spin .8s linear infinite; flex-shrink:0; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .notice{ display:flex; gap:10px; align-items:flex-start; font-size:13.5px; line-height:1.45; border-radius:14px; padding:11px 12px; margin:0 0 12px; background:rgba(255,159,10,.13); }
  .notice svg{ color:#ff9f0a; margin-top:1px; }
  .notice.err{ background:rgba(255,69,58,.12); } .notice.err svg{ color:#ff453a; }

  .list{ display:grid; gap:8px; }
  .list{ grid-template-columns:minmax(0,1fr); }
  @media (min-width:768px){ .list{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
  .row{ display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:10px 6px 10px 12px; min-height:64px; }
  .row .tile{ width:38px; height:38px; border-radius:11px; font-size:16px; }
  .row .m{ flex:1; min-width:0; }
  .row .m b{ display:block; font-size:15.5px; font-weight:650; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .m span{ display:block; font-size:12.5px; color:var(--muted); margin-top:1px; }
  .row .amt{ font-weight:750; font-size:16px; font-variant-numeric:tabular-nums; flex-shrink:0; }
  .row .amt.unread{ color:var(--muted); font-weight:600; font-size:13px; }
  .row .del{ width:44px; height:44px; flex-shrink:0; color:var(--muted); display:flex; align-items:center; justify-content:center; font-size:14px; }
  .skel{ height:64px; border-radius:16px; background:var(--fill); animation:shimmer 1.4s ease-in-out infinite; }
  @keyframes shimmer{ 50%{ opacity:.45; } }

  .bar{ display:flex; gap:8px; margin-top:12px; }
  .bar button{ flex:1; min-height:44px; border-radius:12px; font-size:14px; font-weight:650; background:var(--surface); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; gap:6px; }
  .bar button.warn{ color:#ff453a; }
  .note{ color:var(--muted); font-size:12.5px; text-align:center; margin-top:16px; line-height:1.5; padding:0 6px; }

  .empty{ text-align:center; padding:26px 20px 14px; background:var(--surface); border:1px solid var(--line); border-radius:18px; }
  .empty .tile{ width:48px; height:48px; border-radius:14px; font-size:21px; margin:0 auto 10px; opacity:.9; }
  .empty b{ display:block; font-size:16px; font-weight:750; }
  .empty p{ font-size:13.5px; color:var(--muted); line-height:1.5; max-width:280px; margin:5px auto 0; }
  [hidden]{ display:none !important; }
  @media (prefers-reduced-motion:reduce){ .spin{ animation-duration:2.4s; } .skel{ animation:none; } button:active{ transform:none; } }

/* myllm-fullscreen-v1 — MyLLM 5.6.2+ opens this app full screen; the ✕ is the way out. */
.head .imm-acts{display:none;flex-shrink:0;margin-left:auto}
.head .acts + .imm-acts{margin-left:0}
body.imm .head .imm-acts{display:flex}
.head .imm-acts button{width:40px;height:40px;border-radius:12px;border:1px solid var(--myllm-border,rgba(128,128,128,.28));
  background:var(--myllm-surface,rgba(128,128,128,.12));color:var(--myllm-text,currentColor);display:grid;place-items:center;padding:0;cursor:pointer;transition:transform .12s}
.head .imm-acts button:active,.head .imm-x:active{transform:scale(.94)}
.head .imm-x{display:none !important}
body.imm .head .imm-x{display:grid !important;place-items:center}
.imm-x svg,.imm-acts svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}
.imm-safe{display:none}
body.imm .imm-safe{display:block}
</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-receipt" viewBox="0 0 24 24"><path d="M6 2.5h12a1 1 0 0 1 1 1v17.2a.6.6 0 0 1-.95.5L16 19.7l-2.05 1.5a.6.6 0 0 1-.7 0L12 20.3l-1.25.9a.6.6 0 0 1-.7 0L8 19.7l-2.05 1.5A.6.6 0 0 1 5 20.7V3.5a1 1 0 0 1 1-1zm2.5 5a1 1 0 0 0 0 2h7a1 1 0 0 0 0-2zm0 4a1 1 0 0 0 0 2h7a1 1 0 0 0 0-2zm0 4a1 1 0 0 0 0 2h4a1 1 0 0 0 0-2z" fill="currentColor"/></symbol>
  <symbol id="i-scan" viewBox="0 0 24 24"><path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16M7.5 12h9" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 3.5v11M8 7.2l4-3.7 4 3.7M6.5 11H6a1.5 1.5 0 0 0-1.5 1.5v6A1.5 1.5 0 0 0 6 20h12a1.5 1.5 0 0 0 1.5-1.5v-6A1.5 1.5 0 0 0 18 11h-.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M9 3.5h6a1 1 0 0 1 1 1V6h3.5a1 1 0 0 1 0 2h-.6l-.9 11.1A2 2 0 0 1 16 21H8a2 2 0 0 1-2-1.9L5.1 8h-.6a1 1 0 0 1 0-2H8V4.5a1 1 0 0 1 1-1zM10 6h4V5.5h-4z" fill="currentColor"/></symbol>
  <symbol id="i-warn" viewBox="0 0 24 24"><path d="M10.3 3.9a2 2 0 0 1 3.4 0l8 13.6a2 2 0 0 1-1.7 3H4a2 2 0 0 1-1.7-3zM12 9a1 1 0 0 0-1 1v4a1 1 0 0 0 2 0v-4a1 1 0 0 0-1-1zm0 7.2a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4z" fill="currentColor"/></symbol>
</defs></svg>

<div class="imm-safe"></div><div class="head">
  <div class="tile"><svg class="i"><use href="#i-receipt"/></svg></div>
  <div class="ht"><h1>Receipt Logger</h1><p>Scan a receipt — it reads the total and keeps a running tally</p></div>
<div class="imm-acts"><button type="button" aria-label="Close Receipt Logger" onclick="myllmFSClose()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div></div>

<div class="hero">
  <div class="k">Total logged</div>
  <div class="n" id="sum">—</div>
  <div class="l" id="count">No receipts yet</div>
  <button class="scan" id="goBtn" type="button"></button>
</div>

<div class="notice" id="hint" hidden><svg class="i"><use href="#i-warn"/></svg><span id="hintText"></span></div>

<h2 id="listLbl" hidden>Receipts</h2>
<div class="list" id="list"></div>
<div class="bar" id="bar" hidden>
  <button id="shareB" type="button"><svg class="i"><use href="#i-share"/></svg>Share summary</button>
  <button id="clearB" type="button" class="warn"><svg class="i"><use href="#i-trash"/></svg>Clear all</button>
</div>
<p class="note">Scanning and reading happen on your device. Needs the latest MyLLM with “Allow apps to use the AI” enabled.</p>

<script>
/* Bridges are looked up when used, never kept: MyLLM can add them after this
   script has run. */
function store(){ return window.myllmStorage || {getItem:function(){return Promise.resolve(null)},setItem:function(){return Promise.resolve()}}; }
function haptic(k){ if(window.myllmHaptic) try{ myllmHaptic(k); }catch(e){} }
var items = [], busy = false;

function el(id){return document.getElementById(id)}
function icon(n){return '<svg class="i"><use href="#i-'+n+'"/></svg>'}
function hint(t, err){ el('hintText').textContent=t; el('hint').className='notice'+(err?' err':''); el('hint').hidden=!t; }
function scanBtn(state){
  var b=el('goBtn'); b.disabled=!!state;
  b.innerHTML = state==='scan' ? '<i class="spin"></i><span>Scanning…</span>'
    : state==='read' ? '<i class="spin"></i><span>Reading the receipt…</span>'
    : icon('scan')+'<span>Scan a receipt</span>';
}

function scan(){
  if(busy) return;
  var SCAN = window.myllmScan;
  if(!SCAN){ hint('This needs the latest MyLLM with document scanning (v3.6+) and “Allow apps to use the AI” on.', true); return; }
  haptic('light'); hint('');
  busy = true; scanBtn('scan');
  Promise.resolve().then(function(){ return SCAN(); }).then(function(text){
    if(!text){ return; } // cancelled / nothing found
    scanBtn('read'); skeleton(true);
    return extract(text).then(function(rec){
      items.unshift(rec); save(); render(); haptic('success');
      if(typeof rec.total!=='number') hint('Saved, but the total couldn’t be read from that receipt.', false);
    });
  }).catch(function(e){ hint((e&&e.message)?e.message:'Scan failed', true); })
    .then(function(){ busy=false; skeleton(false); scanBtn(''); });
}

function extract(text){
  var ASK = window.myllmAsk;
  if(!ASK){ return Promise.resolve({merchant:'Receipt', total:null, currency:'', date:'', raw:text}); }
  var prompt='From this receipt text, extract JSON ONLY: {"merchant":string,"date":string,"total":number,"currency":string(symbol like £ or $)}. '+
    'If a field is unknown use "" (or 0 for total). Receipt text:\n'+text.slice(0,1500);
  return ASK(prompt,{system:'You output only one compact JSON object, no prose.'}).then(function(reply){
    try{ var s=reply.indexOf('{'),e=reply.lastIndexOf('}'); var o=JSON.parse(reply.slice(s,e+1));
      return {merchant:o.merchant||'Receipt', total:(typeof o.total==='number'?o.total:parseFloat(o.total)||null), currency:o.currency||'', date:o.date||'', raw:text}; }
    catch(err){ return {merchant:'Receipt', total:null, currency:'', date:'', raw:text}; }
  }).catch(function(){ return {merchant:'Receipt', total:null, currency:'', date:'', raw:text}; });
}

function skeleton(on){
  var s=el('skel');
  if(on&&!s){ s=document.createElement('div'); s.id='skel'; s.className='skel'; el('list').insertBefore(s, el('list').firstChild); el('listLbl').hidden=false; var e=el('emptyCard'); if(e) e.hidden=true; }
  if(!on&&s) s.remove();
}

function render(){
  var L=el('list'); L.innerHTML='';
  var cur='', sum=0, n=0;
  if(!items.length){
    L.innerHTML='<div class="empty" id="emptyCard"><div class="tile">'+icon('receipt')+'</div><b>No receipts yet</b><p>Scan one and it reads the shop, date and total for you.</p></div>';
  }
  items.forEach(function(it,i){
    if(typeof it.total==='number'){ sum+=it.total; n++; if(it.currency) cur=it.currency; }
    var d=document.createElement('div'); d.className='row';
    d.innerHTML='<div class="tile">'+icon('receipt')+'</div><div class="m"><b></b><span></span></div><div class="amt"></div><button class="del" type="button" aria-label="Delete receipt">'+icon('x')+'</button>';
    d.querySelector('b').textContent=it.merchant||'Receipt';
    d.querySelector('.m span').textContent=it.date||'No date found';
    var a=d.querySelector('.amt');
    if(typeof it.total==='number') a.textContent=(it.currency||'')+it.total.toFixed(2);
    else { a.textContent='Total not read'; a.classList.add('unread'); }
    d.querySelector('.del').onclick=function(){ items.splice(i,1); haptic('light'); save(); render(); };
    L.appendChild(d);
  });
  el('listLbl').hidden = !items.length;
  el('sum').textContent = n? (cur+sum.toFixed(2)) : '—';
  el('count').textContent = items.length? (items.length+' receipt'+(items.length>1?'s':'')+(n<items.length?' ('+(items.length-n)+' unread)':'')) : 'No receipts yet';
  el('bar').hidden = !items.length;
  el('shareB').onclick=function(){ if(window.myllmShare) window.myllmShare('Receipts total: '+(cur+sum.toFixed(2))+' across '+n+' receipts.'); };
  el('clearB').onclick=function(){ items=[]; save(); render(); };
}

function save(){ store().setItem('receipts', JSON.stringify(items.slice(0,200))); }
function load(){ return store().getItem('receipts').then(function(v){ try{return v?JSON.parse(v):[]}catch(e){return []} }); }

el('goBtn').onclick=scan;
scanBtn('');
load().then(function(v){ items=v; render(); });

/* myllm-fullscreen-v1 — full screen where MyLLM can also close the app for us (myllmClose,
   5.6.2+): full screen hides MyLLM's Done, and a page with no way out is
   worse than a repeated title, so elsewhere nothing changes. The spacer keeps
   the header clear of the status bar only if the page doesn't already. */
(function(){
  function full(){ return !!(window.myllmClose && window.myllmImmersive); }
  function inset(){
    var p = document.createElement("div");
    p.style.cssText = "position:fixed;top:0;left:0;width:1px;visibility:hidden;height:env(safe-area-inset-top)";
    document.body.appendChild(p); var h = p.offsetHeight; p.parentNode.removeChild(p); return h;
  }
  function fit(){
    var sp = document.querySelector(".imm-safe"), head = document.querySelector(".head");
    if (!sp || !head) return;
    sp.style.height = "0px";
    if (!document.body.classList.contains("imm")) return;
    var need = inset() + 6 - (head.getBoundingClientRect().top + window.scrollY);
    sp.style.height = Math.max(0, Math.round(need)) + "px";
  }
  function sync(){
    var f = full();
    document.body.classList.toggle("imm", f);
    fit();
    if (!f) return;
    try { window.myllmImmersive(true, { keepAwake:false }).catch(function(){}); } catch(e){}
  }
  window.myllmFSClose = function(){
    try { if (window.myllmHaptic) window.myllmHaptic("light"); } catch(e){}
    try { window.myllmClose().catch(function(){}); } catch(e){}
  };
  document.addEventListener("visibilitychange", function(){ if (!document.hidden) sync(); });
  window.addEventListener("resize", fit);
  sync();
})();
</script></body></html>
