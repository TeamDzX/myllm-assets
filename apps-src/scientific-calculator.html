*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:var(--font);color:var(--ink);background:radial-gradient(120% 70% at 50% 0%,var(--bg2),var(--bg1) 70%);
  background-color:var(--bg1);height:100vh;height:100dvh;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) calc(12px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));
  touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

/* Header */
.head{display:flex;align-items:center;gap:10px;padding:8px 2px 4px;flex-shrink:0}
.tile{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex-shrink:0;
  background:linear-gradient(145deg,var(--op1),var(--op2));box-shadow:0 4px 12px var(--glow)}
.tile svg{width:19px;height:19px;color:#fff}
.ht{min-width:0;flex:1}
.ht h1{font-size:17px;font-weight:650;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{display:flex;gap:8px;align-items:center}
.hbtn{height:36px;min-width:36px;padding:0 10px;border-radius:11px;background:var(--chip);display:grid;place-items:center;
  font-size:13px;font-weight:650;letter-spacing:.3px;color:var(--ink);transition:transform .12s,background .2s}
.hbtn:active{transform:scale(.93)}
.hbtn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hbtn.on{background:linear-gradient(145deg,var(--op1),var(--op2));color:#fff}
#angle{min-width:52px}

/* Display */
.display{position:relative;flex:1 1 auto;min-height:84px;display:flex;flex-direction:column;justify-content:flex-end;
  padding:6px 8px 10px;overflow:hidden}
.prev,.main,.sub{flex-shrink:0}
.prev{font-size:19px;line-height:1.4;color:var(--muted);text-align:right;min-height:27px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  direction:ltr;transition:opacity .25s}
.main{text-align:right;font-weight:300;letter-spacing:-1px;line-height:1.3;white-space:nowrap;overflow-x:auto;overflow-y:hidden;
  scrollbar-width:none;font-variant-numeric:tabular-nums;padding:0 0 .08em;font-size:64px;cursor:text}
.main::-webkit-scrollbar{display:none}
.main.result{font-weight:250}
.main.pop{animation:pop .32s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{transform:translateY(18px);opacity:.2}to{transform:none;opacity:1}}
.main.shake{animation:shake .38s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.sub{font-size:22px;line-height:1.4;color:var(--muted);text-align:right;min-height:31px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-variant-numeric:tabular-nums}
.sub.err{color:#ff6b5e}
.caret{display:inline-block;width:2px;height:.9em;background:var(--op2);vertical-align:-.08em;margin-left:2px;border-radius:1px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.t-op{color:var(--op2);margin:0 .12em;font-weight:400}
.t-fn{color:var(--sci-ink);font-weight:400}
.t-sup{font-size:.62em;vertical-align:.62em;margin-left:.02em}
.t-ghost{color:var(--faint)}
.t-e{font-size:.7em;color:var(--muted);margin:0 .06em}
.ind{position:absolute;left:10px;top:8px;display:flex;gap:6px}
.pill{font-size:11px;font-weight:700;letter-spacing:.6px;color:var(--muted);background:var(--chip);border-radius:7px;padding:3px 7px}
.pill.hide{display:none}
.toast{position:absolute;left:50%;top:12px;transform:translate(-50%,-8px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg1);
  font-size:13px;font-weight:600;padding:7px 12px;border-radius:10px;transition:.25s}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* Memory row */
.mem{display:flex;gap:8px;padding:0 2px 8px;flex-shrink:0}
.mem button{flex:1;height:30px;border-radius:9px;background:var(--chip);font-size:13px;font-weight:600;color:var(--muted);transition:transform .1s}
.mem button:active{transform:scale(.94)}
.mem .fold{flex:0 0 44px;display:grid;place-items:center}
.mem .fold svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s}
body.nosci .mem .fold svg{transform:rotate(180deg)}

/* Keys */
.pads{display:flex;flex-direction:column;gap:10px;flex-shrink:0}
.sci{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.basic{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
body.nosci .sci{display:none}
body.nosci .basic .k{height:var(--kb,clamp(60px,10.4vh,100px))}
.k{position:relative;border-radius:18px;display:grid;place-items:center;font-variant-numeric:tabular-nums;
  transition:transform .09s ease,filter .15s;box-shadow:var(--shadow);overflow:hidden}
.k::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,var(--digit-hi),transparent 55%);pointer-events:none}
.k:active,.k.down{transform:scale(.94);filter:brightness(1.18)}
.sci .k{height:var(--ks,clamp(32px,4.6vh,46px));background:var(--sci);color:var(--sci-ink);font-size:16px;font-weight:500;border-radius:13px}
.sci .k.on{background:linear-gradient(145deg,var(--op1),var(--op2));color:#fff}
.sci .k .sup{font-size:.68em;vertical-align:.55em}
.basic .k{height:var(--kb,clamp(50px,7.6vh,84px));background:var(--digit);font-size:31px;font-weight:400}
.basic .k.fn{background:var(--fn);font-size:22px;font-weight:500}
.basic .k.op{background:linear-gradient(160deg,var(--op1),var(--op2));color:var(--op-ink);font-size:32px;font-weight:450}
.basic .k.op.eq{box-shadow:0 8px 22px var(--glow),var(--shadow)}
.basic .k.op.armed{background:var(--op-ink);color:var(--op2)}
.k svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* History */
.hist{position:absolute;inset:0;background:var(--bg1);border-radius:18px;display:flex;flex-direction:column;transform:translateY(-104%);
  transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s .32s;z-index:3;visibility:hidden}
.hist.open{transform:none;visibility:visible;transition:transform .32s cubic-bezier(.2,.8,.2,1);box-shadow:0 12px 30px rgba(0,0,0,.35)}
.hist .hh{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 6px}
.hist .hh b{font-size:15px}
.hist .hh button{font-size:14px;color:var(--op2);font-weight:600;padding:6px}
.hist ul{list-style:none;overflow-y:auto;flex:1;padding:0 12px 12px;-webkit-overflow-scrolling:touch}
.hist li{padding:10px 4px;border-bottom:1px solid var(--line);text-align:right;cursor:pointer}
.hist li:active{background:var(--chip)}
.hist li .e{font-size:15px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist li .r{font-size:24px;font-weight:350;font-variant-numeric:tabular-nums}
.hist .none{color:var(--muted);text-align:center;padding:30px 0;font-size:15px}

/* Ask sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:8}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--bg2);border-radius:22px 22px 0 0;
  padding:16px calc(16px + env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
  transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);box-shadow:0 -10px 30px rgba(0,0,0,.3)}
.sheet.open{transform:none}
.sheet h2{font-size:17px;margin-bottom:4px}
.sheet p{font-size:13px;color:var(--muted);margin-bottom:10px}
.sheet textarea{width:100%;min-height:74px;border-radius:14px;border:1px solid var(--line);background:var(--bg1);color:var(--ink);
  font:inherit;font-size:17px;padding:12px;resize:none;-webkit-user-select:text;user-select:text;outline:none}
.sheet textarea:focus{border-color:var(--op2)}
.sheet .row{display:flex;gap:10px;margin-top:12px}
.sheet .row button{flex:1;height:46px;border-radius:13px;font-size:16px;font-weight:600;background:var(--chip)}
.sheet .row .go{background:linear-gradient(145deg,var(--op1),var(--op2));color:#fff}
.sheet .row .go[disabled]{opacity:.55}
.sheet .msg{font-size:13px;color:var(--muted);margin-top:10px;min-height:18px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chips button{font-size:12.5px;padding:6px 10px;border-radius:999px;background:var(--chip);color:var(--sci-ink)}

/* Landscape: scientific keys beside the basic pad */
@media (orientation:landscape) and (max-height:560px){
  .display{min-height:70px;padding-bottom:4px}
  .main{font-size:44px}
  .prev{font-size:15px;min-height:18px}
  .sub{font-size:17px;min-height:22px}
  .mem{padding-bottom:6px}
  .mem button{height:26px}
  .mem .fold{display:none}
  .pads{flex-direction:row;gap:12px;flex:0 0 auto}
  .sci{flex:1.25;gap:6px;display:grid !important}
  .basic{flex:1;gap:6px}
  .sci .k{height:calc((100dvh - 200px - env(safe-area-inset-bottom) - 18px) / 4);min-height:28px;font-size:14px}
  .basic .k,body.nosci .basic .k{height:calc((100dvh - 200px - env(safe-area-inset-bottom) - 24px) / 5);min-height:26px;font-size:22px;border-radius:13px}
  .basic .k.fn{font-size:17px}
  .basic .k.op{font-size:24px}
  .head{padding-top:4px}
  .sci{grid-template-columns:repeat(5,1fr)}
}
@media (max-width:350px){ .basic .k{font-size:26px} .sci .k{font-size:14px} .main{font-size:52px} }
@media (prefers-reduced-motion:reduce){ .k:active,.k.down{transform:none} .main.pop,.main.shake{animation:none} .caret{animation:none} }

/* myllm-fullscreen-v2 — MyLLM 5.6.2+ opens this app full screen; the ✕ is the way out. */
.head .imm-acts{display:none;flex-shrink:0;margin-left:auto}
.head .acts + .imm-acts{margin-left:0}
body.imm .head .imm-acts{display:flex}
.head .imm-acts button{width:36px;height:36px;border-radius:11px;border:1px solid var(--line);
  background:var(--chip);color:var(--ink);display:grid;place-items:center;padding:0;cursor:pointer;transition:transform .12s}
.head .imm-acts button:active{transform:scale(.94)}
.imm-acts svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}
.imm-safe{display:none}
body.imm .imm-safe{display:block}

<script>
'use strict';
var $=function(id){return document.getElementById(id)};

/* ---------- Keys ----------
   Each key: [label, token or action, 2nd label, 2nd token]. Tokens are what
   the expression holds; a function token carries its own "(". */
var SCI=[
  ['2nd','@2nd'],['(','('],[')',')'],['mod','mod'],['Ans','Ans'],
  ['sin','sin(','sin<span class="sup">−1</span>','asin('],['cos','cos(','cos<span class="sup">−1</span>','acos('],
  ['tan','tan(','tan<span class="sup">−1</span>','atan('],['ln','ln(','e<span class="sup">x</span>','@exp'],['log','log(','10<span class="sup">x</span>','@pow10'],
  ['x<span class="sup">2</span>','²','x<span class="sup">3</span>','³'],['x<span class="sup">y</span>','^','<span class="sup">y</span>√x','yroot'],
  ['√','√(','∛','∛('],['x!','!'],['1/x','⁻¹','log<span class="sup">2</span>','log₂('],
  ['π','π','sinh','sinh('],['e','e','cosh','cosh('],['EE','E','tanh','tanh('],['nCr','nCr','nPr','nPr'],['|x|','abs(','Rand','@rand']
];
var BASIC=[
  ['AC','@ac','fn'],['<svg viewBox="0 0 24 24"><path d="M9 5h11v14H9l-6-7z"/><path d="M12.5 9.5l5 5M17.5 9.5l-5 5"/></svg>','@bs','fn'],['±','@neg','fn'],['÷','÷','op'],
  ['7','7'],['8','8'],['9','9'],['×','×','op'],
  ['4','4'],['5','5'],['6','6'],['−','−','op'],
  ['1','1'],['2','2'],['3','3'],['+','+','op'],
  ['0','0'],['.','.'],['%','%','fn'],['=','@eq','op eq']
];

/* ---------- State ---------- */
var S={tokens:[],angle:'deg',second:false,sci:true,mem:0,ans:0,history:[],shown:null,justEq:false};
var STORE='scicalc.v1';
function save(){
  var d=JSON.stringify({angle:S.angle,sci:S.sci,mem:S.mem,ans:S.ans,history:S.history.slice(-60)});
  try{ if(window.myllmStorage){ myllmStorage.setItem(STORE,d); return; } }catch(e){}
  try{ localStorage.setItem(STORE,d); }catch(e){}
}
function load(done){
  function apply(v){ if(v){ try{ var d=JSON.parse(v);
    if(d.angle==='rad'||d.angle==='deg')S.angle=d.angle; S.sci=d.sci!==false;
    if(typeof d.mem==='number')S.mem=d.mem; if(typeof d.ans==='number')S.ans=d.ans;
    if(Array.isArray(d.history))S.history=d.history.filter(function(h){return h&&Array.isArray(h.t)&&typeof h.r==='number'}); }catch(e){} }
    done(); }
  try{ if(window.myllmStorage){ myllmStorage.getItem(STORE).then(apply,function(){apply(null)}); return; } }catch(e){}
  var v=null; try{ v=localStorage.getItem(STORE); }catch(e){} apply(v);
}

/* ---------- Tokens ---------- */
var FUNCS=['sin(','cos(','tan(','asin(','acos(','atan(','sinh(','cosh(','tanh(','ln(','log(','log₂(','√(','∛(','abs('];
var BINOPS=['+','−','×','÷','^','mod','nCr','nPr','yroot'];
var POSTFIX=['²','³','!','%','⁻¹'];
var CONSTS=['π','e','Ans'];
function isDigit(t){return t.length===1&&(t>='0'&&t<='9'||t==='.')}
function isFunc(t){return FUNCS.indexOf(t)>=0}
function isBin(t){return t!==undefined&&BINOPS.indexOf(t)>=0}
function isPost(t){return POSTFIX.indexOf(t)>=0}
function isConst(t){return CONSTS.indexOf(t)>=0}
function startsOperand(t){return isDigit(t)||isFunc(t)||isConst(t)||t==='('}
function endsOperand(t){return isDigit(t)||isConst(t)||isPost(t)||t===')'}

/* ---------- Parser: recursive descent, no eval ---------- */
function CalcError(m){this.message=m}
function lex(tokens){
  var out=[],i=0;
  while(i<tokens.length){
    var t=tokens[i];
    if(isDigit(t)){
      var s='';
      while(i<tokens.length&&(isDigit(tokens[i])||tokens[i]==='E'||(tokens[i]==='−'&&tokens[i-1]==='E'&&s.length))){
        s+=tokens[i]==='−'?'-':tokens[i]; i++;
      }
      if((s.match(/\./g)||[]).length>1||(s.match(/E/g)||[]).length>1||/E-?$/.test(s)||s==='.')throw new CalcError('number');
      out.push({k:'n',v:parseFloat(s.replace(/^\./,'0.'))});
      continue;
    }
    if(t==='E')throw new CalcError('number');
    out.push({k:t}); i++;
  }
  return out;
}
function evaluate(tokens,ans,angle){
  var L=lex(tokens),p=0;
  function peek(){return L[p]}
  function next(){return L[p++]}
  function toRad(x){return angle==='deg'?x*Math.PI/180:x}
  function fromRad(x){return angle==='deg'?x*180/Math.PI:x}
  function trig(f,x){
    var r=toRad(x);
    if(angle==='deg'){ // exact at the angles people type
      var m=((x%360)+360)%360;
      if(f==='sin'){ if(m===0||m===180)return 0; if(m===90)return 1; if(m===270)return -1; if(m===30||m===150)return .5; if(m===210||m===330)return -.5; }
      if(f==='cos'){ if(m===90||m===270)return 0; if(m===0)return 1; if(m===180)return -1; if(m===60||m===300)return .5; if(m===120||m===240)return -.5; }
      if(f==='tan'){ if(m===0||m===180)return 0; if(m===90||m===270)throw new CalcError('undefined'); if(m===45||m===225)return 1; if(m===135||m===315)return -1; }
    }
    return Math[f](r);
  }
  function fact(x){
    if(x<0&&Number.isInteger(x))throw new CalcError('undefined');
    if(Number.isInteger(x)){ if(x>170)return Infinity; var r=1; for(var i=2;i<=x;i++)r*=i; return r; }
    return gamma(x+1);
  }
  function combo(n,r,perm){
    if(!Number.isInteger(n)||!Number.isInteger(r)||n<0||r<0||r>n)throw new CalcError('domain');
    var v=1; for(var i=0;i<r;i++){ v*=(n-i); if(!perm)v/=(i+1); }
    return perm?v:Math.round(v);
  }

  while(i<s.length){
    var c=s[i], hit=null;
    for(var k=0;k<map.length;k++){ if(s.substr(i,map[k][0].length).toLowerCase()===map[k][0].toLowerCase()){ hit=map[k]; break; } }
    if(hit){ out.push(hit[1]); i+=hit[0].length; continue; }
    if(/[0-9.]/.test(c)){ out.push(c); i++; continue; }
    if((c==='e'||c==='E')&&/[0-9]/.test(s[i-1]||'')&&/[-+0-9]/.test(s[i+1]||'')){ out.push('E'); if(s[i+1]==='+')i++; i++; continue; }
    if(c==='e'){ out.push('e'); i++; continue; }
    if(c==='+'||c==='×'||c==='÷'||c==='^'||c==='('||c===')'||c==='!'||c==='%'){ out.push(c); i++; continue; }
    if(c==='-'||c==='−'||c==='–'){ out.push('−'); i++; continue; }
    if(c==='x'||c==='X'||c==='·'){ out.push('×'); i++; continue; }
    if(c==='²'||c==='³'){ out.push(c); i++; continue; }
    throw new CalcError('syntax');
  }
  return out;
}
function askAvailable(){ return typeof window.myllmAskJSON==='function'||typeof window.myllmAsk==='function'; }
function openAsk(){
  $('askMsg').textContent=''; $('scrim').classList.add('open'); $('sheet').classList.add('open');
  setTimeout(function(){ $('askText').focus(); },280);
}
function closeAsk(){ $('scrim').classList.remove('open'); $('sheet').classList.remove('open'); $('askText').blur(); }
EXAMPLES.forEach(function(x){ var b=document.createElement('button'); b.textContent=x; b.onclick=function(){ $('askText').value=x; }; $('chips').appendChild(b); });
$('askBtn').addEventListener('click',function(){ haptic('light'); openAsk(); });
$('askCancel').addEventListener('click',closeAsk);
$('scrim').addEventListener('click',closeAsk);
$('askGo').addEventListener('click',function(){
  var q=$('askText').value.trim(); if(!q)return;
  var go=$('askGo'); go.disabled=true; go.textContent='Reading…'; $('askMsg').textContent='';
  var rules='Write ONE arithmetic expression that computes the answer to the request below. Use only numbers, + - * / ^ ( ), % for percent, and these functions: sqrt, cbrt, sin, cos, tan, asin, acos, atan, ln, log, abs, pi, e. Degrees for angles. No units, no words, no answer, no equals sign.\nRequest: '+q;
  var p=typeof window.myllmAskJSON==='function'
    ? myllmAskJSON(rules+'\nReply as JSON with the expression in "expression".',{type:'object',required:['expression'],properties:{expression:{type:'string',maxLength:160}}})
        .then(function(j){ if(!j||typeof j.expression!=='string')throw new Error('no expression'); return j.expression; })
        .catch(function(){ return myllmAsk(rules+'\nReply with ONLY the expression.'); })
    : myllmAsk(rules+'\nReply with ONLY the expression.');
  p.then(function(reply){
    var line=String(reply||'').split('\n').map(function(x){return x.trim()}).filter(Boolean)[0]||'';
    var toks=fromText(line);
    var saved=S.angle; S.angle='deg';
    evaluate(toks,S.ans,'deg'); // throws if the reading doesn't add up
    S.tokens=toks; S.shown=null; closeAsk(); equals(); S.angle=saved; save(); render();
    toast('From: '+q.slice(0,40)+(q.length>40?'…':''));
  }).catch(function(e){
    $('askMsg').textContent=e instanceof CalcError?"The AI's expression didn't add up. Try saying it another way.":"Couldn't reach your AI just now.";
    haptic('error');
  }).then(function(){ go.disabled=false; go.textContent='Work it out'; });
});

/* ---------- Hardware keyboard (iPad) ---------- */
document.addEventListener('keydown',function(e){
  if(e.target&&e.target.tagName==='TEXTAREA')return;
  var k=e.key, map={'*':'×','x':'×','/':'÷','-':'−','+':'+','^':'^','(':'(',')':')','!':'!','%':'%','p':'π','e':'e'};
  if(/^[0-9.]$/.test(k))press(k);
  else if(map[k])press(map[k]);
  else if(k==='Enter'||k==='=')press('@eq');
  else if(k==='Backspace')press('@bs');
  else if(k==='Escape')press('@ac');
  else return;
  e.preventDefault();
});

addEventListener('resize',function(){ fitMain(); });
load(function(){
  $('askBtn').hidden=!askAvailable();
  render();
});
if(!window.myllmStorage)render();

/* myllm-fullscreen-v2 — full screen where MyLLM can also close the app for us
   (myllmClose, 5.6.2+): full screen hides MyLLM's Done, and a page with no way
   out is worse than a repeated title, so elsewhere nothing changes. This page
   pads its own top by env(safe-area-inset-top), so the spacer stays at 0. */
(function(){
  function full(){ return !!(window.myllmClose && window.myllmImmersive); }
  function sync(){
    var f = full();
    document.body.classList.toggle("imm", f);
    var sp = document.querySelector(".imm-safe"); if (sp) sp.style.height = "0px";
    if (!f) return;
    try { window.myllmImmersive(true, { keepAwake:false }).catch(function(){}); } catch(e){}
  }
  window.myllmFSClose = function(){
    try { if (window.myllmHaptic) window.myllmHaptic("light"); } catch(e){}
    try { window.myllmClose().catch(function(){}); } catch(e){}
  };
  document.addEventListener("visibilitychange", function(){ if (!document.hidden) sync(); });
  sync();
})();
