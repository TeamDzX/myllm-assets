<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>:root{color-scheme:light dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%}
body{font-family:-apple-system,system-ui,sans-serif;background:#0e0e16;color:#eee;display:flex;flex-direction:column;align-items:center;padding:10px;touch-action:none;overflow:hidden}
.hud{display:flex;justify-content:space-between;width:100%;max-width:420px;font-size:14px;font-weight:600;padding:4px 6px;font-variant-numeric:tabular-nums}
.hud .s{color:#ffd60a}.hud .h{opacity:.6}
canvas{border-radius:14px;background:#15151f;box-shadow:0 6px 24px rgba(0,0,0,.5);touch-action:none}
.tip{font-size:12px;opacity:.5;margin-top:8px;height:14px}
</style></head><body>
<div class="hud"><span>❤️ <span id="lives">3</span></span><span class="s">⭐ <span id="score">0</span></span><span class="h">Best <span id="best">0</span></span></div>
<canvas id="cv"></canvas>
<div class="tip" id="tip">Drag to move · tap to launch</div>
<script>
var store=window.myllmStorage||{getItem:function(){return Promise.resolve(null)},setItem:function(){return Promise.resolve()}};
var cv=document.getElementById('cv'),ctx=cv.getContext('2d'),DPR=Math.min(window.devicePixelRatio||1,3);
var W=Math.min(window.innerWidth-20,420),H=Math.min(window.innerHeight-90,Math.round(W*1.5));
cv.style.width=W+'px';cv.style.height=H+'px';cv.width=W*DPR;cv.height=H*DPR;ctx.scale(DPR,DPR);
function el(i){return document.getElementById(i)}
var COLORS=['#ff453a','#ff9f0a','#ffd60a','#30d158','#0a84ff','#bf5af2'];
var paddle,ball,bricks,score=0,lives=3,level=1,best=0,state='start',launched=false;
var COLS=7,ROWS=5,GAP=6,TOP=54;

function reset(full){
  if(full){score=0;lives=3;level=1}
  var bw=(W-GAP*(COLS+1))/COLS,bh=20;
  bricks=[];
  for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++)bricks.push({x:GAP+c*(bw+GAP),y:TOP+r*(bh+GAP),w:bw,h:bh,c:COLORS[r%COLORS.length],alive:true});
  paddle={w:Math.max(64,W*0.22),h:12,x:W/2};
  var spd=2.6+level*0.35;
  ball={x:W/2,y:H-60,r:7,vx:0,vy:0,spd:spd};
  launched=false;
}
function launch(){if(!launched){var a=(-Math.PI/2)+(Math.random()*0.5-0.25);ball.vx=Math.cos(a)*ball.spd;ball.vy=Math.sin(a)*ball.spd;launched=true}}

function step(){
  if(state!=='play')return;
  if(!launched){ball.x=paddle.x;ball.y=H-60}
  else{
    ball.x+=ball.vx;ball.y+=ball.vy;
    if(ball.x<ball.r){ball.x=ball.r;ball.vx*=-1}
    if(ball.x>W-ball.r){ball.x=W-ball.r;ball.vx*=-1}
    if(ball.y<ball.r){ball.y=ball.r;ball.vy*=-1}
    // paddle
    var py=H-28;
    if(ball.vy>0&&ball.y+ball.r>=py&&ball.y+ball.r<=py+paddle.h+8&&Math.abs(ball.x-paddle.x)<paddle.w/2+ball.r){
      var hit=(ball.x-paddle.x)/(paddle.w/2);var ang=-Math.PI/2+hit*1.0;
      ball.vx=Math.cos(ang)*ball.spd;ball.vy=Math.sin(ang)*ball.spd;ball.y=py-ball.r;
      if(window.myllmHaptic)myllmHaptic('light');
    }
    // bricks
    for(var i=0;i<bricks.length;i++){var b=bricks[i];if(!b.alive)continue;
      if(ball.x+ball.r>b.x&&ball.x-ball.r<b.x+b.w&&ball.y+ball.r>b.y&&ball.y-ball.r<b.y+b.h){
        b.alive=false;score+=10*level;el('score').textContent=score;
        var ox=Math.min(ball.x-b.x,b.x+b.w-ball.x),oy=Math.min(ball.y-b.y,b.y+b.h-ball.y);
        if(ox<oy)ball.vx*=-1;else ball.vy*=-1;
        if(window.myllmHaptic)myllmHaptic('selection');
        break;
      }
    }
    if(!bricks.some(function(b){return b.alive})){level++;reset(false);el('tip').textContent='Level '+level+'! Tap to launch'}
    if(ball.y-ball.r>H){lives--;el('lives').textContent=lives;launched=false;ball.x=paddle.x;ball.y=H-60;
      if(window.myllmHaptic)myllmHaptic('error');
      if(lives<=0)gameOver();}
  }
  draw();requestAnimationFrame(step);
}
function draw(){
  ctx.clearRect(0,0,W,H);
  bricks.forEach(function(b){if(!b.alive)return;ctx.fillStyle=b.c;roundRect(b.x,b.y,b.w,b.h,5);ctx.fill()});
  ctx.fillStyle='#e8e8ef';roundRect(paddle.x-paddle.w/2,H-28,paddle.w,paddle.h,6);ctx.fill();
  ctx.beginPath();ctx.fillStyle='#fff';ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();
  if(state==='start'||state==='over'){
    ctx.fillStyle='rgba(10,10,18,.72)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.textAlign='center';
    ctx.font='700 26px -apple-system,system-ui';ctx.fillText(state==='over'?'Game Over':'Brick Breaker',W/2,H/2-18);
    ctx.font='15px -apple-system,system-ui';ctx.fillStyle='#bbb';
    ctx.fillText(state==='over'?('Score '+score+(score>=best?'  ·  New best!':'')):'Tap to play',W/2,H/2+14);
    if(state==='over')ctx.fillText('Tap to play again',W/2,H/2+40);
  }
}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function gameOver(){state='over';if(score>best){best=score;store.setItem('bbBest',String(best));el('best').textContent=best}draw();el('tip').textContent='Tap to play again'}
function startGame(){reset(true);el('score').textContent=0;el('lives').textContent=3;state='play';el('tip').textContent='Drag to move · tap to launch';requestAnimationFrame(step)}

function px(e){var t=e.touches?e.touches[0]:e,rect=cv.getBoundingClientRect();return t.clientX-rect.left}
function onMove(e){if(state!=='play')return;var x=px(e);paddle.x=Math.max(paddle.w/2,Math.min(W-paddle.w/2,x));e.preventDefault()}
function onTap(e){if(state==='play'){launch()}else{startGame()}e.preventDefault()}
cv.addEventListener('touchstart',onTap,{passive:false});cv.addEventListener('touchmove',onMove,{passive:false});
cv.addEventListener('mousedown',onTap);cv.addEventListener('mousemove',function(e){if(e.buttons)onMove(e)});

reset(true);
store.getItem('bbBest').then(function(v){best=+v||0;el('best').textContent=best;draw()});
</script></body></html>
