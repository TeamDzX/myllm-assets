--><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quick Todo</title>
<meta name="myllm:immersive" content="on">
<style>:root{--build-id:"7491b81bef";color-scheme:light dark; --h:214;}

  /* Shared surface — the same block sits in Quick Todo, Action Items, Sprint
     Planner and Risk & Decision Log, so the four read as one family. Each app
     only sets its own hue. MyLLM's theme where it supplies one; the fallbacks
     carry a dark set too, because a token-only page renders light in dark mode
     on a build (or a platform) that sends no --myllm-* variables. */
  :root{
    --bg:var(--myllm-bg,#f2f2f7); --surface:var(--myllm-surface,#fff); --ink:var(--myllm-text,#111);
    --muted:var(--myllm-muted,#8a8a8e); --line:var(--myllm-border,#e3e3e8); --acc:var(--myllm-accent,hsl(var(--h) 85% 52%));
    --fill:rgba(118,118,128,.12); --good:#2aa84f; --warn:#e8890c; --bad:#ff453a; --h2:calc(var(--h) + 40);
  }
  @media (prefers-color-scheme:dark){ :root{
    --bg:var(--myllm-bg,#000); --surface:var(--myllm-surface,#1c1c1e); --ink:var(--myllm-text,#f2f2f7);
    --muted:var(--myllm-muted,#8e8e93); --line:var(--myllm-border,#2c2c2e); --fill:rgba(118,118,128,.24); --good:#30d158; --warn:#ff9f0a;
  } }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ font-family:var(--myllm-font,-apple-system,system-ui,sans-serif); background:var(--bg); color:var(--ink);
    font-size:15.5px; line-height:1.35; max-width:600px; margin:0 auto; min-height:100dvh; -webkit-text-size-adjust:100%;
    padding:calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(30px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left)); }
  svg{ width:1.25em; height:1.25em; flex-shrink:0; }
  button{ font:inherit; color:inherit; border:none; background:none; }
  button:active{ transform:scale(.96); }

  .head{ display:flex; align-items:center; gap:12px; margin:2px 2px 14px; }
  .head .ht{ flex:1; min-width:0; }
  .head h1{ font-size:22px; font-weight:800; letter-spacing:-.01em; }
  .head p{ font-size:13px; color:var(--muted); margin-top:1px; }
  .tile{ display:flex; align-items:center; justify-content:center; color:#fff; flex-shrink:0;
    background:linear-gradient(145deg, hsl(var(--h) 62% 46%), hsl(var(--h2) 58% 24%)); }
  .head .tile{ width:44px; height:44px; border-radius:13px; font-size:19px; }
  h2{ font-size:12px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); margin:20px 2px 9px;
    display:flex; align-items:center; justify-content:space-between; gap:10px; min-height:20px; }
  h2 button{ font-size:12.5px; font-weight:700; letter-spacing:0; text-transform:none; color:var(--acc); padding:6px 2px; margin:-6px 0; }
  h2 .pts{ color:var(--ink); letter-spacing:0; text-transform:none; font-size:13px; font-variant-numeric:tabular-nums; }

  /* Hero: the app's headline number on its own hue. */
  .hero{ position:relative; overflow:hidden; border-radius:22px; padding:16px 16px 15px; color:#fff; margin-bottom:14px;
    background:linear-gradient(145deg, hsl(var(--h) 62% 46%), hsl(var(--h2) 58% 24%)); box-shadow:0 10px 28px hsl(var(--h) 60% 30% / .26); }
  .hero .k{ font-size:11px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; opacity:.78; }
  .hero .n{ font-size:44px; font-weight:800; letter-spacing:-.02em; line-height:1.08; font-variant-numeric:tabular-nums; }
  .hero .s{ font-size:13px; opacity:.82; margin-top:1px; font-variant-numeric:tabular-nums; }
  .hero .bar{ height:6px; border-radius:99px; background:rgba(255,255,255,.22); margin-top:12px; overflow:hidden; }
  .hero .bar i{ display:block; height:100%; width:0; border-radius:99px; background:#fff; transition:width .3s cubic-bezier(.2,.8,.2,1); }
  .hero .cols{ display:flex; gap:8px; } .hero .cols > div{ flex:1; min-width:0; }
  .hero .cols .n{ font-size:32px; }
  .hero .hbtn{ position:absolute; z-index:2; top:12px; right:12px; height:34px; padding:0 13px; border-radius:99px; font-size:12.5px; font-weight:700; color:#fff;
    display:inline-flex; align-items:center; gap:6px; border:1px solid rgba(255,255,255,.22); background:rgba(255,255,255,.16);
    -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px); }
  .hero .hbtn:disabled{ opacity:.45; }
  .hero .marks{ display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
  .hero .marks span{ font-size:12px; font-weight:700; padding:4px 10px; border-radius:99px; background:rgba(255,255,255,.16); display:inline-flex; align-items:center; gap:6px; }
  .hero .marks i{ width:7px; height:7px; border-radius:50%; background:currentColor; }

  .card{ background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:14px; margin-bottom:12px; }
  .card.list{ padding:2px 14px; }
  input,textarea{ width:100%; font:inherit; font-size:16px; color:var(--ink); background:var(--surface); border:1px solid var(--line);
    border-radius:12px; padding:11px 12px; -webkit-appearance:none; appearance:none; outline:none; }
  input:focus,textarea:focus{ border-color:var(--acc); }
  input::placeholder,textarea::placeholder{ color:var(--muted); }
  textarea{ min-height:92px; resize:vertical; display:block; }
  .card input,.card textarea{ background:var(--bg); }
  .addrow{ display:flex; gap:8px; } .addrow input{ flex:1; min-width:0; }
  label{ display:block; font-size:11.5px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); margin:13px 2px 7px; }

  .btn{ min-height:46px; padding:0 16px; border-radius:13px; font-size:15px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; gap:7px; flex-shrink:0; }
  .btn.pri{ background:var(--acc); color:#fff; } .btn.sec{ background:var(--fill); color:var(--ink); }
  .btn.wide{ width:100%; } .btn:disabled{ opacity:.5; }
  .btnrow{ display:flex; gap:8px; margin-top:10px; } .btnrow .btn.pri{ flex:1; }
  .pills{ display:flex; gap:6px; }
  .pills button{ flex:1; min-width:0; height:42px; border-radius:12px; border:1px solid var(--line); background:var(--bg); font-size:15px; font-weight:750; font-variant-numeric:tabular-nums; }
  .pills button.on{ background:var(--acc); border-color:var(--acc); color:#fff; }
  .seg{ display:flex; gap:3px; padding:3px; border-radius:13px; background:var(--fill); margin-bottom:14px; }
  .seg button{ flex:1; height:38px; border-radius:10px; font-size:14px; font-weight:700; color:var(--muted); }
  .seg button.on{ background:var(--surface); color:var(--ink); box-shadow:0 1px 4px rgba(0,0,0,.14); }

  /* Rows: a check on the left where the thing can be done, the text, then what you can do to it. */
  .row{ display:flex; align-items:center; gap:11px; padding:10px 0; border-bottom:1px solid var(--line); min-height:52px; }
  .row:last-child{ border-bottom:none; }
  .row.top{ align-items:flex-start; }
  .row .body{ flex:1; min-width:0; }
  .row .tx{ font-size:15.5px; line-height:1.35; overflow-wrap:break-word; }
  .row.done .tx{ color:var(--muted); text-decoration:line-through; }
  .ck{ width:26px; height:26px; border-radius:50%; border:2px solid var(--muted); opacity:.9; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    color:transparent; font-size:12px; transition:background .2s, border-color .2s; }
  .row.top .ck{ margin-top:1px; }
  .row.done .ck{ background:var(--acc); border-color:var(--acc); color:#fff; opacity:1; }
  .ck.good{ } .row.done .ck.good{ background:var(--good); border-color:var(--good); }
  .x{ width:36px; height:36px; margin:-4px -8px -4px -2px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:13px; }
  .x:active{ color:var(--bad); background:var(--fill); }
  .tags{ display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
  .tag{ display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:700; padding:3px 9px; border-radius:99px; background:var(--fill); color:var(--muted); max-width:100%; }
  .tag span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tag svg{ font-size:10.5px; }
  .tag.who{ background:hsl(140 60% 45% / .16); color:var(--good); } .tag.when{ background:hsl(32 90% 50% / .16); color:var(--warn); }

  .empty{ text-align:center; padding:26px 12px 22px; }
  .empty .tile{ width:54px; height:54px; border-radius:16px; font-size:24px; margin:0 auto 12px; }
  .empty p{ font-size:14px; color:var(--muted); max-width:280px; margin:0 auto; }
  .empty .btn{ margin-top:14px; min-height:40px; font-size:14px; }

  .note{ font-size:13px; color:var(--muted); margin:10px 2px 0; min-height:18px; }
  .note:empty{ display:none; }
  .alert{ display:flex; align-items:flex-start; gap:10px; border-radius:16px; padding:12px 13px; margin-top:10px; font-size:13.5px; line-height:1.4;
    background:hsl(4 90% 58% / .12); border:1px solid hsl(4 90% 58% / .28); }
  .alert svg{ color:var(--bad); margin-top:1px; } .alert div{ flex:1; min-width:0; }
  .alert button{ font-weight:750; color:var(--acc); font-size:13.5px; padding:2px 0 0 8px; flex-shrink:0; }
  .alert.info{ background:var(--fill); border-color:transparent; } .alert.info svg{ color:var(--muted); }
  .spin{ width:16px; height:16px; border-radius:50%; border:2.4px solid currentColor; border-right-color:transparent; animation:spin .8s linear infinite; flex-shrink:0; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .skel{ height:14px; border-radius:7px; background:var(--fill); animation:skel 1.1s ease-in-out infinite alternate; }
  @keyframes skel{ from{ opacity:.45; } to{ opacity:1; } }

  @media (max-width:340px){ .hero .cols .k{ font-size:9.5px; letter-spacing:.05em; } .btn{ font-size:14px; padding:0 12px; } .row{ gap:8px; }
    body{ padding-left:calc(12px + env(safe-area-inset-left)); padding-right:calc(12px + env(safe-area-inset-right)); }
    .hero .n{ font-size:38px; } .hero .cols .n{ font-size:26px; } .pills{ gap:4px; } }
  @media (min-width:768px){ body{ max-width:760px; } }
  @media (prefers-reduced-motion:reduce){ .spin{ animation-duration:2.4s; } .skel{ animation:none; } .hero .bar i{ transition:none; } button:active{ transform:none; } }

  /* this app's own colours, after the shared defaults so they win */
  :root{ --acc:var(--myllm-accent,#0a84ff); }
/* myllm-fullscreen-v1 — MyLLM 5.6.2+ opens this app full screen; the ✕ is the way out. */
.head .imm-acts{display:none;flex-shrink:0;margin-left:auto}
.head .acts + .imm-acts{margin-left:0}
body.imm .head .imm-acts{display:flex}
.head .imm-acts button{width:40px;height:40px;border-radius:12px;border:1px solid var(--myllm-border,rgba(128,128,128,.28));
  background:var(--myllm-surface,rgba(128,128,128,.12));color:var(--myllm-text,currentColor);display:grid;place-items:center;padding:0;cursor:pointer;transition:transform .12s}
.head .imm-acts button:active,.head .imm-x:active{transform:scale(.94)}
.head .imm-x{display:none !important}
body.imm .head .imm-x{display:grid !important;place-items:center}
.imm-x svg,.imm-acts svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}
.imm-safe{display:none}
body.imm .imm-safe{display:block}
</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.6l4.6 4.6L19.2 7.4" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M4.5 7.2l1.7 1.7 3-3.4M4.5 15.2l1.7 1.7 3-3.4M13 7.5h7M13 15.5h7" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</defs></svg>
<div class="imm-safe"></div><div class="head">
  <div class="tile"><svg><use href="#i-list"/></svg></div>
  <div class="ht"><h1>Quick Todo</h1><p>Tasks that stay done</p></div>
<div class="imm-acts"><button type="button" aria-label="Close Quick Todo" onclick="myllmFSClose()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div></div>
<div class="hero" id="hero">
  <div class="k">To do</div>
  <div class="n" id="hN">0</div>
  <div class="s" id="hS">Nothing yet</div>
  <div class="bar"><i id="hBar"></i></div>
</div>
<div class="addrow"><input id="t" placeholder="Add a task…" enterkeyhint="done" autocomplete="off"><button class="btn pri" id="addBtn"><svg><use href="#i-plus"/></svg>Add</button></div>
<h2>Tasks</h2>
<div id="list"></div>
<script>
function el(i){ return document.getElementById(i); }
/* Bridges are looked up when used, never kept: MyLLM can add them after this
   script has run. */
function haptic(k){ if (window.myllmHaptic) try { myllmHaptic(k || "light"); } catch(_){} }
function load(k){ var s = window.myllmStorage; if (!s) return Promise.resolve(null); try { return s.getItem(k).catch(function(){ return null; }); } catch(_){ return Promise.resolve(null); } }
function keep(k, v){ var s = window.myllmStorage; if (s) try { s.setItem(k, v).catch(function(){}); } catch(_){} }
function esc(s){ return (s + "").replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function icon(n){ return '<svg><use href="#i-' + n + '"/></svg>'; }
function emptyState(glyph, text, action, target){
  return '<div class="empty"><div class="tile">' + icon(glyph) + '</div><p>' + text + '</p>' +
    (action ? '<button class="btn sec" data-focus="' + target + '">' + icon("plus") + action + '</button>' : '') + '</div>';
}
document.addEventListener("click", function(e){
  var b = e.target.closest && e.target.closest("[data-focus]");
  if (b){ var f = el(b.getAttribute("data-focus")); if (f){ f.focus(); f.scrollIntoView({block:"center", behavior:"smooth"}); } }
});
var todos = [];
function save(){ keep("todos", JSON.stringify(todos)); }
function render(){
  var L = el("list"), done = todos.filter(function(t){ return t.done; }).length, open = todos.length - done;
  el("hN").textContent = open;
  el("hS").textContent = !todos.length ? "Nothing yet" : open ? done + " of " + todos.length + " done" : "All " + todos.length + " done";
  el("hBar").style.width = (todos.length ? Math.round(done / todos.length * 100) : 0) + "%";
  if (!todos.length){ L.innerHTML = '<div class="card">' + emptyState("list", "Nothing yet — add your first task.", "Add a task", "t") + '</div>'; return; }
  L.innerHTML = ""; var card = document.createElement("div"); card.className = "card list";
  todos.forEach(function(td, i){
    var d = document.createElement("div"); d.className = "row" + (td.done ? " done" : "");
    d.innerHTML = '<div class="ck">' + icon("check") + '</div><div class="body"><div class="tx"></div></div><button class="x" aria-label="Delete">' + icon("x") + '</button>';
    d.querySelector(".tx").textContent = td.text;
    function flip(){ td.done = !td.done; haptic("selection"); save(); render(); }
    d.querySelector(".ck").onclick = flip; d.querySelector(".body").onclick = flip;
    d.querySelector(".x").onclick = function(){ todos.splice(i, 1); haptic("light"); save(); render(); };
    card.appendChild(d);
  });
  L.appendChild(card);
}
function add(){ var t = el("t"), v = t.value.trim(); if (!v) return; todos.push({text:v, done:false}); t.value = ""; haptic("light"); save(); render(); }
el("addBtn").onclick = add;
el("t").addEventListener("keydown", function(e){ if (e.key === "Enter") add(); });
render();
load("todos").then(function(v){ if (v) try { var a = JSON.parse(v); if (Array.isArray(a)) todos = a; } catch(e){} render(); });

/* myllm-fullscreen-v1 — full screen where MyLLM can also close the app for us (myllmClose,
   5.6.2+): full screen hides MyLLM's Done, and a page with no way out is
   worse than a repeated title, so elsewhere nothing changes. The spacer keeps
   the header clear of the status bar only if the page doesn't already. */
(function(){
  function full(){ return !!(window.myllmClose && window.myllmImmersive); }
  function inset(){
    var p = document.createElement("div");
    p.style.cssText = "position:fixed;top:0;left:0;width:1px;visibility:hidden;height:env(safe-area-inset-top)";
    document.body.appendChild(p); var h = p.offsetHeight; p.parentNode.removeChild(p); return h;
  }
  function fit(){
    var sp = document.querySelector(".imm-safe"), head = document.querySelector(".head");
    if (!sp || !head) return;
    sp.style.height = "0px";
    if (!document.body.classList.contains("imm")) return;
    var need = inset() + 6 - (head.getBoundingClientRect().top + window.scrollY);
    sp.style.height = Math.max(0, Math.round(need)) + "px";
  }
  function sync(){
    var f = full();
    document.body.classList.toggle("imm", f);
    fit();
    if (!f) return;
    try { window.myllmImmersive(true, { keepAwake:false }).catch(function(){}); } catch(e){}
  }
  window.myllmFSClose = function(){
    try { if (window.myllmHaptic) window.myllmHaptic("light"); } catch(e){}
    try { window.myllmClose().catch(function(){}); } catch(e){}
  };
  document.addEventListener("visibilitychange", function(){ if (!document.hidden) sync(); });
  window.addEventListener("resize", fit);
  sync();
})();
</script></body></html>
