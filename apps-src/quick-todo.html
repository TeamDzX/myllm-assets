/* lists-kit v1 — several lists in one app; any of them can move to iCloud and
   be shared with other iCloud users, who edit the same list from their own
   MyLLM (myllmLists, MyLLM 6.1+). Without iCloud everything stays on this
   device, as before.
   The app keeps its own item code and calls:
     ListsKit.start({kind, storeKey, defaultName, noun, fix, legacy, render, main, changed, ready})
     main(items): the first list changed · changed(list): any list changed
     ListsKit.items()  → the open list's items (the app may mutate it)
     ListsKit.set(arr[, list]) → after any change (saves, mirrors, syncs)
     ListsKit.byName(name) / ListsKit.current() / ListsKit.all() */
(function(){
  var K = window.ListsKit = {};
  var o = null, st = { current: null, lists: [] };
  var cloud = null, why = "";           // null = not asked yet
  var pushing = {}, timers = {}, polling = null;

  function el(id){ return document.getElementById(id); }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  function haptic(k){ try { if (window.myllmHaptic) myllmHaptic(k || "light"); } catch(e){} }
  function uid(){ return "l_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function find(id){ for (var i = 0; i < st.lists.length; i++) if (st.lists[i].id === id) return st.lists[i]; return null; }
  function cur(){ return find(st.current) || st.lists[0]; }
  function fixAll(a){ return (Array.isArray(a) ? a : []).filter(function(x){ return x && typeof x === "object"; }).map(o.fix); }
  function same(a, b){ return JSON.stringify(a) === JSON.stringify(b); }

  /* ---- this device ---- */
  /* myllmStorage only: MyLLM always has it, and outside MyLLM the lists just
     last while the page is open. */
  function persist(){
    var S = window.myllmStorage;
    try { if (S) S.setItem(o.storeKey, JSON.stringify(st)).catch(function(){}); } catch(e){}
  }
  function restore(){
    var S = window.myllmStorage;
    if (!S) return Promise.resolve(null);
    return Promise.resolve().then(function(){ return S.getItem(o.storeKey); }).catch(function(){ return null; })
      .then(function(v){ try { return v ? JSON.parse(v) : null; } catch(e){ return null; } });
  }
  function afterChange(list){
    persist();
    if (list === st.lists[0] && o.main) try { o.main(list.items); } catch(e){}
    if (o.changed) try { o.changed(list); } catch(e){}
  }

  /* ---- merge: what changed here since `base` wins, the rest follows `remote`
     (the same rules MyLLM uses in iCloud) ---- */
  function merge(base, local, remote){
    function idx(a){ var m = {}; a.forEach(function(x){ m[x.id] = x; }); return m; }
    var b = idx(base), r = idx(remote), out = [], placed = {};
    local.forEach(function(x){
      if (placed[x.id]) return;
      var mine = !same(x, b[x.id]);
      if (r[x.id]) out.push(mine ? x : r[x.id]);
      else if (!b[x.id] || mine) out.push(x);
      else return;
      placed[x.id] = 1;
    });
    var prev = null;
    remote.forEach(function(x){
      var p = prev; prev = x.id;

      var at = 0;
      if (p != null) for (var i = 0; i < out.length; i++) if (out[i].id === p) { at = i + 1; break; }

  }
  K._merge = merge;

  /* ---- iCloud ---- */
  function check(){
    if (!window.myllmLists) { cloud = false; why = "Sharing needs MyLLM 6.1 or later on iPhone, iPad or Mac."; return Promise.resolve(); }
    return myllmLists.available().then(function(a){ cloud = !!(a && a.available); why = (a && a.reason) || ""; })
      .catch(function(e){ cloud = false; why = e.message || "iCloud couldn't be reached."; });
  }
  function meta(l, r){
    l.name = r.name || l.name;
    l.cloud = { shared: !!r.shared, owner: !!r.owner, ownerName: r.ownerName || "", people: r.people || [] };
  }
  function pull(){
    if (!cloud) return Promise.resolve();
    return myllmLists.all(o.kind).then(function(remote){
      var seen = {}, gone = [];
      remote.forEach(function(r){
        seen[r.id] = 1;
        var l = find(r.id);

      if (!st.lists.length) st.lists.push({ id: uid(), name: o.defaultName, items: [] });
      if (!find(st.current)) st.current = st.lists[0].id;
      if (gone.length) toast("“" + gone[0] + "” was deleted or is no longer shared with you");
      afterChange(st.lists[0]); paint(); o.render();
    }).catch(function(e){

    });
  }
  function schedule(l){

  function push(id){

  }

  /* ---- the list bar ---- */
  function people(l){
    if (!l.cloud) return "";
    if (!l.cloud.owner) return "Shared by " + (l.cloud.ownerName || "someone");
    if (l.cloud.people.length) return "Shared with " + l.cloud.people.join(", ");
    return "In your iCloud";
  }
  function paint(){
    var bar = el("lkBar"); if (!bar) return;
    var c = cur(), h = '<div class="lk-chips" role="tablist">';
    st.lists.forEach(function(l){
      h += '<button class="lk-chip' + (l === c ? " on" : "") + '" role="tab" aria-selected="' + (l === c) + '" data-lk="' + esc(l.id) + '">' +
        (l.cloud && (l.cloud.shared || !l.cloud.owner) ? '<svg class="lk-i" viewBox="0 0 24 24" aria-label="Shared"><use href="#lk-people"/></svg>' : "") +
        '<span>' + esc(l.name) + '</span>' + (l.cloud && l.err ? '<i class="lk-dot" title="Not synced"></i>' : "") + '</button>';
    });
    h += '<button class="lk-chip lk-new" data-lk-new aria-label="New ' + o.noun + '"><svg class="lk-i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg><span>New</span></button></div>';
    h += '<button class="lk-share" data-lk-menu aria-label="Share or edit this ' + o.noun + '"><svg class="lk-i" viewBox="0 0 24 24"><use href="#lk-people"/></svg><span>' + (c.cloud && (c.cloud.shared || !c.cloud.owner) ? "Shared" : "Share") + '</span></button>';
    bar.innerHTML = h;
    var line = el("lkLine");
    if (line) {
      var t = people(c);
      if (c.cloud && c.err) t = (t ? t + " · " : "") + "Not synced: " + c.err;

  }

  /* ---- sheet ---- */
  function sheet(html, wire){
    close();
    var w = document.createElement("div");
    w.className = "lk-wrap"; w.id = "lkWrap";
    w.innerHTML = '<div class="lk-sheet" role="dialog" aria-modal="true">' + html + '</div>';
    w.addEventListener("click", function(e){ if (e.target === w) close(); });
    document.body.appendChild(w);
    requestAnimationFrame(function(){ w.classList.add("show"); });
    wire(w);
  }
  function close(){ var w = el("lkWrap"); if (w) w.remove(); }
  function busy(btn, on, label){ if (!btn) return; btn.disabled = on; if (label) btn.textContent = label; }

  function newSheet(){
    sheet('<h3>New ' + o.noun + '</h3><input id="lkName" maxlength="60" placeholder="Name, e.g. ' + esc(o.example) + '" enterkeyhint="done" autocomplete="off">' +
      '<div class="lk-row"><button class="lk-btn" data-x>Cancel</button><button class="lk-btn pri" id="lkMake">Create</button></div>' +
      '<p class="lk-note">' + (cloud ? "Kept on this device until you share it." : "Kept on this device.") + '</p>', function(w){
      var inp = w.querySelector("#lkName"), go = w.querySelector("#lkMake");
      w.querySelector("[data-x]").onclick = close;
      function make(){
        var name = inp.value.trim(); if (!name) { inp.focus(); return; }
        var l = { id: uid(), name: name.slice(0, 60), items: [] };
        st.lists.push(l); st.current = l.id; persist(); close(); haptic("success"); paint(); o.render();
      }
      go.onclick = make;
      inp.addEventListener("keydown", function(e){ if (e.key === "Enter") make(); });
      setTimeout(function(){ inp.focus(); }, 60);
    });
  }

  function menuSheet(){
    var l = cur(), isCloud = !!l.cloud, owner = !isCloud || l.cloud.owner, only = st.lists.length < 2;
    var status = isCloud ? people(l) : "On this device only";
    var shareLabel = !isCloud ? "Share with people…" : owner ? "Manage sharing…" : "See who's sharing…";
    var del = !owner ? "Leave this " + o.noun : isCloud && l.cloud.shared ? "Delete for everyone" : "Delete " + o.noun;
    sheet('<h3>' + esc(l.name) + '</h3><p class="lk-sub">' + esc(status) + '</p>' +
      '<button class="lk-btn pri wide" id="lkShare"><svg class="lk-i" viewBox="0 0 24 24"><use href="#lk-people"/></svg>' + shareLabel + '</button>' +
      (cloud === false ? '<p class="lk-note">' + esc(why) + '</p>' : !isCloud ? '<p class="lk-note">Sharing moves this ' + o.noun + ' to your iCloud. People you invite need MyLLM 6.1 or later and edit it from their own app.</p>' : "") +
      '<div class="lk-field"><input id="lkRename" maxlength="60" value="' + esc(l.name) + '" aria-label="Name" enterkeyhint="done" autocomplete="off"' + (owner ? "" : " disabled") + '>' +
      (owner ? '<button class="lk-btn" id="lkSave">Rename</button>' : "") + '</div>' +
      '<button class="lk-btn danger wide" id="lkDel"' + (only && owner ? " disabled" : "") + '>' + del + '</button>' +
      (only && owner ? '<p class="lk-note">This is your only ' + o.noun + '. Make another first to delete it.</p>' : "") +
      '<button class="lk-btn wide" data-x>Done</button>', function(w){
      w.querySelector("[data-x]").onclick = close;
      var share = w.querySelector("#lkShare"), msg = function(t){ var n = w.querySelector(".lk-err") || w.querySelector(".lk-sheet").appendChild(Object.assign(document.createElement("p"), { className: "lk-note lk-err" })); n.textContent = t; };
      share.disabled = cloud === false;
      share.onclick = function(){ busy(share, true); shareList(l).then(close, function(e){ busy(share, false); msg(e.message || String(e)); }); };
      var ren = w.querySelector("#lkSave");
      if (ren) ren.onclick = function(){
        var name = w.querySelector("#lkRename").value.trim().slice(0, 60); if (!name || name === l.name) return;
        busy(ren, true);
        (l.cloud ? myllmLists.rename(l.id, name).then(function(r){ meta(l, r); }) : Promise.resolve(l.name = name))
          .then(function(){ persist(); paint(); close(); haptic("success"); }, function(e){ busy(ren, false); msg(e.message); });
      };

      d.onclick = function(){
        if (!armed) { armed = true; d.textContent = "Tap again to " + del.charAt(0).toLowerCase() + del.slice(1); haptic("warning"); return; }

          st.lists = st.lists.filter(function(x){ return x !== l; });
          if (!st.lists.length) st.lists.push({ id: uid(), name: o.defaultName, items: [] });
          st.current = st.lists[0].id; afterChange(st.lists[0]); close(); paint(); o.render(); haptic("light");
        }, function(e){ busy(d, false); msg(e.message); });

    });
  }

  /* Moving a list to iCloud the first time it's shared: create it there, put
     the items in, swap it into place, then open Apple's sharing sheet. */
  function shareList(l){
    var go = cloud === null ? check() : Promise.resolve();
    return go.then(function(){
      if (!cloud) throw new Error(why || "iCloud isn't available.");
      if (l.cloud) return myllmLists.share(l.id);
      return myllmLists.create(o.kind, l.name).then(function(c){
        return myllmLists.save(c.id, l.items).then(function(r){
          var at = st.lists.indexOf(l), moved = { id: r.id, items: fixAll(r.items) };
          meta(moved, r);
          if (at >= 0) st.lists[at] = moved; else st.lists.push(moved);
          if (st.current === l.id) st.current = moved.id;

    });
  }

  var toastT = null;
  function toast(t){
    var n = el("lkToast");
    if (!n) { n = document.createElement("div"); n.id = "lkToast"; n.className = "lk-toast"; document.body.appendChild(n); }
    n.textContent = t; n.classList.add("show");
    clearTimeout(toastT); toastT = setTimeout(function(){ n.classList.remove("show"); }, 2600);
  }

  /* ---- public ---- */
  K.items = function(){ return cur().items; };
  K.current = function(){ return cur(); };
  K.all = function(){ return st.lists; };
  K.byName = function(name){
    var n = String(name || "").trim().toLowerCase(); if (!n) return null;
    for (var i = 0; i < st.lists.length; i++) if (st.lists[i].name.toLowerCase() === n) return st.lists[i];
    return null;
  };
  K.set = function(arr, list){
    var l = list || cur(); l.items = arr;
    afterChange(l); paint();

  };
  K.start = function(opts){
    o = opts; o.noun = o.noun || "list"; o.example = o.example || "Weekend";
    var defs = document.createElement("div");
    defs.innerHTML = '<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="lk-people" viewBox="0 0 24 24">' +
      '<circle cx="9" cy="8" r="3.4" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M2.8 19.5c.6-3.3 3.1-5.2 6.2-5.2s5.6 1.9 6.2 5.2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>' +
      '<path d="M15.6 4.9a3.2 3.2 0 0 1 0 6.2M18 14.6c1.7.7 2.9 2.4 3.2 4.9" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol></svg>';
    document.body.appendChild(defs.firstChild);
    document.addEventListener("click", function(e){
      var t = e.target.closest ? e.target : null; if (!t) return;
      var chip = t.closest("[data-lk]"), add = t.closest("[data-lk-new]"), menu = t.closest("[data-lk-menu]");
      if (chip) { var id = chip.getAttribute("data-lk"); if (id !== st.current) { st.current = id; persist(); haptic("selection"); paint(); o.render(); } else menuSheet(); }
      else if (add) newSheet();
      else if (menu) menuSheet();
    });
    return restore().then(function(saved){
      if (saved && Array.isArray(saved.lists) && saved.lists.length) {
        st = saved;
        st.lists.forEach(function(l){ l.items = fixAll(l.items); l.err = null; });
        return null;
      }
      return Promise.resolve(o.legacy ? o.legacy() : []).catch(function(){ return []; }).then(function(items){
        st = { current: null, lists: [{ id: uid(), name: o.defaultName, items: fixAll(items) }] };
        st.current = st.lists[0].id; persist();
      });
    }).then(function(){
      if (!find(st.current)) st.current = st.lists[0].id;
      paint(); o.render();
      if (o.ready) try { o.ready(); } catch(e){}     // lists are usable now; iCloud follows
      return check();
    }).then(function(){
      paint();
      if (!cloud) return;
      return pull().then(function(){
        st.lists.forEach(function(l){ if (l.cloud && l.dirty) push(l.id); });
        return accepted();
      }).then(function(){
        polling = setInterval(tick, 12000);
        document.addEventListener("visibilitychange", function(){ if (!document.hidden) { tick(); accepted(); } });

    });
  };
})();
</script>
<script>
function el(i){ return document.getElementById(i); }
/* Bridges are looked up when used, never kept: MyLLM can add them after this
   script has run. */
function haptic(k){ if (window.myllmHaptic) try { myllmHaptic(k || "light"); } catch(_){} }
function load(k){ var s = window.myllmStorage; if (!s) return Promise.resolve(null); try { return s.getItem(k).catch(function(){ return null; }); } catch(_){ return Promise.resolve(null); } }
function keep(k, v){ var s = window.myllmStorage; if (s) try { s.setItem(k, v).catch(function(){}); } catch(_){} }
function esc(s){ return (s + "").replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function icon(n){ return '<svg><use href="#i-' + n + '"/></svg>'; }
function emptyState(glyph, text, action, target){
  return '<div class="empty"><div class="tile">' + icon(glyph) + '</div><p>' + text + '</p>' +
    (action ? '<button class="btn sec" data-focus="' + target + '">' + icon("plus") + action + '</button>' : '') + '</div>';
}
document.addEventListener("click", function(e){
  var b = e.target.closest && e.target.closest("[data-focus]");
  if (b){ var f = el(b.getAttribute("data-focus")); if (f){ f.focus(); f.scrollIntoView({block:"center", behavior:"smooth"}); } }
});
var todos = [];
/* v8: the lists live in ListsKit (this app's storage, or iCloud once shared). */
function fixTodo(td){ return { id: String(td.id || ("t_" + Date.now() + "_" + Math.floor(Math.random() * 100000))), text: String(td.text || ""), done: !!td.done,
  due: validDay(td.due), added: td.added || null, doneAt: td.doneAt || null }; }
function save(list){ if (list) ListsKit.set(list.items, list); else ListsKit.set(todos); }

/* ---- dates ---- */
function pad2(n){ return (n < 10 ? "0" : "") + n; }
function dayOf(d){ return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
function today(){ return dayOf(new Date()); }
function addDays(day, n){ var d = new Date(+day.slice(0,4), +day.slice(5,7) - 1, +day.slice(8,10)); d.setDate(d.getDate() + n); return dayOf(d); }
function validDay(v){ return /^\d{4}-\d{2}-\d{2}$/.test(String(v || "")) ? String(v) : null; }
function dueLabel(day){
  var t = today();
  if (day === t) return "Today";
  if (day === addDays(t, 1)) return "Tomorrow";
  if (day === addDays(t, -1)) return "Yesterday";
  var d = new Date(+day.slice(0,4), +day.slice(5,7) - 1, +day.slice(8,10)), soon = day > t && day <= addDays(t, 6);
  return d.toLocaleDateString(undefined, soon ? { weekday: "short" } : { weekday: "short", day: "numeric", month: "short" });
}

/* ---- Shared data (docs/SHARED_DATA.md): every list also goes to
   data/todos.json so other apps (Calendar Planner) can show it; `list` says
   which. Best effort. ---- */
function publish(){
  var F = window.myllmFiles; if (!F || !F.write) return;
  var all = [];
  ListsKit.all().forEach(function(l){ l.items.forEach(function(t){
    all.push({ id: t.id, text: t.text, done: !!t.done, due: t.due || null, added: t.added || null, doneAt: t.doneAt || null, list: l.name }); }); });
  var out = { schema: "myllm.todos", version: 1, source: "quick-todo", updated: new Date().toISOString(), items: all };
  try { Promise.resolve(F.write("data/todos.json", JSON.stringify(out))).catch(function(){}); } catch(e){}
}
function newTodo(text, due){ return { id: "t_" + Date.now() + "_" + Math.floor(Math.random() * 1000), text: text, done: false, due: validDay(due), added: new Date().toISOString(), doneAt: null }; }
function render(){
  todos = ListsKit.items();
  var L = el("list"), done = todos.filter(function(t){ return t.done; }).length, open = todos.length - done;
  el("hN").textContent = open;
  el("hS").textContent = !todos.length ? "Nothing yet" : open ? done + " of " + todos.length + " done" : "All " + todos.length + " done";
  el("hBar").style.width = (todos.length ? Math.round(done / todos.length * 100) : 0) + "%";
  if (!todos.length){ L.innerHTML = '<div class="card">' + emptyState("list", "Nothing yet — add your first task.", "Add a task", "t") + '</div>'; return; }
  L.innerHTML = ""; var card = document.createElement("div"); card.className = "card list";
  todos.forEach(function(td, i){
    var d = document.createElement("div"); d.className = "row" + (td.done ? " done" : "");
    var late = td.due && !td.done && td.due < today(), isToday = td.due === today();
    d.innerHTML = '<div class="ck">' + icon("check") + '</div><div class="body"><div class="tx"></div>' +
      (td.due ? '<div class="tags"><span class="tag when' + (late ? " late" : isToday ? " today" : "") + '">' + icon("cal") + '<span>' + esc((late ? "Overdue \u00b7 " : "") + dueLabel(td.due)) + '</span></span></div>' : '') +
      '</div><label class="rdate" aria-label="' + (td.due ? "Change due date" : "Add a due date") + '">' + icon("cal") + '<input type="date" class="datepick"></label><button class="x" aria-label="Delete">' + icon("x") + '</button>';
    d.querySelector(".tx").textContent = td.text;
    var dp = d.querySelector(".rdate input"); dp.value = td.due || "";
    dp.addEventListener("change", function(){ td.due = validDay(dp.value); haptic("selection"); save(); render(); });
    function flip(){ td.done = !td.done; td.doneAt = td.done ? new Date().toISOString() : null; haptic("selection"); save(); render(); }
    d.querySelector(".ck").onclick = flip; d.querySelector(".body").onclick = flip;
    d.querySelector(".x").onclick = function(){ todos.splice(i, 1); haptic("light"); save(); render(); };
    card.appendChild(d);
  });
  L.appendChild(card);
}
function add(){ var t = el("t"), v = t.value.trim(); if (!v) return; todos.push(newTodo(v, el("due").value)); t.value = ""; el("due").value = ""; paintDue(); haptic("light"); save(); render(); }
function paintDue(){ var v = validDay(el("due").value); el("dueLbl").textContent = v ? dueLabel(v) : ""; el("dueChip").classList.toggle("on", !!v); }
el("due").addEventListener("change", paintDue);
el("addBtn").onclick = add;
el("t").addEventListener("keydown", function(e){ if (e.key === "Enter") add(); });
/* Lists from before v8: the single list in this app's storage. Tasks from
   before v7 have no id: fixTodo gives them one. */
function legacy(){
  return load("todos").then(function(v){ try { var a = JSON.parse(v || "[]"); return Array.isArray(a) ? a : []; } catch(e){ return []; } });
}
/* add-todo: from Calendar Planner, or the MyLLM assistant. Registered after
   the lists have loaded, so the load can't overwrite what it adds. */
function listen(){
  if (window.myllmIntent && myllmIntent.receive) myllmIntent.receive(function(intent){
    if (!intent || intent.action !== "add-todo" || !intent.data) return;
    var text = String(intent.data.text || intent.data.task || "").trim();
    if (!text) return "Nothing added: the task had no text.";
    var asked = String(intent.data.list || "").trim(), list = ListsKit.byName(asked) || ListsKit.current();
    var td = newTodo(text.slice(0, 200), intent.data.due);
    list.items.push(td); save(list); render(); haptic("success");
    return "Added \u201c" + td.text + "\u201d to " + list.name + (td.due ? ", due " + td.due : "") + " (" + list.items.filter(function(x){ return !x.done; }).length + " still to do)." +
      (asked && list.name.toLowerCase() !== asked.toLowerCase() ? " There is no list called \u201c" + asked + "\u201d; the user's lists are: " + ListsKit.all().map(function(l){ return l.name; }).join(", ") + "." : "");
  });
}
ListsKit.start({ kind: "todo", storeKey: "lists", defaultName: "To do", example: "Work, House",
  fix: fixTodo, legacy: legacy, render: render, changed: publish, ready: listen });

/* myllm-fullscreen-v2 — full screen where MyLLM can also close the app for us
   (myllmClose, 5.6.2+): full screen hides MyLLM's Done, and a page with no way
   out is worse than a repeated title, so elsewhere nothing changes.
   The spacer keeps the header clear of the status bar / Dynamic Island. It is
   live CSS — env(safe-area-inset-top) — not a measured number: the inset is
   still 0 when the page loads and only grows once MyLLM's bar has gone (v1
   measured once, so the title sat under the island). If the page's own styles
   already pad the header down by the inset, the spacer stays at 0. */
(function(){
  function full(){ return !!(window.myllmClose && window.myllmImmersive); }
  /* Does any rule that applies to the header or an ancestor already use the top inset? */
  function pageHandlesInset(head){
    var chain = [], n, found = false;
    for (n = head; n && n.nodeType === 1; n = n.parentElement) chain.push(n);
    function walk(rules){
      for (var i = 0; i < rules.length && !found; i++){
        var r = rules[i];
        if (r.cssRules && !r.selectorText) { walk(r.cssRules); continue; }
        if (!r.selectorText || !/safe-area-inset-top/.test(r.cssText) || !/(padding|margin|top)\s*:/.test(r.cssText)) continue;
        if (/\.imm-safe/.test(r.selectorText)) continue;
        for (var k = 0; k < chain.length; k++){
          try { if (chain[k].matches(r.selectorText)) { found = true; break; } } catch(e){}
        }
      }
    }
    for (var s = 0; s < document.styleSheets.length && !found; s++){
      try { walk(document.styleSheets[s].cssRules); } catch(e){}
    }
    for (n = head; n && n.nodeType === 1 && !found; n = n.parentElement){
      if (/safe-area-inset-top/.test(n.getAttribute("style") || "")) found = true;
    }
    return found;
  }
  function fit(){
    var sp = document.querySelector(".imm-safe"), head = document.querySelector(".head");
    if (!sp || !head) return;
    sp.style.height = (document.body.classList.contains("imm") && !pageHandlesInset(head)) ? "env(safe-area-inset-top)" : "0px";
  }
  function sync(){
    var f = full();
    document.body.classList.toggle("imm", f);
    fit();
    if (!f) return;
    try { window.myllmImmersive(true, { keepAwake:false }).catch(function(){}); } catch(e){}
  }
  window.myllmFSClose = function(){
    try { if (window.myllmHaptic) window.myllmHaptic("light"); } catch(e){}
    try { window.myllmClose().catch(function(){}); } catch(e){}
  };
  document.addEventListener("visibilitychange", function(){ if (!document.hidden) sync(); });
  sync();
})();
</script></body></html>
