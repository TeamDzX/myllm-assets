<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>:root{color-scheme:light dark}
body{font-family:-apple-system,system-ui,sans-serif;margin:0;padding:20px;background:#f2f2f7;color:#111}
@media(prefers-color-scheme:dark){body{background:#000;color:#eee}.card{background:#1c1c1e}input{background:#2c2c2e;color:#eee;border-color:#3a3a3c}}
h1{font-size:22px;margin:0 0 14px}
.row{display:flex;gap:8px;margin-bottom:14px}
input{flex:1;padding:12px;border:1px solid #d1d1d6;border-radius:10px;font-size:16px;background:#fff}
button{border:0;background:#0a84ff;color:#fff;border-radius:10px;padding:0 16px;font-size:15px;font-weight:600}
.card{background:#fff;border-radius:12px;padding:4px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.card.done span{text-decoration:line-through;opacity:.45}
.card span{flex:1;padding:10px 0;font-size:16px}
.del{background:none;color:#ff453a;font-size:18px;padding:8px}
.empty{text-align:center;opacity:.5;margin-top:30px}
</style></head><body>
<h1>✅ Quick Todo</h1>
<div class="row"><input id="t" placeholder="Add a task…"><button onclick="add()">Add</button></div>
<div id="list"></div>
<script>
var store=window.myllmStorage||{getItem:function(){return Promise.resolve(null)},setItem:function(){return Promise.resolve()}};
var todos=[];
function save(){store.setItem('todos',JSON.stringify(todos))}
function render(){var L=document.getElementById('list');L.innerHTML='';
if(!todos.length){L.innerHTML='<p class="empty">Nothing yet — add your first task.</p>';return}
todos.forEach(function(td,i){var d=document.createElement('div');d.className='card'+(td.done?' done':'');
var s=document.createElement('span');s.textContent=td.text;s.onclick=function(){td.done=!td.done;save();render()};
var b=document.createElement('button');b.className='del';b.textContent='✕';b.onclick=function(){todos.splice(i,1);save();render()};
d.appendChild(s);d.appendChild(b);L.appendChild(d)})}
function add(){var t=document.getElementById('t');var v=t.value.trim();if(!v)return;todos.push({text:v,done:false});t.value='';save();render()}
document.getElementById('t').addEventListener('keydown',function(e){if(e.key==='Enter')add()});
store.getItem('todos').then(function(v){if(v)try{todos=JSON.parse(v)}catch(e){}render()});
</script></body></html>
