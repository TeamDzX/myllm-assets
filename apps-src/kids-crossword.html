--><html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Spell the Picture</title>
<style>
:root{--build-id:"d9edd23fd0";
  color-scheme:light dark;
  --bg:var(--myllm-bg,#f2f2f7);--surface:var(--myllm-surface,#fff);
  --text:var(--myllm-text,#111);--muted:var(--myllm-muted,#6b6b72);
  --accent:var(--myllm-accent,#ff8c42);--border:var(--myllm-border,rgba(120,120,128,.3));
  --font:var(--myllm-font,-apple-system,system-ui,sans-serif);
  --box:#fff;--ok:#34c759;--tile:#fff;
}
@media(prefers-color-scheme:dark){:root{--bg:var(--myllm-bg,#000);--surface:var(--myllm-surface,#1c1c1e);--text:var(--myllm-text,#eee);--muted:var(--myllm-muted,#98989f);--box:#26262b;--tile:#26262b}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text)}
.wrap{max-width:440px;margin:0 auto;padding:12px 16px 22px;text-align:center;display:flex;flex-direction:column;min-height:100dvh}
.top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.stars{font-size:18px;font-weight:800;color:var(--accent)}
.top .sp{flex:1}
.top button{border:0;background:var(--surface);border:1px solid var(--border);color:var(--accent);border-radius:12px;padding:9px 14px;font:inherit;font-weight:700;font-size:14px;cursor:pointer}
.modeseg{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:3px;width:200px;margin:2px auto 0}
.modeseg button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-weight:700;font-size:14px;padding:8px;border-radius:9px;cursor:pointer}
.modeseg button.on{background:var(--accent);color:#fff}
.pic{flex:none;margin:6px auto 2px;width:62%;max-width:240px;aspect-ratio:1;background:var(--surface);border:2px solid var(--border);border-radius:24px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:contain}
.boxes{display:flex;gap:8px;justify-content:center;margin:18px auto;max-width:100%}
.box{flex:1 1 0;max-width:64px;aspect-ratio:1;border:3px solid var(--border);border-radius:16px;background:var(--box);display:flex;align-items:center;justify-content:center;font-size:min(8.5vw,32px);font-weight:800;cursor:pointer}
.box.filled{border-color:var(--accent)}
.box.ok{border-color:var(--ok);background:var(--ok);color:#fff}
.box.bad{border-color:#ff3b30;animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.bank{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.tile{width:58px;height:58px;border:2px solid var(--border);border-radius:14px;background:var(--tile);color:var(--text);font:inherit;font-size:30px;font-weight:800;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.tile:active{transform:translateY(2px);box-shadow:none}
.tile.used{visibility:hidden}
.spacer{flex:1}
.cheer{font-size:22px;font-weight:800;color:var(--ok);min-height:30px;margin-top:14px}
.win{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:40}
.win.show{display:flex}
.winB{background:var(--bg);border-radius:24px;padding:30px 26px;max-width:300px}
.winB .big{font-size:66px}.winB h2{margin:6px 0 4px;font-size:24px}.winB p{color:var(--muted);margin:0 0 16px}
.winB button{width:100%;border:0;background:var(--accent);color:#fff;border-radius:14px;padding:14px;font:inherit;font-weight:800;font-size:16px;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span class="stars" id="stars">⭐ 0</span><span class="sp"></span>
    <button id="hintBtn">💡 Hint</button><button id="skipBtn">Skip ›</button></div>
  <div class="modeseg" id="modeseg"><button data-m="little" class="on">Little words</button><button data-m="big">Big words</button></div>
  <div class="pic"><img id="pic" alt=""></div>
  <div class="boxes" id="boxes"></div>
  <div class="cheer" id="cheer"></div>
  <div class="spacer"></div>
  <div class="bank" id="bank"></div>
</div>
<div class="win" id="win"><div class="winB"><div class="big">🌟</div><h2>Well done!</h2><p id="winSub">You spelled them all!</p><button id="winBtn">Play again</button></div></div>

<script>
var IMG="https://raw.githubusercontent.com/TeamDzX/myllm-assets/main/apps/kids/";
var WORDS_LITTLE=["CAT","DOG","PIG","COW","SUN","BEE","BUS","CAR","HAT","FOX","OWL","CAP","CUP","BAT"];
var WORDS_BIG=["FISH","STAR","FROG","DUCK","CAKE","MOON","TREE","BEAR","APPLE","TRAIN","ROBOT","SNAKE","TIGER","HOUSE"];
var mode="little";
function WORDS(){return mode==="big"?WORDS_BIG:WORDS_LITTLE}
var order=[],qi=0,word="",bank=[],used=[],placed=[],stars=0,locked=false;
function $(i){return document.getElementById(i)}
function haptic(k){if(window.myllmHaptic)try{myllmHaptic(k)}catch(e){}}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

function loadWord(){
  locked=false;$('cheer').textContent='';
  word=order[qi];
  $('pic').src=IMG+word.toLowerCase()+'.jpg';$('pic').alt=word;
  bank=shuffle(word.split(''));
  // avoid an accidentally-correct shuffle
  if(bank.join('')===word&&word.length>1)bank=shuffle(bank);
  used=bank.map(function(){return false});
  placed=word.split('').map(function(){return null});
  render();
}
function render(){
  var B=$('boxes');B.innerHTML='';
  for(var b=0;b<word.length;b++){
    var d=document.createElement('div');d.className='box'+(placed[b]!=null?' filled':'');
    d.textContent=placed[b]!=null?bank[placed[b]]:'';
    (function(bb){d.onclick=function(){removeAt(bb)}})(b);
    B.appendChild(d);
  }
  var K=$('bank');K.innerHTML='';
  bank.forEach(function(ch,i){
    var t=document.createElement('button');t.className='tile'+(used[i]?' used':'');t.textContent=ch;
    (function(ii){t.onclick=function(){place(ii)}})(i);
    K.appendChild(t);
  });
}
function place(i){
  if(locked||used[i])return;
  var b=placed.indexOf(null);if(b<0)return;
  placed[b]=i;used[i]=true;haptic('light');render();
  if(placed.indexOf(null)<0)check();
}
function removeAt(b){
  if(locked||placed[b]==null)return;
  used[placed[b]]=false;placed[b]=null;haptic('selection');render();
}
function check(){
  var spelled=placed.map(function(i){return bank[i]}).join('');
  if(spelled===word){
    locked=true;haptic('success');
    var bx=$('boxes').children;for(var k=0;k<bx.length;k++)bx[k].className='box ok';
    stars++;$('stars').textContent='⭐ '+stars;$('cheer').textContent='Yes! '+word+' 🎉';
    setTimeout(next,1100);
  }else{
    haptic('warning');
    var b2=$('boxes').children;for(var k2=0;k2<b2.length;k2++)b2[k2].classList.add('bad');
    setTimeout(function(){ // clear and let them retry
      placed=word.split('').map(function(){return null});used=bank.map(function(){return false});render();
    },520);
  }
}
function next(){
  qi++;
  if(qi>=order.length){$('winSub').textContent='You spelled all '+order.length+' words! ⭐ '+stars;$('win').classList.add('show');return}
  loadWord();
}
$('hintBtn').onclick=function(){
  if(locked)return;
  var b=placed.indexOf(null);if(b<0)return;
  // place the correct letter for the first empty box
  var need=word[b];
  for(var i=0;i<bank.length;i++){if(!used[i]&&bank[i]===need){placed[b]=i;used[i]=true;break}}
  haptic('light');render();if(placed.indexOf(null)<0)check();
};
$('skipBtn').onclick=function(){if(locked)return;haptic('selection');next()};
$('winBtn').onclick=function(){$('win').classList.remove('show');start(true)};

function save(){if(window.myllmStorage)myllmStorage.setItem('spellpic',JSON.stringify({stars:stars,mode:mode}))}
function setModeUI(){Array.prototype.forEach.call(document.querySelectorAll('#modeseg button'),function(x){x.classList.toggle('on',x.dataset.m===mode)})}
Array.prototype.forEach.call(document.querySelectorAll('#modeseg button'),function(b){b.onclick=function(){if(mode===b.dataset.m)return;mode=b.dataset.m;setModeUI();haptic('selection');start(false)}});
function start(fresh){
  order=shuffle(WORDS());qi=0;if(fresh)stars=0;$('stars').textContent='⭐ '+stars;loadWord();save();
}
if(window.myllmStorage){myllmStorage.getItem('spellpic').then(function(v){if(v)try{var s=JSON.parse(v);stars=s.stars||0;if(s.mode)mode=s.mode}catch(e){}; $('stars').textContent='⭐ '+stars; setModeUI(); start(false)})}
else{setModeUI();start(false)}
setInterval(save,4000);
</script>
</body>
</html>
