  @media (min-width:768px){ body{ max-width:760px; } }
  svg.i{ width:1.25em; height:1.25em; fill:currentColor; flex-shrink:0; }

  .head{ display:flex; align-items:center; gap:12px; margin:2px 2px 14px; }

  .item .err{ font-size:12px; color:#e5342f; margin-top:2px; line-height:1.45; }
  .save{ min-height:40px; border:1px solid var(--line); background:var(--bg); border-radius:11px; padding:0 13px; font-size:13.5px; font-weight:700;
    flex-shrink:0; display:inline-flex; align-items:center; gap:5px; }
  .save svg{ width:16px; height:16px; }
  .save.done{ color:#1f9d55; border-color:#1f9d55; }

  .prog{ padding:4px 2px; }
  .prog .t{ display:flex; align-items:center; gap:8px; font-size:14px; font-weight:650; }
  .prog .bar{ height:6px; border-radius:99px; background:var(--fill); margin-top:10px; overflow:hidden; }
  .prog .bar i{ display:block; height:100%; border-radius:99px; background:hsl(var(--h) 55% 45%); transition:width .3s ease; }

    background:var(--ink); color:var(--bg); font-size:13.5px; font-weight:650; padding:11px 18px; border-radius:99px; transition:transform .25s; z-index:9; white-space:nowrap; max-width:92vw; overflow:hidden; text-overflow:ellipsis; }
  .toast.show{ transform:translateX(-50%) translateY(0); }
  @media (max-width:360px){ .seg button{ padding:0 9px; font-size:12.5px; } input[type=range]{ width:100px; } }
  @media (prefers-reduced-motion:reduce){ .spin{ animation-duration:2.4s; } button:active{ transform:none; } }

/* myllm-fullscreen-v1 — MyLLM 5.6.2+ opens this app full screen; the ✕ is the way out. */

<div class="imm-safe"></div><div class="head">
  <div class="tile"><svg class="i"><use href="#i-cycle"/></svg></div>
  <div class="ht"><h1>Image Converter</h1><p>HEIC to JPG, and friends</p></div>
<div class="imm-acts"><button type="button" aria-label="Close Image Converter" onclick="myllmFSClose()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div></div>

<label class="drop" id="drop">
  <div class="tile"><svg class="i"><use href="#i-photo"/></svg></div>
  <p id="dropTitle">Choose images to convert</p>
  <span class="pick" id="pickLbl"><svg class="i"><use href="#i-plus"/></svg>Pick images</span>
  <small>HEIC, TIFF, WebP, GIF, BMP, PNG or JPG in — JPG or PNG out.<br>
  Pick from Photos or browse the Files app. Converting also strips location &amp; EXIF metadata.</small>
  <input id="file" type="file" accept="image/*,.heic,.heif,.tif,.tiff,.webp,.bmp" multiple>
</label>

<div class="card" id="opts">
  <div class="optrow">
    <label>Convert to</label>
    <div class="seg" id="fmtSeg">
      <button class="hot" data-f="jpeg" onclick="setFmt('jpeg')">JPG</button>
      <button data-f="png" onclick="setFmt('png')">PNG</button>
    </div>
  </div>
  <div class="optrow" id="qRow">
    <label>Quality</label>
    <div style="display:flex;align-items:center;gap:8px">
      <input type="range" id="q" min="30" max="100" value="85" oninput="qLabel()">
      <span class="qv" id="qv">85%</span>
    </div>
  </div>
  <div class="optrow">
    <label>Max size</label>
    <div class="seg" id="szSeg">
      <button class="hot" data-s="0" onclick="setSize(0)">Original</button>
      <button data-s="2048" onclick="setSize(2048)">2048px</button>
      <button data-s="1024" onclick="setSize(1024)">1024px</button>
    </div>
  </div>
</div>

<button class="go" id="go" onclick="convertAll()" disabled><svg class="i"><use href="#i-cycle"/></svg><span>Convert</span></button>

<div id="outWrap" style="display:none">
  <h2 id="outTitle">Converted</h2>
  <div class="card" id="out"></div>
  <p class="note">Saved images land in Photos (and the MyLLMos photos folder). Re-encoding always removes EXIF data — including GPS location — which is handy before sharing.</p>
</div>

<div class="toast" id="toast"></div>

<script>
/* The Photos bridge is looked up when used, never kept: MyLLM can add it after
   this script has run. */
function SAVE(du){ return window.myllmSaveImage(du); }
function canSave(){ return !!window.myllmSaveImage; }
function haptic(k){ if(window.myllmHaptic){ try{ myllmHaptic(k||'light'); }catch(_){} } }
function el(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function icon(n){ return '<svg class="i"><use href="#i-'+n+'"/></svg>'; }
function toast(m){
  var t = el("toast"); t.textContent = m; t.classList.add("show");
  clearTimeout(t._t); t._t = setTimeout(function(){ t.classList.remove("show"); }, 2000);
}

var fmt = "jpeg";        /* 'jpeg' | 'png' */
var maxSide = 0;         /* 0 = keep original */
var files = [];          /* picked File objects */
var results = [];        /* {name,outName,blob,url,w,h,inBytes,outBytes,saved,error} */

/* ---------- pure helpers (node-tested) ---------- */

function fmtBytes(n){
  if (n == null) return "";
  if (n < 1024) return n + " B";
  if (n < 1048576) return (n/1024).toFixed(n < 10240 ? 1 : 0) + " KB";
  return (n/1048576).toFixed(1) + " MB";
}

function outName(name, format){
  var base = String(name || "image").replace(/\.[a-z0-9]+$/i, "");
  return base + (format === "png" ? ".png" : ".jpg");
}

function fitSize(w, h, max){
  if (!max || (w <= max && h <= max)) return {w:w, h:h};
  var k = max / Math.max(w, h);
  return {w: Math.max(1, Math.round(w*k)), h: Math.max(1, Math.round(h*k))};
}

function srcLabel(name, type){
  var m = String(name||"").match(/\.([a-z0-9]+)$/i);
  var ext = m ? m[1].toUpperCase() : "";
  if (ext === "JPEG") ext = "JPG";
  if (ext) return ext;
  var t = String(type||"").split("/")[1] || "";
  return t ? t.toUpperCase() : "image";
}

function deltaHtml(inB, outB){
  if (!inB || !outB) return "";
  var pct = Math.round((outB - inB) / inB * 100);
  if (pct === 0) return "";
  return pct < 0 ? ' · <b class="less">' + (-pct) + '% smaller</b>'
                 : ' · <b class="more">' + pct + '% larger</b>';
}

/* ---------- UI state ---------- */

function setFmt(f){
  fmt = f; haptic("selection");
  var bs = el("fmtSeg").getElementsByTagName("button");
  for (var i=0;i<bs.length;i++) bs[i].className = bs[i].getAttribute("data-f") === f ? "hot" : "";
  el("qRow").style.display = f === "jpeg" ? "flex" : "none";
}

function setSize(s){
  maxSide = s; haptic("selection");
  var bs = el("szSeg").getElementsByTagName("button");
  for (var i=0;i<bs.length;i++) bs[i].className = +bs[i].getAttribute("data-s") === s ? "hot" : "";
}

function qLabel(){ el("qv").textContent = el("q").value + "%"; }

el("file").addEventListener("change", function(){
  files = [];
  for (var i = 0; i < this.files.length; i++) files.push(this.files[i]);
  el("dropTitle").textContent = files.length
    ? files.length + (files.length === 1 ? " image selected" : " images selected")
    : "Choose images to convert";
  el("pickLbl").innerHTML = icon(files.length ? "cycle" : "plus") + (files.length ? "Choose again" : "Pick images");
  el("drop").classList.toggle("has", !!files.length);
  el("go").disabled = !files.length;
  if (files.length) haptic("light");
});

/* ---------- conversion ---------- */

function decode(file){
  return new Promise(function(res, rej){
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function(){ res({img:img, url:url}); };
    img.onerror = function(){
      URL.revokeObjectURL(url);
      rej(new Error("Couldn't decode this image — the format may need a newer iOS."));
    };
    img.src = url;
  });
}

function encode(img, w, h, format, quality){
  return new Promise(function(res, rej){
    var c = document.createElement("canvas");
    c.width = w; c.height = h;
    var ctx = c.getContext("2d");
    if (format === "jpeg"){ ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h); }  /* flatten alpha */
    ctx.drawImage(img, 0, 0, w, h);
    c.toBlob(function(b){
      if (b) res(b); else rej(new Error("Encoding failed — the image may be too large."));
    }, "image/" + format, quality);
  });
}

function convertOne(file){
  var q = (+el("q").value) / 100;
  return decode(file).then(function(d){
    var natW = d.img.naturalWidth, natH = d.img.naturalHeight;
    var sz = fitSize(natW, natH, maxSide);
    return encode(d.img, sz.w, sz.h, fmt, q).then(function(blob){
      URL.revokeObjectURL(d.url);
      return {
        name: file.name, outName: outName(file.name, fmt),
        blob: blob, url: URL.createObjectURL(blob),
        w: sz.w, h: sz.h, inBytes: file.size, outBytes: blob.size,
        srcFmt: srcLabel(file.name, file.type), saved: false, error: null
      };
    });
  }).catch(function(e){
    return { name: file.name, error: e.message || "Conversion failed.", inBytes: file.size,
             srcFmt: srcLabel(file.name, file.type) };
  });
}

function progress(i, n){
  el("out").innerHTML = '<div class="prog"><div class="t"><i class="spin"></i>Converting ' + i + ' of ' + n + '…</div>' +
    '<div class="bar"><i style="width:' + Math.round((i - 1) / n * 100) + '%"></i></div></div>';
}

function convertAll(){
  if (!files.length) return;
  haptic("medium");
  el("go").disabled = true;
  el("outWrap").style.display = "block";
  el("outTitle").textContent = "Converting";
  progress(1, files.length);
  results = [];
  var chain = Promise.resolve();
  files.forEach(function(f, i){
    chain = chain.then(function(){
      progress(i + 1, files.length);
      return convertOne(f).then(function(r){ results.push(r); });
    });
  });
  chain.then(function(){
    renderResults();
    el("go").disabled = false;
    var ok = results.filter(function(r){ return !r.error; }).length;
    haptic(ok ? "success" : "error");
  });
}

/* ---------- results ---------- */

function renderResults(){
  var ok = results.filter(function(r){ return !r.error; }).length;
  el("outTitle").textContent = "Converted (" + ok + "/" + results.length + ")";
  var h = "";
  for (var i = 0; i < results.length; i++){
    var r = results[i];
    if (r.error){
      h += '<div class="item"><div class="thumb">' + icon("warn") + '</div><div class="info">' +
        '<div class="nm">' + esc(r.name) + '</div>' +
        '<div class="err">' + esc(r.error) + '</div></div></div>';
      continue;
    }
    h += '<div class="item">' +
      '<img class="thumb" src="' + r.url + '" alt="">' +
      '<div class="info">' +
        '<div class="nm">' + esc(r.outName) + '</div>' +
        '<div class="dt">' + esc(r.srcFmt) + ' → ' + (fmt === "png" ? "PNG" : "JPG") +
          ' · ' + r.w + '×' + r.h + ' · ' + fmtBytes(r.outBytes) + deltaHtml(r.inBytes, r.outBytes) + '</div>' +
      '</div>' +
      '<button class="save' + (r.saved ? ' done' : '') + '" onclick="saveOne(' + i + ')">' +
        (r.saved ? '<svg><use href="#i-check"/></svg>Saved' : '<svg><use href="#i-down"/></svg>Save') + '</button>' +
    '</div>';
  }
  if (ok > 1)
    h += '<div style="padding-top:12px"><button class="go" style="margin:0" onclick="saveAll()">' + icon("down") + '<span>Save all to Photos</span></button></div>';
  el("out").innerHTML = h;
}

function blobToDataUrl(blob){
  return new Promise(function(res, rej){
    var fr = new FileReader();
    fr.onload = function(){ res(fr.result); };
    fr.onerror = function(){ rej(new Error("read failed")); };
    fr.readAsDataURL(blob);
  });
}

function saveOne(i){
  var r = results[i];
  if (!r || r.error || r.saved) return;
  if (!canSave()){ toast("Saving needs the MyLLM app"); return; }
  if (r.outBytes > 10485760){ toast("Over the 10 MB save limit — lower quality or size"); return; }
  haptic("light");
  blobToDataUrl(r.blob).then(function(du){
    return SAVE(du);
  }).then(function(){
    r.saved = true; renderResults(); toast("Saved " + r.outName);
  }).catch(function(e){
    toast(String(e && e.message || e || "Couldn't save"));
  });
}

function saveAll(){
  var chain = Promise.resolve();
  results.forEach(function(r, i){
    if (!r.error && !r.saved) chain = chain.then(function(){ return saveOnePromise(i); });
  });
  chain.then(function(){ haptic("success"); });
}

function saveOnePromise(i){
  var r = results[i];
  if (!canSave() || r.outBytes > 10485760) return Promise.resolve();
  return blobToDataUrl(r.blob).then(function(du){ return SAVE(du); })
    .then(function(){ r.saved = true; renderResults(); })
    .catch(function(){});
}

/* checked a moment after load, so a bridge that arrives late isn't reported missing */
setTimeout(function(){
  if (!canSave())
    el("outWrap").insertAdjacentHTML("beforebegin",
      '<p class="note">Heads-up: outside MyLLM there\'s no Photos bridge, so converted images can\'t be saved from this preview.</p>');
}, 700);

/* myllm-fullscreen-v1 — full screen where MyLLM can also close the app for us (myllmClose,
   5.6.2+): full screen hides MyLLM's Done, and a page with no way out is
   worse than a repeated title, so elsewhere nothing changes. The spacer keeps
   the header clear of the status bar only if the page doesn't already. */
(function(){
  function full(){ return !!(window.myllmClose && window.myllmImmersive); }
  function inset(){
    var p = document.createElement("div");
    p.style.cssText = "position:fixed;top:0;left:0;width:1px;visibility:hidden;height:env(safe-area-inset-top)";
    document.body.appendChild(p); var h = p.offsetHeight; p.parentNode.removeChild(p); return h;
  }
  function fit(){
    var sp = document.querySelector(".imm-safe"), head = document.querySelector(".head");
    if (!sp || !head) return;
    sp.style.height = "0px";
    if (!document.body.classList.contains("imm")) return;
    var need = inset() + 6 - (head.getBoundingClientRect().top + window.scrollY);
    sp.style.height = Math.max(0, Math.round(need)) + "px";
  }
  function sync(){
    var f = full();
    document.body.classList.toggle("imm", f);
    fit();
    if (!f) return;
    try { window.myllmImmersive(true, { keepAwake:false }).catch(function(){}); } catch(e){}
  }
  window.myllmFSClose = function(){
    try { if (window.myllmHaptic) window.myllmHaptic("light"); } catch(e){}
    try { window.myllmClose().catch(function(){}); } catch(e){}
  };
  document.addEventListener("visibilitychange", function(){ if (!document.hidden) sync(); });
  window.addEventListener("resize", fit);
  sync();
})();
</script>
</body>
