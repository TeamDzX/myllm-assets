<style>
  :root{ color-scheme:light dark;
    --bg:var(--myllm-bg,#f2f2f7); --surface:var(--myllm-surface,#fff); --ink:var(--myllm-text,#111);

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ font-family:var(--myllm-font,-apple-system,system-ui,sans-serif); background:var(--bg); color:var(--ink);
    max-width:600px; margin:0 auto; min-height:100dvh; font-size:15.5px; line-height:1.4;
    padding:calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(96px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left)); }
  @media (min-width:768px){ body{ max-width:760px; } }
  svg.i{ width:1.25em; height:1.25em; fill:currentColor; flex-shrink:0; }

  /* sheet */

    padding:10px calc(18px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(18px + env(safe-area-inset-left));
    transform:translateY(105%); transition:transform .28s cubic-bezier(.2,.8,.2,1);
    max-width:600px; margin:0 auto; max-height:88dvh; overflow-y:auto; box-shadow:0 -10px 40px rgba(0,0,0,.2); }
  .sheet::before{ content:""; display:block; width:38px; height:5px; border-radius:99px; background:var(--line); margin:0 auto 12px; }
  .sheet.on{ transform:none; }
  .sheet h3{ font-size:18px; font-weight:800; margin-bottom:2px; }
  label{ display:block; font-size:12px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); margin:14px 2px 7px; }

  input{ width:100%; font:inherit; font-size:16px; padding:12px; border-radius:12px; border:1px solid var(--line); background:var(--bg); color:var(--ink); outline:none; }

  .row3{ display:flex; gap:8px; }

  .go{ width:100%; min-height:50px; border:none; border-radius:14px; margin-top:14px; font-size:16px; font-weight:700;
    background:var(--acc); color:#fff; display:flex; align-items:center; justify-content:center; gap:8px; }
  .go:disabled{ opacity:.6; }
  .go.danger{ background:transparent; color:#ff3b30; }
  .gift{ background:hsl(var(--h) 70% 50% / .12); color:hsl(var(--h) 70% 42%); }
  @media (prefers-color-scheme:dark){ .gift{ color:hsl(var(--h) 85% 70%); } }
  .spin{ width:16px; height:16px; border-radius:50%; border:2.4px solid currentColor; border-right-color:transparent; animation:spin .8s linear infinite; flex-shrink:0; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .ideas.on{ display:block; }

  .idea svg{ color:hsl(var(--h) 65% 50%); margin-top:2px; }
  .idea:last-child{ border-bottom:none; }
  .note{ font-size:12.5px; color:var(--muted); margin-top:8px; line-height:1.5; }
  [hidden]{ display:none !important; }
  @media (prefers-reduced-motion:reduce){ .sheet{ transition:none; } .spin{ animation-duration:2.4s; } button:active{ transform:none; } }
</style>

<div class="head">
  <div class="tile"><svg class="i"><use href="#i-gift"/></svg></div>
  <div class="ht"><h1>Birthday Book</h1><p>Never miss a birthday again</p></div>
</div>
<div class="hero" id="hero" hidden></div>
<h2 id="listLbl" hidden>Coming up</h2>
<div class="list" id="list"></div>
<button class="fab" onclick="openSheet()" aria-label="Add a birthday"><svg class="i"><use href="#i-plus"/></svg></button>

<div class="sheet" id="sheet">
  <h3 id="sheetTitle">New birthday</h3>
  <label for="f_name">Name</label>
  <input id="f_name" placeholder="Mum, Sam, Aunt Rosa…" autocomplete="off">
  <div class="row3">
    <div><label>Day</label><input id="f_day" inputmode="numeric" placeholder="14"></div>
    <div><label>Month</label><input id="f_month" inputmode="numeric" placeholder="7"></div>
    <div><label>Year <span>(optional)</span></label><input id="f_year" inputmode="numeric" placeholder="1968"></div>
  </div>

  <input id="f_notes" placeholder="gardening, crime novels, good coffee…">
  <button class="go" onclick="savePerson()">Save</button>

<!-- AI thinking pill (house convention) -->
<style>
@keyframes myllmAiSpin{to{transform:rotate(360deg)}}
.myllm-ai-busy{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(18px);z-index:99999;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;display:flex;align-items:center;gap:10px;background:rgba(28,28,30,.96);color:#fff;border-radius:999px;padding:10px 16px 10px 14px;box-shadow:0 6px 22px rgba(0,0,0,.4);font-size:14px;font-weight:600;max-width:92%}
.myllm-ai-busy.on{opacity:1;transform:translateX(-50%) translateY(0)}
.myllm-ai-cog{width:16px;height:16px;border-radius:50%;border:2.4px solid #a78bfa;border-right-color:transparent;animation:myllmAiSpin .9s linear infinite;flex-shrink:0}
.myllm-ai-busy small{font-weight:400;opacity:.6}
</style>
<script>
(function(){if(window.__myllmAiWrap||typeof window.myllmAsk!=='function')return;window.__myllmAiWrap=true;
var orig=window.myllmAsk,depth=0,node=null;
function ensure(){if(node)return;node=document.createElement('div');node.className='myllm-ai-busy';
node.innerHTML='<span class="myllm-ai-cog"></span><span>AI is thinking… <small>privately, on your device</small></span>';
(document.body||document.documentElement).appendChild(node);}
function show(){ensure();depth++;node.classList.add('on');}
function hide(){depth=Math.max(0,depth-1);if(depth===0&&node)node.classList.remove('on');}
window.myllmAsk=function(){show();var p;try{p=orig.apply(this,arguments);}catch(e){hide();throw e;}
return Promise.resolve(p).then(function(r){hide();return r;},function(e){hide();throw e;});};})();
</script>

<script>
/* Bridges are looked up when used, never kept: MyLLM can add them after this
   script has run. */
function store(){ return window.myllmStorage || {getItem:function(){return Promise.resolve(null)}, setItem:function(){return Promise.resolve()}}; }
function haptic(k){ if(window.myllmHaptic){ try{ myllmHaptic(k||'light'); }catch(_){} } }
function ASK(){ return window.myllmAsk.apply(window, arguments); }
function hasAI(){ return typeof window.myllmAsk === 'function'; }
function el(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

var people = [];   /* {id,name,day,month,year|null,notes} */
var editing = null, armDelete = false;
var MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function initials(n){ var w=String(n||'').trim().split(/\s+/).filter(Boolean); return ((w[0]||'?').charAt(0)+(w.length>1?w[w.length-1].charAt(0):'')).toUpperCase(); }

function uid(){ return "p" + Date.now().toString(36) + Math.floor(Math.random()*1e5).toString(36); }
function save(){ store().setItem("bdays", JSON.stringify(people)); }

/* days until the NEXT occurrence (0 = today) */
function daysUntil(p){
  var now = new Date(); now.setHours(0,0,0,0);
  var next = new Date(now.getFullYear(), p.month - 1, p.day);
  /* handle 29 Feb in non-leap years → celebrate 1 Mar */
  if (p.day === 29 && p.month === 2 && next.getDate() !== 29) next = new Date(now.getFullYear(), 2, 1);
  if (next < now){
    next = new Date(now.getFullYear() + 1, p.month - 1, p.day);
    if (p.day === 29 && p.month === 2 && next.getDate() !== 29) next = new Date(now.getFullYear() + 1, 2, 1);
  }
  return Math.round((next - now) / 86400000);
}
function turningAge(p){
  if (!p.year) return null;
  var now = new Date();
  var age = now.getFullYear() - p.year;
  var passed = daysUntil(p) === 0 ||
    (new Date(now.getFullYear(), p.month - 1, p.day) >= new Date(now.getFullYear(), now.getMonth(), now.getDate()));
  return passed ? age : age + 1;
}

function render(){
  el("listLbl").hidden = !people.length;
  if (!people.length){
    el("hero").hidden = true;
    el("list").innerHTML = '<div class="empty"><div class="tile"><svg class="i"><use href="#i-cake"/></svg></div><b>Add the birthdays you must never miss</b><p>They sort themselves by who\'s next — and the AI helps with gift ideas.</p></div>';
    return;
  }
  var sorted = people.slice().sort(function(a, b){ return daysUntil(a) - daysUntil(b); });
  var next = sorted[0];
  var d0 = daysUntil(next), a0 = turningAge(next);
  var hero = el("hero"); hero.hidden = false;
  hero.onclick = function(){ openSheet(next.id); };
  hero.innerHTML = '<div class="main"><div class="k">' + (d0 === 0 ? "Today" : "Next up") + '</div><b>' + esc(next.name) + '</b>' +
    '<div class="l">' + next.day + ' ' + MONTHS[next.month - 1] + (a0 ? ' · turning ' + a0 : '') + '</div></div>' +
    '<div class="days">' + (d0 === 0 ? '<svg class="i"><use href="#i-party"/></svg><span>Today</span>'
      : '<div class="n">' + d0 + '</div><span>' + (d0 === 1 ? "day" : "days") + '</span>') + '</div>';
  el("list").innerHTML = sorted.map(function(p, i){
    var d = daysUntil(p);
    var age = turningAge(p);
    var when = d === 0 ? "today!" : d === 1 ? "tomorrow" : "in " + d + " days";
    var hue = 330 + ((i * 23) % 70) - 35;
    return '<div class="person' + (d === 0 ? ' today' : '') + '" onclick="openSheet(\'' + p.id + '\')">' +
      '<div class="tile" style="--h:' + hue + '">' + esc(initials(p.name)) + '</div>' +
      '<div class="t"><b>' + esc(p.name) + '</b>' +
      '<small>' + p.day + ' ' + MONTHS[p.month - 1] + (age ? ' · turning ' + age : '') +
      (p.notes ? ' · ' + esc(p.notes) : '') + '</small></div>' +
      '<div class="when' + (d === 0 ? ' today' : d <= 7 ? ' soon' : '') + '"><b>' + when + '</b>' +
      (d !== 0 ? '<small>' + p.day + '/' + p.month + '</small>' : '') + '</div></div>';
  }).join("");
}

/* ---------- sheet ---------- */
function openSheet(id){
  editing = id || null;
  armDelete = false;
  var p = editing ? people.filter(function(x){ return x.id === editing; })[0] : null;
  el("sheetTitle").textContent = p ? p.name : "New birthday";
  el("f_name").value = p ? p.name : "";
  el("f_day").value = p ? p.day : "";
  el("f_month").value = p ? p.month : "";
  el("f_year").value = p && p.year ? p.year : "";
  el("f_notes").value = p ? (p.notes || "") : "";
  el("delBtn").style.display = p ? "block" : "none";
  el("delBtn").textContent = "Delete";
  el("giftBtn").style.display = (p && hasAI()) ? "flex" : "none";
  el("ideas").className = "ideas"; el("ideas").innerHTML = "";
  el("sheetnote").textContent = (!hasAI() && p) ? "Enable AI in Settings to get gift ideas here." : "";
  el("veil").classList.add("on"); el("sheet").classList.add("on");
  haptic("light");
}
function closeSheet(){
  el("veil").classList.remove("on"); el("sheet").classList.remove("on");
  editing = null;
}
function savePerson(){
  var name = el("f_name").value.trim();
  var day = parseInt(el("f_day").value, 10);
  var month = parseInt(el("f_month").value, 10);
  var year = parseInt(el("f_year").value, 10) || null;
  if (!name){ el("sheetnote").textContent = "A name would help."; return; }
  if (!(day >= 1 && day <= 31) || !(month >= 1 && month <= 12)){
    el("sheetnote").textContent = "Check the day and month (day 1–31, month 1–12)."; return;
  }
  if (year && (year < 1900 || year > new Date().getFullYear())){
    el("sheetnote").textContent = "That year looks off."; return;
  }
  var notes = el("f_notes").value.trim();
  if (editing){
    var p = people.filter(function(x){ return x.id === editing; })[0];
    p.name = name; p.day = day; p.month = month; p.year = year; p.notes = notes;
  } else {
    people.push({id:uid(), name:name, day:day, month:month, year:year, notes:notes});
  }
  save(); render(); closeSheet(); haptic("success");
}
function delPerson(){
  if (!armDelete){ armDelete = true; el("delBtn").textContent = "Really delete?"; haptic("light"); return; }
  people = people.filter(function(x){ return x.id !== editing; });
  save(); render(); closeSheet(); haptic("success");
}

/* ---------- gift ideas ---------- */
/* Labelled lines, not JSON — small models (Apple Intelligence) echo JSON
   templates back verbatim. Echoed instructions are rejected and retried. */
var ECHO = /one specific gift idea|repeat this line|labelled line|short and concrete/i;
function parseIdeas(reply){
  var ideas = [], got = false;
  String(reply || '').split(/\r?\n/).forEach(function(raw){
    var ln = raw.replace(/\*\*/g, '').trim();
    var m = ln.match(/^[-*#>\s]*(IDEAS?)\s*\d*\s*[::]\s*(.*)$/i);
    if (!m) return;
    got = true;
    var v = m[2].trim();
    if (v) ideas.push(v);
  });
  if (!got){ // model answered in the old JSON-array shape — accept it
    var s = String(reply || '');
    var a = s.indexOf("["), b = s.lastIndexOf("]");
    if (a >= 0 && b > a) try{
      var j = JSON.parse(s.slice(a, b + 1));
      if (Array.isArray(j)) ideas = j.map(function(x){ return String(x).trim(); });
    }catch(e){}
  }
  ideas = ideas.filter(function(x){ return x && !ECHO.test(x); });
  if (ideas.length < 2) throw new Error("no real gift ideas came back");
  return ideas;
}
function giftIdeas(){
  if (!hasAI() || !editing) return;
  var p = people.filter(function(x){ return x.id === editing; })[0];
  if (!p) return;
  haptic("light");
  var gb = el("giftBtn"); gb.disabled = true; gb.innerHTML = '<i class="spin"></i><span>Thinking of ideas…</span>';
  var age = turningAge(p);
  var prompt = "Suggest 5 thoughtful, specific birthday gift ideas for " + p.name +
      (age ? " (turning " + age + ")" : "") +
      (p.notes ? ", who loves: " + p.notes : "") +
      ". Mix price ranges; at least one should cost nothing but effort." +
      " Reply with EXACTLY these labelled lines and nothing else:\n" +
      "IDEA: one specific gift idea, short and concrete (repeat this line for each of the 5 ideas)";
  var sys = {system:"You are a thoughtful gift-picker. Give specific, personal gift ideas."};
  ASK(prompt, sys)
  .then(function(r){ return parseIdeas(r); })
  .catch(function(){
    return ASK(prompt + "\nIMPORTANT: fill each labelled line with real content — never repeat the instruction text.", sys)
      .then(function(r){ return parseIdeas(r); });
  })
  .then(function(ideas){
    el("ideas").className = "ideas on";
    el("ideas").innerHTML = ideas.slice(0, 5).map(function(x){
      return '<div class="idea"><svg class="i"><use href="#i-gift"/></svg><span>' + esc(String(x)) + '</span></div>';
    }).join("");
    el("sheetnote").textContent = "";
    haptic("success");
  })
  .catch(function(){ el("sheetnote").textContent = "The ideas didn't come through — tap again."; })
  .then(function(){ gb.disabled = false; gb.innerHTML = '<svg class="i"><use href="#i-gift"/></svg><span>Gift ideas</span>'; });
}

/* ---------- boot ---------- */
store().getItem("bdays").then(function(v){
  if (v){ try{ people = JSON.parse(v) || []; }catch(e){} }
  render();
});
</script>
