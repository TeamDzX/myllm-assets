<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Art Studio</title>
<style>
:root{
  color-scheme:light dark;
  --bg:var(--myllm-bg,#f2f2f7);--surface:var(--myllm-surface,#fff);
  --text:var(--myllm-text,#111);--muted:var(--myllm-muted,#6b6b72);
  --accent:var(--myllm-accent,#0b5ed7);--border:var(--myllm-border,rgba(120,120,128,.25));
  --radius:var(--myllm-radius,14px);--font:var(--myllm-font,-apple-system,system-ui,sans-serif);
}
@media(prefers-color-scheme:dark){:root{--bg:var(--myllm-bg,#000);--surface:var(--myllm-surface,#1c1c1e);--text:var(--myllm-text,#eee);--muted:var(--myllm-muted,#98989f)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);overflow-x:hidden}
.stage{display:flex;align-items:center;justify-content:center;padding:14px 14px 0}
canvas{width:100%;max-width:460px;border-radius:var(--radius);box-shadow:0 6px 24px rgba(0,0,0,.18);display:block}
.panel{max-width:460px;margin:0 auto;padding:12px 14px 28px}
.row{display:flex;gap:8px;margin-bottom:10px}
.modes{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.modes::-webkit-scrollbar{display:none}
button{font:inherit;cursor:pointer;border:0;border-radius:10px}
.chip{flex:none;padding:9px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--border);color:var(--muted);font-weight:600;font-size:14px}
.chip.on{background:var(--accent);color:#fff;border-color:transparent}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.03em}
input[type=range]{width:100%;accent-color:var(--accent)}
.pals{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.pals::-webkit-scrollbar{display:none}
.pal{flex:none;width:44px;height:28px;border-radius:8px;border:2px solid transparent;overflow:hidden;display:flex}
.pal.on{border-color:var(--text)}
.pal span{flex:1}
.actions{display:flex;gap:8px;margin-top:16px}
.actions button{flex:1;padding:13px;font-weight:700;font-size:15px}
.primary{background:var(--accent);color:#fff}
.ghost{background:var(--surface);border:1px solid var(--border);color:var(--text)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:rgba(0,0,0,.85);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:50}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="stage"><canvas id="c"></canvas></div>
<div class="panel">
  <div class="modes" id="modes"></div>
  <label>Density</label><input type="range" id="density" min="1" max="100" value="55">
  <label>Turbulence</label><input type="range" id="turb" min="1" max="100" value="40">
  <label>Stroke</label><input type="range" id="stroke" min="1" max="100" value="30">
  <label>Palette</label><div class="pals" id="pals"></div>
  <div class="actions">
    <button class="ghost" id="newBtn">↻ New</button>
    <button class="ghost" id="shareBtn">Share</button>
    <button class="primary" id="saveBtn">Save to Photos</button>
  </div>
</div>
<div id="toast"></div>
<script>
var cv=document.getElementById('c'),ctx=cv.getContext('2d');
var W=900,H=1125; // 4:5 portrait, hi-res for crisp export
cv.width=W;cv.height=H;
function haptic(k){if(window.myllmHaptic)try{myllmHaptic(k)}catch(e){}}
function toast(t){var e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(function(){e.classList.remove('show')},1600)}

var PALETTES=[
  ["#0b5ed7","#5ec8ff","#b388ff","#ffd166","#ffffff"],
  ["#ff6b6b","#ffd93d","#6bcB77","#4d96ff","#fff7e6"],
  ["#231942","#5e548e","#9f86c0","#be95c4","#e0b1cb"],
  ["#0d1b2a","#1b9aaa","#06d6a0","#ef476f","#ffd166"],
  ["#2b2d42","#8d99ae","#edf2f4","#ef233c","#d90429"],
  ["#03071e","#370617","#9d0208","#dc2f02","#ffba08"],
  ["#004b23","#38b000","#9ef01a","#ccff33","#ffffff"],
  ["#10002b","#3c096c","#7b2cbf","#c77dff","#e0aaff"]
];
var MODES=["Flow","Swarm","Bloom"];
var state={mode:0,pal:0,seed:1,density:55,turb:40,stroke:30};

// seeded PRNG
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
var rnd;
function field(x,y,t){ // smooth pseudo-noise angle field
  return Math.sin(x*0.9+t)+Math.cos(y*1.1-t*0.7)+Math.sin((x+y)*0.6+t*1.3);
}

function draw(){
  rnd=mulberry32(state.seed);
  var pal=PALETTES[state.pal];
  var dark=pal[0];
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle=dark;ctx.fillRect(0,0,W,H);
  ctx.lineCap='round';
  var d=state.density/100,turb=state.turb/100,sw=state.stroke/100;
  if(MODES[state.mode]==="Flow")drawFlow(pal,d,turb,sw);
  else if(MODES[state.mode]==="Swarm")drawSwarm(pal,d,turb,sw);
  else drawBloom(pal,d,turb,sw);
}

function pick(pal){return pal[1+Math.floor(rnd()*(pal.length-1))]}

function drawFlow(pal,d,turb,sw){
  ctx.globalCompositeOperation='lighter';
  var lines=Math.floor(120+d*900),steps=70,scale=turb*0.012+0.002;
  ctx.lineWidth=0.5+sw*3.5;ctx.globalAlpha=0.5;
  for(var i=0;i<lines;i++){
    var x=rnd()*W,y=rnd()*H;
    ctx.strokeStyle=pick(pal);ctx.beginPath();ctx.moveTo(x,y);
    for(var s=0;s<steps;s++){
      var a=field(x*scale,y*scale,state.seed*0.001)*Math.PI;
      x+=Math.cos(a)*6;y+=Math.sin(a)*6;
      if(x<0||x>W||y<0||y>H)break;
      ctx.lineTo(x,y);
    }
    ctx.stroke();
  }
  ctx.globalAlpha=1;
}

function drawSwarm(pal,d,turb,sw){
  ctx.globalCompositeOperation='lighter';
  var n=Math.floor(60+d*500),cx=W/2,cy=H/2;
  var attractors=[];for(var k=0;k<3;k++)attractors.push({x:rnd()*W,y:rnd()*H});
  ctx.lineWidth=0.4+sw*2.2;ctx.globalAlpha=0.45;
  for(var i=0;i<n;i++){
    var x=rnd()*W,y=rnd()*H,vx=0,vy=0;
    ctx.strokeStyle=pick(pal);ctx.beginPath();ctx.moveTo(x,y);
    for(var s=0;s<90;s++){
      var a=attractors[s%attractors.length];
      var dx=a.x-x,dy=a.y-y,dist=Math.sqrt(dx*dx+dy*dy)+0.01;
      vx+=(dx/dist)*(0.6+turb*2)+(rnd()-0.5)*turb*4;
      vy+=(dy/dist)*(0.6+turb*2)+(rnd()-0.5)*turb*4;
      vx*=0.92;vy*=0.92;x+=vx;y+=vy;
      ctx.lineTo(x,y);
    }
    ctx.stroke();
  }
  ctx.globalAlpha=1;
}

function drawBloom(pal,d,turb,sw){
  ctx.globalCompositeOperation='lighter';
  var cx=W/2,cy=H/2,sym=6+Math.floor(rnd()*10),petals=Math.floor(40+d*260);
  ctx.lineWidth=0.6+sw*3;ctx.globalAlpha=0.55;
  for(var i=0;i<petals;i++){
    var r=rnd()*Math.min(W,H)*0.46,ang=rnd()*Math.PI*2;
    var len=20+rnd()*(80+turb*260),wob=(rnd()-0.5)*turb*1.4;
    var col=pick(pal);
    for(var k=0;k<sym;k++){
      var a=ang+k*(Math.PI*2/sym);
      ctx.strokeStyle=col;ctx.beginPath();
      var x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;ctx.moveTo(x,y);
      ctx.quadraticCurveTo(
        cx+Math.cos(a+wob)*(r+len*0.5),cy+Math.sin(a+wob)*(r+len*0.5),
        cx+Math.cos(a)*(r+len),cy+Math.sin(a)*(r+len));
      ctx.stroke();
    }
  }
  ctx.globalAlpha=1;
}

function buildModes(){
  var m=document.getElementById('modes');m.innerHTML='';
  MODES.forEach(function(name,i){
    var b=document.createElement('button');b.className='chip'+(i===state.mode?' on':'');b.textContent=name;
    b.onclick=function(){state.mode=i;haptic('selection');buildModes();regen()};m.appendChild(b);
  });
}
function buildPals(){
  var p=document.getElementById('pals');p.innerHTML='';
  PALETTES.forEach(function(pal,i){
    var d=document.createElement('button');d.className='pal'+(i===state.pal?' on':'');
    pal.forEach(function(c){var s=document.createElement('span');s.style.background=c;d.appendChild(s)});
    d.onclick=function(){state.pal=i;haptic('selection');buildPals();draw();save()};p.appendChild(d);
  });
}
function regen(){state.seed=Math.floor(Math.random()*1e9);draw();save()}

['density','turb','stroke'].forEach(function(id){
  document.getElementById(id).oninput=function(){state[id==='turb'?'turb':id]=+this.value;draw()};
  document.getElementById(id).onchange=save;
});
document.getElementById('newBtn').onclick=function(){haptic('light');regen()};
document.getElementById('saveBtn').onclick=function(){
  haptic('success');
  if(!window.myllmSaveImage){toast('Update MyLLM to save to Photos');return}
  myllmSaveImage(cv.toDataURL('image/png')).then(function(){toast('Saved to Photos ✓')}).catch(function(){toast('Couldn’t save (check Photos permission)')});
};
document.getElementById('shareBtn').onclick=function(){
  haptic('light');
  if(window.myllmShare)myllmShare('Made with Art Studio in MyLLM');
};

function save(){if(window.myllmStorage)myllmStorage.setItem('art',JSON.stringify(state))}
function load(){
  if(!window.myllmStorage){draw();return}
  myllmStorage.getItem('art').then(function(v){
    if(v)try{var s=JSON.parse(v);for(var k in s)state[k]=s[k];
      document.getElementById('density').value=state.density;
      document.getElementById('turb').value=state.turb;
      document.getElementById('stroke').value=state.stroke;
    }catch(e){}
    buildModes();buildPals();draw();
  });
}
buildModes();buildPals();load();
</script>
</body>
</html>
