button{font:inherit;color:inherit;cursor:pointer;border:0;border-radius:12px}

button:disabled{opacity:.5}

.head{display:flex;align-items:center;gap:12px;margin:2px 2px 14px}
.tile{display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;

.stage{display:flex;justify-content:center}
canvas{width:100%;max-width:430px;aspect-ratio:3/4;border-radius:18px;box-shadow:0 6px 24px rgba(0,0,0,.18);display:block;touch-action:none}

.row{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:0 14px 2px}.row::-webkit-scrollbar{display:none}

.chip.on{background:hsl(var(--h) 60% 45%);color:#fff;border-color:transparent}
label{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--muted);margin:14px 2px 4px;text-transform:uppercase;letter-spacing:.07em}

.pal.on{border-color:var(--text)}.pal span{flex:1}
.hint{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;color:var(--muted);margin:12px 0 0}
.actions{display:flex;gap:8px;margin-top:12px}
.actions button{flex:1;min-height:46px;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px}
.primary{background:var(--accent);color:#fff}.ghost{background:var(--fill)}
.actions2{display:flex;gap:8px;margin-top:8px}
.actions2 button{flex:1;min-height:46px;font-weight:650;font-size:14px;background:var(--fill);display:flex;align-items:center;justify-content:center;gap:6px}

#ov.show{display:flex}
.spin{width:34px;height:34px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.recdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#ff3b30;margin-right:5px;animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:.2}}
#vrec{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:60;display:none;align-items:center;gap:2px;background:rgba(20,10,30,.92);color:#fff;padding:8px 15px;border-radius:999px;font-size:13px;font-weight:700;letter-spacing:.04em;box-shadow:0 6px 20px rgba(0,0,0,.45)}

/* Focus: MyLLM's bars go (myllmImmersive), the header and panel step aside,

.fbar{display:none}
body.focus{max-width:none;overflow:hidden;
  background:radial-gradient(120% 90% at 20% 10%,hsl(var(--h) 55% 22%),transparent 60%),radial-gradient(120% 90% at 85% 95%,hsl(calc(var(--h) + 60) 55% 18%),transparent 62%),#0b0b10}
body.focus .head,body.focus .panel{display:none}
body.focus .stage{position:fixed;inset:0;align-items:center;

    p.x+=p.vx;p.y+=p.vy;p.life--;
    var off=p.x<0||p.x>W||p.y<0||p.y>H||p.life<0;
    if(state.mode===2){
      // draw symmetric
      var cx=W/2,cy=H/2,rdx=p.px-cx,rdy=p.py-cy,ndx=p.x-cx,ndy=p.y-cy;
      ctx.strokeStyle=p.col;
      for(var k=0;k<sym;k++){var ang=k*2*Math.PI/sym,c=Math.cos(ang),s=Math.sin(ang);
        ctx.beginPath();ctx.moveTo(cx+rdx*c-rdy*s,cy+rdx*s+rdy*c);ctx.lineTo(cx+ndx*c-ndy*s,cy+ndx*s+ndy*c);ctx.stroke();
        ctx.beginPath();ctx.moveTo(cx+rdx*c+rdy*s,cy-rdx*s+rdy*c);ctx.lineTo(cx+ndx*c+ndy*s,cy-ndx*s+ndy*c);ctx.stroke();
      }
      if(off){var a2=rnd()*Math.PI*2,r2=rnd()*8;p.x=cx+Math.cos(a2)*r2;p.y=cy+Math.sin(a2)*r2;p.px=p.x;p.py=p.y;p.vx=0;p.vy=0;p.ang=a2;p.spd=0.6+rnd()*1.6;p.col=pick();p.life=40+rnd()*120}
    }else{
      ctx.strokeStyle=p.col;ctx.beginPath();ctx.moveTo(p.px,p.py);ctx.lineTo(p.x,p.y);ctx.stroke();
      if(off)newParticle(p);
    }
  }
  ctx.globalAlpha=1;
  if(recording)capture();
  raf=requestAnimationFrame(step);
}

// ---- free-form touch ----
function pos(e){var r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
cv.addEventListener('pointerdown',function(e){e.preventDefault();touch=pos(e);cv.setPointerCapture(e.pointerId);haptic('selection');inject()});
cv.addEventListener('pointermove',function(e){if(!touch)return;e.preventDefault();touch=pos(e);inject()});
function endT(){touch=null}
cv.addEventListener('pointerup',endT);cv.addEventListener('pointercancel',endT);cv.addEventListener('pointerleave',endT);
function inject(){ // spawn a few particles at the touch (paint)
  if(!touch)return;
  for(var i=0;i<4;i++){var p=newParticle();p.x=touch.x+(rnd()-0.5)*20;p.y=touch.y+(rnd()-0.5)*20;p.px=p.x;p.py=p.y;if(state.mode===2){p.x=W/2;p.y=H/2;p.ang=Math.atan2(touch.y-H/2,touch.x-W/2)+(rnd()-0.5)*0.4;p.spd=0.6+rnd()*1.6}parts.push(p)}
  if(parts.length>1400)parts.splice(0,parts.length-1400);
}

// ---- GIF recording ----
var gw=360,gh=480,gc=document.createElement('canvas');gc.width=gw;gc.height=gh;var gctx=gc.getContext('2d');
var recording=false,frames=[],tick=0,MAXF=28;
function capture(){tick++;if(tick%3!==0)return;gctx.drawImage(cv,0,0,gw,gh);frames.push(gctx.getImageData(0,0,gw,gh).data);if(frames.length>=MAXF){recording=false;encodeGIF()}}
function bytesB64(u8){var s='',CH=0x8000;for(var i=0;i<u8.length;i+=CH)s+=String.fromCharCode.apply(null,u8.subarray(i,i+CH));return btoa(s)}
function encodeGIF(){
  document.getElementById('ovT').textContent='Rendering GIF…';document.getElementById('ov').classList.add('show');
  setTimeout(function(){
    try{
      var enc=GIFLIB.GIFEncoder();
      for(var f=0;f<frames.length;f++){var rgba=frames[f];var pal=GIFLIB.quantize(rgba,256);var idx=GIFLIB.applyPalette(rgba,pal);enc.writeFrame(idx,gw,gh,{palette:pal,delay:70});}
      enc.finish();var url='data:image/gif;base64,'+bytesB64(enc.bytes());frames=[];
      if(window.myllmSaveImage)myllmSaveImage(url).then(function(){toast('GIF saved to Photos ✓')}).catch(function(){toast('Couldn’t save (Photos permission?)')});
      else toast('Update MyLLM to save');
    }catch(e){toast('GIF failed: '+e.message)}
    document.getElementById('ov').classList.remove('show');
    document.getElementById('gifBtn').innerHTML=ICO('film')+'Save GIF';
  },60);
}
document.getElementById('gifBtn').onclick=function(){
  if(recording)return;
  if(paused){togglePlay()}
  frames=[];tick=0;recording=true;haptic('medium');
  this.innerHTML='<span class="recdot"></span>Recording…';toast('Recording ~2 seconds…');
};

// ---- video clip recording (5/10/15s) → share as an mp4 via myllmShareFile ----
var vidRec=false;
function pickVideoMime(){var c=['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];for(var i=0;i<c.length;i++){try{if(MediaRecorder.isTypeSupported(c[i]))return c[i]}catch(e){}}return ''}
function videoSupported(){try{return !!(cv.captureStream&&typeof MediaRecorder!=='undefined'&&pickVideoMime())}catch(e){return false}}
function setVid(on){vidRec=on;document.getElementById('vrec').classList.toggle('show',on);
  var bs=document.querySelectorAll('#videoRow button');for(var i=0;i<bs.length;i++)bs[i].disabled=on;}
function fmtT(s){return '0:'+(s<10?'0':'')+s}
function recordVideo(secs){
  if(vidRec||recording)return;
  if(!window.myllmShareFile){toast('Sharing clips needs the latest MyLLM');return}
  if(paused)togglePlay();
  var mime=pickVideoMime(),strm;
  try{strm=cv.captureStream(30)}catch(e){toast('Video capture isn’t available here');return}
  var chunksV=[],mr;
  try{mr=mime?new MediaRecorder(strm,{mimeType:mime,videoBitsPerSecond:2600000}):new MediaRecorder(strm)}catch(e){toast('Recorder unavailable');return}
  mr.ondataavailable=function(e){if(e.data&&e.data.size)chunksV.push(e.data)};
  mr.onstop=function(){
    strm.getTracks().forEach(function(t){t.stop()});
    var m=(mr.mimeType||mime||'video/mp4').split(';')[0];
    document.getElementById('ovT').textContent='Preparing clip…';document.getElementById('ov').classList.add('show');
    var fr=new FileReader();
    fr.onload=function(){
      document.getElementById('ov').classList.remove('show');
      myllmShareFile(fr.result,{filename:'Art Studio clip',mime:m})
        .then(function(){toast('Clip ready — choose where to send it')})
        .catch(function(){toast('Couldn’t share the clip')});
    };
    fr.onerror=function(){document.getElementById('ov').classList.remove('show');toast('Couldn’t prepare the clip')};
    fr.readAsDataURL(new Blob(chunksV,{type:m}));
  };
  setVid(true);haptic('medium');mr.start();
  var left=secs;document.getElementById('vrecT').textContent=fmtT(left);
  var iv=setInterval(function(){left=Math.max(0,left-1);document.getElementById('vrecT').textContent=fmtT(left);},1000);
  setTimeout(function(){clearInterval(iv);try{mr.stop()}catch(e){}setVid(false);},secs*1000);
}
(function(){var bs=document.querySelectorAll('#videoRow button');for(var i=0;i<bs.length;i++){(function(b){b.onclick=function(){recordVideo(+b.getAttribute('data-s'))}})(bs[i]);}
  if(videoSupported()&&window.myllmShareFile){document.getElementById('videoRow').style.display='';document.getElementById('clipLbl').style.display='';}
})();

// ---- UI ----
function buildModes(){var m=document.getElementById('modes');m.innerHTML='';MODES.forEach(function(name,i){var b=document.createElement('button');b.className='chip'+(i===state.mode?' on':'');b.textContent=name;b.onclick=function(){state.mode=i;haptic('selection');buildModes();reseed();clearCanvas();save()};m.appendChild(b)})}
function buildPals(){var p=document.getElementById('pals');p.innerHTML='';PALETTES.forEach(function(pal,i){var d=document.createElement('button');d.className='pal'+(i===state.pal?' on':'');pal.forEach(function(c){var s=document.createElement('span');s.style.background=c;d.appendChild(s)});d.onclick=function(){state.pal=i;haptic('selection');buildPals();clearCanvas();save()};p.appendChild(d)})}
['density','speed','trail','stroke'].forEach(function(id){var el=document.getElementById(id);el.oninput=function(){state[id]=+this.value};el.onchange=save});
function togglePlay(){paused=!paused;syncPlay();if(!paused&&!raf)raf=requestAnimationFrame(step);if(paused&&raf){cancelAnimationFrame(raf);raf=null}haptic('selection')}
document.getElementById('playBtn').onclick=togglePlay;
document.getElementById('newBtn').onclick=function(){reseed();clearCanvas();save();haptic('light')};
document.getElementById('clearBtn').onclick=function(){clearCanvas();haptic('warning')};
document.getElementById('saveBtn').onclick=function(){haptic('success');if(!window.myllmSaveImage){toast('Update MyLLM to save');return}myllmSaveImage(cv.toDataURL('image/png')).then(function(){toast('Saved to Photos ✓')}).catch(function(){toast('Couldn’t save (Photos permission?)')})};

function save(){if(window.myllmStorage)myllmStorage.setItem('art',JSON.stringify(state))}
function load(){
  if(!window.myllmStorage){init();return}
  myllmStorage.getItem('art').then(function(v){
    if(v)try{var s=JSON.parse(v);for(var k in s)if(k in state)state[k]=s[k];
      ['density','speed','trail','stroke'].forEach(function(id){document.getElementById(id).value=state[id]});
    }catch(e){}
    init();
  });
}
function init(){buildModes();buildPals();clearCanvas();reseed();raf=requestAnimationFrame(step)}

/* ---------- focus ----------
   The canvas bitmap is a fixed 540×720; focus mode only changes its CSS size,
   so the running picture carries on untouched when MyLLM's bars go. */
function ICO(n){return '<svg class="i"><use href="#i-'+n+'"/></svg>'}
function syncPlay(){
  document.getElementById('playBtn').innerHTML=paused?ICO('play')+'Play':ICO('pause')+'Pause';
  var f=document.getElementById('fPlay');f.innerHTML=paused?ICO('play'):ICO('pause');f.setAttribute('aria-label',paused?'Play':'Pause');
}
var focusOn=false;
function syncChrome(){
  if(!window.myllmImmersive)return;
  try{myllmImmersive(focusOn,{keepAwake:false}).catch(function(){})}catch(e){}
}
function setFocus(on){
  if(on&&!window.myllmImmersive)return;
  focusOn=on;document.body.classList.toggle('focus',on);haptic('light');syncChrome();
}
function buildActs(){
  var a=document.getElementById('acts');
  if(!window.myllmImmersive||a.firstChild)return;
  var b=document.createElement('button');b.type='button';b.className='ib';b.innerHTML=ICO('expand');b.setAttribute('aria-label','Full screen');
  b.onclick=function(){setFocus(true)};a.appendChild(b);
}
document.getElementById('fNew').innerHTML=ICO('again');document.getElementById('fSave').innerHTML=ICO('photo');document.getElementById('fExit').innerHTML=ICO('shrink');
document.getElementById('fPlay').onclick=togglePlay;
document.getElementById('fNew').onclick=function(){document.getElementById('newBtn').click()};
document.getElementById('fSave').onclick=function(){document.getElementById('saveBtn').click()};
document.getElementById('fExit').onclick=function(){setFocus(false)};
document.addEventListener('visibilitychange',function(){if(!document.hidden&&focusOn)syncChrome()});   /* MyLLM restores its bars when the app is left */
syncPlay();buildActs();setTimeout(buildActs,600);setTimeout(buildActs,2500);   /* the bridge can arrive after this script */
load();
</script>
</body>
