<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>:root{color-scheme:light dark;--accent:#ff6600}
*{box-sizing:border-box}
body{font-family:-apple-system,system-ui,sans-serif;margin:0;padding:0;background:#f2f2f7;color:#111}
@media(prefers-color-scheme:dark){body{background:#000;color:#eee}.head{background:rgba(20,20,22,.92)}.item{background:#1c1c1e}.tab{color:#888}}
.head{position:sticky;top:0;background:rgba(242,242,247,.92);backdrop-filter:saturate(180%) blur(12px);padding:14px 16px 0;z-index:5}
h1{font-size:20px;margin:0 0 8px}
.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:10px}
.tab{flex:none;padding:7px 14px;border-radius:18px;background:none;color:#777;font-size:14px;font-weight:600;border:0;white-space:nowrap}
.tab.on{background:var(--accent);color:#fff}
.wrap{padding:6px 16px 24px}
.item{background:#fff;border-radius:13px;padding:12px 14px;margin-bottom:9px;box-shadow:0 1px 3px rgba(0,0,0,.07);display:flex;gap:11px;align-items:flex-start}
.rank{font-size:15px;font-weight:700;color:var(--accent);opacity:.55;min-width:20px;text-align:right}
.it-body{flex:1;min-width:0}
.title{font-size:15.5px;font-weight:600;line-height:1.32}
.title a{color:inherit;text-decoration:none}
.dom{font-size:12px;opacity:.5}
.meta{font-size:12.5px;opacity:.7;margin-top:5px}
.meta a{color:var(--accent);font-weight:600;text-decoration:none}
#status{padding:16px;text-align:center;font-size:14px;opacity:.7}
</style></head><body>
<div class="head"><h1>🟠 Hacker News</h1><div class="tabs" id="tabs"></div></div>
<div id="status"></div>
<div class="wrap" id="wrap"></div>
<script>
var store=window.myllmStorage||{getItem:function(){return Promise.resolve(null)},setItem:function(){return Promise.resolve()}};
var FEEDS=[['Top','topstories'],['Best','beststories'],['New','newstories'],['Ask','askstories'],['Show','showstories']];
var active=0,cache={};
function el(i){return document.getElementById(i)}
function setStatus(t){var s=el('status');s.style.display=t?'block':'none';s.textContent=t||''}
function api(p){return 'https://hacker-news.firebaseio.com/v0/'+p+'.json'}
function ago(t){var s=Math.floor(Date.now()/1000)-t;if(s<3600)return Math.max(1,Math.round(s/60))+'m';if(s<86400)return Math.round(s/3600)+'h';return Math.round(s/86400)+'d'}
function domain(u){try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return''}}

function renderTabs(){var T=el('tabs');T.innerHTML='';FEEDS.forEach(function(f,i){var b=document.createElement('button');b.className='tab'+(i===active?' on':'');b.textContent=f[0];b.onclick=function(){active=i;load()};T.appendChild(b)})}

function load(){
  renderTabs();el('wrap').innerHTML='';
  var feed=FEEDS[active][1];
  if(cache[feed]){render(cache[feed]);return}
  if(!window.myllmFetch){setStatus('This app needs network access — enable it in Settings.');return}
  setStatus('Loading stories…');
  myllmFetch(api(feed)).then(function(r){
    if(!r||!r.ok)throw new Error('HTTP '+((r&&r.status)||'?'));
    var ids=JSON.parse(r.body).slice(0,24);
    return Promise.all(ids.map(function(id){
      return myllmFetch(api('item/'+id)).then(function(x){return x&&x.ok?JSON.parse(x.body):null}).catch(function(){return null});
    }));
  }).then(function(items){
    items=items.filter(function(it){return it&&it.title});
    cache[feed]=items;setStatus('');render(items);
  }).catch(function(e){setStatus('Couldn’t load Hacker News: '+e.message)});
}

function render(items){
  var W=el('wrap');W.innerHTML='';
  items.forEach(function(it,i){
    var url=it.url||('https://news.ycombinator.com/item?id='+it.id);
    var dom=it.url?domain(it.url):'news.ycombinator.com';
    var c=document.createElement('div');c.className='item';
    c.innerHTML='<div class="rank">'+(i+1)+'</div><div class="it-body">'+
      '<div class="title"><a href="'+url+'" target="_top" rel="noopener">'+esc(it.title)+'</a></div>'+
      '<div class="dom">'+esc(dom)+'</div>'+
      '<div class="meta">▲ '+(it.score||0)+' · by '+esc(it.by||'?')+' · '+ago(it.time)+' ago · '+
        '<a href="https://news.ycombinator.com/item?id='+it.id+'" target="_top" rel="noopener">💬 '+(it.descendants||0)+'</a></div>'+
      '</div>';
    W.appendChild(c);
  });
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
renderTabs();load();
</script></body></html>
