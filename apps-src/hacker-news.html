--><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hacker News</title>
<style>:root{--build-id:"0b62e14fc8";color-scheme:light dark;
  --bg:var(--myllm-bg,#f2f2f7); --surface:var(--myllm-surface,#fff); --ink:var(--myllm-text,#111);
  --muted:var(--myllm-muted,#8a8a8e); --line:var(--myllm-border,#e3e3e8); --acc:var(--myllm-accent,#0a84ff);
  --fill:rgba(120,120,128,.12); --h:22; }
@media (prefers-color-scheme:dark){ :root{ --bg:var(--myllm-bg,#000); --surface:var(--myllm-surface,#1c1c1e);
  --ink:var(--myllm-text,#f2f2f7); --muted:var(--myllm-muted,#8e8e93); --line:var(--myllm-border,#2c2c2e); --fill:rgba(120,120,128,.24); } }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ font-family:var(--myllm-font,-apple-system,system-ui,sans-serif); background:var(--bg); color:var(--ink);
    max-width:600px; margin:0 auto; min-height:100dvh; font-size:15.5px; line-height:1.4;
    padding:calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(30px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left)); }
  @media (min-width:768px){ body{ max-width:760px; } }
  svg.i{ width:1.25em; height:1.25em; fill:currentColor; flex-shrink:0; }
  button{ font:inherit; color:inherit; cursor:pointer; } button:active{ transform:scale(.96); }
  [hidden]{ display:none !important; }

  .head{ display:flex; align-items:center; gap:12px; margin:2px 2px 6px; }
  .tile{ display:flex; align-items:center; justify-content:center; color:#fff; flex-shrink:0;
    background:linear-gradient(145deg, hsl(var(--h) 62% 50%), hsl(calc(var(--h) + 40) 58% 28%)); }
  .head .tile{ width:44px; height:44px; border-radius:13px; font-size:19px; }
  .head .ht{ flex:1; min-width:0; }
  h1{ font-size:22px; font-weight:800; letter-spacing:-.01em; }
  .head p{ font-size:13px; color:var(--muted); margin-top:1px; }
  .head .acts{ display:flex; gap:8px; flex-shrink:0; }
  .ib{ width:40px; height:40px; border-radius:12px; border:1px solid var(--line); background:var(--surface); display:flex; align-items:center; justify-content:center; font-size:17px; }
  .ib.busy svg{ animation:spin .8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* the tab chips stay put while the list scrolls; the header scrolls away */
  .stick{ position:sticky; top:0; z-index:5; margin:0 calc(-16px - env(safe-area-inset-right)) 4px calc(-16px - env(safe-area-inset-left));
    padding:8px calc(16px + env(safe-area-inset-right)) 10px calc(16px + env(safe-area-inset-left));
    background:color-mix(in srgb, var(--bg) 90%, transparent); -webkit-backdrop-filter:saturate(180%) blur(12px); backdrop-filter:saturate(180%) blur(12px); }
  .chips{ display:flex; gap:7px; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  .chips::-webkit-scrollbar{ display:none; }
  .chip{ flex:0 0 auto; min-height:36px; border:1px solid var(--line); background:var(--surface); border-radius:99px; padding:0 15px; font-size:14px; font-weight:650; white-space:nowrap; }
  .chip.hot{ background:var(--acc); border-color:var(--acc); color:#fff; }

  .item{ display:flex; gap:12px; align-items:flex-start; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:12px 14px; margin-bottom:8px; }
  .rank{ flex-shrink:0; min-width:24px; text-align:right; font-size:15px; font-weight:800; font-variant-numeric:tabular-nums; color:hsl(var(--h) 80% 48%); padding-top:1px; }
  .body{ flex:1; min-width:0; }
  .title{ font-size:16px; font-weight:650; line-height:1.32; overflow-wrap:anywhere; }
  .title a{ color:inherit; text-decoration:none; }
  .dom{ font-size:12.5px; color:var(--muted); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .meta{ display:flex; align-items:center; flex-wrap:wrap; gap:4px 12px; margin-top:7px; font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .meta span, .meta a{ display:inline-flex; align-items:center; gap:4px; }
  .meta svg.i{ width:1.05em; height:1.05em; }
  .meta .pts{ color:hsl(var(--h) 80% 46%); font-weight:700; }
  .meta a{ margin-left:auto; min-height:32px; padding:0 10px; border-radius:99px; background:var(--fill); color:var(--ink); font-weight:650; text-decoration:none; }

  .sk{ background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:8px; }
  .sk i{ display:block; height:12px; border-radius:6px; background:var(--fill); margin-bottom:9px; animation:pulse 1.3s ease-in-out infinite; }
  .sk i:nth-child(2){ width:80%; } .sk i:last-child{ width:40%; margin-bottom:0; }
  @keyframes pulse{ 50%{ opacity:.45; } }

  .notice{ display:flex; gap:12px; align-items:flex-start; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px; margin:4px 0 12px; }
  .notice .tile{ width:36px; height:36px; border-radius:10px; font-size:15px; }
  .notice.err .tile{ background:linear-gradient(145deg,#ff6b5f,#c0392b); }
  .notice.off .tile{ background:linear-gradient(145deg,#8e8e93,#48484a); }
  .notice b{ display:block; font-size:15px; font-weight:750; }
  .notice p{ font-size:13.5px; color:var(--muted); margin-top:2px; line-height:1.45; }
  .notice button{ margin-top:10px; min-height:36px; padding:0 14px; border-radius:10px; border:0; background:var(--acc); color:#fff; font-weight:700; font-size:13.5px; display:inline-flex; align-items:center; gap:6px; }

  @media (prefers-reduced-motion:reduce){ .sk i, .ib.busy svg{ animation:none; } button:active{ transform:none; } }
</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-news" viewBox="0 0 24 24"><path d="M4 4.5A1.5 1.5 0 0 1 5.5 3h10A1.5 1.5 0 0 1 17 4.5V8h2.5A1.5 1.5 0 0 1 21 9.5V18a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3zM17 10v8a1 1 0 0 0 2 0v-8zM7 6.5a.75.75 0 0 0 0 1.5h7a.75.75 0 0 0 0-1.5zm0 4a.75.75 0 0 0-.75.75v3.5c0 .4.35.75.75.75h3.5c.4 0 .75-.35.75-.75v-3.5a.75.75 0 0 0-.75-.75zm6.25 0a.75.75 0 0 0 0 1.5H14a.75.75 0 0 0 0-1.5zm0 3.5a.75.75 0 0 0 0 1.5H14a.75.75 0 0 0 0-1.5zM7 17a.75.75 0 0 0 0 1.5h7a.75.75 0 0 0 0-1.5z"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 5.5l7 10.5H5z"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M5 4h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-6.6L8 20.6a.6.6 0 0 1-1-.45V17H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><path d="M12 2.8a9.2 9.2 0 1 1 0 18.4 9.2 9.2 0 0 1 0-18.4zm0 2a7.2 7.2 0 1 0 0 14.4 7.2 7.2 0 0 0 0-14.4zM12 7a1 1 0 0 1 1 1v3.6l2.4 1.4a1 1 0 1 1-1 1.7l-2.9-1.7A1 1 0 0 1 11 12V8a1 1 0 0 1 1-1z"/></symbol>
  <symbol id="i-person" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4.2"/><path d="M4 20.2c0-4.1 3.6-6.6 8-6.6s8 2.5 8 6.6a.8.8 0 0 1-.8.8H4.8a.8.8 0 0 1-.8-.8z"/></symbol>
  <symbol id="i-off" viewBox="0 0 24 24"><path d="M3.3 3.3a1 1 0 0 1 1.4 0l16 16a1 1 0 0 1-1.4 1.4l-3.5-3.5a2 2 0 1 1-2.5-2.5L10.8 12a5 5 0 0 0-3.4 1.6 1 1 0 0 1-1.5-1.3 7 7 0 0 1 3.1-2L7 8.4a10 10 0 0 0-3.2 2.2 1 1 0 0 1-1.4-1.4A12 12 0 0 1 5.6 7L3.3 4.7a1 1 0 0 1 0-1.4zM12 6c3.5 0 6.8 1.4 9.2 3.8a1 1 0 0 1-1.4 1.4A11 11 0 0 0 12 8h-.6L9.6 6.2C10.4 6.1 11.2 6 12 6z"/></symbol>
  <symbol id="i-warn" viewBox="0 0 24 24"><path d="M10.3 3.9a2 2 0 0 1 3.4 0l8 13.6a2 2 0 0 1-1.7 3H4a2 2 0 0 1-1.7-3zM12 9a1 1 0 0 0-1 1v4a1 1 0 0 0 2 0v-4a1 1 0 0 0-1-1zm0 7.2a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4z"/></symbol>
</defs></svg>

<div class="head">
  <div class="tile"><svg class="i"><use href="#i-news"/></svg></div>
  <div class="ht"><h1>Hacker News</h1><p>Tech news, ranked</p></div>
  <div class="acts"><button class="ib" id="refresh" type="button" aria-label="Refresh"><svg class="i"><use href="#i-refresh"/></svg></button></div>
</div>
<div class="stick"><div class="chips" id="tabs"></div></div>
<div id="status"></div>
<div id="wrap"></div>

<script>
var FEEDS=[['Top','topstories'],['Best','beststories'],['New','newstories'],['Ask','askstories'],['Show','showstories']];
var active=0,cache={},loading=false;
function el(i){return document.getElementById(i)}
function icon(n){return '<svg class="i"><use href="#i-'+n+'"/></svg>'}
/* Bridges are looked up when used, never kept: MyLLM can add them after this
   script has run. */
function net(){return window.myllmFetch||null}
function haptic(k){if(window.myllmHaptic)try{myllmHaptic(k)}catch(e){}}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function api(p){return 'https://hacker-news.firebaseio.com/v0/'+p+'.json'}
function ago(t){var s=Math.floor(Date.now()/1000)-t;if(s<3600)return Math.max(1,Math.round(s/60))+'m';if(s<86400)return Math.round(s/3600)+'h';return Math.round(s/86400)+'d'}
function domain(u){try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return''}}

function notice(kind,title,text,retry){
  var S=el('status');
  S.innerHTML='<div class="notice '+kind+'"><div class="tile">'+icon(kind==='off'?'off':'warn')+'</div><div><b>'+esc(title)+'</b><p>'+esc(text)+'</p>'+
    (retry?'<button type="button">'+icon('refresh')+'Try again</button>':'')+'</div></div>';
  if(retry)S.querySelector('button').onclick=retry;
}
function skeleton(){var h='';for(var i=0;i<6;i++)h+='<div class="sk"><i></i><i></i><i></i></div>';el('wrap').innerHTML=h}
function busy(on){loading=on;el('refresh').classList.toggle('busy',on)}

function renderTabs(){var T=el('tabs');T.innerHTML='';FEEDS.forEach(function(f,i){var b=document.createElement('button');b.type='button';b.className='chip'+(i===active?' hot':'');b.textContent=f[0];b.onclick=function(){if(active===i)return;active=i;haptic('selection');load()};T.appendChild(b)})}

function load(){
  renderTabs();el('status').innerHTML='';
  var feed=FEEDS[active][1];
  if(cache[feed]){render(cache[feed]);return}
  if(!net()){el('wrap').innerHTML='';notice('off','Network access is off','Hacker News needs “Allow apps to use the internet” in MyLLM’s Settings.',load);return}
  skeleton();busy(true);
  net()(api(feed)).then(function(r){
    if(!r||!r.ok)throw new Error('HTTP '+((r&&r.status)||'?'));
    var ids=JSON.parse(r.body).slice(0,24);
    return Promise.all(ids.map(function(id){
      return net()(api('item/'+id)).then(function(x){return x&&x.ok?JSON.parse(x.body):null}).catch(function(){return null});
    }));
  }).then(function(items){
    items=items.filter(function(it){return it&&it.title});
    cache[feed]=items;
    if(FEEDS[active][1]===feed)render(items);
  }).catch(function(e){
    if(FEEDS[active][1]!==feed)return;
    el('wrap').innerHTML='';notice('err','Couldn’t load Hacker News',e.message,load);
  }).then(function(){busy(false)});
}

function render(items){
  var W=el('wrap');W.innerHTML='';
  if(!items.length){notice('err','Nothing here right now','The list came back empty.',refresh);return}
  items.forEach(function(it,i){
    var url=it.url||('https://news.ycombinator.com/item?id='+it.id);
    var dom=it.url?domain(it.url):'news.ycombinator.com';
    var c=document.createElement('div');c.className='item';
    c.innerHTML='<div class="rank">'+(i+1)+'</div><div class="body">'+
      '<div class="title"><a href="'+esc(url)+'" target="_top" rel="noopener">'+esc(it.title)+'</a></div>'+
      '<div class="dom">'+esc(dom)+'</div>'+
      '<div class="meta"><span class="pts">'+icon('up')+(it.score||0)+'</span><span>'+icon('person')+esc(it.by||'?')+'</span><span>'+icon('clock')+ago(it.time)+'</span>'+
        '<a href="https://news.ycombinator.com/item?id='+it.id+'" target="_top" rel="noopener" aria-label="Comments">'+icon('chat')+(it.descendants||0)+'</a></div>'+
      '</div>';
    W.appendChild(c);
  });
}
function refresh(){if(loading)return;haptic('light');delete cache[FEEDS[active][1]];load()}
el('refresh').onclick=refresh;
renderTabs();load();
</script></body></html>
