<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mini Browser</title>
<style>
:root{
  color-scheme:light dark;
  --bg:var(--myllm-bg,#f2f2f7);--surface:var(--myllm-surface,#fff);
  --text:var(--myllm-text,#111);--muted:var(--myllm-muted,#6b6b72);
  --accent:var(--myllm-accent,#0b5ed7);--border:var(--myllm-border,rgba(120,120,128,.25));
  --radius:var(--myllm-radius,12px);--font:var(--myllm-font,-apple-system,system-ui,sans-serif);
}
@media(prefers-color-scheme:dark){:root{--bg:var(--myllm-bg,#000);--surface:var(--myllm-surface,#1c1c1e);--text:var(--myllm-text,#eee);--muted:var(--myllm-muted,#98989f)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);display:flex;flex-direction:column}
.bar{display:flex;gap:6px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--border);background:var(--bg)}
.nav{display:flex;gap:2px}
.icon{width:34px;height:34px;border:0;background:none;color:var(--accent);font-size:17px;border-radius:8px;cursor:pointer;flex:none}
.icon:disabled{opacity:.3}
#url{flex:1;min-width:0;padding:9px 12px;border:1px solid var(--border);border-radius:999px;font:inherit;font-size:15px;background:var(--surface);color:var(--text)}
#go{border:0;background:var(--accent);color:#fff;border-radius:999px;padding:0 15px;height:34px;font:inherit;font-weight:600;cursor:pointer;flex:none}
.tools{display:flex;gap:4px;padding:5px 10px;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}.tools::-webkit-scrollbar{display:none}
.tools button{flex:none;border:0;background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:7px 11px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.tools button.on{color:var(--accent);border-color:var(--accent)}
#frame{flex:1;width:100%;border:0;background:#fff}
#start{flex:1;overflow:auto;padding:22px 18px 30px}
#status{display:none;position:absolute;left:0;right:0;top:92px;text-align:center;color:var(--muted);font-size:14px;padding:14px;background:var(--bg)}
.sec{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:18px 2px 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:13px;cursor:pointer}
.tile b{font-size:14px}.tile span{font-size:12px;color:var(--muted);word-break:break-all}
.list .row{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:7px;cursor:pointer}
.list .row .t{flex:1;min-width:0}
.list .row .t b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .row .t span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.list .row .x{color:var(--muted);font-size:16px;padding:4px}
.empty{color:var(--muted);font-size:14px;padding:4px 2px}
.note{color:var(--muted);font-size:12px;line-height:1.5;margin-top:22px;border-top:1px solid var(--border);padding-top:14px}
</style>
</head>
<body>
<div class="bar">
  <div class="nav">
    <button class="icon" id="back" title="Back">‹</button>
    <button class="icon" id="fwd" title="Forward">›</button>
  </div>
  <input id="url" placeholder="Search or enter address" enterkeyhint="go" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" inputmode="url">
  <button id="go">Go</button>
</div>
<div class="tools">
  <button id="reload">⟳ Reload</button>
  <button id="home">⌂ Home</button>
  <button id="star">☆ Bookmark</button>
  <button id="safari">↗ Open in Safari</button>
</div>
<iframe id="frame" title="page" style="display:none"></iframe>
<div id="start"></div>
<div id="status"></div>
<script>
var QUICK=[
  {name:"Wikipedia",url:"https://en.wikipedia.org/wiki/Main_Page"},
  {name:"Hacker News",url:"https://news.ycombinator.com/"},
  {name:"CNN Lite",url:"https://lite.cnn.com/"},
  {name:"BBC News",url:"https://www.bbc.com/news"},
  {name:"MDN Web Docs",url:"https://developer.mozilla.org/"},
  {name:"Old Reddit",url:"https://old.reddit.com/"}
];
var hist=[],hi=-1,curUrl="",curTitle="",bookmarks=[],recents=[];
var frame=document.getElementById('frame');
function $(i){return document.getElementById(i)}
function haptic(k){if(window.myllmHaptic)try{myllmHaptic(k)}catch(e){}}
function status(t){var s=$('status');s.style.display=t?'block':'none';s.textContent=t||''}

function normalize(input){
  var s=(input||'').trim();if(!s)return null;
  // search if it has a space, or no dot and isn't localhost
  if(/\s/.test(s)||(!/\./.test(s)&&!/^localhost/i.test(s))) return 'https://html.duckduckgo.com/html/?q='+encodeURIComponent(s);
  if(!/^https?:\/\//i.test(s)) s='https://'+s;
  return s;
}
function host(u){try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return u}}

function sanitize(html,baseUrl){
  var doc=new DOMParser().parseFromString(html,'text/html');
  var title=(doc.querySelector('title')&&doc.querySelector('title').textContent.trim())||host(baseUrl);
  // Remove anything that could run code or hijack navigation. Scripts are
  // stripped so a fetched page can never reach the native bridges.
  Array.prototype.forEach.call(doc.querySelectorAll('script,noscript,template'),function(n){n.remove()});
  Array.prototype.forEach.call(doc.querySelectorAll('meta[http-equiv]'),function(n){var v=(n.getAttribute('http-equiv')||'').toLowerCase();if(v==='content-security-policy'||v==='refresh')n.remove()});
  Array.prototype.forEach.call(doc.querySelectorAll('*'),function(el){
    for(var i=el.attributes.length-1;i>=0;i--){
      var a=el.attributes[i],n=a.name.toLowerCase();
      if(n.indexOf('on')===0)el.removeAttribute(a.name);
      else if((n==='href'||n==='src'||n==='xlink:href')&&/^\s*javascript:/i.test(a.value))el.removeAttribute(a.name);
    }
  });
  var head=doc.head||doc.documentElement;
  Array.prototype.forEach.call(doc.querySelectorAll('base'),function(b){b.remove()});
  var base=doc.createElement('base');base.setAttribute('href',baseUrl);head.insertBefore(base,head.firstChild);
  return {html:'<!doctype html>'+doc.documentElement.outerHTML,title:title};
}

function hookLinks(){
  var d;try{d=frame.contentDocument}catch(e){return}if(!d)return;
  d.addEventListener('click',function(e){
    var el=e.target;while(el&&el.tagName!=='A')el=el.parentElement;
    if(!el)return;var href=el.href||'';
    if(/^https?:/i.test(href)){e.preventDefault();haptic('selection');navigate(href,true)}
  },true);
}

function navigate(input,push){
  var url=/^https?:\/\//i.test(input)?input:normalize(input);
  if(!url)return;
  if(!window.myllmFetch){status('This browser needs network access — update MyLLM and turn on “Allow apps to use the network” in Settings → MyLLMos Apps.');return}
  $('start').style.display='none';frame.style.display='block';
  status('Loading '+host(url)+'…');haptic('light');
  myllmFetch(url,{headers:{Accept:'text/html,application/xhtml+xml'}})
    .then(function(r){
      if(!r||!r.ok)throw new Error('the site returned '+((r&&r.status)||'no response'));
      var ct='';try{for(var k in r.headers){if(k.toLowerCase()==='content-type')ct=(''+r.headers[k]).toLowerCase()}}catch(e){}
      if(ct&&ct.indexOf('html')===-1&&ct.indexOf('xml')===-1){
        status('This isn’t a web page ('+ct.split(';')[0]+'). Tap ↗ Open in Safari to view it.');
        curUrl=url;$('url').value=url;return;
      }
      var s=sanitize(r.body||'',url);
      var d=frame.contentDocument||frame.contentWindow.document;
      d.open();d.write(s.html);d.close();
      hookLinks();
      curUrl=url;curTitle=s.title;$('url').value=url;status('');
      updateStar();
      if(push){hist=hist.slice(0,hi+1);hist.push(url);hi=hist.length-1}
      addRecent(url,s.title);updateNav();
      try{frame.contentWindow.scrollTo(0,0)}catch(e){}
    })
    .catch(function(e){status('Couldn’t load this page: '+e.message)});
}
function updateNav(){$('back').disabled=hi<=0;$('fwd').disabled=hi>=hist.length-1}

$('go').onclick=function(){navigate($('url').value,true)};
$('url').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();navigate($('url').value,true);this.blur()}});
$('back').onclick=function(){if(hi>0){hi--;haptic('selection');navigate(hist[hi],false)}};
$('fwd').onclick=function(){if(hi<hist.length-1){hi++;haptic('selection');navigate(hist[hi],false)}};
$('reload').onclick=function(){if(curUrl){haptic('light');navigate(curUrl,false)}};
$('home').onclick=function(){haptic('selection');frame.style.display='none';status('');$('start').style.display='block';renderStart()};
$('safari').onclick=function(){var u=curUrl||normalize($('url').value);if(u&&window.open){haptic('light');window.open(u,'_blank')}};
$('star').onclick=function(){
  if(!curUrl)return;haptic('success');
  var i=bookmarks.findIndex(function(b){return b.url===curUrl});
  if(i>=0)bookmarks.splice(i,1);else bookmarks.unshift({url:curUrl,title:curTitle||host(curUrl)});
  save();updateStar();
};
function updateStar(){var on=bookmarks.some(function(b){return b.url===curUrl});$('star').textContent=on?'★ Saved':'☆ Bookmark';$('star').classList.toggle('on',on)}

function addRecent(url,title){
  recents=recents.filter(function(r){return r.url!==url});
  recents.unshift({url:url,title:title||host(url)});
  if(recents.length>20)recents.length=20;save();
}

function renderStart(){
  var h='<div class="sec">Quick links</div><div class="grid">';
  QUICK.forEach(function(q){h+='<div class="tile" data-u="'+enc(q.url)+'"><b>'+enc(q.name)+'</b><span>'+enc(host(q.url))+'</span></div>'});
  h+='</div>';
  h+='<div class="sec">Bookmarks</div><div class="list" id="bm">';
  if(!bookmarks.length)h+='<div class="empty">Tap ☆ on a page to save it here.</div>';
  bookmarks.forEach(function(b,i){h+=row(b,i,'bm')});
  h+='</div>';
  h+='<div class="sec">Recent</div><div class="list" id="rc">';
  if(!recents.length)h+='<div class="empty">Pages you visit will appear here.</div>';
  recents.slice(0,12).forEach(function(b,i){h+=row(b,i,'rc')});
  h+='</div>';
  h+='<div class="note">Pages open as fast, private, read-only snapshots — perfect for articles, wikis, news and docs. Logins and interactive web apps won’t work here; tap ↗ Open in Safari for those.</div>';
  $('start').innerHTML=h;
  Array.prototype.forEach.call($('start').querySelectorAll('.tile'),function(t){t.onclick=function(){navigate(t.getAttribute('data-u'),true)}});
  wireRows('bm',bookmarks);wireRows('rc',recents);
}
function row(b,i,kind){return '<div class="row" data-i="'+i+'" data-k="'+kind+'"><div class="t"><b>'+enc(b.title||host(b.url))+'</b><span>'+enc(host(b.url))+'</span></div>'+(kind==='bm'?'<span class="x" data-del="'+i+'">✕</span>':'')+'</div>'}
function wireRows(kind,arr){
  var box=$(kind);if(!box)return;
  Array.prototype.forEach.call(box.querySelectorAll('.row'),function(r){
    r.onclick=function(e){if(e.target.hasAttribute('data-del')){arr.splice(+e.target.getAttribute('data-del'),1);save();renderStart();return}navigate(arr[+r.getAttribute('data-i')].url,true)};
  });
}
function enc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function save(){if(window.myllmStorage)myllmStorage.setItem('browser',JSON.stringify({bookmarks:bookmarks,recents:recents}))}
function load(){
  if(!window.myllmStorage){renderStart();return}
  myllmStorage.getItem('browser').then(function(v){
    if(v)try{var s=JSON.parse(v);bookmarks=s.bookmarks||[];recents=s.recents||[]}catch(e){}
    renderStart();
  });
}
updateNav();load();
</script>
</body>
</html>
