<script>

<script>
function el(i){ return document.getElementById(i); }
/* Bridges are looked up when used, never kept: MyLLM can add them after this
   script has run. */
function haptic(k){ if (window.myllmHaptic) try { myllmHaptic(k || "light"); } catch(_){} }
function load(k){ var s = window.myllmStorage; if (!s) return Promise.resolve(null); try { return s.getItem(k).catch(function(){ return null; }); } catch(_){ return Promise.resolve(null); } }
function keep(k, v){ var s = window.myllmStorage; if (s) try { s.setItem(k, v).catch(function(){}); } catch(_){} }
function esc(s){ return (s + "").replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function icon(n){ return '<svg><use href="#i-' + n + '"/></svg>'; }
function emptyState(glyph, text, action, target){
  return '<div class="empty"><div class="tile">' + icon(glyph) + '</div><p>' + text + '</p>' +
    (action ? '<button class="btn sec" data-focus="' + target + '">' + icon("plus") + action + '</button>' : '') + '</div>';
}
document.addEventListener("click", function(e){
  var b = e.target.closest && e.target.closest("[data-focus]");
  if (b){ var f = el(b.getAttribute("data-focus")); if (f){ f.focus(); f.scrollIntoView({block:"center", behavior:"smooth"}); } }
});
var items = [], busy = false;
function save(){ keep("items", JSON.stringify(items)); }
var seed = 1234;
/* Ids come from a generator that restarts with the app, so a new item could be
   handed an id an older one already has — and deleting one then took both. */
function uid(){ var id; do { seed = (seed * 9301 + 49297) % 233280; id = "t" + seed + (items.length); } while (items.some(function(x){ return x.id === id; })); return id; }
function mendIds(){ var seen = {}; items.forEach(function(x, i){ if (!x.id || seen[x.id]) x.id = "t" + i + "m" + Math.floor(Math.random() * 1e6); seen[x.id] = 1; }); }

/* Labelled lines, not JSON — small models (Apple Intelligence) echo JSON
   templates back verbatim. Echoed instructions are rejected and retried. */
var ECHO=/what needs to be done|who is responsible|when it is due|repeat this line|labelled line|leave blank/i;
function cleanField(v){v=(v==null?'':String(v)).trim();return /^(none|n\/a|na|-|–|unknown|tbd)$/i.test(v)?'':v}
function parseItems(reply){
  var out=[],got=false;
  String(reply||'').split(/\r?\n/).forEach(function(raw){
    var ln=raw.replace(/\*\*/g,'').trim();
    var m=ln.match(/^[-*#>\s]*(ITEMS?|TASKS?|ACTIONS?)\s*\d*\s*[:：]\s*(.*)$/i);
    if(!m)return;
    got=true;
    var parts=m[2].split('|').map(function(p){return p.trim()});
    var task=parts[0]||'',owner=cleanField(parts[1]),due=cleanField(parts[2]);
    if(!task||ECHO.test(task)||ECHO.test(owner)||ECHO.test(due))return;
    out.push({task:task,owner:owner,due:due});
  });
  if(!got){ // model answered in the old JSON shape — accept it
    var s=reply.indexOf('['),e=reply.lastIndexOf(']');
    if(s>=0&&e>s)try{
      JSON.parse(reply.slice(s,e+1)).forEach(function(x){
        if(x&&x.task)out.push({task:String(x.task),owner:cleanField(x.owner),due:cleanField(x.due)});
      });
    }catch(e2){}
  }
  if(!out.length)throw new Error('no action items came back');
  return out;
}
function say(t){ el("status").textContent = t || ""; }
function alertBox(kind, text, retry){
  var a = el("alert");
  if (!text){ a.innerHTML = ""; return; }
  a.innerHTML = '<div class="alert' + (kind === "info" ? " info" : "") + '">' + icon(kind === "info" ? "info" : "warn") + '<div>' + esc(text) + '</div>' +
    (retry ? '<button id="retry">Try again</button>' : '') + '</div>';
  if (retry) el("retry").onclick = extract;
}
function setBusy(on){
  busy = on; var b = el("ext"); b.disabled = on;
  b.innerHTML = on ? '<i class="spin"></i><span>Reading the notes…</span>' : icon("spark") + '<span>Extract action items</span>';
  render();
}
function extract(){
  var notes=el('notes').value.trim();
  alertBox();
  if(!notes){say('Paste some notes first.');return}
  if(!window.myllmAsk){say('');alertBox('info','This needs the latest MyLLM with “Allow apps to use the AI” enabled in Settings.');return}
  setBusy(true);say('Reading the notes…');
  var p='From these meeting notes, extract every action item. Reply with EXACTLY these labelled lines and nothing else:\n'+
    'ITEM: what needs to be done | who is responsible (or leave blank) | when it is due (or leave blank) — repeat this line for each action item\n'+
    'Notes:\n'+notes;
  myllmAsk(p).then(function(r){return parseItems(r||'')})
  .catch(function(){return myllmAsk(p+'\nIMPORTANT: fill each labelled line with real content — never repeat the instruction text.')
    .then(function(r){return parseItems(r||'')})})
  .then(function(got){
    got.forEach(function(g){items.unshift({id:uid(),task:g.task,owner:g.owner,due:g.due,done:false})});
    save();busy=false;say('Added '+got.length+' item'+(got.length>1?'s':'')+'.');haptic('success');
  }).catch(function(err){say('');alertBox('err','Could not extract: '+err.message,true)})
  .then(function(){setBusy(false)});
}
function addManual(){
  var v=el('manual').value.trim();if(!v)return;
  items.unshift({id:uid(),task:v,owner:'',due:'',done:false});el('manual').value='';save();render();haptic('light');
}
function toggle(id){var it=items.filter(function(x){return x.id===id})[0];if(it){it.done=!it.done;save();render();haptic('selection')}}
function del(id){items=items.filter(function(x){return x.id!==id});save();render();haptic('light')}
function clearDone(){items=items.filter(function(x){return !x.done});save();render();haptic('light')}
function render(){
  var L = el("list"), done = items.filter(function(x){ return x.done; }).length, open = items.length - done;
  el("hN").textContent = open;
  el("hS").textContent = !items.length ? "Nothing yet" : open ? done + " of " + items.length + " done" : "All " + items.length + " done";
  el("hBar").style.width = (items.length ? Math.round(done / items.length * 100) : 0) + "%";
  el("clearBtn").disabled = !done;
  L.innerHTML = "";
  if (busy){
    var sk = document.createElement("div"); sk.className = "card list skelcard";
    sk.innerHTML = [72, 54, 64].map(function(w){ return '<div class="row"><div class="ck"></div><div class="body"><div class="skel" style="width:' + w + '%"></div><div class="skel" style="width:' + (w - 34) + '%;height:10px"></div></div></div>'; }).join("");
    L.appendChild(sk);
  }
  if (!items.length){ if (!busy) L.innerHTML = '<div class="card">' + emptyState("list", "No action items yet. Paste some notes above, or add one by hand.", "Add an item", "manual") + '</div>'; return; }
  var card = document.createElement("div"); card.className = "card list";
  items.forEach(function(it){
    var d = document.createElement("div"); d.className = "row top" + (it.done ? " done" : "");
    var meta = "";
    if (it.owner) meta += '<span class="tag who">' + icon("person") + '<span>' + esc(it.owner) + '</span></span>';
    if (it.due) meta += '<span class="tag when">' + icon("cal") + '<span>' + esc(it.due) + '</span></span>';
    d.innerHTML = '<div class="ck">' + icon("check") + '</div>' +
      '<div class="body"><div class="tx">' + esc(it.task) + '</div>' + (meta ? '<div class="tags">' + meta + '</div>' : '') + '</div>' +
      '<button class="x" aria-label="Delete">' + icon("x") + '</button>';
    d.querySelector(".ck").onclick = function(){ toggle(it.id); };
    d.querySelector(".tx").onclick = function(){ toggle(it.id); };
    d.querySelector(".x").onclick = function(){ del(it.id); };
    card.appendChild(d);
  });
  L.appendChild(card);
}
el("ext").onclick = extract;
el("clearNotes").onclick = function(){ el("notes").value = ""; };
el("clearBtn").onclick = clearDone;
el("addBtn").onclick = addManual;
el('manual').addEventListener('keydown',function(e){if(e.key==='Enter')addManual()});
render();
load("items").then(function(v){ if (v){ try { var a = JSON.parse(v); if (Array.isArray(a)) items = a; } catch(e){} } mendIds(); render();
  if (!window.myllmAsk) alertBox("info", "Tip: manual add works offline; note-extraction needs AI enabled."); });

/* myllm-fullscreen-v2 — full screen where MyLLM can also close the app for us
   (myllmClose, 5.6.2+): full screen hides MyLLM's Done, and a page with no way
   out is worse than a repeated title, so elsewhere nothing changes.
   The spacer keeps the header clear of the status bar / Dynamic Island. It is
   live CSS — env(safe-area-inset-top) — not a measured number: the inset is
   still 0 when the page loads and only grows once MyLLM's bar has gone (v1
   measured once, so the title sat under the island). If the page's own styles
   already pad the header down by the inset, the spacer stays at 0. */
(function(){
  function full(){ return !!(window.myllmClose && window.myllmImmersive); }
  /* Does any rule that applies to the header or an ancestor already use the top inset? */
  function pageHandlesInset(head){
    var chain = [], n, found = false;
    for (n = head; n && n.nodeType === 1; n = n.parentElement) chain.push(n);
    function walk(rules){
      for (var i = 0; i < rules.length && !found; i++){
        var r = rules[i];
        if (r.cssRules && !r.selectorText) { walk(r.cssRules); continue; }
        if (!r.selectorText || !/safe-area-inset-top/.test(r.cssText) || !/(padding|margin|top)\s*:/.test(r.cssText)) continue;
        if (/\.imm-safe/.test(r.selectorText)) continue;
        for (var k = 0; k < chain.length; k++){
          try { if (chain[k].matches(r.selectorText)) { found = true; break; } } catch(e){}
        }
      }
    }
    for (var s = 0; s < document.styleSheets.length && !found; s++){
      try { walk(document.styleSheets[s].cssRules); } catch(e){}
    }
    for (n = head; n && n.nodeType === 1 && !found; n = n.parentElement){
      if (/safe-area-inset-top/.test(n.getAttribute("style") || "")) found = true;
    }
    return found;
  }
  function fit(){
    var sp = document.querySelector(".imm-safe"), head = document.querySelector(".head");
    if (!sp || !head) return;
    sp.style.height = (document.body.classList.contains("imm") && !pageHandlesInset(head)) ? "env(safe-area-inset-top)" : "0px";
  }
  function sync(){
    var f = full();
    document.body.classList.toggle("imm", f);
    fit();
    if (!f) return;
    try { window.myllmImmersive(true, { keepAwake:false }).catch(function(){}); } catch(e){}
  }
  window.myllmFSClose = function(){
    try { if (window.myllmHaptic) window.myllmHaptic("light"); } catch(e){}
    try { window.myllmClose().catch(function(){}); } catch(e){}
  };
  document.addEventListener("visibilitychange", function(){ if (!document.hidden) sync(); });
  sync();
})();
</script></body></html>
