--><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>About Me</title>
<meta name="myllm:immersive" content="on">
<style>:root{--build-id:"8b3cde2247";color-scheme:light dark;
  --bg:var(--myllm-bg,#f2f2f7); --surface:var(--myllm-surface,#fff); --ink:var(--myllm-text,#111);
  --muted:var(--myllm-muted,#8a8a8e); --line:var(--myllm-border,#e3e3e8); --acc:var(--myllm-accent,#0a84ff);
  --h:335; }
@media (prefers-color-scheme:dark){ :root{ --bg:var(--myllm-bg,#000); --surface:var(--myllm-surface,#1c1c1e);
  --ink:var(--myllm-text,#f2f2f7); --muted:var(--myllm-muted,#8e8e93); --line:var(--myllm-border,#2c2c2e); } }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ font-family:var(--myllm-font,-apple-system,system-ui,sans-serif); background:var(--bg); color:var(--ink);
    max-width:600px; margin:0 auto; min-height:100dvh; font-size:15.5px;
    padding:calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(30px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left)); }
  svg.i{ width:1.25em; height:1.25em; fill:currentColor; flex-shrink:0; }
  button{ font:inherit; color:inherit; } button:active{ transform:scale(.96); }

  .head{ display:flex; align-items:center; gap:12px; margin:2px 2px 14px; }
  .tile{ display:flex; align-items:center; justify-content:center; color:#fff; flex-shrink:0;
    background:linear-gradient(145deg, hsl(var(--h) 62% 50%), hsl(calc(var(--h) + 40) 58% 28%)); }
  .head .tile{ width:44px; height:44px; border-radius:13px; font-size:19px; }
  h1{ font-size:22px; font-weight:800; letter-spacing:-.01em; }
  .head p{ font-size:13px; color:var(--muted); margin-top:1px; }
  h2{ font-size:12px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); margin:20px 2px 10px; }

  .hero{ border-radius:20px; padding:16px 18px; color:#fff; margin-bottom:12px; display:flex; align-items:center; gap:16px;
    background:linear-gradient(145deg, hsl(var(--h) 62% 46%), hsl(calc(var(--h) + 40) 58% 24%)); box-shadow:0 10px 28px hsl(var(--h) 60% 30% / .25); }
  .hero .n{ font-size:44px; font-weight:800; line-height:1; letter-spacing:-.03em; font-variant-numeric:tabular-nums; }
  .hero b{ display:block; font-size:15.5px; font-weight:750; }
  .hero span{ display:block; font-size:12.5px; line-height:1.4; opacity:.8; margin-top:3px; }

  .card{ background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:14px; margin-bottom:12px; }
  label{ display:block; font-size:12px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); margin:14px 2px 7px; }
  label:first-child{ margin-top:0; }
  input{ width:100%; font:inherit; font-size:16px; padding:12px; border-radius:12px; border:1px solid var(--line); background:var(--bg); color:var(--ink); outline:none; }
  input:focus{ border-color:var(--acc); }
  .chips{ display:flex; gap:7px; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; margin:0 -14px; padding:0 14px 2px; }
  .chips::-webkit-scrollbar{ display:none; }
  .chips.wrap{ flex-wrap:wrap; overflow:visible; margin:0; padding:0; }
  .chip{ flex:0 0 auto; min-height:36px; border:1px solid var(--line); background:var(--bg); border-radius:99px; padding:0 14px; font-size:13.5px; font-weight:650; white-space:nowrap; }
  .chip.hot{ background:var(--acc); border-color:var(--acc); color:#fff; }
  .go{ width:100%; min-height:50px; margin-top:16px; border:none; border-radius:14px; background:var(--acc); color:#fff; font-size:16px; font-weight:700;
    display:flex; align-items:center; justify-content:center; gap:8px; }
  .go:disabled{ opacity:.5; }

  .row{ display:flex; align-items:center; gap:11px; padding:10px 0; border-bottom:1px solid var(--line); }
  .row:first-child{ padding-top:2px; } .row:last-child{ border-bottom:none; padding-bottom:2px; }
  .row .tile{ width:36px; height:36px; border-radius:10px; font-size:15px; }
  .row .f{ flex:1; min-width:0; font-size:15px; font-weight:600; line-height:1.3; overflow-wrap:anywhere; }
  .row .c{ font-size:12px; font-weight:500; color:var(--muted); text-transform:capitalize; margin-top:2px; }
  .row .del{ width:44px; height:44px; margin-right:-8px; border:none; background:none; color:var(--muted); font-size:15px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .empty{ text-align:center; padding:12px 8px 8px; color:var(--muted); font-size:13.5px; line-height:1.45; }
  .empty .tile{ width:48px; height:48px; border-radius:14px; font-size:21px; margin:0 auto 10px; opacity:.85; }
  .note{ color:var(--muted); font-size:12.5px; text-align:center; line-height:1.5; padding:6px 10px 0; }
  .note.err{ color:#ff453a; }

  @media (min-width:768px){ body{ max-width:760px; } }
  @media (prefers-reduced-motion:reduce){ button:active{ transform:none; } }

/* myllm-fullscreen-v1 — MyLLM 5.6.2+ opens this app full screen; the ✕ is the way out. */
.head .imm-acts{display:none;flex-shrink:0;margin-left:auto}
.head .acts + .imm-acts{margin-left:0}
body.imm .head .imm-acts{display:flex}
.head .imm-acts button{width:40px;height:40px;border-radius:12px;border:1px solid var(--myllm-border,rgba(128,128,128,.28));
  background:var(--myllm-surface,rgba(128,128,128,.12));color:var(--myllm-text,currentColor);display:grid;place-items:center;padding:0;cursor:pointer;transition:transform .12s}
.head .imm-acts button:active,.head .imm-x:active{transform:scale(.94)}
.head .imm-x{display:none !important}
body.imm .head .imm-x{display:grid !important;place-items:center}
.imm-x svg,.imm-acts svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}
.imm-safe{display:none}
body.imm .imm-safe{display:block}
</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-person" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4.2"/><path d="M4 20.2c0-4 3.6-6.7 8-6.7s8 2.7 8 6.7a.8.8 0 0 1-.8.8H4.8a.8.8 0 0 1-.8-.8z"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6.4 5a1 1 0 0 0-1.4 1.4L10.6 12 5 17.6A1 1 0 0 0 6.4 19l5.6-5.6 5.6 5.6a1 1 0 0 0 1.4-1.4L13.4 12 19 6.4A1 1 0 0 0 17.6 5L12 10.6z"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 4a1 1 0 0 0-1 1v6H5a1 1 0 0 0 0 2h6v6a1 1 0 0 0 2 0v-6h6a1 1 0 0 0 0-2h-6V5a1 1 0 0 0-1-1z"/></symbol>
  <symbol id="i-work" viewBox="0 0 24 24"><path d="M9 3a2 2 0 0 0-2 2v2H5a3 3 0 0 0-3 3v8a3 3 0 0 0 3 3h14a3 3 0 0 0 3-3v-8a3 3 0 0 0-3-3h-2V5a2 2 0 0 0-2-2zm0 2h6v2H9z"/></symbol>
  <symbol id="i-health" viewBox="0 0 24 24"><path d="M10 3a1 1 0 0 0-1 1v5H4a1 1 0 0 0-1 1v4a1 1 0 0 0 1 1h5v5a1 1 0 0 0 1 1h4a1 1 0 0 0 1-1v-5h5a1 1 0 0 0 1-1v-4a1 1 0 0 0-1-1h-5V4a1 1 0 0 0-1-1z"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2.6l2.7 5.9 6.4.7a.6.6 0 0 1 .34 1.04l-4.8 4.3 1.35 6.3a.6.6 0 0 1-.89.64L12 18.3l-5.6 3.2a.6.6 0 0 1-.89-.64l1.35-6.3-4.8-4.3A.6.6 0 0 1 2.4 9.2l6.4-.7z"/></symbol>
  <symbol id="i-dot" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/></symbol>
</defs></svg>

<div class="imm-safe"></div><div class="head">
  <div class="tile"><svg class="i"><use href="#i-person"/></svg></div>
  <div><h1>About Me</h1><p>Teach MyLLM lasting facts about you</p></div>
<div class="imm-acts"><button type="button" aria-label="Close About Me" onclick="myllmFSClose()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div></div>

<div class="hero">
  <div class="n" id="count">0</div>
  <div><b id="heroTitle">Nothing saved from here yet</b>
  <span>Saved privately on your device. This app can add and remove facts, but can't read anything else.</span></div>
</div>

<div class="card">
  <label for="fact">Tell MyLLM to remember…</label>
  <input id="fact" placeholder="e.g. I'm vegetarian" autocomplete="off" enterkeyhint="done">
  <label>Ideas</label>
  <div class="chips" id="chips"></div>
  <label>Category</label>
  <div class="chips wrap" id="cats"></div>
  <button class="go" id="goBtn"><svg class="i"><use href="#i-plus"/></svg>Remember this</button>
</div>

<h2>Saved here</h2>
<div class="card" id="savedCard"><div id="saved"></div></div>
<p class="note" id="hint">Needs the latest MyLLM with “Allow apps to use your memory” enabled in Settings.</p>

<script>
/* Bridges are looked up when used, never kept: MyLLM can add them after this
   script has run. */
function haptic(s){ if (window.myllmHaptic) try { myllmHaptic(s); } catch(_){} }
function loadKey(k){ var s = window.myllmStorage; return s ? s.getItem(k).catch(function(){ return null; }) : Promise.resolve(null); }
function keepKey(k, v){ var s = window.myllmStorage; if (s) try { s.setItem(k, v).catch(function(){}); } catch(_){} }

var saved = [];   /* {fact, cat} the app added (the memory API is write-only: it can't read existing memories) */
var cat = "preference";
var IDEAS = ["I'm vegetarian","Prefer concise answers","I use UK English","I'm learning Spanish","I have a peanut allergy","I work in design"];
var CATS = [["preference","Preference","i-star",335],["personal","Personal","i-person",275],["work","Work","i-work",215],["health","Health","i-health",150],["general","General","i-dot",30]];

function el(id){ return document.getElementById(id); }
function catOf(id){ for (var i = 0; i < CATS.length; i++) if (CATS[i][0] === id) return CATS[i]; return CATS[4]; }
function note(text, bad){ var h = el("hint"); h.textContent = text; h.classList.toggle("err", !!bad); }

function chips(){
  var c = el("chips");
  IDEAS.forEach(function(t){
    var b = document.createElement("button"); b.className = "chip"; b.textContent = t;
    b.onclick = function(){ haptic("selection"); el("fact").value = t; };
    c.appendChild(b);
  });
}
function cats(){
  var c = el("cats"); c.innerHTML = "";
  CATS.forEach(function(k){
    var b = document.createElement("button"); b.className = "chip" + (cat === k[0] ? " hot" : ""); b.textContent = k[1];
    b.setAttribute("aria-pressed", cat === k[0]);
    b.onclick = function(){ cat = k[0]; haptic("selection"); cats(); };
    c.appendChild(b);
  });
}

function remember(){
  var fact = el("fact").value.trim();
  if (!fact){ el("fact").focus(); return; }
  var mem = window.myllmMemory;
  if (!mem){ note("This needs the latest MyLLM (v3.7+) with “Allow apps to use your memory” enabled in Settings.", true); return; }
  var c = cat;
  haptic("light");
  el("goBtn").disabled = true;
  mem.remember(fact, c).then(function(){
    saved.unshift({ fact: fact, cat: c });
    persist(); render(); el("fact").value = ""; haptic("success");
  }).catch(function(e){ note((e && e.message) ? e.message : "Could not save that.", true); })
    .then(function(){ el("goBtn").disabled = false; });
}

function forget(i){
  var item = saved[i], mem = window.myllmMemory; if (!item || !mem) return;
  mem.forget(item.fact).then(function(){ saved.splice(i, 1); persist(); render(); haptic("warning"); });
}

function render(){
  var list = el("saved"), n = saved.length;
  el("count").textContent = n;
  el("heroTitle").textContent = n ? (n === 1 ? "fact MyLLM remembers from here" : "facts MyLLM remembers from here") : "Nothing saved from here yet";
  list.innerHTML = "";
  if (!n){
    list.innerHTML = '<div class="empty"><div class="tile"><svg class="i"><use href="#i-person"/></svg></div>Facts you add will be listed here, so you can take them back later.</div>';
    return;
  }
  saved.forEach(function(it, i){
    var k = catOf(it.cat), d = document.createElement("div"); d.className = "row";
    d.innerHTML = '<div class="tile" style="--h:' + k[3] + '"><svg class="i"><use href="#' + k[2] + '"/></svg></div>' +
      '<div class="f"><div></div><div class="c"></div></div><button class="del" aria-label="Forget this"><svg class="i"><use href="#i-x"/></svg></button>';
    d.querySelector(".f div").textContent = it.fact;
    d.querySelector(".c").textContent = it.cat;
    d.querySelector(".del").onclick = function(){ forget(i); };
    list.appendChild(d);
  });
}

function persist(){ keepKey("aboutme", JSON.stringify(saved.slice(0, 100))); }
function load(){ return loadKey("aboutme").then(function(v){ try { var a = v ? JSON.parse(v) : []; return Array.isArray(a) ? a : []; } catch(e){ return []; } }); }

el("goBtn").onclick = remember;
el("fact").addEventListener("keydown", function(e){ if (e.key === "Enter") remember(); });
chips(); cats(); render();
load().then(function(v){ saved = v; render(); });

/* myllm-fullscreen-v1 — full screen where MyLLM can also close the app for us (myllmClose,
   5.6.2+): full screen hides MyLLM's Done, and a page with no way out is
   worse than a repeated title, so elsewhere nothing changes. The spacer keeps
   the header clear of the status bar only if the page doesn't already. */
(function(){
  function full(){ return !!(window.myllmClose && window.myllmImmersive); }
  function inset(){
    var p = document.createElement("div");
    p.style.cssText = "position:fixed;top:0;left:0;width:1px;visibility:hidden;height:env(safe-area-inset-top)";
    document.body.appendChild(p); var h = p.offsetHeight; p.parentNode.removeChild(p); return h;
  }
  function fit(){
    var sp = document.querySelector(".imm-safe"), head = document.querySelector(".head");
    if (!sp || !head) return;
    sp.style.height = "0px";
    if (!document.body.classList.contains("imm")) return;
    var need = inset() + 6 - (head.getBoundingClientRect().top + window.scrollY);
    sp.style.height = Math.max(0, Math.round(need)) + "px";
  }
  function sync(){
    var f = full();
    document.body.classList.toggle("imm", f);
    fit();
    if (!f) return;
    try { window.myllmImmersive(true, { keepAwake:false }).catch(function(){}); } catch(e){}
  }
  window.myllmFSClose = function(){
    try { if (window.myllmHaptic) window.myllmHaptic("light"); } catch(e){}
    try { window.myllmClose().catch(function(){}); } catch(e){}
  };
  document.addEventListener("visibilitychange", function(){ if (!document.hidden) sync(); });
  window.addEventListener("resize", fit);
  sync();
})();
</script></body></html>
