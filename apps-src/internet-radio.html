<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Internet Radio</title>
<style>
  :root { color-scheme: light dark; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{
    font-family:var(--myllm-font,-apple-system,system-ui,sans-serif);
    background:var(--myllm-bg,#f2f2f7);
    color:var(--myllm-text,#111);
    max-width:600px; margin:0 auto; min-height:100dvh;
    padding:16px 16px calc(30px + env(safe-area-inset-bottom));
  }
  h1{ font-size:22px; font-weight:800; margin:4px 2px 12px; }
  h2{ font-size:12px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:var(--myllm-muted,#8a8a8e); margin:18px 2px 10px; }

  .card{
    background:var(--myllm-surface,#fff); border:1px solid var(--myllm-border,#e3e3e8);
    border-radius:18px; padding:14px; margin-bottom:12px;
  }

  /* Now playing */
  .np{ display:none; position:sticky; top:8px; z-index:5; box-shadow:0 6px 24px rgba(0,0,0,.10); }
  .np.on{ display:block; }
  .np .row{ display:flex; align-items:center; gap:12px; }
  .np .art{ width:52px; height:52px; border-radius:12px; background:var(--myllm-bg,#f2f2f7); display:flex; align-items:center; justify-content:center; font-size:26px; overflow:hidden; flex-shrink:0; }
  .np .art img{ width:100%; height:100%; object-fit:cover; }
  .np .info{ flex:1; min-width:0; }
  .np .name{ font-size:15.5px; font-weight:750; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .np .meta{ font-size:12px; color:var(--myllm-muted,#8a8a8e); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .np .state{ font-size:12px; font-weight:700; margin-top:2px; }
  .np .state.live{ color:#30d158; }
  .np .state.err{ color:#ff453a; }
  .npbtn{ width:46px; height:46px; border-radius:50%; border:none; flex-shrink:0;
    background:var(--myllm-accent,#0a84ff); color:#fff; font-size:19px; }
  .np .sub{ display:flex; align-items:center; gap:7px; margin-top:11px; flex-wrap:wrap; }
  .np .sub button{
    border:1px solid var(--myllm-border,#e3e3e8); background:var(--myllm-bg,#f2f2f7);
    color:var(--myllm-text,#111); border-radius:99px; padding:5px 12px; font-size:12px; font-weight:650;
  }
  .np .sub button.hot{ background:var(--myllm-accent,#0a84ff); border-color:var(--myllm-accent,#0a84ff); color:#fff; }

  /* EQ animation */
  .eq{ display:inline-flex; align-items:flex-end; gap:2px; height:12px; margin-right:5px; vertical-align:-1px; }
  .eq i{ width:3px; border-radius:2px; background:#30d158; animation:eq 1s ease-in-out infinite; }
  .eq i:nth-child(2){ animation-delay:.25s; } .eq i:nth-child(3){ animation-delay:.5s; }
  @keyframes eq{ 0%,100%{height:4px;} 50%{height:12px;} }
  .paused .eq i{ animation-play-state:paused; height:4px; }

  /* Search + chips */
  .search{ display:flex; gap:8px; }
  .search input{
    flex:1; font-size:16px; padding:11px 12px; border-radius:12px;
    border:1px solid var(--myllm-border,#e3e3e8); background:var(--myllm-surface,#fff); color:var(--myllm-text,#111);
  }
  .search button{ border:none; border-radius:12px; padding:0 16px; font-size:15px; font-weight:700; background:var(--myllm-accent,#0a84ff); color:#fff; }
  .chips{ display:flex; gap:7px; overflow-x:auto; -webkit-overflow-scrolling:touch; padding:10px 2px 2px; scrollbar-width:none; }
  .chips::-webkit-scrollbar{ display:none; }
  .chips button{
    border:1px solid var(--myllm-border,#e3e3e8); background:var(--myllm-surface,#fff); color:var(--myllm-text,#111);
    border-radius:99px; padding:7px 14px; font-size:13px; font-weight:650; white-space:nowrap; flex-shrink:0;
  }
  .chips button.hot{ background:var(--myllm-accent,#0a84ff); border-color:var(--myllm-accent,#0a84ff); color:#fff; }

  /* Station rows */
  .st{ display:flex; align-items:center; gap:11px; padding:10px 2px; border-bottom:1px solid var(--myllm-border,#e3e3e8); }
  .st:last-child{ border-bottom:none; }
  .st .art{ width:42px; height:42px; border-radius:10px; background:var(--myllm-bg,#f2f2f7); display:flex; align-items:center; justify-content:center; font-size:20px; overflow:hidden; flex-shrink:0; }
  .st .art img{ width:100%; height:100%; object-fit:cover; }
  .st .info{ flex:1; min-width:0; }
  .st .name{ font-size:14.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .st .name .eq{ height:10px; } .st .name .eq i{ width:2.5px; }
  .st .meta{ font-size:11.5px; color:var(--myllm-muted,#8a8a8e); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .st .fav{ border:none; background:none; font-size:19px; padding:8px 4px 8px 10px; flex-shrink:0; color:var(--myllm-muted,#8a8a8e); }
  .st .fav.on{ color:#ff453a; }

  /* Playing mode: full-screen now-playing, and the dock */
  .np .info{ cursor:pointer; }
  .np .track{ font-size:12.5px; color:var(--myllm-text,#111); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:none; }
  .np .track.on{ display:block; }
  .full{ display:none; position:fixed; inset:0; z-index:50; background:var(--myllm-bg,#f2f2f7); color:var(--myllm-text,#111);
    padding:calc(14px + env(safe-area-inset-top)) 22px calc(22px + env(safe-area-inset-bottom)); flex-direction:column; align-items:center; text-align:center; overflow:auto; }
  .full.on{ display:flex; }
  .full .top{ width:100%; display:flex; justify-content:space-between; align-items:center; }
  .full .top button{ border:none; background:var(--myllm-surface,#fff); color:var(--myllm-text,#111); border-radius:99px; padding:8px 14px; font-size:14px; font-weight:700; border:1px solid var(--myllm-border,#e3e3e8); }
  .full .bigart{ width:min(62vw,240px); height:min(62vw,240px); border-radius:28px; background:var(--myllm-surface,#fff); display:flex; align-items:center; justify-content:center; font-size:96px; overflow:hidden; margin:auto 0 18px; box-shadow:0 14px 40px rgba(0,0,0,.18); }
  .full .bigart img{ width:100%; height:100%; object-fit:cover; }
  .full .fname{ font-size:24px; font-weight:800; line-height:1.2; }
  .full .fmeta{ font-size:14px; color:var(--myllm-muted,#8a8a8e); margin-top:6px; }
  .full .fstate{ font-size:14px; font-weight:700; margin-top:8px; min-height:18px; }
  .full .fstate.live{ color:#30d158; } .full .fstate.err{ color:#ff453a; }
  .full .ftrack{ font-size:15px; margin-top:6px; display:none; }
  .full .ftrack.on{ display:block; }
  .full .fbtn{ width:78px; height:78px; border-radius:50%; border:none; background:var(--myllm-accent,#0a84ff); color:#fff; font-size:30px; margin:24px 0 14px; }
  .full .sub{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-bottom:auto; }
  .full .sub button{ border:1px solid var(--myllm-border,#e3e3e8); background:var(--myllm-surface,#fff); color:var(--myllm-text,#111); border-radius:99px; padding:9px 16px; font-size:14px; font-weight:650; }
  .full .sub button.hot{ background:var(--myllm-accent,#0a84ff); border-color:var(--myllm-accent,#0a84ff); color:#fff; }

  .dock{ display:none; position:fixed; inset:0; z-index:60; background:#000; color:#fff; overflow:hidden; }
  .dock.on{ display:block; }
  .dock .drift{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    transition:transform 20s ease-in-out; }
  .dock .dart{ width:min(40vw,180px); height:min(40vw,180px); border-radius:24px; overflow:hidden; display:flex; align-items:center; justify-content:center; font-size:80px; opacity:.55; background:#111; }
  .dock .dart img{ width:100%; height:100%; object-fit:cover; }
  .dock .dclock{ font-size:min(22vw,112px); font-weight:200; letter-spacing:.02em; line-height:1; color:#bbb; font-variant-numeric:tabular-nums; }
  .dock .dname{ font-size:17px; color:#888; font-weight:600; }
  .dock .dtrack{ font-size:15px; color:#666; display:none; max-width:80vw; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .dock .dtrack.on{ display:block; }
  .dock .dstate{ font-size:13px; color:#555; }
  .dock .dstate.err{ color:#ff453a; }
  .dock .ctl{ position:absolute; left:0; right:0; bottom:calc(28px + env(safe-area-inset-bottom)); display:flex; justify-content:center; gap:12px;
    opacity:0; transition:opacity .3s; pointer-events:none; }
  .dock .ctl.on{ opacity:1; pointer-events:auto; }
  .dock .ctl button{ border:1px solid #333; background:#111; color:#eee; border-radius:99px; padding:11px 20px; font-size:15px; font-weight:700; }
  .dock .hint{ position:absolute; top:calc(16px + env(safe-area-inset-top)); left:0; right:0; text-align:center; font-size:12px; color:#444; }

  .status{ text-align:center; font-size:13.5px; color:var(--myllm-muted,#8a8a8e); padding:20px 12px; line-height:1.6; }
  .note{ font-size:12.5px; color:var(--myllm-muted,#8a8a8e); margin:8px 2px; line-height:1.5; }
</style>
<style>:root{--build-id:"10a3f90e08";}</style>
</head>
<body>

<h1>📻 Internet Radio</h1>

<div class="card np paused" id="np">
  <div class="row">
    <div class="art" id="npArt">📻</div>
    <div class="info" onclick="openFull()" title="Open playing mode">
      <div class="name" id="npName"></div>
      <div class="meta" id="npMeta"></div>
      <div class="track" id="npTrack"></div>
      <div class="state" id="npState"></div>
    </div>
    <button class="npbtn" id="npBtn" onclick="toggle()">▶</button>
  </div>
  <div class="sub">
    <button id="npFav" onclick="favCurrent()">♥ Favourite</button>
    <button id="npSleep" onclick="cycleSleep()">Sleep: off</button>
    <button onclick="openFull()">Playing mode</button>
  </div>
</div>

<!-- Playing mode: full-screen now-playing -->
<div class="full" id="full">
  <div class="top">
    <button onclick="closeFull()">▾ Back</button>
    <button onclick="openDock()">Dock</button>
  </div>
  <div class="bigart" id="fArt">📻</div>
  <div class="fname" id="fName"></div>
  <div class="fmeta" id="fMeta"></div>
  <div class="ftrack" id="fTrack"></div>
  <div class="fstate" id="fState"></div>
  <button class="fbtn" id="fBtn" onclick="toggle()">▶</button>
  <div class="sub">
    <button id="fFav" onclick="favCurrent()">♡ Favourite</button>
    <button id="fSleep" onclick="cycleSleep()">Sleep: off</button>
  </div>
</div>

<!-- Dock mode: dark, dimmed, drifts to avoid burn-in, keeps the screen awake -->
<div class="dock" id="dock" onclick="dockTap()">
  <div class="hint" id="dHint">Tap for controls</div>
  <div class="drift" id="dDrift">
    <div class="dart" id="dArt">📻</div>
    <div class="dclock" id="dClock">--:--</div>
    <div class="dname" id="dName"></div>
    <div class="dtrack" id="dTrack"></div>
    <div class="dstate" id="dState"></div>
  </div>
  <div class="ctl" id="dCtl">
    <button onclick="toggle();event.stopPropagation()" id="dBtn">◼ Stop</button>
    <button onclick="closeDock();event.stopPropagation()">Exit dock</button>
  </div>
</div>

<div class="search">
  <input id="q" type="search" placeholder="Search stations… (name or genre)" autocomplete="off">
  <button onclick="doSearch()">Go</button>
</div>
<div class="chips" id="chips"></div>

<div id="favsWrap" style="display:none">
  <h2>Favourites</h2>
  <div class="card" id="favs"></div>
</div>

<h2 id="listTitle">Popular stations</h2>
<div class="card" id="list"><p class="status">Tuning the dial…</p></div>

<script>
var NET = window.myllmFetch || null;
var store = window.myllmStorage || {getItem:function(){return Promise.resolve(null)}, setItem:function(){return Promise.resolve()}};
function haptic(k){ if(window.myllmHaptic){ try{ myllmHaptic(k||'light'); }catch(_){} } }
function el(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

var HOSTS = ["de1.api.radio-browser.info", "de2.api.radio-browser.info", "all.api.radio-browser.info"];
var hostIdx = 0;

/* Verified HTTPS fallback presets — shown if the directory is unreachable */
var PRESETS = [
  {stationuuid:"p1", name:"Radio Paradise", url_resolved:"https://stream.radioparadise.com/mp3-192", tags:"eclectic,rock", countrycode:"US", codec:"MP3", bitrate:192, favicon:""},
  {stationuuid:"p2", name:"Radio Paradise Mellow", url_resolved:"https://stream.radioparadise.com/mellow-192", tags:"chill,mellow", countrycode:"US", codec:"MP3", bitrate:192, favicon:""},
  {stationuuid:"p3", name:"FIP", url_resolved:"https://icecast.radiofrance.fr/fip-midfi.mp3", tags:"eclectic,jazz", countrycode:"FR", codec:"MP3", bitrate:128, favicon:""},
  {stationuuid:"p4", name:"France Musique", url_resolved:"https://icecast.radiofrance.fr/francemusique-midfi.mp3", tags:"classical", countrycode:"FR", codec:"MP3", bitrate:128, favicon:""},
  {stationuuid:"p5", name:"Classic FM", url_resolved:"https://media-ssl.musicradio.com/ClassicFM", tags:"classical", countrycode:"GB", codec:"AAC", bitrate:128, favicon:""},
  {stationuuid:"p6", name:"KEXP", url_resolved:"https://kexp-mp3-128.streamguys1.com/kexp128.mp3", tags:"indie,alternative", countrycode:"US", codec:"MP3", bitrate:128, favicon:""}
];

var GENRES = ["Popular","Jazz","Lo-Fi","Classical","News","Rock","Electronic","Chill","80s"];
var TAG = {"Jazz":"jazz","Lo-Fi":"lofi","Classical":"classical","News":"news","Rock":"rock","Electronic":"electronic","Chill":"chillout","80s":"80s"};

var audio = new Audio();
audio.preload = "none";
var current = null;        /* station object now loaded */
var favs = [];             /* array of station objects */
var results = [];          /* current list */
var sleepMins = 0, sleepTimer = null;
var activeChip = "Popular";

/* ---------- directory ---------- */

function api(path){
  if (!NET) return Promise.reject(new Error("no net bridge"));
  var url = "https://" + HOSTS[hostIdx] + path;
  return NET(url).then(function(r){
    var j = JSON.parse(r.body);
    if (!(j instanceof Array)) throw new Error("bad response");
    return j;
  }).catch(function(e){
    if (hostIdx < HOSTS.length - 1){ hostIdx++; return api(path); }
    throw e;
  });
}

function cleanStations(arr){
  var seen = {}, out = [];
  for (var i = 0; i < arr.length; i++){
    var s = arr[i];
    if (!s.url_resolved || s.url_resolved.indexOf("https://") !== 0) continue;
    if (seen[s.stationuuid]) continue;
    seen[s.stationuuid] = 1;
    out.push(s);
  }
  return out;
}

function fetchList(params, title){
  el("listTitle").textContent = title;
  el("list").innerHTML = '<p class="status">Tuning the dial…</p>';
  api("/json/stations/search?hidebroken=true&is_https=true&order=clickcount&reverse=true&limit=40&" + params)
    .then(function(arr){
      results = cleanStations(arr);
      renderList();
    })
    .catch(function(){
      results = PRESETS.slice();
      el("listTitle").textContent = "Staff picks (directory offline)";
      renderList();
      el("list").insertAdjacentHTML("beforebegin",
        '<p class="note" id="offnote">Couldn\'t reach the station directory' +
        (NET ? ' — showing a built-in selection instead.' : ' — this app needs internet access for apps (MyLLMos settings). The built-in stations below may still play.') + '</p>');
    });
}

function doSearch(){
  var q = el("q").value.trim();
  if (!q) return;
  setChip(null);
  fetchList("name=" + encodeURIComponent(q), 'Results for "' + q + '"');
}

function pickGenre(g){
  el("q").value = "";
  setChip(g);
  if (g === "Popular") fetchList("", "Popular stations");
  else fetchList("tag=" + encodeURIComponent(TAG[g]), g + " stations");
}

/* ---------- rendering ---------- */

function metaLine(s){
  var bits = [];
  if (s.tags){ var t = String(s.tags).split(",").slice(0,2).join(", "); if (t) bits.push(t); }
  if (s.countrycode) bits.push(s.countrycode);
  if (s.bitrate) bits.push(s.bitrate + " kbps");
  return bits.join(" · ");
}

function artHtml(s, cls){
  var fallback = '📻';
  if (s.favicon && String(s.favicon).indexOf("https://") === 0)
    return '<div class="art"><img src="' + esc(s.favicon) + '" loading="lazy" onerror="this.parentNode.textContent=\'' + fallback + '\'"></div>';
  return '<div class="art">' + fallback + '</div>';
}

function isFav(s){ for (var i=0;i<favs.length;i++) if (favs[i].stationuuid === s.stationuuid) return true; return false; }

function rowHtml(s, idx, listName){
  var playing = current && current.stationuuid === s.stationuuid;
  return '<div class="st" data-i="' + idx + '" data-l="' + listName + '">' +
    artHtml(s) +
    '<div class="info" onclick="playFrom(\'' + listName + '\',' + idx + ')">' +
      '<div class="name">' + (playing ? '<span class="eq"><i></i><i></i><i></i></span>' : '') + esc(s.name) + '</div>' +
      '<div class="meta">' + esc(metaLine(s)) + '</div>' +
    '</div>' +
    '<button class="fav' + (isFav(s) ? ' on' : '') + '" onclick="toggleFav(\'' + listName + '\',' + idx + ')">' + (isFav(s) ? '♥' : '♡') + '</button>' +
  '</div>';
}

function renderList(){
  if (!results.length){ el("list").innerHTML = '<p class="status">No stations found — try another search.</p>'; return; }
  var h = "";
  for (var i = 0; i < results.length; i++) h += rowHtml(results[i], i, "r");
  el("list").innerHTML = h;
}

function renderFavs(){
  if (!favs.length){ el("favsWrap").style.display = "none"; return; }
  el("favsWrap").style.display = "block";
  var h = "";
  for (var i = 0; i < favs.length; i++) h += rowHtml(favs[i], i, "f");
  el("favs").innerHTML = h;
}

function renderChips(){
  var h = "";
  for (var i = 0; i < GENRES.length; i++)
    h += '<button' + (GENRES[i] === activeChip ? ' class="hot"' : '') + ' onclick="pickGenre(\'' + GENRES[i] + '\')">' + GENRES[i] + '</button>';
  el("chips").innerHTML = h;
}

function setChip(g){ activeChip = g; renderChips(); }

/* ---------- playback ---------- */

function playFrom(listName, idx){
  var s = (listName === "f" ? favs : results)[idx];
  if (!s) return;
  play(s);
}

function play(s){
  haptic("light");
  current = s;
  audio.src = s.url_resolved;
  audio.play();
  el("np").className = "card np on";
  el("npName").textContent = s.name;
  el("npMeta").textContent = metaLine(s);
  el("npArt").innerHTML = artHtml(s).replace(/^<div class="art">|<\/div>$/g, "");
  el("npBtn").textContent = "◼";
  setState("Connecting…", "");
  syncPlaying();
  updateNpFav();
  renderList(); renderFavs();
  store.setItem("radio_last", JSON.stringify(s));
  /* polite listen ping so the directory's popularity counts stay honest */
  if (NET && String(s.stationuuid).length > 8)
    NET("https://" + HOSTS[hostIdx] + "/json/url/" + s.stationuuid).catch(function(){});
}

function stop(){
  audio.pause();
  audio.removeAttribute("src");
  try { audio.load(); } catch(_){}
  el("npBtn").textContent = "▶";
  el("np").classList.add("paused");
  setState("Stopped", "");
  syncPlaying();
  if (dockOn) closeDock();     /* a silent dock is just a dark screen burning battery */
}

function toggle(){
  haptic("light");
  if (!current) return;
  if (audio.paused) play(current); else stop();
}

function setState(txt, cls){
  el("npState").textContent = txt;
  el("npState").className = "state" + (cls ? " " + cls : "");
  el("fState").textContent = txt;
  el("fState").className = "fstate" + (cls ? " " + cls : "");
  el("dState").textContent = txt;
  el("dState").className = "dstate" + (cls === "err" ? " err" : "");
}

audio.addEventListener("waiting", function(){ setState("Buffering…", ""); el("np").classList.add("paused"); });
audio.addEventListener("playing", function(){ setState("● Live", "live"); el("np").classList.remove("paused"); });
audio.addEventListener("error", function(){
  if (!current) return;
  setState("Station didn't respond — try another", "err");
  el("npBtn").textContent = "▶";
  el("np").classList.add("paused");
  syncPlaying();
});

/* ---------- favourites ---------- */

function slim(s){
  return {stationuuid:s.stationuuid, name:s.name, url_resolved:s.url_resolved,
          tags:s.tags, countrycode:s.countrycode, codec:s.codec, bitrate:s.bitrate, favicon:s.favicon};
}

function toggleFav(listName, idx){
  var s = (listName === "f" ? favs : results)[idx];
  if (!s) return;
  haptic("medium");
  setFav(s, !isFav(s));
}

function favCurrent(){ if (current){ haptic("medium"); setFav(current, !isFav(current)); } }

function setFav(s, on){
  if (on) favs.unshift(slim(s));
  else favs = favs.filter(function(f){ return f.stationuuid !== s.stationuuid; });
  store.setItem("radio_favs", JSON.stringify(favs));
  renderFavs(); renderList(); updateNpFav();
}

function updateNpFav(){
  if (!current) return;
  var on = isFav(current);
  el("npFav").textContent = on ? "♥ Favourited" : "♡ Favourite";
  el("npFav").className = on ? "hot" : "";
  el("fFav").textContent = el("npFav").textContent;
  el("fFav").className = el("npFav").className;
}

/* ---------- sleep timer ---------- */

var SLEEPS = [0, 15, 30, 60];
function cycleSleep(){
  haptic("light");
  sleepMins = SLEEPS[(SLEEPS.indexOf(sleepMins) + 1) % SLEEPS.length];
  if (sleepTimer){ clearTimeout(sleepTimer); sleepTimer = null; }
  if (sleepMins){
    sleepTimer = setTimeout(function(){ stop(); sleepMins = 0; el("npSleep").textContent = "Sleep: off"; el("npSleep").className = ""; }, sleepMins * 60000);
  }
  el("npSleep").textContent = sleepMins ? "Sleep: " + sleepMins + "m" : "Sleep: off";
  el("npSleep").className = sleepMins ? "hot" : "";
  el("fSleep").textContent = el("npSleep").textContent;
  el("fSleep").className = el("npSleep").className;
}

/* ---------- playing mode ---------- */

/* Full-screen now-playing. Everything shown here is already in the station
   record (name, tags, country, codec, bitrate) plus the live state; the only
   thing the web player cannot know is what track is on, which arrives via
   myllmNowPlaying() once MyLLM reads the stream's metadata (5.6). */
function stationDetail(s){
  var bits = [];
  if (s.tags){ var t = String(s.tags).split(",").slice(0,3).join(", "); if (t) bits.push(t); }
  if (s.countrycode) bits.push(s.countrycode);
  var q = [];
  if (s.codec) q.push(String(s.codec).toUpperCase());
  if (s.bitrate) q.push(s.bitrate + " kbps");
  if (q.length) bits.push(q.join(" "));
  return bits.join(" · ");
}
function bigArt(s){ return artHtml(s).replace(/^<div class="art">|<\/div>$/g, ""); }

function openFull(){
  if (!current) return;
  haptic("light");
  el("fName").textContent = current.name;
  el("fMeta").textContent = stationDetail(current);
  el("fArt").innerHTML = bigArt(current);
  updateNpFav();
  syncPlaying();
  el("full").classList.add("on");
}
function closeFull(){ haptic("light"); el("full").classList.remove("on"); }

function syncPlaying(){
  var playing = current && !audio.paused;
  el("fBtn").textContent = playing ? "◼" : "▶";
  el("dBtn").textContent = playing ? "◼ Stop" : "▶ Play";
}

/* The 5.6 hook: MyLLM calls this with the stream's StreamTitle. */
window.myllmNowPlaying = function(title){
  var t = String(title || "").trim();
  ["npTrack","fTrack","dTrack"].forEach(function(id){
    var n = el(id); n.textContent = t; n.classList.toggle("on", !!t);
  });
};

/* Dock: black screen, dimmed art, a large clock, everything drifting a
   little every minute so nothing burns in. The screen is kept awake with
   the Wake Lock API where the web view offers it; where it doesn't, the
   phone's own auto-lock applies and the audio carries on regardless. */
var dockOn = false, dockClock = null, dockDrift = null, dockCtlTimer = null, wakeLock = null;

function dockTime(){
  var d = new Date(), h = d.getHours(), m = d.getMinutes();
  el("dClock").textContent = (h < 10 ? "0" : "") + h + ":" + (m < 10 ? "0" : "") + m;
}
function driftOnce(){
  var x = Math.round((Math.random() - 0.5) * 36), y = Math.round((Math.random() - 0.5) * 36);
  el("dDrift").style.transform = "translate(" + x + "px," + y + "px)";
}
function requestWake(){
  if (!("wakeLock" in navigator)) return;
  navigator.wakeLock.request("screen").then(function(l){ wakeLock = l; }).catch(function(){ wakeLock = null; });
}
function releaseWake(){
  if (wakeLock){ try { wakeLock.release(); } catch(_){} wakeLock = null; }
}
function openDock(){
  if (!current) return;
  haptic("medium");
  el("dName").textContent = current.name;
  el("dArt").innerHTML = bigArt(current);
  dockOn = true;
  dockTime(); driftOnce(); syncPlaying();
  el("dock").classList.add("on");
  el("dCtl").classList.remove("on");
  el("dHint").style.display = "block";
  setTimeout(function(){ el("dHint").style.display = "none"; }, 4000);
  dockClock = setInterval(dockTime, 15000);
  dockDrift = setInterval(driftOnce, 60000);
  requestWake();
}
function closeDock(){
  dockOn = false;
  el("dock").classList.remove("on");
  clearInterval(dockClock); clearInterval(dockDrift); clearTimeout(dockCtlTimer);
  dockClock = dockDrift = dockCtlTimer = null;
  releaseWake();
}
function dockTap(){
  if (!dockOn) return;
  el("dCtl").classList.add("on");
  clearTimeout(dockCtlTimer);
  dockCtlTimer = setTimeout(function(){ el("dCtl").classList.remove("on"); }, 5000);
}
document.addEventListener("visibilitychange", function(){
  if (document.hidden){ releaseWake(); }
  else if (dockOn){ dockTime(); requestWake(); }
});

/* ---------- boot ---------- */

el("q").addEventListener("keydown", function(e){ if (e.key === "Enter"){ doSearch(); this.blur(); } });

renderChips();
store.getItem("radio_favs").then(function(v){
  if (v){ try { favs = JSON.parse(v) || []; } catch(_){} }
  renderFavs();
});
store.getItem("radio_last").then(function(v){
  if (v){ try {
    var s = JSON.parse(v);
    current = s;
    el("np").className = "card np on paused";
    el("npName").textContent = s.name;
    el("npMeta").textContent = metaLine(s);
    el("npArt").innerHTML = artHtml(s).replace(/^<div class="art">|<\/div>$/g, "");
    el("npBtn").textContent = "▶";
    setState("Tap to resume", "");
    updateNpFav();
  } catch(_){} }
});
fetchList("", "Popular stations");
</script>
