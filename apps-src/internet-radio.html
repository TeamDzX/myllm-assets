--><html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Internet Radio</title>
<style>
  :root { color-scheme: light dark; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{
    font-family:var(--myllm-font,-apple-system,system-ui,sans-serif);
    background:var(--myllm-bg,#f2f2f7);
    color:var(--myllm-text,#111);
    max-width:600px; margin:0 auto; min-height:100dvh;
    padding:16px 16px calc(30px + env(safe-area-inset-bottom));
  }
  h1{ font-size:22px; font-weight:800; margin:4px 2px 12px; }
  h2{ font-size:12px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:var(--myllm-muted,#8a8a8e); margin:18px 2px 10px; }

  .card{
    background:var(--myllm-surface,#fff); border:1px solid var(--myllm-border,#e3e3e8);
    border-radius:18px; padding:14px; margin-bottom:12px;
  }

  /* Now playing */
  .np{ display:none; position:sticky; top:8px; z-index:5; box-shadow:0 6px 24px rgba(0,0,0,.10); }
  .np.on{ display:block; }
  .np .row{ display:flex; align-items:center; gap:12px; }
  .np .art{ width:52px; height:52px; border-radius:12px; background:var(--myllm-bg,#f2f2f7); display:flex; align-items:center; justify-content:center; font-size:26px; overflow:hidden; flex-shrink:0; }
  .np .art img{ width:100%; height:100%; object-fit:cover; }
  .np .info{ flex:1; min-width:0; }
  .np .name{ font-size:15.5px; font-weight:750; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .np .meta{ font-size:12px; color:var(--myllm-muted,#8a8a8e); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .np .state{ font-size:12px; font-weight:700; margin-top:2px; }
  .np .state.live{ color:#30d158; }
  .np .state.err{ color:#ff453a; }
  .npbtn{ width:46px; height:46px; border-radius:50%; border:none; flex-shrink:0;
    background:var(--myllm-accent,#0a84ff); color:#fff; font-size:19px; }
  .np .sub{ display:flex; align-items:center; gap:7px; margin-top:11px; flex-wrap:wrap; }
  .np .sub button{
    border:1px solid var(--myllm-border,#e3e3e8); background:var(--myllm-bg,#f2f2f7);
    color:var(--myllm-text,#111); border-radius:99px; padding:5px 12px; font-size:12px; font-weight:650;
  }
  .np .sub button.hot{ background:var(--myllm-accent,#0a84ff); border-color:var(--myllm-accent,#0a84ff); color:#fff; }

  /* EQ animation */
  .eq{ display:inline-flex; align-items:flex-end; gap:2px; height:12px; margin-right:5px; vertical-align:-1px; }
  .eq i{ width:3px; border-radius:2px; background:#30d158; animation:eq 1s ease-in-out infinite; }
  .eq i:nth-child(2){ animation-delay:.25s; } .eq i:nth-child(3){ animation-delay:.5s; }
  @keyframes eq{ 0%,100%{height:4px;} 50%{height:12px;} }
  .paused .eq i{ animation-play-state:paused; height:4px; }

  /* Search + chips */
  .search{ display:flex; gap:8px; }
  .search input{
    flex:1; font-size:16px; padding:11px 12px; border-radius:12px;
    border:1px solid var(--myllm-border,#e3e3e8); background:var(--myllm-surface,#fff); color:var(--myllm-text,#111);
  }
  .search button{ border:none; border-radius:12px; padding:0 16px; font-size:15px; font-weight:700; background:var(--myllm-accent,#0a84ff); color:#fff; }
  .chips{ display:flex; gap:7px; overflow-x:auto; -webkit-overflow-scrolling:touch; padding:10px 2px 2px; scrollbar-width:none; }
  .chips::-webkit-scrollbar{ display:none; }
  .chips button{
    border:1px solid var(--myllm-border,#e3e3e8); background:var(--myllm-surface,#fff); color:var(--myllm-text,#111);
    border-radius:99px; padding:7px 14px; font-size:13px; font-weight:650; white-space:nowrap; flex-shrink:0;
  }
  .chips button.hot{ background:var(--myllm-accent,#0a84ff); border-color:var(--myllm-accent,#0a84ff); color:#fff; }

  /* Station rows */
  .st{ display:flex; align-items:center; gap:11px; padding:10px 2px; border-bottom:1px solid var(--myllm-border,#e3e3e8); }
  .st:last-child{ border-bottom:none; }
  .st .art{ width:42px; height:42px; border-radius:10px; background:var(--myllm-bg,#f2f2f7); display:flex; align-items:center; justify-content:center; font-size:20px; overflow:hidden; flex-shrink:0; }
  .st .art img{ width:100%; height:100%; object-fit:cover; }
  .st .info{ flex:1; min-width:0; }
  .st .name{ font-size:14.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .st .name .eq{ height:10px; } .st .name .eq i{ width:2.5px; }
  .st .meta{ font-size:11.5px; color:var(--myllm-muted,#8a8a8e); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .st .fav{ border:none; background:none; font-size:19px; padding:8px 4px 8px 10px; flex-shrink:0; color:var(--myllm-muted,#8a8a8e); }
  .st .fav.on{ color:#ff453a; }

  /* Playing mode: full-screen now-playing, and the dock */
  .np .info{ cursor:pointer; }
  .np .track{ font-size:12.5px; color:var(--myllm-text,#111); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:none; }
  .np .track.on{ display:block; }
  body.lock{ overflow:hidden; }

  /* Station art: a hue-tinted tile carrying the station's initials; the logo
     sits on top when there is one. Directory logos are often 32px favicons,
     so a small one is shown small on the tile rather than stretched to mush. */
  .tile{ position:relative; display:flex; align-items:center; justify-content:center; overflow:hidden;
    background:linear-gradient(145deg, hsl(var(--h,215) 62% 46%), hsl(calc(var(--h,215) + 40) 58% 24%)); }
  .tile .ini{ font-weight:800; color:rgba(255,255,255,.92); letter-spacing:.02em; }
  .tile img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity .35s; }
  .tile img.ok{ opacity:1; }
  .tile img.sm{ inset:auto; width:46%; height:46%; object-fit:contain; border-radius:16%; box-shadow:0 6px 22px rgba(0,0,0,.35); }

  .full{ display:none; position:fixed; inset:0; z-index:50; color:#fff; overflow:hidden;
    background:radial-gradient(120% 90% at 20% 10%, hsl(var(--h,215) 70% 42%), transparent 60%),
      radial-gradient(120% 90% at 85% 95%, hsl(calc(var(--h,215) + 60) 65% 34%), transparent 62%), #0b0b10; }
  .full.on{ display:block; }
  .full .fbg{ position:absolute; inset:-12%; background-size:cover; background-position:center; filter:blur(46px) saturate(1.6); transform:scale(1.15); opacity:0; transition:opacity .6s; }
  .full .fbg.art{ opacity:.5; }
  .full .scrim{ position:absolute; inset:0; background:linear-gradient(180deg, rgba(8,8,12,.42) 0%, rgba(8,8,12,.58) 45%, rgba(8,8,12,.86) 100%); }
  .full .stage{ position:absolute; inset:0; overflow-y:auto; -webkit-overflow-scrolling:touch; display:flex; flex-direction:column; align-items:center; text-align:center;
    padding:calc(12px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom)); }
  .full .top{ width:100%; max-width:520px; display:flex; justify-content:space-between; align-items:center; flex-shrink:0; }
  .full .top .lbl{ font-size:11px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:rgba(255,255,255,.62); }
  .glass{ border:1px solid rgba(255,255,255,.16); background:rgba(255,255,255,.12); color:#fff;
    -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px); }
  .full .top button{ height:40px; min-width:40px; border-radius:99px; padding:0 14px; font-size:13.5px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; gap:7px; }
  .full .top button.rnd{ padding:0; }
  .full svg, .dock svg{ width:1.25em; height:1.25em; fill:currentColor; flex-shrink:0; }

  .full .bigart{ width:min(66vw,290px,38vh); height:min(66vw,290px,38vh); border-radius:30px; margin:auto 0 22px; flex-shrink:0;
    box-shadow:0 24px 60px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.08); transition:transform .6s cubic-bezier(.2,.8,.2,1); transform:scale(.9); }
  .full.live .bigart{ transform:scale(1); }
  .full .bigart .ini{ font-size:min(22vw,96px); }

  .full .fstate{ display:inline-flex; align-items:center; gap:7px; font-size:11.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase;
    color:rgba(255,255,255,.7); min-height:16px; flex-shrink:0; }
  .full .fstate.live{ color:#4be07d; } .full .fstate.err{ color:#ff6b62; letter-spacing:.02em; text-transform:none; font-size:13.5px; }
  .full .fstate .eq{ display:none; margin:0; } .full .fstate.live .eq{ display:inline-flex; }
  .full .fstate .eq i{ background:#4be07d; }

  .full .ftitle{ font-size:25px; font-weight:800; line-height:1.18; margin-top:10px; max-width:520px; letter-spacing:-.01em;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; flex-shrink:0; }
  .full .fartist{ font-size:17px; font-weight:600; color:rgba(255,255,255,.78); margin-top:5px; max-width:520px; flex-shrink:0; }
  .full .fartist:empty{ display:none; }
  .full .fmeta{ font-size:13px; color:rgba(255,255,255,.55); margin-top:8px; max-width:520px; flex-shrink:0; }
  .full .swap{ animation:swap .5s ease both; }
  @keyframes swap{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:none; } }

  .full .ctl{ display:flex; align-items:center; justify-content:center; gap:26px; margin:26px 0 8px; flex-shrink:0; }
  .full .ctl button{ border-radius:50%; display:flex; align-items:center; justify-content:center; position:relative; }
  .full .ctl .side{ width:56px; height:56px; font-size:19px; }
  .full .ctl .side.hot{ background:#fff; color:#111; border-color:#fff; }
  .full .ctl #fFav.hot{ background:#ff453a; border-color:#ff453a; color:#fff; }
  .full .ctl .fbtn{ width:84px; height:84px; border:none; background:#fff; color:#0b0b10; font-size:28px; box-shadow:0 10px 30px rgba(0,0,0,.35); }
  .full .ctl .fbtn:active, .full .ctl .side:active{ transform:scale(.94); }
  .full .ctl .badge{ position:absolute; right:-4px; top:-4px; min-width:24px; height:20px; padding:0 5px; border-radius:99px; background:#0a84ff; color:#fff;
    font-size:10.5px; font-weight:800; line-height:20px; display:none; }
  .full .ctl .hot .badge{ display:block; }

  .full .earlier{ width:100%; max-width:520px; margin:18px 0 auto; text-align:left; border-radius:18px; padding:4px 14px; display:none; flex-shrink:0; }
  .full .earlier.on{ display:block; }
  .full .earlier h3{ font-size:10.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:rgba(255,255,255,.55); margin:10px 0 2px; }
  .full .earlier .row{ display:flex; gap:12px; align-items:baseline; padding:8px 0; border-top:1px solid rgba(255,255,255,.1); font-size:13.5px; }
  .full .earlier .row:first-of-type{ border-top:none; }
  .full .earlier .when{ color:rgba(255,255,255,.5); font-variant-numeric:tabular-nums; font-size:12px; flex-shrink:0; }
  .full .earlier .what{ min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .full .spacer{ margin-bottom:auto; }

  /* Light variant: on a MyLLM build that can't hide its title bar, a dark
     stage under a white bar looks cut in half — so in light mode, without
     myllmImmersive, playing mode stays light and runs on from the bar. */
  .full.lite{ color:#15151a;
    background:radial-gradient(120% 90% at 20% 0%, hsl(var(--h,215) 85% 86%), transparent 60%),
      radial-gradient(120% 90% at 85% 95%, hsl(calc(var(--h,215) + 60) 80% 84%), transparent 62%), #f4f4f8; }
  .full.lite .scrim{ background:linear-gradient(180deg, rgba(255,255,255,.55) 0%, rgba(255,255,255,.3) 40%, rgba(255,255,255,.72) 100%); }
  .full.lite .fbg.art{ opacity:.32; }
  .full.lite .glass{ border-color:rgba(0,0,0,.09); background:rgba(255,255,255,.62); color:#15151a; }
  .full.lite .top .lbl, .full.lite .fmeta, .full.lite .earlier h3, .full.lite .earlier .when{ color:rgba(0,0,0,.5); }
  .full.lite .fartist{ color:rgba(0,0,0,.68); }
  .full.lite .fstate{ color:rgba(0,0,0,.5); } .full.lite .fstate.live{ color:#1c9a4a; } .full.lite .fstate.err{ color:#d92d20; }
  .full.lite .fstate .eq i{ background:#1c9a4a; }
  .full.lite .bigart{ box-shadow:0 22px 50px rgba(20,20,40,.22), 0 0 0 1px rgba(0,0,0,.05); }
  .full.lite .ctl .fbtn{ background:#15151a; color:#fff; box-shadow:0 10px 26px rgba(20,20,40,.25); }
  .full.lite .ctl .side.hot{ background:#15151a; border-color:#15151a; color:#fff; }
  .full.lite .ctl #fFav.hot{ background:#ff453a; border-color:#ff453a; }
  .full.lite .earlier .row{ border-top-color:rgba(0,0,0,.08); }

  /* Dock: true black edge to edge, everything dim, drifting against burn-in */
  .dock{ display:none; position:fixed; inset:0; z-index:60; background:#000; color:#fff; overflow:hidden; }
  .dock.on{ display:block; }
  .dock .drift{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:0 24px; text-align:center;
    transition:transform 20s ease-in-out; }
  .dock .dclock{ font-size:min(27vw,150px); font-weight:200; letter-spacing:.01em; line-height:1; color:#c9c9cf; font-variant-numeric:tabular-nums; }
  .dock .ddate{ font-size:14px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:#5d5d66; margin-bottom:18px; }
  .dock .drow{ display:flex; align-items:center; gap:12px; max-width:min(86vw,520px); text-align:left; }
  .dock .dart{ width:50px; height:50px; border-radius:13px; flex-shrink:0; opacity:.7; }
  .dock .dart .ini{ font-size:19px; }
  .dock .dtxt{ min-width:0; }
  .dock .dtrack{ font-size:16px; font-weight:650; color:#a9a9b2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .dock .dname{ font-size:13.5px; color:#6a6a74; font-weight:600; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .dock .dname .eq{ height:9px; opacity:.8; } .dock .dname .eq i{ width:2.5px; background:#3fae63; }
  .dock .dstate.err{ color:#ff453a; }
  .dock .ctl{ position:absolute; left:0; right:0; bottom:calc(30px + env(safe-area-inset-bottom)); display:flex; justify-content:center; gap:12px;
    opacity:0; transition:opacity .3s; pointer-events:none; }
  .dock .ctl.on{ opacity:1; pointer-events:auto; }
  .dock .ctl button{ border:1px solid #2c2c33; background:#121216; color:#eee; border-radius:99px; padding:12px 22px; font-size:15px; font-weight:700; display:inline-flex; align-items:center; gap:8px; }
  .dock .hint{ position:absolute; bottom:calc(34px + env(safe-area-inset-bottom)); left:0; right:0; text-align:center; font-size:12px; color:#4a4a52; transition:opacity .6s; }
  @media (orientation:landscape){
    .dock .dclock{ font-size:min(30vh,170px); }
    .full .stage{ padding-left:calc(24px + env(safe-area-inset-left)); padding-right:calc(24px + env(safe-area-inset-right)); }
  }
  @media (prefers-reduced-motion:reduce){
    .full .bigart, .tile img{ transition:none; } .full .swap{ animation:none; } .eq i{ animation:none; }
  }

  .status{ text-align:center; font-size:13.5px; color:var(--myllm-muted,#8a8a8e); padding:20px 12px; line-height:1.6; }
  .note{ font-size:12.5px; color:var(--myllm-muted,#8a8a8e); margin:8px 2px; line-height:1.5; }
</style>
<style>:root{--build-id:"10a3f90e08";}</style>
</head>
<body>

<h1>📻 Internet Radio</h1>

<div class="card np paused" id="np">
  <div class="row">
    <div class="art" id="npArt">📻</div>
    <div class="info" onclick="openFull()" title="Open playing mode">
      <div class="name" id="npName"></div>
      <div class="meta" id="npMeta"></div>
      <div class="track" id="npTrack"></div>
      <div class="state" id="npState"></div>
    </div>
    <button class="npbtn" id="npBtn" onclick="toggle()">▶</button>
  </div>
  <div class="sub">
    <button id="npFav" onclick="favCurrent()">♥ Favourite</button>
    <button id="npSleep" onclick="cycleSleep()">Sleep: off</button>
    <button onclick="openFull()">Playing mode</button>
  </div>
</div>

<!-- Icons (inline: ▶ ◼ ♥ turn into emoji on iOS) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.2v13.6a1 1 0 0 0 1.5.9l11-6.8a1 1 0 0 0 0-1.8l-11-6.8A1 1 0 0 0 8 5.2z"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2.5"/></symbol>
  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20.6s-7.6-4.5-9.4-9.3C1.3 7.700 3.500 4.500 6.900 4.500c2 0 3.700 1 5.100 2.800 1.400-1.800 3.100-2.800 5.100-2.800 3.400 0 5.600 3.200 4.300 6.800-1.800 4.800-9.400 9.300-9.400 9.300z"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.300 14.900A8.500 8.500 0 0 1 9.100 3.700a.7.7 0 0 0-.9-.9 9.900 9.900 0 1 0 13 13 .7.7 0 0 0-.9-.9z"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M5.300 8.800a1.200 1.200 0 0 1 1.700 0l5 5 5-5a1.200 1.200 0 1 1 1.700 1.700l-5.850 5.850a1.200 1.200 0 0 1-1.700 0L5.300 10.500a1.200 1.200 0 0 1 0-1.700z"/></symbol>
  <symbol id="i-dock" viewBox="0 0 24 24"><path d="M12 3.500a8.500 8.500 0 1 0 0 17 8.500 8.500 0 0 0 0-17zm0 1.900a6.600 6.600 0 1 1 0 13.200 6.600 6.600 0 0 1 0-13.200zm0 1.800a.95.95 0 0 0-.95.95V12c0 .250.100.490.280.670l2.500 2.500a.95.95 0 0 0 1.340-1.340l-2.220-2.220V8.150A.95.95 0 0 0 12 7.200z"/></symbol>
</svg>

<!-- Playing mode: full-screen now-playing -->
<div class="full" id="full">
  <div class="fbg" id="fBg"></div>
  <div class="scrim"></div>
  <div class="stage">
    <div class="top">
      <button class="glass rnd" onclick="closeFull()" aria-label="Back to stations"><svg><use href="#i-down"/></svg></button>
      <span class="lbl">Now playing</span>
      <button class="glass" onclick="openDock()"><svg><use href="#i-dock"/></svg>Dock</button>
    </div>
    <div class="bigart tile" id="fArt"></div>
    <div class="fstate" id="fState"><span class="eq"><i></i><i></i><i></i></span><span id="fStateTxt"></span></div>
    <div class="ftitle" id="fTitle" onclick="shareTrack()"></div>
    <div class="fartist" id="fArtist"></div>
    <div class="fmeta" id="fMeta"></div>
    <div class="ctl">
      <button class="glass side" id="fFav" onclick="favCurrent()" aria-label="Favourite"><svg><use href="#i-heart"/></svg></button>
      <button class="fbtn" id="fBtn" onclick="toggle()" aria-label="Play or stop"><svg><use href="#i-play"/></svg></button>
      <button class="glass side" id="fSleep" onclick="cycleSleep()" aria-label="Sleep timer"><svg><use href="#i-moon"/></svg><span class="badge" id="fSleepN"></span></button>
    </div>
    <div class="earlier glass" id="fEarlier"></div>
    <div class="spacer"></div>
  </div>
</div>

<!-- Dock mode: true black, dimmed, drifts to avoid burn-in, keeps the screen awake -->
<div class="dock" id="dock" onclick="dockTap()">
  <div class="drift" id="dDrift">
    <div class="dclock" id="dClock">--:--</div>
    <div class="ddate" id="dDate"></div>
    <div class="drow">
      <div class="dart tile" id="dArt"></div>
      <div class="dtxt">
        <div class="dtrack" id="dTrack"></div>
        <div class="dname"><span class="eq" id="dEq"><i></i><i></i><i></i></span><span id="dName"></span> <span class="dstate" id="dState"></span></div>
      </div>
    </div>
  </div>
  <div class="hint" id="dHint">Tap for controls</div>
  <div class="ctl" id="dCtl">
    <button onclick="toggle();event.stopPropagation()" id="dBtn"></button>
    <button onclick="closeDock();event.stopPropagation()">Exit dock</button>
  </div>
</div>

<div class="search">
  <input id="q" type="search" placeholder="Search stations… (name or genre)" autocomplete="off">
  <button onclick="doSearch()">Go</button>
</div>
<div class="chips" id="chips"></div>

<div id="favsWrap" style="display:none">
  <h2>Favourites</h2>
  <div class="card" id="favs"></div>
</div>

<h2 id="listTitle">Popular stations</h2>
<div class="card" id="list"><p class="status">Tuning the dial…</p></div>

<script>
var NET = window.myllmFetch || null;
var store = window.myllmStorage || {getItem:function(){return Promise.resolve(null)}, setItem:function(){return Promise.resolve()}};
function haptic(k){ if(window.myllmHaptic){ try{ myllmHaptic(k||'light'); }catch(_){} } }
function el(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

var HOSTS = ["de1.api.radio-browser.info", "de2.api.radio-browser.info", "all.api.radio-browser.info"];
var hostIdx = 0;

/* Verified HTTPS fallback presets — shown if the directory is unreachable */
var PRESETS = [
  {stationuuid:"p1", name:"Radio Paradise", url_resolved:"https://stream.radioparadise.com/mp3-192", tags:"eclectic,rock", countrycode:"US", codec:"MP3", bitrate:192, favicon:""},
  {stationuuid:"p2", name:"Radio Paradise Mellow", url_resolved:"https://stream.radioparadise.com/mellow-192", tags:"chill,mellow", countrycode:"US", codec:"MP3", bitrate:192, favicon:""},
  {stationuuid:"p3", name:"FIP", url_resolved:"https://icecast.radiofrance.fr/fip-midfi.mp3", tags:"eclectic,jazz", countrycode:"FR", codec:"MP3", bitrate:128, favicon:""},
  {stationuuid:"p4", name:"France Musique", url_resolved:"https://icecast.radiofrance.fr/francemusique-midfi.mp3", tags:"classical", countrycode:"FR", codec:"MP3", bitrate:128, favicon:""},
  {stationuuid:"p5", name:"Classic FM", url_resolved:"https://media-ssl.musicradio.com/ClassicFM", tags:"classical", countrycode:"GB", codec:"AAC", bitrate:128, favicon:""},
  {stationuuid:"p6", name:"KEXP", url_resolved:"https://kexp-mp3-128.streamguys1.com/kexp128.mp3", tags:"indie,alternative", countrycode:"US", codec:"MP3", bitrate:128, favicon:""}
];

var GENRES = ["Popular","Jazz","Lo-Fi","Classical","News","Rock","Electronic","Chill","80s"];
var TAG = {"Jazz":"jazz","Lo-Fi":"lofi","Classical":"classical","News":"news","Rock":"rock","Electronic":"electronic","Chill":"chillout","80s":"80s"};

var audio = new Audio();
audio.preload = "none";
var current = null;        /* station object now loaded */
var favs = [];             /* array of station objects */
var results = [];          /* current list */
var sleepMins = 0, sleepTimer = null;
var activeChip = "Popular";

/* ---------- directory ---------- */

function api(path){
  if (!NET) return Promise.reject(new Error("no net bridge"));
  var url = "https://" + HOSTS[hostIdx] + path;
  return NET(url).then(function(r){
    var j = JSON.parse(r.body);
    if (!(j instanceof Array)) throw new Error("bad response");
    return j;
  }).catch(function(e){
    if (hostIdx < HOSTS.length - 1){ hostIdx++; return api(path); }
    throw e;
  });
}

function cleanStations(arr){
  var seen = {}, out = [];
  for (var i = 0; i < arr.length; i++){
    var s = arr[i];
    if (!s.url_resolved || s.url_resolved.indexOf("https://") !== 0) continue;
    if (seen[s.stationuuid]) continue;
    seen[s.stationuuid] = 1;
    out.push(s);
  }
  return out;
}

function fetchList(params, title){
  el("listTitle").textContent = title;
  el("list").innerHTML = '<p class="status">Tuning the dial…</p>';
  api("/json/stations/search?hidebroken=true&is_https=true&order=clickcount&reverse=true&limit=40&" + params)
    .then(function(arr){
      results = cleanStations(arr);
      renderList();
    })
    .catch(function(){
      results = PRESETS.slice();
      el("listTitle").textContent = "Staff picks (directory offline)";
      renderList();
      el("list").insertAdjacentHTML("beforebegin",
        '<p class="note" id="offnote">Couldn\'t reach the station directory' +
        (NET ? ' — showing a built-in selection instead.' : ' — this app needs internet access for apps (MyLLMos settings). The built-in stations below may still play.') + '</p>');
    });
}

function doSearch(){
  var q = el("q").value.trim();
  if (!q) return;
  setChip(null);
  fetchList("name=" + encodeURIComponent(q), 'Results for "' + q + '"');
}

function pickGenre(g){
  el("q").value = "";
  setChip(g);
  if (g === "Popular") fetchList("", "Popular stations");
  else fetchList("tag=" + encodeURIComponent(TAG[g]), g + " stations");
}

/* ---------- rendering ---------- */

function metaLine(s){
  var bits = [];
  if (s.tags){ var t = String(s.tags).split(",").slice(0,2).join(", "); if (t) bits.push(t); }
  if (s.countrycode) bits.push(s.countrycode);
  if (s.bitrate) bits.push(s.bitrate + " kbps");
  return bits.join(" · ");
}

function artHtml(s, cls){
  var fallback = '📻';
  if (s.favicon && String(s.favicon).indexOf("https://") === 0)
    return '<div class="art"><img src="' + esc(s.favicon) + '" loading="lazy" onerror="if(this.parentNode)this.parentNode.textContent=\'' + fallback + '\'"></div>';
  return '<div class="art">' + fallback + '</div>';
}

function isFav(s){ for (var i=0;i<favs.length;i++) if (favs[i].stationuuid === s.stationuuid) return true; return false; }

function rowHtml(s, idx, listName){
  var playing = current && current.stationuuid === s.stationuuid;
  return '<div class="st" data-i="' + idx + '" data-l="' + listName + '">' +
    artHtml(s) +
    '<div class="info" onclick="playFrom(\'' + listName + '\',' + idx + ')">' +
      '<div class="name">' + (playing ? '<span class="eq"><i></i><i></i><i></i></span>' : '') + esc(s.name) + '</div>' +
      '<div class="meta">' + esc(metaLine(s)) + '</div>' +
    '</div>' +
    '<button class="fav' + (isFav(s) ? ' on' : '') + '" onclick="toggleFav(\'' + listName + '\',' + idx + ')">' + (isFav(s) ? '♥' : '♡') + '</button>' +
  '</div>';
}

function renderList(){
  if (!results.length){ el("list").innerHTML = '<p class="status">No stations found — try another search.</p>'; return; }
  var h = "";
  for (var i = 0; i < results.length; i++) h += rowHtml(results[i], i, "r");
  el("list").innerHTML = h;
}

function renderFavs(){
  if (!favs.length){ el("favsWrap").style.display = "none"; return; }
  el("favsWrap").style.display = "block";
  var h = "";
  for (var i = 0; i < favs.length; i++) h += rowHtml(favs[i], i, "f");
  el("favs").innerHTML = h;
}

function renderChips(){
  var h = "";
  for (var i = 0; i < GENRES.length; i++)
    h += '<button' + (GENRES[i] === activeChip ? ' class="hot"' : '') + ' onclick="pickGenre(\'' + GENRES[i] + '\')">' + GENRES[i] + '</button>';
  el("chips").innerHTML = h;
}

function setChip(g){ activeChip = g; renderChips(); }

/* ---------- playback ---------- */

function playFrom(listName, idx){
  var s = (listName === "f" ? favs : results)[idx];
  if (!s) return;
  play(s);
}

function play(s){
  haptic("light");
  var same = current && current.stationuuid === s.stationuuid;
  current = s;
  audio.src = s.url_resolved;
  audio.play();
  el("np").className = "card np on";
  el("npName").textContent = s.name;
  el("npMeta").textContent = metaLine(s);
  el("npArt").innerHTML = artHtml(s).replace(/^<div class="art">|<\/div>$/g, "");
  el("npBtn").textContent = "◼";
  setState("Connecting…", "");
  resetTrack(same);
  if (fullOn) paintFull();
  if (dockOn) paintDock();
  syncPlaying();
  updateNpFav();
  renderList(); renderFavs();
  store.setItem("radio_last", JSON.stringify(s));
  /* polite listen ping so the directory's popularity counts stay honest */
  if (NET && String(s.stationuuid).length > 8)
    NET("https://" + HOSTS[hostIdx] + "/json/url/" + s.stationuuid).catch(function(){});
}

function stop(){
  audio.pause();
  audio.removeAttribute("src");
  try { audio.load(); } catch(_){}
  el("npBtn").textContent = "▶";
  el("np").classList.add("paused");
  setState("Stopped", "");
  stopTitles();
  syncPlaying();
  if (dockOn) closeDock();     /* a silent dock is just a dark screen burning battery */
}

function toggle(){
  haptic("light");
  if (!current) return;
  if (audio.paused) play(current); else stop();
}

function setState(txt, cls){
  el("npState").textContent = txt;
  el("npState").className = "state" + (cls ? " " + cls : "");
  el("fStateTxt").textContent = cls === "live" ? "Live" : txt;
  el("fState").className = "fstate" + (cls ? " " + cls : "");
  el("full").classList.toggle("live", cls === "live");
  el("dState").textContent = cls === "live" ? "" : "· " + txt;
  el("dState").className = "dstate" + (cls === "err" ? " err" : "");
  el("dEq").style.display = cls === "live" ? "" : "none";
}

audio.addEventListener("waiting", function(){ setState("Buffering…", ""); el("np").classList.add("paused"); });
audio.addEventListener("playing", function(){ setState("● Live", "live"); el("np").classList.remove("paused"); startTitles(); });
audio.addEventListener("error", function(){
  if (!current) return;
  setState("Station didn't respond — try another", "err");
  el("npBtn").textContent = "▶";
  el("np").classList.add("paused");
  syncPlaying();
});

/* ---------- favourites ---------- */

function slim(s){
  return {stationuuid:s.stationuuid, name:s.name, url_resolved:s.url_resolved,
          tags:s.tags, countrycode:s.countrycode, codec:s.codec, bitrate:s.bitrate, favicon:s.favicon};
}

function toggleFav(listName, idx){
  var s = (listName === "f" ? favs : results)[idx];
  if (!s) return;
  haptic("medium");
  setFav(s, !isFav(s));
}

function favCurrent(){ if (current){ haptic("medium"); setFav(current, !isFav(current)); } }

function setFav(s, on){
  if (on) favs.unshift(slim(s));
  else favs = favs.filter(function(f){ return f.stationuuid !== s.stationuuid; });
  store.setItem("radio_favs", JSON.stringify(favs));
  renderFavs(); renderList(); updateNpFav();
}

function updateNpFav(){
  if (!current) return;
  var on = isFav(current);
  el("npFav").textContent = on ? "♥ Favourited" : "♡ Favourite";
  el("npFav").className = on ? "hot" : "";
  el("fFav").classList.toggle("hot", on);
}

/* ---------- sleep timer ---------- */

var SLEEPS = [0, 15, 30, 60];
function cycleSleep(){
  haptic("light");
  sleepMins = SLEEPS[(SLEEPS.indexOf(sleepMins) + 1) % SLEEPS.length];
  if (sleepTimer){ clearTimeout(sleepTimer); sleepTimer = null; }
  if (sleepMins){
    sleepTimer = setTimeout(function(){ stop(); sleepMins = 0; el("npSleep").textContent = "Sleep: off"; el("npSleep").className = ""; syncSleep(); }, sleepMins * 60000);
  }
  el("npSleep").textContent = sleepMins ? "Sleep: " + sleepMins + "m" : "Sleep: off";
  el("npSleep").className = sleepMins ? "hot" : "";
  syncSleep();
}
function syncSleep(){
  el("fSleep").classList.toggle("hot", !!sleepMins);
  el("fSleepN").textContent = sleepMins ? sleepMins + "m" : "";
}

/* ---------- who's playing ---------- */

/* The track comes from the stream itself. Three ways to hear it, best first:
   1. myllmStreamTitle(url): MyLLM reads the stream's in-band ICY metadata
      natively. Covers most music stations; needs a build that has the bridge.
   2. The same read from the page, for the stations whose servers let a web
      page ask for metadata (CORS) — stopped the moment a title arrives.
   3. The Icecast server's own status page, through myllmFetch.
   Each answers with a title, with "" (the station does send titles, this one
   is blank — an ad break, a jingle) or with null (can't tell this way). The
   first that can tell is remembered for that station. A station none of them
   can read (HLS, most talk radio) is left alone after two rounds, so nothing
   is fetched for nothing. MyLLM can also push a title in at any time
   through window.myllmNowPlaying(title). */
var TITLE_EVERY = 20000;
var titles = { timer:null, seq:0, how:{}, misses:{}, abort:null, blanks:0, skip:0, ever:false };
var track = "";            /* cleaned title now showing */
var heard = [];            /* this session's earlier tracks, newest first */

function startTitles(){
  if (titles.timer) return;
  pollTitle();
  titles.timer = setInterval(pollTitle, TITLE_EVERY);
}
function stopTitles(){
  clearInterval(titles.timer); titles.timer = null; titles.seq++;
  if (titles.abort){ try { titles.abort.abort(); } catch(_){} titles.abort = null; }
}
function resetTrack(keepHeard){ stopTitles(); titles.blanks = titles.skip = 0; titles.ever = false; track = ""; if (!keepHeard) heard = []; paintTrack(false); }

function pollTitle(){
  if (!current || audio.paused || document.hidden) return;
  var s = current, id = s.stationuuid, my = ++titles.seq;
  if (/\.m3u8(\?|$)/i.test(s.url_resolved) || titles.how[id] === "none") return;
  if (titles.skip > 0){ titles.skip--; return; }         /* backing off a station that keeps answering blank */
  var order = titles.how[id] ? [titles.how[id]] : (window.myllmStreamTitle ? ["native","status"] : ["sniff","status"]);
  var i = 0;
  (function next(){
    if (i >= order.length){
      titles.misses[id] = (titles.misses[id] || 0) + 1;
      if (!titles.how[id] && titles.misses[id] >= 2) titles.how[id] = "none";
      return;
    }
    var how = order[i++];
    ASK[how](s).then(function(raw){
      if (my !== titles.seq || current !== s) return;
      if (raw == null){ if (titles.how[id]) return; return next(); }
      titles.how[id] = how;
      var t = cleanTitle(raw, s.name);
      /* Blank again and again: ask less often. A station that has named tracks
         this session is in a break — settle at once a minute. One that never
         has is talk radio, or plays every new connection an ad pre-roll with
         no title (KEXP does); a short look can't get past that, so drift out
         to every five minutes rather than keep knocking. */
      if (t) titles.ever = true;
      titles.blanks = t ? 0 : titles.blanks + 1;
      titles.skip = Math.min(Math.max(titles.blanks - 1, 0), titles.ever ? 2 : 14);
      setTrack(t);
    });
  })();
}

var ASK = {
  native: function(s){
    return myllmStreamTitle(s.url_resolved).then(function(r){
      if (!r || (!r.title && r.metadata === false)) return null;
      return r.title || "";
    }).catch(function(){ return null; });
  },
  sniff: function(s){
    if (!window.fetch || !window.AbortController || !window.ReadableStream) return Promise.resolve(null);
    var ac = new AbortController(); titles.abort = ac;
    var giveUp = setTimeout(function(){ ac.abort(); }, 9000);
    return fetch(s.url_resolved, {headers:{"Icy-MetaData":"1"}, signal:ac.signal, cache:"no-store"}).then(function(r){
      if (!r.ok || !r.body) return null;
      var reader = r.body.getReader(), tail = "", got = 0;
      return (function pump(){
        return reader.read().then(function(x){
          if (x.done) return null;
          got += x.value.length;
          var chunk = tail + bytesToLatin1(x.value);
          var a = chunk.indexOf("StreamTitle='");
          if (a >= 0){
            var z = chunk.indexOf("';", a + 13);
            if (z >= 0) return utf8(chunk.slice(a + 13, z));
            tail = chunk.slice(a);
          } else tail = chunk.slice(-16);
          return got > 160000 ? null : pump();   /* metadata comes every 8-16 KB when it comes at all */
        });
      })();
    }).catch(function(){ return null; }).then(function(v){
      clearTimeout(giveUp); try { ac.abort(); } catch(_){}
      return v;
    });
  },
  status: function(s){
    if (!NET) return Promise.resolve(null);
    var u; try { u = new URL(s.url_resolved); } catch(_){ return Promise.resolve(null); }
    /* The browser-like User-Agent matters: old Shoutcast servers answer any
       path with the audio itself unless the caller looks like a browser. */
    return NET(u.origin + "/status-json.xsl", {headers:{"User-Agent":"Mozilla/5.0", "Accept":"application/json"}}).then(function(r){
      if (!r.ok || !r.body || r.body.charAt(0) !== "{") return null;
      var src = (JSON.parse(r.body).icestats || {}).source;
      if (!src) return null;
      if (!(src instanceof Array)) src = [src];
      /* One server often carries many channels: only trust a source whose
         mount is this stream's path, never a bare "/" — the wrong channel's
         track is worse than none. */
      var hit = src.length === 1 ? src[0] : null;
      for (var i = 0; u.pathname.length > 1 && i < src.length; i++){
        var l = String(src[i].listenurl || "");
        if (l.slice(-u.pathname.length) === u.pathname) hit = src[i];
      }
      if (!hit || hit.title == null) return null;
      var t = String(hit.title || ""), a = String(hit.artist || "");
      return a && t && t.indexOf(a) < 0 ? a + " - " + t : t;
    }).catch(function(){ return null; });
  }
};

function bytesToLatin1(b){
  var out = "";
  for (var i = 0; i < b.length; i += 8192) out += String.fromCharCode.apply(null, b.subarray(i, i + 8192));
  return out;
}
function utf8(latin1){ try { return decodeURIComponent(escape(latin1)); } catch(_){ return latin1; } }

/* Stations put all sorts in the title field: nothing, their own name, a URL,
   an ad marker. Only something that reads like a track gets shown. */
function cleanTitle(raw, stationName){
  var t = String(raw || "").replace(/\s+/g, " ").trim();
  var m = /^(.*?) - text="([^"]*)"/.exec(t);              /* iHeart / StreamTheWorld wrap the song in attributes */
  if (m){
    var spot = /song_spot="(\w)"/.exec(t);                /* "M" is music; "T" and the rest are ads and idents */
    if ((spot && spot[1] !== "M") || m[1] === m[2]) return "";
    t = (m[1] ? m[1] + " - " : "") + m[2];
  }
  t = t.replace(/^[\s\-–|_]+|[\s\-–|_]+$/g, "");
  if (t.length < 2 || /^https?:/i.test(t) || /^(unknown|untitled|n\/a|advert|adbreak|ad break|commercial)/i.test(t)) return "";
  var norm = function(x){ return String(x).toLowerCase().replace(/[^a-z0-9]+/g, ""); };
  if (norm(t) === norm(stationName)) return "";
  return t.length > 140 ? t.slice(0, 140) + "…" : t;
}
function splitTrack(t){
  var i = t.indexOf(" - ");
  return i > 0 ? {artist:t.slice(0, i), title:t.slice(i + 3)} : {artist:"", title:t};
}

function setTrack(t){
  if (t === track) return;
  if (track) { heard.unshift({t:track, at:new Date()}); heard = heard.slice(0, 5); }
  track = t;
  paintTrack(true);
}

function paintTrack(animate){
  var p = splitTrack(track);
  var line = track ? "♪ " + (p.artist ? p.artist + " — " + p.title : p.title) : "";
  el("npTrack").textContent = line;
  el("npTrack").classList.toggle("on", !!track);
  if (current){
    el("fTitle").textContent = track ? p.title : current.name;
    el("fArtist").textContent = track ? p.artist : "";
    el("fMeta").textContent = track ? current.name + (stationDetail(current) ? " · " + stationDetail(current) : "") : stationDetail(current);
    el("dTrack").textContent = track ? (p.artist ? p.artist + " — " + p.title : p.title) : current.name;
    el("dName").textContent = track ? current.name : (stationDetail(current) || "Live radio");
    if (animate){
      ["fTitle","fArtist"].forEach(function(id){ var n = el(id); n.classList.remove("swap"); void n.offsetWidth; n.classList.add("swap"); });
    }
  }
  var h = "";
  for (var i = 0; i < heard.length; i++){
    var d = heard[i].at, hh = d.getHours(), mm = d.getMinutes();
    h += '<div class="row"><span class="when">' + (hh < 10 ? "0" : "") + hh + ":" + (mm < 10 ? "0" : "") + mm + '</span><span class="what">' + esc(heard[i].t) + '</span></div>';
  }
  el("fEarlier").innerHTML = h ? "<h3>Earlier</h3>" + h : "";
  el("fEarlier").classList.toggle("on", !!h);
  if ("mediaSession" in navigator && window.MediaMetadata && current){
    try { navigator.mediaSession.metadata = new MediaMetadata({title: track ? p.title : current.name, artist: track ? (p.artist || current.name) : "Internet Radio", album: current.name}); } catch(_){}
  }
}

function shareTrack(){
  if (!track || !current || !window.myllmShare) return;
  haptic("light");
  try { myllmShare(track + " (heard on " + current.name + ")").catch(function(){}); } catch(_){}
}

/* MyLLM may push a title in directly. */
window.myllmNowPlaying = function(title){ if (current) setTrack(cleanTitle(title, current.name)); };

/* ---------- playing mode ---------- */

function stationDetail(s){
  var bits = [];
  if (s.tags){ var t = String(s.tags).split(",").slice(0,3).join(", "); if (t) bits.push(t); }
  if (s.countrycode) bits.push(s.countrycode);
  var q = [];
  if (s.codec) q.push(String(s.codec).toUpperCase());
  if (s.bitrate) q.push(s.bitrate + " kbps");
  if (q.length) bits.push(q.join(" "));
  return bits.join(" · ");
}

function hueOf(s){
  var n = String(s.name || ""), h = 7;
  for (var i = 0; i < n.length; i++) h = (h * 31 + n.charCodeAt(i)) % 360;
  return h;
}
function initials(s){
  var w = String(s.name || "").replace(/[^\p{L}\p{N} ]+/gu, " ").trim().split(/\s+/).filter(Boolean);
  if (!w.length) return "♪";
  return (w.length === 1 ? w[0].slice(0, 2) : w[0].charAt(0) + w[1].charAt(0)).toUpperCase();
}
function logoOf(s){ return s.favicon && String(s.favicon).indexOf("https://") === 0 ? String(s.favicon) : ""; }

/* Fill a .tile: initials on the station's hue, logo faded in over it once it
   has loaded — full-bleed when it is big enough, small and centred when not. */
function paintTile(node, s, onLogo){
  node.style.setProperty("--h", hueOf(s));
  node.innerHTML = '<span class="ini">' + esc(initials(s)) + '</span>';
  var src = logoOf(s);
  if (!src) return;
  var img = new Image();
  img.onload = function(){
    if (current !== s) return;
    var big = Math.min(img.naturalWidth, img.naturalHeight) >= 120;
    img.className = big ? "ok" : "ok sm";
    if (big) node.querySelector(".ini").style.display = "none";
    if (onLogo) onLogo(src, big);
  };
  img.alt = "";
  img.src = src;
  node.appendChild(img);
}

var fullOn = false;

function paintFull(){
  var bg = el("fBg");
  bg.className = "fbg"; bg.style.backgroundImage = "";
  el("full").style.setProperty("--h", hueOf(current));
  paintTile(el("fArt"), current, function(src, big){
    if (!big) return;                                  /* a blurred favicon is just grey */
    bg.style.backgroundImage = 'url("' + src.replace(/"/g, "%22") + '")'; bg.className = "fbg art";
  });
  paintTrack(false);
  updateNpFav(); syncSleep(); syncPlaying();
}

function openFull(){
  if (!current) return;
  haptic("light");
  fullOn = true;
  el("full").classList.toggle("lite", !window.myllmImmersive &&
    !(window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches));
  paintFull();
  el("full").classList.add("on");
  document.body.classList.add("lock");
  syncChrome();
}
function closeFull(){
  haptic("light");
  fullOn = false;
  el("full").classList.remove("on");
  document.body.classList.remove("lock");
  syncChrome();
}

var ICON = { play:'<svg><use href="#i-play"/></svg>', stop:'<svg><use href="#i-stop"/></svg>' };
function syncPlaying(){
  var playing = current && !audio.paused;
  el("fBtn").innerHTML = playing ? ICON.stop : ICON.play;
  el("dBtn").innerHTML = playing ? ICON.stop + "Stop" : ICON.play + "Play";
}

/* Playing mode and the dock want the whole display. myllmImmersive (MyLLM 5.7+)
   hides MyLLM's own title bar and the status bar; the dock also asks for the
   screen to stay awake. On a build without it both views still work — they
   just sit under the title bar. */
function syncChrome(){
  if (!window.myllmImmersive) return;
  try { myllmImmersive(fullOn || dockOn, {keepAwake: dockOn}).catch(function(){}); } catch(_){}
}

/* Dock: true black, a large clock, the track and station dimmed beneath it,
   everything drifting a little every minute so nothing burns in. The screen is
   kept awake by MyLLM where it can (see syncChrome), else by the Wake Lock API
   where the web view offers it; failing both, the phone's own auto-lock
   applies and the audio carries on regardless. */
var dockOn = false, dockClock = null, dockDrift = null, dockCtlTimer = null, wakeLock = null;
var DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
var MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

function dockTime(){
  var d = new Date(), h = d.getHours(), m = d.getMinutes();
  el("dClock").textContent = (h < 10 ? "0" : "") + h + ":" + (m < 10 ? "0" : "") + m;
  el("dDate").textContent = DAYS[d.getDay()] + " " + d.getDate() + " " + MONTHS[d.getMonth()];
}
function driftOnce(){
  var x = Math.round((Math.random() - 0.5) * 44), y = Math.round((Math.random() - 0.5) * 44);
  el("dDrift").style.transform = "translate(" + x + "px," + y + "px)";
}
function requestWake(){
  if (!("wakeLock" in navigator)) return;
  navigator.wakeLock.request("screen").then(function(l){ wakeLock = l; }).catch(function(){ wakeLock = null; });
}
function releaseWake(){
  if (wakeLock){ try { wakeLock.release(); } catch(_){} wakeLock = null; }
}
function paintDock(){ paintTile(el("dArt"), current); paintTrack(false); }
function openDock(){
  if (!current) return;
  haptic("medium");
  dockOn = true;
  paintDock(); dockTime(); driftOnce(); syncPlaying();
  el("dock").classList.add("on");
  document.body.classList.add("lock");
  el("dCtl").classList.remove("on");
  el("dHint").style.opacity = "1";
  setTimeout(function(){ el("dHint").style.opacity = "0"; }, 4000);
  dockClock = setInterval(dockTime, 15000);
  dockDrift = setInterval(driftOnce, 60000);
  requestWake();
  syncChrome();
}
function closeDock(){
  dockOn = false;
  el("dock").classList.remove("on");
  if (!fullOn) document.body.classList.remove("lock");
  clearInterval(dockClock); clearInterval(dockDrift); clearTimeout(dockCtlTimer);
  dockClock = dockDrift = dockCtlTimer = null;
  releaseWake();
  syncChrome();
}
function dockTap(){
  if (!dockOn) return;
  el("dHint").style.opacity = "0";
  el("dCtl").classList.add("on");
  clearTimeout(dockCtlTimer);
  dockCtlTimer = setTimeout(function(){ el("dCtl").classList.remove("on"); }, 5000);
}
document.addEventListener("visibilitychange", function(){
  if (document.hidden){ releaseWake(); return; }
  if (dockOn){ dockTime(); requestWake(); }
  if (fullOn || dockOn) syncChrome();          /* MyLLM puts its bars back when the app is left */
  if (titles.timer) pollTitle();
});

/* ---------- boot ---------- */

el("q").addEventListener("keydown", function(e){ if (e.key === "Enter"){ doSearch(); this.blur(); } });

renderChips();
store.getItem("radio_favs").then(function(v){
  if (v){ try { favs = JSON.parse(v) || []; } catch(_){} }
  renderFavs();
});
store.getItem("radio_last").then(function(v){
  if (v){ try {
    var s = JSON.parse(v);
    current = s;
    el("np").className = "card np on paused";
    el("npName").textContent = s.name;
    el("npMeta").textContent = metaLine(s);
    el("npArt").innerHTML = artHtml(s).replace(/^<div class="art">|<\/div>$/g, "");
    el("npBtn").textContent = "▶";
    setState("Tap to resume", "");
    updateNpFav();
  } catch(_){} }
});
fetchList("", "Popular stations");
</script>
