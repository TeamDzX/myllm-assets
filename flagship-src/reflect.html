<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reflect</title>
<style>
:root{
  color-scheme:light dark;
  --paper:#f6f4ee;--card:#ffffff;--ink:#26291f;--mut:#7d8074;--line:#e6e3d8;
  --ac:#2e7d6a;--ac-soft:#e2efe9;--danger:#a84f3f;
  --m0:#b5544a;--m1:#c08a45;--m2:#a8a04b;--m3:#7aa35c;--m4:#3d8f72;
}
@media(prefers-color-scheme:dark){:root{
  --paper:#131511;--card:#1d201a;--ink:#e8e6dd;--mut:#8f927f;--line:#2c2f26;
  --ac:#5cb397;--ac-soft:#1e332c;--danger:#d07a63;
}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:-apple-system,system-ui,sans-serif;background:var(--paper);color:var(--ink);
  padding-bottom:calc(84px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
.serif{font-family:ui-serif,"New York",Georgia,serif}
/* header */
.hero{position:relative;height:148px;overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),var(--paper) 96%)}
.hero .tt{position:absolute;left:20px;bottom:10px;z-index:2}
.hero h1{font-size:30px;font-weight:700;letter-spacing:-.02em;color:var(--ink);text-shadow:0 1px 6px var(--paper)}
.hero .sub{font-size:13px;color:var(--mut)}
.wrap{padding:0 18px;max-width:660px;margin:0 auto}
h2{font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);margin:26px 2px 10px;font-weight:600}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin-bottom:12px}
.qcard{border-left:3px solid var(--ac)}
.qcard .q{font-size:17px;line-height:1.45;font-style:italic}
.qrow{display:flex;gap:8px;margin-top:12px}
textarea{width:100%;min-height:130px;border:0;background:none;color:var(--ink);font:16px/1.55 ui-serif,"New York",Georgia,serif;resize:none;outline:none}
textarea::placeholder{color:var(--mut);opacity:.7}
/* mood */
.moods{display:flex;justify-content:space-between;gap:6px;margin:4px 0 2px}
.mood{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 0 7px;border:1.5px solid var(--line);border-radius:14px;background:none;color:var(--mut);font-size:10.5px;font-weight:600;letter-spacing:.02em}
.mood svg{width:26px;height:26px}
.mood.on{border-color:currentColor}
.mood.on.m0{color:var(--m0)}.mood.on.m1{color:var(--m1)}.mood.on.m2{color:var(--m2)}.mood.on.m3{color:var(--m3)}.mood.on.m4{color:var(--m4)}
/* buttons */
.btn{border:0;border-radius:13px;padding:13px 18px;font-size:15px;font-weight:650;background:var(--ac);color:#fff;width:100%}
.btn:disabled{opacity:.4}
.btn.ghost{background:var(--ac-soft);color:var(--ac);width:auto;padding:9px 14px;font-size:13.5px}
.btn.tiny{width:auto;padding:8px 13px;font-size:13px;background:none;border:1.5px solid var(--line);color:var(--mut)}
.rowflex{display:flex;gap:8px;align-items:center}
/* meta chips */
.chips{display:flex;gap:8px;margin:14px 0 6px;flex-wrap:wrap}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13px;color:var(--mut)}
.chip b{color:var(--ink)}
/* journal list */
input[type=search]{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:13px;background:var(--card);color:var(--ink);font-size:15px;outline:none;margin-bottom:12px}
.erow{display:flex;gap:12px;align-items:flex-start;padding:13px 2px;border-bottom:1px solid var(--line)}
.erow:last-child{border-bottom:0}
.edot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:0 0 auto;background:var(--line)}
.edot.m0{background:var(--m0)}.edot.m1{background:var(--m1)}.edot.m2{background:var(--m2)}.edot.m3{background:var(--m3)}.edot.m4{background:var(--m4)}
.erow .ed{font-size:12.5px;color:var(--mut);margin-bottom:2px}
.erow .ex{font-size:15px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* insights */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 6px;text-align:center}
.stat b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--mut);letter-spacing:.03em;text-transform:uppercase;font-weight:600}
canvas#moodcv{width:100%;height:130px;display:block}
.refl{white-space:pre-wrap;font-size:15.5px;line-height:1.6}
.refl-date{font-size:12px;color:var(--mut);margin-bottom:6px}
.hintline{font-size:13px;color:var(--mut);margin-top:8px;line-height:1.45}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,12,8,.45);display:none;align-items:flex-end;z-index:50}
.scrim.on{display:flex}
.sheet{background:var(--paper);border-radius:22px 22px 0 0;width:100%;max-height:82dvh;overflow-y:auto;padding:20px 20px calc(22px + env(safe-area-inset-bottom))}
.sheet .sd{font-size:13px;color:var(--mut);margin-bottom:10px}
.sheet .st{font-size:17px;line-height:1.6;white-space:pre-wrap;font-family:ui-serif,Georgia,serif}
.sheet textarea{min-height:180px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.sheetrow{display:flex;gap:9px;margin-top:16px}
.sheetrow .btn{flex:1}
.btn.warn{background:none;border:1.5px solid var(--danger);color:var(--danger)}
/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:40}
.tabbar button{flex:1;border:0;background:none;color:var(--mut);padding:10px 0 9px;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabbar button svg{width:22px;height:22px}
.tabbar button.on{color:var(--ac)}
.section{display:none}.section.on{display:block}
.fadein{animation:fi .45s ease}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
@media(prefers-reduced-motion:reduce){.fadein{animation:none}}
.empty{color:var(--mut);text-align:center;padding:34px 10px;font-size:14.5px;line-height:1.5}
</style></head><body>
<style>
@keyframes myllmAiSpin{to{transform:rotate(360deg)}}
.myllm-ai-busy{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(18px);z-index:99999;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;display:flex;align-items:center;gap:10px;background:rgba(28,28,30,.96);color:#fff;border-radius:999px;padding:10px 16px 10px 14px;box-shadow:0 6px 22px rgba(0,0,0,.4);font-family:-apple-system,system-ui,sans-serif;font-size:14px;font-weight:600;max-width:92%}
.myllm-ai-busy.on{opacity:1;transform:translateX(-50%) translateY(0)}
.myllm-ai-cog{font-size:18px;line-height:1;animation:myllmAiSpin 2.4s linear infinite;filter:drop-shadow(0 0 5px rgba(124,92,255,.85))}
.myllm-ai-busy small{font-weight:400;opacity:.6}
</style>
<script>
(function(){if(window.__myllmAiWrap||typeof window.myllmAsk!=='function')return;window.__myllmAiWrap=true;
var orig=window.myllmAsk,depth=0,node=null;
function ensure(){if(node)return;node=document.createElement('div');node.className='myllm-ai-busy';
node.innerHTML='<span class="myllm-ai-cog">⚙️</span><span>AI is thinking… <small>privately, on your device</small></span>';
(document.body||document.documentElement).appendChild(node);}
function show(){ensure();depth++;node.classList.add('on');}
function hide(){depth=Math.max(0,depth-1);if(depth===0&&node)node.classList.remove('on');}
window.myllmAsk=function(){show();var p;try{p=orig.apply(this,arguments);}catch(e){hide();throw e;}
return Promise.resolve(p).then(function(r){hide();return r;},function(e){hide();throw e;});};})();
</script>

<div class="hero"><img src="%%HEADER_ART%%" alt=""><div class="tt"><h1 class="serif">Reflect</h1><div class="sub">Your private journal — nothing ever leaves this device</div></div></div>

<div class="wrap">

  <!-- TODAY -->
  <div class="section on" id="s-today">
    <div class="chips"><span class="chip" id="chipDate"></span><span class="chip" id="chipStreak"></span></div>

    <div class="card qcard">
      <div class="q serif" id="promptText"></div>
      <div class="qrow">
        <button class="btn tiny" onclick="nextPrompt()">Another</button>
        <button class="btn tiny" id="aiPromptBtn" onclick="aiPrompt()">One just for me</button>
      </div>
    </div>

    <div class="card">
      <textarea id="entryText" placeholder="Write freely — a line is enough…" oninput="autosize(this);draftSave()"></textarea>
    </div>

    <h2>How was today?</h2>
    <div class="moods" id="moods"></div>
    <div style="height:14px"></div>
    <button class="btn" id="saveBtn" onclick="saveEntry()">Keep this entry</button>
    <p class="hintline" id="todayHint"></p>
  </div>

  <!-- JOURNAL -->
  <div class="section" id="s-journal">
    <div style="height:16px"></div>
    <input type="search" id="q" placeholder="Search your journal…" oninput="renderJournal()">
    <div id="journalList"></div>
  </div>

  <!-- INSIGHTS -->
  <div class="section" id="s-insights">
    <h2>Your practice</h2>
    <div class="stats">
      <div class="stat"><b id="stStreak">0</b><span>day streak</span></div>
      <div class="stat"><b id="stCount">0</b><span>entries</span></div>
      <div class="stat"><b id="stWords">0</b><span>words</span></div>
    </div>

    <h2>Mood — last 30 days</h2>
    <div class="card"><canvas id="moodcv"></canvas></div>

    <h2>Weekly reflection</h2>
    <div class="card">
      <p style="font-size:14.5px;color:var(--mut);line-height:1.5">Your AI reads the last seven days and reflects back what it notices — privately, on your device.</p>
      <div style="height:12px"></div>
      <button class="btn" id="reflBtn" onclick="weeklyReflection()">Reflect on my week</button>
      <p class="hintline" id="reflHint"></p>
    </div>
    <div id="reflList"></div>

    <h2 id="otdHead" style="display:none">On this day</h2>
    <div id="otdList"></div>
  </div>
</div>

<div class="scrim" id="scrim" onclick="if(event.target===this)closeSheet()">
  <div class="sheet" id="sheet"></div>
</div>

<div class="tabbar">
  <button class="on" data-s="today" onclick="tab('today')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1-4L15.5 5.5a2.1 2.1 0 0 1 3 3L8 19l-4 1z"/><path d="M13.5 7.5l3 3"/></svg>Today</button>
  <button data-s="journal" onclick="tab('journal')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15.5H6.5A2.5 2.5 0 0 0 4 21z"/><path d="M4 21a2.5 2.5 0 0 1 2.5-2.5H20"/></svg>Journal</button>
  <button data-s="insights" onclick="tab('insights')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V10M10 19V4M16 19v-8M21 19H3"/></svg>Insights</button>
</div>

<script>
"use strict";
/* ---------- storage (myllmStorage w/ localStorage fallback) ---------- */
var store = window.myllmStorage || {
  getItem: function(k){ try{ return Promise.resolve(localStorage.getItem(k)); }catch(e){ return Promise.resolve(null); } },
  setItem: function(k,v){ try{ localStorage.setItem(k,v); }catch(e){} return Promise.resolve(); }
};
var DATA = { v:1, entries:[], refl:[] };
function persist(){ store.setItem('reflect.data', JSON.stringify(DATA)); }
function el(i){ return document.getElementById(i); }
function haptic(k){ if(window.myllmHaptic) try{ myllmHaptic(k||'light'); }catch(e){} }
function today(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtDate(iso){ var d=new Date(iso+'T12:00:00');
  return d.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short',year: d.getFullYear()!==new Date().getFullYear()?'numeric':undefined}); }

/* ---------- prompts ---------- */
var PROMPTS = [
 "What made today feel different from yesterday?",
 "What's one small thing you're grateful for right now?",
 "What took more energy today than it should have?",
 "If today had a colour, what would it be — and why?",
 "What did you do today that your younger self would find impressive?",
 "What conversation stayed with you today?",
 "What are you quietly looking forward to?",
 "What would you do tomorrow if you knew it would go well?",
 "What's something you've been avoiding? What's the smallest first step?",
 "Who made your day better today — did they know?",
 "What's a moment from today you'd like to remember in a year?",
 "What worried you today that probably won't matter in a month?",
 "Where did you feel most like yourself today?",
 "What did you learn today — about anything, or anyone?",
 "What would you tell a friend who'd had your day?",
 "What's one thing you did today purely for yourself?",
 "What sound, smell or taste stood out today?",
 "If you could replay one hour of today, which one?",
 "What's something kind you could do tomorrow that takes two minutes?",
 "What's slowly getting better, even if it doesn't feel like it?",
 "What do you want less of in your days? More of?",
 "What made you smile when you weren't expecting to?",
 "What's a question you're carrying at the moment?",
 "How does your body feel right now — really?"
];
var pIdx = (new Date().getFullYear()*372 + new Date().getMonth()*31 + new Date().getDate()) % PROMPTS.length;
function showPrompt(t){ el('promptText').textContent = t; }
function nextPrompt(){ pIdx=(pIdx+1)%PROMPTS.length; showPrompt(PROMPTS[pIdx]); haptic('selection'); }

/* ---------- mood picker ---------- */
var MOODS = [["Rough","M8 15.5c1-.9 2.4-1.5 4-1.5s3 .6 4 1.5"],["Low","M8.5 15h7"],["Okay","M8.5 15c.9.4 2.1.6 3.5.6s2.6-.2 3.5-.6"],["Good","M8 14c1 .9 2.4 1.5 4 1.5s3-.6 4-1.5"],["Great","M7.5 13.5c1.1 1.4 2.7 2.2 4.5 2.2s3.4-.8 4.5-2.2"]];
var mood = null;
function moodSVG(path){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="9" cy="9.6" r=".6" fill="currentColor" stroke="none"/><circle cx="15" cy="9.6" r=".6" fill="currentColor" stroke="none"/><path d="'+path+'"/></svg>'; }
function buildMoods(){
  var box = el('moods'); box.innerHTML='';
  MOODS.forEach(function(m,i){
    var b=document.createElement('button'); b.className='mood m'+i; b.innerHTML=moodSVG(m[1])+'<span>'+m[0]+'</span>';
    b.onclick=function(){ mood = (mood===i? null : i); buildMoods(); haptic('selection'); };
    if(mood===i) b.classList.add('on');
    box.appendChild(b);
  });
}

/* ---------- today ---------- */
var draftTimer=null;
function draftSave(){ clearTimeout(draftTimer); draftTimer=setTimeout(function(){ store.setItem('reflect.draft', el('entryText').value); },400); }
function autosize(t){ t.style.height='auto'; t.style.height=Math.max(130,t.scrollHeight)+'px'; }
function saveEntry(){
  var t = el('entryText').value.trim();
  if(!t && mood===null){ el('todayHint').textContent='Write a line or pick a mood first.'; return; }
  DATA.entries.push({ id: Date.now(), ts: Date.now(), d: today(), m: mood, t: t });
  persist(); store.setItem('reflect.draft','');
  el('entryText').value=''; autosize(el('entryText')); mood=null; buildMoods();
  el('todayHint').textContent='Kept. It stays on this device — always.';
  haptic('success'); refreshMeta(); renderJournal(); renderInsights();
}
function refreshMeta(){
  el('chipDate').innerHTML = '<b>'+new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'})+'</b>';
  var s = streak();
  el('chipStreak').innerHTML = s>0 ? '<b>'+s+'</b>&nbsp;day streak' : 'start your streak today';
}
function streak(){
  var days = {}; DATA.entries.forEach(function(e){ days[e.d]=1; });
  var n=0, d=new Date();
  if(!days[today()]) d.setDate(d.getDate()-1); // yesterday keeps a live streak
  for(;;){ var k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    if(days[k]){ n++; d.setDate(d.getDate()-1); } else break; }
  return n;
}

/* ---------- journal ---------- */
function renderJournal(){
  var q=(el('q').value||'').toLowerCase().trim(), L=el('journalList'); L.innerHTML='';
  var list = DATA.entries.slice().sort(function(a,b){ return b.ts-a.ts; })
    .filter(function(e){ return !q || (e.t||'').toLowerCase().indexOf(q)>=0 || e.d.indexOf(q)>=0; });
  if(!list.length){ L.innerHTML='<div class="empty">'+(q?'Nothing matches that.':'Your journal is empty — today is a good day to start.')+'</div>'; return; }
  var month='';
  list.forEach(function(e){
    var m = new Date(e.d+'T12:00:00').toLocaleDateString(undefined,{month:'long',year:'numeric'});
    if(m!==month){ month=m; var h=document.createElement('h2'); h.textContent=m; L.appendChild(h); }
    var r=document.createElement('div'); r.className='erow';
    r.innerHTML='<span class="edot'+(e.m!=null?' m'+e.m:'')+'"></span><div style="min-width:0"><div class="ed">'+fmtDate(e.d)+'</div><div class="ex serif"></div></div>';
    r.querySelector('.ex').textContent = e.t || '(mood only)';
    r.onclick=function(){ openEntry(e.id); };
    L.appendChild(r);
  });
}
function openEntry(id){
  var e = DATA.entries.find(function(x){ return x.id===id; }); if(!e) return;
  var s=el('sheet');
  s.innerHTML='<div class="sd">'+fmtDate(e.d)+(e.m!=null?' · feeling '+MOODS[e.m][0].toLowerCase():'')+'</div>'+
    '<div class="st" id="sheetBody"></div><div class="sheetrow">'+
    '<button class="btn ghost" onclick="editEntry('+id+')">Edit</button>'+
    '<button class="btn warn" onclick="askDelete('+id+')">Delete</button></div>';
  s.querySelector('#sheetBody').textContent = e.t || '(mood only)';
  el('scrim').classList.add('on');
}
function editEntry(id){
  var e = DATA.entries.find(function(x){ return x.id===id; }); if(!e) return;
  var s=el('sheet');
  s.innerHTML='<div class="sd">Editing · '+fmtDate(e.d)+'</div>'+
    '<textarea id="editText"></textarea><div class="sheetrow">'+
    '<button class="btn" onclick="saveEdit('+id+')">Save</button>'+
    '<button class="btn ghost" onclick="closeSheet()">Cancel</button></div>';
  s.querySelector('#editText').value = e.t||'';
}
function saveEdit(id){
  var e = DATA.entries.find(function(x){ return x.id===id; }); if(!e) return;
  e.t = el('sheet').querySelector('#editText').value.trim();
  persist(); haptic('success'); closeSheet(); renderJournal(); renderInsights();
}
function askDelete(id){
  var s=el('sheet');
  s.innerHTML='<div class="sd">Delete this entry?</div><div class="st">It can’t be brought back.</div>'+
    '<div class="sheetrow"><button class="btn warn" onclick="doDelete('+id+')">Delete</button>'+
    '<button class="btn ghost" onclick="closeSheet()">Keep it</button></div>';
}
function doDelete(id){
  DATA.entries = DATA.entries.filter(function(x){ return x.id!==id; });
  persist(); haptic('success'); closeSheet(); renderJournal(); renderInsights(); refreshMeta();
}
function closeSheet(){ el('scrim').classList.remove('on'); }

/* ---------- insights ---------- */
function renderInsights(){
  el('stStreak').textContent = streak();
  el('stCount').textContent = DATA.entries.length;
  el('stWords').textContent = DATA.entries.reduce(function(n,e){ return n + (e.t? e.t.split(/\s+/).filter(Boolean).length : 0); },0);
  drawMood(); renderRefl(); renderOTD();
}
function drawMood(){
  var cv=el('moodcv'), dpr=window.devicePixelRatio||1;
  var W=cv.clientWidth||300, H=130;
  cv.width=W*dpr; cv.height=H*dpr;
  var ctx=cv.getContext('2d'); ctx.scale(dpr,dpr);
  var css=getComputedStyle(document.documentElement);
  var line=css.getPropertyValue('--line').trim(), ac=css.getPropertyValue('--ac').trim(), mut=css.getPropertyValue('--mut').trim();
  var days=[], byDay={};
  DATA.entries.forEach(function(e){ if(e.m!=null){ (byDay[e.d]=byDay[e.d]||[]).push(e.m); } });
  for(var i=29;i>=0;i--){ var d=new Date(); d.setDate(d.getDate()-i);
    var k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    days.push(byDay[k] ? byDay[k].reduce(function(a,b){return a+b;},0)/byDay[k].length : null); }
  ctx.strokeStyle=line; ctx.lineWidth=1;
  for(var g=0; g<5; g++){ var gy=10+(H-30)*(1-g/4); ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(W,gy); ctx.stroke(); }
  var pts=[], step=W/29;
  days.forEach(function(v,i){ if(v!=null) pts.push([i*step, 10+(H-30)*(1-v/4)]); });
  if(pts.length>1){ ctx.strokeStyle=ac; ctx.lineWidth=2; ctx.lineJoin='round'; ctx.beginPath();
    pts.forEach(function(p,i){ i? ctx.lineTo(p[0],p[1]) : ctx.moveTo(p[0],p[1]); }); ctx.stroke(); }
  ctx.fillStyle=ac; pts.forEach(function(p){ ctx.beginPath(); ctx.arc(p[0],p[1],3,0,7); ctx.fill(); });
  if(!pts.length){ ctx.fillStyle=mut; ctx.font='13px -apple-system'; ctx.textAlign='center';
    ctx.fillText('Log a mood with an entry and your month appears here.', W/2, H/2); }
}
function needAI(hintEl){
  if(window.myllmAsk) return false;
  hintEl.textContent='This needs the latest MyLLM with “Allow apps to use the AI” enabled in Settings.';
  return true;
}
function weeklyReflection(){
  var hint=el('reflHint'); hint.textContent='';
  if(needAI(hint)) return;
  var weekAgo=Date.now()-7*864e5;
  var recent=DATA.entries.filter(function(e){ return e.ts>=weekAgo && (e.t||e.m!=null); });
  if(!recent.length){ hint.textContent='Write at least one entry this week first.'; return; }
  var body=recent.map(function(e){ return e.d+(e.m!=null?' (feeling '+MOODS[e.m][0].toLowerCase()+')':'')+': '+(e.t||'(mood only)'); }).join('\n').slice(0,1600);
  el('reflBtn').disabled=true;
  myllmAsk('You are a warm, perceptive journaling companion. Below are my private journal entries from the past week. Write a short reflection back to me (under 130 words, second person, plain prose, no lists or headers): notice one pattern, name one thing worth celebrating, and offer one gentle suggestion.\n\n'+body)
  .then(function(r){
    r=(r||'').trim(); if(!r) throw new Error('empty reply');
    DATA.refl.unshift({ id:Date.now(), ts:Date.now(), text:r });
    DATA.refl=DATA.refl.slice(0,20); persist(); renderRefl(); haptic('success');
  }).catch(function(e){ hint.textContent='Couldn’t reflect just now: '+e.message; })
  .then(function(){ el('reflBtn').disabled=false; });
}
function renderRefl(){
  var L=el('reflList'); L.innerHTML='';
  DATA.refl.forEach(function(r){
    var c=document.createElement('div'); c.className='card fadein';
    c.innerHTML='<div class="refl-date">'+new Date(r.ts).toLocaleDateString(undefined,{day:'numeric',month:'long'})+'</div><div class="refl serif"></div>';
    c.querySelector('.refl').textContent=r.text;
    L.appendChild(c);
  });
}
function renderOTD(){
  var mmdd=today().slice(5), L=el('otdList'); L.innerHTML='';
  var hits=DATA.entries.filter(function(e){ return e.d!==today() && e.d.slice(5)===mmdd; });
  el('otdHead').style.display = hits.length? 'block':'none';
  hits.slice(0,3).forEach(function(e){
    var c=document.createElement('div'); c.className='card';
    c.innerHTML='<div class="refl-date">'+fmtDate(e.d)+'</div><div class="refl serif"></div>';
    c.querySelector('.refl').textContent=e.t||'(mood only)';
    L.appendChild(c);
  });
}

/* ---------- AI prompt ---------- */
function aiPrompt(){
  var hint=el('todayHint'); hint.textContent='';
  if(needAI(hint)) return;
  var recent=DATA.entries.slice(-6).map(function(e){ return (e.t||'').slice(0,140); }).filter(Boolean).join(' | ').slice(0,900);
  el('aiPromptBtn').disabled=true;
  myllmAsk('Suggest ONE thoughtful, specific journaling prompt for me tonight — a single question, one sentence, no preamble, no quotes.'+(recent? ' For context, snippets from my recent entries: '+recent : ''))
  .then(function(r){ r=(r||'').trim().replace(/^["“]|["”]$/g,''); if(r) showPrompt(r); haptic('success'); })
  .catch(function(e){ hint.textContent='No prompt right now: '+e.message; })
  .then(function(){ el('aiPromptBtn').disabled=false; });
}

/* ---------- tabs & init ---------- */
function tab(s){
  document.querySelectorAll('.section').forEach(function(x){ x.classList.remove('on'); });
  el('s-'+s).classList.add('on');
  document.querySelectorAll('.tabbar button').forEach(function(b){ b.classList.toggle('on', b.dataset.s===s); });
  haptic('selection'); window.scrollTo(0,0);
  if(s==='insights') renderInsights();
}
buildMoods(); showPrompt(PROMPTS[pIdx]); refreshMeta();
store.getItem('reflect.data').then(function(v){
  if(v){ try{ var d=JSON.parse(v); if(d && d.entries) DATA=d; }catch(e){} }
  renderJournal(); renderInsights();
});
store.getItem('reflect.draft').then(function(v){ if(v && !el('entryText').value){ el('entryText').value=v; autosize(el('entryText')); } });
window.addEventListener('resize', function(){ if(el('s-insights').classList.contains('on')) drawMood(); });
</script>
</body></html>
